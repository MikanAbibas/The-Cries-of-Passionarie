 TNO_MILITARY_ADVISORS_RAISE_TT_ACTIVE:0 "§YRaise Military Advisors to Level [?ROOT.TNO_military_advisors_next_level|0]§!\nCosts [TNO_GetMilitaryAdvisorsPrice], [?ROOT.TNO_military_advisors_price_pct|1]% of GDP, paid at once.\n§sTaken from Liquid Reserves; any shortfall is added to National Debt.§!\n§GVolunteer divisions: +[?ROOT.TNO_military_advisors_level|0] -> +[?ROOT.TNO_military_advisors_next_level|0]§!\n§ORaising does not extend the term: every level resets to 0 in [TNO_GetMilitaryAdvisorsDays].§!\n§sVolunteers already sent stay after the reset. New volunteers and replacements count against the cap at that time.§!"
