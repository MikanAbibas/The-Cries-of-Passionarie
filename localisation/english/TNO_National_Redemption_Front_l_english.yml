 #events
 fsr_ibrwar.1.t:0 "A Soldier's Conduct"
 fsr_ibrwar.1.d:0 "Holy Regent Navarro \n\nGlory to God! Our uprising has progressed well so far. However, there has been an... incident that requires your attention. \n\nA low-ranking member of one of our paramilitary formations has been caught committing, let us say, unsavory acts upon some local women. His comrades have regrettably decided to overlook his unbecoming behavior and are protecting him. We could mobilize one of our regular battalions to force them to release him into our custody so that justice may be handed down. However, rumors of infighting will certainly spread, and morale will suffer a blow. \n\nWe humbly await your decision."
 fsr_ibrwar.1.a:0 "All Must Follow The Law"
 fsr_ibrwar.1.b:0 "It's Only A Small Crime..."
 fsr_ibrwar.2.t:0 "The Case Of The Looters"
 fsr_ibrwar.2.d:0 "Holy Regent Navarro \n\nThere have been complaints from numerous non-combatants about one of our infantry formations. This formation, known as Cortez Squad, has been partaking in unauthorized looting of captured villages and towns. \n\nThe Commander of Cortez Squad is quite popular among the ranks of our forces, and punishing him and his subordinate for the sake of some upset civilians will cause disquiet in the ranks. God willing, you will make the best decision possible."
 fsr_ibrwar.2.a:0 "Punish Them"
 fsr_ibrwar.2.b:0 "Let Them Go"
 fsr_ibrwar.3.t:0 "Taking Prisoners"
 fsr_ibrwar.3.d:0 "Holy Regent Navarro \n\nAs the number of hostile engagements continues to increase, the number of prisoners of war we have taken has increased in tandem. It is true that we are honor-bound to accept the surrender of enemies and to care for their wounds, yet I fear that we are stretching our resources thin by caring for our enemies! \n\nI realize I am asking you to commit to a course of action that would be displeasing to God, but how can we succeed in claiming Iberia for Him if we do not prioritize the well-being of our own soldiers? Can some evil be justified if much is to be gained? \n\nAll I ask is that the Front deprioritizes taking prisoners, at least until the situation stabilizes."
 fsr_ibrwar.3.a:0 "Treat Them Well"
 fsr_ibrwar.3.b:0 "Into The Ditch They Go"
 fsr_ibrwar.4.t:0 "Rampant Vagrancy"
 fsr_ibrwar.4.d:0 "Holy Regent Navarro \n\nMay God bless you! By Christ's will, you have carried our righteous cause on your back. I bring troubling news, however. As much of our forces are dedicated to combat, we have unfortunately neglected internal security. As a result, groups of bandits have been raiding villages and towns and taking anything of value to them. Some of these criminals are aligned with our enemies, while others are simply opportunists. \n\nI ask that you divert some of our forces to deal with this threat. \n\nKeeping territory safe is almost as important as maintaining the frontline. I patiently await your decision."
 fsr_ibrwar.4.a:0 "We Cannot Let These Criminals Prey On The Innocent"
 fsr_ibrwar.4.b:0 "Our Forces Are Needed For The War"
 fsr_ibrwar.5.t:0 "Corruption In The Ranks"
 fsr_ibrwar.5.d:0 "Holy Regent Navarro \n\nThanks be to God, I pray you are in good health. I come with disturbing news. Our Internal Service has uncovered evidence of widespread corruption in our military. Countless officers have been discovered skimming off allocated funds and collecting valuables for themselves. This corruption is so widespread that it affects a significant proportion of our officer corps. Uprooting this criminality would be a torturous task and would require replacing a large number of our officers with fresh recruits. \n\nIt may be advantageous to ignore these indiscretions for now, though the decision is ultimately up to you, sir."
 fsr_ibrwar.5.a:0 "Purge Them"
 fsr_ibrwar.5.b:0 "It's Not That Urgent"
 fsr_ibrwar.6.t:0 "Greed For Grain"
 fsr_ibrwar.6.d:0 "Holy Regent Navarro \n\nI am unhappy to report that our food supplies have been running low. At this rate, we will have to cut troop rations or risk starvation. I will take the liberty of noting that this will negatively affect morale. However, an alternative proposal has been put forward. The Front could send out troops to forcibly confiscate foodstuffs from local farmers. Though drastic, it would alleviate our food supply problems for the time being. \n\nConsidering our situation, this may be our only choice."
 fsr_ibrwar.6.a:0 "Let Them Keep Their Bread"
 fsr_ibrwar.6.b:0 "We Need It"
 fsr_ibrwar.7.t:0 "The Father's Petition"
 fsr_ibrwar.7.d:0 "Holy Regent Navarro \n\nA local priest by the name of Father Marco has submitted a formal petition to us. \n\nIn the petition, he describes the brutal actions of our forces that he himself witnessed and spares none of the details. He personally requests you, God's chosen Regent, to rein in your forces and to show compassion to your weaker brothers and sisters. \n\nFulfilling such a request may not be practical in these dire times, but as this comes from a clergyman of the one true Church, it may be wise to listen to Father Marco's words."
 fsr_ibrwar.7.a:0 "We Must Listen To His Wisdom"
 fsr_ibrwar.7.b:0 "What Does He Know?"
 fsr_ibrwar.8.t:0 "The Virtue Of Justice"
 fsr_ibrwar.8.d:0 "Holy Regent Navarro \n\nOur enemies fall one after another. Many now lie at our mercy. The sheer number of them means processing through the courts will take time, time we do not have. There is also another problem. If we show excessive leniency, we risk releasing future terrorists and criminals back into the public. \n\nConsider that it may be more expedient to simply offer these individuals a swift death. It is not as if they are any friends of ours. Mercy and a dogged attachment to the law may be our undoing. Consider that we will prevent future suffering. Consider that this is no different than what our enemies would have done to us. Consider that this may be the correct option. The only option."
 fsr_ibrwar.8.a:0 "For The Servants Of God There Is No Rest"
 fsr_ibrwar.8.b:0 "Let God Sort Them Out"
 fsr_flavor.1.t:0 "False Utopia"
 fsr_flavor.1.d:0 "Navarro grimaced at the sight. He was not a man who was easily disturbed, and he thanked God deeply for that, but there were certain… worldly experiences that lit a fire in his stomach. It was a parish, or what was left of one. Anarchist terrorists had set fire to it before the sun rose that day, burning the building as well as its vicar, who was sleeping inside. He prayed that the priest would have a short stay in purgatory before being welcomed into God's bosom. \n\nBut prayer was not the only reason he had come to this… this atrocity. He turned to his troops gathered there and addressed them, \n\n“See what the Marxists have brought upon us, my brothers! With forked tongues, they promise us equality and liberty, but what have they done to achieve this goal? Burn churches? Murder innocents? Whatever salvation they offer is empty! False! See how much blood was shed in Russia, and for what? An era of barbarism! My brothers, if they succeed, they will lead us to an even worse ruin. Their cause is that of the devil! Absolute equality? Absolute freedom? In this fallen world, such things are impossible! But through Christ our Lord, the impossible becomes possible. And that is why we will succeed and they will fail!” \n\nHis men roared approval and sang praises to God."
 fsr_flavor.1.a:0 "THANKS BE TO GOD"
 fsr_flavor.2.t:0 "Love Of Gold, Love Of Self"
 fsr_flavor.2.d:0 "There was a time when he too was young. He was 22 years of age when the last “King” of Spain (for there is only one true King) was forced to flee from the country. \n\nHis replacements were no improvement. The Second Republic was born weak and died weak. If it had knelt before God as any good nation should, it might have lived to today and even beyond. Yet, it rained fire on God's Church and introduced alien ideas from heathen lands—Protestant nonsense and worse. The good Catholics of Spain suffered much, but God is as merciful as He is just. \n\nThe republic fell into turmoil within five short years. The degeneracy they spread was self-defeating. The good and just rose against them, and their Marxist allies stabbed them in the back. \n\nHe was 28 years of age when he threw in his lot with the Nationalists and 30 when they drove them out of Spain. Even disregarding the eternity of God, their reign was short. Did they think that this time would be any different?"
 fsr_flavor.2.a:0 "What Foolishness"
 fsr_flavor.3.t:0 "A Dream"
 fsr_flavor.3.d:0 "It was a dream he had many times before. \n\nThe creatures had arrived bearing gifts and great promises. They declared that they would build a massive wall and promised that it would bring great prosperity and glory. The Caudillo was taken in, and work began immediately. \n\nNavarro was disturbed by the creatures: the way they looked, the way they spoke, the way they thought of themselves as above God. But most of all, he was disturbed by their stench, and it soon became apparent why. \n\nThey were slowly rotting. As they built the wall, they slowly decayed. Flies swarmed around them; rats bit chunks from their toes, yet they never seemed to notice or care. Was it from arrogance, madness, or blindness? The creatures kept working on their wall, the monument to their collective godhood. \n\nIn the end, it was nothing more than a monument to their folly. They had decayed to biological slurry before it was finished. In the end, even their wall began to decay. \n\nHe witnessed ten centuries pass in minutes. By the end, the wall was gone, and there was no evidence of the creatures."
 fsr_flavor.3.a:0 "Only God Is Eternal"
 fsr_flavor.4.t:0 "Sons Of The Darkness"
 fsr_flavor.4.d:0 "They were not Iberians; he could tell that much. \n\nTheir faces were pale, and if he did not know better, he would say the two prisoners were Scandinavian. But he did know better. The officer in charge had discovered they were Germans but had not found out much else. \n\nNavarro had come here somewhat unnecessarily, but something bothered him about these… spies? It was as if God was trying to tell him something about these men. \n\n“You are Germans,” he began. One of the prisoners interrupted, “We are Aryans,” he corrected. “Yes,” agreed the other, “and if an untermensch like you has any sense, you will—” \n\nThe first shot him a look before turning to Navarro. “Have you nothing better to do, Regent? Do you not have a war to win?” \n\nNavarro almost smiled, “I only do what God tells me to.” \n\n“There is no God,” the second hissed. \n\n“You are Burgundians!” \n\nThe first kept his cool, but the second betrayed his surprise. Navarro was surprised himself. It was as if someone else had spoken for him, the words coming out before he could ponder their meaning. \n\nThe first adjusted his tack. “We have been watching you, Holy Regent. The SS has resources you could—” \n\n“No.” \n\n“No?” \n\n“Your kind is a plague upon the Earth. Either tell me your wicked purpose here, or my subordinates will wrestle it from your treacherous tongues.” \n\n“We shall do neither,” the first replied. He then gave his comrade a signal with only his eyes before biting down on a hidden cyanide pill. The other followed suit, and despite the efforts of the base's doctor, both were dead within minutes. \n\nThe guards were sheepish, fearing that Navarro would punish them for overlooking the suicide pills, but the Holy Regent simply dismissed them. \n\nIt had not been an entirely wasted effort, for he now knew the Enemy was in Iberia."
 fsr_flavor.4.a:0 "They Will Not Escape God's Justice"
 fsr_flavor.5.t:0 "A Letter of From The Vatican"
 fsr_flavor.5.d:0 "The Regent was pleased. His diplomatic efforts had paid off. Though he had not received recognition from the Vatican, His Holiness had nonetheless decided to recognize Navarro's efforts to protect the good and faithful Catholics of Iberia from the criminals and madmen. \n\nHe had also received a personal letter himself. This one he was less pleased about. The Pope had, politely enough, questioned Navarro's commitment to Catholicism. He had detailed some points about Navarro and his men that were “strange” and “non-doctrinal.” The letter concluded by asking Navarro to adjust his speeches and doctrine. \n\nIt was rather ridiculous, and God forgive him for saying this; he believed the private condemnation came from the fact that the Pope was Italian. The Pope was likely offended by Navarro's insistence on Iberia's premier position in the world. Yes, that was probably it. There could be nothing else. Navarro's dogma was always correct."
 fsr_flavor.5.a:0 "Always Correct"
 fsr_flavor.6.t:0 "Sermon"
 fsr_flavor.6.d:0 "WHEN YOU SAY PRAYERS, ARE YOU TRULY CONSIDERING THEIR MEANING? TOO MANY PRAY TO THE LORD AND DO NOT MEAN WHAT THEY SAY. \n\nPRAYERS ARE NOT WORDS ON A PAGE TO BE REPEATED; THEY ARE TO BE PROCLAIMED WITH FULL INTENTION—WITH FULL UNDERSTANDING. YOU ARE ASKING THE LORD OUR GOD FOR HELP. UNDERSTAND THE GRAVITY OF THIS. YOU, THE MOST UNWORTHY IN ALL OF CREATION, ARE ASKING GOOD AND ALMIGHTY GOD FOR HELP. \n\nDO YOU SEE NOW? DO YOU SEE HOW MERCIFUL AND GENEROUS OUR LORD IS? GOD BECAME MAN AND DIED SO THAT WE MAY LIVE FOREVER. \n\nSEE THAT WE MUST REPAY HIM, EVEN IF IT IS A FRACTION OF WHAT HE GAVE US. SEE THAT WE MUST DESTROY THE UPRISINGS OF EVIL WHEREVER THEY APPEAR. YOU MUST FIGHT, AND IF GOD TAKES PITY ON US FOR OUR MOST UNWORTHY OF BENEFACTIONS, THEN YOU WILL TRIUMPH AND BRING LIGHT INTO THE WORLD. YOU ARE THE SOLDIERS OF CHRIST; BY YOUR HAND, EVIL SHALL PERISH AND GOOD SHALL LIVE EVERMORE."
 fsr_flavor.6.a:0 "THANKS BE TO GOD"
 fsr_flavor.7.t:0 "The Orders Of Iberia"
 fsr_flavor.7.d:0 "During the Reconquista, many knightly orders sprang up across Christian Iberia. Dedicated in equal parts to the defense of Christian lands and the expulsion of the Muslims from our lands, these orders became a critical facet of Iberian history. \n\nThough they were slowly neutered and eventually dissolved entirely, it is right to honor these orders as defenders of the Christian faith. \n\nAfter consulting with Front's military command, I have ordered the reformation of the orders as specialized military formations. The Holy Knights shall once again defend and retake Iberia from the apostates. \n\n-Holy Regent Arias Navarro"
 fsr_flavor.7.a:0 "Once More"
 fsr_flavor.8.t:0 "I HEAR THEM"
 fsr_flavor.8.d:0 "I \n\nI hear them \n\nI can't stop hearing them \n\nI can't \n\nWhy would I say that? \n\nI want to listen \n\nI want to understand them \n\nI \n\nWhere are you going? \n\nDon't leave me here \n\nDon't leave me in this world \n\nLord, help me \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nI can't hear anymore"
 fsr_flavor.8.a:0 "GOD IS WITH US"
 fsr_flavor.9.t:0 "Hollow Salvation"
 fsr_flavor.9.d:0 "Thousands lie dead. \n\nFor what? \n\nYou are no better than the worst of your brethren. \n\nYou praise God with your lips and serve the devil with your hands. \n\nThe regency is false and unholy. \n\nNothing good will spring from your hands. \n\nIt did not have to be this way."
 fsr_flavor.9.a:0 "What Have I Done?"
 fsr_flavor.10.t:0 "One Among Many"
 fsr_flavor.10.d:0 "The sun rises, and the sun sets. \n\nThe new Iberia will be no different from the old. Sure, some names will change, and some faces will be new. But the root of sin remains. Perhaps it will flourish still, but it will be unremarkable—no different from any other nation on the Earth. No more pleasing to God than any other. \n\nYour people sing praises to God, but do you truly follow Him?"
 fsr_flavor.10.a:0 "Just Another Fiefdom Of Men"
 fsr_flavor.11.t:0 "In God's Domain"
 fsr_flavor.11.d:0 "Behold Holy Regent! \n\nBy your good and just leadership and God's will, [ROOT.GetNameDef] thrives! Know that since the Covenant with Israel was fulfilled, no nation has been as favored as Iberia. No nation has stood above all the others in the Lord's light. \n\nIn such a faithless age, you have taken a great burden on yourself to see the world free from the Devil's servants. \n\nYour work is just beginning. \n\nMake Iberia stronger, richer, and then hunt down the enemies of the Lord. \n\n\n\nThey must not win."
 fsr_flavor.11.a:0 "Iberia Will Serve Well"
 #focuses
 ##ibr war tree
 FSR_the_only_choice:0 "The Only Choice"
 FSR_the_only_choice_desc:0 "Look at what impiety has taken hold of Iberia! \n\nIt is time to take up arms and fight against the heathens once more!"
 FSR_the_only_choice_tt:0 "§WIn nomine Patris et Filii et Spiritus Sancti§!"
 FSR_have_mercy_on_us:0 "Have Mercy On Us"
 FSR_have_mercy_on_us_desc:0 "Deranged armies and bloodthirsty militias prowl the countryside. It is the failure of the modern that led us here. We must restart this sick, twisted world!"
 FSR_the_satanic_ideologies:0 "The Satanic Ideologies"
 FSR_the_satanic_ideologies_desc:0 "The last few centuries have yielded a cavalcade of deranged philosophies. Many fell to their sway, and great suffering has been arose from this. We must reject these materialist dogmas and return to Christ!"
 FSR_soulless_socialists:0 "Soulless Socialists"
 FSR_soulless_socialists_desc:0 "The Marxists believe in a delusional utopia on Earth, which supposedly will spring out of a rejection of God and tradition. Needless to say, they have utterly failed at achieving their objectives. This has not stopped them, and they are willing to kill as many people as possible to crawl further toward their goals."
 FSR_godless_liberals:0 "Godless Liberals"
 FSR_godless_liberals_desc:0 "A Liberal only loves wealth and pleasure. Not the Godly kind, we regret, but the earthly kind. Even as his earthly treasures and fantasies rot before his very eyes, the Liberal still refuses to turn to God and beg for His forgiveness."
 FSR_lifeless_nazis:0 "Lifeless Nazis"
 FSR_lifeless_nazis_desc:0 "The National Socialists, and their Fascist cousins, are true barbarians. For them, death is life, and earthly power rules supreme. So many innocents died from the horrid wars they love to wage. \n\nIf the Antichrist wasn't Hitler, then he will certainly be a Nazi."
 FSR_the_worst_evil:0 "The Worst Of Them All"
 FSR_the_worst_evil_desc:0 "Hell is on Earth, and its name is Burgundy."
 FSR_deliver_us:0 "Deliver Us"
 FSR_deliver_us_desc:0 "Oh God, save the sinners and strike down evil."
 FSR_the_regents_strength:0 "The Regents Strength"
 FSR_the_regents_strength_desc:0 "By the will of God, and through Him, the Regent, have we managed to establish ourselves in this horrid conflict. The Regent will guide us through these dark times."
 FSR_devolve_the_kingdom:0 "Devolve The Nation"
 FSR_devolve_the_kingdom_desc:0 "By the will of God, and through Him, the Regent, have we managed to establish ourselves in this horrid conflict. The Regent will guide us through these dark times."
 FSR_iberian_tapestry:0 "Iberian Tapestry"
 FSR_iberian_tapestry_desc:0 "The Iberian Peninsula is home to a plethora of cultures and traditions; a patchwork of colors and song. Under our guidance, they will be allowed to preserve their distinctiveness."
 FSR_honour_and_loyalty:0 "Honour And Loyalty"
 FSR_honour_and_loyalty_desc:0 "Honour… loyalty… These ideas have become rare and frowned upon in the dark age we live in. If we must keep the fire of chivalry burning alone, we shall."
 FSR_the_churchs_place:0 "The Church's Role"
 FSR_the_churchs_place_desc:0 "We can save Iberia, but only the Church can save souls."
 FSR_union_with_the_state:0 "Union With The State"
 FSR_union_with_the_state_desc:0 "The Church and State should not remain separate. They should work together, for the betterment of all."
 FSR_see_to_the_poor:0 "See To The Poor"
 FSR_see_to_the_poor_desc:0 "Charity is not a sign of weakness, rather it is the opposite. Our enemies fail to understand this."
 FSR_priests_in_the_army:0 "Priests In The Army"
 FSR_priests_in_the_army_desc:0 "It is not enough to be moral and lawful. One must live a life pleasing to God. Our military should exemplify this fact and spread the goodness of God."
 FSR_bride_of_christ:0 "The Bride Of Christ"
 FSR_bride_of_christ_desc:0 "The Church, as in the people, is the bride of Christ. They deserve power over the nation's affairs, provided they accept God as the supreme ruler of all things."
 FSR_god_is_calling:0 "God Is Calling!"
 FSR_god_is_calling_desc:0 "Will you answer him?"
 FSR_approach_peters_heir:0 "Approach Peter's Heir"
 FSR_approach_peters_heir_desc:0 "The Vatican has been silent on the Iberian conflict for the most part. If we can gain recognition from the Papacy, we will have won a massive diplomatic coup."
 FSR_sermons_and_rallies:0 "Sermons And Rallies"
 FSR_sermons_and_rallies_desc:0 "We shall call out to the people and tell them the truth!"
 FSR_he_is_risen:0 "He Is Risen"
 FSR_he_is_risen_desc:0 "Rejoice! The Lord has triumphed over death! Our victory is assured!"
 FSR_defence_of_the_realm:0 "Defence Of The Realm"
 FSR_defence_of_the_realm_desc:0 "The other factions of the Iberian struggle seek our absolute destruction. We must make haste to defend ourselves!"
 FSR_reform_the_orders:0 "Reform The Orders"
 FSR_reform_the_orders_desc:0 "In Spanish history, there were four primary monastic military orders. The Orders of Santiago, Calatrava, and Alcántara managed to survive even into the 20th century. The Order of Montesa was dissolved much earlier by papal instigation. We will reform these orders as specialized army branches, and they will carry on the holy mission."
 FSR_calatrava:0 "The Calatrava Order"
 FSR_calatrava_desc:0 "The first Order to be founded in Castile, the Calatrava Order will be our armored force."
 FSR_new_knights:0 "The New Knights"
 FSR_new_knights_desc:0 "Like the armored knights of old, tanks are well-armored and simultaneously mobile and devastating. It is fitting that we call our tank crew knights, for that is what they are."
 FSR_santiago:0 "The Santiago Order"
 FSR_santiago_desc:0 "Perhaps, the most well known of the Spanish Orders, the Order of Santiago will be the backbone of the army."
 FSR_god_favors_the_bold:0 "God Favors The Bold"
 FSR_god_favors_the_bold_desc:0 "Our troops are no mere conscripts! They will bravely dive into danger and hold fast against any enemy onslaught!"
 FSR_alcantara:0 "The Alcántara Order"
 FSR_alcantara_desc:0 "The Order of Alcántara was founded in León and soon became a bulwark against the Muslim invaders. They will act as our artillery forces."
 FSR_masters_of_siege:0 "Masters of Siege"
 FSR_masters_of_siege_desc:0 "No wall will be left standing."
 FSR_montesa:0 "The Montesa Order"
 FSR_montesa_desc:0 "Extremely short lived compared to the other Orders, the Aragonese Montesa Order will become our aviation wing."
 FSR_a_new_dimension:0 "A New Dimension To War"
 FSR_a_new_dimension_desc:0 "Air forces have become an integral part of modern warfare. We cannot ignore them even in this desperate situation."
 FSR_reconquista:0 "The New Reconquista"
 FSR_reconquista_desc:0 "We will reclaim the peninsula from the apostates!"
 FSR_to_banish_evil:0 "To Banish Evil"
 FSR_to_banish_evil_desc:0 "The evil must be purged no matter what."
 FSR_defend_the_innocent:0 "Defend The Innocent"
 FSR_defend_the_innocent_desc:0 "The good and Godly people of Iberia must be protected."
 FSR_the_angels_sing:0 "The Angels Sing"
 FSR_the_angels_sing_desc:0 "I hear them well."
 FSR_death_has_perished:0 "Death Has Perished"
 FSR_death_has_perished_desc:0 "Indeed death had died long ago."
 FSR_for_the_kingdom_of_god:0 "For The Kingdom Of God"
 FSR_for_the_kingdom_of_god_desc:0 "For only it is eternal."
 FSR_for_the_kingdom_of_spain:0 "For The Kingdom Of Iberia"
 FSR_for_the_kingdom_of_spain_desc:0 "For only it is worthy."
 FSR_tresures_of_the_earth:0 "Treasures Of Earth"
 FSR_tresures_of_the_earth_desc:0 "God has blessed Iberia with abundant natural wealth. It is a shame many have horded it, but it is time to rectify that."
 FSR_reject_the_thievery:0 "Reject Thievery"
 FSR_reject_the_thievery_desc:0 "Capitalism, and communism are doctrines of greed with different names. We will end this lust for gold."
 FSR_land_to_the_peasents:0 "Land For The Peasents"
 FSR_land_to_the_peasents_desc:0 "All deserve land to own and care for, provided they are willing to do so and act in good manner."
 FSR_social_harmony:0 "Economic Harmony"
 FSR_social_harmony_desc:0 "If the economy is not designed to care for everyone, then it is a machine of sin, and must be rejected."
 FSR_everyone_in_their_place:0 "Everyone In Their Place"
 FSR_everyone_in_their_place_desc:0 "Everyone has their place. No class struggle nonsense."
 FSR_revive_the_guilds:0 "Revive The Guilds"
 FSR_revive_the_guilds_desc:0 "The medieval guilds simultaneously protected the livelihoods of craftsmen, and ensured goods were of high quality. No wonder the merchants wished to destroy them."
 FSR_localized_economics:0 "Localized Development"
 FSR_localized_economics_desc:0 "The economic affairs of the regions will be left to the regions and the local churches themselves. The State must only interfere when absolutely necessary."
 FSR_a_moral_economy:0 "A Moral Economy"
 FSR_a_moral_economy_desc:0 "Why should wealth be generated purely from sin? Each man should labour for the whole, and be rewarded for his sacrifice. Greed is not good."
 FSR_the_duty_of_men:0 "The Duty Of Men"
 FSR_the_duty_of_men_desc:0 "Such is the world that men must labour."
 FSR_agrarian_kingdom:0 "An Agrarian Kingdom"
 FSR_agrarian_kingdom_desc:0 "For this bread we thank Thee."
 FSR_for_the_struggle:0 "For The Struggle"
 FSR_for_the_struggle_desc:0 "It is necessary that our economic stance be geared towards warfare. Otherwise, we will fall before we have any chance to carry out God's will."
 FSR_break_the_banks:0 "Destroy The Banks"
 FSR_break_the_banks_desc:0 "The dens of thieves will perish. No longer shall the good men and women of Iberia be subjected to the sin of usury."
 FSR_guns_of_the_holy:0 "Guns For The Holy"
 FSR_guns_of_the_holy_desc:0 "Our weapons will strike down our impious enemies!"
 FSR_rural_workshops:0 "Build Rural Workshops"
 FSR_rural_workshops_desc:0 "Countryside industry will be the bedrock of our manufacturing capacity!"
 FSR_give_to_caesar:0 "Give To Caesar What Is Caesar's"
 FSR_give_to_caesar_desc:0 "How can we hope to win the war if we allow men to laze about? They have a divinely mandated obligation to the state!"
 FSR_observe_the_holy_day:0 "Observe The Holy Day"
 FSR_observe_the_holy_day_desc:0 "Even in these dire times, the people should have time to attend Mass and give thanks to God."
 FSR_oppose_greed:0 "Oppose Greed"
 FSR_oppose_greed_desc:0 "One cannot serve two masters. Either serve God, or face justice."
 FSR_stone_by_stone:0 "Stone By Stone"
 FSR_stone_by_stone_desc:0 "If we must rebuild the nation stone by stone, we shall."
 FSR_first_before_god:0 "First Before God"
 FSR_first_before_god_desc:0 "Only the Kingdom of God is eternal, and the kingdoms of men are fleeting. Yet, some are more equal than others. The Holy Kingdom of Iberia is the first among nations, and through it, God's will shall become manifest."
 FSR_first_before_god_tt:0 "§PEffect Will Be Decided By Our Righteousness§!"
