 FSR_morality:0 "To Be Good And Just"
 FSR_morality_desc:0 "These are dark times. With the swelling of Christ's enemies, we have been challenged not only to defeat these egregious factions plaguing Iberia but also to uphold the goodness and virtue of the Lord. Though it may be expedient at times to act in a manner that is immoral, committing to moral actions over quick gains will lead to rightful benefits. If the Front acts in a manner that is pleasing to God, we will not only gain His favor but also the respect of our fellow men. Likewise, if we turn our backs on God, we will be seen only as another gang of butchers. \n\nCurrently, our cause is [FSR_morality_status_text]."
