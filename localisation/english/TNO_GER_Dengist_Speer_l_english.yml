 ### India smart work se badhye


 ### Intro tree
 
 SGR_dream_no_more: "Dream No More"
 SGR_dream_no_more_desc: "We have survived, survived by the skin of our teeth, but survived nonetheless.\n\nTo say the Slave Revolt, Schorner's revolt, and the Judeo-Liberal Gang of Four's attempt to overthrow the government to the benefit of the Jewish Freemasons have brought ruin to Germany would be an understatement. While there is no direct risk of us losing power now that all of them have been negotiated with, shot, and defanged respectively, the road to restoring the Aryan Volk's trust in National Socialism will be grueling, tedious, but ultimately relatively short in the grand scheme of things.\n\nAs we heal Germany's wounds, would do well to pay attention to the outside world, for our rivals are growing weaker. America is already wrought by the poison of Judeo-Progressivism, no doubt implanted by Burgundian agents to turn their youth into Marxist agitators, while Japan is increasingly faced with the prospect of an assertive and aggressive China, and if we are shrewd enough, we can perhaps even pour fuel on the fire to weaken them. Not all is well, however, the Shadow State still lies to our West, while our old enemy to the East pieces himself together. . ."

 SGR_extinguish_the_flames: "Extinguishing The Flames"
 SGR_extinguish_the_flames_desc: "Despite our negotiations with the leaders of the Slave Revolt, there still remain small pockets of suicidal slaves and other such hostile elements spitefully wreaking havoc on the recently stabilized Eastern territories. Needless to say, this cannot stand, especially in the face of the looming Russian threat. There can be no dangling the carrot with these groups, only using the stick.\n\nHowever, some in our government are cautioning against the use of the Wehrmacht and simple counter-insurgent tactics, rather, they argue the RND could be utilized to carry out surgical strikes against the leadership of these groups. Their argument being, that these groups are only held together by spite and the leadership, chop off the head and the rest of them will disperse."

 SGR_bring_the_troops_home: "Bring Our Boys Home"
 SGR_bring_the_troops_home_desc: "The Moskowien invasion and the restoration of order to the East have been perhaps, the largest military operations the Reich has seen since the West Russian War. The battle against Schorner and his Freikorps and Militarist allies necessitated both a large mobilization of the armed forces and a heavy hand when it came to occupation. With the crisis over and stability restored, maintaining such a large force in the East is no longer necessary and troops levels can be safely restored to pre-Revolt amounts with supplementary native auxillaries to assist.\n\nFor one, we can offer general pardons to the rank and file of Schorner's army, excluding the natives who rather bafflingly collaborated with him and the Freikorps hired by the Kaukasien barons, and for two, we can establish programs to ensure their de-Militarization and orderly reintegration into society. If all goes well, Schorner and the fanatics he led will never be praised by future generations, but be relegated to the dustbin of history."

 SGR_trial_the_traitors: "Hang The Fanatics"
 SGR_trial_the_traitors_desc: "One would be mistaken to confuse our general amnesty for Schorner's enlisted men for forgiveness or even acceptance of Militarist ideology, the officers, natives, and barons who led the revolt in the East betrayed the Vaterland not only in its greatest time of need, but opportunistically thought we and the slaves would wear each other down and let them to swoop in and conquer Germany.\n\nThe trials are a foregone conclusion; Death, hard labor, confiscation of property, and blacklisting, simply put, their absolute exclusion from society. The officers and natives can be tried by military tribunals, where they will almost  certainly be shot, while the Barons will be tried by civilian courts and likely face years of hard labor and the confiscation of all their property. If they thought they'd get their own fiefdom like Himmler, they were sorely mistaken."

 SGR_finish_the_paramiliaries: "Finish The Lowlifes"
 SGR_finish_the_paramiliaries_desc: "The so called \"Freikorps\" took up arms in Kaukasien at the behest of Schorner and rootless corporate leeches, these mercenaries, loyal only to the highest bidder, thought that stealing the name of those who heroically fought against communism more than 50 years ago would turn them into a disciplined army. Belonging to neither an army nor a state, the fate of these men is an unceremonious summary execution without trial.\n\nUnfortunately for us, some of them have fled into the Azeri mountains and are still harassing our forces, while some of them have attempted to flee and slip back into society. We're faced with two options, to focus on those who scampered like rats, or those who stand firm like asses. While the RND and most of the NSDAP are calling for us to focus on the deserters to send a message, a vocal minority of pragmatists in the party are jockeying for us to eliminate the holdouts to get oil production back up as quickly as possible."

 SGR_rally_the_party: "Retire The Relics"
 SGR_rally_the_party_desc: "Our reputation with the people may be rather poor at the moment, but in the party, Speer commands unchallenged power and authority. Oberlander and his clique of conservatives have been pushed to the absolute edges of the NSDAP, losing many to defection and replacement, however they are a far, far more insidious threat than the Gang and Militarists, for they have not taken up arms and subsequently been purged.\n\nIt's clear that the 1970s will be the decade of Reformed National Socialism, and keeping Oberlander around as a pet monkey will only encourage him to keep obstructing us at every turn. Oberlander will gracefully retire from the NSDAP for \"health reasons\", and the conservative remnants will be taken into the fold of the wider party. They can protest against certain decisions, even loudly, but at the end of the day they will know that it is the Fuhrer that they answer to."

 SGR_expell_the_hyenas: "Expel The Hyenas"
 SGR_expell_the_hyenas_desc: "Traitors, rats, scum, Jews, Freemasons, Slav-worshippers, and damned bastards.\n\nThose are only a few words that can be used to describe the Gang of Four. Like sharks, they sprang to action once they smelled blood in the water, but by the grace of God Almighty, their insidious schemes were foiled by the Fuhrer and the party. All of them have been removed the halls of power, ultimately replaced with far more loyal and competent men.\n\nBut if you cut down the tallest tree, you still haven't cleared the forest. The poisonous seeds planted by the Gang have poisoned the NSDAP, we saw it in the Slave Revolt, and if we fail to take precautions, we'll see it in whatever crisis we encounter next. The Fuhrer has made his wishes clear, a full purge of the party under the pretext of an NSDAP party congress to plan for the 1970s, the Gang will be removed from any posts they officially hold on paper. Many will be expelled, and many will have to be replaced, but in the end Germany and the party shall be all the healthier for it."

 SGR_the_man_from_abwher: "The Man From Davos"
 SGR_the_man_from_abwher_desc: "The purge of the NSDAP of the liberals that infested it is complete, and the Reichstag is now filled with new, fresh faces, among them a certain Klaus Schwab of Ravensburg. An engineer by trade, the young Schwab had been an ardent supporter of Erhard's economic reforms as a low level functionary in his regional NSDAP administration, but other than that he has remained rather engimatic.\n\nFrom what we know, he has boldly begun building a clique within the party around himself despite his relative youth, but it seems to be working as several new members of the Reichstag with business and industrial backgrounds have already allied about him. Perhaps time will tell if this Ravensburger will prove to be an ally or an enemy."

 SGR_the_components_of_the_volkshalle: "The Gears Of The Volkshalle"
 SGR_the_components_of_the_volkshalle_desc: "The storm has passed, and the rubble has been cleared. The Conservatives, the Gang, the Militarists - Oberlander, Schmidt, Schorner - All dead or toothless. With the initial period of unrest over, the levers of power have shifted; Allegiances have changed, old faces have been replaced by younger ones, and long standing norms have been upended. The new NSDAP is no longer divided, there is no more reformist or conservative, no more liberal or loyalist, there is only loyalty to the Fuhrer, and the Fuhrer alone.\n\nBut you cannot simply end factionalism in politics, there will have been and will always be factions, the only difference now is that they're united by Speer and in their general goals. Currently, the political landscape has shifted and created three new distinct factions:\nThe Apparatusen, the partocrats, the foot soldiers of National-Socialism-Speerism, made up of what were the Reformists pre-Revolt.\nThen, the Sicherheitskraten, the securocrats who aim to make sure the RND becomes the sword and shield of Germany, a precise scalpel able to pierce even the toughest foreign intelligence apparatus and dissident organization.\nFinally, and smallest of all, the Technokraten, men who value the economy and pragmatism above all, and while currently small they nonetheless are rapidly growing.\n\nIt is these three pillars that will decide the fate of Germany, and if we win this Cold War, the whole world..."

 SGR_the_foundation: "The Foundation"
 SGR_the_foundation_desc: "There is no other organization in Human history that has been as impactful as the National Socialist German Worker's Party, but with great size and influence also comes factionalism, it's inevitable in politics. Thankfully for us, the three main factions of the Reichstag are fully supportive of the Fuhrer's agenda and will follow him no matter what.\n\nThe Apparatusen are the faceless bureaucrats, the men who make sure records are kept, that a garrison in the East receives supplies on time, that the trains run on time. Even the term Apparatusen is a bit of a misnomer, it would be better to call them \"Ideologues\", for while before these men might've been associated with Bormann and his ilk, today they make up the foundation of Speer's NSDAP and are the most committed to making sure Reformed National Socialism is not diluted or watered down. They are currently the largest faction within the party, and are made up of the bureaucrats, but also the propaganda ministry. They are the vanguard of National Socialism, and they'll be damned if they Hitler's dream be tarnished."

 SGR_the_buttress_the_nsdap: "Advancing National Socialism"
 SGR_the_buttress_the_nsdap_desc: "National Socialism-Speerism, or simply Reformed National Socialism, has undoubtedly saved the Reich. Gone are the days of slaves toiling away in factories only to line the pockets of fat oligarchs while Germany's sons starve in the streets, or mindless militaristic and bloated defense spending, or even encouraged brutality within Germany's most prestigious forces. No, Reformed National Socialism is true, unadulterated National Socialism.\n\nBut an ideology is only as good as the institutional power it holds, and we can't expect the German people and by that extent the next generation of bureaucrats to be loyal and well educated in national socialism if we sit back and relax. At the behest of Speer, the educational curriculum, Volkischer Beobachter, and the wider media apparatus will become the pulpits from which the public becomes informed on Reformed National Socialism. Children will learn what it means to be a national socialist, adults will know how to differentiate between liberal capitalism and the social market, and soldiers will be trained to recognize militarist propaganda in the ranks. Reformed National Socialism will not just outlast all other competing ideologies, but last a thousand years."

 SGR_the_dome: "The Dome"
 SGR_the_dome_desc: "Abwehr, Orpo, Gestapo, SD, SS, and now RND. To call the intelligence community of the Greater Germanic Reich influential would be an understatement, as the Cold War shifts more and more from the old tactics of the 1950s of proxy warfare and towards more sophisticated forms of hybrid warfare such as propaganda warfare, psychological operations, and more broadly espionage, so too must Germany adapt lest it lag behind.\n\nThe Sicherheitskraten are the men who die in the dark so the Volk can live in the light, they are the ones who make sure that a Slav terrorist cell doesn't bomb a supply depot, that a Judeo-Communist student cell is dispersed, that an American spy is silently disposed of as he attempts to flee in the dead of night. Led by Wessel, the Sicherheitskraten hold one thing above all, the expansion of the German intelligence apparatus, but that isn't to say they want ears listening to every phone call, that would be both unfeasible and unnecessary. The 1960s and the Slave Revolt have essentially neutered the student movement within the nation, but our enemies have only grown stronger when it comes to espionage, and so foreign espionage should be our primary focus. They are the sword and shield of Germany, and they will see to it that our enemies collapse on themselves without a single shot fired."

 SGR_coordinate_the_abwher_and_orpo: "\"Special Activities\""
 SGR_coordinate_the_abwher_and_orpo_desc: "The constitution of 1946 gives the Fuhrer total control of the state, among these powers is using the intelligence agencies of the Reich as he sees fit. While we are not restricted with what we can do with the RND in the same way as the Americans with Congress and the CIA, the Americans are nonetheless far more experienced. They learned from their defeat in the Second World War, and were able to transform the OSS into a fearsome beast which no doubt inflamed the student movement from the 50s onwards.\n\nBut all good things must come to an end, with Gehlen out of the way we can safely give the RND more power and funding for their activities without the risk of them going under our nose. The \"Abteilung für besondere Aktivitäten\", or the Special Activities Unit, will be created as a new arm of the RND. Covering covert operations on enemy soil, whatever units and departments had existed for this purpose will be absorbed into it. Specializing in both commando operations and long-term psychological warfare, this unit will be both a dagger and a poison to our enemies: Sudden and devastating, slow and untraceable."

 SGR_the_pillars: "The Pillars"
 SGR_the_pillars_desc: "The market reforms of Erhard and his Social Market economy have, despite his liberal leanings, been a boon to the nation. Prices went down, wages went up, economic growth increased, and if it wasn't for the Slave Revolt things could have continued as they were. Unfortunately, we are now left to piece everything back together and undo the damage left by the Gang and their fifth columnists.\n\nThe Technokraten are the silent workhorses, they are the economists, the the engineers, the scientists, they are both the visionaries and the realists. While not having one single leader per se, the largely rally behind the engimatic Klaus Schwab whenever he calls them to action. When the green line goes up, all is good for the Technokraten, when the line turns red and goes down, then there is a problem that must be rectified. National Socialism to them must adapt as time goes on, it cannot remain as a time capsule of the 1940s or the 1960s, but remain a constantly evolving beast. The Apparatusen call them crypto-liberals, but if a growing economy is a sign of liberalism, then the Technokraten are liberals."

 SGR_a_grand_plan: "A Grand plan"
 SGR_a_grand_plan_desc: "The early 70s have been a turbulent time, but there is no reason we cannot look ahead to the future. The four cartels have been dismantled and Germany is beginning to transition to a truly competitive free market economy, but the free market needs a little nudge every once in a while. We must have goals we wish to reach by the end of the 70s, some may call them quotas but nobody will lose their job or be shot for refusing to meet them, the carrot would be of better use here.\n\nThe government must closely cooperate with private business to ensure healthy growth of an economy that serves the nation first, the people second, and the wallet of the owners last. To this end, we will have to incentivize the capitalist class; Production quotas with payouts if they are met, lucrative government contracts in exchange for shifting towards production of useful goods, perhaps even privatization of state-owned assets to extremely successful entrepenuers. With the political power of the old conglomerates now shattered, the time for using the stick with the businessmen of our nation has ended, the state and capital must come together to further the aims of the nation and the wellbeing of the people. If it all goes according to plan, we might just put Wall Street to shame."

 SGR_who_brought_the_reich_back: "The Man Who Brought The Reich Back"
 SGR_who_brought_the_reich_back_desc: "It is finished, finally finished.\n\nThe storm has passed, the nation has healed, and we can get back to work once more.\n\nAnd all thanks to §rone man.§"

 ### Main tree

 SGR_affairs_of_the_heimat: "Affairs Of The Heimat"
 SGR_affairs_of_the_heimat_desc: "The worst has passed, and now we must get back to work. If Germany is to survive the 1970s, it won't be through sitting around until a civil war forces us to act, no, the time for complacency has ended. We have to seize the moment and take the fight to our enemies rather than let them take the fight to us, and luckily the three main factions of the state apparatus are eagerly looking to implement their own pet agendas.\n\nThere can be no incompetence or disloyalty in implementing our agenda, that much is clear, the fifth columnists who were disloyal to the Fuhrer and the issues which plagued our nation are gone now, and with them any excuses for failure. We WILL prevail and the 21st century WILL be a German century, vorwarts!"

 SGR_setting_the_stage: "Set The Stage"
 SGR_setting_the_stage_desc: "The party must know that the era of running amok behind the Fuhrer's back is over, there will be no conservatives, no liberals, there will only be the party, and nothing but the party, and the party will be united.\n\nOf course, this is all on paper, but this message isn't simply for theatrics, it also serves to notify the party that the Fuhrer's word is final. If the Fuhrer sides with the Apparatusen, the Sicherheitskraten and Technokraten will fall in line and implement the agenda of the Apparatusen to the best of their ability. The time for bickering is over, and the time for unity is now."

 SGR_acquiring_the_actors: "Acquire The Actors"
 SGR_acquiring_the_actors_desc: "At the end of the day, the Fuhrer is the father of our nation, but in every player the protagonist also needs a supporting cast and somebody to replace him if he is unavailable. Speer will need to start looking for a successor, but unfortunately our options are limited.\n\nWessel is not a man who itches to be in the spotlight, merely content to work in the shadows. The Apparatusen are led by Speer, having no true leader of their own, and they prefer to have the party lead instead of one man. Schwab is currently an enigma, an unknown quantity, and far too unpredictable at the current moment to make an informed judgement. For now, we will have to continue relying on Speer for legitimacy in spite of the looming question of succession."

 SGR_drawing_in_the_audience: "Draw In The Audience"
 SGR_drawing_in_the_audience_desc: "The Volk are our most treasured possession, all that we have done in 1933 has been for them. Unlike the communists, our people are not mere statistics to us, but the all encompassing entity which we serve and draw our legitimacy from.\n\nThe upcoming Reichstag session will be the most important one since Hitler appointed his successor 10 years ago, and we would do well to make sure the people are listening to our every word. We will officially announce upcoming the Reichstag session to the people, and go even further by televizing it live to every household in Germany. Once all is said and done, the people will know who the traitors and heroes were."

 SGR_lights_cameras_action: "Licht, Kamera, Action!"
 SGR_lights_cameras_action_desc: "It is done, the party is at our backs, the gears of power have been oiled, and the people stand at our beck and call. No longer will we be chained by enemies from within and without\n\n§rNo longer.§"

 ### Securocrat branch

 SGR_hear_no_evil: "Hear No Evil"
 SGR_hear_no_evil_desc: "Gerhard Wessel is an interesting man, his loyalty to the Reich is unquestionable, and his expertise as Gehlen's right hand man is unparalleled in the German intelligence community. As Germany now looks to go on the offensive in the 70s, the RND will take a leading role in fighting our enemies.\n\nWhat sets apart this decade from the last 30, however, is our lack of internal enemies and introduction of new methods of mass media and political mobilization. Our agents abroad during the 60s noticed many irregularities, a few mysterious political donations to the NPP here, a mysterious sabotage of a Sudwestafrikan airfield there, a pattern of seemingly unrelated incidents meant to prolong wars or inflame political tensions throughout the last decade can now only poin to one thing: Burgundy.\n\nThe Burgundians no doubt have attempted to destabilize various nations across the globe, including our own beloved Germany, but one shouldn't neglect to learn from the enemy. Himmler's operations, especially in America, have been nothing short of genius, and Wessel agrees. The RND under Wessel's guidance will see that our enemies kill each other, all the while we sit back and watch."

 SGR_hear_no_evil: "Hear No Evil"
 SGR_hear_no_evil_desc: "Gerhard Wessel is an interesting man, his loyalty to the Reich is unquestionable, and his expertise as Gehlen's right hand man is unparalleled in the German intelligence community. As Germany now looks to go on the offensive in the 70s, the RND will take a leading role in fighting our enemies.\n\nWhat sets apart this decade from the last 30, however, is our lack of internal enemies and introduction of new methods of mass media and political mobilization. Our agents abroad during the 60s noticed many irregularities, a few mysterious political donations to the NPP here, a mysterious sabotage of a Sudwestafrikan airfield there, a pattern of seemingly unrelated incidents meant to prolong wars or inflame political tensions throughout the last decade can now only poin to one thing: Burgundy.\n\nThe Burgundians no doubt have attempted to destabilize various nations across the globe, including our own beloved Germany, but one shouldn't neglect to learn from the enemy. Himmler's operations, especially in America, have been nothing short of genius, and Wessel agrees. The RND under Wessel's guidance will see that our enemies kill each other, all the while we sit back and watch."

 SGR_a_german_u2: "A German U2"
 SGR_a_german_u2_desc: "The U2 spy plane is a true marvel of engineering, perhaps even the gold standard for spy planes. It was this magnificent jet that exposed Japanese missile deployments in Hawaii, nearly causing the clock to strike midnight where it not for the adept political manuevering of the Japanese and Americans.\n\nUnfortunately, our doctrine prior to the Burgerkrieg was centered around a bloated military fighting our enemies in the field of open battle with intelligence gathering left to the Abwehr. But that was in the past, and we are in the future now, and if we are to stay informed on the actions of our enemies we will need to develop our own sophisticated spy plane. We've decided to award the contract for such a vehicle to Arado Flugzeugwerke, and we have no doubt that they'll do an excellent job!"

 SGR_eyes_of_providence: "Eyes Of Providence"
 SGR_eyes_of_providence_desc: "We might have won the race to the Moon, but the Americans won the race to God's eyes.  At this very moment, dozens of American spy satellites that outclass our own ENTDECKER satellites in both quality and number orbit above Europe, snapping photos of our military installations and our troop deployments all the while we are left clueless to what is going on across the ocean in Fortress America.\n\nThere's no excuse for this, we won the space race, we have a veritable ocean of experience when it comes to space flight and rocketry, and some of the brightest and most innovative minds the world has ever seen. By direct order of the Fuhrer, the Reich Aerospace Agency in collaboration with the RND will move to develop the \"Adler\" system, a sophisticated series of tens or maybe hundreds of spy satellites constantly orbiting over America, Russia, and East Asia and securely transmitting data back to RND headquarters via encrypted radiolinks. We put a man on the Moon and we're not gonna be outdone by a couple of politicians in suits, damn it!"

 SGR_enhanced_training: "Enhanced Training Techniques"
 SGR_enhanced_training_desc: "The RND in its current state is very capable when it comes to the cloak and dagger, but not when it comes to open and chaotic combat. The CIA, for example, has their Special Activities Division for covert commando operations such as training paramilitaries and rebels, and the Japanese Kempeitai have their Yamato Squadron. The agents of the Kempeitai and especially the CIA are second to none in commando expertise, for the Nahkampf method is servicable in hand to hand combat, but not so much in open squad-to-squad confrontations.\n\nDirector Wessel knows that we can't fall behind when it comes to the individual ability of our operatives, and has forwarded a motion to the Fuhrer: Extend commando training to all RND operatives to be deployed overseas, enhance training for already dedicated commando units. It would be incredibly expensive, and weed out a lot of candidates, but Wessel has asked for increased recruitment as a counterweight. The Technokraten have moved against such a measure however, arguing for a more modest program that only targets current commandos, still the decision ultimately lies with the Fuhrer."

 SGR_specialized_commando_teams: "Dedicated Special Forces Divisions"
 SGR_specialized_commando_teams_desc: "Our current commando teams, while being extremely elite units in their own right, are small in number. While the Japanese are in a similar - and perhaps even worse than us considering how divided their intelligence community is - boat to us, the Americans have over 10,000 elite operatives in the units under their Special Operations Command alone, not even counting covert CIA commando teams. If we don't change course immediately, then we will be left open to subversion by our enemies.\n\nEnhancing and modernizing our training programs was the first step, but we need to think bigger. Alongside expanding the Special Activities Unit, Wessel wants us to officially revive the Sturmabteilung of old, turning them into a handful of tip-of-the-spear elite forces akin to the American Navy SEALs or Army Rangers at the disposal of the Fuhrer. These SA men shall not bear the shame of Rohm and his goons, but be hailed as proud heroes of Germany."

 SGR_keeping_tabs_on_the_party: "Keeping Tabs On The Party"
 SGR_keeping_tabs_on_the_party_desc: "We were fools to think that Schmidt and the Gang of Four as a whole could be trusted, we were naive to think Oberlander didn't pose an obstacle to us, we were blind to the threat Schorner posed far away in Moskowien. and the Rot-Schwarz-Gold organization. So many things could have gone wrong, but through sheer will and the Fuhrer's genius, none of them did.\n\nThe mistakes of the past cannot be repeated, we cannot allow traitors to scheme in our midst while we remain blind to their machinations. Wessel, as a relatively loyal man, will be given the greenlight to set up surveillance on suspicious, engimatic, or disloyal elements in the party. Anyone that has enough influence to cause something like what the Gang did must be watched, beginning with that engineer."

 SGR_german_mkultra: "Projekt Kolibri"
 SGR_german_mkultra_desc: "The Human mind is a mysterious object. Some argue that reality is derived from the mind, others say that it's a mere organ, no more, however that doesn't matter to us. What we are more interested in are the methods which one can... \"break\" or manipulate the mind. The mind is like plastic; Easily molded, most of the time that molding is to recover from grievous brain trauma, but what if you could remold the brain to preform certain actions on command?\n\nNo more will we have to bother with fruitless interrogations of spies or dissidents, the subject need only to ingest a certain chemical, or hear a certain codephrase, or see a certain object, and they will be ours to do with as please. A group of a few select researchers will head this project, codenammed Kolibri, and will have all the test subjects and material they need. All we ask for are results."
 
 SGR_stasi_techniques: "Zersetzung"
 SGR_stasi_techniques_desc: "The student movement of the 60s propelled Speer to the Fuhrership, but they turned on him and formed the rank and file of the liberal movement which the Gang of Four were all too willing to manipulate to weaken Speer. But we've come a long way since the tulmutous 60s, and so have the tools in our arsenal to keep the peace.\n\nA movement is only as its leaders, chop off the head of the snake and the body will go limp. Applying this philiosophy to our dissident groups, we can subtly push activist leaders and other figureheads to complete mental ruin: A misplaced object here, a strategically spread rumor there, all in the interest of making it so these would be revolutionaries cannot trust even their minds, much less anyone around them."

 SGR_sinking_atlantis: "Sinking Atlantis"
 SGR_sinking_atlantis_desc: "The time has come to implement Wessel's plan for subverting our rivals. Taking into account both our enemies' strengths and weaknesses, we have come up with two versions of the plan tailored for Japan and America, but we must focus all our efforts on one or the other in order for the plans to be effective.\n\nUltimately, the United States poses a greater risk to us, us and the Japanese are separated by the deserts of Central Asia, the Russian taiga, and the Zagros mountains, while the Americans are only an ocean away and constantly spying on us with their assets in the North Sea.\n\nWhen factoring both the physical similarities of our peoples and the OFN's status as a \"coalition of the willing\", Plan Knyphausen as it is now called, will involves a sustained and deep infiltration campaign of various American institutions such as the intelligence community and government combined with support for friendly internal elements such as Yockey's wing of the NPP, inflaming tensions within America to attain a favorable political outcome, and all with the ultimate goal of forcing an American withdrawal from the OFN in the future."

 SGR_aryan_vanguard: "Aryan Vanguard"
 SGR_aryan_vanguard_desc: "The United States may be a wretched hive of scum and villainy, utterly dominated by the interests of big business and Judeo-capitalist media, but there are those are still sympathetic to the cause of National Socialism and wish to establish amicable relations between our two nations. These men are the key to fanning the flames of American social unrest, all we need to do is get them off the ground.\n\nFrancis Parker Yockey and his faction of the NPP are aligned with us, both publicly and privately, with several of their members acting as assets for the RND. While this will force us to tread lightly lest the federal government catch on, we can still do our part in destroying liberalism's hold on America. Some high ranking agents within the RND's America office are quietly voicing their reservations though, they claim that there are certain elements of Yockey's movement that are in fact Burgundian assets, the most alarming of which is a wealthy and yet currently unknown donor to his cause..."

 SGR_them_versus_them: "Them Versus Them"
 SGR_them_versus_them_desc: "The NPP and the RDs are both ultimately unstable institutions, one encompasses everyone from degenerate Marxists to commited National Socialists, and the other was a desperate ploy engineered by the forces of capital to bring dying liberals and fence-sitting conservatives together to keep well meaning and honest men like George Patton from power. At the end of the day, both are ultimately alliances of convenience.\n\nAn alliance of convenience is like a pile of firewood, one small spark will light the whole thing on fire, and our flint and steel in this case is the propensity of the American public to reach for eachothers' throats in times of political divide. We can pursue several avenues to either divide or unite the NPP and RDs and strengthen their respective factions pursuant to our agenda, from exacerbating racial tensions to engineering whole crises'. While they tear each other apart over non-sequiturs like \"sexual liberation\" and \"states rights\", we will focus on the real issues."

 SGR_steal_their_toys: "Steal Their Toys"
 SGR_steal_their_toys_desc: "The American military-industrial complex is a behemoth, a beast to rival even the megacorporations at the height of the Reich's power, it is so influential ther former President Eisenhower was willing to warn against it in his last speech before leaving office. Unlike our own megacorporations, the American MIC functions without any slaves or corruption, and is incredibly efficient as a result.\n\nAs we sink our claws into America and its institutions, we can use utilize our agents embedded within them to benefit from the knowledge and expertise of the Americans. Considering that the American MIC coordinates closely with the Department of Defense's own DARPA, we can safely bypass infiltrating the companies responsible for arms development directly as their designs will inevitably arrive at DARPA where our agents can safely gather intelligence on them."

 SGR_infiltrate_their_castles: "Infiltrate Their Castles"
 SGR_infiltrate_their_castles_desc: "One of the greatest advantages of the OFN is that the American military can maintain bases all across the alliance with little risk of having to undertake anti-partisan actions against local gureillas or insurgents. This leaves the Americans free to dedicate all of their efforts to making these bases first and foremost bastions against enemy forces, namely ours and the Japanese.\n\nWe are left with little we can do to openly damage these bases outside of small scale sabotage, which in the grand scheme of things is far more risky and far less rewarding. What we can do is embed our agents and double agents into these bases to gather intelligence, as several of these bases are intelligence hubs through which military intelligence flows in and out of and are at the frontline of America's missile early warning systems. The more we know, the better."

 SGR_go_for_the_brain: "Go For The Brain"
 SGR_go_for_the_brain_desc: "Lately, several RND analysts have recently approached us with an intelligence report requesting that we shift a substantial amount of resources away from infiltrating the United States governments, instead they suggest in the report that we should utilize these assets to infiltrate American academia to fan the flames of the American \"New Left\" who they claim would weaken the United States more on their own than we ever could.\n\nWhile an interesting hypothesis and certainly due for more study in the future, we can't afford to waste precious and valuable resources we currently have on an untested theory. Instead, we should focus on making sure we penetrate the American state apparatus extensively, and use the information gained from that to adapt our foreign and military stances."

 SGR_go_for_the_heart: "Go For The Heart"
 SGR_go_for_the_heart_desc: "Lately, several RND analysts have recently approached us with an intelligence report requesting that we shift a substantial amount of resources away from infiltrating the United States governments, instead they suggest in the report that we should utilize these assets to infiltrate American academia to fan the flames of the American \"New Left\" who they claim would weaken the United States more on their own than we ever could.\n\nWhile some may claim that we shouldn't spend resources on such a risky and untested course of action, the rewards of such an operation are too great to pass up. These students will turn not only hamper American support for intervention abroad, but will also inflame political tensions at home, driving moderates further and further to the extremes of the political spectrum thereby helping Yockey and his faction."

 SGR_land_of_the_blind_home_of_the_craven: "Land Of The Blind, Home Of The Craven"
 SGR_land_of_the_blind_home_of_the_craven_desc: "Finally, Plan Knyphausen is in full swing; Yockey and his men now have funding like never before, the infiltration of the American centers of power is underway, and social tensions across the United States are beginning to come to a head, and all of this in the midst of America's most unstable decade since the 40s, all the while they are left clueless to all of our efforts.\n\nWe can have no doubt that the Americans will catch on with time, realizing the full scale of our activities after it becomes too late to contain the damage. Plan Knyphausen will likely never come to an end officially short of the United States collapsing into a civil war or disbanding, for even their withdrawal from the Cold War would leave them as one of the biggest economies on Earth with immense cultural influence. But no matter, all of that is in the future, and for now? We wait."

 SGR_teuton_against_samurai: "The Teuton Against The Samurai"
 SGR_teuton_against_samurai_desc: "The time has come to implement Wessel's plan for subverting our rivals. Taking into account both our enemies' strengths and weaknesses, we have come up with two versions of the plan tailored for Japan and America, but we must focus all our efforts on one or the other in order for the plans to be effective.\n\nWhile the United States may pose a greater risk to us directly, the threat of Japan winning the Cold War economically through aligning itself with the various developing nations of Africa, South America, and Asia while we and the Americans tear each other apart is too great.\n\nWhen factoring in that the CPS is little more than Japan's satellite states and economic subjects, Plan Rabe as it is now known, will be a continous and sustained espionage campaign to inflame tensions within the Co-Prosperity Sphere and strengthen the various resistance movements around East Asia. The main goal however, is bring about the ideal circumstances for China's victory in their up-coming revolt against the Japanese. After all, if Japan loses China, it will be effectively knocked out of the Cold War permanently."

 SGR_40_years_of_resistance: "Forty Year Of Resistance"
 SGR_40_years_of_resistance_desc: "One can point to when Chiang Kai-Shek and Mao Zedong were killed during the battle of Chongqing as the moment the Sino-Japanese War and perhaps even the Second World War ended. With the loss of both of their leaders, the Koumintang and Communist Party of China fled west into the deserts of Xinjiang and the Ma Clique. To this day, the remnants of the KMT and CPC lay just beyond the borders of the central government in Nanjing, harassing border patrols and engaged in constant skirmishes with the Masanobu Tsuji's forces.\n\nMa Jiyuan and the KMT 40th Army remnants under his command in Qinghai are the most active and ardent rebel group at the moment, while Zhang Zhizhong's men are preoccupied in Xinjiang dealing with both the ethnic Uyghurs and Liu Wenhui is reluctant to bear arms against the Nanjing government, Ma Jiyuan himself holds a grudge against the Japanese for the killing of his father, Ma Bufang, all he needs are weapons, ammo, and an enemy to fight. We suspect that Ma will side with Nanjing once they take up arms against Japan, but Tsuji's fiefdom acts as a buffer between Nanjing and Ma. The RND propose then, that we make conatct with Ma and dispatch a group of foreign instructors to train Ma's men before establishing arms smuggling routes through Afghanistan and Central Asia. From there, Ma will launch an all out invasion of Tsuji's realm, and hopefully one quick enough to prevent Japanese intervention."

 SGR_contact_the_supreme_commander: "Contact The Supreme Commander"
 SGR_contact_the_supreme_commander_desc: "There are several groups plaguing Manchuria: Bandits, KMT remnants, CCP partisans, Russian partisans, but chief among them is Kim il-Sung, supreme commander of the Northeast Anti-Japanese United Army. An ethnic Korean, Kim is a fervently nationalistic communist. Little is known about the man himself, all we have to go off of are a few grainy photographs from the 1920s and 30s.\n\nWe shouldn't be dissuaded however, Manchuria is home to many militias, and if our agents can make contact and his men, we would be able to bog down Japanese supplies flowing into China via Korea and the Tsushima tunnel. Once contact with Kim is established, we will expand our existing route with Ma Jiyuan to include going through Gobi desert, where Kim's men will pick up the weapons. Anti-tank launchers, rifles, MANPADs, and a squadron of commandos to train them. By the time we're done, Kim's men will be ready to storm into Korea and raise their flag over Seoul once the war in Asia begins."

 SGR_map_out_the_pacific: "Map Out The Pacific"
 SGR_map_out_the_pacific_desc: "The Imperial Japanese Navy and Army maintain several bases throughout the Pacific, the grip they hold over their side of the planet would be absolute if it weren't the American Pacific Fleet's presence in Oceania and Fortress Australia. Airbases dot the atolls, RADAR stations keep close watch for any large scale movements, and a series of naval bases keep the IJN supplied and ready for any confrontation.\n\nBut you can't change the location of a naval base like you can with a division, you can't hide an aircraft carrier like you can hide a fighter jet, and you certainly can't prevent your enemy from knowing about them. In an ocean as big and open as the Pacific, the IJN is at a marked disadvantage when it comes to intelligence. Fortress Australia can remain self-sufficient, it's an unsinkable aircraft carrier, but Iwo Jima? Micronesia? They're dependent on the infrastructure present on them and the surrounding islands to remain supplied, and now that we are in the age of the spy satellite, there is nothing stopping us from fully mapping out the IJN's active deployments throughout the Pacific. No secret will be kept, we will see all, and we will know all."

 SGR_pass_intel_to_the_americans: "Pass Intel To The Americans"
 SGR_pass_intel_to_the_americans_desc: "Our efforts in tracking the IJN's deployments in the specific ocean have so far been successful. Through a mixture of espionaage, bribery, blackmail, and real-time satellite tracking, we believe we have gathered all there is to gather concerning Japan's military in the region. But unfortunately, we can't put the information to good use ourselves, Ceylon alone is an ocean and a half oceans away which leaves us with limited options in the event of an actual confrontation, and any sabotage on our part would be of limited benefit since the main theater of combat would be in the Indian Ocean, not the Pacific.\n\nFortunately for us, the Americans have always had a bone to pick with the Japanese. America's involvement in the war against us was a truly regrettable affair, and would have never happened had the Japanese never attacked Pearl Harbor, and in fact it was Japan who benefitted the most from the Akagi Accords, not us. The America public still remembers the humiliations suffered at the hands of the bloodthirsty Japanese, chief among them the Treaty Ports. The RND propose that we make contact with the CIA through discreet channels, offering to pass them all of our intelligence on the Japanese, in exchange for their promise to support the Chinese once they rise. Come Hell or high water, the Samurai will find that the Pacific was not his domain, but his prison."

 SGR_the_tendrils: "The Tendrils"
 SGR_the_tendrils_desc: "Japan's sphere of influence is massive, both in terms of the sheer number of souls under their rule and economic prowess. It is easy to miss the forest for the trees when it comes to the Co-Propserity Sphere, while China is the breadbasket and second largest economy in the sphere, Japan also extracts as much if not more wealth from its other South East Asian subjects.\n\nThe issue arises when conceptualizing an absolute worst case scenario for the Nanjing government, that being every member of the CPS staying loyal to Japan and taking up arms to supress the Chinese rebellion at the behest of Japan. There can be no doubt that if China was forced into fighting a three-front war both in the North, South, and on its coast, the Japanese would be able to starve the Chinese war machine of supplies. Our angle for Plan Rabe then should involve us sewing discontent within the Co-Prosperity Sphere against Japan rather than directly aiding China. One should never forget than one stick is easily broken, but a fasces is unbreakable!"

 SGR_the_core: "The Core"
 SGR_the_core_desc: "Japan's sphere of influence is massive, both in terms of the sheer number of souls under their rule and economic prowess. It is easy to miss the forest for the trees when it comes to the Co-Propserity Sphere, while China is the breadbasket and second largest economy in the sphere, Japan also extracts as much if not more wealth from its other South East Asian subjects.\n\nYet we shouldn't neglect to remember that China is an economic juggernaut more than capable of standing on its own two feet now that Gao Zongwu's reforms have been implemented. China will likely be able to sway several critical members of the Co-Prosperity Sphere to its side on its own, further weakening Japan economically. Our main concern should therefore be making sure China is able to throw around its weight as the Asian Dragon against Japan, to this end we will make contact with Gao Zongwu directly and offer to aid him and the NRA in their struggle, whether it be with material, intelligence, instructors, or propaganda. The Teuton will be the one to help the Dragon swallow the Sun."

 SGR_the_east_is_red: "The East Is Red"
 SGR_the_east_is_red_desc: "The East is red with anger, the dominoes are finally in place, ready to begin toppling one after another at the slightest application of force. The KMT remnants in Qinghai stand at the ready, prepared to reunite with their once sworn enemies in Nanjing. The NAJUA wait for the signal to arrive, prepared to come down with the fury of a million men upon Manchuria. And in Nanjing, the clock moves closer to midnight by the minute.\n\nWe have done all we can to set the Japanese up for defeat from aiding gureilla rebels to even reaching out to the Americans. We can't be truly certain of what will happen once the signal is given from Nanjing, perhaps the Japanese will burn China to the ground, scorching the Dragon with the heat of the Sun. Perhaps, the Dragon will reclaim its place as the master of Asia. Or perhaps the Dragon will enrage the Sun so much, that it shall scorch the whole Earth with the power of a million suns. Regardless, all we can do now is simply wait."

 SGR_the_greater_of_two_evils: "The Greater Of Two Evils"
 SGR_the_greater_of_two_evils_desc: "Our plans for the other superpower are in motion, the RND has been expanded, and our enemies are none the wiser to it. As we vigilantly stand guard and watch our enemies like hawks, our minds can't help but turn to the two greatest threats barring the two other superpowers: Russia, and Burgundy.\n\nRussia is a mystery wrapped inside an engima, just a little over 10 years ago we were bombing them back to the stone age like West Africa, but now they have pieced themselves back together and now pose a realistic threat to our ambitions. They will almost certainly attempt to reclaim our Eastern holdings from us, and should they succeed, it might spell the end for the Reich as we know it.\n\nThe Ordenstaat on the other hand is an enemy we know all too well, for the Russians may be our enemies but that was to be expected the moment we crossed the border all the way back in '41. But Himmler? Through treachery, betrayal, and sheer brutality, he acquired his own fiefdom right across the border from our Vaterland in the heart of Europe, and poses a much more dangerous threat given Burgundy's extensive intelligence apparatus.\n\nWe are then left two options as proposed by Wessel and the Wehrmacht: Unternehmen Rot is the classified battleplan for a war with Russia, consisting of fortifying the borders, preparing for the inevitable invasion, sabotaging the Russian military, all safe and simple procedures overall. Unternehmen Schwarz, however, is the battleplan for an invasion of Burgundy. Only discussed as a hypothetical in the past due to the threat of Burgundy's nuclear arsenal, with the RND now strengthened and expanded, we could temporarily disable Burgundy's nuclear arsenal for long enough to be able to launch an invasion of Burgundy and topple the Shadow State once and for all. The decision, though, rests with the Fuhrer..."

 SGR_the_devil_to_the_west: "The Devil To The West"
 SGR_the_devil_to_the_west_desc: "Enough is enough, the time for action is now.\n\nUnternehmen Schwarz has been overhauled and expanded through a joint OKW-RND committee, and after a long period of debate and planning, the final plan has been submitted to the Fuhrer. The comitee says we can take one of two courses of action, one, would be to expend all of our assets inside Burgundy to knock out their electrical grid, disabling their early warning systems, RADAR installations, and no doubt their missile silos, giving us just enough time to blitz to Ost-Paris as if it was 1940 all over again.\n\nTwo, is to attempt to bring down Burgundy from the inside. We know that Himmler has purged many of his subordinates over the years, Pohl and Ribbentrop to name a few deaths we've been able to confirm, but there are those within the Shadow State who either for their own sake or humanity's, are willing to cooperate with us in bringing down Himmler. All we need to do is find our ace in the hole.\n\nIf we choose to destroy Burgundy from within, we will be spending precious time while the Ordenstaat marches closer and closer to its ultiamte goal. If we choose to strike hard and strike fast, we will be gambling with the very fate of the world. The Sword of Damocles hangs over us, edging closer and closer by the day..."

 SGR_infiltrating_the_shadow_state: "Into The Heart Of Darkness"
 SGR_infiltrating_the_shadow_state_desc: "The order has come from on high: The RND is to pursue a covert course of action regarding Himmler's fiefdom. Open military action against the Ordenstaat has been deemed too dangerous to attempt while the Burgundian chain of command remains intact, and now it's up to flip the script on Himmler using his own tactics.\n\nThankfully, our earlier infiltration efforts of Burgundy have been more successful beyond our wildest imaginations, the information dossiers on Himmler and his inner-circle have been updated, expanded, and enhanced with more modern information, and we know far more about the Ordenstaat than we did in 1962. We will have to discover sympathizers within the Ordenstaat in order for our plan to succeed, for there's no way we can break Burgundy without an ace in the hole to shoot down that dancing dervish of a chicken farmer."

 SGR_the_good_doctor: "The Good Doctor"
 SGR_the_good_doctor_desc: "Unternehmen Schwarz has just struck gold. Our agents have made contact with Adolf Eichmann, Himmler's second-in-command, and to our surprise the good doctor has offered to help us take down Himmler, providing us with an updated dossier on Himmler and the rest of his inner circle. Utilizing his position and connections within the Ordenstaat, Eichmann will subtly engineer favorable conditions for our agents to get as close to Himmler, allowing us to kill the Reichsfuhrer and storm into Burgundy once and for all.\n\nNeedless to say, the Schutzstaffel's legacy is one of blood and terror, a black stain on the NSDAP's spotless record, and Eichmann especially so given that the Fuhrer denounced him and the rest of the Burgundian higher-ups after the Burgerkrieg. If word got out that we were cooperating with Eichmann, it would be disasterous optics-wise, but the only people who could leak this to the general public are the agents involved and a few select people in the Fuhrer's inner-circle, and thankfully they know what is truly at stake. If Himmler catches wind of our efforts, then he may act rashly..."

 SGR_kicking_down_the_door: "Kicking Down The Door"
 SGR_kicking_down_the_door_desc: "The order has come from on high: The Wehrmacht is to be placed on full alert for the execution of Fall Schwarz. Time is a luxury that we do not have on our side, every day that goes by where Himmler remains unmolested is a day where Burgundy continues to engineer chaos throughout the world using its  global web of connections. The time has come for us to bring the hammer down on the Shadow State.\n\nOur agents embedded within Burgundy are doing their best to gather as much intel on Burgundy's nuclear arsenal as possible before we give the green light to invade, while the Wehrmacht area slowly moving to the Atlantic coast in Holland under the pretext of a air-land-sea military exercise to rattle our saber against the Americans. In order to keep up this ruse, we've kept the Eastern garrisons at their positions in order not to alarm Burgundy too much. It's time to show Himmler that his spies won't do any good against the German war machine."

 SGR_collapsing_the_rotten_structure: "Collapsing The Rotten Structure"
 SGR_collapsing_the_rotten_structure_desc: "An invasion of Burgundy is out of the question if Himmler retains full control over his nuclear stockpile and delivery means, without his nuclear warheads the Reichsfuhrer knows full well that he is vulnerable. But Burgundy is an unstable state, held up only by the sheer brutality of the Burgundische-SS and the last of the collaborator legions, SS-Langemarck, spurred by our operatives' discovery that Burgundy was shaken by a recent famine.\n\nFor all of Burgundy's efforts to remain stable, the state remains nothing more than an open air prison, the souls of the people living there have been crushed through the endless monotony of laboring for Himmler and the sheer hopelessness of the Ordenstaat, but what if we were to shake up their routines? Rodomo is the largest slave district within Burgundy, and all it takes is one sudden and surprising occurence to whip the slaves there into a frenzy, such as... A power outage.\n\nThe RND will undertake a large scale and coordinated sabotage operation throughout Burgundy on the same day as our invasion, disabling concentration camps, surveillance systems, communications, and Burgundy's nuclear delivery means. The RND estimates that we will have, at most, a month to capture Himmler and secure the various missile silos throughout Burgundy before the Burgundians are able to bring about a §rthermonuclear holocaust.§"

 SGR_fall_schwarz: "Unternehmen Schwarz"
 SGR_fall_schwarz_desc: "The time has come to finally put an end to Himmler's abomination. Our operatives are tuned into their designated frequencies, awaiting orders from number stations all the way in Ostpreusen. The Wehrmacht is standing by, carefuly maintaining the ruse of a military exercise against the Americans. The Volkischer Beobachter keeps printing its daily issues, maintaining an elaborate cover of business as usual for the world at large.\n\nHow little they know.\n\nWe have to make haste, delay any longer and Himmler will start to catch on, delay any longer and our Burgundian assets will be compromised, delay any longer and people will start asking questions. No, we must act now, not only for the Reich, for the oppressed peoples under the Black Sun, but for all of Humanity as a whole. We will prevent the Clock from ticking to Midnight."

 ### The Bear to the East dynamic loc
 SGR_the_bear_to_the_east: "The Bear To The East"
 SGR_the_bear_to_the_east_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nThankfully, Russia remains divided for now, and it will hopefully remain divided for the forseeable future until we can complete our preparations for their inevitable invasion of the Eastern administrations. For now, we just need to let the Russians kill and grind each other down until we are ready.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_communist_zhukov_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nIt seems that, much like in Barbarossa and the West Russian War, the Russians have fallen back into degenerate Judeo-Bolshevism. Marshal Georgy Zhukov stands at the head of a reunited Soviet Union, and armed with the experience of the West Russian War plans on crossing the border with us as he did 20 years ago.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_communist_tukhachevsky_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nIt seems that, much like in Barbarossa and the West Russian War, the Russians have fallen back into degenerate Judeo-Bolshevism. Marshal Mikhail Tukhachevsky stands at the head of a reunited Soviet Union, and horrifyingly transformed the Red Army into a force to be reckoned with, even authorizing the use of chemical weapons ont he battle field.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_communist_vasilevsky_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nIt seems that, much like in Barbarossa and the West Russian War, the Russians have fallen back into degenerate Judeo-Bolshevism. Marshal Vasilevsky and his Mongol hordes emerged out of Tuva and Western Mongolia, eventually prevailing against the other contendors in Russia. To the best of our understanding, they seem to follow a strange ideology of socialist military democacy.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_communist_tyumen_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nIt seems that, much like in Barbarossa and the West Russian War, the Russians have fallen back into degenerate Judeo-Bolshevism. General Secretary [ISH.GetLeader], advocating a strain of communism based on the ideals of the late Joseph Stalin, has massively expanded Russia's industry through heavy handed measures and poses a real threat to us military.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_communist_generic_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nIt seems that, much like in Barbarossa and the West Russian War, the Russians have fallen back into degenerate Judeo-Bolshevism. Surprisingly, they aren't led by the veterans of the West Russian Revolutionary Front, but the remnants of the CPSU under [SOV.GetLeader]. Hopefully this means that they will trust the words of their bureaucrats over their generals.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_democratic_generic_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nThe Russians have thankfully scorned Bolshevism this time around, but have replaced it with slavish democracy. Whether they are actually democratic or not is not the real concern, what is the real concern is that even if they only maintain a veneer of democracy, they have to give their citizens more liberties to maintain it, allowing us to demoralize their own populace and undermine their war effort.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_fascist_generic_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nPerhaps in a vain attempt to imitiate us, the Russians have scorned Judeo-Bolshevism and instead replaced it with their own style of fascism. Unfortunately, this might be to our detriment as, opposed to a democratic or even communist state, the fascist mode of governance gives the Russians more power to silence internal dissent and quickly issue orders from on high.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_monarchist_generic_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nUnable to face the future and seeking refuge in the past, the Russians have reunified under a monarch. With a king at the helm, the Russians have a strong figurehead they can all look up to for encouragement and morale, and one that can quickly mobilize the new Russian state at that.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_despot_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nBeffiting their slavish nature and their propensity towards despotic rule, the Russians have opted to be ruled by a strongman dictator who rules with an iron fist and does as he pleases. While not exactly the best scenario for us, it certainly is better than a fully centralized fascist state or the veterans of the West Russian Revolutionary Front.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_serov_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nParadoxically following \"Ordosocialism\", a disgusting incestous union of Bolshevism and fascism, the Russian state under Ivan Serov has rapidly industrialized and united Russia under a platform of Russian nationalism. Their nationalistic fervor will hamper our attempts to undermine their war effort through propaganda as they will almost certainly use minorities as scapegoats.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_vagner_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nIn a disgustingly pathetic display, the Russians have christened themselves \"Aryans\" under the rule of \"Fyurer\" Gutrum Vagner, current real name unknown, and have reunited Russia under the banner of the \"Russkiy Reykh\". Thankfully, most other Russians have not taken part in their imitation of us, and should provide ample opportunity to undermine the Reykh from the inside.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_velimir_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nRather forebodingly, the Russians have unified under the banner of \"Velimir\", real name unknown, who has declared that Slavs are the true Aryans and that the Germans are actually Semites. While we would dismiss this out of hand, this \"Hyperborea\" possess nuclear weapons and ambitions for conquest beyond just Moscow. They will not stop at Moscow, no, they will go all the way to Germania and butcher our people if we fail.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_yazov_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nThe current Russian regime under \"Glavkovrekh\" Dmitry Yazov expresses an intense hatred of Germany, and preliminary reports indicate that they have stockpiled a large amount of nuclear, biological, and chemical weapons for use against us. The most horrifying of all, our agents have told us that Yazov's Russia is centered around \"The Great Trial\", a war to completely wipe out the German people, if necessary through nuclear war.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_gumilyov_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nThe newly reunified Russia now follows the ideology of \"Eurasianism\", the brainchild of their current leader lev Gumilyev. Gumilyev's state is extremely authoritarian and thus can quickly make decisions at his command, and their call for \"Eurasian liberation\" will likely inspire resistance in even the non-Slavic minorities of the East.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_SBA_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nSurprising even our own analysts, the new Russia has been unified undedr the Siberian and now Russian Black Army, an anarchist organization originating out of Western Siberia. Of course, they pledge allegiance to the Jewish cause of anarchism, with their territory home to all manner of hedonism, debauchery, and sexual immorality.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_men_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nAlexander Men and his cadre of priests seem to follow a vision of utopian, almost anarchic Christian socialism with great freedom for the various peoples of Russia, even the ethnic and religious minorities. While Men might speak of forgiveness, the soldiers in his army will no doubt seek to exact revenge on our people living in the East.\n\nThe battle for the East will be bloody, it will be brutal, with little to no holds barred on either side. 30 years of occupation have instilled a great hatred of us in the enemy, and while we reformed and cleaned up the Wehrmacht, we should expect no quarter, and thus neither should he. We beat the Russians once in '41, and again in the 50s, and we'll beat them again.\n\nThis time for good."

 SGR_the_bear_to_the_east_taboritsky_desc: "The question of who to focus our efforts against was quite obvious from the beginning. While Himmler and his lackeys might have nuclear weapons, and may be able to utilize their intelligence agencies to further their aims whatever they may be, they can't destabilize our regime majorly. But Russia? If the Russians drive us out of just Moskowien and Kaukasien, the results will be catastrophic for our economy, perhaps beyond even the crash of the 1950s or the Oil Crisis.\n\nWe have had to expend several spies in order to acquire this information, but we now know this: This new Russia is not a mere regime... It is Hell on Earth. Sergey Taboritsky, the \"regent\", claims to be ruling until Tsar Alexei who was murdered over 60 years ago returns, and has unleashed the most brutal reign of terror ever seen in history. Our agents who survived tell us that entire areas have been depopulated, scorched, devoid of even animals and plants.\n\nTaboritsky will no doubt unleash his reign of terror on the East without regard for the native Russians and Slavs, one can only shudder at what he will do with his vast arsenal of chemical and biological weapons if he reaches Germany proper. We are not fighting just for the survival of Germany, no, we are fighting devils in the shape of men, men who would watch the world burn for their sadistic goals. We are fighting for the survival of Europe, of the world... Of Humanity.\n\nGod save us if Taboritsky wins."

 SGR_the_bear_to_the_east_after_midnight: "After Midnight"
 SGR_the_bear_to_the_east_after_midnight_desc: "After a sustained period of no communication bar only a single radio broadcast, the news escapes Russia has shocked and horrified us: Sergey Taboritsky, regent of the Holy Russian Empire, has died, and his reign of terror has come to end. Reports from agents and teams on the ground indicate that Taboritsky's regime has collapsed, but his troops didn't go down without a fight and made wanton use of chemical weapons, rendering large areas of Russia uninhabitable.\n\nRussia has been shattered into a million different pieces, with various warlords taking control over various regions. The living conditions in this new warlord era can only be described as dreadful, even worse than those at the height of our bombing campaigns. From mad soldiers thirsty for revenge against our Reich, to Taboritskyite remnants, to the supposedly returned Alexei and most horrifying of all literal Satanic cultists, Russia has been broken beyond all repair. Cautious celebration and silent sympathy are only a few emotions found among our government, as noone knows what to truly make of all this, but for now we will stay vigilant and watch the border. Russia may have fallen, but that doesn't mean we should let our guard down."

 ### End of Russia dynamic loc

 SGR_cloak_and_dagger: "Cloak And Dagger"
 SGR_cloak_and_dagger_desc: "There are two ways we could go about preparing for the inevitable war with Russia. The first would be to hunker down, expand the Ostwall, adopt a defensive approach and hope that we will be able to wear down the Russian war machine until it finally runs out of fuel and we are able to acquire favorable peace terms or push further into Russia. The second would be to adopt an aggressive and offensive approach immediately, where the RND will undertake a campaign of sabotage all across Russia, primarily aimed at their military and supply networks.\n\nWhile choosing to stay on the defensive might be safer, if Russians break through the Ostwall and Moskowien, there will be nothing separating them from the steppes of Ukraine or the forests of Belarus, and that's not even taking into account the economic devastation that will be wrought primarily on our Eastern holdings. If we must fight a war, then we must keep the fighting on our soil to a minimum and instead take the fight to the Slavs. They no doubt have delusions of reclaiming the whole East from us, but if they were to find themselves being the ones invaded public support for the war on their side will crumble. It will be a risky play, and if it fails the consequences could be catastrophic, but it is a risk worth taking."

 SGR_implanting_our_agents: "Implant Our Agents"
 SGR_implanting_our_agents_desc: "The newly reunified Russia is a vast land, from the forested frontiers with Moskowien to the Bering Strait, there's a lot of empty space in-between where one could stay in for weeks and not encounter another living soul. While remote, these regions are also usually close to military bases, research facilities, and other such facilities that the Russian government doesn't want prying eyes to see.\n\nBy implanting several sleeper cells in these uninhabited areas, we will be able to use them to quickly strike at areas all across Russia critical to the war effort, the most critical of all in the Siberian wilderness being infrastructure such as railways and roads. By cutting off the Russian units on the frontline from suppleis coming in from the homefront, the Wehrmacht will be able to withstand the initial Russian tsunami before taking to the offensive and thereby crippling Russian morale."

 SGR_expand_the_ostwall: "Sword And Shield"
 SGR_expand_the_ostwall_desc: "There are two ways we could go about preparing for the inevitable war with Russia. The first would be to hunker down, expand the Ostwall, adopt a defensive approach and hope that we will be able to wear down the Russian war machine until it finally runs out of fuel and we are able to acquire favorable peace terms or push further into Russia. The second would be to adopt an aggressive and offensive approach immediately, where the RND will undertake a campaign of sabotage all across Russia, primarily aimed at their military and supply networks.\n\nThe safer option in terms of conserving men and material would be to stay on the defensive, let the Russians throw themselves at us while we grind them down until they simply have nothing more to throw. Siberia is a vast land, where cities are separated from each other by vast distances and hostile terrain and weather, if we were to push into Siberia or more realistically just European Russia, we would be abandoning 20 years of built-up supply infrastructure and defensive fortifications and wearing ourselves thin when it comes to fighting partisans. We should play it safe and simply build up the Ostwall to withstand the Russian tide."

 SGR_impregnable_fortress: "An Impregnable Fortress"
 SGR_impregnable_fortress_desc: "[MCW.GetName] is a hostile land. Years spent fruitlessly trying to get Generalplan Ost to work only resulted in the natives taking up arms against us and creating no-go zones for the local garrisons, and even to this day there are still dozens of partisan cells active against us in the region. These partisans, whether or not they are aligned with the current Russian state, will almost certainly take the chance to rise up against us whilst we are fighting the Russians.\n\nNeedless to say, having an entire partisan army running around behind the frontlines in the middle of a war will quickly lead to the Heer troops on the frontline finding out that their supply convoys have been ambushed by the very same gureillas that are now harassing them. If we are to hold Moskowien and even the rest of the Eastern territories, we will assign the RND to anti-partisan activities in the East, hopefully leaving our troops able to fully focus on the Russian threat in front of them and not behind them."

 SGR_and_now_we_wait: "And Now We Wait"
 SGR_and_now_we_wait_desc: "We've done all we can when it comes to the looming Russian threat. Our men are prepared for a war, our operatives are standing by, and we are carefully watching for any unexpected activity on the border. Countless war games have been played simulating a war with the Russians since we've put Unternehmen Rot into effect, but the results are still all over the place. We will only find out how truly capable we are by fighting the Russians head on.\n\nThey say no plan survives first contact with the enemy, but to them we say no unmodified plan survives first contact with the enemy. The opening hours of our war with the Russians will be the most valuable for us intelligence wise, for we will be able to thoroughly study Russian doctrine in depth and adapt our battle plans to counter their tactics. The only thing we can be sure of is that will not be betrayed from within this time around."

 SGR_our_continent: "Festung Europa"
 SGR_our_continent_desc: "Our geopolitical goals for 1980 have finally been achieved. We've taken to subverting one of the other superpowers in the Cold War from the inside, and concurrent to this we've taken action against one of the two other major powers threatening Germany directly. The RND and Wessel are, to no surprise, jubilant, while key figures in the party are quietly congratulating the Fuhrer on his geopolitical foresight.\n\nFor now we've done all we can, and it's time to turn our eyes to grander projects, but we can rest easy now knowing that not only have we turned Europe into a veritable and impenetrable fortress, and one that Hitler would be proud of at that, but also strengthened our geopolitical position immeasurably. We shall never be brought low again!"

 ### Apparatchik branch

 SGR_speak_no_evil: "Speak No Evil"
 SGR_speak_no_evil_desc: "Albert Speer.\n\nFuhrer, Architect, Minister of Armaments.\n\nBetrayed by the Gang of Four, by Oberlander, by Gehlen, all of them tried to stab him in the back, and all of them failed. Speer has descisively reshaped Germany and National Socialism, and as the old is done away with, the new must adapt so that it might not be replaced itself.\n\nThe Apparatusen are not so much led by one person as much as they are led by National Socialism itself, it just so happens that the Fuhrer is the one who defines National Socialism. Where the Sicherheitskraten are pragmatic in doing whatever it takes to defeat Germany's enemies, and the Technokraten are likewise pragmatic in bending the ideology to fit the needs of the party and the economy, the Apparatusen are the idealists who see themselves as the same men who participated in the Beer Hall Putsch 50 years ago.\n\nFor the Apparatusen, Reformed National Socialism must not and cannot be compromised, after all, did Hitler compromise with Poles? Nay, he demanded the unconditional return of all German territory at once. The danger, they say, to National Socialism comes not from the Americans or Japanese or event the Russians, but from within, from our own carelessness and pragmatism. There can be no compromise, for they must build a Reich Hitler would be proud of."

 SGR_for_the_volk: "For The Volk"
 SGR_for_the_volk_desc: "What does it mean to institutionalize a system of government? One might say that it's the same thing as implementing a system of governance, but there is a difference between having your ideology held up at bayonet point by the enforcers of those with a monopoly on violence, and having the people wholeheartedly support your system and believe in its ideals. America, for example, is a nation with an institutionalized ideology, and Latin America, with it's penchant for military dictatorships, is one where power comes from force of arms.\n\n40 years of continued NSDAP rule have reshaped Germany, but National Socialism was never truly institutionalized, it was only held up by our monopoly on violence and Hitler's cult of personality. It's only when the Fuhrer began implementing his reforms that the people began to support National Socialism not because of any leader or the riches it brought them, because of its ideals. If National Socialism is to survive into the 21st century and beyond, we must make sure that it survives not by force, but by the will of the people."

 SGR_revolutionizing_mass_media: "Revolutionizing Mass Media"
 SGR_revolutionizing_mass_media_desc: "There once was a time where people had to travel to hear their leaders speak, then that ended and it was replaced by the time where people could hear their leaders speak to them in the comfort of their own homes, but then that era also ended and was replaced with the one where they see their leaders speak to them right from the comfort of their sofas.\n\nIn America, the 24 hour news cycle is beginning to revolutionize mass media and propaganda, a constant 24/7 stream of what you want the people to hear, a veritable dream for any aspiring propagandist, and all they need to do is just tune in. The methods of ideological mobilization are intrinsically linked with those of media dissemination, and if we wish to institutionalize National Socialism, then we will have to make sure the cameras rolling constantly."

 SGR_bread_and_circuses: "Bread And Circuses"
 SGR_bread_and_circuses_desc: "The oldest method of keeping the people you rule over happy is so simple, timeless, and ingenious that even the Romans had perfected it: Give them bread and circuses. A happy populace, is a complacent populace, an entertained populace, is a populace who will be likely to support you. For all the various theories on the psychology and mentality of the masses, this one simple idea has proven fool proof.\n\nThe people don't want to hear about some war in a distant land, that's for the commanders to worry about, instead they wanna see the latest soap opera. In order to keep a people happy, you steer them away from politics, but when they're mad? When they're afraid? You show them our boys getting killed by brutal savages overseas, you show them fifth columnist students being put in their place by the boys in blue, you show them the ideological vanguard holding up everything they know.\n\nAnd then they'll start thinking \"How can I help?\""

 SGR_political_education: "Political Education"
 SGR_political_education_desc: "Time is the ultimate equalizer of all things, as it marches on it and claims those whose time has come, it makes no distinction between German and Slav, activist and apparatur, Fuhrer and pauper. As the old die off, the young take their places, students turn into doctors, teachers turn into pensioners, pensioners turn into the ones families mourn.\n\nAs time passes, a political ideology becomes more and more institutionalized among the people as those who remember what came before it shrink in number. By making certain strategic changes to our educational curriculum, we can make sure the children of tomorrow have unwavering faith and trust in the Fuhrer, National Socialism, and the NSDAP."

 SGR_new_decade_new_problems: "New Decade, New Problems"
 SGR_new_decade_new_problems_desc: "As we march on through the 70s, the flaws in Hitler's 1946 constitution are becoming more and more apparent. The constitution might have been a good fit for the opulent and decadent golden decade of the 40s, but after the chaotic 50s, the tumultous 60s, and the unstable early 70s, it's clear that changes have to be made eventually.\n\nStudents, militarists, conservatives, liberals, and all manner of other subversives thrived under the '46 constitution, partly beacuse Hitler didn't bother to set up any institutional safeguards against such elements in the '46 constitution. If we wish to save National Socialism from decay, we will have to create a new constitution, and one built to last."

 SGR_a_new_constitution: "A New Constitution"
 SGR_a_new_constitution_desc: "The time has come for us to draft a new constitution for the Reich. There are several ways we could go about this, but the one thing we can all agree on is that the constitution should ideally define what National Socialism is. The Fuhrer has already decided that he will compose a majority of the new constitution, and while some may silently be disappointed that the party will not take an active part, it is for the better.\n\nUnfortunately, the Apparatusen and the Technokraten are already lobbying for Speer's favor, both hoping to define what Germany will be like for the forseeable future. The Apparatusen are favoring a much more conservative and defined definition of National Socialism, and the establishment of a substantial safety net for German citizens, while the Technokraten are favoring a much more fluid definition of National Socialism and some token social reforms. We must make our decisions carefully, for this constitution will define Germany for decades to come."

 SGR_die_speer_verfassung: "Die Speer Verfassung"
 SGR_die_speer_verfassung_desc: "The new constitution has been drafted and it is now been put up for a vote in the Reichstag. The Fuhrer has taken great care to ensure the new constitution serves Germany's needs and ensures the survival of the Reich for decades to come. The Fuhrer himself will sign the constitution on international live television to put into effect for propaganda purposes, ending one chapter of the Reich and beginning a new one."

 SGR_for_the_party: "For The Party"
 SGR_for_the_party_desc: "The National Socialist German Worker's Party is the nucleus of Germany. While the RND might work to keep Germany safe, and the Wehrmacht stand watch day and night for any threats to the Reich, it is the NSDAP which defines what the Reich and National Socialism even are. It's a great shame, then, that the party has been traditionally filled to the brim with those opposed to the Fuhrer and his goals.\n\nBut that's all in the past, and the party is presently united behind the Fuhrer and his agenda. With the party on our side, we can begin giving them greater freedoms to nurture the NSDAP as a force to keep Germany strong. After all, men are forever mortal no matter what they might do, but institutions and ideas live on forever."

 SGR_little_red_book: "The Little Red Book"
 SGR_little_red_book_desc: "While it's essential that we nurture and strengthen the party as an independent institution so that it can survive on without the Fuhrer, we also shouldn't neglect the local regional NSDAP administrations. After all, it's from the regional Gaus that the NSDAP draws its pool of cadres from to elevate them to higher office.\n\nTo this end, we will issue the \"Little Red Book\", essentially a list of guidelines, definitions, and other such things related to National Socialism and administration in general, to the local NSDAP regional administrations to act as a sort of general guide book on National Socialism. Of course, we should also encourage the local Gau officials to apply their own critical thinking skills over following the book blindly, lest they grow too ossified to adapt."

 SGR_freedom_of_debate_unity_of_action: "Freedom Of Debate, Unity Of Action"
 SGR_freedom_of_debate_unity_of_action_desc: "One of the great errors of the past was the NSDAP's blind subservience to the Fuhrer under the principle of Fuhrerprinzip. It placed too much emphasis on the Fuhrer's will and not the party's collective pool of experience, thereby placing too much importance on one man, and we saw how that turned out in the Burgerkrieg.\n\nThe NSDAP party sessions from now on will be much freer in terms of freedom of debate, members in attendance should be free to voice their concern, opposition, support, questions, or ambivalence to any policy without fear of repurcussions in order to foster the exchange of ideas. However, once a proposal is voted on and passed, the whole of the party and the state must fall in line and implement it to the best of their abilities."

 SGR_die_best_partei: "Die Best Partei"
 SGR_die_best_partei_desc: "Through our reforms, the NSDAP has finally been transformed from a mere rubber stamp on the Fuhrer's policy to an organ of the state intimately involved in decision making and steering the course of the Reich. The change is readily apparent, in Reichstag sessions where once members would have been afraid to voice their opinions for fear of expulsion, there is now a continous flow of ideas and different opinions, and in the Gaus the administrations are more efficient than ever before.\n\nThe Japanese and Americans are weak, one serves a mere man masquerading as a God and the other serves the ever-hungry Antichrist of Capital masquerading as a God. But us? We serve neither man nor greed, we serve an idea higher than us; National Socialism, and National Socialism is the Party, and the Party is Germany."

 SGR_the_question_of_germanization: "The Question Of Germanization"
 SGR_the_question_of_germanization_desc: "Genrealplan Ost represents the greatest and worst excesses of the old Reich and the conservatives. In our pride and hubris we thought we could turn the East into an extension of Germany, paying no thought to how we would get the millions of people living there to go along with it quietly or even how we would Germanize them, and we were wise to drop Germanization efforts in the 60s.\n\nBut the Slave Revolt exposed just how vulnerable we were to a native revolt, even one that was sparked by a mere economic crisis. We watched as several settlements full of dissatisified Slavs took up arms and show trials were held against German settlers even if against the wishes of Brandt and the Revolt's leadership. Would the Revolt have been as powerful if we had successfully Germanized some of the East?\n\nFrom here on out, we need to answer the question of our relationship with the natvies. We could either begin Germanization efforts once more, smaller in scope but with more resources and with a lighter touch when it comes to the natives, to ensure that there is a buffer between Germany proper and the wild East. Alternatively, we could attempt to reconcile with the natives, improve their living conditions, and hope that by using the carrot they will accept our rule, something that is sure to take decades to accomplish. We must choose carefully, for the choice we make will define Eastern Europe for years to come."

 SGR_keep_things_realistic: "Keep Things Realistic"
 SGR_keep_things_realistic_desc: "There's a reason Generalplan Ost failed, and a reason that we ended Germanization back in the 60s. The people's of the East only revolted because of our harsh treatment of them, whether it be through slavery or poor living conditions. From here on out our Eastern policy will reorient towards uplifting and civilizing the natives in order to maintain stability.\n\nThrough a combination of education, propaganda, development, and strategic concessions, the Eastern territories will be be integrated into Europe proper and the natives will enjoy greater freedoms than they did in the past, no longer spoken of as some backwater frought with partisans, disloyal generals, slaves, and barbarians. Of course, this isn't to say we're going to let them run amok, but you cannot nurture a man through pain and you can't feed him with anger."

 SGR_time_is_on_our_side: "Time On Our Side"
 SGR_time_is_on_our_side_desc: "The conduct of the Wehrmacht, the Schutzstaffel, and other associated military formations during Unternehmen Barbarossa was extremely harsh to put it mildly. What should have been a crusade against Bolshevism supported by the Balts, the Belarussians, the Ukrainians, and the Caucausians turned into a 30 year long campaign of extermination, slavery, and endless gureilla warfare.\n\nRestoring the trust the natives had for us in the first few months of 1941 will be a Herculean ordeal, only compounded by the fact that the youngest adult Slav has only known us as his jailors and oppressors. But time heals all wounds, and in this case, the wounds just so happen to be the stubborn old natives who remember life before Barbarossa, and as they die off they will be replaced with a new generation of natives who will know nothing but German rule, and soon to be a result of our benevolent policies, German stewardship."

 SGR_forgive_and_forget: "Forgive And Forget"
 SGR_forgive_and_forget_desc: "Time may be on our side, but Grandfather Time does not work very fast. Even now, the youngest Slavs who have known nothing but our iron-fisted rule are only in their 30s, at the most. If we are to rely purely on time, then by the time the Eastern natives have come to accept our rule the Cold War will have likely ended, and time is a luxury we do not have.\n\nBut the masses are disorganized, susceptible to a sustained media campaign designed to steer them towards one opinion or the other. The reason why propaganda is so effective is because one side doesn't even know there's a propaganda war being waged against them. Through threatrical but ultimately meaningless gestures like putting the most corrupt officials in the territories or removing the most brutal commanders, the Slavs will come to appreciate all that we have done for them through forgiving and forgetting what happened in the past by virtue of what is happening in the present."

 SGR_an_end_to_slavery: "An End To Slavery"
 SGR_an_end_to_slavery_desc: "Slavery might have been abolished with the end of the Slave Revolt, but the conditions that native laborers and workers still endure in the Easy are deplorable and harmful to our efforts to reconcile with them. Whether at the hands of local officials or business owners all the way in Germania, the Slav still has to endure grueling conditions to eat his daily bread.\n\nOur plans for Eastern Europe involve development, not mind harvesting of resources and exploitation of the native populace. To begin improving the working conditions of the Eastern laborers, we will influence the Eastern administrations to institute several laws related to workplace safety, working hours, and minimum wage, turning the Slav from a serf to an honest worker."

 SGR_development_not_exploitation: "Development, Not Exploitation"
 SGR_development_not_exploitation_desc: "Outside of major population centers, the former territories of the Soviet Union have been largely agrarian, Bukharin's New Economic Policy saw to it that the East was only as useful as the people living on it and the resources hidden under it. While we completed some minor projects related to infrastructure and industry in the East, we never really expanded our efforts as a result of native resistance and the economic woes of the 50s.\n\nWinning over the trust of the natives won't just be achieved by merely being lenient or improving their labor conditions, but by also ensuring that the land they live is materially well off. By investing in the East and its industry, the employment opportunities for the natives will expand providing them with more income to reinvest into the Eastern economy and the wider Zollverein, transforming the East from a mere open mining pit into an integral, industrialized piece of the Zollverein."

 SGR_uplift_them: "Uplift Them"
 SGR_uplift_them_desc: "The Slavs have long chaffed under our rule, Hitler saw to it that Generalplan Ost would continue until his death, Josias saw to it that Kaukasien would become a nightmare reminiscent of Burgundy, even Kasche through his incompetence led to Moskowien falling into anarchy before it was restabilized while he fled with his tail between his legs. And yet certain elements still wondered why the Slavs didn't simply accept our rule.\n\nIt's truly a shame, really, the Ukrainians and the Baltic minorities were among some of the first populations to welcome our troops with open arms in 1941, and instead of receiving their open hand with our own, we slapped it away and doomed ourselves to a never-ending gureilla campaign. By uplifting the Slavs culturally through reconnecting them with their Germano-Varangian cultural roots, we can rid them of the effects that the Tatar-Mongol yoke had on them and reintegrate them back into Europe."

 SGR_first_among_equals: "First Among Equals"
 SGR_first_among_equals_desc: "One should not confuse our compassion for and uplifting of the Slavs as some sort of attempt at equality, the Germanic people are still superior to the Eastern natives. There's a reason that Central and Western Europe gave birth to the great institutions such as the Renaissance and the industrial revolution while the East remained the land of petty despots and serfs.\n\nThe Ostdeutsch have bravely settled the wild East in an attempt to tame it, not much unlike America's own pioneers who settled the Wild West. The Ostdeutsch councils should work in collaboration with the natives as their stewards and benevolent overseers, carefully restraining the self-destructive tendencies of the natives like a wise parent. As their wise benefactors, the Slavs will flourish under our paternalistic guardianship."

 SGR_banishing_the_tatar_yoke: "Banishing The Tatar Yoke"
 SGR_banishing_the_tatar_yoke_desc: "The Slavs weren't always so barbaric, the root cause of the backwardness of the Slavic peoples can be traced back to the Mongols and their rule over Russia in the Middle Ages. The Mongols ravaged Russia, destroying any semblance of civilization they found and imposing their rule over the rural remains, and by cultural osmosis the Russians gradually learned their barbarity from the Mongol, becoming the people they did after the Mongols lost their hold over Russia.\n\nThrough our careful administration, we have seemingly done the impossible and set the foundation for the reintegration of Russia into European civilization. We can't civilize all of the Russians, of course, Siberia alone would take the entire resources of the Pakt to properly police and extend our wise rule to, but we can civilize the territories we current hold. Perhaps one day, the future generations of Russians will spawn great thinkers who will thank us for our efforts."

 SGR_with_renewed_zeal: "With Renewed Zeal"
 SGR_with_renewed_zeal_desc: "There's a reason Generalplan Ost failed, it was too wide in scope, too brutal in its methods to actually Germanize the Eastern frontiers with any semblance of stability. Some say that GP-O like the Final Solution was completed if we had only invested enough into it, but the latter only targetted the much smaller and fragmented Jewish populations of Europe, while GP-O encompassed millions of Slavs living in an area three times the size of Germany.\n\nTo create a buffer between Germany and the wild East, efforts to continue Germanization of the East will restart, but this time we won't rampage about like mad butchers, killing every native in our path. A council of experts directly appointed by the Fuhrer will create a plan for the peaceful Germanization of select Eastern territories like Poland, Ostland and a few select regions of the other administrations. Through a combination of population transfers, cultural Germanization, and other less-than-bloody policies, we will tame the wild East."

 SGR_incentivizing_development: "Cities From Nothing"
 SGR_incentivizing_development_desc: "Russia and the wider East have always been undeveloped, even before the Mongols, Russia was a backwater compared to Germany. From the Rurikids to the Tsars to Bukharin, Russia was always an agrarian nation tilled by serfs with no concern for further development of industry or cities. Regrettably, this continued even under our own administration with the East only as useful as the resources hidden under its ground and the potential slaves living on it.\n\nWhile some might advocate we settle already existing cities, that would just create ghettoes and worsen living conditions for the already rebellious natives. The Oststadt program conceptualized by the committee envisions brand new cities built by and settled by Germans in the East, built with more modern urban planning techniques that increaase efficiency. These \"15-minute\" and \"walkable\" cities as they are unofficially called now, will serve as bastions of control and industrial centers in the sparsely populated and rural east."

 SGR_an_idea_from_the_enemy: "An Idea From The Enemy"
 SGR_an_idea_from_the_enemy_desc: "Prior to the Second World War, the Jews in the United Kingdom and wider West were hard at work trying to achieve their insidious aims. In Palestine, they came up with the concept of the \"Kibbutz\", an argicultural communal settlement supposedly centered on equality and socialism. Serving as Jewish bastions in rural Palestine, these Kibbutzim would have no doubt been utilized by the Jews in their insidious plans to ethnically cleanse Palestine of its native inhabitants had Germany been subjugated.\n\nWhile the more dogmatic among us would scoff at the idea of borrowing from the Jewry, one can't deny that the Kibbutzim were extremely effective in facilitating settlement in Palestine. Through areas like the Ukraine or Moskowien are densely populated, certain regions are similar to Palestine in how sparsely populated they are, such as Belarus with its marshes or the area around Novgorod. By stripping away much of the socialism and establishing \"Volkssiedlungen\" or People's Settlements, we will aid and improve our efforts in Germanizing the East."

 SGR_but_with_measured_expectations: "But With Measured Expectations"
 SGR_but_with_measured_expectations_desc: "We shouldn't expect to fully Germanize the East with the Holmgard Project, such an undertaking would be both unrealistic and obscenely expensive. Poland and Ostland though, with their proximity to Germany proper, the latter's status as a model colony, and the former's depopulation and small size due to Generalplan Ost, would serve as the perfect targets of Germanization.\n\nPoland has always been a thorn in our side, Hans Frank failed to Germanize it and our successive administration was briefly disbanded due to it joining the Slave Revolt. Had the revolt spiraled into an all out war, Germany proper would have been at risk. Though certain areas of Poland are sparsely populated, the cities of Warschau, Krakau and Lublin make up the bulk of Poland's present day population. Utilizing a mixture of population transfers, cultural Germanization, and German settlement, we will hopefully be able to Germanize Poland within ten years."

 SGR_a_land_without_a_people: "A Land Without A People"
 SGR_a_land_without_a_people_desc: "Belarus and the Baltic are the most successful models of Germanization and stability outside of regions we control directly such as Crimea or the formerly-Polish Gaus. Some areas of Belarus have been Germanized, namely Polesien, while minorities such as the Lithuanians have nearly been fully culturally Germanized. If there is anywhere Germanization is going to succeed, it is Poland, and unlike Poland with its stubborn population, we can do it primarily through cultural Germanization.\n\nOur first step should be finalizing the Germanization of the Lithuanians, followed by either the Germanization of the Latvians and Estonians or German settlement in the region. Belarus, though, with its substantial Slavic population and its marshy and undeveloped terrain, will have to undergo an extensive settlement and development program in order to be Germanized. Hopefully once our efforts are completed, Poland and Ostland will act as a fortified frontier against the untamed East."

 SGR_pavlovian_conditioning: "Pavlovian Conditioning"
 SGR_pavlovian_conditioning_desc: "The Slavs might have been rather uncivilized by European standards, but they did manage to produce great thinkers every now and then. Ivan Pavlov, the father of behavioral conditioning, was one of them. He managed to discover that a dog's association of a dinnerbell with food caused it to salivate as soon as the bell was rung, even if there was no food, giving birth to the field of psychological conditioning.\n\nWe can also apply Pavlov's theories and methods to the East in order to pacify the natives while we Germanize the region. Certain populations, such as the Poles, are a total lost cause, but others such as the Balts and Belarussians could come to support our rule in exchange for more token gestures like giving more autonomy to ultimately powerless native councils. Through enough conditioning, the natives will come to associate our rule with positive ideas of freedom and material prosperity, all the while they slowly find themselves replaced day by the day."

 SGR_drill_it_into_their_heads: "Drill It Into Their heads"
 SGR_drill_it_into_their_heads_desc: "Our efforts to Germanize Poland and Belarus will certainly cause discontent throughout the other Eastern Reichslands, perhaps inspiring resistance in the regions we aim to actually Germanize. Staying on good terms with the natives is critical to ensuring Germanization actually succeeds, lest our successors end up in the same position we are now 20 years later with a failed Eastern settlement policy to untangle.\n\nThe older generations for their part will fervently resist the Holmgard Project, they remember the genocidal rampage of the Einsatzgruppen throughout the East both during after the Second World War, but the younger generations will have no frame of reference, no memory of a time that they ruled themselves or when the Germans maurauded through their lands. By bombarding the native children with propaganda in their schools and on their televisions, the East will stabilize with time as they age and their parents die off."

 SGR_smashing_the_tatar_yoke: "Smashing The Tatar Yoke"
 SGR_smashing_the_tatar_yoke_desc: "The Russians weren't always so uncivilized, perhaps at one time they were like the ancient Norsemen of old, but all of that changed when they were subjugated by the Mongols. The Mongols imparted onto the Russians the same thirst for blood that saw Baghdad reduced to ash, and while the Mongols collapsed and retreated back to Mongolia, the Russians expanded in all directions and influenced the various smaller nations of the Balkans and Eastern Europe.\n\nIt wasn't until Operation Barbarossa was Russia subdued, and in part due to our own admittedly extreme policies, the Russians grew to hate our rule. But all of that has changed now, Russia is a land to be tamed, civilized, and settled, a land that will rejoin Europe once the Tatar yoke imposed upon it nearly 600 years ago has been smashed. Our work will be long, and it will be hard, but such is our burden to bring the light of civilization to the East."

 SGR_light_from_darkness: "Light From Darkness"
 SGR_light_from_darkness_desc: "Our opening moves in the East are finally finished, and things have been set in motion. Our work in the East will take decades to complete, perhaps even a whole lifetime, it will be frought with danger and will cost the fortune of several kings, but by the time it done we will be able to congratulate ourselves on the work we have done.\n\n(Dynamic description here depending on whether you subjugated the Slavs or Germanized the East)"

 SGR_light_from_darkness_germanization_desc: "Our opening moves in the East are finally finished, and things have been set in motion. Our work in the East will take decades to complete, perhaps even a whole lifetime, it will be frought with danger and will cost the fortune of several kings, but by the time it done we will be able to congratulate ourselves on the work we have done.\n\nThousands of Germans are now settling the fertile and untamed East, bringing civilization with them, while our companies construct roads, towns, even whole cities for them to live in. These new Ostdeutsch settlers are also developing a martial tradition, as a good number of them are former soldiers or have military experience and are well armed, ready to defend their communities from any terrorists. Even if the natives deny it, Europe has finally come to the East."

 SGR_light_from_darkness_propaganda_desc: "Our opening moves in the East are finally finished, and things have been set in motion. Our work in the East will take decades to complete, perhaps even a whole lifetime, it will be frought with danger and will cost the fortune of several kings, but by the time it done we will be able to congratulate ourselves on the work we have done.\n\nThe natives are already learning well under our wise tutelage, shedding the Asiatic aspects of their culture for the much more refined aspects of European culture. Instead of learning about the oppressive and ignorant Tsars, they learn about the Rurikids, the Varangians, and the various ethnically German Tsars such as Peter III. Though it might decades to achieve, we can take pride in our noble mission, for Europe has finally found her lost sons."

 ### Technocrat branch

 SGR_see_no_evil: "See No Evil"
 SGR_see_no_evil_desc: "Klaus Schwab is an enigma. The quiet intellectual is treated by the Technokraten nominally treat him as their leader due to his background as an engineer, even if he doesn't have the charisma of a leader, and Schwab seems to be willing to nominally lead the technocratic cause.\n\nFor their part, the engineer's supporters seem rather agreeable to Speer even if they are small in numbers and influence. The Technokraten saw what Erhard did, and despite his treachery, can separate the man from his deeds. The Germany they wish to build is a Germany where the crash of the 1950s can never repeat, where another oil crisis can never bring an end to the system, where an employer would never prefer a slave over his fellow German.\n\nNational Socialism in their eyes - beyond a few foundational tenents - is flexible and can bend to the needs of the Volk and the state. The Apparatusen might denounce them as crypto-liberals, but economically there is noone as idealistic as them, As they see it, Germany must revive its spirit of scientific discovery and megaprojects, all in service of their vision."

 SGR_rule_by_meritocracy_or_loyalty: "By Merit Or By Loyalty"
 SGR_rule_by_meritocracy_or_loyalty_desc: "When appointing government employees such as bureaucrats and civil servants, the party's mode of hiring kept changing every few years as the government's political leanings changed. Under Hitler, the vast bureaucracy preferred to hire based on loyalty, then under Speer we kept oscillating between hiring based on merit or loyalty depending on the power of the reformers in the government.\n\nAs a result of all this, there are whole batches of bureaucrats who are less-than-mediocre when it comes to their work, while there are others who are model exemplars of what a government employee should be. This has to end, we must set forwards an official policy that determines whether we will prioritize loyalty to the party and National Socialism, or skill and merit."
 
 SGR_responsible_privatization: "Responsible Privatization"
 SGR_responsible_privatization_desc: "Even though we have dismantled the various megacorporations that once held a tight grip over the German economy, we should be careful not to bring about the creation of new megacorporations reliant on the government or immoral and inefficient business policies for survival lest we bring about another economic crash.\n\nOur privatization efforts, designed to reward innovative and successful entrepenuers, are the most open to subversion by dishonest businessmen seeking to style themselves as oligarchs through corruption. By establishing a privatization oversight committee, we will make sure that our privatized assets do not stagnate under the ownership of would-be oligarchs, but grow and flourish under the stewardship of innovate businessmen."

 SGR_a_clique_of_intellectuals: "A Clique Of Intellectuals"
 SGR_a_clique_of_intellectuals_desc: "Schwab and his men aren't bureaucrats, soldiers, career party men, or even shadowy men in black, they are scientists and engineers, men of logic concerned with results and the minutia of designing a system. While the Sicherheitskraten might treat them with suspicion and the Apparatusen might treat them with contempt, it's hard to deny the expertise they bring.\n\nThe new Reichstag should be one where a member is free to discuss any issue on his mind without fear of punishment, and considering that Schwab and his faction have practical experience when it comes to the economic and scientific side of things, we would do well to foster their growth by approving the ascension of various other technocrats to the upper-rungs of the NSDAP."

 SGR_winning_over_the_party: "Mending The Rifts"
 SGR_winning_over_the_party_desc: "The Technokraten are the very antithesis of the idealistic and ideologically-driven Apparatusen. Naturally, by virtue of being more concerned with results over ideology or praxis, the Technokraten have regularly come into conflict with the Apparatusen over their ideological difference. All of this caused needless bickering within the government to our detriment.\n\nSchwab is thankfully a reasonable man, and the bickering likewise is not in his interests, and the Apparatusen will follow the orders of the Fuhrer whatever they may be. By staging a meeting between Schwab and several high ranking Apparatusen Reichstag members, we will hopefully improve relations between the two factions to the point that they will be able to properly cooperate with each other."

 SGR_keep_things_flexible: "Keep Things Flexible"
 SGR_keep_things_flexible_desc: "When taking apart National Socialism, one will find that its very core the ideology which propelled us to such great heights is really not that defined when you look at it. FOr example, the fervent nationalism we have is racial, not cultural like the Italians, and is actually much more in line with what the old Americans thought, like Benjamin Franklin who defined America as a nation for Northern European Anglo-Saxons.\n\nBeyond a few basic tenents, National Socialism should be kept flexible to our will. Is National Socialism a constantly aggressive diplomatic posture? No. Is National Socialism the complete and total subjugation of business to the state? No. Is National Socialism the foundation upon which the propserity of the German people lies? Absolutely. What benefits the German people at the moment changes with time, and so we must keep our interpretation of Hitler's ideology flexible to be able to adapt."

 SGR_effective_diplomacy: "Effective Optics"
 SGR_effective_diplomacy_desc: "The Koalition der Nationen is the Trojan Horse with which we will infiltrate our enemies. As we are faced with threats both to our West and East, the KdN will serve as an effective tool to drive international opinion against our enemies, and in the age of mass media and a \"rules-based international order\", optics matter more than anything else on the global stage.\n\nAre the Russians experimenting with and stockpiling chemical weapons? Accuse them of war crimes as opposed to our impeccable Wehrmacht. Are we being accussed of stockpiling chemical weapons ourselves? \"Well, what about you?\" Deflect it onto our enemies, or even Himmler! As the barriers between the various global blocs come down, so do the safeguards against the enemy's lies, and that is something we are all too eager to exploit."

 SGR_honeyed_words: "Honeyed Words"
 SGR_honeyed_words_desc: "As we march on through the new decade, we have to acquire a new mindset regarding our foreign policy. With the creation of the KdN and Speer's status in the international eye as \"the reformer\", we have to maintain a veneer of cordiality to the rest of world. Gone are the days when we participated in the nuclear arms race against the Japanese and Americans.\n\nOf course, this doesn't mean we'll stop supporting factions aligned with us overseas directly, it just means we will publicly maintain good relations with the other superpowers while subtly subverting them from the inside and conveniently ignoring our soldiers fighting theirs in far off lands. Detentes, cultural exchanges, perhaps even a few arms treaties here and three, those are only a few of the tools in our toolbox to keep the masquerade of peace maintained until our enemies are brought low."

 SGR_entwicklung: "Entwicklung"
 SGR_entwicklung_desc: "Research and scientific advancement benefit us all, but if they serve no actual purpose other than the pursuit of knowledge or can't beat other more conventional modes of economic planning, then they are largely useless. The Technokraten are naturally going to be disappointed as their scientific goals will not be prioritized, but we don't have the luxury of freely pursuing whatever projects we want.\n\nFocusing on industrial development will close the economic gap between us and the Americans, while the Japanese are left in the dust. Computers and their applications outside intelligence or military purposes are largely an experimental field, and we can't afford to fund every scientist who shows up to the ministry with an idea. By prioritizing practical and realistic industrial development, we will be able to ensure that our economic keeps growing with consistency."

 SGR_fueling_the_behemoth: "Fueling The Behemoth"
 SGR_fueling_the_behemoth_desc: "The German economy is absolutely massive, and up until recently was built off the backs of inefficient slaves. As we continue to expand our economy more and more, we need to set our sights on making sure that our raw material output isn't outpaced by consumer demand, as that risks creating unnecessary production bottlenecks that will jeopardize our economy.\n\nThe East, of course, is home to many resource extraction operations such as in the Caucauses, but Norway also with its rich reserves of oil hidden under the sea is a critical piece of our economy, not even counting Nordstern's status as a major trade port. In order to keep our economy fed and stable, we will have to expand resource extraction operations in the two aforementioned regions of the Zollverein."

 SGR_a_self_sustaining_system: "A Self-Sustaining System"
 SGR_a_self_sustaining_system_desc: "One of the greatest consequences of detente is globalization and the resulting creation of interconnected webs of trade across the global economy. With the invention of new production techniques and the growing need for raw resources spurred by the expansion of economies across the globe, most nations have been forced to at least trade with neutral nations politically unaligned with them.\n\nHowever if push comes to shove, we could be at the mercy of our enemies if they decide to pursue subtler means of warfare such as those of an economic nature. One can only imagine what it would be like if we were dependent on the Americans or the Japanese for electronics imports or even food! Thankfully, the expansion of our mining and oil industries is already starting to pay off, as our dependence on the global economic is beginning to lessen, giving us more freedom to act freely on the international stage."

 SGR_our_own_steel_belt: "Our Own Steel Belt"
 SGR_our_own_steel_belt_desc: "In between the dockyards of the Pacific, the corporate offices of the Northeast, and the endless corn fields of the Midwest, in the heart of the American Great Lakes sits the Steel Belt, a collection of states with economies primarily centered on heavy and light industry. If you were to buy an American-manufactured car, there's a high chance that it was made there.\n\nA prosperous peacetime economy is an economy centered on the production of consumer goods, and unfortunately even the mighty Ruhr is rather small when compared to the Steel Belt, but it doesn't have to be that way. If we were to pour a not-so-insignificant amount of money and resources into it, we could transform the Ruhr into a great center of industry to rival the biggest American factory or the most expansive Japanese shipyard."

 SGR_our_own_military_industrial_complex: "Our Own Military-Industrial Complex"
 SGR_our_own_military_industrial_complex_desc: "Isokoru Yamamoto once said that he was afraid that the Japanese had awakened a sleeping giant and filled him with a terrible resolve. While the admiral's concerns turned out to be unfounded as through German tactical genius and will we knocked Russia and the British out of the war, it is true that America is a slumbering giant, and if it were to awaken it could shake the whole world.\n\nHowever, the world is big enough for more than one slumbering giant, and while the days of the bloated Wehrmacht are long gone, that doesn't mean we should take keeping the Heer supplied for granted. In America, the military industrial complex pumps out new tanks, guns, and planes everyday for the American military, and as a result holds unprecedented sway over the politics of the country. By expanding our own military industrial sector while being careful to not let them influence our policy, we will be able to rival the Americans in military production capacity."

 SGR_redesign_germania: "Redesign Germania"
 SGR_redesign_germania_desc: "Germania is Fuhrer Albert Speer's brainchild, and would be his magnum opus if it wasn't for the reforms he instituted in the Reich. Along with the Hitler, the Fuhrer carefully designed every aspect of Welthauptstadt Germania after the Second World War, crafting a truly beautiful and marvelous city to that would make Constantine weep at how beautiful it was.\n\nBut there were some things that were... Overlooked, when designing it. For example, the city center, while an important piece of the puzzle, largely hogged resources away from other areas of the city such as residential ones, leaving them undeveloped, and we had to install expensive pumps to constantly keep the Brandenburg swamps from swallowing the city whole. Redesigning the city has quickly become the Fuhrer's pet project, and if things come together, this new Germania will truly be the capital of the world."

 SGR_the_city_of_the_worlds_desire: "The City Of The World's Desire"
 SGR_the_city_of_the_worlds_desire_desc: "Our work on renovating Germania is beginning to speed up, and Germania's elegance is finally beginning to spread beyond the city center and outwards into the rest of the city. Nature parks, office parks, shopping complexes, and several new Autobahn connections, the inflow of capital into the city is beginning to revive the high that was felt in the immediate aftermath of the Second World War.\n\nBut we have to think bigger, to set our sights on bigger projects: A brand new airport, a monument to the late Adolf Hitler and the soldiers martyred in both the Second World War and Burgerkrieg, and several brand new government buildings. By the time we're done, Germania will not just be the capital of merely Germany, Europe, or even the world, but the city of the world's desire and envy!"

 SGR_fire_and_steel: "Fire And Steel"
 SGR_fire_and_steel_desc: "Our industrial expansion project is finally getting close to completion, and we can confidently say that we have reached heights we could've only hoped to reach a mere 20 years ago! Our factories are pumped out weapons, cars, and televisions like never before, and are fed by an ever expanding supply of oil, gas, steel, iron, and more, and it's hard not to be proud of our efforts.\n\nDay by day, the gap between us and the Americans is getting closer, and while our economy expands, so do our exports to the outside world. The Americans are finally getting to know what true German engineering and manufacturing are like, and they are loving it! Even the Japanese, with their unearned pride over their economy that's only propped up by their colonies, are itching to get a sample of a nice Volkswagen car or Siemens television set. Bismarck might have once said that German unification will only be achieved through blood and iron, but we say that that German domination will only be achieved through fire and steel."

 SGR_wissenschaft: "Wissenschaft"
 SGR_wissenschaft_desc: "Germany has been a pioneer of electronics and computing for as long as anyone can we remember, after all we created the Enigma code, and we transformed Siemens into an internationally renowned corporation, and most of all created NetzRam, perhaps our greatest technological achievement since the creation of the atomic bomb. We would be fools to prioritize simple industry over the rapidly growing fields of electronics.\n\nOur scientists are already giving us charts detailing how integrating computers into our industrial sector can boost productivity massively, and Schwab's faction have already urged begun lobbying for us to side with them over the industrialists. Clearly, computers will radically change the way we interact with not only industry, but society as a whole, and we would be fools not to get in on the groundfloor of this new and rapidly growing field."

 SGR_subsidize_electronics_manufacturing: "Subsidize Electronics Manufacturing"
 SGR_subsidize_electronics_manufacturing_desc: "The other two superpowers are already making greats leaps and bounds in the field of electronics, Sony and Fujitsu are respectively duking it out for dominance of the Co-Prosperity Sphere's electronics market, while American companies both new and old such as IBM, the Apple Computer Company, and Microsoft are flourishing under the American free market capitalist system.\n\nOur current electronics sector is primarily dominated by Siemens, and while the corporation was dismantled and stripped of its worst excesses during the 1960s, monopolies stifle innovation, and in a field as rapidly-evolving and competetive as computers doubly so. To grow our electronics sector, we should cut the bureaucratic red tape required to establish an electronics company, pairing that with tax breaks and grants for companies willing to invest research in that field. Where once Siemens ruled supreme, new companies will join it to create a truly free market."

 SGR_encourage_computerization: "Encourage Computerization"
 SGR_encourage_computerization_desc: "Observations of our industrial sector during the decade have revealed that integration of electronics into the production cycle massively increases productivity and output while greatly lowering costs. However some corporations are skeptical of spending money on as risky an investment as computerization, still unable to look into the future.\n\nBut that doesn't mean we have to coerce them, after all their concerns are purely economic and not personal. If we were to begin handing out grants for corporations to computerize their respective fields, the investors and owners will undoubtedly notice the return on investment and begin computerizing on their own initiative. We profit from their success, and they profit from what is essentially free money, it's a win-win for both of us."

 SGR_students_today: "Students Today"
 SGR_students_today_desc: "Our youthful students have often times been as much a plus as they have been a detriment. While they've always been at the forefront of radical political movements like the one which propelled Speer to the Fuhrership, or the ones mainly pioneered by socialists like the late Rudi Dutschke. On the other hand, they are visionaries, able to see what what the older generations cannot, and form the rank and file of our rapidly growing scientific community.\n\nThe students are radical, yes, but who wasn't radical in their youth? The late Adolf Hitler himself was filled with a nationalistic passion during the First World War, and the Beer Hall martyrs were primarily young men, our students just need a little reminder of all the state has done for them and they'll turn out alright. We should encourage academic development concerning scientific fields, primarily involving computers, by giving out scholarships concerning such fields to the students willing to dedicate themselves to such pursuits, thereby placing ourselves one step ahead of the other superpowers."

 SGR_scientists_tomorrow: "Scientists Tomorrow"
 SGR_scientists_tomorrow_desc: "In the late 1940s and early 50s, we invested greatly into scientific advancement, some our achievements include creating the atomic bomb, putting the first satellite in space, and even putting the first man on the Moon. Not even the Americans or Japanese could stand up to our Aryan science, but crisis after crisis culminating in the Burgerkrieg chipped away at our scientific advantage.\n\nHowever that doesn't mean we should abandon all hope of regaining our scientific edge, after all only 30 years before putting a man on the Moon we were bogged down in a protracted war against the Soviets on one front and the Americans and British on the other. Increasing our R&D budget will give our scientists more freedom to experiment and uncover brand new discoveries, transforming Germany into the most advanced nation on Earth once more."

 SGR_in_service_of_capital: "In Service Of Capital"
 SGR_in_service_of_capital_desc: "Given our decision decision to prioritize research over development, our scientists are giddy over the opportunity they have been given to pursue new and experiment technologies with increased freedom over practical yet tried and tested technologies. But even now, there are still interest groups in the Reich lobbying for the scientists to focus on their own pet causes as well, namely the capitalists and the generals.\n\nWhile it is tempting to direct our scientists and engineers to work on designing new weapons, tanks, and jets, an army can't march on an empty stomach, and the food that feeds those stomachs comes from behind the frontlines. By prioritizing the interests of industry and business, we will create new production and time-saving methods alongside new technologies such as robotic arms that will revolutionize the economy."

 SGR_in_service_of_the_army: "In Service Of The Army"
 SGR_in_service_of_the_army_desc: "Given our decision decision to prioritize research over development, our scientists are giddy over the opportunity they have been given to pursue new and experiment technologies with increased freedom over practical yet tried and tested technologies. But even now, there are still interest groups in the Reich lobbying for the scientists to focus on their own pet causes as well, namely the capitalists and the generals.\n\nFactories produce guns and farms harvest food for the soldiers, yes, but those same farms and factories need resources to be produce their goods. As the decade marches on and more nations fall into civil strife providing opportunities to expand our sphere, the Wehrmacht army will need to be well-equipped with the most cutting edge equipment to beat the IJA and the U.S Army in the battlefields of faroff lands."

 SGR_the_digital_age: "The Digital Age"
 SGR_the_digital_age_desc: "As the days pass by, more and more computers can be found in our factories, in our military bases, even in the homes of some civilian enthusiasts, and the results are already apparent! Large increases in productivity, more cutting edge technologies turning from blueprints to real designs, one would be forgiven for thinking that the Wunderwaffe spirit of innovation has been revived!\n\nWhile the path is long, uncharted, and frought with many unknowns and chances to make mistakes, it's one we nonetheless have to venture down if we are to keep up in the Cold War economically. We are up against both the American free market's vast pool of experience and propensity for innovation and the Japanese Zaibatsu's almost slavish work culture and diligence, both formidable foes in their own rights, but we are Germans, we created the atom bomb, put a man on the Moon, created NetzRam, and we WILL win computer race!"

 SGR_dreams_from_the_past: "Dreams Of The Past"
 SGR_dreams_from_the_past_desc: "In the immediate aftermath of the Second World War, we were at the height of our opulence. Our grip over Europe was unshakeable, our economy was booming, Germanization was underway, and the Gibraltar Dam had been built, but eventually all good things must come to an end, the 50s economic crash made sure of that, leaving our economy in tatters.\n\nBut with things on the up-and-up once again, some are suggesting that as dirty as the word is, \"megaprojects\" in the vain of the Gibraltar Dam are the way to go. Of course, megaprojects as in megastructures like the dam itself are out of the question, both for being too impractical and not having enough return on investment. What is being suggested by our economists is something like the proposed Großraum Kontinentaleuropa project, in essence a massive development campaign costing billions of Reichsmarks that will change not only the Reich, but the entire Zollverein."

 SGR_europes_heart: "Europe's Heart"
 SGR_europes_heart_desc: "The first plan on our desk which is favored by the Apparatusen involves directing all our investments into the Reich proper and our other Western European allies. While the economists over in the ministry claim that it will be relatively low risk, it also won't carry that much of a reward given how developed industry and resource-wise Germany is already. However it would be safe from future instability in the East.\n\nWhile it may be tempting to go all in on the Eastern development plan, it should be noted that the East is nonetheless only kept in line by us through force, and will continue to be kept in line through force for the forseeable future until the natives come to accept our rule, which would likely happen after the turn of the Millennium at the earliest. With that taken into consideration, the Fuhrer has officially greenlit the Reichserneuerungsprojekt to cement Germany's status as the heart of Europe."

 SGR_mines_of_the_alps: "Mines Of The Alps"
 SGR_mines_of_the_alps_desc: "Southern Germany's mountainous terrain is home to many mines and excavation projects, apart from the East, it is here where the majority of the Ruhr's raw resources are sourced that are then used to produce the goods which both the German economy and military need to function. Even if Germany were to suddenly lose the whole East tomorrow, we would still be able to rely on the Alps to keep the economy afloat.\n\nAs the part of the Reichserneuerungsprojekt, we will subsidize and direct the expansion of mining operations in the Alps through both private and state corporations respectively to keep our ever-growing economy fed and to keep up with demand."

 SGR_industry_of_brandenburg: "Reactors Of Brandenburg"
 SGR_industry_of_brandenburg_desc: "The Oil Crisis showed just how deep and far-reaching our reliance on oil was, not just for industry but even for electricity as well. Even to this day, the invaluable experience and techniques learned during the early 70s are still with us to this day. If our economy was to experience another shortage of oil, the results would be catastrophic.\n\nThe field of nuclear power could have the solutions to our problem, though. Nuclear reactors are environmentally friendly, sustainable, and they only need a moderate amount of Uranium to output massive amounts of electricity to power whole regions, the only downsides are the massive up-keep and constructions costs, and small but the ever-present risk of nuclear meltdown. However, if we were to begin building reactors throughout Brandenburg, we could ensure the whole of Germany and maybe even the Zollverein are powered with only a few reactors."

 SGR_factories_of_the_ruhr: "Factories Of The Ruhr"
 SGR_factories_of_the_ruhr_desc: "The Ruhr is the beating heart of Germany's industry, even before the rise of the NSDAP it was here where the Kaiserreich's industrial base was centered, and while it might have been half a century since any Kaiser ruled Germany, the Ruhr still remains the crown jewel of our domestic industrial base.\n\nGiven the ever-growing needs of our economy and the constant race to keep our GDP rising, investing in the Ruhr's industry through grants, government contracts, and subsidies in our industrial sector's various corporations both new and old could expand our economy greatly and turn it into the largest industrial region not just in the the whole of Europe, but East of the Atlantic too."

 SGR_refineries_of_hannover: "Refineries Of Hannover"
 SGR_refineries_of_hannover_desc: "In the oil crisis, our economy was badly shaken just as much as our government all due to the panic in the global market after the various revolts in the Middle East which cut off the global economy from the oil of the region. If we had been a little more prepared with the oil crisis perhaps we could've weathered the storm better and not given the Gang and Brandt an opening.\n\nHannover's location on the North Sea makes it prime real estate for shipping and trade, especially with the recent discovery of oil in the North Sea. If we were to expand our synthetic oil production and international shipping operations in Hannover, we could build a large and sturdy oil industry independent of the Americans, the Arabs, or the Caucauses that will be able to ship oil anywhere within the whole Zollverein."

 SGR_our_european_allies: "Our European Allies"
 SGR_our_european_allies_desc: "While the work to revitalize Germany's status as an industrial juggernaut has been complete, that doesn't mean we should neglect our other European allies and the rest of the Western European Zollverein members. Western Europe is at far less threat of instability than the East, after all, and is already on par with Germany in terms of overall development.\n\nThe rewards we can reap from developing the West will largely be dependent on if we defended and expanded our sphere of influence in Scandanavia, the British isles, Iberia, and France. If these nations are, however, neutral or worse yet under the control of hostile powers, we will be unable to reap the rewards of developing whatever resource reserves and industrial bases they may have."

 SGR_europes_frontier: "Europe's Frontier"
 SGR_europes_frontier_desc: "The second plan invovles investing heavily into the East and any Middle Eastern allies we might have. The plan carries a high risk given the instability of the region, but the return on investment could be huge given how rich in resources and undeveloped the East is already. Additionally, if our efforts in the Middle East paid off, we could potentially build an oil pipeline in Arabia running through Persia or Turkey provided they are aligned with us.\n\nGermany and Western Europe are already very industrialized, and despite the risks involved, investing in the East could be extremely rewarding if the right moves are made. Rather than being a simple open-pit mine for the Zollverein and the Germany like it was in the past, the Fuhrer has approved the Entwicklungsplan Ostzollverein to turn Eastern Europe into an industrial titan on par with the Victorian England or the old Kaiserreich."

 SGR_the_breadbasket: "The Breadbasket"
 SGR_the_breadbasket_desc: "Ukraine has, for better or for worse, been the Zollvereins breadbasket when it comes to food production given the rich and fertile steppe soil it stands upon. Even in spite of its instability, Ukraine was the only Reichskommissariat to avoid outright revolt during the Burgerkrieg, something much to our confusion given the injuries which the now-retired Erich Koch sustained shortly before the civil war.\n\nStill, keeping Ukraine perpetually undeveloped only for its agricultural value would be wasteful and unproductive. Ukraine's value to the Zollverein should not be purely due to how much food it can grow or how fertile the soil is, but also because of the industrial value it represents. The old Soviet Union had briefly flirted with industrializing Southwestern Ukraine, and by turning Lugansk and Neukoblenz into industrial hubs in combination with developing the rest of Ukraine, we can turn that idea into a reality."

 SGR_the_mine: "The Mine"
 SGR_the_mine_desc: "The Caucauses are perhaps the most valuable piece of our Eastern holdings, and the very bedrock upon which our economy rests. We were only able to claw our way out of the Oil Crisis with the oil industry of Aserbaidschan, and that's not even taking into account the mining operations in the region related to valuable metals and minerals.\n\nDeveloping Kaukasien's resource extraction operations, particularly the oil of Aserbaidschan, will be critical to making sure the Zollverein as a whole profit from the Entwicklungsplan Ostzollverein. By focusing on the aforementioned resource extraction operations and the industrialization and development of Northern Kaukasien, Caucausia will be transformed into a firey foundry."

 SGR_the_model: "The Model"
 SGR_the_model_desc: "Ostland, primarily the Baltic, might not be as valuable as the other Eastern administrations in terms of resources like Kaukasien, or food output like Ukraine, or Moskowien in terms of strategic defense against the Siberian hordes, but it is most certainly the most valuable when it comes to propaganda and the actual goal of Generalplan Ost, that being Germanization.\n\nOstland is definitely our most stable administration by a long shot, and thus is ripe for development of its light industry and expansion of naval trade via the Baltic ports. As an added bonus, the expansion development of Ostland will also improve the living conditions of our cherished local German settlers and the Baltic German populations, while also facilitating the urbanization of Belarus's swamps and further tying it into the Zollverein."

 SGR_the_disgrace: "The Disgrace"
 SGR_the_disgrace_desc: "[MCW.GetName], is perhaps the most wasted opportunity in the history of modern Germany. In the past ur harsh treatment of the Slavs stifled collaboration with our local administrations in the past, giving birth to dozens of various partisan movements which wreaked havoc all throughout Muscovy and brought the administration to its knees after the collapse of the Eastern Reichskommissariats.\n\nAs the natives gradually come to accept our rule, whether through the carrot or the stick, the continued stabilization of Moskowien has finally given us more freedom to actually invest in the region to give it more value beyond acting as a shield against the restless Russian hordes to the East. The development and industrialization of Moskowien will be extremely expensive, but will pay off in the long term instead of perpetually keeping Moskowien in our sphere only for its strategic position, and with time our investments will turn Moskowien into an industrial citadel."

 SGR_beyond_the_east: "Beyond The East"
 SGR_beyond_the_east_desc: "As Entwicklungsplan Ostzollverein begins to wind down and come to a close, we must look beyond the East and this time to the south. While the Oil Crisis was extremely destabilizing, it was also extremely lucrative as it opened up the whole Middle East for grabs after the collapse of the Italian sphere. Like the other superpowers, we seized the opportunity and tried taking a slice of the pie ourselves.\n\nNow's the time to reap the fruits of our labor, the Middle East was rich is rich in oil and lies in an incredibly strategic location between East and West. Egypt by itself places pressure on the Italian Suez, and Yemen's position could potentially cut off trade from the Suez via the Red Sea, even the Iranians could strangle trade going to and from the Persian Gulf. If Persia or Turkey are home to friendly regimes and we were able to secure Iraq for the Ba'athists, we could potentially construct a Basra-to-Europe oil pipeline, securing our grip over the Middle East's oil, ensuring our economy is never forced to run on fumes ever again."

 SGR_the_managerial_age: "The Managerial Age"
 SGR_the_managerial_age_desc: "Our megaprojects have finally come to a close, and we're already seeing the results in the quarter reports of the Zollverein's corporations and the stock exchanges of Germany. Our economy is constantly growing and the green line just keeps going up and up without stopping, and the 1980s seem set to become our golden decade with unprecedented economic prosperity for both the common man and the state.\n\nThe Technokraten and Klaus Schwab in particular are quite pleased and have passed their words of congratulations to the Fuhrer, while the Apparatusen are eager to brag about Germany's new economic boom. The Americans are grappling with social unrest in spite of their economic issues, no doubt directed by the Judeo-Capitalist bankers for their aims, and the Japanese are dealing with the growing chaos in China placing their status as a superpower in jeopardy.\n\nWe have never been set up for as much success as we are now, if we fail now future generations will curse us for wasting the opportunity we had, but we aren't going to fail. We are going to succeed...\n\nNo matter what."

