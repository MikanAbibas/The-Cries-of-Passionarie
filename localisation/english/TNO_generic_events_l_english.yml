 #events
 ZZZ_generic.1.t:0 "End Of The Oil Crisis"
 ZZZ_generic.1.d:0 "The effects of the oil crisis are finally subsiding and the price of oil has stabilized."
 ZZZ_generic.1.a:0 "Hurrah!"
 ZZZ_balkan_war.1.t:0 "Old War New War"
 ZZZ_balkan_war.1.d:0 "In the 1950s, the trecherous and filthy Romanians had the gall to seize our rightful lands in Transylvania while the Germans were occupied in Russia! It is time we teach these dogs a lesson they will never forget!"
 ZZZ_balkan_war.1.a:0 "Those Gypsies Will Die!"
 ZZZ_balkan_war.2.t:0 "Skirmishes With Hungary"
 ZZZ_balkan_war.2.d:0 "Recently, Hungarian border forces have begun skirmishing with our garrison on our shared border. Reports of troops massing at the border have also been coming in. It is likely the Hungarians will make a play for territory soon. Likely they seek Transylvania, which they illegitamtly claim. War is only a matter of time now"
 ZZZ_balkan_war.2.a:0 "We've Beat Them Before!"
 ZZZ_balkan_war.3.t:0 "Conflict In Transylvania"
 ZZZ_balkan_war.3.d:0 "Word has reached us that the Hungarians intend to invade Romania, resuming their frozen conflict which ended in the 1950s. In recent years, Hungary has drifted back into the [GER.GetName]'s sphere of influence, while Romania has moved towards Italy. Whoever wins will not only determine the future territorial borders, but which sphere the region will fall under."
 ZZZ_balkan_war.3.a:0 "We Will Help Our Hungarian Bretheran!"
 ZZZ_balkan_war.3.b:0 "Romania Needs Us!"
 ZZZ_balkan_war.4.t:0 "The Return"
 ZZZ_balkan_war.4.d:0 "Transylvania was OURS long before the mongrel race known internationally as Romanians ever had managed to organize themselves into a state, shambolic as it is! We will crush them and seize our birthright! "
 ZZZ_balkan_war.4.a:0 "Death! Death! DEATH!"
 ZZZ_balkan_war.5.t:0 "Bulgaria Mobilizes"
 ZZZ_balkan_war.5.d:0 "Disturbing reports have arrived detailing Bulgarian intentions to seize our territory and force us into a subserviant status. It is likely they intend the same for Serbia. We must prepare for conflict and seek alliance with the Serbians."
 ZZZ_balkan_war.5.a:0 "Time To Make The Bulgar Slayer Proud"
 ZZZ_balkan_war.6.t:0 "The Bulgarians Make Their Move"
 ZZZ_balkan_war.6.d:0 "Bulgaria, traditionally an ally of the Reich, has started preparing for an offensive against both Greece and Serbia. Italy has vested interests in the region, and though not exactly the best of friends, has decided to assist the Serbs and Greeks. War once again arrives in the Balkans."
 ZZZ_balkan_war.6.a:0 "Typical of Slavs, But The Bulgarians Are Useful"
 ZZZ_balkan_war.6.b:0 "The Bulgarians Must Be Stopped!"
 ZZZ_balkan_war.7.t:0 "Alliance With The Greeks"
 ZZZ_balkan_war.7.d:0 "The Greek ambassador has recently approached us in the hopes of a formal alliance against the Bulgarian menace. We have accepted, and now we march together! The return of Yugoslavia is inevitable."
 ZZZ_balkan_war.7.a:0 "Dream No More"
 ZZZ_balkan_war.8.t:0 "Hegemon"
 ZZZ_balkan_war.8.d:0 "The week Serbs and filthy Greeks will crumble before the might of the Bulgarian army. A new age of dominance approaches!"
 ZZZ_balkan_war.8.a:0 "For The Tsar"
 ZZZ_balkan_war.9.t:0 "Romania Victorious"
 ZZZ_balkan_war.9.d:0 "With our assistance, Romania has triumphed over the German backed Hungarians. We have negotiated a peace treaty in which Hungary will cede territory to Romania and our satellite in Croatia. Italian dominance has been cemented in the region and the Germans have been sent packing!"
 ZZZ_balkan_war.9.a:0 "The Empire Eternal!"
 ZZZ_balkan_war.10.t:0 "Hungary Triumphs"
 ZZZ_balkan_war.10.d:0 "With unwavering support from our forces, Hungary has achieved a stunning victory, successfully expelling the Romanian presence from the whole of Transylvania after a fierce and protracted struggle. Leveraging our strategic influence, we have brokered a hard-fought peace between Hungary and Romania, stabilizing the volatile region under terms favorable to our interests. As part of this settlement, we have compelled Romania to relinquish control of Odessa, restoring it to Ukrainian authority and redrawing the territorial lines in Eastern Europe. Through these masterful maneuvers, we have reasserted our unchallenged dominance over the region, cementing our role as the preeminent power broker. This triumph not only strengthens our allies but also sends a clear message to all neighboring states: our will reigns supreme."
 ZZZ_balkan_war.10.a:0 "As It Should Be"
 ZZZ_balkan_war.11.t:0 "Serbia And Greece Triumph!"
 ZZZ_balkan_war.11.d:0 "The Serbs and Greeks have rolled over the Bulgarians. The Serbs have made the unprecedented move of annexing Bulgaria and declaring the restoration of Yugoslavia, while the Greeks have contented themselves with monetary reparations. Whether this situation will remain stable remains to be seen, though the Greeks appear to be eyeing Turkish lands. For now though peace has returned to the region."
 ZZZ_balkan_war.11.a:0 "Excellent"
 ZZZ_balkan_war.12.t:0 "Bulgaria Ascendent"
 ZZZ_balkan_war.12.d:0 "Bulgaria has emerged victorious in a decisive conflict, overcoming the combined forces of the Serb-Greek alliance. Through strategic brilliance and unrelenting determination, Bulgaria has not only defeated its adversaries but has firmly established dominance over its weaker neighbors. This triumph marks the dawn of a new era—Bulgarian hegemony now casts a long shadow across the Balkans. Emboldened by its success, Bulgaria has taken a bold step on the international stage, aligning itself with the Pakt, solidifying its position as a rising power in a fractured world. The echoes of this victory reverberate far beyond its borders, signaling a shift in the regional balance of power and heralding a future where Bulgaria stands as a formidable force to be reckoned with."
 ZZZ_balkan_war.12.a:0 "Good Allies They Will Be"
 ZZZ_balkan_war.15.t:0 "Bulgarian Victory In Macedonia"
 ZZZ_balkan_war.15.d:0 "Our Bulgarian allies have triumphed over their enemies and rendered them unable to continue the war. With this decisive Bulgarian victory, [ROOT.GetAdjective] influence is sure to spread and solidify throughout the Balkans. Once again [ROOT.GetName] triumphs in the great struggle between powers."
 ZZZ_balkan_war.15.a:0 "Excellent"
 ZZZ_balkan_war.16.t:0 "Hungary Triumphs"
 ZZZ_balkan_war.16.d:0 "Thanks to our generous support, the Hungarians have managed to defeat the Romanian army in detail and seize the whole of Transylvania for itself - reclaiming what was the Magyars' long ago. \n\nWith the German ally sundered we can now move in and solidify our hold over the Northern Balkans and make significant inroads against the German Reich. No doubt [ITA.GetLeader] will be pleased with this wondrous news."
 ZZZ_balkan_war.16.a:0 "A Useful Client"
 ZZZ_balkan_war.17.t:0 "Romania Victorious"
 ZZZ_balkan_war.17.d:0 "The Romanians have managed to repeat their previous successes against the Hungarian state and have managed to defeat them totally on the battlefield. The Italian patsies have been torn down and their foolish patron left to retreat back to their borders. The German Reich once again stands as the uncontested master of Europe."
 ZZZ_balkan_war.17.a:0 "As Planned"
