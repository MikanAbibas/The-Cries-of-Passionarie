 #ideas
 ZZZ_transylvania_war:0 "The Fourth Vienna "Award""
 ZZZ_transylvania_war_desc:0 "The bitter rivalry between Romania and Hungary has once again exploaded into open conflict. The Fourth Vienna Award, is a sarcastic name for the war, with the Third Vienna Award referring to the brief war between Romania and Hungary in the 50s."
 ZZZ_macedonia_war:0 "The Macedonia War"
 ZZZ_macedonia_war_desc:0 "Since the waning of the Eastern Roman Empire, the south balkans has been embroiled in regular conflict. The 20th Century has been no different."
