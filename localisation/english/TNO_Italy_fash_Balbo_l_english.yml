 ##Libya##
 
 #Show/Hide
 
 ita_balboimper_show_libya:0 "Show decisions for Libya"
 
 ita_balboimper_hide_libya:0 "Hide decisions for Libya"
 
 #Stage 1 Projects
 
 ita_balboimper_S1_project_1_libya:0 "Improve Libyan Connections to Italy"
 ita_balboimper_S1_project_1_libya_tt:0 "Though part of Italy proper, Libya has been neglected by Ciano's ineffectual rule. It is time to improve the former colony's connections to the motherland, by both sea and air.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_1_L]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P1_L]\n\n[ROOT.GetITA_balboimper_S1_airporteffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_1_libya_not_completed:0 "Though part of Italy proper, Libya has been neglected by Ciano's ineffectual rule. It is time to improve the former colony's connections to the motherland, by both sea and air."
 ita_balboimper_S1_project_1_libya_completed:0 "Thanks to an improved ferry system, and a modern airport in Benghazi removing pressure from the Tripoli airport, Libya and Italy are one and the same, never to be separated. This will pave the way to further settlement efforts."
 
 ita_balboimper_S1_project_2_libya:0 "Expand Irrigation in Coastal Libya"
 ita_balboimper_S1_project_2_libya_tt:0 "Despite what most think, the coastal regions of Libya are quite fertile, and famed for their corn, olive and date production. With enough effort, its yield could be greatly increased, bringing prosperity to both Italian landowners and native farmers.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_2_L]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P2_L]\n\n[ROOT.GetITA_balboimper_S1_irrigationeffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_2_libya_not_completed:0 "Despite what most think, the coastal regions of Libya are quite fertile, and famed for their corn, olive and date production. With enough effort, its yield could be greatly increased, bringing prosperity to both Italian landowners and native farmers."
 ita_balboimper_S1_project_2_libya_completed:0 "Finally, the Libyan irrigation improvements have been completed. A complex, hybrid system of modern artificial basins and traditional deep-ground reservoirs reduces waste to an all-time low, making sure that every spike of grain receives what its due - and not a drop more."
 
 ita_balboimper_S1_project_3_libya:0 "Strengthen Security in Southern Libya"
 ita_balboimper_S1_project_3_libya_tt:0 "Despite its great value due to the presence of large oil fields, Southern Libya is difficult to keep under control due to its sparse population, difficult terrain and the presence of Tuareg bandits. If we want to keep extracting oil in peace, we need to build and improve the road network, as well as increasing garrisons and patrols in the most vital areas.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_3_L]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P3_L]\n\n[ROOT.GetITA_balboimper_S1_roadseffect_not_completed]§BControl§! of §KIl Territorio della Libia§! will §Gincrease§! by §Y5§!.\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_3_libya_not_completed:0 "Despite its great value due to the presence of large oil fields, Southern Libya is difficult to keep under control due to its sparse population, difficult terrain and the presence of Tuareg bandits. If we want to keep extracting oil in peace, we need to build and improve the road network, as well as increasing garrisons and patrols in the most vital areas."
 ita_balboimper_S1_project_3_libya_completed:0 "Thanks to the newly fortified road network across Libya's interior, our grasp on the region has increased tenfold. Unruly Tuareg bandits now face motorized patrols and helicopter strikes and their racket over oil and supply lines has been broken. Our operations can now continue without further disturbances." 
 
 #Stage 2 Projects
 
 ita_balboimper_S2_project_1_libya:0 "Build the Nuova Balbia Highway"
 ita_balboimper_S2_project_1_libya_tt:0 "The Imperial Highway will connect all the major cities in the Empire, allowing for a fast and efficient movement of people and goods.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S2_1_L]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S2_P1_L]\n\n[ROOT.GetITA_balboimper_S2_raccordoeffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 
 ita_balboimper_S2_project_2_libya:0 "Build the Ferrovia Balbia Railway"
 ita_balboimper_S2_project_2_libya_tt:0 "The Imperial Railway will connect all the major cities and industrial centers in the Empire, allowing for a fast, efficient and cost-effective movement of people, and especially goods.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S2_2_L]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S2_P2_L]\n\n[ROOT.GetITA_balboimper_S2_raccordoeffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 
 #Stage 3 Projects
 
 ita_balboimper_S3_project_1_libya:0 "Build the Tripoli International Airport"
 ita_balboimper_S3_project_1_libya_tt:0 "A new airport in Tripoli would not only serve to connect Libya with the rest of the empire, but could serve as a gateway to Africa. Following the collapse of German rule in Africa, small countries raise their heads from the terror of bombs and see a changed world: let us be the first to reach to them, and reap the benefits!\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_1_L]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P1_L]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_1_L_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_1_libya_not_completed:0 "A new airport in Tripoli would not only serve to connect Libya with the rest of the empire, but could serve as a gateway to Africa. Following the collapse of German rule in Africa, small countries raise their heads from the terror of bombs and see a changed world: let us be the first to reach to them, and reap the benefits!"
 ita_balboimper_S3_project_1_libya_completed:0 "The Tripoli International airport is a marvel of architecture. Built in a hybrid style taking elements from both fascist rationalism and Middle-Eastern tradition, it serves as a vital trade and transportation hub between Libya and the Italian Peninsula as well as a gateway to West Africa. The connected military airport only adds to its usefulness, should anything threaten our domains in the Horn of Africa or in the Levant..."
 
 ita_balboimper_S3_project_2_libya:0 "Build New Italian Settlements in Libya"
 ita_balboimper_S3_project_2_libya_tt:0 "As of now, only coastal Libya has been properly Italianized, while the South still largely an empty desert dotted with ENI oil extraction plants and garrison outposts. The time has come to make Southern Libya Italian: the few thousand Tuaregs need not to worry - there are millions of dunes in the desert, more than enough for everyone.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_2_L]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P2_L]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_2_L_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_2_libya_not_completed:0 "As of now, only coastal Libya has been properly Italianized, while the South still largely an empty desert dotted with ENI oil extraction plants and garrison outposts. The time has come to make Southern Libya Italian: the few thousand Tuaregs need not to worry - there are millions of dunes in the desert, more than enough for everyone."
 ita_balboimper_S3_project_2_libya_completed:0 "Finally, the new settlements have been completed. ENI workers and other settlers alike have turned pockets of empty desert into rather homely places. Though the Tuaregs have not been disturbed, the increase in security forces will see that no one disturbs us in turn..."
 
 #Bonus project! ##So basically on these, have them be visible but put tooltip for the diplomatic requirements
 ita_balboimper_S3_project_3_libya:0 "Expand the Nuova Balbia Highway" 
 ita_balboimper_S3_project_3_libya_tt:0 "With Tunisia and Egypt closely aligned to our interests, it would be sensible to let them partake in our prosperity. Expanding the Nuova Balbia so that it reaches Tunis on one side, and Alexandria, Cairo and the Suez on the other will bring prosperity to all!\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_3_L]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P3_L]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_3_L_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_3_libya_not_completed:0 "With Tunisia and Egypt closely aligned to our interests, it would be sensible to let them partake in our prosperity. Expanding the Nuova Balbia so that it reaches Tunis on one side, and Alexandria, Cairo and the Suez on the other will bring prosperity to all!"
 ita_balboimper_S3_project_3_libya_completed:0 "With the twin road-railroad network linking Tunis to Suez, we have managed to create a South-Mediterranean Economic Sphere that is drawing eager investors from all parts of the world. While everyone will reap the benefits of such a wise endeavor, we will make sure to take what is owed to us!"
 
 ita_balboimper_S3_3_L_available_tt:0 "§BControl§! of §GIl Regno d'Egitto§! and §KIl Territorio del Tunisia§! are both §Y40§! or above."
 
 #Corruption decisions
 
 ita_balboimper_corruption_PP_libya:0 "Anti-Corruption Efforts in Libya"
 ita_balboimper_corruption_PP_libya_tt:0 "Corruption, embezzling and other bureaucratic malpractices must be eradicated from our project with utmost prejudice. A team of accountants and investigators will see that everything is in order, and the OVRA will teach what happens when something is not in order...\n\nThis will §Gdecrease§! §eCorruption§! in §wLibya§! by §Y0.05§!"
 
 
