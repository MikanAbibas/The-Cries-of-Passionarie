 ITA_balbo.90081.t:0 "Contingencies And Counter-Contingencies"
 ITA_balbo.90081.d:0 "After the Council of Ministers ended, Italo Balbo remained at the table to look at a few more papers, while the other participants saluted and left. All except one.\n\n"Minister," the Duce politely addressed Ugo Spirito, Minister for Economic Affairs, "Is there anything you need?"\n\n"Yes, Your Excellency," answered the mind behind the gargantuan infrastructural plan, "In fact, I intended to talk to you about a sensitive matter in private, so that it might not affect the optimism related to the plan."\n\nBalbo motioned for the Minister to explain himself, and Spirito proceeded to open a voluminous folder.\n\n"As you know, Your Excellency," he began, "The Imperial Connection has been designed so that timing and costs are balanced for an optimal result. Should nothing change from the allotted time frame, everything will be completed in time, with no additional costs."\n\nThe Duce nodded, already knowing what the Minister was going to say.\n\n"However," Spirito continued, "The Japanese stock crisis and the German civil war showed us that factors outside of our control can still affect us to a variable degree, and may jeopardise our efforts. As you might already know from your military experience, logistics is the art of achieving a result in the most efficient and economical way, but there may be a time when completing the mission is of paramount importance."\n\n"As such," he went on, pointing to a graphic, "I have taken the liberty to prepare contingency measures to speed up works, which Your Excellency may enact as needed. These measures will increase costs disproportionately, meaning that our plan will become less and less rewarding in the long term the more such measures are enacted, but as the future of the Empire hinges on its success, I believe that a smaller success is still better than a failure..."\n\n"Unless it becomes a Pyrrhic victory." The Duce completed the period. "Yes, I will keep this in mind for the future. Thank you, Minister."\n\nHaving said all that he had to say, Ugo Spirito left the room, leaving Italo Balbo to contemplate this new piece of information."
 ITA_balbo.90081.a:0 "If you prepare for failure, the worst that can happen is being right."
 
 ITA_balbo.9009.t:0 "New Contingency Measure Available"
 ITA_balbo.9009.d:0 "Minister Ugo Spirito informs us that a new contingency measure is ready to be implemented, following months of preparation and review. Work efficiency has risen since the previous policy was instituted, along with an additional 30 percent increase in project costs.\n\nHe relays that the next measure is ready to be enacted, should the Duce choose to do so. He warns, however, that such measures carry a significant risk, particularly if increased costs end up having a large impact on Italy's national debt."
 ITA_balbo.9009.a:0 "The Duce shall reflect upon it."
 
