 #Stage 3 Projects
 
 ita_balboimper_S3_project_1_northern_italy:0 "Build the Entracque Hydropower Plant"
 ita_balboimper_S3_project_1_northern_italy_tt:0 "The Entracque basin has a great abundance of small lakes, making it a perfect location for a hydroelectric power plant of unparalleled dimensions.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_1_NI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P1_NI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_1_NI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_1_northern_italy_not_completed:0 "The Entracque basin has a great abundance of small lakes, making it a perfect location for a hydroelectric power plant of unparalleled dimensions."
 ita_balboimper_S3_project_1_northern_italy_completed:0 "The Entracque power plant is a massive network of interlocking water basins both natural and artificial. Boasting hundreds of kilometers of pipes and dozens of pumps and generators, this massive behemoth of concrete, steel and water is the second-largest hydroelectric construction in all of Europe, only behind the Gibraltar Dam."
 
 ita_balboimper_S3_project_2_northern_italy:0 "Build New Towns in the Po Valley"
 ita_balboimper_S3_project_2_northern_italy_tt:0 "Despite the advancements of industry, agriculture remains a fundamental part of our economy. By founding new rural towns and boroughs in the Po Valley, we will put to good use every inch of unused land.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_2_NI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P2_NI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_2_NI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_2_northern_italy_not_completed:0 "Despite the advancements of industry, agriculture remains a fundamental part of our economy. By founding new rural towns and boroughs in the Po Valley, we will put to good use every inch of unused land."
 ita_balboimper_S3_project_2_northern_italy_completed:0 "The new rural towns have been quickly populated with unemployed men and women from the large cities, lured to the countryside by the promise of free land and a new, better life. Thanks to the new workforce and a wide effort in mechanization, agricultural production in the region is skyrocketing!"
 
 #Bonus project! ##So basically on these, have them be visible but put tooltip for the diplomatic requirements
