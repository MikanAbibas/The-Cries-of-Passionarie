 ita_balboimper_highway_completed:0 "The local artery of the Imperial Highway connects all the most important cities of the region, greatly improving traffic speed for both people and goods. Our ancestors are surely be proud of us!\n\n"
 
 ita_balboimper_railway_not_completed:0 "The Imperial Railway will connect all the major cities and industrial centers in the Empire, allowing for a fast, efficient and cost-effective movement of people, and especially goods.\n\n"
 ita_balboimper_railway_completed:0 "The local artery of the Imperial Railway connects all the most important cities and industrial centers of the region, greatly improving industrial efficiency. All trains run on time here!\n\n"
 
