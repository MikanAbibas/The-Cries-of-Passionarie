 ITA_balbo.9020.t:0 "A Partnership in the Po Valley?" #Private partnership Northern Italy (Po Valley irrigation)
 ITA_balbo.9020.d:0 "As our project to expand the irrigation works in the Po Valley, the Ministry of Finances has received an interesting proposal from a consortium of local landowners. As the new aqueducts would fall short of touching their lands, they offer to sponsor the project in exchange for a small revision that would include their arable lands in the renovations: repairing the pre-existent aqueducts on their own would be too costly, while a public-private partnership would see both interests satisfied, as they get the water they need, and we reduce the overall cost of the project.\n\nWhile a sound proposal, it is not a mystery that our bureaucrats are being pressed by local businessmen and even private citizens, who ask for "small adjustments" to the projects in exchange for money, and sometimes even for bribes. Were we to officially accept this kind of under-the-table dealings, other bureaucrats would feel justified to take it a step further, leading to an increase in corruption: as such, perhaps it would be wiser to refuse the offer, and proceed with the works as intended.\n\nWhat should the Ministry answer to the consortium?"
 ITA_balbo.9020.a:0 "We accept their offer gladly."
 ITA_balbo.9020.a_tt:0 "The private partners will cover §G[?S1_privatecost_povalley_temp|3] B§! of this project's §Yyearly costs§!. In return §Ypolitical power gain§! will be §Rdecreased§! by §R-5%§! until the project is complete."
 ITA_balbo.9020.b:0 "Our project is fine as it is."
 
 ITA_balbo.9021.t:0 "Greasing the Wheels" #Corruption in SI or efficiency malus
 ITA_balbo.9021.d:0 "In the last few weeks, our Logistical Coordination Bureau has reported minor but widespread shortages in construction materials. It is not a mystery that so many infrastructural projects are bound to strain the production capabilities of our industries, and minor inefficiencies such as these have already been factored in the overall timing of the projects: as long as they don't get worse, everything should be finished according to schedule.\n\nHowever, some of our advisors have come up with a solution that might help us save up some precious time we could dedicate to other projects. It is a well-known fact that our anti-corruption controls hinder the flux of construction materials, especially since lots of them are produced in Southern Italy, as they are closer to the dockyards in Taranto and Siracusa - and then shipped to the rest of the Empire: by cutting some red tape, delays would be solved, and work would flow smoothly and fast.\n\nAt the same time, cutting even some of our anti-corruption checks would surely lead to an increased risk of bribery in Southern Italy, as these businesses would feel entitled to act outside of the law to "speed things up" for us. What should we do?"
 ITA_balbo.9021.a:0 "Cut some red tape, we'll deal with the criminals later."
 ITA_balbo.9021.a_tt:0 "Will §RIncrease§! §eCorruption§! in §YSouthern Italy§! by §Y0.2§!."
 ITA_balbo.9021.b:0 "We won't risk it."
 ITA_balbo.9021.b_tt:0 "Will §Rdecrease§! §wEfficiency§! by §Y0.02§!."
 
