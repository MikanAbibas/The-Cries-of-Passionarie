 ITA_balbo.1010.t:0 "Walking Down the Corridors"
 ITA_balbo.1010.d:0 "(Balbo's minister for internal affairs looks satisfied at a report on the average time needed to complete internal procedures; he makes a mental note to publicly praise one of the bureaucrats responsible for the improvement, maybe even arrange the Duce to come and shake the man's hand: some envy will surely spur the others to improve themselves - and if it doesn't, well, there are always more "convincing" methods to rein in some riotous bureaucrat who thinks too much of himself...)"
 ITA_balbo.1010.a:0 ""
 
 ITA_balbo.1011.t:0 "Old Memories"
 ITA_balbo.1011.d:0 "(Spiazzi enters Balbo's office to bring a report, and sees Balbo looking pensively to an old photo. Taken by a bit of sentimentalism, Balbo shows him the photo: it is Balbo, Muti and a few other blackshirts in front of a factory, smiling; the factory has some socialist banner smeared in black paint hanging from broken windows. Balbo tells him that in the old days, things were simple: you had clear enemies (commies), and simple methods to deal with them (violence); now however, such methods are outdated and do more damage than they prevent it: if fascism is to survive, it must adapt to the times, become more subtle, and show the people that it can bring stability and prosperity - only this way will the people accept and embrace it; though painful, fascism must turn a new page, and start anew.)"
 ITA_balbo.1011.a:0 ""
 
