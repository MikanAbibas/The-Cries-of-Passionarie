 ##Central Italy##
 
 #Show/Hide
 
 ita_balboimper_show_central_italy:0 "Show decisions for Central Italy"
 
 ita_balboimper_hide_central_italy:0 "Hide decisions for Central Italy"
 
 #Stage 1 Projects
 
 ita_balboimper_S1_project_1_central_italy:0 "Expand Central Airports"
 ita_balboimper_S1_project_1_central_italy_tt:0 "Air travel is becoming increasingly important. With the difficult terrain of our homeland, a wide network of small and medium airports will surely help ease the strain on our ailing infrastructure.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_1_CI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P1_CI]\n\n[ROOT.GetITA_balboimper_S1_airporteffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 #use generic
 
 ita_balboimper_S1_project_2_central_italy:0 "Improve Trans-Adriatic Connections"
 ita_balboimper_S1_project_2_central_italy_tt:0 "The salt flats that were once the Adriatic sea are a no-man's land. Populated with refugees and the desperate, it is a poor addition to the Empire. Building official roads and railroads across the region will help the locals, prevent discontent, as well as providing links between both sides of the flats.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_2_CI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P2_CI]\n\n[ROOT.GetITA_balboimper_S1_roadseffect_not_completed]§BControl§! of The §EKingdom of Croatia§! will §Gincrease§! by §Y5§!.\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_2_central_italy_not_completed:0 "The salt flats that were once the Adriatic sea are a no-man's land. Populated with refugees and the desperate, it is a poor addition to the Empire. Building official roads and railroads across the region will help the locals, prevent discontent, as well as providing links between both sides of the flats."
 ita_balboimper_S1_project_2_central_italy_completed:0 "Thanks to the new infrastructure, the Adriatic salt flats are now safer and more welcoming for those living there. More importantly, the former enclave of Zara is greatly benefiting from a direct connection to Rome without having to pass through Croatia."
 
 ita_balboimper_S1_project_3_central_italy:0 "Expand the Ostia Trade Port"
 ita_balboimper_S1_project_3_central_italy_tt:0 "Ostia, Rome's primary port from the days of the legendary Ancus Marcius, is the primary source of food and goods for the Eternal City. Harshly hit by Atlantropa, it needs investments to return to a productive condition.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_3_CI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P3_CI]\n\n[ROOT.GetITA_balboimper_S1_porteffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_3_central_italy_not_completed:0 "Ostia, Rome's primary port from the days of the legendary Ancus Marcius, is the primary source of food and goods for the Eternal City. Harshly hit by Atlantropa, it needs investments to return to a productive condition."
 ita_balboimper_S1_project_3_central_italy_completed:0 "For the third time in two millennia, Ostia has been rebuilt near the coastline. As trade ships can once again dock near Rome, the goods will no longer clog up the vital Rome to Reggio Calabria artery."
 
 #Stage 2 Projects
 
 ita_balboimper_S2_project_1_central_italy:0 "Build the Autostrada Imperiale in Central Italy"
 ita_balboimper_S2_project_1_central_italy_tt:0 "The Imperial Highway will connect all the major cities in the Empire, allowing for a fast and efficient movement of people and goods.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S2_1_CI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S2_P1_CI]\n\n[ROOT.GetITA_balboimper_S2_raccordoeffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 
 ita_balboimper_S2_project_2_central_italy:0 "Build the Ferrovia Imperiale in Central Italy"
 ita_balboimper_S2_project_2_central_italy_tt:0 "The Imperial Railway will connect all the major cities and industrial centers in the Empire, allowing for a fast, efficient and cost-effective movement of people, and especially goods.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S2_2_CI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S2_P2_CI]\n\n[ROOT.GetITA_balboimper_S2_raccordoeffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 
 #Stage 3 Projects
 
 ita_balboimper_S3_project_1_central_italy:0 "Build the Roma Fiumicino International Airport"
 ita_balboimper_S3_project_1_central_italy_tt:0 "The old Ciampino airport is clearly no longer sufficient to satisfy Rome's needs for air travel. If our beloved capital is to hold up to its moniker "Caput Mundi", we need to ensure that all can come here and bask in its glory.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_1_CI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P1_CI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_1_CI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_1_central_italy_not_completed:0 "The old Ciampino airport is clearly no longer sufficient to satisfy Rome's needs for air travel. If our beloved capital is to hold up to its moniker "Caput Mundi", we need to ensure that all can come here and bask in its glory."
 ita_balboimper_S3_project_1_central_italy_completed:0 "With the new and gargantuan Fiumicino International Airport, the Eternal city is properly connected to the air travel network like any world-class capital should be, and perhaps even better. Let everyone know that all roads, old and new, land-based and aerial, lead to Rome!"
 
 ita_balboimper_S3_project_2_central_italy:0 "Drain the Pontine Marshes"
 ita_balboimper_S3_project_2_central_italy_tt:0 "First drained by Octavian, and later by Mussolini in a titanic effort against nature, the delicate ecological balance of the Pontine Marshes was broken by Atlantropa. Already, the marshes are eating away at the arable land, and quick action is required to preserve this fundamental supply of food for the capital!\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_2_CI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P2_CI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_2_CI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_2_central_italy_not_completed:0 "First drained by Octavian, and later by Mussolini in a titanic effort against nature, the delicate ecological balance of the Pontine Marshes was broken by Atlantropa. Already, the marshes are eating away at the arable land, and quick action is required to preserve this fundamental supply of food for the capital!"
 ita_balboimper_S3_project_2_central_italy_completed:0 "Italo Balbo has proudly entered the pantheon of the great transformers of the Earth to the side of Mussolini and Octavian themselves. The new and improved channels will prevent the marshes from ever returning to haunt this beautiful land, and the Agro Pontino will supply the capital with plenty of foodstuffs in the decades to come!"
 
 #Bonus project! ##So basically on these, have them be visible but put tooltip for the diplomatic requirements
 ita_balboimper_S3_project_3_central_italy:0 "Build the Zara Transportation Hub" 
 ita_balboimper_S3_project_3_central_italy_tt:0 "Should we manage to secure a foothold in the Balkans against the Germans, then it would be sensible to integrate our allies' economies into our economic sphere. The city of Zara is the perfect location for the beginning of a wider infrastructural network connecting Italy to the Balkan region.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_3_CI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P3_CI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_3_CI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_3_central_italy_not_completed:0 "Should we manage to secure a foothold in the Balkans against the Germans, then it would be sensible to integrate our allies' economies into our economic sphere. The city of Zara is the perfect location for the beginning of a wider infrastructural network connecting Italy to the Balkan region."
 ita_balboimper_S3_project_3_central_italy_completed:0 "With railways and airports connecting Zara both to the Balkans and the Italian mainland, goods from all over the Empire will be directed towards new markets in Eastern Europe. Already the city is expanding, and the periphery of the Adriatic salt flats is slowly but steadily finding a new normality as a productive part of Italy."
 
 ita_balboimper_S3_3_CI_available_tt:0 "§BControl§! of The §MHellenic State§!, The §EKingdom of Croatia§!, The §oKingdom of Montenegro§!, and The §eKingdom of Albania§! are all §Y40§! or above."
 
