 ITA_a_bulwark_against_national_socialism_desc:0 "Germany, the Scourge of Europe. Where they were once beautiful seas filled with life, there is now a lifeless desert. Colorful cities engulfed by the hunger of the German Kronos will never show any semblance of life again. Like modern Barbarians that destroy entire civilizations in their wake, National Socialism kills everything it touches. They are the greatest enemy of not only the Italian nation but the civilized people of the world.\n\nThat's why Italy must be the main bulwark in the fight against National Socialism. Thankfully, we are not the only ones that have unfinished businesses with the Reich. With skillful diplomacy, we can gather enough allies to isolate and weaken the German Reich. Where the late Romans failed, the Italian Empire will succeed."
 ITA_old_enemies_make_new_friends_desc:0 "Two decades ago, the Italian Empire went to war with the United Kingdom, the United States of America, and several other nations. Thanks to a series of resonating victories on Africa and the Middle East, Italy has acquired territorial gains beyond our wildest dreams. However, the situation has changed, and our main enemy is now on the other side of the Northern Alps.\n\nJust like the old allies of the past become enemies, the old enemies of the past shall become friends. Contacting the Western nations is vital to stop the ambitions of the Reich. The diplomatic support of both London and Washington will be needed to contain the German menace. Past grudges have no place in the geopolitical games of the present, especially when the survival of Europe is at stake."
 ITA_the_western_superpower_desc:0 "The United States of America and its sphere of influence, the Organization of Free Nations, is one of the opponents of German dominance over Europe and the rest of the world. Despite their defeat in the war, the Stars and the Stripes possess an enormous industrial and military capacity to challenge the Reich's ambitions. But most importantly, they can influence other nations to follow its lead thanks to the OFN.\n\nNaturally, bringing the two nations together to fight the German menace is the best course of action. We'll establish diplomatic cooperation with Washington once again to tip the balance to our side in our struggle against Germany. If these efforts bear fruits, we will have taken the first big step to contain Germany."
 ITA_contain_the_german_menace_desc: "The problem inherent with a threat such as Germany is that we've been completely isolated by them, with few -if any- allies to back us up. We need much more than some old friends to stand by us if we wish to push back against the Nazis, let alone climb our way to anything resembling an equal playing field. The choice of allies, then, is easy. We ought to look towards the Americas, as they've certainly just as much of a bone to pick with the Germans as we do, not to mention plenty more experience.\n\nWith our course plotted, we must begin to plant the seeds of alliance against Germany, through détente. While it may not be nearly enough to well and fully scare off the Germans, it will certainly provide us with a new source of arms, as well as new opportunities to train our special forces. As our troops are not particularly well trained in the realm of specialized operations, joint-training exercises are to begin, in order to immediately remedy such a shortcoming. Through such an ally, we can begin to reclaim our position as the Fourth world power."
 ITA_stop_germany_at_all_costs_desc: "Germany is our greatest threat, that is without question. They are poised to strike us at any moment, without hesitation. Therefore, we have no chance at survival lest we prepare ourselves for this nigh inevitable outcome. If our cooperation leads to us becoming little more than a bulwark against Nazism then so be it. We must prepare for any sort of conflict with Germany, through any means possible. We must stop at nothing to stop the very manifestation of oppression, for if we do not, who will? Strengthening our relations with America, then, is a total necessity beyond comparison. We will stand strong for our American friends, we will fight for our freedom, we will stand for the oppressed, and we will crush our enemies."
 ITA_a_solid_economic_partnership_desc:0 "Direct military engagement is not the only way of confrontation between enemy countries. The German structure is rotten from the inside, relying on an ineffective slave system and corrupt bureaucrats controlling the industry. With this in mind, the wiser choice could be hitting Germany where it hurts the most: the economy.\n\nA long-term economic partnership with the USA could boost our economy and have an industrial and technological edge over Germany. This partnership, combined with a strong embargo, could cripple the German economy in the long-term and neutralize them as a military menace. The firepower of the guns doesn't compare to the incomparable unlimited strength of money."
 ITA_reopen_the_markets_desc:0 ""
 ITA_american_italian_film_cooperation_desc:0 "Cinema is a universal language that joins different cultures across the globe. The influence of Italian cinema over the American one on films of the Mafia and the Spaghetti Western genre is the proof of that. However, creating classic celluloid masterpieces shouldn't be the sole purpose of this artistic field.\n\nThe Italian government will promote cooperation with American production companies to spread Italian culture through quality films. Using the Silver Screen to boost our image on the American public, our relationship with the Western superpower will improve even more. Nothing better for bringing people together than the passion for art and the enjoyment of mass media. "
 ITA_our_connection_to_the_americas_desc:0 "The United States is not the only country of the American continent where Italian culture has left a permanent footprint. North American countries like Canada house a considerable population of Italian origin. In South American countries like Argentina, Italian immigration represents the backbone of their societies.\n\nThese deep cultural ties with American nations represent the perfect opportunity to pursue economic partnerships with them. With Argentinian wheat and Canadian minerals entering our country, these markets should represent a huge opportunity to boost the economy."
 ITA_the_aviator_in_dc_desc:0 "With the loss of the Triumvirate, Italy remains alone in the Mediterranean, our only allies being what Colonies and Puppet governments have yet to abandon us. It is an unfortunate truth, yes, though it is a problem in need of immediate rectification. We obviously cannot approach our old allies, that is a given. While we have no allies in the immediate region, we must think of the one thing the Germans fear- their demise.\n\nThey can't invade us if we have the backing of the Americans, though we can't get the backing of the Americans without a quick trip to Washington. While there's yet to be a Duce to step foot in America since Mussolini's rise to power, we must advance the involvement of the OFN in Italy, if we ever want to resist a German invasion."
 ITA_the_british_isles_desc:0 "Ah, the British. They once held control over half the world as we know it, but now look at them! They've been under the yoke of the Germans for nearly twenty years, been robbed of their Colonial possessions, even having lost their union with Wales and Scotland, not to mention the humiliation of the Cornwall garrison. While we may have been enemies in the past, we must reconcile if we are to ensure the English don't return to the Pakt. The British isles occupy one of the most strategically viable locations in Europe, one that cannot be allowed to be handed over to the Einheitspakt.\n\nWe can begin our political endeavors through establishing delegates to the British Isles, as well as reaching out to the current government, though this is only to ensure we can begin to establish proper relations with the once-great empire."
 ITA_sealion_never_again_desc:0 "Discouraging England from joining forces with the Pakt has undoubtedly been one of our greater investments throughout our diplomatic adventures, though we cannot win them over through diplomacy alone. With memories of operation: Sealion still strong, we must prove to the English that they can withstand the forces of the Pakt, as unrealistic as it seems.\n\nTo up the confidence of the English, we can begin joint training exercises, particularly with their Special Forces. Through this act of cooperation, we can further our diplomatic advancements, not to mention the inherent advantages of training exercises alongside close allies."
 ITA_the_irish_example_desc:0 "With our foot in the English door, we must further discourage them from joining the Pakt, now that we have the chance. Now lay the challenge of showing them our point of view, thus many advisors recommend we give an instance of a nation joining Germany's sphere, only to suffer from it later down the road. Of course, we'll need to be fair in our comparison, as no Englishman will buy their fate is comparable to that of the Russians.\n\nUnfortunately, the problem with examples is that there are very rarely perfect equals in today's world, as every nation is at least somewhat different from one another. However, an odd exception to this rule is Ireland. Bearing the cross of a heavily Germanized economy, they're identical to the English in every instance, save for this closer relationship with Germany. While something of an unfair comparison, we cannot forgo the political clout inherent with comparing the already stagnating English economy with that of the Irish, having lost between 40% and 50% of their GDP. Such a shame. Imagine England in the position they found themselves before, now with a more aggressive policy of Germanisation. I wonder..."
 ITA_the_ones_who_ruled_the_waves_desc:0 "Centuries ago, the Royal Navy sailed across the seas with no one standing on its way. With a colossal fleet, England had complete control of the ocean masses of the world. Those are only memories of a long bygone era. After World War II, the Royal Navy is only a shadow of its former glory.\n\nHowever, their expertise at the seas could be a useful tool for us to pick up their legacy. By collaborating with the English government, we'll improve the naval techniques and strategies of the Regia Marina, developing a new modern professional Navy to compete with the likes of Germany."
 ITA_fellow_victims_of_atlantropa_desc:0 "Suffering brings people together. It's a well-known fact by the nations that suffered the worst catastrophe of the 20th century: Atlantropa. It would be foolish to assume that we were the only victims of this disaster. Iberia, France, Greece, and many other beautiful Mediterranean nations were affected by this lunatic project.\n\nFrom time to time, it's good to remind them that the German Reich is responsible for this failure. Suffering not only bring us together to overcome adversity, but also to make a stand against the Teutonic Kronos that threatens Europe."
 ITA_apologize_for_malta_desc:0 "Admitting mistakes is never an easy thing, but it's a necessary act to grow past them. The Malta Conference was a series of missteps one after another, culminating in a disaster that affected everyone involved. As a result, we burned bridges with the other members of the Triumvirate, ending the alliance. n\n We'll contact our ex-allies, Turkey and Iberia, to apologize for this embarrassment and the shameful way the conference was handled. By moving past these mistakes, we could regain the trust of our allies."
 ITA_help_the_dam_desc:0 "The Germans doomed us all with their delusional idea of Atlantropa - whether a titanic mistake or a calculated maneuver, we are left with the consequences of a drained Mediterranean. This, however, was not the only thing that was left behind. In the middle of the economic crash of the '50s, the traitorous Reich pulled out of the Gibraltar Dam, leaving it a shadow of itself.\n\nThroughout the last decade, Iberia has slowly but surely been making progress on the completion of the Gibraltar Dam, a project they hope will find a silver lining in the catastrophes of Atlantropa by producing massive amounts of hydroelectric energy. This is an admirable cause; we will help their government with building the remainder of the Dam by funding the construction, sending over technicians and engineers, and mobilizing Italian workers onto the site."
 ITA_the_bosphorus_deal_desc:0 "Some have called the Bosphorus one of the most important waterways in the world - and we cannot deny this. Between Thrace and the northwest of Anatolia, and looking out from the historic city of Istanbul, lies a strait a mere 3,700 meters wide at its widest point. Access through the Bosphorus is crucial to nations on the Black Sea, whose only sea connection to the outside world is through the straits; their control gives Turkey massive geopolitical leverage.\n\nShould we seek to trade with the countries of the Pontus, we must set aside the recent conflicts in the Levantine and negotiate for better terms and access through the Bosphorus. Begrudging as we might be, we will bite the bullet and accept concessions to Ankara, so long as this objective is achieved."
 ITA_renegotiate_suez_rates_desc:0 "The Turks have Marmara and the Bosphorus, and we have the Suez. Drastically shortening the travel time of ships from Europe to Asia, the Suez has become even more ascendant in international trade as the Mediterranean's natural gateway to the world - the Gibraltar Straits - lies blocked. Freighters and tankers carrying millions of tons of goods pass through the canal every day, making it an extremely lucrative venture.\n\nHowever, our enviable position of control over the canal has led to countless demands from the former Triumvirate for decreased fees or even free access through the Suez. This was meant to have been addressed in Ciano's Malta Conference, yet the issue remains unsolved, with many parties still unhappy with the current arrangement. We will draw up a new conference to settle this once and for all, and placate our Mediterranean brethren."
 ITA_buffers_against_germany_desc:0 "A silent Great Game has been in action for years now, a game over the myriad of buffer states between Italy and the Germans to the north. Bulgaria, Romania, Hungary, France, Serbia... we and the Reich fight in the courtrooms, parliaments, and backrooms of these various nations to vy for influence.\n\nHowever, in accordance with Duce Balbo's command, this effort to convince or coerce these states into falling in with us has been strengthened greatly. Every state which falls to Germany means one less potential ally to defend ourselves against northern aggression, and one more enemy whose troops will rally against us. If we are to not bow to the corruption and evil of Germania, we must win the Great Game, no matter the cost."
 ITA_fortify_algiers_desc:0 "The French State has been in a sorry state for decades. Ever since their defeat in the Second World War and the humiliating Treaty of Vichy imposed harsh restrictions on their activities, the once-great French nation has been relegated to the back stage of international politics, and has turned from a great power to a cowed one. One part of this fall from grace is the loss of French colonies, the crown jewel of which has always been Algeria.\n\nUp until 1964, Algeria was divided between Iberian and Italian military forces, with the only remaining French control over the colony being in the city of Algiers. We will not help them retake the rest of Algeria, but one thing we can do is help them protect Algiers, a city we have no interest in taking. We will help fund the building of fortifications and defenses around the last stronghold of French control in the Maghreb."
 ITA_open_up_the_border_desc:0 "The horrific Burgundian State's invasion of France has left thousands of refugees displaced. The French government has placed many of them into camps, but they have become overwhelmed with the sheer number of scarred and battered men and women arriving at their doorstep. Let us open up the border with France and offer to take some of these refugees into Italy; we can certainly afford to protect these good people after all they have done to fend off the SS."
 ITA_the_issue_of_macedonia_desc:0 "Macedonia, the intersection where Greeks, Serbs, and Bulgarians meet, has been a point of significant tension ever since Bulgaria attempted and failed to acquire it in the Second Balkan War. As always, the Balkans continues to be a hotbed of turmoil - Macedonia has become a powderkeg waiting for a spark to ignite a third war. If we manage to cool these tensions and find a diplomatic compromise to partially satiate all parties, we will not only have defused a potential war, but will have gained political clout in the region. A congress will be called in the city of Tirana in Italian Albania to resolve the Macedonian Issue once and for all."
 ITA_help_deescalate_transylvania_desc:0 "The significant ethnic Hungarian population of parts of Transylvania, especially in the Szeklerland, drove the Reich to grant Northern Transylvania to Hungary in the Second Vienna Award of 1940 - after it had been lost to Romania in World War One. However, Hungarian control of the territory would not last long as Romanian forces successfully vanquished the Magyars during the chaos of the West Russian War, seizing the land for itself once again.\n\nIf we manage to cool these tensions and find a diplomatic compromise to partially satiate all parties, we will not only have defused a potential second war, but will have gained political clout in the region. A congress will be called in the city of Zagreb in Croatia to resolve the Transylvanian Issue once and for all."
 ITA_remind_them_of_their_crimes_desc:0 "No matter who you are - no matter your history with Italy and with each other; no matter previous conflicts or deals, no matter your petty feuds - your enemy, your ultimate enemy, is Germany. From those tortured and massacred by the Wehrmacht to those trapped under the jackboot, to those whose livelihoods were crushed by Atlantropa, we are all united, if not by other reasons, by our hatred of Germany and our need to defend against the Nazis. They are the archnemesis of the nations of Europe, free or chained; they are the bogeyman of all peoples' dreams. We will either bind together in defense against the National Socialist menace, or die trying."
 ITA_use_the_sim_desc:0 "A light touch is necessary at the moment in our dealings with the Germans. Though not yet the equals of the American CIA or the dreaded Japanese Kenpeitai, the SIM are still more than capable of supporting our position in Europe without exacerbating tensions unnecessarily. We should immediately begin SIM operations against our Germanic foes.\n\nOur loyal agents of the SIM shall steal their most precious secrets as well as spread dissent and discord in their ranks and among their people. Hopefully, such division will hobble the German Giant looming on Italy's northern border and delay any potential Hun attack. Though the work is not particularly glamorous or honorable, it does keep Italy and the empire secure."
 ITA_leak_their_conversations_desc:0 "In the course of the SIM's operations we have managed to make potentially embarrassing recordings of German diplomats referring to Southern Slavs and Asian peoples in particularly derogatory ways. Disseminating the recordings via the proper channels will work wonders to draw these nations closer to our orbit and further away from the Nazis.\n\nWe shall remind these peoples that the Germans are not their friends or even potential allies, indeed that the Germans despise all non-Aryans, viewing them as non-equals to be mocked and denigrated behind closed doors. The SIM shall keep their eyes open for further opportunities to embarrass the Germans and draw our neighbors closer..."
 ITA_share_their_intentions_desc:0 "The SIM have worked wonders again. Now they have managed to purloin a file of German geopolitical plans for Western Europe and North America, including their machinations and schemes targeting France, the Iberian Union and the British isles. These documents show the malign intentions of the Germans regarding their neighbors and will outrage many of the countries targeted by the Germans in these plans who will see their sovereignty and very existence as independent nations threatened by the European hegemon. Spreading these plans far and wide will provoke a diplomatic scandal for Germany and remind its neighbors that the Hun cannot be trusted, further strengthening Italy's position against our bellicose German neighbor."
 ITA_strenghten_the_embargo_desc:0 "Germany is our foe and it is unacceptable that they should gain any benefit or profit by commerce with Italy, our empire, or our broader sphere of influence. The government shall undertake to plug any and all remaining gaps in our embargo against the Germans. Not a single drop of precious Italian oil, or indeed any other of our commodities shall find their way into the hands of the German reich, forcing them to continue to rely on their own inefficient and fragile European empire. Tightening the embargo will hopefully further weaken the already creaking German economy, sapping our foe's strength while fortifying our own position."
 ITA_the_eastern_winds_desc:0 "The Suez is the doorway between our Mediterranean empire and the wider world. As Europe lies under the German boot, we must look out into the world for our future rather than to our European neighbors. The rising power India as well as the Asiatic hegemon Japan and its broader Co-Prosperity Sphere would be excellent potential partners.\n\nIndia has no relationship with Germany to speak of while Japan is an outright rival of the giant to the north, having experienced a similar rupture of relations with Germany following the defeat of the allies. We shall endeavour to establish favorable relations with both countries and grow rich together from commerce and mutually-beneficial exchanges."
 ITA_the_emerging_subcontinent_desc:0 "Spanning thousands of miles and populated by hundreds of millions, an ancient tiger sleeps undisturbed. Only now may it awake, after years of abuse by imperialism, civil war, and division. This tiger is, of course, the Indian Subcontinent. Although held down by years upon years of colonial oppression, infighting and even civil war, the subcontinent has the resources and grit to become a world power.\n\nTheir population is massive; it will be no trouble to gather workers, build industry and then subsequently staff it. Even after the beatings they've taken, they will be up on their feet and marching toward progress in no time. We need to watch this tiger as it stirs from its slumber, even if half of it is still shackled to the Japanese Sphere."
 ITA_indias_gateway_desc:0 "India is a country on the rise since it slipped from the domination of British colonialism. Already its factories grow and multiply, spewing forth an ever growing bounty of cheap goods as the country industrializes. The country grows more powerful by the year and would be an excellent potential partner.\n\nThe Indian government has indicated an interest in facilitating exports of these commodities to the west and new potential buyers. We shall open the Suez to our new Indian partners, the canal becoming their gateway to new European markets and our doorway to the treasures of the East. Our people shall delight in new and cheap goods while our relationship with the Indians deepens and warms."
 ITA_the_riches_of_bengal_desc:0 "While the entire subcontinent is rich with resources, potential industry and more, there is one portion of India that draws our eye. In the eastern reaches of the land, where a great deal of its vast population dwell, is Azad Hind. Surrounding the city of Bengal, the nation has access to some of the greatest economic and industrial boons of that grand subcontinent. The resources yielded by these lands are already being reaped by Japan, who's pocket the nation resides in. It would be a shame to simply ignore such a valuable trade partner, and thus connections will soon be established between our two great lands for the benefit of all."
 ITA_the_sri_lankan_threat_desc:0 ""
 ITA_our_greatest_ally_desc:0 ""
 ITA_oil_for_rubber_desc:0 ""
 ITA_close_military_cooperation_desc:0 ""
 ITA_a_return_to_tokyo_desc:0 "Mussolini was always a friend to Japan. Meetings with the Emperor, gifts to the people, art and culture toward their waiting arms, and more. Unlike Germany, Japan never double crossed us with that wretched Alantropa project and has remained a faithful trade partner even if we are no longer direct allies. Thus, in the legacy of Il Duce, Balbo will make his way to Tokyo like his predecessor. He will come bearing gifts and to see where our own are now, and the divide between our two peoples will once again begin to close."
 ITA_let_the_goods_flow_desc:0 ""
 
 ###=====| g) Oil Crisis Tree |=====###

 ###=====| h) Epilogue Tree |=====###
 ITA_i_inherited_a_rome_made_of_huts:0 "I Inherited a Rome Made of Bricks..."
 ITA_i_inherited_a_rome_made_of_huts_desc:0 "Many years have passed since the day when we took the helm of a nation in disarray. Italy has suffered much during her history, but now it can finally reap the fruits of her efforts, as a new age of prosperity dawns over all of us: surely, none of this would have been possible without our glorious Duce, and he knows it.\n\nThe challenges we faced were great. Historians ages from now will look at what we did, and marvel at how we could achieve so much with so little: an old Italy goes away, brought down by its own obsolescence, and a new one arises, beautiful and golden!"
 
 ITA_a_grand_inauguration:0 "A Grand Inauguration"
 ITA_a_grand_inauguration_desc:0 "With the great infrastructural projects that marked his tenure drawing to a close, Italo Balbo wishes to celebrate the completion of most - if not all - works with a grand ceremony. From the balcony of Palazzo Venezia, our glorious Duce will address all Italians, thanking them for their hard work and their loyalty during these testing years: surely, we wouldn't be where we are without them!\n\nAfter the public address, a more institutional banquet will see together party officials, ministers, Italian businessmen and fureign dignitaries. Such a feat of engineering is far from self-serving: by exploiting our new infrastructure, surely we'll reap much more benefits than merely creating new jobs..."
 
 ITA_one_last_push:0 "One Last Push"
 ITA_one_last_push_desc:0 "With our great feat of engineering and patriotism, we have done something not even the Romans would have been capable of. We have created a complete, organic and efficient infrastructural system spanning from the Alps to Libya: as we speak, the final adjustments are being made to connect our new assets to the rest of the Empire.\n\nThis, of course, is but the beginning. Costs have been great, but we are starting to reap the benefits: unemployment is at an all-time low, and if we are clever in exploiting our new reputation as an infrastructure hub we can easily gain even more from our new world marvel."
 
 ITA_open_the_autostrada_imperiale:0 "Open the Autostrada Imperiale"
 ITA_open_the_autostrada_imperiale_desc:0 "Among all the great monuments we have built over the last years, none is as grandiose and awe-inspiring as the new Autostrada Imperiale. Spanning the entirety of our beloved homeland, the Imperial Highway connects all our major cities between each other and to our greatest transportation hubs: from any point in Italy, a person can easily travel everywhere else in the world, be it by train, ship or airplane.\n\nMany are the wonders brought by technology, but the humble road still stands as the greatest testament of human ingenuity. From the Roman Viae, which still serve their ancestral purpose after millennia, to the mountain tunnels carved by advancing generals and adventurous entrepreneurs, roads represent humanity's greatest attempt at subduing nature: it is no wonder that our glorious Duce wishes to personally inaugurate our latest addition to the history of engineering!"
 
 ITA_the_eagle_flies_once_more:0 "The Eagle Flies Once More"
 ITA_the_eagle_flies_once_more_desc:0 "As part of his tour to inaugurate the major infrastructural projects we have completed, our glorious Duce has found a way to make work and entertainment meet. An aviator by passion and military career, Italo balbo loves to fly, something he has been prevented from doing by duty and old age: this time, however, is going to be different.\n\nAs part of the inauguration ceremony of the new airports in Rome and Tripoli, a historical Caproni Ca.133 of the Ala Littoria air travel company will perform the maiden voyage. This old airplane, still kept in pristine condition despite its age, will have an exceptional pilot: the Duce himself will maneuver the aircraft, with one of our best aces as co-pilot!"
 
 ITA_securing_the_succession:0 "Securing the Succession"
 ITA_securing_the_succession_desc:0 "Italo Balbo is a great leader, but he is still a man, like all of us. As he gets closer and closer to the threshold of eighty years old, he has come to believe that he may not be able to lead the Empire for much longer: to address this issue, he has begun looking for a successor.\n\nWhile there are many competent men in the party, our Duce is desperately looking for someone with the right mix of charisma, competence and initiative. Leading a world power is no trifle matter, and a crisis can hit when one least expects it: Balbo knows this, and will not be satisfied until he has found someone that matches his requirements."
 
 ITA_prepare_the_pnf:0 "Prepare the PNF"
 ITA_prepare_the_pnf_desc:0 "While the party has remained steadfastly by his side through the past years, Italo Balbo knows that loyalties usually die with the man they belong to. Politics can often be chaotic when the status quo is broken by sudden change: a succession crisis could break the party, and this would spell ill tidings for all of Italy.\n\nTo this end, our Duce has prepared all needed countermeasures. He has had private talks with several prominent party officials, and they have all promised to make sure that nothing happens to Balbo's chosen successor should any other Gerarca contest his appointment: with this reassurance, we are much more confident in the future of fascism."
 
 ITA_a_royal_meeting:0 "A Royal Meeting"
 ITA_a_royal_meeting_desc:0 "Of course, our great Duce feels deep respect for the monarchy and the constitutional structure of the state as dictated by the Albertine Statute. Throughout his tenure, Italo Balbo has always been careful never to step outside of his role as Duce of fascism and Prime Minister of the Italian Empire: the King knows this, and has shown his gratitude when appropriate and when needed.\n\nAs his tenure comes to a close, our leader wants to make sure that his successor will be made Prime Minister after him. Of course, he would never force our monarch to appoint his chosen replacement ahead of time, as it would be against both Constitution and political etiquette: instead, he will have a courteous meeting with our highest protector and convince him of the need for stability in the realm, something which Umberto II, a man of deep political intellect, will surely agree with..."
 
 ITA_a_new_caesar_for_an_old_augustus:0 "A New Caesar for an Old Augustus"
 ITA_a_new_caesar_for_an_old_augustus_desc:0 "More than a thousand years ago, Emperor Diocletian devised a cunning succession procedure which could be very useful to us. The Emperor - known with the title of Augustus - would choose his successor - to assume the title of Caesar - and take him by his side during his reign: this way, the Caesar would slowly learn the ropes of ruling from his superior, and also gain the loyalty of the administration.\n\nSadly, greed and disloyalty prevented this from ever succeeding, but we live in different times. With loyal and competent men by our side, we can learn from the lessons of history, and turn them to our benefit: to this end, Italo Balbo will take his chosen successor by his side during both official ceremonies and administrative work, making sure that when the time comes to leave the Empire into younger hands, he will be able to rest with ease."
 
 ITA_secure_new_deals:0 "Secure New Deals"
 ITA_secure_new_deals_desc:0 "With our new infrastructure spanning the entirety of the Empire, we now hold a very interesting position which allows us to greatly benefit from it. With our state-of-the-art railroads, ports and airports, we can easily act as a transportation hub in the middle of Europe, and the gateway between the continent itself and the rest of the world: surely, this is a chance we'd better not pass up.\n\nOur Ministry for economic affairs will immediately begin talks with ambassadors from foreign European and extra-European countries. The board of advisors hopes to be able to sign several trade deals which will allow us to act as middlemen in their mutual exchanges: the income from trade tariffs and corporate taxes will be astronomical"
 
 ITA_an_economic_miracle:0 "An Economic Miracle"
 ITA_an_economic_miracle_desc:0 "Our plan has been a risky one. Beginning simultaneous infrastructure projects all across the nation has been extremely costly, and such a massive amount of public funds thrown into the economy could have caused a corruption of nightmarish proportion: should this have happened, the Empire itself would have collapsed.\n\nToday, we can tell that our great Duce has led us to success. The investments have regenerated our economy, creating hundreds of thousands of jobs in the building industry: this, in turn, created a virtuous cycle as the new workers could now spend into other Italian businesses, and with the new trade deals we have stipulated, our coffers are filling, and the debt we contracted to finance our projects is repaying itself.\n\nTruly, Italo Balbo has achieved what Italy needed the most. Our very own economic miracle!"
 
 ITA_i_leave_a_rome_carved_in_marble:0 "...I Leave a Rome Carved in Marble"
 ITA_i_leave_a_rome_carved_in_marble_desc:0 "Finally, our work is done. With his greatest endeavor completed, a successor chosen and secured, and his eternal legacy enshrined in the monuments under construction all across the Empire, Italo balbo appears relieved and happy: he can finally enjoy a bit of calm after the storm, and the entirety of the Empire surely rejoices with him!\n\nAlmost two millennia ago, Octavian Augustus said that he had received a Rome made of bricks, and left it to posterity carved in shining marble. After all that we have done, we can claim to have done the same with the Italian Empire: our great Duce inherited a nation in disarray from those who squandered our great heritage and conquests, and returned it to greatness.\n\nWe celebrate Italo balbo, the new Augustus of the new Italian Empire!"

 
