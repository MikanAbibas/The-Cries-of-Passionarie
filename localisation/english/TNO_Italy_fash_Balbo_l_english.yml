 ##Increase project cost decisions##
 
 ITA_balboimper_costdecision_available:0 "A §YContingency Decision§! is available."
 
 ita_balboimper_increasecosts_1:0 "Hire More Workers"
 ita_balboimper_costdecision_1_tt:0 "In order to increase work efficiency and speed up the progression of our great project, the first step is to modify the cost-effective employment programs, hiring tens of thousands of new workers. While costly, the additional wave of builders, engineers, haulers, and bureaucrats will reinforce the existing crews and offices, streamlining and speeding up work.\n\nWill §Rincrease§! §Yproject costs§! by §Y30%§!, and §Gincrease§! §wEfficiency§! by §Y0.04§!."
 
 ita_balboimper_increasecosts_2:0 "Distribute State-of-the-art Equipment"
 ita_balboimper_costdecision_2_tt:0 "While effective, our building equipment is often outdated and in need of constant maintenance. By approving a large tender for the purchase of the most modern equipment, we'll be able to increase substantially - if at a high cost - the speed of work: modern pneumatic hammers and hydraulic excavators allow for faster construction, while computers and teleprinters will lessen the bureaucratic workload around our project.\n\nWill §Rincrease§! §Yproject costs§! by §Y30%§!, and §Gincrease§! §wEfficiency§! by §Y0.04§!."
 
 ita_balboimper_increasecosts_3:0 "Employ Advanced Materials"
 ita_balboimper_costdecision_3_tt:0 "The last few years have seen many improvements in the development of building materials. Acquiring the latest fast-setting concrete, stronger steel and innovative schematics will surely speed up work by a comfortable margin: quicker to set in place and safer to work around, the workers will surely appreciate such a modern approach, though the cost will be heavy for the comparatively average gain.\n\nWill §Rincrease§! §Yproject costs§! by §Y30%§!, and §Gincrease§! §wEfficiency§! by §Y0.04§!."
 
 ita_balboimper_increasecosts_4:0 "Improve Supply Lines"
 ita_balboimper_costdecision_4_tt:0 "In the first months of work our statistics department has reported that construction sites regularly report material shortages and supply concerns. While an expected occurrence due to the sheer size of our project, a crisis may turn such small inconveniences into a larger crisis: as time becomes of the essence compared to cost-effectiveness, we can remove any chance of delay by securing redundant contracts for construction materials and hiring more haulers to bring a certain excess to the construction sites so that, whatever happens, the show can go on.\n\nWill §Rincrease§! §Yproject costs§! by §Y30%§!, and §Gincrease§! §wEfficiency§! by §Y0.04§!."
 
 ita_balboimper_increasecosts_5:0 "Raise Salaries and Bonuses"
 ita_balboimper_costdecision_5_tt:0 "With the timing of the project acquiring the foremost importance over its costs, and most avenues of improvement exhausted, a proposal has been made to raise productivity rates through better working conditions. A general raise in salaries, as well as productivity bonuses for exceeding work quotas, will surely improve the spirits and achieve long-term results: the Ministry of Finance warns, however, that such policies will most likely result in disproportionate costs for any possible improvement, and our budget is already being strained by the previous initiatives.\n\nWill §Rincrease§! §Yproject costs§! by §Y30%§!, and §Gincrease§! §wEfficiency§! by §Y0.04§!."
 
 ita_balboimper_increasecosts_6:0 "Every Man a Hammer!"
 ita_balboimper_costdecision_6_tt:0 "Should it become fundamental to finish the projects on time, no matter the cost, our last solution is the one which has remained immutable across the ages - to throw more men at a problem until it is solved, or we run out of manpower or money to pay them. By approving a new, extensive hiring campaign, we shall surely find men willing to work in the construction sites. The Ministries of Economy and Finance warn, however, that such a measure will likely have a comparatively small effect for its large cost, as most new workers will be either unskilled, or simply in excess. This is our last resort: after this, either we complete these projects, or we fail.\n\nWill §Rincrease§! §Yproject costs§! by §Y30%§!, and §Gincrease§! §wEfficiency§! by §Y0.04§!."
 
