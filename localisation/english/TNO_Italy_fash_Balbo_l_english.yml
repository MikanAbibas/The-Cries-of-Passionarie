 ##Political tree## (Starting at 1000)
 
 ITA_balbo.1000.t:0 "Pest Control" 
 ITA_balbo.1000.d:0 "Galante Garrone jumped on his chair when he heard the Police knocking on his door. Quickly, he hid his papers in the usual secret spot - a fake tile under his table - and went to answer: while he was known as a free thinker in Turin's intelligentsia, no one could know of the judge's underground antifascist publications.\n\n"Yes, yes, I'm here!" He said opening the door, "What do you need, Commissar?"\n\n"I'm sorry, your honor," the familiar policeman replied, "but there have been reports of drug dealing around the block, and we are thoroughly searching the palaces in the area: we have done the floor below yours, and are going up."\n\nRelieved, the magistrate let the policemen enter. The three agents immediately set up to a light search procedure, as was protocol in non-suspect situations, but Garrone noticed one of the policemen - his face was familiar, where had he seen him? - immediately going for one of the kitchen drawers.\n\n"Commissar, I think I found something." The agent said, holding a small plastic container with a white powder.\n\n"What is that? I never saw that thing!" Garrone exclaimed. How could that be there?\n\n"Oh." The Commissar said, a bit dejectedly: "I'm sorry, your honor, but as procedure demands, you need to come with us: I'm sure you understand."\n\nGalante Garrone, his shoulders slumped, followed the policemen outside of the apartment. Then, the one who had found the drugs turned - to look for other potential hiding places, he said to the Commissar - and as he passed in front of him, the magistrate recognised him: the rat catcher, the same one who had freed the apartment of a sudden rat infestation last week, and asked him to vacate the apartment for an hour.\n\nAs he entered the police car, Garrone knew he had been framed. A few minutes later, the first flames were seen from the apartment."
 ITA_balbo.1000.a:0 "Another pest, dealt with."
 
 ITA_balbo.1001.t:0 "A New Strategy"
 ITA_balbo.1001.d:0 "(pike will write!)"
 ITA_balbo.1001.a:0 ""
 
 ITA_balbo.1002.t:0 "The Emperor and the Duce"
 ITA_balbo.1002.d:0 "(in which Balbo meets Umberto. The meeting is cordial but extremely formal, with Balbo reassuring Umberto that he will respect the Crown's prerogatives, and the King answering formally that the Prime Minister decides government policies. Then, as the meeting ends, the tone changes slightly, with Umberto inviting Balbo to a party in Rivoli (Savoy's pleasure residence in Piedmont), and Balbo making a light joke about it; the event represent the relationship between the two: they are friends due to shared experiences in WW2 (both were pilots in Libya, and Balbo escorted Umberto's bomber), but both are slightly wary of the other due to their political positions.)"
 ITA_balbo.1002.a:0 ""
 
 ITA_balbo.1003.t:0 "Checking the List"
 ITA_balbo.1003.d:0 "(in which Balbo is given by the OVRA a list of all the members of the Chamber. Every name has a judgement on him (either "passed", "disloyal" or "liability"), and Balbo coldly writes beside the name his judgement (check for "keep", dot for "imprison", cross for "kill"). At the end, he looks at the list, satisfied that the death sentences were less than a dozen, and passes the list to his secretary for "implementation")"
 ITA_balbo.1003.a:0 ""
 
 ITA_balbo.1004.t:0 "New Faces for a New Parliament" #triggered 3 days after last event
 ITA_balbo.1004.d:0 "(where Balbo holds a speech in front of the now-purged Chamber: praising the new members for the qualities which led to their appointment, he reminds them all that they serve the Emperor, Fascism and Italy, and subtly hints at the fact that just as he purged their predecessors, he will not hesitate to do so again should they prove to be a disappointment.)"
 ITA_balbo.1004.a:0 ""
 
 ITA_balbo.1005.t:0 "An Efficient Parliament"
 ITA_balbo.1005.d:0 "(where an Italian middle-class man reads form a newspaper (of course, Minculpop-controlled); in the first article, the journalist describes the (obviously show) trial which the "traitorous and corrupt" MPs faced after being purged; in the second, the journalist praises the new Parliament for its newfound efficiency and dedication to "supporting the Duce in his quest to rebuild the Empire". The reader of course knows this is all propaganda, but if it means that finally someone is actually doing something, well, who is he to complain?)"
 ITA_balbo.1005.a:0 ""
 
 ITA_balbo.1006.t:0 "Ufficio Complicazione Affari Semplici"
 ITA_balbo.1006.d:0 "(Balbo is talking to a senior bureaucrat about the reforms he wishes to implement: the bureaucrat tells Balbo the ministries will need months to prepare the necessary surveys, advisory papers, review commissions and sub commissions, preliminary legal frameworks, procedural simplification procedures, etc. Balbo smiles at him and tells him that he trusts him to do everything quickly, but when the bureaucrat leaves, Balbo's eye starts twitching (hint: he is fucking pissed))"
 ITA_balbo.1006.a:0 ""
 
 ITA_balbo.1007.t:0 "A Lesson from Damocles" #triggered a week after last event
 ITA_balbo.1007.d:0 "(the same senior bureaucrat receives the text of an emergency decree passed from Balbo, and fear grips him: in the decree, Balbo grants the ministries two months to begin and finish all the legal framework for the reforms - those who will not meet the deadline will be immediately accused of antifascist conduct and judged by the Special Tribunal for the Defence of the State which, as everyone knows, is the feared fascist political tribunal where a case is decided in half an hour, the accused has no lawyer, and the verdict has no appeal (and around 99% of the verdicts are culprit))"
 ITA_balbo.1007.a:0 ""
 
