 ###=====| 1) LEADER, MINISTER AND OTHER CHARACTER DESC |=====###
 ################################################################
 
 ### a) Leader Descriptions ###
 POLITICS_ITALO_BALBO_DESC:0 "Many in the government have compared the fate of Italo Balbo to that of Marc Anthony. A prominent officer in the young Regia Aeronautica, Balbo earned his honours through service and cunning: governor of Libya before the World War, he crushed the local resistance and set the stage for its Italianization, an effort crowned by success almost twenty years later. During the war, he proved his tactical acumen by creating the first Italian paratroopers and using Libya as a giant airstrip, which would prove instrumental in defeating the Franco-British troops in the Dark Continent.\n\nBalbo's fortunes took a sudden downturn after Mussolini's death: promoted - or rather, exiled - to Egypt by the jealous Galeazzo Ciano, he coordinated the Empire's effort to keep the Middle East under Italian control. The years spent in the land of the Pharaohs, however, weren't wasted: as his skin turned auburn under the scorching sun, Balbo weaved a web of contacts among the local elites and the Italian garrisons. Overseeing the defense of the colonies against countless enemies from within and without, the grizzled officer understood that Ciano's rule would spell the end for the Empire, and swore that he would not let it come to pass.\n\nThis, however, is where his tale diverges from that of Marc Anthony. Unlike the great Roman, Italo Balbo struck a decisive blow at the Actium that was the Verona Congress: prevailing over not only Ciano, but also the other Quadrumvirs, the aged pilot showed that he could move in the intricate labyrinth of politics with the same ease he piloted his aircrafts, no doubt thanks to his personal friendship with the King. As he turns into his seventh decade of life, the new Duce will need to use all his cunning and experience to resuscitate the ailing Empire and turn it into the dream that kept him going for so long: Italy will rise once again, by the strength of the Italian people and by his indomitable will!"
 
 POLITICS_AMOS_SPIAZZI_DESC:0 "When he had been appointed commander of a remote outpost in Lebanon, Amos Spiazzi had despaired, thinking his career over before even beginning. Instead, fate had a different plan for him: in the young officer, Italo Balbo saw himself thirty years before - a loyal and brilliant officer, crushed by the petty jealousy of an incompetent ruler - and, perhaps out of calculation, perhaps out of genuine interest, brought Spiazzi under his protective wing.\n\nAcross the years since then, mentor and protege developed a bond that went beyond their common military upbringing or shared belief in fascism. In the young artillery officer, the aged aviator found a friend and a kindred soul, someone who understood the need to balance direct and subtle approaches to lead Italy through the murky waters of the Cold War: in short, he found a perfect right hand, and a suitable successor.\n\nAfter the Oil Crisis ended, Balbo groomed Spiazzi for succession, teaching him the ropes of statesmanship. The general proved a capable student, adding his own insight to the aviator's experience: seeing this, both the Emperor and the PNF acknowledged him as the best candidate. In the end, Italo Balbo died a serene man, his unjust treatment decades before finally avenged.\n\nNow, the new Duce finds himself at the helm of an Italian Empire that is much different from the way it looked only a decade before. With a booming economy, a strengthened army, and an extensive sphere of influence, Italy enters the modern age as a protagonist: Italo Balbo spent his final years paving the way for his pupil, and Spiazzi will not squander this parting gift.\n\nAs he learned in a bombarded trench atop Mount Lebanon, planning is key to success, and Amos Spiazzi will plan Italy's way to greatness. Woe betide anyone foolish enough to challenge him!"
 ITA_Amos_Spiazzi:0 "Amos Spiazzi"

 ### b) Ministers ###
 ITA_Alfredo_de_Marsico_hog:0 "Alfredo de Marsico"
 ITA_Alfredo_de_Marsico:0 "Alfredo de Marsico"
 ITA_Alfredo_de_Marsico_hog_desc:0 "§LAlfredo de Marsico has had an interesting, if perhaps uninspiring life. Born in the province of Salerno, de Marsico made his living first as a lawyer, then a professor, before finally achieving placement on the National List, the elected body to represent fascism. He even achieved a position on the Grand Council of Fascism as minister of Justice in the 40's, before he had something of a falling out with Ciano at any rate.\n\nAligning himself with Italo Balbo, he acts as the de facto head of the fascist party as secretary of the PNF apparatus whilst Balbo concerns himself with the maintenance of Italy herself. Whether de Marsico intends to hold this position in the longer term however, looks to be an interesting question.§!"
 
 ITA_Ugo_Spirito_eco:0 "Ugo Spirito"
 ITA_Ugo_Spirito:0 "Ugo Spirito"
 ITA_Ugo_Spirito_eco_desc:0 "§LA curious relic of times past, Ugo Spirito is the strange but still extant economically left wing Italian fascist. An academic by trade, Spirito joined Mussolini's movement early on and managed to rise with the tides that took them to power in the 1920's. Despite his loyalty to the Duce however, he fell out of favour by the 1940's, and consequently fell in with Balbo's little clique.\n\nNow that Balbo has emerged victorious over his rivals he turns to Spirito and his odd conception of "Integral Corporatism", the idea of workers rather than shareholders having some influence in the process of ownership in a company, to augment his military credentials with a more populistic sheen. Whether Balbo follows through on this remains to be seen.§!"
 
 ITA_Stefano_Cagna_sec:0 "Stefano Cagna"
 ITA_Stefano_Cagna:0 "Stefano Cagna"
 ITA_Stefano_Cagna_sec_desc:0 "§LStefano Cagna in many ways represents the new age of the Italian military, Born in 1901 and rising to the position of command in a bomber squadron in time for the war despite his young age. A longtime associate and even friend of Balbo's, Cagna fought with him in the Second World War to general acclaim, despite almost being slain in the line of duty when british anti aircraft guns blew apart his plane.\n\nNow that Balbo holds the position of Duce, it was only natural that he turned to Cagna to be his voice in military affairs too low for his current position. What Cagna actually seeks to gain from his position in government is more uncertain, as the man rarely voices opinions out of line with the Duce's own.§!"
 
