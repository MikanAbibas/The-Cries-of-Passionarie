 ITA_balbo.9060.t:0 "The March of Progress" 
 ITA_balbo.9060.d:0 "For centuries, the Tuaregs of the Kel Ajjer had roamed the large, scorching expanses of the Libyan desert, a march as old and slow as that of time. Every year, they would gather in Ghat, to feast and trade: then, they would depart once again, moving from oasis to oasis, living hands of a desert-wide clock that counts months in place of hours, and needs no recharging.\n\nThat year, it was with great surprise that they approached the third oasis on their journey. The small lake had been encased in an artificial basin, while all around it, vegetation had been removed, and large machines flattened the sand or unloaded earth or concrete: the oasis was becoming a town. As soon as they spotted the nomads, the workers alerted nearby soldiers, and the commanding officer took an interpreter and a small escort, and marched towards the Kel Ajjer.\n\n"Who are you, and what do you want here?" The Italian asked through the interpreter.\n\n"We are the Kel Ajjer," said the clan head, "And this is our oasis. We stop every year here to make our camels drink, and our people rest."\n\n"This is not your oasis, Kel Ajjer," the officer replied, his tone polite if annoyed: "This is Italian land, destined to a new settlement."\n\n"But we need it!" The native protested: "Or we won't be able to sustain our march from Ghat!"\n\n"You are free to live as you wish, Kel Ajjer," the officer cut the conversation short, "It is not my business, but this land is ours: you will not interfere, if you wish to avoid the fate of Idris."\n\nHaving said that, the officer nodded in salute and left. The Tuaregs looked in dismay at what had been theirs until but a moment ago, then turned their camels, and returned to Ghat. There, they sold their camels, and began a new life, static hands of a broken clock nothing could recharge or repair."
 ITA_balbo.9060.a:0 "They can live as they please, as long as it pleases us."
 
