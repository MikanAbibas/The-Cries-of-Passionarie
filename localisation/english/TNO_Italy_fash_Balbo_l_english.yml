 #GOTTA DO THE PERCENTAGES IN THE SCRIPTED EFFECTS FOR STAGES 2 AND 3 I GUESS... OR THEY DONT WORK 
 
 #Loc keys for the stages:
 
 ITA_balboimper_GUI_text_Stage1_NOT_DONE:0 "The first stage of our glorious Duce's project will see the Empire's dilapidated infrastructure restored to full efficiency, removing the legacy of both Atlantropa and Ciano's incompetence. Once this has been achieved, the true plan will begin in earnest..."
 ITA_balboimper_GUI_text_Stage1_DONE:0 "The first phase of our grand endeavor has been completed! With the Empire's infrastructure restored and the past behind us, the stage is set for the Duce's vision to become reality!"
 
 ITA_balboimper_GUI_text_Stage2_NOT_STARTED:0 "Before beginning the bulk of the infrastructural plan, we first need to repair and upgrade regional infrastructure. Even the mightiest fortress will crumble if built atop quicksands..."
 ITA_balboimper_GUI_text_Stage2_NOT_DONE:0 "With solid foundations, the infrastructural plan can now truly begin. The Raccordo Imperiale, a parallel highway and railway network spanning the entirety of the Motherland, will bring the Empire together in ways unseen from the time of our glorious Roman ancestors!"
 ITA_balboimper_GUI_text_Stage2_DONE:0 "Finally, the Raccordo Imperiale has been completed! While lesser men would gloat and bask in such a glorious result, Italo Balbo is more than that: far greater feats of engineering await, and like Archimedes and Vitruvius, we shall show the world what our genius can do!"
 
 ITA_balboimper_GUI_text_Stage3_NOT_STARTED:0 "Italo Balbo has great plans, greater than what most could ever fathom. Marvels of modern architecture wait to leave their prisons of paper, to be turned to the Empire's service so that it may last longer than its predecessor: tarry not, for future and prosperity await!"
 ITA_balboimper_GUI_text_Stage3_NOT_DONE:0 "The time has come for the final phase of the plan. Like jewels on the golden crown of Italia - our eternal, benevolent lady - these great marvels will inspire generations of poets and historians to sing our praises: forward!"
 ITA_balboimper_GUI_text_Stage3_50ormoreDONE:0 "As dream cedes its place to reality, the magnitude of our achievements is for all to see. Italy prospers, and everyone with it: the Empire is saved!"
 ITA_balboimper_GUI_text_Stage3_75ormoreDONE:0 "Michelangelo could not end his greatest works, leaving the world in anguish over the fate of his unfinished heritage. Today, we surpass the greatest artists, engineers, and architects of all ages: let the world look in awe at our new Renaissance, an era of culture and prosperity!"
 #maybe this last one could be 100%? depends on what we want from the mechanic i guess...
 
