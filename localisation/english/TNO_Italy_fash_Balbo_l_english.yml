 ##################################
 
 ###=====| a) Inauguration Tree |=====###
 ITA_a_different_actium:0 "A Different Actium"
 ITA_a_different_actium_desc:0 "Sometimes, it's not the favorite competitor who is destined to be crowned with the victor's laurel. Despite his initial disadvantage, Italo Balbo has prevailed over his opponent thanks to his cunning and planning skills, showing all the qualities needed to become Duce: a new sun rises over Italy from the Nile's Delta, ready to bring prosperity to all!\n\nGloria all'Italia e al Re\nche il sacro suol protegge,\nal Duce che il Tevere regge\ninni festosi alziam!"
 
 ITA_securing_the_administration:0 "Securing the Administration"
 ITA_securing_the_administration_desc:0 "Unlike others, Italo Balbo has deep contacts within the state's administration. A convinced monarchist, personal friend to the King and well-known in the higher echelons of society, he'll have no problems in convincing the bureaucrats to support him: all that he needs to do is meet them and finalize the agreement.\n\nA meeting with King Umberto II shall be scheduled post haste to ensure his rapid appointment as Prime Minister of the Italian Empire, and several smaller meetings will be held with the various ministries and administration offices. Within weeks, the government will be ready to begin its operations: we expect nothing less from our great leader."
 
 ITA_a_meeting_with_the_king:0 "A Meeting with the King"
 ITA_a_meeting_with_the_king_desc:0 "King Umberto II plays neutral as always, but we know that he's relieved about Balbo's appointment. Perhaps he might dislike fascism on a personal level, but even he knows that our new Duce is someone he can trust: a convinced monarchist, and respectful of traditions and the Constitutions, Italo Balbo will not destroy Italy's order as others would have done.\n\nObeying to the formalities of the Albertine Statute, our leader shall meet officially with Umberto II at the Quirinale. After a brief audience, we fully expect him to be appointed as Prime Minister and immediately form his government: the King and the Duce shall stand side by side in the defence of Italy!"
 
 ITA_charm_and_champagne:0 "Charm and Champagne"
 ITA_charm_and_champagne_desc:0 "One thing our glorious Duce has taken from his sojourn in Egypt is Farouk's taste for parties. While a frugal man by nature, Italo Balbo understands the value of making a good impression on his guests, and will put this knowledge to good use: he has many dignitaries, both Italian and foreign, to meet, and a good party will surely put them in a favorable disposition.\n\nJokes aside, the new Duce needs to secure his hold over the administration of the state. Being already known for his commitment to tradition and the status quo, it will not be difficult to convince the powers that be to grant him their support: a remainder of what Pavolini, Muti or Giani would have done in his place will be worth a thousand glasses of champagne!"
 
 ITA_securing_the_party:0 "Securing the Party"
 ITA_securing_the_party_desc:0 "Italo Balbo has been one of the first to join the PNF at the dawn of the fascist era. With a wide web of contacts, he can count on many loyal men inside: they will prove instrumental in securing our hold over the party.\n\nOf course, there's another matter that requires the Duce's attention. Despite purging the most prominent supporters of the defeated Quadrumvirs, the lower echelons of their support base still remain at their place: soon, we'll need to deal with the permanently."
 
 ITA_purging_the_leftovers:0 "Purging the Leftovers"
 ITA_purging_the_leftovers_desc:0 "Despite our victory, the PNF is still rife with officers and lower members loyal to the defeated competitors. Despite his support among the higher echelons of the state, without support from the party everything will be much more difficult: action is required with maximum urgency.\n\nTo this end, one last purge will wash the party clean from all remnants of the traitor contenders. From the ashes of their defeat, a new PNF will raise: loyal, efficient and ready to support our great Duce in his future endeavors!"
 
 ITA_all_loyal_to_the_duce:0 "All Loyal to the Duce!"
 ITA_all_loyal_to_the_duce_desc:0 "Finally, the party has been cleaned from the inside. the last remnants of the corrupt, the fanatic and the madmen have been removed, and loyal, competent men have taken their place: with this, we expect the party to be fully at our side in the future.\n\nThe PNF has changed much from the first days, but it is still a fundamental asset for us. Italo Balbo knows this well, and will make sure that no one else can lay claim to it while he's in charge: internal divisions are a worse enemy than the Germans!"
 
 ITA_securing_italy:0 "Securing Italy"
 ITA_securing_italy_desc:0 "Italians all across the Empire have followed the events in Rome with apprehension and distrust. It has not gone unnoticed that many think the PNF to be a clique of self-serving bureaucrats always squabbling among them for petty reasons: indeed, what happened in the recent years falls short from such a description.\n\nIf we want to remain in power long enough to bring Italy back to greatness, we first need to convince the Italians of the fact that we are different. From now on, the party shall serve the people, and lead it towards an age of prosperity: under the wise leadership of our great Duce, of course!"
 
 ITA_nationalistic_zeal:0 "Nationalistic Zeal"
 ITA_nationalistic_zeal_desc:0 "Italo Balbo is a soldier first and foremost, and knows the value of zeal. Our nation is beset by enemies from all sides, and many would watch with glee as our Empire crumbles into dust: in order to bring the Italians to our side, we need to show everyone how much we have to lose by remaining divided!\n\nTo this end, a massive propaganda campaign shall begin to show the people our true enemy. The German beast lays in wait, just across the Alps: they have destroyed Mare Nostrum, they have challenged us at every corner, and betrayed us in many ways than one can even fathom.\n\nLet the Italians know that we shall not bow to Germania! the Empire stands!"
 
 ITA_announce_the_infrastructural_plans:0 "Announce the Infrastructural Plans"
 ITA_announce_the_infrastructural_plans_desc:0 "The Italian economy has been sluggish ever since the Germans built their accursed dam, and the disbandment of the Triumvirate has only made things worse. If we want to reverse the downturn, normal methods will not be sufficient: shock therapy is what Italy needs, and Italo Balbo knows what to do.\n\nTo this end, he shall announce to the people a grandiose infrastructural plan, one the likes of which have never been seen before. Our landscape shall be reshaped by the indomitable will of fascism, and the economy will surge forward: all roads used to lead to Rome once, and now it's time to make sure that all the railroads and airports do the same!"
 
 ITA_taking_off:0 "Taking Off!"
 ITA_taking_off_desc:0 "With our hold over the administration, the party and society secured, it's time to properly take off, and fly towards our intended destination. Many times our great Duce has thought about what he could have done to make Italy great: now the time has come to turn these dreams into reality.\n\nFrom the skies of Egypt to Rome's hills, the Empire shall be brought back from decadence. It is time for reforms and actions, and Italo Balbo is the perfect man for the task: together we shall change the world!"
 
