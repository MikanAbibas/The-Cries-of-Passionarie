 ITA_balbo_imper_desc:0 "The Italian Empire has been left in shambles by the twin disasters of the Atlantropa Dam and Ciano's ineffectual rule. There is no future for our country without a strong economy backing up our dreams of grandeur: if we are to restore our position as one of the world's superpowers, then we need to revitalize our economy, and Italo Balbo knows exactly what he needs to do to achieve this result.\n\nBy financing a gargantuan infrastructure plan the likes of which has never been seen in a modern country, our Duce believes the influx of public capital will, slowly but steadily, translate into an economic boom as unemployment shrinks, consumer expenditures rise, and trade flourishes once more. The task, however, will not be as easy as it seems: history teaches that such enormous projects are naturally rife with problems and inefficiencies, and only a true leader will be able to see the Empire through the greatest economic battle of all times!\n\nThe Ministry for Economic Development has deemed that, for our investments to achieve optimal return rates, §Gwe should§! §Yreach completion of a majority of projects belonging to the last stage§!, and warns that §Kit is fundamental for our survival§!, both economic and political, that §Ythe Raccordo Imperiale is completed§!.\n\nFinally, our policies require massive injections of liquidity, which will be achieved through bond emissions. As this will greatly increase our public debt, the Ministry of Treasury warns that our §wdebt-to-GDP§! must remain within acceptable parameters, otherwise investors will lose faith in our solvency and refuse to buy our bonds. The Ministry deems §Goptimal§! to keep §wdebt-to-GDP§! under §Y50.0%§!, and warns that it should §Knot be allowed§! to surpass §Y100.0%§!. Currently, Italy's §wdebt-to-GDP§! is §Y[?debt_to_GDP_ratio|1%]§!.\n\n§wYearly cost§! of projects: §R$[?Root.ITA_balboimper_misccosts|3] B§! (§R[?Root.ITA_balboimper_misccosts_monthly|1] million§! §mmonthly§!)\n\n§mMonthly§! §eCorruption§! change: [ROOT.GetITA_balboimper_monthly_corruption_gain]\n\n§eCorruption§! in Northern Italy: §Y[?Root.ITA_balboimper_corruption_northern_italy]§!\n§eCorruption§! in Central Italy: §Y[?Root.ITA_balboimper_corruption_central_italy]§!\n§eCorruption§! in Southern Italy: §Y[?Root.ITA_balboimper_corruption_southern_italy]§!\n§eCorruption§! in Libya: §Y[?Root.ITA_balboimper_corruption_libya]§!\n\n"
 
 ### Decisions ###
