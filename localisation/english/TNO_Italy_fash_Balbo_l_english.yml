 ita_balboimper_S3_project_3_northern_italy_tt:0 "Despite their military insignificance, the French State is a precious economic satellite for the Empire. With the Frejus tunnel demolished for bordering Burgundy, it is time to build new connections to our unfortunate brothers, if our relationship allows it.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_3_NI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P3_NI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_3_NI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
