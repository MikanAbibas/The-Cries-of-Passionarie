 ITA_balbo.9014.t:0 "Last Contingency Measure Implemented"
 ITA_balbo.9014.d:0 "Minister Ugo Spirito informs us that he has implemented the final contingency measure, as requested. Now, the full numbers of both our workforce and bureaucracy have been mobilized to fight our economic battle: costs have skyrocketed, of course, but we knew this, and decided to sacrifice cost to secure our final victory. Now, we can only pray that everything goes as planned."
 ITA_balbo.9014.a:0 "Truly, the greatest economic battle of all times!"
 
 ita_balboimper_costdecision_1_event_tt:0 "These contingency measures will §Gimprove§! the §wEfficiency§! of project construction. Once a policy is enacted, the next will be ready for implementation §Yin a number of months§!. Each subsequent measure will be §Rcostlier§! than the ones before it, and rampant spending §emay prove fatal for our strained budget§!.\n\nUnlocks £decision_icon_small §YDecision§!: §wHire More Workers§!."
