 ITA_balbo.2500.t:0 "Diagnosis, Prognosis and Treatment" #[ONLY IF SOMALIA IS CONTROLLED] Add to 'batons for the disloyal' focus 
 ITA_balbo.2500.d:0 "Luciano Ferro, veteran coroner of the Mogadiscio Political Detainment Complex, was nothing if not a precise man. Across the years, he had examined hundreds of corpses, so much that he could claim he spent more time with dead people than living ones.\n\n"Aden Abdullah Osman Daar," He read aloud the dossier about the body laying open on his table, "Suspected head of one of the largest anti-Italian organizations. Twenty years of constant activity, interrupted by willing surrender three months ago: suspect intention of coordinating resistance from the prison."\n\n"Within fifteen days of internment," he continued, sipping from his coffee, "Subject started experiencing sudden cramps to arms and legs. By the second month, the subject suffered convulsions and vomit mixed with blood: examinations failed to detect cause of illness. Two weeks later, the patient entered coma, dying four days into it."\n\nThe old doctor looked one last time at the open thoracic cavity, then at the results of the chemical analysis. While small, his laboratory had all the needed instruments to analyse blood and tissues, and the results only confirmed what the veteran coroner had already known ever since he first cut the body open: arsenic poisoning - there enough of the substance in that body to kill the entire prison. His suspicion proved, Luciano Ferro penned the mortuary analysis of Aden Abdullah Osman Daar.\n\n"Cause of death: collapse of vital systems due to untreated lung cancer with metastases across stomach, pancreas and testicles. No alien substances detected. Prepare the body for cremation."
 ITA_balbo.2500.a:0 "All patients deserve the appropriate treatment."
 
