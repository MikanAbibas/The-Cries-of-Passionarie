 ###=====| b) Political Tree |=====###
 ITA_domestic_affairs:0 "Domestic Affairs"
 ITA_domestic_affairs_desc:0 ""
 
 ITA_assessing_the_situation:0 "Assessing the Situation"
 ITA_assessing_the_situation_desc:0 "It is evident that times have changed. Ten years of decadence at the hands of Ciano's incompetent rule have turned the Italian population against us: the people no longer believe in the dream that is fascism, and both the lower and upper classes demand more freedom after years of perceived oppression by the state.\n\nTo add to the mess, the bureaucracy has become a quagmire of corruption and incompetence. If we want to pursue our dream of a great Italian Empire, then we need to turn the tide, starting from the basics: re-establishing control over the legislature, reforming the bureaucracy and addressing popular dissent are our main priorities."
 
 ITA_the_tallest_of_romes_hills:0 "The Tallest of Rome's Hills"
 ITA_the_tallest_of_romes_hills_desc:0 "Despite what his predecessors thought, Italo Balbo knows that the King is far from powerless. Commanding the loyalty of generals, admirals and dignitaries, and loved by the population, Umberto II wields a great amount of influence with the quiet grace of a skillful fencer: if we want to tighten our hold over Italy, we need to deal with him first and foremost.\n\nLuckily, the Duce is a personal friend of the King and a known monarchist. With this curriculum, he is confident that His Majesty will be convinced of the sincerity of our reforms: surely he understands that we are the only alternative to madness and instability, and will act accordingly."
 
 ITA_enshrine_the_king:0 "Enshrine the King"
 ITA_enshrine_the_king_desc:0 "The Duce may be the most prominent person in the political scene, but the King is the head of state of the Italian Empire. As part of our efforts to reassure Umberto II of our dedication to Italy's stability, we shall renew our oath of loyalty to the Savoy dynasty, rulers of Piedmont first, then Sardinia and finally all of our country: their uninterrupted line is intertwined with the very fabric of our nation!\n\nTo this end, our glorious Duce shall publicly kneel in front of King Umberto, swearing to serve him in all matters and to protect the nation in his name only. Of course, we expect full autonomy in deciding "how" to best protect Italy, but this goes without saying: the king is a shrewd politician, and will surely understand that this is the best he can get under the current circumstances."
 
 ITA_respect_the_statute:0 "Respect the Statute"
 ITA_respect_the_statute_desc:0 "Approved in 1848 at the start of the First War of Independence against the Austrian oppressors, the Albertine Statute has served ever since as the Constitution of Sardinia first, and then Italy. Limiting the monarch's power out of his own volition in the name, it also grants the citizens several fundamental rights: since the King puts great emphasis over respecting his boundaries, we shall publicly renew our commitment to the Statute and the cause of Risorgimento.\n\nOf course, we do this knowing very well that the Statute is extremely vague in several of its most important sections such as when it gives the government the power to limit the people's right to assemble or voice their opinion. Our Duce is not lying when he says that he intends to uphold the Staturte: he is merely acting within the scope of its provisions, making full use of the powers given to him by the law as Prime Minister, and the King will accept it in exchange for the stability we bring..."
 
 ITA_carta_bianca:0 "Carta Bianca"
 ITA_carta_bianca_desc:0 "Finally, our plan is bringing home the first results. Satisfied by Balbo's openings to the monarchy and the Statute, the King has quietly let the Duce know that he approves of him, and will not oppose his plans to strengthen his authority over the administration and the legislature: as long as we do not threaten Italy's stability or the fabric of the country's institutions.\n\nWith the King's promise not to hinder us, we can now work towards achieving what our glorious leader has been planning for a while. The time has come to make sure that the Parliament and the higher echelons of the state bureaucracy obey us: the functionaries can be easily brought to our side with small, surgical purges, while the legislature will require a bit more convincing."
 
 ITA_leash_the_senate:0 "Leash the Senate"
 ITA_leash_the_senate_desc:0 "The Senators of the Kingdom are directly appointed for life by the King, and are therefore an extension of the royal prerogatives as granted by the Statute. Due to Balbo's promise not to interfere with the King's power, the Higher Chamber of the Parliament will not be abolished nor purged: instead, we shall make sure that its members know full well that the King's honor is on the line, and that they are not to hinder us.\n\nBy ensuring that the current members stand by the King's promise not to obstruct our rise to power, and that the future ones are... sympathetic to our cause, we can very well let the Senate live. Our Duce is a cunning strategist, and knows the value of patience: soon, all will fall in line by their own volition, and the web of contacts granted by the King's associates will be extremely useful..."
 
 ITA_purge_the_chamber:0 "Purge the Chamber"
 ITA_purge_the_chamber_desc:0 "The Chamber of Fasces and Corporation, the Lower Chamber of the Parliament, is composed of members appointed by the corporations that make up our economic tissue. As such, their political influence is minimal, but an issue has been steadily rising with the Chamber's members: due to their relatively low importance, most of them have been engaging in... less than savoury activities.\n\nCorruption, nepotism and embezzlement have spread like a plague over the years, and the people have come to see the Chamber as a symbol of the corruption of our regime. The time has come to transform this institution into something useful: all members with the slightest suspicion of corruption shall be purged without mercy, and replaced by competent economists who will serve as an economic advisory board to the Duce."
 
 ITA_an_iron_fist_in_a_velvet_glove:0 "An Iron Fist in a Velvet Glove"
 ITA_an_iron_fist_in_a_velvet_glove_desc:0 "With the King by our side and the Parliament under control, our glorious Duce has secured his hold over the nation's most important institutions. Even more, he has made them allies rather than bitter enemies: this will prove invaluable in our future endeavors.\n\nViolence begets hate, hate begets resistance, and resistance begets ruination. Italo Balbo knows the value of subtlety, and has strengthened his grip over the state without bloodshed: an iron fist in a velvet glove."
 
 ITA_deal_with_the_bureaucracy:0 "Deal with the Bureaucracy"
 ITA_deal_with_the_bureaucracy_desc:0 "The Italian bureaucracy didn't shine for its competence and honesty before the rise of fascism, and we confidently claim that forty years later, the situation has only worsened. Corruption is endemic at all levels of our administration, and we have yet to decide whether the greatest damage to our finance comes from all the embezzlement happening under our nose, or from the sheer incompetence permeating everything: it is time to act with utmost prejudice.\n\nThe corrupt administrators must be purged, and the incompetent ones shown the doors post haste. We have wasted enough time and money: all aspects of the apparatus of state shall be overhauled, and our bureaucracy will become, if not the best in the world, at least something capable of contributing to our plans for Italy."
 
 ITA_purge_corruption:0 "Purge Corruption"
 ITA_purge_corruption_desc:0 "Years of mixing state and party, public and private interests, have resulted in a pandemic of corruption. Bribery and embezzlement are characteristics shared by all bureaucrats, from the lowliest of pen-pushers and stamp-lickers to the highest functionaries: it is time to eradicate this practice, once and for all.\n\nNew legislation shall be passed, harshly punishing all manners of illegal practices within the administration. Once this is done, all those under suspicion of violating our new laws will face the consequences of their crimes: they shall be purged, and their offices will go to new candidates, who will hopefully learn from what happened to their predecessors..."
 
 ITA_banish_incompetence:0 "Banish Incompetence"
 ITA_banish_incompetence_desc:0 "Some say that criminal intention is worse than fault. They may be right from a legal standpoint, but in the administration, there is little difference between a corrupt bureaucrat and an incompetent one: both of them are a liability, and both of them need to be disposed of.\n\nIt is time to raise the requirements to join our bureaucracy, and fire those who fail to meet the new standards. Slowly but steadily, a new generation of functionaries and pen-pushers will fill the voids left by our reforms: until then, we'll have to deal with the damage..."
 
 ITA_an_ethics_of_service:0 "An Ethics of Service"
 ITA_an_ethics_of_service_desc:0 "For years, bureaucrats have served only themselves and their petty interests. Greed and vainglory have tainted many weak souls, and this has brought us to the sorry state we're in: the time has come to forge a new ethics for our administrative personnel, one steeped in honesty and sacrifice for the good of the Empire.\n\nOur nation fights a constant war against our competitors and against our own shortcomings. All, from top to bottom, must serve in this constant struggle, and the administration shall be at the forefront of the war effort: we shall enforce discipline among the ranks of the bureaucracy, and those who disobey - or worse, accept bribes - shall be treated like the deserters and traitors they are."
 
 ITA_reform_selection_procedures:0 "Reform Selection Procedures"
 ITA_reform_selection_procedures_desc:0 "Not all the blame rests on the bureaucrats themselves. Lax selection procedures have granted places in the administration to people who perhaps genuinely believed themselves worthy, but in the end didn't prove up to the task: it is time to amend this lack of severity.\n\nFrom now on, selection will be stricter, and examination protocols enforced to the letter. Those who fail exams or prove a disappointment during post-selection training will be discarded, to make place for new, promising recruits: large links let the dregs in, and we had enough of that to last us an eternity."
 
 ITA_only_the_best_can_serve:0 "Only the Best Can Serve"
 ITA_only_the_best_can_serve_desc:0 "From now on, in order to join the administration all candidates will require a specialized curriculum. No longer will everyone be accepted as long as they are law graduates: we shall make sure that each sector of the administration is given personnel up to the task.\n\nFrom economists to medics and researchers, all will serve the state to the best of their skills. We shall not waste the many talents waiting to be discovered: Italy has so much to give to herself, and we won't let the chance pass!"
 
 ITA_encourage_competition:0 "Encourage Competition"
 ITA_encourage_competition_desc:0 "For ages, a place in the administration was a guarantee of retirement bonus. People would join as junior functionaries as soon as they were out of the universities, and go through their chosen careers until old age: this complacency and self-assurance is the main cause for stagnation and decadence in Italy.\n\nFrom now on, we shall foster a healthy and competitive environment. Constant scrutiny will ensure that the best are promoted, and the unworthy are either relocated to more suitable tasks, or fired for incompetence: this should ensure that no one gives their office for granted, and will do their best to serve Italy - and through it, truly earn their retirement bonus."
 
 ITA_a_ruthless_meritocracy:0 "A Ruthless Meritocracy"
 ITA_a_ruthless_meritocracy_desc:0 ""
 
 ITA_restore_the_concordia_ordium:0 "Restore the Concordia Ordium"
 ITA_restore_the_concordia_ordium_desc:0 "The people of Italy are restless. For years, they have suffered under the combined yoke of economic stagnation and oppression by a weak, incompetent government. Dissent has risen beyond the point where we could simply send the Blackshirts to deal with dissent: new times require new solutions, and our glorious Duce already has something in mind.\n\nRome endured for millennia due to her famed "concordia ordinum" or "harmony among the classes". All Romans - patricians and plebeians alike - knew that they could not survive without the others, and so they were willing to give something to the others in exchange for something else: it is time for us to give the Italians a reward for their sacrifices, and in exchange we shall keep our power and use it well - a fair bargain indeed, especially for us..."
 
 ITA_subtler_propaganda:0 "Subtler Propaganda"
 ITA_subtler_propaganda_desc:0 "The days of newspapers with entire columns left blank by censorship are gone. The Ministero per la Cultura Popolare is a mockery of a propaganda ministry, and the people have grown weary of the blatant lies spread by paid sycophants: it is time to reform our public relations sector, and make ourselves more believable in the people's eyes.\n\nBy abolishing the MinCulPop and replacing it with the Commissione per la Vigilanza Informativa, we shall no longer brutally suppress the media, but rather provide an... alternative view on the criticism directed to us. Engaging in political debate may seem dangerous, but it does bring rewards: if the OVRA finds something dirty about our critics, it's all the more satisfying..."
 
 ITA_an_honest_government:0 "An Honest Government"
 ITA_an_honest_government_desc:0 "For years, ministers and party officials alike have partaken to the corrupt practices of the state administration. Bribes and favoritism were commonplace in the PNF, and the people's trust in fascism has plummeted: it falls upon us to reverse this sorry state of affairs.\n\nWith our reforms of the bureaucracy already underway, corruption and incompetence are slowly being removed from our administration. This alone is cause for jubilation among the common populace, and we should capitalize on this: by presenting ourselves as a honest government, we should bring the people to our side once again."
 
 ITA_the_carrot_and_the_stick:0 "The Carrot and the Stick"
 ITA_the_carrot_and_the_stick_desc:0 ""
 
 ITA_reduce_restrictions:0 "Reduce Restrictions"
 ITA_reduce_restrictions_desc:0 "While we may control the people's actions, we can't exert the same authority over their thoughts. Preventing the people from meeting, talking about politics or expressing their discontent towards us will not make our problems disappear: instead, they will fester and rot like an infected wound, until it will be too late to do anything about it.\n\nBy lifting most restrictions on meetings and political discourse, the people will feel less oppressed, and more willing to trust us to pursue their interests. While some would see this as madness, our glorious Duce knows that freedom is but an illusion, and that we have more... subtle ways to make our opponents disappear, without making them actually disappear."
 
 ITA_crack_down_on_the_terrorists:0 "Crack Down on the Terrorists"
 ITA_crack_down_on_the_terrorists_desc:0 "While the common people can be satisfied with more "freedom", there are some who will not buy our reforms, and will directly strike at us. Communist partisans and native rebels will never relent in their quest to destroy fascism, and to achieve their dream, they'll leave no stone unturned: this can be used to our advantage, of course, and our great leader already has a plan.\n\nBy using the "free" media to show that the so-called "liberators" do not spare civilians in their quest for vengeance, we shall depict them as enemies of peace rather than enemies of the state. If the people are convinced that these terrorists will harm them, they will lose most of their support, and it will justify cracking down on them with utmost prejudice: new times call for new strategies, after all..."
 
 ITA_fascism_for_the_modern_age:0 "Fascism for the Modern Age"
 ITA_fascism_for_the_modern_age_desc:0 "The times of the Squadracce and the Blackshirts are gone. Violence and terror do not ensure stability in the long run, and this has almost brought us to the brink of collapse: we have learned this painful but precious lesson, and have changed our strategy accordingly.\n\nThanks to his cunning reforms, Italo Balbo has achieved what Galeazzo Ciano failed to. By presenting a more "human" face to the people, and subtly manipulating public opinion to his favor, he has created a new fascism, one where the people live in the illusion of freedom, willingly bowing their heads to us: truly, a masterwork of political genius!"
 
 ITA_a_new_italy:0 "A New Italy"
 ITA_a_new_italy_desc:0 "Like the seasoned commander that he is, Italo Balbo has first outlasted his competitors, and now secured his hold over Italy in a masterful show of political strategy. Thanks to his careful approach and subtle manipulations, the King, the bureaucracy and the people are on our side: our enemies are few and isolated, and no longer pose a direct threat to our rule.\n\nThe time has come for our glorious Duce to reap the fruits of his reforms. This level of control over state affairs will surely be of help for our future, important challenges: with strong shoulders to lean on, we'll surely achieve our dream of a new, powerful Italy for all to see!"
 
 ###=====| c) Economy Tree |=====###
 ITA_restarting_the_economy:0 "Restarting the Economy"
 ITA_restarting_the_economy_desc:0 "In the last twenty years, the Italian economy has suffered much. The Atlantropa disaster, Ciano's incompetence rule, and finally the disbandment of the Triumvirate have left deep scars into our economic tissue: unemployment has risen significantly, many businesses went bankrupt and public debt has skyrocketed to prevent the poor people from starving.\n\nThe time has come to restart our economy from its very foundations. Our great Duce already has a plan, and his advisors merely await for the perfect moment to begin with the reforms: the road will be neither short nor easy, but we are confident in his ability to lead us out of this crisis and into a new future!"
 
 ITA_the_labor_matter:0 "The Labor Matter"
 ITA_the_labor_matter_desc:0 "With unemployment rates higher than ever, and work conditions objectively hard for most of those who still have a job, it's no wonder that discontent and socialism are spreading like wildfire in the factories. As long as the workers perceive themselves as fodder for others to discard at their leisure, they'll find new and better paladins: it's time to act, and reverse this trend.\n\nOf course, we shall never lower ourselves to parlay with the reds, nor shall we forget the invaluable support of the higher classes. However, there is no doubt over the fact that some reform is needed: otherwise, we risk finding ourselves with red terrorists everywhere!"
 
 ITA_expand_the_cncs:0 "Expand the CNCS"
 ITA_expand_the_cncs_desc:0 "The CNCS, or Confederazione Nazionale delle Corporazioni Sindacali, is the only recognized trade union in Italy. With millions of members, it should be our best instrument to keep the workers happy and inoffensive: on the contrary, over the years it has turned into a quagmire of corruption and inefficiency.\n\nAs it is, the situation is untenable. By deeply reforming and expanding the CNCS, however, we can easily turn it into it was supposed to be from the beginning: actually consulting it from time to time should do wonders for its credibility, too..."
 
 ITA_against_the_red_menace:0 "Against the Red Menace"
 ITA_against_the_red_menace_desc:0 "Even under our new management, some things never change. The communist and socialist unions, underground terrorist groups endlessly plotting our demise, are a serious threat to our very existence: therefore, there can be no compromise with them or with their pawns.\n\nIn order to show our commitment to the eternal fight against the red beast, we shall devote new funds and more men to fight this cancerous growth within our nation's bosom. By rewarding the faithful and punishing the traitors, we expect the reds to lose a large share of their potential recruits: in the long run, we shall prevail."
 
 ITA_better_worker_conditions:0 "Better Worker Conditions"
 ITA_better_worker_conditions_desc:0 "Despite all our propaganda, we can't deny the truth. The workers of Italy, especially those in dangerous or lowly professions, live a meager existence: low pays and long work days are a perfect recipe for dissent and subsequent disaster.\n\nIf we want to strengthen our hold over the lower classes, then we must concede something they desire. By playing the middleman between business owners and workers, we can ensure some good changes without subverting the rightful order of things: raising minimum salary, and lowering the maximum work hours, should be enough to make everyone a bit happier without discontenting anyone else."
 
 ITA_a_pragmatic_solution:0 "A Pragmatic Solution"
 ITA_a_pragmatic_solution_desc:0 "Limited reform, a bit of good will, and careful use of the police are always the solution. By giving the workers a bit of what they wanted, and showing what happens to those who ask for too much, we have achieved our goal: to keep the lower classes content without angering their superiors.\n\nWith the matter of labor solved, we can safely presume that productivity will start increasing once again. As the workers return to the factories with just the right amount of grumbling, and the reds return to the sewers they fit perfectly inside, we can dedicate ourselves to more important matters: our economy will start growing again!"
 
 ITA_the_eternal_iri:0 "The Eternal IRI"
 ITA_the_eternal_iri_desc:0 "The Istituto per la Ricostruzione Industriale is the largest public fund in Italy, and among the most powerful in the world. With a budget numbering in the hundreds of billions of Lire, the IRI fulfills a two-folded mission: funding private businesses so that they don't fall to foreign competition, and directly owning several staple industries to make sure that our strategic needs are always satisfied.\n\nTwenty years of slow decadence have forced our predecessors to cut the IRI's budget, but the Institute has endured nonetheless. With our economic fortunes looking a bit brighter, we can thoroughly reform our best economic asset so that it can once more act as the lynchpin of our economy: it will be fundamental for our future endeavors too..."
 
 ITA_revise_the_board:0 "Revise the Board"
 ITA_revise_the_board_desc:0 "The current board of executives of the IRI is... disappointing to say the least. Galeazzo Ciano has made the board a place of corruption and nepotism, filling it with cronies with no ability for the economy, but plenty of experience in boot-licking: it is time for spring cleaning.\n\nOur Duce has already prepared the necessary decrees. By removing the incompetent or corrupt members, and replacing them with technocrats both loyal and competent, we shall make sure that all the funds we give the IRI shall be used for the economy's sake: we'd rather avoid ending up paying for some kleptocrat's new marble bathtub..."
 
 ITA_establish_new_priorities:0 "Establish New Priorities"
 ITA_establish_new_priorities_desc:0 "It is evident that our current economic situation doesn't allow us any lavish expense. Funds thrown at unproductive businesses just for the sake of it will only harm us in the long run: if we want to increase the IRI's efficiency, we'll need to revise the criteria upon which subsidies are granted to private businesses.\n\nBy creating clear and efficient procedures, and hiring experts in market management, we'll be able to predict economic upturns and downturns. Giving the right amount of money to the right businesses will be much more efficient than simply stuffing random pockets full of Lire: not one coin shall be wasted!"
 
 ITA_istat_cooperation:0 "ISTAT Cooperation"
 ITA_istat_cooperation_desc:0 "The ISTAT, or Istituto Nazionale di Statistica, is the state's statistical bureau. From its offices, all manners of researches, polls and inquiries are performed, with the goal of giving the government a clear idea upon which to calibrate our action: without it, we would simply fumble in the dark.\n\nBy creating a special ISTAT office dedicated to market studies, we'll be able to foster cooperation between the bureau and the IRI. With its unparalleled surveying skills, the statistics institute will be invaluable in directing our economic investments towards the right target: sometimes, a sniper can cause more damage than a mortar shot..."
 
 ITA_public_private_sector_cooperation:0 "Public-Private Sector Cooperation"
 ITA_public_private_sector_cooperation_desc:0 "While the IRI has a large impact on our economy, by no means do we live in a state-run economy like the socialist nations. Alongside the public-owned and public-subsidized businesses exist thousands of private enterprises, both large and small: this, however could turn into a liability.\n\nShould businesses in the IRI's galaxy enter into competition against Italian private enterprises, the resulting clash would seriously damage our economy. By fostering cooperation and coordination between the private and public sectors, we can direct our economic energies towards our true enemy: the plague of foreign hostile acquisition!"
 
 ITA_broaden_the_budget:0 "Broaden the Budget"
 ITA_broaden_the_budget_desc:0 "Now that we have pinpointed the IRI's priorities, and overhauled the composition of its board of executives, the time has come to begin the actual spending. The Institute's budget will be dramatically increased, and its tendrils will sink into our economy: the swamp will be drained, and our ailing businesses will receive much-needed relief.\n\nUnder the direction of the new, improved board, and with absolute precision, the IRI will direct our economy onto the right course. Italy will slowly but steadily become a powerhouse of production and profit for all to reap the benefit: when all have what they need, the government can rest easy..."
 
 ITA_bring_in_the_big_guns:0 "Bring in the Big Guns"
 ITA_bring_in_the_big_guns_desc:0 "Preliminary results have been satisfying. With our GDP steadily growing, and unemployment rates lowering, we are confident that the IRI can extend its scope of activities without any significant loss of effectiveness: it's time to bring in the big guns.\n\nMore funds shall be pumped into the economy, enough to give it a decisive push. With our strategy tried and tested, we are confident in our success: prudence is always best, but sometimes it's more rewarding to be daring!"
 
 ITA_encourage_population_growth:0 "Encourage Population Growth"
 ITA_encourage_population_growth_desc:0 "Unlike our direct competitors on the other side of the Alps, and those on the other shore of the Atlantic, we cannot call upon hundreds of millions of countrymen. This is not merely a disadvantage in war: a lower population also means a smaller internal market, and less potential workers to sustain our production.\n\nThe economic crisis has lowered birth rates as families are afraid of adding new mouths to feed, and this is unacceptable. If we want to truly become a world superpower, then we need to increase the raw substance upon which all great nations are created: our people."
 
 ITA_motherhood_subsidies:0 "Motherhood Subsidies"
 ITA_motherhood_subsidies_desc:0 "When times are difficult, the expression "having more mouths to feed" takes a rather dreadful meaning. The crisis has made it clear that If a family can barely feed itself currently, more children would make everyone starve: why adding to your problems when you are already overwhelmed by the current ones?\n\nTo address this fundamental issue, the state must step in until our economy is once again prosperous. By granting tax cuts and state pensions to mothers who bear many children, we'll relieve the poorer families of their economic burden: like the legendary Cupid, we are merely removing obstacles in the way of love..."
 
 ITA_tax_the_unmarried:0 "Tax the Unmarried"
 ITA_tax_the_unmarried_desc:0 "Sometimes, love isn't needed to create a family. If people truly have no other reason to marry and have children, then we'll give them one, a tale as old as time: money.\n\nBy instituting a special tax on all unmarried men and women under thirty, they'll think twice before remaining single. The needs of the state are superior to the desires of the single: Italy needs children, and all those who have functioning loins are supposed to contribute."
 
 ITA_fighting_the_long_war:0 "Fighting the Long War"
 ITA_fighting_the_long_war_desc:0 "Demography is like a long war, in which the results of our current policies will be seen only years from now. This, however, shouldn't deter us from fighting with all our energy until we reach our goal: zeal is always rewarded!\n\nTo this end, we shall begin a massive propaganda campaign. Men and women with more than four children will be hailed as heroes and heroines of fascism, and our great Duce himself will come to the baptism of any seventh son or daughter: with this, we are sure to see improvement in our current birth rates."
 
 ITA_demographic_explosion:0 "Demographic Explosion"
 ITA_demographic_explosion_desc:0 "It seems that the first results of our policies are coming along nicely. From our latest ISTAT reports, birth rates have increased much from last year's average: this is exactly what we wanted to hear!\n\nIf the people are the brick-and-mortar of any nation, then we are building up quite a reserve. The possibilities opening to us now are endless: more Italians means more workers, more customers, more soldiers, more colonists..."
 
 ITA_a_resurgent_italian_economy:0 "A Resurgent Italian Economy"
 ITA_a_resurgent_italian_economy_desc:0 "Finally, our reforms are producing results, and all our advisors agree that they are more than satisfying. New businesses are opening up every day, unemployment is tumbling down, and birth rates are exploding: truly, we are experiencing a miracle, an Italian economic miracle!\n\nNow that the economy is stable and looking better and better, it is time to concentrate on larger, more important matters. With our great infrastructural projects beginning all across the Empire, we need investments and expertise we didn't possess before: with this basis, however, we are confident that we shall succeed!"
 
 ITA_expand_infrastructural_projects:0 "Expand Infrastructural Projects"
 ITA_expand_infrastructural_projects_desc:0 "The scale of our great infrastructural projects is unprecedented in the history of our nation. From the initial industrialization of Italy, to the draining of the Pontine marshes, nothing matches our gargantuan efforts: not even the Romans at the peak of their glory can boast such marvels of engineering!\n\nHowever, we have to admit that the logistics effort required by projects of such scale is daunting. The needed materials, workers, funds and projects are straining our bureaucracy to the limit: we need to expand our planning and directing capacity, or we risk to see inefficiency and corruption spread all throughout the construction sites!"
 
 ITA_institute_the_anac:0 "Institute the ANAC"
 ITA_institute_the_anac_desc:0 "When you throw something foul out of the door, it usually tries to return through the window. Such is the case with corruption: despite our recent reforms, the scale of our investments is so great that people are willing to do anything to get even a tiny morsel, and bribery and embezzlement are once again rearing their ugly head.\n\nThe time has come for a concerted anti-corruption effort. Our penal prosecutors can't be asked to focus only on corruption charges, and here's where our new creature comes in: the ANAC, or Autorità Nazionale Anti Corruzione, shall be a new governmental agency tasked with finding corruption wherever it hides, and presenting all results to the prosecutors, saving them much-needed time and resources."
 
 ITA_tour_the_construction_sites:0 "Tour the Construction Sites"
 ITA_tour_the_construction_sites_desc:0 "After initial experiments, it seems that Italo Balbo has a thaumaturgic power. Wherever he passes, workers build things faster, architects seem to complete their projects ahead of schedule, and supplies are found where there were thought to be none: if Niccolò Giani was still alive, he'd surely point this out as a miracle of the fascist faith.\n\nIn order to make full use of our Duce's presence, we shall schedule surprise visits to construction sites all across Italy. We are confident that his shining example will inspire our dutiful workers to push themselves even harder for the glory of fascism: if not, the consequences of disappointing our glorious leader should have the same effect..."
 
 ITA_infrastructure_leads_to_rome:0 "Infrastructure Leads to Rome!"
 ITA_infrastructure_leads_to_rome_desc:0 "With our logistical capacity improved, and new agencies tasked with fighting corruption and inefficiency, activity is being streamlined and efficiency is improving substantially. The Duce himself has been touring the construction sites, providing an inexhaustible source of inspiration for the workers: all this will surely bring success in the long run!\n\nIn the ancient times, people used to say that all roads lead to Rome. With our new infrastructure projects well underway, we'll soon be able to claim something even greater: now, all roads, railroads, airports and ports shall lead to Rome!"
 
 ###=====| d) Military Tree |=====###
 ITA_defending_the_empire:0 "Defending the Empire"
 ITA_defending_the_empire_desc:0 "Our homeland is beset by enemies. The German traitors lurk to the other side of the Alps, merely waiting for a sign of weakness to finish what they started with Atlantropa, and their misbegotten brethren in Burgundy are just another proof of the inherent evilness of the German people: we need to defend ourselves from the hungry wolves circling us.\n\nHundreds of thousands of brave soldiers have died to achieve our dream of a great and powerful Italy. By our honor, we swear not to let such a valiant sacrifice go in vain: from the tallest of the Monte Bianco's icy peaks to the sun-scorched sands of the Libyan deserts, we shall fight to protect our Empire as if it were the sacred hills of Rome herself!"
 
 ITA_protecting_mare_nostrum:0 "Protecting Mare Nostrum"
 ITA_protecting_mare_nostrum_desc:0 "Despite Atlantropa closing down the main access to the Mediterranean, leaving the highly-fortified Suez canal the only viable entry way, we are still at risk. Our economy hinges on the precious oil tankers and trade convoys allowing us to export our products and import rare materials: if we were to lose control of the Mediterranean, we would perish.\n\nTo this end, we need to review the state of our navy. The Regia Marina is a venerable institution, filled with the cream of our officer corps, but its ships are mostly relics of the last war: if we want to survive a clash against the Kriegsmarine - our most likely enemy - then we need to catch up immediately."
 
 ITA_new_carriers:0 "New Carriers"
 ITA_new_carriers_desc:0 "Despite what some of our most senior officers would like, the age of the battleship is over. We all remember the day when our great Littorio-class flagships hammered down the forts of Malta, sealing the fate of the British Mediterranean fleet, but times have changed since then: a single carrier can now bring more destruction than an entire battleship task force, for a fraction of the cost.\n\nWhile we do possess some carriers, they are mostly civilian ships hastily converted during the war, and are too small and slow for our current needs. If we are to maintain our supremacy over the Mediterranean, then we need to bridge the gap that separates us from our rivals: we need large supercarriers to act as the fleet's new flagships, and smaller, faster patrol carriers to protect our trade routes from small pirate or raiding vessels."
 
 ITA_improved_cruisers:0 "Improved Cruisers"
 ITA_improved_cruisers_desc:0 "The invention of the Japanese long-lance torpedoes and the miniaturization of the now-ubiquitous missiles have turned the humble cruiser from the "beggar's battleship" into the mainstay of modern fleets. Smaller, faster and cheaper than a battleship - or even a battlecruiser - they can nonetheless unleash enough firepower to sink even the greatest dreadnoughts in a minute: we need to make such power ours, and turn it against our enemies.\n\nAdding to their usefulness, light cruisers can also act as minor flagships for patrol task forces. With their high speed and fearsome firepower, they can reliably destroy any pirate or raiding vessel without the need to call for bigger ships: our trade routes in the Indian Ocean would surely benefit from such technology!"
 
 ITA_out_with_the_old_in_with_the_new:0 "Out with the Old, in with the New"
 ITA_out_with_the_old_in_with_the_new_desc:0 "With our new vessels designed, it is time for the actual renovation of the Regia Marina to begin. The first step will be the scuttling of all our obsolete battleships and carriers: while useful for the propaganda, they are actually useless in any combat role, and their sinking would hurt our pride much more than their honorable discharge.\n\nHowever, we need to be quick in replacing the old ships with new, modern vessels. While old, our capital ships were the lynchpin of the fleet, and with them gone our hold over the seas will be severely weakened: we need to fill the ranks once again before our enemies notice it and start plotting against us!"
 
 ITA_anti_submarine_warfare:0 "Anti-Submarine Warfare"
 ITA_anti_submarine_warfare_desc:0 "It's a well-known fact that the Reich favors U-Boats over the surface fleet. If we are to properly defend our seas against a potential German aggression, then we'll need to counter their submarines, especially in the Indian Ocean: without protection, our trade routes would become an ocean graveyard...\n\nTo address this issue, we need to develop new, more effective methods to spot and destroy submarines. Improved sonars, radars and depth charges will be fundamental for the war effort: they will act as our eyes into the abyss, shielding us from the terror from below!"
 
 ITA_faster_patrols:0 "Faster Patrols"
 ITA_faster_patrols_desc:0 "Despite our fleet being the fourth largest in the world, we still can't be everywhere. Our patrols can't secure every square inch of sea at the same time, and this could leave our flanks open to enemy raids: we need to secure our trade routes at all costs!\n\nBy investing in better communications, and faster patrol vessels, we'll be able to reduce casualties to the minimum. With enough destroyers, frigates and corvettes patrolling the sea, no one will be able to disrupt our trade: the fact that they are cheap vessels only adds to their usefulness!"
 
 ITA_shield_of_the_indian_ocean:0 "Shield of the Indian Ocean"
 ITA_shield_of_the_indian_ocean_desc:0 "With our reforms complete, we have now extended the fleet's reach into the Indian Ocean. As long as our patrols keep the oil shipping lanes clear of enemy threats, the war effort will be sustained by the black gold: this is our main goal in the sea.\n\nWith the new and improved Regia Marina, we shall soon be able to expand our sphere of influence farther than ever before. As our trade interests broaden, so too will our power: the riches of India await!"
 
 ITA_clash_of_the_eagles:0 "Clash of the Eagles"
 ITA_clash_of_the_eagles_desc:0 "As the last war taught, it is now possible to defeat an enemy without even firing a single shot. A strong enough air force can turn an entire country into a blazing inferno, forcing the government to kneel with the sheer power of napalm and strategic bombing, and our main rival knows this well: the Luftwaffe is the largest air force in the world, dwarfing all others and posing a strategic threat to our very homeland.\n\nItalo Balbo has been instrumental in modernizing the Regia Aeronautica back in the Twenties, and is eager to resume his work after twenty years of decadence in Ciano's incompetent hands. Under his expert eye, our air force will be reforged into an unstoppable machine, capable of protecting our skies from any would-be conqueror: should the eagles clash, it will be ours to come up on top!"
 
 ITA_the_eagles_wings:0 "The Eagle's Wings"
 ITA_the_eagles_wings_desc:0 "Fighters are the linchpin of any air force. Acting as the main defence against enemy incursions, and leading the way to daring attack strikes, they are the very wings allowing the eagle to fly: without fighters, our entire air force would simply tumble to the ground.\n\nWith jet engines being the new frontier in air combat, we need to improve our already-existing basis. New, faster engines will allow our fighters to defeat enemy competition, and modern airframes will allow our pilots to remain agile even at extreme speeds: the battle for England was won by the Germans, we'll make sure that the Battle for Italy will be different!"
 
 ITA_the_eagles_talons:0 "The Eagle's Talons"
 ITA_the_eagles_talons_desc:0 "Close air support provides vital support to our troops in the thick of the fight. With their high maneuverability coupled with light - but still effective - weaponries such as autocannons and small bombs, they are the talons allowing the eagle to rip its opponent's throat in a precise strike: no modern war can be won without such surgical intervention.\n\nIn order to sharpen our claws, we need to invest in the development of new armament and airframes. With the miniaturization of missiles, bombs and cannons, our close air support will be able to bear down even deadlier firepower without any significant loss in agility and speed: this, coupled with jet engines, will grant the Regia Aeronautica a fearsome weapon to support our land forces with."
 
 ITA_expand_military_airports:0 "Expand Military Airports"
 ITA_expand_military_airports_desc:0 "With our Duce's plans to massively expand our air force, it's only natural that the infrastructure supporting it needs to grow accordingly. As the last was proved to us, concentrating all of our forces into a single point is the perfect recipe for disaster: as the French how that went...\n\nIf we want to maintain control over the skies of the Empire, then we need to spread out our air force to the four corners of our homeland. Building new air strips in every region, from Lombardy to Libya, will provide us with much-needed flexibility and a strategic reserve should one of our airports be rendered unusable by enemy bombings: reinforcing our military airports with anti-air batteries and radar systems would also grant them all the protection they need..."
 
 ITA_turning_the_tables:0 "Turning the Tables"
 ITA_turning_the_tables_desc:0 "Italo Balbo is a man with a vision, and he has the will and the means to turn it into reality. In his plans, the Regia Aeronautica isn't merely supposed to resist a German invasion infinitely: given enough time, it will decimate the Luftwaffe until it is no longer able to protect the Reich's heartland.\n\nWhen this happens, it will be our turn to exact our revenge on our hated foes. New air squadrons, brimming with hundreds of tactical and strategic bombers, will be unleashed over the German cities, turning their industries, their greatest monuments, and their very pride into ash: only then will true victory be ours!"
 
 ITA_always_one_step_ahead:0 "Always One Step Ahead"
 ITA_always_one_step_ahead_desc:0 "It is no mystery that the Luftwaffe is extremely advanced, and that new funds are constantly devoted to its improvement. If we want to resist the onslaught and hope to one day turn the tables, then we need to be one step ahead of them: our aircraft must be faster, more agile and more powerful than theirs if we are to hope in the final victory.\n\nTo this end, we shall massively expand our research and development department. With all the expertise they need, and virtually no limits on their experimental research, our best scientists and engineers will be able to express all their genius in a suitable environment: soon, we'll always be one step ahead of the Germans, and with it, the entire world..."
 
 ITA_fill_our_skies:0 "Fill Our Skies"
 ITA_fill_our_skies_desc:0 "With the Luftwaffe's raw size and the Reich's gargantuan industrial power, we need to bridge the production gap as soon as possible. Having skilled pilots is useless if they are simply going to be overwhelmed and brought down by concentrated enemy fire: we need to address this issue quickly!\n\nOur engineering department has an idea to increase productivity. By studying new, highly-modular, airframe components, we can increase efficiency and production rates as most of our planes now use the same components: soon, the skies will be filled with the Tricolore, and our enemies will be reduced to ashes by our wrath!"
 
 ITA_fill_their_graves:0 "Fill Their Graves"
 ITA_fill_their_graves_desc:0 "Despite what we would like, we'll never be able to reach Germany's production rates. Concentrating on quantity will never be enough to bridge the gap, which means that we need to focus on the opposite: quality.\n\nBy ensuring our pilots are extremely skilled, and our airframes are the best on the market, we'll make our air force able to resist even in numerical inferiority. As the enemy skies empty, and their graveyards fill with unfortunate pilots, their ability to resist will crumble: in the long run, this is the best strategy for victory."
 
 ITA_a_matter_of_pride:0 "A Matter of Pride"
 ITA_a_matter_of_pride_desc:0 "Our glorious Duce is a prideful man. In his youth, he revolutionized the Regia Aeronautica when planes were still made of wood, creating a modern doctrine and the first paratrooper units, and now, older but wiser, he has once again performed his miracle: he has brought our air force into the age of jet engines, where speed can turn the world on fire.\n\nThanks to our great reform, we are finally a worthy opponent to the Luftwaffe. Even better, Italo Balbo has finally achieved his dream: protecting our skies from the Alps to Libya, the Regia Aeronautica is now the pride of our armed forces!"
 
 ITA_protecting_the_heartland:0 "Protecting the Heartland"
 ITA_protecting_the_heartland_desc:0 "With our enemies so close to us, the heartland of Italy could quickly become a battlefield where the very future of our nation is decided. Knowing this, our Duce has declared the protection of our capital province a priority: should Italy fall, the rest of the Empire would quickly follow.\n\nLuckily for us, our sacred homeland is far from a soft target, and unforgiving towards invaders. For millennia, our natural defences have deterred enemy invaders: with the help of modern technology and the Regio Esercito, it will become a fortress, mercilessly bleeding anyone foolish enough to test its defences!"
 
 ITA_italias_bejewelled_crown:0 "Italia's Bejewelled Crown"
 ITA_italias_bejewelled_crown_desc:0 "The Alps, with their icy peaks, are a sight to behold. Eternal and immutable, they are at the same time the crown to our beautiful homeland, and its deadliest defence. Hannibal lost half of its African troops to the unforgiving cold, and the Austrians paid in blood for their hybris when they stormed our fortresses: with enemies lurking once again just outside of our reach, the time has come to add new, bigger jewels to Italy's icy crown...\n\nBy improving the existing Alpine Wall to the Eastern border, and building new fortifications to the West - where we border the Burgundians - we'll turn our mountains into a death field. Bunkers, pillboxes, mine fields, crossfires, anti-aircraft batteries, underground trenches and mountain tunnels will allow us to turn any enemy offensive into a bloodbath with minimal losses on our side: no matter the odds, we shall not surrender our home!"
 
 ITA_expand_the_alpini:0 "Expand the Alpini"
 ITA_expand_the_alpini_desc:0 "The Alpini, our elite mountain troops, have a long and proud history, having fought valiantly under extreme duress in a myriad circumstances. From the mountains of Trentino in the First World War to the snow wastes of Russia in the Second, they have brought infinite honor to the Tricolore by performing incredible feats: often shouldering their cannons and machine guns, they are used to fight under all circumstances.\n\nWith the Alps being once again a potential battlefront, the time has come to review the state of our venerable mountain troops. By expanding the Alpini with new recruits taken from mountainous regions such as Sardinia and Savoy, and improving their equipment with specialized rifles, light-weight machine guns and synthetic-fiber clothes, they'll be able to defend our native mountains until the end of time: no enemy eye shall gaze the Pianura Padana ever again!"
 
 ITA_securing_the_colonies:0 "Securing the Colonies"
 ITA_securing_the_colonies_desc:0 "Our colonial domains are large and hostile. With natives still resisting our rule, and enemies such as Iberia and Turkey reminding us of the fact that we are surrounded by wolves, we must act quickly to make sure no one threatens the Empire's outer provinces: should we lose our hold over the Mediterranean coasts, it will be a disaster!\n\nTo this end, we shall overhaul our colonial garrisons. Motorizing patrols and expanding colonial detachments will be an important step towards increasing security: from there, we'll further strengthen our hold over the colonies!"
 
 ITA_motorized_desert_cavalry:0 "Motorized Desert Cavalry"
 ITA_motorized_desert_cavalry_desc:0 "For centuries, camels and horses have been the best way to patrol the desert. Even now, most of our colonial troops employ cavalry detachments to quickly travel between outposts and garrisons: while effective, we live in a new age, and we have much better ways to keep control over the desert.\n\nBy developing special-duty trucks with larger tires and less fuel consumption requirements, we'll phase our cavalry, and turn our patrols into fully-mechanized forces. Adding Infantry Fighting Vehicles to the largest detachments will give our men firepower and protection no rebel could ever have: this will prove instrumental in keeping order in the more unruly parts of the Empire..."
 
 ITA_bullets_not_men:0 "Bullets, not Men"
 ITA_bullets_not_men_desc:0 "As an advanced nation, we have both the expertise and the resources to deploy large artillery detachments in support of our land troops. From fixed anti-air batteries to towed artillery and even self-propelled missile launchers, there is an extreme variety of ways to rain death upon our foes: we should choose where to focus our efforts, and update our artillery post haste.\n\nBy developing and then streamlining our new artillery forces, we'll be able to offer our troops vital help in submitting enemy resistance. Be they mobile or static batteries, artillery guns have always had one historical purpose: to spend bullets instead of men, and destroying the enemy in the process."
 
 ITA_man_the_gates:0 "Man the Gates!"
 ITA_man_the_gates_desc:0 "Thanks to our reforms, Italy has become a veritable fortress, an extension of the Aurelian Walls still protecting our great capital after two thousand years. With the Alps protecting our homeland to the North from the German threat, and our colonial garrisons keeping order in the other provinces, we have achieved a great feat: no longer shall barbarian hordes sully our beautiful home with their presence!\n\nHowever, there's no time to sit on our laurels. Despite what some may claim, war always changes, and what was top tier yesterday will be obsolete tomorrow, and useless next week: we need to constantly develop new ways to keep our beloved Italy safe, or we'll end up like our predecessors, divided and weak!"
 
 ITA_an_impregnable_fortress:0 "An Impregnable Fortress"
 ITA_an_impregnable_fortress_desc:0 "For centuries, Italy has been divided and weak, victim of evil minds and predatory interests. When Italy was united again, more than a hundred years ago, we vowed never to let it fall into that state again: after decades of war and bloodshed, we upheld our sacred oath, but the next task - protecting our new homeland - would be even more daunting.\n\nFinally, our Duce has achieved what even our Roman predecessors failed to. With the Regia Marina controlling the seas leading to our shores, the Regio Esercito defending our borders against any foe, and the Regia Aeronautica keeping our skies clear of any threat, the Empire is an impregnable fortress: woe to any invader, for they shall pay with their blood for every inch they take!"
 
