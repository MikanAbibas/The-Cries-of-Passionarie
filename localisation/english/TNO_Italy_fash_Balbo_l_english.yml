 ##Southern Italy##
 
 #Show/Hide
 
 ita_balboimper_show_southern_italy:0 "Show decisions for Southern Italy"
 
 ita_balboimper_hide_southern_italy:0 "Hide decisions for Southern Italy"
 
 #Stage 1 Projects
 
 ita_balboimper_S1_project_1_southern_italy:0 "Expand Southern Airports"
 ita_balboimper_S1_project_1_southern_italy_tt:0 "Air travel is becoming increasingly important. With the difficult terrain of our homeland, a wide network of small and medium airports will surely help ease the strain on our ailing infrastructure.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_1_SI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P1_SI]\n\n[ROOT.GetITA_balboimper_S1_airporteffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 #use generic
 
 ita_balboimper_S1_project_2_southern_italy:0 "Improve Irrigation in Sicily and Puglia"
 ita_balboimper_S1_project_2_southern_italy_tt:0 "The Table of the Apulias and Sicily - Italy's breadbasket in the ancient times - are the main food producers in Southern Italy. The increasingly-hot climate, however, requires a deep rework and expansion of the irrigation system if they are to keep supplying the Mezzogiorno.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_2_SI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P2_SI]\n\n[ROOT.GetITA_balboimper_S1_irrigationeffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_2_southern_italy_not_completed:0 "The Table of the Apulias and Sicily - Italy's breadbasket in the ancient times - are the main food producers in Southern Italy. The increasingly-hot climate, however, requires a deep rework and expansion of the irrigation system if they are to keep supplying the Mezzogiorno."
 ita_balboimper_S1_project_2_southern_italy_completed:0 "By minimizing water dispersion and building new, widespread channeling systems across the fertile lands of Apulia and Sicily, we have reclaimed thousands of acres of arable land. Thanks to our efforts, Naples and Palermo are no longer reliant on food imports from afar, a great feat and a boon for our support among the lower classes!"
 
 ita_balboimper_S1_project_3_southern_italy:0 "Expand Syracuse and Taranto Tradeports"
 ita_balboimper_S1_project_3_southern_italy_tt:0 "With Gibraltar dammed and the Adriatic drained, the Suez is the lifeline connecting Italy to the rest of the world. As a result, Syracuse and Taranto - the mainland ports closest to the Channel - should be the target of a concerted effort aimed at expanding their trade ports and surrounding infrastructure.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_3_SI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P3_SI]\n\n[ROOT.GetITA_balboimper_S1_porteffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_3_southern_italy_not_completed:0 "With Gibraltar dammed and the Adriatic drained, the Suez is the lifeline connecting Italy to the rest of the world. As a result, Syracuse and Taranto - the mainland ports closest to the Channel - should be the target of a concerted effort aimed at expanding their trade ports and surrounding infrastructure."
 ita_balboimper_S1_project_3_southern_italy_completed:0 "Thanks to our efforts, the ports of Syracuse and Taranto have been transformed into large, functional trade ports connected to the wider national infrastructure. As trade flows once again, these two ancient Greek colonies resume their ancestral role - that of centers of trade and culture, of wealth and prosperity!"
 
 #Stage 2 Projects
 
 ita_balboimper_S2_project_1_southern_italy:0 "Build the Autostrada Imperiale in Southern Italy"
 ita_balboimper_S2_project_1_southern_italy_tt:0 "The Imperial Highway will connect all the major cities in the Empire, allowing for a fast and efficient movement of people and goods.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S2_1_SI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S2_P1_SI]\n\n[ROOT.GetITA_balboimper_S2_raccordoeffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 
 ita_balboimper_S2_project_2_southern_italy:0 "Build the Ferrovia Imperiale in Southern Italy"
 ita_balboimper_S2_project_2_southern_italy_tt:0 "The Imperial Railway will connect all the major cities and industrial centers in the Empire, allowing for a fast, efficient and cost-effective movement of people, and especially goods.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S2_2_SI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S2_P2_SI]\n\n[ROOT.GetITA_balboimper_S2_raccordoeffect_not_completed]Completing the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 
 #Stage 3 Projects
 
 ita_balboimper_S3_project_1_southern_italy:0 "Build the Raccordo Cagliari-Ajaccio"
 ita_balboimper_S3_project_1_southern_italy_tt:0 "The islands of Corsica and Sardinia, reunited a first time after our victory in the last war, and then permanently by the Gibraltar Dam, have been left behind in the past decades. The time has come to extend the Raccordo Imperiale to Sardinia-Corsica and let the hardy folk of the region welcome modernity and prosperity!\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_1_SI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P1_SI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_1_SI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_1_southern_italy_not_completed:0 "The islands of Corsica and Sardinia, reunited a first time after our victory in the last war, and then permanently by the Gibraltar Dam, have been left behind in the past decades. The time has come to extend the Raccordo Imperiale to Sardinia-Corsica and let the hardy folk of the region welcome modernity and prosperity!"
 #use generic for completed only!
 
 ita_balboimper_S3_project_2_southern_italy:0 "Build the Ponte sullo Stretto di Messina"
 ita_balboimper_S3_project_2_southern_italy_tt:0 "The island of Sicily is separated from the mainland by the Strait of Messina. For decades, talks have been made to build a bridge between the two shores, drastically improving travel times, but the deep waters and unstable ground have always prevented any actual decision from being made. After Atlantropa, however, the level of the sea has dropped enough to make a bridge a feasible - if titanic - endeavor. Time to get to work.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_2_SI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P2_SI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_2_SI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_2_southern_italy_not_completed:0 "The island of Sicily is separated from the mainland by the Strait of Messina. For decades, talks have been made to build a bridge between the two shores, drastically improving travel times, but the deep waters and unstable ground have always prevented any actual decision from being made. After Atlantropa, however, the level of the sea has dropped enough to make a bridge a feasible - if titanic - endeavor. Time to get to work."
 ita_balboimper_S3_project_2_southern_italy_completed:0 "From time immemorial, Sicily and Italy - Scylla and Charybdis of Omerian memory - have been separated by a thin line of water, tragic lovers sentenced to forever gaze at each other without ever being able to reach their outstretched hands. No more: the two parts of our nation are now joined, unbreakable steel in place of a wedding band, and a promise of prosperity as nuptial vow."
 
 #Bonus project! ##So basically on these, have them be visible but put tooltip for the diplomatic requirements
 ita_balboimper_S3_project_3_southern_italy:0 "Build the Malta Trade Port" 
 ita_balboimper_S3_project_3_southern_italy_tt:0 "The island of Malta, fortress-capital of the Knights of St. John and stronghold of the British Mediterranean fleet, has a proud martial tradition, embedded in its ancient stones. Few, however, know that it was once named Melita, famed for its honey trade: should our Iberian brothers wish, it could return a place of exchange of goods rather than bullets.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S3_3_SI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S3_P3_SI]\n\n[ROOT.GetITA_balboimper_EFFECT_S3_3_SI_WIP_key]\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S3_project_3_southern_italy_not_completed:0 "The island of Malta, fortress-capital of the Knights of St. John and stronghold of the British Mediterranean fleet, has a proud martial tradition, embedded in its ancient stones. Few, however, know that it was once named Melita, famed for its honey trade: should our Iberian brothers wish, it could return a place of exchange of goods rather than bullets."
 ita_balboimper_S3_project_3_southern_italy_completed:0 "Strategically placed in the middle of the Mediterranean sea, the former British colony has found a new - or perhaps old - calling. Fully devoted to international trade, the trade-island of Malta is now a place of wonder, where one can find everything: trade flows everywhere, mending ancient wounds and softening sharp stones and even sharper blades."
 
 ita_balboimper_S3_3_SI_available_tt:0 "§BFavour§! of The §fIberian Union§! is §Y40§! or above."
 
 #Corruption decisions
 
 ita_balboimper_corruption_PP_southern_italy:0 "Anti-Corruption Efforts in Southern Italy"
 ita_balboimper_corruption_PP_southern_italy_tt:0 "Corruption, embezzling and other bureaucratic malpractices must be eradicated from our project with utmost prejudice. A team of accountants and investigators will see that everything is in order, and the OVRA will teach what happens when something is not in order...\n\nThis will §Gdecrease§! §eCorruption§! in §wSouthern Italy§! by §Y0.05§!"
 
 
