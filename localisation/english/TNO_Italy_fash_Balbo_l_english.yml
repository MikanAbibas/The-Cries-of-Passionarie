 ITA_balbo.1017.t:0 "Adgnosco Veteris Vestigia Flammae"
 ITA_balbo.1017.d:0 "(Balbo receives a report stating that the reds are reorganising after the defeat of the CLA (see quadvirate red scare), thinking that the new policies are a sign of weakness by fascism. Balbo seethes internally, and feels his hands itching: he used to beat those communist senselessly back in the day, and if not for his age and his role, he'd take up a baton in no time. To Balbo, the reds are nothing but terrorists, parasites to be quashed with utmost prejudice: subtlety may be his new strategy, but a cunning general knows that the same strategy can't work every time)"
 ITA_balbo.1017.a:0 ""
 
 ITA_balbo.1018.t:0 "Il Lupo Perde Il Pelo, Non Il Vizio" #after a week
 ITA_balbo.1018.d:0 "(a communist leader is preparing to launch an attack against a prison to free some comrades, when his most trusted adjutant suggests they take a detour around the prison to assess a potential wall flaw, alone to avoid arousing suspicion; the leader agrees, and the two move alone until they are near the prison, but there is no flaw there. Then, the leader hears gunshots coming from where the rest of the group was, but as he turns, he is shot by his adjutant, who takes a radio and coldly tells "target eliminated")"
 ITA_balbo.1018.a:0 ""
 
 ITA_balbo.1019.t:0 "A Letter from the Camp"
 ITA_balbo.1019.d:0 "(a boy sends a letter home; he has been sent to the Avanguardisti youth association summer camps (attendance of which has been made mandatory by Balbo); and as the days pass, he finds himself having fun, between trips to the seaside, woods explorations, visits to archaeological sites, and days spent talking about history and philosophy (of course, they boy doesn't know it's the "fascist" history and the "fascist" philosophy), and tells his dad the camps are not what he had told him (in Mussolini's days, they were basically military camps where 14-17 y.o. boys were taught how to march, survive in the woods and use weapons), and that he wants to return there because he has made many friends.)"
 ITA_balbo.1019.a:0 ""
 
