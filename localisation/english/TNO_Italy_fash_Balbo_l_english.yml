 ita_balboimper_S1_project_2_northern_italy:0 "Improve Irrigation in the Po Valley"
 ita_balboimper_S1_project_2_northern_italy_tt:0 "The Po Valley is the agricultural heart of Italy. In order to ensure self-sufficiency, and help the ailing farmers react to the economic crisis, the old irrigation channels will be repaired and expanded.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_2_NI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P2_NI]\n\n[ROOT.GetITA_balboimper_S1_irrigationeffect_not_completed]§GIncreases§! §wNorthern Italy's§! §fGDP§! by §Y1.00%§!.\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_2_northern_italy_not_completed:0 "The Po Valley is the agricultural heart of Italy. In order to ensure self-sufficiency, and help the ailing farmers react to the economic crisis, the old irrigation channels will be repaired and expanded."
 ita_balboimper_S1_project_2_northern_italy_completed:0 "With the new agricultural aqueducts and irrigation channels completed, farming output is steadily increasing. Thanks to the beneficial effects on prices and supplies, the lower classes will surely appreciate a healthier diet at a lower cost."
 
 
 ita_balboimper_S1_project_3_northern_italy:0 "Restore Genoa's Trade Port"
 ita_balboimper_S1_project_3_northern_italy_tt:0 "Genoa was once the largest trade port in the Mediterranean, but has been seriously hit by the Atlantropa disaster. Building a new port on today's coastline will greatly benefit the Industrial Triangle of the North.\n\n§QProject progress:§! §Y[?Root.ITA_balboimper_progress_S1_3_NI]§!/100[ROOT.GetITA_balboimper_MonthlyGain_S1_P3_NI]\n\n[ROOT.GetITA_balboimper_S1_porteffect_not_completed]§GIncreases§! §wNorthern Italy's§! §fGDP§! by §Y1.00%§!.\nCompleting the project will cause §wEfficiency§! to §Gincrease§! by §Y0.01§!"
 ita_balboimper_S1_project_3_northern_italy_not_completed:0 "Genoa was once the largest trade port in the Mediterranean, but has been seriously hit by the Atlantropa disaster. Building a new port on today's coastline will greatly benefit the Industrial Triangle of the North."
 ita_balboimper_S1_project_3_northern_italy_completed:0 "With its new docks, warehouses and railway connections, Genoa has returned a proud vertex of the Industrial Triangle of the North. Goods now arrive here from Suez, without having to disembark in the South and clogging up roads and railroads to reach Milan and Turin."
 
 
