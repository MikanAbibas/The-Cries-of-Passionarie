 SGR_sit_down_with_rome: "[italy_negotiations]"
 SGR_sit_down_with_rome_desc: "[italy_negotiations_desc]"

 ##for democratic italy
 SGR_democrat_italy: "In Alaric's Footsteps"
 SGR_democrat_italy_desc: "Italy, our Mediterranean ally-turned-hostile rival. The Years of Lead and Oil Crisis have destabilized Italy greatly, everyday it seems like there's another assassination, another bombing, another politician or judge found dead. To say the 70's have been rough for Italy would be an understatement.\n\nAnd with chaos, comes opportunity. Italy has long feared a German invasion, even after their democratization under Ciano, and Fuhrer Schwab has no delusions of conquest, thus our interests align. Fuhrer Schwab will meet Prime Minister [ITA.GetLeader] in Venice, to discuss the possibility of trade agreements and mutual disarmament."

 ##for fascist italy
 SGR_fascist_italy: "In Alaric's Footsteps"
 SGR_fascist_italy_desc: "Italy, our Mediterranean ally-turned-hostile rival. The Oil Crisis has destabilized Italy greatly, the ENI Crash sent it into a downwards spiral for the first half of the 70's, and Duce Scorza's frail health throughout the rest of the decade didn't help.\n\nThankfully, Italy has not fallen to democracy as we feared in the 60's, and this provides a chance for us to integrate them into our new European order. Fuhrer Schwab will meet Duce [ITA.GetLeader] in Rome, and discuss the possibility of trade agreements, mutual disarmament, and Italy membership in the Zollverein."

 SGR_unity_pact: "A Pact of Unity"
 SGR_unity_pact_desc: "The Einheitspakt, our military alliance and less of a pact and more of an extension of our military. Its memberstates barely dedicate themselves to keep their armies trained and ready, as they know they are safe under our nuclear umbrella, but the Second West Russian War has shattered this illusion.\n\nAll of that ends now, the various states of the Einheitspakt will be forced to direct a certain percentage of their spending towards their militaries, and they will be trained under German advisors to ensure doctrine compatibility. Finally, we will create the Einheitspakt-Zentralbefehl akin to the OFN Integrated Military Command to ensure ease of cooperation on military matters."

 SGR_a_united_europe: "A United Europe"
 SGR_a_united_europe_desc: "The Zollverein, Speer's magnum opus. This marvel and economic cooperation was only brought about by the Herculean effort of Speer from the civil war to the Slave Revolt. One cannot understate how beneficial the Zollverein has been both for us and for its memberstates, even the Eastern territories.\n\nHowever, we can go further. Fuhrer Schwab has certain ideas on how the economy should work, and also grand ideas about the global world order. At an international forum in the future, he will announce his plans to bring about total free trade in the Zollverein: Zero tariffs, total freedom of movement, and greater investment in its poorer memberstates under German oversight. The future has never looked brighter as the New Millennium beckons us to reach it."

 SGR_ever_evolving_ideology: "An Ever-Evolving Ideology"
 SGR_ever_evolving_ideology_desc: "What is National Socialism?\n\nThe man in Germania will tell you it is the greatest ideology ever conceived. The man in New York will tell you it is the shackles which have enslaved Europe. And the man in Hiroshima will rhetorically answer that it is the opposite of Pan-Asianism. In truth, National Socialism is an ever adapting being, from its socialistic origins in the 1920's, to the revolutionary and new ideology in the 1930's, to the rebuilt juggernaut in the 60's. From Hitler to Speer to us, National Socialism has been willing to adapt, survive, and thrive in the face of obstacles, and we're not going to stop now."

 SGR_a_well_oiled_machine: "A Well-Oiled Machine"
 SGR_a_well_oiled_machine_desc: "The National Socialist German Worker's Party, from its humble roots in beer halls in Munich to now, has always faced the challenge of corruption, of bureaucracy, of simple pen-pushing. While Speer might have cut out the dead tissue out of the body, the cancer killing it is still alive and well, but Fuhrer Schwab will see that it excised for good.\n\nEntering the Reichstag and serving in the upper-echelons of the bureaucracy will now require a spotless record, recommendations from trusted elements of the state, and above all a technocratic mindset. The new NSDAP will be the party of scentists, of engineers, of businessmen, all subordinate to the party yet working to further its goals. This; is the NSDAP of the future."

 SGR_a_responsible_volk: "A Responsible Volk"
 SGR_a_responsible_volk_desc: "Of course, what good is a responsible party if it is ruling over an irresponsible populace? When Fuhrer Hitler banned smoking, he was doing it in the interest of the German people, and probably saved hundreds of thousands of lives in the process. The fools, the hedonists like Bormann, they wished to lift this ban for their own selfish needs, and it is only through Fuhrer Speer's victory that this was averted.\n\nTobbaco isn't the only poisoner of the body, however, alcohol is both a poisoner of the mind and body. Hitler himself abstained from it, and in order to preserve the health of the Volk, we will ban it as well. Fools might call this unenforcable and point to America's own efforts, yet they fail to realize the Americans failed to direct any resources towards enforcement. The Aryan will not and cannot be poisoned."

 SGR_the_party_not_the_fuhrer: "The Party, Not The Fuhrer"
 SGR_the_party_not_the_fuhrer_desc: "Our grand vision of a responsible party will be for naught if the Fuhrer holds total power. The cult of personality of Hitler was great, Speer toned his own down somewhat, but Fuhrer Schwab has no delusions of grandeur, he only seeks results.\n\nNo Fuhrer will have a cult of personality from now on, Hitler will be the eternal father of the nation, Speer will be his student and inheritor of the mantle, and the party will be the one which carries the torch. Fuhrerprinzip will still apply, and the portraits of the Fuhrer will hang in governemnt buildings, of course, but the party will take a greater role in advising the Fuhrer rather than his inner-circle. You cannot build an eternal empire around men, only institutions."

 SGR_men_of_science: "Men of Science"
 SGR_men_of_science_desc: "The party has traditionally not paid much mind to the scientists who march forwards into the unknown in service of our nation. The failure of Atlantropa assured that much, with them being directed to pursue more mundane yet achievable goals. A brief glimmer of hope appeared with the launch of NetzRam, but the Slave Revolt and Second West Russian War put an end to it as more resources were directed towards the army and security.\n\nThis is incomaptible with Fuhrer Schwab's vision. The Germany of the New Millennium will be a nation of scientists, doctors, and visionaries. To achieve this vision, the Fuhrer has approved a massive aid-package of 30 billion Reichsmarks to be distributed among Germany's top universities for expansion of their scientific facilities and curricula, on the condition of adding mandatory classes on the Fuhrer's theories on National Socialism, of course."

 SGR_a_world_economic_forum: "A World Economic Forum"
 SGR_a_world_economic_forum_desc: "Our plans to foster a technocratic attitude within the party and society have been coming along smoothly, but our Fuhrer is not yet satisified. He looks beyond the borders of Germany, and he sees all the chaos, all the bickering, all the tension.\n\nHow destabilizing and unncessary it all is.\n\nThe KdN is good as a forum to discuss global political matters... But not economic matters. Our Fuhrer dreams of an intertwined global economy, greater than what Speer could have imagined where Germans could buy stocks in American companies, where Americans can vacation in the Austrian Alps, where Japanese tankers run on Kaukasien oil. It sounds drastic... Something out of a liberal student's head, but what differentiates our Fuhrer from a liberal is the lack of interdependence.\n\nOur enemies will be dependent on us, but we won't be dependent on them, a Trojan horse into their economies that can be activated at any time. This \"Weltwirtschaftsforum\" is just Trojan horse, the key to world domination."

 SGR_finishing_what_speer_started: "Defining Agenda 2000"
 SGR_finishing_what_speer_started_desc: "Agenda 2000, our Fuhrer's plan for goals to be achieved by the New Millennium. It has been discussed in dark party backrooms, in select corporate boardrooms, and now in the office of the Fuhrer himself. Agenda 2000 is the transformation of Germany into an industrial and economic superpower through pursuing wonder projects, the visionary march into the future. The word \"Wonder\" was once tainted: Atlantropa, Goring, wasteful military projects... But Fuhrer Schwab will rehabilitiate it.\n\nJust as it put a man on the Moon, so too will it put a man on Mars, a space station into orbit! Just as it created a war machine that conquered the whole of Europe, so too will it create a vast industry that will dwarf America! And just as it drained the Mediterranean, it will turn its soil into fertile land for more Lebensraum! Vorwarts!"

 SGR_production_capital_of_the_world: "Made in Europe"
 SGR_production_capital_of_the_world_desc: "Never before have we been in a more advantageous position to become the production capital of the world. With Russia subdued, the civil war a distant memory, Asia in ruins, and America grappling with social unrest, we will reach heights never seen before. Volkswagens will be sold everywhere, from Washington to Tokyo and every inbetween, German computers will become the envy of American companies like IBM, and our factories will invent new innovative techniques of time-saving and production.\n\nAnd all of this will be possible with robotics. Where once human hands could only weld together 50 steel sheets in an hour, a robotic arm will weld together 500! Fuhrer Schwab has already given the greenlight for grants to be granted to several medium-and-large manufacturing companies to purchase and install robotic arms within their factories. Some may grumble about unemployment, but the Fuhrer is sure that with an expanding economy those out of work will find employment elsewhere."

 SGR_look_to_the_stars: "Look To The Stars"
 SGR_look_to_the_stars_desc: "The Moon landing can not be described as anything other than a magnificent triumph for the German people, when Eberhard Köllner set foot on the Moon it could be said with the utmost confidence that German engineering and science had put him there through sheer innovativeness and boldness. Unfortunately, the crises' of the 60's and 70's prevented us from taking a more active role in other space-related projects.\n\nWith the 80's ahead of us, however, the relative freedom with which we have to pursue bold projects much like in the late 40's has returned. One of Fuhrer Schwab's personal pet projects is to see Germany restart the Space Race, however whether it becomes in pursuit of peaceful exploration or the weaponization of space is up in the air and largely dependant on the course we chart. First we should attempt to launch a space station into orbit, but the question of whether to pursue this mission alone or invite the Americans could open the door to the creation of a hypothesized perpeutally manned \"International Space station\", ultimately the decision lies with the Fuhrer."

 SGR_nazi_computer: "Creating Tiefrot"
 SGR_nazi_computer_desc: "It's clear the 1980's will be the age of the computer. Leaps and bounds have been made in processing power since the 1960's, and the introduction of more advanced computers into the military, economy, and even the consumer market has shown that whoever innovates in computers will have an undeniable edge in the Cold War.\n\nFuhrer Schwab hopes to see Germany gain this edge. With Agenda 2000 written in stone as government policy, any funding issues the scientists of the Reich had previously have been rendered null. Hoping to make the first step into this \"Computing Race\", the Fuhrer has ordered the creation of a supercomputer titled \"Tiefrot\" or Deep Red in the RND headquarters to provide the probability of success of intelligence operations. Of course, it's only a proof of concept but it will prove more powerful than any supercomputer that we have ever made before."

 SGR_nazi_internet: "Expanding on NetzRam"
 SGR_nazi_internet_desc: "NetzRam was a truly revolutionary piece of technology. An interconnected network of computers, exchanging information with eachother across hundreds to thousands of kilometers. The only flaw was that the concept wasn't extended to all sectors of society. One only needs to imagine how powerful a missile detection system would be if every base in the system could communicate with other bases and with the central OKW in Germania to see the potential, false positives would be weeded out and the exact position and speed of travelling missiles could be calculated with a larger sample size of computers tracking them.\n\nOf course, this is all in the near future considering how ambitious it is, and for now we can only introduce this to select sectors of society. Priority should be given to businesses, offices, the service sector generally as they have the most productivity to gain from such a project, followed closely by heavy industry and the bureaucracy. Perhaps the 90's will be the decade of interconnectivity."

 SGR_atlantropa_fixed_baby: "Our Greatest Failure"
 SGR_atlantropa_fixed_baby_desc: "Atlantropa, our greatest shame. What can be said about it, really? It was intended to create more living space and more farmland, but instead it created salty soil unfit for farming and only managed to raise temperatures around the Mediterranean. If the Mediterranean is trained, the consequences for global trade via the loss of the Suez and for the climate and the economy would be catastrophic.\n\nFuhrer Schwab wishes to see this remedied. It will take a Herculean effort in terms of men, funds, and material, perhaps even greater than the Second World War or the West Russian War, but the benefits of avoiding such a catastrophic outcome would be incredible. In order to see this completed, Fuhrer Schwab wishes to see a committee of the greatest minds Germany and perhaps even the world have to offer created to discuss possible courses of action to prevent Atlantropa from creating a global disaster or perhaps even turn it into a benefit, and all of this will be announced soon in an international forum that the Fuhrer wishes to establish. The eyes of the world are upon us, we must not fail."

 SGR_host_the_WEF: "Davos"
 SGR_host_the_WEF_desc: "We are here, the Agenda is quite clear, and the world is watching. For perhaps the first time in history, the President of the United States, the Prime Minister of the Japanese Empire, and Fuhrer of the Greater Germanic Reich have met together in the mountain getaway of Davos, Switzerland, where Wilhelm Gustloff was killed 50 years ago.\n\nThere are many things to discuss: The possibility of mutual disarmament, testing bans, economic agreements, Atlantropa, science... All of it will shape the future.\n\nIn this remote town, the New World Order will be established."

 ##events
 schwab.1.t: "For Whom The Bell Tolls"
 schwab.1.desc: "Germania was silent.\n\nThe usual hustle and bustle of the morning commute was preformed quietly, the sound of church bells ringing throughout the city filled the streets in its stead.\n\nSchwab stood at the steps to the Volkshalle, two RND G-men standing not too far away trying to look as inconspicious as possible. He took a deep breath, the air was cool and crisp, it's almost as if the weather itself was mourning as well. He looked back at where he had started and how far he'd come, manager of a factory during the civil war, economist in the 60's, and then joining the party apparatus in 1970's. Speer had clearly seen something in him, something that would make him a leader to rival him and perhaps event Hitler... His visionary spirit, his ambitions, his will to change history.\n\nHe turned to look at the Volkshalle, slowly walking up its steps in his black overcoat as the RND operatives followed not far behind. Under his watch, this decade would not be like the the previous two..."
 schwab.1.a: "It would be a German decade."

 schwab.2.t: "A Rules Based Order"
 schwab.2.desc: "The 70's were perhaps the most chaotic decade since the West Russian War. We saw the Schorner revolt and be put down, the Slave Revolt start and be put down, and the Russians storm over the border and likewise be put down. However, when we weren't dealing with foreign and domestic uprisings or invasions we were in a period of such economc opulence that it made the late 1940's look like the mid-30's in comparison.\n\nThe 70's are a taste of what can happen to us in the 80's as all the threats to Germany are either dormant or pacified. However, we can't take anything for granted, and the Fuhrer seeks to extend inter-bloc cooperation both politically and economically, a thaw in relations. The Fuhrer plans to embark on a media blitz throughout the various foreign powers of the world, the West, the East, Rome, and from then reforming the Zollverein to be closer and more united.\n\nIf we can complete all of these plans, the bridges that we will build with the other superpowers and our southern neghbor alongside the reforms to the Zollverein and the Pakt will usher in a global rules-based order that will allow for a more peaceful Cold War and perhaps even an end to it."
 schwab.2.a: "The die are cast."

 schwab.3.t: "From The Beer Hall To The Volkshalle"
 schwab.3.desc: "What Speer did to National Socialism in his 20-year tenure was nothing short of spectacular. He took the antiquated and ossified ideology and transformed it into a marvelously efficient beast. Had it not been for Speer, the fools like Bormann woukd've let it rot away slowly, the fools like Goring would've crushed it under their tank treads, and Heydrich...\n\nThe less said, the better.\n\nEither way, the age we are living in is an age of rapid technological and social development, and as such National Socialism must adapt to these new circumstances. Fuhrer Schwab seeks not only to innovate upon Speer's Reformed National Socialism, but to ensure that it will last a thousand years irregardless of the changes of the world around it.\n\nAn ideology led by the greatest minds the nation has to offer, where economic goals will be set by the economist and not the party apparchik, where the the scientist will be free to pursue bold and wonderous projects free from the limits set by budget limits, where it shall be the party and not the Fuhrer who are idolized. This, will be the National Socialism of the 21st century."
 schwab.3.a: "A truly visionary goal."

 schwab.4.t: "A Great Reset"
 schwab.4.desc: "Agenda 2000, once a dream in the mind of Klaus Schwab and his clique of technocrats is now a reality. But what is Agenda 2000? It is the GDP targets on a spreadsheet sitting on a bureaucrats desk, it is the production goals for Volkswagens in a Porsche factory, it is the blueprint designs in the labs of scientists and workshops of engineers. To explain it simply to a layman: Agenda 2000 is an effort to turn Germany into the number one economic, production, and technological superpower of the world.\n\nIt will not be easy, the 80's will likely see Germany faces many hurdles in terms of adapting Schwab's methods and theories into reality, and the 90's will be the decade that decides which superpower will win the Cold War. A \"Great Reset\" as it has been termed, will likely be needed, yet you cannot simply turn an economy on and off, and for this reason we will need to plan around and create substitutes for such a concept as there is no guarantee that a crisis will allow us to reset our economy.\n\nNevertheless, if we wish to win the Cold War we must carry out Agenda 2000 without any compromises or half-measures. Germany will need to adapt to Fuhrer Schwab's vision, not the other way around."
 schwab.4.a: "We will own everything, and we will be happy."

 schwab.5.t: "Two Eagles"
 schwab.5.desc: "The hall was filled with chatter as it was in recess, senators and representatives taking advantage of the joint session to politick. Outside, several thousand protestors had gathered, some holding signs saying \"BETTER DEAD THAN IN BED WITH A NAZI\", others shouting \"NAZI SCUM, GET OUT!\" Naive idiots, Schwab thought to himself. They stood out there yelling until their voices were hoarse thinking that their voice mattered, that they held power. If only they knew the real power was in the shadowy backrooms and offices, was in the paper trail and the money, all the donations to political candidates. In an ideal world, they would realize that power did not lie with them, but with those able to handle it.\n\nA world Schwab would create.\n\n\"And now please welcome, Fuhrer of the Greater Germanic Reich, Klaus Schwab.\" President [USA.GetLeader]'s voice boomed throughout the hall using the microphone installed at the podium. His cue. Schwab, dressed in a plain black suit, imitating the many faceless politicians in Congress. Stepping up to the podium, he spoke in his heavily accented English \"I wish to thank President [USA.GetLeader] for allowing me to speak and the American people for their hospitality... My friends, in this day age the future has never been more uncertain, and while relations between our two nations have been icy at best, we must come together in order to ensure world peace lest...\""
 schwab.5.a: "\"Lest we have to prepare for an angrier world.\""

 schwab.6.t: "In The Land Of The Rising Sun"
 schwab.6.desc: "The room was beautifully decorated, with two chairs sitting next to each other. The trip to Osaka from Krim to Nanjing and then to Osaka gave Schwab time to reflect on what he would discuss. As Prime Minister [JAP.GetLeader] and the Fuhrer walked over to the interpreter waiting by the chairs, the Fuhrer extended his right hand out for a handshake, \"Prime Minister [JAP.GetLeader], it is an honor to meet you.\" The interpreter quickly relayed the message over as the Prime Minister shook his hand while he replied in Japanese, the press all the while snapping photos of the two. \"It is an even greater honor to host you, Herr Schwab.\" The interpreter said.\n\nThe Prime Minister knew that Schwab had the upper hand here. The economic devastation of the Great Asian War was not something that could be repaired in an instant, and Schwab was here offering economic agreements with the Japan and the wider Co-Propserity Sphere, an opportunity to establish deeper ties to counter-balance the Americans and to reconstruct Asia faster.\n\nAs the Prime Minister and Schwab sat down, the press continued snapping image of the two men, Schwab crossing his legs and resting his hand on the armrests and spoke in English to the diverse group of journalists assembled, \"I would like to thank Prime Minister [JAP.GetLeader] for his hospitality and for his willingness to discuss deeper ties and mutual disarmament between our two nations. As I have often said...\""
 schwab.6.a: "\"We do not want to just define issues; we want to help to create solutions.\""

 schwab.7.t: "The Eagle And The Dragon"
 schwab.7.desc: "The view from the balcony was peaceful, almost tranquil. The sound of construction machinery roared off in the distant, but not loud enough to disrupt negotations. As Prime Minister [CHI.GetLeader] sat next to Schwab before saying something to the Chinese interpreter standing between them before saying \"Prime Minister [CHI.GetLeader] is ready to begin, Herr Schwab.\" As Schwab took a deep breath, he nodded at the journalists in attendance to signal them to take photos before saying \"Before I begin, I would like to thank the Prime Minister for hosting me and my accompanying entourage. It's no secret that the Greater Germanic Reich were great allies in the 1930's, going as far as to send the Von Falkenhausen mission to China.\"\n\nAs the Chinese interpreter relayed this over to the Prime Minister, Schwab continued \"The German people and the National Socialist German Worker's Party congratulate the Chinese people and the Koumintang on achieving their long-desired independence, and we hope to revive the relations that our two nations had during the 1930's. It is no secret that the devastation wrought by the Great Asian War has greatly weakened China, but the German people are more than willing to assist the Chinese people in reconstruction their great nation.\"\n\nAs the interpreter finished relaying this over to the Chinese Prime Minister, he began speaking prompting the interpreter to relay the message back to Schwab in German \"The fraternal brotherhood between the German and Chinese peoples is an unbreakable bond, and we are extremely grateful for the offer of assistance by the German nation. Let it be known that the Koumintang seek nothing but the utmost cooperation with the Greater Germanic Reich and we look forwards to economic cooperation between our two nations.\" While mainting his steely exterior demeanor, Schwab couldn't help but be satisified. \"Prime Minister, I am honored. As I have often said..."
 schwab.7.a: "\"The key issue in the 21st century is the shift of the centre of gravity from the West to the East, the rise of China.\""

 schwab.8.t: "The City Where All Roads Lead"
 schwab.8.desc: "The sound of seagulls and the waves crashing against the shore made its way into the seaside villa, Atlantropa may have drained much of the sea but it hadn't drained enough to rid Rome of its holiday-status. The Fuhrer was sitting next to Duce [ITA.GetLeader] who was adjusting his clothing so as to look as good as possible for the cameras while making small talk with the interpreter standing between them. Meanwhile Schwab was taking notes on issues to discuss, Zollverein membership, non-aggression pacts, possible Einheitspakt observer status? That last one would probably be too much of an ask.\n\nNot long after, the interpreter spoke to Schwab \"The Duce is ready to begin, Herr Schwab.\" and almost as if on cue a small group of reporters shuffled into the room calmly without any fanfare. Once the journalists were in-place, Schwab began \"I would like to thank Duce [ITA.GetLeader] for hosting me here in Rome, and for his willingness to participate in mutual dialogue between our two nations.\" Klaus Schwab for a moment, taking a deep breath as he allowed the interpreter to catch up before continuing \"While relations between the Kingdom of Italy and the Greater Germanic Reich may have soured greatly ever since our shared victory in the Second World War, we wish to see this unfortunate trend reversed and to allow for peaceful and cooperative relations between our two nations.\"\n\n\"I came here not only to talk with the Duce but to also lay the groundwork for the integration of Italy into a European rules-based order and from then on its integration into a global rules-based order.\" The Duce's facial expression changed to one of curiousity. \"While I wish not only to discuss the possibility of future economic agreements and possible nuclear limitations, I also wish to lay the groundwork for the entry of Italy into the Zollverein and more importantly cooperation with Italy on turning the land dried up by the Atlantropa project into lush forests.\" A look of surprise came across the Duce's face as well as some reporters. Offering Zollverein membership was was a bold move, not unexpected but still bold, but the promise of turning Atlantropa green was enticing. As the interpreter finished translating for the Duce, Schwab waited with bated breath before he replied."
 schwab.8.a: "\"We are interested, Herr Schwab.\""

 schwab.9.t: "Through Canals And Deserts"
 schwab.9.desc: "Venice is not what it used to be, while its canals still remained, the Adriatic which it sat upon and was surrounded by no longer exists, now turned into an inhospitable desert. Looking back on it, Schwab wasn't exactly sure how the engineers behind Atlantropa didn't see this coming. The meeting with the Italian Prime Minister would be tense considering their surroundings, but it would also serve as a useful reminder for what Italy would stand to lose should it refuse.\n\nNot long after, Prime Minister [ITA.GetLeader] entered the room with an interpreter before Schwab got up to shake his hand. The handshake was firm, but not friendly. This wasn't going to be easy, that was for sure. As Schwab and the Prime Minister sat down, a crowd of journalists made their way into the room hurridly, each one squeezing past the other. Schwab began \"Prime Minister, before we begin, permit me to say how much I look forwards to repairing relations between our two states. It is extremely regretable that the Kingdom of Italy and the Greater Germanic Reich were forced into a hostile rivalry with each other. I came here to Venice in order to mend relations between our two nations and to lay the groundwork for a cooperative relation between our nation in economic, political, and anti-terroristic matters.\" The last line was a subtle offer, the Years of Lead hadn't been kind to Italy and Germany had given asylum to many-a-far right terrorist fleeing the country, and here Schwab was offering to either extradite them back to Italy or stop receiving them all together.\n\n\"Finally, I wish to see our two nations bring the idealized vision of the Atlantropa Project to reality. It is no secret that the land drained in the Adriatic did not become plainslands like those of Dalmatia but a desert.\" A look of intrigue came across the Prime Minister's face, \"What Germany is offering to Italy is a once in a life-time opportunity to turn the deserts of now into the forests of tomorow.\" Schwab finally paused, hoping this would be enough to sway the Italian Prime Minister. He was forced to give up things he would have rather not given up, he had already promised the Prime Minister while setting up the meeting lowered tariffs for exporting into the Zollverein and a lessened German military presence on the border, but as the Prime Minister spoke and the interpreter translated, it soon became clear."
 schwab.9.a: "\"Fuhrer Schwab, we look forwards to cooperation with Germany.\""

 schwab.10.t: "A.B.C, Die Best Armie"
 schwab.10.desc: "The training grounds in outside of Bratislava were silent for most of the year, empty, and when they were occupied it was by German troops. But then things changed, Private Jozef and his entire battalion, who would spend most of the year chasing partisan ghosts in the mountains and the rest slacking, were suddenly called up for \"Military Exercises with The Brotherly Nations of the Einheitspakt\" as one German officer put it. As he and his squadron simulated breaching a fortified enemy position in an urban setting he noticed the Feldgrau he had on was new, the rifle he was holding was a brand new G3A4 with a marking reading Made in Germany proudly carved vertically on the rear-end of the receiver near the buttstock as his mind wandered to how many more exercises he'd have to do.\n\nIn the Rhine, Private Henrik of Denmark and his company simulated a blitzkrieg towards an enemy missile silo in a mostly flat plains-region. The OpFor were dressed in all black and also using German weaponry, but the company made it. As they attempted to enter the silo, one of the soldiers grabbed a brand new Panzerfaust from one of the Marder 1's they were riding and fired it at a stairwell door, blowing it right off its hinges. Remembering his training, the Private grabbed a grenade from one of his pouches and threw it at the wall, knocking it down further into the stairwell and taking out a group of OpFor's waiting for them at the bottom.\n\nIn the OKW headquarters, Involving 200,000 men in total from all across the Einheitspakt, \"West-[GetYear]\" as it was called was deemed a total success, accurately gauging the combat capabilities of the Einheitspakt memberstates and spurring reforms within their militaries while the process of integrating their highcommands into the Einheitspakt-Zentralbefehl had already begun. While the US had protested it, claiming it inflamed tension, the state knew they wouldn't do anything. From now on, the Pakt would not be a mere nuclear umbrella, but a professional united force."
 schwab.10.a: "Einheits und Freiheit!"

 schwab.10.t: "A.B.C, Die Best Armie"
 schwab.10.desc: "The training grounds in outside of Bratislava were silent for most of the year, empty, and when they were occupied it was by German troops. But then things changed, Private Jozef and his entire battalion, who would spend most of the year chasing partisan ghosts in the mountains and the rest slacking, were suddenly called up for \"Military Exercises with The Brotherly Nations of the Einheitspakt\" as one German officer put it. As he and his squadron simulated breaching a fortified enemy position in an urban setting he noticed the Feldgrau he had on was new, the rifle he was holding was a brand new G3A4 with a marking reading Made in Germany proudly carved vertically on the rear-end of the receiver near the buttstock as his mind wandered to how many more exercises he'd have to do.\n\nIn the Rhine, Private Henrik of Denmark and his company simulated a blitzkrieg towards an enemy missile silo in a mostly flat plains-region. The OpFor were dressed in all black and also using German weaponry, but the company made it. As they attempted to enter the silo, one of the soldiers grabbed a brand new Panzerfaust from one of the Marder 1's they were riding and fired it at a stairwell door, blowing it right off its hinges. Remembering his training, the Private grabbed a grenade from one of his pouches and threw it at the wall, knocking it down further into the stairwell and taking out a group of OpFor's waiting for them at the bottom.\n\nIn the OKW headquarters, Involving 200,000 men in total from all across the Einheitspakt, \"West-[GetYear]\" as it was called was deemed a total success, accurately gauging the combat capabilities of the Einheitspakt memberstates and spurring reforms within their militaries while the process of integrating their highcommands into the Einheitspakt-Zentralbefehl had already begun. While the US had protested it through their embassy and the KdN, claiming it inflamed tension, they knew they wouldn't do anything. From now on, the Pakt would not be a mere nuclear umbrella, but a professional united force."
 schwab.10.a: "Einheits und Freiheit!"

 schwab.11.t: "Freude, Schöner Götterfunken"
 schwab.11.desc: "Peter Kranz was a simple economist. He had a wife, two children, he held NSDAP membership, and he knew to report any suspicious activity to the police. In essence, he was the average German man. What Peter noticed at work piqued his interest, however, even if it was outside of his purview. Investments into the various nations of the Zollverein, \"Expansion of the Nord-Autobahn into Denmark\", \"Construction of the Admiral Raeder Naval Base near Rotterdam\", \"Acquisition of materials for constructing the Jozef Tiso International Airport in Bratislava\". He smelled corruption and promptly went to the RND, filing a tip with them.\n\nHowever, nothing changed.\n\nHe reached out again, asking if his tip had been received, and it was, and that the RND had conducted an investigation but found nothing. Back at work, Peter noticed more of these investments coming in, but also an increase in trade among the Zollverein. Could he have been wrong and all of this really was legitimate? He peered at the newspaper on his desk, hoping to distract his mind from things. \"Fuhrer visits United States, Received Warmly\", \"Fuhrer visits Italy, Agreements Reached\", but one of the articles caught his eye, something which explained everything he had noticed.\n\n\"Fuhrer announces increased investment among Zollverein, sign of things to come?\""
 schwab.11.a: "United in Wealth."

 schwab.12.t: "A Changing Of The Guard"
 schwab.12.desc: "Heinz was a regular party apparchik, a bureaucrat. He clocked into work, did the paperwork, had his lunch break, continued working, and then got off work to go back to his family and go drinking with his friend Kranz. He was looking to get a promotion to supervisor, after all he had a spotless record and was a committed Hitler Youth member as a child, nevermind that he was an ex-lawyer. The only thing standing in his way was his boss who'd probably been sitting in that chair of his for 30 years, Gottfried.\n\nThe man was an asskisser of the highest proportion, he knew that he was dissatisfied with Speer's reforms, but couldn't prove it, bastard was probably a Bormannite but he knew how to hide it. When Heinz went to clock into work one day, Gottfried's gruff, almost spiteful voice didn't greet him. Instead, noone did. As the time for his lunch break came, he passed by Gottfried's office and noticed that it was empty. \"Odd.\" He thought to himself, he'd never been absent on a workday for as long as Gottfried could remember. Going to another sector of the building, he asked a bored looking receptionist at HR about Gottfried's absence.\n\n\"Herr Gottfried has been dismissed from the civil service by the Committee of Bureaucratic Reform. They are currently deliberating on who will replace him.\" The receptionist looked up at Heinz and winked. Heinz blinked in response, thanked him, and went on his way with a big smile on his face."
 schwab.12.a: "Now what should I spend the extra salary money on?"

 schwab.13.t: "Poison Of The Mind And Body"
 schwab.13.desc: "Alfred was a construction worker, 6'4 and full of muscle, he was a hard worker who didn't care much for politics and didn't pay attention to the news, but also one with an explosive temper. When he got off work, he'd swing by the local bar with some of his co-workers after work. As the group made their way over to the bar, they noticed some Polizei standing outside and the lights were off.\n\n\"Hey!\" Alfred yelled, \"What's going on?\" One of the policemen took a step forwards as the group closed the distance.\n\n\"This establishment has been closed per order of the local Gauleiter, the government has outlawed alcohol and this establishment was in violation of this law.\" The officer took a step forwards again. \"Now disperse.\"\n\nAlfred was gobsmacked, this was his place of comfort, and now these assholes were shutting it down.\"I'm not leaving until I get a glass of beer!\" Alfred yelled, \"Alfred, c'mon. This isn't worth it.\" Fuchs, one of his coworkers said as he tugged on his arm.\n\n\"Disperse or you will be placed under arrest!\" The officer yelled, \"FUCK YOU!\" Alfred yelled back as he grabbed a rock off the ground and throwing it at the officer head. A clean hit.\n\n\"Scheisse! Officer down!\" One of the officer yelled as he drew his firearm and pointed it at Alfred."
 schwab.13.a: "The last thing Alfred thought of was how hard he fucked up."

 schwab.14.t: "Institutions, Not Men"
 schwab.14.desc: "Martin was an artist, in his freetime he enjoyed painting nature, but on the job he was tasked with translating the vision of party bureaucrats into art. Propaganda was the name of the game, and Martin was good at it, having been awarded employee of the month twice before for his art. But this time it was different, whereas he had made propaganda glorifying Hitler and Speer when we has alive, now he was glorifying more general archetypes, the German soldier, the responsible party man, but also the party itself and the German people.\n\nToday he was tasked with making a poster as part of a propaganda campaign to \"Make the course the party wishes to chart clear\", all they told him was to glorify scientists, engineers, people who create much like him, only things far less abstract. By the day's end, he had created several designs and sent them off for approval by the board. In truth, he didn't dislike his job, in fact he took pride in the fact that he could shape society, no matter how miniscule his influence was. He could see it on the street where he noticed more young boys and girls going to university whenever a campaign glorifying education was rolled out.\n\nReally, he felt like he was..."
 schwab.14.a: "The Fuhrer of his own desk, and his decree-pen was his paintbrush..."

 schwab.15.t: "A Young Boy's Dream"
 schwab.15.desc: "Schumann, Von Braun, Heisenberg. These names are invariably titans of not just German but also global science, and their names sing out throughout history for both their wartime and peaceful innovations. Gunther Fehlinger, a dedicated member of the Hitler Youth aspired to be like these men.\n\nFor his whole life, Fehlinger was always enamored with Hitler and his defense of the West and with the sciences. Growing up throughout the 70's and living through the Second West Russian War, he wanted to be like Hitler, like Speer, like Von Braun. And today was the happiest day of his life.\n\n\"Dear Gunther Fehlinger, you have been selected for entry into the NSDAP Youth-Leaders program. In addition to this, you have been reserved a scholarship for any course of your choosing once you complete your tertiary education.\"\n\nHe didn't even bother reading the rest of the letter, he knew he was destined to do great things, to reach great heights. Not only did this mean he would be fasttracked to a university scholarship, but perhaps even membership in the Reichstag itself after service in the bureaucracy. His dreams were finally about to come true, to serve his nation with honor. His father was similarly proud, a man who had lived through the West Russian War and the 50's, he knew what chaos and disunity meant, it was when men like Himmler rebelled that the Reds broke through, and it was when men like Speidel united and put them down that they drove them back. Embracing his son with a hug, Fehlinger Sr. said:"
 schwab.15.a: "\"You will change the world, son.\""

 schwab.16.t: "A Clear Vision For The Future"
 schwab.16.desc: "\"Nazi Leader Establishes \"World Economic Forum\", Invites Washington\" Read the New York Times.\n\n\"Der Fuhrer Creates Forum For Global Economic Cooperation\" Read the Volkischer Beobachter.\n\n\"German Fuhrer Announces Conferences To Be Held Later In Year\" Read the Corriere della Sera.\n\nThe newspapers on Schwab's desk in his plain officer told him all he needed to know; Everything was going according to plan, the Reichstag had approved its establishment unanimously, Washington had accepted the offer to join, Japan had said the Prime Minister would attend the first forum, and the various regional and minor powers had agreed to send delegations in line with the WWF's purpose to act as a sister organization to the KdN. All the pieces were in place, and nothing could stop Schwab now.\n\nThe Trojan Horse had been loaded up with soldiers and now all he had to do was get the enemy to swing open the gates and allow this token of \"friendship\" and \"cooperation\" past their walls. He asked himelf: Would Bormann have seen German softpower grow as much as this? Would have Goring cared for it all? Would have Heydrich even concerned himself with the outside world at all? The WWF was the brainchild of Schwab alone, but it couldn't have been possible without Speer, and Speer wouldn't have been possible without Hitler. He poured himself a glass of wine, placing the needle on the record as it played soft classical music. Staring out the window, he sipped from the glass and for the first time since becoming Fuhrer..."
 schwab.16.a: "He smiled."

 schwab.17.t: "Arms Of Steel"
 schwab.17.desc: "Somewhere in a well-ventilated sterile office in Frankfurt, Jodl smiled at the piece of paper he held. After being passed through the finance department and simplified enough that a layman could understand it, how couldn't he? 53% increase in productivity. 53%! How could anyone rival that? And the best part is, all of this was on the state's dime. They were essentially putting money in his pocket after giving his company some new toys.\n\nDown on the ground, Siegfried and a group of laid off factory workers were huddled into the reception room of the local party headquarters, all of them red in the face and ready to start a riot at the drop of a hat.\n\n\"I don't give a fuck if his mother's dying, I want to file a complaint to the fucking Gauleiter!\" Jodl yelled, spraying spit onto the glass.\n\n\"Em, er, please give me a moment.\" The receptionist said nervously, sliding down the blinds on the glass between him and the laid off workers.\"You fucking COCKSUCKER!\" Jodl reached for the nearest chair off the ground and smashed it into the window, smashing it to pieces.\n\nDown in Germania, Schwab held the spreadsheet in his hand. Graphs, numbers, percentages, charts, he wanted all the details. The prognosis? every company had an increase in productivity of 30% or more, even traditionally uncompetitive ones were seeing profits for the first time in months. The outrage from the laid off laborers would have to be dealt with, of course, but it wasn't something that couldn't be fixed with a little bread circuses and the safety net. Afterall..."
 schwab.17.a: "Teach a man to fish and he will be independent from you, but give him a fish and he will be yours for life."

 schwab.18.t: "One Giant Leap For Mankind"
 schwab.18.desc: "To call the German Moon landing of 1962 a groundbreaking achievement would be an understatement. It didn't matter what the Americans or the Japanese did after that, the hooked cross sat on the Moon, always watching the Earth and that was that. Of course, that would've been the end of it had technology been frozen in 1962, but now it's the year [GetYear] and much has changed since then. Advancements in physiology, engineering, and rocketry have allowed for men to do things that were previously unthinkable before.\n\nRestarting the Space Race will be a costly endeavor, but one we can afford. The prestige arising from a peaceful or even militarized Space Race put the other superpowers to shame, and it's doubtful Asia would be able to compete with us in the aftermath of the Great Asian War, America too will likely not bother as in times like these budget cuts in terms of military and welfre spending in favor of money to rival our projects would be unpopular with Congress and the public respectively.\n\nOf course, there is an alternate course of action. We could approach the other superpowers for an international space station in orbit, and if we so wish, even an international Lunar base. The former option could lead to the militarization of space very quickly but more prestige if we handle it right, certain politicians in America are already thumping their chests about creating an orbital missile defense system, while the latter would almost certainly lead to greater international cooperation but less prestige. Ultimately, the choice lies with the Fuhrer."
 schwab.18.a: "It is Germania which put a man on the Moon alone, and it is Germania which will put a base there alone too."
 schwab.18.b: "The final frontier is for all of humanity to share, even our staunch rivals."

 schwab.19.t: "Leopard-2 To Washington"
 schwab.19.desc: "The room was packed with journalists, foreign dignitaries, and curious scientists from across the globe. In-front of them on an elevated platform sat a table. On one end Bobby Fischer, Chess grandmaster, defector from America, and committed anti-Semite who was ethnically Jewish from his mother. On the other end, Tiefrot, being showcased to the world as a simple chess-playing supercomputer but in reality, a machine capable of calculating the odds of covert operations with basic self-learning capabilities alongside the group of programmers and engineers who had coded it to play Chess. Fischer didn't know this, the attendees didn't know this, but the undercover RND men and party officials in attendance knew this.\n\nFischer sat under the bright stage light, it made him sweat, weaken his focus. He was on the defensive, Tiefrot had already claimed his two bishops, a castle, and several pawns. This machine was good, he thought. It ought to be, it was made by German hands after all. Moving a pawn forwards to try and take some pressure off his rear, something odd happened. Tiefrot moving its bishop one step forward, and when Bobby played his next move, it moved it one step back. Over and over until he had managed to checkmate the king by avoiding taking the bugged piece.\n\nIt was an upset, and a humiliating one to the programmers at that, but Bobby couldn't be happier. Behind the scenes, the RND was working hard to get to the root of the problem: Could it have been a logic loop in the chess code, the self-learning algorithim, or the wider calculation code? While this game was rather humiliating, the Tiefrot team had already challenged Fischer to a series of three matches to be held in Germania, and several foreign Chess grandmasters offered to play against it.\n\nBut not matter what, this game would stand in the history of computing and Chess as the time Man bested Machine."
 schwab.19.a: "Nature has won this day, but tomorrow is another question."

 schwab.20.t: "Connection Established"
 schwab.20.desc: "The analog screen read in the bottom left corner below a long lists of errors and commands \"You are now connected.\" Adolf had spent the whole night in the lab debugging the machine, staying on the phone with his partner in the University of Frankfurt, and finally at 3:13 AM he had done it. The keys on the keyboard clacked away before he pressed ENTER.\n\n\"UNIVERSITY_OF_MUNICH: alo come in\" The message was sent without a hitch.\n\n\"UNIVERSITY_OF_FRANKFURT: Scheisse!\"\n\nIn Litzmannstadt, the corporate headquarters had already mandated for this simple chat software to be present on every computer that was installed in the office, routing through a central computer-server that routed to other similar networks in company-owned offices the country. In a simple minute, one employee in Danzig could send eletronic mail to another one in Wien asking to transcribe a report for a customer, but with advancements in technology, soon he would be able to send images, documents, even moving pictures.\n\nNetzRam had grown into something beautiful something Schwab had personally sponsored, and the information technologies sector was sure to boom throughout the 80's, with the government willing to give subsidies to any startup to do with software or computers. A local intra-network or Intranet for sure had formed around Germany in the business and educational fields, but soon it would spread to the industrialists, the army, the general public and soon after the world. What took weeks to arrive now takes 30 seconds and a few mouse clicks."
 schwab.20.a: "The start of something beautiful."

 schwab.21.t: "Never Another Atlantis"
 schwab.21.desc: "The conference room was darked, the only surface illuminated was the fabric the projector was projecting on showcasing a map of the Mediterranean. The long yet thin table was occupied by the greatest minds currently alive in Germany and a few foreign scientists invited to assist with convincing their governments. Fuhrer Schwab stood infront of the fabric surface, wearing nothing but a black suit.\n\n\"...It is in times like these where it is the very environment we live in, the very climate is becoming hostile, that we must unite as one and take action. The plan consists of a simple three step plan.\" The next slide showed several arrows emerging from the general locations of various European nations all converging on the Mediterranean.\"One: Coordinate with Mediterranean and more broadly Euroepean states. If we are unable to agree on what to do for the sake of Europe and the world, we stand no chance of succeeding.\" The next slide showed several non-descript generic looking labs.\n\n\"Second, using our collective resources and knowledge to assist in the forestation of the drained Atlantropan lands. I will leave the specifics up to you gentlemen, as far as I'm concerned you have a blank cheque.\" The next slide showed an artist's concept of what an open Atlantropa dam would look like.\n\n\"Third and finally, if need be we will turn Lake Chad into an inland sea via the Congo Lake to provide fresh water to the Mediterranean. It is important to note that we do not wish to fully drain the Mediterranean but to keep it as it is. The loss of access to the Suez and the Black Sea would be catastrophic for international trade.\" Schwab paused briefly and took a deep breath, \"Gentlemen, the eyes of the world are upon you.\""
 schwab.21.a: "\"Do not fail us.\""

 schwab.22.t: "Apotheosis"
 schwab.22.desc: "The stage was well lit, Klaus Schwab was wearing a standard black suit as he usually did. Look out into the crowd, all he could think of was how much power he held over them. The foreign leaders in attendance, corporate CEOs, the politicians.\n\nHow short sighted all of them were.\n\n\"Herr Schwab, may we begin?\" The voice snapped him out of it, he looked to his right seeing President [USA.GetLeader] and to his left seeing Prime Minister [JAP.GetLeader]. Both of them leaders of dying counries, of dying civilizations. He took a deep breath and signalled for the cameras to start rolling. Davos was his home, where no liberal nor communist could reach him, the fact Switzerland was footing the bill for the security was even better. It was a demonstration of his global influence, he could press a big red button tomorrow and the world would be no more but he doesn't, he could speak German and force them to translate it but he speaks in English in spite of his accent to accomedate them.\n\n\"My friends...\" Subjects.\n\n\"I thank you all for coming here to attend the first World Economic Forum of [GetYear].\" I approve of your subservience to me.\n\n\"As we look bravely into the future, we must prepare to make the great leap forwards to the Fourth Industrial Revolution, one not defined by machines but by computers.\" I demand you submit to my vision of how the world should run, lest you provoke my wrath.\n\n\"I plan on discussing the Fourth Industrial Revolution in depth in a book of the same title to be released later in 1984.\" My magnum opus, if Hitler read it he would weep.\n\n\"In these trying times as citizens, declared or undeclared, of the global village, we prepare for an angrier world, we must promote fact-based journalism and scorn conspiracy theories and fake news, and we must be prepared to leap into the digital age with eyes upon the future, because now, my friends...\""
 schwab.22.a: "\"...Is the time to shape the system.\""

 schwab.23.t: "The Final Will And Testament Of Albert Speer"
 schwab.23.desc: "I confess there was a time I lost faith in National Socialism. I saw how hollow our victory was, how many had died for the hubris of the few. The waste I could not bear. But my resolve did not die then, and I pushed forward. I pray I have reversed the errors of the past and that my successor will carry on the work. \n\nThat successor will be Klaus Schwab. Though he is young, I believe he has the will and intelligence necessary to be Fuhrer. He is the epitome of the German spirit, and I entrust the Reich to him with full confidence. \n\nAs for my personal estate, as little as there is, I place it in the hands of my son. He has become a fine architect by his own merit, and I am prouder of him than all the countless victories of the Reich combined. \n\nTo the Volk, I will say this: Do not let your life be ruled by petty whims and flights of fancy. Whether the times are hard or good, we are always stronger together. Do not make the same mistake I did and doubt our strength. \n\nTogether, no obstacle is insurmountable, and no enemy is too great."
 schwab.23.a: "Goodbye..."

 schwabforpolicy.1.t: "Klaus Schwab Visits America"
 schwabforpolicy.1.desc: "Fuhrer of the Greater Germanic Reich, Klaus Schwab, has recently visited Washington and spoke to a joint session of Congress before meeting President [USA.GetLeader] in the Oval Office. In his speech, he emphasized his wish for cooperation and detente with the United States, and when meeting with the president the two discussed the possibility of nuclear test ban treaties and mutual nuclear disarmament."
 schwabforpolicy.1.a: "Very interesting."

 schwabforpolicy.3.t: "Klaus Schwab Visits Us"
 schwabforpolicy.3.desc: "Fuhrer of the Greater Germanic Reich, Klaus Schwab, has recently visited our nation and spoke to [ROOT.GetLeader]. The Fuhrer expressed his wish for further economic cooperation with us, while discussing the possibility of a strategic informal alliance to pressure the US from both the Atlantic and the Pacific behind closed doors in addition to nuclear control agreements."
 schwabforpolicy.3.a: "Very interesting."

 schwabforpolicy.4.t: "Klaus Schwab Visits Italy"
 schwabforpolicy.4.desc: "Fuhrer of the Greater Germanic Reich, Klaus Schwab, has recently visited our nation and spoke to [ROOT.GetLeader]. The Fuhrer expressed his wish for further economic cooperation with us, while discussing the possibility of further integration into the European rules-based order alongside further economic cooperation with the Zollverein and possibly even full Zollverein membership."
 schwabforpolicy.4.a: "Very interesting."

 schwabforpolicy.5.t: "Klaus Schwab Invites Us To The WEF"
 schwabforpolicy.5.desc: "The Fuhrer of the Greater Germanic Reich, Klaus Schwab, has formally invited us through official diplomatic channels to the World Economic Forum, an organization akin to the KdN to discuss economic issues while also setting the framework for a global integrated financial order. Naturally, such an opportunity cannot be ignored, as the other great powers have been invited as \"Trustee Council\" members, having a priviliged position to all other memberstates."
 schwabforpolicy.5.a: "It wouldn't hurt having the power of Trustee Councilship, accept the offer."

 schwabforpolicy.6.t: "Klaus Schwab Invites Us To An International Space Station"
 schwabforpolicy.6.desc: "The Fuhrer of the Greater Germanic Reich, Klaus Schwab, has formally invited us through official diplomatic channels to a program to establish an international space station, co-manned by us, Germany, and several other great powers. The thaw in relations this could provide would open the door for further cooperation with Germany and other ISS members, however some in our government are protesting against working with the Germans and have proposed restarting the space race."
 schwabforpolicy.6.a: "As one, mankind will leap to the stars. Accept their offer and assist in construction."
 schwabforpolicy.6.b: "We are more than capable of creating our station, but for now we won't pursue it. Maybe when the economy gets better we can try."

 schwabforpolicy.7.t: "[FROM.GetName] Accepts ISS Membership"
 schwabforpolicy.7.desc: "Great news, [FROM.GetLeader] has responded to our request for ISS membership positively. They have proclaimed their support for the project and intend on creating modules for the space station once work begins the project later this decade. Their membership is a sign of thawing Cold War tensions and a transition into an era of peaceful dialogue."
 schwabforpolicy.7.a: "One giant leap for mankind."

 schwabforpolicy.8.t: "[FROM.GetName] Rejects ISS Membership"
 schwabforpolicy.8.desc: "Bad news, [FROM.GetLeader] has responded to our request for ISS membership in the negative. They have stated their desire to not compromise their independence by shackling themselves to the ISS project. While it is rather unfortunate we will be able to do without them for now and can always depend on the other great powers or even inviting them at a later date once the project bears fruit."
 schwabforpolicy.8.a: "Their loss."

 schwabnews.1.t: "Klaus Schwab Declared Fuhrer"
 schwabnews.1.desc: "When Albert Speer died, many feared that a repeat of the German Civil War much like it happened two decades ago. However, to either their elatment or despair, such an outcome has been avoided as the Reichstag has officially announced it elected a new Fuhrer.\n\nKlaus Schwab, an engineer and economist by trade, rose rapidly through the party ranks in the mid-70's under the tutelage of Speer and was widely regarded as his protege, leading the tecnocrat faction within the NSDAP.\n\nThe new Fuhrer has published a communique stating he seeks cooperation with the other great powers and a revitalization of the German economy followed the Vengance War, being received warmly by the other great powers including Italy. Whether this means Germany seeks to end the Cold War peacefully or win it through underhanded means remains to be seen."
 schwabnews.1.a: "A more peaceful world?"

 schwabnews.2.t: "Germany Announces Internationale Raumstation Project"
 schwabnews.2.desc: "Recent news out of German has inspired excited discussion in the global scientific community and panic in the West and the East. Klaus Schwab has announced his intention to establish a German space station, officially dubbed the \"Internationale Raumstation\"  or International Space Station, Germany hopes to launch it by the year 2000 as part of its \"Agenda 2000\" program.\n\nWhile Schwab has invited the other great and major powers of the world to participate in its construction, the news has been received with cautious approval, with President [USA.GetLeader] being quoted as hoping to join the project should the German project be in good faith.\n\nRegardless, most agree that the project marks a remarkable shift in the space race and the wider Cold War to peaceful scientific cooperation and a cooling of tensions."
 schwabnews.2.a: "Will they drink Fanta in space?"

 schwabnews.3.t: "A Meeting in Davos?"
 schwabnews.3.desc: "A recent joint communique out of Switzerland and Germania has sent ripples throughout the international community: The Greater Germanic Reich has established the \"Weltwirtschaftsforum\" as a forum for economic cooperation and discussion.\n\nWhile most agreed that recently inaugurated Fuhrer would undertake a reformist agenda, this has gone further than most expected. In the communique personally penned by Klaus Schwab, he invited all the powers of the world to the WWF and furthermore has invited the major powers to a Trustee Council. The Fuhrer expressed his wish for economic cooperation and hosting the first forum later this year in his home town of Davos, Switzerland.\n\nIt remains to be seen whether Schwab's ambitions are benevolent or malevolent, but one thing is for certain: The Cold War is experiencing a thaw."
 schwabnews.3.a: "The days of multipolar isolation are over."

 schwabnews.4.t: "Start of West-[Getyear]"
 schwabnews.4.desc: "An alarming series of coordinated troop-movements across the Einheitspakt which have worried international observers have recently been revealed as part of a larger series of military exercises named \"West-[Getyear]\". While Germany states the exercises are routine Washington in particular has denounced the Atlantic-naval elements of the exercise, stating that they are belligerent.\n\nMade up of several divisions comprising 200,000 men and dozens of vehicles, aircraft, and ships, the exercise is the largest to date since the start of the Cold War. It's believed that the purpose of the exercise is to project power unto the global stage while also gauging the power of the Einheitspakt in a hypothetical war. In any event, it's clear the new Fuhrer isn't a simple peacenik."
 schwabnews.4.a: "A show of strength."

 schwabnews.5.t: "Klaus Schwab's Foreign Blitz"
 schwabnews.5.desc: "A recent communique out of Germany has surprised most international observers and if anonymous sources are to be believed, even members of the Reichstag itself: Klaus Schwab is headong on a foreign tour to visit the major powers of the world, most surprisingly Italy and the United States of America.\n\nWhile relations in the Cold War have warmed considerably in the last 20 years, a foreign tour of all the major powers of the world is unheard of and is a major step by Germany. While some analysts predict this is an effort by Schwab to end the Cold War through the establishment of a peaceful multipolar order, others are claiming that it's an attempt to surpass the other powers through deception. Whatever his intent, it's clear the Fuhrer is not a mere puppet."
 schwabnews.5.a: "A brave new world."

 schwabnews.6.t: "The World Economic Forum"
 schwabnews.6.desc: "From the mountain town of Davos, Switzerland, there sits an unbelievable sight. The Fuhrer of the Germanic Reich, the President of the United States, the Prime Minister of Japan, and several leaders of the major powers of the world are present together within the same hall, What was once something only seen in spy movies has become a reality.\n\nThe reason these men are present is because of the first World Economic Forum or WWF of [Getyear], hosted in Schwab's home town of Switzerland. While it's currently unknown of the meeting is largely symbolic to lay the groundwork for future ones or will actually discuss economic issues of the day, the presence of such high profile figures has given the forum an unprecedented air of prestige. Already, businessmen and elites from across the world are clamoring to attend next year's conference, and Schwab is more than happy to let them in. What this means is currently unknown, but one thing is for certain:"
 schwabnews.6.a: "The system is being reshaped."

 ##ideas
 GER_iss_member: "International Space Station Participant"
 GER_iss_member_desc: "The [ROOT.GetName] is a member of the International Space Station Project to put a space station co-manned by several great powers of the world into orbit. Naturally, the scientific knowledge and prestige from such an endeavor is invaluable."

 GER_independent_space_program: "Renewed Space Race"
 GER_independent_space_program_desc: "The Greater Germanic Reich has restarted its previously dormant space program, choosing against international cooperation in the realm of space. It is currently unknown if the other great powers will respond to this act or if it will lead to space becoming another theatre of the Cold War."

 GER_wef_member: "WWF Trustee Council Member"
 GER_wef_member_desc: "The [ROOT.GetName] is a Trustee Council member of the World Economic Forum, made to foster economic cooperation and govern on global economic matters akin to the KdN. Naturally, the soft power and economic bonus from such a privilige is invaluable."

 GER_revitalized_ns: "Utopian National Socialism"
 GER_revitalized_ns_desc: "Utopian National Socialism is the brainchild of Klaus Schwab and the so-called \"Davos Clique\", in their eyes the natural continuation of Speerite Reformed National Socialism and Technocratic National Socialism, in their eyes of their opponents it's rule by detached bureaucrats gladly shaking hands with their enemies in the East and West. Nevertheless, through Schwab's efforts, Utopian National Socialism has been codified and will define the Reich for the forseeable future."

 GER_agenda_2000: "Agenda 2000"
 GER_agenda_2000_desc: "Agenda 2000 is a plan laid out by Fuhrer Schwab to the party intended to \"Improve and innovate upon German industrial techniques and equipment while aiming to become a leading power in computing\". While the foundation might have been built by Speer, it is Schwab who has made sure that Germany will surpass all their enemies."

 GER_revitalized_pakt: "Einheit In Vielfalt"
 GER_revitalized_pakt_desc: "With the exception of a few major members, the Einheitspakt was a mere nuclear umbrella for its memberstates and our economic sphere only served to extract. The Zollverein solved this on the economic front with cooperation and investment being the main goal, but the Pakt was largely us providing for others. With Fuhrer Schwab's plan in motion, the Pakt and Zollverein will see cooperation and equal investment like never before, a truly United Europe."

 ## tooltips, relation modifiers, other misc
 GER_Schwab_NWO_tt: "As the New World Order is established, the world waits with bated breath to see what will come next.\n\nWe hope you enjoyed the 70's Speer content and especially the Schwab content, be sure to stay tuned for more of Goodwinson's crack-fueled fantasies!\nStaticness is white and there's nothing you can do to change that, Jai Hind!"

