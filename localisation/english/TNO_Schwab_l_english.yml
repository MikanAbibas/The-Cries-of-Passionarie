 tno_schwab_speer: "Klaus Schwab's tree"

 ##focuses

 SGR_look_to_the_future: "The New Order"
 SGR_look_to_the_future_desc: "The Fuhrer is dead.\n\nBut we cannot mourn. Did Hitler stop to mourn those who died at the Beer Hall Putsch? No, he did it after he came to power, after he had achieved his aims. We must do the same.\nWhilst the Fuhrer will be missed, we must ultimately look to the future, and under Fuhrer Schwab we will do just that."

 SGR_beyond_europe: "Beyond Germania"
 SGR_beyond_europe_desc: "The work our Fuhrer did in the 70's in terms of foreign policy was incredible, one only needs to look at the KdN for proof. However, the Second West Russian War disrupted his plans, and they were left unfinished.\n\nWe need to go further than what Sphere planned, we must present a clean image to the world, of an orderly and cooperative nation only looking for peace. The New Millennium will not be a millennium of war, but the End of History."

 SGR_anglo_saxon_bretheren: "Our Anglo-Saxon Brothers"
 SGR_anglo_saxon_bretheren_desc: "America, our foremost rival since the end of the Second World War. Fuhrer Speer's work in bridging the gap with them was admirable, but we must go even further: A complete and total normalization of relations, a decade-long Entspannung.\n\nWe must show our commitment to peace to the Americans, and in order to do this Fuhrer Schwab shall travel to Washington and speak to a joint-session of Congress, and then a meeting with President [USA.GetLeader] to discuss the possibility of mutual disarmament."

 SGR_a_flight_east: "[eastern_negotiations]"
 SGR_a_flight_east_desc: "[eastern_negotiations_desc]"

 SGR_japan_talks: "A Flight East"
 SGR_japan_talks_desc: "Japan, our Eastern kamerader-turned-Asian rival. The devastation left behind by the Great Asian War has destroyed China completely, and unlike our war against the Slavic barbarians, the economic chaos wraught by the rebellion of the Sphere's agricultural and industrial center and ensuing destruction has set Japan on an uncertain future.\n\nIn this uncertainity, lies opportunity. Fuhrer Schwab sees the benefit of having Japan as a counterweight against the Americans should Their Democracy elect an un-cooperative President, and in a show of goodwill will host a talk in Osaka with Prime Minister [JAP.GetLeader] on the possibility of further economic agreements."

 ##use this if china won the GAW
 SGR_china_talks: "A Flight East"
 SGR_china_talks_desc: "China, our partner in the 1930's that we regretably had to sacrifice to Japan. The rise of China has been astronomical to say the least, from the Sphere's breadbasket and a mere puppet of Japan only 20 years ago to the pre-eminent master of Asia. This new superpower is nonetheless crippled for the time being, as the Great Asian War has wraught never-before-seen destruction upon Asia and China in particular, and while Japan has been greatly weakened, it's still an economic tiger but one we can ignore for the time being.\n\nYet, China could be the weight that tips the scales in either our or the American's favor, and we must take the proper steps to ensure friendly relations with them. Fuhrer Schwab will personally meet Prime Minister [CHI.GetLeader] in Shanghai to hammer out several trade agreements and also discuss investment opportunities in China."

