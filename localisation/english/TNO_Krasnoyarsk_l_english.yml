 ### 7.1 - INTRO EVENTS ###
 KRS_intro.1.t: "The Father of Revolution"
 KRS_intro.1.d: "Lev sat at his desk, looking out the window over Krasnoyarsk. It had been almost ten years since his father had died, and even if he had been there, they would not have been easy. Lev Trotsky would be aghast at what had become of Russia, with reactionaries, fascist scum, and traitors to the revolution around every corner. His father would already have plans in motion of course, pushing the revolution ever onward.\n\nHow could they push global revolution while Russia lay in shambles? They couldn't even push Siberian revolution. Sedov remembered a distinct moment from his childhood, his father rushing around Moscow scrambling to align dozens of men and unions to back his plan before Bukharin, with little Lev in tow all the while. His father had an energy that the son had never felt he could match. Where organizing and direct action had energized Trotsky, it left Lev tired and overwhelmed.\n\nBut his father was right, it was paramount that socialism continue to stretch beyond the borders. In quiet moments, Lev the elder would rave about all the places socialism could be pushed on, Indochina and the Levant, Latin America and Britain and even Germany. The chairman rose from his seat, standing at the window and staring down at the streets, full of busy workers with scraps of red worn wherever they could be. Lev smiled sadly. His father might not be alive, and he might not be overjoyed at the state of Krasnoyarsk and Russia. But Lev would not allow him to be disappointed either."
 KRS_intro.1.a: "I won't fail you father..."

 KRS_intro.2.t: "The Past..."
 KRS_intro.2.d: "Sitting at his desk at the heart of Krasnoyarsk, Lev Sedov sat in solitude, lost in his thoughts as he mulled over the ideology of his father, his predecessor, Lev Trotsky. He reflected upon a time when the world was engulfed by the fascist menace, a time where his father’s ideas served as a beacon of hope for the oppressed masses. Trotsky’s last wishes were for Sedov to continue what he had started, and lead the revolution to new heights. With assistance from his loyal comrades, Sedov liberated Krasnoyarsk and began paving the way for a new era of peace and prosperity.\n\nAs the years passed, Sedov’s tireless efforts brought stability to the disorderly region, and implemented many of his father’s revolutionary ideas that he was unable to implement himself. Sedov, continued the permanent revolution, fighting tirelessly for the rights of workers and the downtrodden, and reaffirmed his commitment to a world revolution. Looking out over the city with a slight breeze blowing through his hair, Sedov knew that his father would be proud of what he had accomplished, the only legitimate revolution, the permanent revolution. He had carried the legacy of Trotskyism and turned theory into practice.\n\nAs the sun began to lower below the horizon, and night fell upon Krasnoyarsk, Sedov closed his eyes and breathed in the bitterly cold air. With the support of his comrades and the people of Krasnoyarsk, he would continue the fight for a continued revolution, carrying the torch of his father’s revolutionary spirit to the future."
 KRS_intro.2.a: "We will achieve socialism!"

 KRS_intro.3.t: "...the Present..."
 KRS_intro.3.d: "It was a nice yet dark night in Krasnoyarsk as Sedov took a few moments to look over the city he and his party had ruled over for years now, enjoying the breeze blowing past him. This age old city, one of the few grand cities of the motherland not engulfed by fascist flames, though it still held a cruel reality to it.\n\nAs much as Sedov had hoped it to be when he first arrived at Krasnoyarsk, he had to admit it to himself, the place was an absolute mess. No matter how many red banners were set up across the streets, no matter how many Trotskyist propaganda posters decorated the walls, the city was a gray and disappointing urban sector.\n\nYet Sedov still had hope, deep in his heart, hope that this city could be reforged by the fires of the proletariat, overcoming the warlord slums that surrounded it, it would become a beacon of the true revolution. To add on to this idealistic outcome, progress was being made with the recent economic reforms, now jobs were rising and poverty in the area was finally starting to wind down.\n\nBut Sedov still knew there was more to be done, he knew better than to be a naive bastard and think this was it. No, he knew there was more potential, more to be uncovered in this vast urban stretch, the revolution has yet to fully bring this city back to life. As the Soviets expand and march on the rest of those damned warlords, Krasnoyarsk shall be a bright shining beacon, a centerpoint of Soviet culture and a socialist utopia.\n\nThough that was all for later, Sedov reminded himself, he had to think in the present and start building the bridges and roads to the end goal he had been envisioning. As he finished wrapping up his thoughts and began walking back to his office, he turned to look over his balcony one more time, overlooking the window lights sprinkled over the fields of concrete and steel, and saw a glorious future waiting ahead."
 KRS_intro.3.a: "For the Revolution brings alight the wonders of the earth!"

 KRS_intro.4.t: "...and the Future"
 KRS_intro.4.d: "Sometimes Lev thinks to himself. What should Russia be like in the future? Of course, two words immediately come to mind. Free and fair. But what do these words really mean? Everyone considers their regime to be the fairest, and there are hundreds of views on freedom?\n\nWhat is freedom in Russia of the future? The ability to do anything? To vote for liars in the elections or to be free to profit from your own people? No, it shouldn't be like that. A person is truly free when he can be realized in any way. In the end, it was labor that made a man out of a monkey. In the Russia of the future, every person will have the opportunity to become who he sees himself in order to benefit society in the way he knows how.\n\nAnd what will be fairness in Russia of the future? Will it be a beautiful word behind which liars will hide? Will the powerful of this world push it into the background with the help of their finances? No, of course not. Everyone will have equal opportunities and it is the state that will make sure that everyone has the right to it. There is no discrimination either by gender or by nation. There is no injustice in the distribution of benefits. Everyone will receive exactly what he earned himself.\n\nWonderful ideas dreamed of by the very first theorists of socialism. So many experiments ultimately failed. But maybe it is Trotsky's ideas that will become the key that opens the way to a bright future?"
 KRS_intro.4.a: "Only time will tell..."

 KRS_intro.5.t: "The Loss"
 KRS_intro.5.d: "Why is the weather like this today? The damned precipitation prevents the car from passing. Sometimes even a special status couldn't help. Nature absolutely does not care who you are, what happens to your relatives, where you are in a hurry. Nature didn't give a damn that Natalia Sedova was in critical condition and that Lev was rushing to her. One call prompted him to rush out of the office and jump into the first truck that was nearby.\n\nAs soon as the old truck stopped, Lev jumped out of it like a bullet and rushed into the hospital building. The beating of his heart drowned out even the howling wind and the shouts of personal guards. The blood was throbbing in his head, giving off pain, but he wasn't able to stop. He couldn't be late, he had to make it.\n\nLev flew into the ward like a hurricane, various drugs brought from abroad were lying on the floor. The Chairman immediately ran up to the bed on which Natalia Ivanovna was lying. "Mom, Mom, can you hear me?!" - in a fit of emotion, he shouted. He grabbed his mother's hand and then sat down listlessly on the floor. The hand was already cold. He was late. Tears rolled down the man's face."
 KRS_intro.5.a: "He didn't even have time to say goodbye..."

 KRS_intro.6.t: "Last Goodbye..."
 KRS_intro.6.d: "Not every person is buried with the money of the state. After all, dozens die in Russia every day. Whether from illness or from a bullet. Dozens of fates will be forever forgotten by history. On the other hand, will you blame the son who just lost his mother?\n\nThe funeral procession was held according to Orthodox canons. Maybe Lev hated religion, but he could not fail to fulfill his mother's last request. After the priest threw dirt on the white shroud, the coffin lid closed forever. This was the last time Sedov saw his mother. While the coffin was lowered into the dug hole, the chairman was completely immersed in his thoughts.\n\nLike a festering wound, grief had been slowly eating away at Lev's mind from the inside for several days. But in the end he realized that he couldn't wait any longer. He did not have time to save a loved one. But how many more can he save? How many mothers and children can he save if he starts acting right now? Perhaps it was a bitter but necessary lesson for him. It's time to end the waiting."
 KRS_intro.6.a: "It's time to act!"

 ### 7.1 - PRE-SMUTA EVENTS ###
 KRS_presmuta.1.t: "Looking Back"
 KRS_presmuta.1.d: "Sedov took his moment of calm freetime, of which there were not many, to enjoy a nice bottle of Vodka, a bottle he particularly needed after yet another nearly sleepless night of negotiations over industrial reform with those pesky Hardliners, oh how they had stamped their feet over this measure, it nearly sent Sedov into another rage just thinking about it.\n\nAs Sedov was reminding himself of the report he had to read on the Anarchist raids east of the border, he found himself reminiscing on the past, on the Union, on his father Leon himself. He remembered his fathers fiery speeches, how they had sparked a crimson flame in the hearts of millions of soon to be emboldened and fighting Bolsheviks, how he had vanquished the monarchists and the Black Baron all the way to Kamchatka, and how Bukharin came in and threw the entire Union on its head with his foolish and damming market socialist ideals. Though even when the Union was shattered by the fascist demons in the west and Bukharin fled to god knows where, his father still fought on, taking base in the vast lands of Siberia and picking up the pieces to take the fight back to the Germans. He remembered the sorrow he felt as the entire theater collapsed with yet more Soviets being shredded at the hands of the Germans, and he remembered the rage he felt as Kaganovich seceded, leaving the Front to implode on in itself.\n\nIt was now Sedov’s duty to make sure the efforts of his brothers and sisters were not in vain, to reclaim the Union, to make the red banner wave proudly over the motherland yet again, to make his father proud.\n\nBut first, he needed that drink."
 KRS_presmuta.1.a: "We have a long way to go..."

 KRS_presmuta.2.t: "The Father of the Revolution"
 KRS_presmuta.2.d: "At his desk, Sedov found himself once again lost in thought, stemming from a question that has thus far stumped him, especially since attaining the role of General Secretary.\n\nWhat would his father do?\n\nWhat would Leon Trotsky, the man who the entirety of Krasnoyarsk idolized and whose practice of communism centered around, do when faced with the issue of being a ‘warlord’ state in the wake of the Union’s collapse?\n\nSedov himself didn't have to think too hard when it came to considering his fathers’ opinion, he remembered how he loathed Bukharin, Kaganovich, Yagoda. Come to think of it, he hated most of the apparatchiks who had dominated the Union’s politics up until the fascist horde stormed into Moscow.\n\nDespite his flaws, Sedov still saw Trotsky as the sole figure who would have been the savior of the Union, whose theories and writings, if done right, would not only bring the Union back together again, but to ensure that the spirit of Lenin and Marx be spread throughout the globe. Thus, it was important that his mind worked in the same way his father’s did; a machine of progress and fearlessness in the face of tyranny. The people of Russia needed a leader who would be humble but not sublime, cautious but not paranoid, brave but not stupid. Sedov knew that a man like him would suit nearly all of these necessities if he carried the mind of his father even if he didn't carry his name.\n\nNow where would he start? Wondering for a few moments, Sedov reminded himself of one of the most prized possessions his father gifted to him upon his passing. Rising from his seat and approaching his small bookshelf, he reached into the back of the shelf, uncovering a dirty and worn book. Dusting off the cover, Sedov was welcomed by the black and white photo of his father, above a title in bold letters that read, “THE REVOLUTION, BETRAYED” He sat back down into his chair, opened the book and began to read."
 KRS_presmuta.2.a: "When the Father acts, the Son learns"

 KRS_presmuta.3.t: "Remember Bukharinist Crimes"
 KRS_presmuta.3.d: "“Comrades!”\n\nSedov’s voice echoed through the hall. The delegates had already gathered, taking their seats in the lecture theatre.\n\n“As we open our annual party conference today, I would like to make a special speech.”\n\n“It has been almost 40 years since the end of the battle against the Tsarists, which solidified our control, and the survival of our fledgling state on the world stage.”\n\nSedov paused.\n\n“However, we had unknowingly allowed traitors and backstabbers into our revolution. Bukharin, especially. The king of the traitors.”\n\n“Ousting Premier Bukharin during his absence, he cracked down on dissent against his coup, and used his position of power to fill cabinets and army command with his loyal henchmen, destroying our chances to defeat the enemy at our doorstep.”\n\nThe members murmured amongst themselves before a silence.\n\n“His crime is unforgivable and the greatest sin committed against our Union, inciting the beginning of collapse and the disjointed state of our nation. His traitorous actions have brought so much grief to our people, and thus, any members found associated with him will face just punishment.”"
 KRS_presmuta.3.a: "The Hall erupted in violent shouts and curses in agreement."

 KRS_presmuta.4.t: "Mercy for Bukharinists"
 KRS_presmuta.4.d: "Sedov continued to address the Congress and it’s deputies. His criticism of Bukharin and his followers had already been broadcasted out. Now it was to the man who destroyed the Union.\n\n“I am aware that many of us hold the sentiment that our revolution was betrayed by one man, and one man alone. Nikolai Bukharin.”\n\nSedov let out a sigh, and proceeded with his speech.\n\n“Nikolai Bukharin's policies, despite having led to the Union's collapse, was not without good reason. His policies such as the Siberian Plan and attempts at industrialisation in the recovery years of the Civil War cannot be understated. He had continued to help the nation recover, assisting with our great leader Lenin, in implementing the New Economic Policy. His efforts, despite great hardship, should not be detracted.”\n\nSedov paused, for he knew his father had also supported it, despite his criticisms.\n\n“Nikolai Bukharin wanted our people to be prosperous and happy, whilst industrialising our nation.\n\nWith that said, we must forgive our Bukharinist comrades, they were misled and misguided by the need to implement Lenin's vision. It is the only way to heal the fracture in the party, and march on together to restore our Union on the world stage.”"
 KRS_presmuta.4.a: "Soon, the Congress shouted in agreement."

 KRS_presmuta.6.t: "For the Motherland"
 KRS_presmuta.6.d: "On the radio, the Internationale played, before a cut to a direct broadcast to Sedov in the Presidium Building.\n\nSedov took a deep breath, and began speaking into the microphone, broadcasting to the many citizens of Krasnoyarsk.\n\n“Comrades, Soldiers of the Red Army, commanders and political commissars, working men and working women, collective farmers, workers in the intellectual professions, brothers and sisters.\n\nOn behalf of the Bolshevik Party, I must congratulate you on our joint success to improve our way of life in Krasnoyarsk. We have recovered from decades of stagnation, in such a short period of time.”\n\nSedov paused, looking at the economists who created this miracle, before returning to his speech.\n\n“However, despite our successes, we have more pressing issues on our hands. Recently, an uptick in reactionary activities have been observed amongst our neighbours, rumours of amassing forces to attack and destroy our very way of life in the spring.”\n\nSedov paused, nodding towards the military men seated in the other corner.\n\n“As we note these reactionary plans and prepare accordingly, let us remind ourselves that we will avenge the defeat we faced at the hands of the reactionaries. We have done so much in the last half decade building what we have now. And we will defend it in these dark days that lie ahead.\n\nI urge you all, fellow comrades, to collectively defend and continue the legacy that Lenin has given us. Together, we shall ensure that our glorious union will return to her place on the world stage once more!”\n\n“Under the banner of Lenin, we shall go forward to victory!”\n\nThe speech ended to thunderous applause and a shout."
 KRS_presmuta.6.a: ""Long live our glorious Motherland, and let us fight for her liberty!""

 KRS_presmuta.7.t: "What to do With the Moderates?"
 KRS_presmuta.7.d: "The Presidium gathered for the monthly meeting at the Party Headquarters.\n\nIt was a regular formality, to discuss matters of the state. The men would gather around the table, and Radek began the session.\n\nThe usual issues of public funding into the industrial effort was discussed, until Radek motioned to discuss the important question.\n\n“Comrades, we have another matter to discuss. The matter of the new social class that has arisen from the anarchy, A new class of ‘moderate bourgeoisie’, this could be problematic to our rule, however I am also aware that this moderate bourgeoisie is also essential to the education and research of our state. So, what shall be their fate?”\n\nThe men considered their words, before Vladimir Ovseenko broke the silence.\n\n“I think we are aware of what we did during the Civil War. I say we strip them of their wealth and indoctrinate them through hard labor. The money we gather will be used to fill in the gaps of the public works.”\n\nThis comment would cause a sharp rebuke by Oppokov and Smilga.\n\n“We would rid ourselves of any chance of restoring socialism across Siberia if we did that. We are no longer in the Civil War anymore, and these people are not the same as they were in 1917. We should be instead focusing on keeping them, for they are mainly trained personnel. Instead, we will ensure revolutionary education to maintain their loyalty”\n\nThe room came up in an uproar as members verbally presented their case. Soon it boiled down into two camps.\n\n“Comrades! Settle down. I am aware many in the room have their own ideas. Mainly on integration or indoctrination through hard labor. We shall call upon Premier Sedov.”"
 KRS_presmuta.7.a: "“Comrades Oppokov and Smilga are right. We shall keep them, however, they will be educated on the benefits of socialism.”"
 KRS_presmuta.7.b: "“Comrade Ovseenko is correct. We shall confiscate their wealth and bring them to help the nation fill in the gaps.”"

 KRS_presmuta.8.t: "The Foundations of the Red Army"
 KRS_presmuta.8.d: "The Red Army started in the fire that was the October Revolution, established by Leon Trotsky to fight and defeat the Tsarists and Whites.\n\nVladimir Antonov-Ovseenko knew that, remembering his past. But something was off, he may have been old, but he knew something was off when he saw it.\nThere was something different and problematic about the Red Army of Krasnoyarsk.\n\n“Alexeyev, tell me, what is the problem you see with our glorious Red Army?” as he peered out at the courtyard. “Be honest with me, you are at liberty to speak out.”\n\nAlexeyev spoke out from his desk.\n\n“Most of the men rather sign with the militia than join the Red Army, leaving us with a strong militia and a weakened centralised army.” Alexeyev paused.\n\n“Go on.”\n\n“The Army is woefully outdated in its tactics, we are still using whatever we could scrounge from the Central Siberian War and the war against the Germans. We have no contingency plans except to defend to the last man if another state comes to invade us.”\n\n“Good observation.” Ovseenko then turned back to face Alexeyev.\n\n“Our problems could end if we could get more men to be trained and equipped under our Red Banner and have plans to strike outwards, additionally to find a common goal for the Red Army to fight for, whilst uniting our command structure. Only by then would there be no major problems.”\n\nOvseenko nodded in agreement, before speaking again."
 KRS_presmuta.8.a: "“Alexeyev, it seems you have set the cornerstone for our new Red Army.”"

 KRS_presmuta.9.t: "An Officer’s Address"
 KRS_presmuta.9.d: "The parade ground stood 3 lines of men, their belongings at their feet. The truck that brought them, far gone. Their military training started today, as the sergeants began preparations for their training.\n\n“Good Morning Conscripts.” A gruff voice voiced out.\n\nThe new conscripts perked up at the attention of the new voice.\n\n“You have been conscripted because you are here to do a duty. To protect your families and to defend our very way of life here.”\n\nThe officer looked at the men, some of them scowling at their predicament.\n\n“I know some of you have your own gripes with being a soldier, being away from your families and friends. But if not you, then who will defend them from the bandits and rapists?”\n\n“I will not sugarcoat what will happen in the next 3 months. They will test you and shape you. I have faith that you will be amongst the very ranks that stormed through the fascist lines in West Russia.”\n\n“Today, you’ll be assigned your bunks and begin training tomorrow, and remember conscripts.”"
 KRS_presmuta.9.a: "The Union thanks you for your service."

 KRS_presmuta.10.t: "A New Red Army"
 KRS_presmuta.10.d: "Alexeyev was no outsider to the military’s situation. Having been part of the NKVD, he knew how to gather intelligence and analyse how bad it was.\n\nHaving been appointed as the Deputy Commissar of Military Affairs and acting with Ovseenko’s blessings, he knew the Red Army of Krasnoyarsk was woefully under equipped with weapons that would fight the next war.\n\nHe looked at the reports that entered his desk. Ovseeko’s age was catching up to him, with most days at home, telling Alexeyev to take over most of his duties. The reports looked promising, yet the lack of modernised equipment was a fear in the back of his mind.\n\nHe looked out to the snow covering the plains, lost in thought.\n\nWithout modern weapons, the Red Army would be swept aside just as it had been in the Great Patriotic War. God forbid, a force of fascists from the Far East, the madman in Kemerovo taking over the whole of Russia or the traitors in Tyumen who endorsed Kaganovich's policies.\n\nAlexeyev felt a burn of anger and soon started enacting his bold plan to reform the Red Army. Ovseenko had left him the keys to reform and rebuild the Red Army to its best, and he would carry out that duty, no matter the cost."
 KRS_presmuta.10.a: "It would reach Sedov’s desk the next morning, and signed into action."

 KRS_presmuta.11.t: "Preobrazhensky’s Plan"
 KRS_presmuta.11.d: "Preobrazhensky, despite his age, had always been an ambitious and energetic man. Sedov was no better; they were all old men, barely alive in these terrible times. As Sedov sat at his desk, he was somewhat skeptical of the Finance Minister's plans. But he listened as Preobrazhensky spoke of his optimistic plan to reform and rebuild the nation.\n\nPreobrazhensky began his speech in an upbeat tone, "My economic ministers and I have spent many weeks formulating this plan, which we believe will most definitely bring a new golden age to our small but strong union, it includes both investment and reform in the industrial sector, as well as improved collectivization techniques," Preobrazhensky continued, becoming more confident in his manner of speaking as he went on.Sedov, who immediately perked up, gestured for Preobrazhensky to continue.\n\n"The first act in these plans is to divert a large part of national spending to our industrial sector, not only to expand our urban areas, but also to increase our material production. Second, we must implement a reformed process of collectivization of the public in order to provide the nation with more abundant resources. Finally, we will invest in our civil sector so that lower economic zones can be built from the ground up, allowing for a stronger system of internal exchange and a better life for the people. This description is a summarized version of our overall plans, if you wish to see the details here-"\n\n"Approved," Sedov said, cutting Preobrazhensky off, his face a mixture of shock and confusion.\n\n"You approve of our civilian proposals?" Preobrazhensky asked, perplexed.\n\n"No, the whole thing, you are the only one in the government whom I trust to develop Krasnoyarsk, so I will fully allow your plans to go through. "
 KRS_presmuta.11.a: ""No remarks? Good, your work will begin immediately."

 KRS_presmuta.13.t: "The Supply Line"
 KRS_presmuta.13.d: "The city centre became a place of long bustling queues, especially outside the lot where the Communist party headquarters was located. Women and men alike queued, whilst others trotted around, leaving with their goods and going on their way.\n\nOfficials checked identification cards and handed out surplus food, commodities and monetary coupons to be used in the few shops that operated in the city.\n\nSergey looked at his identification card. He hoped he had enough to feed his small family and receive enough.\n\nComrade Vyachitov, the state has ensured your family will have enough. You are entitled to extra rations for your family as well as a small monetary compensation for your work as a mechanic. The state thanks you for your service.”\n\nSergey collected his things and sighed in relief. His family would have enough, thankfully. Looking further at the goods he received, he smiled."
 KRS_presmuta.13.a: "Maybe things are looking up afterall."

 KRS_presmuta.14.t: "The Fruits of our Labor Revealed"
 KRS_presmuta.14.d: "Unlike most other days, Sedov was relatively enthusiastic for the meeting that was scheduled to begin in a few moments, and who wouldn't be? The Economic plans, or as the man himself nicknamed it, “Preobrazhensky’s Plan”, had been a sweeping success in almost every aspect. Everywhere Sedov looked the economy was not only strengthening, but also surpassing the neighboring warlord economies, truly a sign of the bountiful Soviet future to come.\n\nSedov was busy in these idealistic thoughts when Preobrazhensky finally entered the room along with one of his aides, holding various documents and charts detailing this past year's growth. Preobrazhensky began the meeting with a speech;\n\n“Gentlemen, over the past few months the entire state of Krasnoyarsk has been through a positive overhaul of various institutions. We have seen our industrial and material yields increase dramatically, with some economic centers reporting nearly triple the amount of productivity in their factories. Our economic reforms have drastically increased employment and wages for the average soviet man and woman, with poverty rates decreasing across the board.”\n\nThe room roared with applause from all the members of the soviet inner circle, with Sedov himself nearly bursting from the emboldenment he felt in this success, this tide of pride kept on going as Preobrazhensky continued;\n\n“While there is still a long way to go in reclaiming the motherland, this demonstrates that our combined policies and plans will surely deliver us a near Utopian state, that is all, and Long Live the Union!”, Preobrazhensky said, with the last noble words resounding off of the walls with the rest of the state members repeating them."
 KRS_presmuta.14.a: "Preobrazhensky, you magnificent bastard!"

 KRS_presmuta.15.t: "Fuel Rush"
 KRS_presmuta.15.d: "The trucks belched out acrid smoke across the proving grounds, as the major looked at the motorized infantry speed across the field.\n\n“Sir, with due respect I still think this is a really bad idea. We have limited fuel in the caches and depots that we can find, a motorised unit will just consume all our fuel in a day, if we are lucky.”\n\n“Your remarks are well noted, Comrade, but this is important if we want to have an advantage against our enemies. Let me ask a simple question, how far can a man march in a day?”\n\n“20 to 40 kilometres a day, Comrade Major.”\n\n“And how far can those trucks go on one tank of gas?”\n\n“About 150 to 200 Kilometres, Comrade Major, should everything go normally.”\n\n“Hence why our General Staff is trying this process of motorization. If we have motorised divisions we can save sweat and blood trying to attack the enemy and walking through deep snow when our trucks can manoeuvre through the terrain.”\n\nThe Major viewed with his binoculars from the platform, seeing the trucks stop, with infantry dismounting and proceeding with attack drills, before remarking"
 KRS_presmuta.15.a: "These Divisions will drive all the way to Moscow one day."

 KRS_presmuta.16.t: "Rising Wings"
 KRS_presmuta.16.d: "Arseny Vorozheykin and Ivan Kozhedub looked at the airbase in front of them, the aircraft in it in the midst of restoration.\n\n“Not like the ones we had in our day. But it will have to do.”\n\nVorozheykin looked at the machines being readied by the mechanics, hoping they would take flight again into the skies.\n\nA miracle in Siberia entirely, a fully intact airbase, with a small handful of planes left idle, some in crates, buried in the snow. Now, mechanics were fixing them, getting them airworthy once more.\n\n“You think we would be able to take into the skies again Arseny?” as Kozhedub glanced over at the bunch of pilots and volunteers that formed up in the base’s old mess hall.\n\n“Unlikely for me at least. But I’ll ensure your pilots will live up to the standards we endured.”\n\nVorozheykin then picked up a small briefcase, heavy with maps and notes on flight training.\n\n“Now, let’s go and start their training. Shall we?”"
 KRS_presmuta.16.a: "The Two Aces took off, forming a new generation of flyers."

 KRS_presmuta.17.t: "An Interesting Note"
 KRS_presmuta.17.d: "“If I am reading this correctly, Nikolay Nikolayevich, that you are proposing to allow citizens to create their own enterprises?” Sedov tossed the manila folder on his desk.\n\n“Yes, Lev Lvovich. In the future, under this proposal, this would allow our economy to reach new heights”\n\nSinyavsky was in Sedov’s office, being questioned about a proposal sent to the Central Committee of the All-Union Communist Party of Bolsheviks with a proposal to allow citizens to create their own cooperatives, or artels. The essence of the idea was that these enterprises, according to Nikolai Inozemtsev’s idea, were to become private. Although this was contrary to the party line, according to Inozemtsev himself, it should have borne fruit.\n\n“You dare to propose this, to take a small step with market relations. You do understand how the Presidium will react to this, right?\n\n“Yes, Lev Lvovich.  If necessary, I am ready to defend this idea to the end, even at a meeting of the Presidium. I believe this could bring a better quality of life for our citizens”\n\nSedov looked at the young economist and, took a heavy sigh, before relenting:\n\n“Okay, Nikolay Nikolayevich.I will raise this issue with the Presidium. But since I value you as a young and energetic economist, I warn you: Be prepared to defend it even before your direct boss, Evgeniy Alekseevich Preobrazhensky.”\n\nInozemtsev was not embarrassed by the words of the General Secretary and he reported:\n\n“I will see to it, Lev Lvovich. I will be ready to defend my ideas.”\n\n“Fine. You can go, Comrade Inozemtsev.”"
 KRS_presmuta.17.a: "Cheek brings success."

 KRS_presmuta.18.t: "The Workshop"
 KRS_presmuta.18.d: "Fulfilling his father's dying wish to keep the family workshop running was Sergey’s goal, but it was getting harder every day. Lev had spent his life working in a munitions plant in Divnogorsk. Sergey remembered his father's pride as a revolutionary and worker, and his sadness when the Union collapsed. Despite this, Lev continued working, opening a workshop with his trade skills.\n\nSergey had promised his father he'd keep the workshop running, but now it seemed impossible. Business was worse than ever, with expired ration cards and the same three songs on the old radio. Sergey realized he couldn't continue as long as the state decayed. One day, the workshop would close permanently.\n\nAmid these thoughts, a letter arrived from the state’s department of economics. Inside was a note:\n\nDear Comrade Vyachitov,\n\nUnder the Union's new policy of economic development and revitalization, you are eligible for monthly subsidies. We hope this will supplement you alongside the services you provide to the state. Should you have any concerns, contact your local head representative.\n\nGlory to the Union, Glory to Premier Sedov\nSigned the People's Commissar for Finance\n\nSurprise, realization, and relief surged through Sergey. He looked at the old, dilapidated workshop, and for the first time in years, felt a sense of hope"
 KRS_presmuta.18.a: "A New Dawn for the People."

 KRS_presmuta.19.t: "Economic Renaissance"
 KRS_presmuta.19.d: "The meeting of the Presidium of the Central Committee was held in a solemn atmosphere. An extraordinary session, entirely devoted to Nikolay Inozemtsev’s commission, which was the presentation of his plan for economic reforms. Unofficially, Inozemtsev's reform program was nicknamed “Return to NEP.”\n\nKarl Radek, chairman of the Council of People's Commissars, opened the session.\n\n“Comrades, we are gathered here to discuss a major proposal. With that, I shall hand the floor to the chairman of the government commission for the preparation of economic reforms, Nikolai Nikolaevich Inozemtsev.”\n\nThe economist himself came to the podium to the sound of applause.\n\n“Comrades. I would like to start by saying that some members of the leadership do not fully understand the nature of my economic reform program. Its whole point was to, thanks to the experience of the old leadership of the Bolshevik Party, restoring the economy of our country.”\n\nInozemtsev paused. “I believe that the People's Commissars still remember the time when in 1921, our late Premier Vladimir Lenin announced the so-called “New Economic Policy” and the extreme controversy it caused. It is worth noting that this policy was the only way out of the then current situation. In our case, it is also worth recognizing that even now we have no other alternative but to use some components of the NEP to begin restoring the economy of our country, and then increasing the rate of economic growth.”\n\nApplause rang out in the hall in response. Inozemtsev drank a little water from a glass nearby and began to sum up the results of the reforms, before concluding his speech.\n\n“Summing up the results of the reforms that have been implemented to date, we see the growth of the economic power of our country. If the leadership of the People's Commissariat of Finance gives us the permission required to further carry out reforms, then the country will receive the basic foundation that will serve in the future to carry out industrialization, first in Central Siberia, and then throughout Russia.”"
 KRS_presmuta.19.a: "The hall exploded with applause."


 ### 7.3 - SMUTA EVENTS ###
 KRS_smuta.1.t: "The Paradox of Trotskyism"
 KRS_smuta.1.d: "“Now there will be a report by the General Secretary of the Central Committee of the All-Union Communist Party of Bolsheviks.” Karl Radek’s voice filled the room, where all 15 members of the Politburo were sitting. Lev Sedov took a sip of water, before beginning his report.\n\nSedov cleared his throat and took the floor.\n\n“As we all know, comrades, fellow members of the Politburo. The current situation in Russia looks much worse compared to 1924. I’m sure many senior members in the room remembered that the former Soviet Union had at least some kind of material basis for starting a permanent revolution. In our current situation, when the country is divided into warring states, we do not. Hence, that is why I propose something controversial, by borrowing some ideas from the revisionists”\n\nEvgeny Preobrazhensky raised his hand in response. After receiving tacit approval, he shot the question everyone had on their minds.\n\n“What do you mean by this, Lev Lvovich? This is highly unorthodox.”\n\nSedov, ready for such an answer would reply without fail.\n\n“I propose to borrow the concept of building up socialism in the country, as a necessary evil, before considering the very idea of permanent revolution. Namely, it is necessary to strengthen ourselves on our rightful lands, and only then begin our permanent revolution. Otherwise, we will simply be crushed.”\n\nWhen Sedov finished his reply, the floor was unexpectedly given to a candidate member of the Politburo, Nikolai Inozemtsev.\n\n“Perhaps I agree with Lev Lvovich’s idea about strengthening our positions in Russia. We all understand perfectly well the state in which people in our community are living now. And starting to spread the fire of communism throughout the world in the current situation, in my personal opinion, as an economist, looks unreasonable.”\n\nOther members of the Politburo agreed with Sedov's words. Despite the alien and potential factionalism it may have caused, only Karl Radek abstained from voting.\n\n“It is decided then. We shall focus on building socialism up in the nation, before we spread the permanent revolution globally.” as Radek noted the results. “This meeting is adjourned.”"
 KRS_smuta.1.a: "A necessary decision for the good of the revolution."

 KRS_smuta.2.t: "Every Small Effort"
 KRS_smuta.2.d: "Calling the work in the Achinsk collection center “productive” would be a gross overstatement, at least by Milokov’s terms, with him being the first face that many would see when they handed over valuables for the war effort.\n\nBless those at the front, Milokov thought, he still remembered how he held off the Germans in Penza, fire and savage fighting at day, cold and bitter at night, but the cold was warmer than wasting away in Siberia. Now he was here, collecting scrap on behalf of the Red Army.\n\nHe missed the old days, the order and the peace. Bukharin may have been a damnable idiot, but at least he tried to fight the fascists, unlike the new corrupt warlords.\n\nMilokov’s thoughts eventually faded away, leaving him to eye a new pamphlet given to him by the officers in the propaganda department, on it was a drawing of a Red Army soldier, submachine gun in one hand and the crimson flag in the other, valiantly calling for the words “Holding the Front requires your help! Collect Scrap for the War Effort”, boldly lying near the center of the picture.\n\nSo this was what was posted across the city, Milokov realized, assuming it was just another Agitprop artist trying to get a morale boost within the populace. Milokov reclined in his chair, reaching for his state-printed magazine before being interrupted by a knock at the window.\n\n“Hello? Is this the collection point?”, a young boy said, holding what must have been a small bag of scrap in his hand.\n\nMilokov turned to the boy, he couldn't have been more than 8. “Yes, this is the collection point little boy, what do you have in your hand?”, he said.\n\nMilokov peered to look at the boy, before being astonished at the sight of a group of children carrying sacks of various sizes. Milokov looked back at the boy who seemed to be almost beaming with energy, “So, what brings you here to the office?”\n\nThe boy looked up and smiled, “I told my friends about a poster to collect scrap, and with some help from our families we managed to get some!”\n\nMilokov paused for a second, staring at the boy in near disbelief as he stood there with the written sheet in front of him. After a moment of thought, Milokov took the clipboard, stamped it, and gave the kid a smile."
 KRS_smuta.2.a: "Every Small Effort Counts."

 KRS_smuta.3.t: "Curfews in District 17"
 KRS_smuta.3.d: "The two men walked the streets of the city, as part of the martial law patrol. The police squadrons had schedules overhauled to assign personnel for patrol duties ever since the new state-enforced martial law order.\n\nAndrei stood up against the door leading to the local bakery as Golkov shuffled around his pocket, searching for his lighter. Andrei looked up at his fellow soldier, before gazing down the empty city street.\n\n“Do you ever get creeped out by the quietness here?” Golkov took a brief pause looking for the lighter, “Eh yeah it's a bit unnerving, always-”, Golkov halted his response, instead directing his attention further down the road, “You see that?”\n\nAndrei looked across the street to see a black figure quickly walking towards the two soldiers, with something not so visible being held in his hands. Andrei affixed his rifle, with Golkov reaching for his sidearm, “HALT! CURFEW IS IN EFFECT, SURRENDER NOW”, the figure made no effort at stopping, instead continuing further, shouting something in a language the two men didn't understand.\n\n“STOP NOW OR YOU WILL BE-”, Andrei couldn’t even finish before the stranger stopped pacing for just a second, before beginning to sprint towards the men, all the while shouting in some kind of dialect and waving his hand. Both of the men reluctantly opened fire, with multiple shots discharged, sending the figure to the snow-covered ground, groaning in agony.\n\nGolkov walked towards the fallen stranger, with Andrei keeping his guns’ sights trained on his body. Golkov used his foot to kick the man so his chest was facing the sky, the light reflecting off of him, displaying three gunshot wounds to his chest and stomach. Golkov analyzed the man before looking back up at Andrei, “It's a Kazakh, he’s got a package of bread, I think he was the baker, poor bastard.” Andrei lowered his rifle, “Shit... call the commissar, get him to the hospital. They’ll treat and detain him for breaking the laws”, Golkov gestured at the bakery, “What about the locals?”. Andrei sighed, “I guess they’ll have to find a new cook eh?”. The two of them chuckled nervously before going back to their scheduled patrol, keeping the civilians of the Union safe."
 KRS_smuta.3.a: "Life is cruel and unfair."

 KRS_smuta.4.t: "Something Unthinkable"
 KRS_smuta.4.d: "The morning began with the prison door clattering as it was opened by one of the guards, shotgun in hand as he barked orders to Grigory and his fellow prisoners.\n\n“All prisoners are to proceed to the main prison hall immediately, failure to do so will result in punishment! Now GO!”. Grigory heaved his old and tired bones up off of the bed, itching his beard and internally cursing the guard for waking the cellblock at such an early time, nevertheless he didn't have much of a choice.\n\nAs Grigory and the rest of his fellow prisoners marched down the hall he began to realize it wasn't just his group of prisoners who were called, but the entire gulag, as there must have been hundreds or so gathered. With the mass of prisoners bunched up in the center hall of the gulag murmurs began to spread; ‘They’re gonna kill us.’.\n\nGrigory himself had no idea what was going to happen, though he had not particularly cared, all he cared about nowadays was his niece back home. How long had it been since he had seen her, but he knew the poor girl had been left with his half-cousin, and god knows how he was handling it.\n\nJust as the murmurs had reached their peak, a commissar stood atop a podium and spoke through a loudspeaker.\n\n“Attention Comrades, following the decision of the Presidium, a new policy has been adopted. You have determined to be worthy of redemption, and hence you are all hereby released, with your criminal histories expunged. We will arrange the necessary releases. Glory to Sedov! Glory to the Union!”. Upon finishing his speech the commissar stepped down the podium and walked off.\n\nFor a while there was silence, then brief whispers, and finally, as small as it was, celebration. Men hugged one another, tears of joy adorning the faces of many of the men, some having just a few months stolen from them within these walls, some nearing years or decades.\n\nGrigory himself was speechless, he stopped believing in God years ago, after his family was torn apart, his brother’s death in the war and his sister murdered by bandits before he was placed here, but here it was; Freedom.\n\nAs the former prisoners were filed out of the gulag, awaiting their transport, the men embraced the steady breeze of that season's weather, Grigory looked at a picture of his precious niece, looked up at the sky, and smiled."
 KRS_smuta.4.a: "A Better Tomorrow Awaits."

 ### 7.4 - PILLARS EVENTS ###
 KRS_pillars.1.t: "A Meeting with the Hanged Man"
 KRS_pillars.1.d: "Sedov entered the makeshift headquarters of the Party in the disused secondary school. A pair of soldiers stood at attention, before opening the doors to let him in.\n\nRed flags and portraits of long gone communist leaders dotted the various walls, as he walked towards Radek’s office.\n\nKnocking on the door, he entered into the office\n\n“Comrade Radek, you requested my presence today outside our weekly meetings. So, what seems to be the matter?” as he took his seat.\n\n“Premier Sedov, I do understand you are a busy man as Premier of our state, however we seem to run into a problem within the party.” Radek sighed as he pulled out a small stack of papers.\n\n“Many party members and apparatchiks have been filing reports on the militia in certain regions. Many report that the militia openly defy our rule despite winning the local elections. As you know this is an important matter. If we do not retain control of these regions, we would have renegades and rebels openly questioning our rule, despite the people’s mandate.”\n\nSedov looked at the elderly man, almost hapless to do anything.\n\n“I realise that I must do something, and it will require your help Premier Sedov. I need some Red Army units to follow our Party members to enter the regions and ensure order is restored. If you do, I can ensure that the Party can be reigned in adequately for proposals to be passed.\n\nSedov looked at him again before giving his reply."
 KRS_pillars.1.a: "“Consider it done. Now, let me give a call to Vladimir Ovseenko.”"
 KRS_pillars.1.b: "“Comrade Radek, I am sorry but I cannot allow this action. The people will not tolerate such brutality.”"

 KRS_pillars.2.t: "The Delegates and Sedov"
 KRS_pillars.2.d: "Radek had invited Sedov with the older delegates to the meeting room in the Party Headquarters that afternoon.\n\nIt must have been important, if it meant that most of the Old Guard was in the room with the Premier himself. Soon, the men gathered around the table, and Radek began the session.\n\n“Comrades, we are gathered here today to discuss the matter of the state. Currently, we are about to finalise our implementation to revitalise our nation.”\n\n“I have some final proposals for the Committee, on behalf of Comrade Preobrazhensky, who is unavailable today. We have discussed at length, and have decided the government needs serious reforms into the sector of ore production, farming and the national economy. This includes expanding the production facilities, and using proceeds to fund the national economy” Oppokov spoke out at the left of the table.\n\n“We also have matters of education to settle. The education system has atrophied in the anarchy that we find ourselves in. We are thankful for the village schools that are open, but we need proper schools for the children to study in.” Obolensky spoke out at the right of the table.\n\nSoon, the table was rife with conversation and mild banter. Radek would bang the table several times with a small gavel.\n\n“Comrades, Comrades. We can only put our funds into one issue here. The budget is stretched thin. Since both sides of the table have already made their mind on which issue it is, Premier Sedov will decide which action we shall take.”\n\nSedov looked at every member of the room, and finally Radek, before speaking."
 KRS_pillars.2.a: "“I believe Comrade Obolensky is right. We shall focus on education. We need bright new minds in our administration.”"
 KRS_pillars.2.b: "“The Financial Commissariat will have the funding. These resources that we will obtain will continue to fuel the revolution.”"

 KRS_pillars.3.t: "A Meeting Between Gentlemen"
 KRS_pillars.3.d: "Sedov entered the makeshift headquarters of the Party in the disused secondary school. A pair of soldiers stood at attention, before opening the doors to let him in. His own pair of guards stood at the car, waiting for his return.\n\nHe walked towards the office. Radek had arranged a meeting with him a week ago, and now it was time to see him.\n\nHe knocked on the door before entering, only to be met with a younger figure.\n\n“Premier Sedov, welcome, please, sit.”\n\n“Comrade Anton, where is Comrade Radek? He specifically arranged to meet me.”\n\n“Commissar Radek took ill today. Prior to this he has informed me on what he wanted to address.”\n\nSedov accepted the reasoning. Many of the cabinet members were old and aging, the environment was also not kind to their health either.\n\n“Please carry on Comrade Anton.” as Sedov crossed his legs and leaned back in the chair.\n\n“As you know, our party delegates have been hard at work, with their endless devotion to the people. However, there is one aspect we must address, the future generations. Some of the delegates have highlighted that the children must be inculcated with the values we hold in the party. Hence Commissar Radek and I have decided to request that we restore the Kosmosol.”\n\n“And what can you guarantee with this restoration of our youth wing, Comrade Anton?”\n\n“This youth wing will allow us to have a steady stream of future delegates and ensure our current standing amongst the people will grow. Additionally we can address the issue of children having after school activities to ensure they are active within society.”\n\nSedov pondered for a moment, before giving a reply."
 KRS_pillars.3.a: "“I agree with your sentiment. Necessary arrangements will be made to implement this across the state.”"
 KRS_pillars.3.b: "“I disagree, Comrade. Resources to conduct this programme are limited and it is absurd with such a small population.”"

 KRS_pillars.4.t: "A Warrior's Request"
 KRS_pillars.4.d: "The door to the Krasnoyarsk Revolutionary Military Headquarters opened, allowing for the harsh winter winds to fill the room with a chill, followed by several armed guards accompanying premier Lev Sedov, who handed his coat to one of them. Upon turning a corner, Sedov was greeted by the elderly man himself, who let out a laugh as he shook the premiers hand, “Comrade Sedov, It has been too long. The planning room is right this way.”\n\nThe two of them made their way into a smaller room, with the walls plastered with maps, charts, and pictures of officers, now long gone. Ovseenko straightened his uniform and gestured for Sedov to take a seat, “I'm glad you had the time for a meeting, I’m lucky I managed to contact you.”\n\nSedov nodded, “Respectfully, Comrade Ovseenko, we are short on time and we still have a great workload ahead, so set the pleasantries aside, my friend.”\n\nOvseenko nodded. “Of course. I have invited you here to discuss the upcoming war with our warlord neighbors. My fellow generals estimate that war with the surrounding separatists is likely to take place within the next 1 to 2 years. Currently, our military stands at an-“ Ovseenko let out a series of dry coughs before reaching for a glass of water.  “...an unsatisfactory spot, excuse me. Our reserves of munitions and artillery are still as dire as they have been since the collapse, and while I do applaud your past efforts at strengthening our boys, it is still not enough if we want to win.”\n\nOvseenko put his hands on the planning table and eyed Sedov, whose suspicions of Ovseenkos’ incoming request were all but confirmed. “I humbly request Premier Sedov, for more financial support to the Red Army. Rest assured that, I and the general staff have made do with these previous provisions given by the Presidium. I do know the economic situation is quite dire, but this is really important, comrade.”\n\nSedov exhaled slowly, eying his hands as he thought of his response, with Ovseenko growing increasingly concerned at the Premier’s reaction. Sedov turned in his seat and addressed the general."
 KRS_pillars.4.a: "“You will get your additional funds, I will make the arrangements immediately”"
 KRS_pillars.4.b: "“I’m sorry Comrade Vladimir, but I cannot spare anything at the moment.”"

 KRS_pillars.5.t: "Another Humble Request"
 KRS_pillars.5.d: "The door to the Krasnoyarsk Revolutionary Military Headquarters opened, allowing for the harsh winter winds to fill the room with a chill, followed by several armed guards accompanying premier Lev Sedov, who handed his coat to one of them.\n\nUpon turning a corner, Sedov noted a small plaque, the planning room. Ovseenko must be in there.\n\nSedov knocked on the door, before making his way into the smaller room, with the walls plastered with maps, charts, and various writing instruments. Ovseenko straightened his uniform and greeted Sedov, “Premier Sedov, I'm glad you had the time for a meeting, I’m lucky I managed to contact you.”\n\nSedov nodded, “Respectfully, Comrade Ovseenko, we are short on time and we still have a great workload ahead, so set the pleasantries aside, my friend.”\n\nOvseenko nodded. “Of course. I invite you here to discuss the Red Army, and regrettably, it is not good news.” as he poured out water for the both of them.\n\n“Many of my fellow generals estimate that war with the surrounding separatists is likely to take place within the next 1 to 2 years. Currently, our military stands at an-“ Ovseenko let out a series of dry coughs before reaching for his glass of water.  “...an unsatisfactory spot, excuse me. Despite whatever we have done, the training and the facilities we receive is still as dire as they have been since the collapse, and while I do applaud your past efforts at strengthening the Red Army, it is still not enough to achieve victory.”\n\nOvseenko put his hands on the planning table and eyed Sedov, whose suspicions of Ovseenkos’ incoming request were all but confirmed. “I humbly request Premier Sedov for more financial support to the Red Army. Currently, the old bases and training methods are just not enough for us. Alexeyev alongside the General Staff have come up with ideas of a new training plan and facility. Only basic materials are needed and we will just require minimal state funding, to ensure that our conscripted men have the necessities to ensure their survival on the battlefield.\n\nSedov exhaled slowly, eying his hands as he thought of his response, with Ovseenko growing increasingly concerned at the Premier’s reaction. Sedov sipped from his glass of water, before addressing the general."
 KRS_pillars.5.a: "“You will get your new facility Ovseenko, I will make sure of it”"
 KRS_pillars.5.b: "“I’m sorry Comrade Vladimir, but the Red Army will have to make do for now.”"

 KRS_pillars.6.t: "A Meeting with the Deputy"
 KRS_pillars.6.d: "The door to the Krasnoyarsk Party Headquarters opened, with Sedov briskly entering the planning room. He was running late, and he was rushing to meet someone that had already been waiting.\n\nHe knocked on the door and met face to face with Alexander Alexeyev, who was already seated at his desk.\n\n“Comrade Alexeyev, sorry to keep you waiting. I was preoccupied with another meeting. Now, let us get to it .” As he quickly sat down to listen to what Alexeyev had in store.\n\n“Premier Sedov, it is no problem, I understand that matters of the state are important. Nevertheless, I am here to discuss matters of the Red Army, as mentioned over the telephone.” as Alexeyev pulled out a manila folder from his briefcase, before presenting it on the table.\n\n“The recent training reports from our standing Red Army units, as well as the general readiness of the Red Army. Currently, we are quite good. However, we are lacking in the section of Military Research. Despite the Military Science Committees Initiatives, our research has been nascent at best.” as he finished his sentence.\n\nSedov looked at the research reports. They seemed promising, yet the research always ended at the second stage or third, having been stopped due to the lack of funds.\n\n“So, with that said, I would request from you, Premier Sedov, that we authorise a minor investment into the Military Research Initiatives, this would allow our men to be equipped with better equipment, as well as ensure that our scientists get the necessary funding to continue the socialist cause”\n\nSedov looked at the report again, before making his answer."
 KRS_pillars.6.a: "“I agree with your sentiment, the Military Science Committee will get its additional funding.”"
 KRS_pillars.6.b: "“I apologize Comrade Alexeyev, but these funds are necessary for other aspects of the state.”"

 KRS_pillars.7.t: "Discussing the Economy"
 KRS_pillars.7.d: "Sedov waited in his office in the city centre, as he saw the clock tick by. Preobrazhensky had requested to meet him in person today to discuss matters of the economy.\n\nSedov wondered what would be discussed. His thoughts would be derailed when the guard opened the door.\n\n“Premier Sedov, Commissar Preobrazhensky is here to see you.”\n\n“Send him in.”\n\nSoon, Preobrazhensky entered the room.\n\n“Premier Sedov, it’s nice to see you. As stated previously, I am here to discuss matters of the state economy.” as he reached out for a glass of water.\n\n“Please, do get on Comrade Preobrazhensky.”\n\n“With the new economic policies we have enacted, we have some excess funds that have little use in our reserves. With that said, the department and myself have agreed that we would like to authorise the funds to be used for the purchase of newer agricultural and industrial equipment.” as he sipped the glass of water.\n\nSedov slowly pondered for a moment as Preobrazhensky continued on.\n\n“I understand that previously the government has already contributed funds for such equipment, however 35-40% of agricultural farms and 45% of industrial equipment are still using outdated methods of production. We aim to reduce that number down to 20%” as he finished the water. “So, Premier Sedov, would you assist in this programme?”\n\nSedov would come up with his answer."
 KRS_pillars.7.a: "“Authorized Comrade, please ensure that such equipment is distributed amongst the communes and get that number down!”"
 KRS_pillars.7.b: "“I apologise Comrade, but the funds have been promised to fund other projects of the state”"

 KRS_pillars.8.t: "Finalizing the Means of Production"
 KRS_pillars.8.d: "Sedov departed from his motorcade and thanked his chauffeur, gazing up at the entrance to the local Krasnoyarsk trade union house, having been seized for state economic discussions. Above the entrance read ‘PEOPLE’S COMMISSARIAT OF FINANCE (KRASNOYARSK)’, with a statue of Lenin, albeit faded and slightly damaged, standing proudly in front of the door.\n\nUpon entering, Sedov made his way into the planning room, where Preobrazhensky and his confidants had just begun discussions. Noticing the Premier’s entrance, everyone halted their conversations. Preobrazhensky would notice this and welcome Lev Sedov.\n\n“Ah! Forgive me Comrade Sedov, we decided to begin an in depth discussion before deliberation as we awaited your arrival.”\n\nSedov held no bitterness, “Do not worry yourself Yevgeni, progress of any kind is necessary for socialism. Now, what exactly have I been called here for?”\n\nPreobrazhensky nodded and gestured towards one of his advisors, who pulled out a few papers with the state’s emblems, “The recent state collectivization reports have shown a decline in efficiency, mostly pertaining towards our lack of viable mechanical equipment. This years’ crop yields have required greater amounts of plowshares, tractors, and other agrarian tools. Unfortunately, our industrial base has not managed to fill the gaps in their quotas, which could very well develop into a trend where the state will not have enough collectivized resources for the next few years.”\n\n“That is the main problem,” Preobrazhansky claimed, prompting nods from the rest of the economists, “We lack the proper tools necessary for total collectivisation, something we have not seen since the Siberian War. We would like to formally request an increase in state investments into industry. These new funds will be directed towards production of vitally needed equipment and planning to ensure that such a deficit will not exist in the future.”\n\nThe room was filled with anticipation, with all of the men eyeing Sedov, who was by now debating his next words in his head. After a brief back and forth in his mind, Sedov exhaled and faced Preobrazhensky..."
 KRS_pillars.8.a: "“I believe that will be possible gentlemen, the Presidium shall approve.”"
 KRS_pillars.8.b: "“Though I trust you all dearly, I'm afraid I cannot provide such time nor resources at this moment. .”"

 KRS_pillars.9.t: "Paid By The Hour"
 KRS_pillars.9.d: "Sedov was a man of the Union, Shamalov was a man of Labor, both were statesmen of the commune, and both were about to play a part in deciding the commune's future, more specifically, the workers’.\n\nThe pair had been walking down the industrialized areas of Krasnoyarsk, where the two statesmen were in full view of the average Soviet citizen. Sedov had been invited by Shamalov to inspect a weapons manufacturing factory, where hundreds of workers toiled away at crafting weapons for the Red Army, where he was briefed that the work was intense and grueling.\n\nBoth the men and women in the factory were visibly rugged, their hands calloused and rough, their worn overalls covered in soot and dirt. Even though the men hadn’t entered the factory floor, the smell of sweat and sulfur filled the corridors so much that Sedov nearly gagged.\n\nShamalov, more used to the smell, faced Sedov, “See this? This is what I mean. Our Communist Party, despite its dedication to the workers and peasants, has not given proper aid to the conditions of our communes’ factories. I have attempted to push the work reforms through the party congress countless times, with them dying on the floor with little care, which is why I have come to you directly, Premier Sedov. Comrade Preobrazhensky may be an excellent economist, yet he knows next to nothing of the true damage some of his plans do to the workers.”\n\nSedov understood and nodded, “I see, what is it you are proposing, Comrade?”\n\nShalamov withdrew a folder from his coat, “This requested reform is a small one: The proposal is for state-mandated work hours to be reduced by 2 hours per day, making the work day 10 hours. I understand if you have reservations Premier Sedov, but I assure you that I have done the math, this will have minimal effects on the industrial output for the economy, whilst ensuring the workers will not reach exhaustion due to longer working hours. I am pleading with you to think of the workers, their families and their health.”\n\nSedov analyzed the paper. With his signature the law would be enacted, yet this would surely cause negative discourse with the hardliners, and further factionalism was the last thing he wanted. Just before Sedov reached for his pocket pen, he faced Shamalov."
 KRS_pillars.9.a: "“You prove a good point, Shamalov. I will authorize the implementation of it by next month.”"
 KRS_pillars.9.b: "”I apologize Comrade Shamalov, but currently a greater industrial output is necessary for the Revolution.”"

 KRS_pillars.10.t: "Trains on Time"
 KRS_pillars.10.d: "The phone on premier Sedov’s desk rang, confirming Sedov’s prediction of his scheduled 4:00pm call with Dombrovsky. Sedov picked up, “Dombrovsky, I presume?”\n\nA wheezed laugh was heard on the other end, “That would be me Comrade Sedov, yes. First of all, thank you for deciding to hear me out instead of Serebryakov, I know there are issues with the country's infrastructure, yet I believe that there are far more concerns within the communes, railways and junctions.”\n\nSedov’s interest has officially been raised, “I see, how has the railway department dealt with our train network?”\n\n”Well to put it in light terms; we are struggling. The current funding we are receiving from the state is rather insufficient when dealing with repairing Krasnoyarsk’s rails and train carts. The damage from the Siberian War still remains, with more than half of our rails relying on faulty patchwork material just barely keeping them together. While we may have a large pool of prisoners to conduct repair, these prisoner-workers are unqualified for railwork. We require more skilled engineers and people who have had more experience in dealing with railway placement and repairing.”\n\n“I see, and I am assuming you wish to receive further state funding?”\n\n”Not only that sir. Comrade Drobnis, with the people under my charge, have put together an educational program. A basic set of instructions and manuals that could teach any worker the essentials of repair, that would greatly boost our junction efficiency. If we want this program to be fully implemented we will need your approval and funding. Please Comrade Sedov, it would benefit both our civilian and military transport.”\n\nSedov hesitated in his response. A deal like this sounded as if it would be beneficial in the long term despite the expense, yet making a deal behind Serebryakov’s back would undoubtably lead to factionalism, which was something he most certainly did not need more of."
 KRS_pillars.10.a: "“Your logic is sound, Comrade Dombrovsky. You have my official approval.”"
 KRS_pillars.10.b: "”I wish I could help Comrade, but our budget is really stretched thin. I hope you understand.”"

 KRS_pillars.11.t: "A Saturday Drive"
 KRS_pillars.11.d: "A car turned the corner and arrived in front of Sedov and his entourage of security personnel. The driver emerged from the car, and opened the back passenger door, allowing a jubilant Serebryakov to exit and spread his arms wide, “Comrade Premier Sedov!” The two men embraced before Serebryakov gestured to the car, “I have much to discuss with you, shall we proceed?”\n\nThe car ride itself was rather unpleasant, aside from the occasional productive chat with Serebryakov, the ride was filled with frequent bumps and potholes, which only grew as they exited the city and entered the rural roads. Sedov attempted to take a sip of water from a bottle before having the water splash in his face as the car jolted forward.\n\nSerebryakov noticed this mis-hap immediately and offered Sedov a napkin, “Unfortunately, this state's infrastructure is something that needs dire investment. These are roads that are built for tractors, and even then we have received complaints from farmers about the potholes and rocks in the road. These roads were actually quite satisfactory before the war, yet it appears that bombings, tank tracks, and craters have a negative effect on roads.”\n\nSedov wiped his face off and snickered at Serebryakov’s sarcasm, “Yes I see, well I see no reason as to why these roads shouldn’t receive at least some level of state sup-“ Sedov stopped himself.\n\nYes these roads did need state support, yet these were probably not the best times for it given the precious needs of everyone else. He knew about Serebryakov’s connections, giving him and his department funding could stress the already precarious party circumstances and economy.\n\n”Is something the matter, comrade Sedov?” Sedov turned back to Serebryakov who had a concerned look, “Have you made your decision?” Sedov looked back out the window and formulated his words carefully."
 KRS_pillars.11.a: "“Yes Serebryakov, you can expect your funding to come soon. Preobrazhensky will be notified.”"
 KRS_pillars.11.b: "”Apologies my friend, but my hands are tied”"

