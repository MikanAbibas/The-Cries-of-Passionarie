 #######################
 # 5.1 - GENERAL DESCS #
 #######################
 #MILITARY_NIKOLAI_ANDREEV_DESC: "§LBorn 1905 in Moscow, Nikolai Trofimovich Andreev worked as a messenger, blacksmith's apprentice and printer before finally joining the Red Army in 1935, becoming an infantry commander in the 93rd Rifle Division and then military commissar of the Taishet district in the Irkutsk region in 1938. Originally eager to go to the front when Germany invaded the Soviet Union, Andreev was instead sent east to take officer courses. Yet as the Soviet Union began to collapse under the German onslaught and the Politburo evacuated east, he instead made every effort to delay being sent to fight and with a clique of fellow officer school graduates solidified power in the city of Krasnoyarsk. Initially treated with suspicion by the Central Siberian Republic, Andreev's clique was broken apart and scattered across various assignments, with Andreev himself placed under the command of Nikolay Krylov. Capable however of seeing the writing on the wall during the Siberian War, Andreev reassembled his clique in their old base of power and mutinied against Krylov, putting an end to the Central Siberian Republic."
 #MILITARY_ALEXEY_PESTEREV_DESC: "§LBorn 1910 in Buryatia, Alexey Ivanovich Pesterev worked as a collective farmer and builder, joining the Communist Party in 1939 before being drafted into the Red Army in 1941. Serving as a political commissar in the 209th Infantry Division, Pesterev rose rapidly to become Acting Commander of the 932th Infantry Regiment through both personal merit and the sheer rate of attrition suffered in the face of the German onslaught through the Soviet Union. Evacuating what little remained of his regiment across the Urals under heavy fire, Pesterev was placed under the command of Nikolai Andreev who, impressed by Pesterev's resolve, quickly inducted him into his own clique. Assigned a key role in the mutiny against Nikolay Krylov, Pesterev secured crossings across the Yenisei River, stranding several of Krylov's regiments on the west bank and ensuring their destruction at the hands of the Siberian Black Army.§!"
 #MILITARY_NIKOLAI_LYASHCHENKO_DESC: "§LBorn in Irkutsk in 1910, Nikolai Grigoryevich Lyaschenko spent his early life in Kyrgyzstan becoming a groom and blacksmith before joining the local trade union committee and then volunteering for the Red Army in 1929. Serving in the Sino-Soviet conflict with distinction, he was sent to the Central Asian Military School and graduated in 1932, serving as an infantry commander in the 73rd Infantry Division. Awarded the Order of the Red Star for merit in 1936, Lyaschenko served in the Spanish Civil War as a military advisor and returned with the Order of the Red Banner, immediately being sent for further study upon his return. An early member of the graduate clique of Nikolai Andreev during the Soviet collapse, Lyaschenko was sent to Novosibirsk as part of the Central Siberian Republic's effort to break apart the clique, serving with characteristic valor in the Siberian War. It was to be short lived however, returning to Krasnoyarsk following Alexander Pokryshkin's betrayal of the Republic, only to end up betraying the Republic himself.§!"
 #MILITARY_ALEKSANDRA_SAMUSENKO_DESC: "§LBorn in 1922 and rumored to have served in the Spanish Civil War in her teens, Aleksandra Grigoryevna Samusenko joined the Red Army in 1935. Originally serving in an infantry platoon, she served first in the Russo-Finnish 'Winter War' before graduating from the tank academy and joining the 1st Guards Tank Army as their only female tanker. Highly decorated for bravery and a recipient of the Order of the Red Star, Samusenko led the battered remnants of the 97th Tank Brigade of the Guard over the Urals following Operation Barbarossa and joined her Brigade to the Central Siberian Republic. Placed under the command of Nikolay Krylov, the destruction of the tank corps of the Grand Army of the Republic in the Siberian War pushed Samusenko into joining Nikolai Andreev in his mutiny against Krylov, the final nail in the Republic's coffin.§!"

 ############
 # 6 - FOCI #
 ############

 ### 6.1 - INTRO FOCI ###
 KRS_memories_of_the_father: "Memories of the Father"
 KRS_memories_of_the_father_desc: "It is necessary to look back and remember our old leader, Leon Trotsky, the guiding hand and founder of our glorious movement. Everything our state is based on has lept from his mind. Though he left this world nearly a decade ago, his face still stands proud on posters and flags. Most importantly, his son, our glorious chairman, remembers as well."
 KRS_remember_the_past: "Remember the Past"
 KRS_remember_the_past_desc: "The early days of the Soviet Union were a wonderful era. A time of hopes and dreams, during which many revolutionary ideas appeared. At the same time, Leon Trotsky began his activity. Even if in the end it resulted in the deformation of the working state and the collapse of Russia, we should not forget about this era. After all, there is no future without the past."
 KRS_reflect_on_the_present: "Reflect on the Present"
 KRS_reflect_on_the_present_desc: "And where are we now? A snow-covered wasteland in the middle of which there are several divided cities. Russia is destroyed, but life goes on. Maybe the situation seems hopeless, but life goes on. Maybe someday this will change."
 KRS_look_to_the_future: "Look to the Future"
 KRS_look_to_the_future_desc: "The future looks hazy. But while we are fighting, while our hearts are beating, the idea of a free and honest Russia will not die! And if we can achieve our goal, the whole world will see the willpower of the proletariat and the dreams of a world revolution will become even closer to reality!" 

 ### 6.2 - PRE-SMUTA FOCI ###
 KRS_the_legacy_of_trotskyism: "The Legacy of Trotskyism"
 KRS_the_legacy_of_trotskyism_desc: "It is necessary to look back and remember our old leader, Leon Trotsky, the guiding hand and founder of our glorious movement. Everything our state is based on his ideals and teachings. However, we are not alone in the Siberian woods.\n\nKrasnoyarsk is an enclave, being surrounded by the likes of Corporatist-Capitalists in Novosibirsk and the mad king’s court in Kemerovo, the bandits who live in Kansk and the remnants of the Central Siberian Republic in Tomsk, armed, against us and our ideals for the Siberian worker.\n\nThe future of the revolution seems bleak, yet, we will not back down from this challenge. We will show the world that we will survive and spread Trotsky’s dream across the Siberian Plains and later, the whole of Russia!"
 KRS_vanguard_of_the_revolution: "Vanguard of the Revolution"
 KRS_vanguard_of_the_revolution_desc: "Premier Lev Sedov has lived a hard life, from seeing his father's work destroyed by false revolutionaries and seeing his motherland decimated in the War of 1941.\n\nHowever, he has not let that stop him, as he stands as the vanguard of Trotsky's ideas, infused with Lenin and Marx's teachings. Continuing in their footsteps, unlike the false revolutionaries who reside in Tyumen and Irkutsk.\n\nTrotsky and his ideals, with Lenin’s vision, led to the Union’s formation and victory in 1922. His military cunning formed the Red Army, which served with distinction and sacrifice during the War, his policies half-implemented led the working class to greater heights and greater prosperity.\n\nLev Sedov will continue his father’s legacy, following the philosophies of the Revolution, and pushing them forward into this uncertain age. For the vanguard does not falter."
 KRS_in_his_name: "In His Name"
 KRS_in_his_name_desc: "The line of Bolshevik succession from the very start was plain and simple; Lenin’s successor would be Trotsky. Afterall, how could the Red Prince of the Revolution not be the destined successor of Lenin in his quest for international communism.\n\nHowever, due to counter-revolutionary cells and corrupt deals, Nikolai Bukharin managed to blind Lenin with his masked reactionary thoughts, securing the premiership and banishing Trotsky from his rightful place, before Bukharin's faliure, ensuring the decades of disaster that would plague the Union and its people.\n\nIt is now our duty to bring about the rise of Trotsky's ideas, to restore the idea of the permanent revolution for all of the oppressed peoples to participate in. Lev Sedov, Trotsky's protege, will usher in this new age with himself at the mantle of the new revolution.\n\nIn our revolutionary quest, the enslaved victims of capitalism and fascism shall be freed, the Motherland will be reunited once again under the red banner, and history will be faithfully rectified once and for all."
 KRS_denounce_the_false_revolutionaries: "Denounce the False Revolutionaries"
 KRS_denounce_the_false_revolutionaries_desc: "It is time we address an important question. The False Revolutionaries who still influence our socialist thinking and creating schism in a united revolutionary thought.\n\nBukharin’s thinking, flawed in implementation, yet he was the reason why the Union recovered from the struggle in the reconstruction years. However, he must shoulder some blame for the mismanagement of the war in its early years." 
 KRS_stalin_sins: "Against Revisionism"
 KRS_stalin_sins_desc: "Nikolai Bukharin. The biggest false revolutionary of them all.\n\nHe rubbed shoulders with the other Old Bolsheviks during the Civil War. Hailed as a hero, and was part of the 3 potential successors to succeed Lenin. How foolish had we been.\n\nhe gave into capitalist excess and led us to disaster. And yet the revisionist offer no better alternative. They are tyrants and traitors; who offer no succor for the workers of the Union."
 KRS_show_mercy_to_bukharinists: "Show Mercy to Bukharinists"
 KRS_show_mercy_to_bukharinists_desc: "Nikolai Bukharin remains a name vilified by many of the Presidium and our delegates. Yet we must realise, Bukharin’s policies have benefitted us more than we’d like to think.\n\nHis Siberian Plan has provided places such as Krasnoyarsk an opportunity to grow and develop industrially before its tragic demise. Additionally, despite all his flaws and the mismanagement, he managed to ensure our citizens had a better quality of life than under the Tsar and his siloviki.\n\nWe should give mercy to them, they were blinded by ambition and their goals. This is the only way to heal the fracture amongst like-minded revolutionaries and restore our Union on the global stage."
 KRS_the_party_of_the_people: "The Party of the People"
 KRS_the_party_of_the_people_desc: "We have always been the party of the people.\n\nIn all things in our state, aspects of life and our socialist society lie with the party. The party which has provided the people with security, provided them with the ability to grow on land where violence and chaos has plagued it for years.\n\nThe party has aimed to give every citizen a roof over their head, food and water, proper social services, education, and gainful employment. In return, the people assist us in our day to day activities and play a part in our society, by providing to our state.\n\nWithout the party we would be nothing, descending back into madness and anarchy. Without the people, we would be another prey for the fascists and capitalists of the world. We have made this mistake once, and we will never allow them to take advantage of it ever again.\n\nTruly, for the people, by the people."
 KRS_the_issue_of_militias: "The Issue of Militias"
 KRS_the_issue_of_militias_desc: "As the whole of Russia collapsed into anarchy, and the civilian government in Krasnoyarsk reorganized amidst the last days of the Central Siberian War, the military abandoned arms depots and military bases, leaving the citizens with their valuable weapons.\n\nThese allowed the formation of volunteer militia units, who armed themselves with such weapons to defend against the bandits and roaming gangs that dared loot and pillage in the Siberian Wastes.\n\nLately however, the situation has stabilized and our army has been established, protecting our borders. Yet the militias remain, rivaling our army’s dominance of power in our fledgling workers’ state as well as questioning our right to rule. This raises the question... how should we solve this problem?"
 KRS_an_olive_branch: "An Olive Branch"
 KRS_an_olive_branch_desc: "These militias have served the people well, regardless of their ideological standing. These men have been essential to our society and army, especially since the Anarchy years, protecting our current lands whilst we reorganized our army.\n\nWilling militia units have offered to join, train and give up their arms for our soldiers, giving our men valuable experience. Additionally, they assist policing and governance, helping fill in the deficiencies in our administrative systems.\n\nThey have proven their worth thus far. We shall allow them to keep their rights to exist temporarily, before integration at a later date."
 KRS_reform_the_red_army: "Reform the Red Army"
 KRS_reform_the_red_army_desc: "Our Army in Krasnoyarsk is woefully underequipped.\n\nSome units are at half strength, others armed with rifles older than their fathers, a few have only shovels. Our situation is gravely problematic However, the situation is not as bleak as we thought.\n\nSome like-minded militias, recently granted their legal status and benefits, have decided to turn in surplus equipment and inform us about abandoned caches and military bases, left in the vast plains.\n\nOur industry, which has survived the chaos and destruction, has been restarted, with workers producing new military equipment for our brave soldiers. New equipment has started to slowly trickle in."
 KRS_no_compromises: "No Compromises!"
 KRS_no_compromises_desc: "If we wish to maintain the strength, independence, and fortitude of our Red Army, we cannot stray off of the path of Trotskyism whatsoever. Not an inch must be ceded to the opposition if we wish to achieve total military autonomy and strength.\n\nIf we adapt these counter-revolutionary reforms to our military and militias, the consequences will haunt us for years to come, it will be an echo of the catastrophe our forces suffered in the first Great Patriotic War.\n\nNo, we will stick with the objectively correct path, the way of Trotsky. Sedov will ensure it will not be tarnished in any way shape or form. It is paramount that we forbid any vast reform to our military administration unless strictly necessary, to secure our commune’s defense and offensive capabilities."
 KRS_stay_true_to_our_ideas: "Stay True To Our Ideals!"
 KRS_stay_true_to_our_ideas_desc: "These military reforms proposed by some members of the Presidium are absurd, inefficient, and in some cases even counter-revolutionary against our ideals.\n\nThe militias have been a problematic spot, even if a majority have decided to work with us.\n\nMore importantly, we must not stray off of the values of the Red Army that Trotsky intended for us to follow. Let us not forget the way he valiantly led his troops in his steel train, bringing freedom, socialism, and liberty along with him as he vanquished the Tsarist forces all the way back to the pacific.\n\nLev Sedov will maintain the orthodox doctrine of the Red Army and Red Guard militias, guaranteeing the commune’s national security and further building the foundations for the imminent permanent revolution.\n\nWe will stay true to our vision."
 KRS_the_most_important_day: "The Most Important Day..."
 KRS_the_most_important_day_desc: "The future is here.\n\nA bastion of Trotskyism, standing in Central Siberia. Stronger than ever.\n\nOur reforms to organize an effective Red Army, a working political system based on the ideas of Karl Marx and Leon Trotsky, establishment of a peasants' democracy, and a collectivized economy, have paid off.\n\nOur working class no longer needs to worry about slave-like working hours and wages, and the average Farmer does not need to worry about their daily bread or starve the nation. This is a great achievement.\n\nHowever, spring is arriving. Rumours have spread of the other warlords planning to attack each other. Many are scared and worried for war and grief to spread across the plains once more.\n\nYet, the Red Army stands to defend ourselves, our workers supporting them in the industries, our farmers growing crops to feed our populace.\n\nTrotsky's flame ignites their hearts anew, liberation dawns. Destiny's blessing has begun."
 KRS_the_moderate_bourgeoisie_question: "The Moderate Bourgeoisie Question"
 KRS_the_moderate_bourgeoisie_question_desc: "One of the core principles of the original testaments of Lenin was the complete and utter elimination of the upper class elites, the main proponents of capitalist oppression and tyrannical murder. So far, we have been successful in our endeavors, with these influences being rooted out wherever our red banner flew, yet now we face a new dilemma pertaining to these edicts.\n\nThroughout the past decade, the economic and social anarchy which has plagued the motherland has led to a new class of ‘moderate bourgeoisie’ to arise, mainly stemming from neo-kulaks and ambitious factory heads. Our principles prioritize the eradication of these proponents of inequality, yet an elimination on this level would remove much of the intelligentsia that resides within the commune, as well as loyal Union supporters.\n\nThe Presidium shall decide on this, with careful consideration."
 KRS_exile_the_hardliners: "Exile the Hardliners!"
 KRS_exile_the_hardliners_desc: "As we dive deeper into the ideological loyalties of the Russian people, we find something sinister that has risen in the Anarchy.\n\nSocieties run by Monarchists, Fascists and Nazis, who hide from the shadows, plotting their coup against us. Believing in the same ideology that enslaved and destroyed the foundations of our nation, they pose the biggest threat to us than the ideological differences between fellow socialists.\n\nWe will thus begin to crack down on them, and exile them from our worker’s state. The intelligence service will find them out and send them to meet their justice. These hardliners and reactionaries have no place in our society, and they will be stamped out.\n\nThese monarchists and fascists, will be sent to labor camps or thrown into the Siberian wastes, where they will serve the workers state by redemption or feed the wolves."
 KRS_form_a_bolshevik_democracy: "Form a Bolshevik Democracy"
 KRS_form_a_bolshevik_democracy_desc: "Throughout our campaigns of revolutionary activity and anti-fascist action, we have always done our best to cradle and keep paramount the ideals of democracy. Unfortunately, time and time again, reactionary elements have infiltrated the ballot boxes ever since the first election in 1918. From this, and the numerous sham democracies plastered across the west, we have developed a new method of democracy, one that would preserve the people's freedom in national decision making as well as keep out the decadence of capitalism and totalitarianism.\n\nBolshevik Democracy, known by others as Soviet Democracy, is the practice of fully democratic elections under the supervision and protection of the communist state, a policy that we shall take to heart alongside Trotskyism. Besides, how can we have a fully sustainable revolution without the will of the people?\n\nThis method of safe-guarded democracy is, on paper, meant to be only temporary, a provisional system meant for the inevitable transition towards a fully free and unrestrained socialist democracy. It is our duty to ensure that this bright future will be secured for our future generations and society as a whole."
 KRS_our_path_finally_secured: "Our Path Finally Secured"
 KRS_our_path_finally_secured_desc: "We have come a long way on our path here in this small enclave. Our recent reforms with our Army, the reshaping of the political landscape and mending the schisms in the party have finally borne fruit.\n\nOur workers, who didn’t have a voice in the factories, now can form worker’s councils and have a direct line for change and reform. Our farmers, who toiled to harvest grain, can rest easy knowing they can seek help from us should crops fail or machines break.\n\nThey will never have to suffer needlessly again to serve the people.\n\nOur Soldiers, now ready and armed, will protect the nation, and liberate the oppressed workers across the shattered Russian landscape and, eventually to our currently occupied lands under the Nazi jackboot, bringing the Revolution with them.\n\nWe have secured our path in Krasnoyarsk today. Tomorrow, we will secure it in Siberia, and later, we will secure it in Moscow, Minsk, Kiev and Smolensk."
 KRS_crush_the_reactionaries: "Crush the Reactionaries!"
 KRS_crush_the_reactionaries_desc: "Reactionaries are a dangerous threat to us, much more dangerous than the enemies that surround us.\n\nThey hide in plain sight, which makes it the most difficult. Most of them challenge us to maintain a status-quo, where we, the workers, are still oppressed and subjugated by the vile capitalists, working for their profit, rather than ours\n\nOthers are more extreme, asking for the return of a monarch and the right to absolute authority, or looking for a system similar to the fascists.\n\nThese people are not tolerated in our society, and it is our duty to stomp them out and erase their vile, oppressive and hateful speech from our society."
 KRS_the_foundations_of_the_red_army: "The Foundations of the Red Army"
 KRS_the_foundations_of_the_red_army_desc: "The Red Army was once united, bringing down the corrupted regime of Alexander Kerensky, during the October Revolution. Led by Leon Trotsky, it became a strong force to be reckoned with in the East.\n\nIt would be mutilated by the political backstabbing in the party and shattered beyond recognition during the war. The Red Army split into various warlords, with many having no interest in defending the people.\n\nOur Army in Krasnoyarsk may claim to be a legitimate successor to the Red Army, yet it is made up with eager volunteers and desperadoes, armed with weapons older than them.\n\nThere is no motivation for our soldiers to fight, whilst our officers do not have initiative to learn nor innovate new tactics. There is a shortage of men willing to serve our state and no set goal for our Red Army.\n\nIt seems, we need to lay the foundations of the Red Army once more."
 KRS_employ_an_offensive_doctrine: "Employ an Offensive Doctrine"
 KRS_employ_an_offensive_doctrine_desc: "Now that we have rebuilt the foundations of the Red Army, we must choose a doctrine for the coming conflict.\n\nDespite some calls from the generals to focus on defense, Premier Sedov and Alexeyev have decided that an offensive doctrine would benefit us in the long run. From our bases in Krasnoyarsk, we will strike using speed and shock to our advantage, overrunning our enemies before they have time to react.\n\nAfter all, the best defense is a good offense."
 KRS_start_the_draft: "Start the Draft"
 KRS_start_the_draft_desc: "If we are ever to overwhelm and surpass the military might of our hostile neighbors, we must ratify and implement conscription. This is a necessity, for our Red Army is no match in size for some of the armies of Siberia.\n\nTo solve this problem, Deputy Commissar Alexeyev has drawn up plans for a reserve force of conscripts. This will fill the ranks of the Red Army.\n\nThis will allow us to implement a broad use of conscription, which will be implemented and relaxed according to the needs of the nation. This will definitely strengthen our ranks as we prepare for a possible war with our neighbors.\n\nHowever, we must not get carried away with conscripting everyone. Conscripted personnel means fewer workers in the factories and fewer farm hands in the fields, which could negatively affect our nation in a time of war."
 KRS_fight_for_the_revolution: "Fight for The Revolution!"
 KRS_fight_for_the_revolution_desc: "The Predecessors of the Red Army proved themselves when they overthrew the regime of Alexander Kerensky, storming the Winter Palace and driving the foreigners out of our motherland.\n\nOur late leader Leon Trotsky organized the Red Army of Workers and Peasants into one of the best fighting forces in the Eastern sphere of the globe, fighting for the people enslaved by the capitalists, breaking their chains and setting them free.\n\nFrom then on, the Red Army fought for everything and everyone. For their homes, their families, their comrades, for the motherland. It is no different today. The principles of the Red Army are simple: to defend our workers and to liberate the enslaved workers in our vast motherland.\n\nWe are fighting for everything, for our right to survive."
 KRS_the_military_science_committee: "The Military Science Committee"
 KRS_the_military_science_committee_desc: "The military and the field of science have long been intertwined. Science has allowed the innovation of new equipment, tactics and discoveries which assist the army in reforming and revitalising itself to go toe-to-toe with its enemies.\n\nIn Krasnoyarsk, this is no different. Many technical experts have offered their services to the army on an ad-hoc basis, innovating on weapons design and newer methods to improve equipment reliability. The army has long petitioned to recognise their work, whilst assisting the technical experts by offering desperately needed funds for their scientific projects.\n\nWe shall formalise this process by establishing the Military Science Committee, allowing our officers and technical experts to work jointly, reducing the time wasted for technical experts to approach our army for innovative solutions."
 KRS_subsidize_war_industries: "Subsidize War Industries"
 KRS_subsidize_war_industries_desc: "As we begin to plan for the liberation of our region, we will need to begin the production of much needed weapons, but we will not be able to produce enough if we do not subsidize the loss of civilian production for weapons and ammunition.\n\nSo far, our economic plans have focused primarily on our civilian industries, allowing for the growth of our economy and a better standard of living for our citizens, but due to the dangerous situation, we must divert production to weapons and uniforms, subsidizing the military industries.\n\nIt may hurt economic growth in the short term, but it will be necessary for our continued survival and eventual pursuit of the reunification of our nation before funding the Permanent Revolution globally."
 KRS_modernize_our_troops: "Modernize Our Troops"
 KRS_modernize_our_troops_desc: "Historically, the army with the technological advantage has always won the battles.\n\nEven today, this rings true, without better weapons and equipment, we would be easily be swept away the other enemies that surround us, letting them seize the opportunity to return our Motherland to their reactionary and degenerate ideals.\n\nWe must quickly redouble our efforts to modernize our troops, replacing bolt actions rifles with automatic rifles, and replacing old uniforms with newer ones. This way, our troops will stand a chance against the enemies of the Permanent Revolution."
 KRS_gather_old_military_plans: "Gather Old Military Plans"
 KRS_gather_old_military_plans_desc: "Recently, in a repurposed military base, our soldiers found important documents stamped with old STAVKA emblems. These documents were passed up the chain of command and are now on the desks of our generals.\n\nIn them are the war plans of the Western Russian War and of the Great Patriotic War. Although they are not fully applicable to us, it seems that our general staff can learn from their plans and tactics and implement them in our strategy for prosecuting the next war.\n\nBy learning from them, new plans can be drawn up and used in various scenarios that apply to us. This would give us an advantage that could be used against our enemies, as well as a much needed lesson for our generals who have not had the opportunity to learn from their predecessors."
 KRS_a_red_sky: "A Red Sky"
 KRS_a_red_sky_desc: "With our crushing defeat in the Great Patriotic War and the failure of the West Russian Offensive, we have learnt much from our foes.\n\nOne of these lessons was the importance of having a capable air force. A well equipped, well trained and modern air force that can contest air superiority, that can support our attacking troops and protect our skies have a combat advantage, potentially changing the tide of battle and a conflict as a whole.\n\nThat said, our surveyors have found an abandoned air base that was formerly used for the maintenance of the Central Siberian Air Force. Hopefully, we can repurpose the facility and re-establish the Soviet Air Force, giving us an advantage against our nearest enemies and potentially contest the Falcon’s domain."
 KRS_a_red_land: "A Red Land"
 KRS_a_red_land_desc: "Motorization has been always a priority for the Red Army, ever since we produced our own domestically built trucks. Starting in the first decade after the civil war, we built motorised units of our own.\n\nDespite our defeat against the Germans in West Russia, we learnt more than ever before. Motorised Divisions, well armed and equipped, allowed ourselves the speed and power necessary to break through the lines of fascist defenses, liberating vast swathes of occupied territory.\n\nWe shall do the same here and now, building our own motorised divisions to overrun our enemies and destroy them before they have a chance to organise an attack. Speed and Power saves lives."
 KRS_expand_industrial_capacity: "Expand Industrial Capacity"
 KRS_expand_industrial_capacity_desc: "The Siberian Plan envisioned by Premier Bukharin was intended to make Siberia an industrious location, in the heart of the motherland, bringing new economic and employment opportunities in the plains.\n\nNow, the industries lay idle, the economies of Siberia stagnating or hardly prosperous, with states having to raid others to survive the wastes. Machinery has been left rusted, derelict or broken down for scrap.\n\nIn light of the situation, the Party has already declared that it has planned to revitalise the industries and the economy through economic planning and investment, and hopefully expand the industrial capacity of our nation."
 KRS_preobrazhensky_economic_plan: "Preobrazhensky's Economic Plan"
 KRS_preobrazhensky_economic_plan_desc: "Although Sedov's plan is the proper path of Socialism, we must be wary of public opinion and the instability inflicted upon us by our neighbors. We will therefore begin to dial back on our war communist policies. The military will still be formidable and well-funded, but we will need to make way for monetary funds to reach our civilian economy instead of being thrown into a cesspit of unneeded spending.\n\nAlong with this, Lev Sedov has announced two things:\nFirst, the Formation of the State Planning Committee, or the Gosplan. This agency will oversee our economic statistics, and prepare economic plans and advise for the Permanent Revolution.\n\nSecondly, he has announced the start of the Five-Year Plan. This will see us abolishing our slug-like pace of nationalizing and centralizing the economy, and instead allowing for the NKVD, under Alexander Beloborodov, to begin enforcing these policies.\nThe Five-year Plan will also see the collectivization of all farming settlements in Russia, however not as rapidly as the nationalization of our Industries. This will assure that our peasants and farmers will have enough time to prepare and get themselves suited for living together.\nWe will also establish the Tolkach, which will cooperate with our Trade Unions to force the People's Commissars of State Industries to meet their quotas and standards, or else face removal.\nWe will thus formally switch over to a planned economy, where the state will be able to intervene at any moment should inflation rise, or the economy fall."
 KRS_nikolaevschina: "Nikolaevschina"
 KRS_nikolaevschina_desc: "An alternative proposal has been proposed by another cadre. Nikolay Nikolayevich Inozemtsev, in his proposal to the Presidium, has asked for reforms to the planned economy, with lesser state intervention and more independent market reform to allow for the recovery of the shattered economy, whilst maintaining more benefits for the workers through state intervention and establishment of worker’s brigades.\n\nIt has sounded good to the members of the party who have long proposed changes to the economy, to allow our workers a better quality of life and employment without big state intervention. However, they have noted that too many of his reforms may throw us over to become false revolutionaries.\n\nLooking past this, Inozemtsev has been an established revolutionary, serving in the Red Army during the Great Patriotic War, however he has little to no experience in economics unlike Preobrazhensky and his aides, and we are unsure if these reforms may help us. However, we must try, if it helps us escape this quagmire we are in."
 KRS_collectivize_farms: "Collectivize Farms"
 KRS_collectivize_farms_desc: "As told by Marx, practiced by Lenin, and partially maintained by Bukharin, the economic strategy of state collectivization of national goods remains core to the principles of Trotskyism and communism in general. Comrade Sedov has not forgotten this priority, as shown by his recent propositions to the presidium, detailing a series of new collectivization efforts pertaining to the whole of the commune. This move, one showing rare support from both wings of the party, has been presented as another swift action against neo-kulaks and the bourgeois, yet there remain concerns.\n\nThe largest concern is the worry of food security, an issue made increasingly drastic by the Siberian collapse, which has led to the sharpest decline in agricultural outputs ever seen since the civil war. This concern is made even more apparent due to this year’s collectivization drive focusing on farms, with thousands of farmers set to be directly affected by these plans.\n\nWe must make sure that our future economic development plans maintain economic equality whilst keeping the commune away from famine."
 KRS_entact_the_welfare_programme: "Enact the Welfare Program"
 KRS_entact_the_welfare_programme_desc: "So far, the welfare program has been experimented on, reports have come in of more families who have been able to rise from poverty as a result of the welfare program.\n\nAfter all, a better quality of life has always been a priority of ours, and workers who have healthy families that are well fed work harder in the factories.\n\nHowever, we have noticed that there have been some downsides, with some workers choosing to use their welfare benefits on other unsavoury products, such as alcohol, or using their newly received money to gamble and misusing such handouts.\n\nWe shall have to reform the programme, handing out coupons and rations instead of giving straight handouts, allowing families to afford common products."
 KRS_distribute_goods: "Distribute Goods"
 KRS_distribute_goods_desc: "These economic plans, albeit having hurt some parts of our economy in the short run, has been a huge success! We can see our political enemies and Anti-Revolutionaries working in localized farming collectives, cut off from our mentally healthy farmers and workers. Due to our vast investments into the agricultural industry and collectivization being gradual to allow stockpiling of food, the process has been surprisingly swift and successful, with these collectives not only increasing our production in general but also our reforms have generated both popularity and a surplus of money, which will be given back to our workers.\n\nThe Gosplan is beginning to hand out large sums of "Social-Labour Pension" amongst our loyal farmers and workers, this has not only increased our popularity further, but it has also allowed for poverty to severely plummet throughout the population! Along with this, the surpluses of our food production and products such as cars, and even apartments, will be given to our working class, this will only further legitimize us as the only true successor of Karl Marx!\n\nAs a last gift from our generous Worker's State, we will begin giving out the remaining surplus to the unemployed and to jobs that don't include labor. We will also begin to construct apartment complexes for our impoverished people to live in. Lastly, the absolute leftovers may be given to these Bukharainists, Monarchists, and other traitors of the Worker State, if they can prove themselves to have abandoned the ideas of degenerates. they may be spared from these Gulags."
 KRS_reestablish_the_nep: "Re-establish the NEP"
 KRS_reestablish_the_nep_desc: "So far, Inozemtsev’s policies have bore us much fruit.\n\nBy reducing the extensive state intervention in the economy, the people have greater economic freedoms to establish themselves in society. Additionally, through the establishment of the Welfare Programmes, many of our citizens have been able to climb out of poverty.\n\nHowever, we have a big opposition towards his last policy, Re-establishing the New Economic Policy. Used by our late Premier Lenin to transition the shattered economy of our new Union. Trotsky did endorse it, believing the state should repossess all output to invest in capital formation and the transition to collective farming for our agriculture.\n\nNow, Inozemtsev and independent cadres have proposed re-establishing the NEP, to rebuild the shattered economy and allow our people to have a greater quality of life. Many in the party feel strongly against the policy, however it is up to the Presidium to decide."
 KRS_a_crimson_renaissance: "A Crimson Renaissance"
 KRS_a_crimson_renaissance_desc: "With our reforms in full swing, many have been worried about the results of rapid nationalization and our gradual collectivization, saying that we have either done too much or too little on these topics. We have, however, proved these Anti-Revolutionaries wrong.\n\nWe have never seen this much success before, the nationalization of the industries has allowed us to directly administer their quotas, standards, and size of investments. This has allowed us to keep up with the statistics of another reform, the Central Planning Committee or Gosplan, which has collaborated with the NKVD to provide us with accurate statistics. Our program of Workers' welfare and Social Pensions have been very popular amongst our working population. We have also distributed apartment complexes, and surpluses of our food and other goods for free or very little charge, thus evaporating widespread poverty!\n\nThe NKVD has also proved to be very helpful, in regard to finding saboteurs and Anti-Revolutionaries and sending them to Gulag Collectives. Collectivization has also been a great reform, especially with it being gradual. We have wiped out all isolated Obschina's and replaced them with State-Run farming communities-collectives. This has further allowed the Gosplan to better organize population censuses, production statistics, and subsequent economic growth. Our farms produce bread for the population, the population works in the factories, and the workers construct homes for the farmers and population. This is what Karl Marx and Leon Trotsky envisioned.\n\nWith the end of the Five Year Plan plan comes great success for our Worker's State, but this, as sadly predicted by the Gosplan, will not be enough to revive our economy in the long run. It should not be underestimated, it has brought great prosperity to our nation. But we need a more permanent solution for a permanent revolution."
 KRS_the_beginning_of_the_permanent_revolution: "The Beginning of the Permanent Revolution"
 KRS_the_beginning_of_the_permanent_revolution_desc: "After many months of rigorous reform of our economic policy, revitalization of our industrial capacity, and handling of the political front, the Presidium believes that we are ready to take on our enemies throughout the region.\n\nThus, we will begin our preparations for the unification of Central Siberia.\n\nTo begin with, we will have to concentrate on the warlords on our borders. We will begin to mobilize the Red Army and her reservists, drawing up plans to attack and conquer the surrounding states without much bloodshed, while temporarily reducing civilian production for the war industries in order to produce equipment for our soldiers.\n\nFinally, we will make a radio broadcast to our old comrades, our veterans of the Great Patriotic War and the oppressed workers of Central Siberia, to join the revolutionary struggle and liberate themselves.\n\nWe will ask them to serve the Union in her most crucial hour!  With our reformed armed forces, superior technology and, finally, our stronger will, they will not stand a chance.\n\nThe Permanent Revolution has begun!"

 ### 6.3 - SMUTA FOCI ###
 KRS_lev_sedov_bizarre_adventures: "Lev Sedov's Bizzare Adventures"
 KRS_lev_sedov_bizarre_adventures_desc: "Not long ago, it looked like Lev Sedov and the Trotskyists were just another tyrannical bunch living in the anarchy of Russia, spreading their dangerous ideas to the people of Siberia.\n\nNothing could have been further from the truth. Throughout his life, Sedov ventured around the world, from Europe to Asia Minor itself, spreading revolution. In the darkest days of the Soviet Union, he would quietly return and enter Yagoda's Republic before heading to Siberia. There he would begin to form the principles of a commune guided by his father's ideals.\n\nEventually, Sedov's hard work would pay off. When the Soviet Union collapsed, he would take advantage of it by contacting the remnants of the old Bolsheviks who had fled to Krasnoyarsk and forming the workers' state his father had always envisioned.\n\nWe have all come a long way since then, establishing our utopian democracy and a functioning state. But what would all this be for if we did not continue to spread our ideas and restore our Union to the workers' state it was.\n\nLev Sedov has witnessed many tragedies, personal conflicts and defeats, but this is a new adventure. An adventure that will see him realize his father's dreams, and possibly a better life for the people of Russia."
 KRS_prioritize_the_military: "Prioritize the Military"
 KRS_prioritize_the_military_desc: "In times of war, sacrifices are made every day.\n\nFrom the soldier in the field who dies for his nation, to the new conscript who sacrifices his civilian life to bear the burdens of being a soldier, to their families who see them off to war.\n\nThese men are defending the ideals of socialism! We must ensure that they receive the support and supplies they need to win this conflict and prevent the history of defeat from repeating itself.\n\nThis means diverting factory production from butter and bread to weapons and equipment. It also means prioritizing military supplies over civilian supplies. It is a measure we must take, albeit temporarily, if we are to prevail against our enemies."
 KRS_a_call_to_arms: "A Call to Arms"
 KRS_a_call_to_arms_desc: "When the October Revolution began, when our soldiers and sailors rose up to fight Kolchak and his cronies, the workers united in lockstep to overthrow the unpopular government and began to build our union by occupying vital junctions and donating to the military.\n\nThis civilian effort to strengthen their comrades in arms must be emulated, with volunteers and willing workers who will supply and assist the Red Army in its conquest of Siberia. Working together, we will be able to restore our Union, just like 1917.\n\nHence, we will announce a call to arms, with donations from workers to fund the Red Army and the collection of supplies and scrap metal to aid in the production of munitions.\n\nWith the help of civilians, the Red Army shall stand victorious!"
 KRS_the_homefront: "The Homefront"
 KRS_the_homefront_desc: "In warfare, there is a front that takes more precedence than any military plan, operation or action. Yet it is not on general orders, nor on maps. This front is known as the Homefront.\n\nThe Homefront is the most important aspect of any war. Failure to allocate proper resources here could be disastrous, and potentially bring about the end of our state, similar to the February and October Revolution that befell on the Tsarists and Kolchak during the First World War.\n\nShould we want to win this war, we must have the people’s support. As the ones who produce the artillery shells and guns for our soldiers, who have to undergo severe rationing and expect enemy bombing and shelling in their villages and factories, their continued efforts ensure our soldiers can achieve victory.\n\nHence, we must inform them that their perseverance and efforts are essential to the war’s victory, and continue on in their roles in these tumultuous times.\n\nTo do this, the Presidium has commissioned the Agitprop Department to create propaganda posters and campaigns to bolster up the people’s support for the war, and ensure that the Homefront does not falter."
 KRS_restore_order: "Restore Order"
 KRS_restore_order_desc: "With the recent wars raging around us, and with some conflicts of our own, chaos has been widespread.\n\nMany refugees are pouring in, trying to escape the conflict, while our border guards and militias are doing their best to make sure people are screened before entering the country. Our food situation could become dire if we continue to accept all these new refugees.\n\nBesides this, the influx of people into our nation has led to some of our border towns and cities strained beyond control, whilst the potential for saboteurs to enter and cause havoc in our industries and fields remains very high, despite best efforts from our border officers.\n\nWe must restore order and control. The delegates have drafted a temporary measure to construct basic temporary shelters near major points of entry, while ensuring that only a certain number can enter the nation for the time being."
 KRS_over_valleys_over_mountains: "Over Valleys, Over Mountains"
 KRS_over_valleys_over_mountains_desc: "Our social reforms have made us popular amongst our populace in Krasnoyarsk. Our working class no longer needs to slave through long working hours for meagre wages, and the average farmer does not need to worry about their daily bread.\n\nThis is a great achievement for us, and an ideal we want to spread across our region in our war for regional reunification.\n\nWith our army mobilised, and our men at the ready, we are ready to spread our ideals across the Siberian plains.\n\nIn the middle of Siberia's icy grip, the workers toil. Their spirits frozen, their dreams embroiled. Yet, the flame of socialism ignites their hearts anew as liberation dawns. Destiny's blessing has begun.\n\nOver the valleys and over the mountains of Siberia, our red banner shall advance."
 KRS_for_trotskyism: "For Trotskyism?"
 KRS_for_trotskyism_desc: "As war and chaos rages all over Siberia, we have proven ourselves worthy of being the successors of Trotsky’s ideals. Through our extensive reforms to the economy and civilian industry, we have drastically improved the quality of life in our fledgling state. However, this is just the first step. Leon Trotsky advocated for such ideals to be spread across the world and as his torchbearer, we must bear the burden of spreading his ideals.\n\nHence, with the Red Army, we will show the workers across Siberia that we are fighting for the ideas of our founding fathers and a free worker's state, one untouched by degeneracy, where workers live healthily and happily without the fear of being abused or mistreated by the likes of capitalists and feudalistic overlords.\n\nWe shall fight for Trotskyism! "
 KRS_for_the_motherland: "For the Motherland?"
 KRS_for_the_motherland_desc: "The Rodina. Proud as it stood from the banks of the Dnieper all the way to Vladivostok. A bright shining red light across the world as a beacon of socialism that would shine across the globe.\n\nHowever, the invasion by the Hitlerites and their cronies erased it from the maps and the global stage it once stood on. Her leaders abandoned her or used her for their own gain. Eventually she was broken up, shattered, and turned into a black slate encompassing the once proud lands.\n\nWe shall not let that injustice stand anymore. The Rodina was born into the hearts of every citizen who inhabits the lands of our former Soviet Union, and as its children, it is our duty to restore our motherland to the natural borders it inhabits."
 KRS_arise_fellow_russians: "Arise, Fellow Russians!"
 KRS_arise_fellow_russians_desc: "Whilst the importance of the revolution and Trotskyism as a whole is essential to our movement, another key factor is the Russian people.\n\nRussians, likely the toughest and most experienced people of the past few centuries, still have the spirit to fight for their greatness, their freedom, their liberation. We survived the long tyranny of the tsars, the combat of the fiery years during the Civil War, the terror of the fascist invasion, the collapse of the Union, and now we, a new Smuta upon our broken lands. We no longer hold the mantle of the Motherland, leaving it open to reactionary elements who, given the chance, will almost certainly bring further terror upon the people. This cannot stand in any shape or form.\n\nHence forth, our socialist movement will emphasize the role of Russians in the realization of the revolutionary liberation of the Motherland. The message of uplifting the downtrodden Russians and fighting back against the Nazis shall be embedded within our framework as to recruit potential workers and soldiers to fight for our revolution.\n\nRest assured, that we will keep our messaging from getting too close to outright nationalism and ethnic supremacy. Nevertheless, the might of the Russian worker, peasant, and soldier will be highlighted as we march on."
 KRS_proletarians_of_the_world_rise_up: "Proletarians of the World, Rise Up!"
 KRS_proletarians_of_the_world_rise_up_desc: "The Union was the prime example of a free worker's state and the closest we had ever come to liberating the loyal and hard-working people of the world, as we had the chance to spread our ideals across the 7 seas, dreaming of eliminating injustice and oppressive tyranny everywhere.\n\nThis dream was stolen away by the supporters of “Socialism in One Nation”, before the German war machine destroyed everything. The collapse of the Communist International led to empires and tyrannical states oppressing workers and proletarians without fear of revenge. No longer shall we stand this. We will not condone the deaths of our fellow workers at the hands of such murderers.\n\nWe will call all hands in the fields and factories everywhere to join us in the struggle for liberation. Instilling fear into the hearts of tyrants and hope into all workers across the world. Let us turn the cogs and call on the Proletarians of the World, the dawn of permanent revolution is close!\n\nProletarians of the World, Rise Up! Break the Chains that hold us down!"
 KRS_for_it_is_our_duty: "For It Is Our Duty..."
 KRS_for_it_is_our_duty_desc: "The unification of our region of Siberia is nearing by the day, whether we like it or not. Our enemies have built their army up and have prepared their war machines on our borders, ready to pounce the moment hostilities occur.\n\nIn these tumultuous and uncertain times, the duty of our citizens comes into importance. From the lowliest worker in the factory line to the elected delegates of the worker’s council, to the farmers who work on the collective farms, to our soldiers guarding our borders.\n\nThe nation has provided for them the benefits of their labour through their benefits, and in exchange, they shall provide the nation with their efforts to fight for the cause of socialism across Siberia.\n\nThe Union expects nothing less from its citizens, in their sacred duty to serve the nation with their role in society. It is of utmost importance, and each man, woman and child must be reminded of it."
 KRS_to_stand_and_fight: "...To Stand and Fight!"
 KRS_to_stand_and_fight_desc: "As of now, the Red Army has already successfully defended against our enemies actions, and have started their operation to liberate large swaths of territory formerly controlled by the likes of bourgeois dictatorships and feudal warlords.\n\nThey have fought valiantly, defending the bastion of socialism against those who seek to oppress and enslave us. They have chosen to fight on behalf of the nation, with valour and tenacity.\n\nOur brave soldiers, with their ferocity in combat, are motivated as they were before the start of our Reunification Campaign of Central Siberia. They will stand and fight for the banner of equality and socialism, to be raised across all of the cities in Siberia, from Tomsk to Kansk!"
 KRS_the_question_of_control: "The Question of Control"
 KRS_the_question_of_control_desc: "Ever since the proclamation of our commune, the many revanchists, capitalists and the false socialists that broke away during the chaos of the Central Siberian War have been looking at us like a piece of meat to be devoured.\n\nNow, after an extensive reform to the army, industry and our society, it is now time to prove them wrong. However, there is one more thing we need to address. The fate of our foes.\n\nOur newly conquered lands have to be properly integrated, to not only establish our administrative systems and exert control, but also prevent possible uprisings against our rule. This however also brings up the question, what shall be the fate of the former governments that we have defeated?\n\nSedov has asked the Central Committee of Krasnoyarsk what is necessary to ensure the party's ideals and governance, to ensure control over the region, as well as the fate of the defeated nations’ governments.\n\nWe must decide quickly, for the sake of stability during the war, should we want to succeed in securing our control over this region."
 KRS_a_necessary_evil: "A Necessary Evil"
 KRS_a_necessary_evil_desc: "Within the former lands of the Union, there lies a cancer, a malevolent disease that has corrupted the minds of tens of thousands of Russians, and that is reactionary thinking.\n\nThis reactionary hydra is a monster we have yet to fully kill. Similar to the Greek legend, it has multiple heads. One head is the capitalist kleptocrats that have killed in the name for profit, the second is the head of fascism who kills in the name of purity, the third is the head of theocracy who kills in the name of corrupt deities, and the fourth is the head of monarchism that kills in the name of royalty.\n\nThis monster has cast a shadow over the Motherland, and it is our duty to strike down this corrupt beast before it claims more lives. To do so, security and pacification measures will be enforced across the commune, with Red Guard and rear guard battalions being deployed to patrol towns and cities with traces of reactionism, and eliminating any with extreme prejudice.\n\nIf we want to ensure a Union of prosperity, one where the worker and peasant can coexist without inequality and classism, we must institute necessary revolutionary terror to rid violent reactionaries."
 KRS_peace_over_violence: "Peace over Violence"
 KRS_peace_over_violence_desc: "“If you are called upon to govern humans, treat them humanely”, a quote first spoken by comrade Mikhail Kalinin during the early days of the revolution, and one which still stays true to this day.\n\nUnlike the Union’s earlier conquests during the Civil War, we are no longer in a state to be pillaging without concern as the lands have been ravaged by banditry. To show that we are better than the common bandit, we must cater and bring attention to the needs of the hundreds and thousands of new souls under the rule of our commune.\n\nHenceforth, our Soviet code of conduct will explore and prioritize the need for peaceful means in both occupation and reintegration. The population of newly taken lands will no longer be at risk of pillaging or persecution, as we shall ensure that the Red Army is a force of revolutionary liberation rather than imperialist butchery.\n\nThis policy of peace over violence will be adhered to throughout the new Soviet Union, as we approach the question of regional reunification."
 KRS_law_and_order: "Law and Order"
 KRS_law_and_order_desc: "After numerous experiences with anti-revolutionary terrorists within conquered lands, with some in our own commune in Krasnoyarsk, it has become clear that more extreme measures will need to be taken to fully rid the region of these anti-socialist cells.\n\nFollowing much deliberation with the heads of the Red Army and Internal Affairs, Premier Sedov has announced the immediate implementation of several new security measures aimed at rooting out monarchist, bourgeois and reactionary elements from our communist society.\n\nThese include an increase in security spending, increased deployment of Army and police units in urban regions and state-wide mandatory curfews in areas of high anti-revolutionary activity.\n\nThese security measures are temporary, in order to stabilize our situation and ensure order is restored in these regions. The Presidium has promised the repeal of these measures once our enemies have been vanquished within Central Siberia."
 KRS_forgive_the_unforgiven: "Forgive the Unforgiven"
 KRS_forgive_the_unforgiven_desc: "When it comes to the matter of political prisoners, our original policy for these anti-revolutionary criminals has been either imprisonment, penal labor, or even capital punishment.\n\nHowever, due to the recent quadrupling of political prisoners held in custody due to our campaign to reclaim the Motherland, we will have to adopt a new method of pacification.\n\nIn a measure mostly supported by the reformists and moderates within the presidium, we shall begin a rehabilitation campaign for thousands of imprisoned soldiers and military officers of our recently conquered lands.\n\nThese rehabilitative practices will only be permitted for persons deemed appropriate, as to prevent any reactionaries and degenerates from enlisting in the ranks of the Red Army.\n\nMany hardline delegates have objected to this order, claiming that this will open the door for degeneracy and reactionarism, which could corrupt and destroy the army. But their calls will fall on deaf ears. If we wish to forge a truly unbreakable Union, we must show compassion for our misguided comrades where we can and should."
 KRS_we_shall_fight_for_justice: "We Shall Fight for Justice..."
 KRS_we_shall_fight_for_justice_desc: "As the Germans invaded our nation, and the subsequent power struggles and failure of the West Russian War, our Union plunged into anarchy. The same anarchy which we find ourselves in, roaming with bandits, oppressors and looters, whilst opportunistic warlords rose up, and carved out their own fiefdoms in the chaos.\n\nThe anarchy brought much injustice, at the hands of such bandits and looters in the chaos, whilst the other warlord states committed unspeakable crimes against the workers and peasants in their realm. These crimes are an attack against us all who live in Krasnoyarsk, and we shall tolerate it no longer.\n\nWe are stronger now, with our army and citizens alike, who are ready to fight for justice in these Siberian plains, to find those who are responsible for the crimes against the people.\n\nHenceforth, we shall fight in defence of the workers who are being oppressed by the capitalists and their cronies! We shall fight against the opportunistic brigands who steal from our populace! We shall defend against those who dare desecrate the sacred might of the proletariat!\n\nWe shall fight for the People’s Justice!"
 KRS_and_the_union: "...And the Union!"
 KRS_and_the_union_desc: "Fighting for the people’s justice is not the only thing the soldiers in our army fight for.\n\nMany soldiers who serve in our Red Army are motivated by their willingness to protect their families and the place they call home, to ensure that their children or their spouses can lead a healthier and safer life under our flag, where everyone has more than enough to eat, warm clothes and a roof over their heads.\n\nThese ideals push many of our soldiers to stand up and fight for our commune’s cause. For their families, for a better tomorrow, for the lives they seek to pursue under our flag. These personal motivations will drive them to fight for the Union we seek to restore.\n\nWe have done it before in 1918 with their forefathers, and we shall do it again here and now with them."
 KRS_a_red_siberia: "For A Red World"
 KRS_a_red_siberia_desc: "At long last, through the harsh winter storms, the vicious battles in the plains, alongside the horrors of conflict, we have valiantly crushed our enemies and have come to encompass the entirety of Central Siberia.\n\nThe cities are flying the flag of brilliant scarlet red once more, as our Red Army triumphs over the armies of the defeated states. We have returned back to where our forefathers started.\n\nNow we must focus on the present and look towards an ambitious future, fixing our administrative systems and looking towards the lands in the Far East. Rebuilding and developing our newly taken lands, enacting the processes of healing and unity in our fight to restore our Union and consolidating our new rule over our republic, as Premier Sedov leads us to a new glorious beginning.\n\nA bright future awaits us comrades! Long Live the Union! Long Live Premier Sedov!"

