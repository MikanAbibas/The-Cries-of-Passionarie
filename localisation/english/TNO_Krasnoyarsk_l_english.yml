 ## Ideas ##
 SAH_wild_promises:0 "Wild Promises"
 SAH_wild_promises_desc:0 "The people were, to say the least, skeptical about our government following the failures of both the Soviet Union and the subsequent Central Siberian Republic. To gain their support President Andreev has promised the world to them, offering all manner of social, political and economic reform in every bombastic speech. Yet whilst the Generalissimo may have them enthralled for now, soon the people will demand we deliver. With the true state of the nation far more precarious than we have led the people to believe, the path we walk is narrow and treacherous, but should we succeed we might just be able to give them the world."
 SAH_military_guided_democracy:0 "Military Guided Democracy"
 SAH_military_guided_democracy_desc:0 "Experiencing first hand the failures of a civilian led democracy to prevent the total social and military collapse of the Central Siberian Republic, our system of government was codified to ensure administration is shared between the people and the military. The Office of President is held by the Chief of the Army, appointed by the General Staff, whilst the Prime Minister and National Assembly are democratically elected by the people. However, the President, and thus the military, must consent to the formation of any new civilian government, and can dismiss both it and legislation at whim."
 SAH_treasonous_traditions:0 "Treasonous Traditions"
 SAH_treasonous_traditions_desc:0 "Abandoning the Red Army, and then mutinying against the Central Siberian Republic, our Officer Corps has developed both a tendency and willingness to act against any regime which threatens its future and interests. As our young Republic now takes its first steps, and the military's involvement in and influence over our politics becomes more common, many fear whether the sins of the past will become the sins of tomorrow.\n\n§RThe military may decide to act should they become dissatisfied with our government.§!"
 SAH_siberian_intelligentsia:0 "Siberian Intelligentsia"
 SAH_siberian_intelligentsia_desc:0 ""
 SAH_strange_bedfellows:0 "Strange Bedfellows"
 SAH_strange_bedfellows_desc:0 "Upon their dive into treason, Andreev and his clique received unexpected political support from the remnants of the Left Opposition. In bulk composed of Trotskyists exiled to political obscurity, these Communist Party members began to operate more freely under the weak Central Siberian Republic. When the Republic began to disintegrate, the Trotskyists helped facilitate Andreev’s takeover of Krasnoyarsk, and have so far participated in his new government. They are however ambivalent to military democracy, and it is possible they will seek to overthrow it given the opportunity."
