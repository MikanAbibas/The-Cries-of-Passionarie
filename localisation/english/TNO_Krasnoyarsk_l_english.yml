 #####################
 # 2.1 - LEADER BIOS #
 #####################
 POLITICS_LEV_SEDOV_DESC: "Lev Sedov knows what it is like to lose. First his father lost the struggle for control of the Soviet Union. Then they had been forced out into the Siberian hinterlands. Twice they had lost to the Germans, and then Sedov had lost his father. And now his mother was gravely ill, not long for the world either. As Russia shrank and shrank, Sedov found himself pushed into a smaller and smaller space, losing ground and losing hope.\n\nLev will not give up though, he owes his family and the workers of the world that much. The revolution must continue at any cost, and so he seized control of Krasnoyarsk with the help of his family and his father's old allies. Marx, Engels, Lenin and Trotsky may be dead, but their dream is not so long as Sedov lives to bring socialism to the people.\n\nEven now though, the party fractures, factionalism wracks the fledgling state and there are enemies on all sides. What he lacks in his father's energy, he more than makes up for in determination and planning. There is more than one way to change the world, after all. Soon the red flag will fly again across Russia, across the world, and it will be Lev Sedov carrying it. From Krasnoyarsk to Germania, from Tokyo to Washington, the permanent revolution will prevail. It has to...\n\nHe has to..."
 POLITICS_YURY_DOMBROVSKY_DESC: "§YGeneral Secretary of the Communist Party§!\n--------------\nYury Osipovich Dombrovsky was a brilliant Soviet writer and scholar, born on February 2, 1909, in Moscow, Russia.\n\nHe was raised in a family of intellectuals, where he was exposed to literature and philosophy from a young age. This upbringing instilled in him a love of learning and a deep appreciation for the written word. In his youth, Dombrovsky was an enthusiastic member of the Soviet Union's Communist Party and held various positions within the organization.\n\nHowever, as he grew older, he began to question the party's methods and ideals, particularly its slowly growing suppression of artistic and intellectual freedom. After the Soviet Union collapsed, he was the one who had reached into Krasnoyarsk, trying to survive both the travel and the fear of Germans trying to capture his group.\n\nDespite these concerns, Dombrovsky continued to write, and in 1955, he published his magnum opus, "The Faculty of Useless Knowledge." The novel was a brilliant exploration of the human condition, examining the intersection of art, philosophy, and politics. It was also a thinly veiled critique of the Soviet regime's censorship and repression of independent thought. After the revolution in Krasnoyarsk happened, Yury decided to join sides with Comrade Sedov, since they both had the same goal - save Russia from oppression. Currently, he is the leader of reformist faction in the party, and might succeed Sedov in the future."
 POLITICS_VALRAM_SHALAMOV_DESC: "§YGeneral Secretary of the Communist Party§!\n--------------\nValram Tikhonovich Shalamov was born on June 16, 1907, in Vologda, Russia, and spent most of his early years in the city of Butugychag, in the Kolyma region of Siberia. In 1929, Shalamov joined the Communist Party and worked in various jobs, including as a journalist and a laborer in the mines. However, in 1937, he was arrested by the NKVD and sent to a forced labor camp in Kolyma, where he spent the next 17 years. But, he was freed on the 8th year, as the Soviet Union collapsed under the weight of the German Wehrmacht. Knowing that the NKVD under Yagoda would try to capture him again, he escaped to Krasnoyarsk, located in then Central Siberian Republic. However, the Far East regime under Yagoda decided to conquer the fledging state.\n\nKnowing that collapse of both states was closer and closer, Valram decided to join Lev Sedov's revolution in Krasnoyarsk, not only to to save himself, but also to see if Sedov will be a better leader. And now, he is considered one of Sedov's successors."
 POLITICS_Alexander_Alexeyev_DESC: "§YGeneral Secretary of the Communist Party§\n--------------\nAlexander Ivanovich Alexeyev was born on 14 August 1913, in Kostroma.\n\nHaving lost his father at the age of 16, he moved to Moscow, where he followed his older brother. Following graduation in 1935, he would enter the history department of the Moscow University. In 1939, he was sent to Spain as an intepreter for Soviet Military Specialists, and was recruited into the NKVD shortly after.\n\nAs the end of 1941 came, he was posted to Iran, but was soon recalled to assist in the military effort against the Germans. Attached to the NKVD still, he was sent to Yagoda's Far East. However, Alexeyev would grow disgusted with Yagoda's regime, attached as a commissar to a Red Army unit. As the Central Siberian War stalled, Alexeyev took his chance, running to Krasnoyarsk, away from Yagoda. So he went, landing in Krasnoyarsk. He may have lacked formal military experience, yet his former experience as a intepreter and service in the NKVD made him an essential asset in Lev Sedov's revolution in Krasnoyarsk.\n\nNow, it is time he put those skills to the test, and assist Sedov in his quest to restore the Union."
 #POLITICS_NIKOLAI_ANDREEV_DESC: "Born 1905, Nikolai Trofimovich Andreev was called up from the reserves to fully rejoin the Red Army in 1935, initially a political commissar in Siberia. Hoping to fight on the frontline against the Germans, he was instead enrolled in officers' school. But as the war became more and more desperate, he continued taking more and more classes - not to become more skilled, but to hopefully delay being sent to fight for what he saw as a lost cause. As the Soviet Union collapsed, he and a clique of fellow officers' school graduates began to consolidate their power in the Krasnoyarsk region. Yet when the Central Siberian Republic was established, they were justifiably concerned about any pre-existing groups that would threaten the democratic institutions and so the government broke up the clique and assigned them to the far-reaching corners of the Republic. Andreev was placed under the command of Nikolay Krylov, secretly remaining in contact with his clique.\n\nAs the Republic began to lose its grip on power and crumble apart, the clique reunited in Krasnoyarsk and mutinied against General Krylov during his doomed campaign against the Siberian Black Army. Now in order to convince the people of the city that they were not just another flavor of junta, Andreev and his officers have promised new and sweeping reforms. Free trade! Private property! Foreign allies! Open elections! Liberty! Democracy!\n\nWith the collapse of the previous order, the clique is considering that the matter of the Siberian reunification rests in their hands. Following that it will be a mad dash to the sea, and with it foreign recognition, before consolidating and preparing a push to liberate all of Russia. But whether Andreev will actually be able to deliver on these promises is another matter entirely."

 ########################
 # 3 - NATIONAL SPIRITS #
 ########################
 KRS_bastion_of_the_revolution: "Bastion of the Revolution"
 KRS_bastion_of_the_revolution_desc: "Krasnoyarsk, before the Great Patriotic War, was a centre of opposition to Bukharin and his supporters. Krasnoyarsk was also a home to many revolutionary organizations. Today, Krasnoyarsk remains the bastion of the Russian Revolution and a symbol of the struggle for social justice and equality. Despite the passage of time and the many changes that have taken place in Russia since the early years of the revolution, Krasnoyarsk remains a powerful reminder of the enduring importance of the ideals and values of the revolution."
 KRS_satirical_pamphlets: "Satirical Pamphlets"
 KRS_satirical_pamphlets_desc: "An unknown author has been writing and distributing satirical anti-communist pamphlets in the region. Spreading amidst the many smaller organized armed groups these pamphlets continue to further undermine our attempts to liberate the workers of Russia."
 KRS_widespread_armaments: "Widespread Armaments"
 KRS_widespread_armaments_desc: "Due to abandonment of weapons depots due to the Anarchy that befell us, many villages and citizens in Krasnoyarsk are armed and organised into local neighbourhood watches and militias to ward off bandits. Whilst this isn't a problem yet, the Red Army nor the local Party does not have direct control of these men with guns, which could severely hamper the monopoly over violence of Krasnoyarsk's rulers."
 KRS_collectivised_farms: "Collectivised Farms"
 KRS_collectivised_farms_desc: "With the recent uptick in voluntary collectivization of farms, we have received word that agricultural output has increased, with grain output slowly increasing, we can now authorise a greater amount of rations for our loyal workers and soldiers.\n\nWhilst there are some delegates who disagree with where the excess agricultural output should be going towards, we now can relax in relative calm, knowing that we will not starve in Krasnoyarsk."
 KRS_subsidized_war_industries: "Subsidized War Industries"
 KRS_subsidized_war_industries_desc: "lowing many years of pleading from the Revolutionary Military Council to the Presidium, along with the increasing specter of looming war on the horizon, we have granted new investments into the armed forces and military production.\n\nThese investments are predicted to increase the capabilities of our armed forces as well as our future preparedness for the wars against our neighboring warlords. This has been a great boost to our Red Army and potentially grant us victory in the coming war."
 KRS_novaja_ekonomiceskaja_politika: "Novaja Ekonomiceskaja Politika"
 KRS_novaja_ekonomiceskaja_politika_desc: "Sinyavsky’s “Return to NEP” is a massive success. The implementation of the policy has allowed for greater funds for our nation to spend on essential services and formerly neglected governmental sectors as well as increase the quality of life in our nation, with our citizens able to afford their daily bread without much difficulty."

