 ## Focus Tree ##
 SAH_promises_of_prosperity:0 "Promises of Prosperity"
 SAH_promises_of_prosperity_desc:0 "Andreev has promised the people wealth beyond their wildest dreams. We must revive the economy or suffer defeat!"
 SAH_repair_the_railways:0 "Repair the Railways"
 SAH_repair_the_railways_desc:0 "Krasnoyarsk has traditionally served as a major rail hub. Repairing damaged railways will be necessary to facilitate economic growth."
 SAH_bukharins_legacy:0 "Bukharin's Legacy"
 SAH_bukharins_legacy_desc:0 "The Siberia Plan was partially successful and much of Siberia is now modestly industrialized. Krasnoyarsk was a major focus of the Sib Plan and we can major take advantage of that."
 SAH_siberian_steel:0 "Siberian Steel"
 SAH_siberian_steel_desc:0 "We have a good amount of steel mills within our control."
 SAH_krasnoyarsk_aluminium_plant:0 "Krasnoyarsk Aluminium Plant"
 SAH_krasnoyarsk_aluminium_plant_desc:0 "The Krasnoyarsk Aluminium Plant is a major supplier of Aluminum within Siberia. With it under our control we can exploit it for our own ends."
 SAH_construction_brigades:0 "Construction Brigades"
 SAH_construction_brigades_desc:0 "Too many drifters and layabouts! \nToo little work being done. \nWe can solve both by forming constructuin brigades to start building up our city."
 SAH_an_eye_to_the_future:0 "An Eye to the Future"
 SAH_an_eye_to_the_future_desc:0 "It's not just about the now, but what's to come."
 SAH_put_our_enemies_to_work:0 "Put Our Enemies to Work"
 SAH_put_our_enemies_to_work_desc:0 "We sure do have a lot of prisoners doing nothing and consuming hard earned resources. Should they not earn their keep as well?"
 SAH_fill_the_factory_floors:0 "Fill the Factory Floors"
 SAH_fill_the_factory_floors_desc:0 "The factories have remained understaffed for too long. We must rectify this."
 SAH_open_the_market:0 "Open the Market"
 SAH_open_the_market_desc:0 "Facilitating trade and capital growth will be critical if we want to be rich like those Americans."
 SAH_specialized_factories:0 "Specialized Factories"
 SAH_specialized_factories_desc:0 "Specialized factories will produce high quality rare goods, allowing us to corner the regional market."
 SAH_a_taste_of_luxury:0 "A Taste of Luxury"
 SAH_a_taste_of_luxury_desc:0 "Even our people deserve a little excess."
 SAH_mass_production:0 "Mass Production"
 SAH_mass_production_desc:0 "Scale up, and expand!"
 SAH_experience_is_the_best_tutor:0 "Experience is the Best Tutor"
 SAH_experience_is_the_best_tutor_desc:0 "Is it not?"
 SAH_promises_of_liberty:0 "Promises of Liberty"
 SAH_promises_of_liberty_desc:0 "Freedom is mere steps away!"
 SAH_the_enemy_within:0 "The Enemy Within"
 SAH_the_enemy_within_desc:0 "How can we claim to have the people's best interests at heart and not actually help them? We must focus our efforts on the masses first and foremost."
 SAH_shield_the_workers:0 "Shield the Workers"
 SAH_shield_the_workers_desc:0 "The noble laborers of Krasnoyarsk deserve only the best."
 SAH_expand_the_unions:0 "Expand the Unions"
 SAH_expand_the_unions_desc:0 "The unions in Krasnoyarsk have been generous with their support of our regime. We should reward them and solidify our friendship."
 SAH_a_helping_hand:0 "A Helping Hand"
 SAH_a_helping_hand_desc:0 "You're never alone."
 SAH_scholars_not_soldiers:0 "Scholars Not Soldiers"
 SAH_scholars_not_soldiers_desc:0 "We need an educated population, not just an armed one."
 SAH_cap_the_wealth:0 "Cap the Wealth"
 SAH_cap_the_wealth_desc:0 "Do you really need that much money? Can't it be better spent elsewhere?"
 SAH_a_key_for_every_lock:0 "A Key For Every Lock"
 SAH_a_key_for_every_lock_desc:0 "Safe and secure. Thieves should stay out!"
 SAH_sell_the_land:0 "Sell the Land"
 SAH_sell_the_land_desc:0 "We have possession of a derth of undeveloped land. We should sell it off to generate a profit and hope the buyers also seek to develop the land."
 SAH_regulate_the_ruble:0 "Regulate the Ruble"
 SAH_regulate_the_ruble_desc:0 "In times liike these we cannot afford currency collapse!"
 SAH_the_rural_revolution:0 "The Rural Revolution"
 SAH_the_rural_revolution_desc:0 "The peasents will have bread!"
 SAH_old_but_not_alone:0 "Old But Not Alone"
 SAH_old_but_not_alone_desc:0 "The elderly shall not be abandoned!"
 SAH_a_childhood_guaranteed:0 "A Childhood Guaranteed"
 SAH_a_childhood_guaranteed_desc:0 "Should our children not deserve the world?"
 SAH_akademgorodok:0 "Akademgorodok"
 SAH_akademgorodok_desc:0 "Smarter people, stronger country."
 SAH_the_enemy_outside:0 "The Enemy Without"
 SAH_the_enemy_outside_desc:0 "How can we claim to love the people if we cannot protect them from outside enemies? We need a strong economy yesterday!"
 SAH_protect_our_own:0 "Protect Our Own"
 SAH_protect_our_own_desc:0 "The citizens of Krasnoyarsk need to be defended first and foremost. Then we can start worrying about others."
 SAH_a_centralized_identity:0 "A Centralized Identity"
 SAH_a_centralized_identity_desc:0 "We will consolidate our industrial assets and maximize production!"
 SAH_clean_the_streets:0 "Clean the Streets"
 SAH_clean_the_streets_desc:0 "The dregs of society infest the byways of Krasnoyarsk. We need to clean them and the rubbish out now!"
 SAH_expand_the_militsiya:0 "Expand the Militsiya"
 SAH_expand_the_militsiya_desc:0 "The military police will be expanded to ensure the populace is well protected."
 SAH_encourage_private_investment:0 "Encourage Private Investment"
 SAH_encourage_private_investment_desc:0 "Thankfully there are still individuals of some wealth in Krasnoyarsk. We could encourage them to spend money and improve the country for all our sakes."
 SAH_your_money_belongs_to_you:0 "Your Money Belongs to You"
 SAH_your_money_belongs_to_you_desc:0 "We shouldn’t steal from others now should we?"
 SAH_the_truth_is_out_there:0 "The Truth Is Out There"
 SAH_the_truth_is_out_there_desc:0 "We just have to find it."
 SAH_promises_of_security:0 "Promises of Security"
 SAH_promises_of_security_desc:0 "President Andreev has promised the people safety from banditry and warlordism. We must improve our army and destroy our enemies!"
 SAH_recruitment_drives:0 "Recruitment Drives"
 SAH_recruitment_drives_desc:0 "Serve a good cause!"
 SAH_the_abakan_arsenal:0 "The Abakan Arsenal"
 SAH_the_abakan_arsenal_desc:0 "The arsenal has a significant stockpile of weapons we can utilize."
 SAH_lessons_from_yagoda:0 "Lessons from Yagoda"
 SAH_lessons_from_yagoda_desc:0 "Yagoda may be a crazy bastard but he does know how to keep a disciplined army."
 SAH_take_to_the_skies:0 "Take to the Skies"
 SAH_take_to_the_skies_desc:0 "We have a few airframes we captured during our coup. Why not put them to use?"
 SAH_airbase_expansion:0 "Airbase Expansion"
 SAH_airbase_expansion_desc:0 "Our current airport facilities are entirely lacking. We need to expand and upgrade them posthaste!"
 SAH_skies_of_shrapnel:0 "Skies of Shrapnel"
 SAH_skies_of_shrapnel_desc:0 "We must prepare as well for aerial attack."
 SAH_command_the_earth:0 "Command the Earth"
 SAH_command_the_earth_desc:0 "We'll build the greates army in all of Russia!"
 SAH_lend_lease_legacy:0 "Lend Lease Legacy"
 SAH_lend_lease_legacy_desc:0 "The Americans send some material support to the Soviet Union during the Great Patriotic War. A good amout has landed in our possession thankfully."
 SAH_building_our_own:0 "Building Our Own"
 SAH_building_our_own_desc:0 "We need our own equipment production as well! Can't rely on holdovers and aging equipment."
 SAH_fund_the_nkvd:0 "Fund the NKVD"
 SAH_fund_the_nkvd_desc:0 "We have in our service a branch of the NKVD. They have been helpful with their espionage efforts and require further support to fully realize their potential."
 SAH_protect_our_secrets:0 "Protect Our Secrets"
 SAH_protect_our_secrets_desc:0 "Keep our enemies in the dark."
 SAH_and_discover_theirs:0 "And Discover Theirs"
 SAH_and_discover_theirs_desc:0 "Bring their weakness to light!"
 SAH_promises_of_unity:0 "Promises of Unity"
 SAH_promises_of_unity_desc:0 "Russia has been shattered to pieces and President Andreev has promised to bring Russia under one free government!"
 SAH_down_with_the_king:0 "Down with the King"
 SAH_down_with_the_king_desc:0 "Krylov has gone utterly mad and now believes himself to be a secret scion of the Rurikid dynasty. We should put him out of his misery."
 SAH_thy_kingdom_come:0 "Thy Kingdom Come"
 SAH_thy_kingdom_come_desc:0 "Sorry old friend."
 SAH_cross_the_yenisei:0 "Cross the Yenisei"
 SAH_cross_the_yenisei_desc:0 "The Black Army has been plaguing Russia for long enough."
 SAH_end_the_anarchy:0 "End the Anarchy"
 SAH_end_the_anarchy_desc:0 "How is lawlessness supposed to solve anyhting anyway?"
 SAH_something_to_fight_for:0 "Something to Fight For"
 SAH_something_to_fight_for_desc:0 "The People's Revolutionary Council has some common cause with us. Perhaps they would be willing to join us?"
 SAH_mongolias_finest:0 "Mongolia's Finest"
 SAH_mongolias_finest_desc:0 "Mongolian troops have joined our ranks!"
 SAH_put_them_out_of_their_misery:0 "End Their Misery"
 SAH_put_them_out_of_their_misery_desc:0 "The People's Revolutionary Council is shambholic mess. It is best we destroy them and be done with it."
 SAH_our_tuvan_friends:0 "Our Tuvan Friends"
 SAH_our_tuvan_friends_desc:0 "The Tuvans have been all to happy to be released from Councilist tyranny! They now fervently support our new regime."
 SAH_bury_the_past:0 "Bury the Past"
 SAH_bury_the_past_desc:0 "Goodbye Oryotia."
 SAH_that_which_was_lost:0 "That Which Was Lost"
 SAH_that_which_was_lost_desc:0 "Nothing worth remembering."
 SAH_a_new_home:0 "A New Home"
 SAH_a_new_home_desc:0 "Oryotia has remained something of a bright spot in Siberia even now. We should approach them and offer peaceful unification."
 SAH_a_new_hope:0 "A New Hope"
 SAH_a_new_hope_desc:0 "Together under liberty."
 SAH_the_jewel_of_siberia:0 "The Jewel of Siberia"
 SAH_the_jewel_of_siberia_desc:0 "Novosibirsk is the largest city in Siberia and is a veritable heart of industry. It would be so much more useful under our leadership."
 SAH_siberian_freight_fleet:0 "Siberian Freight Fleet"
 SAH_siberian_freight_fleet_desc:0 "Wealth runs through rail!"
 SAH_topple_the_ivory_towers:0 "Topple the Ivory Towers"
 SAH_topple_the_ivory_towers_desc:0 "The hideous remains of the weak and cowardly Central Siberian government have fled north to Tomsk"
 SAH_operation_dostoyevsky:0 "Operation Dostoyevsky"
 SAH_operation_dostoyevsky_desc:0 "Have you read Dostoyevsky? The idiots in Tomsk sure didn't!"
 SAH_our_siberia_united:0 "Our Siberia United"
 SAH_our_siberia_united_desc:0 "Central Siberia is once again united under one government. "
 #psr regional
 SAH_for_liberty_for_russia:0 "For Liberty! For Russia!"
 SAH_for_liberty_for_russia_desc:0 "The PSR has promised a strong and free government! Russia will be one or it will be nothing!"
 SAH_survey_the_land:0 "Survey The Land"
 SAH_survey_the_land_desc:0 "Our newly aquired territories must be assesed fully."
 SAH_restart_local_governence:0 "Restart Local Governence"
 SAH_restart_local_governence_desc:0 "Many gubernatorial administrations have been rendered nonexistant by the recent chaos. We must reestablish them as soon as possible."
 SAH_wealth_of_the_land:0 "Wealth Of The Land"
 SAH_wealth_of_the_land_desc:0 "Siberia is rich in resources waiting for exploitation."
 SAH_thank_our_fighting_troops:0 "Thank Our Fighting Troops"
 SAH_thank_our_fighting_troops_desc:0 "Without the army we would have been all dead or tyrannized by now!"
 SAH_hail_comrade_president:0 "Hail Comrade President!"
 SAH_hail_comrade_president_desc:0 "Andreev has led us to victory after victory! By his will alone do we now posses a fair and strong government ruled by the people. \n\nWhen else has liberty triumphed over tyranny in Russian history. Ivan the Terrible crushed Novgorod. Nicholas I destroyed the December Revolt. Vladimir Lenin ended the liberal dream. \n\nBut now we have hope, and it is Nikolai Andreev who has brought it to us!"
 SAH_strength_in_freedom:0 "Strength In Freedom"
 SAH_strength_in_freedom_desc:0 "No slave is strong."
 SAH_clarify_military_democracy:0 "Clarify Military Democracy"
 SAH_clarify_military_democracy_desc:0 "Many are confused by the glorious concept of Military Democracy. Let us alleviate thier concerns."
 SAH_for_the_people:0 "For The People"
 SAH_for_the_people_desc:0 "Without Russians there is no Russia!"
 SAH_just_reward:0 "Just Reward"
 SAH_just_reward_desc:0 "Many have been laboring for little to no pay. Their sacrifice has enabled our triumph. We must pay them their due."
 SAH_no_malice:0 "No Malice"
 SAH_no_malice_desc:0 "We must be just and fair."
 SAH_two_heads_one_body:0 "Two Heads One Body"
 SAH_two_heads_one_body_desc:0 "The military and the government work together not apart."
 SAH_following_america:0 "Following America"
 SAH_following_america_desc:0 "The United States has risen to peaks unheard of simply by establishing a strong government. We must emulate their example."
 SAH_against_tyranny:0 "Against Tyranny!"
 SAH_against_tyranny_desc:0 "Despots of all colors will tremble before us!"
 SAH_always_vigilant:0 "Always Vigilant"
 SAH_always_vigilant_desc:0 "We must be prepared for enemies within and without."
 SAH_russian_dream:0 "The Russian Dream"
 SAH_russian_dream_desc:0 "Russia can be strong and free. Nothing is impossible."
 SAH_promise_the_ofn:0 "Promise The OFN"
 SAH_promise_the_ofn_desc:0 "We will seek to work with the OFN and gain their favor."
 SAH_god_favors_the_free:0 "God Favors The Free"
 SAH_god_favors_the_free_desc:0 "Deliver us from evil."
 #prp regional
 SAH_building_a_new_nation:0 "Building A New Nation"
 SAH_building_a_new_nation_desc:0 "Conquest is only the beginning, now the hard part begins. We must rebuild Russia from the ground up!"
 SAH_the_foundations:0 "The Groundwork"
 SAH_the_foundations_desc:0 "The first stage of PRP's economic revival plan focuses on expanding and modernizing the city of Krasnoyarsk. It will serve as a major economic hub in addition to serving as a political capital."
 SAH_assure_andreev:0 "Assure Andreev"
 SAH_assure_andreev_desc:0 "We will assure the President we share his concern for Russia first and foremost. His other opinions are however debatable."
 SAH_appoint_new_admins:0 "Appoint New Administrators"
 SAH_appoint_new_admins_desc:0 "Much of the nation remains in total anarchy or under military control We must appoint civilian administrators to oversee these lawless areas."
 SAH_expand_krasnoyarsk:0 "Expand Krasnoyarsk"
 SAH_expand_krasnoyarsk_desc:0 "The capital will be enlarged to account for its growing economy. We can't let people live in hovels and shanty towns."
 SAH_stability_through_prosperity:0 "Stability Through Prosperity"
 SAH_stability_through_prosperity_desc:0 "The best way top a peaceful and strong nation is wealth. It really is that easy, no?"
 SAH_improve_the_sib_plan:0 "Improve The Sib Plan"
 SAH_improve_the_sib_plan_desc:0 "While Bukharin's Siberia Plan was a good start, it was held back by nonsensical Bolshevik ideological pedantry. We will learn from this and pursue a purely rational economic plan."
 SAH_look_at_what_we_do_for_you:0 "Look At What We Have Done For You!"
 SAH_look_at_what_we_do_for_you_desc:0 "We've made you rich and free. Vote PRP!"
 SAH_nudge_out_the_military:0 "Nudge Out The Army"
 SAH_nudge_out_the_military_desc:0 "Should the army really involved in policy making? No! Allowing the army to rule the government is a step into dictatorship. We must make an effort to minimize their presence."
 SAH_attract_communist_defectors:0 "Attract Communist Defectors"
 SAH_attract_communist_defectors_desc:0 "A minority of the communist party is made up of more pragmatists who reluctantly tow the Trotskyite party line. Hence, we can woo some of these members into joining our party."
 SAH_republic_of_iron:0 "Republic Of Iron"
 SAH_republic_of_iron_desc:0 "Russia will not be built of wood and dirt but steel and glass!"
 SAH_never_more_warlords:0 "Warlords Nevermore"
 SAH_never_more_warlords_desc:0 "Never again will bandits and madmen take this nation!"
 SAH_expand_the_consumer_sector:0 "Expand The Civil Sector"
 SAH_expand_the_consumer_sector_desc:0 "The economy should include the needs of the civilians as well as the military."
 SAH_times_calling:0 "The Times Call"
 SAH_times_calling_desc:0 "No longer will we live in the darkness of the past! We must adapt to the future!"
 SAH_novgorods_legacy:0 "Novgorod's Legacy"
 SAH_novgorods_legacy_desc:0 "The Republic of Novgorod was a center of learning and trade until it was destroyed by the Muscovite menace. We will seek to reclaim its legacy and create a Russia worthy of respect."
 SAH_diamond_in_the_ice:0 "Diamond In The Ice"
 SAH_diamond_in_the_ice_desc:0 "Siberia has come alive. No longer a wasteland but a light shining in the darkness."
 SAH_redefine_military_democracy:0 "Redefine Military Democracy"
 SAH_redefine_military_democracy_desc:0 "Should the army really have a say? We'll push them out slowly and silently."
 SAH_freedom_can_be_free:0 "Freedom Can Be Free"
 SAH_freedom_can_be_free_desc:0 "For you and your children."
 #vkp regional
 SAH_eternal_october:0 "Eternal October"
 SAH_eternal_october_desc:0 "I have not forgotten what you and your comrades started."
 SAH_entice_the_people:0 "Entice The People"
 SAH_entice_the_people_desc:0 "They can remember what we brought to them."
 SAH_remember_the_good:0 "Remember The Good"
 SAH_remember_the_good_desc:0 "The wealth, and the strength."
 SAH_forget_the_bad:0 "Forget The Bad"
 SAH_forget_the_bad_desc:0 "The killing..."
 SAH_workers_siberia_unite:0 "Workers Of Siberia, Unite!"
 SAH_workers_siberia_unite_desc:0 "For a better future."
 SAH_in_the_factories:0 "In The Factories"
 SAH_in_the_factories_desc:0 "The laborer's place."
 SAH_the_hammer:0 "The Hammer"
 SAH_the_hammer_desc:0 "The power in the factories."
 SAH_on_the_farms:0 "On The Farms"
 SAH_on_the_farms_desc:0 "The peasents place."
 SAH_the_sickle:0 "The Sickle"
 SAH_the_sickle_desc:0 "The might of the farms."
 SAH_the_obstacles:0 "The Obstacles"
 SAH_the_obstacles_desc:0 "The bourgeoisie."
 SAH_facedown_the_psr:0 "Face Down The PSR"
 SAH_facedown_the_psr_desc:0 "Worshipers of dictators and foreign nations."
 SAH_no_to_tyrants:0 "No To Tyrants!"
 SAH_no_to_tyrants_desc:0 "They will kill us all."
 SAH_no_to_elitism:0 "No To Elitism!"
 SAH_no_to_elitism_desc:0 "They will bleed us dry."
 SAH_promise_true_democracy:0 "Promise True Democracy"
 SAH_promise_true_democracy_desc:0 "Only we can save you."
 SAH_oppose_the_prp:0 "Oppose The PRP"
 SAH_oppose_the_prp_desc:0 "Bureaucrats making work for themselves."
 SAH_out_the_busybodies:0 "Out The Busybodies"
 SAH_out_the_busybodies_desc:0 "What can they accomplish?"
 SAH_traitors_to_the_cause:0 "Traitors To The Cause"
 SAH_traitors_to_the_cause_desc:0 "They were Party members too once."
 SAH_for_the_world_proletariat:0 "For The World Proletariat"
 SAH_for_the_world_proletariat_desc:0 "For them all, not useless middlemen."
 SAH_the_army_problem:0 "The Army Problem"
 SAH_the_army_problem_desc:0 "A questionable presence."
 SAH_step_out_of_politics:0 "Step Out Of Politics!"
 SAH_step_out_of_politics_desc:0 "They do not belong there."
 SAH_find_the_loyalists:0 "Find The Loyalists"
 SAH_find_the_loyalists_desc:0 "Some still remember their duty."
 SAH_the_foundation_laid:0 "The Seeds Planted"
 SAH_the_foundation_laid_desc:0 "The time is approaching."
 #shared econ
 SAH_the_wheels_of_the_economy:0 "The Wheels Of The Economy"
 SAH_the_wheels_of_the_economy_desc:0 "We need money. A lot of money if we hope to take back Russia."
 SAH_roads_and_rails:0 "Roads And Rails"
 SAH_roads_and_rails_desc:0 "What's an economy without transport?"
 SAH_reactivate_factories:0 "Reactivate Deserted Factories"
 SAH_reactivate_factories_desc:0 "Many deserted factories dot the land; we should put them to good use."
 SAH_new_factory_designs:0 "New Manufacturing Complexes"
 SAH_new_factory_designs_desc:0 "Not just dusty old factories, but new clean ones!"
 SAH_goods_for_the_people:0 "Goods For The Masses"
 SAH_goods_for_the_people_desc:0 "Toasters for the people!"
 SAH_and_guns_for_the_army:0 "And Guns For The Army"
 SAH_and_guns_for_the_army_desc:0 "No more sharing Mosins!"
 SAH_back_to_work:0 "Back To Work!"
 SAH_back_to_work_desc:0 "You have to pay for all these shiny new goods right?"
 SAH_what_we_have_now:0 "What We Have Now"
 SAH_what_we_have_now_desc:0 "We need to prioritize are manufacturing capability first and foremost."
 SAH_remechanize_the_factories:0 "Remechanize The Factories"
 SAH_remechanize_the_factories_desc:0 "Too many factories are reliant on hand tools. We can reintroduce machine tools to speed up our manufacturing."
 SAH_work_smarter:0 "Work Smarter"
 SAH_work_smarter_desc:0 "Efficiency is key!"
 SAH_dig_into_the_earth:0 "Dig Into The Ground"
 SAH_dig_into_the_earth_desc:0 "The earth is ours to exploit."
 SAH_reinvest_the_profits:0 "Reinvest The Profits"
 SAH_reinvest_the_profits_desc:0 "The money gained can be put towards additional manufacturies."
 SAH_through_grit_and_effort:0 "Through Grit And Effort"
 SAH_through_grit_and_effort_desc:0 "Hard work will carry the day."
 SAH_what_we_will_have:0 "What We Will Have"
 SAH_what_we_will_have_desc:0 "We need to prioritize rebuilding our technical base. If we want to become a modern nation we'll need the most cutting edge technology we can get our hands on."
 SAH_reopen_universities:0 "Reopen Universities"
 SAH_reopen_universities_desc:0 "The Universities have been closed since the breakdown of the Central Siberian Republic. We should invest in reopening them."
 SAH_study_foreign_electronics:0 "Study Foreign Electronics"
 SAH_study_foreign_electronics_desc:0 "Electronics have advanced by leaps and bounds since the Second World War. We have much to gain by studying them."
 SAH_rural_schooling:0 "Rural Schooling"
 SAH_rural_schooling_desc:0 "Everyone deserves an education!"
 SAH_new_industrial_methods:0 "New Industrial Methods"
 SAH_new_industrial_methods_desc:0 "Some American companies have offered to share with us new techniques they utilize to maximize the efficiency of their factories."
 SAH_through_wit_and_study:0 "Through Wit And Study"
 SAH_through_wit_and_study_desc:0 "We must be intelligent with our resources and ensure we aren't left behind."
 #shared mil
 SAH_march_of_boots:0 "March Of Boots"
 SAH_march_of_boots_desc:0 "I hear them through the streets."
 SAH_drums_of_war:0 "Drums Of War"
 SAH_drums_of_war_desc:0 "To make ready for battle!"
 SAH_a_proper_army:0 "Build A Proper Army"
 SAH_a_proper_army_desc:0 "No longer a ragtag group of soldiers, we'll be a proper army yet!"
 SAH_spoils_of_victory:0 "Spoils Of Victory"
 SAH_spoils_of_victory_desc:0 "Our reconquest of Siberia has yielded material reward, ready for our use."
 SAH_learn_from_struggle:0 "Learn From Struggle"
 SAH_learn_from_struggle_desc:0 "Remember what works and what does not."
 SAH_drill_the_troops:0 "Drill The Troops"
 SAH_drill_the_troops_desc:0 "We're an army not a rabble!"
 SAH_the_aleev_doctrine:0 "The Andreev Doctrine"
 SAH_the_aleev_doctrine_desc:0 "The Andreev Doctrine calls for utilizing deception, ambushes, and rapid strikes to minimize losses among our forces. With our limited resources this has been especially important."
 SAH_better_guns:0 "Better Guns"
 SAH_better_guns_desc:0 "Aging weapons designs have held our fighting capability back. We must rectify this."
 SAH_bigger_guns:0 "Bigger Guns"
 SAH_bigger_guns_desc:0 "Mass reintroduction of artillery will enhance are capability to make war."
 SAH_and_armor_too:0 "And Armor Too"
 SAH_and_armor_too_desc:0 "Armor will significantly imrpove our offensive power."
 SAH_establish_air_defence_force:0 "Establish The Air Defence Force"
 SAH_establish_air_defence_force_desc:0 "We will formally establish an air force to dfend our skies and support the army."
 SAH_salvage_fighters:0 "Salvage Old Fighters"
 SAH_salvage_fighters_desc:0 "Many old airplanes lie abaonded in hangers all over our territory. Some at least can be salvaged and made air worthy again."
 SAH_learn_from_the_best:0 "Learn From The Best"
 SAH_learn_from_the_best_desc:0 "Russia has never been known for its air power. We need to learn from foreign nations to understand how to create a truly effective air force."
 SAH_the_krasnoyarsk_mil_academy:0 "The Krasnoyarsk Military Academy"
 SAH_the_krasnoyarsk_mil_academy_desc:0 "The Krasnoyarsk Military Academy will teach the next generation of officer who will be ready to replace our aging generals."
 SAH_establish_helicopter_units:0 "Establish Helicopter Units"
 SAH_establish_helicopter_units_desc:0 "We have managed to capture some helicopters from Tuva! In fact, we have enough to use to movbe our troops!"
 SAH_the_confederal_army_is_ready:0 "The Confederal Army Is Ready"
 SAH_the_confederal_army_is_ready_desc:0 "The Confederal Army of Russia is now a force truly worthy of fear and respect. Our enemies will tremble before us!"
 #shared diplo tree
 SAH_seeking_recognition:0 "Seeking Recognition"
 SAH_seeking_recognition_desc:0 "We will seek support and acknowledgement from the United States. They are a natural ally whose friendship will benefit us greatly."
 SAH_call_the_ofn:0 "Call The OFN"
 SAH_call_the_ofn_desc:0 "They have to help us, right?"
 SAH_further_material_support:0 "Material Support And Other Goods"
 SAH_further_material_support_desc:0 "Both lethal and non-lethal aid will benefit us greatly."
 SAH_loans_and_investments:0 "Loans And Investments"
 SAH_loans_and_investments_desc:0 "The dollars will be welcome."
 SAH_establish_a_cia_base:0 "Establish A CIA Base"
 SAH_establish_a_cia_base_desc:0 "Nothing goes wrong when the CIA is involved!"
 SAH_liberty_marches_forward:0 "Liberty Marches Forward"
 SAH_liberty_marches_forward_desc:0 "Together for freedom!"
 #psr superregional
 SAH_end_the_long_serfdom:0 "End The Long Serfdom"
 SAH_end_the_long_serfdom_desc:0 "For centuries the Russian people have suffered under the slavery of boyars. The Communists proved they were no different. Only we can bring freedom to Russia and end this wretched cycle."
 SAH_the_peoples_champion:0 "The People's Champion"
 SAH_the_peoples_champion_desc:0 "President Andreev has lead us to victory time and time again. We should be greatful we have such a great and just leader!"
 SAH_decembrists_avenged:0 "The Decembrists Avenged"
 SAH_decembrists_avenged_desc:0 "The December Revolt was ultimately crushed by Tsarist forces. We have not forgotten their ideals nor their struggle. \nRussia will be free and strong just as they willed."
 SAH_god_and_the_republic:0 "God And The Republic"
 SAH_god_and_the_republic_desc:0 "The kingdoms of men rise and fall, but the Kingdom of God is eternal. We must give thanks to the Lord for his grace and favor."
 SAH_let_freedom_ring:0 "Let Freedom Ring"
 SAH_let_freedom_ring_desc:0 "\nLiberty. \nLiberty. \nLiberty."
 SAH_a_confederation_with_no_end:0 "A Confederation With No End"
 SAH_a_confederation_with_no_end_desc:0 "A republic to stand the test of time!"
 SAH_the_perfect_democracy:0 "The Perfect Democracy"
 SAH_the_perfect_democracy_desc:0 "A fusion of strength and liberty."
 SAH_the_army_stands_ready:0 "The Army Stands Ready"
 SAH_the_army_stands_ready_desc:0 "To defend us. To defend democracy. To defend Russia!"
 SAH_defenders_of_freedom:0 "Defenders Of Freedom"
 SAH_defenders_of_freedom_desc:0 "The Army will protect liberty."
 SAH_military_companies:0 "Establish Military Companies"
 SAH_military_companies_desc:0 "A strong economy for the defense of Russia."
 SAH_promise_an_end_to_chaos:0 "Promise An End To The Chaos"
 SAH_promise_an_end_to_chaos_desc:0 "No more warlords!"
 SAH_an_oath_fulfilled:0 "An Oath Fulfilled"
 SAH_an_oath_fulfilled_desc:0 "We have kept our promises to the people to create a strong, prosperous, and free nation."
 SAH_prepare_for_unification:0 "Prepare For Unification"
 SAH_prepare_for_unification_desc:0 "Our enemies will bow!"
 SAH_to_never_forget:0 "To Never Forget"
 SAH_to_never_forget_desc:0 "See how the Tsars and Communists lorded over the people. See what became of them. \nThe Germans will be no different. \nGod Save Russia!"
 #prp superregional
 SAH_wealth_of_freedom:0 "Wealth Of Freedom"
 SAH_wealth_of_freedom_desc:0 "Prosperity in Democracy!"
 SAH_russias_future:0 "Russia's Future"
 SAH_russias_future_desc:0 "We will forge a nation of freedom and rationality!"
 SAH_new_siberia:0 "A New Siberia"
 SAH_new_siberia_desc:0 "Siberia has become a hub of industry and development under our leadership."
 SAH_krasnoyarsk_heart_of_russia:0 "Krasnoyarsk: Heart Of Russia"
 SAH_krasnoyarsk_heart_of_russia_desc:0 "We will build Krasnoyarsk into a city that rivals Moscow and St. Petersburg!"
 SAH_a_center_of_learning:0 "A Center Of Learning"
 SAH_a_center_of_learning_desc:0 "Our universities are bustling with future scientists and intellectuals. We will be backwards no longer!"
 SAH_a_beacon_of_freedom:0 "A Beacon Of Freedom"
 SAH_a_beacon_of_freedom_desc:0 "Democracy will be defended by us!"
 SAH_a_base_of_industry:0 "A Base Of Industry"
 SAH_a_base_of_industry_desc:0 "The Nation has come alive with productive factories churning our consumer goods and weapons!"
 SAH_carefully_designed_economy:0 "Balance The Economy"
 SAH_carefully_designed_economy_desc:0 "Not too much debt, and not too little taxes."
 SAH_all_for_the_best:0 "All For The Best"
 SAH_all_for_the_best_desc:0 "The PRP has your best interests in mind."
 SAH_connect_siberia:0 "Connect Siberia"
 SAH_connect_siberia_desc:0 "Siberian infrastructure will be upgraded to compensate for growing demand."
 SAH_modernize_the_nation:0 "Modernize The Nation"
 SAH_modernize_the_nation_desc:0 "Large parts of the country, especially the Far East, are lagging behind our major cities. We must correct this at once!"
 SAH_defer_to_those_who_know_best:0 "Defer To Those Who Know Best"
 SAH_defer_to_those_who_know_best_desc:0 "Technocrats will guide our nation to ever greater heights!"
 SAH_rational_republic:0 "A Rational Republic"
 SAH_rational_republic_desc:0 "We will not be ruled by degenerate and foolhardy ideologies!"
 SAH_shining_cities:0 "Shining Cities"
 SAH_shining_cities_desc:0 "The cities of Siberia have each grown into a metropolis worthy of admiration and emulation."
 SAH_functional_technocracy:0 "A Functional Technocracy"
 SAH_functional_technocracy_desc:0 "Through careful guidance we can lead Russia to liberty."
 SAH_a_better_kind_of_democracy:0 "A Better Kind Of Democracy"
 SAH_a_better_kind_of_democracy_desc:0 "The army has had the run of things for long enough. It is time for the Technocrats to take control and a new constitution to be written."
 SAH_work_with_the_military:0 "Work With The Military"
 SAH_work_with_the_military_desc:0 "Circumstances are unfavorable for now. We must continue with Military Democracy for now and pursue our agenda within in its bounds."
 #unified politics
 SAH_the_psr_triumphant:0 "The PSR Triumphant"
 SAH_the_psr_triumphant_desc:0 "The PSR now rules over a more or less unitied Russia."
 SAH_formalize_the_states:0 "Formalize The States"
 SAH_formalize_the_states_desc:0 "Subnational governments will be formally organized all over the nation and borders will be redrawn in existing ones."
 SAH_strengthen_the_federal_government:0 "Strengthen The Confederal Government"
 SAH_strengthen_the_federal_government_desc:0 "A strong central government is necessary for Democracy."
 SAH_the_reunification_awaits:0 "The Reconquest Awaits!"
 SAH_the_reunification_awaits_desc:0 "The Germans will get what's coming to them!"
 SAH_welcome_refugees:0 "Welcome Emigrees"
 SAH_welcome_refugees_desc:0 "Many Russians have emigated to the Russian Confederation from the OFN sphere as well as areas under Japanese and German oppression."
 SAH_invite_american_advisors:0 "Invite American Advisors"
 SAH_invite_american_advisors_desc:0 "To deepen ties and gather crucial experience we will invite American military advisors to support our continued military buildup."
 SAH_the_moderate_vkp_triumphant:0 "The Moderate VKP Triumphant"
 SAH_the_moderate_vkp_triumphant_desc:0 "With the Trotskyites sidelined, the VKP has signalled a greater willingness for compromise and reform over revolution."
 SAH_menshevism_redeemed:0 "Menshevism Redeemed"
 SAH_menshevism_redeemed_desc:0 "The Mensheviks were violently driven out and persecuted by the Bolsheviks. We have decided to carry on their work and bring true Democratic Socialism to the nation!"
 SAH_restore_the_soviets:0 "Restore The Soviets"
 SAH_restore_the_soviets_desc:0 "The Workers Councils, or Soviets, will be reestablished as sub-national governments representing the needs of the workers and peasents."
 SAH_for_all_peoples_of_the_confederation:0 "For All Peoples Of The Confederation"
 SAH_for_all_peoples_of_the_confederation_desc:0 "The Confederation is not only made up of Russians but other peoples as well. We fight not only for them but all who suffer under the German and Japanese yolk!"
 SAH_a_fair_republic:0 "A Fair Nation"
 SAH_a_fair_republic_desc:0 "Without justice, democracy is meaningless!"
 SAH_less_is_sometimes_more:0 "Less Is Sometimes More"
 SAH_less_is_sometimes_more_desc:0 "Lenin and his chronies once slandered the Mensheviks as cowards and puppets. How wrong he was! It was the Bolsheviks who led the Union to poverty and defeat, not the Mensheviks! \nWe will right the wrongs of the Revolution and bring true freedom to the nation!"
 SAH_pragmatic_bolshevism:0 "New Bolshevism"
 SAH_pragmatic_bolshevism_desc:0 "The Bolshevik revolution was not for nought! Bukharin made many mistakes but he succeeded in modernizing and industrializing parts of the Old Union. We can learn from his mistakes and lead the Confederation to new heights!"
 SAH_restart_heavy_industry:0 "Kickstart Heavy Industry"
 SAH_restart_heavy_industry_desc:0 "One of Bukharin's primary mistakes was neglecting the development of heavy industry. This resulted in a lacking military industry that was unable to meet the needs of the war effort. We will ensure this error is not repeated."
 SAH_top_down_management:0 "Top Down Management"
 SAH_top_down_management_desc:0 "Centralized economic planning will enable rapid growth."
 SAH_old_union_nostalgia:0 "Old Union Nostalgia"
 SAH_old_union_nostalgia_desc:0 "The pre-war Soviet Union was the peak of development in many ways. We can exploit this to garner sympathy for our cause."
 SAH_the_slow_march_of_progress:0 "The Slow March Of Progress"
 SAH_the_slow_march_of_progress_desc:0 "There is more then one way to achieve a socialist society aside from violent revolution."
 SAH_the_prp_triumphant:0 "The PRP Triumphant"
 SAH_the_prp_triumphant_desc:0 "The PRP has achieved electoral success and now rules over a more or less united Russia."
 SAH_new_plan_for_russia:0 "A New Plan For Russia"
 SAH_new_plan_for_russia_desc:0 "With much of the Old Union's territories under our control, the PRP now seeks to draw up new development plans to reflect our growing nation."
 SAH_chase_the_west:0 "Chase The West"
 SAH_chase_the_west_desc:0 "The American sphere has achieved remarkable progress in a short period of time despite their internal struggles. We must catch up to them and perhaps one day exceed them."
 SAH_surpass_our_enemies:0 "Surpass Our Enemies"
 SAH_surpass_our_enemies_desc:0 "The Germans and Japanese will eclipse us no longer!"
 SAH_the_future_of_energy:0 "The Future Of Energy"
 SAH_the_future_of_energy_desc:0 "Nuclear power is highly effecient and significantly reduces our dependancy on hydrocarbons."
 SAH_beyond_petty_conflict:0 "Beyond Petty Conflict"
 SAH_beyond_petty_conflict_desc:0 "Politics should be streamlined, not spent on useless arguments."
 SAH_national_mobilization:0 "National Mobilization"
 SAH_national_mobilization_desc:0 "We are at war! The economy and populace must be mobilized!"
 SAH_oil_and_gas_program:0 "Confederal Oil And Gas Exploration Program"
 SAH_oil_and_gas_program_desc:0 "We have significant oil and gas reserves that remain untapped. An expidition will be launched to gain access to these critical resources."
 #rl regional
 SAH_no_more_games:0 "No More Games"
 SAH_no_more_games_desc:0 ""Military Democracy" was always a foolish idea that would collapse in on itself. It is time for the army to fully take charge of the nation, as it should."
 SAH_the_soldiers_place:0 "The Soldier's Place"
 SAH_the_soldiers_place_desc:0 "A nation may in theory survive without doctors or tax collecters but it absolutely cannot survive without soldiers to defend it. The soldier should be exhaulted for his contribution to our continued existance!"
 SAH_russias_plight:0 "Russia's Plight"
 SAH_russias_plight_desc:0 "Russia has fallen into darkness. We must fight to pull t out of the depths it has plunged!"
 SAH_duty_before_all_else:0 "Duty Before All Else"
 SAH_duty_before_all_else_desc:0 "Duty before laws. Duty before cares."
 SAH_a_nest_of_leeches:0 "A Nest Of Leeches"
 SAH_a_nest_of_leeches_desc:0 "Politicians have run this nation into the ground with their moronic squabbles. We must expunge these parasites!"
 SAH_loyalty_tests:0 "Loyalty Tests"
 SAH_loyalty_tests_desc:0 "All officials of the government will be thoroughly tested for disloyalty and treacherous thoughts."
 SAH_reshuffle_the_officer_corp:0 "Reshuffle The Officer Corps"
 SAH_reshuffle_the_officer_corp_desc:0 "Too many officers remain loyal to Andreev's old regime. We must minimize their power and ensure they do not launch a countercoup."
 SAH_good_soldiers_and_good_orders:0 "Good Soldiers Need Good Orders"
 SAH_good_soldiers_and_good_orders_desc:0 "Civilians cannot leade soldiers well. How can they? They understand nothing of war."
 SAH_the_noblest_calling:0 "The Noblest Calling"
 SAH_the_noblest_calling_desc:0 "We called to SERVE and we should be THANKFUL."
 SAH_the_civil_issue:0 "The Civil Issue"
 SAH_the_civil_issue_desc:0 "How much waste could have been avoided if we were previously not bound to the whims of self agrandizing idiots? \nWe must eliminate this critical weakness from our nation."
 SAH_trotskyite_filth:0 "Trotskyite Filth"
 SAH_trotskyite_filth_desc:0 "The Communist Party has already proven themselves unworthy of leadership ever since the Geat Patriotic War. Sedov and his goons are no different as much as they insist otherwise. It is time for them to go."
 SAH_for_russia_and_nothing_else:0 "For Russia And Nothing Else"
 SAH_for_russia_and_nothing_else_desc:0 "Workers of the world unite? \nPah! A fanciful idea. We must protect the Russian people and only them. To throw away lives for an impossible world revolution is criminal."
 SAH_meddling_technocrats:0 "Meddling Technocrats"
 SAH_meddling_technocrats_desc:0 "The PRP has been a thorn in our side since their formation. They plotted to remove the army from power. Let us return the favor."
 SAH_what_do_they_really_know:0 "What Do They Really Know?"
 SAH_what_do_they_really_know_desc:0 "Does a Technocrat really know more than anyone else? What qualifies them? A degree? A rank? Or perhaps their friendliness to the PRP? To give some nobody outsized power and expect him to always make the best decision is idiotic."
 SAH_correct_the_psr:0 "Correct The PSR"
 SAH_correct_the_psr_desc:0 "The PSR is right to defend the army's independent decision making but they forget we have no need for them. They can either follow us or resign."
 SAH_ban_all_political_parties:0 "Memorandum On Political Parties"
 SAH_ban_all_political_parties_desc:0 "And henceforth, all political parties, existing and yet to be formed, are banned. Only the army is truly worthy of decisionmaking."
 SAH_the_state_consolidated:0 "The State Consolidated"
 SAH_the_state_consolidated_desc:0 "We now fully control all the arms and levers of the government. None will oppose us within our borders."
 SAH_dogs_abroad:0 "Dogs Abroad"
 SAH_dogs_abroad_desc:0 "Too many degenerate and petty warlords persist."
 SAH_break_them:0 "Break Them"
 SAH_break_them_desc:0 "Those who still resist will be punished accordingly."
 SAH_drill_the_soldiers:0 "Drill Upon Drill"
 SAH_drill_the_soldiers_desc:0 "The army must be alert and disciplined at all times."
 SAH_the_armys_needs_come_first:0 "The Army Comes First"
 SAH_the_armys_needs_come_first_desc:0 "In all matters."
 SAH_ready_for_anything:0 "Ready For Anything"
 SAH_ready_for_anything_desc:0 "No enemy will surprise us. No obstacle will be insurmountable."
 SAH_reorganize_the_military:0 "Reogranize The Military"
 SAH_reorganize_the_military_desc:0 "The Military will be restructured into Legions, with greater autonomy than our current hierarchy."
 SAH_erase_the_warlords:0 "Erase The Warlords"
 SAH_erase_the_warlords_desc:0 "It will be like they never existed."
 SAH_fresh_blood:0 "Fresh Blood"
 SAH_fresh_blood_desc:0 "More recruits for the army."
 SAH_to_be_the_best:0 "To Be The Best"
 SAH_to_be_the_best_desc:0 "Who can oppose us?"
 SAH_the_legions_forged:0 "The Legions Forged"
 SAH_the_legions_forged_desc:0 "They stand vigilant."
 SAH_proclaim_the_legion_state:0 "Proclaim The Legion State"
 SAH_proclaim_the_legion_state_desc:0 "Russia will be one under the soldier."
 SAH_the_soldier_nation:0 "The Soldier Nation"
 SAH_the_soldier_nation_desc:0 "By the soldier for the soldier. As it should be."
 SAH_service_for_citizenship:0 "Service For Citizenship"
 SAH_service_for_citizenship_desc:0 "Only those who have served are worthy of participating in governance."
 SAH_assemble_new_legions:0 "Assemble New Legions"
 SAH_assemble_new_legions_desc:0 "The army legions have been successful in past operations. To account for our growig territory we should create new legions."
 SAH_legion_legislature:0 "Legion Legislature"
 SAH_legion_legislature_desc:0 "A unicaramel body of retired and active servicemen will be charged with passing legislation according to the Presidium's will."
 SAH_martial_judiciary:0 "Martial Judiciary"
 SAH_martial_judiciary_desc:0 "We will place soldiers in the position of judges to ensure laws are followed and disputes are settled swiftly."
 SAH_discourage_factionalism:0 "Discourage Factionalism"
 SAH_discourage_factionalism_desc:0 "Even soldiers are fallable. We must make effort to make sure that factionalism does not take root and undermine our government."
 SAH_unity_of_purpose:0 "Unity Of Purpose"
 SAH_unity_of_purpose_desc:0 "Together for Russia!"
 SAH_the_soldier_above_all:0 "Exalt The Soldiers"
 SAH_the_soldier_above_all_desc:0 "Who else can you rely on for protection?"
 SAH_crown_a_patriarch:0 "Crown A Patriarch"
 SAH_crown_a_patriarch_desc:0 "We have not forgotten our faith and dedication to the Lord's Church. We will gather the remaining bishops in our territory and have them appoint a new Patriarch of All-Russia. Russia will be united in faith once more!"
 SAH_a_righteous_cause:0 "A Righteous Cause"
 SAH_a_righteous_cause_desc:0 "With the Church on our side all will see our campaign to return Russia to greatness is just!"
 SAH_a_good_life:0 "A Good Life"
 SAH_a_good_life_desc:0 "Should the most loyal servants suffer? No! We will reward good and honest service properly. Needless suffering will bring us nowhere."
 SAH_symphonia:0 "Nova Symphonia"
 SAH_symphonia_desc:0 "The Church and State are two heads on one body. Together they are unstoppable. Apart? They are nothing."
 SAH_rewrite_the_laws:0 "Rewrite The Laws"
 SAH_rewrite_the_laws_desc:0 "National laws will be rewritten to better enforce order."
 SAH_punish_the_vagrants:0 "Punish Vagrancy"
 SAH_punish_the_vagrants_desc:0 "The dregs of society will be given what they deserve."
 SAH_society_of_order:0 "Society Of Order"
 SAH_society_of_order_desc:0 "Crime will be punished and service will be rewarded."
 SAH_to_the_strongest:0 "To The Strongest"
 SAH_to_the_strongest_desc:0 "If we lose then we are found wanting. It is up to be the most powerful nation on Earth."
 SAH_render_unto_thee:0 "Render Unto Thee"
 SAH_render_unto_thee_desc:0 "God favors the bold."
 SAH_russia_redeemed:0 "Russia Redeemed"
 SAH_russia_redeemed_desc:0 "We are now the sole legitimate government in Russia. Our future awaits! The Germans and Japanese will rue the day they turned on All-Russia!"
 #rl united
 SAH_the_struggle_continues:0 "The Fight Continues"
 SAH_the_struggle_continues_desc:0 "The reunification is not yet finished. Rightful Russian lands still remain outside our control!"
 SAH_war_and_peace:0 "War And Peace"
 SAH_war_and_peace_desc:0 "We must accept that peace is merely a transition state between wars. Russia must always be ready for the next war. \nAnd the next \nAnd the next \nAnd the next \nAnd the next \nAnd the next \nAnd the next"
 SAH_expand_the_legion_state:0 "Expand The Legion State"
 SAH_expand_the_legion_state_desc:0 "The Legion State will encompass all aspects of life!"
 SAH_a_soldier_is_a_soldier:0 "A Soldier Is A Soldier"
 SAH_a_soldier_is_a_soldier_desc:0 "Is this untrue?"
 SAH_the_gravity_of_whats_coming:0 "The Gravity Of What's Ahead"
 SAH_the_gravity_of_whats_coming_desc:0 "Bet on tragedy."
 SAH_eye_for_an_eye:0 "Eye For An Eye"
 SAH_eye_for_an_eye_desc:0 "They owe us a debt."
 SAH_blood_for_blood:0 "Blood For Blood"
 SAH_blood_for_blood_desc:0 "Going to get our hands wet."
 SAH_storms_coming:0 "Storm's Coming"
 SAH_storms_coming_desc:0 "Only we can see it coming"
 SAH_hard_rains_falling:0 "Hard Rains Falling"
 SAH_hard_rains_falling_desc:0 "No escaping what's coming."
 SAH_glorify_the_fallen:0 "Glorify The Fallen"
 SAH_glorify_the_fallen_desc:0 "Remember their worthy sacrifice!"
 SAH_gather_the_likeminded:0 "Gather The Likeminded"
 SAH_gather_the_likeminded_desc:0 "Many members of rival Russian governments share much of the Legion state's appraisal of our present situation. We should allow them to serve the rightful government of Russia."
 SAH_military_science:0 "Military Science"
 SAH_military_science_desc:0 "We must keep at the cutting edge of technology to maintain military superiority!"
 SAH_the_chaplains_purpose:0 "The Chaplain's Purpose"
 SAH_the_chaplains_purpose_desc:0 "Military chaplains will keep our legions united and strong!"
 SAH_why_dream:0 "Why Dream?"
 SAH_why_dream_desc:0 "When reality can be so glorious?"
 SAH_why_wait:0 "Why Wait?"
 SAH_why_wait_desc:0 "When victory lies dead ahead?"
 
 ## Events ## 
 SAH.1.t:0 "Strange Times"
 SAH.1.d:0 "I have never witnessed such beauty as the Siberian winter.\n\nSnow settles over Krasnoyarsk like a freshly cleaned sheet. Despite the chaos of these last several decades, the city has remained untouched by war—even growing a little.\n\nThe wind bites like a hound, angrily reminding me of the cold. I turn toward the administrative buildings where we have established our headquarters. The civilians are busy preparing for elections, but for us it’s just one more day of duty.\n\nA whole lot of effort blowing hot air: that’s what a politician’s job is. If it wasn’t for myself and my comrades, they wouldn’t have a single parapet to stand on—if they weren’t lynched by anarchists or Krylov and his merry band of loons, that is.\n\nBut a promise is a promise.\n\nAnd in the ruins of the Old Union, those really do matter.\n\n...\n\nI should say that in my next speech."
 SAH.1.a:0 "Stength, Bread, Freedom"
 SAH.2.t:0 "The People's Apocalypse"
 SAH.2.d:0 "A nation of writers, poets and scholars, the universities of Tomsk produce more manuscripts and manifestoes than most people care to count. Yet one piece, published anonymously, has begun to spread controversy far and wide throughout Siberia. 'The People's Apocalypse' tells the story of a faceless scholar's journey throughout the fall of the Central Siberian Republic, progressively encountering those who the author identifies as the four horsemen of the apocalypse: Ivan Zavoloko, Genrikh Yagoda, Alexander Pokryshkin and Nikolai Andreev.\n\nAwaking in Oyrotia after falling ill, the scholar finds the people reduced to babbling madmen, clawing out their own eyes and pulling apart their scalps from a pestilence brought to the land from Zavoloko, poisoning his people with an elixir named faith and weakening the body of the Republic. Chased away by the blind and corrupted, the scholar soon finds himself witness to the lands being set ablaze and the free thinkers abducted and persecuted by Yagoda as blue faced demons wage war against the people. Fleeing the slaughter they come upon endless roads buried under living skeletons, famine consuming the land from Pokryshkin's terrible betrayal, before finally witnessing Andreev's betrayal at Krasnoyarsk, piercing the heart of a nameless soldier embodying the noble Republic.\n\nCondemning the four men as bringing about the end of the promised People's Realm, the story ends with the land destroyed and all four being consumed by madness under the weight of their own evil, turning to stone as hideous reminders of their deeds, though it is left unanswered whether anyone will survive this end of days to remember what has been lost."
 SAH.2.a:0 "A Haunting Tale"
 SAH.3.t:0 "Mission To Tuva"
 SAH.3.d:0 "The truck rumbled toward its destination, a town on the edge of Krasnoyarsk’s zone of control. The People’s Revolutionary Council reminded Andreev much of his own clique.\n\nOperating in Tuva and western Mongolia, they had established a military-led regime much like he had. The similarities ended there, however; these officers had continued to steadfastly proclaim their allegiance to communism. Same uniforms, same salutes, but different prayers. This was where the Trotskyites came in. The local offshoot of the Communist Party was under the sway of Lev Sedov. Supposedly Sedov’s brand of communism was “ideologically incompatible” with the Council, or so Andreev had heard.\n\nThe general decided to bring him and his cronies along anyway. If a soldier’s a soldier, then a communist is a communist, right?\n\nThat aside, Andreev wasn’t too worried either way. The Councilists were too much of a gang of procedure addicts to try anything untoward. Besides, even if they refused, Andreev was confident he could take them on the battlefield any day."
 SAH.3.a:0 "Let Us Hope They See Sense"
 SAH.4.t:0 "Krasnoyarsk Offers Us Peaceful Unification"
 SAH.4.d:0 "General Andreev, accompanied by the son of Leon Trotsky, has met with [ROOT.GetLeader] and tabled a proposal to unify our causes. He proposes that our armed forces join his budding army, and he has agreed to let us—along with Lev Sedov—continue the Revolution’s cause in Siberia. This, however, would effectively end our independence; we would simply become another patch in Andreev’s patchwork regime."
 SAH.4.a:0 "Say Yes"
 SAH.4.b:0 "Say No!"
 SAH.5.t:0 "The People's Revolutionary Council Agrees To Unify"
 SAH.5.d:0 "The telegram had surprised him, he had to admit.\n\nThe People’s Revolutionary Council had agreed in principle to join his government.\n\nNo doubt Sedov would be pleased to have acquired new allies for his cause. General Pesterev had also been quite happy with the news when Andreev informed him no more than three minutes ago. Andreev chalked that up to the saved manpower and resources.\n\nNow maybe he would have time to finish that bottle he had been saving..."
 SAH.5.a:0 "Wonderful!"
 SAH.6.t:0 "The People's Revolutionary Council Refuses To Unify"
 SAH.6.d:0 "The result was disappointing and, though he would admit to no one, expected. Andreev turned over the telegram to his adjunct before ordering it to be sent to city hall, where the civilians would tear it over. Sedov, would be disappointed, but he’d probably forget about it this particular failure by tomorrow and move onto his next project. \n\nWhat scratched at Andreev’s mind however was General Pesterev’s reaction. One less war is always preferable, but  Pesterev almost seemed to... care. Did he have a secret girlfriend over there or something?"
 SAH.6.a:0 "Anyway, They Will Regret That"
 SAH.7.t:0 "Offering Oyrotia A Peaceful Solution"
 SAH.7.d:0 "“Oyrotia?”\n\n“Oyrotia, sir.”\n\nAndreev looked up from some extremely boring reports on arms stockpiles. “What does that have to do with anything?”\n\nLyashchenko shifted pensively. “We have been in contact with their government. As per your orders we have—”\n\n“Just get on with it. What are they saying?”\n\n“Well, they are willing to negotiate with us.”\n\n“Just negotiate?” Andreev sat up and spun his hand around like a helicopter. “Oyrotia’s army consists of two goats and a draft horse. What sort of leverage do they think they have?” He paused for a moment, blinked twice, and waved his hand bonelessly. “Fine. But don’t give them more than we’d lose bulldozing their shacks. Dismissed.”"
 SAH.7.a:0 "Ahhhh Diplomacy"
 SAH.8.t:0 "Krasnoyarsk Offers Us Peaceful Unification"
 SAH.8.d:0 "General Andreev has offered us protection in return for annexation. Do we trade freedom for safety?"
 SAH.8.a:0 "Yes!"
 SAH.8.b:0 "No!"
 SAH.9.t:0 "Oyrotia Agrees To Join Us!"
 SAH.9.d:0 "GENERAL ANDREEV STOP \n\nNEGOTIATIONS WENT WELL STOP \n\nOYROTIA GOVERNMENT AGREES TO UNIFY STOP \n\nSHOWN INTEREST IN ALIGNING WITH PSR STOP \n\nWILL SEND DETAILS SOON STOP"
 SAH.9.a:0 "And Not A Drop Of Blood Shed!"
 SAH.10.t:0 "Oyrotia Refuses Our Generous Offer"
 SAH.10.d:0 "GENERAL ANDREEV STOP \n\nNEGOTIATIONS BROKEN DOWN STOP \n\nOYROTIA REFUSES TO UNITE STOP \n\nTHEY MUST HAVE FAITH IN THEIR TWO GOATS AND DRAFT HORSE STOP"
 SAH.10.a:0 "A Shame... For Them Anyway"
 SAH.11.t:0 "The Broken Crown"
 SAH.11.d:0 "When our young nation was first declared by President Andreev on the steps of the Krasnoyarsk city hall, the Generalissimo promised the people that they now lived in a land of laws, of fair trials, of justice. Both for our own people, and for our enemies. Whilst most will never know that it occurred, today we have made true on that promise. Captured during an attempt to commit suicide following the capture of Kemerovo, and having spend the past seven days under guard in a military hospital, this morning the court martial of Marshal Nikolai Krylov began before a tribunal of seven army officers.\n\nFormerly having styled himself as Rurik II, Krylov bore no crown or regal regalia, instead having been dressed in his old army uniform on the orders of the President. With the charges declared as misconduct, looting, desertion, resisting arrest, abuse of controlled substances and treason against the Republic, the old Marshal entered his plea of not guilty. Throughout the afternoon elements of the 62nd Army, Grand Army of the Republic, and Krylov's own officer corps from Kemerovo provided testimony against him, Krylov providing only disjointed murmurings in his defense. Sweating, with difficulty concentrating and mild tremors in his hands, Krylov's legal representative made a final attempt to have him declared innocent by means of mental degeneracy, yet it fell on deaf ears, the verdict rendered as guilty on all counts after several hours deliberation.\n\nEscorted in silence outside, the sentence was carried out immediately at the hands of the firing squad. Not a king's death, but a soldier's one. When asked if he had any final words to speak, he spoke none, merely stiffening his spine and lifting his chin an inch toward the sky."
 SAH.11.a:0 "Goodbye, Comrade Krylov."
 SAH.12.t:0 "Fog Of Time"
 SAH.12.d:0 "How many times had this happened before? \n\nPesterev stood over the body of his once-superior and comrade. To his credit, Andreev had not gone quietly, but now he was dead. His body, riddled with bullet wounds, lay among his few remaining loyalists—every bit as dead as he was. Pesterev took no joy in this. Andreev had been an inspired, if overambitious officer, caught up in delusions of grandeur. Pesterev had only led this coup out of necessity. \n\nNecessity, yes. As the smoke rose into the sky, he vowed he would forge a truly strong Russia. \n\nNo more lies. \n\nNo more waste. \n\nNo more cycles of betrayal. \n\nHe would end it all here."
 SAH.12.a:0 "They Never Learn"
 SAH.13.t:0 "Elections In [ROOT.GetNameDef]!"
 SAH.13.d:0 "Krasnoyarsk has come alive these past few months. With politicians on parapets making speeches and fliers—well—flying everywhere, the first official general election of Andreev’s new regime has elicited pure, almost feverish excitement from the public. While there were concerns that “Military Democracy” would be seen as a farce, it appears the citizens of Krasnoyarsk have so far welcomed the change.\n\nThere are three parties in serious contention. First is the PSR, or Party of Social Reform. The PSR has been consistently pro-military and advocates traditionalism combined with federalism and a strong executive.\n\nSecond is the PRP, or the Party of Russian Progress. No less conservative, they differ from the PSR by advocating for greater civilian control. Their ultimate goal is a rationalist government dominated by technocrats—though it remains to be seen whether they can achieve this lofty ambition.\n\nFinally, there is the VKP, or All-Union Communist Party. While branches of the Communist Party survive all over the shattered remains of the Old Union not under Nazi domination, the Krasnoyarsk Communists are different: they consist primarily of the old Left Opposition and are dominated by their Chairman Lev Sedov—Leon Trotsky’s son—who is intent on carrying out his father’s will.\n\nHowever, there can only be one true winner in an election, and the masses will decide who it is."
 SAH.13.a:0 "The PSR Wins!"
 SAH.13.b:0 "The PRP Takes The Majority!"
 SAH.13.c:0 "The VKP Seizes The Mandate!"
 SAH.14.t:0 "Elections In [ROOT.GetNameDef]!"
 SAH.14.d:0 "Even with the present expansion of [ROOT.GetNameDef], there is still a constitutional requirement to hold elections every five years. As such, today marks the second scheduled general election.\n\nThe three main parties have been fighting desperately these past few months to curry favor with the citizens of Russia.\n\nFor now, it remains unknown who the winner will be—but we will find out shortly."
 SAH.14.a:0 "The PSR Wins!"
 SAH.14.b:0 "The PRP Takes The Majority!"
 SAH.14.c:0 "The VKP Seizes The Mandate!"
 SAH.15.t:0 "Elections In [ROOT.GetNameDef]!"
 SAH.15.d:0 "Even with the present expansion of [ROOT.GetNameDef], there is still a constitutional requirement to hold elections every five years. As such, today marks the third scheduled general election.\n\nThe three main parties have been fighting desperately these past few months to curry favor with the citizens of Russia.\n\nOf note, the VKP has recently ousted its longtime chairman Lev Sedov; the Trotskyites have been whittled down to a powerless minority by the flood of new members arriving from every corner of the Union.\n\nThe party has therefore moderated its platform and is now openly split between the so-called New Bolsheviks and a revived Menshevik wing.\n\nWho will win today’s election? We are about to find out..."
 SAH.15.a:0 "The PSR Wins!"
 SAH.15.b:0 "The PRP Takes The Majority!"
 SAH.15.c:0 "The VKP Seizes The Mandate!"
 SAH.16.t:0 "Elections In [ROOT.GetNameDef]!"
 SAH.16.d:0 "Russia is finally re-establishing itself as a power truly worthy of respect.\n\nAll over the Confederation, citizens are heading to voting booths to support the party of their choice.\n\nTruly, this is a clear sign our unorthodox democracy has proven itself indubitably worthy of laurels.\n\nVictory to Liberty and Russia!\n\n\n\n...Oh, yes. The winner of the election is..."
 SAH.16.a:0 "The PSR!"
 SAH.16.b:0 "The PRP!"
 SAH.16.c:0 "The VKP!"
 SAH.17.t:0 "Sedov Reveals Himself"
 SAH.17.d:0 "They\n\nThey said\n\nThey said your father was wrong. Insane. A madman. But you knew the truth.\n\nDidn’t you, Mr. Sedov?\n\nIt took many years of careful preparation and effort; careful maneuvering and luck. But here you are.\n\nAndreev’s resistance did not last long. He and his loyalists were caught off guard. He had not expected his top officers to side with you. That too had taken time and effort, but you pulled it off as you always have.\n\nWould your father approve of your methods? You are certain he would; for the Revolution everything is justified.\n\nAnd until there are no nations at all, until the proletariat is united under socialism, you must fight.\n\nAnd fight you will."
 SAH.17.a:0 "Just One More Betrayal..."
 SAH.18.t:0 "Menshevism Returns"
 SAH.18.d:0 ""Does anyone in the Congress truly support a Democratic Russia?" \n\n"I think not! The PSR are all too happy to let themselves be ruled by the army. The kleptocrats in the PRP are no better and would rather create a government ruled by their cronies! And what of us? The All-Union Communist Party? We have allowed ourselves to be led around by old fogies chasing impossible goals. Permanent World Revolution? Pah! Utter nonsense!" \n\n"We need reform, not hopeless dreams! We need liberty and equality, not senseless bloodshed and tyranny. Comrades, I ask that you support a new VKP and reject the old dogma that has dragged us down for so long!" \n\n The speech drew rancorous applause. Lev Sedov sighed silently in his seat as Larisa Bogoraz mercifully concluded her speech. She and her fellow "Mensheviks," as they had recently dubbed themselves, had been causing a stir within and without the party. Worse still, even those who were not Mensheviks themselves supported her message of change. These "New Bolsheviks" sought to implement communism by working through Military Democracy, not against it as Sedov had plotted. \n\nSuddenly, Lev Sedov felt very old. His time as Chairman was coming to a close soon. His ambitions—his father's ambitions—would remain unfulfilled. \n\nForever."
 SAH.18.a:0 "I Have Not Forgotten You"
 SAH.19.t:0 "A New Leader Of The Communist Party"
 SAH.19.d:0 "The VKP has been thrown into turmoil! \n\nFacing calls to resign and an endless string of leadership challenges, Lev Sedov has resigned from his post as Chairman of the VKP at 0900 this morning. \n\nWith his departure, the leadership of the VKP is now in contest for the first time in over a decade. \n\nTwo factions are in contention to take leadership of the party. First are the New Bolsheviks, led by the aging but undiminished Karl Radek. Pragmatists in character, they seek to bring about the Bolshevik ideal without violently overthrowing the Confederation. Second are the Mensheviks. Led by the firebrand Larisa Bogoraz, the Mensheviks seek to emulate their forebears and intend to pivot the VKP towards democratic socialism. \n\nThe victor will be determined in the coming hours..."
 SAH.19.a:0 "The Mensheviks Win Out"
 SAH.19.b:0 "The New Bolsheviks Take Power"
 SAH.20.t:0 "Government Collapse!"
 SAH.20.d:0 "Due to factors within and without their control, the current government has failed to maintain even a modicum of public support. \n\nHence, the Russian Congress has held a successful no-confidence vote leading to snap elections. \n\nThe snap elections will indubitably be won by the second most popular political party."
 SAH.20.a:0 "The People Choose The PSR"
 SAH.20.b:0 "The People Choose The PRP"
 SAH.20.c:0 "The People Choose The VKP"
 SAH.21.t:0 "The President Intervenes!"
 SAH.21.d:0 "Dissatisfied with the present political situation, President Andreev has exercised his presidential right to dismiss the present government and appoint a new one of his choosing. \n\nOne wonders if the public will approve of such an exercise of power."
 SAH.21.a:0 "Andreev Taps The PSR To Form A Government"
 SAH.21.b:0 "Andreev Taps The PRP To Form A Government"
 SAH.21.c:0 "Andreev Taps The VKP To Form A Government"
 SAH.22.t:0 "Officers Of The People's Council Join Our Ranks"
 SAH.22.d:0 "With the People's Revolutionary Council destroyed, many of the officers formerly tied to the nascent regime have been set adrift. \n\nExercising his impressive negotiating skills, President Andreev has managed to convince many of them to enter into the ranks of our growing army. No doubt their service will be a boon to our reunification efforts."
 SAH.22.a:0 "Excellent"
 SAH.23.t:0 "Rule By The Best"
 SAH.23.d:0 "WORKING FOR YOU – WORKING FOR FREEDOM \n\nDEMOCRACY AND REASONABLE LEADERSHIP \n\nWE WATCH RUSSIA – YOU WATCH THE STARS \n\n"Don't like this last one," Basil nodded towards the offending slogan, "Too uhhh fascistic – autocratic, something a German would write." \n\nThe printer paled. "We've already printed 2000 copies! What will we do with them? I don't have the rubles to waste!" \n\n"Dunno. Maybe you can sell them to the Communists? They love this kind of nonsense," an angstrom of silence, "No wonder they lose elections.""
 SAH.23.a:0 "As It Should Be"
 SAH.24.t:0 "A Hidden Army?"
 SAH.24.d:0 ""General Pesterev." \n\n"President Andreev, sir. How may I serve you?" \n\nAndreev thought for a moment, and then asked, "Is there a secret army?" \n\nPesterev looked dumbfounded. "Excuse me, sir? What do you mean?" \n\n"There have been - absurd rumors that a hidden organization controls large swathes of the army." \n\n"This is the first time I have learned of this supposed conspiracy. It sounds absurd, frankly. What would this secret army supposedly wish to accomplish?" \n\nAndreev smiled. "I can think of a few reasons." \n\n"I-" \n\n"Ah, forget about it, it's probably all nonsense anyway," Andreev shrugged. "But always best to keep an eye on these things. I've learned they're often more real than you think." \n\nPesterev blinked. "...I suppose so.""
 SAH.24.a:0 "Disturbing"
 ## Flavor Events 
 SAH_flavor.1.t:0 "A Message From The President…"
 SAH_flavor.1.d:0 "“Tonight the President will deliver a message to the entire nation, in which he will give a rundown of the changes our country has undergone over these transformative years of our lives. We hope it will be heard—or even watched—by all of our people, for whom he dearly and deeply cares…” Those were the words the modest family of four in Chelyabinsk heard from their newly issued, nationally produced radio. They had never expected to live under such a president, yet they were grateful nonetheless. Then, suddenly, the father told the others to listen closely, because the broadcast was about to begin.\n\n“Dear Russian people, dear citizens of our Republic, which God, Christ, and the Holy Spirit have blessed on this wonderful day. I wish to deliver a clear message to all of you. We have walked a long path to reach the miracle we are now living—a place where we are truly free, where no man, from the Boyar to the Tsar, from the Führer to the General Secretary, may dictate how we feel, how we breathe, or how we live the lives we fought so hard to protect. And yet, we still face a menace from the West—a menace with a name and a face, and it is called…”\n\nAnd so the family kept listening, intrigued by what their future might hold: another era of promised liberty, guided by the trust they placed in their president, or by the legacy of the institutions he would leave behind. As he listened, the father turned a single thought over in his mind.\n\nOnly time will tell whether the radio or the man will last longer."
 SAH_flavor.1.a:0 "Only Time Will Tell"

 
