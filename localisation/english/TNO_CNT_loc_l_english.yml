#Events
CNT_wars.1.t:0 "Honestly"
CNT_wars.1.desc:0 "Now, anarchy seems all well and good on paper. “Total freedom, sign me up! Death to the bourgeois!” you might shout. But it isn’t always sunshine and burning churches and the like. At HQ last Friday, there was a huge fight. Two idiot commanders were going at it over supplies. Comrades, they were not! These two knuckle-draggers started beating each other over ammo and bandages! Now, when I was in the Iberian army, there’d be someone above us deciding who gets what. But we are enlightened, my revolutionary brothers and sisters. We are a democratic military. What does that mean? \n\nWell, it’s quite simple! Nothing gets done!"
CNT_wars.1.a:0 "Is This The Price Of Democracy?"

CNT_wars.2.t:0 ""
CNT_wars.2.desc:0 "In the same regional HQ, the same two officers from before are arguing, this time over gun distribution. This time, however, a woman cuts in on the conversation and leads them to a small office with a handful of people working over files and archives. The three sit down and after the officers are properly identified, the woman gives another colleague a handful of papers. After a short while, in which the officers have begun arguing again, the colleague returns and tells the officers how the distribution is going to work, based on the information that HQ has about their units."
CNT_wars.2.a:0 ""

CNT_wars.3.t:0 "United Front?"
CNT_wars.3.desc:0 "Newly minted “Corps Commander” (he wasn’t aware they had formed any Army Corps yet) Emmanuel was feeling quite frustrated. \n\nIf the Popular Front had consisted of only good and disciplined communists, the war would be a cakewalk. Semantics on Bukharinism and Revisionism aside, a Communist could be trusted to follow orders and do what needed to be done. \n\nYet, he was not in this fantasy land. He was stuck working with the CNT. They were anarcho-syndicalists, whatever that meant, and they never let you forget it. \n\nBut to him, they would always be a raging mob of lunatics. Such chaos only invited reaction. The CNT had no revolutionary discipline; no vanguard. Hell, last week, if they seized control, all would be lost. He was sure of that. \n\nBy God, a few days ago, he discovered one of their regional militias was commanded by a woman, for God’s sake. A woman! \n\nAt the very least she was easy on the eyes... \n\nNo! What was he saying? A true Communist has no thoughts of such things!"
CNT_wars.3.a:0 "What Would Marx Say!?"

CNT_wars.4.t:0 ""
CNT_wars.4.desc:0 "Event about a new training program being implemented with more physical training and combat theory classes for even low rank officers."
CNT_wars.4.a:0 ""

CNT_wars.5.t:0 ""
CNT_wars.5.desc:0 "Two officers are reviewing a bunch of possible candidates for promotion, most are average and only a couple of them are good, but with many spots to fill they decide to get the top 5 and begin the process of promotion"
CNT_wars.5.a:0 ""

CNT_wars.6.t:0 "Servant Of The Masses"
CNT_wars.6.desc:0 "The village commune had been formed without a hitch, but he wished he could say the same for what came after. \n\n“What is all this?” Alejandro gestured to a massive pile of papers sitting at his desk. \n\n“Grievances, concerns, and suggestions from the members of the commune,” Comrade Daniel replied, “We took them down during the assembly yesterday. The one you were too sick to attend.” \n\nHe grimaced. “Don’t remind me,” he thought; he really should cut back on his alcohol consumption. \n\n“Well, better get to work,” Daniel stated matter-of-factly. “I recall most of them had to do with whose cows graze where.” \n\n“Great.” \n\n“It is the reality of running a commune. We serve.” \n\nAlejandro sighed but said nothing more."
CNT_wars.6.a:0 "Because He Knew Daniel Was Telling The Truth"

CNT_wars.7.t:0 ""
CNT_wars.7.desc:0 "A PSAN militia patrol is doing a round looking for “subversives” that have been putting up anti-revolutionary propaganda. After a while they find a couple of men with said propaganda and a chase ensues. The finale is up to the writer."
CNT_wars.7.a:0 ""