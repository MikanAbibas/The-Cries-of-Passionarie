 GRE_BOG_info_tooltip:0 "With our government stable, we can now focus on maintaining our country. Yet with stability comes expectation. We now must pay attention to the needs, demands, and support of our citizens, and the departments of state power. \n\nThe §RLaos§! comprise our citizens. Within this group are the §OErgates§!, our workers; the §CDianooumenoi§!, our scientists and engineers; and the §WElit§!, those of influence and wealth. The §BKratos§! include the §gStratos§!, our soldiers; the §YEkklisia§!, the church; and the §GGrafeiokrateia§!, the bureaucracy. \n\nWe must maintain their support, or there will be drastic consequences."
