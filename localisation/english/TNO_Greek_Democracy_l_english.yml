 Greek_democracy_helpers.1.t:0 "Election Day"
 Greek_democracy_helpers.1.d:0 "Following months of debates, speeches, politicking, and campaigning, the big day has finally arrived. As volunteers across the nation begin opening voting booths and counting ballots, candidates and voters settle around radios and street corners to await the results.\n\nAmidst the many elections for mayors, governors, and other elected bodies, the main focus rests on the general election and on who will lead Greece through the coming years.\n\nAs votes are tallied and ballots counted, it is clear the winner of the [GetYear] election is..."
 Greek_democracy_helpers.1.a:0 "Results in decisions"
 Greek_democracy_helpers.2.t:0 "Hiding Election Results"
 Greek_democracy_helpers.2.d:0 "As the victors celebrate and the losers mourn, the many polls which were a staple during election season have quickly faded from the forefront. While some continue to run, measuring public opinion on everything from voter satisfaction to the latest scandals, most have been shuttered, awaiting the next election cycle.\n\nThe many lessons learned from this year's election polling will soon be applied to the next, as experts and amateurs continue to look for ways to improve upon accuracy and reduce bias throughout the polling process."
 Greek_democracy_helpers.2.a:0 "Hopefully they'll be more accurate next time around."
 Greek_democracy_helpers.3.t:0 "Election Year"
 Greek_democracy_helpers.3.d:0 "The people of Greece are gearing up for election season. An idea once unthinkable scant decades before, now it is up to the Greek people to decide the fate of their nation and their leaders.\n\nPolitical parties, both big and small, are preparing their supporters and their backers across the nation. Thousands of volunteers, campaign staff, and candidates make ready to depart to the rallies, tours, speeches, and debates that will dominate the headlines for the coming months. Candidates will be scrutinized, issues debated, and at its end, millions of voters will be able to make their voices heard by the powers-that-be."
 Greek_democracy_helpers.3.a:0 "The EDA; fighting for the working man!"
 Greek_democracy_helpers.3.b:0 "The ERE; building better tomorrow!"
 Greek_democracy_helpers.3.c:0 "The EPEK, for a strong and sovereign Greece!"
 Greek_democracy_helpers.3.e:0 "The Kadets, to a brighter future!"
 Greek_democracy_helpers.3.f:0 "The VNS; Shulgin will show us the way!"
 Greek_democracy_helpers.3.g:0 "The NTS, for strength and stability!"
 Greek_democracy_helpers.3.h:0 "The LPR; For a better Greece!"
 Greek_democracy_helpers.3.i:0 "For the Army, and the Rodina!"
 Greek_democracy_helpers.4.t:0 "Polling Updated"
 Greek_democracy_helpers.4.d:0 "Polling in Greece is an imperfect art, an unfortunate consequence of the destruction and turmoil of decades past. Yet, the introduction of democracy to a large population has brought with it quick development in the field. Monthly and weekly polls conducted by newspapers and new polling organizations have allowed campaigns, candidates, and the wider public to measure the popularity of candidates and their ideas.\n\nWhile struggling to balance bias, location, under-representation, and many other matters of concern, polling remains the only way to gauge a campaign's performance until the ballots are cast on election day."
 Greek_democracy_helpers.4.a:0 "Time to check in on the horse race."
 Greek_democracy_helpers.5.t:0 "The End of Election Season"
 Greek_democracy_helpers.5.d:0 "The people of Greece have decided. The last of the ballots have been counted, and the winners of the [GetYear] election decided. The victors have made their speeches, thanked their voters, and have begun to focus energies towards the task of governance.\n\nReporters and Journalists have returned to the regular crime, scandal, and fluff pieces pushed aside during the election. Party machines have begun shutting down, ads removed, and campaign posters and items put in storage for future use. Soon the campaign will become a distant memory, something for historians and political strategists to look back on in the future.\n\nAfter all, plans are already being drawn for the next election cycle, for when the whole process will begin again."
 Greek_democracy_helpers.5.a:0 "Candidates and Voters, you have done Greece proud!"
 Greek_democracy_helpers.6.t:0 "The [GetYear] General Election"
 Greek_democracy_helpers.6.d:0 "Following months of debates, speeches, politicking, and campaigning, the big day has finally arrived. As volunteers across the nation begin opening voting booths and counting ballots, candidates and voters settle around radios and street corners to await the results.\n\nAmidst the many elections for mayors, governors, and other elected bodies, the main focus rests on the general election and on who will lead Greece through the coming years.\n\nAs votes are tallied and ballots counted, it is clear the winner of the [GetYear] election is..."
 Greek_democracy_helpers.6.a:0 "Let the best candidate win."
 Greek_democracy_helpers.61.t:0 "The [GetYear] General Election"
 Greek_democracy_helpers.61.d:0 "Following months of debates, speeches, politicking, and campaigning, the big day has finally arrived. As volunteers across the nation begin opening voting booths and counting ballots, candidates and voters settle around radios and street corners to await the results.\n\nAmidst the many elections for mayors, governors, and other elected bodies, the main focus rests on the general election and on who will lead Greece through the coming years.\n\nAs votes are tallied and ballots counted, it is clear the winner of the [GetYear] election is..."
 Greek_democracy_helpers.61.a:0 "Let the best candidate win."
