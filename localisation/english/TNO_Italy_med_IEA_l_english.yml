 ### Italian East Africa ideas the rework referenced - names and descriptions are the rework's own.
 IEA_the_flower_of_the_empire:0 "The Flower of the Empire"

 IEA_the_true_italy:0 "The True Italy"
 IEA_the_true_italy_desc:0 "The Red Farce in Rome is simply not Italy. Their state is illegitimate, and the true government of Italy has been forced to convene in Asmara, Eritrea instead. Though the members of the Kingdom know this to be true, it will take much more to convince the nations of the world of the true state of affairs.\n\nIf the world is to take the Kingdom seriously again, it will have to start with reconquest of the Empire. No matter who is the rightful ruler of Italy, a march on Rome from Asmara now could end only in disaster. When Amadeo reigns over the Horn of Africa once more, the superpowers of the world will be forced to take heed of his claims of sovereignty, and from there, it's just a march over the remainder of the Empire and back to Rome."

 IEA_the_exile_king:0 "The Exile King"
 IEA_the_exile_king_desc:0 "No longer the true authority in Asmara, now-King Amadeo remains the final burning torch of the Italian Empire. Having fled from Addis Ababa in the wake of the collapse of the colonial apparatus with his most loyal ministers, the King was left lost and desperate as the Empire's collapse radiated out from its heart to all corners of the earth.\n\nAn otherwise dysfunctional assortment of fascists, monarchists and simple patriots have rallied beneath his banner, and all know that if it were not for his presence here and now, the grand coalition to reclaim the homeland would never have held together for longer than a moment. He may not control the movement, but Amadeo bears a great weight on his shoulders all the same."

