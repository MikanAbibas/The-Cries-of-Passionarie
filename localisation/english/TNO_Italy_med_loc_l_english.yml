 ###=====| h) Focus Trees |=====###
 ### Starting Tree ###
 ITA_cost_effect_tt:0 "\n§YCost:§!\n" #Don't know where else to put this
 ITA_forty_years_of_fascism:0 "Forty Years of Fascism"
 ITA_forty_years_of_fascism_desc:0 "The nation of Italy has fallen from glory more times than any other nation has ever even aspired to greatness. Rome ruled the world, then fell. The Italian city-states dominated the Renaissance, then fell. So too it came to pass that the Kingdom of Italy, which, while never ruling the world, was a fair power in its own regard, fell.\n\nA stab in the back, a knife then salt in the wound, Italy never received the glory it deserved from its role in defeating the Germans in the first World War. Then came the savior, the great strongman to restore Italy to its deserved heights, to that peak of greatness that were but faint memories.\n\nBenito Mussolini came to Italy with a promise of Rome. A Caesar to some, a Nero to others, he shared his truth with these two emperors, in that he once again had Italy a dominant power over the Mediterranean. Most of the Middle East and North Africa lies under the Italian boot, though colonial rule was never quite as fashionable as these new Italian boots.\n\nThe Italian Empire has not been greater for millennia. What is more important than anything else, that propels Italy above even the greatest empires with their gold-paved streets, is the new gold, that black gold, the most precious resource in all Earth, oil. An incredible amount of the world's oil lies within the Italian Empire, giving it the fuel to power its economy, in both ways. Come any unrest, come any dissent against Il Duce, Italy is great and Italy is powerful for as long as the oil flows."

 ITA_the_empires_wealth:0 "The Empire's Wealth"
 ITA_the_empires_wealth_desc:0 "The fate of Italy has been tied with the Mediterranean for as long as there has been an Italy, and perhaps as long as there has been the Mediterranean. Food, trade, recreation, all gifted to Italy by its greatest resource. There was a reason the Romans fashioned it Mare Nostrum, "our sea", as Italy was kin with it. And then the Germans destroyed it.\n\nOne of the world's largest mistakes, an ill-conceived idea by the Germans to create living space and leave their literal mark on the world, Atlantropa's devastation to Italy and the Italians is unlike any other. Beautiful sea replaced by endless salt flats, completely and utterly useless in every way. The sad sight of what was once one of the most beautiful cities in the world, Venice, surrounded by hideous salt flats in every direction, became the symbol for the sheer devastation brought to Italy by Hitler's ego.\n\nThe damage to Italy was more than aesthetic. Trading ships, surprisingly, have a hard time going over salt flats. Though the land was soft, and relatively easy to dig canals through, digging a canal through the salt flats to every city of Italy is not the most efficient idea, and should never have been necessary.\n\nLuckily for Italy, there are more ways to make wealth than trade. The colonial empire spans across a decent expanse of three continents, and is filled with resources. The agricultural and mining products are good enough, but the most important of all is oil. Fueling the new, fancy cars, and the factories creating Italian goods, and making an incredibly valuable export, not even the destruction of our sea can stop the economic expansion brought by black gold."

 ITA_expand_ala_littoria:0 "Expand Ala Littoria"
 ITA_expand_ala_littoria_desc:0 "The Italian Empire is large indeed, sprawling across the Mediterranean and beyond into the Middle-East. Unfortunately, our empire's grandeur and territory far exceed its infrastructure, leaving us over-stretched and some regions dangerously isolated.\n\nIn the days of Rome, the construction and maintenance of roads bound the empire together, allowing for the efficient movement of both armies and commerce. Let us make the old adage that 'all roads lead to Rome' true again and continue our plans to expand Italian infrastructure."
 
 ITA_iri_plans:0 "IRI Plans"
 ITA_iri_plans_desc:0 "It cannot be denied that the Italian economy is in shambles and has been for some time. Atlantropa has wreaked a terrible cost on our country, choking off vital trade and devastating coastal communities. After much deliberation, il Duce has decided that the Institute for Industrial Reconstruction is our best option for digging ourselves out of this hole.\n\nWe shall immediately begin a major program of public works to revitalize some of the more decrepit regions of our empire with new roads, factories and other long-needed developments. If need be, we shall spend and build our way out of this crisis and into a brighter future."

 ITA_the_oil_must_flow:0 "The Oil Must Flow"
 ITA_the_oil_must_flow_desc:0 "Our hegemony over much of the Middle East and North Africa has made us master of the black gold that makes the world turn: oil. It is through this that we have been able to maintain our precarious position as the unofficial "fourth" great global power, our budget reliably buoyed by trade in this most valuable commodity with dozens of states across the world. Of course, this has come at what some might describe as a "cost".\n\nThe hard truth of the matter is that without Ente Nazionale Idrocarburi we would be utterly adrift as they hold the government sanctioned monopoly on the resource. It would not be an overstatement to say that the managerial skill of ENI's current chairman, Enrico Mattei, is what maintains the Italian Empire."
 ITA_the_oil_must_flow_tt:0 "Add §G20§! £oil_texticon  to our stockpile."

 ITA_reviewing_the_social_state:0 "Reviewing the Social State"
 ITA_reviewing_the_social_state_desc:0 "Fascism is a deep and complex ideology. The one guiding aspect, as defined by the original Italian aspects, is total loyalty to the state. Sometimes, complexity can just be used as a facade of confusion. Truthfully, the Italian state has oscillated back and forth between devotion to corporatism, and an image of populism, a great unifier of the Italian workers. The result of this has often turned out to not be making both corporatists and populists happy, but neither.\n\nThe workers, despite socialist and communist ideology being heavily repressed, remain discontent. Illegal strikes are a common occurrence. Pamphlets promoting counter-state ideology are constantly being distributed on the black market, and in some cases, even in the open.\n\nThough some in the party would certainly like to do so, gunning down workers that aren't happy with their circumstances tends to shockingly lead to the surviving workers not liking us. The reality is that the best way to deal with discontent is to give them a few crumbs of appeasement. Public education, public healthcare, decent pensions, and other welfare programs given to workers are enough to at least stop a decent portion of strikes, and diminish the enthusiasm for underground leftist groups.\n\nSome claim that these social programs are a betrayal to fascism, an acquiescence to the leftists. These people refuse to see the plain fact that this is what is necessary to prevent leftism from becoming even more powerful. It remains to be seen if it is enough."

 ITA_another_battaglia_del_grano:0 "Another Battaglia del Grano"
 ITA_another_battaglia_del_grano_desc:0 "It was under Duce Mussolini that the first "Battle for Grain" was carried out in the 1920s. In a time when Italy was woefully behind in terms of its economy and quick action was required to establish an Italian autarky. It was thanks to measures like this and others that Italy was able to prepare itself for its eventual triumph in the Second World War.\n\nNow there is a different Duce at the helm, but once more a Battle for Grain must be fought with all the strength and determination of the first. Thanks to the great German folly of Atlantropa our farmers have been in a state of hardship for some time now. Ever greater subsidies have been dolled out, and each year more land is purchased and given over for the harvest. These policies have cost much, but we cannot now retreat from our past victories. We will not let German incompetence tarnish Italian successes!"

 ITA_the_empires_hegemony:0 "The Empire's Hegemony"
 ITA_the_empires_hegemony_desc:0 "Italy has long sought to achieve autarky and thus secure our position against reliance on other states' resources. The long-road to self-sufficiency for Italy runs through the Balkans, after all as our neighbours they are a natural sphere of influence for us.\n\nWe must continue our efforts to secure our hegemony over the Balkans before the Germans manage to drag them back into their orbit. The future of Italy depends on it..."

 ITA_might_of_the_regia_marina:0 "Might of the Regia Marina"
 ITA_might_of_the_regia_marina_desc:0 "If there is one thing the Empire deserves to take pride in, it is the Regia Marina. Our navy has come far indeed: it has been less than a century since unification and in that time we have established ourselves as one of the pre-eminent naval powers of the world. Where are our historical rivals now? The French fleet? Scuttled by the Germans and now no more than a shadow of its former self. The Royal Navy? Bloodied by us and Germans and now scattered to the corners of its remaining dominions. We are the sole power of the Mediterranean now, and we cannot let it be forgotten.\n\nRecently the Germans have begun to posture southward, and we know full well the danger of their Crimean fleets. Our allies too have made moves in the direction of the seas. They can all play with their toy boats as much as they'd like to, but some naval maneuvers ought to remind all that they float upon Mare Nostrum."

 ITA_our_close_enemies:0 "Our Close Enemies"
 ITA_our_close_enemies_desc:0 "We always knew the Nazis were arrogant, presumptuous, and never truly trustworthy. Did Ciano not warn Mussolini of this fact over and over again? Still, they had the smell of victory about them, and we must praise Mussolini for his foresight in aligning with their rising star.\n\nOf course, things began to change once our common foes were done away with. Then it was time to establish a new order between victors. Our mistake was putting our faith in German competence and that moment. Atlantropa was promised as a triumph over nature that would stun the world with its audacity and brilliance. It stunned the world, but in a very different way. With a single act our "ally" had sunk our economy and mutilated our Mediterranean. Of course they would offer no apology. Now we stand as rivals for Europe, and it seems as if the next battle shall be in the Balkans, a game of intrigue and diplomacy rather than outright war. For our future, we must be victorious."

 ITA_our_dubious_friends:0 "Our Dubious Friends"
 ITA_our_dubious_friends_desc:0 "When the dust settled after the flames of the second Great War, it had seemed that Italy and Germany would forever remain close-knit by the mutual glory of Fascism, that the bond of steel would truly be unbreakable.\n\nOf course, such was not to be. Following the disastrous Atlantropa project and the related economic crisis that affected all of Europe, relations with Germany soured quicker than the collapsing economy.\n\nIt was in this crisis that Ciano's greatest victory was borne; the Triumvirate. Established in the 50s, it was something of dreams: a mutual defense block between the regional powers of the Medditeranean - Italy, Turkey, and the newly-formed Iberian states. Together, it was possible to resist overwhelming German supremacy over all of Europe, and Italy seemed to once again be on the path to diplomatic success.\n\nThe winds of time have eroded the thin veneer of goodwill the nations of the Triumvirate had for each other - Turkey and Iberia nearly dislike Italy as much as they do the Reich, and the ever-worsening land disputes in Algeria and the Levant do not instill confidence in the alliance's prospects.\n\nNonetheless, they are still our 'allies,' and as such, we continue to form a united front to oppose the Germans - for now."

 ITA_our_distant_allies:0 "Our Distant Allies"
 ITA_our_distant_allies_desc:0 "Although the drums of the second world war have long since ceased, at least some of the friendships established have not yet faded. The Japanese Empire, finding themselves with an empire greater than ever before, have warmed to the Italian Empire.\n\nNamely, we enjoy a large amount of trade with the country - in exchange for giving much-needed raw resources, Japan receives our plentiful barrels of oil. There remains a surprisingly significant goodwill between us, and the continued incursions from the Americans and Germans has only served to strengthen these tendrils of friendship. For now, however, the official relationship between our two countries does not go much further than that - but many in both Italy and Japan believe that it is possible to go yet more in depth with our nation's relationship, but with the current state of affairs of our countries, it is just that - a thought. "

 ITA_the_malta_conference:0 "The Malta Conference"
 ITA_the_malta_conference_desc:0 "Every passing day, the tensions between the major countries forming the Triumvirate - ourselves, Iberia, and Turkey - grow ever more hot. Borders are being demanded redrawn, fees rearranged, military partnership lessened.\n\nFor the sake of the stability of Italy, much less the military alliance, these disputes must be resolved. We cannot afford to lose this alliance - doing so would mean being left alone, isolated, whilst the darkness of the Reich and Burgundy continue to creep into our sphere of influence.\n\nIn an attempt to put these long-standing grievances to rest, we will schedule a conference - located in the newly-expanded island of Malta, the neutral ground will allow for us to finally repair the cracks in our friendship, and continue to resist complete German supremacy over the European continent. At worst, we'll be right where we started - a rocky relationship, but a relationship nonetheless. Yet, ideally, this could finally stop the descent into collapse that the Triumvirate has been ongoing - in other words, the birth of a true friendship, made not out of mutual survival, but true mutual respect and affection for our nations.\n\nDreaming aside, this is a step that is necessary to take for the continued steadiness of our ever-more-important diplomacy with not only our sphere, but the world at large."

 ITA_the_empires_government:0 "The Empire's Government"
 ITA_the_empires_government_desc:0 "The ever-growing political gears at the heart of the Italian Empire are truly a sight to behold - webs of tangled figures, organizations, and brokers of power. Yet, at its heart, there lies one person: the Duce.\n\nAs is the core of the Fascist ideology, all the workings of the State, in one way or another, wind up at the desk of Galeazzo Ciano. Unlike the previous reign of Mussolini, from which the fires of Fascism had begun, this Duce has opted to drive Italy onto a new course: perhaps a fence-sitter, it has been traversing the middle road between the extremes of this new political order. Not hardline nor reformist by any means, Italy has trudged along under Ciano, the quintessential status quo remaining unchanged.\n\nIn the background, however, these very same political gears continue to shift: shadowy figures lurk in the background, outside of the wide view of the public - and even the Duce. All of varying ideologies, from the most hardline of Fascists to outright Bolsheviks, share one motive in mind: the fact that the slow stagnation that Italy has suffered must be stopped.\n\nThe Duce is not so worried, though. His grip on power remains sure; as long as nothing goes terribly wrong, this latest year shall continue on as usual."

 ITA_check_on_the_court:0 "Check on the Court"
 ITA_check_on_the_court_desc:0 "The relationship between the King and the Italian fascists has never been the warmest. Matters did not improve when Ciano became il Duce even as his rise heralded a minor Italian thaw. Rather, King Umberto has demonstrated, at most, tepid support for our regime, and has remained very suspicious of our plans for Italy and the empire.\n\nPresumably, Umberto would prefer that one of the democrats be in charge. However, so long as he stays quiet and does not interfere he is not yet a serious threat. We had best keep an eye on him though, and periodically check the court's temperature."

 ITA_check_on_the_gerarchi:0 "Check on the Gerarchi"
 ITA_check_on_the_gerarchi_desc:0 "Despite being the hierarch of the Italian state, the strongman to bring fascism together, it comes as a surprise to incredibly few that Ciano is far from the most dedicated fascist in the world. Releasing restrictions, making more concessions than would be typical, restraining from hardline dedication to the state, and even allowing some social welfare programs beloved by the left, Ciano's lack of dedication to the fascist cause has caused great dissent in the PNF.\n\nThe dissenters themselves are factionalized. There are the corporatists, who do not believe that Ciano is doing enough to let the corporations have their slice of the Italian pie. There are the more esoteric fascists, that do not appreciate the lack of guidance Ciano is providing for the glorious Italian man. There are the mainline fascists that have not joined the rest of them in the course of a thawing dictatorship. All of them have a distaste for Ciano more than their distaste for the others.\n\nThe dedicated fascists in the party are prominent, given the fact that they are often considered truer to the party's ideology than Ciano. However, they are not yet a devastating threat, and Ciano remains in power, keeping his ideas. Only the future knows what these dissidents will do to preserve the fascism they are so dedicated to."

 ITA_all_the_duces_men:0 "All the Duce's Men"
 ITA_all_the_duces_men_desc:0 "In spite of his skillful leadership, il Duce's opponents continue to grow in number. Ranging from hardline Fascists to the long-forgotten remnants of the Italian communists, Ciano's followers find themselves increasingly pressured. Il Duce must rally his followers and hold his position, despite the challenges."

 ITA_preparing_the_littorali:0 "Preparing the Littoriali"
 ITA_preparing_the_littorali_desc:0 "With the decades passing by under Fascism, the Catholic Church's once warm relations with the State have slowly but surely soured. Where there once stood an amicable friendship of what was the core of our nation, there now stands nothing more than a cold mutual existence - claiming that the State no longer follows the Christian values that came to define Italy as a nation, the Church has been sidelined, disregarded, and at times entirely ignored for the sake of the Fascist political system.\n\nMaintaining at least somewhat tenable relations with the Church is critical for the popular support of our regime, as the Church retains a significant amount of influence over the population, specifically the more rural regions of the country - perfect regions for the newest wave of partisans, fighters, and rebels against the State.\n\nAs such, we will be preparing a new wave of negotiation with the Catholic Church. Although nothing especially significant, this course of action hopefully allow us to better understand what exactly the Church desires at this current moment, as well as warm the ever-declining relationship."

 ITA_reports_from_the_ovra:0 "Reports from the OVRA"
 ITA_reports_from_the_ovra_desc:0 "The communists have always been a presence in Italy. Cramped urban living conditions, poverty that has never gone away, students that love nothing more than debating capitalism, and a state never quite effective enough to eradicate these movements. Still, the Fascist party has always held out to the hope that the constant infiltration and arrests made by the OVRA would be enough to destroy leftism in Italy. It isn't.\n\nStrikes are a common occurrence, despite the heavy repression on workers daring to organize. People read the Communist Manifesto in public places, without fear of reprisal. There are many underground currents, for every strain of Marxism you could possibly imagine. Unions outside of the state are organizing, pushing for diminishment of the power of the huge Fascist corporations and the expansion of the power of the worker outside of what the State has already granted.\n\nThe communists will always be a thorn in the side of Italy if things do not change. The current tactics of the OVRA are not enough to destroy the Left, and, if left unchecked, it is possible that if the situation gets worse, they would be in a prime stance to strike against the state. The preservation of Italian Fascism is based on ensuring these Marxist currents are destroyed."

 ITA_to_a_thousand_years_more:0 "To a Thousand Years More!"
 ITA_to_a_thousand_years_more_desc:0 "Whatever our current headaches, we must always remember that they pale in comparison to our ultimate triumph. We did what they said was impossible: a new Roman Empire, from the Alps to the waters of the Indian Ocean. Of course it was not easy to obtain - nothing that is worth anything ever is! Of course it has not been simple to maintain - no great empire ever is! Our struggle is only further proof of our resilience, our determination proof of our eventual successes. We don't need allies to keep us afloat any longer, we are the ones who prop others up now. We march into the future with confidence and certainty! For Italy! For the Empire! For the Duce!"

## Intro Tree Tooltips ##
 ITA_intro_tt.1:0 "We will begin preperations for the§Y Malta Conference§!."
 

### Post Malta Tree ###
 ITA_alone_once_more:0 "Alone Once More"
 ITA_alone_once_more_desc:0 "With the failure of the conference, the Triumvirate has dissolved and our country is now isolated, Suez being the only lifeline connecting us to the rest of the world. Not only that, but we are now surrounded by wolves: Iberia wants to take our territories in Algeria, and Turkey is already preparing to strike at the Levant.\n\nTo make things worse, the crisis has exposed many wounds in the very soul of our nation that had never been addressed. The interruption of trade with our former allies will jeopardize the already-sluggish economic recovery from Atlantropa, and the shame suffered by our Duce will only embolden those who wish to cast fascism aside.\n\nWe are alone now, a scared child clutching a dim candle as he desperately tries to find his way home. The light fades, and the dark encroaches: can we find a safe harbor before we are lost forever, or will we fall prey to the monsters lurking just outside our reach?"

 ITA_the_duce_alone:0 "The Duce Alone"
 ITA_the_duce_alone_desc:0 "It is widely known that the Triumvirate has been the brainchild of our Duce, Galeazzo Ciano.\n\nWith its dissolution, many - both inside and outside the government - are blaming him for our sudden international isolation: while criticism of the Duce is not unheard of, now even several high-ranking Gerarchi are publicly criticizing him, which makes it hard to keep things under control.\n\nOur hard-earned authority is slipping through his fingers, and the Duce himself is starting to doubt his closest advisors and confidants. We need to secure our grip over the party and the state, or we may face a challenge like never before!"

 ITA_out_of_the_palaces:0 "Out of the Palaces"
 ITA_out_of_the_palaces_desc:0 "It's evident that the greatest challenge to our Duce comes from the wider society. While the Gerarchi can be satisfied the usual way - some bribes and a few honors - this new wave of dissent is threatening fascism itself!\n\nThe OVRA has spent years identifying several organizations which pose a threat to our dominion over the minds and souls of the Italians. Many among these groups - such as Azione Cattolica - have been operating in the open thanks to their alleged nonpolitical nature and their ties to the church, while others - mostly leftist unions and partisan groups - act underground, helped by radicalized workers and intellectuals.\n\nWe may have been too lenient in the past, and it has been a mistake. It's time to deal with these threats the proper way: there can be no mercy for the traitors."

 ITA_non_abbiamo_bisogno:0 "Non Abbiamo Bisogno"
 ITA_non_abbiamo_bisogno_desc:0 "The catholic associations may seem less dangerous since they act in the open and are sometimes even recognised as nonpolitical charitable organizations, but this is exactly what makes them a threat like no other.\n\nWith their strong ties to the church, and sometimes even to more conservatives Gerarchi inside the PNF, they have been able to spread antifascist propaganda among the masses and escape rightful punishment. This ends now.\n\nThe leaders of Azione Cattolica, and other such bodies, will be arrested, and membership shall be considered equal to that of the banned socialist parties. We do not need their charity: the state will provide for the poor and the weak, and elevate them into true fascist citizens!"

 ITA_qui_non_si_parla_di_politica:0 "Qui Non Si Parla di Politica"
 ITA_qui_non_si_parla_di_politica_desc:0 "In a fascist state, there is no need for political discussion. The state operates according to the wishes of our glorious Duce, who acts on behalf - and in the interest - of the entirety of the Italian people: discussing his choices, or even worse, criticizing them, is treason.\n\nSadly, many forget this basic principle, and believe themselves entitled to deem themselves worthy of leading Italy away from the comforting beacon of fascism, and into uncharted - and therefore dangerous - waters.\n\nUnrecognized trade unions and leftist intellectuals spread their lies in both factories and universities, forgetting that communism is as dead as the Soviet Union, and will not return. They need to be silenced, forever."

 ITA_oaths_to_the_duce:0 "Oaths to the Duce"
 ITA_oaths_to_the_duce_desc:0 "As Mussolini did to university professors and other important categories, it is time to impose binding oaths of loyalty to members of the state administration.\n\nNo longer will catholic snakes be allowed to use positions of power within the Empire to spread their lies and deceit: they will swear to serve our glorious leader above all else, and will be called to answer should they break it!\n\nA man is the same as his word, as they say, and we'll uphold the adage to its fullest. From now on, a broken word will result in a broken man, even if said person is a man of God..."

 ITA_expand_the_OND:0 "Expand the OND"
 ITA_expand_the_OND_desc:0 "The Opera Nazionale Dopolavoro is the fascist answer to worker unions and solidaristic organizations, providing health insurances and post-work entertainment such as family holidays and cultural events to millions of loyal fascist workers.\n\nIn order to avoid letting our precious workers being swayed by the false syreens of communism, the OND will be improved and expanded, so that no one will ever be able to say that the Duce does not care for the lower classes!"

 ITA_oceanic_crowds:0 "Oceanic Crowds"
 ITA_oceanic_crowds_desc:0 "A Duce is nothing without his people, and Galeazzo Ciano is no exception. In order to strengthen his eternal bond to the nation, he will take part to celebrations to the history and accomplishments of both fascism and Italians at large.\n\nThese oceanic crowds will not be mindless gatherings, however. No, they will be organized like Starace did for Mussolini, so that everyone understands that they are part of a greater whole, a beautiful whole.\n\nA fascist whole..."

 ITA_the_enemies_closer:0 "The Enemies Closer"
 ITA_the_enemies_closer_desc:0 "While the popular opposition to fascism is large, it is mostly unorganized, and divided among squabbling leftist and centrist tendencies. Therefore, our greatest concern is the PNF and its score of dissenting Gerarchi.\n\nIt is not unknown to us that many hardliners, who have criticized Ciano vehemently after the failure of the Malta conference, have strong ties to the extremist fringes of the Blackshirts and the armed forces, which poses a danger like no other to the Duce.\n\nDai nemici mi guardo io, dagli amici mi guardi Iddio..."

 ITA_reshuffle_the_PNF_secretariat:0 "Reshuffle the PNF Secretariat"
 ITA_reshuffle_the_PNF_secretariat_desc:0 "It is widely known that the current Secretary of the PNF, Alessandro Pavolini, is among the most vocal critics of our Duce. From his position of power, we know that he's organizing the dissent among the other Gerarchi, and this makes him our greatest enemy in the party.\n\nIn order to reduce his growing influence, we shall reshuffle the Secretariat and choose a more complacent man to represent Ciano in the PNF. We know that Pavolini will still try to get back at us for this, but it will be a step forward nonetheless..."

 ITA_the_doctrine_of_fascism:0 "The Doctrine of Fascism"
 ITA_the_doctrine_of_fascism_desc:0 "While fascism was, at its origins, very close to socialism, as most young things it has matured into what it is now. Despite this seemingly obvious concept, there are some spoiled children who refuse to grow up despite being well beyond half a century old.\n\nEttore Muti, one of the participants to the taking of Fiume, still tries to push forward the manifest of Sansepolcro and its outdated ideas. It is time to make it clear that Sansepolcro is a child's game, and as with all such things, it is high time that grown men forget about it and go on with their adult life."

 ITA_limit_balbos_influence:0 "Limit Balbo's Influence"
 ITA_limit_balbos_influence_desc:0 "Italo Balbo is, together with Alessandro Pavolini, one of the most outspoken critics of our Duce. With his ties to the air force and the wider military - especially the forces in the Middle East, where he served for many years - he is a dangerous opponent should it come to blows.\n\nCurrently he serves as the ambassador to Egypt, which while nominally being independent is in fact an Italian vassal. His position serves to spearhead all Italian control over the country, so that makes the former marshal of the air one of the most influential men in Egypt. If we take measures to "stop diplomats from overstepping their authority", we will certainly reduce his influence at home as well."

 ITA_silence_the_mystics:0 "Silence the Mystics"
 ITA_silence_the_mystics_desc:0 "While all of us are fervent believers in the tenets of fascism, there are some who take this to an embarrassing extreme. Niccolò Giani and his fascist mysticism have lately been vocal critics of Ciano's work, leaving their hallowed halls to take their critics to the party itself.\n\nPerhaps it's time that Giani and his cabal learn that religion - even fascist religion - have no place in politics. The current will be banned, and all adherents will be investigated to see whether they have been seriously plotting to overthrow the Duce..."

 ITA_the_younger_generation:0 "The Younger Generation"
 ITA_the_younger_generation_desc:0 "It is evident that many among the old guard have strayed from the path of the righteous, and started pursuing their own goals rather than those of the nation. Perhaps it is time to take a clean slate, and start writing a new history for the PNF\n\nIt hasn't gone unnoticed to us that, in the lower ranks of the party bureaucracy, there are many willing to take up higher offices for the good of Italy. People like Almirante or Rauti will be better suited to lead fascism into a new age, one where Galeazzo Ciano rules supreme..."

 ITA_the_country_alone:0 "The Country Alone"
 ITA_the_country_alone_desc:0 "With the dissolution of the Triumvirate, Italy is internationally isolated, and surrounded by potential enemies. Without allies in the Mediterranean, we need to guard all borders to the Empire, and we simply don't have enough men or funds to do that: to this end, we will need to choose a priority to focus on.\n\nWe need to be careful, and consider all risks before taking a final decision. A wrong choice will see us struck in our most vulnerable point by a backstabbing enemy: the very future of the Empire hangs in the balance!"

 ITA_our_european_ambition:0 "Our European Ambition"
 ITA_our_european_ambition_desc:0 "While our African possessions are large and in need of defence, the Balkans are a much closer threat to our security. It is not unknown to us that Greece and Croatia are hotbeds for resistance, and our forces are reporting a surge in partisan activities: should they fail to keep the situation under control, we'll have an enemy at our doorstep!\n\nTo this end, we should focus on the European part of our sphere of influence, at least in the short run. Protecting our interests in the Balkans will also help us reach to those nations struggling under the German yoke in the future, a most lucrative endeavor indeed..."

 ITA_slash_greek_debt:0 "Slash Greek Debt"
 ITA_slash_greek_debt_desc:0 "The Greek government depends on our money - and our guns - for almost everything, and for the last twenty years we have been collecting our due from Greece. This, however, has come to bite us back as the Greek people think of us as tyrants, and actively resist our efforts to influence the country.\n\nPerhaps it's time to change the way we have been dealing with our puppet. By cutting a sizeable part of the Greek debt, we hope this gesture of camaraderie and good will helps the local government to assert itself as legitimate and able to best serve the people."

 ITA_new_orders_for_jacomoni:0 "New Orders for Jacomoni"
 ITA_new_orders_for_jacomoni_desc:0 "With the chaos brewing in the Balkans, it's no surprise that the situation in Albania is worsening too. Our puppet government there has been struggling as of late to keep order, forcing Francesco Giacomoni, our military plenipotentiary, to use his emergency powers more and more: obviously, this is enraging the population, and eroding the government's legitimacy.\n\nIn order to address this issue, we shall give Jacomoni clear instructions to limit his intervention to extreme circumstances. In addition, we shall give the local government more autonomy and funds, so that they may present themselves as the legitimate authority and lower local discontent."

 ITA_rescue_tomislav:0 "Rescue Tomislav"
 ITA_rescue_tomislav_desc:0 "Prince Aimone of Savoy-Aosta - or, as he is known by his regnal name, King Tomislav II of Croatia - has been struggling lately to keep his nation under control. Partisan activity has increased in recent years, and our policy of sending there only the worst dregs, hoping that they get caught in the crossfire, have made our forces dependant on the so-called Home Guard, a paramilitary organization with ties to several nationalistic extremists.\n\nIt's obvious that, the deeper this dependence grows, the more likely we are to face backlash should these criminals-turned-vigilantes ever turn on us. To this end, we'll send better troops and more funds to our garrison there, hoping that they can turn the tide and help establish a stronger presence in the mountainous country.""

 ITA_partisans_chetniks_and_cossacks:0 "Partisans, Chetniks, and Cossacks"
 ITA_partisans_chetniks_and_cossacks_desc:0 "King Nicola of Montenegro has been facing wide discontent from the local population, and his rag-tag army of bandits and mercenaries is one of the main causes for said discontent. If we want to keep our influence in the area, we'll need to bail him out of this mess.\n\nSending some actual soldiers and training officers, along with a substantial loan, should help him reassert control over his small country. From there, we'll be able to exert our influence in a more efficient way..."

 ITA_outmaneuver_the_germans:0 "Outmaneuver the Germans"
 ITA_outmaneuver_the_germans_desc:0 "With our hold over the Balkans secured, at least for now, we can start focusing on potential... additions to our sphere of influence. Hungary, Bulgaria and Romania have all reasons to be hostile to the Reich like us, but they don't have the strength to resist on their own.\n\nPerhaps, from our renewed foothold into Eastern Europe, we'll be able to exert our influence over more distant lands, and set the stage for an expansion of our diplomatic contacts in the region..."

 ITA_our_mediterranean_hegemony:0 "Our Mediterranean Hegemony"
 ITA_our_mediterranean_hegemony_desc:0 "The Mediterranean may have been greatly diminished by the Atlantropa monstrosity, but it still remains the cradle of civilization, and our greatest source of income. Sea trade from the Suez is our economic lifeline, and we can tolerate no interference on the matter.\n\nTo this end, we shall protect our interests in the Mare Nostrum, and ensure our continued dominance over its waters, be it by diplomacy, or by the guns of the Regia Marina. We escaped the Mediterranean cage, we shall not be imprisoned in our home waters again!"

 ITA_a_night_in_tunisia:0 "A Night in Tunisia"
 ITA_a_night_in_tunisia_desc:0 "It's a well-known fact that the Italian community in Tunisia - one of the largest in our colonial empire - have been harboring antifascist sentiments for a long time. While their newspapers are not new to criticism towards our government, they have been allowed until now to keep their petty "freedoms" in the name of Italian solidarity.\n\nWith the empire entering a new era of instability and danger, however, such frivolities can no longer be tolerated. As Tunisian native terrorism increases in intensity, and enemies lurk in the shadows, we need to present serrated ranks in order to survive this crisis: to this end, we'll crack down on dissent, be it native or Italian, starting from those accursed newspapers..."

 ITA_review_the_saudi_treaties:0 "Review the Saudi Treaties"
 ITA_review_the_saudi_treaties_desc:0 "Saudi Arabia is one of our main partners in the oil trade, as well as the only truly independent power in the Middle East. For almost two decades they have been content on exploiting their oil fields and ruling their kingdom of camel riders and tribal warriors, but now they have been asking for more: they want to play a bigger role in the Fertile Half-Moon, and this goes against our hegemony in the region.\n\nAs we can't afford to open a new front in this crisis, we'll extend an olive branch to our power-hungry sheikhs. In exchange for better oil deals to keep our economy going, we'll grant them financial aid in modernizing their outdated infrastructure: surely they'll understand the advantage, and will be thankful that we aren't firebombing their huts. Yet..."
 ITA_review_the_saudi_treaties_tt:0 "Add §G30§! £oil_texticon  to our stockpile."

 ITA_an_evening_in_egypt:0 "An Evening in Egypt"
 ITA_an_evening_in_egypt_desc:0 "Egypt is the most autonomous among our possessions in Africa, allowed to keep their government as part of the treaties that convinced them to turn their backs on the British during the war. Of course, King Farouk would like to have even more autonomy - perhaps even independence from us - but we have let him cultivate his petty dreams as long as they remained just that.\n\nWith the empire experiencing a new wave of instability, however, we need to be sure that our own firecracker, party-lover Pharaoh remains loyal to Rome. To this end, we'll plant spies among his advisors, and expand the diplomatic mission to Alexandria: this way, we'll know of everything he might be plotting, and if he truly wishes to act on his plans, we'll show him that life isn't always happy..."

 ITA_improve_iraqi_infrastructure:0 "Improve Iraqi Infrastructure"
 ITA_improve_iraqi_infrastructure_desc:0 "Iraq is one of the main oil producers in our sphere, and considerably stable compared to the average in the Middle East. Their oil fields are highly productive, and the port of Basra allows us a second path to reach the Indian Ocean should anything happen to the Suez canal: a strategic boon indeed.\n\nWith few partners remaining by our side, we need to capitalize on this small gem, and turn it into a lucrative business. To this end, we'll improve the Iraqi railroad system, and build new pipelines to send more oil to our port facilities: this will surely make Mattei very happy..."

 ITA_tankers_and_battleships:0 "Tankers and Battleships"
 ITA_tankers_and_battleships_desc:0 "The Italian Empire is, first and foremost, a thalassocracy. The Regia Marina holds absolute dominance over the Mediterranean Sea - Mare Nostrum - and its many patrols allow us to protect the lucrative oil shipping lanes that sustain our economy: for the good of us all, the oil must flow.\n\nIn order to ensure that our dominance over oil trade remains uncontested, we need to invest in both the Marina Mercantile and the Regia Marina: the first one will send oil and other goods to the four corners of the world, while the second will see that they arrive to their destination untouched by pirates or hostile powers.\n\nWe are the heirs of Lepanto, we shall not let anyone take Our Sea from us!"

 ITA_our_african_dominion:0 "Our African Dominion"
 ITA_our_african_dominion_desc:0 "Italian East Africa is the largest, richest and most populous among our colonial domains. Boasting a sizable Italian community, a complex social and economic tissue and strategic control over the Straits of Aden, the Horn of Africa is our most prized possession, and the most precious jewel of the Imperial Crown.\n\nStill, not everything is gold what shines. Viceroy Amadeo, the hero of Amba Alagi, is getting old, Ethiopian partisans still resist our rule, and the natives ask for autonomy and better treatment: if we want to keep our colonies through these difficult times, we need to address these matters, or we'll find ourselves with another front to defend!"

 ITA_the_loyal_ascari:0 "The Loyal Ascari"
 ITA_the_loyal_ascari_desc:0 "The Eritrean Ascari are famed for their bravery, their skill at arms and their unwavering loyalty. Forming the bulk of our colonial troops, they provide invaluable support to the Italian-born garrison, and are rightly rewarded: for their service, they enjoy pay and rights that no native would ever earn under normal circumstances.\n\nStil, times are changing, and the Ascari are too few to control such a large territory. In order to keep their loyalty, and maintain control over our East African possession, we'll need to adapt to the new times: better equipment, enhanced training and higher pay will surely be enough to satisfy their requests and allow them to keep order in our colonies."

 ITA_the_bounty_of_the_soil:0 "The Bounty of the Soil"
 ITA_the_bounty_of_the_soil_desc:0 "Somalia and Kenya have an extremely favorable climate for cultivations such as cotton or tobacco. With the cheap labor provided by the natives, our products can be competitive in foreign markets, and the revenue can sustain our ailing economy.\n\nTo this end, we'll expand the local plantations, and employ even more natives there. The pay may be low, but it's still more than those savages would get on their own, right? The fear of hunger is a great incentive for obedience, after all..."

 ITA_roads_and_bridges_fortresses_and_prisons:0 "Roads and Bridges, Fortresses and Prisons"
 ITA_roads_and_bridges_fortresses_and_prisons_desc:0 "One of the key tenets of economic crises is that the state needs to stimulate the economy through large infrastructural projects. With our ailing economy, and the sorry state of most colonial infrastructure, we can hit two birds with one stone.\n\nBy upgrading roads and railroads, we'll give more work to Italian settlers and colonial business, while new defensive facilities and prisons will tighten our control over the unruly population of the Ethiopian hinterland."

 ITA_the_riches_of_the_earth:0 "The Riches of the Earth"
 ITA_the_riches_of_the_earth_desc:0 "The Horn of Africa is rich in minerals. Gold mines in Eritrea, and copper and iron facilities across Ethiopia, provide a bountiful, if unusual harvest: qualities enhanced by the cheap labor which makes them competitive on the world market.\n\nWith few business partners, we need to rely on domestic production more than ever. To this end, we'll expand mining facilities, and provide more jobs to the natives. The pay is low and the working conditions are even lower, but complaining won't get them anywhere.\n\nIf they want freedom, they can always emigrate South. Surely the German Reichskommissariats will be happy to provide them with all the freedom they want..."

 ITA_the_flower_of_the_empire:0 "The Flower of the Empire"
 ITA_the_flower_of_the_empire_desc:0 "Addis Abeba, the largest city in the Horn, is the capital of our East African possession. With almost a million inhabitants, it boasts a large Italian community - due to the large colonial bureaucracy and garrison - and healthy business presence.\n\nIn a show of national unity and colonial pride, we shall invest even more in the Flower of the Empire, funding massive infrastructural projects. The Italian sector of the city will be made larger and even more beautiful, while the natives will be provided with... suitable abodes."

 ITA_putting_out_the_flames:0 "Putting Out the Flames"
 ITA_putting_out_the_flames_desc:0 "The disbandment of the Triumvirate has put a sudden halt to our already-sluggish economic recovery. Iberia provided us with invaluable access to the Atlantic, while Turkey was a large importer of agricultural and refined goods: with their betrayal, many Italian business will return to what they were immediately after Atlantropa struck...\n\nWe need to hurry and reverse the downturn. Emergency measures will be enacted with utmost urgency, pumping money into the economy and ensuring that as few enterprises as possible close down; for those who already lost their jobs, increased unemployment subsidies and tax cuts will prevent unrest from spiking even more.\n\nWe can only hope this is enough..."

 ITA_double_down_on_autarky:0 "Double Down on Autarky"
 ITA_double_down_on_autarky_desc:0 "With our main trade partners - Iberia and Turkey - no longer trading with us, our revenues are tanking in every sector. From agriculture to industry, our economy is running towards the abyss, and we need to find a way to reverse the direction, or we shall be swallowed by the dark.\n\nAs a short-term measure, we'll enact a strict autharchical regime. Focusing on ersatz goods and the domestic market, we'll keep production running even without foreign materials, and prevent hostile acquisitions from abroad: a drastic approach, but a needed one in such a crisis."

 ITA_adjust_iri_plans:0 "Adjust IRI Plans"
 ITA_adjust_iri_plans_desc:0 "The Istituto per la Ricostruzione Industriale is our most powerful economic asset. For years, it has subsidized Italian business, helping us maintain control over the economy and expand our interests abroad: this will be especially important in the following years if we are to fully recover from this crisis.\n\nWith the worst consequences of this downfall averted, however, now is the time to deal with the unrest. Cutting public subsidies, and increasing funds to the military and the police, will be instrumental in keeping the ship going in the following months: our problems are deeper than the economy, and we'll need all the strength we can muster to survive..."

 ITA_one_final_gamble:0 "One Final Gamble"
 ITA_one_final_gamble_desc:0 "It is evident that dissent against Galeazzo Ciano is larger than we thought. The party is in open revolt, and the people demand a change: if we are to survive, we need to address the situation immediately and drastically.\n\nThe Duce knows this, of course, and he has devised a plan to survive. He'll announce a congress at Verona, where the future of the party will be decided: everyone knows, however, that this will decide the fate of Italy herself..."

 ## Post Malta Foci Tooltips ##
 ITA_postmalta_tt.1:0 "Our §YAfrican territories§! will recieve a boost in §GGDP growth!§!"
 ITA_postmalta_tt.2:0 "§YTunisia§! will recieve a boost in §GGDP growth!§!"
 ITA_infastructure_investment:0 "Invested in our Infrastructure"
 ITA_postmalta_tt.6:0 "Fortifications will be constructed along the §sGerman§! border."
 ITA_postmalta_tt.7:0 "2 §Mdestroyers§! and 1 §Bsubmarine§! will be available for service."
