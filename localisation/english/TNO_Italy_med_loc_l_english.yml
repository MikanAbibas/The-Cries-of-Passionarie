ITA_mission_send_in_the_blackshirts_desc:0 "That foolish Ciano is incapable of stopping a potential Communist uprising on the makings. We'll do the job ourselves by sending the Blackshirts and ruthlessly crush those Communist subversives. He doesn't need to thank us."
ITA_mission_appeal_to_the_hardliners:0 "§r(Fascists)§! Appeal to the Hardliners"
ITA_mission_appeal_to_the_hardliners_desc:0 "Communists are causing mayhem on the streets, and people need to be aware of this. Using our contacts on the media, we'll remind the Italian patriots who the real enemy is: the Red Menace."
ITA_mission_beat_them_harder:0 "§r(Fascists)§! Beat Them Harder!"
ITA_mission_beat_them_harder_desc:0 "Communist agitators across the country are causing a ruckus and so far our attempts to quiet them have been ineffective. The police are often outnumbered and stretched too thin to contain these protests and are vulnerable to attack. Our loyal Blackshirts have been itching for an opportunity to join the fray and so far we have held them back because of their own penchant for rowdiness and difficulty in controlling them. As the days go on however, it seems more and more clear that we cannot afford to hesitate when dealing with these communist thugs. If they want a fight, we'll just have to give it to them."

ITA_hold_peaceful_protests:0 "Hold Peaceful Protests"
ITA_hold_peaceful_protests_desc:0 "The government is ignoring us, focused on who is going to eat the remains of the Fascist beast. We'll hold political rallies in several cities to demand political reforms and an end to corruption. If they don't comply..."
ITA_our_friends_in_russia:0 "Our Friends in Russia"
ITA_our_friends_in_russia_desc:0 "The Russians are familiarized with the pain and misery caused by Fascism. That's why they will collaborate by sending equipment for our anti-Fascist struggle. The battle against Fascism transcends any frontier."
ITA_proletarians_of_italy_unite:0 "Proletarians of Italy, Unite!"
ITA_proletarians_of_italy_unite_desc:0 "The Fascists are not really "getting it", as they keep ignoring our demands. We'll hold the biggest protest on Italian history: millions of workers will march on the streets for freedom and equality. It will be the last time we ask nicely."
ITA_confront_the_police:0 "Confront the Police"
ITA_confront_the_police_desc:0 "Are the police sons of the working class or agents of the ruling class? It doesn't matter: they are serving the fascists instead of the people, so they are the enemy and need to be dealt with force."
ITA_form_the_gruppi_di_difesa_proletaria:0 "Form the Gruppi di Difesa Proletaria"
ITA_form_the_gruppi_di_difesa_proletaria_desc:0 "Our attempts to peacefully rally for reforms have been met with ever increasing brutality by the fascist Blackshirt thugs, the enforcers of the state. They have come to our protests and marches and to indiscriminately terrorize and attack our comrades. We cannot let this continue unchecked, not only because it will leave our allies unprotected, but also because we cannot send the message that we are open targets to the fascists. We will begin to assemble groups of comrades who are willing to defend our protests and fight back against those who would silence us."
ITA_storm_verona:0 "Storm Verona!"
ITA_storm_verona_desc:0 "Desperate times call for desperate measures as the saying goes. We need to send a forceful message to the fascist criminals meeting now in Verona, one at the barrel of a gun if it must be so. A small team has been prepared to infiltrate the Verona Congress' meeting place and make the depth of our dissatisfaction known.\n\nIt must be noted that this will be a suciide mission. Should we agree to launch this operation, the men and women we send into the Congress will almost certainly die, but we are running out of time and options."
ITA_reduce_the_tension:0 "Reduce the Tension"
ITA_reduce_the_tension_desc:0 "We have continued to combat the fascist menace wherever we can find it, but it seems that we may be approaching a point where continued action - at least in the short term - could lead to a snowballing cascade of national destabilization that would likely harm our cause rather than help it. With this in mind, it may be wise to pause our activities for a short while to allow things to cool slightly before making another move."

ITA_mission_hold_peaceful_protests:0 "§x(Radicals)§! Hold Peaceful Protests"
ITA_mission_hold_peaceful_protests_desc:0 "The government is ignoring us, focused on who is going to eat the remains of the Fascist beast. We'll hold political rallies in several cities to demand political reforms and an end to corruption. If they don't comply..."
ITA_mission_our_friends_in_russia:0 "§x(Radicals)§! Our Friends in Russia"
ITA_mission_our_friends_in_russia_desc:0 "The Russians are familiarized with the pain and misery caused by Fascism. That's why they will collaborate by sending equipment for our anti-Fascist struggle. The battle against Fascism transcends any frontier."
ITA_mission_proletarians_of_italy_unite:0 "§x(Radicals)§! Proletarians of Italy, Unite!"
ITA_mission_proletarians_of_italy_unite_desc:0 "The Fascists are not really "getting it", as they keep ignoring our demands. We'll hold the biggest protest on Italian history: millions of workers will march on the streets for freedom and equality. It will be the last time we ask nicely."
ITA_mission_confront_the_police:0 "§x(Radicals)§! Confront the Police"
ITA_mission_confront_the_police_desc:0 "Are the police sons of the working class or agents of the ruling class? It doesn't matter: they are serving the fascists instead of the people, so they are the enemy and need to be dealt with force."
ITA_mission_form_the_gruppi_di_difesa_proletaria:0 "§x(Radicals)§! Form the Gruppi di Difesa Proletaria"
ITA_mission_form_the_gruppi_di_difesa_proletaria_desc:0 "Our attempts to peacefully rally for reforms have been met with ever increasing brutality by the fascist Blackshirt thugs, the enforcers of the state. They have come to our protests and marches and to indiscriminately terrorize and attack our comrades. We cannot let this continue unchecked, not only because it will leave our allies unprotected, but also because we cannot send the message that we are open targets to the fascists. We will begin to assemble groups of comrades who are willing to defend our protests and fight back against those who would silence us."
ITA_mission_storm_verona:0 "§x(Radicals)§! Storm Verona!"
ITA_mission_storm_verona_desc:0 "Desperate times call for desperate measures as the saying goes. We need to send a forceful message to the fascist criminals meeting now in Verona, one at the barrel of a gun if it must be so. A small team has been prepared to infiltrate the Verona Congress' meeting place and make the depth of our dissatisfaction known.\n\nIt must be noted that this will be a suciide mission. Should we agree to launch this operation, the men and women we send into the Congress will almost certainly die, but we are running out of time and options."
ITA_mission_reduce_the_tension:0 "§x(Radicals)§! Reduce the Tension"
ITA_mission_reduce_the_tension_desc:0 "We have continued to combat the fascist menace wherever we can find it, but it seems that we may be approaching a point where continued action - at least in the short term - could lead to a snowballing cascade of national destabilization that would likely harm our cause rather than help it. With this in mind, it may be wise to pause our activities for a short while to allow things to cool slightly before making another move."


ITA_verona.1.t:0 "Enter Verona"
ITA_verona.1.desc:0 "The regime was ill, and if it was to survive, Ciano would need to deliver an intervention. The collapse of the Triumvirate and the ensuing war with the Turks had left many wondering if their international relations were not the only things collapsing around them, and somehow, some way, they had begun to lose faith in him! Him! Galeazzo Ciano! Mussolini himself had selected him to be Duce, and they thought they somehow knew better than father? He had to forcibly calm himself as his car drove through the early morning fog towards the conference hall, he was starting to tug on his tie.\n\nOf course, he would allay their fears. It had been some time since the Party had gathered together in one place after all, a great deal of time since they had last received reassurances from their Duce. Ciano flattened his tie down against his chest, exhaling deeply as the conference hall came into view. Already he could see the bureaucrats swarming about the building like little ducklings, following after that egg of a man Scorza, no doubt. He felt more confident by the moment as he opened the car door and stepped out into that crisp, pre-dawn fog.\n\nOn the other side of the building, Alessandro Pavolini had already arrived, staring down the location where the conference was to take place from a nearby hill. The pre-dawn hours held some small measure of comfort for Alessandro, the hours before Ciano came to prattle on about "father" for hours at a time, the hours before the rest of the Party began to arrive.\n\nHe took in one last breath of air, closing his eyes as he enjoyed the untainted, clear air before being subjected to whatever was going to undoubtedly pollute the conference's atmosphere. He watched a black car roll up to the conference hall, and deposit their so-glorious Duce before the entryway. He balled his hand into a fist, squared his shoulders, and marched down to the conference himself.\n\nCiano would not go unchallenged this day, the mismanagement of the nation ended here, and it ended now."
ITA_verona.1.a:0 "The heir of Mussolini cannot be wrong!"
ITA_verona.1.b:0 "Madmen circle the Conference like vultures..."
ITA_verona.1.c:0 "Italy must be saved from incompetence!"

ITA_verona.2.t:0 "Survival of the Fittest"
ITA_verona.2.desc:0 "Ettore Muti did not particularly enjoy his spot. Then again, in this Congress hall full of stodgy, stuffed up half-corpses and tottering old men, he doubted that he'd be particularly fine with any spot. But even still, the way that seating had been assigned, he'd been relegated to simply being one man amongst a multitude, not seated towards the front like Pavolini or Scorza had been, nor holding a flank like Balbo did. No, Muti was piled in with the rest of the bureaucrats who lended the Congress hall a particularly morgue-like quality.\n\nWhat was worse, was that he was next to Niccolo Giani. As if he were comparable within the party to the would-be wizard of fascism. If there were any justice in this crumbling party, it would be Muti stepping behind the podium, and it would be the effete and weak-livered Ciano, in his three-piece suit and solid grey tie like some kind of milquetoast administrator, sitting as another face in the crowd. But for now? He had no choice but to sit here and watch Ciano's inane prattling. At least Giani was there to complain to, he supposed.\n\nGaleazzo Ciano did not feel as comfortable behind the podium as he thought he maybe should. In the past, he'd done well addressing the Party and the Nation alike in settings like these, so why did this time feel so different? His hands, practically of their own volition, went up to adjust his tie again, but he managed to stop them short, and they turned back down to the papers: a long, meandering script going over Congress protocols, the date and time of the opening speech, and speaking on accommodations.\n\nThis was supposed to be a battle for the very soul of Italy itself, and the salvation of the regime, was it not? And for those whose support he'd need the most in the coming months? The first things they'd hear out of his mouth were Congress protocols, announcements on the schedule for the next several days, and accommodations for those party members who travelled a great distance to arrive here in Verona.\n\nBut it would be his voice, and for the time being? That'd have to be enough."
ITA_verona.2.a:0 "Italy has arrived at her crossroads."

ITA_verona.3.t:0 "Let the Games Begin"
ITA_verona.3.desc:0 "It was now or never. Galeazzo Ciano took his place behind the podium as fascist party bureaucrats and ideologues took their seats. All eyes were on him, it was his regime whose life and death hung in the balance, and far from the uncertainty he felt a mere few days ago, he found himself brimming with a new, unconquerable vigor.\n\n"Let me be frank." The Duce began, hands firmly gripping the top of the podium. "Italy stands at a crossroads. On one side, is revival and restoration. On the other, is a long, slow road into deterioration, degradation, and eventually, to irrelevancy and subjugation. The choices we make here today, in this Congress, will decide the future course of Italy not just for tomorrow, for the coming decade, but for all time!"\n\nThe audience was quiet as Ciano spoke. A scattering of isolated applause broke the silence, but were they merely remaining polite and waiting for the conclusion? It was difficult to tell. All the same, Ciano pressed on.\n\n"Strength comes from more than simple tradition and upholding the values of the past. In order to keep our nation strong, she must change, and grow and adapt with the times we find ourselves surrounded by!" He held his hands aloft, like he was holding two separate ropes, restraining something from moving away with each fist. "And yet we must preserve what has made us great to begin with! It's a fine line that we walk, with the party guiding the Nation, we will finally, truly realize the vision of those who came before! The vision of Mussolini and the dream of all Italians! Vigorous and righteous, rejuvenated and firmly rooted in tradition, all at once!"\n\nCiano ended his speech with a grand gesture, hands swept up in the air to cue the audience's reaction. He had been hoping for a positive one, obviously, and cheers and chants of his name would be the most appropriate, but a polite clap would be more realistic if he was being honest with himself. Instead, when he concluded his speech and made his grand gesture, he got..."
ITA_verona.3.a:0 "The standing ovation he desired"
ITA_verona.3.b:0 "An uncomfortable stillness he dreaded"
ITA_verona.3.c:0 "A fierce rejection that forced him into retreat"

ITA_verona.4.t:0 "Quality of Life"
ITA_verona.4.desc:0 "Italy's economy was not what it should be, that much was obvious. A nation whose direct and indirect influence extended from Rome to Tunis to Jerusalem and beyond should have an economy able to challenge the likes of the Reich, the Sphere, and the United States, should it not? A failure to do so was embarrassing, especially with their uncontested control of much of the oil-rich Middle East and resource-rich East Africa. Ciano stood up there, in front of the Congress yet again, with a program of moderate reform and reasonable intervention in his hands. He knew the dangers that overreaction posed to the fragile economy of Italy, and it was up to him to institute a program that would improve production in the nation without breaking what spirit the engine of Italian industry still had.\n\nIt would appear as though Pavolini had other ideas, however. "Tax relief and marginal are what Ciano proposes! An easy excuse to put money into the hands of his friends and allies at the head of the companies, I am quite sure!" Pavolini's rhetoric was loud, sharp, and aggressive. Even from his own desk amidst the rest of the party members, it had all the energy of him getting directly in the Duce's face as he offered his own alternative to the Ciano Plan. "In order to avoid a complete collapse, Italy needs more than milquetoast reform and the soft touch of a businessman! We have the tools to do this, we need only the strength of will to use them! Italy's industry must act in accordance with the will and in the interests of the rest of the nation if we are to see ourselves through the looming crisis ahead!"\n\n"I did not realize Bukharin himself had been invited to speak with us today! Listen to yourself!" Ciano retorted, hands gripping either side of the podium as he leaned forward before addressing the rest of the Congress. "You, the Party, the minds and soul of this very nation, cannot possibly support this line of thought! Economic planning and dirigisme like he has proposed will bring Italy to ruin, not save it!"\n\nIt did not take more than a moment for the Congress to erupt in shouts and argumentation as party members took one side or the other. When it was all said and done, the loudest voices called for..."
ITA_verona.4.a:0 "Stimulus and the Status Quo."
ITA_verona.4.b:0 "A rejection of both insane plans!"
ITA_verona.4.c:0 "Dirigisme and economic planning!"

ITA_verona.5.t:0 "A Question of Fascism"
ITA_verona.5.desc:0 "The next subject was bound to be a controversial one, but it had to be tackled nonetheless. Everything else that was and would be discussed in these halls frankly would not matter if the political question could not be resolved. Fascism, unlike other, more mundane political systems, could not continue to propel itself forward without the continued energy of its party and its nation. If it stagnated, it threatened immediate destruction, and Galeazzo Ciano was determined to not allow this to come to pass.\n\n"A strong fist to bring down swift retribution!" Ciano called for, mimicking the hardliners' passion as he leaned forward over the podium. "That is what Italy needs, and that is what I have always provided. Yet without the vigor and support of the party, the fist of iron threatens to land softly! An inefficient response will only embolden the predatory liberal, the parasitic unionist, and the socialist rats infesting our cities." He paused for a moment, to test the waters, but he did not expect the one that he got.\n\nRather than any unified cheers or jeers, one man near the front of the audience stood up. The unmistakable, stern form of Alessandro Pavolini, in his black officer's uniform and hat to boot. With practiced rage and efficient passion, he stood up from his chair, pointing an accusing finger at his Duce! The shock did not produce audible gasps, but had the party members in attendance been less disciplined, it might have.\n\n"And it would seem as though our Duce would prefer to go chasing after vapors! After ghosts that his father-in-law vanquished decades ago!" There was a stunned silence, even from Ciano on his podium. "Italy does not need to fight the same enemies of yesteryear, time and time again, like it's some grand crusade! These subversive elements he speaks of should have been brought to their grave years ago! And after years of our Duce's reign, we must ask ourselves. Is he the man to do it?"\n\nBoth Ciano and Pavolini had their mouths open now, and words began to fly as the speech was entirely derailed by the interruption. Only the audience can bring some level of dignity to this exchange."
ITA_verona.5.a:0 "Pavolini is cowed by the scorn of the audience."
ITA_verona.5.b:0 "The crowd remains awkwardly silent as the argument spirals."
ITA_verona.5.c:0 "Pavolini isn't the only one with objections!"

ITA_verona.6.t:0 "The Social Question"
ITA_verona.6.desc:0 "And then came the social question. An inevitability, really, as fascism was equal parts a social movement as it was a political one. Even still, Ciano struggled to find much to say on that particular front, for all of the problems facing Italy, the fascist society built by his father-in-law had certainly remained intact. The focus of Italy should therefore, not be reform or alteration, but preservation and further entrenchment of what has already been achieved. Surely, the Congress as a whole would agree.\n\nA speech of congratulation to the Party and Nation at a whole for the virtuous and disciplined culture that she had managed to cultivate drew to a close, and just as Ciano prepared to simply move along to a new topic of discussion, a challenge arose in the unmistakable form and commanding voice of Alessandro Pavolini. With a stern, firm cadence, be issued his challenge towards Ciano and his podium.\n\n"And so because we have done nothing and grown nothing, we should be giving ourselves a comforting pat on the shoulder?" He questioned, directecting it towards the Congress as much as the Duce himself. "How wonderful! Should we also award medals to soldiers for knowing which end of the gun fires the bullet? Or perhaps we should award crosses for the achievement of continued adequacy!"\n\nCiano was not going to merely stand by and allow this to go on unopposed. "And so how then would the great Alessandro Pavolini address Italy then? Do we just tear down all we have built and start again? What more is there to accomplish on the social front?"\n\n"Greatness and permanence!" A defiant fist shot into the air. "If we do not relent in continuing to build the first and only truly fascist nation, we can bring our people to heights beyond the imaginations of small minded men..."
ITA_verona.6.a:0 "Italy is great as she is!"
ITA_verona.6.b:0 "These two are arguing over nothing."
ITA_verona.6.c:0 "An Italy that rests is an Italy that stagnates!"

ITA_verona.7.t:0 "Curtain Call"
ITA_verona.7.desc:0 "The Congress halls were alive with the sound of low, idle, and occasionally rapid discussion and chatter. What had once been a rather sterile affair had rapidly transformed into something that, for better or worse, the attendees could not stop talking about. But what was it that they spoke about? Was it the scope and vision of Ciano? The strength in defiance of the collective Opposition? Or was it a general murmur of disgruntlement and broad discontent?\n\nSenior party members, and even the Duce himself, await the results with nervous anticipation. Even the normally unflappable Pavolini can't help but glance from side to side every now and then. Ciano sat behind his desk in the Congress hall, fingers drumming on the table as the fate of not only his regime, but of Italy herself, was decided without his direct input. Could he trust his allies to sway those of wavering faith? For their sakes as much as his own, he hoped as much. Italy depended upon it.His mind traveled to the other side of the Congress Hall, to those would-be usurpers, and whatever schemes they must be hatching now...\n\nOn the other side of the Congress hall, four men of the Party have gathered, and much like Ciano, they are either content- or required- to simply sit and wait as the final consensus is gathered. Pavolini, Balbo, Muti and Giani kept their voices low and their eyes locked as the final touches on a fragile alliance were made.\n\n"All of the blackshirts in Italy will not help you if the Congress sides with Ciano." Giani did not sound convinced, a skeptical gaze locked firmly on Pavolini.\n\nBefore Pavolini could respond, Muti interjected. "Even if the Congress rejects Ciano, that does not mean it will accept you, Alessandro. And if my name is brought to the fore of the discussion, who should I be to deny it?"\n\n"A power vacuum instead. That is what you three propose?" Pavolini stressed the obvious with growing fury.\n\nIt was Balbo's turn to interrupt, over the clearly incensed Muti and Giani. "Alessandro. Ettore. Niccolo." His hands making a conciliatory gesture. "It is clear that this is not an issue to be decided here or now. So we wait and pool our resources, and strike when the Party makes their rejection of Ciano clear. And then? Then we can argue as to who should rule."\n\nIn spite of themselves, the four men were forced to acquiesce to Balbo's compromise, before returning to the general mill of the Congress. Ciano himself gave into the temptation, and departed his office to test the pulse of the party, and they found that..."
ITA_verona.7.a:0 "Ciano has won over the Congress."
ITA_verona.7.b:0 "The Congress is evenly divided."
ITA_verona.7.b.tt:0 "§eThe future of Italy is uncertain...§!"
ITA_verona.7.c:0 "Ciano has lost the Party."

ITA_verona.8.t:0 "Cooperation and Control"
ITA_verona.8.desc:0 "The corporations of Italy are the purest representation of class cooperation to be found in all the world. In the Chamber of Corporation and Fasces, the interests of both worker and employer are represented, and through their cooperation, Italy is made all the stronger. But even with their presence, there are many who wonder if more could not be done. The powers of the Corporations and the Chamber itself do not extend far beyond moderate regulatory measures and an advisory role for the Duce himself. For many, both on the streets and in the halls of the Congress, the Corporatist dream has yet to be realized. "The Corporations are not some cudgel to be brandished at private citizens of the nation! Class cooperation means cooperation, not brutalization!" Ciano's voice rang clear through the Congress, even moreso than normal. His passion and sheer stubbornness was clear in his voice.\n\nHowever, the opposition, once more spearheaded by Alessandro Pavolini, had passion of their own. "A cudgel! Brutalization! Such brutish words for the simple act of using the corporations as they are intended! Cooperation means cooperation, as Ciano stated, but cooperation also requires unity! Unity of vision and purpose is the only way to achieve the cooperation everyone professes to desire so much! If the Corporations, the very engine of that cooperation, are not let out of her shackles then we are no better than the puppets of financiers and laissez-faire economists!"\n\nWere the Corporations overreach of the state into the private sphere? Or were they too weak and ineffectual to achieve their primary function? The Congress, like on seemingly every issue, was divided. Pavolini's defenders rose first to defend his policy of intervention and control. It did not take long for Ciano's supporters to rise in response. In the end, it came down to..."
ITA_verona.8.a:0 "A decisive defense of the status quo."
ITA_verona.8.b:0 "The simple exhaustion of the debaters."
ITA_verona.8.c:0 "A crushing argument for increased power to the Corporations."

ITA_verona.9.t:0 "Unions and the State"
ITA_verona.9.desc:0 "Unions were a weapon and like any weapon, they must be wielded with caution and care. To use them recklessly would only invite calamity, potentially socialist catastrophe at that. When tempered with wisdom and utilized in accordance with the will of the nation herself though, it was could slay that very same socialist beast.\n\nCiano had expected to face pushback for his proposed reforms to the unions. It gave them ever so slightly more teeth as organizations, teeth that would allow them to better serve the nation through the workers underneath them. He had expected to be called a socialist in a Duce's skin, a liberalizer, simply going too far. He had expected Pavolini, Balbo, or heaven forbid Giani to be the one to challenge him on this.\n\nWhat he got was very different. It was the unmistakable voice of Ettore Muti rising out from the audience to challenge him, and he challenged the Duce from a very... different direction than anticipated.\n\n"Incriments and centimeters! We move like the mighty glacier and commend ourselves for it. Frankly, I am disgusted." Muti's rage was palpable but restrained, if barely.\n\nThe shock of the exact nature of the rebuttal took the Duce off guard, and Muti was given more time than he ought, launching into a demand that the unions be reforged and restructured with a truly fascist vision, a project to be undertaken until Italy's unions were as easily associated with fascism as the Blackshirts and the Fasces itself are now. After processing the mere existence of a demand so radical in every sense of the word, Ciano did not take long to fire back. "And then we replace those blackshirts with red ones, do we? Or perhaps the red flag ought to go up alongside the fasces!" Ciano was dumbfounded. There was no way the sort of rhetoric that Muti was spouting could possibly be accepted by the Congress at large...\n\n...Could it?"
ITA_verona.9.a:0 "Muti was looking a little... Red in the face."
ITA_verona.9.b:0 "Why all this talk of unions to begin with?"
ITA_verona.9.c:0 "Fascism is defined by boldness, not timidity! Muti is right!"

ITA_verona.10.t:0 "The Engine of Italy"
ITA_verona.10.desc:0 "The Institute for Industrial Reconstruction is a cornerstone of the Italian economy, representing the engine that drove the entire public sector. Formed out of restructured banks and companies that had gone bankrupt during the Great Depression, the IRI has since been a massive benefit to the nation's economy, acting as a controlling and intervention method that incorporated the use of both public and private capital without necessitating full-scale nationalizations. However, it had become clear to Ciano some time ago that the effectiveness- not to mention the popularity- of the IRI had begun to wane, and perhaps, it was time to scale back the Institute's role in the economy. Not abolish it, of course, but acknowledge when something had run its course.\n\nThe Opposition, of course, took umbrage with this proposal. "And what should happen when we have a need for it?" Balbo piped up from his flank of the Congress Hall. "A simple machine to grant the occasional subsidy will not be sufficient to continue the growth of the nation's economy, certainly not while we can still do so much more with it!\n\nPavolini rose to challenge the Duce as well, bouncing right off of the ever-earnest Balbo's criticisms with something more... Direct. "A fast road to privatization! The Duce looks to earn the favor of the businessmen and the banks by pulling the rug out from beneath their greatest opponent. Subsidies today, the sale of assets to his friends and cronies the next!"\n\n"It goes against the very spirit of fascism itself, does it not?" Muti's turn to speak, apparently, as he faced himself more directly at the Party at large than the Duce. "Is it not antithetical to the interests of the nation, to deprive it of a tool to maintain its prosperity?"\n\nCiano had enough by that point. Showing an uncharacteristic degree of emotional volatility, he struck a fist on his podium, catching the attention of the Congress. "When a resource has begun to expend its usefulness, it is set aside and others are used in their stead! If we continue to rely so dramatically on the IRI, what happens when the engine begins to falter? We will have missed our opportunity to develop the companies and corporations enough that they can take on the burden that the IRI has so faithfully shouldered all of these decades!"\n\nThat would not be the end of the debate, for certain, but at least for the moment, the Congress Hall had taken something away from the spectacle, and that is..."
ITA_verona.10.a:0 "The Duce is correct. The IRI needs to be scaled down for Italy's sake."
ITA_verona.10.b:0 "The Duce's plan is too radical, but the status quo is as well."
ITA_verona.10.c:0 "The IRI is just fine as it is!"

ITA_verona.11.t:0 "Blackshirt Blues"
ITA_verona.11.desc:0 ""From the fateful days of the March on Rome underneath the first Duce's direction, the paramilitary Blackshirts have been vital to both laying the foundations of the new Italy as well as maintaining its defense against attacks from all sides." The subject was of course, those incorrigible Blackshirts. In a lot of ways, when people think of fascism, they think of the Blackshirts and the role they play in the maintenance of the fascist state. Tonight was not just for reflecting on the role they have played in the past, tonight was also for determining the role they will play in the future.\n\n"And as Italy moves into the modern age, so too must the Blackshirts! What I have with me..." Ciano holds up a small pile of paperwork. "Is a plan to standardize and train the Blackshirts as an organization and as individuals.Stronger, more disciplined, and more integrated Blackshirts will allow them to more effectively and efficiently contribute to the long-term stability of the nation!"\n\n"And to remove their teeth in the process!" Called out a voice in challenge. Could Ciano not make a single proposal without being so publicly challenged on it? Once again, it was Pavolini taking to the fore, his finger raised in defiance. "Is it not bad enough you have already placed leashes around their necks? Will you not rest until the very backbone of Fascist society are relegated to sanctioned parades and saluting a flag?"\n\nCiano had to re-establish control, and quickly. Pavolini had to know that the Blackshirts have been becoming a liability, why would he attempt to strike down this attempt to revitalize them? Before the Congress went up into furor, he raised his hands and lowered them again. "Remove their teeth? Is that what you call discipline and training? We don't need to listen to this!"\n\nThe Congress grew to a fever pitch again at that rebuttal, and the dominant voices in the audience began to emerge, calling for..."
ITA_verona.11.a:0 "Pavolini to stand down, and Ciano to explain his plans."
ITA_verona.11.b:0 "Simply move on from this pointless issue."
ITA_verona.11.c:0 "Ciano to toss his papers away, and allow Pavolini the floor."

ITA_verona.12.t:0 "Judges and Juries"
ITA_verona.12.desc:0 ""You'd have us open ourselves to the manipulations and infiltration of our enemies! The enemies of the Party! Of Italy herself!" There was already a cry of defiance. In truth, Ciano had seen this coming. Of the rights and privileges that the party's paramilitary blackshirts enjoyed, the "special tribunal" was a favorite. Members of the Blackshirts had the right to act as judges, and pass sentences upon the "enemies of fascism", whoever they may be. Not five years prior, Ciano may have been playing the part of the opposition for what he was proposing, the Blackshirts were if nothing else, certainly capable of keeping dissidents suppressed. But the King was not of a similar mind, and worried about the power the Blackshirts held. If Ciano was to hold on, he needed the King, and if he was to keep in the King's good graces, the Special Tribunals simply had to go.\n\n"What I am proposing..." Ciano stated with caution, looking out over the Congress hall. "Is not to remove them altogether. But a simple lightening of responsibility on the shoulders of the individual Blackshirt! We cannot truly expect every single member of the organization to be forced to make that judgement alone!"\n\n"But to remove their teeth! Is that what you desire, Duce?" The all-too-familiar voices of Pavolini and Muti were audible from the crowd, but curiously, there was equal passion even among the simpler party members and the bureaucrats. "You would propose anarchy in the streets of Napoli! Milan! Here, in Verona, and over in Rome!"\n\n"Enemies of Fascism can be decided by ordained judges! Lesser offenses will still be punishable as necessary!"\n\n"Until such time that our benevolent Duce comes for those as well!"\n\nIt would take a great deal for Ciano to convince the Congress, and at the end of it all, he knew he'd only be able to convince them to go along with it, which was really all he needed to appease the King. Once he was secure in his position again, he could see about restoring those privileges, but until then..."
ITA_verona.12.a:0 "The Party is cowed. For now."
ITA_verona.12.b:0 "The arguments go long into the night, with no resolution in sight."
ITA_verona.12.c:0 "Bureaucrats and Party Members storm out of the Hall, one by one."

ITA_verona.13.t:0 "A Question of Party and Government"
ITA_verona.13.desc:0 "The Fascist Party is the hand that guides the nation and leads the government, but the Party is not the government- or at least, it is not intended to be. Over the years, however, the King has grown concerned as of late with the sheer pervasiveness of the Party on all levels of the government. Whether major figures like Balbo and Pavolini, or mere bureaucrats and suits, one cannot escape the all-pervading hand of the Party in every aspect of the government's function, and the nation has benefited from their firm hand. Even still, the Party was merely one part of maintaining his regime, and at the end of the day, Ciano needed the King on his side. The King would have his separation, but the question came down to how could he get the party to agree?\n\n"Fascism is founded upon cooperation, first and foremost. Cooperation between the classes, cooperation between the government and private institutions, and cooperation between the government and party..." He could feel the air in the room stilling as he explained his plan to retain the ideological purity of the party by separating it from the inner functions of the government, and keeping them towards the levers of power in a broad sense. Guides, not micromanagers would be the order of the day.\n\nAs expected, such a radical call would not go unanswered by the opposition. But instead of the all-too familiar bluster of Pavolini or the expected grumblings of Balbo, a black sheep of the party stood instead. Giani, the Mystic of Fascism, rose from his seat and denounced Ciano's plan, with his hands folded his hands behind his back, looking skeptical and imperious. "If the Duce is strong and vigorous, then the Party that is his will should be a benefit to whichever institutions they populate! The Nation and the Party are one! Could a man truly be separated from his own mind? A hand from its arm? They are one unit, and when one falls into disrepair, it must be fixed! Not amputated!"\n\nAs if such a declaration of party supremacy weren't incendiary enough, Giani spoke again, his voice bowling through the general hum of discourse that had begun during the pause. "After all. Who had such complaints while Mussolini was il Duce? Whatever has changed since then?"\n\nAnd from there the Congress hall erupted, drowning out any individual voices until the decision of the party was made clear."
ITA_verona.13.a:0 "Begrudgingly, the Party must be subservient to the State. "
ITA_verona.13.b:0 "Why change what is not broken?"
ITA_verona.13.c:0 "Giani is vindicated, the Party is the State and ought to be!"

ITA_verona.14.t:0 "Power of Persuasion"
ITA_verona.14.desc:0 "The Duce had a different strategy this time. He took the podium with a roll of poster paper underneath his arm instead of a stack of documents. The Ministry of Popular Culture, or MinCulPop, very well might be the greatest and most wasteful ministry in the entire Italian government. Formally established during the World War, the ministry has managed to see impressively few changes over the years, with only a scant few modernizations of the censorship policy and internal operations, it's no secret that the Ministry has become a laughing stock, not only internationally, but even among the citizens of Italy herself. But the Party was blind to this fact, and Ciano needed to remove the wool from their eyes.\n\nHe held up an old poster, mid-war by the design, and frankly, it was awful. The painted figure in the center looked somewhere between a man and anvil with an overly flat face, with a larger man face behind him in blues, reds, and a tall hat that simply put people most certainly wouldn't recognize as anything more than a baton-twirler in a parade. While of course, in the foreground image, two vicious beasts that could generously be called dogs stared unnervingly at the observer. "For a quarter of a century, the Ministry of Popular Culture has been serving the Italian nation dutifully and faithfully, protecting the minds of Italy from outside corruption, managing literary and broadcast works across the nation, and educating the people. But in that time..." He handed the poster off to an aide, and retrieved a second one. Stylistically, it was much the same, another recruitment poster, painted with a stylistic ambition of realism. This one depicted an image of an Italian, still in that old-fashioned World War garb, reaching out to the viewer. In style and purpose, identical to the wartime posters.\n\n"And a poster off our presses mere weeks ago!" Ciano took a moment to look it over himself. "In terms of efficiency, it is simple. The Ministry has fallen behind the times! They have lost their ability to convince, to persuade, and it is time to modernize! The Germans, the Americans, the Japanese, they all know that the trend moving forward is smaller concepts, simpler messages, and modern sensibility. The blueprint for a new, better Ministry is already here. We simply need to be willing to implement it!""
ITA_verona.14.a:0 "The time for modernizing is now!"
ITA_verona.14.b:0 "In truth, we are not so far behind."
ITA_verona.14.c:0 "The Ministry doesn't need to import ideas from other nations!"

ITA_verona.15.t:0 "Think of the Children"
ITA_verona.15.desc:0 "Ever since the March on Rome, Italy's Youth Organizations have been the model from which youth organizations all across the globe have drawn inspiration and based themselves upon. The political education to act as an equivalent to the academic education of regular schooling, Italy's most zealous youths learn to become as Italian and as Fascist as possible while ascending through the ranks of the Ballila, the Avanguardisti, and the Giovani Italiane. Until they turn eighteen, they wear uniforms, march in disciplined lines, and learn skills appropriate and necessary to their sex. In short, represent everything that the ideal Italian man and woman ought to be, and yet somehow, the approval rating for the ONB is lower than ever before.\n\n"Simply put, if the youth organizations are not improving the peoples' opinion of the party, then the youth organizations have no reason to exist!" Ciano declared. The room was emptier than normal, somehow the fate of Italy's future had less of a sense of urgency among the party than the issues discussed before. "The mandatory nature of their attendance has done nothing except damage both their reputation as well as our own. Children and parents alike grow to resent the organizations, and they resent us in turn. To put it simply, to make attendance something only required as necessary is to preserve their very future!"\n\nAs expected, the ever-oppressive opposition stood to challenge Ciano's proposal, which had already gotten a few shallow nods and non-committal murmurs of agreement from the Party. This time, the domineering presence of Ettore Muti filled the room, as he rose sharply to his feet. "Save the organizations by weakening them? Do you hear how ridiculous that sounds? How can reducing an organization's size and influence save it? Perhaps, to save the Fascist Party, we should discard half of our membership! Surely that would do us a lot of good!"\n\nAlready, the mood in the room was beginning to shift. Ciano moved to reclaim the momentum. "And drive the organizations right into a wall! Kicking the can down the road, is that all that you and your clique of contrarians are capable of?"\n\n"Why does the Duce himself seem so intent on careening the nation entirely into weakness and obscurity?" Muti fired back, with the half-filled Congress hall beginning to buzz with small mirrors of the louder disagreement taking place. For the part of the Duce and the Opposition, their own back and forth continued, until..."
ITA_verona.15.a:0 "Ciano gets the last word in, before moving onto the next topic."
ITA_verona.15.b:0 "One by one, the other Party members began to filter out of the room."
ITA_verona.15.c:0 "Muti gets the last word, before adjourning for the day"

ITA_verona.16.t:0 "Saving the Empire"
ITA_verona.16.desc:0 "The Italian Empire was vast, Rome held authority from the Alps in the north as far as the Horn of Africa and the Persian Gulf. But it was not a simple or all-encompassing authority. In order to manage such a vast territory, she operates a similarly vast and diverse network of puppet nations, colonial authorities, economic dependencies, and association statuses. Such a system requires the ability to negotiate, compromise, and back down when and where necessary for the good of the empire as a whole. However, the balancing act has not been a success for the Duce, to put it lightly. Insurgency and rebellion threatens to tear the Empire apart, and the Italian people have not reaped the benefits of the Empire in over a decade. Now, the years of degradation were coming to a head.\n\n"I have spent much time amidst the Empire's possessions, from Libya to the Gulf and as far as Egypt and East Africa! And everywhere I turned, I found more and more evidence of Ciano's incompetent management of this empire!" Balbo was composed, but passionate. Clearly he had rehearsed this particular tirade frequently, either in front of a mirror or in his head. "Rebels and insurrectionists run the streets of our cities abroad! Nepotism and cliqueist favoritism has brought our bureaucracy to its knees!"\n\nThere was a moment where Balbo suddenly became aware of his body language. His arms and hands were pressed against his sides, completely still and lifeless. He felt- and must surely have looked- stiff as a board as he spoke. This simply would not do. After only a split second to think, he brought up the flat of his hand, and struck the desk in front of him. That certainly grabbed their attention, right? "The Empire needs rationalization! Reorganization! In all frankness, it needs anything! But! Ciano!" The challenge was direct, and possibly ill-thought through, but it was made, and there would be no turning back now. Balbo thrust an accusing finger towards Ciano's podium, before looking to the audience, and finding their reactions to be..."
ITA_verona.16.a:0 "Disapproving, and stern. Balbo overplayed his hand."
ITA_verona.16.b:0 "Weary and disinterested in his rants."
ITA_verona.16.c:0 "Enthusiastic, ready to add their jeers to his own."

