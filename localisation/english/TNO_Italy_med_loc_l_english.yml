 ### Nuclear Mechanic###
 ITA_nuke_development_category:0 "The Nuclear Arms Program"
 #ITA_nuke_development_category_desc:0 "For too long the Kingdom of Italy's status as the Fourth Power in the world has been a courtesy extended in light of our triumph in the Second World War rather than a fact of our global power. This must be rectified if we wish to assert ourselves apart from the shadows of any greater power. There are many areas in which we must rapidly improve if we wish to catch up with the three superpowers: industry, military, trade and dozens of other areas.\n\nHowever, what we need the most in order to be a true world power is the devastating weapon that is the atom. This is the atomic era, and any nation that truly wishes to feel safe against the approach of foreign domination must secure for itself a bulwark of nuclear weapons. This has become our chief scientific concern as of late, and with much of the world enveloped in chaos it has become more important than ever in securing our sovereignty and position in the world."
 ITA_procure_more_quality_uranium:0 "Procure More Quality Uranium"
 ITA_procure_more_quality_uranium_desc:0 "The problem with uranium is that it decays over time. Quality material today can be useless tomorrow. We must make our uranium more efficient, in order to reduce its rate of decay. Succeeding in this effort will help development in the long term."
 ITA_nuke_uranium_improve.tt:0 "§GOur Uranium Will Increase In Quality§!."
 ITA_decrease_uranium_decay:0 "Decrease Uranium Deterioation"
 ITA_decrease_uranium_decay.tt:0 "§GOur Uranium's Quality Will Decay Slower§!."
 ITA_give_scientists_pay_bonus:0 "Give Scientists a Pay Bonus"
 ITA_give_scientists_pay_bonus_desc:0 "There's no greater motivator than money. By giving our nuclear scientists a pay bonus, we will motivate them to work harder and faster. Happier scientists means more productive scientists, and that means faster and stronger results."
 ITA_increase_scientists_safety:0 "Increase Scientists' Safety"
 ITA_increase_scientists_safety_desc:0 "Developing nuclear weapons is dangerous work, a fact that nobody's more aware of than our scientists. If we make our safety standards and regulations more effective and strict will increase morale across the board, which will benefit the project."
 ITA_scientist_happiness_improve.tt:0 "§GScientist Happiness Will Improve§!."
 ITA_decrease_scientist_decay.tt:0 "§GScientist Happiness Will Decay Slower"
 ITA_increase_reactor_amount:0 "Increase Reactor Amount"
 ITA_increase_reactor_amount_desc:0 "Not satisfied with the current rate of development, a new proposal has been put forward: Redirect a number of reactors towards working on this program. Increasing the number of reactors on this project will speed up development significantly."
 ITA_increase_amount_of_scientists:0 "Increase Amount of Scientists"
 ITA_increase_amount_of_scientists_desc:0 "They say two minds are greater than one. Therefore, increasing the number of scientists assigned to the nuclear arms program will make it progress faster and bring new perspectives to the table. Candidates will be vetted to ensure this goes smoothly."
 ITA_increase_monthly_development_speed_medium.tt:0 "§GOur Nuclear Program Will Develop Faster§!."
 ITA_increase_monthly_development_speed_high.tt:0 "§GOur Nuclear Program Will Develop A Lot Faster§!."

