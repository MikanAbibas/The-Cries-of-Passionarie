 ### IEA Decolonization ##
 ITA_IEA_Decol_GUI:0 "The East African Knot"
 ITA_IEA_Decol_GUI_desc:0 "§KItalian East Africa§! forever was a mess of a state, an abomination too big for anyone's good, with the §MDemocratic Revolution§! the winds of change are blowing, and the decolonization of §KEast Africa§! must take place.\n\nIn order to get successful Decolonization we must satisfy the various local groups, root out disloyal elements and form the basis for a free §KEast Africa§!, the rewards from success will be §GHuge§!, and faliure will be §RCatastrophic§!."
 ITA_IEA_Decol_info_box_tt:0 "Our primary means of ensuring a successful decolonization are §snegotiations§F. We could theoretically start them immediately, but that would be unwise, as they would likely go poorly.\n\nIf we want to have any chance of our attempts at §snegotiation§F being successful, we have to ensure that our former subjects view us §ifavorably§F. We also must forget that time isn't on our side, the longer we wait to start §snegotiations§F the more §Vresistance§F the §KEast African§F administration will have to deal with. Should the §Vresistance§F in a region reach §Y5§F we will be forced to abandon it and our chances of negotiating with it will go out the window."
 
