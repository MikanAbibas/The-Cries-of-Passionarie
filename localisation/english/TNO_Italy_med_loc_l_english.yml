### Post-Verona Ciano Victory Tree
cianowins.1.t:0 "Routine, Sweet Routine"
cianowins.1.desc:0 "Galeazzo Ciano entered his office after weeks spent at Verona. Everything was as he had left it more than a month ago: a few new folders were waiting on his desk, but for the rest there had been no change. The volumes, the chairs, even Mussolini's lightly-dusted bust were as if he had left for Verona the day before, as if nothing had happened at all\n\nAs he has behind his desk, he felt peace. So much had changed in so little time, all so that nothing could change: "Il Gattopardo" at its finest, Ciano thought with an inner chuckle, but then he turned serious. In truth, everything had changed: with the opposition purged, he was finally free to govern as he saw fit for the Empire, without bindings or the need to always look his back from flying daggers. Then, a knock on the door awakened the Duce from his thoughts.\n\n"Your Excellency," came his aide's voice, "The Minister for Grace and Justice is here for the briefing."\n\n"Let him in Alfredo." Ciano answered.\n\nFinally, some administrative work! No more scheming, no more threats, no more instability: in short, peace."
cianowins.1.a:0 "This is peace for our time."

cianowins.2.t:0 "There Is Still A King In Rome"
cianowins.2.desc:0 "The King's audience room was rather empty compared to the usual. In his almost twenty years of tenure, Galeazzo Ciano had met with Umberto II dozens, if not hundreds of times, and he knew his attachment to protocol and a bit of old-fashioned fanfare: the fact that there were only the two of them, plus the King's private secretary, the Duce's aide and an ever-present Corazziere, worried him more than what was happening outside the Quirinale.\n\n"Prime Minister", the King began, "I have received concerning reports regarding the stability of the Kingdom."\n\nAs usual, Ciano thought with a tinge of irritation, Umberto remained attached to the Statute-compliant titles for both the Duce and the Empire.\n\n"There is no need to worry, Your Majesty," he replied, trying to sound confident if only for the sake of it: "The government is already enacting all needed reforms to return peace and calm to the Kingdom."\n\nIn truth, he knew that things were quickly worsening, and he was sure the cunning bastard in front of him knew it as well: this meeting was private because it served no purpose other than putting pressure on him, reminding him of his current weakness and the fact that the King, despite his efforts, was far from powerless.\n\n"Of course, Prime Minister," came Umberto's neutral answer, "we are confident in the efforts of our Ministers. We shall closely follow the developments, and wait for positive news."\n\nThe meeting went on for a while more, just to keep up the pretense, but Ciano had already heard all he needed to hear. He had known for a long time that the King was playing against him, and that the "positive news" the King was waiting for was the Duce's own demise, but this was not the problem: the truly worrying thing was that Umberto had dropped all pretense at neutrality, and was now playing openly."
cianowins.2.a:0 "Why didn't I let Mussolini..."

cianowins.3.t:0 "Empty Corridors"
cianowins.3.desc:0 "Palazzo Venezia was the beating heart of fascism. From its balcony the fates of Italy had been decided time and time again: Galeazzo Ciano knew the symbolic value of the ancient palace, and he couldn't fail to see the signs that this heart was slowly ceasing its beat.\n\nOffices once bustling with activity were empty, their occupants either purged, fled or resigned, with no one to replace them. As the Duce walked through the corridors early in the morning, seeing only a few attendants passing, he asked himself the hard question: why would anyone replace them, when everyone could see the cracks in the façade?\n\nAt Verona, he had hoped to stop the avalanche before it began, but in truth, he had only succeeded in making it start. The opposition had been the greatest thorn in his side, but without it, without the hundreds of bureaucrats and officials loyal to the bastards who had tried to dethrone him, Palazzo Venezia was reduced to a shell, and with it, fascism itself.\n\nAs he reached his office, he called for his attendant so that he could begin reviewing the dossiers from the night. He called once, then twice, then through the interphone: no one answered. Impatiently, he went to Antonio's office to reprimand him, but his words died in his throat when he opened the door: the office was empty, all personal effects taken, and a neatly-folded letter acting as the desk's centerpiece."
cianowins.3.a:0 "Even him... gone..."

cianowins.4.t:0 "One Last Audience"
cianowins.4.desc:0 "As he entered the King's office, Galeazzo Ciano knew this was going to be the last time. Taking a seat, he could see that Umberto II knew it as well, and he hated it; even more, he hated the look in the bastard's eyes: a mixture of pity and barely-concealed contempt - the look one gives to a failed man.\n\n"Prime Minister," the King began as always, one more stiletto stuck in his back, "we have waited to see results in your actions, and yet the situation has not improved."\n\nUmberto II kept talking, but Ciano did not listen. He knew where this was going, and he wouldn't give the bastard the satisfaction of pending from his lipt up to the last.\n\n"For these reasons, and for the stability of the Kingdom," the King finished in a formal tone, "according to the powers granted to me by the Statute, I revoke my confidence in the Royal Government."\n\nThis was it, Ciano thought, this was the end. For a moment, he felt hate, unbridled, rabid hate coursing through his veins: the sniveling bastard had plotted for twenty years, sapping fascism of its strength, weakening its foundations, slowly but steadily eating away its power and influence. If not for the presence of the Corazzieri by the King's side, the Duce would have leaped from the chair and strangled him with his bare hands: how happy he would have been, looking Umberto in the eyes as the last flicker of life fled from his pupils!\n\nThe King, however, didn't know of these thoughts, nor would he ever. Ciano had schooled his features so that, at least, he would go away with dignity, and not as a crying child: this, at least, he had earned.\n\n"I understand, Your Majesty." he answered. Then, quoting Giuseppe Garibaldi, he said the words that would seal his fate."
cianowins.4.a:0 "I obey."

cianowins.5.t:0 "Ways of Parting"
cianowins.5.desc:0 "The car stopped in front of the Ciampino Military Airport, the only one in the large parking at that late hour. From it, four figures emerged: two were dressed in uniform, while the others - a man and a woman - appeared as civilians. The small group hurried through the entrance, the two officers bringing several suitcases, until they reached a small private jet ready to depart.\n\nThe civilian couple boarded the plane while the men in uniform loaded the luggage. When everything was ready, the soldiers gave one last salute to the man they had escorted, then they left for their car as the jet's engines heated up: after a few seconds, the plane took off.\n\nAs he looked at the shrinking silhouette of the Eternal City, Galeazzo Ciano felt a pang of longing. He would most likely never return to Italy, if not after his death: he would now live the life of a commoner, hoping that his country would not try to exact revenge.\n\nShame filled him. For all his attempts at keeping his dignity, he had fled into the night like a common criminal: the next morning, all would know the Duce had left Rome under the cover of darkness, and laugh at him. In the King's office, he had quoted Garibaldi, but now the truth was laid bare in front of him: Garibaldi? How could he compare himself to Garibaldi? He was not a hero, he was not a saviour - he was a failure, and he would be remembered as such.\n\nA hand on his cheek took him from his destructive thoughts. He focused again, and saw his wife looking at him with a bit of worry in her shaken face.\n\n"I know Galeazzo," Edda Ciano spoke, "But this is how things have gone. We are safe, and this is enough: let's rebuild our life, the rest will come with time."\n\nThe former Duce would have liked to rebuke his wife's words, but no reply came to him. Sadly, she was right: he had failed, and now he would have to find a new purpose on the other side of the ocean."
cianowins.5.a:0 "A new dawn rises for Italy, with no Duce in it."

### National Unity Government Events
natunity.1.t:0 "The King's Orders"
natunity.1.desc:0 "Troops, some orderly marching on the streets to set up barricades and checkpoints, some busting into buildings, with officers barking orders and soldiers holding people at gunpoint. Piles of documents, some fed to a shredder, others thrown in a fire, others ripped with bare hands and dispersed to the wind. Letters of resignation by officials, coming in by the dozens, some willingly signed, some handed out after arrests, bribes, and threats. Stashes of weapons and uniforms being seized, truckloads of prisoners being carried to undisclosed locations, former prominent politicians and gerarchi quietly disappearing. All of Italy, from the palaces of Rome to even the smallest rural towns, seemed to be in upheaval, as crowds gathered in the streets to watch in barely concealed amazement.\n\nKing Umberto sat at his royal desk, almost paralyzed: only his right hand moved in repetitive motions, signing the seemingly unending sequence of papers and documents his generals and aides submitted to him Umberto's eyes barely moved to quickly skim through the sheets of paper that he signed, barely seeming to pay attention to whatever uniform was blabbering something in front of him. Umberto hadn't slept in three days, and it didn't seem like he was going to be able to get some sleep any time soon. The Quirinale royal palace was looking more like a military command, with barricades and vehicles around the gates, and troops posted at every corner of the historic centre of Rome.\n\nIt was of vital importance that the Italian people felt that these disturbances were merely a passing occurrence, that everything was evolving in an orderly fashion and that full order would be restored soon: naturally, in reality, everything was chaos. Former PNF officials were already jumping ship and proclaiming their undying loyalty to the king, while MVSN officers were already being arrested and sternly talked into not doing anything stupid. It was working, for the most part: but avoiding popular excitement was already proving to be impossible. Soon, the time would come for the new political equilibrium of Italy to be drawn: the cards were being laid out, and soon the game would begin."
natunity.1.a:0 "The hard part will come later."

natunity.2.t:0 "Foreseen Consequences"
natunity.2.desc:0 ""This is some bullshit!"\n\nThe voices and shouts grew louder, as the police cordon lashed out seemingly at random to contain the crowd, with batons swinging and hitting arms, heads, legs. The noise and clamor only grew louder when a man, dressed in simple dirty clothes, handcuffed and visibly beaten, was dragged out of the factory by two uniformed Carabinieri. Following him, several others, similarly beaten and cuffed, were also taken to the armored van, which sped away under a hail of rocks and bricks, as the police began beating down on the ever more confrontational crowds.\n\nAll across Italy, the winds of change had gripped the hearts of many: those winds carry with them a plague, a disease - a fervour of the soul. Wild hopes, barely coherent demands, the anger at years and years of exploitation being spat out in the face of power, whether or not it wore a blackshirt uniform. Wildcat strikes, spontaneous riots and mass demonstrations were staged across industrial cities, demanding work, bread, liberty, democracy, elections now, socialism, everything. The first red flags soon began to be unfurled in the wind.\n\nAfter the riot in front of the factory had been quelled, the workers didn't stop meeting, talking to each other, organizing. The half forgotten names of antifascist leaders began to circulate more and more. Right when Italian fascism appeared to be at its end, the prisons of Italy held more antifascists, or "troublemakers", than fascists - but prisons and beatdowns wouldn't stop those who fought against fascism for forty years.\n\nIt was dawn when Pietro Nenni stepped out of the train cart, setting foot on Italian soil for the first time in many, many years."
natunity.2.a:0 "How long has it been?"

natunity.3.t:0 "Two Thousand Years"
natunity.3.desc:0 "The evening sun seemed to cut sideways through the silence, between the trees and the blades of grass. Here, amid the chaos of the Eternal City, time almost had the mystical property of remaining perfectly still. A tall man, dressed in cardinal robes, was walking down the same path down which he walked every day, reciting his daily prayers. But this time, he was not talking to God, but to a much shorter man, walking beside him. "Of course, dear Amintore, this conversation should remain private." "Of course, father."\n\n"I don't need to remind you how much the Church is keenly interested in the...unfolding situation. I feel like the lay Catholics should be more...proactive." Amintore Fanfani straightened his tie, thinking of a suitable way to reply. "Father, as I've already told you...we're doing everything that we can. It's just that*". The cardinal sternly interrupted: "No, Amintore." Silence fell over them, as the beauty of the Vatican gardens shone like a gemstone. The cardinal spoke again: "Amintore, we have ruled over this country for two thousand years. We didn't achieve that through violence, fear, or wealth. Sure, all of those were used. But what always mattered was that we gave people what they wanted, always."\n\nThe two men came to a marble bench, under the shade of a great birch. "People want to be reassured. They want to know they're in safe hands. They want to feel cared for, in this life, and in the next." Fanfani nodded silently, as the cardinal continued. "The Church used to provide for this. Times have changed - fascism was something we could work with, but now it is no more, and something else will take its place. You'll have to do this work. You'll need money, connections, publicity. We can help you with those. You'll need an organization - a machine that can govern Italy, and most of all, you'll need to be able to look to the future, and have faith." Fanfani finally spoke: "I understand, father. The party will be formed soon. I will oversee everything." The cardinal smiled: "Yes, and remember - a party that is democratic and Christian.""
natunity.3.a:0 "And two thousand years more."

natunity.4.t:0 "Rebranding"
natunity.4.desc:0 "Giorgio, what the fuck are you talking about?"\n\nThe man sitting at the dinner table had a seemingly unique ability of channeling extreme anger in his mannerism, while simultaneously devouring all of his food with great impetus. His face, red and sweaty, with a panting voice to accompany it, croaked and roared as he fumbled in his elegant dinner dress: just a few months ago, he would have shown up to such a dinner in his MVSN uniform. Giorgio Almirante brought his handkerchief to his mouth, cleaning his moustache before resuming to speak. "I understand how you feel. But we're not in a position where we can afford to lose our cool."\n\nThis was just one of many high, mid and low ranking gerarchi Almirante had met in the past few weeks. Grey PNF bureaucrats, opportunistic military officers, fanatical blackshirts - all of the wide range of specimens that the fascist regime could offer. Some were clearly too compromised or too stupid to be of any use - but most of them still had connections, positions, friends in places that mattered, and at least enough savviness to start thinking about their future career prospects. Almirante had many pieces - the hard work was connecting them. Turning the remnants of a rapidly collapsing regime into something coherent - a movement.\n\n"It's very simple. You know a lot of people in the local police corps. Just agree to keep quiet for the next few weeks, and when they come to investigate you and discharge you, smile and nod. Trust me - us, trust us. We'll make it all, you, I, and everyone who is in our...situation." Almirante's composure only seemed to further agitate his interlocutor, whose face turned ever more red. "No, how about you listen to me instead, Giorgio. My blackshirts are still loyal to me, and I know a guy, who knows a guy who is an army general, and he also is a fascist with a spine and if we give the order to fight back we-" Giorgio interrupted him, speaking in his usual cool and placid tone. "You won't do anything, you imbecile. You're worth less than dirt without us. So now what you will do is stay silent, and let us do the talking. You just need to sign and keep quiet, for now. Or you can keep opening your mouth from the jail cell they'll throw you in. We know what you did, and they'll know too." The other man's face rapidly turned palest white."
natunity.4.a:0 "Oh, how hard it is to keep a flame alive."

natunity.5.t:0 "A Pleasant Meeting"
natunity.5.desc:0 ""Good afternoon, professor!" Aldo Moro quickly turned his head from his desk, surprised by the unannounced visit. With political turmoil engulfing the country, it seemed that the university had become a much quieter place lately: the students were either out protesting or staying safe with their families, and the professors were mostly busy writing political tirades against the fascist regime, of which many of them were self professed ardent supporters a few months earlier. "Good afternoon, but I don't believe we've had the pleasure to meet each other." Moro rose up from his desk, extending his arm in a polite handshake.\n\nThe sharply dressed man, now sitting across the desk from Moro, spoke in a thick Sicilian accent, with a sharp and affable voice. "Yes, the situation is difficult down on the island too. People are hungry, disillusioned, sometimes desperate. That's why I'm here. To offer you our - my full support, Moro... may I call you Aldo?" The man introduced himself as the mayor of a small town outside of Palermo - but it was clear his friends and associates spread across the islands. Land owners and developers, university professors and intellectuals, local bureaucrats, even bishops - he seemed to know them all, and he named one after another as he gave his vivid description of the crisis that was unfolding in Sicily. "Bandits, yes, we have plenty. We've had riots too, and strikes, vandalism, all sorts of violent acts. We need a real government in this country, Aldo. This fascist farce has gone on long enough, I'm sure you agree. We need people with values - people we can trust. We need Democrazia Cristiana."\n\nMoro listened carefully to what his interlocutor said - even taking notes, and in the end he finally replied, politely smiling. "Thank you for your point of view. But you see, I struggle to imagine myself as a politician, much less as a leader. Of course I have been very active in Azione Cattolica, and I've been at the founding meeting of Democrazia Cristiana. But I'm just a member like any other, and to be sincere, I feel like politics is a cut-throat business. I'm very much not cut fo-". The other man looked at his clock, before quickly jumping on his feet. "I am very sorry to interrupt you, mister Aldo, but I must go - I've spoken for longer than I've realized, and I risk missing my train. I assure you, Democrazia Cristiana in Sicily has a long future, and we give you our full support - you are just the man we need, dear Aldo."\n\nMoro pondered for a second, as the other man was about to leave. "Perhaps you're right. But, before you go, have you spoken to a man called Andr-" The man smiled. "Oh, don't worry, I know Giulio already"."
natunity.5.a:0 "Well, politics may be a dirty job, but someone has to do it."

natunity.6.t:0 "Triumph and Defeat"
natunity.6.desc:0 ""No more!" The crowd roared and clapped, with red flags and close fists lifted up high reaching towards the podium and towards the sky. "No more shall this city - this country - be ruled by fascist hangmen! No more shall it be in the hands of rich, corrupt kleptocrats who have oppressed you, beaten you down for decades!" Enrico Berlinguer stopped for a moment to regain his breath, as the crowd of now recently officially unionized workers seemed to go wild. The young socialist politician had already become a favourite of the masses, and he started to speak again, the red hammer and sickle looming behind him. "The path towards socialism is not just the path towards a more just and fair economic system. It's the only path towards democracy! Towards justice and dignity! Towards bread and work for all!"\n\nThe crowd wasn't done cheering and singing yet when Berlinguer, with a wide smile and saluting gestures, left the podium. As he turned to enter his car after withstanding the assault of a few journalists, he noticed someone unexpected sitting in the passenger's seat - another PSI politician, although not quite as well known as Enrico himself, at least yet. "Oh, Benedetto, you're here. Did Pietro send you?". The younger man turned to Berlinguer: "No, Enrico, I'm here of my own will. We need to talk."\n\nAs the car was speeding through the silent countryside, the two men were in an increasingly heated conversation. "I'm just trying to look out for you, Enrico. If you continue like this, you're bound to step on someone's feet and that-" Berlinguer shook his head. "It's what the people want! People want hope! They want change! What we need is-" "What we need, Enrico, is caution. This country seems like it could explode at any moment. We have no idea what the Church - the DC, the fascists, the king, we have no idea what they're planning! They're still in control of this country! How can you not understand that this isn't the time to rock the boat? This is not the start of a revolution Enrico, this could very well be the end of everything!" Berlinguer looked outside of the car window, where the evening sun painted the sky a deep red."
natunity.6.a:0 "But perhaps it doesn't have to be this way."

natunity.7.t:0 "Courtesy Visits"
natunity.7.desc:0 "Pino Rauti calmly polished his glasses before putting them back on. "So, is it done?" In front of him sat three men - two young, and clearly nervous, the other much older, bald, calm and collected. The older man spoke: "Yes, Pino, it's done." Rauti nodded. "And you two? How do you feel?" One of the two younger men, both of them university aged students, spoke out: "Fine. We're fine. It's what we had to do." Rauti stared into their eyes. "Yes, it's what you had to do. Now go get a good night's sleep, and a shower. You need it."\n\nNow left alone with the older man, Pino spoke again. "Now, you disagree with my methods. Sending kids out to do our dirty work, the beatings, the intimidations, everything else. But times have changed. We can't have blackshirts marching down the streets or riding around in tracks. It's... different." The older man shook his head. "You know, back in my day-" Rauti interrupted. "These aren't your days. Can't you see what is going on? Back in your days, the communists were something you could fight in the streets. Now they're not just in the streets, they're everywhere. In the universities, in the factories, in the towns - this is not a battle we can win with the old methods. For all we know, they could be in the armed forces too." The bald man smiled. "About that..."\n\nAfter a while, Rauti was left alone, with several files on his desk. Names, photographs, grades. Men of the armed forces, generals of the army, former blackshirts, upper level bureaucrats. All marked in different colours: blue for monarchist loyalists tied to the court, yellow for known embezzlers and dirty elements, orange for potential socialist sympathizers, and red for "trustworthy people". Rauti smiled, reviewing the files. Perhaps the era of street brawls, protests, pipe bombs and noisy democracy would be over sooner than he had expected."
natunity.7.a:0 "Entering life from the wrong door."

natunity.8.t:0 "The King and His Men"
natunity.8.desc:0 "A more orderly spectacle couldn't be imagined. The bands playing the royal fanfare. The king, along with what seemed an entire battalion of generals, admirals, high ranking diplomats, court attendants and high dignitaries, all impeccably dressed with uniforms and decoration, all sitting, saluting and clapping in unison. The army soldiers all proudly marching, from the Bersaglieri running while playing the trumpet to the Alpini displaying their feathers in the wind; even the colonial troops showed up, and the tall hats of the black ascari were seen among a myriad of grigioverde uniforms. It was so beautiful, one could almost completely ignore the protests barely contained by the police, far away from the king's tribune, where some random minor party was stirring up a mess in the name of pacifism and anti-militarism.\n\nFor the king, what was much less harder to ignore was the short speech of Carabinieri chief general Giovanni De Lorenzo. "Utmost and unquestioned loyalty to the king and the fatherland; these are the pillars on which the dignity of our armed forces stand. Let us take this occasion to remind ourselves, and our whole Italy, of this: the principle of absolute love and servitude that ties us to king and country is imperishable and eternal. Our armed forces are, and will always be, ready to do anything to protect and defend the Kingdom from any threat, from wherever it may come from, whatever be its nature." King Umberto, in an absolutely imperceptible motion, gritted his teeth. This part of the speech wasn't foreseen. De Lorenzo added it of his own volition.\n\nThe king's hands were slightly shaking that evening, as he was attending a formal dinner with all the people with whom he had shared a tribune that afternoon. As the gala was reaching its conclusion, an attendant delivered a note to the king, written in clear and elegant calligraphy. "I have talked to De Lorenzo, and he hasn't changed his mind. I understand your worries, but it probably isn't that bad. We'll just have to let him go ahead anyway. Who knows, it might even be useful one day." Umberto closed the note, stuffing it in his pocket and swallowing the saliva in his mouth."
natunity.8.a:0 "What does a king really rule, anyway?"

natunity.9.t:0 "And the Elections Came"
natunity.9.desc:0 "Some voted because they heard or read about a party's platform one day, were convinced, and never found or tried to find anything that could change their mind. Some voted after spending many sleepless nights reading every political piece on every newspaper they could find, watching every televised debate, listening to radio programs, and desperately pondering where to assign their vote. Some voted because they got paid or threatened by someone. Some voted out of spite or protest, writing insults on the ballot. Some voted because a friend or relative of theirs was running. Some voted because they really didn't understand politics, but a spouse, or child, or relative, kept reminding them how important it was to vote and so they promised it to shut them up. Some entered the booth knowing absolutely nothing, and just made an X on a symbol they thought looked nice. Whatever the reason, it seemed like everyone, with few exceptions, had voted.\n\nAnd once the votes had all been cast, a moment of silence held over Italy. The country had been like the proverbial rock, rolling down a slope and thinking to itself that it was rolling of its own volition and will. Everyone tried to interpret, analyze, predict, convinced that they had finally figured out the truth - the truth was that nobody had figured out anything, and the rock just kept rolling on. All it remained to see was whether it was destined to roll off a cliff, and that's what everyone was wondering."
natunity.9.a:0 "But perhaps this is what freedom means."

