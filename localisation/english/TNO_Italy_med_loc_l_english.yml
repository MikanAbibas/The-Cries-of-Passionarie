 ita_show_greece_decisions:0 "§GShow§! Decisions Involving §BGreece§!"
 ita_hide_greece_decisions:0 "§RHide§! Decisions Involving §BGreece§!"
 ita_train_greek_officers:0 "Train Greek Officers"
 ita_train_greek_officers_desc:0 "Italian army personnel will be dispatched to Athens and the frontlines of Thrace to provide the troops of the Hellenic State's military with training on par with that of the Regio Esercito."
 ita_italian_engineer_companies:0 "Italian Engineer Companies in Macedonia"
 ita_italian_engineer_companies_desc:0 "Engineer detachments from our reserve units currently idle in the mainland can be more useful in accompanying the Greeks. They will support them in the landscape of mountain ranges and rivers that can cause trouble to a force ill-equipped to deal with it."
 ita_enforce_order_in_the_bande:0 "Enforce Order in the Bande"
 ita_enforce_order_in_the_bande_desc:0 "Large segments of our vassal's forces in Thrace are not normal army divisions, but rather bands rallied to fight by independent warlords. Thus, they need to be kept in line by Italian attaches so as to be equally effective in combat."
 ita_ensure_greek_rear_area_security:0 "Ensure Rear Area Security"
 ita_ensure_greek_rear_area_security_desc:0 "The Greek leadership cannot be expected to devote one hundred percent of its men to the war with Turkey when they are facing an entirely different war behind their lines. Our garrisons in the region ought to contain the resistance of EAM and EDES so that Themelis' regime can concentrate its efforts where they must."
 ita_show_aegean_island_decisions:0 "§GShow§! Decisions Involving §Kthe Aegean Islands§!"
 ita_hide_aegean_island_decisions:0 "§RHide§! Decisions Involving §Kthe Aegean Islands§!"
 ita_supply_rhodes_garrison:0 "Supply the Rhodes Garrison"
 ita_supply_rhodes_garrison_desc:0 "Our Aegean possessions are relatively isolated and their garrisons rely on convoys from the mainland, which is why the flow of equipment to the port of Rodi has to continue."
 ita_rally_aegean_locals:0 "Rally Aegean Locals Against the Turks"
 ita_rally_aegean_locals_desc:0 "Those in the Dodecanese who still consider themselves Greek are often hostile to the administration, but even they understand that they would be worse off in case of a successful Turkish invasion. This sentiment can be used to rally even more forces in support of the Rhodes garrison."
