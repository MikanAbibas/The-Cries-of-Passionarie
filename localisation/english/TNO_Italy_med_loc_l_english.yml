 ITA_med.137.t:0 "A Desktop Calculator?"
 ITA_med.137.desc:0 "A great leap forward for consumer electronics occurred when the Italian typewriter manufacturer Olivetti debuted their latest product at a trade fair sponsored by the IRI. Sporting a sleek, futuristic, plastic casing, the Programma 101 is the world's first desktop programmable calculator, capable of performing not just basic arithmetic but also storing inputs and outputs in its electronic memory, and accepting assembly-language code that allows users to implement custom functions - and only for the price of two million lira, or three thousand dollars. This device has the potential to revolutionize white-collar work, from accounting and finance to engineering and scientific research. Already, Olivetti has gotten more than ten thousand orders from large corporations and small firms alike. Some believe that such miniaturized computers are doomed to be novelty items at most - nothing but fancy toys for engineers and businessmen. However, there are a few that see the Programma 101 as the herald of a digital revolution that will eventually place a computer on the desk of every citizen in the industrialized world."
 ITA_med.137.a:0 "It's probably just a fad."
 
 ITA_med.138.t:0 "Leviathan of the Wastes"
 ITA_med.138.desc:0 "The University of Bologna has just announced a promising discovery. Last month, the renowned Italian paleontologist and paleoceanographer Cesare Emiliani led an expedition into the Adriatic salt flats. After a week of searching, the team uncovered a nearly complete fossil from an outcropping of Kimmeridgian-era rock that had been once submerged. The fossil is that of a plesiosaur, an ancient clade of gigantic, long-necked marine reptiles that were the apex predators of the Mesozoic ocean. This new species, named Adriatisaurus emiliani after its discoverer, is thought to be a close cousin of the world-famous Liopleuridon, and prowled the ancient Adriatic about 155 million years ago in the late Jurassic. This expedition has excited paleontologists across the world, as it suggests that the Adriatic salt flats may contain countless other fossils, inaccessible before Atlantropa. This may be the first of many future paleontological discoveries to come out of the reclaimed lands of the Mediterranean."
 ITA_med.138.a:0 "Who knows what else may lurk in those God-forsaken wastes?"
 
 ITA_med.139.t:0 "Horror from the Black Sun"
 ITA_med.139.desc:0 "Private Roberto gazed at the mountains before him. Growing up in the city of Nizza, it would be impossible to not have seen the towering stone formations from a distance, far past the plains and forests which surrounded the city. Normally, patrolling the mountainous terrain was a break from the grueling exercise he would be subject to back at his assigned base - the biggest thing he had to worry about here was carrying the weighty Beretta rifle stored on his back.\n\nNowadays, though, walking the Alps was an exercise in disgust and fear.\n\nIt was no secret that the world was in utter chaos; the Reich had fallen to civil war, and the Nazi empire was quickly crumbling before them. That wasn't what disgusted him. To be honest, he was quite happy that the perfidious Germans, the ones that built the monstrosity of a dam, were once again enjoying sweet karmic retribution.\n\nThe newspaper had been keen to print out issues about the blazing Burgandianian advance into France. It was said that they fell even quicker than in World War 2; that now Paris and swathes of former French territory were now under the firm grasp of the Shadow State. Most people didn't really pay the news much mind: they were more concerned about their latest paycheck, or the most recent news about the state of their local bread prices. Roberta could not enjoy the luxury of not knowing, however.\n\nNow, every day he was assigned to patrol those damned mountains, he would encounter horror on a scale he didn't know was possible. Every day, he would encounter yet another wave of French refugees, most riddled with frostbitten gunshot wounds, barely alive. Those that did make it past the high peaks of the Alps frequently found themselves collapsing near the border, a scant few being dragged to something resembling a medical center, and then subsequently sent further inland for questioning. Most, though, were found gathering flies on the border, gunshot wounds riddling their battered corpses.\n\nEvery day he walked those mountain trails, he would be tasked with burying them in an unmarked ditch."
 ITA_med.139.a:0 "Roberto's transfer request was denied."
 
