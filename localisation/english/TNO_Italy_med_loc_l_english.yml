 ### Resistance Mechanic ###
 
 ITA_fash_resistance_category:0 "The Anti-Fascist Menace"
 ITA_fash_resistance_category_desc:0 "As the Quadrumvirate is locked in an internecine struggle, sinister forces move against the beacon of civilization that is the Empire: traitors, terrorists and fanatics are organizing to strike at the heart of Fascism - the very soul of Italy!\n\nThis cannot come to pass. In a rare moment of unamity, all members of the Quadrumvirate have united to face the gravest threat to the very core of the State itself: the Anti-fascist Liberation Committee. It must be destroyed at all costs!\n\nIn order to restore order in such a short window of time, there is little room for subtlety. Repression - direct suppression of subsersive elements - is the greatest tool at our disposal, and it shall be neccesary to use it without reservation; our multitude of enemies will surely scale up their efforts over time - they must be fought at every turn.\n\nThe horn has sounded, and the horses are ready. The hounds bay at the familiar scent of blood, and the forest awaits the coming struggle in trepidation: there is no room for pity -\n\n§eFor it is victory or death.§!\n\nThe extent of gathered intel on the Anti-Fascist Liberation Commitee is currently [ITA_fash_resistance_clues_status] (§G[?ITA_fash_resistance_clues]%§!).\n\nAs the hunt continues, §Ycertain events§! will occur. Depending on how high §Rrepression§! is at the time, the amount of information ultimately gathered from these chance events may differ.\n\n§RRepression§! efforts across the Empire are currently [ITA_fash_resistance_repression_status] (§Y[?ITA_fash_resistance_repression]§!) §Ybut it might not be enough§!.\n\nInvestigation Results:[ITA_fash_resistance_event_result_0][ITA_fash_resistance_event_result_1][ITA_fash_resistance_event_result_2][ITA_fash_resistance_event_result_3][ITA_fash_resistance_event_result_4][ITA_fash_resistance_event_result_5][ITA_fash_resistance_event_result_6][ITA_fash_resistance_event_result_7][ITA_fash_resistance_event_result_8][ITA_fash_resistance_event_result_9][ITA_fash_resistance_event_result_10]"
 
