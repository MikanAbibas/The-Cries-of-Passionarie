 ITA_camera_current_0_color:0 "§e"
 ITA_camera_current_0:0 "§ePSI-Berlinguer's Clique§!"
 ITA_camera_current_0_short:0 "§ePSI-BC§!"
 ITA_camera_current_0_formal:0 "§ePartito Socialista Italiano - Berlinguer's Clique§!"
 ITA_camera_current_0_desc:0 "A group of communist politicians consisting of the far left of the Italian Socialist Party, picking up the legacy of the Communist Party of Italy - some of them even veterans of the party disbanded during WW2. Rallying around the charismatic figure of Enrico Berlinguer, they espouse a strongly socialist platform known as the "Italian way to socialism" while campaigning against corruption and clientelism in the Italian government."
 ITA_camera_current_0_pm:0 "Enrico Berlinguer"
 ITA_camera_current_0_pm_desc:0 "$POLITICS_ENRICO_BERLINGUER_DESC$"
 ITA_camera_current_0_pm_ability:0 "Red Inquisitor\n   Passing DDLs builds §YOptimism§!, increasing DDL Negotiation Efficacy and Base DDL Support\n   Failing a DDL resets §YOptimism§!\n   DDL Negotiation Efficacy: §R-50.00%§!\n   Base DDL Support: §R-5.00%§!"
 ITA_camera_current_0_pm_ability_title:0 "OPTIMISM"
 ITA_camera_current_0_pm_ability_tt:0 "Current §YOptimism§! is §G[?ITA_ddl_optimism|2]%§!, providing the following benefits:\n   DDL Negotiation Efficacy: §G+[?ITA_ddl_negotiation_effectiveness_modifier_optimism|2%]§!\n   Base DDL Support: §G+[?ITA_ddl_base_support_modifier_optimism|2%]§!\n\nThe next DDL passed will increase §YOptimism§! by §G[?ITA_ddl_next_optimism_incr|2]%§!"

 ITA_camera_current_1_color:0 "§e"
 ITA_camera_current_1:0 "§ePSI-Massimalista§!"
 ITA_camera_current_1_short:0 "§ePSI-Mx§!"
 ITA_camera_current_1_formal:0 "§ePartito Socialista Italiano - Massimalista§!"
 ITA_camera_current_1_desc:0 "Led by long time socialist leader Pietro Nenni, this heterogeneous current consists of most of the left wing of the Italian Socialist Party. The Maximalists advocate for the "maximum program," a rapid Italian transition towards socialism. Members of the current are ideologically varied, some taking inspiration from ideologies such as Luxemburgism or even interwar syndicalism."
 ITA_camera_current_1_pm:0 "Pietro Nenni"
 ITA_camera_current_1_pm_desc:0 "$POLITICS_PIETRO_NENNI_DESC$"
 ITA_camera_current_1_pm_ability:0 "Old Socialist\n   Minimum DDL Stato Effectiveness Bonus: §G20.00%§!\n   DDL Amendment Effectiveness Penalty: §R+25.00%§!"

 ITA_camera_current_2_color:0 "§J"
 ITA_camera_current_2:0 "§JPartido Radicale§!"
 ITA_camera_current_2_short:0 "§JPR§!"
 ITA_camera_current_2_formal:0 "§JPartito Radicale§!"
 ITA_camera_current_2_desc:0 "The Radical Party is a small but vocal party, the backbone of which consists of a group of intellectuals and activists tied to their young leader Marco Pannella. Despite espousing moderately pro-free market policies, the Radicals' fiercely libertarian stances on issues such as LGBT rights, women's rights, religion and other social topics put them firmly in the leftist camp."
 ITA_camera_current_2_pm:0 "Marco Pannella"
 ITA_camera_current_2_pm_desc:0 "$POLITICS_MARCO_PANELLA_DESC$"
  ITA_camera_current_2_pm_ability:0 "Enlightened One\n   Coalition Window Radicalization Penalty: §G-60.00%§!\n   Base Coalition Window: §R-0.50§!"

 ITA_camera_current_3_color:0 "§e"
 ITA_camera_current_3:0 "§ePSI-Minimalista§!"
 ITA_camera_current_3_short:0 "§ePSI-Mn§!"
 ITA_camera_current_3_formal:0 "§ePartito Socialista Italiano - Minimalista§!"
 ITA_camera_current_3_desc:0 "A large current consisting of the centre and right of the Italian Socialist Party, calling back to the reformist tradition of the pre-war PSI of Turati and Matteotti. Led by Riccardo Lombardi, they believe that the long path towards socialism is paved with slow, gradual reforms. For the most part, they're strong proponents of keynesian economic theories and have moderate stances on social issues."
 ITA_camera_current_3_pm:0 "Riccardo Lombardi"
 ITA_camera_current_3_pm_desc:0 "Riccardo Lombardi is a man well known within Italian political circles, yet he takes a backseat to his PSI peers within the public eye. Years ago, in the wake of the fascist party's rise, Lombardi partnered with members of the DDI to combat the new regime. However, as the years went on, he slowly became disgusted at their lack of willingness to fight back against the Duce and struck out on his own\n\nFrom there, Lombardi joined the resistance against Mussolini's rule and became one of its leaders. Despite being beaten and tortured by blackshirts under Mussolini's regime, Lombardi has survived to see Italy democratize with his ideals intact.\n\nNow, he serves as one of Nenni's most prominent peers in the PSI. Where Nenni is the fierce and passionate face of the party, Lombardi is its calm and careful backbone. His focus rests mostly on keeping unity within the party, and keeping corruption out of it. His particular brand of socialism is one of reform, not of revolution."

 ITA_camera_current_4_color:0 "§S"
 ITA_camera_current_4:0 "§SPSDI§!"
 ITA_camera_current_4_short:0 "§SPSDI§!"
 ITA_camera_current_4_formal:0 "§SPartito Socialista Democratico Italiano§!" 
 ITA_camera_current_4_desc:0 "The Italian Socialist Democratic Party is a social democratic party led by Giuseppe Saragat. A moderate reformist party, they believe in a gradual transition towards a welfare state able to stop the worst excesses of capitalism while substantially maintaining the free market intact. They often espouse moderate or occasionally even conservative positions in regard to social issues."
 ITA_camera_current_4_pm:0 "Giuseppe Saragat"
 ITA_camera_current_4_pm_desc:0 "$POLITICS_GIUSEPPE_SARAGAT_DESC$"
 ITA_camera_current_4_pm_ability:0 "Humanistic Marxist\n   DDL Negotiation Efficacy: §G+100.00%§!\n   Base DDL Support: §R-5.00%§!"

 ITA_camera_current_5_color:0 "§n"
 ITA_camera_current_5:0 "§nPRI§!"
 ITA_camera_current_5_short:0 "§nPRI§!"
 ITA_camera_current_5_formal:0 "§nPartito Republicano Italiano§!" 
 ITA_camera_current_5_desc:0 "The Italian Republican Party is a small progressive and liberal party, claiming a legacy that dates back to the days of Mazzini and the Risorgimento, and later to the Historical Far Left. While their opposition to the monarchy often creates friction with the Court, their moderate progressive policies are viewed as agreeable by both the political Centre and the moderate Left."
 ITA_camera_current_5_pm:0 "Ugo La Malfa"
 ITA_camera_current_5_pm_desc:0 "$POLITICS_UGO_LA_MALFA_DESC$"
 ITA_camera_current_5_pm_ability:0 ""
 ITA_camera_current_5_pm_ability_title:0 ""
 ITA_camera_current_5_pm_ability_tt:0 ""

 ITA_camera_current_6_color:0 "§B"
 ITA_camera_current_6:0 "§BDC-Rinnovamento Democratico§!"
 ITA_camera_current_6_short:0 "§BDC-RD§!"
 ITA_camera_current_6_formal:0 "§BDemocrazia Cristiana - Rinnovamento Democratico§!" 
 ITA_camera_current_6_desc:0 "The most leftist current of Christian Democracy, Democratic Renewal represents the segment of the party most closely tied to the Catholic trade unions and labour associations such as CISL and ACLI. Led by Carlo Donat-Cattin, they strongly espouse social catholicism and the social doctrine of the Church, arguing for a strong welfare state to ensure fair wages while maintaining conservative positions on social topics."
 ITA_camera_current_6_pm:0 "Carlo Donat-Cattin"
 ITA_camera_current_6_pm_desc:0 "Carlo Donat-Cattin has always viewed himself as a direct, single-minded man - while especially to foreign observers he embodies the many contradictions of Democrazia Cristiana, and of Italian politics as a whole. Born in Liguria into an impoverished noble family in 1919, Donat-Cattin was from his youth a devout Catholic, and despite failing to complete his university studies, he read everything from Dostoevsky to French Christian thinkers such as Bernanos and Maritain. Forced to join the PNF, he always refused to wear the blackshirt, and kept his antifascist sympathies while developing his own form of Catholic humanism.\n\nDonat-Cattin found a job as a factory worker, and after being drafted as an infantryman in WW2, became increasingly involved in lay Catholic associations, which he vocally promoted among his colleagues. Kept under close watch by fascist police, Donat-Cattin joined Democrazia Cristiana when the movement was in its infancy; quickly, he rose the party’s ranks to become the de facto leader of Rinnovamento Democratico, the leftist internal current of DC, also founding CISL, the Italian Catholic trade unions confederation.\n\nNow, Donat-Cattin has been chosen by DC and its coalition partners to take the position of Prime Minister. There is much on the agenda of the new government: from empowering trade unions to expanding welfare policies, all must be done to ensure that, in accordance with Catholic doctrine, every worker has enough to live a dignified life, sheltered from the dangers of want and the temptations of extremism, so that a truly just and free society may finally arise in Italy. His right wing opponents call him a crypto-communist, while his leftist adversaries call him a paternalistic bigot: but this matters little to Donat-Cattin. Politics can be a dangerous and brutal game, but in the end, all a man can do is have faith."

 ITA_camera_current_7_color:0 "§B"
 ITA_camera_current_7:0 "§BDC-Nuove Cronache§!"
 ITA_camera_current_7_short:0 "§BDC-NC§!"
 ITA_camera_current_7_formal:0 "§BDemocrazia Cristiana - Nuove Cronache§!" 
 ITA_camera_current_7_desc:0 "A moderate reformist current of Christian Democracy, New Chronicles is led by veteran politician Amintore Fanfani. Positioned slightly left of centre, the current is the heir of the more progressive currents of the interwar Italian People's Party. Proponents of moderate welfare policies in line with the social doctrine of the Church and conservative social positions, this current makes up a significant portion of the older generation of DC politicians."
 ITA_camera_current_7_pm:0 "Amintore Fanfani"
 ITA_camera_current_7_pm_desc:0 "$POLITICS_AMINTORE_FANFANI_DESC$"
 ITA_camera_current_7_pm_ability:0 "Nano Maledetto\n   Base DDL Support: §G+3.33%§!\n   Out-Coalition DDL Negotiation Efficacy: §R-50.00%§!"

 ITA_camera_current_8_color:0 "§B"
 ITA_camera_current_8:0 "§BDC-Dorotei§!"
 ITA_camera_current_8_short:0 "§BDC-D§!"
 ITA_camera_current_8_formal:0 "§BDemocrazia Cristiana - Dorotei§!" 
 ITA_camera_current_8_desc:0 "Named after the Santa Dorotea convent in Rome, the Dorotei are a centrist current of Christian Democracy led by Aldo Moro, consisting of a significant portion of the older generation of DC members. They are moderates with close ties to the industrial world and the Church, largely in favour of a limited welfare state and a conservative attitude towards social changes."
 ITA_camera_current_8_pm:0 "Aldo Moro"
 ITA_camera_current_8_pm_desc:0 "$POLITICS_ALDO_MORO_DESC$"
 ITA_camera_current_8_pm_ability:0 "Purebred Horse\n   Lower §Gradicalization§! improves DDL Negotiation Efficacy\n   Passing DDLs decreases §Gradicalization§!\n   Failing a DDL increases §Gradicalization§!"
 ITA_camera_current_8_pm_ability_title:0 "COOPERATION"
 ITA_camera_current_8_pm_ability_tt:0 "Current §YCooperation§! is §G[?ITA_ddl_cooperation|2]%§!, based on §Gradicalization§!. It provides the following benefits:\n   DDL Negotiation Efficacy: §G+[?ITA_ddl_negotiation_effectiveness_modifier_cooperation|2%]§!\n\nPassing a DDL decreases §Gradicalization§! by §G1.50%§!\nFailing a DDL increases §Gradicalization§! by §R3.00%§!"

 ITA_camera_current_9_color:0 "§B"
 ITA_camera_current_9:0 "§BDC-Primavera§!"
 ITA_camera_current_9_short:0 "§BDC-P§!"
 ITA_camera_current_9_formal:0 "§BDemocrazia Cristiana - Primavera§!" 
 ITA_camera_current_9_desc:0 "Strongly supported by the Vatican, Primavera (meaning "Spring") is the most right wing internal current of Christian Democracy, led by ambitious rising politician Giulio Andreotti. Consisting of a younger generation of upstart DC politicians, they nevertheless managed to gain a strong footing in local party sections across Italy. They are strongly socially conservative and largely pro-free market."
 ITA_camera_current_9_pm:0 "Giulio Andreotti"
 ITA_camera_current_9_pm_desc:0 "$POLITICS_GIULIO_ANDREOTTI_DESC$"
 ITA_camera_current_9_pm_ability:0 "Il Divo\n   Low §Ystability§! increases Base DDL Support and DDL Effectiveness\n   Base DDL Support: §R-5.00%§!\n   Base DDL Effectiveness: §R-5.00%§!"
 ITA_camera_current_9_pm_ability_title:0 "MANI SPORCHE"
 ITA_camera_current_9_pm_ability_tt:0 "The available assistance from the underworld, measured by §YMani Sporche§!, is §G[?ITA_ddl_underworld|2]%§! based on §Ystability§!. It provides the following benefits:\n   Base DDL Support: §G+[?ITA_ddl_base_support_modifier_underworld|2%]§!\n   DDL Effectiveness: §G+[?ITA_ddl_effectiveness_modifier_underworld|2%]§!"

 ITA_camera_current_10_color:0 "§Q"
 ITA_camera_current_10:0 "§QPLI§!"
 ITA_camera_current_10_short:0 "§QPLI§!"
 ITA_camera_current_10_formal:0 "§QPartito Liberale Italiano§!" 
 ITA_camera_current_10_desc:0 "The Italian Liberal Party is a small market liberal party led by former bank director Giovanni Malagodi. Socially conservative, the Radicals are the most pro-free market and laissez-faire capitalist party in Italy, defending the interests of small businesses against state-supported monopolies and large companies. They are bitterly opposed to socialism, and more than willing to ally with the centre or the right."
 ITA_camera_current_10_pm:0 "Giovanni Malagodi"
 ITA_camera_current_10_pm_desc:0 "$POLITICS_GIOVANNI_MALAGODI_DESC$"

 ITA_camera_current_11_color:0 "§s"
 ITA_camera_current_11:0 "§sPDI§!"
 ITA_camera_current_11_short:0 "§sPDI§!"
 ITA_camera_current_11_formal:0 "§sPartito Democratico Italiano§!" 
 ITA_camera_current_11_desc:0 "The Italian Democratic Party is a strongly conservative and right wing populist party centered around the figure of wealthy magnate Achille Lauro. Rallying the more rightist segments of the new democratic establishment that doesn't descend from the old PNF, the PDI represents the interests of the people most tied to the royal establishment as well as the conservative upper classes of the South."
 ITA_camera_current_11_pm:0 "Achille Lauro"
 ITA_camera_current_11_pm_desc:0 "$POLITICS_ACHILLE_LAURO_DESC$"

 ITA_camera_current_12_color:0 "§j"
 ITA_camera_current_12:0 "§jMSI-Democrazia Nazionale§!"
 ITA_camera_current_12_short:0 "§jMSI-DN§!"
 ITA_camera_current_12_formal:0 "§jMovimento Sociale Italiano - Democrazia Nazionale§!" 
 ITA_camera_current_12_desc:0 "The most moderate internal wing of the Italian Social Movement, National Democracy is a group of former PNF politicians who present themselves as national conservatives and nationalists, largely abandoning much of the old fascist rhetoric. Arguing for moderate state interventionism in the economy and for fiercely conservative social positions, they are led by veteran former PNF politician Ernesto De Marzio."
 ITA_camera_current_12_pm:0 "Ernesto De Marzio"
 ITA_camera_current_12_pm_desc:0 "Ernesto De Marzio's life was tied to fascism since his youth: born in 1910 in a small Apulian town, he studied political science in university, participating in the Littoriali and at the age of 23 already occupied a prominent position in his local PNF section. His career would quickly take him farther however, and a few years later he would become a member of parliament in Rome.\n\nDe Marzio appeals to a broad base of individuals in the MSI-DN. De Marzio's moderate positions and political pedigree made him the natural leader of the faction of the MSI known as Democrazia Nazionale, composed of those on the fringes of the party more willing to come to terms with Italy's new democratic order.\n\nIt is De Marzio’s opinion that some concessions to the liberal elements are worth it to keep out any kind of Marxist and Bolshevik ideology from taking root in Italy. He tries to explain this to his fellow constituents that if Italian traditions of the past hundred years are to endure, some reform is not only necessary but welcome to carry their message to the newer generation of citizens."

 ITA_camera_current_13_color:0 "§j"
 ITA_camera_current_13:0 "§jMSI-Almirante's Clique§!"
 ITA_camera_current_13_short:0 "§jMSI-AC§!"
 ITA_camera_current_13_formal:0 "§jMovimento Sociale Italiano - Almirante's Clique§!"
 ITA_camera_current_13_desc:0 "United under the charismatic Giorgio Almirante, this current represents the "centre" of the Italian Social Movement, mostly composed of former PNF politicians who constantly alternate between claiming the old fascist legacy for themselves and swearing their loyalty to the new democratic order. Arguing for a sort of "soft corporatism", Almirante and his men are ultraconservative or even outright reactionary in social issues."
 ITA_camera_current_13_pm:0 "Giorgio Almirante"
 ITA_camera_current_13_pm_desc:0 "$POLITICS_GIORGIO_ALMIRANTE_DESC$"

 ITA_camera_current_14_color:0 "§j"
 ITA_camera_current_14:0 "§jMSI-Ordine Nuovo§!"
 ITA_camera_current_14_short:0 "§jMSI-ON§!"
 ITA_camera_current_14_formal:0 "§jMovimento Sociale Italiano - Ordine Nuovo§!" 
 ITA_camera_current_14_desc:0 "Representing the far right fringe of the Italian Social Movement, New Order is an openly neofascist group of mostly younger politicians led by Pino Rauti. Espousing a radically reactionary political mindset together with a strongly corporatist economic outlook, New Order is disliked for their intransigence by the more pragmatic party leadership, but it is strongly rooted among the youth section of the MSI, the FUAN."
 ITA_camera_current_14_pm:0 "Pino Rauti"
 ITA_camera_current_14_pm_desc:0 "$POLITICS_PINO_RAUTI_DESC$"

