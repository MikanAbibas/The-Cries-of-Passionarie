ITA_mission_send_in_the_blackshirts_ciano_desc:0 "Criminals are causing a rampage on the streets, weakening the government. We need to send the Blackshirts to put this scum back on their place. However, this could also strengthen the aggressive rhetoric of our detractors."

ITA_find_the_weak_links:0 "Find the Weak Links"
ITA_find_the_weak_links_desc:0 "Ciano is a giant with feet made of clay: his position is weaker than he thinks. The faster we can remind his Gerarchi of this fact, the faster will be able to get him out of power. It won't be hard to convince them Ciano's rule will soon be over."
ITA_use_regia_marina_contacts:0 "Use Regia Marina Contacts"
ITA_use_regia_marina_contacts_desc:0 "Borghese and his inner circle inside the Regia Marina remain loyal dedicated Fascists. It's rather obvious that he sees Ciano as a threat to the cause. Why don't ask him for help?"
decision_cost_10_pp_5_navy_xp:0 "£political_power_texticon §Y10§! £navy_experience §Y5§!"
decision_cost_10_pp_5_navy_xp_blocked:0 "£political_power_texticon §R10§! £navy_experience §R5§!"
decision_cost_10_pp_5_navy_xp_tooltip:0 "It costs £political_power_texticon §Y10§! £navy_experience §Y5§! to take this decision"
ITA_open_threats:0 "Open Threats"
ITA_open_threats_desc:0 "Some people need to be pushed a little to understand things. We must send the Blackshirts to pay a visit to members of Ciano's Gerarchi to make them see reason. Or see a few bones of their bodies broken."
ITA_send_in_the_blackshirts:0 "Send in the Blackshirts"
ITA_send_in_the_blackshirts_desc:0 "That foolish Ciano is incapable of stopping a potential Communist uprising on the makings. We'll do the job ourselves by sending the Blackshirts and ruthlessly crush those Communist subversives. He doesn't need to thank us."
ITA_appeal_to_the_hardliners:0 "Appeal to the Hardliners"
ITA_appeal_to_the_hardliners_desc:0 "Communists are causing mayhem on the streets, and people need to be aware of this. Using our contacts on the media, we'll remind the Italian patriots who the real enemy is: the Red Menace."
ITA_beat_them_harder:0 "Beat Them Harder!"
ITA_beat_them_harder_desc:0 "Communist agitators across the country are causing a ruckus and so far our attempts to quiet them have been ineffective. The police are often outnumbered and stretched too thin to contain these protests and are vulnerable to attack. Our loyal Blackshirts have been itching for an opportunity to join the fray and so far we have held them back because of their own penchant for rowdiness and difficulty in controlling them. As the days go on however, it seems more and more clear that we cannot afford to hesitate when dealing with these communist thugs. If they want a fight, we'll just have to give it to them."

ITA_mission_find_the_weak_links:0 "§r(Fascists)§! Find the Weak Links"
ITA_mission_find_the_weak_links_desc:0 "Ciano is a giant with feet made of clay: his position is weaker than he thinks. The faster we can remind his Gerarchi of this fact, the faster will be able to get him out of power. It won't be hard to convince them Ciano's rule will soon be over."
ITA_mission_use_regia_marina_contacts:0 "§r(Fascists)§! Use Regia Marina Contacts"
ITA_mission_use_regia_marina_contacts_desc:0 "Borghese and his inner circle inside the Regia Marina remain loyal dedicated Fascists. It's rather obvious that he sees Ciano as a threat to the cause. Why don't ask him for help?"
ITA_mission_open_threats:0 "§r(Fascists)§! Open Threats"
ITA_mission_open_threats_desc:0 "Some people need to be pushed a little to understand things. We must send the Blackshirts to pay a visit to members of Ciano's Gerarchi to make them see reason. Or see a few bones of their bodies broken."
