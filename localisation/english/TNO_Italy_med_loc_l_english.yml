 ITA_camera_help_0_t:0 "THE CAMERA\nDEI DEPUTATI"
 ITA_camera_help_0_d:0 "The §YCamera dei Deputati§! is the backbone of Italy's budding democracy. The elected §Ydeputies§! of $ITA_camera_left_name_lc$, $ITA_camera_center_name_lc$, and $ITA_camera_right_name_lc$ are divided into political §Ycurrents§!, each of which have their own goals and loyalties.\n\nWrangling these factions will be necessary both to form a §Mgoverning coalition§! and to pass legislation, called §YDisegno di Legge§! or §YDDLs§!."

 ITA_camera_help_1_t:0 "CAMERA\nDISPLAY"
 ITA_camera_help_1_d:0 "Above is the camera display, which shows the makeup of the Camera by political §Ycurrent§! and highlights the number of §Ydeputies§! which support the current government. A minimum of 201 deputies are needed to govern.\n\nThe toggle on the top left allows switching between §YCoalition View§!, which displays the ruling coalition, and §YDDL View§!, which can be used to see which members support the active §YDDL§!."

 ITA_camera_help_2_t:0 "POLITICAL\nCURRENTS"
 ITA_camera_help_2_d:0 "This section shows information for each §Ycurrent§!, divided broadly into $ITA_camera_left_name_lc$, $ITA_camera_center_name_lc$, and $ITA_camera_right_name_lc$. Here, you can see the number of deputies who are members of that current and the number who support an active DDL.\n\nDuring §YGovernment Formation§! or voting on a §YDDL§!, you may also use a button to negotiate with each current."

 ITA_camera_help_3_t:0 "THE POLITICAL\nSPECTRUM"
 ITA_camera_help_3_d:0 "The below diagram shows each §Ycurrent§! arranged from left to right on a political spectrum.\n\nAbove the diagram, §Ycurrents§! in the §Mgoverning coalition§! are displayed in blue. The §Mblue bar§! highlights the §Mcoalition lean§!, a representation of the overall political leaning of the coalition.\n\nBelow the diagram, the §Rred bar§! highlights the §Rpolicy lean§!, which represents the political leaning of passed §YDDLs§!. If a coalition starts to act in a way a member current doesn't like, represented by this bar moving into a cross-hatched region, that current will §eabandon§! the coalition! If §Gradicalization§! increases, currents will be less tolerant, and these regions will creep inwards.\n\nWhen a §YDDL§! is active, its political alignment is shown with a green dot, and its effects on the §Rpolicy lean§! are shown with a §Ggreen bar.§!"

 ITA_camera_help_4_t:0 "DEMOCRACY\nIN ACTION"
 ITA_camera_help_4_d:0 "The §YCamera dei Deputati§! is a complex system, and keeping a government afloat is no easy task. Fear not - collapse does not mean the end of democracy. Nevertheless, one who can master the levers of power, forming §Mstrong coalitions§! and tactfully negotiating support for §YDDLs§! may be able to accomplish quite a bit!\n\nYou can find more information on §YGovernment Formation§! and voting on §YDDLs§! by clicking the help icon in their relevant sections."

 ITA_camera_help_5_t:0 "GOVERNMENT\nFORMATION"
 ITA_camera_help_5_d:0 "After an election or governmental collapse, the process of §YGovernment Formation§! occurs.\n\nIn the first step of the process, a §YPrime Minister§! is chosen from the election-winning §Ywing§! or the §Ywing§! corresponding to the current §Rpolicy lean§!. After an election, the §YPM§! determines the initial §Rpolicy lean§! and by extension which parties are willing to cooperate to form a government."

 ITA_camera_help_6_t:0 "CONVINCING\nCURRENTS"
 ITA_camera_help_6_d:0 "Once a §YPM§! is chosen, an initial §YCoalition Core§! of §Ycurrents§! is automatically added to the coalition. Then, adjacent §Ycurrents§! can be persuaded to join the coalition based on your §Rpolicy lean§! and current §Gradicalization§! using the buttons on the current list.\n\nSome §Ycurrents§! may be reluctant to join your coalition, and will require making a §YPromise§! to secure their support."

 ITA_camera_help_7_t:0 "FINALIZING\nA COALITION"
 ITA_camera_help_7_d:0 "Once at least 201 §Ydeputies§! are included in a proposed coalition, it can be confirmed and governance can begin immediately.\n\nFollowing an election, if no government is formed in seven days, the second-place §Ywing§! will be given a chance to form a government. If the Government Formation process was initiated by coalition collapse instead, §Ysnap elections§! will be called. As §Gradicalization§! rises, both become more likely. Repeated failure may have §emore drastic consequences...§!"

 ITA_camera_help_10_t:0 "PASSING DESEGNO\nDI LEGGE"
 ITA_camera_help_10_d:0 "Legislation is passed in the Camera in the form of a §YDisegno di Legge§! or §YDDL§!.\n\nOnce put to the floor, a DDL's name and text is displayed on the left. The DDL is debated for a fixed number of days, at which point a vote is called. If at least 201 §Ydeputies§! support the DDL, it becomes law.\n\nEach DDL has an associated political §Glean§!, which is displayed as a §Ggreen dot§! on the spectrum diagram. This lean factors in to the overall §Rpolicy lean§! if passed, which is shown by the §Ggreen bar§!."

 ITA_camera_help_11_t:0 "CRAFTING\nEFFECTIVE BILLS"
 ITA_camera_help_11_d:0 "Just as important as the text of a §YDDL§! is how well it's implemented once passed. This is measured by the §GEffectiveness§! bar.\n\nThe base §GEffectiveness§! of each DDL begins at §G50%§!. Up to an additional §G+50%§! can be gained based on the support of relevant §YStato§! factions in the §YPillars of Power§!. Which factions matter depends on the nature of the DDL. On the other hand, §YAmendments§! will tend to reduce §GEffectiveness§!, sacrificing the bill's focus to garner votes or add secondary effects."

 ITA_camera_help_12_t:0 "ADDING\nAMENDMENTS"
 ITA_camera_help_12_d:0 "§YAmendments§! allow for the political §Glean§! and effects of a §YDDL§! to be tweaked in order to secure support or keep a coalition together.\n\nThese §YAmendments§! have varying effects, but most will move the political §Glean§! leftward or rightward and will reduce §GEffectiveness§! as a bill becomes less focused. These Amendments will also affect how each political §Ycurrent§! feels about the §YDDL§!, changing how many §Ydeputies§! support it." 

 ITA_camera_help_13_t:0 "SECURING\nSUPPORT"
 ITA_camera_help_13_d:0 "While §YAmendments§! are the best way to swing a large amount of support for a §YDDL§!, it is also possible to directly negotiate with §Ycurrents§! provided there is already some support for the DDL.\n\nNegotiating costs political power, and may sway a few §Ydeputies§! to support the DDL, with a higher number flipping the more the current supports the DDL." 

