 #Italy Terror Events (Piazza Fontana)#
 itaterror_med.1.t:0 "Red Moon"
 itaterror_med.1.d:0 "At 4:37 PM, inside the building of the National Agricultural Bank in Piazza Fontana, Milan, a sudden flash was seen, followed by a loud noise. At 4:38 PM, the building was devastated, with several bodies lying bloodied on the floor, and the cries of survivors, wounded and shocked, loudly heard inside the building and the surrounding square. At 5:00 PM, rumours spread around the city that a boiler malfunctioned and exploded in a building near the city centre, causing a few deaths, and firefighters and ambulances are now present on the scene in ever greater number. At 5:37 PM, news spread that three more explosions have been heard, this time in Rome, which however caused no victims, and the first remnants of TNT are found in the destroyed Piazza Fontana Building. At the end of the day, 12th of December 1969, the dead start to be counted.\n\nThe earliest investigations reveal that the explosion was caused by seven kilograms of TNT placed inside the building by an unknown hand. The same day, a Milanese anarchist named Giuseppe Pinelli was arrested by the local police, suspected of carrying out the attack. The bodies were not even cold yet when the people and the media were already desperate to find someone to blame. After an interrogation taking place over the course of three days, Pinelli fell from a fourth floor window in the police building, meeting his death upon the impact with the floor.\n\nThe following day, what seems to be the culprit is finally arrested - Pietro Valpreda, another anarchist, connected to the crime scene by a witness (a cab driver who allegedly transported him there some time before the explosion and saw him carrying a large suitcase into the building) and by police reports pointing out to an alleged stash of explosives found in the headquarters of the anarchist cell Valpreda is part of. Now, public opinion is polarized - some mourn, others cry out for justice to come down, and others yet have already started to criticize the official narrative that is being constructed by media. The frustration, suffering, and enthusiasm that characterized the chaotic season of the Hot Autumn is slowly giving way to another, more subtle and yet far more dangerous feeling - fear."
 itaterror_med.1.a:0 "Terror reaps its bloody harvest."

 itaterror_med.2.t:0 "Starless Night"
 itaterror_med.2.d:0 "It was after months of uncertainty and fear, violence and bloodshed, and in some cases, hope, that the Hot Autumn finally ended. Some had died and some had lived, some had fulfilled their dreams and others had been left only with the taste of bitter disappointment. While the names of some would be remembered, hundreds of thousands of the names of those affected and hurt everyday by the violence and chaos in the streets would not.\n\nAs Italy looks forward towards moving past the violence and bloodshed and entering into the promising seventies, many across the nation feel hope for the first time in months. Violence and thuggery had won out once, yes, but there was no guarantee that it had to win again. For the fathers and mothers, students and soldiers, politicians and capitalists of the Kingdom, a dim light shines just above the horizon, obscured by the cloudline. Most hope it to be the dawn, but only a few truly realize what it is.\n\nA red moon rises over Italy, and soon all will look back at even the Hot Autumn with a sense of nostalgia."
 itaterror_med.2.a:0 "Soon, the world shall change forever."

 
 
 
 ITA_Umberto_II:0 "Umberto II di Savoia"
 POLITICS_UMBERTO_II_DESC:0 "After the now-former Duce relinquished his mantle, dismantling the fascist regime, the country needed a steady and reassuring hand to steer it towards democracy. King Umberto II offers just that: well-loved by the population for his calm and gentle demeanor, and fanatically obeyed by the higher echelons of the Armed Forces, the monarch is known for his steadfast support to democracy.\n\nWith the last embers of fascism cooling, Italy is now preparing for elections, and the King has appointed a provisional cabinet to oversee the country until that fateful day. Despite his obvious preference for the DC moderates, Umberto II has refrained from any undue interference in the democratic process, and eagerly awaits for the moment when he'll be able to appoint the winner as Prime Minister, and finally return to the ceremonial role that any King or Queen, in his opinion, should fulfill.\n\nAfter all, if your King orders you to be free, what can you do if not obey?"
 ##Based Gaming DC/FD Influence Events##
 itademdiplo_med.1.t:0 "The Prime Minister's Speech"
 itademdiplo_med.1.d:0 "The atmosphere was solemn at the Camera dei Deputati, the Lower Chamber of the Italian parliament, where the entire parliament had been summoned for a common session of both Chambers. King Umberto II sat on the chair usually reserved for the President, at his sides were the Presidents of both the Chamber and the Senate, and the entire parliament, almost a thousand people, was silent, for the Prime Minister, sitting on the chair right below the King and surrounded by his ministers, was scheduled to announce the new foreign policy of the Kingdom. [ROOT.getleader] stood, facing the assembly, and feeling the King's eyes burn holes into his back: he knew that the King's support depended on whether he could truly protect the Kingdom from the enemies lurking outside, so he had to make a good initial impression. He nervously cleared his throat, gave a last look to his papers, then commenced.\n\n"Honoured members of the Parliament or, in the ways of our ancestors, Patres Conscripti! Today is a momentous day for our young democracy, as we shall decide the place our beloved Kingdom will take among the great powers of the world, as it should have always been, and as it will always be from now on!" A small round of applause from his majority, silence from the rest of the hemicycle. "After twenty years of isolationism, decided by cowards who could only try to avoid being washed away by the newly rising tide of freedom, we shall look outside! For the first time in decades, this government will make contact with the nations in Europe that still have to see the light of democracy, or have been forcibly blinded to it. We shall fight alongside them against those who would extinguish our flame! A new dawn has risen for Italy, and it will far outlast the night we leave behind our shoulders!"\n\nThis time, the applause came from the entirety of Parliament, even the opposition MPs begrudgingly clapping their hands, though for [ROOT.getleader] the greatest satisfaction came from the quiet clapping he could hear coming from directly behind him. As he sat down to let the Minister for Foreign Affairs speak in detail, he knew he had set the first stone."
 itademdiplo_med.1.a:0 "Now, we must start building upon it."
 
 itademdiplo_med.2.t:0 "The Mission to Bucharest"
 itademdiplo_med.2.d:0 "The Italian embassy in Bucharest was a small palace in the centre of the city. Though well-kept, and patrolled by a small garrison from Italy, it showed - as everything in Romania these days - the passing of time, with a bit of plaster falling and some ivy growing on the walls, giving it an air of placid laziness. Until a few weeks ago, the most activity one could see there was a few Italian expatriates visiting the embassy for documents, or the annual courtesy visit from the Romanian minister for foreign affairs.\n\nNow, everything has changed.\n\nThe entire building has been renovated by a cadre of architects, and colourful Carrara marbles shine on the new, monumental stairway and in the graceful columns supporting the neoclassical façade. Even the inside has been completely renovated: engraved mahogany furniture, sporting those intricate wooden mosaics so loved by Charles Albert, embellish the official meeting rooms, while in the corridors, precious glass vases from Murano peek out from equally valuable showcases.\n\nEven the personnel has been overhauled, with more than forty new diplomatic officials being admitted, among which are economic, military and political attachès, and a cadre of bureaucrats and entrepreneurs. The Italian embassy in Bucharest is now a shining beacon of beauty and efficiency in the beleaguered East, and if everything goes as it should, soon it will bring light to all of Romania."
 itademdiplo_med.2.a:0 "Italy shows its magnificence."

 itademdiplo_med.3.t:0 "The Meeting with King Michael"
 itademdiplo_med.3.d:0 "The Quirinale shined from the tip of its bells to the foundations of its fortified walls. It had been so long since the last visit from a monarch! The last had been King Edward of England in 1949, and it had been a dull meeting, with relationships between Italy and the Einheitspakt already strained... Valets, chamberlains, butlers and maids moved with practiced hurry through the long corridors as they prepared everything to perfection, while in the basement, vans filled with the best delicacies from across the Empire unloaded their precious cargo: wine from Veneto, grapes from Athens, coffee from East Africa and many, many others, in preparation for the grand banquet.\n\nThe next day, the Romanian monarch arrived in Rome: while the governments of the two nations started talking about alliances, treaties and incentives, the two monarchs retreated into Umberto's private study to talk about more... delicate business. Everyone knew the one holding the true power in Romania was the King, and that's exactly where Umberto II came in: he believed, as Michael was a moderate at heart, and strongly admired his Italian counterpart for having managed to restore democracy to his country, that with enough effort, he could be set on the same path. When both Kings were seated, a coffee on the small table set before them, Umberto smiled courteously towards his guest: "Dear Michael" he began, "There is so much we have to talk about...".\n\nThe meeting lasted well into the evening, but when the two Heads of State presented themselves to the press, everyone could notice Umberto's triumphant smile, and their joint declaration about "common views" and "the Crown ultimately serving the people" left little room for doubts on the meeting's results."
 itademdiplo_med.3.a:0 "The coffee must have been incredibly good!"

 itademdiplo_med.4.t:0 "The Mission to Budapest"
 itademdiplo_med.4.d:0 "Despite the war with Romania, massive economic mismanagement and ethnic tensions, the Hungarian capital of Budapest has survived in all of its beauty. In the years of Hungary's entry into the Pakt, with all the erosion of Italian influence that followed, and then Hungary's abrupt exit from the alliance, a number of Italian businessmen and powerbrokers remained in the city, albeit operating at a far lower level. Now these men, resilient enough to survive the harassment of the Volksbund and the cold shoulder of the government, shall be the germ of Italy's new influence in Budapest.\n\nThe first matter of business, naturally, is to reach out to these exemplary Italians and entice them to cooperate. Though surely solid patriots all, these men will be encouraged by a simple promise. Should Hungary become a friend of the Italian Empire, they will be well positioned to displace the German business establishment and become the new masters of the Hungarian economy.\n\nTo these sweeteners, we must look to the Hungarians as well. The Imredy regime, even as it despises the Germans, is not inclined to cooperate with a newly democratic power such as Italy. We shall have to be sly in our efforts, working to bolster the Hungarian economy whilst undermining the government. If all goes well, Germany's former underling shall find themselves under a new administration."
 itademdiplo_med.4.a:0 "Hungarian democracy shall flourish under our protection."

 itademdiplo_med.5.t:0 "The Meeting with István"
 itademdiplo_med.5.d:0 "István Horthy walked like a military man. Back straight, head raised, with firm eye contact. As soon as he entered the room the Deputy Consul knew he was Italy's man, and the conversation they would have over the next few hours made this entirely certain.\n\nThe son of Miklós Horthy was an enemy of the Nazis, and everyone knew it. The Germans despised him for his well publicised views on the Jewish question, but as the former Regent's son, he was too popular to attack openly. The man was no liberal democrat, of course. But he was the best candidate to enact the destruction of national socialism in Hungary, and to do so without bringing about societal collapse.\n\nThe Deputy Consul set out some conditions for Italian assistance. Should István become regent, the Italian government would expect a process of democratisation, to be overseen by Rome directly. Every milestone met in this process would be rewarded with further economic and military cooperation. And, naturally, this conversation had never occurred. It would be preferable that the Hungarians believe their favorite son had won out on his own. István looked back at him, bemused, while the conditions were set out. He laughed now, switching from Hungarian to a heavily accented Italian."
 itademdiplo_med.5.a:0 "'Where do I sign?'"

 itademdiplo_med.6.t:0 "The German Ulcer"
 itademdiplo_med.6.d:0 "The Volksbund had never attempted to hide its presence in Budapest, but the giant swastika door knocker struck Bianchi as particularly ostentatious. He'd been sitting in the building across the street for some months now, sitting through God knows how many discussions of German business interests. Every so often the 'fucking Italians' were mentioned, and all those hours became worth it.\n\nFrom the reports gathered by Bianchi and the others, it was clear that the Germans were planning something. They had been receiving funds from Germania for an unspecified period of time - Bianchi guessed it was a number of years, from the context of the discussions - and mentions of Hungarian military and government personnel were becoming more frequent. Bianchi was paid to listen and report, not make political judgements. But he knew, as did every agent he worked with, that Italy would have to move quickly to push its interests in Hungary. To fail to do so would invite the Volksbund to take a far greater role in the governance of Hungary, and killing any remaining hope for Hungarian democracy."
 itademdiplo_med.6.a:0 "The German ulcer must be removed."

 itademdiplo_med.7.t:0 "The Sale of Hungarian Grain"
 itademdiplo_med.7.d:0 "Reményi-Schneller turned towards the camera and smiled briefly whilst it flashed, once, then again. The Economy Minister's face twitched slightly. As soon as the camera was lowered he brought an end to the handshake, peering darkly at his interlocutor. The other man, an Italian businessman with longstanding ties in Hungary, had in the past weeks become a representative of the Italian government in Budapest. His grin remained, and the Minister forced himself to make some strained small talk. After a few minutes of trite nonsense, Reményi-Schneller excused himself. "Government business" called, he insisted, barely attempting to make the lie sound believable.\n\nThe Minister entered his office and locked the door behind him. In normal circumstances, today's events would have been a victory for any Economy Minister. The Italians had pledged to buy up Hungarian grain in bulk, without pressing their advantage too thoroughly, and in doing so had offered a lifeline to the Hungarian economy. A damned shame that the circumstances were not normal. Reményi-Schneller had clawed himself into power as a friend of the Germans. After his country left the Pakt, he had stayed in the cabinet only through lack of a successor. And today, his job had forced him to shake hands with the enemy.\n\nHis mind raced. Soon Béla would call to consult with him. The Minister would be resolute. The Italians want to own us, he would say. And we cannot let them."
 itademdiplo_med.7.a:0 "Grain is a political matter."

 itademdiplo_med.11.t:0 "Italian meddling in Romania"
 itademdiplo_med.11.d:0 "The intelligence reports forwarded by our assets in Romania have been far from positive. The traitorous Italians, no doubt trying to recover some of their imagined glory, have in the past months embarked on a charm offensive to bring Bucharest into their sphere.\n\nWhilst we may have scoffed at the meeting between the Italian King and his Romanian counterpart, Mikhail I, the diplomatic niceties have turned into something more worrying. We are informed now that the Romanian army is working with the Italians to draw up cooperation arrangements, in the event of a German invasion of the country. Ostensibly the plans are defensive, but we know the truth. The Italians have gone too far, and if we may not be in a position to react with force immediately, they should not doubt their arrogance will be punished in due time."
 itademdiplo_med.11.a:0 "The fools would not dare..."

 itademdiplo_med.21.t:0 "Entering Bordeaux"
 itademdiplo_med.21.d:0 "As the motorcade entered the outskirts of Bordeaux, Ambassador Domizio Del Gallo couldn't help thinking about how much he would have loved to visit the city under more auspicious circumstances. His beautiful Lancia Flaminia - the mainstay of the Italian ambassadorial corps - looked almost out-of-the-world as it passed the overgrown dirt road cutting the enormous refugee camp: thousands of desperate men, women and children had fled the Burgundian invasion only to find poverty and despair, and the view of the gothic Cathedral was obscured by the thick smoke coming from dozens of camp fires and wood stoves.\n\nWith a sigh, the seasoned diplomat focused once again on his task. Personal feelings and pity couldn't distract him from the orders he had been given, and he would see them fulfilled: with Göring's Germany on the warpath once again, Italy needed allies, and what better ally than someone who hates the Germans with their entire being? Convincing France to join the Italian effort to contain the Reich would be easy, but Domizio knew that turning hate for a common enemy into something more... meaningful wasn't that immediate.\n\nFinally, his car stopped in front of the Hotel De Ville - once Bordeaux's town hall, now a poorly-equipped headquarters for an equally poorly-equipped government - interrupting him from his reflections. Ambassador Del Gallo was used to much better, but it would have to do: as his driver opened the door, he plastered a corteous smile on his face and prepared himself to meet the French delegation. The storm was coming, and all of Europe needed to join forces if it wanted to turn the tide of destruction: the barbarians that once devastated the Roman Empire were now preparing for an encore, and Domizio would be at the forefront of the resistance."
 itademdiplo_med.21.a:0 "Bonjour mes amies!"

 itademdiplo_med.22.t:0 "Influencing the French"
 itademdiplo_med.22.d:0 "Bordeaux - like the creeping grape vines that once dotted its countryside - Bordeaux grew on him, after some time. Even in an atmosphere of utter misery where refugees were more common than residents and where hunger and poverty reigned from a rotten throne, there were faint glints of hope that still surprised the ambassador whenever they sprung out from the city's muted suffering.\n\nNegotiating with the French rump-government was not always an easy task. In this age of extraordinary danger, however, with a newly reunited and increasingly militant Reich looming ever larger, cooperation was of utmost importance. Domizio Del Gallo was no stranger to hard bargains. After all, he had earned his spurs in the increasingly unstable world of Atlantropa and watched Italy rise up to seize a dominant place in European politics.\n\nFrench pride was something he had not come upon previously.\nLong hours and sometimes days would go by without any serious progress towards Détente, spent in arguing over semantics and impossibilities. And still...Every day the chants of 'La Marseillaise' grew louder and more numerous than those of 'Maréchal, nous voilà.' Del Gallo could see with his own two eyes that the French nation was in shambles, but it appeared to him that that the French spirit was crucially not yet lost. When the time came, France and Italy would face the resurgent Riech hand in hand.\n\nAt least he hoped they would, if he did his job well."
 itademdiplo_med.22.a:0 "Back to the Hotel De Ville."

 itademdiplo_med.24.t:0 "The Italo-French Détente"
 itademdiplo_med.24.d:0 "Ambassador Domizio beamed for the flashing cameras. Standing beside key representatives of the French government, the past few weeks flashed by in between the clicks and the smiles of the journalists that had come to document the Détente. By now Bordeaux was almost familiar to him, and the trials of it's people were forever ingrained in his own memory: All of it. The grueling hunger, the columns of refugees, and the determination and unbent pride the French people had borne it all with. The French government...was another matter.\n\nWhile political friction and long-winded argument no doubt interspersed almost all of their meetings in the Hotel De Ville, compromise and comradery had carried the day, or they would not have been standing arm in arm as they now were. Disagreements were ironed out, and common ground found in enough matters to secure a positive outcome to the negotiations, one they now held up proudly: The Bordeaux Accords.\n\nTo Göring's militarist clique in Germania, the news would no doubt be received with spite. Europe was at last determined to close ranks in the face of renewed aggression by the Reich, the disunity and disbelief of 1940 would not assist the Hun this time. And should a unified front not suffice to dissuade the Führer? Well, Italy has gained an invaluable and resilient ally in Bordeaux nonetheless. Should the worst come to be, Rome and Bordeaux would march arm in arm to confront it."
 itademdiplo_med.24.a:0 "This bundle of sticks, they will not break."

 itademdiplo_med.26.t:0 "Treaty of Rome"
 itademdiplo_med.26.d:0 "At last, the work of the past few months in Bordeaux was sealed in wax. An unprecedented diplomatic overture was being carried out by the French government, firmly binding it to its new friends in- Where else, but Rome?\n\nDomizio's job was done, and it was done well. Weeks of strained negotiations and long sleepless nights had paid off. Smiling before delivering his official address to the wall of cameras and journalists facing him, the ambassador turned to thank and welcome the honored delegation from Bordeaux, telling the audience - and the world at large - of the great suffering and the great resilience he had seen for himself in the capital of France.\n\n''The Treaty of Rome marks a new age of European diplomacy. Gone is the hegemonistic exploitation of tyrants, soon to be replaced by true democratic cooperation between equals on the international stage. With Rome and Bordeaux now aligned, a new power bloc is on the rise in Europe. Just as the fascist triumvirate had stood up to Nazi terror, so will the equal and new alliance whose birth we witness today!''\n\nWith German militarism on the rise in the Riech, the treaty of Rome can be considered a direct challenge to the Führer's commitment to a war in southern Europe. All but a binding military alliance between France and Italy, it stands as a firm reply to the rabid doctrine of new expansionism and Hunnic militarism being spewed out of Germania."
 itademdiplo_med.26.a:0 "Arm in arms - against the Hun."
 itademdiplo_med.29.t:0 "La Resistance"
 itademdiplo_med.29.d:0 "Jean was on his way to the monthly comradery meeting in his native Grenoble when he heard about the news. The trip was one he made less and less often nowadays with his new job in Lyon occupying more and more of his time, but he always had a spare day or two in the month to drive back to the city in which he was raised, and meet his old comrades. The news only piqued his interest further, and he dared to ask his Boss for a three day leave to visit his mother.\n\nAnd he did visit her, sparing two roses and a quick prayer at her grave. As he soon found out: The news was big. Rome, which had only recently shattered the hegemony of Fascist dictatorship to emerge into a democracy of its own- Rome was offering to recognize the Resistance! Already a dozen-odd crates loaded with civilian supplies were smuggled into France, with two making their way to Grenoble itself! Almost everyone in the local cell was ecstatic towards the news, and why should they not be? After long years of struggle and strife, their righteous cause was embraced by a fellow democracy in Europe. If this was not 1848 come again, then what could it possibly be?\n\nWith sufficient backing and international recognition, Rome believes that the French Resistance will be a far more capable ally against the rising threat of German militarism than a regime that has known nothing but defeat ever since its inception. Crates of aid were already being smuggled to key Resistance cities and bases in order to start alleviating the suffering so common to the regime of Bordeaux. A bright future was ahead for both Italy and France in their march against the Führer's fantasies of conquest, and Bordeaux's delusional dictatorship.\n\nJean phoned in his resignation two days later, informing his Boss that the situation had... developed"
 itademdiplo_med.29.a:0 "Le Chant Des Partisans, once more!"

 
 blocchidiplo_med.1.t:0 "Italian Hegemony"
 blocchidiplo_med.1.d:0 "For ten thousand years Europe has been the center of the world. The birthplace of civilization, the home of philosophy, art, and culture. And for ten thousand years, Rome has been the center of Europe.\n\nIt was Rome that gave birth to an empire that define the continent for centuries to come, it was Rome that brought the uncivilized tribes to modernity. Rome was the birthplace of the renaissance, the center of christianity, the eternal city and the birthplace of untold millions. As Rome is the capital of Italy, likewise Italy is the manifestation of all that Rome has accomplished in the world. For centuries the Italian people were subjugated and divided, having fallen prey to false ideologies and scheming neighbors. However, its people remained proud, and dreamed that they would one day restore their nation to glory.\n\nThe Fascist revolution was the first step towards that destiny, the reforms of Ciano the second. Now it is time to complete this grand project, and remind the continent of Rome's power.\n\nFrom the Dardanelles to Gibraltar, from the sands of the Sahara to the plains of the East, we will spread the light of civilization. Wherever it is found, degeneracy and madness will be driven back to their hovels. We will defeat the perfidious hun, cowardly socialists, and all others who stand in our way.\n\nThe world will know the strength of the Italian nation and its people, and Rome will remain its center for ten thousand more years."
 blocchidiplo_med.1.a:0 "Italy is the greatest!"
 
 blocchidiplo_med.2.t:0 "Over Hungary"
 blocchidiplo_med.2.d:0 "Poor Hungary. So far from God, and so close to Germany...\n\nThe years since the end of the war have not been kind to Hungary. Whilst Hungary fought alongside us, and the Germans, during the war, soon after the victory the cracks started to appear. When the Italo-German split happened and the Axis fell apart, Hungary decided to remain aligned with Germany.\n\nPerhaps this was the wrong choice, as afterwards, Hungary soon found itself in conflict with another former ally, Romania. This conflict did not end in Hungary's favor, and its territory was dismembered. Worse yet, Germany expelled it from the Einheitspakt for its insolence, dealing a death knell to both the country's economy and its standing in the world.\n\nTo say that Hungary today is in dire straits would be a massive understatement. With the economy in utter ruin, the regent's hold on power threatened by pro-democracy factions and the German-Hungarian Volksbund alike, Hungary today is the very definition of a failed state.\n\nHowever, their pain may yet be our gain. With the economy in complete shambles and the country being a pariah amongst its rapacious neighbors, there is strong resentment towards both the influential German minority in the country, and the nation-state of Germany for its role in Hungary's predicament.\n\nIn other words, the country is fertile ground for Italian influence..."
 blocchidiplo_med.2.a:0 "Italy is the greatest!"
 
 blocchidiplo_med.3.t:0 "Italy Proposes New Railway"
 blocchidiplo_med.3.d:0 "The Italians have come to us with a proposition.\n\nThey want to construct a new railway, leading from Lubiana to Budapest. They claim that this will increase trade and travel between the two cities, leading to an economic boon for all involved. A win-win scenario, or so they say.\n\nOf course, there's probably more to it than the Italians are saying. Increased trade will undoubtedly lead to our economy becoming further intertwined with Italy's, for good or for ill. To say nothing of the fact that the actual railway will most likely be constructed and operated by Italian companies... Do those concerns outweigh the benefits?\n\nShould we accept?"
 blocchidiplo_med.3.a:0 "We accept! Let the construction commence!"
 blocchidiplo_med.4.b:0 "We refuse!"
 
 blocchidiplo_med.4.t:0 "Hungary Agrees to Railway"
 blocchidiplo_med.4.d:0 "The Hungarians have wisely agreed to the new railway from Lubiana to Budapest! Now we can get to work constructing it and further link our economies together! Everybody wins! Soon, the cities of Rome and Budapest will be sisters, despite their distance, and the peoples of Italy and Hungary brothers.\n\nWith this new link to serve as the main artery of our great alliance, we can rest easy knowing that our northern flank is secure for the foreseeable future. Unyielding in its loyalty to those who serve it well, the Italian sphere shall always defend our clients. In this way we will protect their prosperity, and of course, our own."
 blocchidiplo_med.4.a:0 "Great!"
 
 blocchidiplo_med.5.t:0 "Hungary Refuses Railway"
 blocchidiplo_med.5.d:0 "Bad news! The Hungarians have refused our generous offer of the Lubiana-Budapest railway!" Why their government, thus far amenable to our influence has proceeded with such a damaging and foolhardy course of action, we can only guess. Most likely, their leadership has fallen under the influence of the psychotic German beast, or naive nationalists who think that they can succeed without our protection.\n\nWhatever the case, this is certainly a blow to relations between our nations. Perhaps it's time to consider more direct action to insure that our interests in Hungary are secure. After all, just as any good parent should not hesitate to discipline disobedient children, we must make sure that the members of our sphere keep heed of their own best interests, and ours of course."
 blocchidiplo_med.5.a:0 "Blast!"
 
 blocchidiplo_med.6.t:0 "Italy Proposes Reduced Trade Barriers"
 blocchidiplo_med.6.d:0 "It appears the Italians have come to us with an offer.\n\nIn the interests of free trade and for the benefit of both our economies, they have proposed reduced tariffs and trade barriers on Hungarian agricultural products. In other words, they want to make it easier for our farmers to sell their produce in Italy.\n\nThis certainly seems like a good deal, and our strong agricultural sector would undoubtedly benefit tremendously. But, as always, there may be more to this deal than meets the eye. This would cause our economies to become further intertwined, for better or for worse. It would also make us more dependent on the whims of the Italian market.\n\nIs the potential economic benefit worth accepting? Or should we decline?"
 blocchidiplo_med.6.a:0 "Free trade will benefit us both. We accept!"
 blocchidiplo_med.6.b:0 "We refuse!"
 
 blocchidiplo_med.7.t:0 "Hungary Agrees to New Trade Barriers"
 blocchidiplo_med.7.d:0 "Good news! Hungary has wisely agreed to our generous offer to reduce trade barriers for Hungarian agricultural products! This will benefit Hungary, and more importantly, it will benefit us! A true win-win for all involved!"
 blocchidiplo_med.7.a:0 "Great!"
 
 blocchidiplo_med.8.t:0 "Hungary Refuses New Trade Barriers"
 blocchidiplo_med.8.d:0 "Bad news! For whatever reason, the Hungarians have foolishly declined our generous offer to reduce trade barriers for Hungarian agriculture!"
 blocchidiplo_med.8.a:0 "Their loss!"
 
 blocchidiplo_med.9.t:0 "Italy Offers Protection"
 blocchidiplo_med.9.d:0 "The Italians have approached us with an offer.\n\nItaly has offered to issue a guarantee of our borders. Meaning that, should we be threatened by an aggressor, Italy would defend us and our territorial integrity.\n\nThis sounds like a pretty good deal, especially with the chaos engulfing both Europe and the world. In these turbulent times, it is good to have a strong protector.\n\nOf course, this would also further align us with Italy, and could risk the ire of their northern enemy, the Germans. After all, they would not take kindly to Italy gaining a foothold on their doorstep...\n\nSome argue that it would also erode Hungarian sovereignty by making us dependent on Italy.\n\nBut perhaps it's worth it, for the sake of self-preservation?"
 blocchidiplo_med.9.a:0 "We accept. In this chaotic world, we need a strong protector."
 blocchidiplo_med.9.b:0 "We refuse! We do not need Italian protection!"
 
 blocchidiplo_med.10.t:0 "Hungary Accepts Our Protection"
 blocchidiplo_med.10.d:0 "Good news! The Hungarians have wisely decided to accept our offer of protection! This will further align them with the Italosphere, and increase our influence in Hungary!"
 blocchidiplo_med.10.a:0 "Great!"
 
 blocchidiplo_med.11.t:0 "Hungary Refuses Our Protection"
 blocchidiplo_med.11.d:0 "Bad news! The foolish Hungarians have declined our most generous offer of protection! Their short-sightedness knows no bounds! Well, when the Germans come knocking on their door, they can't say that we didn't try to help them!"
 blocchidiplo_med.11.a:0 "In the future they will rue this day!"
 
 blocchidiplo_med.12.t:0 "Italo-Magyar Friendship Treaty"
 blocchidiplo_med.12.d:0 "The Italians have come to us yet again with an offer. This time, they are offering a "Friendship Treaty", saying that they wish to solidify and strengthen the once-strong ties between our countries..\n\nA more accurate term for this would be a "non-aggression pact." In other words, Italy will not start any conflict with us, and neither will we with them. Whilst not a formal alliance, it would definitely be a sign of closer ties with Italy. Geopolitical ties, at that, as opposed to simply economic ties. The Germans would undoubtedly not take kindly to this, however...\n\nIs it worth it?"
 blocchidiplo_med.12.a:0 "We accept the Friendship Treaty!"
 blocchidiplo_med.13.b:0 "We cannot risk provoking the Germans..."
 
 blocchidiplo_med.13.t:0 "Hungary Accepts Friendship Treaty"
 blocchidiplo_med.13.d:0 "Good news! The Hungarians have wisely accepted our most generous offer of a friendship treaty! This will solidify and strengthen the ties between our two countries, and further draw Hungary out of the German sphere and into the Italosphere!"
 blocchidiplo_med.13.a:0 "To a future of friendship!"
 
 blocchidiplo_med.14.t:0 "Hungary Refuses Friendship Treaty"
 blocchidiplo_med.14.d:0 "Bad news! The Hungarians have turned down our most generous offer of a friendship treaty between our countries! Their reasoning is that they do not want to risk provoking the Germans."
 blocchidiplo_med.14.a:0 "Blast!"
 
 blocchidiplo_med.15.t:0 "Italy Offers to Invest in MAVAG"
 blocchidiplo_med.15.d:0 "While our history with the Italians is certainly...mixed, we can't deny that they've got plenty of money and not enough (apparently) to spend it on. Although they have a deplorable tendency to interfere with other nations internal affairs, they at least prefer to do it with gold rather than lead. Perhaps we shouldn't be surprised that the nationalist Blocci Nazionale led government has offered to massively increase their investment in MAVAG, our state-run railway company.\n\nThe potential benefits of this investment cannot be overstated, but neither can its risks. Our government maintains only tenuous control over Hungary's hinterlands, and with the financial boost the Italians offer, we could integrate the countryside with a modern rail system, and help to bring our nation into the future. On the other hand, this could be the foot in the door of the "heirs of Mussolini" desire to eventually reduce our nation to nothing more than a Roman puppet. One way or another, we should have a reply for the Italians soon, lest they think us indecisive."
 blocchidiplo_med.15.a:0 "Accept"
 blocchidiplo_med.15.b:0 "Refuse"
 
 blocchidiplo_med.16.t:0 "Hungary Allows Investment"
 blocchidiplo_med.16.d:0 "Excellent news from Hungary! It seems that the government there saw the light, and has intelligently agreed to allow us to invest in the state-held railway corporation, MAVAG. This is an excellent day for both our peoples. Italy receives enhanced infrastructure in an important trading partner, and a worthwhile long-term investment, while Hungary receives the benefits of a modern transportation system, and a powerful ally in a dangerous region.\n\nOf course, this is also an opportunity for our nation to grow ever stronger within our rightful Mediterannian sphere. Once tenuous, our dominance over the region will only grow stronger, and soon we will be a power equal to the world's greatest nations."
 blocchidiplo_med.16.a:0 "Acceptance by an ally"
 
 blocchidiplo_med.17.t:0 "Hungary Refuses Investment"
 blocchidiplo_med.17.d:0 "Terrible news from Hungary! It seems that the government there has listened to its false friends over our sage advice, and refused to allow us to invest in the state-held railway corporation, MAVAG. While the Hungarian refusal was supremely polite, and described at great length that nation's continuous respect for their "great Italian ally", we cannot be cozened with such tricks. This is an insult, plain and simple.\n\nAlthough certainly a setback, this isn't the end of our campaign to expand our influence North. One way or another, the Hungarians will see reason, and join their Italian brothers in a glorious mediterranian union. They just don't seem to know it yet."
 blocchidiplo_med.17.a:0 "Refusal by refuce"
 
 blocchidiplo_med.18.t:0 "Italy Wants Hungarian Goods"
 blocchidiplo_med.18.d:0 "The Italians have once again come to us with an offer.\n\nThis time they want to make it easier for us to sell Hungarian products in Italy, by lowering tariffs on Hungarian goods entering the country. This will lead to increased sales of Hungarian goods in Italy, and thus, more money for Hungary!\n\nOf course, there are some who claim the Italians have ulterior motives, as accepting would undoubtedly tie our economy further to that of the Italosphere. We must ask ourselves if that is worth the increased revenue from sales in Italy."
 blocchidiplo_med.18.a:0 "Free trade will benefit us both. We accept!"
 blocchidiplo_med.18.b:0 "We refuse!"
 
 blocchidiplo_med.19.t:0 "Hungary Accepts Lower Tariffs"
 blocchidiplo_med.19.d:0 "Good news! The Hungarians have wisely decided to accept our most generous offer of lower tariffs! They will make more money as Hungarian goods flow into Italy, and we will tie their economy further into that of the Italosphere! A true win-win for all involved!"
 blocchidiplo_med.19.a:0 "Free trade is the route to prosperity for all!"
 
 blocchidiplo_med.20.t:0 "Hungary Refuses Lower Tariffs"
 blocchidiplo_med.20.d:0 "Bad news! For whatever shortsighted reason, the Hungarians have foolishly declined our most generous offer of lower tariffs on Hungarian goods! Whist this is a setback for our plans, it will undoubtedly be an even bigger setback for them and their already-shambolic economy! Someday they shall wish they accepted!"
 blocchidiplo_med.20.a:0 "Their loss!"
 
 blocchidiplo_med.21.t:0 "Italy Offers Weapon Shipments"
 blocchidiplo_med.21.d:0 "Italy has come to us, this time with an arms deal. They are offering to sell us Italian arms at a great discount.\n\nConsidering the woeful state of our military, this could be a great boon to us. Our military's equipment, after all, is either lacking, obsolete, or both. And in today's chaotic, dangerous world, it is imperative that our military is as strong as it can possibly be.\n\nOf course, this will further increase Italian influence in our country, and risks making us dependant on Italian arms to defend ourselves. Some argue that would be a threat to our sovereignty.\n\nShall we accept the deal?"
 blocchidiplo_med.21.a:0 "We need to modernize our military. We accept!"
 blocchidiplo_med.21.b:0 "We do not need Italian arms."
 
 blocchidiplo_med.22.t:0 "Hungary Accepts Weapon Shipments"
 blocchidiplo_med.22.d:0 "Good news! The Hungarians have wisely decided to accept our arms deal! This will be a great bargain for them, as they will now get fine Italian weapons for great prices. More importantly, it will be beneficial to us, as not only will we make some money off this, but this will further draw Hungary into the Italosphere!"
 blocchidiplo_med.22.a:0 "Great!"
 
 blocchidiplo_med.23.t:0 "Hungary Refuses Weapon Shipments"
 blocchidiplo_med.23.d:0 "Bad news! The foolish Hungarians have decided to decline our most generous offer of an arms deal! An irritating setback for our plans for Hungary, to be sure. It will, however, undoubtedly be an even bigger setback for them whenever they're invaded again! They'll wish they had Italian arms then!"
 blocchidiplo_med.23.a:0 "Their loss!"
 
 blocchidiplo_med.24.t:0 "Italy Proposes New Semmering Agreements"
 blocchidiplo_med.24.d:0 "First it was minor. A little rail investment here, a trade investment there, nothing to be worried about. Now, our Italian "ally" has become so daring as to propose a new "Semmering Agreement" that would all but reduce our nation into an economic client state. While there may certainly be benefits of drawing ever closer to Italy's abundant natural resources and powerful military, we risk losing our essential liberties for only a little temporary security.\n\nOn the other hand, dare we refuse. The Italians have cultivated powerful friends in our government, and far outclass us in military strength and international connections. We have long faced a narrow ledge with an abyss on either side, and it appears that we have run out of walking space. One way or another, we must now take the plunge, and hope that our nation emerges intact."
 blocchidiplo_med.24.a:0 "Accept"
 blocchidiplo_med.24.b:0 "Refuse"
 
 blocchidiplo_med.25.t:0 "Hungary Accepts"
 blocchidiplo_med.25.d:0 "Superb news. It seems that our Hungarian friends have seen the light, and intelligently consented to our new proposed New Semmering Agreements. This will give us increased weight within Hungarian mercantile circles, and give preference to Italian goods at every level.\n\nIt seems that despite the obvious loss of sovereignty accompanying this agreement, the Hungarians wisely understand that their nation has no future on its own. Afterall, they are not Hungarians as Hungarians, but rather members of a greater and glorious Mediterannian history. It seems we have succeeded in reminding them of this history, and of the strength it holds for the future."
 blocchidiplo_med.25.a:0 "Great!"
 
 blocchidiplo_med.26.t:0 "Hungary Refuses"
 blocchidiplo_med.26.d:0 "Bad news! The Hungarians have foolishly rejected our "Semmering Agreement"! They apparently want to cling to their delusions of "maintaining their sovereignty", rather than accepting the reality that Hungary, nestled between Italy and Germany, cannot stand on its own.\n\nThis will be a setback to our plans for Hungary. We will have to find another way to tie their economy to the Italosphere, through coercion or otherwise..."
 blocchidiplo_med.26.a:0 "Blast!"
 
 blocchidiplo_med.27.t:0 "Italy Proposes Joint Credit Institutions"
 blocchidiplo_med.27.d:0 "Our banks have long reflected the sorrowful state of our economy. That is, they are insolvent, failing, and barely avoiding collapsing entirely, somehow. However, this cannot last forever. Sooner or later, something will give.\n\nUnless, of course, the Italians step in.\n\nThe Italians have approached us with a deal. Being far wealthier than us, they have proposed providing our failing banks with a vast amount of credit, in effect propping them up and preventing the whole house of cards from caving in.\n\nBut, of course, there's a catch. Nothing in life is free, after all. In exchange for propping up our failing banks, the Italians are asking for a controlling share of the banks in exchange. In essence, they are asking us to relinquish control over our own banks over to them, in return for their financial support in preventing their collapse.\n\nEssentially selling our banks to the Italians would be a grave national humiliation and would further erode our sovereignty. But perhaps it is the only way to preserve them at all... "
 blocchidiplo_med.27.a:0 "We have no choice. We accept."
 blocchidiplo_med.28.b:0 "Hungary's banks belong to Hungary alone! We refuse!"
 
 blocchidiplo_med.28.t:0 "Hungary Accepts"
 blocchidiplo_med.28.d:0 "Good news! The Hungarians have wisely decided to accept our most generous offer of a rescue package for the failing Hungarian banks! Italian credit shall start flowing into Hungary, and shall revitalize these failing banks, and prevent what remains of Hungary's financial system from completely collapsing.\n\nOf course, we scratch their back, they scratch ours. They have, in return, agreed to give us a controlling share of their banks as part of the bailout. This will further entrench our control of the Hungarian economy and solidify their place in the Italosphere."
 blocchidiplo_med.28.a:0 "A win for everyone, and us especially!"
 
 blocchidiplo_med.29.t:0 "Hungary Refuses"
 blocchidiplo_med.29.d:0 "Bad news! The foolish Hungarians, in their hubris, have refused our most generous offer of credit for the failing Hungarian banks!\n\nHow they plan to prevent their banks from collapsing is beyond us, considering the dismal state of the overall Hungarian economy. But that is not our problem. When the Hungarian banks end up collapsing entirely, we shall be laughing!"
 blocchidiplo_med.29.a:0 "Their loss!"
 
 blocchidiplo_med.30.t:0 "A New Regent"
 blocchidiplo_med.30.d:0 "There has been a significant escalation in Italian efforts to influence our country. Istvan Horthy, son of the late Regent Miklos, has gathered enough support around him to carry off a palace coup and replace Bela Imragy as Regent. Istvan is not merely a foreign puppet. A moderate, competent man, he enjoys support among key people in our government and the general public. On the other hand, few doubt Istvan would repay the Italians' kindness once in power.\n\nRegent Bela has denounced an effort to replace the legitimate Hungarian Leader with a 'marionette imported from Rome'. His supporters have rallied, setting aside their own squabbles to preserve themselves.\n\nAs a silent and bloodless battle is waged, the slightest effort will tip the balance..."
 blocchidiplo_med.30.a:0 "Istvan prevails and becomes Regent!"
 blocchidiplo_med.30.b:0 "Bela defeats the coup and remains Regent!"
 
 blocchidiplo_med.31.t:0 "Our Candidate For Regent Won"
 blocchidiplo_med.31.d:0 "Excellent news from Budapest. Bolstered by the pressure we placed on Hungary, Istvan Horthy has quietly ousted Bela Imredy as the Hungarian Regent. On taking power, the new regent quickly removed Bela's loyalists in the Hungarian administration and secured his own people in their stead. A competent candidate, enjoying widespread support among his people, the son of the late Admiral Horthy had made his opposition to Germany well known in the past. Istvan's people have already contacted us, expressing the Regent's desire to draw his country closer to Italy."
 blocchidiplo_med.31.a:0 "We look forward to cooperating with the new Regent."
 
 blocchidiplo_med.32.t:0 "Our Candidate For Regent Lost"
 blocchidiplo_med.32.d:0 "Terrible news from Budapest. The short-sighted, pig headed Hungarians have prevented the replacement of the Regent with our candidate, Istvan Horthy. Many of his closest collaborators are in custody, with the whereabouts of Istvan himself currently unknown. Meanwhile the incumbent regent, Bela Imredy, briefs the people around him that an Italian coup against him has been thwarted. Attempts to make contact with him through our diplomats has been met with radio silence."
 blocchidiplo_med.32.a:0 "A serious setback to our interests in Hungary."
 
 blocchidiplo_med.33.t:0 "Italy Meddles in Hungary"
 blocchidiplo_med.33.d:0 "News reaches us from Budapest. It seems that Italy is meddling in Hungary, seeking to put pressure on that country to reorient their policy to suit Italian interests. Should we wish, we can expend political capital to stop this from happening, keeping Hungary where we want them. If, that is, Hungary is worth the effort needed to counteract the Italians."
 blocchidiplo_med.33.a:0 "Stop Their Attempt"
 blocchidiplo_med.33.b:0 "Don't Bother"
 
 blocchidiplo_med.34.t:0 "Italy Wants New Regent for Hungary"
 blocchidiplo_med.34.d:0 "The Italians have been actively promoting their interests in Hungary, and have now moved to replace the current Regent, Bela Imredy, with their own candidate Istvan Horthy. The coup's success would mean an extension of the Italian influence over Budapest, and would be detrimental to our own interests there - as such, we can act decisively to stop the coup. On the other hand, there are certainly more pressing matters to deal with at home. Perhaps the effort required would not be worth it?"
 blocchidiplo_med.34.a:0 "Stop Them"
 blocchidiplo_med.34.b:0 "Not Important"
 
 blocchidiplo_med.35.t:0 "Pressure from Germany"
 blocchidiplo_med.35.d:0 "Our interference in Hungary has roused the Germans. The message relayed to us through a number of informal German government contacts has been clear - our efforts to meddle in Budapest have been noted by Berlin, and nothing good will come of it. The Germans now present a significant obstacle to Italian diplomacy in the country."
 blocchidiplo_med.35.a:0 "Not good."
 
 blocchidiplo_med.36.t:0 "Pressure from Germany"
 blocchidiplo_med.36.d:0 "It seems our efforts to replace the Hungarian Regent have been met with resistance - and not just in Budapest. A communication received from Berlin has informed us, in no uncertain terms, that our 'little plot' to replace Regent Bela with our own candidate will have very serious repercussions on Italo-German relations. We are now under pressure to let the Budapest coup collapse, and there is little we can do about it."
 blocchidiplo_med.36.a:0 "Damned Germans!"
 
 blocchidiplo_med.37.t:0 "Hungary into Italian Sphere"
 blocchidiplo_med.37.d:0 ""
 blocchidiplo_med.37.a:0 "Hidden Event"
 
 
 blocchidiplo_med.40.t:0 "Over Romania"
 blocchidiplo_med.40.d:0 "The Italian embassy in Bucharest was a small palace in the centre of the city. Though well-kept, and patrolled by a small garrison from Italy, it showed - as everything in Romania these days - the passing of time, with a bit of plaster falling and some ivy growing on the walls, giving it an air of placid laziness. Until a few weeks ago, the most activity one could see there was a few Italian expatriates visiting the embassy for documents, or the annual courtesy visit from the Romanian minister for foreign affairs.\n\nNow, everything has changed.\n\nThe entire building has been renovated by a cadre of architects, and colourful Carrara marbles shine on the new, monumental stairway and in the graceful columns supporting the neoclassical façade. Even the inside has been completely renovated: engraved mahogany furniture, sporting those intricate wooden mosaics so loved by Charles Albert, embellish the official meeting rooms, while in the corridors, precious glass vases from Murano peek out from equally valuable showcases.\n\nEven the personnel has been overhauled, with more than forty new diplomatic officials being admitted, among which are economic, military and political attachès, and a cadre of bureaucrats and entrepreneurs. The Italian embassy in Bucharest is now a shining beacon of beauty and efficiency in the beleaguered East, and if everything goes as it should, soon it will bring light to all of Romania."
 blocchidiplo_med.40.a:0 "Italy shows its magnificence."
 
 blocchidiplo_med.41.t:0 "Italy Proposes New Trade Deals"
 blocchidiplo_med.41.d:0 "An envoy from the Italian Empire has approached our minister for trade. Citing the interest expressed by several Italian companies in buying Romanian goods, he has proposed to sign a trade deal between our countries. Though our economy has been falling in the last years due to the lack of international partners, some of our advisors urge caution: though the new influx of trade would surely help Romania get back on its feet after almost ten years of recession, signing such extensive trade deals would mean siding openly with Italy, something which may greatly anger our Northern neighbours... On the other hand, a deeper connection with Italy could also protect us from German retaliation in the event of greater tensions, which would be a positive thing in these troubled times."
 blocchidiplo_med.41.a:0 "Wonderful! Give me a pen!"
 blocchidiplo_med.42.b:0 "Risking German ire? Not worth it..."
 
 blocchidiplo_med.42.t:0 "Romania Accepts"
 blocchidiplo_med.42.d:0 "Our envoys in Bucharest have reported that the Romanian government has agreed to signing the trade treaty! Some details will probably need to be revised or improved, but there is agreement over most contents, including the lowered tariffs and the mutual preference in international trade, which is a great step forward in our relationship with the Kingdom."
 blocchidiplo_med.42.a:0 "Excellent! Open a bottle, the good one..."
 
 blocchidiplo_med.43.t:0 "Romania Refuses"
 blocchidiplo_med.43.d:0 "It seems our proposal hasn't been viewed well by the Romanian government. Our envoys have reported a cooling in the negotiations for the new trade deals with Romania, followed by a refusal of the draft because "as it is now, it doesn't help Romania at all".\n\nThough we still hope to improve our relationship with the Carpathian nation, this is a great setback in our plans for Eastern Europe..."
 blocchidiplo_med.43.a:0 "Damn Romanians and their pride..."
 
 blocchidiplo_med.44.t:0 "Italy Offers Protection"
 blocchidiplo_med.44.d:0 "An envoy from the Italian Empire has approached our government. Telling us of Italy's commitment to ensuring peace and stability throughout the Carpathians, he has told us that Italy would be willing to guarantee our nation's borders, helping us defend our current frontiers. Romania's borders were hard fought for some years ago, and a guarantee from Italy would increase their security immeasurably - we have after all, quite a few enemies who claim our land. But is it a good idea to continue to be drawn further into Italy's sphere of influence?"
 blocchidiplo_med.44.a:0 "Safety first."
 blocchidiplo_med.44.b:0 "We can defend ourselves, thank you very much."
 
 blocchidiplo_med.45.t:0 "Romania Accepts"
 blocchidiplo_med.45.d:0 "It seems the government of Romania has accepted our offer to protect their current borders from their rather numerous foes. We are now committed to defending the expansive borders of Romania, and they continue to be drawn away from Germany and towards us."
 blocchidiplo_med.45.a:0 "Let's just hope no-one actually attacks them."
 
 blocchidiplo_med.46.t:0 "Romania Refuses"
 blocchidiplo_med.46.d:0 "The damn Romanians have rejected our offer of military protection, rather curtly telling us that they are capable of defending their own borders without our 'interference'. This represents a major blow for our influence over Romania, with a risk they will look to Germany for security instead."
 blocchidiplo_med.46.a:0 "Blast!"
 
 blocchidiplo_med.47.t:0 "Italy Offers Cooperation"
 blocchidiplo_med.47.d:0 "Italy has come to us with an offer of "cooperation". It is essentially a pact of non-aggression.\n\nThis would prevent any imminent invasion of our country by the Italian Empire, which is good as on our own we would not stand a chance. It would also signal to Italy that we would be interested in closer relations.\n\nThis all sounds well and good, but there is undoubtedly a catch. The Italians will undoubtedly seek to further increase their influence in our country. And not only that, but the Germans may not look upon this kindly...\n\nIs it worth it?"
 blocchidiplo_med.47.a:0 "We accept!"
 blocchidiplo_med.48.b:0 "We refuse!"
 
 blocchidiplo_med.48.t:0 "Romania Accepts"
 blocchidiplo_med.48.d:0 "Good news! The Romanians have wisely decided to accept our pact of non-aggression! This will be a harbinger of closer relations between our countries, and we shall surely further increase our influence in the country!"
 blocchidiplo_med.48.a:0 "Great!"
 
 blocchidiplo_med.49.t:0 "Romania Refuses"
 blocchidiplo_med.49.d:0 "Bad news! The Romanians have foolishly decided to reject our pact of non-aggression! Why on earth they would do this we have no idea. But they shall rue this day!"
 blocchidiplo_med.49.a:0 "Blast!"
 
 blocchidiplo_med.50.t:0 "Italy Offers Arm Shipments"
 blocchidiplo_med.50.d:0 "The military attachè from the Italian embassy has offered us an extremely convenient deal for the shipment of a large quantity of modern weapons, from assault rifles, to artillery, and even tanks! In his offer he cited "Italian goodwill and friendship" for the "protection of their Latin brothers in the East against German machinations" and, while we are indeed in dire need of advanced equipment, we can be sure that the Italians will ask for something in return. Perhaps their requests won't be as harsh as what the Reich has done to us in the past, but are we sure we want to take a side, and rish the other's wrath?"
 blocchidiplo_med.50.a:0 "Romania needs a strong army, we accept"
 blocchidiplo_med.50.b:0 "We are strong even without Italian help!"
 
 blocchidiplo_med.51.t:0 "Romania Accepts Arms Shipments"
 blocchidiplo_med.51.d:0 "The Romanian government has accepted our generous offer. Our military attachè in Bucharest has been invited by the Romanian General Staff to participate to important talks on how to best distribute the new weapons, further strengthening our ties with Romania: trains full of our best weaponry are en route for our Eastern friends, and the Germans will think twice before attacking us in the Carpathians!"
 blocchidiplo_med.51.a:0 "Excellent, another victory for Italy!"
 
 blocchidiplo_med.52.t:0 "Romania Refuses Arms Shipments"
 blocchidiplo_med.52.d:0 "Bad news! The Romanians, in their shortsightedness, have refused our most generous offer of an arms deal! Well, when the Germans come a-knocking, they'll rue the day they refused!"
 blocchidiplo_med.52.a:0 "Hard luck on them!"
 
 blocchidiplo_med.53.t:0 "Italy Offers Industrial Investments"
 blocchidiplo_med.53.d:0 "The Italians have come to us with an investment opportunity. They have offered to provide a substantial amount of investment into our ailing industrial sector in order to revitalize it.\n\nWhilst this aid from the Italians for our floundering industry would be most welcome, the Italians undoubtedly have ulterior motives. Through their investments, they would acquire greater stakes in Romanian industries, and thus, greater control. This would in turn lead to Romania falling ever further into Italy's orbit.\n\nSome say, however, that this risk is worth it to save our industry, and with it, our economy.\n\nIs it?"
 blocchidiplo_med.53.a:0 "Our industry needs it. We accept!"
 blocchidiplo_med.53.b:0 "No, we don't need it."
 
 blocchidiplo_med.54.t:0 "Romania Accepts"
 blocchidiplo_med.54.d:0 "Good news! The Romanians have wisely decided to accept our offer of industrial investment! Italian investment shall soon begin to pour into Romania, revitalizing their failing industry.\n\nMore importantly, of course, this means our influence in Romania will increase even further!"
 blocchidiplo_med.54.a:0 "Great!"
 
 blocchidiplo_med.55.t:0 "Romania Refuses"
 blocchidiplo_med.55.d:0 "Bad news! The foolish Romanians have short-sightedly refused our most generous offer of industrial investment! They claim to worry about our influence over their key industries.\n\nWell, when their industry inevitably collapses without our investment, they will certainly wish they had accepted!"
 blocchidiplo_med.55.a:0 "Hard luck on them!"
 
 blocchidiplo_med.56.t:0 "Italy offers Military Liasons"
 blocchidiplo_med.56.d:0 "The Italians have approached us with an offer of military liaisons. In other words, the Italians will send 'advisors' to Romania in order to train our officer corps with their expertise, boosting our military's capabilities.\n\nThis sounds like a pretty good deal. Italy is one of the strongest great powers in Europe, so having them train our officers would be a great boon to our ability to defend ourselves. Of course, this also runs the risk of increasing our military's dependence on the Italians, and further drawing us into the Italosphere. It could also attract the ire of the Germans.\n\nWhat shall we do?"
 blocchidiplo_med.56.a:0 "We accept! Italian-trained officers will be great!"
 blocchidiplo_med.56.b:0 "We do not need Italian help!"
 
 blocchidiplo_med.57.t:0 "Romania Accepts"
 blocchidiplo_med.57.d:0 "Good news! The Romanians have wisely decided to accept our offer of a military liaison! Our 'advisors' shall head over right away to begin training their officers with the cutting edge of Italian military techniques!\n\nThis will boost their defense capabilities whilst also increasing their dependence on us. Everybody wins!"
 blocchidiplo_med.57.a:0 "Great!"
 
 blocchidiplo_med.58.t:0 "Romania Refuses"
 blocchidiplo_med.58.d:0 "Bad news! The foolish Romanians have refused our most generous offer of a military liaison!\n\nThey claim that having Italian-trained officers would impugn on their sovereignty, and that we have ulterior motives. We do, of course, but we had hoped that pragmatism would prevail on their part. Alas.\n\nWell, when the Germans come knocking, they'll wish they had accepted!"
 blocchidiplo_med.58.a:0 "Hard luck on them!"
 
 blocchidiplo_med.59.t:0 "Italians Approach the King For Support"
 blocchidiplo_med.59.d:0 "His Majesty surely sees that brotherhood between Italy and Romania will be of the greatest benefit to both Nations"... So went the letter delivered with courtesy by the Italian Ambassador to the King this afternoon, the latest in a series of attempts by Italy to influence our country. King Michael has, of course, received advice on the implications of accepting or not accepting this overture from the Italians; the decision, however, will be taken by His Majesty alone."
 blocchidiplo_med.59.a:0 "The King Agrees"
 blocchidiplo_med.59.b:0 "The King Disagrees"
 
 blocchidiplo_med.60.t:0 "Romanian King Gives Support"
 blocchidiplo_med.60.d:0 "Our overture to King Michael of Romania has been successful. Today we receive news that the King was appreciative of our message, and has expressed his wish that "the deep bond and friendship which the Romanian and Italian people share become ever stronger". This is welcome news indeed, and will be a boon to Italian influence in Romania."
 blocchidiplo_med.60.a:0 "Very good."
 
 blocchidiplo_med.61.t:0 "Romanian King Declines Support"
 blocchidiplo_med.61.d:0 "A surprising, and disturbing, turn of events. Officially, our overture to King Michael of Romania has not been met with a reply. Unofficially, the King's lackeys have made it known to us that the King cordially declined supporting us, and does not wish the matter to be raised again. It is hard to imagine a more impudent response."
 blocchidiplo_med.61.a:0 "Who does this man think he is?"
 
 blocchidiplo_med.62.t:0 "Italy Interferes in Romania"
 blocchidiplo_med.62.d:0 "The Italians grow restless. In their latest effort to expand their sphere of influence in Eastern Europe, our Romanian contacts inform us, Italy has been pushing to secure their advantage over Bucharest. We can redouble our own efforts in the country, letting Romania know that submitting to Italian pressures is unacceptable. Yet there are many pressing matters in Germany, and we can also let the matter go."
 blocchidiplo_med.62.a:0 "Pressure Romania to Refuse."
 blocchidiplo_med.62.b:0 "Let them do as they wish."
 
 blocchidiplo_med.63.t:0 "Germany is not Happy"
 blocchidiplo_med.63.d:0 "The Italian efforts to influence Romania have been noted in Berlin. Our diplomats are informed that, in so many words, Romania belongs outside the Italian sphere, and it would not be in our country's interest to continue interfering where we are not wanted or needed. The Germans, then, will not take our plans for Romania lightly..."
 blocchidiplo_med.63.a:0 "This is bad."
 
 blocchidiplo_med.64.t:0 "Italy Draws Romania Into Sphere"
 blocchidiplo_med.64.d:0 "The news has reached us that Italy is attempting to secure a military alliance with Romania, drawing that country into its orbit. This would be a diplomatic coup indeed, and should we wish, we can act with strength to prevent the Italians from expanding their sphere."
 blocchidiplo_med.64.a:0 "Stop Them."
 blocchidiplo_med.64.b:0 "Let It Go."
 
 #### THE OIL EMPIRE ####
 

 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
ITA_scorza_ending.1.a:0 "Fascism must change to protect the past, so that Fascism will forever fortify the Future."
 
 
 #Mechanical Events#
 
 itapartyunity_med.2.t:0 "Unity is Everything" # BN and FD are coalitions of rightists and leftists respectively, though their coalition is strong now, it might not always remain that way
 itapartyunity_med.2.d:0 "Politics is a game of balances, of compromises, and where necessary of ruthless betrayal. Above all it is a game of unity, and of coming to an agreement with the right people so that the whole becomes greater than the sum of its parts. The coalitions making up the Blocchi Nazionali and Fronte Democratico contain a diversity of personality and thought which may appear surprising to the uninformed outsider, who may expect a more cohesive identity to linger behind the surface. Even among groups as ideological as the BN and the FD, however, the importance of convenience and compromise remain central. A man in another country once said that a house divided against itself cannot stand, and whatever we think of the person who said it, it is hard to fault the words."
 itapartyunity_med.2.a:0 "Differences must be overcome, for the greater good."
 
 itapartyunity_med.3.t:0 "The FD Collapses" # FD officially collapses due to the being ousted by De Lorenzo following the Piano Solo (this only occurs if the FD was previously incharge)
 itapartyunity_med.3.d:0 "After De Lorenzo implemented Piano Solo, ousting the government led by the Fronte Democratico from the halls of power, it was difficult to imagine any outcome other than this. Torn by internal disagreement over what to do now, with previous ideological and personal gaps bubbling to the surface, the Fronte Democratico has collapsed under the weight of its own inflexibility. The leftist coalition's demise is a heavy blow to socialist and social democratic politics throughout Italy, and indeed much of Europe, as a leading flame of the worker's movement is snuffed out."
 itapartyunity_med.3.a:0 "The working man bows his weary head."
 
 itapartyunity_med.4.t:0 "The BN Collapses" # BN officially collapses due to the being ousted by De Lorenzo following the Piano Solo (this only occurs if the BN was previously incharge)
 itapartyunity_med.4.d:0 "Ferocious arguments, desperate midnight conversations and open recrimination have led to the inevitable. After being ousted from power by De Lorenzo, the Blocchi Nazionali has collapsed, and with it a hope for post-fascist unity in the new order augured by the transition out of old-style fascism. Although some demagogues attempt to rally their troops, saying that the fascist ideal embodied by the BN is not yet dead, it is difficult to imagine the disparate and fiercely competitive elements making up the grouping coming back together."
 itapartyunity_med.4.a:0 "Out of power and out of time."
 
 
 
 #Italy Nuclear Events#
 
 #Ciano Democratization Events#
 
 demitaly_med.40.t:0 "An Address to the Grand Council" # Ciano speaks to the grand council of fascism alongside Umberto, Umberto is clearly making Ciano speak in this manner but Ciano covers that with the results in Verona, the nation will be following a different path. Many members agree with him, notably Amintore Fanfani who has been eyeing Umberto's talking points on democracy.
 demitaly_med.40.d:0 "Galeazzo Ciano smiled with his mouth, but not with his eyes. He had come into the chamber with King Umberto, and as the men present stood to attention Ciano paid notice to the way they addressed the monarch, bowing their head slightly as they shook his hand or making eye contact. Their respect for the King, or lack thereof, would make a big difference in their opinion of what Ciano had to say. At best, everyone present would go along with what was said, and at worst they would leave the room with reservations, which would set things back significantly.\n\nThe Duce spoke at some length, going over the talking points presented to him by the King. Democratisation would be complex and fragile, even with the systems and handover to be put in place, because to his knowledge no country had ever transitioned from Fascism to democracy. Verona had changed things for the better, Ciano said to the men present, trying to will himself to believe it. He had the full support of the King in saying this. To continue as things were before would be to risk a continuing stagnation and the dissolution of Italy's status in the world, rendering it a second rate power forever to be picked at by greater nations. Something had to give, and that something was the Fascist system designed by Mussolini for a time long past. Ciano scanned the faces of his audience. Amintore Fanfani's eyes gleamed as he listened. The man's smile was unnerving. He was not alone, and many of those present nodded solemnly. Others looked on unmoved, with faces which betrayed disappointment but not surprise. Yet no one interrupted.\n\nOnce he was finished, and had given a few curt instructions, the Duce followed King Umberto out of the room. Out of earshot of the others, the King grasped his hands in his own. "Well done," he said simply, beaming. Ciano returned the smile. Yet once more it was in his mouth, not his eyes."
 demitaly_med.40.a:0 "Many sleepless nights to come."
 
 demitaly_med.41.t:0 "The Christian Democrats Prepare" # The Christian Democrats! Seemingly the most popular party, though Ciano may wish for a more conservative party, Umberto on Ciano's side is happy to see the contenders in the upcoming election
 demitaly_med.41.d:0 "According to our sources, the Christian Democrats are preparing for a contentious electoral campaign. Everything indicates that this coalition, a moderate grouping of centrists, democrats and conservative elements bound by an idea of Catholic politics, will win power once the election arrives.\n\nThe Duce is not entirely pleased with their ideas, seeing them as too conciliatory to moderate leftist voters, but King Umberto is reportedly a firm supporter. Whether they will manage to push their advantage and implement their ideas remains to be seen."
 demitaly_med.41.a:0 "Let's see what the favourites can do."
 
 demitaly_med.42.t:0 "Meeting with the Parties" # Umberto meets with numerous factions in one day, he's tired out but still giddy about the reformation of the Italian system
 demitaly_med.42.d:0 "Umberto II was tired, but happy. As he sat down to have something to eat - dining alone for the first time in days - he reflected on the meetings with the political factions of the past few days.\n\nAll those who came to meet him had been respectful and, with a couple of exceptions, seemed intelligent enough. The Monarchists were, as expected, almost embarrassingly earnest in their professions of undying loyalty. The Christian Democrats were particularly interesting conversation partners, genuinely soliciting his views on a number of issues and then providing their own ideas. Aldo Moro had something of a radiant quality about him, with the quiet confidence of a man who knows he is the favourite to lead his country into democracy. The socialists were more courteous than he expected, with Pietro Nenni speaking at length and then observing the King carefully for his reaction. Umberto was under no illusions as to the republicans among their ranks, but Nenni artfully steered the conversation elsewhere whenever the King raised the issue. Of Almirante, with his ties to the PNF and his known views, he did not know what to make entirely. Yet the man was charismatic, even if he was the quietest of all the politicians he had spoken with over the past days.\n\nUmberto could be proud of what he had achieved. Italy would democratise, whatever the regressive elements among the PNF had to say about it. And he would be there to see it through."
 demitaly_med.42.a:0 "A firm hand to lead Italy to freedom."
 
 demitaly_med.43.t:0 "The Democratic Front's Hopes"
 demitaly_med.43.d:0 "The left bloc is ready. For forty years they have survived on nothing but the hope of eventually abolishing Fascism and establishing a worker's government in Italy, and now that Fascism is withering away, they see this as a matter of fate. Their leader, Nenni, has moderated his socialist views to become more acceptable to the middling body of the Italian electorate. Time will tell whether this strategy will pay off, and whether the renewed hopes of the socialists, some of whom have only returned from exile recently, will bear fruit."
 demitaly_med.43.a:0 "The workers of Italy hold their breath."
 
 demitaly_med.44.t:0 "A Roundtable of Parties" # Meetings with all of the democratic leaders, they do thing alongside fascists who are worried about the complete upheaval of the system, Ciano is a mediator with sympathies to the fascists while Umberto is there on side of the democrats
 demitaly_med.44.d:0 "Ciano rubbed the tiredness from his eyelids and looked up."If there is nothing more to add," he said. "I propose that we bring this meeting to a close. And thank you, gentlemen, for agreeing to come here on such short notice." But someone cleared his throat, and Ciano raised his head wearily. "Would you like to speak?" The person who interrupted did speak, at length, and Ciano actively stopped himself from nodding along. It was a grand old man representing the PNF interests, though not a party man himself. The democratic leaders that, at this meeting, only parties intending to run for election and civil servants of importance could attend. This had led to the awkward situation of a group of nominally independent civil servants speaking in defence of the PNF.\n\nIn any case, the PNF's man rambled on. He spoke about the threat to stability, of moving too quickly and throwing out the good of Fascism with the bad, and of letting down the hardworking members of the civil service through an imperfect democratisation. Ciano remembered the King, and held his tongue. He was here to mediate, and was determined not to give any of the Blocs - the right wingers, the Christian Democrats or the Left - cause to say he had been unfair. Ciano was sympathetic to the gentleman's points, he said carefully. Certainly democratisation would not occur at any cost and would not throw away everything of use. He was certain the party leaders agreed also on this - Ciano felt them getting angsty, with Nenni bursting to speak. Yet they should not be afraid, added Ciano quickly, to strike forth. No democratisation process could be perfect, and that should not strain their will to make the necessary change. With respect to the esteemed gentleman, who he knew to be an excellent leader of men and servant to his country, there would be no change to the plans. Ciano felt an audible shudder as he said this. He was starting to sound like the King.\n\nThe King himself congratulated him after the meeting, through his private secretary. "Do not let the short sighted hold back what is best for your country," said the man to him before slipping away. The Duce returned to his office, fighting the lingering uncertainty in his gut, and shut the door."
 demitaly_med.44.a:0 "Just fifteen minutes before the next meeting.. "
 
 
 demitaly_med.45.t:0 "The Gift of Democracy" # On to the next set of reforms! With a democratic system worked out, it seems democracy may be a gift that others will see soon, Ciano really is on the fence, but Umberto is still happy.
 demitaly_med.45.d:0 "It was almost complete - the project that would be Umberto's legacy and that of Ciano, whether the latter was proud of the distinction or not. A workable democratic system and carefully planned out methodology for the transition had been plotted out. Now all that was left was to wait, in the unbearable silence that moments such as this carried, and hope for the best. The King had decided he would spend the moment on his own to the best of his ability. When he managed to get away from his hangers-on he lingered in a balcony, looking out over his Rome as the lights of the evening began to turn on. It was always beautiful, the most beautiful city on earth - thought the King - and today it would change for the better, although you would not know to look at it. Despite Ciano's doubts, which he continued to express to His Majesty even today, Umberto had faith in his people. Forty years ago his father had given Mussolini the keys to power, and now the son would return those keys to the people, to do with them whatever they chose. Perhaps they would choose wrong, but Umberto had more faith in them than that. They had received the gift of democracy, and whatever happened next that meant something."
 demitaly_med.45.a:0 "The King stayed to look down onto his city until it grew dark."
 
 #Hot Autumn Events#
 hotautumn_med.1.t:0 "Strike at FIAT!"
 hotautumn_med.1.d:0 "The city of Turin woke up to another day of work - the most important industrial centre of northwestern Italy prepared to see the trams scuttle around the city, filled with men and women heading to their jobs, the smokestacks start to emit their dark columns of smoke, and the middle and upper classes were heading to their comfortable jobs at the many, many factories of the city. And yet, this was not to be another day of work - a strike of FIAT workers was scheduled for the day. Per se, this was not a rare occurrence - numerous strikes had been held during the summer, usually starting and ending in the span of twenty-four hours and controlled by one of the major trade unions, CGIL, CISL and UIL. And yet, this time it was different.\n\nInside FIAT, tensions had been rising for a long time. Dissatisfaction with the trade unions, viewed as bureaucratic, inefficient and all too eager to compromise with the employers, was creeping among the workers, and the continued prosperity of Italy seemed to bless everyone with its golden touch, except the many working class families of Turin and other working class cities. Rent and commodities became more costly and yet wages remained the same, the working hours were long and extenuating, and contracts were always at risk of being rescinded for mysterious and inscrutable reasons, at the whim of those sitting in the offices upstairs. Frustration turned into resentment, and resentment quickly became anger when FIAT announced that numerous contracts would not be renovated at the end of the year, resulting in many workers losing their jobs.\n\nWhen the strike began, it took everyone by surprise. FIAT, the largest car factory of Italy and one of the most important in the country, ground to a halt. The strikes spread like wildfire to numerous other factories across Turin, and it became clear that they wouldn't end at dawn. In the span of a few days, numerous impromptu workers' organizations and committees were formed, declaring an all-out strike. One of the most important industrial hubs of the country was shut down. Of course, the police were quick to mobilize to prevent the strikes from turning into riots, and the trade unions hurried to retake control of the situation. For now, the air is tense, and nobody knows how the situation will develop."
 hotautumn_med.1.a:0 "We can surely talk this out."
 
 hotautumn_med.2.t:0 "Strikes Spread Across the Country!"
 hotautumn_med.2.d:0 "In the days following the proclamation of the strike at FIAT, many began to realize that Turin was merely the first spark in the tinderbox. Soon, similar strikes were announced in the other major industrial centres of northern Italy, Milan. The working class district of Bicocca, in the northeast of the city, home to numerous important factories such as Pirelli, became the location of numerous strikes and worker protests. The strikes were so prominent and widespread that even the most reluctant trade union, CISL, was tentatively forced to support them for fear of backlash, and the central committees of UIL and CGIL have released a statement giving full support to the strikes.\n\nThe emergency isn't limited to Milan either - Genoa, Florence, Rome, Taranto, and every other industrial city in Italy, even smaller towns, are beginning to flare up with strikes. Every working class sector is involved, from steel mill workers to railway workers, and even other categories such as schoolteachers and nurses are beginning to set up strikes of their own, as the snowball is rapidly picking up speed and size. Their demands are as varied as the many groups they come from, ranging from more stable contracts to better wages and reduced work hours.\n\nWith the police deployed at most locations where the strikes are taking place, the government is confident that no other direct intervention is necessary, and with the trade unions now regaining control of the situation, it's only a matter of time before negotiations begin between the unions and the employers. While they will of course be forced to make concessions, a deal will surely be found in the end, and while many in government are worried about communist or extremist infiltration, a direct intervention from the government could easily do more harm than good."
 hotautumn_med.2.a:0 "This is a sign of a healthy economy."
 
 hotautumn_med.3.t:0 "The Strike Escalates!"
 hotautumn_med.3.d:0 "It seems like the early hopes for a peaceful resolution to the strikes are being dashed one by one, as strikes around the country escalate in violence and demands. Workers' control of the factories and workplace democracy are only some of the demands and slogans that are starting to be chanted - in Milan, workers attempted to violently occupy the Pirelli factory and were stopped by a police cordon, and in Turin, clashes with the police began after the workers started to accuse the police of being "fascist dogs". The most worrying development of all, which has exacerbated the situation further, is that it seems like communist agitators coming from universities and other youth movements are infiltrating and becoming influential among the striking workers.\n\nCommunist red banners are being raised in marches and protests, as students and workers march together. Universities are once again becoming inflamed with riots of their own, and frequent police sweeps barely seem to amend the problem, as law enforcement forces are starting to be stretched thin in numerous cities. Communist groups are once again starting to occupy classrooms and even entire buildings of universities, and the reaction from fascist groups has infallibly caused numerous clashes among students, some of which resulted in serious injuries and deaths.\n\nPolitics is, as always, divided and torn on how to deal with the issue. Representatives from Democrazia Cristiana have argued that the government should act as a mediator between employers and trade unions to quickly resolve tensions, while the Fronte Democratico has proposed enforcing the demands of the trade unions to safeguard the Italian worker. Finally, the Blocchi Nazionali have warned about the ever present communist menace, and have demanded a hardline stance against the red snakes that crawl in the underbelly of the Italian cities. With the government so bitterly divided, the situation seems more unstable than ever, and with no hope of a quick and peaceful resolution in sight, the Italian economy has started to suffer too."
 hotautumn_med.3.a:0 "This is terrible!"
 
 hotautumn_med.4.t:0 "FUAN Tries to Occupy the Statale"
 hotautumn_med.4.d:0 "The situation in Milan, already plagued by strikes and riots, has further deteriorated. Following a major clash between right wing and left wing students, the Fronte Universitario d'Azione Nazionale, Italy's major right wing student organization, has attempted to occupy a few classrooms in Milan's university, the Statale. Barricading themselves in, the students of FUAN have employed their advantageous position to repel the assaults of their left wing counterparts who attempted to dislodge them. In response, various left wing student groups have declared occupations of their own, and the Statale has been turned into a warzone.\n\nClashes have been violent and relentless, with bottles and rocks being flung by both sides and bloody confrontations happening with crowbars and wrenches being used as weapons. The university's rector has attempted to negotiate with the students to attempt to calm things down, but it appears like his efforts are going to be fruitless. The police have already cordoned the university, and an intervention might be only hours away.\n\nNo comment has arrived from the leaders of FUAN and the representatives of the Blocchi Nazionali, the coalition FUAN is associated with - this leads many to believe that the situation has deteriorated because of radicals within the organization acting independently from their superiors. The chaos at the Statale is only yet another step of Milan's descent into chaos, and many worry that anarchy will soon spread to other universities of Italy, as it did during last spring."
 hotautumn_med.4.a:0 "This is madness! Madness!"
 
 hotautumn_med.5.t:0 "The Police Clears Out the Statale"
 hotautumn_med.5.d:0 "Following recent events, the rector of the Statale has issued a formal plea for help to the Polizia di Stato and the authorities, asking them to restore order in the university. With any semblance of negotiations breaking down, the police charged into the university, flushing out the students from the university and its surroundings using copious amounts of tear gas, batons and water cannons. Both FUAN and left wing students have been targeted by police, leading to some condemnation coming from many political representatives regarding perceived brutality.\n\nNumerous students have been gravely wounded following the police action, with dozens of them taken into custody by police. Numerous dangerous weapons, including makeshift bombs and a few guns, have been seized, but this new crackdown has done little to defuse tensions - both sides, leftists and neo fascists, accuse the other of collaborating with the police, and the political debate is only getting more heated, as leftist politicians accuse the Blocchi Nazionali of harboring neofascism and radicalism in FUAN while BN politicians accuse the Fronte Democratico to allow communist infiltration in student groups close to their coalition.\n\nWhile the university has been pacified for now, the streets of Milan remain chaotic. Numerous students from leftist groups have now left the universities and are actively agitating the striking workers, spreading communist propaganda and calling for unity between workers and students to change the system. Meanwhile, the city's right wing has not sat idle - local sections of the BN have expressed their condemnation of communist violence in the city and have announced that they won't stand idly while the reds attempt to overtake Milan with the police and the politicians' complacency."
 hotautumn_med.5.a:0 "What can we do?"
 
 hotautumn_med.6.t:0 "The Hot Autumn"
 hotautumn_med.6.desc:0 "Autumn has begun, and it's not an ordinary season. Everywhere in the country it feels like a subterranean fire is rising, its excruciating heat boiling the atmosphere from the very depths of the earth. An entire town in Campania revolted over a factory being closed; Padova's university has become the theatre of occupations and clashes; numerous left wing associations and local party headquarters in Milan have been firebombed; fascist students have been attacked and given a bloody beating by communist ambushes; and the strikes, all over the country, are only getting bigger.\n\nThe Hot Autumn is upon us, a grand opera of tragedy and conflict. Many are those with stakes in the struggle, and many are being swept into this hot, searing wind that is blowing over Italy. A worker, striking for a fairer job that will let him care for his family in peace; a representative of a Catholic trade union, who sees the world around him slowly consumed by flames; a young idealistic neofascist, who with his fellow students hope to bring Italy back on the right track; and a police officer, standing on the thin line between anarchy and repression.\n\nAll of their stories intertwine, meeting and abandoning each other, as the threads of human lives do. But each and every one of us can only follow one thread in our mortal lives - and so a choice must be made between one of these four crossed destinies."
 hotautumn_med.6.a:0 "Play as the Worker."
 hotautumn_med.6.b:0 "Play as the Union Man."
 hotautumn_med.6.c:0 "Play as the Student."
 hotautumn_med.6.d:0 "Play as the Policeman."
 
 hotautumn_med.7.t:0 "An Expired Contract"
 hotautumn_med.7.d:0 "The news arrived like a blast of icy wind. Written in a cold, matter of factly language, the same communique was delivered to dozens and dozens of workers and employees at the large Pirelli industrial complex, a behemoth of smokestacks and work sheds dominating the Bicocca suburb of Milano. The job contracts that were supposed to last for at least another two years had been rescinded, and will be renegotiated - numerous workers were being laid off as the industry was being restructured - pension plans might be in jeopardy - wages will be rediscussed, and likely cut.\n\nMario Calabrò received the very same letter from the hands of a foreman. Reading it in the dim light of his apartment, his wife by his side, as the kids were already asleep. His family, his house, all were now at risk. If he were to be laid off, there was no other option - they would have to move back to Mario's home town, in the deep South. Milano was a mirage - a promise of work for everyone which had attracted many people like him, hoping to escape the poverty of the rural Italian south. Milano was an alluring monster - chewing people and devouring them whole after a lifetime of backbreaking work in the factories.\n\nIt didn't take long for a reaction to blow up, especially with strikes already underway in Turin. At first timidly, labour associations and trade unions announced their intention to protest - the first banners were hanged, the first strikes began. The leaders of Pirelli, captains of finance and shining examples of Italian industriousness, reassured that everything would turn out fine and that contracts would soon be renewed. Still, the situation was already largely out of Pirelli's control, and when the vast majority of factory workers in Bicocca crossed their arms in a strike, Mario was among them."
 hotautumn_med.7.a:0 "Sciopero!"
 
 hotautumn_med.8.t:0 "Biocca Brucia"
 hotautumn_med.8.d:0 "In all truth, Mario Calabró had never intended to be part of the demonstration in Bicocca that night, although it was also true that his sympathies were firmly on the side of those assorted laborers, students, and even teachers who made up the bulk of the group. He had previously joined similar events over the past few weeks after learning just how precarious his employment situation was. All the same however, on that cool night Mario Calabró, long-suffering factory worker, was only interested in returning home to his family as quickly as possible. That was why he, in a decision that was made so quickly the man himself did not even consciously process it, chose to take a route home that was supposed to be ever so slightly shorter. That choice to shave a few minutes off of his nightly commute would prove to be the most significant of his life.\n\nHe started hearing the shouts two blocks out after leaving the factory. At that moment, he could have changed his mind and gone his regular route, or he could have made another detour using some third way to avoid any unpleasantness. He chose neither option because, as he reasoned to himself as he walked along the sidewalk with his lunch pail dangling at his side, it was likely a noisy but relatively small gathering of his fellow workers and he could easily cross to the other side of the street and continue unimpeded. He wanted to catch his children before they went to bed, and to do that, he needed to move quickly. He had been working longer and longer hours recently with the economic troubles and he was seeing his family less and less. To a devoted family man such as he, such an arrangement was frustrating to the point of maddening but he had no alternatives if he wished to keep his job.\n\nHe ought to have been tipped off to the reality of the situation when the noise kept increasing the entire time he walked, but his concentration on arriving back to his home as soon as possible was damoening his perception of the outside world. That was why he was stunned to discover that instead of the few grizzled factory workers and fresh-faced students he had been expecting there was a veritable horde of angry protestors choking up the street. It only took a single sweep of the grim, determined faces for Mario to realize that he had just walked into the beginnings of the kind of riot that can shake the course of a nation."
 hotautumn_med.8.a:0 "An unassuming player enters the stage."
 
 hotautumn_med.10.t:0 "A United Struggle"
 hotautumn_med.10.d:0 "There were many things Mario expected from striking, such as police opposition or even fascists countering them. However, he never expected that college students would join them spontaneously. In almost the blink of an eye, Mario went from being surrounded by his fellow workers to being surrounded by strangers who waved communist banners and sang revolutionary songs.\n\nIt was almost surreal, having communist university students walk side by side with men who had fought the USSR. Mario found himself talking to one of the students, a girl from Torino named Anna, and found something surprising. Unlike how the communists seemed to be portrayed, the girl was surprisingly eloquent, and she did not constantly speak about the bloody murder of all the bosses in Italy. It was a stark contrast from the communists at Biocca and Pirelli, who tended to be much more aggressive in their methods.\n\nHowever, before Mario could ask Anna to elaborate more on some of her views, they were separated by more groups joining the strike. While this strike had once merely included factory workers, it now held nurses, teachers, students, and so many more different types of people. Mario felt inspired. People from completely different walks of life were joining their strike, people that Mario would've never interacted with otherwise. They were all united, chanting slogans, waving revolutionary banners, and singing songs which undoubtedly made old Mussolini turn in his grave. Maybe there was hope after all for him and his family."
 hotautumn_med.10.a:0 "The people of Milan stand hand in hand."
 
 hotautumn_med.11.t:0 "Chats with the Students"
 hotautumn_med.11.d:0 "Throughout his whole life, Mario had never attended political meetings. He'd never been the most political man, so attending a meeting of communist students, of all things, was a brand new thing for him. Mario felt out of place, to an extent. While there were a few people there his age or older, the majority of the attendees were in their 20s - some seemingly even younger. Red flags and banners calling for proletarian - student unity were draped on the walls, as scrawny kids sporting red handkerchiefs and wide smiles exchanged talks with big, brawny steel mill workers.\n\nSoon enough, one of said scrawny kids, wearing a big pair of glasses and an eskimo jacket, took the floor - but his words were soon enough to convince everybody in the room that he was no ordinary youth. "We are here today because we are united in a common struggle. The Italian working classes and the Italian students share a common goal, but moreover, they share a common enemy - the ruling classes, the padroni. Your bosses are the same people who, a few scant years ago, gloated at the sight of blackshirts marching in the streets, saluting them as they beat up, incarcerated, and tortured the proletarians who dared raise their heads against the regime."\n\n"Now, the same thing is happening once again. All over Italy, the working class is once more locked in a deadly struggle with their bosses - with the only slight change that this time, your bosses hide under a facade of democracy as they beat up, incarcerate and torture those who defy them. The politicians representing you used to be fascist bureaucrats and supporters! Do not be deceived, my comrades - ours is not a democracy, for democracy cannot be handed down by those who rule from above. Democracy is won in a struggle - a struggle we must be organized, prepared for, a struggle we must win at every cost! Democracy is a rifle on the shoulder of the worker!""
 hotautumn_med.11.a:0 "The oration is met with thunderous applause!"
 hotautumn_med.11.b:0 "The speech is met with awkward silence and coughing."
 
 hotautumn_med.12.t:0 "Contro Tutti I Padroni"
 hotautumn_med.12.d:0 "Finally, Mario understood. He always heard his fellow workers talk about communism, but he had never gotten why they were so fervent. He had always brushed them off as radicals who should be ignored. However, Mario saw it all in a different light now, for he had seen the possibility of a future where the world could truly be free. He had hope of a time where there would be no more nights where he went to bed hungry, no more times when him and his family were destitute. That glimpse of a possible future, however small it may be, was worth pursuing in the mind of Mario.\n\nThe dream of revolution grew not only in Mario's mind, but in the minds of many members of the Fronte Democratico. The communists, once only a small subsection of the party, grew like wildfire. The rank and file grew more and more attracted to these radical ideas, and the moderates of the FD were drawn into more and more bitter conflicts with the radical leftists than ever before. These conflicts, as the Hot Autumn raged on, would only weaken the unity of the party."
 hotautumn_med.12.a:0 "The flames of revolution grow and grow..."
 
 hotautumn_med.13.t:0 "We All March Together"
 hotautumn_med.13.d:0 "Bicocca, early morning. The air was crisp, a cool breeze caressing the trees and the buildings. At the far end of the square, a police detachment, in full riot gear. Armored vans, horses, shields, batons, guns. "They're going all out on this one" said a kid who couldn't have been older than seventeen, spitting on the ground. "They're scared." Calabrò looked to the other side of the square - what seemed like a ragtag assortment of striking workers, angry students, even a few women. Some carried signs wishing death to the ruling classes, others hid zhdanovs under their coats, possibly with the hope of giving a bit more credibility to that threat.\n\nThe standoff lasted for around four hours. Bottles and rocks were hurled at the police - the police fired back with tear gas. Calabrò felt the burning rise up his nostrils before he was handed a handkerchief soaked in water, and he wrapped it around his mouth and nose as he saw a young girl climb up the barricades and throw a rock at a cop who had advanced a bit too close. Hit on his head, he fell to the ground before being carried back behind the ranks as the policemen regrouped. When the police charge finally happened, the protestors all fled through side alleys, leaving battered barricades and a few burning cars behind. Calabrò finally got home, dirty, broken and exhausted."
 hotautumn_med.13.a:0 "Is this working?"
 
 hotautumn_med.14.t:0 "For Bread Alone"
 hotautumn_med.14.d:0 "Mario wanted desperately to embrace the idealism of these students, of their communist ideology. However, he knew it was impossible. Political and social equality sounded great, but actually achieving these goals would be nearly impossible, especially considering that the Italian government would fight tooth and nail against communist revolutionaries. The idealism of the students was infectious, but Mario had inoculated himself. He would strike, yes, but he would strike only for bread, and not anything more.\n\nMario's rejection of communism and radicalism was not unique. All throughout the Fronte Democratico, the moderate leftists and the rank and file workers rejected the call of communism, and the voices of the radicals were isolated more and more as fewer and fewer people listened to them. The revolutionary ideals of the communists gave way to the rational pragmatism of the moderates, unifying the party under the cause of bread."
 hotautumn_med.14.a:0 "The fires of revolution have been contained."
 
 hotautumn_med.15.t:0 "The March of Labour"
 hotautumn_med.15.d:0 "Compared to the chaos that seemed to have gripped Milano, the march organized by the trade unions seemed like an oasis of peace and quiet. In an orderly manner, the workers and representatives of the unions - CGIL, CISL and UIL - marched on the streets, shouting their slogans, waving their flags, displaying their banners, and loudly proclaiming their demands to the seemingly uncaring buildings and streets of the city. Calabrò took part in this wholesome endeavour - he shouted and shouted like the others did, and yet nobody seemed to answer. Even the long cordons of police seemed bored, and rather annoyed at most.\n\nAt the end of the day, a representative from a union, perhaps CGIL, addressed the workers. "Workers, comrades, what we are pursuing here is not utopias - we are building the foundation for a better life! A fairer pay! A safer workplace! And as we exercise our hard won democratic right to protest, we are assured that the government will need to heed our requests! Soon, things will change!" Calabrò, like the others, shouted and cheered at the news. Many other marches, many other protests like that one would take place - making the same demands, asking for the same things, always speaking to the same uncaring faces of policemen, buildings and streets."
 hotautumn_med.15.a:0 "Do things ever change?"
 
 hotautumn_med.16.t:0 "Organizing the Rally"
 hotautumn_med.16.d:0 "Milano is a big city - and despite this, news still spread fast. Some say that the idea of the rally was first proposed by student groups, then passed on to small, independent unions. From there, it snowballed. Steel workers, farmers, miners, nurses, teachers, soon enough association after association announced they'd show up. Finally, the big ones - CGIL, CISL and UIL all announced they would take part in the rally, likely out of fear of losing every little crumb of credibility they had left. And soon enough, everybody seemed to be heading for Rome.\n\nThe government had been cautious - some urged for letting the protest happen, others demanded it shut down. Eventually, to ease tensions, the mass strike was allowed to happen, with an extraordinarily large police and military deployment. Milano, Torino, Taranto, Genova, the centres of insurrection had seemed to slow down - as everybody was busy preparing for what was to come. Signs were made, bigger than ever - new slogans were crafted, catchier and more appealing - meetings were held, speeches written, fists raised.\n\nCalabrò was not enthusiastic about the idea of the rally at first. The train ticket was costly, but then a friend of his, with contacts in CGIL, offered him a free one. He was afraid his wife would complain, but she actually encouraged him to go, even tentatively smiling. All his friends and colleagues were planning to go. After all, a little bit of hope never hurt anybody."
 hotautumn_med.16.a:0 "Perhaps we can change things."
 
 hotautumn_med.17.t:0 "A Strike in Rome"
 hotautumn_med.17.d:0 "This time, it was different. This time, the crowd was bigger, far bigger than any crowd most people there had ever seen before. This time, the shouts of the thousands of workers, students, women, elderly men, former political exiles, immigrants, ex colonial subjects, homosexuals, idealists, dreamers, fighters, all the oppressed, the shunned, the weak - their shouts echoed in the very halls that had held up the foundations of the Italian state ever since it was conceived. The Fori Imperiali echoed with the cries of the downtrodden - and the ancient stones answered with silence.\n\nIn response, the state was not afraid to flex its muscles. Tanks, APCs, armed soldiers, entire phalanxes of policemen and Carabinieri armed to the teeth, even some helicopters circling the skies of the Eternal City. There were many moments in which the crowd was about to erupt into violence - as if a spark would be enough to set Rome ablaze. But that spark never came. The rally came and went, shouting its cries into the halls of power - and the halls of power answered with silence.\n\nIn the end, politicians climbed their stages, as they always do. Promising solutions, promising that the people's voice has been heard. A few years ago, when the country was hopefully looking at a new future, this would have worked. Now, one crucial thing changed - once silenced, the Italian people were allowed to have a voice, and it was learning to use it too. Now, many were starting to learn that a voice wouldn't be enough, and more incisive methods were needed to make a point. Young leftists were ever more disillusioned. Frustrated. Angry."
 hotautumn_med.17.a:0 "One way or another, things will change."
 
 hotautumn_med.18.t:0 "CGIL, CISL, and UIL"
 hotautumn_med.18.d:0 ""It sounds like a waste of time to me." These men in their fancy suits and combed hair provided stark contrast to Mario's own light blue denim clothing. He normally wouldn't wear his protective gear outside of work, but someone had suggested it might make a statement when the union representatives arrived. Instead, he just felt silly, sitting at this desk in front of these suits.\n\n"I assure you, Mister Calabrò..." The head suit reassured the steel worker as he already had so frequently in this conversation. "It will be most beneficial, to both the union and to the workers who make up the union.." He gestured towards Mario. "Such as yourself."\n\nMario Calabrò had his arms crossed over his chest in quiet, but weakening defiance. "There's more important things going on. What would a debate solve? Much less a debate between union boys. Just... Have your debate, why should we care?"\n\n"Transparency, Mister Calabrò. Transparency, participation of the workers in the affairs of the union, expanding your perspective... You ask why you and people like you should care, I ask you instead, why shouldn't you?" The representative leaned back in his chair at the end of his explanation.\n\nThe two sat in silence for an uncomfortably long amount of time, though the Union Suit sure didn't seem all that disquieted as Mario mulled over the offer in his head. With a final sigh, he let his shoulders slump. "How long do you expect it to take?""
 hotautumn_med.18.a:0 "An hour, two at most."
 
 hotautumn_med.20.t:0 "Roundtable with the Workers"
 hotautumn_med.20.d:0 "The steel workers had their collective suspicions going into this, but they had to admit, it was certainly more entertaining than they had expected. The suits up on the stage had debated things like union policy, union dues, and issues facing the CISL itself. Really, it was enough to put the most politicized laborer right to sleep, that is, until the topic of reaching out to the other unions came around.\n\nThe CISL might be considered radical by Italy as a whole, but they were nothing compared to the outright socialists and communists in the CGIL. There was bad blood between the CISL, who looked to reform the system, and the CGIL, who advocated tearing it all down and starting anew. So, the yawning and droopy-eyed audience began to blink and sit up straight when the mediators asked the fancy suit men as to whether or not the union should join forces with the CGIL.\n\n"We broke off from the radicals for a damn good reason!" The suit sitting furthest to the right was making a real show of this. He might not have, had his compatriots seated on the other side of the forum admitted to understanding some of the benefits of such an alliance. "If they'd had their way, they'd have forced us into this crisis long ago!"\n\n"The need for solidarity and unity supersedes individual political disagreements in times like these!" One of the other speakers- the most eager among them to work with the communists, notably- rose to the defense of the idea. "If we back down and negotiate with the corporations now, they'll think that the working class can be easily bullied! Pushed around!"\n\n"So you would sell the worker's soul to the rabid communists instead?"\n\n"The only soul on sale here sir, is your own."\n\nThe crowd listened, and as the voices lowered and the fire and fury cooled, a prevailing attitude took hold of the crowd. The people cry out with one voice, and they say..."
 hotautumn_med.20.a:0 "Better dead than red!"
 hotautumn_med.20.b:0 "Solidarity forever!"
 
 hotautumn_med.21.t:0 "The Olive Branch"
 hotautumn_med.21.d:0 "The debate all but ended there, though like with most things related to the union suits, it took a good while for the debate itself to figure that out. In the end, the men in suits shook hands, some murmured words between each other, and went their separate ways. The speaker who railed against an alliance with the CGIL took one last look over the crowd who had been swayed significantly in the other direction.\n\nMany workers had walked into that meeting hall without much of a mind to the upcoming Union elections, but by the time he left, he had decided. He'd stop by the union offices next week, and the CISL would hear what he had to say.\n\nWhat made them so different from a CGIL auto worker? He didn't join this Union for the politics, for the purity of its ideologues or any of its particularly high-minded ideals beyond what they said they stood for. The rights and privileges of the average worker, and how could that be achieved if they refused to work together?\n\nAnd so, when the time came to vote, he'd vote for solidarity and not division. A united general strike was a strong general strike, and the parliament up in Rome would certainly have to listen to them. Social Democrat, Christian Democrat, Socialist, Communist, what difference did it make when wages were low for all of those workers, regardless of their personal political inclinations? This fight was the fight for all workers, for all laborers, and he was part of the whole, weren't they?\n\nFrancesco's debate appeared to be a success, and Mario walked away from the debates with a greater sense of solidarity with his fellow worker than ever before. Should CGIL agree to it, they and CISL would stand, linked arm in arm, and the unions would in turn lock arms with the workers they represented, both those unionized and otherwise."
 hotautumn_med.21.a:0 "About time!"
 
 hotautumn_med.22.t:0 "The Unions Unite"
 hotautumn_med.22.d:0 "CISL reaching out to CGIL was only the first step into forming a broad coalition for all workers. The radicals in the CGIL were nothing if not unpredictable. The union was made up of far leftists- communists and socialists, some even whispered that some anarchists were connected to the Union as well, though that was simple gossip. They were revolutionaries- both of the violent and voting sorts- and revolutionaries were hot of head and quick to anger, everyone knew. Would they react favorably to the offer? Would bad blood get in the way of progress?\n\nFrancesco Inceli leaned forward, hands steepled together, foot tapping rapidly on the ground. He was already running disaster scenarios through his head. CISL had been less than eager to join in on the General Strike than CGIL was, and even the UIL seemed more enthusiastic about it than CISL had been. Could they go to the UIL if the CGIL refused them? Or perhaps they could spin a refusal to earn the attention of their workers somehow... If only...\n\nMario Callabrò sat back in his chair, arms crossed over his chest. It was time to see just how dedicated to the cause these Socialists were. Would they put aside their personal grievances to join forces with him, and men like him? He didn't see any harm in their alliance if it went through, but why should it bother him- or anyone like him- if the communists would not work with them? They could do this on their own, but it would be better to do it together, even a blind man could see that.\n\nThen, the doors opened, and three figures stepped into the room, practically flying on their feet. The first figure had a CISL pin on his chest, and stepped to the side with a wide smile on his face. The second, a pin with the CGIL symbol proudly placed on his own chest, practically swept into the room, walking right up to Francesco who was still standing up. The third entered at a much more relaxed pace, leaning against the doorframe.\n\nOnce face to face with Mister Inceli, the CGIL representative wasted no words, instead he grabbed the man's hand with a firm grip, and pressed his lips to Francesco's cheek, a display that caught the CISL rep off-guard, much to the amusement of the workers that filled the room behind them. "We are told that you are the man to thank, Mister Inceli!"\n\nFrancesco blinked as he recovered his senses. He looked around the room, and then past the Communist representative. "We?"\n\nThe last man stepped through the door frame, his UIL pin becoming visible in the light of the room. He extended a hand towards Francesco Inceli and smiled faintly. "We need only shake on it, Mister Inceli.""
 hotautumn_med.22.a:0 "Success beyond our wildest hopes!"
 
 hotautumn_med.23.t:0 "A Joint Rally"
 hotautumn_med.23.d:0 "Rather than the disparate, separated and scattered cries from across the North of Italy, the Italian worker now stood united and for the first time, all three of the major northern unions- the moderates of the CISL, the radicals of the CGIL, and the Christians of the UIL- all stood in solidarity and host their first joint rally in the streets of Milan. Francesco never thought he'd see the day. He never thought he'd want to be part of it either, he recalled- with a little bit of shame admittedly- how he'd rail against communism and socialism when he was younger, when Virgilio was still just a tyke. Oh, he never thought that the people were anything more than idiots duped into a system that was incapable of standing up to pressure of any sort. But then he spoke here today, he spoke of the disparity of wealth between the working man and the rich man. He spoke of safety regulations and the insane expectations placed on workers for their productivity. And when he looked among the masses gathered before him, he could not tell who was a Socialist and who was not. When he waved his goodbyes to the crowd to make room for the next speaker, all of the workers made their approval known. Mario Callabrò had never thought he'd see the day, but not only was it here, but he was standing here, in the midst of it. Many of the CISL faithful had not attended the rally, something of an ironic striking of the strike, out of political convictions, but many more workers found their sense of worker unity and allegiance when the call was made. Out of the corner of his eye, he saw some of the fellow rally attendees stumble and fall, some shouts and harsh words were said. By the time Mario made it over to help the fallen man to his feet, the stumblers were already gathering themselves.\n\n"Some jackass was shoving their way through the crowd towards the exit." The fallen worker muttered as he rubbed his head. A bump, nothing more. "I can't see him anymore, he must've been in a hurry, I suppose."\n\nNone of the men recognized the man as someone from any of their unions, but the matter soon gave way to introductions and banter, as men of all three unions continued to mingle and build bridges."
 hotautumn_med.23.a:0 "An alliance of workers, not men in suits"
 
 hotautumn_med.24.t:0 "Light and Noise"
 hotautumn_med.24.d:0 "Francesco Inceli was dead tired. It had been an eventful two weeks for him, from deciding to reach out to the CGIL, to organizing the debate and campaigning for his proposal to make it through the election, to organizing and hosting the rally with not one, nor two, but three of the largest unions in Italy attending? Any man would be exhausted.\n\nShaking hands once more with the representatives of the CGIL and UIL, he accepted the cheek kisses- socialist fraternal kisses, he was told- begrudgingly before waving his farewells. He stepped down from the stage, and into the crowd that still filled the block even as many of them were filtering out to leave. He was often sidetracked, shaking hands and accepting rough-handed pats on the back from the workers as he made his way, slowly but surely, towards his car parked behind the stage.\n\nThe silence and stale air of the interior of his car was welcome. He'd never liked driving much, the car was too small, too restraining, and always smelled too much like an old man. Tonight though, those features brought him a strange sort of comfort. He leaned back, and allowed himself a moment to stare up at the moon and rest.\n\nIt simply wouldn't do to fall asleep here, though. Home was''t far, and more than anything else, what he wanted was his bed, and some real, actual, restful sleep. He stuck the key in the ignition and turned it.\n\nThe engine turned over once, twice, and then it made a clicking noise. Then there was only light and noise as the car erupted into a fireball and sent glass and steel everywhere."
 hotautumn_med.24.a:0 "As horrific as it was sudden."
 
 hotautumn_med.25.t:0 "Rebuke the Communists"
 hotautumn_med.25.d:0 "No matter what pretty words, inspiring platitudes, and sentimental ideals these men in their suits might throw at the men of CISL, that would not change one simple fact. They had damned Italian blood running through their veins, and they would be damned before allowing socialism to corrupt the Italian spirit and workforce.\n\nWhen the gentleman sitting to the right finished his closing statements, he was met with resounding applause and cheers from the crowd. His opponent and his cohorts in turn, received sparse applause and an awkward, oppressive silence once their statement was finished. It was clear to all in the building what direction this debate had swung the decision in, and it wasn't what Francesco had intended at all.\n\nThe vote came just over a week later, and while generally agreeing on most of the proposed policy changes, the results made it clear that any attempts at aligning themselves with the other Unions would not be tolerated by the workers themselves, voting a crushing eighty-five percent to maintain their own policies at the expense of solidarity.\n\nThe skies might have been clear outside, but a shadow still seemed to loom over Francesco. What more could he have done? Why was he so stupid as to put it to a vote? The individual worker didn't know the big picture, and you can't explain something like that over the course of an hour. There was no time to dwell on the past though, he had to plan for what would come next.\n\nPlanning that Mario was already beginning. The debate stirred something in him. Why was there such a concerted effort to align CISL with the Socialists, exactly? What game was CGIL playing with CISL and its common men? He didn't know, and he didn't like such an overt attempt at manipulating them. Nothing would come of it right now, but ideas were already being whispered between the workers, ideas to show them the price of underestimating CISL..."
 hotautumn_med.25.a:0 "The fuse is lit."
 
 hotautumn_med.26.t:0 "CISL Rallies"
 hotautumn_med.26.d:0 ""Friends, I come to you with news that will not shock nor surprise you, but is grim nonetheless." Paolo Voltolini was no suit, no Union man, but he had acted as a voice above the rest after the Union Vote. For the past couple weeks, he had been speaking to union workers and advocates all over Milan, claiming that the Communists not only tried to infiltrate the CISL, but that they attempted to manipulate the vote. Mario Calabrò was no fan of communists, but he was no wackjob either.\n\nThe accusations were at first met with suspicion and skepticism. It sounded like a fascist conspiracy theory, but an idea repeated often enough and with enough conviction eventually takes on a life of its own. What if the Communists really did have the CISL suits in their pocket? What if they really were plotting to subsume the Union into their own for political gain?\n\n"I was like many of you at first. I didn't believe the rumors, the gossip, the mutterings about Communist influence and manipulations. Wrote it off! After all, I even had friends in the CGIL, why would they ever turn on me?" He was a gifted speaker, and with this dramatic pause, he had the gathering of workers practically standing on their toes, eagerly anticipating the rest of the speech.\n\n"But it was fortunate I'd have those friends! For one of them, conscience won out over ideology, and he told me of the plan that was being whispered between them. I still didn't believe him, until he took me to their headquarters and had me listen in on a conversation! It was true! Now that they've failed to open the door into CISL through the vote, they are making plans to infiltrate our ranks and spread their revolutionary ideology!" Mario could feel his own blood rising involuntarily, as much as he knew this man was speaking nonsense, he was still an effective speaker, and there was something about his message that he seemed to want to believe, but he couldn't put his finger on it.\n\n"Well, what about it then, men?" He held out his hands to either side. "Are we going to roll over and allow them to use us for their own ends?!" An open ended question, one that was answered with anger and frustration from among the crowd.\n\nBut then, something he didn't expect. They were red-faced in their rage, and they began to filter out of the room the speech was taking place in. A stunned Durante and Mario alike watched them storm out of the room and into the streets outside. The mob certainly wasn't about to allow any of that, and they were going to let the CGIL boys know that..."
 hotautumn_med.26.a:0 "Thubgs are getting out of control..."
 
 hotautumn_med.27.t:0 "A Brawl in the Streets"
 hotautumn_med.27.d:0 "Shouts and insults flew between the two crowds gathered outside of the CGIL headquarters. A small mob of CISL union workers had arrived mere moments before, hurling small projectiles towards the offices of the socialist union. When the CGIL workers walked out to meet them, they did not hold back.\n\n"Commies like you ought to learn not to stick your noses where they don't belong!" One voice said, his demands punctuated by a stone thrown to land at the feet of the opposition, doing nothing but eliciting a reply from the other side of the aisle.\n\n"Perhaps you should heed your own advice, suckling little pigs!" Came the reply from somewhere amidst the gathered Communist workers. The supporting shouts and follow-up jeers were interrupted when the CISL workers rushed the aisle to attack the CIGL workers head-on.\n\nWhere once insults and jeers were being exchanged, fists and feet took their place. The communists fell back at first, surprised at the sudden ferocity of their assailants. But with their numbers and their indignation, they rallied quickly, and met them with as much gusto as workers could muster.\n\nThe fight had only barely begun- and without any side gaining any seeming advantage in the short duration- when the flash of lights and wail of sirens interrupted the brawl. Like cats caught fighting in an alley, the workers scattered and rushed away from the arrival of the police officers, who rushed onto the scene with batons raised.\n\nA small skirmish, in truth, but all across the North of Italy, such suspicions and tensions flared up in isolated cases such as these. Workers stand as opposed to one another as they do to their supposed enemies as the Hot Autumn blazes on."
 hotautumn_med.27.a:0 "Solidarity is dead!"
 
 hotautumn_med.28.t:0 "A New Deal"
 hotautumn_med.28.d:0 "News has come out of the parliament in Rome, in the midst of the General Strike across the North of Italy. While members of Parliament skillfully avoided directly crediting the Strike itself as the primary catalyst for the passing of a recent bill, the Italian people were not fooled. This was a victory for the Workers, not a gift from a benevolent ruling class.\n\nThe breadth of the bill was expansive, covering most of the most pressing issues that the leaders of the striking Unions cited as their primary purposes for the strike. Poor wages and deteriorating infrastructure, inadequate social safety nets and even worse safety conditions, the list was long, and the proposed bill couldn't possibly cover it all. Now union leaders will need to decide if the government's response to the crisis is adequate.\n\nUntil then, the workers will remain on strike, and they, along with the protesting students and police, will remain active in the streets. In spite of the news, tensions are still high across the country, and few have much of any hope that any unenthusiastic legislation is going to put an end to the crisis any time soon."
 hotautumn_med.28.a:0 "A brief reprieve."
 
 hotautumn_med.29.t:0 "A Round of Phone Calls"
 hotautumn_med.29.d:0 "Work was as always, a nightmare. The phones rang, his supervisors yelled, and the day dragged on slowly. A mixture of arguments and conversations tore through the CSIL office like a knife through butter. Francesco Inceli eyed the list of names and numbers across his desk, and gave a sigh.\n\nThe union was large, and it was a target. Allegations of corruption were common as were the occasional threat from many groups. The left wanted more entreaties, the right wanted them to bash Bolshevists- and the phones never stopped ringing. It was in times like these that Francesco did his best to remain calm; for he had calls to make.\n\nSpecifically there were three things on his mind, though he had enough time to do them today .\n\nA call to Milan, where a roundtable would be offered and workers negotiated with.\n\nA call to Rome, where investigations were being made into the unions.\n\nAnd finally, a call to home. His son and he had several disagreements, but there was always the possibility that the two could reconcile. There was hope."
 hotautumn_med.29.a:0 "It's going to be a long day..."
 
 hotautumn_med.30.t:0 "Call Milan"
 hotautumn_med.30.d:0 ""I'm telling you, Francesco, they won't go for it." The voice on the other end of the line sounded exasperated, tired even. They'd been arguing in a circle for going on eight minutes, though it sure felt longer. But neither Francesco Inceli nor Timoteo Sartor could exactly just hang up the phones and do their job without coming to an agreement of some kind.\n\n"Then the strike's going to peter out if we can't organize this damn thing. The companies will come back in once one Union settles and leverage us back down into the pavement." Inceli's rebuttal was weak, he knew, but it was all he had, and he wasn't wrong either. His point just failed to address the opposing point. Inceli replied, leaning over his desk with a desperate expression that bled into his voice.\n\n"You overestimate how much trust they have in us.at the end of the day. Any agreement we come to with the Communists will be suspect. They'll think we've sold them out if we make any kind of accord in private rooms and phone calls." The grumbling came through on the other side, entirely right in his assertions too. "They don't trust us, Francesco."\n\nFrancesco fell silent for a long time, allowing the quiet to dominate the line for nearly an entire minute. Sartor was about to speak up when Inceli suddenly broke the silence. "What if it wasn't up to us?"\n\n"You mean we lie to them and say that we were approached first? Or..."\n\n"No, I mean, make it a broad union vote, rather than an internal decision. There's a few issues the Union's voting on in a few weeks, why not make opening up lines of discussion with the other Unions one of those issues?"\n\n"And what happens if they don't vote for it? "\n\n"We can try to convince them. They're good men, by and large, and should listen to reason when reason presents itself. Maybe we have a rally beforehand, or a debate, perhaps? Let them make up their own mind, and pray to God that they make the right decision.""
 hotautumn_med.30.a:0 "Let's hope this works..."
 
 hotautumn_med.31.t:0 "Call Rome"
 hotautumn_med.31.d:0 "Even when they happened through a cable, discussions with the leadership of CISL followed a sort of liturgical ritual. After a bored telephone operator redirected his call, Francesco waited patiently and devoutly for a voice to answer him. As the responder demanded to know who the caller was, Francesco answered - and then he had to wait again to be redirected to the proper office, with a buzzing hum ringing inside the phone. Finally, a booming voice, with a very distinguishable Roman accent, rang out - "Ah, I've been expecting your call!"\n\nAfter the ritual small talk about the foggy weather of Milano and the sweltering heat of Rome, as well as an exchange of completely irrelevant news about the respective families, Francesco heard the question he was expecting - "So, what can you tell me about the situation at Bicocca?". What could be told about an entire district in open revolt, where brutal riots are becoming the norm and blood dirties the sidewalks? For once, Francesco decided to be extraordinarily blunt. "Well, the situation might be somewhat inconvenient right now, but I'm sure everything will soon be under control."\n\n"That's what I wanted to hear!" said the bellowing voice of his superior. "See, I was right when I noticed you. From now on, you can consider yourself in charge of the CISL section for all of Pirelli - and if any of those other boring Milanese pansies try to stop you, just tell me and we'll shut them up!" Francesco swallowed, the noise he made covered by the laughter on the other end of the line. "Now I have to go, I'm terribly busy these days - apparently a bunch of goddamn communist students set fire to a factory shed in Roma Nord and they're trying to pin it on us! Can you believe it?! Anyway, good luck in Milano - and remember, don't disappoint me! Buonasera, ciao, ciao, cia-". A click was followed by silence - and the liturgy ended."
 hotautumn_med.31.a:0 "Well, this is quite the situation."
 
 hotautumn_med.32.t:0 "The Rotten Union"
 hotautumn_med.32.d:0 "Originally founded in 1918, the Italian Confederation of Labour was the first major Catholic inspired trade union in the country - and was quickly shut down by the fascist regime. During the Italian transition to democracy, it was reorganized as the Italian Confederation of Workers' Unions, or CISL for short, and quickly rose to prominence as one of the major unions in the country. Unlike the other major unions, suspected of being dens of socialists or, God forbid, communists, CISL has always been the union for the upstanding, respectable Italian worker and foreman - a man such as Francesco Inceli.\n\nCISL has always been openly and unapologetically closely affiliated with DC, and some of its critics say that the habits of the party were quickly reflected by the union - some of its other critics say that this is in fact because CISL is nothing more than a DC sock puppet. Many workers, even those who shared the views of the union, felt that CISL was not acting in their interests, but in those of the party. Combined with the somewhat embarrassing instances of corruption going on in the union, this severely harmed the legitimacy of CISL in the eyes of those people it was meant to represent. Despite this, CISL was still one of the biggest unions in Italy, and was often able to dictate its line to other, smaller unions such as UIL.\n\nThese and more facts roamed around Francesco's head as he sat at his office desk once again, staring at his phone, while the white bakelite box stared him back. Corruption was an issue that could be too hard to tackle, and doing it in this delicate situation could be counterproductive - but it would go at great lengths to rehabilitate CISL's image in the eyes of workers, and possible ease tensions as workers will be more willing to let CISL negotiate a solution to the crisis. Another, much safer, option would be to instead use CISL's political weight to convince a smaller union, such as UIL, to work in tandem with CISL and safeguard the latter's position as the main anti-socialist trade union. Two phone numbers, hastily written on a note, sit on Francesco's desk, waiting for a decision."
 hotautumn_med.32.a:0 "Demand an anti-corruption audit."
 hotautumn_med.32.b:0 "Schedule a meeting with UIL representatives."
 
 hotautumn_med.33.t:0 "A Reform of CISL"
 hotautumn_med.33.d:0 "Predictably, the audit was met with much dissatisfaction and protests. Unpredictably, the results were even more amusing than one could possibly imagine - sordid stories of mysterious promotions, unions funds mysteriously disappearing the week before a prominent director went on his ski vacation in Val D'Aosta, favouritism, nepotism, cronyism, and much, much more. Demotions and expulsions became the norm, and quite a few prominent names in the local section of CISL received a visit from the Guardia di Finanza. And amidst all this, Francesco Inceli sat content in his office, taking the chance to fill the spots left vacant with men he trusted.\n\nA ring filled the hot, humid air of the office. Francesco picked up the phone, greeted by the voice of one of his colleagues. "What the fuck do you think you're doing?!" The man on the other side of the cable was talking faster, and breathing ever faster. "There's goddamn Fiamme Gialle in my office! They're taking my papers! This all started because of you! You're just trying to get us all in trouble so you can fill our positions with your friends, don't you?! This is not the last you hear from me! I'll see you in-" Francesco sat with the receiver in his hand, just after the line on the other side was cut."
 hotautumn_med.33.a:0 "The great white union shall return to its former glory."
 
 hotautumn_med.34.t:0 "The Moderate Front"
 hotautumn_med.34.d:0 "Newspapers around Italy were somewhat busy-looking - the front page occupied by catastrophic pictures of riots, burning cars, protestors getting arrested, and big name politicians releasing official statements. Tucked in a little corner of the Corriere della Sera was, however, a small but somewhat interesting announcement - a joint statement released by UIL and CISL announcing their official intention to collaborate for the entire duration of the crisis.\n\nFrancesco had a busy day at work that day - shaking hands, making promises, having meetings. Representatives from DC and even some members of FD spoke in front of an audience of CISL and UIL bureaucrats, reassuring the people that a peaceful resolution to the current crisis would be found through dialogue and mutual understanding between labour, businesses, and government. A victory against radicalism, for sure - and as the glasses of the politicians touch each other in celebratory toasts, the riots in the streets of Italy show no sign of subsiding."
 hotautumn_med.34.a:0 "Just a temporary disturbance."
 
 hotautumn_med.35.t:0 "A Controlled Opposition"
 hotautumn_med.35.d:0 "Francesco Inceli always hated how long the UIL secretaries would let the phones ring for. He always had an uncannily clear image in his head of the desk jockeys just sitting and staring at the phone as it rang, it was an open secret that the UIL liked to employ such little bits of pettiness when dealing with other unions.\n\nEven still, he got through eventually. "Francesco Inceli, I'm with CISL. I'm calling to speak with Representative Diolo?"\n\nAnother waiting period just long enough to be irritating, but not long enough to actually be inconvenient, and then the line was picked up, answered by a voice hoarse and whispery. "Nestore Diolo, UIL." Representative Diolo sounded older than he was, but he was still an old man by union standards.\n\n"Nestore. It's Francesco. Again."\n\nThe silence on the other end of the line was deafening, but eventually, Nestore did respond. "Mister Inceli. How can I help you?" He spoke in an even, cool tone, one tinged with suspicion- well-earned suspicion, admittedly.\n\nGod above, Francesco hated doing this. He'd have to veil his disgust for the time being though. "I have, erm, found myself in charge of the local offices for this branch of the Union, Nestore, and it's come to my attention that your own Union's branch here is having some... Funding problems, is that correct?"\n\nHe was met with a silence more telling than any audible confirmation could be. Idly scratching down a note, he nodded to himself before clearing his throat and continuing. "If, maybe, you and your union would be willing to do something for us, we could help with that."\n\nAnother long silence. Francesco could practically hear the walls of ethics built up around the old Union Man crumbling in that silence before he rasped out his reply. "Very well then Mister Inceli. Let's hear it...""
 hotautumn_med.35.a:0 "Someone has to do it..."
 
 hotautumn_med.36.t:0 "Divide and Conquer"
 hotautumn_med.36.d:0 "Workers' Solidarity only goes so far these days, it would seem. Francesco Inceli was enjoying his morning mug of coffee while looking over Le Conquiste del Lavoro, and the news within was somehow the more bitter of the two. It was good news, if you stood far enough back, but it did not sit well with the Representative regardless.\n\nThe story was about the Communists in the CGIL accusing the UIL of corruption with regards to recent negotiations with Fiat, where they adopted an uncharacteristically conciliatory stance towards the company. Of course, UIL was corrupt, but not in the way that the Communists were accusing them of. If you listened to CGIL, you'd believe that the UIL was taking bribes from either Rome or Fiat, to moderate their position, but in reality, it was CISL they were being influenced by.\n\nIt took a few more private conversations, and of course, promises of financial and political support should UIL adjust a few troublesome policies in order to be more in line with that of CISL's. They had overestimated how much the results of the deal would satiate the workers, the bribe money had gone to good causes, most of it anyways. The UIL was able to keep its various worker programs and its newsletter funded as of late, but that seemed to matter little and less for their own workers, who saw the recent compromises as a stain upon the Union's name, and suddenly, their support of the union was wavering.\n\nThere was a joke somewhere in the workers revolting against the Union, but while that wasn't the intended effect, CISL would benefit. UIL would never admit to bowing to another union, that may not be enough to kill one of Italy's largest unions, but it would absolutely test its limits. So in effect, while the other two largest unions in Italy bickered, CISL could stay, aloof and seemingly focused on what the union was founded to do in the first place.\n\nAll he needed to do was strongarm innocent and hardworking men into taking the fall for his politicking. Maybe another cup of coffee would distract Francesco from that fact..."
 hotautumn_med.36.a:0 "Two sugars, no cream."
 
 hotautumn_med.37.t:0 "The Social Doctrine"
 hotautumn_med.37.d:0 "Francesco Inceli adjusted the tie around his neck and straightened his back. This may very well be the most important speech he makes in his life, and he wanted to impress. While the crowd may not be the teeming masses of CISL's workers, they were many of the local and regional leaders of CISL, among the brass of the union, no men were closer to the pulse of the average worker- and there was no one in the union they trusted more to be honest.\n\nHe stepped out and stood behind the podium and put on a solemn, serious expression. "Friends, let me firstly thank you all for taking the time to meet with me today. I know many of you had to drive a long way, your labors have not been overlooked." The appreciation did not seem to elicit much of a reaction, but it was there more for sincerity's sake anyways.\n\nHe continued. "I understand- we, understand- that the union, is not perfect. It cannot be perfect, for despite all our lofty rhetoric, we are only human at the end of the day. I know, it must be shocking for you to hear a man in a suit admit that out loud." That at least gathered a few isolated chuckles. He was winning them over, but slower than he'd hoped.\n\n"But... We didn't sign up for perfection, now did we? Perfection is something that only exists in fantasy and dreams. This is why perfection is the domain of the revolutionary, and not the reformer. We know you have heard the recent news, and we want to reaffirm, with all of you, our continued commitment to constant ceaseless improvement. Not just in the workplaces and in conditions for the workers, but also in our own conduct, our own management, and our own effectiveness as a Union."\n\nThere were no smiles, no cheers, no enthusiastic applause, but they were nodding, nodding! There was still plenty of speech to go, but he was already through what he expected to be the roughest patch. Francesco could feel his own confidence solidifying as he glanced back down to his notes."
 hotautumn_med.37.a:0 "And futhermore..."
 
 hotautumn_med.38.t:0 "A Crisis Averted"
 hotautumn_med.38.d:0 "What had started as a grand demonstration, a massive, simultaneous outpouring of frustration and solidarity was finally starting to show its first signs of weakening. The General Strike had not much in the way of leadership, save for the general stirrings and provocations of the more extreme Unions.\n\nTimes have changed since then, and while CISL's hesitancy to join in the General Strike and show solidarity may have once been a weakness, it was now serving the union as a strength. Things have only gotten worse for CGIL and UIL in the weeks following the start of the Strike, and they certainly didn't seem to be improving, or even in much of a position to effectively negotiate.\n\nCISL on the other hand? Business as usual, really, and not only that, but they were able to take advantage of the chaos and grow as a union, continuing to entrench themselves as the dominant Union in Northern Italy as the Strike wears on, grabbing more and more of the Government in Rome's attention as they did so. If there was going to be anyone who could bring this strike to an end in favor of the working man, why not CISL?\n\nThe General Strike was far from over, but slowly but surely, many opinions began to turn. With CISL hard at work, some of the worse-off workers could even return to their jobs without worrying too hard about compromising the strikers' negotiating position."
 hotautumn_med.38.a:0 "We dodged a bullet, it would seem."
 
 hotautumn_med.39.t:0 "Call Home"
 hotautumn_med.39.d:0 "Maybe just... He'd call the campus one more time. Francesco Inceli had already called it twice in the span of the last hour, but he had gotten no answer both times. He'd heard the news of the barricade at the Statale and how the situation had grown more volatile since it began, but he- as much as he was ashamed to admit it- was too distracted with the General Strike to check on his son Virgilio, a student at that very university.\n\nAnd more distressingly? A member of the gang that had occupied the campus and was running that barricade. He needed answers, and could feel his own desperation mounting as he dialed the college's number once more, and sat in tense anticipation as the phone rang... And rang...\n\nAnd was actually picked up this time. He practically gasped as the voice of a young woman came on the other side. "This is Gia, with the Statale, who is this calling?"\n\n"Francesco, uh Francesco Inceli. I'm calling after a student, Virgilio Inceli?"\n\nSilence for a moment, save for the distant muttering of "Gia" with others that she was apparently standing with. After a moment of this, her voice returned to the line. "You're in luck, Mister Inceli. Virgilio was seen leaving the campus, he was going to the train stations, it looked like. No one knows where he-"\n\nThe phone hit the cradle at what must have been record speed, and within moments, Francesco Inceli was in a dead sprint, jacket, hat, and briefcase held close against his chest with the same arm. Out of the union offices, he ran to his car.\n\nThis might be the last time he gets to see his son, and he would make it count."
 hotautumn_med.39.a:0 "In spite of everything, a shred of hope remains."
 
 hotautumn_med.40.t:0 "Breaking the Silence"
 hotautumn_med.40.d:0 "A key turned in the lock. The door opened. Feet stepped over a balcony they hadn't crossed in years, and father and son stood face to face.\n\nThey were a strange pair. One of them dressed in the suit and tie of any respectable professional union operative, complete with graying hair and tired eyes. The other sporting a leather jacket, a shaved head, and a fasces pin.\n\nFor a moment there was silence. Father was the first to break it.\n\n"Are you alright? I heard what happened at the Stalale."\n\nOf course. He had seen what had happened on the TV and wanted to make sure if his precious little boy was okay.\n\n"I'm fine."\n\nThe silence returned, colder and emptier than before. This time, Virgilio spoke.\n\n"I came to see if you had changed your mind."\n\n"About you joining that group of Nazi performance artists? Of course I haven't."\n\nThe words came out faster and harsher than Father first had intended. When he spoke again, there was a quiver in his voice.\n\n"But you're still my son."\n\nThe silence was deeper than ever, an abyss between father and son like a thousand boxes of emptiness in a forgotten warehouse.\n\nThen Virgilio spoke once more."
 hotautumn_med.40.a:0 "Perhaps... perhaps I was wrong."
 hotautumn_med.40.b:0 "I am not wrong, he is!"
 
 hotautumn_med.41.t:0 "Shattered Idealism"
 hotautumn_med.41.d:0 ""And if only I had a father." Virgilio spat back in a whisper like the crack of a whip. His father physically drew back, as if physically struck by the venom in his own son's eyes and words.\n\n"Virgilio I-" The father quickly leaned back in, hands open in a pleading, welcoming gesture, a gesture that his son had no intention of reciprocating nor accepting.\n\n"The nation stands atop a knife's edge!" He declared, raising a hand towards the doorway, his gaze growing harder as he spoke. "On one side, is socialist suffering and death! On the other is a national restoration for us and generations to come! If only I had a father who fought to push the nation towards restoration with me!"\n\nHis father tried to speak up, he reached out to put a reassuring hand on Virgilio's shoulder, but the youth slapped it away, stepping forward in turn with an accusing finger to poke into his father's chest. "It's not too late." He whispered, a voice trembling with emotion. Rage? Sorrow? Who was to tell? "Come with me, to the barricades. We'll destroy the socialist threat, we'll save Italy, father."\n\nAnother chasm of quiet emerged between the two, even as they stood close together, eyes locked, neither of the two willing to blink first. It would only be an exhalation from Virgilio's father that broke the stilled air.\n\n"No matter what." He whispered, stepping back, eyes cast meekly to his feet. "No matter what Virgilio, you are still my son." And then he turned on his feet, from the balcony, back and into the home.\n\nThere would be no time for tears. No time to rage or shout. With trembling fists and burning eyes, Virgilio turned from home and began the trek back to the barricade. This was good, he decided. After all, in the fight against evil, there is no greater weapon than anger. Unfettered, righteous rage burned in like a fire in his belly, and he'd be all the greater a warrior for it, and all Italy would bear witness, he knew."
 hotautumn_med.41.a:0 "Forward, only forward."
 
 hotautumn_med.42.t:0 "The Leftists React"
 hotautumn_med.42.d:0 "One of the most curious phenomena about humanity is how, in large enough quantities, a group of people are indistinguishable from a herd of animals. Driven by instinct and reaction rather than by the rationality and emotion they display on an individual-by-individual case, they are easy to panic, to send into flight, or to fight as if their life depended on it.\n\nMore curious still, is how when that mass of humanity grows even larger, they begin to resemble more a force of nature. A herd of animals might act erratically, but it's always a response, you can always tell that there's something pushing them in one direction or another, at the end of the day. But when the situation gets as crowded and the tensions rise as high as they did at the barricade tonight, cause and effect leave the realm of the material and become something arcane, ought not be understood because it cannot.\n\nAnd like the force of nature it was, the protests and the barricade broke the tension. Did someone throw something? Did the shouts and insults finally strike a nerve? Did someone move too erratically, too suddenly, and unleash the cascade of violence? Was it the fault of the left, or that of the right?\n\nDoes it matter?\n\nIt was all consuming, the suddenness and completeness of the outbreak. All at once, the masses of protesting students rushed forward, with little else but fist, branch and stone to wield against their foe in the barricade. Chants and shouts erupted as the sides clashed together in a violent cacophony. And Virgilio, for one split second, saw the entire scene with a crystalline, almost otherworldly clarity - before everything turned into a blur."
 hotautumn_med.42.a:0 "There's blood on the parapets."
 
 hotautumn_med.43.t:0 "The Police React"
 hotautumn_med.43.d:0 "It would have been poetic if the skies were cloudy the day of the Statale clashes. But alas, there were no threatening storm clouds. The day was warm and pleasant and the sky was blue, accented by birds circling and hunting.\n\nHad any of these intrepid avians cared to look down upon the chaos unfolding, they would have seen three colors: red, grey, and black.\n\nRed, naturally were the Leftists. Rabble rousers, radicals, and decent men all together, no doubt hoping to permanently destroy Italian greatness, or perhaps reform it to something fair and just.\n\nThe right-wing youth would have imagined themselves as the "blacks", but they were too disorganized, too idealistic and (for the moment) not quite committed to their professed ideals of violence and autocracy to merit that label. So they were the greys.\n\nThe blacks were the police. Forced to spend weeks in full riot gear carrying heavy batons and guns, their nerves were at the breaking point. The officers, brave, exhausted, extraordinarily corrupt protectors of the innocent Italian public, wanted the disorder to end at any cost.\n\nWhen the leftists charged, it was for them a heroic and radical action to defend the Italian workers. For the FUAN, it was the inevitable clash of ideologies necessary for a strong national future.\n\nFor the police, it was an excuse.\n\nAs if they were a single great beast from the stories, the black armored line roared and surged forwards.\n\nThen there were no more colors, no more sides. The crowd was one sea of violence and hatred, when the only impulse was to attack, and the only hope to escape.\n\nBatons rose and fell, stones were thrown, shots rang from one corner or another, and all was chaos."
 hotautumn_med.43.a:0 "The center could not hold."
 
 hotautumn_med.44.t:0 "Youth Forlorn"
 hotautumn_med.44.d:0 "Like a fire, the violence of the night burned hot and bright. But the harder the fire burns, the faster it runs its course. The moon had not even climbed into the sky by the time this particular fire had burnt itself out.\n\nLike ashes, the survivors scattered to the winds. To the stations and their homes the police officers went on exhausted feet and with weary eyes. To their homes went both besieger and besieged, leftist and rightist, covering their bloodied and battered faces, blackened eyes, broken noses and shattered smiles.\n\nBut the dead remained, all of them splintered and broken in their own horrifyingly unique way. Among the broken and trampled lay Virgilio Inceli, with eyes wide in shock and a neck snapped back in an unnatural manner, half-buried beneath the debris of the palisade.\n\nIn short, it was no way for Francesco to find his son. but it was still about what he had expected. Walking over to his son's corpse, he removed the detritus and wreckage from atop his smashed form and freed his body from the rubble. Sitting down, he placed his son's head on his lap and sighed, closing his own eyes even while his own hand closed the eyelids over Virgilio's.\n\nHe looked like he was sleeping when his eyes were closed. That made it a little more bearable at least. With a trembling hand, he reached over and took Virgilio's own blood-soaked hand in his own, trying to ignore the slight feelings of splintering bone and battered flesh as he held his son's hand for one last time.\n\nAnd there he sat, tears falling like the rain from eyes squeezed shut, interrupted only by an occasional gasping sob, extinguished the last embers of the fire that once raged in this place.\n\nWhen the police and the doctors came to take his broken boy away, he whispered quietly in his son's ear, the last thing he had said to him before he'd stormed off for the last time. "No matter what, Virgilio. No matter what."\n\n"You are still my son.""
 hotautumn_med.44.a:0 "In their hundreds of hundreds, these dramas play out all over Italy, and these tragedies burn in the heat of the Hot Autumn."
 
 hotautumn_med.45.t:0 "Against the Coming of the Night"
 hotautumn_med.45.d:0 "Virgilio's lower lip trembled as the words hung in the air. He spoke softly, almost as if recoiling from their own message. "I... Don't know if I deserve it." He admitted, quietly, with a choked voice and downcast eyes.\n\nNeither party was quite sure when they had transitioned into an embrace, or who stepped into the other first, but with a face buried in his father's shoulder, Virgilio let out a scream, muffled by the suit and shoulder. It was a scream of years lost, a scream that expelled and breathed out his hatred he held deep inside, a scream that banished the rage and violence that he had allowed to permeate to his core.\n\nHis father hugged him all the tighter in response, and after a few seconds that lasted an eternity, he slowly led Virgilio into his home- their home. After leaving the pale-faced, tear-eyed youth on a chair, his father prepared a kettle of tea for the two of them, and they continued to speak.\n\n"I don't know where to continue from here." Virgilio admitted, staring at the steam rising from his cup. "I feel as though I unleashed a monster, and now all I can do is watch as it destroys that which I tried to save."\n\nHis father sat and nodded as his son spoke. "As always, your trail is your own to blaze. But if you want my advice..." He began breathing in deep as he set aside an empty cup. "Follow some of your own."\n\n"I... Don't underst-"\n\n"Back before you left." He interrupted, leaning over the table emphatically. "Back before you well and truly lost your way, we'd often argue, and you often told me that when evil rose, it was the duty of good men to stand against it, that anything else only abetted such evils, yes?" He leaned back. "If you unleashed this beast of hatred, of rage and violence, then if you are to start being a good man, it is up to you to stand against it."\n\n"I don't think I can, the barricade is still up and there are many more of them than there are of me." Virgilio rubbed an arm uncertainly as he spoke, in spite of the heat.\n\n"Words, Virgilio, are action." His father declared emphatically. "Violence does not cure violence, so perhaps it's time for you to give the strength of words instead of fists."\n\nVirgilio mulled that over in his head a few times after hearing that, and his brows knit in determination as the vision grew clearer. He knew what he had to do."
 hotautumn_med.45.a:0 "Repentance and Redemption"
 
 hotautumn_med.46.t:0 "A Whimpering Flame"
 hotautumn_med.46.d:0 "For the first time in recent memory, Virgilio saw the world with clear eyes. And when he saw the world around the barricade, he saw madness. Slogans and chants were being thrown across between the Socialist protesters and the fascist barricade, threats of violence and denunciations filled the air, and what once sounded sweet to the ear had a harshness to it that he couldn't detect before.\n\nA deep breath in through the nose and out through the mouth, Virgilio steeled himself as he snuck his way around the protesters to return to the barricade, where he was greeted with shouts of approval and ecstatic greetings from his comrades.\n\n"Virgilio! What took you so long? We had thought you might have fled! Glad to see we are wrong!"\n\n"The reds are growing agitated out there, have you heard anything that can help us?"\n\n"What is the nation saying about this? Are they rallying behind our example?"\n\nVirgilio tugged at his shirt collar for a moment, and spoke slowly and with a measured tempo. "The nation remains as divided as ever." He admitted, glancing at the faces of his compatriots. It was clearly not what they wanted to hear, they wanted to hear of a fascist nation, reinvigorated by their actions here. He'd have to lay it on thick. "Some think what we are doing here is admirable, while others scold us for our defiance and belligerence."\n\n"But surely, we are doing good work here, right Virgilio? The ones who stand with us aren't sitting idle, right?"\n\nVirgilio's silence struck them more severely than any words could. Where once fiery, impassioned eyes once glared hatefully at the enemy across the way, now they glanced uncertainly between one another. They were looking for that fire, that fury that up to a few moments ago, they all shared.\n\nThere was none to be found."
 hotautumn_med.46.a:0 "The fire dies."
 
 hotautumn_med.47.t:0 "The Changing Tides"
 hotautumn_med.47.d:0 "The world seemed to spin around the gathered students. Where once they could navigate the chaos and confusion of the times with the help of their firm faith in the Fascist ideals of yore, the foundation on which their strength was built was all at once rocked.\n\nThe uncertainty, the fear, the panic immediately set in. They looked to Virgilio for guidance, and he spoke with a resigned voice. "There's nothing for us here. When the sun sets, we can slip away, we can pretend like-"\n\n"Pretend like nothing happened, Virgilio? When did you turn so craven?" A voice piped up from behind him. He didn't recognize the man, but evidently the man recognized him.\n\n"I... Yes. I think it's pretty clear that-"\n\nThe man interrupted him, stepping between Virgilio and the other students. "Pretty clear that your belly is weak and your spirit quails in the wake of challenge. You want to know why no one has rallied? Because all we've done is hide behind wood and stone!"\n\nOnce again, Virgilio could feel his blood rise and the bile build up in his throat. But this wasn't like before, it was different on some level he couldn't quite identify. "And what would you propose instead?"\n\nThe provocateur shot a fist up into the air. "We take the fight to the Communists! We rush the reds, prove our valor, and drive them off before us! Then all Italy will see that she still has strength!"\n\nIt was strange. He'd said much the same before and often, had he sounded so deluded before? How many people must have written him off as a madman? How many people might have been right to do so?\n\nVirgilio glanced over towards the rest of the students and sighed. "This was a mistake. All of this. Those of you with something to live for, come with me." He turned and began to walk, and could hear the meek shuffling of feet, about half of those gathered, he reckoned.\n\n"And those of us with something to fight for will stay! Go home you old women, to your knitting and rocking chairs! Us men will fight for you even still." The remaining half turned and went back to the palisade."
 hotautumn_med.47.a:0 "When a hand is offered to save a falling man, some would rather save their pride than their body."
 
 hotautumn_med.48.t:0 "A Shameful Retreat"
 hotautumn_med.48.d:0 "When it came time to fight, the new Blackshirts of Italy fought with conviction, with courage and the Spirit of Old Rome in their hearts and their minds. A fire burned in their bellies, they craved the fight, they wanted the fight...\n\nEven still, they lost the fight. It wasn't even particularly close either, against the socialists' overwhelming numbers and the police with their riot gear and their batons, spirit proved to be of little use as a weapon or as armor.\n\nIt was them, the true Sons of Italy, the salvation of the nation and those who carried the spirit of Mussolini with them, who sulked away from the battle. For now, they had no choice but to hide their shame and the humiliation of their failure here.\n\nBut that was only for the time being. The fascists would hide their face, they'd slink off, but they'd go home. They'd reflect on their defeat here, and if their spirits didn't quail, it would be a source of rage, of fury, fuel for the fire in the belly.\n\nThey'd take that with them to their dorms, to their homes, their villages and their communities. It would burn inside of them, and it would serve as a hundred beacons for those with a similar spirit, a familiar rage as the bloodied Fascists.\n\nLet the reds celebrate for now, they can have their repetitive songs and girlish dances. While they're patting themselves on the back, the Blackshirts will nurse their wounds and prepare for the next round. They will learn from their mistakes and be more prepared for whenever the next confrontation occurs, in whatever form it does.\n\nAt least, that's the hope anyways."
 hotautumn_med.48.a:0 "The battle lost, but the war is only beginning."
 
 hotautumn_med.49.t:0 "A Day at the University"
 hotautumn_med.49.d:0 "Virgilio Inceli awoke, looked out the window of his dorm, groaned, and felt angry.\n\nIt was unseasonably warm for this late in the year, and the poorly ventilated dorm was baking. Of course it wouldn't matter if there was any money in the school budget for some half decent air conditioning, but there wasn't. The school probably had wasted all the money on keeping the union workers happy, and the economy had been in the trash since the democratic transition anyway.\n\nHe got dressed, and walked to his first class, History of Italian Politics. The professor was a degenerate, a coward, probably a secret communist, and worst of all, a woman. Inceli thought about her, and he felt hateful.\n\nOn his way, a group of radical students was holding a demonstration in the main university thoroughfare. Their proud red banners caught the sunlight as they strutted back and forth, and they had a partisan sort of bravery about them as they chanted slogans. If Virgilio had been with his friends, brave companions of the Fronte Universitario d'Azione Nazionale, they would have chased the leftists back to their hidey holes. But they were busy, and he was alone, so he slunk away and proceeded.\n\nIt wasn't that Virgilio Inceli was reluctant to join in the struggle for national redemption-- it's just that he was indecisive. Many of his fellows were meeting with the national organization, trying to persuade the Blocchi Nazionali to find its balls. They had asked him to come, and he had demurred. They had had high hopes for Almirante. He had been a rising star in the PNF before its dissoltion but now he seemed nothing more than a tired old man... Others were at the new front, fighting the new battle with sticks and rocks against the communists and their police collaborators.\n\nAs Virgilio Inceli joined the class, his thoughts were still on the strikes, the meeting, and the future of the nation. But they strayed from this as well, and moved on to other things. Feelings he had half forgotten. A home, a father who didn't understand. Having comrades, but not friends. And as the class came to its end, and Virgilio Inceli stood at the building's threshold, struggling to make a decision, he felt lonely."
 hotautumn_med.49.a:0 "So much to do, so little time."
 
 hotautumn_med.50.t:0 "An Early Night"
 hotautumn_med.50.d:0 "Home for Inceli was a quiet middle class district on Milan's outskirts. It wasn't a long trip, but he took his time nonetheless.\n\nVirgilio had been surprised at how easily his compatriots in FUAN had accepted his departure. He had expected that they would plead for him to stay -- to accompany the leadership to Rome and the BN meeting, or to the barricades to strike down the Bolshevik protestors. But they had accepted his flimsy excuses with a smile and a wave. Perhaps they had never put as much faith in his leadership as he thought.\n\nHe'd show them. He'd show everyone. His father would be the first -- he'd see the error of his ways, and by tomorrow he'd be with them at the barricades. DC, CISL, all the spineless traitors, would be neutered, and Inceli would get the credit for destroying one of the three loathsome oppressors of the Italian people.\n\nVirgilio thought back to their last conversation when he told his father he'd joined the FUAN. He'd expected him to be proud, hadn't he always said that Socialism would be the first thing to destroy Italy? Hadn't he, like any good citizen, had a poster of Il Duce on their dining room wall? But FatherFirst Inceli had changed. He had been infected by the same weakness that permeated the rest of the nation.\n\nSo father and son had parted in rage and tears, one to join the most effeminate and corrupt of unions, the other to join the bold youth restoring the nation to greatness. It didn't matter. Inceli would show him. This time, with the streets filled with fire and radicals, he'd have no choice but to see the light.\n\nThe train pulled into the station, and Virgilio Inceli stepped off shivering slightly, undoubtedly from the excitement of teaching his father the truth of the National Revolution. Or perhaps the cold."
 hotautumn_med.50.a:0 "No place like home."
 
 hotautumn_med.51.t:0 "A Long Afternoon"
 hotautumn_med.51.d:0 "It was a long bus ride to Rome, and a longer wait as the BN's security checked and double-checked Virgilio Inceli's clearance.\n\nWhen at last he was reunited with his comrades in the FUAN, it was a while after noon and Virgilio Inceli was thoroughly agitated. This was, it must be noted, not entirely to his detriment, as the FUAN was the sort of organization where furious agitation paid silver. Gold, if it was particularly insipid furious agitation, rooted in the general angst of everyday life and directed at the "enemies", whoever that might be at any particular time.\n\nFUAN, or at least the significant portion of its central committee present that the meeting, was a place of speeches, a place of rage and rabble rousing, a place of daring political maneuvers against the vile enemies of the Italian nation. These usually ranged from the traitors and cowards in Rome, vilified from a safe distance in the organization's weekly newsletter, to the on-campus radicals and leftists, enemies of all decent people and positively destroyed and eviscerated regularly by the scathing cartoons drawn by second-year Mario Salvini, often accompanied by Inceli's scathing editorials.\n\nBut the FUAN was more than just a group of noisy kids. They were the forefront of the national revolution. They were the Italian future. Their actions were more than just pranks and name-calling, they were bold moves to defend the people.\n\nAnd they were more than just pranks and name-calling. More often than not, when a strike escalated into violence, it was FUAN on the front lines. When heads needed to be kicked in, FUAN was the steel toed boot that did the job. There were whispers that some of their radical members had bought arms illegally, and were willing to use them. The actions of these few daredevils were spoken of in hushed tones, but awed ones nonetheless."
 hotautumn_med.51.a:0 "Virgilio Inceli? The central committee will see you now."
 
 hotautumn_med.52.t:0 "Representatives from the Party"
 hotautumn_med.52.d:0 "In the city of Rome, birthplace of European civilization, there was a building. The building was owned by the Blocchi Nazionali, a party that stood for the defense of Italian civilization, nationalism and democracy hand in hand, and definitely not Fascism.\n\nIt was not a grand building. On the outside it wasn't nearly as impressive as the concrete behemoth that served as the party's headquarters near the cities center. This building was made out of cracked brick, and graffitied heavily by all varieties of dissident ne'er do-wells. The inside similarly lacked the many creature comforts of the BN headquarters, being notably devoid of the in-house bars and smoke rooms that the BN's main locus' spartan exterior hid so well.\n\nStill, it was a building that the party put to good use. There were leaflets not yet ready for release that needed storage, certain items devoted party loyalists which were...inappropriate to store in a public place, and meetings that might be best kept out of the view of the commons. It was for this purpose that the building was used one warm fall day, as representatives from the BN's central committee met with the "grand council" of the Front of National Action of University Students.\n\nThe room was uncomfortably warm, and with great reluctance the students removed their black jackets. A few of them had sewn in small Fasces or depictions of Mussolini onto the breast pockets, and they grew glum as they discarded the wonderful attempt to challenge the BN's transition to non-fascism.\n\nThe BN representatives were, for the most part, exactly as Virgilio Inceli had expected. A bunch of old men in suits who harrumphed at the most mild suggestions of direct action, and wrung their hands in response to the FUAN's zeal.\n\nThe meeting also went about as well as he had thought it would. The FUAN proposed a direct series of counter-demonstrations against the counter demonstrations, and the BN looked shiftily from side to side. The FUAN demanded permission to openly use the words "communist", "bolshevik", "traitorous", and "bourgeois" in referring to their mutual enemies. The BN fiddled with their ties. The FUAN wanted the BN to formally support their right to use violence in self defence, the BN declared that it was time for a lunch break.\n\nWhen they returned, Inceli decided he had enough of this. It was time to bring matters to a head, and find out where the party's true loyalties lay. He cleared his throat and began to speak."
 hotautumn_med.52.a:0 "You are either with us, and our quest for the National Revolution, or against us!"
 hotautumn_med.52.b:0 "You are either with us, in our fight against Bolshevism, or against us!"
 
 hotautumn_med.53.t:0 "They're Not on Our Side"
 hotautumn_med.53.d:0 ""You are either with us, and our quest for the National Revolution, or against us"\n\nThe words had seemed powerful and daring in Inceli's head, but out loud they seemed only pithy. Even his compatriots on the FUAN side of the table seemed embarrassed. As the silence following Virgilio's pronouncement grew, they glanced at his hands, his feet, anywhere but his eyes, wide and scared, or the red pouring into his face.\n\nThen the uncomfortable silence was broken by applause.\n\nFrom the far end of the BN's side of the table there was one man, who while equal to the others in age and demeanor, differed from them radically in appearance. He wore a tight black turtleneck, somehow more imposing then the student's black leather. On his lapel, he wore not just the fasces but also the knife and skull. it was he who applauded, his hands meeting in sarcastic enthusiasm, the cruel lines of his face wrinkled in enthusiasm. When he spoke, the other BN reacted with curious mixtures of exasperation.\n\n"Absolutely! These youngsters might need some guidance, but they've got the right idea! The nation has gone to hell, and we need their vigor to bring it back. Believe, Obey, and Fight, that's what we need! We need to meet violence with violence."\n\nThe stunned silence returned, but before the students could react, one of the suits spoke in a tone of crisp dismissal.\n\n"The meeting is done. We appreciate the work of the FUAN, but we must ask you to vacate party premises immediately."\n\nMoments later Virgilio Inceli and the others were outside the building, a few of their jackets left behind in the haste of failure. The morning heat had evaporated, and fat mournful droplets had begun to fall from the sky.\n\nInceli supposed that he should feel angry. That he rally his compatriots against the weak and traitorous BN and their hollow bourgeois democracy they supported. But he felt only sadness of failure, and only disappointment in their eyes."
 hotautumn_med.53.a:0 "Well... back to the university."
 
 hotautumn_med.54.t:0 "Knives in the Back"
 hotautumn_med.54.d:0 "Fate arrived for Inceli in the form of a small manila envelope, battered by its journey through the labyrinthian Italian mail system. He was not the first to receive such a missive, nor had he enitirely given up hope that he would be spared.\n\nFirst it had been the crazies. The contrarian lunatics who cling to every patriotic organization like mussels to a whale. The ones who spoke admiringly of Farinacci, of Hitler, even of the "discipline" of Burgundy. A few of them had somehow wormed their way into leadership in the FUAN, and when they received the letters no one spoke out, because after all, they were lunatics. Then it was the spineless. The ones who sought ever greater power for themselves, and were willing to ally with anyone and say anything to increase their own power. They would in one meeting make bold claims of the violence necessary for the restoration of Italian strength, and in another wring their hands about every scrape and bruise the FUAN meted out to its bolshevist rivals. When they received the letters of dismissal no one spoke out, because they were weak. Inceli had let himself hope then that the BN had some potential afterall, that they were merely acting to refocus its sister student organization, and that any day now they'd apologize for their conduct at the meeting and invite the remaining leadership back for further planning. But then it was the honorable. The true scions of Italian Nationalism, the ideological heirs of Mussolini, who sought to once more raise the people's patriotic consciousness and shephard in a return to glory. When the letters came for them, there was no one left to speak out. No leadership council to speak of except for the BN's puppets and toadies.\n\nVirgilio read the words one more time, his vision blurred with tears of rage. "While the leadership of the Blocchi Nazionali appreciates your contribution to the nationalist student movement, we have decided it is for the benefit of the movement for you to vacate your leadership position immediately."\n\nHe threw the letter aside. He would fight them. He'd go around the city, find all the representatives of past and present and rally them to action. FUAN's ex-leadership was rapidly accumulating an alphabet soup of splinter groups. Inceli would be their unifier. They'd go to the BN's offices and MAKE them see the way.\n\nIt would fail. They'd be arrested. There was nothing he could do.\n\nThe national students movement was defeated. He could do nothing.\n\nHe had failed."
 hotautumn_med.54.a:0 "Always backroom schemes..."
 
 hotautumn_med.55.t:0 "They're Not on Their Side"
 hotautumn_med.55.d:0 ""You are either with us, in our fight against Bolshevism, or against us."\n\nThe silence from the BN's side of the table was all that Inceli needed to know that his words had had the desired effect. It was a hungry sort of silence. An expectation. The sort that waits for more.\n\nVirgilio lowered his voice, making it quite, conspiratorial, dangerous, intimate: "We want the same thing. A free Italy. A strong Italy. We have made mistakes -- I am the first to admit it. But our enemies outnumber us ten to one, and have foreign support as well. If we are to triumph, it must be all of us together. It is either unity, or death."\n\nHe had them. A few of the oldest and slimiest representatives writhed in their seats, but they were by far a minority. One member of the party -- seated on the edge of the table and wearing the famous black turtleneck and pin of the MSVN went so far as to chuckle appreciatively.\n\nThen the center most delegate spoke: "Well... I think we should be able to arrange a meeting with our senior leadership. We'll let you know when."\n\nPart of Inceli wondered if this might be a trick, if the call would never come -- but it did.\n\nThe meeting was late at night, and at a mansion not a dodgy, crumbling office. The best the party had to offer. It was roses and chandeliers for the FUAN this time, not cracked streets and broken windows. They filed past well equipped security guards and into an office decked with splendor, complete with marble pillars and plush leather chairs.\n\nAnd there in the middle, Almirante.\n\nInceli had had doubts about the BN leader's sincerity before, but seeing him in the flesh, he knew that they were mistaken. The chairman was somehow wise as well as bold, kind and yet fierce. When he asked, softly but firmly for the FUAN's loyalty, Inceli was only too willing to give it.\n\nItaly would be strong again. Italy would be great again. The nation would rise once more, with Almirante at its head."
 hotautumn_med.55.a:0 "And Inceli standing beside him."
 
 hotautumn_med.56.t:0 "Dead Silence"
 hotautumn_med.56.d:0 "The change didn't come all at once, nor was it so abrupt and dramatic as to be all that noticeable unless one was paying close attention to the state of FUAN as a whole. It was for just that reason that Inceli thought little of it when the local block leader and known provocateur actually spoke out in favor of a more moderate approach like the BN had been pushing for. When he saw that the man was perspiring a great deal, he put it down to some fair weather cold.\n\nHe didn't notice when the recruiter stopped haranguing non-members about the "Bolshevik menace" and "red terror"; he didn't notice when the district representative began to extort the position of the BN men and began to turn on his former allies, branding them, "Extremists who threaten to besmirch our message." He had no way to see how much healthier the representative's bank account had suddenly become, no way to see the bruises on the recruiters' sides.\n\nHe took notice when, almost overnight, the secretary for the FUAN branch of the city of Rome changed his position on working with the BN. Where he had only a few hours ago railed against the proposed rollback of aggression against suspected and known communist groups and individuals, he was now delivering a speech on the benefits of working with the established party to convince the people that Communism was not the answer to their problems. With horror Inceli began to remember every small hint, every change in behavior, every temper that had recently seemed to cool. He had taken it for granted that the last true believers of FUAN would hold firm against those who wished to use the name and legacy of fascism for their own selfish ends. He had been mistaken, and with every day passed, he could see that the rot of BN was ensnaring more and more prominent members of the leadership. He felt shame and disgust well up inside him, alongside the bitter taste of defeat. It was time to go back to the university, there was nothing he could do now."
 hotautumn_med.56.a:0 "Always backroom schemes..."
 
 hotautumn_med.57.t:0 "Return to the Nest"
 hotautumn_med.57.d:0 "Milan is a city that has inspired many a poem and song throughout the ages, of its beauty and grandeur. But alas, the age of fascism had not been kind to the Moral Capital of Italy. Its golden cathedrals had gone to rust, its quaint homes and outlying villages replaced by endless blocks of unchanging apartments.\n\nIt was to this city, static but surviving, that a train rolled into one Tuesday night. Its occupants filed out heads hung low, exhausted from their trip and the failures they had experienced in its duration.\n\nBut, despite their bad news and long faces, they were greeted at the university with a hero's welcome. Inceli quickly found himself surrounded by a crowd of admirers and a bottle of wine pressed into his hands as they urged him to recount the details of his trip to Rome. In the haze of good drink and companionship, the details of the trip began to change in his mind. The BN's attitude was not defeat -- it was merely a setback! The FUAN was not broken, it was merely reorganizing to rise again!\n\nInceli listened to his friends and spoke to them in turn. They spoke of the grandeur that Italy lost -- and would no doubt regain. All of the undesirables that filled the streets like rats would be cleansed. The legions of Rome would march once more into the world, to firmly discipline the traitors and barbarians that threatened its conquests.\n\nThere, surrounded by his partners in heroic struggle, listening to a drunk first-year rambling about a group called the "nuclear army" or somesuch, Inceli felt content."
 hotautumn_med.57.a:0 "It ends well after all..."
 
 hotautumn_med.58.t:0 "Figli di una Frontiera"
 hotautumn_med.58.d:0 "Though it would continue de jure for some more time, the FUAN was dead. Some of its members largely drifted into the BN's better organized and officially sponsored groups. Others dropped out of their campaign for a "National Revolution" entirely, as if awaking from a bad dream.\n\nSome, however, took a different path.\n\nItaly's universities had always had their share of graffiti artists, one could find tags, hammers, fasces and sickles a plenty, but these days hardly a stretch of wall or bathroom stall could be found that wasn't decorated with swastikas. In some places, it wasn't the negligent art of malcontents, but intricate murals of bright futures and desolate wastelands alike, with a curious pagan symbol in place of the sun.\n\nThe FUAN was dead, but the dream of its members and their romantic quest for an Italy that never was had never been stronger. It was a dream that grew more radical and dangerous by the day as its members found ever more energetic channels with which to express their beliefs.\n\nIf they could not have the Italy they wanted -- the respected great power and prosperous fascist economy still described in too many textbooks -- then they would have no Italy at all. From the ashes it would arise again, better and stronger. A golden eagle unleashed upon the world."
 hotautumn_med.58.a:0 "We shall see."
 
 hotautumn_med.59.t:0 "A Scorching Morning"
 hotautumn_med.59.d:0 "Of all the things Virgilio Inceli hated, being late for anything neared the top of that list. He hated how it reflected poorly on himself and invited judgement, even when it wasn't his fault in any way. Like this morning, when his usual route to the headquarters was disrupted by the prancing and shrill shouting of protestors.\n\nBeing late also meant he had to endure the slight of the meeting already having begun by the time he arrived. He had to pretend like nothing was wrong when his arrival prompted everyone else to turn and greet him, interrupting their discussion with empty pleasantries and mocking smiles, all the way until Virgilio took his seat.\n\nConsidering the circumstances, Virgilio was none too pleased to realize that they were planning demonstrations of their own.\n\n"Is this what we're reduced to? Pickets and slogans?"\n\nIt was telling just how eager his comrades were to justify their decision. "Don't think of it like that. Think of it like this instead:"\n\nAnother cut in, as if they'd rehearsed the damn thing. "We can only benefit by playing along with the democrats for the time being. We have- as it stands- something of a public image issue, and if we show ourselves to be reasonable and willing to work with the system that we have now, we can start to repair that image."\n\nAnother piped up. "How can the media slander us and call us thugs and brutes if we're out there with signs and protesting peacefully like the rest, after all?"\n\nVirgilio's arms were crossed over his chest, and he slouched some in his chair as they made their case. He didn't like it any more than he did at the start, but he had to admit that the plan had some merit. Not a great deal, but some.\n\n"I'll... Bow to your collective wisdom. So, what's the plan then?"\n\nThe speaker practically beamed as he was allowed to continue. "I was just saying that I've spoken with the police. They'll form a perimeter to-"\n\n"The police?" Virgilio's voice betrayed more of his incredulity than he'd meant to.\n\n"Yes, the police. As we said, we're trying to appear legitimate and law-abiding. They can both protect us if the communists try to antagonize us. They'd be willing to fight us alone, but riot cops with shields and batons? They wouldn't have the balls."\n\nHe went back to detailing the intricate details of their little protest, and Virgilio was left slinking further into his chair."
 hotautumn_med.59.a:0 "A tamer approach than usual..."
 
 hotautumn_med.60.t:0 "Tension"
 hotautumn_med.60.d:0 "The field of battle was ready. The forces stood ready with their banners and flags, their helmets and weapons, their ranks and files. The only thing that was missing was a war and an enemy to fight.\n\nIt would only be a slight exaggeration to say that the FAUN students were as heavily armed as their protectors that day, batons rested lazily in their hands as their helmeted heads looked up towards their speaker- the second of the evening- in a manner that reminded one more of soldiers standing at attention than students listening to a speaker at a political rally.\n\nThe speaker moved and spoke with a kind of energy and bombast that seemed familiar to many, including most of the police who served as the rally's protective cordon. As he continued, Inspector Ovidio turned towards Inspector Constantini and whispered with all the subtlety of a tank.\n\n"Where'd the kids find this one anyways?" He remarked, narrowing his eyes skeptically towards the stage. "He's good. Looks professional too. I had kind of assumed one of them would be up there, not someone who looks like he could sit in Parliament."\n\nConstantini tilted his head and tapped his own chin lightly with his own baton. "I've seen him before, I think." He muttered idly. "He does a lot of these speeches, I've walked by him before on my way home."\n\nThey were joined by an unexpected third voice, that of one of FUAN's student leaders, Virgilio Incelli, had moved his way towards the rear and apparently overheard them. "That's Pino Romualdi, he's from the BN, try to show a little respect."\n\nOvidio shrugged nonchalantly, seeming to not even notice the student's aggressive body language and tone. "He's just a speaker. Trying too hard to look and sound like the old Duce too. Someone should tell him he has a microphone and doesn't need to yell so loudly."\n\n"Well... Maybe it's inherited." Came Incelli's sullen retort. He was about as eager to explain as they were to ask, which wasn't at all. So he pivoted quickly. "Besides, maybe if you two listened to his words instead of his volume, you'd learn a thing or two about strength."\n\nConstantini felt an eye twitch involuntarily. "Maybe he could use some of that strength to tell us before he shows up unannounced next time. The speeches were supposed to be over by now."\n\nHe felt an instant sense of regret for having said that, but that was nothing compared to the look of abject hatred that young Incelli offered him instead..."
 hotautumn_med.60.a:0 "Tell that little shit off."
 hotautumn_med.60.b:0 "Brush it off."
 
 hotautumn_med.61.t:0 "Escalation"
 hotautumn_med.61.d:0 "In that moment, Incelli simply stopped thinking. He would allow raw instinct take over, all the thinking in the world had only produced a farce, but now he'd produce action. He stormed up to the Inspector, and shoved him backwards. "And what do you care? Huh? Go up there, go stop him."\n\nThe Inspector was caught off guard by the display and wasn't prepared to respond when two more officers from the cordon stepped forward, placing themselves between the student and Constantini with their batons brandished.\n\nBy now the scene had captured the attention of all of those gathered, the speaker was talking to part of his own personal security, while the fascist students stood behind Virgilio, who stared between the two officers. One of them held out a hand and simply demanded that the young man hand over his baton.\n\nIt all happened so fast, the sound of a baton's crack against flesh and bone, the immediate roar of approval from the fascistic students, the cries and shouts of dismay from the officers, the sound of rushing boots across the cobblestones and the sidewalks. The officer who had demanded the baton clutched his snapped forearm against his chest, but soon enough, there would be too much going on to help the poor man.\n\nAll across the square, Incelli's comrades surged forward and followed his example, the police had expected some hostility, but quickly, the situation spun out of their control. On all sides, students and police officers wrestled and charged with batons in hand, the sounds of violence as varied as it was bloody spilling into the streets around them."
 hotautumn_med.61.a:0 "This is out of control..."
 
 hotautumn_med.62.t:0 "Charge"
 hotautumn_med.62.d:0 "The police, in spite of the surprise of the sudden charge of the students, held their own in the ensuing scattered fights around the block. Only a small number had fallen, most often to head blows and arms struck by batons, while they continued to hold against their assaulters.\n\nAs for the students, for all of their ferocity and their zeal, they were still students and not fighters. As soon as they had rushed the officers, some were already falling back, while others had rushed the exact opposite direction, towards the stage that the politicians and speakers had already vacated. Few paid them any sort of mind, however, as the battle raged, and the tide began to shift.\n\nThe better-equipped and more well-prepared forces of the police began to, one by one, drive off their attackers. The handful who had fallen to blows to the head, arms, and bellies were dragged behind the cars, and now it was starting to become the police who chased the protestors and not the other way around.\n\nAs if the situation hadn't gotten bad enough for the FUAN, the din of the fighting was quickly drowned out by the roar of engines, the pressure of tires on cobblestone, and the rumble of armored vans storming into the square.\n\nThe panic quickly mounted among the students, but to their credit, they did not merely flee and disperse. Instead, they turned and they rallied, back to where the students who had turned back earlier had run to. When they emerged from behind the stage, they had discarded their batons and now their blood-caked knuckles carried pistols and rifles in their steads.\n\nSoon, the streets would ring with the song of gunfire."
 hotautumn_med.62.a:0 "We didn't mean for any of this to happen..."
 
 hotautumn_med.63.t:0 "Chaos"
 hotautumn_med.63.d:0 "The square looked empty, save for the half-collapsed wooden stage and the armored cars and vans that formed a perimeter of safety for the officers. Crouched behind the protective vehicles, the police officers formulated a plan to drive out the students from the square and restore order.\n\nThe students whose presence they felt, but they could not see. Scattered among the buildings in the square, behind trees and within bushes, the rebellious students held their rifles and pistols close to their chest. From their hiding positions, they watched the semicircle of armored vehicles and waited, fingers and feet drumming impatiently against walls, cobbles, trees, and their weapons.\n\nTheir patience frayed. Plans came to fruition. The silence of the square was filled with tension and unease, and both parties waited for the other to make the first move. The silence was first disturbed, but not broken, by jeers, shouts, and insults from one side to the other, but still, the tension did not break. That didn't happen until the first gunshot.\n\nIt was impossible to tell whose gun fired first, but the result was all the same. The boots of the law stormed the square, and the amateur shots of the students filled it with the song of gunfire. Lead cracked and splintered against the road and sidewalks, as officers fired back against students and into the shadows.\n\nIn groups of two and three, police moved through the square and the storm of bullets that filled the air around them. The fight would need to take place building by building, tree by bush by shrub. The work has only begun, and already there were grunts and shouts of pain as the bullets found their marks regardless."
 hotautumn_med.63.a:0 "Not a street, not a square, but a battlefield."
 
 hotautumn_med.64.t:0 "Death"
 hotautumn_med.64.d:0 ""Stay close." Ovidio muttered as the two of them proceeded cautiously deeper into the alley. The Inspectors had their pistols drawn and held at the ready, pointed down by their legs as they tread further and further from the safety perimeter. "Don't want to fuck it up in the final moments, right?" He offered Constantini an unconvincing smile.\n\nThe operation was in fact, wrapping up. The absolute overkill that the police forces had brought into the square meant that the poorly armed and untrained students couldn't hold out forever. Rather than facing arrest, most of them had fled, though it was noted that there were a number of students who were staying and taking potshots at the officers who remained.\n\nInspector Ovidio had sworn up and down that he'd seen a shape rush from some of the brush and into an alley straddling the square that the broken-up demonstrations had taken place in. So far, there wasn't much to suggest that anyone had been down this way, but if there was one thing these militant students were good at, it was hiding. Maybe Constantini would have a joke for that if they weren't also armed. "Keep your voice down. Echoes."\n\nConstantini's eyes scanned the walls and windows above as he proceeded, now alone against an unknown for. Slow, measured movements from one windowsill caused the Inspector to jump, turning his pistol skywards.\n\nThe cat on the sill stopped in the middle of its grooming, its leg high in the air and feline eyes glaring judgmentally down to the officer. Constantini lowered his pistol, and gave a slight chuckle. He must be losing his-\n\nThe sound of the gunshot and the crack of a bullet against cobblestone blended with one another, but he didn't have time to consider that before the sharp, shattering pain struck him in the side of his knee. He fell with a shout that must've been audible as far as the Vatican. He could just barely register the pain when his head struck the wall.\n\nOvidio was saying something as he cradled Constantini's collapsing form, but he couldn't quite hear it. Even as blood ran from his head and onto Ovidio's leg and the cobbles beneath, Constantini couldn't keep from chuckling.\n\n"It was just a cat, Ovidio." He laughed, his voice weakening by the moment. He got the last word in, "Just... a dumb cat..." before his chuckles faded into a rattle."
 hotautumn_med.64.a:0 "What's one more pointless death?"
 
 hotautumn_med.65.t:0 "Silence"
 hotautumn_med.65.d:0 "Before turning away and rejoining the rest of the students to watch out the remainder of Romualdi's speech. Eventually, the man's speech would run its course, and while he offered one final call to action to his steadfast audience, there was a sense of palpable relief that washed over both Student and Officer.\n\nQuickly- with perhaps a bit more haste than considered polite- the police went into formation to provide an escort for the FUAN students to leave the square. Curiously, however, the students didn't only take their time getting ready, they didn't seem to really be moving or preparing much at all. The gathered audience, even as Romualdi and the other speakers prepared to go on their way, just stayed and milled about listlessly in the square.\n\nInspector Constantini peered at the sun that threatened to set behind the horizon, and then back to the formed line of officers. Letting his shoulders slink, he nodded to himself before walking up and towards the gathered students. He reached out to tap the shoulder of the nearest one, and once again, was met with the scornful gaze of Virgilio Incelli.\n\n"Mister Incelli." Constantini maintained an even, diplomatic tone to his voice, though he suspected his face betrayed how tired he was at this point. "The cordon is ready to escort you and your compatriots out of the square, we were wondering when-"\n\n"That won't be necessary." Came the curt reply of Virgilio, cutting off the officer and leaving both silent as the Inspector processed what had just happened. Virgilio gave a brief glance back to his fellow students who didn't know what game Virgilio was playing. Not that he could blame them, he didn't know what he was trying to accomplish, save for stepping on the pig's toes.\n\n"Not necessary?" Constantini tilted his head towards the youth. A way out if he wanted to take it, but the offer only emboldened young Incelli.\n\n"Entirely unnecessary. We're not leaving. Our point has not yet been made." He crossed his arms and maintained eye contact with Constantini. "Feel free to go home yourselves, however. We can handle ourselves without you."\n\nWith a deep sigh and a shrug, Inspector Constantini turned back towards the cordon. He was going to require a few more opinions on this..."
 hotautumn_med.65.a:0 "Firm resolve or senseless stubbornness?"
 
 hotautumn_med.66.t:0 "Fear"
 hotautumn_med.66.d:0 ""They're students. Practically children. If they don't want to move, then make them move. You're police, act like it damn it."\n\nThat response wasn't what Constantini had wanted to hear from headquarters. He had hoped that the chief might be willing to negotiate with them, but the terms were clear. This disorderly behavior went beyond the protections of their right to gather together and right to protest, and they would just have to obey.\n\n"Well, they came prepared. If we're going to force them to go anywhere, we're going to need some backup..."\n\nThe FUAN on the other hand, was not of a mind to negotiate, nor were they of a mind to obey. It had taken a bit of time, and more than a bit of reinforcing, fiery rhetoric to sway the other members of the FUAN over to his side. But in spite of their general spinelessness, Virgilio Incelli would gain ground.\n\n"It is about time we practiced a little of what we preached. It's time we showed these corrupt officials what Italian strength and spirit looks like in action!" Came his final rallying cry, met with the scattered shouts and hoots from the rest of the student body. He turned, and with the helmets and flags of the FUAN standing behind him, he faced the baton-wielding police officers.\n\n"Any chance you'll rethink this insanity?" Constantini offered one last time, an empty hand extended in a gesture of goodwill towards the man on the other side of the gap. "If you go now, there won't be any consequences. It'll be as if we parted ways the way we were supposed to."\n\nThis was met only with a shake of the head from Virgilio. "We will not back down." He opened his mouth to speak further, but was interrupted by the hum of engines and the sound of tires over cobblestone as armored vehicles moved in to surround the square.\n\nThe gathered students took a tentative half-step back at the sound of the armored cars, but before Incelli could reply to the display, he was interrupted again by the whirring of rotors.\n\nConstantini squinted up towards the heavens, and muttered to himself with great incredulity in his voice. "...The machine gun might be overkill...""
 hotautumn_med.66.a:0 "This has certainly escalated."
 
 hotautumn_med.67.t:0 "Retreat"
 hotautumn_med.67.d:0 "The field of battle was ready. The forces stood ready with their banners and flags, their helmets and weapons, their ranks and files. The only problem now was that the helmet, flag and baton stood across from armored cars, a helicopter, and machine guns.\n\n"Virgilio. Please." Came the last plea from Inspector Constantini, he had set down his own baton, though the gesture was awfully futile seeing as his words were still backed up by machine guns. "Just stand down."\n\nVirgilio looked towards the Inspector, and then back over his shoulder. He looked towards the rest of the FUAN, the fear on their faces as they watched the helicopter hover in the air, and the officers began to take cover behind the cars, discarding batons for firearms.\n\nConstantini looked back over his own shoulder, towards the questioning and uncertain faces of the security cordon. Would they have the bellies to fire on these students? Would the students actually be stupid enough to fight? He watched a man silently remove the magazine from his pistol, thinking that no one was watching, and he watched another consciously move to the side to create an avenue.\n\nTension filled the air, and all that it waited for was a single twitch, an errant movement, a single spark to set off the entire scene. But what it got instead, was the clatter of a stick against the cobbles, at the feet of Virgilio Incelli.\n\nHe had made a big show of casting down the weapon, before turning back towards his compatriots, who all at once filled the square with the noise of dropping wood, and the furling up of flags and banners. Some who stood without their weapons chose to cast down their helmets or throw off their gloves and armbands instead.\n\n"I think..." He began, projecting his voice to the gathered students. "We have made our point. The sun is setting, let's go home, before the keepers of the peace escalate the scene further." The venom in his voice could be felt throughout the square, even as officers backed off and away."
 hotautumn_med.67.a:0 "A new miss..."
 
 hotautumn_med.68.t:0 "Quiet"
 hotautumn_med.68.d:0 "The mood in the FUAN headquarters was noticeably depressed when the rest of the leadership slinked in and found their chairs. Virgilio had been there for a short time, though he exaggerated his lounging position to make it look like he had been waiting for much longer. When they walked in, he slowly lowered his boots from the desk and leaned upright, hands folded over the table.\n\n"To say that did not go according to plan would be an understatement." Virgilio began, to the lukewarm mutterings of agreements from the rest of those in attendance.\n\n"Our image is going to take a while to recover." One of them replied.\n\nAnother spoke up as well. "And there's no way the police are going to allow us any more public gatherings after that display." He shook his head, practically trembling in anger. "And the media is already slandering us, as if we had been the ones responsible for-"\n\n"What has happened, has happened." Virgilio sighed, placing his hands on the desk and rising from his chair. "We can't change it, whether the demonstrations were a bad idea from the start or a good idea simply turned ill is entirely immaterial. What matters now..." He pointed a finger to the desk to emphasize his speech. "Is where we go from here." The gathered leaders fell silent as Virgilio did. They glanced between each other, and eagerly searched the ceiling and floor for the ever-elusive answer to the question, the question that was eventually vocalized. "So... Where do we go from here?" Virgilio stood up and looked around at the sullen faces of his compatriots. "The way I see it, there are only two directions we can go. Either we can keep doing this... participation thing that the democrats want from us, until we fade into the margins of history books and soon, off their pages entirely..."\n\nHe paused for effect, and to allow the chance for the darkness on their faces to lift, replaced by rage and frustration, that twisted their visages. He held up a fist as he continued. "Or we can change our tactics. They want to use guns? We'll use guns. They want lead? We'll fill the streets with it. If Italy must bleed so she can live, then so be it, but we will not allow our nation to perish under the faltering gaze of limp-wristed bureaucrats and vampiric politicians."\n\nAll at once, depression gave way to anger, and anger gave way to resolve. As one, the leadership of the FUAN stood and gave a Roman Salute. For Virgilio. For the Fronte Universitario d'Azione Nazionale. For Italia."
 hotautumn_med.68.a:0 "The battle may be lost, but the war is yet to come."
 
 hotautumn_med.69.t:0 "A Morning at Work"
 hotautumn_med.69.d:0 "Being a member of the Celere Units is not an easy job, and being an officer in them is even harder. The pay is little, the hours long. The screams, bottles, rocks, slogans thrown at you, hammering against your body while your men, standing by your side, entirely depend on you for orders and instruction. Communists, fascists, united by their hatred for you. The adrenaline mounting, the heartbeat pounding like drums, the charges, the batons falling, the smell of tear gas and water cannons, shouted orders, the intoxicating miasma of violence.\n\nLiving like this is not easy, and the downtime can be the hardest part sometimes. Showing up at the local commissariato at the break of dawn, exchanging small talk with coworkers over a cup of coffee, the endless stashes of paperwork. And while Milan burned, its police officers slaved away at paperwork, like nothing of note was happening outside. The units of the police and the Carabinieri were stretched thin across the city - Bicocca, the industrial area, is still ablaze with constant strikes and small scale riots, while the Statale, much closer to the city centre has been recently pacified, but trouble is still brewing under the ashes.\n\nInspector Adriano Constantini looked away from the papers, out of the window on the streets. The sky of Milan had that soft azure hue, so typical of the Lombard landscape. Adriano picked up the cigarettes from the desk, right next to his badge, and lit up one, smoking in long, slow drags. This was going to be a long day."
 hotautumn_med.69.a:0 "Back to work."
 
 hotautumn_med.70.t:0 "Cordon"
 hotautumn_med.70.d:0 "For the past few days, a set of documents had been in common circulation regarding some strikes that were soon to take place. Today, however, he found that those dossiers had been replaced with a new set. "Milan FUAN 'Demonstrations and Rally'" was printed along the top, and it took the Inspector a few moments to figure out what it was referring to.\n\nThe students, the Mussolinites, that's right.\n\n"What's with the change in assignment?" Constantini asked, flopping the dossier on the neighboring desk of Ovidio, another Inspector in the Celere Unit. He started awake, almost tipping over his lukewarm coffee at the sound of the paper meeting desk.\n\n"Oh, the strike?" Ovidio muttered, adjusting his glasses and wiping something from his mouth with a sleeve.\n\n"It says here that it's a uh... A demonstration." Constantini pointed out. "Why did we get switched over from the Pirelli?"\n\nOvidio shrugged as he looked over the dossier. "They can't call it a strike I guess, because they're students, not workers. Dunno who would panic about the books going unread for an evening, so they gotta give it a different name." He leaned back in his chair and handed the dossier back to Constantini. "They asked for a cordon last-second. I guess we were the only unit they could send."\n\nConstantini glowered down at the dossier and shook his head. "You'd think that a bunch of Fascists proclaiming their strength or whatever would handle their security themselves." Though as he spoke, he realized how glad he was that they weren't taking such matters into their own hands, for once.\n\nOvidio's reply mirrored his own internal dialogue. "Better us doing it than them. They're Nazis in all but name, they'd be certain to overreact if any of the Union men confronted them, and we'd have to go in anyway." He kicked his feet up on the desk, risking that lukewarm cup of coffee once more, and relaxed his hands behind his head. "Better we be there to keep the children from hurting themselves, am I right?"\n\n"I'm a police officer, not a babysitter."\n\n"You act like there's a difference.""
 hotautumn_med.70.a:0 "The shield protects left and right alike."
 
 hotautumn_med.71.t:0 "A Call from the Boss"
 hotautumn_med.71.d:0 "Another day, another mountain of paperwork done, and yet the amount never seemed to end. Inspector Constantini put down the remnants of the last cigarette in the ashtray, letting out a long sigh. Days like these were boring, but a welcome moment of quiet after the chaos of the last period. As the inspector prepared to leave for home, the phone on his desk rang, echoing through the almost empty corridors of the local commissariat.\n\n"The orders have been changed, inspector Constantini" the voice on the other end of the line said. Receiving a direct call from the commissar was not a common occurrence, especially at such a late time of the hour. "Your men won't be needed at Pirelli tomorrow." A major strike was planned, and Constantini with his unit was supposed to be part of the security cordon. "Also, all documents regarding the Pirelli situation have been placed outside your clearance level." The call abruptly ended, and Constantini stood with the phone in his hand as it beeped, without even having the time of saying "yes, sir."\n\nThis was far from ordinary. The Celere Unit was never one devoted to investigation, and instead was the rank and file of the police - the grunts who do the dirty work. And yet, something went off in Constantini's mind. Why would the plans change, all of a sudden? And why remove dossiers that were commonly circulating until only hours ago? As Constantini was walking home, his mind raced. Perhaps it's nothing, but it might be worth asking around tomorrow at the commissariat."
 hotautumn_med.71.a:0 "A cop must obey orders without question."
 
 hotautumn_med.72.t:0 "Strange Information"
 hotautumn_med.72.d:0 "Inspector Constantini hung up the phone, and the room was once again filled with silence. And yet, his mind was racing, echoing with the voices he heard in the last round of phone calls. San Donato, Rogoredo, Sesto San Giovanni - from his colleagues and friends in almost every single working class district of Milan, similar news could be heard. Orders changing suddenly and seemingly with no rhyme or reason - experienced officers replaced with new people from outside the city - and the plans to contain the disorders, carefully crafted by the local commissars of the Polizia, being scrapped in favour of much more dubious ones.\n\nThe upper command of the Polizia proved its lack of competence or knowledge of the situation on the ground many times before, but such egregious mistakes were simply unprecedented. Constantini looked at the large map of Milan hanging in his office - a pentagon shaped mass of a city, apparently twisting and turning, its roads and streets intersecting at strange angles to mark where the many different overlords of Milan started to shape it in their image during the city's long history. All around the city centres, the districts where the strikes and disorders were most prominent, all marked in red, stretching like a ring of fire around the white blot in the city centre - the Duomo, San Babila, the Statale.\n\nThe current plan to deploy the police forces was a tragedy waiting to happen. The Celere units were ordered to take positions in bottlenecks and narrow streets, where there'd be no way to effectively contain the riots and a violent, head on clash would be inevitable. Somebody upstairs was doing his job outstandingly poorly, and something had to be done before the inevitable happened."
 hotautumn_med.72.a:0 "We can't sit here, waiting for someone to die!"
 
 hotautumn_med.73.t:0 "Rumors from Above"
 hotautumn_med.73.d:0 "Corruption in the police is a strange subject - even before that word appeared in Constantini's mind, the mere smell of that concept, its vague precognition, caused a sort of freeze reaction. And yet, there were few other explanations to the series of egregious mistakes the police command of Milan was committing, and none of them very plausible. Somebody, somewhere, was consciously and deliberately setting up a massacre in the streets of Milan, presumably with some sort of other goal.\n\nPolitics and police are a pairing which often made its appearance in some shape or form - but for the first time, inspector Constantini was directly involved. His men were on the front line in Milan - they would likely be the ones forced to kill, or be killed. And yet there was very little Constantini could do - the only things he had were rumours, conjectures, not conclusive evidence. And even then, what could a lowly inspector do against something happening above him in the chain of command?\n\nStill, another question was how and why somebody was trying to cause a violent escalation of the already tense situation in the city. The most obvious culprits would be the communists - by making violence increase, they could paint their own dead as martyrs and further gain popularity among the masses. But the police was not exactly known for its communist sympathies, and it could also be that some sort of right wing organization was attempting to cause the death of a policeman or two, in order to justify a harsher crackdown on leftist violence. It could even be organized crime, attempting to cause further chaos in order to keep the police busy, leaving them free to do their business. Or maybe it was all a complicated ploy by the police command, who was hoping to gain a martyr in order to be able to ask for more funding from the government. Constantini's mind buzzed with possibilities and conspiracies forming and dissolving in the span of seconds, against the backdrop of rising frustration, anger, and fear."
 hotautumn_med.73.a:0 "It can only be hoped that these are all just baseless conjectures."
 
 hotautumn_med.74.t:0 "Growing Suspicions"
 hotautumn_med.74.d:0 "Constantini turned off his tv, a cheap new model purchased by gutting his last paycheck, and drew a long sigh. Newspapers, from L'Unità to the Corriere, and RAI broadcasts over radio and televisions all told the same story. In the evening of yesterday, the police clashed with rioters and protesters in Sesto San Giovanni. Zhdanov cocktails and rocks were being hurled against the police like drops of rain, as what seemed like entire legions of angry, dispossessed workers, university aged would-be revolutionaries, and even women and children from the poor parts of Sesto pressed against the police. Eventually, the police was unable to contain the riot, and ordered a counter charge to repress the chaos.\n\nIt was like fingers snapping, and then for one second it was silence. Water cannons, tear gas, screams, batons falling on skulls - the police charged. Finally, gunfire. Policemen had opened fire on the crowd with live ammunition, leaving several people lying dead or wounded on the streets - and then, someone fired back. A policeman dropped to the ground, a puddle of blood forming around him as he wheezed his last breath while his comrades tried to remove him from the streets. More policemen were wounded, but at least the crowd was dispersed, as in what seemed like seconds the people fled in all directions, into buildings, narrow roads, and some seeming to vanish into thin air. Soon, only the macabre spectacle of a devastated street, with smoke, bodies, and burning cars, was left to the eye of the policemen, and of the press.\n\nAs predicted, the scandal was huge. Politicians from even the most unsuspectingly moderate parts of the political landscape were lamenting the deaths of so many people, and calling for more funds being directed towards the police and more extraordinary powers going their way. The most respectable members of the upper echelons of Italian high society were disgusted at the awful display of violence Italy had become a theater of, and wished for a return to orderly and quiet life in which workers and students would just behave like good citizens of the kingdom. The right wing was starting to openly remind the Italian people that things like these didn't happen in an earlier, more orderly time. And Constantini sat in his living room, staring at the ceiling, with that familiar buzzing sensation in his mind."
 hotautumn_med.74.a:0 "...something isn't right."
 
 hotautumn_med.75.t:0 "Asking Questions"
 hotautumn_med.75.d:0 "A funeral is always a somewhat awkward celebration - the suffering and sorrow of the deceased's closest ones surrounded by the alternating silence and murmurs of the crowd. In this case, the situation was only made worse - as the relatives of the dead policeman, including his wife and his children, mourned their loss, the honoured men of the Polizia di Stato surrounded the coffin with a blank expression on their faces. Under their stony visage, many had several emotions agitating their thoughts - anger, sadness, and a remarkable feeling that their friend's death was entirely avoidable.\n\nInspector Constantini was also present at the funeral, in his uniform, but far from the first rows of the church of Santa Maria delle Grazie - going unnoticed among the crowd as Milan's archbishop delivered his somber sermon. While saddened by the death of his colleague, Constantini did not attend the funeral out of a desire to pay his respects, but for a more personal reason. He wished to meet an old friend of his - also an inspector, attached to the police unit present at the riot in Sesto San Giovanni. Perhaps he could give more answers.\n\nAs the archbishop gave his final blessings and the coffin was escorted out of the church, the crowd started to slowly disperse, piece by piece, in the busy, crowded streets of Milan. In the noise, Constantini managed to reach his friend, who had a stern look on his face. After a brief exchange of pleasantries, fitting for two old acquaintances meeting at a funeral, Constantini began asking questions - who gave the orders that resulted in a senseless death, and why? The answer he received was sobering, but not entirely unexpected."
 hotautumn_med.75.a:0 ""You shouldn't go around asking questions like this.""
 
 hotautumn_med.76.t:0 "A Friendly Warning"
 hotautumn_med.76.d:0 "Memorandum from the Regional Police Headquarters, Milan - Confidential\nFound on the desk of inspector Adriano Constantini\n\n"The regrettable loss of a policeman's life has shaken all of us deeply. As we still mourn our fallen colleague, the regional headquarters has grown concerned with the apparent effect that this death has had on morale and discipline among officers of the Polizia di Stato. For this reason, the headquarters has decided to take disciplinary and precautionary measures to ensure the smooth functioning of police operations in the city and the hinterland."\n\n"All the files related to recent scuffles and disturbances in public order have been placed under a stricter level of security. All inquiries about said documents and files must be approved by the Regional Headquarters. The officers of the force are also reminded that all unfounded accusations, assumptions and rumours of corruption and other misconduct among the police must not be spread by anybody - severe disciplinary actions will be taken against anyone caught spreading lies that might hurt the reputation and good name of the Polizia."\n\n"A reshuffling of personnel has also been ordered. Attached to this document there is a list of officers who have been reassigned to an emergency post in Fezzan, Libya, which is currently understaffed and sorely in need of more manpower. The positions left vacant will be filled by order of the Regional Headquarters.""
 hotautumn_med.76.a:0 "And so ends the story of the Inspector"
 
 hotautumn_med.77.t:0 "The Fires of Biocca"
 hotautumn_med.77.d:0 "In normal times, the Bicocca district of Milan was surprisingly calm despite its industrial nature. It was filled with bustle but never raucous; echoing with thousands of the footsteps of laborers, young and old, but never so obnoxiously that it brought the storied city any shame. As the dawn began to shine upon the many steel and concrete beasts that housed the beating heart of the city's economy, there was, as usual, a fair amount of noise, but it was not the pleasant kind that indicated work was carrying on as usual. Instead, shouts of rage and the crackling of flame consumed this national center of educational and economic achievement. Such riots were all too common in these uncertain times, Inspector Constantini reflected as he deliberately adjusted the holster containing his standard-issued firearm for maximum visibility, but what worried the seasoned officer was the sheer scale of the conflagration that was currently consuming most of the quarter at the moment. The entire city's police force had been mobilized the previous night, and he had heard from a friend in the security ministry that special riot units were being deployed from as far away as Calabria to help suppress the riot before it became an even bigger embarrassment to the nation.\n\nNot that it would probably help much, the Inspector thought grimly as he stepped into a waiting car with a fellow inspector and a beat sergeant who explained that he had been called up to help direct the out of town reinforcements to their designated locations.\n\nThe trip to the edge of the riot was spent mostly in quiet, which was fine as far as Constantini was concerned, he wasn't really in the mood for talking. Only two incidents of note interrupted the drive. Above the background din of riotous jeers and the broadcast demands of the city and police officials, the crack of gunfire pierced through the morning air. The inspector vaguely remembered having been told that the rioters did not have any firearms. It seemed that supposition was now out of the window. The second incident did not involve gunfire, but was far more worrying in its own way. As the car began to slow down as it approached ever nearer to the blocks where the rioters made their voices heard, the sergeant related an uncomfortable piece of office gossip: several known anarchists and radicals who had been under the government's watch had all seemingly slipped off their handlers and were, at present, unable to be found."
 hotautumn_med.77.a:0 "Just how bad are things going to get?"
 
 hotautumn_med.78.t:0 "The Shot"
 hotautumn_med.78.d:0 "A raging mass of rioters surged once more against the line of police that, while determined and substantially armed and armored, was growing more outnumbered by the hour. Most of those facing off against these enforcers of order were laborers native to industrial Bicocca who had finally broken under the backwards labor policies still common in factories across the nation. Some were young, well educated students, believers in the theories of Marx and Engels, idealistic rebels against the system they had grown up into, the system they were certain was a broken mess. A few key figures, dispersed throughout the sea of discontent, stood out starkly from the older men in working clothes and the students in the fashions of the day. These gentlemen were grim, grey faced and dark-eyed; some bore distinct scars and all wore outfits as badly worn as the most overworked of the factory men. The police, blind as they were to the happenings within the riot's territory, had no idea that it was these determined and militant pugilists who were at present building up the rioters' fury and passions with their denouncements of the rich and powerful.\n\nDespite the tough talk from the hardliners within the crowd, the general mood of the assembled discontented citizens seemed to be cooling as the sun progressed in its upward journey. At least, so it seemed to Mario Calabrò as he watched one cluster of students trickle out from their peers and surrender to the waiting police. He could hardly fault them, they were hardly more than children after all, and even his deep commitment to the protest he had willingly joined couldn't stop him from worrying for the safety of his young comrades who were not much older than his eldest son. Still, it seemed as if not everyone felt the same way, and his heart sank at seeing how this small defeat had engaged the greater mass once again into anger and action, only this time it was not righteous fury directed against the capitalist and fascists bastardi but towards some youths who had made what was likely a sensible choice for their own safety. Men like Calabró had nothing much left to live for, but those students still had a future if they were smart enough not to waste it. One of the apparent ringleaders of the rioters hurled particularly vicious insults at the departing deffectors, and before he was given a chance to remunerate the scoundrel, the agitator drew a pistol and fired a single shot."
 hotautumn_med.78.a:0 "A defender of public safety falls in the line of duty."
 hotautumn_med.78.b:0 "A young life is cut short for the crime of walking away."
 
 hotautumn_med.79.t:0 "Retribution"
 hotautumn_med.79.d:0 "Inspector Constantini felt a splatter of something liquid slap his face with enough force to make his eyes shut involuntarily. When he reopened them, the riot officer he had been conversing with mere seconds ago was on the ground and bleeding uncontrollably from a wound in his shoulder. The mass of police and rioters turned slowly, almost apprehensively, as the inspector's urgent calls for medical attention began to sound through the packed street as everything seemed to grow ominously silent. As the inspector waited tensley for any sight of responding medical personnel, something caught his attention from his peripheral vision. A group of rioters who had up until that point been almost up against the protective shields of the police were now backing away, slowly and without any fanfare, but they were backing away. Perhaps the rioters were coming to their senses, and maybe, just maybe one incident of tragic violence would prove to be a blessing in disguise. The Inspector was considering this as one of the officers across from the falling-back rioters took a slow, deliberate step forward.\n\nHe could see exactly what was about to happen, see it as if it had already happened and there was nothing he could do to prevent it. He could prevent it though, if he could only get there in time. The only problem was the man bleeding out in front of him. Leaving him unattended to cost the officer his life, and it would be Constantini's fault. The choice was painfully clear, and the answer, unfortunately, was equally so.\n\nHe was running as fast as his legs would carry him to the advancing officer, waving his arms, calling for him to stay put, but in the end he was too late. A brutal shove from the officer's riot control shield sent one of the rioters sprawling on the ground, blood pooling from the back of their head where it had cracked against the street. Another long moment of silence followed, and then with cries of mingled rage, resentment, and even fear, the line of police disintegrated into a counter-mob hell-bent of punishing the riot with any means necessary to avenge their fallen brother. Adriano Constantini could only look on in horror at the unfurling violence."
 hotautumn_med.79.a:0 "Mio Dio, cosa abbiamo fatto?"
 
 hotautumn_med.80.t:0 "The Fire Rises"
 hotautumn_med.80.d:0 "Inspector Constantini never imagined he would hear such sounds outside of the Final Judgement, although at that precise moment, he was half convinced that that was what he was witnessing. Any semblance of order was rapidly dissolving as the riot police charged with the reckless abandon of rage and fear. They were met with an ever-increasing amount of gunfire from previously concealed firearms. If the rioters had not premeditated such violence, it was clear to the inspector that they had been prepared. The shots, however, were not all coming from the side of the rioters. Constantini looked to the rooftops of the surrounding buildings and spied at least half a dozen police sharpshooters, all of them either firing or picking targets.\n\nConstantini turned in the direction of the mobile headquarters, preparing to sprint the few blocks separating him from a chance to find someone able to restore order. The sound of an explosion and second later a chorus of cries to rival the damned stopped the veteran officer where he stood. Pale, he turned slowly around to face the source, and was met by flames rising from a score of buildings, creating a corridor of fire surrounding protests and police alike. Of course, the inspector realized, the protestors had been armed from the beginning, and guns were not the only weapon a rioter would come prepared with. He caught the glint of light as another Zhdanov cocktail sailed in an arc that seemed almost lazy, like it was no more a tool of chaos and death than a football. It flew into a storefront window and the facade was alight almost instantly. The gunfire had slowed for a fleeting moment after the first few buildings went up, but it was now starting up once more in earnest. The pops of small pistols from the rioters and the cracks from police rifles created a terrible harmony of destruction and violence. If anyone had the power to stop this, the window to do so was closing quickly. Trying not to think about the pain and death he was essentially fleeing from like a coward, Constantini took off for the headquarters unit. Maybe they would have an answer he told himself; maybe they would have a contingency already prepared; maybe; maybe; maybe. The word rattled around in his mind as he pushed his legs to move faster."
 hotautumn_med.80.a:0 "Can anyone stop this madness?"
 
 hotautumn_med.81.t:0 "No Good Deed..."
 hotautumn_med.81.d:0 "At first, Mario had not believed that the police would allow the block to burn. Surely, he reasoned, they would call off the mob, and the police really had descended into a mob by this point, and allowed the protestors to disperse without further violence to allow fire teams to save what they could from the conflagration. He soon realized how naive he truly was. The police were by this point in no more control of their emotions than the rioters had just before the officer was shot. Mario Calabro was a peaceful man, a family man, but in his deepest heart he had to admit to himself that if he had the chance to get ahold of the scoundrel who fired that deadly shot, he would not be responsible for his next actions. Despite the not insignificant desire to exact justice upon the guilty man, all Mario was really focusing on was finding a way to escape the chaos and return to his family.\n\nThe police seemed hellbent on making that as difficult as possible however. He could faintly see through the smoke and to the tops of several of the non-burning buildings farther back. There were at least half a dozen sharpshooters perched atop them like gargoyles, and every few minutes one would fire a shot in the direction of the riot. Most of the time the shot cracked pavement or road. Most times. The way he had come into the street was in hostile hands as it were, and so Mario scanned in the opposite direction. While free of snipers, that way was no less anarchic with the masses of fleeing protestors who were attempting to make a desperate stand against the better armed police away from the fires. Dangerous as it was, Mario had little choice, and he began moving as quickly as he could without inviting unwanted attention onto himself.\n\nDown at this end of the street there was no fire or smoke, but that only meant that those with firearms had clearer sights to kill with. Bodies already littered the ground and wounded men and women roiled in agony on sidewalks or slunk into alleys only to collapse alone. Mario saw just this happen to a boy no older than sixteen, and his fatherly instinct compelled him to step in. He had made it within a few meters of the alleyway entrance when the screams began to intensify. Shots and canisters of gas whizzed by Mario's head and his resolve faltered, a nearby building's open door seemed to invite him in to weather this storm, but that would mean abandoning the injured young man."
 hotautumn_med.81.a:0 "Go to save the young man, despite the danger!"
 
 hotautumn_med.82.t:0 "The Death of a Worker"
 hotautumn_med.82.d:0 "The world seemed to sway and dip in slow motion as Mario Calabro first slumped, then collapsed, against the wall; a smear of blood from where the man's head had slid followed the body down to the cold ground. For a moment, or perhaps several for Mario could no longer sense the passage of time, there was an all encompassing blackness. Muffled shouts, muted crashes, and even the sound of gunshots from what felt like blocks away assailed the ears of the ill-fated laborer. From a foggy corner of his mind, Calabro wondered if it was due to the almost guaranteed concussion or if the violence had actually moved, and he began to wonder which option concerned him more, but the complex thought proved impossible to keep and it dissolved.\n\nHe opened his eyes when he felt the warm metal touch his cheek, and with his first sight since falling to the ground, Mario Calabro witnessed a vision of hell. He was not the only one lying on the ground, there were at least a dozen others. Some were groaning and attempting to crawl away or squirming meekly like birds with broken wings. Several, however, lay still and showed no signs of consciousness or even life. With an effort, he cast his eyes around his immediate surroundings. He saw several spent bullet casings strewn around the area, and realized it had been one of them that had hit his face. An empty gas canister lay near his feet, a blood-splattered dent clearly visible.\n\nHe thought about his wife, who would have to somehow navigate life without a husband. He thought about his children, who would have to grow up without their father. What had he or his family done to deserve such punishment? He wondered if he would receive any answers in the end, or if all would be consigned to oblivion. His hand felt heavy and numb, but he managed to place it into his pants pocket, and trembling, withdrew a worn photograph. Mario Calabro looked intently at this precious image, smiled weakly, and died."
 hotautumn_med.82.a:0 "Sent off by a vision of his family."
 
 hotautumn_med.83.t:0 "The Dam Bursts"
 hotautumn_med.83.d:0 "With a rising horror Mario Calabro watched as the young student, a boy in his early twenties by his appearance, clutched his side as dark red blood began seeping down his shirt, then his trouser leg, and finally puddled at his feet. By the time the youth fell, already beyond saving, to the ground, the crowd had discerned the location where the shot's effect had landed. However, as far as Mario could tell, none besides himself had actually seen the shooter from his obscured position. It occured to the unlucky worker that without a clear idea of the real culprit, the already agitated mass of protestors would naturally rally against... He spun, and began to wave wildly around in an attempt to alert the others as to what he had just witnessed but things were already moving out of anyone one person's control.\n\nThe frustration and anger that had already been pent up inside the people from not just this protest but countless others and behind that, the economic uncertainty forever looming in the dark like some boogeyman, finally seemed to be spilling out. Clusters of the riot control officers were being faced down by dozens of approaching workers and students armed with sticks and pipes. Rocks began to pelt the protective shields which were the only thing protecting the officers from the enraged crowd. Things were going to get ugly, and get ugly very soon.\n\nSome of the police seemed ready to hold their ground to the bitter end, insane as the idea seemed to Mario, while others were already buckling under the pressure and giving ground quickly. He watched from the entrance to an alleyway, unwilling to directly participate but equally unwilling to leave before seeing the conclusion of such dramatic events. It was clear enough to him that the police were taken completely off-guard by the shooting and were in total confusion as to how to respond. He prayed silently that they would just retreat before any more blood was spilled."
 hotautumn_med.83.a:0 "Martyrs never fail to inspire."

 hotautumn_med.84.t:0 "Dogs on a Leash"
 hotautumn_med.84.d:0 "The Inspector had no intention of letting things advance any farther than they already had. The protest was quickly devolving into a riot with the death of that young man and there was a real possibility that major violence could erupt at any minute. The police had to pull back, Constantini was convinced, if there was to be any hope of a cool-off happening. That was why he ran down the blocks to the temporary headquarters with an intensity he hadn't displayed since the academy all those years ago. He had handled situations of life and death before, it was true, but he had never been so sure that the fate of hundreds of lives were hanging in the balance as he did now. There was no time to spare.\n\nThe mobile headquarters unit had changed in the relatively short time he had been away at the front lines of the protest. Several portable barriers had been erected blocking easy access to the tents and armored command vehicle that had been borrowed from the army. Around the perimeter, armed officers stood at the ready with rifles and at each tent entrance there were two sentries posted with machine guns. Apparently the brass was getting mighty paranoid, but given the situation Constantini had just left, he could hardly blame them. The tent farthest back was likely where the police chief and his aides were coordinating the response. The inspector jogged up to the tent's guards and flashed his identification before disappearing inside without waiting for their response.\n\nThe chief looked pale and exhausted, and for Constantini, seeing the normally resolute and unflappable man reduced to this state frightened him more than any mob ever could. When he had entered, the head of Milan's police was in rapid fire conversation with one of his subordinates, but the Inspector's sudden appearance in the tent halted that conversation as all eyes turned toward this newcomer. Not wanting to waste any of the precious time he had, Constantini took advantage of this and began to address the chief directly. He had one shot to convince the man that pulling out would prevent further escalation, and he would need to speak quickly."
 hotautumn_med.84.a:0 "Time is running out!"
 
 hotautumn_med.85.t:0 "The Silent Stand"
 hotautumn_med.85.d:0 "Constantini watched from a distance as the line of officers, once more adhering to their discipline and bolstered by the men on either side, reformed the tight shield wall that they had begun this fiasco in. He silently thanked God for giving his tongue the power to persuade the chief that this was the right course of action. He had been met with initial resistance of course, none of the brass had been happy at the thought of appearing to retreat in the face of a riot. He had, luckily, been able to persuade them that keeping the police where they were would only allow the mob to encircle and destroy the riot officers and that would look even worse for the city.\n\nFor a group that had just been surrounded by scared, angry rioters eager to exact vengeance, Constantini thought the men were doing a damn good job of keeping it together. Most of the protestors, for their part, were letting the police pull put unmolested. Most of the mass had been young students and workers with families to feed, not exactly the picture of zealous fanatics willing to risk life and limb for an already finished battle. Still, there were some shady characters peeking out from the front of the crowd. They looked like they could be trouble if left unwatched, so Constantini motioned a nearby lieutenant to make sure that didn't happen. He paused long enough to make sure the instructions were relayed properly down the line -- he didn't want a trigger happy sniper getting the wrong idea and ruining everything -- and then he began to walk briskly but calmly back to the site of the mobile headquarters.\n\nThey had packed away the tents when he arrived and were beginning to load the last of the equipment into the armored vehicle. The car he had rode from the station was nowhere in sight, so the Inspector pulled himself into what seemed to him to be one of the most uncomfortable seats ever devised by man. It reminded him, he realized, of the days he had ridden in another machine quite like this one, back during the war. He was a young man himself then, no older than most of those students. He wondered, idly, if those kids would one day reflect on this protest as merely a half forgotten piece of some long, grueling war."
 hotautumn_med.85.a:0 "A job well done inspector."
 
 hotautumn_med.86.t:0 "One Fire Put Out"
 hotautumn_med.86.d:0 "The night was a cloudless one, and silver-white ribbons of light cascaded into the still, silent offices of the Milan police headquarters. Except, the offices were not quite empty, not yet anyways. Inspector Adriano Constantini took another sip from a cup of black coffee as he attempted to fight off the oncoming fatigue. Only a little bit longer, he thought to himself as he pulled another piece of paper from the pile sitting atop his desk like some ancient Roman temple. Only a little more and then that will be it for tonight. Having been heavily involved in the incident the papers were now almost exclusively referring to as the "Bicocca Fire", it was to be expected that the Inspector would have a good deal of paperwork to work through. Expected, and annoying as hell.\n\nStill, the mountianload of reports he was being forced to fill out were probably going to be helpful in the very near future. As officials all over the country from Sicily to Venice were discovering, stamping out one flame would not be enough. Given that tensions in the country were running so high they could be cut with a knife, perhaps they should not have been surprised when similar demonstrations began to pop up in most major cities with industrial centers. Even when those were put down, some more peaceful than others, things did not improve. In fact, the riots and protests were merely the beginning. The political factions of Italy were mobilizing for something big, he was sure. The socialists cheered on such displays of disobedience while the remnant fascists and conversative blocs railed against the 'death of civilization' and the foreign saboteurs some claimed were behind it all. The moderates were having their own hell of time in even trying to figure out what message to put forward. It was, in a word, chaos.\n\nConstantini looked at the clock and blinked, then rubbed his eyes before checking again. He had spent almost an hour in his own thoughts all the while doing nothing to reduce the number of unfinished reports still on his desk. The old cop sighed and glanced at the empty cup. As if in response, a yawn came to his lips and passed unheard by anyone except himself. There was no use staying any longer, the papers would still be there the next morning. The chaos too would greet him in the morning, like an old friend."
 hotautumn_med.86.a:0 "Even in these chaotic times, the daily grind continues."
 
