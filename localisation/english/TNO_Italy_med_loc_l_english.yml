 ITA_Ciano_POP_GUI_monarchy_pop_tt:0 "The King\n-------------\n§YPower§!: [?ITA_Stato_Support^4|Y0]\n-------------\n§KCiano: [?ITA_Ciano_POP_Loyalties^100|1]%§!\n§rFascist: [?ITA_Ciano_POP_Loyalties^101|1]%§!\n§gApathetic: [?ITA_Ciano_POP_Loyalties^102|1]%§!\n§VPopular Opposition: [?ITA_Ciano_POP_Loyalties^103|1]%§!"
 ITA_Ciano_POP_GUI_clergy_pop_tt:0 "Clergy\n-------------\n§YPower§!: [?ITA_Stato_Support^5|Y0]\n-------------\n§KCiano: [?ITA_Ciano_POP_Loyalties^110|1]%§!\n§rFascist: [?ITA_Ciano_POP_Loyalties^111|1]%§!\n§gApathetic: [?ITA_Ciano_POP_Loyalties^112|1]%§!\n§VPopular Opposition: [?ITA_Ciano_POP_Loyalties^113|1]%§!"
 ITA_Ciano_POP_opposition_bar_tt:0 "The Strength of £ita_internal_opposition_texticon §LInternal Party Opposition§! is §L[?ITA_opposition] / 100§!\n-------------\nWhile the National Fascist Party attempts to maintain an image of unity and strength, the reality of the situation is unfortunately not ideal. After the disasters of Atlantropa, Ciano's general incompetence as a leader, and the steady decline of the Triumvirate, our Duce now faces a disconcerting amount of opposition from the party itself. Blaming Ciano for all of Italy's woes, these disloyal traitors fracture the party all in the name of power and ambition. If we allow this internal opposition to grow, our Duce may find himself ousted by those who are supposed to be his most loyal followers."
 ITA_Ciano_POP_radicalization_bar_tt:0 "The £ita_radicalization_texticon §Rradicalization§! of society is §R[?ITA_radicalization] / 100§!\n-------------\nUnfortunately, not everyone in Italy is as devoted to the fascist cause as our Duce and his loyal supporters. Ever since the March on Rome, there have been those who have opposed fascism and our regime, and from their opposition came a decades-long conflict. The more our populace radicalizes in favor of these anti-fascist ideals, the more powerful and organized these radical militants become. With Ciano's regime currently struggling to find support, it is crucial that we ensure the populace does not radicalize further, or four decades of fascism may collapse before our very eyes."

