natunity.11.t:0 "Placeholder Title"
natunity.11.desc:0 "Some guy marched into the room of some other guy, "I'm sorry sir, but we're gonna have to get political..."\n\n"What do you mean?" said the guy sitting at his desk, playing Italy. "It's just that this mechanic, pillars of power, need the player too choose one of 3 paths to work.", said the one who marched in to the room seconds ago\n\n"I see", said the guy sitting at his desk, "I need help deciding which of them to choose, could you please rate them from cringe to based."\n\n"...this is Italy sir, they're all cringe", he replied"
natunity.11.a:0 "Left"
natunity.11.b:0 "Center"
natunity.11.c:0 "Right"

natunity.12.t: "The Men in Black"
natunity.12.desc: "While the King may have many other issues demanding his attention, the issue of the Blackshirts remains one of the most pressing. After all, it has been intolerable for many that such a powerful paramilitary group remains a threat to our delicate government. A variety of proposals from across the political spectrum for what to do with the remaining Blackshirts have reached the King and his advisors who must now make the hard decisions.\n\nThe Left, naturally, would prefer to fully disband the Blackshirts and put their leadership on trial as criminals. This would raise tensions significantly and greatly upset the Right who may view the King as caving to the inappropriate demands of the Left while the center may view it as an example of overreach and immoderation.\n\nThe Center would prefer that the Blackshirts simply be quietly disbanded, neatly avoiding the spectacle of a public trial that may play in the Blackshirts' favor or unnecessarily upset more volatile elements of the right. While this proposal may not overly upset anyone, it certainly does not please many and may chill the peoples' democratic fervor as they watch us compromise with thugs like the Blackshirts.\n\nFinally, the Right would suggest that the more "respectable" members of the Blackshirts could simply be folded into the Armed Forces. This option would please the Right and avoid stirring up problems on that side of the political spectrum, but Blackshirts in army uniforms will surely draw sounds of concern from the center as well as howls of outrage from the Left. Whichever of these proposals he adopts, the King must tread carefully as the road ahead is treacherous and mishandling the Blackshirts may exacerbate the situation."
natunity.12.a: "The Blackshirts will face trial."
natunity.12.b: "The King prefers a moderate solution."
natunity.12.c: "The army will have a few more recruits!"

natunity.13.t: "Rot in Our Foundations"
natunity.13.desc: "Fascism left its mark on every inch of Italy but the bureaucracy was one of the most affected sectors of society. Even as Italy turns away from fascism, many throughout the government are upset by or violently opposed to the nation's new direction. Dissidents in such positions of power may pose a serious threat to Italy's security and the King must act. Proposals from every major faction have reached his desk.\n\nThe Left view the bureaucracy as being rotten from top to bottom and their solution is a total one: a complete dissolution and rebuilding of the bureaucracy. This is a radical option but may be the best way to wrest the power of the state away from the remaining fascists but will certainly upset moderates and enrage the Right.\n\nThe Center have their own proposal, a short list of major fascists remaining in public administration who ought to be removed. The Center's plan would pick off ringleaders of fascism from the bureaucracy but leave many more "lowly" fascists in their place. This plan would weaken the fascists' hold over our institutions while not overly upsetting the Right and provoking unnecessary controversy.\n\nFinally, the Right would simply ask bureaucrats to denounce fascism and the PNF in order to retain their positions. Only a few true fanatics would refuse while many more crypto-fascists would mouth the required platitudes and then remain in their positions, potentially posing a security threat. This proposal would greatly upset the Left but would leave the Right largely mollified.  Whichever proposal he selects, the King must choose carefully, lest he leave Italy without a bureaucracy entirely or one packed with vengeful traitors."
natunity.13.a: "A complete renovation!"
natunity.13.b: "Fire only the worst troublemakers."
natunity.13.c: "Require loyalty oaths."

natunity.14.t: "Approaching the Vatican"
natunity.14.desc: "The next issue the National Unity Government must tackle is Italy's relationship with the Vatican. In a heavily-Catholic country like Italy, the government must tread carefully around the Church lest it raise the ire of the Italian faithful. The separate political currents have all made their cases to the government for one course of action or another though the decision remains with the King and his councillors to decide.\n\nThe Left has proposed that we simply maintain our current relationship but make no immediate guarantees. Many within the government suspect the Left hopes that inaction with regard to the Vatican now may well result in a more secular Italy in the future. Siding with the Left would avoid making unnecessary commitments but would severely disappoint many conservative and religious Italians. The Center would prefer much stronger ties with the Church, a natural inclination given the strong streak of Christian Democracy in the Center current. This may upset some on the Left and Right but may garner the support of more faithful Italians as well as potentially the support of the Church itself.\n\nFinally, the Right is quite pleased with the status quo and would not make any changes to our relationship with the Vatican. Inaction may be tempting but forgoing the opportunity would disappoint many faithful Catholics the country over, not to mention the Church's reaction. As the debate drags on, the King clears his throat and finally cuts the debate short, throwing his support to one current."
natunity.14.a: "The King supports the Left."
natunity.14.b: "The King supports the Center."
natunity.14.c: "The King supports the Right."

natunity.15.t: "Rebuilding the Ivory Towers"
natunity.15.desc: "The universities and academia more broadly are one of the more divisive topics for the government, a surprising fact given the other topics at hand. The Left would encourage ideas and academic trends that the Center call "inappropriate" and the Right call "degenerate and perverse" but would in practice amount to a massive expansion and opening of the Italian university system both in size and in worldview. They would pair this with an immense intellectual liberalization at universities, allowing all sorts of previously-banned theories to circulate once more. The Right dismisses the Left's plan as a lunatic's vision, preferring a few token reforms to keep our universities relatively competitive with our rivals, but hardly stepping away from the harsh standards and outdated practices of the Fascist era that the Left and some in the Center deplore.\n\nThe Center themselves would prefer a more balanced path between the two radical viewpoints. While they would liberalize the curriculum and allow greater liberalization, they would not encourage the same academic trends and styles the Left would, nor would their proposed expansions to academia go as far as the Left would like. The Center's plan would certainly anger the Right and disappoint the Left but it may deliver Italy a strong and decent academia for a new and democratic Italy that does not encourage divisive and radical politics. The decision, as always, falls to the King and his government who settle the issue for the squabbling politicians."
natunity.15.a: "Italy shall have a progressive academia!"
natunity.15.b: "The King prefers the Center's moderate approach."
natunity.15.c: "The King sees little to change in the universities."

natunity.16.t: "The Poisoned Chalice"
natunity.16.desc: "Try as it might, the National Unity Government eventually had to face the grim topic of Italianization. For decades, the Italian Empire had pursued a deliberate policy of colonization and settlement by Italians in the hope of spreading Italian culture across the Mediterranean. The fascist fever dream of a Mediterranean-wide home for the Italian people had turned into an expensive boondoggle that massively inflamed tensions with the natives and, if mishandled, could result in native massacres or the deaths of Italians.\n\nIn a rare moment of unity, passing so quickly that to blink was to miss it, the Left, Right, and Center all agreed that Italianization had to end. The reasons cited were varied, including ethical concerns, financial costs, military practicality as well as the harm it did to Italian relationships with other peoples. Unfortunately for the King and his government, the unity between the political currents ended however where the plans began.\n\nThe Left proposes that we halt all Italianization efforts immediately and evacuate all Italian settlers from areas they had only recently settled. While moving quickly on this issue will resolve the problem quicker, it will certainly be greatly destabilizing at a very fragile time for Italy and the Empire. The Right would prefer that we conduct a slow and gradual withdrawal, hoping that by moving slower the process will be much smoother though the longer our settlers are there the worse the situation becomes. The Center, concerned for the settlers, proposes that settlers only be pulled out if they can be guaranteed fair lives in Italy. Facing a dilemma and radically different approaches, the King cuts the knot for his advisors."
natunity.16.a: "The King favors an immediate withdrawal."
natunity.16.b: "The King's concern for the settlers wins out."
natunity.16.c: "The King prefers a slow withdrawal."

natunity.17.t: "Returning Justice's Scales"
natunity.17.desc: "The High Council of the Judiciary was the main judiciary body of the Kingdom but Mussolini and the fascists effectively marginalized it during their time in power. The Currents all agree that fascists should be removed from the court as being unfit or unsuited to a judicial role. Unfortunately, the politicians disagree on who exactly counts as a fascist for the purpose of removal.\n\nThe Left aver that anyone appointed to the courts during the fascist era counts as a fascist and should be removed from their position. This would remove a great number of fascists and crypto-fascists from the bench and enable a new generation of judges to take their place. This would however be extremely destabilizing and would greatly upset the Right. The Center prefers a case-by-case approach that examines each judge individually. While some crypto-fascists may avoid the dragnet, the Center's approach would clear out a good many fascists. The Center's approach is naturally disappointing to both extremes but avoids the destabilizing effects of the Left's approach. Finally, the Right would remove only the outspoken fascists from the bench, assuredly leaving a great many crypto-fascists and their sympathizers in their positions on the court. This would leave the courts well-staffed and ready to function but may leave some very unsavory characters in positions of power. With the cases made, the King and his advisors withdraw to confer among themselves."
natunity.17.a: "The King opts for total reform."
natunity.17.b: "The King prefers the Center's approach."
natunity.17.c: "The King shall leave the Court in peace."

natunity.18.t: "Sheathing Italy's Sword"
natunity.18.desc: "To say that the Armed Forces were complicit in fascism is an understatement. While the majority of the military's loyalties lay with the King they still obeyed the Duce's orders. Furthermore, Mussolini and his ilk managed to develop a strong segment of fascists within every branch of the services who now pose an enormous threat to our young democracy. The question of what to do with these men is one spoken of in whispers as a sword hangs over the head of every conversant.\n\nThe Left has a strident position of deep investigations of every branch of the Armed Forces in order to root out the fascists. Removing every fascist from the military may make Italian democracy safer but such a radical measure would also play havoc with our military's preparedness and may well radicalize others in the military or on the Right. The Center believes that some investigations and dismissals may be necessary but many things are best left buried lest they upset our allies or turn our people against the state. Finally, the Right would only remove a few scapegoats and otherwise leave the military intact. We would not lose any military capacity and keep many skilled veterans in their positions. However, it may prove unwise to leave fascists in positions of power throughout the military, particularly when democracy is so very vulnerable.\n\nThe weighty decision nearly drives the King and his advisors to distraction as they debate the merits of the various approaches. Keenly aware of the gravity of his decision, King Umberto finally intervened and broke the deadlock in his government."
natunity.18.a: "The King wants full investigations."
natunity.18.b: "The King prefers a delicate approach."
natunity.18.c: "The King sees no need to weaken the Military."

