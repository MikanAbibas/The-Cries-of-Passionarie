natunity.20.t: "Leashing the Spies"
natunity.20.desc: "The OVRA struck fear into the hearts of Italian dissidents and foreign spies for decades. Operating silently and efficiently across the Empire, they were the bane of rebels, misguided nationalists and pakt interlopers. Now, with the transition from fascism, the OVRA will be reformed into the UAR - Reserved Affairs Bureau. The only question is how exactly that reform will proceed and, naturally, the King and his government have been inundated with proposals.\n\nThe Left would support only keeping officers with good track records who did not have a documented history of extreme methods or beliefs. This may result in the loss of many effective intelligence officers but also remove some very dangerous men from positions of great power from which they could menace our fragile state. Diminishing our intelligence agency may also leave us vulnerable to attack by foreign opponents and would certainly upset the right.\n\nThe Right would keep nearly every current OVRA officer in their place, offering up only a few scapegoats to appease the victims. While the new Reserved Affairs Bureau would have the same capability as its predecessor, the Right would leave a great many monsters and fascist-sympathizers in sensitive and powerful positions. The Center would adopt a middle path of moderate investigations that would clear out the worst offenders but would leave many fascists and torturers in place. Given the grave national security implications of the decision, the King weighed each proposal carefully before he made his final decision."
natunity.20.a: "The King shall know the truth."
natunity.20.b: "A moderate investigation is acceptable."
natunity.20.c: "The King opts for a few scapegoats."


