 ITA_POP_Lo_Stato_Support:0 "Overall Lo Stato Support"
 ITA_POP_Lo_Stato_Support_Num:0 "[?ITA_total_stato_support|%Y0]"
 ITA_Ciano_POP_GUI_info_tt:0 "§WWinning over the support of the major pillars of society is what keeps governments in power. The pillars of Italy can be divided into §YIl Popolo§! and §YLo Stato§!, the people and the state. Winning over the support of the people and the state, or rather making sure they don't support §Vthose who want reform§! or §rthose who reject it§!, is what will keep us in power.\n\nThe more £ita_radicalization_texticon §Rradicalized§! society is, the harder it will be to govern. The same goes with the strength of the opposition. As organised as the £ita_internal_opposition_texticon §Lopposition§! may be though, as long as a majority of people either support us or are §gapathetic§! to the government, our position will remain secure."

