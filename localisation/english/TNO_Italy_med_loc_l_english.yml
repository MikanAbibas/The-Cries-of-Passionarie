ITA_bribe_minor_opposition_gerarchi:0 "Bribe Minor Opposition Gerarchi"
ITA_bribe_minor_opposition_gerarchi_desc:0 "The gerarchi are the members of the PNF. While the high-ranking gerarchi will never betray their positions, the lower ranks are more malleable. While Ciano can buy their loyalty, the common people tend to hate bribes, no matter the goal they serve."
ITA_use_royal_palace_contacts:0 "Use Royal Palace Contacts"
ITA_use_royal_palace_contacts_desc:0 "Ciano may be the Duce, but he is also the Prime Minister. He is the king's servant, and a staunch monarchist. Friends with the King himself, Ciano can certainly use the king's connections to influence the Verona Congress and its outcome in his favor."
ITA_promise_everything_you_can:0 "Promise Everything You Can!"
ITA_promise_everything_you_can_desc:0 "Things might look dire for Ciano, but this battle is not yet lost. Ciano can expend much of his influence, and make extravagant promises to the Congress. This dishonesty may sway many fascists to Ciano's side, but the common people are another story."
ITA_send_in_the_police:0 "Send in the Police"
ITA_send_in_the_police_desc:0 "Protestors take to the streets, decrying and disrespecting the Duce, fascism, and all things Italian. To allow the Verona Congress to continue, and to preserve the peace, these protests must be put down. Send in the police, they'll get the job done."
ITA_appeal_to_the_loyal_citizens:0 "Appeal to the Loyal Citizens"
ITA_appeal_to_the_loyal_citizens_desc:0 "In order to win the people's favor back, Ciano must address the nation. A radio address reminding the loyal citizens of Italy what Ciano stands for: stability. The people yearn for stability, and they will side with Ciano if he promises its return."
ITA_send_in_the_blackshirts_ciano:0 "Send in the Blackshirts!"
ITA_send_in_the_blackshirts_ciano_desc:0 "Criminals are causing a rampage on the streets, weakening the government. We need to send the Blackshirts to put this scum back on their place. However, this could also strengthen the aggressive rhetoric of our detractors."

ITA_mission_bribe_minor_opposition_gerarchi:0 "§K(Ciano)§! Bribe Minor Opposition Gerarchi"
ITA_mission_bribe_minor_opposition_gerarchi_desc:0 "The gerarchi are the members of the PNF. While the high-ranking gerarchi will never betray their positions, the lower ranks are more malleable. While Ciano can buy their loyalty, the common people tend to hate bribes, no matter the goal they serve."
