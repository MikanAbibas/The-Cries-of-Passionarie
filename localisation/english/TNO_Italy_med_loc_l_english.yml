 ### decisions

 ITA_repression_expand_colonial_police:0 "Expand colonial police units"
 ITA_repression_expand_colonial_police_desc:0 "For almost a decade, our colonial garrisons have been woefully undermanned and under-equipped due to the incompetence of Ciano and his cronies. This factor has brought to an increase in insurgent activities, especially in Ethiopia and Southern Libya, characterised by large swathes of difficult and depopulated terrain. By expanding our colonial police, and equipping them with modern armored cars, Italo Balbo and Ettore Muti think we should be able to cover more terrain more effectively: this will definitely help in fighting the terrorists."
 ITA_repression_aerial_recon:0 "Perform aerial recon sweeps"
 ITA_repression_aerial_recon_desc:0 "Our colonial domains are large, and their difficult terrain offers plenty of opportunities to hide camps, hideouts, supply caches and emergency refuges that would normally go unnoticed by ordinary road patrols. In Alessandro Pavolini and Niccolò Giani's opinion, regularly performing aerial sweeps will help us locate many such facilities, whose position will be forwarded to our garrisons for cleanup duty, therefore impeding enemy activities across the Empire."
 ITA_repression_deserters:0 "Deserters and turncoats"
 ITA_repression_deserters_desc:0 "The resistance movements in the colonies often relies on local supporters for supplies and protection. While a majority of the people are either neutral or even supportive towards these terrorists, there are many who fear retaliation from Italian authorities, and would gladly sell their supposed "saviours" if it means avoiding such retaliation, and perhaps securing a better life far, far away from their native village: by promising money and amnesty to any who will give us reliable information about terrorist activities, Italo Balbo and Alessandro Pavolini think we'll surely convince at least some of them to help us."
 ITA_repression_agents_in_italy:0 "Increase agents in Italian cities"
 ITA_repression_agents_in_italy_desc:0 "Alas, we cannot resort in the mainland to the same methods we use in the colonies. While far from unjustified given the current situation, the citizens of Rome, Milan, Naples and Turin would hardly appreciate the sight of armored cars and road blocks near their homes: as we need to rebuild our support among the common populace of Italy, Italo balbo suggests we should show more caution in performing anti-terrorism operations in the mainland - plain-clothes agents, sleeper agents and bugs will do the trick without angering the population too much."
 ITA_repression_shakedown:0 "§YAuthorise city-wide shakedowns§!"
 ITA_repression_shakedown_desc:0 "It is evident that our colonial subjects keep supporting the rebels plaguing the countryside. Italo Balbo and Alessandro Pavolini suspect that every home could hide weapons, supplies, even secret passageways and refuges: since random controls have proven insufficient to eradicate the phenomenon, we shall conduct large village or city-wide shakedowns, where large numbers of colonial soldiers will thoroughly control each and every house, and harshly punish those who are found wanting. As the voice spreads, we are confident that the fear of being unable to hide their secrets will be way more effective than a gun pointed to their heads - not that we are in short supply of those, of course."
 ITA_repression_modernise_interrogation:0 "§YModernise interrogation techniques§!"
 ITA_repression_modernise_interrogation_desc:0 "Our interrogators are experts in extracting information from terrorists and enemies of the State, but over the years, this niche - and often underestimated - art has seen dramatic improvements. Traditional methods such as physical pain and electrocution have been surpassed by psychological tortures such as waterboard practice, sleep deprivation and involuntary indoctrination, as the secret services in Germany, Japan and the United States know well: Alessandro Pavolini and Niccolò Giani suggest that updating our equipment and personnel even in faraway colonial detention facilities will surely increase the yield in information - after all, breaking minds is safer and more productive than breaking bodies, and depending on the one doing it, even more pleasurable..."
 ITA_repression_martial_law:0 "§RDeclare martial law§!"
 ITA_repression_martial_law_desc:0 "With the worsening of the terrorist threat, we must consider it very likely that antifascist elements are currently operating throughout the Empire at unprecedented rates. As such, Italo Balbo and Ettore Muti suggest that we need to resort to drastic measures: martial law will be declared across all of our domains, and a strict curfew imposed while the emergency lasts. All movements will be monitored, and all passengers on ships and airplanes thoroughly screened: this will make it much more difficult for the terrorists to operate, and much easier for us to cross-reference data and pinpoint their activities."
 ITA_repression_selective_deportations:0 "§RConduct selective deportations§!"
 ITA_repression_selective_deportations_desc:0 "As Rodolfo Graziani showed us in his two pacifications of Libya, the best way to control a population lies in dividing it, and Niccolò Giani and Alessandro Pavolini support this theory in full. By identifying those groups that are more likely to join the insurgents, and deporting them in places where they will no longer be able to threaten us - such as surveilled camps or, in lack of anything better, the scorching desert - we'll severely impede rebel operations across our colonial domains: when the threat has been contained, they'll be allowed to return to their homes - that is, if we didn't find any connection between them and the resistance."

