 ITA_postmalta_tt.12:0 "A new §YMontenegrin§! division will be mobilized."

 ### Verona Congress Tree ###
 ITA_VC_the_verona_congress:0 "The Verona Congress"
 ITA_VC_the_verona_congress_desc:0 "The Verona Congress is the most important meeting of the Partito Nazionale Fascista since the day of its foundation. Here, all important Gerarchi will meet and discuss in order to find the answer to the question that has been plaguing the party for almost a decade: was Galeazzo Ciano, Mussolini's appointed successor, an effective Duce?\n\nOf course, both sides have their reasons to be in favor or against Ciano, but despite the centrality of this debate, another issue must be kept in mind at all times. The Empire is in danger, from both within and without, and quarreling will not help the cause of fascism: the Council must address the worries and the expectations of the Italian population, or all the gains made in two World Wars may be lost."
 
 ITA_VC_a_matter_of_survival:0 "A Matter of Survival"
 ITA_VC_a_matter_of_survival_desc:0 "For almost a decade, several prominent Gerarchi have endlessly criticized Galeazzo Ciano for his supposed inability to lead the Empire. While normally such voices would have been silenced, the members so-called "Quadrumvirate" are far from unimportant: thanks to their wide support from the lower ranks of the party, they have managed to escape retribution, and now challenge the Duce for his own mantle.\n\nThis is no longer an internal squabble, but a matter of survival that will decide the course the Empire will take in the next decades. The stakes, however, are higher than what it seems: the people are starting to tire of the political infighting, and now demand certainty."
 
 ITA_VC_the_congress_begins:0 "The Congress Begins"
 ITA_VC_the_congress_begins_desc:0 "The time for preparations is over. Both the Duce and his opposers will now fight until one side prevails over the other: the agenda is packed with interventions, motions and proposals that will lay bare the heart of our government, and the Gerarchi will vote on whether they like what they see.\n\nThe Congress itself, however, is not the only battlefield. Across the Empire, both sides face each other in the party buildings and in the streets, and they also face a renewed opposition from parts of society we had believed silenced for good: words may not be the only sharp things flying in Verona, after all..."
 
 ITA_VC_relaunching_the_economy:0 "Relaunching the Economy"
 ITA_VC_relaunching_the_economy_desc:0 "The Italian economy is sluggish, no one can deny that. We all know that the main responsibility for this downturn lays on the German bastards and their accursed dam, but - as Scipio used to say - a man's life is half what befalls him, and half how he reacts to it: the time has come to judge the latter.\n\nGaleazzo Ciano is ready to defend his chosen course of action, while his opposers will undoubtedly criticize him heavily. Several proposals have been laid before the Congress: they wish to see the Italian economy relaunched... or changed completely."
 
 ITA_VC_reforming_the_corporations:0 "Reforming the Corporations"
 ITA_VC_reforming_the_corporations_desc:0 "The corporations are the core actor in the fascist economic doctrine. By combining the expertise of an entire field, and giving them representation within the government through the Chamber of Fasces and Corporation - the reformed Lower Chamber of the Parliament - economy and politics should fuse seamlessly, increasing efficiency and growth: of course, if we are here, it'd because this didn't work in the slightest.\n\nWithin forty years, the corporations have become quagmires of corruption and cronyism. Magnates spend more money in bribes than in upgrading their industries, and as a result, our competitivity is plummeting: Ciano believes that the corporations as they are now are completely unusable, and should be thoroughly reformed, while his opposers claim that it's the Duce's fault that corruption was allowed to spread - the solution, as such, should be to ensure proper governmental control over corporate affairs."
 
 ITA_VC_managing_the_trade_unions:0 "Managing the Trade Unions"
 ITA_VC_managing_the_trade_unions_desc:0 "The fascist solution to the issue of red unions was to create the Confederazione Nazionale Corporazioni Sindacali. By turning the unions into one of the corporations orbiting in the fascist economic theory, workers would have slowly trickled away from socialism to embrace fascist unionism, and its benefits: sadly, by what the OVRA reports, the reds are more active than ever.\n\nIt is evident that the CNCS is inadequate to its task. Our Duce would like to see it thoroughly reformed and reduced in size, but his opposers claim the contrary: expanding it and giving it more autonomy, especially with regard to the Opera Nazionale Dopolavoro and other recreational and propaganda initiatives, would make the CNCS much more attractive compared to the red unions."
 
 ITA_VC_the_role_of_the_iri:0 "The Role of the IRI"
 ITA_VC_the_role_of_the_iri_desc:0 "The Istituto per la Ricostruzione Industriale was created in 1933 to rebuild the Italian economy after the Great Depression struck the country. After thirty years, it has become the lifeline for many business, directly owning hundreds of subsidiaries and indirectly funding many, many others: while a boon for our economy, this has also plagued the institution with bribery.\n\nAs the economy keeps slowly recovering, the issue of the IRI's reform has come to the Council. Ciano and his supporters claim that the institute should be made more independent from the government, in order to avoid inefficient, politically-motivated expenditures, while his critics denounce this as wrong: the economy - they claim - must go where the State points, not the contrary."
 
 ITA_VC_rebuilding_fascism:0 "Rebuilding Fascism"
 ITA_VC_rebuilding_fascism_desc:0 "More than forty years have passed since the fateful March on Rome, and it shows. Power is always unkind to the ones wielding it, and our regime is no exception to this simple rule: corruption, inefficiency and cronyism mar not just the machine of the State, but also the Party's own inner workings, something that must be addressed.\n\nOf course, the Duce has all intentions of claiming the current sorry state of the PNF is the opposition's fault. He will undoubtedly try to remove his opposers and install men loyal to him, while his opposers have the exact opposite goal: Ciano's weak hold over the party must end, they say, and they will usher in a new age for fascism."
 
 ITA_VC_rethinking_the_blackshirts:0 "Rethinking the Blackshirts"
 ITA_VC_rethinking_the_blackshirts_desc:0 "The Camicie Nere, officially known as the MVSN (Voluntary Militia for National Security), are the heirs of the 1919 Fasci di Combattimento. Well-known for their iconic uniforms, they have slowly evolved from the paramilitary arm of the PNF to a mixture between a police force and a volunteer military unit: of course, this has not been smooth on the fabric of society.\n\nFanatically loyal to their idea of fascism, they often resort to violence against perceived "traitors" of the State, and while protecting our regime is our most pressing issue, their excesses are causing problems. The Duce would prefer for the Blackshirts to return to their intended role as security force for the party, but many Gerarchi are of the opposite idea: the regime is under unprecedented attack, and the MVSN is instrumental to keeping the enemies in check, no matter the means used."
 
 ITA_VC_reviewing_the_special_tribunals:0 "Reviewing the Special Tribunals"
 ITA_VC_reviewing_the_special_tribunals_desc:0 "The MVSN is not the only instrument fascism uses to protect itself from the red hydra and decadent democrats. Special tribunals - chief among them the Tribunale Speciale per la Sicurezza dello Stato - judge those suspected of crimes against the State, too heinous to be left to ordinary courts, which could... fail to inflict the correct punishment: while laudable, in the end this has attracted the ire of the judiciary powers for their blatant violation of Constitutional rights and guarantees.\n\nWith the judiciary's ties to the King, the matter of reforming the special tribunals has come to the Council's attention. The Duce, wishing to remain in Umberto's good graces, is favorable to a reform of the special tribunals which would see them reduced in number, and their jurisdiction restricted only to high treason, but of course many object to this: in difficult times such as these, we should not willingly blind and handcuff ourselves, lest we are caught by surprise in the event of an uprising..."
 
 ITA_VC_the_grand_council_fascism:0 "The Grand Council Fascism"
 ITA_VC_the_grand_council_fascism_desc:0 "The GCDF is the most important assembly of the fascist party. Formed by representatives from the entirety of the Empire, and the most important Gerarchi, many say that this - and not the broken shell of Montecitorio - is Italy's real Parliament: true or not, it matters little, but the fact is that His Majesty - constantly worried about upholding the Albertine Statute - has recently started quietly complaining about the situation.\n\nThe question, then, is whether to listen or not to the King. Galeazzo Ciano wishes not to alienate the King's important support, and as such has proposed that the GCDF be kept separate from State affairs at least in form, while his opposers object: the Constitution notwithstanding, the Grand Council is the regime's keystone, and it cannot be kept outside of the government, even if it miffs the King - some would say, especially if it miffs the King..."
 
 ITA_VC_repairing_society:0 "Repairing Society"
 ITA_VC_repairing_society_desc:0 "The Italian society has been left broken and battered by the Atlantropa crisis and ensuing effects. Poverty and unemployment run rampant, and birth rate is slowing down constantly: the situation must be addressed now, or the Empire might sink in the long run compared to the other world powers.\n\nOf course, while everyone agrees over the fact that the Italian people must be helped, the question is about the method. Ciano and his supporters wish to lessen the weight of the administration, while his opposers claim this is exactly what brought us there in the first place: fascism must be present in every facet of society, and the people must accept it wholeheartedly... or be forced to."
 
 ITA_VC_revising_the_minculpop:0 "Revising the MinCulPop"
 ITA_VC_revising_the_minculpop_desc:0 "The Ministero per la Cultura Popolare is the main arm of the government-run propaganda. With thousands of journalists, anchormen, directors and other experts of communication, it ensures that the fascist regime is properly celebrated and glorified: of course, if we are here, it means that their work was less than commendable.\n\nThe fact is that such degree of propaganda will naturally sort a poor effect, and the question is about what to do with the Ministry. The Duce wishes to cut most of the MinCulPop and transform it into a lighter, more functional institution, while the Quadrumvirate is strongly opposed to such a move: the Ministry - they say - is instrumental to the regime's survival, and it should be turned into an effective institution not with cuts, but with a thorough reform."
 
 ITA_VC_expanding_the_youth_associations:0 "Expanding the Youth Associations"
 ITA_VC_expanding_the_youth_associations_desc:0 "The youth associations are a cornerstone of fascist education. From the Figli della Lupa all the way to the Avanguardisti, young boys and - through their female equivalents - girls are educated to fascist values: the problem is that, in recent years, many have complained that the associations are a relic of the past, teaching of war in an age where war is slowly being forgotten.\n\nWith adhesions plummeting, the matter of a reform of the sector has been brought before the Council. The Duce's supporters would rather reform the youth associations into something more in line with the times, lighter and privately-organized, while their detractors recoil in disgust: citizens must learn to become fascist from birth, and as such inscription and attendance should be made mandatory."
 
 ITA_VC_the_colonial_empire:0 "The Colonial Empire"
 ITA_VC_the_colonial_empire_desc:0 "After the last war, our colonial possessions have expanded almost uncontrollably. Of course, this has been far from beneficial for our bureaucracy and garrisons, which are now outstretched and undersupplied: we need to address the situation quickly, before a full-scale uprising takes place.\n\nWhile everyone agrees over the need for reform, few are in accord over the actual extent of said reforms. The Duce has proposed the abandonment of the old colonial policy in favor of fostering relationship with a native middle class, which would considerably lessen the weight on our bureaucracy: of course, the opposition disagrees completely, claiming that this would be the beginning of the fall, and instead support a reform of the bureaucracy to make it more functional."
 
 ITA_VC_the_congress_ends:0 "The Congress Ends"
 ITA_VC_the_congress_ends_desc:0 "Finally, all matters have been voted on, and the Verona Congress is coming to its end. The Gerarchi will meet for a final vote, the most important of all: the time has come to judge not the policies, but the man himself.\n\nGaleazzo Ciano will make his final address to the assembly, while his opposition is sure to contest him to the bitter end. The time has come for the final clash: at the end of the vote, we will know who the Duce of Italy will be..."
 
 ITA_VC_a_new_italy:0 "A New Italy"
 ITA_VC_a_new_italy_desc:0 "The Congress is over. Whatever has happened, it's now in the past: the time to discuss, fight and vote has ended, now the nation must move forward, and live with the consequences of its choice.\n\nViva l'Italia!"
 
 ## Space Stuff ##

 ITA_project_prometeo_tt:0 "We shall initiate §YProject Prometeo§!, the Duce's bold endeavour to place an Italian in orbit, for the yearly cost of §R$100 million§!, granting §G+1% research speed§!"
 ITA_project_prometeo_dynamic_modifier:0 "Project Prometeo"
 ITA_project_prometeo_dynamic_modifier_desc:0 "For more than a decade, the Italian nation has gazed in envy at the space programs of the superpowers and despaired. While Glenn and Köllner found their place among the stars, Italy was only finding her place in the dirt. The recent success of the Europa 1 rocket may have made the headlines, but it is a far cry from the daring expeditions undertaken by steely-eyed American, German, or Japanese missilemen. Italy has a long way to go before it can truly cal itself a spacefaring superpower…\n\n…but not if the Duce has anything to say about it. Project Prometeo, his latest "moon shot," aims to replicate the early stages of the Space Race by placing an Italian astronaut in orbit using a one-man capsule similar to that of America's Project Mercury. It is a daring proposal that many in the Duce's government find either brilliant or insane. Like the flight of Icarus, Italy may very well end up flying too close to the Sun… but if it succeeds, §Rnone shall deny her place in it any longer.§!"
 ITA_fascisti_nello_spazio:0 "Fascisti nello Spazio"
 ITA_fascisti_nello_spazio_desc:0 "Italy has achieved the impossible - becoming the first non-superpower to place a man in orbit through a vessel of her own creation. Now a spacefaring nation, she finds that she cannot be content to rest on her laurels. Already, plans are being devised for the development of a proper multi-person capsule for the further exploration of low Earth orbit, and there are even talks of Italy beginning construction of her own space station by the end of the next decade. Whatever truth there is to these claims, one thing is certain: §RItaly has secured its destiny amongst the stars, and it is the Fascist flame that guides her ever upwards.§!"

 ## demitaly events ##

 demitaly_med.11.t:0 "The King's Speech"
 demitaly_med.11.d:0 "In a speech broadcasted through national radio, His Majesty King Umberto II di Savoia, King of Italy, Emperor of Ethiopia, First Marshal of the Empire, has spoken about the recent modifications of the Albertine Statute, Italy's constitutional law. In particular, the King gracefully accepted and welcomed the new limitations imposed by law on his person, and swore to comply with them in order to "follow the will of the Italian nation, which I serve".\n\nIn particular, the recent modifications, imposed by Ciano and agreed upon by King Umberto, remove the king's power to appoint ministers, to dissolve Parliament, and make it impossible for His Majesty to veto laws in Parliament. From now on, unless these new laws are changed again by Parliament, the King will effectively lose all political power in Italy, and continue existing as a mere figurehead.\n\nIt was already well known that Umberto II wasn't very engaged with the political matters of the Kingdom, and that he enjoyed mutual trust and friendship with Ciano; however, few would have speculated that the King would willingly renounce all political power for him and his descendants. Strangely, this news has been welcomed by both the left and the right wing, as many fascists still hold true to the original republican ideals of the PNF."
 demitaly_med.11.a:0 "Monarchies are a relic of the past."
 
 demitaly_med.12.t:0 "The End of the Gran Consiglio"
 demitaly_med.12.d:0 "Today, Ciano has passed what might be his most controversial law, the one that would dissolve the Gran Consiglio del Fascismo, the most important executive body of the fascist regime. The Grand Council of Fascism won't be the only organism that will be dissolved, but with it the various fascist unions and syndicates, the MVSN, and several others, will be eliminated.\n\nThis is so far the most serious and decisive blow that Ciano has dealt to the fascist power structure, effectively striking at the heart of the fascist regime in the name of a renewed democracy. Of course, many conservative and pro-fascist representatives voiced harsh dissent, but the news were welcomed by large strata of Italian society which are largely in favor of Ciano's reforms.\n\nThe Grand Council will be replaced by a cabinet of ministers, appointed by a Prime Minister who will be in turn elected by Parliament. This is the first serious step towards the creation of a new democratic order in Italy, and the media speculate that it is only a matter of time before elections and full democratization come to the country."
 demitaly_med.12.a:0 "It was about time"
 
 demitaly_med.13.t:0 "Ciano Announces a Democratic Camera"
 demitaly_med.13.d:0 "The Italian lower house, since 1939, has been represented by the Camera dei Fasci e delle Corporazioni, a non-elected assembly made up of important representatives of the regime, in theory it was supposed to be the main organ of the fascist political edifice, but in practice it was filled by yesmen who did nothing more than put a rubber stamp on Mussolini's orders. Ciano has demanded the dissolution of the Camera dei Fasci e delle Corporazioni, which will be replaced by a democratically elected Camera dei Deputati.\n\nThe new Camera will also function in tandem with the Senate in a regime of perfect bicameralism, this reforms was put in place by Ciano to ensure that in order to change laws any party must hold a majority in both the upper and the lower chamber of Parliament. It is clear that Ciano's goal isn't simply to dismantle fascism, but also to make sure that it doesn't come back any time soon.\n\nAs another key element of the fascist regime disappears from Italy, to be replaced by a democratic legislative body, some are already starting to get ready for the new elections. Many are still skeptical about Ciano's democratization of the country, but there's no denying that the Duce wants to see it through to the end."
 demitaly_med.13.a:0 "Ciano is a determined man, it seems"
 
 demitaly_med.14.t:0 "The Reset of the Senate"
 demitaly_med.14.d:0 "The Senate, one of the few pre-fascist political organisms that was left mostly untouched by Mussolini's restructuring of Italian politics, is still however packed full by senators-for-life appointed by the former Duce, remarkably, just in 1939, 212 people were made senators from a decree signed by the King, who was strong-armed by Mussolini. Ciano has ordered that all senators-for-life will lose their status after the coming elections, thus ensuring a full "reset" of the Senate.\n\nNo exceptions were made to this rule, in order to avoid adding even more controversy to a decision that is already extremely divisive, the Senate, as the upper chamber of the Italian kingdom, is the most prestigious and respected political body of the State. Ciano has however remarked multiple times that there can be no democracy if the upper chamber is still packed with non-democratically elected representatives.\n\nBy now, it is pretty certain that the date of the election will be announced soon, and several parties and political movements are already starting to form, as the different strata and groups of Italian society start to look for those who could protect their interests. International media are still amazed at Ciano's push towards democracy, the first such case in a fascist country."
 demitaly_med.14.a:0 "Out with the old, in with the new."
 
 demitaly_med.15.t:0 "Loosening the Noose"
 demitaly_med.15.d:0 "From the day Mussolini marched on Rome, fascism, even its extreme forms practiced by the German Reich and its spawn, had become a mainstream ideology, prevalent in every facet of Italian society. No more clearly could this be seen than in the Italian Empire's sole legal political party: the Partito Nazionale Fascista. Through their dominance over Italian politics, they had ensured that fascism would reign unimpeded throughout all of Italy.\n\nThe Duce knew that any marginally successful attempt at democracy would need to limit the all-encompassing power the party enjoyed over the Italian Empire's politics. This task, however, was an enormous challenge; the party would resist any and all attempts to reel in its power, even if said attempts were coming directly from the Duce. Regardless, the noose which currently rests over any prospective Italian democracy would need to be removed with expediency and care. Anything less, and the result would be a simple rebranding of the fascist regime.\n\nCiano thought for a moment. Of course, to begin, he would be required to remove the more extreme proponents of fascism in his party, the hardliners. They shall be cast off into the unknown, and their ideals with them. Then of course, annoyances such as Scorza would have to be dealt with. He had a few, as he called it, "fun" ideas in that regard. Finally, the threat posed by the Milizia Volontaria per la Sicurezza Nazionale, or alternatively, the Blackshirts, would need to be eliminated. The militia's efforts were no longer needed, and their desperate attempts to sustain the regime, through harassing and even killing political dissidents only served to hamper any potential growth of democracy in the Italian Empire.\n\nThe Duce perched on a windowsill overlooking Rome. No doubt, this would be a long and arduous task, but in time, the Party would fall. He felt a pang of sadness knowing he would be destroying the very thing that brought him the power he now wields, but he knew that he would be willing to do whatever was necessary to achieve the safety and security of Italy."
 demitaly_med.15.a:0 "Ending fascism, one step at a time."
 
 demitaly_med.16.t:0 "Scorza's New Job"
 demitaly_med.16.d:0 "His faction shattered, his attempted coup of the PNF foiled, Scorza has been much quieter since the Verona Congress, stepping down from the position of Secretary of the PNF and being content to live as just another fascist uniform among many others. However, in his wisdom, the Duce has decided that Scorza's talent was wasted in Italy, and decided to assign him to a delicate and important diplomatic position, as an ambassador to the Caribbean island nation of Saint Kitts and Nevis.\n\nBehaving like a proper fascist, Scorza did not question the order coming from the Duce, and quietly accepted his duty. In his formal letter to him, Ciano urged him to show his devotion to the Italian nation and to the fascist cause by carrying out this task of the utmost geopolitical importance. Scorza will have to safeguard and uphold the Italian interests in the islands, making sure that the flame of the fascist revolution shines its light even half a world away.\n\nSince Ciano knew that Scorza would be so eager to complete this task, he didn't wait too long to send him on his way; this also meant that the few friends and associates Scorza still has in the PNF knew of his departure only when he was inside a plane above the Atlantic Ocean, but sometimes such things are inevitable. The whole nation of Italy places its hopes in Scorza, and the population will surely devote their thoughts to him and his mission."
 demitaly_med.16.a:0 "So long, and good luck!"
 
 demitaly_med.20.t:0 "Ciano Formally Steps Down"
 demitaly_med.20.d:0 "Today, His Majesty King Umberto II di Savoia, King of Italy, Emperor of Ethiopia, First Marshal of the Empire, has received and accepted the letter from His Excellency Galeazzo Ciano, Count of Cortellazzo and Buccari, First Marshal of the Empire, in which the latter formally resigned his position of Prime Minister of the country. The King has gracefully accepted to preside over the transition period, acting as the supreme executive power in Italy until the elections have taken place.\n\nThis moment marks a historic landmark for Italy, and will forever be remembered as the day when the birthplace of fascism decided to abandon that system, and return to democracy. In the shade of the great monuments of the fascist era, such as the EUR district in Rome, large crowds celebrate the beginning of a new era, which will mean freedom, prosperity and happiness for all.\n\nOptimism is universal at this point, as all major political factions think they have a good shot at winning the elections; the predictions made by media are completely inconsistent, with some polls projecting a victory for the liberals, others betting on the leftists, and a few are even adamant that it will be the neo-fascists who will secure the mandate. No one knows who will win the battle of democracy, but one thing is certain, Ciano, the Duce that ended fascism, has won his own battle."
 demitaly_med.20.a:0 "Praise Ciano!"
 
 
 
