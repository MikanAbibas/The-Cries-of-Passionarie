IME_ITW.1.t: "A Request from Rome"
IME_ITW.1.d: "Chiesa looked over the map sprawled out on the table. Rome had just requested that his administration should deploy troops into Iraq in order to stabilize the current regime. He looked to Liuzzi, who stood across the table, "What are your thoughts on all of this?"\n\n"Well, sir, it makes sense. Having a stable Iraq could prove useful, and help us defend ourselves from potential threats."\n\n"The Turkish border has been getting more active lately... but I feel like we're spreading ourselves too thin here."\n\n"Manpower is the limiting factor here. I'm not sure we can spare the men, but the orders are straight from Rome, sir. It would be wise to obey them, but it's your decision, sir."
IME_ITW.1.a: "Rome says send the troops, so we'll send them."
IME_ITW.1.b: "Our job is to protect the Levant, not Iraq."

IME_ITW.2.t: "Troops Sent to Iraq"
IME_ITW.2.d: "After requesting that the Governatorato della Palestina send troops to Iraq, we did not receive word back from Chiesa immediately. However, word has reached us that the Iraqi situation is beginning to improve due to the assistance provided by Italian reinforcements. It appears Chiesa has obeyed the request and redirected men to help stabilize the situation in the region.\n\nChiesa's administration has notified us that the maneuver has stretched his troops thin, and that he could not spare more men without severely compromising the Levant's stability. However, if the Iraqi government can use Chiesa's troops effectively, then this will have been worth it. A strong Iraq means a strong Italian grip on the Middle East."
IME_ITW.2.a: "Glad to see that Chiesa can still be depended upon."

IME_ITW.3.t: "The Levant Refuses Our Request"
IME_ITW.3.d: "After requesting that the Governatorato della Palestina send troops to help stabilize Iraq, we did not receive word back from Chiesa immediately. In fact, the continued request for assistance from the Iraqi government seemed to imply that Chiesa had defied our request.\n\nAfter requesting to learn why, exactly, he refused to send troops to Iraq, Chiesa stated that his administration lacked the manpower to spare such a force, and that all of their troops were needed to ensure the Levant's continued stability and safety. Further requests for Chiesa to redeploy forces to help the Iraqi regime have failed to change his position. If Chiesa were not so integral to the Levant administration, we would have good reason to fire him for such an act. Unfortunately, we must simply accept that Iraq will not receive the reinforcements they keep requesting until an alternative solution could be devised."
IME_ITW.3.a: "Iraq will fight alone, apparently."

