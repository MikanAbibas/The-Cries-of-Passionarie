 #Ciano Cabinet
 ITA_Alessandro_Pavolini_hog:0 "Alessandro Pavolini"
 ITA_Alessandro_Pavolini:0 "Alessandro Pavolini"
 ITA_Alessandro_Pavolini_hog_desc:0 "§LAlessandro Pavolini, sneeringly nicknamed "the Superfascist" for his intransigence and extremism by his adversaries in the PNF, does little to hide the fact that he takes pride in the epithet others gave him. Born in 1903 into a family of the upper bourgeoisie in Firenze and receiving a classical education, Pavolini was already active in journalism in his teenage years, publishing pieces in favour of Italian intervention in WW1, before joining the fascist movement in 1920. Later, Pavolini became one of the most prominent leaders of the PNF in all of Tuscany, but his ambition would drive him much further beyond.\n\nPavolini's true rise began thanks to his friendship with his mentor Galeazzo Ciano, with whom he fought side by side in the Ethiopian campaign, and in the 1930s he took on ever more prominent roles in the cultural and propaganda apparatus of the regime before finally becoming head of the MinCulPop in 1939. Pavolini was in many ways the brain behind the many public faces of fascism, directing the regime aligned press, mass media and cinema, and presenting himself as a refined and affable intellectual while harboring an ever more fanatical devotion to fascism and the Duce.\n\nAfter Mussolini's much mourned departure, Pavolini's relationship with Ciano slowly but inexorably deteriorated, but the Superfascist's ascent did not. Commanding the loyalty of the radical wing of the PNF, dissatisfied with Ciano's cautious and weak-wristed policies, Pavolini managed to strongarm his nomination to Secretary of the PNF, but not even that could satisfy his drive for ever greater power and control...§!"

 ITA_Dino_Grandi:0 "Dino Grandi"
 ITA_Dino_Grandi_for_desc:0 "§LDino Grandi, the Count of Mordano, has been with fascism since the very beginning. Having met the late Benito Mussolini in 1914, Grandi was quickly taken in by Mussolini's fiery rhetoric, and abandoned his original stance of socialism. After serving in World War One, he joined the Blackshirts at age 25, and was one of 35 fascist delegates elected to the Chamber of Deputies, along with Mussolini. After that, he became a prime target for the leftists, surviving an attempt on his life in 1920 and having his studio destroyed numerous times.\n\nForty years later, Grandi has never lost faith in the fascist cause, and still supports it ardently. As the foreign minister, he boasts to other diplomats that Italian fascism will never fall, and that the first forty years of fascism were simply "the beginning of a thousand-year golden age." However, the world is changing, and millions of Italians are now deeply opposed to fascism. Whether Grandi, one of the Old Guard and a founding member of fascism, will remain in power remains to be seen.§!"
 
 ITA_Giacomo_Acerbo:0 "Giacomo Acerbo"
 ITA_Giacomo_Acerbo_eco_desc:0 "§LGiacomo Acerbo. Baron of Aterbo, fascist economist, and author of the eponymous Acerbo Laws, which empowers any Duce to pass any laws he pleases. What's left to say about this man that has not already been said? Born in 1888 to the local nobility of the town of Loreto Aprutino, his membership with the Freemasons led him to be a staunch believer of Italian Irredentism. He volunteered to fight in World War One, and won himself three silver medals for military valor and was promoted to the rank of Captain. Upon leaving the Freemasons in 1923 after Mussolini banned masonic membership, Acerbo was the mediator between the Blackshirts and the local Conservative forces. In November of 1924, after Mussolini's coup, Acerbo drafted and passed the Acerbo Laws, one of the most influential bills in Italian history.\n\n38 years later, Acerbo is still working in the Italian government as an economist, his conviction of fascism even more unshakeable due to Italy's incredible success. However, Italy's liberalizing political scene has opened up a flood of criticism upon him and his laws, with critics calling them the driving force behind Italy's political stagnation after Mussolini's death. If Italian fascism continues to fade, it will surely spell doom for him and his creation.§!"
 
 ITA_Giovanni_De_Lorenzo:0 "Giovanni De Lorenzo"
 ITA_Giovanni_De_Lorenzo_sec_desc:0 "§LThe head of the SIFAR, the Commander General of the Carabinieri, and the ultimate Italian spymaster, Giovanni De Lorenzo is possibly the most influential man in Italy, second only to Duce Ciano. Born in Sicily in 1907, he relocated to the city of Genoa with his father. He became an artillery officer, and served with the German forces on the frontlines of the Soviet Union during the Second World War. He won a Silver Medal of Military Valor, and was later promoted to the rank of Brigadier General in 1954.\n\nIn 1957, he was promoted again to the Head of SIFAR, the Italian Secret Military Police. This position offered him lucrative opportunities to make connections and to obtain secrets. During his first years, he also formed a close personal friendship with Enrico Mattei, the founder and CEO of the massive oil conglomerate ENI. De Lorenzo used his position to draw up files of prominent people from all political parties, institutions, and social groups. As of 1962, he has more than 117,000 different files on different people, giving him the unmatched power to monitor everything and everyone that is prominent in Italian society. He has also been newly promoted to head the Carabinieri, the Italian police force, which, combined with the SIFAR Files, gives him unprecedented control over the security of the Italian state. What he will choose to do with all of the information is unknown, however, as many fascists accuse him of not being dedicated enough to the fascist cause. Whatever the case may be, De Lorenzo holds enormous sway over the government and over Italian society in general, and is Ciano's number one man to fix any problems that may arise within Italy, in whatever way he pleases.§!"

