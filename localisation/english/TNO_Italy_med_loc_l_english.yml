 # Events
 
 CD_med.1.t:0 "The Domus Mariae Congress" # Domus Mariae
 CD_med.1.d:0 "Now that the post-victory euphoria has subsided, the Democrazia Cristiana must actually begin the work of governing a country that has been steeped in fascism for decades. What's more, the problem with big-tent parties is that the many different factions within the party have different ideas as to what that governing should entail.\n\nRealizing this, incoming prime minister Aldo Moro, himself a progressive but also a pragmatist, has called for a party congress at the Domus Mariae Hotel in Rome, in order to determine how he will take the party forward into this new era for Italy.\n\nIn the hotel's conference room, party leaders and officials bandy words as they make their case for why their vision for Italy is the best path for the party, whilst Moro looks on from the center of the front table.\n\nThe frontmen of the liberal conservative Dorotei faction, Mariano Rumor and Emilio Colombo, speak at length about the need for unity, and that the party must not rock the boat too much right off the bat. After all, the party wants to 'stay' in government, and Rome wasn't built in a day. To say nothing of the fact that many DC MPs, and the DC voting base, skew conservative.\n\nOn the other side of the aisle, progressive firebrand and close confidant of Moro, Amintore Fanfani, gives an impassioned sermon on the need for reform NOW, emphasizing the threat posed by Italy's ally-turned-enemy to the north. Italy must be strong and free, and there is no time for an incremental approach.\n\nAs the speeches wind down, Moro stands up, causing silence in the room. Deep in thought, Moro clears his throat, then turns and begins walking towards the table of. . ."
 CD_med.1.a:0 "Progressive firebrand, Amintore Fanfani." # Liberals
 CD_med.1.b:0 "Dorotei leaders Rumor and Colombo." # Conservatives
 
 CD_med.2.t:0 "Cerchiobottismo" # cherchiobottismo
 CD_med.2.d:0 "To run with the hare, and hunt with the hounds.\n\nAldo Moro has made the decision to hear out the large, influential conservative faction of Democrazia Cristiana. After all, DC is, at its core, a party of the center. To go too far in one direction or another will only lead to splintering. People say you can't please everyone, but that does not mean we can't try to please as many as possible!\n\nHowever, whilst the policy of fence-sitting and never making a clear choice has worked well until now, Moro must now make a choice of his own. How should DC govern and work in parliament?\n\nSome argue that the best way forward is to make the already big tent of DC even bigger. By cutting deals with the various small parties in parliament and bringing them into the coalition, Moro can broaden DC's appeal and make it so that it is far easier to STAY in government. However, this would undoubtedly end up diluting DC's agenda and legislative program.\n\nHowever, DC is big enough that it could potentially go it alone as a 'Party of Catholics'. By unifying the party from within, Moro can make it stronger and a more cohesive whole. This means that, without having to make as many concessions to the smaller parties, DC can implement its agenda without interference. This will mean a more effective legislative program. Of course, this also means that it will be harder to REMAIN in government, as DC's appeal will not be as broad.\n\nWhat is the best path forward?"
 CD_med.2.a:0 "Democrazia Cristiana will become the biggest tent!" # big tent
 CD_med.2.b:0 "Democrazia Cristiana is the Party of Catholics!" # catholics
 
 CD_med.3.t:0 "Approaching the Monarchists" # attempt attackment with Italian Democratic Party of Monarchist Unity
 CD_med.3.d:0 "The Italian Democratic Party of Monarchist Unity, or PDIUM for short, is one of the many new Italian parties that have obtained seats in Parliament. While fairly small in comparison to the three major parties, every bit helps in our efforts to see our vision of Italy through to success. The PDIUM is a fairly conservative party, but what matters to them the most is the maintenance of the Italian Monarchy, which we have no reason to abolish.\n\nKnowing this, and combined with a few concessions, we can attach and are in the process of adding the PDIUM to our parliamentary coalition. The careful art of compromise that Aldo Moro has pulled off has even managed to leave the liberal side of our party content with the addition of a staunchly conserative party, leaving the unity of the DC strong even as it's voting bloc grows."
 CD_med.3.a:0 "There's room for a King under the Big Tent."
 
 CD_med.4.t:0 "A Conversation between Moderates" # attempt attackment with moderate socdems
 CD_med.4.d:0 "Aldo Moro lowered the cup of coffee to the table and stretched his legs under the desk. He had never doubted that Giuseppe Saragat would want to speak with him, and here they were now - the Social Democrat pretending to read the papers handed to him, and the Christian Democrat waiting patiently. Finally, Saragat nodded almost imperceptibly, and handed the papers back. The men's eyes met. Moro smiled and Saragat smiled back, a gleam in his eyes. "We will be able to cooperate with one another very well, Aldo, and I should have no trouble getting my people to accept," said Saragat finally. "That is excellent to hear, Giuseppe," Moro returned. He offered him a cigarette and the other accepted, so that, with the business concluded in something like an hour, they had little more to do except become used to each other's company. "We are men of the same mind, Giuseppe," said Moro after a while. "You know I must keep company with some men, let's say, of a more conservative mindset than your own." Saragat laughed obligingly, and Moro pressed on. "Yet we have agreed something today which will shape Italy for better. And so the hardliners matter little. I would enjoy hearing what Signoro Nenni has to say once he learns of this meeting."\n\nSaragat grinned, indulging his interlocutor. "Nenni always has something to say, it's what I admire in him," he said quietly. Then something else appeared in his eyes. "But what good will that do Nenni? When next I meet him I will vote against the Fronte Democratico, as we agreed, and you will be Prime Minister." Moro smiled at this, but a shadow seemed to fall over the conversation. It hung in the air for a second, as Moro observed his partner closely. Giuseppe Saragat was a gentleman in every way, and one of the more soft spoken politicians he'd dealt with. And yet there was something about him. Moro understood that if ever the tide turned against the Christian Democrats, Saragat would abandon the 'little compromise' between them without a second thought.\n\nThen Saragat was smiling again, and the moment passed. A few cigarettes and some small talk later, and the two men were shaking hands over the desk. "Thank you for the conversation, Aldo," said Saragat. "Thank you for agreeing to meet," said Moro, and smilingly led him out of the office."
 CD_med.4.a:0 "What a polite man."
 
 CD_med.5.t:0 "Relations with the Socialists" # political current, less hostility to socialists
 CD_med.5.d:0 "The decades of propaganda in Italy has fermented a certain discontent to socialism. Many older people see the socialists as anarchist bomb-throwers who seek to throw Italy into an anarchy like that of Russia, and even Ciano's regime was strictly anti-socialist. This has had the effect of making many of the more centrist and center-right people within the party deeply afraid of the threat of socialism. However, where some see adversity, Aldo Moro sees opportunity.\n\nThe socialists and even the vast majority of the FD as a whole are greatly preferable to the neo-fascists that comprise the BN, as the socialists are fairly committed as of now to the idea of democracy. Knowing this, Moro has seen fit to reach out a proverbial hand to the socialists to show to the populace that socialism is not an alien idology, but merely another faction of democracy.\n\nWhile reluctant at first, it seems that Moro's efforts have paid off, as even the more conservative parts of DC are willing to be more amicable with the various socialists throughout Italy, opening up the possibility for us to work with the socialists more closely in the future."
 CD_med.5.a:0 "Perhaps we can even form a coalition with them one day?"
 
 CD_med.6.t:0 "Primavera" # Primavera 
 CD_med.6.d:0 "The Primavera faction of the DC is, for lack of a better word, a thorn in our side. Their more conservative nature contrasts with the majority of the party, which stands in the center. In fact, they are fairly far to the right for the DC as a whole. However, despite these ideological differences, we should work with them all the same. They are a part of our party after all.\n\nThis was the general consensus among most of the higher ups in the DC, and when discussions began over coordination, most expected finding a consensus to be very difficult. However, to nearly everyone's surprise, the Primavera faction was incredibly willing to cooperate with the rest of the DC! More than that, the representatives from said faction were much more understanding of the nature of such a compromise than expected. While there have been concessions, such as DC support for some of their more moderate viewpoints, the surprisingly simple ending to this issue has left many in the DC happy."
 CD_med.6.a:0 "Compromise does work!"
 
 CD_med.7.t:0 "A Valuable Alliance" # catholic unions 
 CD_med.7.d:0 "The most important part of anyone is their values. If they have horrible values, they are horrible people and vice versa. This is why it is so important to make sure that everyone's values are kind and decent, so that the whole country doesn't fall to chaos. Values are easy enough to implement in a person, by teaching them throughout their childhood, but maintaining said values requires that said person is supported by institutions that embody these values. This is where the Catholic unions come in.\n\nThese unions, primarily CISL, represent everything that a good Catholic worker should aspire to. Furthermore, they promote the strong Catholic values that we as a nation must strive to represent. Thankfully, the Catholic Unions are nowhere near weak, and are contenders in their own rights for the most powerful unions of Italy. We must cement our relations with these unions so that we can completely align ourselves with the proper ideas for our future!"
 CD_med.7.a:0 "The value of values cannot be understated."
 
 CD_med.8.t:0 "High Spirits" # high spirits, bless the CD
 CD_med.8.d:0 "An odd feeling has come over the Italian people. It seems to have spread to nearly everyone, conserative or liberal. It is neither fear, or anger, but happiness. Happiness at the newly forged Italian democracy, but most importantly, happiness at the DC.\n\nOur efforts in governance have paid off tenfold, as public opinion towards the DC have skyrocketed to incredibly high levels. The hopes and morals of our rank-and-file are at a similarly high level, as large numbers of people join the DC, and talk to everyone they know about the good they've done for Italy. Our successful efforts have even led to some of our opposition in the BN and FD to reluctantly admit that we are a competent and respectable option for Italy. This infectious optimism towards the DC seems poised to last a long time, and we have every intention of making sure that there will be no reason for it to fade."
 CD_med.8.a:0 "This bodes well for the future."
 
 CD_med.9.t:0 "The New Classroom" # catholic tradition based??
 CD_med.9.d:0 "As young Pietro walked into his classroom on the first day of the school year, he could not help but notice something different.\n\nThe previous year, to say the classroom had been shabby would have been very charitable. But now, it was as though a metamorphosis had occurred. The room was spotless. The formerly bare bookshelves were now filled with books! Even the desks for pupils, which had been falling apart before, looked like they could actually support the weight of a child!\n\nPietro walked up to the teacher's desk. "Mr. Cirulli," he asked, "where did all this come from?"\n\nMr. Cirulli beamed from ear to ear as he looked down at the young boy. "Why, Pietro, it came from the Confederazione Italiana Sindacati Lavoratori! They have been doing a grand campaign to provide underprivileged schools like ours with the supplies they need to give young Italians like you the education you deserve! Where do you think your parents got your new shoes and books? They certainly couldn't afford to buy them themselves!"\n\nPietro looked down at his shoes. It was true; the shoes were brand new, well-made, and even somewhat stylish! Considering his previous shoes had been falling to pieces at the seams, it was a most welcome surprise when his ecstatic parents had presented him with the new shoes. And the books in his backpack were certainly too expensive for his working-class parents to afford on their own.\n\n"The CISL did all this?"\n\n"Indeed, my boy! That's what motivated me to join the CISL myself! I'm sure your parents feel much the same themselves!"""
 CD_med.9.a:0 "God Bless the CISL!"
 
 CD_med.10.t:0 "An Era of Good Feelings" # pluralism epic.
 CD_med.10.d:0 "It was an era of good feelings, the mayor had said in one of their discussions, where Italians felt they could change things for the better. Elena did not like the mayor very much, but she could agree with him on that. Ever since she had gone round the building and roped in all of the neighbours, the Condominium B7 Administration Group had become the talk of the entire neighbourhood.\n\nShe had always been outspoken, even as a girl, but only in the past year or so had the neighbours become so as well. The Group, composed mostly of the women living in the building, had been scorned at first by many of the husbands. Then the Group organised a few lunches, solved the problem of waste disposal outside the condominium, convinced the owner to shell out money for maintenance of the property and received the mayor of the district, twice. The husbands stopped complaining.\n\nElena knew the change that had come over her lady friends was neither sudden nor random. Even under Ciano they would not have dared raise such a fuss or involve themselves in politics, however minor. With democracy, however, they had been free to take much of the everyday 'policymaking' into their hands. There were still whispers in neighbouring buildings that she had nothing better to do with her time, but Elena didn't care. She had discovered that organising her peers gave her purpose, and she would not give it up no matter what anyone said. Maybe when the children were slightly older - who knows - she could replace the district mayor and do his job better."
 CD_med.10.a:0 "Public administration needed people like her, after all."
 
 CD_med.11.t:0 "The Sad Decline of Catholic Politics" # democratic initiative
 CD_med.11.d:0 "Sundays were a dual disappointment for him now. Paolo's routine was known to all in the neighbourhood. After looking after the small garden he had improvised with his wife behind the house, he would go with her to the morning Mass before they parted ways; she to her friends in the grocery shops and he to his at the small cafe in the church square. After speaking with them for a while he would buy his two usual newspapers, kept aside for him behind the counter, and sit down absorbed in reading for the rest of the morning.\n\nHe had stuck to this routine for years, but things were no longer the same. The parish priest he remembered since his childhood was old and approaching senility - the poor man sometimes stopped, confused, in the middle of his sermons and seemed lost. His sermons used to rouse Paolo's faith, but now there were only the awkward silences until an altar boy led the old priest mercifully away.\n\nPaolo had expected, with the DC's victory in the election, that politics would be made with the religious fervour he still carried in his heart. He voted for Democrazia Cristiana because he believed a party of the real Italy - Italians raised, like him, in the bosom of Azione Cattolica - could carry the day. But everyday now he read that Aldo Moro - the deceitful coward, Moro - was working with agnostics and socialists. Today the paper spoke of 'Iniziativa Democratica', an alliance Moro had just announced with the Left of the party and whoever he carried with him from the centre. Paolo was angry not only at Moro, who had sabotaged Catholic politics, but at the 'men of values' in the party who let him get away with it.\n\nHe left the newspaper on the table and went back to his house. He had not given up on Democrazia Cristiana yet - who else could he vote for? But the fervour with which he spoke for them in the past had withered away long ago."
 CD_med.11.a:0 "Poor Italy."
 
 CD_med.12.t:0 "The Cinema Industry" # control cinema baby!!
 CD_med.12.d:0 "Young Giuseppe could scarcely believe it.\n\nEver since childhood, he had been brought up on the great Cinecittà films. Films like Umberto D., Le Notti Bianche, and Bicycle Thieves. And ever since childhood, he had dreamt of making films for Cinecittà himself.\n\n"Oi, Giuseppe! Where's my coffee? Muoviti!"\n\nGiuseppe jolted out of his daydream as the sharp voice of Federico Fellini struck across the studio. "Y-yes, sir! Coming right up!"\n\nGiuseppe had never thought this day would come. That he would be working in the same studio as the great director Frederico Fellini, on a sure-to-be great film, Satyricon! Alongside such great actors as Salvo Randone! It was truly a dream come true.\n\nWhilst it was true that Giuseppe was mostly just fetching coffee and doing other grunt work, that would not last forever. He was young, and his time would come. For now, he was just happy to be able to work alongside directors and actors whom he idolized, on films that he adored. Even if he was just a peon for now, it was a toe in the door, made possible by the subsidies to Cinecittà. If they had not had those subsidies, would they have had the money to hire him?"
 CD_med.12.a:0 "Ciak!"
 
 CD_med.13.t:0 "The New Banknotes" # econ lire baby!
 CD_med.13.d:0 ""Here's your change of 1000 lire, signor. Thank you and have a great day!"\n\nMario looked down at the change the cashier handed him, which was only two 500 lire banknotes. His brow could not help but furrow as he put the notes in his wallet.\n\nMario was an economist. He had already been skeptical of the government's plan to introduce new denominations of 500 lire banknotes when the government had announced the plan. He claimed that this plan would only lead to, at best, further inflating the already-inflated lira. At worst, he claimed, it could lead to an economic bubble.\n\nAnd all bubbles must eventually burst.\n\nNevertheless, in spite of the skepticism expressed by economists such as Mario, the government had decided to go ahead with the plan and print the new banknotes. Now that they were being widely circulated, it seemed certain that they were here to stay, and the lira would be further inflated. Whilst this had increased spending and consumption, could it continue like this forever?\n\nMario did not want a bubble. He honestly hoped he was wrong, and that this project would be a success like the government claimed. But he could not shake the feeling that it was inflating a bubble, and that the bubble would inevitably pop."
 CD_med.13.a:0 "Hopefully this will not lead us to economic hardship..."
 
 CD_med.14.t:0 "The Banquet" # abolish that sharecropping thing
 CD_med.14.d:0 ""Come one, come all! Come to the village banquet! All are welcome!"\n\nGiovanni was grinning from ear to ear as the Stilo villagers congregated at the many tables in the village square. As he was observing the preparations, a young boy approached him.\n\n"Signor," the boy asked, "why are we having this feast?"\n\nGiovanni continued to beam as he kneeled next to the young boy. "Why, my lad, haven't you heard? We're celebrating! Now that the government has abolished metayage, we are now free men! No more sharecropping! We can keep our produce! We own our land! And it's all thanks to the government! Now take a seat, and celebrate!", as he ushered the child to the table.\n\nGiovanni had long been a farmer in the Calabrian village of Stilo. Long had he slaved away under the metayage system, being forced to give his hard-grown crops to a landlord in exchange for the privilege of being able to use their land.\n\nHe had never dreamt that this day would come. The day where this accursed system would be abolished, and that he could keep his own crops, grown on his own land.\n\nAs he sat down at the head of the table, ready to dig in to a succulent meal, he made sure to remember who it was who had made this happen. May God bless the government!"
 CD_med.14.a:0 "Let's eat!"
 
 CD_med.15.t:0 "Let There Be Light!" # electrification efforts
 CD_med.15.d:0 "The Alpine village of Arco was about to be changed forever.\n\n"Matteo! Matteo! Have you seen what they just put in the village square!?"\n\nThe young Matteo turned around as his friend Isadora ran over to him with a massive grin on her face. "No? What are you talking about, Isadora?"\n\nThe young girl's grin widened further. "Come with me!", she said, as she grabbed Matteo's hand and pulled him along to the village square, as the sun started its descent below the horizon.\n\nAs they reached the square, Matteo noticed a new addition. Around the square, there were thin pillars, each one with a grey orb at the top.\n\n"Well, those pillars look nice, Isadora. But was it really worth dragging me here for? They don't seem too special!"\n\n"Just wait a few minutes!", Isadora said as her grin refused to subside, and the sun continued its slow descent.\n\nMatteo sat on a bench next to his friend, wondering what on Earth could be this special. And after about ten minutes of waiting, something truly wondrous happened.\n\nThe orbs at the top of the pillars suddenly lit up!\n\nYoung Matteo almost fell out of the bench as he looked with his jaw agape. "Isadora!? What the hell just happened!?"\n\nIsadora's grin was from ear to ear at this point. "Isn't it amazing!? The grownups said this was called electricity. I don't really get it, but isn't this cool!?"\n\nMatteo didn't respond. He just stared in wonder at the glowing orbs."
 CD_med.15.a:0 "I've never seen anything like this..."
 
 CD_med.16.t:0 "Fanfani's Choice" # progress in DC
 CD_med.16.d:0 "As Prime Minister Aldo Moro walked through the halls of the Palazzo Montecitorio alongside his right-hand man, Armintore Fanfani, his brow furrowed as he contemplated the best path forward, now that he had decided to go all-in on making Democrazia Cristiana a party of change and reform.\n\n"I'm telling you, Aldo," Fanfani said as they continued walking, "you can trust me. I'll be able to get the conservatives to support our programme one way or the other. You just need to give the green light, and without restraints I will be able to herd them into supporting us, by any means necessary."\n\n"Perhaps," Moro responded, "but that will undoubtedly make it harder for our party to be re-elected if your plan of coercion and implied expulsion from the party goes ahead. I want to keep this in-house as much as possible too, but we must think of the future elections. Working with Nenni on a common reform programme will certainly make it easier on that front."\n\n"Aldo, come on. You and I both know that if we constantly fret about not rocking the boat for the sake of the next election, nothing will ever get done. We both know the threat from the north necessitates action NOW. Just give the word, and I shall make it happen."\n\nMoro's brow continued to furrow as he stopped walking to ponder Fanfani's words. Whilst Fanfani was certainly speaking both their minds, it was his duty as party leader to ensure his party's electoral success, just as it was his duty as prime minister to ensure Italy's future. Working with a Nenni who has displayed openness to working with him would perhaps be the best path for both DC and Italy? What to do, what to do...\n\nAfter several minutes deep in thought, Moro turned to Fanfani, and said to him..."
 CD_med.16.a:0 ""...You have my blessing."" # Supportive of Fanfani
 CD_med.16.b:0 ""...We shall work with Nenni."" # FD Collaboration
 
 CD_med.17.t:0 "An Island of Stability" # preserve the CD look of unity
 CD_med.17.d:0 "Since the end of fascism in Italy, politics in Italy have been... turbulent. There are so many parties vying for power and influence, each one with their own specific agenda for Italy's future. Within these parties, there are factions who jostle for influence in steering the party's trajectory.\n\nNeedless to say, it results in a lot of bickering, and, well, politicking!\n\nOf course, in these turbulent political seas, there is an island of stability. That island is Democrazia Cristiana. As the other parties bicker both with each other and with themselves, our party holds firm. We are strong. We are unified. We are above such petty squabbling and factionalism. The average Italian can trust us to stay the course and steer the ship through these turbulent seas, without any of this bickering and factionalist nonsense.\n\nThat isn't to say we don't have our own divisions and factions. We obviously do. We are just better at presenting the image of a united front than the other parties to the electorate. And at the end of the day, isn't that what matters?"
 CD_med.17.a:0 "We are the party of unity and stability!"
 
 CD_med.18.t:0 "Moro's Speech" # mess with the FD
 CD_med.18.d:0 "Aldo Moro stepped up to the podium and looked over his people as the Speaker called the House to attention. A sea of Democrazia Cristiana's representatives looked back at him, men of every shade of political persuasion, from reformed fascists and monarchists to those different from the moderate socialist bloc only by their chosen affiliation. Moro could not suppress a twinge of pride in this wide tent they had built, and then his eyes met those of Giulio Andreotti. Guilio smiled at him and nodded, encouraging, demanding. Democrazia Cristiana was by far the widest of the coalitions present in Parliament, but - Moro exhaled slowly and steeled himself - today it would become narrower.\n\n"I am proud because I am a Christian democrat," he began. "Our fellow representatives in the other parties are divided between themselves and speak only for parts of the society. This is their right." The usual heckling, sounds of approval from every DC faction represented. Moro continued speaking. "Christian democracy is a representation of the whole of our society. Before God we build a politics, every day, founded in our religious and social values and which will better the life of every Italian family. Some of our opponents, looking for something to attack us for, say we compromise excessively and do not stand by what we claim to be our beliefs." Already the Parliamentarians started to react accordingly, but Moro kept going. "Yet we know what our beliefs are. Democrazia Cristiana is.." He almost faltered. "A party for democracy, unity and values, and opposed to the destructiveness and division of the Left."\n\nAs the Parliament broke out in whispers, Moro narrowed his eyes at the paper laying before him on the podium. Mentally he made immediate adjustments, crossing out 'a malicious atheist attack on the family', 'assassins of democracy', substituting 'against our families' beliefs', 'misguided beliefs which can only harm democracy'. Aldo Moro looked up and threw a surveying glance around the room. Andreotti and the Primavera group nodding approvingly, the left faction looking angry and whispering while shooting daggers with their eyes. The Fronte Democratico representatives, ready to stand up and start shouting but curious to see how the speech would develop. The PSDI, sitting among them, looking more intrigued than angry. And across from the leftists, Almirante, flashing him a full toothed grin which sent a shiver down his spine. Moro kept going.\n\n"We stand against the Fronte Democratico, against the Left, because their beliefs are against our families' beliefs. They are not what Italy wants or needs, and whilst there are good men among them," Another edit, a slight grimace from Andreotti - "It is clear that their beliefs are badly misguided, and will only do harm to our young democracy. Perhaps they will call us conservative for saying so, opposed to reform, but we are the true reformers. Democrazia Cristiana represents the true centre of Italy, the soul of tens of millions of Italians and their families. Based on our values, and their values, and willing to fight the Left on the political battlefield, we will change Italy for the better and give its children a life better even than what we ourselves will enjoy."\n\nUproarious applause from Andreotti's corner, with every conservative member of the party on their feet clapping. Almirante and his fascists whistling and applauding, only half mockingly. The members of the Fronte Democratico jeering, calling him a Big Business puppet, an enemy of the worker and a fascist, while Saragat's moderates whispered quickly to one another. But Moro did not have eyes for any of them. He looked only at the leftists of Democrazia Cristiana, and noted how they sat there sullenly with anger in their eyes. Betrayal. Moro left the podium and went back to his seat, shaking hands and smiling absent-mindedly. Andreotti clapped him on the back and said, into his ear, "We have won a great victory today.""
 CD_med.18.a:0 "For democracy and our values."
 
 CD_med.19.t:0 "Isolating the Blocchi Nazionale" # mess with the BN
 CD_med.19.d:0 "A persistent thorn in our side has been the Blocchi Nazionale. Led by 'former' diehard fascist Giorgio Almirante, they are a hard-right, nationalistic party. They claim that they are absolutely not fascist and that they respect the democracy of this new Italy, but those claims could charitably be described as 'dubious at best'.\n\nThey have opposed our government at every turn. However, there is a way we could neuter the threat posed by them.\n\nThere is a significant contingent of monarchists in the BN, who like their social_conservative and authoritarianism, whilst caring less about the whole fascism thing. Though obviously, their primary concern is the preservation of the Italian monarchy.\n\nWe can use this to our advantage and sow division in the ranks of the BN. We shall spread rumors (which may have merit, for all we know) that the BN seeks to restore fascism, and abolish the monarchy in the process! We could say they seek to do this as 'revenge' against Umberto for his part in the democratization of Italy.\n\nBy planting this rumor, true or not, in the mind of the monarchists, we will wreak havoc on the BN unity. We can exploit this division to prevent the BN from interfering with our government - or democracy for that matter. We could even potentially bring them to our side, by boasting about how DC is the party of the monarchy; we respect King Umberto, and unlike the BN, we shall leave him right where he is!"
 CD_med.19.a:0 "For King and Country!"
 
 CD_med.20.t:0 "Division in Labor" # encourage PSI
 CD_med.20.d:0 "Guido looked up, vaguely amused, and squinted at the couple of men opposite. The noise of the factory line barely allowed you to be heard if you did not raise your voice, but it was unmistakable. Tano and Federico were arguing again. Even now Federico's face grew red. "The problem with Moro is he doesn't stand for anything," Tano was saying, louder than necessary to be heard. "If someone tells him something one day, he does it. If someone tells him something else, he changes his mind! It's insufferable! He has no principles!" Federico folded his arms over his chest. There was something defensive in the gesture. "We're both socialists, Tano, but you know in your head that the Democristiani have done good for us." To this, Tano's eyes widened - Guido could see it from where he stood. "The Democristiani have done good for themselves!" Tano was speaking at the top of his voice. "The problem with 'socialists' like you is you're only too willing to bend over for the establishment!" To this the other man, face redder still, shouted something about bending over his colleague's wife.\n\nGuido shook his head and lowered his eyes to his work. He was a DC voter himself, and had a lot of respect for Moro. The man did what needed to be done to keep the peace. It was something Guido identified with, which was why he'd never start an argument over politics. He didn't have to raise his eyes to know what happened next. The men next to Tano and Federico were physically separating them, there was a lot of excited shouting from all around, and one of the supervisors was running toward them."
 CD_med.20.a:0 ""Get out of here, both of you! This comes out of your wages!""
 
 CD_med.21.t:0 "The Letter" # deal with the unrest in the army
 CD_med.21.d:0 "The men present waited for the door to be locked before they began to speak. Represented among them was the top brass of Italy, with leading figures from all branches of the armed forces. The subject of discussion was a sheet of paper, hand-delivered by a trusted go-between for Democrazia Cristiana. There were only a few words printed on it: 'Wait. We will have our day. You will be contacted when anything changes.' Once he had read it aloud and looked around the room, the General folded the paper and placed it into his pocket. There was a silence for some time.\n\n"I knew Giulio to be more decisive," said one of the men, finally. His voice was burdened, and he met with murmured assent. "Yet we must wait, as he said. We either act correctly or we do not act at all, and even the Military cannot move unless the politics is in place." To this more murmurs, and not all of them assent. One of the men suggested sending a reply to the DC office the letter had arrived from, but the first one to speak shook his head." We must trust that our friends know what they are doing," he said with finality. "Do you think any of us must enjoy this, being insulted everyday by a Government which spits in Italy's face? But we must endure it. And once we have endured enough, then and only then will we proceed." The room stirred somewhat, placated. The man who had spoken seemed to have swayed the gathering, but even he had his doubts. He hoped that Giulio would soon send another letter, with a different message."
 CD_med.21.a:0 "We will move when things fall into place."
 
 CD_med.22.t:0 "The Speech" # enact the agenda
 CD_med.22.d:0 ""Papa! Papa! I want to watch Provlino!"\n\n"Provlino will have to wait, Maria," Angelo said to the young girl. "Prime Minister Moro is giving a speech in a few minutes! Shhh, it's about to start!"\n\nMaria pouted. Politics were dreadfully boring to a young child. But she reluctantly sat down on the sofa in between her parents, as on the television Aldo Moro walked up to the podium.\n\nBut today would be no ordinary speech.\n\nAldo Moro was no stranger to political theatre. But today, he was more animated, determined, and resolute than anyone had ever seen him before. One could feel the passion emanating from the TV as he called for Italy to achieve its rightful greatness. Not merely on the world stage, but at home, too. Italy must be a country that Italians are proud to call home! The status quo had to go, and a new, greater Italy must rise!\n\nAngelo and his wife, Allegra, could not help but be transfixed and captivated by Moro's performance. Wide-eyed, they could not even tear their gaze away from the television for a fraction of a second! Even little Maria could not help but be a bit taken in by it all, even if she would rather be watching Provlino.\n\nAldo Moro was clearly in it to win it.\n\nAs Moro concluded his seminal speech, Angelo looked to Allegra. "Well dear. I think I know who we're voting for.""
 CD_med.22.a:0 "Change is coming!"
 
 CD_med.23.t:0 "Establishment of the Regioni" # regioni established
 CD_med.23.d:0 "In a nation as great and expansive as Italy, one of the greatest concerns is one that may seem drab and boring: the matter of administration. After the unification of Italy in 1861, the administrative divisions were kept small, consisting of Comuni (municipalities) and provinces (groups of Comuni).\n\nThis was all well and good, but our glorious nation has grown tremendously since then. This has necessitated more Comuni and provinces, and it has lead to the national government having to micromanage hundreds of different divisions, which is frankly nightmarish to administer. Hence the introduction by the Democrazia Cristiana government of a new administrative division: Regioni.\n\nThese regioni will consist of groupings of provinces that share a common history and/or heritage. It will decentralize a small amount of power from the national government to the regioni, but it will minimize micromanagement and allow the government's laws to be applied uniformly. It's not quite full-on federalism, but by devolving some powers to the regioni it will strengthen our country.\n\nOf course, not everyone is happy about this. The more authoritarian-minded forces in parliament are outraged at the idea of devolving even the tiniest bit of power to regional governments. The Blocchi Nazionale in particular are beside themselves, with their leader, Almirante, filibustering parliament for a record eight consecutive hours! He makes outrageous claims that it will lead to Italy's disintegration into the Grand Duchy of Tuscany or the Serene Republic of Venice or what have you. But he is wrong, as this is the best for unity in Italy!"
 CD_med.23.a:0 "It is for the best."
 
 
 ita_vote_for_FD_vote_for_you_tt:0 "This will increase FD popularity."
 ## events
 
 FD_med.1.t:0 "A Writer's Conundrum" # XXV Congress, decision on SocDem or LibSoc empowering
 FD_med.1.d:0 "Enzio sat hunched over his desk. His notes laid out scattered all over the finely crafted wood, spilling over onto the polyester carpet. He had collected a copious amount of material on the two ideological giants battling it out for control over the Fronte Democratico. If he were to read them all off in succession, even the long-gone and long-winded Duce himself would keel over from boredom. All the same, Enzio knew he had to at least try to make something out of his literary collection.\n\nIn his interactions with Saragat, Enzio was taken back by how approachable the man was. His whole demeanor was very calming. He didn't yell or scream or shout ideological dogma at Enzio. Whatever question Enzio had related to the party's platform Saragat was more than willing to explain, in great detail, his outline for the future. From Enzio's perspective, he saw a man committed not only to himself, like so many other politicians. Saragat was committed to democracy and to the Italian people. An honorable man in a cut-throat field.\n\nNenni however, what a contrast. If Enzio felt a sense of paternal comfort around Saragat, Nenni represented a father's rage. Rage against the injustices still present within Italy and its government. Nenni also had no qualms preaching to Enzio about how socialism, and socialism alone, would save Italy from backsliding into fascism. While Enzio was not fully convinced by the rhetoric, he couldn't help but be inspired by Nenni's commitment to his ideals. A socialist Italy still seemed unimaginable, almost impossible with a gentleman like Saragat. But with a firebrand like Nenni at the helm...\n\nEnzio went back to peering over his notes, determined to finish his column before morning."
 FD_med.1.a:0 "Saragat's humility is the key to a better Italy." # SocDem
 FD_med.1.b:0 "Nenni's passion will see Italy through to a new era!" # LibSoc
 
 FD_med.2.t:0 "Saragat Prevails" # Prima la Democrazia
 FD_med.2.d:0 "All of Rome today - or at least, the part of it with a taste for politics, which was everyone nowadays - could talk of nothing else. Giuseppe Saragat had prevailed in the factional struggle for control of the Fronte Democratico, and was named Secretary of the group, with Pietro Nenni to act as President.\n\nA moderate man, both in character and in his politics, Giuseppe Saragat had in the past years fostered a reputation of ruthless calculation. Having prevailed, members of the Saragat faction now exposed their internal disagreement in presenting two plans on the way forward to Nenni.\n\nThe first path was the more moderate one - working with Democrazia Cristiana directly, pooling the energy of the moderating forces in both the FD and the DC, and forming a social democratic government supported by Aldo Moro. Despite his willingness to sit with conservative and monarchist members in his group, Moro was a known compromiser, and a Nenni-Saragat-Moro pact could well achieve much for social democratic politics. Such a pact would also help reduce opposition from conservative elements in Italy, and strongly increase our ability to deliver an effective programme. The clear downside, however, would be the reaction in the Fronte Democratico. An alliance with Moro would be seen as a capitulation by many voters, badly damaging the FD's chance at reelection.\n\nThe other option was purer, and carried more risk. The path of socialist unity would have us form a government made only of the FD, creating a moderate left bloc which could implement our vision of Italy without any alliance with the Christian Democrats. This policy, for obvious reasons, would make our re-election far more likely - it is what people voted for, after all - and the healing of rifts in the socialist front would allow the government to work in stability. Yet the risk would have to be kept in mind. After all, conservative elements in the country would be disturbed by the prospect of a socialist bloc in power.\n\nWith the FD's factions waiting impatiently, Nenni finally came to a decision:"
 FD_med.2.a:0 "A Red-White alliance with Moro, for a stable and effective government." # Empower Strength, low reelection, meh terror
 FD_med.2.b:0 "A government of socialist unity and democracy, for the people of Italy!" # Strengthen Party, high reelection, strong terror
 
 FD_med.3.t:0 "Another Triumvirate" # collaborate with Moro
 FD_med.3.d:0 "Aldo Moro found Nenni and Saragat waiting for him around a small round table in the corner of the café. Nice of them to pick a round one, he thought, but then again, Moro was under no illusions. The men stood up as he approached and shook his hand, then sat down and ordered their coffee. Nenni was the first to speak: "Not everyone in the party is happy we're meeting you," he said gruffly, and Moro met him with a small smile. A test? Then Nenni laughed, and they got to business.\n\nThe next few hours went by in a consistent manner - Nenni talked a good deal, Saragat talked less and said more, and Moro talked enough. By the end of it everything was as clear as could be and a coalition agreement was on the table. Moro was pleasantly surprised to note his interlocutors did not agree on everything. They all came away with something they could sell to their people, and parted with an appointment to meet again very soon.\n\nIt had gone well, Moro noted as he left the café. But Nenni had been reasonable, and every time he wasn't Saragat steered the conversation back to their areas of agreement. In any case, it was only compromising, and Moro had squeezed as much as he could. The easy part was over."
 FD_med.3.a:0 "Now to tell Andreotti the DC would work with Pietro Nenni."
 
 FD_med.4.t:0 "Too Much, Too Soon" # Renounce the radical reformers
 FD_med.4.d:0 "Vincenzo and Paolo sat next to each other by the fountain in the piazza. Another capitulation to the spineless moderates over a party program, has taken place. This time, over the status of the monarchy. Instead of denouncing the royals for the scum that they are, the privileged dolts are still to be treated with majesty. The Socialist Party, bowing and scraping to royals! Can you imagine! The two young students, still blistering over the news, launch into a fiery conversation over this recent catastrophe.\n\n"All I'm saying Paolo is that enough is enough! We were promised socialism! He persuaded us to work with Saragat and his social democrats for the good of the people. And now look where we are! The goddamn Christian Democrats might as well have won the election, the way our programs are turning out. I am sick of compromising with these idioti! The fottuti pazzi who will simply lead us back into the arms of another Mussolini!"\n\n"I agree with you, Vincenzo, this is unacceptable. It would have been one thing if this was the only point of compromise. Or even one of a few. But it seems like with each passing day, we become less of a party of socialism and more of a party of bourgeois niceties! Something should be done."\n\n"Perhaps Paulo, but as for now we follow the party's lead. If things go too far, maybe then we can consider restoring the peoples' will within the halls of our cowardly government."\n\nThe two went back to discussing the future of the party - and the future of Italy."
 FD_med.4.a:0 "Tempers flare as Italian democracy toes the moderate line."
 
 FD_med.5.t:0 "The PRI Enters the Coalition" # Absorb the PRI
 FD_med.5.d:0 "The Italian Republican Party, or PRI, has never been a major party. While it holds the distinction of the oldest Italian political party, it has never had more than 30 seats in the Parliament. Despite this, the FD as a whole had an interest in adding them to the coalition; every additional seat helped, and their moderate and anti-fascist credentials were not in doubt .\n\nTrying to stop the PRI's entry into the FD, Party President Oronzo Reale made his last political blunder. In a quickly arranged vote, the party ousted him as president and elected Ugo La Malfa in his place, with the latter immediately approving the PRI's entry into the coalition. Whether the Republicani will now retain their independence, in which they place so much pride, or slowly be absorbed by their senior coalition allies remains to be seen."
 FD_med.5.a:0 "The Fronte Democratico grows."
 
 FD_med.6.t:0 "The Consolidation of the Left" # Absorb the PdAz
 FD_med.6.d:0 "Ferruccio Parri was not a delicate man. A dedicated socialist his whole life, he had fought with the partisans against Mussolini before the war and during it, and he had suffered for it. But the failure of the Partito d'Azione hit him hard. To a hushed gathering of his closest allies he had broken the news they were all expecting: the PdAz, having listened to the voters, would be dissolved for the greater good of socialism and freedom in Italy. Now all that remained would be to pack everything up and wait for the phone to ring.\n\nParri was not so cynical as to think the phone calls from Pietro Nenni and Giuseppe Saragat were dishonest. Both men, despite their differences, respected his struggle against fascism and had told him so in person. But he was not so naïve as to think this was the only reason they were calling. Depending on their beliefs the former members of the party would flock in two directions, the more radical to the PSI and the more moderate to the PSDI. Parri knew that the Left would be stronger, all in all, in having one less faction within it to compete with. But there was also something to mourn in the party's demise. Against all hope he had thought he could be a bridge builder for socialist voters. But this was not to be."
 FD_med.6.a:0 "The Left consolidated, and polarised further."
 
 FD_med.7.t:0 "Splitters Everywhere" # warngle the party
 FD_med.7.d:0 "According to an official memorandum issued by the Fronte Democratico leadership, secretary Pietro Nenni has approved the expulsion of several prominent members of the left wing of the Socialist Party, including well known Marxist ideologue Enrico Berlinger. The memorandum states the cause of this expulsion was due to the ever-increasing radicalization of the left of the party, and its dissatisfaction with the "constant capitulation to the moderates and the Christian Democrats''. While Enrico Berlinger was not available for comment, many of his supporters, led by other party deputies who were also expelled, have taken to the streets in protest against the "political puppets of the bourgeoisie". Police units have been mobilized and are conveying at the scene of the largest protests currently taking place. Although they have been ordered to only watch and ensure the protests do not spiral out of control, it is clear that the Socialist's Party's decision to expel the radicals may not have had the stabilizing effect they were hoping for.\n\nPietro Nenni issued a statement on the matter, ensuring that these protests were made up of mostly foolish students with too much time on their hands and their irresponsible ringleaders; the expelled party members. He went on to express his confidence in the Party and made it clear "...in no uncertain terms... the party shall not split over the ravings and poutings of a few radicals." Time will tell if the rest of the party feels the same way..."
 FD_med.7.a:0 "Don't let the door hit you on the way out!"
 
 FD_med.8.t:0 "Please Clap" # address the camera, future for reformers
 FD_med.8.d:0 "With a sudden slam on the podium, Pietro Nenni finished his speech with a grandiose gesture and a broad smile. He stood tall, chin out and chest-puffed.\n\n"That ought to bring the house down!" Nenni thought as he gasped for air, his voice cracked and his throat parched from spouting off rhetoric for the past 15 minutes. For days Nenni made sure every page, every paragraph, every sentence, and every syllable of his speech was perfect! He refused to recite nothing but his most truthful and analytical thoughts when speaking, especially on the topic of politics. If he was to secure Italian socialism against its political enemies, it was imperative Nenni built his support among the working class. The workers had to be made to understand the important role the PSI played in empowering them. Once they were made to see this, no doubt due to his impeccable oratory skills, the workers would unilaterally fall in line with the PSI party program. So when this crowd of workers gathered in the TV studio audience returned nothing more than a few whimpering whistles and scattered applause, Nenni could only stand aghast. Frozen in shock, like a deer in headlights, he regained enough courage to gather his papers and exit frame before the feed cut.\n\nNenni could not comprehend how his speech and charisma failed to inflame the workers' passions. Thankfully, Giuseppe Saragat made an appearance on the very same program and was able to win over the crowd's affection. Nenni pondered how Saragat, much more moderate and soft-spoken compared to himself, could have captured the hearts and minds of the working class assembled in the TV studio. And not just there either. All over the nation it seemed his fiery prose, meant to set hearts on fire, was overshadowed by Saragat's gentler and straight-talking attitude. It slowly dawned on Nenni that he was slowly but surely becoming an accessory to the real rising star of the party, Giuseppe Saragat."
 FD_med.8.a:0 "The crickets were his best supporters that day."
 
 FD_med.9.t:0 "The Quarrel" # dissent in DC
 FD_med.9.d:0 "It was another hard day at the factory. Luigi wiped his forehead of sweat as he sat down to take his break, along with one of his coworkers. While Luigi merely sat down, his coworker, Marco, grabbed one of the newspapers that were in the room and began reading it.\n\n"Hey Luigi," Marco said. "Remember that whole thing with those DC politicians?\n\n"What, the ones arguing over the decision to work with the FD? Did they finally stop?"\n\n"Nope, they're still arguing. They've even pulled in Nenni and Moro into it!"\n\nGood god, it had been months at this point! Those fools were still at each other's throats? What a mess it all was, arguing over the DC working with the FD. What was done was done, they should just look to the future. After all, it worked well enough for Luigi, why not for the DC?"
 FD_med.9.a:0 "Let's hope they don't get Almirante involved as well..."
 
 FD_med.10.t:0 "A Report from Saragat" # meet with De Lorenzo
 FD_med.10.d:0 "All'attenzione del Gen. Giovanni De Lorenzo,\n\nAs you requested in our last meeting, I have been making sure that our little issue with Nenni would not spiral out of control. Thankfully, I can now say with absolute certainty that we will have no need to activate the contingency. For all intents and purposes, I have absolute influence in the governing organs, and have moderated Nenni's more fantastical ideas. Of course, if anything is to change, I will be certain to notify you.\n\nCordiali saluti,\nGiuseppe Saragat.\n\nDe Lorenzo sipped his coffee as he read Saragat's memorandum. 'Good,' he thought. 'It seems our little song will never need to be played.' De Lorenzo crumbled up the memorandum before throwing it in his burning fireplace. It was for the better that this plan remained absolutely secret, even if, God willing, it was now unnecessary."
 FD_med.10.a:0 "The torch of freedom shall never be at risk."
 
 FD_med.11.t:0 "Send Out the Invitations" # international support
 FD_med.11.d:0 "Roberto was scribbling as fast as he could, trying in vain to catch Pietro Nenni's last statement of address to the attendees. Something about the importance of reaching out and gathering allies in solidarity. Roberto's hand ached from spending the last couple hours diligently and methodically recording as much as he could at the opening Italian congress. He had already run through two pens, and now with the last drop of ink had used up a third. Still, it was important he covered the congress as thoroughly as possible. Gatherings like this didn't happen so often, and a journalist of Roberto's stature even rarer got the privilege to attend such a historic event.\n\nThe Americans from the National Progressive Party (what a curious name) seemed to get along with all the other delegates and attendees, Roberto included. He shook hands with a, oh what was the name, Roberto struggled to piece together the words. Ah yes, Michael Harrington, a very nice gentleman. Giuseppe Saragat seemed to think so as well. The two were damn near inseparable, discussing who knows what. Probably their favorite social or economic reform. What a couple of bleeding-hearts.\n\nRoberto had a harder time interacting with the delegates from India and Azad Hind. They seemed more, - Roberto couldn't think of the expression. They were more on edge. Perhaps they were not so easily impressed with the congress. Roberto could see their point. For all its fanfare and triumphant hailings of the beginning of the end for the fascisti, there remained much to be desired. Only time would tell if this congress truly was the beginning of a sincere and lasting union of solidarity. Sheik Mujibur Rahman, in his address to the congress, seemed to summarize Roberto's more pessimistic feelings on the matter. "It's not over yet."\n\nThe Japanese delegates, of all the attendees, were the most optimistic about the gathering. Roberto found their speech, about hope for a freer world and their country to atone for its shameful and brutal past, a truly inspiring moment for the congress. It was, however, topped only by Oliver Tambo's bombastic speech. Roberto was moved by his stories of resistance against the reichskommissariats and the struggle of liberation his people fought for everyday. If a man like Tambo can so vigorously fight on against the fascisti, then maybe this truly was the beginning of the end for them. As the congress ended and Roberto made for the door, he made one final note before stepping out into the brisk darkness."
 FD_med.11.a:0 "We shall right the wrongs of the past and build a better future for all."
 
 FD_med.12.t:0 "No Pasaran" # antifascism
 FD_med.12.d:0 "All Anna needed to do was go to the grocery store and get eggs. Her mother wanted to bake a cake for her brother's birthday, and despite Anna's reluctance, she was the one forced to go, much to her discontent. It wasn't that Anna minded going to the grocery store, but she would've preferred to avoid any chance of interacting with the fascists that were currently congregating throughout Rome. What was her mother thinking, making her go out when these damn idiots were rallying to their dead ideology?\n\nAnna tried her hardest, she really did, to avoid anything related to the rally. But in the end, she'd found herself stuck in the middle of counter protesters, and the crowd of people only seemed to grow bigger and bigger. It was one hell of a demonstration to say the least, with red flags being waved next to people holding DC banners. Despite Anna's reluctance to get involved, she found herself wanting more and more to bear the torch of antifascism in the same way that these passerbys seemingly had.\n\nAh, to hell with it. It's not like her brother liked cake that much anyways. Besides, it was worth it, opposing these smug BN bastards. The antifascist chants grew louder and louder, drowning out whatever the fascists were saying, and Anna contributed, shouting as loud as she could, her opposition to fascism at every turn."
 FD_med.12.a:0 "Fascism will not pass!"
 
 FD_med.13.t:0 "A Fairer Way of Voting" # electoral reform
 FD_med.13.d:0 ""For all of our listeners we will now explain the changes made to the voting system," said the RAI anchor, probably from the other side of the country. Matteo leaned closer to the radio set and furrowed his brow. He had been paying close attention to politics since the election, learning from friends who read the papers. He didn't read himself, if he could help it - it took him the longest time to get through a sentence, and made him feel smaller somehow. With the radio things were as they should be. He only had to listen.\n\nThe host skimmed over the rules as if he was skating over snow. "Under the voting reform the system will become both fairer and more representative," he began. "When going to vote, the Italian voter will have more choice. The voter can, if they wish, still vote for candidates from one party as before. But under the new system, the voter can also choose a candidate from one party and give their vote to another party. The system also allows the voter to vote for multiple candidates from different parties, or if they prefer, to write in the names of.." Matteo leaned in closer still, feeling dazed. He remembered asking the local priest for advice the first time he voted, not on political preference, but on how not to spoil the ballot. Now RAI was saying you could write on the ballot and it would be counted.\n\nThe radio crackled. "Under the changed rules, voters' choices will no longer be tied to the political party itself, but to the candidates they want elected. The process of distribution of seats between the parties will also be affected. According to the votes received by the parties and candidates, respectively, a ratio will be determined by the Electoral Authorities so that the number of seats assigned..." Matteo turned off the radio set."
 FD_med.13.a:0 "This is a fairer system?"
 
 FD_med.14.t:0 "The World Peace Council Meets" # world peace council 
 FD_med.14.d:0 "Nenni would not admit it to anyone, but he was a bit nervous. While the World Peace Council was to a large extent his brainchild, there was always the worry that it could backfire spectacularly. His main worry was the number of translators roaming around, chatting with each other in English and exchanging notes. Surely this much whispering, during his speech to inaugurate the Council, would detract from the fiery relevance of his words?\n\nHe need not have worried. The audience, a varied assortment of activists, academics and diplomats, listened attentively with their eyes fixed on him as translators whispered into their ear. Sanzō Nosaka, the Japanese communist whose entry into the room had caused a stir, was nodding vigorously to his colleague's whispers. As he spoke Nenni, picked out other figures he had been informed about by his advisers. From the US Dorothy Day, a Catholic pacifist, and a folk singer called Phil Ochs. From Britain Hugh Brock, a journalist, and from Spain Llorenzo Vidal Vidal, a writer. Many of his countrymen he recognized himself - Ernesto Balducci, a dissident priest, had come up to him and shaken his hand. Whilst the relative lack of politicians of much import stung at first, Nenni would see it later on as a blessing. The people in this room would talk freely, caring for the best ideas and not for national interests, and just perhaps, the seed sown here would be the beginning of a wider legacy. Something rarely felt in Nenni's life surfaced, a sense of humility. He cut his speech short after a few pages, wary of tiring everyone before discussion even began, and gestured openly toward the audience."
 FD_med.14.a:0 ""Now, my friends, who wishes to address the World Peace Council?""
 
 FD_med.15.t:0 "A Moment of Calm" # peace, liberty, labour 
 FD_med.15.d:0 "As the American ambassador to Italy, Clara Boothe Luce was often kept busy, whether it was simple administrative tasks or complex negotiations with the various higher-ups of Italy. Ever since the Italians had managed to reform into a democracy, she had watched with ever mounting horror as the Italians had somehow managed to pick the socialists of all people to lead their nation.\n\nOf course, she'd understood why. The Italian people were greatly disillusioned with fascism, and therefore swung hard in the opposite direction the second they'd had the chance. In any case, it seemed as if the FD had brought a new tomorrow to Italy. Her job had expanded greatly, as the American government took a much greater interest in Italy. The government had only grown in popularity as its new programs had managed to raise employment levels beyond projections. To most people, Luce's fears would've seemed like paranoid mongering.\n\nHowever, Luce knew better. It was almost too easy in this day and age to make things seem much better than they were. The improved employment was nothing but a sham, an attempt to pull the wool over the eyes of the Italian people. These leftists had a sinister goal in mind that it seemed only Luce could see: the implementation of a communist dictatorship. The communist FD needed the will of the people in order to achieve their goal, and their pathetic lies were how they earned it. For now sadly, all Luce could do is grin and bear it, as an anticommunist coup at this juncture could only lead to the country sliding towards communism. Hopefully, the Italian people would free themselves from this menace, just as they had from fascism."
 FD_med.15.a:0 "An Eagle Watches The Wolves..."
 
 FD_med.16.t:0 "The Italian Miracle" # old tools, new work 
 FD_med.16.d:0 "A new worksite was being set up just outside the city. Like many others, it was the work of the publicly owned Istituto per la Ricostruzione Industriale, an inheritance from the early days of Fascism now in the hands of a socialist government. Maurizio, a leftist himself, remembered following the discussion over the IRI when some more economically liberal members of the PNF raised the issue of privatization. But they had been shut down, and thank God for that. Now Maurizio was to oversee this construction, one of the largest automobile factories in Italy once it was built. He had not been surprised when they chose him, since his experience in the construction industry was well known, but was grateful nonetheless to-be given this, his biggest project so far. He supposed, in a moment of wry reflection, that he was a public official now. Maybe he should have someone stitch an Italian flag into his shirt!\n\nMaurizio dragged an elbow against his damp forehead. It was a hot day. He walked around leisurely, shouting instructions and keeping an eye out for the new builders. They had needed to fetch some people from the outside and there were disagreements with his men at first, but Maurizio tried to stifle arguing as it happened. He was happy with the extra hands, which would speed up the factory's opening, and it was good when something like this created more work. God knew work was not something which could be taken for granted, even in good times for the economy such as this one. So when one of the new builders made a very stupid mistake and cost them some of the construction materials, Maurizio had stood up for him and saved the man his job. Even as they grumbled, he could see the men respected him for it. Now morale was better than ever, and the kid who made the mistake learned quickly. All was well.\n\nA more economically minded man would have pointed to a larger pattern, saying that complex merging policy decisions had made the current building boom, with IRI opening worksites all over the country and creating prosperity wherever it did. Maurizio did not care too much for this bigger picture, but he appreciated that the men in Rome did, and that his guidance would translate a larger vision into something on the ground. A glittering testimony to the Italian worker, and if he had anything to do with it, the envy of all Italy."
 FD_med.16.a:0 "A miracle made of brick and steel."
 
 FD_med.17.t:0 "Job Security" # employment efforts
 FD_med.17.d:0 ""Can you believe it, Enrico? The boss overheard me saying I voted for the Fronte Democratico, and sacked me there!"\n\n"Heh, join the club, Luigi. The boss has been firing anyone with any vaguely leftist sympathies. At this rate, he won't have any workers left."\n\n"That's all well and good, Enrico, but what about us? We have to put food on the table for our families!"\n\n"We'll survive, somehow..."\n\nThree days later...\n\n"Blast it all, who the hell is calling at this hour!?", Luigi grumbled as he got out of bed to answer the incessant phone. "It's Luigi. Who's calling?"\n\n"Luigi! Luigi! It's Enrico! Did you hear? It turns out the boss violated the new labour law when he fired us for our political views! He got fined several million lire, and the best part? He was forced to give us our jobs back! No more unemployment for us, baby!"\n\nLuigi's eyes widened, before he broke out in a grin so massive that Enrico could surely sense it even over the phone. "Honey!", he called out to his wife. "Great news!""
 FD_med.17.a:0 "Another vote for the FD."
 
 FD_med.18.t:0 "Not Too Big to Jail" # reign in industrial methods
 FD_med.18.d:0 ""Extra! Extra! Crooked executives locked up! Read all about it!"\n\nAs Piero took the newspaper from the paperboy, he could not help but look at the headline.\n\n"Police Jail Corrupt Executives after Investigation"\n\nPiero blinked. This was a very rare occurrence, that big business tycoons would get their comeuppance. Considering the buddy-buddy relationship they had with the state during the fascist era, the skeptical Piero had thought that it seemed extraordinarily unlikely they would ever face repercussions for their corruption and unethical, illegal business practices. After all, even in this new democratic Italy, they retained considerable wealth and influence.\n\nIt appeared he was wrong.\n\nPiero had long been an advocate of cleaning up Italy, especially since the end of fascism, but he was a cynical man who thought they would continue buying off the police. Even when the FD campaigned on cleaning up Italy, he was skeptical that they'd actually go anywhere.\n\nPerhaps there was hope for a cleaner, fairer Italy after all..."
 FD_med.18.a:0 "Looks like the FD are making good on their promises."
 
 FD_med.19.t:0 "From Rags to Riches" # faith in the FD
 FD_med.19.d:0 "Matteo lurched along the pavement; his joints aching from completing a full shift at the factory. As Matteo paused to collect his breath, he conceded that they didn't ache as much as they used to. The factory shifts had actually gotten shorter and his pay had increased significantly, both to Matteo's pleasant surprise. As he turned the corner, he found himself back in his neighborhood. Only, things were not quite the same as he remembered.\n\nThe streets were cleaner and the buildings had a gentler shine to them. It reminded Matteo of that old American movie his father showed him so long ago. The one with the tin-man and the long windy road. Mateo noticed more of his neighbors out-and-about as well. Never in his life could he recall anyone daring to walk the streets beyond going to work or taking a quick trip to the grocers. And even then, it was best to be quick about it, to avoid any trouble. Such fears seem so misplaced, the way people were carrying on. As Matteo made his way to his front door, he overheard so many lighthearted conversations. People chattering about how much better their pay is now compared to before. How a few months ago everyone was barely meeting their rent, let alone paying off bills like electricity or utilities. Now, it seems that those troubles have passed. One could even believe, though they would be wrong, that these hardships might have never even existed for Matteo and his neighbors.\n\nMatteo, with a quicker step than before and standing tall, made his way into his apartment building. He was not very politically active and didn't even care much about "democracy" or whatever else the students were shouting about these days. Yet as he made his way to his room, he reflected on all the recent changes he spotted today; changes that came about through democracy and through reforms made by the Democratic Front. Matteo acknowledged that perhaps it was time he took an interest in politics. Perhaps things were finally going to be different this time?"
 FD_med.19.a:0 "Could this be the start of something wonderful?"
 
 FD_med.20.t:0 "Berlinguer Wins!" # Prima il Socialismo
 FD_med.20.d:0 "As the result of the vote was read out, rapturous applause broke out in the benches next to him. A somewhat stunned Enrico Berlinguer was proclaimed Secretary of the PSI, but quickly recovered and vowed to all in the room that socialism in Italy would prevail.\n\nYoung and charismatic enough to fire up the youth and the workers, yet tactful enough to win over mature members of the Fronte Democratico, Berlinguer's win fired up Rome with elation and disgust in equal measure. In building on the momentum of this victory Nenni's task now was to choose between two approaches, with differing degrees of radicalism.\n\nThe first approach would, whilst radical itself, see us working within the bourgeois system. Focusing our political efforts against the fascists of the Blocchi Nazionali, appealing to workers directly, and using the tools afforded us by the Constitution, we would forge socialism in the Italian way. If even this was too far for Saragat and his social democrats, who had been grumbling darkly since their loss, then Saragat be damned. This approach would keep the party's voting base behind us and strengthen our government, even as conservative elements in the country would do everything to undermine us.\n\nYet there were those who say this would not be enough, and Nenni is inclined to listen. The enemies of socialism in Italy would be against a Nenni-Berlinguer government no matter what, and could step in to destroy the socialist project. We could, then, seize the moment, and wage a revolution won through the ballot. By weakening the King and the armed forces, and rallying the people behind us, we could outwit the enemies of socialism and destroy their power over Italy forever. Only then could our beloved country be free of the fascists once and for all, so we can create a better Italy with no one holding us back!\n\nWith the party's intrigues complete, Nenni called Berlinguer to him to discuss his decision."
 FD_med.20.a:0 "An Italian Road to Socialism, with the workers behind us!" # Socialismo strength
 FD_med.20.b:0 "A Revolution by the Ballot, no matter the risk!" # Revolution via ballot
 
 FD_med.21.t:0 "To Negotiate, Or Not To Negotiate" # Berlinguer's big break
 FD_med.21.d:0 "Luca held his morning paper with an iron grip; his knuckles turned white and his face beet red. He could not believe what he was reading. Right on the goddamn front page the title: "Moro to hold talks with Berlinguer, may come to political agreement" sent Luca into a conniption.\n\nWhile Luca had always been a solid conservative voter, more inclined to support the Primavera faction of the party, or even the more moderate Dorotei faction, he still accepted the leadership of Moro and Fanfai to lead the Christian Democrats to victory. While the recent election results did not turn out the way Luca was hoping, he was sure that the Democratic Front would surely collapse like the pitiful house of cards they are. Then, Italy could be saved from the dastardly socialists.\n\nBut this...this was a debilitating and humiliating betrayal to Luca, and the party. How could Moro do this? Enter into talks with a known communist? What's there to talk about? How to cripple the economy? Perhaps how to further secularize the nation and dismiss the Holy Father's authority? Berlinguer is a dangerous radical who should have been sent packing long ago. And now Moro, the patsy, is no doubt conspiring with Berlinguer, the dirty commie, on how to further destroy Luca's beautiful Italy.\n\nThe party can not stand for this. Efforts must be made to resist this capitulation to the radicals, and to replace Moro and his faction as the head of the party. The future of Italy depends on it!"
 FD_med.21.a:0 "How could Moro have done this?"
 
 FD_med.22.t:0 "Blood on the Debate Floor" # In the Arc
 FD_med.22.d:0 ""Down with Communism! Down with the FD government!"\n\n"Get out of here, you crypto-fascists! You don't even support this parliament anyway!"\n\n"Come over here and say that to my face, you traitorous faux-conservative! Siding with the communist FD over your country, eh?"\n\n"Come on! Come on then!"\n\n"Order! Order!"\n\nThe speaker tried in futility to bring the increasingly belligerent MPs to heel. But it was no use. The BN were hellbent on, well, raising hell due to their gripes with the left-wing government, and MPs from other parties, from across the political spectrum, were united in their fury at this disrespect.\n\nAnd then the first punch was thrown. It was unclear who threw that punch, but it was thrown nonetheless. And once it was, all hell broke loose until the guards entered the chamber to restore order."
 FD_med.22.a:0 "Parliament has become a boxing ring."
 
 FD_med.23.t:0 "Serfs No Longer!" # decry the king
 FD_med.23.d:0 "Roman denizens awoke to a stunning display of vandalism early Tuesday morning. Several figures, now identified by witnesses as both male and female students from the Sapienza University of Rome, arrived armed with cans of spray paint and vandalised a statue of king Umberto II. The statue was defaced with egregious and indecent remarks that are not worth repeating in this publication. Besides the inflammatory remarks, radical political statements covered the statute as well: "Viva La Repubblica Socialista!", "Abbasso Umberto!", and "Morte Ai Fascisti." The students whereabouts are currently unknown; local police units are issuing an award for the location of these hostile persons.\n\nThe Blocchi Nazional, Democrazia Cristiana, and even moderates from Fronte Democratico have all called on Pietro Nenni to condemn this horrendous stunt. Nenni, believed to be the inspiration for this and similar occurrences because of his inflammatory rhetoric, issued a statement on the matter this afternoon. Standing in front of the parliament building he condemned the "immature and baseless acts" of a "few overzealous students." In the same speech, Nenni quickly pivoted to condemning recent provocations made by the Blocchi Nazional, going so far as to blame the party for the recent acts of vandalism. He stated that if they were not so "pig-headed" and "aggravatingly obtuse"; such "spontaneous undertakings" would be far more "sporadic and restrained." This has upset the Blocchi Nazional to no end; calling for action to be taken against Nenni for his remarks and dismal condemnation of the students."
 FD_med.23.a:0 "The apology was not very effective."
 
 FD_med.24.t:0 "We Are the People" # for the people!
 FD_med.24.d:0 "Chaos ensued yesterday when a pro-government rally, made up of students and workers, clashed with the police. While the rally, for the most part, proceeded throughout the night without incident; several arrests were made and a score of officers were sent to the hospital.\n\nThe rally had been planned in advance for weeks, organized by Fronte Democratico supporters. The purpose of the rally was to celebrate the programs established and laws passed by the newly elected government . While the plan was to have the rally be attended by several unions and political organizations, including known radical Enrico Berlinguer and his supporters; word of the demonstration quickly spread. By the night of the event, several student orgs. And thousands of workers spontaneously demonstrated their support by holding rallies of their own, or joining in on the official assembly. The tone of the rally quickly shifted to a more militant one; due to the influx of extremists at the event, spurred on by Berlinguer, who radicalized the crowd. Soon, workers were shouting pro-socialist slogans and demanding further major reforms to be implemented by the government; while still praising and honoring Fronte Democratico for its success so far.\n\nPolice units were called in to break up parts of the rally and to reign in the radicals who were inciting the crowd. This led to several altercations; many of them turning violent. One such including a young student being subdued and detained by an officer, before several workers shouting anti-police slogans assaulted the officer and freed the youth. Still, such cases were extremely limited and the rally was mostly unaffected by the police presence.\n\nBy the end of the assembly, Pietro Nenni made an appearance; humbly accepting the "groundswell of popular support" he and his party members had "graciously earned" from the Italian people. He stood atop a makeshift platform constructed for the event, along with several other Fronte Democratico members. Enrico Berlinguer was also present among the celebrated party members. He later went on to express his "cautious optimism for the future of the party"; implying that Fronte Democratico, due to its recent success and outpouring of support, may very well implement more comprehensive reforms in the near future."
 FD_med.24.a:0 "The people have spoken!"
 
 FD_med.25.t:0 "Resistance in the Army" # attempted purge in the army
 FD_med.25.d:0 "The two men, former officers of the armed forces of Italy, met in a quiet place at the edge of the village. Francesco and Mattia had become fast friends on joining the forces, and shared many victories together, including their promotion around the same time. Now they shared bitter news.\n\n"Not just us," said Mattia, smiling wryly. "Everyone they could get their hands on, really. Discharged like we haven't given our life to the Army." "Nenni," said the other simply, and spat on the ground. The two laughed. "Everyone who isn't a communist will be out soon," returned Mattei. "But I wouldn't worry too much, Francesco. These things have a way of working out."\n\nFrancesco eyed his friend eagerly. What did he know? "He'll have to reinstate us?" he said hesitantly. He knew the higher ups, if a world away in terms of rank, were no friends to the socialists. Mattei had always been better with intrigues - had he heard something from one of their superiors? But his colleague was only laughing bitterly. "Nenni won't reinstate anything. His people have him by the neck, he can't be seen taking a step back. We will be reinstated, my friend, just you wait, but not by Nenni." A dark look was in Mattei's eyes, one Francesco had seen only rarely. It was the same look he had when another soldier insulted his family, and received a beating for the effort. The same look when they heard the socialists won the election. And now, the look not of defeat, but victory deferred. Mattei met his gaze."
 FD_med.25.a:0 ""Pass me the bottle. Let's drink to the Generals.""
 
 FD_med.26.t:0 "A Monarch's Gambit" # removal of the king (It doesnt work)
 FD_med.26.d:0 "Pietro Nenni was nervous, the small folder in his hand suddenly weighing like a boulder. "This time, everything will go as it was meant to," he muttered to himself. The sudden call to the palace didn't sit well upon his mind: when he passed the law for the first, failed, referendum on the monarchy, nothing had transpired from the Quirinale, not even the smallest rumour or whisper. Dead silence. Therefore, it came as a great surprise that, now that he had passed the law for a second referendum to be held, the King had summoned him with all due fanfare.\n\nWhile he waited in front of the closed doors, he thought about it. Did he want to bargain? Was he going to abdicate? Yes! That was it, he wanted to officially recognise the right for the Italian people to choose its fate, free from crowns and shackles. The doors opened, and he entered the room. Umberto II, King of Italy and Emperor of Ethiopia, stood behind his ornate desk. "Welcome, Prime Minister, please have a sit" the King said, a kind smile on his lips. Nenni opened his mouth to speak, but the King was faster: "Your Ma-" "There will be no new referendum" The politician's eyes went wide. "That's impossible! The parliament has voted!" Umberto's voice and expression became hard: "With the powers given to me by the Albertine Statute, I refuse to promulgate the law, and hereby remove you from your office" "But wha-" "Did you ever consider the implications of such an action? Did you ever think about the consequences of turning from a fascist dictatorship into a socialist one?"\n\nNenni tried to explain, but suddenly two armed commandos entered the room. The King spoke once more, his voice strained by barely contained rage "You are a small man with an even smaller intellect: you may have spent months preparing for this political charade, but I have spent ten years preparing for democracy to return to Italy, and I will suffer no interlopers". Then, he looked at the soldiers: "Bring him away. Tell general De Lorenzo to commence execution of Piano Solo". The soldier saluted: "Yes, Your Majesty!" and brought the former Prime Minister away."
 FD_med.26.a:0 "What is the meaning of this!?"
 
 
 
 FD_med.27.t:0 "Set All Hearts On Fire" # the new FD
 FD_med.27.d:0 "Dante and his classmates crowded around their dorm's television with great anticipation. It seemed everyone was gathered all at once in the lounge, desperate for any sort of news about the recent political events that had transpired. Dante and all his friends, though it seemed like everyone these days, was a committed socialist. After years of fascism, though Dante knew he never suffered like his parents did under the tyrant Mussolini, the country had transitioned to democracy. Due to the further liberalization of the government and its laxing of political restrictions, Dante and thousands of his fellow students were exposed to ideals they had never heard of before. Ideals like the works of Karl Marx, Amadeo Bordiga, and Antonio Gramsci. Contemporary figures such as Enrico Berlinguer were, miraculously, able to capture Dante and his compatriot's newfound radicalism and channel it into a more tightly honed expression of discontent. But it seems, despite all the political education and organizing on the part of the students, it was all going out the window. But Dante didn't care. For the triumphant moment of the working class had come. Or at least Dante hoped. Because just as easily things could go south, really fast. Hence, the ever overcrowding lobby full of socialist radicals of all-stripes. What was taking them so damn long? And then as if on cue, the screen flashed and the two men Dante was expecting appeared on screen. Dante held his breath as... his fears were calmed and hopes sent skyrocketing through the roof.\n\nHis confident smirk transformed into a wide-smile as Pietro Nenni heralded a new age for Italy. There was Berlinguer, standing side by side with Nenni, the powerful imagery not escaping Dante. The two most popular socialist figures of Italy, standing exultantly next to each other like old comrades, represented the now fully unified working class who were mobilized against the forces of capital. The disparagement political parties now under the single commanding banner of socialist liberation! With a leap out of his seat, Dante gathered his friends around him.\n\n"Now is the time! It is our duty to aid comrade Berlinguer and the working class in ushering in this new era of Italian Socialism!" Dashing out of the building, followed first by a few, then a whole swarming mass of fellow students, Dante made for the nearby town square. There, right in the center, stood a 7.62 metered flagpole. The flag of the old order flying limply in the air. Dante, with all the vigor he could muster, climbed to the top. As he was climbing, he called out for a plain red banner. With the banner of working people in one hand, he tore off the old Italian flag, and replaced it with the banner of the future. Clinging to the top, Dante could see for miles around other squares and poles, the lowering of the old flag and the raising of the red banner. Yet some, if not more, still flew the old national flag proudly along with the banner of socialism. Truly, the peoples' will was ascendant in his country. And Dante couldn't be more pleased."
 FD_med.27.a:0 "Viva il Socialismo!"
 
 FD_med.28.t:0 "The Usual Critics" # our revolution
 FD_med.28.d:0 ""They could not be more predictable if they tried," Nenni laughed, his voice booming around the room. "Have you read this yet, Marco? Go ahead, take a look." The secretary obliged and skimmed the passage, written by one of DC's more regressive members in a Catholic paper.. 'The Fronte Democratico is a danger to many of the virtues, namely order, civility and family values, by which Italians should live according to the teachings of the Church. By asking men to openly challenge authority, and to take things into their own hands, Nenni must be considered not only a servant of dark forces but a provocateur, seeking to create social strife which the communists can then use to establish an atheist society..' So it went, for the rest of the page. Marco smiled uncertainly and looked up, just as Nenni clapped him on the back and continued chuckling to himself. The secretary had work to do, but knew better than to interrupt the boss when he was in one of his talkative moods.\n\n"The best thing about it is it's not just the politicians," Nenni was saying now. "So you know how many reports I get per week of priests denouncing me in the churches as a communist? Guess, Marco, just guess." Marco guessed, but the number was larger. "It's unimaginable that they would want us to fail this badly. This is their country too, you know. When Mussolini was trampling over everything the Church held dear, where were these priests? And I don't even want to talk about the Army. Do you know what I heard this week? And this doesn't leave this room." Marco nodded. "They said I was working for foreign forces, a German provocateur trying to wreak havoc throughout society. All this because we fight for the workers, Marco.\n\nBut you know what I also know? That if they have this much complaining to do, then we are hurting them. If the elite has all these words for our action, then we need more action, and faster. And God help me, if we ever give in to these bastards, then all of our work will be undone, twice over. We can only respond to this provocation with more work! For the downtrodden and poor of Italy, who have waited all this time for our moment in the sun!""
 FD_med.28.a:0 ""Sir, can I get back to work now?" "Ah yes, Marco. Of course.""
 
 FD_med.29.t:0 "The Army's Solemn Response to Nenni"
 FD_med.29.d:0 "Setting out things which had been set on fire was a part of the job, but the police of Milan had not dealt with something like this before. The culprits were a group of soldiers on leave in the city, and the crime, some two hundred socialist newspapers bundled together and set alight outside a bar. The headline was still just barely legible on one of the scraps - something about Nenni's address to the Army. The bar hand who had been working that evening spoke calmly to the Police. No, Signoro, he had not heard anything unusual, he was inside the entire time and there was a lot of noise. He had served some soldiers, but none of them looked drunk.\n\nIn fact, Davide knew very well what had happened. Some of the soldiers were childhood friends of his; he knew the rest as good men. When they were in for a drink, they bemoaned to him a rumour they'd heard. Nenni was to publish a memorandum in the papers tomorrow, 'reminding the Army of their oath to defend the Government, as was their duty'. It was Davide himself who told them where the leftist papers were sold, where the vendor kept the key, and how they should show Nenni what they thought of his accusations.\n\nDavide felt like a general: giving orders to his troops, then standing back to watch the flames. When the rest of his friends went into the forces he had stayed behind, helping his uncle serve wine to drunkards and prostitutes. Sometimes he regretted it, but not today. God forbid he ever had to serve under a communist, and moreover, one who would call him a traitor for all Italy to hear."
 FD_med.29.a:0 "God forbid, holding a gun for Pietro Nenni!"

 # events
 
 BN_med.1.t:0 "The Future of Fascism" # Post Ciano Fascism
 BN_med.1.d:0 "The discussion at the main headquarters of the party started to get more heated. With the electoral victory of the Blocchi Nazionali, the high-ranking members reunited to discuss what should be the next steps. The moderate wing argued that the BN should respect the new democratic institutions to consolidate its own power, while the hardliner wing argued for a return to the glory days of fascism without any kind of compromises. After many accusations of "defeatism" and "lack of vision" on both sides, it became clear that there was no real plan or political agenda to follow the victory at the elections. "The political landscape has changed. I stand for the fascsist principles like anyone in this room, but we need to adapt to this new reality. Pragmatism is a necessary evil for our movement to survive." De Marsanich argued.\n\n"Nonsense. The movement is strong by itself. We need to crush these weak socialists and restore order like we did decades ago." answered Rauti passionately.\n\nLauro eventually joined the feud. "I understand that sometimes compromise is necessary but we can't sell our ideals like this. Democracy is the enemy of fascism not its friend!"\n\nEventually, everyone started to scream at each other without coming to any agreement. Rauti even requested Almirante to expel the moderates from the party for "treason to the fascist cause". Growing increasingly tired after hours of loud noise in that hot small room, Almirante slammed his fist into the table. "Enough of this! We are supposed to be the vanguard of fascism, not a bunch of screaming animals." Silence invaded the room, as Almirante finally made his decision. "I already made up my mind about what is the best course of action for fascism and I hope you'll respect my decision as Prime Minister and head of the party.""
 BN_med.1.a:0 ""We must align with the democratic system."" # Allign with the democratic system
 BN_med.1.b:0 ""We must forge our own path."" # Forge our own path

 BN_med.2.t:0 "Meeting the Democrats" # Fiuggi Congress
 BN_med.2.d:0 "With the victory of the moderate faction, the Blocchi Nazionali held a congress at the Fiuggi Thermal Baths. Undoubtedly, it was a more relaxing location than the suffocating tiny room from the prior reunion. The atmosphere was more positive now that most of the hardliners decided not to go in protest. Almirante planned for a more informal reunion at the sauna with his colleagues to relax a bit and laugh about the old times. But for a fascist, the duty always comes first. The congress of that day had the objective of reconsidering a coalition with the Democrazia Cristiana, discussing the possibility of a joint legislative agenda.\n\n"While our party still remains strong after the last elections, we may need support from the Democrats for our next projects. Besides, the Socialists could represent a threat and everyone in this room can agree that we don't want them to push their libertine agenda. Right, Mr. Andreotti?" De Marsanichi exposed.\n\n"Uh, sure. Our party appreciates that the Blocchi Nazionale was willing to approach us in the first place. If we can compromise on our...small differences, I'm sure that this coalition could work." Andreotti answered. The two gentlemen engaging in a civilized discussion was a breath of fresh air for Almirante compared to the loud madness from a couple of days ago. "However, the final decision is up to our leader. He'll decide if we move forward with this." De Marsanich said looking at Almirante with a smile. Almirante knew that De Marsanich was probably just licking his boots because he favored the moderates, but for once it felt good that his party recognized his rule. Sidelining those reckless extremists was a very good idea in hindsight. The Prime Minister cleared his throat and he prepared for an answer."
 BN_med.2.a:0 ""The BN works alone!"" # Right Bloc
 BN_med.2.b:0 ""We must work together to sideline the radicals."" # New Democracy
 
 BN_med.3.t:0 "The Rally" # Revolutionary soul, demonstration in public
 BN_med.3.d:0 "For Italy! For Glory! For Almirante!"\n\nThe echoes of the crowd reverberated in the city center as Almirante gave a fiery speech. The crowd got ever larger as bus after bus drove in, each dropping off more supporters of dubious locality for the crowd.\n\nOf course, whilst it was clear to anyone who gave more than a passing glance that most of these supporters were not from the area, that was not important. Or rather, any concerns about that were drowned out by the sheer size of the crowd, and the overwhelming noise it generated with its chanting and cheering.\n\nAll the while, the press continued to hover around the rally. Filming, taking notes, and so on. Whilst they realized the dubious locality of these supporters, they could not help but be transfixed. This crowd was HUGE. They were full of energy. Almirante clearly captivated them with his bombastic speech.\n\nAt the end of the day, did the origin of these supporters really matter?"
 BN_med.3.a:0 "What a spectacle!"
 
 BN_med.4.t:0 "Ciano's Blessing" # Ciano's blessing
 BN_med.4.d:0 ""Extra! Extra! Read all about it! Duce Emeritus Ciano comes out in support of new prime minister Giorgio Almirante!"\n\nAs Piero took the newspaper from the paperboy and glanced at the front page, he saw the headline echoed the paperboy's words, right above a picture of former Duce Ciano shaking hands at a press conference with the new prime minister and leader of the Blocchi Nazionale, Giorgio Almirante. Intrigued, Piero began to read the article.\n\n"As the former, and final, Duce of our glorious nation, I can think of no better person to lead Italy into this new era of democracy than Mr. Almirante here. We may not agree on everything, but we agree on the things that matter most. I know that in these turbulent times, he is the right person to steer Italy onto the right path."\n\nPiero's brow furrowed a bit. He had not voted for the BN; he considered them to be a wolf in sheep's clothing, fascists in all but name. Their victory had greatly concerned him, and he feared for the future of Italy's fledgeling democracy.\n\nBut if Ciano, a man whom he respected for democratizing Italy, seemed to be on board with them..."
 BN_med.4.a:0 "Maybe things won't be so bad after all."
 
 BN_med.5.t:0 "Two Sides" # Politica del Doppiopetto
 BN_med.5.d:0 "Some argue that since we now accept to take part in elections, that means that our movement is getting weak and we're capitulating to our enemies. Gentlemen, that's nothing but lies. Democracy is just the means to an end, nothing more" The young man stopped to sip his coffee and kept pressing the keyboards of the typewriter. "Absolutely nothing has changed from our principles. The state will remain as strong as ever, our armed forces will crush every possible enemy, inside and outside, and no other party will tell us what to do. We'll send socialists to the trash bin of history where they belong and Germany will never intimidate us ever again. The fascist cause remains as alive as ever!"\n\nThe writer removed the paper from the machine with satisfaction as the speech to address the members of the Blocchi Nazionale was ready. Almirante always appreciated his talent to write speeches, so he tried his hardest to not let him down. The young man put another piece of paper on the typewriter. "One more speech and I can go home." he thought. His girlfriend was demanding to spend more time together. Putting domestic issues aside, Almirante's aide continued to write the First Minister's speech for the television. "I have to reiterate that above all things I respect the will of the people. Everyone has the right to express their opinion at the ballot. That's why I've always been a supporter for democratization. But I also have to reiterate that I'm also a supporter of peace. Italy is a peaceful and free-loving nation that only desires the well-being of its citizens, not to intimidate their neighbours through force..."
 BN_med.5.a:0 "The two faces of a man."
 
 BN_med.6.t:0 "The Convert" # Sway the Boug
 BN_med.6.d:0 "Under the vigilant watch of the statue of Virgin Mary, Marco sat on the couch to turn on the T.V. after a long day of work. The face of the Prime Minister of Italy, Giorgio Almirante appeared on the screen. "Not this guy again." thought Marco annoyed. Ciano drove the economy down the toilet and allowed all these dangerous leftists criminals on the street. How can he trust the same kind of people again to do a good job again? he voted for Democrazia Cristiana hoping that things could change but now the same old fascists are in power to screw things up again. Before he could change the channel, Almirante started to speak. "I'm familiarized with the suffering of the Italian people. These last years have been rough for so many hard workers in this nation." After having his salary reduced in half, the prospect of losing his job worried Marco inmensily. Maybe this guy knows what he is talking about?\n\n"But from now on, things will start to improve. I have big plans to put the economy back on track. With the support of the best economic experts in the country, nothing can go wrong." said Almirante on the T.V. Marco got excited: unlike that fool Ciano he knows what he is doing. He has experts working with him! Almirante proceeded with his monologue. "I'm also planning to spend a significant amount of our budget in expanding our industry. The good people at the factories and the shipyards will be pleased to know they will be a big part of our plan. Which of course includes big rewards for their efforts! That was enough for Marco. He now felt like he was important for the nation again. The DC can go to hell: Almirante just won his vote in the next election!"
 BN_med.6.a:0 "Almirante speaks to our workers from his heart."
 
 BN_med.7.t:0 "A Believer's Wrath" # Silence Rauti
 BN_med.7.d:0 "Pino Rauti left the building fuming with anger, with some tears coming down his cheeks. The decision of the Blocchi Nazionale to compromise with the new democratic system was very controversial among the hardliners of the party. Some of the most radical members didn't take it very well. Upon knowing that the BN was planning to compromise with more moderate parties, Rauti furiously complained that the party was selling out to the Democrats and demanded an "immediate change of course". Since they ignored his demands, he tore apart his membership card and announced his resignation from his position at the party. The Duce would be so ashamed to see his beloved party capitulate to the whims of the liberals. Walking on the streets, he reflected on how fascism has reached this low point. The answer was obvious: greed and arrogance corrupted the fascist movement and someone needed to purify it from the leeches that want to undermine the cause. "I'll protect the future of fascism no matter the cost and with any means necessary. Even if I have to destroy the country itself." Rauti thought to himself. A malicious grin appeared on his face. At that moment, he realized what to do. They will listen to him this time for sure."
 BN_med.7.a:0 "He is just bluffing."
 
 BN_med.8.t:0 "The FUAN Makes its Move" # Rally FUAN
 BN_med.8.d:0 ""I think a planned economy is more effective. Not whatever Bukharin was trying to make." argued a blonde student with a cigarette in his hand.\n\n"The state is oppressive by nature. Workers should be able to profit themselves." replied another one sitting on the table.\n\nAn agitated girl entered the classroom filled with red banners and pamphlets of all kinds of social and political causes to deliver some very concerning news.\n\n"Guys, you need to see this. Something is happening outside." The group of leftist students left the building to see a nightmarish scenario. To their horror, hundreds of members of the FUAN carrying fascist symbols and chanting patriotic songs were marching on the campus. The girl could notice some banners with the phrases "The Duce still lives." and "Italy will never turn Red." She was sure to have never seen some of the people in the crowd in any of her classes.\n\n"Death to communism! Viva Italia!" roared the crowd with enthusiasm. This sudden development shocked the leftist organizations at the University of Milan. It didn't seem like something spontaneous: someone had to pull some strings.\n\n"We can't let these fucking fascists march in our college like this." one of the students said.\n\nThe young blonde man threw his cigarette, ready for a fight. "Maria, call our other comrades. We have some fascist scum to crush." The female student nodded and ran away. Blood will be spilled once again to protect democracy."
 BN_med.8.a:0 "Who said that young people don't love fascism?"
 
 BN_med.9.t:0 "First Blood" # hit up riots
 BN_med.9.d:0 "Beatrice walked around the living room impatiently. She looked at the clock: almost midnight. Her son had been out there for hours and she didn't know his whereabouts. What if he was mugged, or even killed? Almost at the verge of tears, her son finally opened the door. Beatrice scolded him angrily.\n\n"Carlo, you had me so worried. Where have you been? I was about to call the police!"\n\nThe teenage boy ignored her and sat on the couch to take a rest after a long day. "Fuck the police."\n\nA strain of blood was visible on Carlo's arm with some bruises on his face. "God, what happened to you? You are bleeding!" Beatrice exclaimed.\n\n"Some asshole on a horse hurt me a bit. I'm fine." Carlo replied. Beatrice immediately went to the bathroom to bring gauzes and a small bottle. She then started to rub his son's wounds with alcohol, as he cried with pain.\n\n"You should be thankful that your mom is here to help you. I don't want you near those rebel friends of yours anymore. Did you hear me?"\n\nToday, Carlo had his first experience at a political rally. It didn't go as well as he thought. Maybe he would abstain from doing activism for a while. His mother even cured his wounds, so he will listen to her...for now. "Yes, Mom.""
 BN_med.9.a:0 "A mother's love."

 BN_med.10.t:0 "A Bit of Publicity" # propaganda
 BN_med.10.d:0 "After waking up, Dante opened the window for a bit of fresh air. As he enjoyed the singing of the birds, he noticed something strange. To his surprise, a huge sign appeared all the sudden on the neighboring building. It presented Giorgio Almirante smiling with his arms crossed and a slogan saying Almirante will make Italy great. As he went down the stairs to make some breakfast, he turned on the radio to hear the news. A government advert was the first thing he managed to tune in. "Prime Minister Almirante works hard every day to make Italy a better nation. Thanks to him..." Dante turned off the radio with disgust: he wanted to hear the news not propaganda.\n\nAfter finishing his breakfast, he was reminded that he needed to buy some groceries. On his way to the store, he saw a wooden fence filled with posters saying "Almirante protects our industry" featuring Almirante dressed as a factory worker. At this point, it was clear to him that this was a vanity project. As he was paying his groceries at the store, Dante noticed a T.V showing an advert describing Almirante "successes "at foreign policy. "Is this really the guy we voted for?" he asked annoyed. "Don't blame me. I voted for the Fronte." the man behind the counter replied. Dante sighed with resignation and left the store."
 BN_med.10.a:0 "Our Prime Minister is a pretty humble guy."
 
 BN_med.11.t:0 "Military Parade at Rome" # italian greatness, meet with troops
 BN_med.11.d:0 "To celebrate the efforts of our armed forces to defend Italian interests abroad, the Prime Minister decided to organize a military parade to honor the bravery of the Italian soldiers. Hundreds of men paraded across the streets of Rome to show our compromise to protect our interest both in own borders and abroad, while our citizens cheered and waved Italian flags. Everyone from the three branches of the military was present, from the Folgore airborne division to our brave sailors of the Regia Marina protecting the Mediterranean and from the pilots of the Regia Aeronautica to the elite mountain Alpini divisions. Afterwards, General De Lorenzo thanked Almirante in a private letter for the parade and his commitment to "honor those who made Italy a world power." Overall, it was a lovely day. We hope that not only serves to unite our people to rally behind our military, but also as a display of power that will make clear to other nations that the Italian armed forces remain as strong as ever."
 BN_med.11.a:0 "Viva l'Italia!"
 
 BN_med.13.t:0 "(CENSORED)" # film cooperation
 BN_med.13.d:0 "The blonde woman unbuttoned her blouse revealing her naked breasts. The young man stared at her with lust and both started to kiss passionately. For the director, it was good enough. "Cut. All right, let's take a break everybody!" The actress covered his naked body with a robe, while Pasolini addressed the male actor. "Adriano, you go with makeup. The torture scene is next. And don't worry about what you read in the script: it's just chocolate and oranges."\n\nThe young man nodded while an assistant rushed to the director. "Mr. Pasolini, it's the producer. He wants to...talk to you." Pasolini picked up the phone with confusion, why did he even bother to call in the middle of filming? The depressed tone of the producer was already a bad omen.\n\n"We're fucked, Paolo. We have to shut everything down." The sudden ultimatum shocked Pasolini. "But...but we're almost done filming. Why are we canceling the movie?" The producer answered with calm but also sorrow. "Orders from above. Apparently some new regulation about films that go against 'moral and good values' or some crap like that." Aside from being arrested a few times and the censors scolding him a bit, they never cared that much about his films before. But with the breath of the new fascist administration already in his neck, Pasolini was already losing his mind.\n\n"Moral and good values? I'm not a goddamn kindergarten teacher. This movie is for fucking adults! Why the fuck they even care about it? These hypocritical pieces of shit probably do worse things in their spare time!" Pasolini screamed angrily. "They put a picture of my children in my car. They're really serious about this. Some contacts of mine say that they even know about your meetings with the communists. Please, don't make this harder." the producer expressed with sadness. As the call ended, Pasolini slammed the phone angrily as he had to order everyone in the small studio to go home. Only he remained alone in the set, but he was already plotting his revenge. "Fucking moral guardians, you haven't seen the last of me. If you thought my films were bad, next time I'm gonna make you vomit.""
 BN_med.13.a:0 "Can someone please think of the children?"
 
 BN_med.14.t:0 "Geopolitical Nightmare" # political institutions
 BN_med.14.d:0 "IPSI Journal. Page 12\n\nThe Mediterranean Sea is a fundamental element of the history of Italy. From the Roman Empire to present, Italian ties to the sea are undeniable. Germany is the biggest opponent of the Kingdom of Italy for this very reason. The Teutonic hordes have constantly tried to get in the way of the Italian eternal Mediterranean destiny, destroying the Roman hegemony in the sea. That's why the Alps are the perfect match for the Mediterranean Sea, since the mountains are the natural barrier that protects our interests at the sea.\n\nIPSI Journal. Page 23\n\nWhile Italian history is deeply related to the Mediterranean, it would be foolish to deny that continental Europe is the most important element that forms the Italian identity. Across European history, Italy's strategic position in central Europe served as a scenario conflict for many years between the European powers. It's logical that the Italian nation should focus on achieving European hegemony.\n\nIPSI Journal. Page 34\n\nItaly's ties to Germany are undeniable, representing the union between Northern and Southern Europe. The unity between Italy and Germany resulted in Italy's consolidation as a world power. That's why the best strategy for the Italian nation is an alliance between both nations that would result in a new balance of power in Europe."
 BN_med.14.a:0 "Glory for Italy lays... somewhere?"
 
 BN_med.15.t:0 "The Sorrow of the Poet" # Morals of the BN
 BN_med.15.d:0 "The young poet ran as fast as he could just to see his friend sitting depressed at the door of the club. "It's not use. They closed this one too." he expressed with sadness. The young man noticed the red sign that covered the window: "Closed for violations of public moral laws." With the closing of the last club where he felt accepted, the soul of the young artist was filled with sorrow. "The "Agora" too? They already closed the "Olimpo" last week. It isn't fair!" the poet screamed. The policy of the new government of shutting down establishments considered "morally dubious" was devastating for the Italian avant-garde circles. The artists lost the places where they could discuss literature and express themselves freely. For the young poet it was too much, why did they even care about what they did in their spare time? "What are we going to do now? Does society hate us that much?" exclaimed the poet covering his face crying. His friend firmly grabbed his hand. "We'll find a place eventually. They can't just ban us for just who we are!""
 BN_med.15.a:0 "The suffering of an artist."
 
 BN_med.16.t:0 "Identity Crisis" # Nationalism of the BN
 BN_med.16.d:0 "Jemal stared at the chalkboard bored. The class was uninteresting and the old teacher made it even more boring with his monotone tone. "After Italy occupied Eritrea, they transformed the land into an industrial powerhouse." As the Eritrean boy looked at the window with disinterest, the teacher kept explaining. "They built schools and hospitals for the natives. In other words, they brought progress to that land."\n\nSomething wasn't right about what the teacher said, so Jemal raised his hand. "My grandpa told me that they put him in jail once for being Muslim. Is that true?" The rest of the children looked at him with a mix of surprise and disgust.\n\n"Your grandfather is a fool that lives in the past. You should be thankful for the gifts that Italy has brought to your land." the teacher replied.\n\n"But sir, my house doesn't even have electricity. That doesn't look like progress to me." The old man started to get increasingly angry at his insolence. "And the Duce only made things worse. My dad told me that people didn't give him jobs for being Eritrean."\n\nFor the teacher, that was enough. "How dare you, you little brat? Mussolini was the greatest man who has ever lived! Sit on the corner and think about what you have done." As a sad Jemal went to the corner, the entire class started to laugh at him.\n\n"Go back to your village, savage!" someone screamed at him. Meanwhile, the Eritrean boy started to think to himself. They want us to be Italians but they don't treat us the same. But why?"
 BN_med.16.a:0 "Kids, what do they know?"
 
 BN_med.17.t:0 "The Folgore Way of Life" # Strength of the BN
 BN_med.17.d:0 "Since he was a little boy, Amadeo wanted to emulate his dad. He always saw the picture of his father posing happily with his comrades at La Valetta and wanted to imitate his heroism. But above all things, feeling the adrenaline of dropping out of the sky with the wind relentlessly hitting his face was the most exciting of being a paratrooper. So, joining the Folgore Training Camp at Lazio was a natural choice. Being a swimming champion at his youth, Amadeo thought that the physical training would be very easy and was in fact no problem for him.\n\nHowever, all the fascist paraphernalia was still weird to him. The officers still do the fascist salute, their uniforms still use the fascist symbols and some of his comrades sing fascist songs. The day that Almirante won the elections, the high-officers made a toast celebrating the "return of Italy to greatness." Amadeo was too young when Mussolini even died, but he respected his legacy at making Italy a respectable nation. But Italy wasn't supposed to be a democracy now? Either way, it didn't bother him as much. He is in no place to judge how these people organize themselves. and falling at high-speed was more exciting than any political bias. Besides, for the way they describe it, fascism doesn't sound that bad."
 BN_med.17.a:0 "Welcome to the Folgore!"
 
 BN_med.18.t:0 "The Parliament Question" # Speak to Parliament
 BN_med.18.d:0 "With the hardline wing of the Blocchi Nazionale winning the power struggle, the party started to discuss how to restore fascist authority in the country. "The plan is to directly appeal to the King." Almirante explained. "Once his Majesty comes to his senses, he'll see that this democratic experiment has gone too far." However, Rauti already had other plans. "That queer weakling? Ha. We don't need that fool to tell us what to do." Almirante didn't like insubordination but Rauti was a loyal fascist, so maybe he could have a good idea. "I suggest we repeat the glorious march of our Duce in Rome. End this puny Parliament with full force" Graziani got up from his chair excited. "That's a wonderful idea. We should show them who are the ones that rule the nation." De Marsanich couldn't hide his discomfort. They can't just make a coup like in 1922 "The King remains the rightful ruler of Italy. No need for any precipitated actions. I'm sure he'll understand." Almirante looked at the streets of Rome from the window reflecting in the next course of action. Democracy was going to end one way or another but he needed to figure out how."
 BN_med.18.a:0 "Let's see what the King has to say." # Sideline Parliament
 BN_med.18.b:0 "A Second March on Rome is the only solution!" # Bolt Parliament
 
 BN_med.19.t:0 "Umberto II Agrees to Almirante's Demands" # demand powers
 BN_med.19.d:0 "After negotiating with members of the government, Umberto II accepted to sign the executive decree granting Prime Minister Giorgio Almirante with extraordinary executive powers. When the news of the decree reached the public, there was general outrage among the members of the Parliament. Putting aside their differences, the Democrats and the Socialists joined in a strong protest against the measure. A small riot occurred with members of the Blocchi Nazionale and the opposition getting into a brawl. In response, Rauti is already preparing a huge mobilization of veterans, old Blackshirts and even students of the FUAN to get the Parliament into submission. It seems that restoring fascism to Italy is not going to be an easy task."
 BN_med.19.a:0 "Down with democracy!"
 
 BN_med.20.t:0 "An Offer They Can't Refuse" # chain libs
 BN_med.20.d:0 "After extensive negotiations, the Italian Liberal Party has accepted the request of joining the Blocchi Nazionale. In exchange, the BN accepted making a few minor concessions to their new Liberal allies. Some opposition members heavily criticized the move, declaring that some Liberal politicians were threatened and even blackmailed to approve the merge. Meanwhile, the leader of the Italian Liberal Party, Antonio Malagodi, has described the new alliance as "pure dynamite." With the Liberals joining the BN, the political landscape changes once again and what this means for the future of the fascist party remains to be seen."
 BN_med.20.a:0 "The tent gets bigger!" 
 
 BN_med.21.t:0 "A Frustrated King" # meet with the king
 BN_med.21.d:0 "With Rome already covered by darkness, Umberto II opened the curtains just to see men in military uniform surveying the streets. He sighed with sadness as he sipped his coup of wine. Not even total power was enough for Almirante to leave him alone. The fascists weren't exactly subtle on their attempts to pressure him to give them power. One day, pictures of him on meetings with some of his "friends" started to appear at his doorstep with the inscription "It's not our problem but it could be." The message was pretty clear: even the King couldn't stop the fascist restoration. As a cruel repetition of history, he committed the same mistake as his father.\n\nBut Umberto felt even more frustrated. Unlike his father, he actually wanted to give democracy a chance and give freedom to the Italians. However, the fascists already had a taste of power and they weren't willing to fold to any democratic institutions. History never changes. As he remained unable to change anything, Umberto asked to himself: what he should do next? Look the other way as his country falls to authoritarianism again? That seemed like the only thing he could do for now, but he is not going to be that easily manipulated. "I need to figure out how to limit his power, but how?" Umberto thought shaking the wine glass. "Maybe a small vacation in the Alps could refresh my mind."
 BN_med.21.a:0 "This is how liberty dies."
 
 BN_med.22.t:0 "Almirante Addresses the Parliament" # return to fascism
 BN_med.22.d:0 "Prime Minister Almirante stood up from his chair at the Parliament to deliver his fiery speech. "Some people have accused me of not respecting what the opposition has to say. And they're absolutely right: I don't have any respect for anyone here except the proud fascists that want to defend the nation." As Almirante stopped to drink some water, murmurs of concern could be heard across the seats. Almirante was finally showing his true face. "The Italians don't need a bunch of useless idiots that they don't even represent them. They need a strong man to get things done quickly and efficiently." The room filled with screams of disapproval mixed with the roars of approval of the fascist parliamentarians. "The people has spoken at the ballot. They elected me to put this country back to his feet. Why I need to fold to a bunch of incompetent idiots unable to win an election to tell me what to do? Do you think I care what you have to say?"\n\nThe Democrats booed him loudly, with some Socialists insulting him. One of them even threw a pen at him angrily. Almirante ignored them, and kept going. "This entire Parliament is useless. It's nothing but a waste of money to maintain a group of treacherous communist parasites. I'll end this farce once for all and put the real patriots back in charge. I represent the will of the people so now you have to obey me." The outrage consumed the opposition block as members of the Blocchi Nazionale clapped with enthusiasm. The Prime Minister left the room satisfied. Things were going to change around here."
 BN_med.22.a:0 "Fascism bows to no one!"
 
 BN_med.23.t:0 "A Small Request" # help me borghese
 BN_med.23.d:0 "Borghese smoked his cigarette nervously. The rumours of Prime Minister Almirante attempting a full takeover of the government grew stronger. He has become extremely aggressive in his tirades against his opponents announcing his intention of "putting the country back to its place". The end of democracy didn't bother the veteran fascist. In fact, he was looking forward to it. But he still had a feeling of uncertainty: does Almirante has the guts to stand up to the government? A dog that only barks and don't bite is nothing but a coward. The Decima MAS didn't got their reputation by just yelling on how they were going to blow enemy ships.\n\nAn agitated Navy junior officer entered his office with a paper on his hand. "Sir, this telegram just came for you." Borghese read the message surprised. "Democratic experiment must end. Possible confrontation with the enemies of fascism. Logistical and military support needed if fight escalates." Borghese chuckled at the request. It was obvious that Almirante was actually planning to use full force to bent the government to his will. Maybe he wasn't just a barking dog after all! "It looks like the Prime Minister wants to become the new Duce. And he actually needs my help to do so." he expressed jovially. A grey smoke left the window, blown away by the sea breeze. "Well, tell Mr Almirante that..."
 BN_med.23.a:0 "Things got interesting."
 
 BN_med.24.t:0 "The Return the Old Guard" # veteran blackshirts, affirm your support
 BN_med.24.d:0 "Pietro started to remove the last remains of dust from his old Carcano rifle. He then looked at the clean rifle for a couple of seconds with satisfaction. As he was preparing to leave his small cabin outside the capital, he tumbled with an old photograph of his family: his wife, son, daughter-in-law and his grandchildren all posing happily on the beach. Tears started to come down his cheeks. How did his family end like this? His beloved Stella left him ten years ago, after losing her fight with breast cancer. His son gave his life in the desert to keep up the fire of fascism alive in the Middle East. And how his grandchildren thanked his great service to the proud Italian nation? The male one became a lawyer, defending the rights of the deviants and communists that are threatening the fabric of society with their subversive actions. The younger female one became an actress, working at the den of degeneracy that is the cinema industry. And their neglecting mother does nothing but enable their corruption, so it was no surprise to him that they became like that even with the best fascist education. As far as he could tell, the three were dead to him. All these years, he felt like he was truly alone in this world. But there was a time when he was truly happy.\n\nAfter returning from the First War bitter and resentful, he joined the Blackshirts with the hope that he could make a difference in saving his beloved Italy. That fateful day of October, he marched in Rome with his fellow Blackshirts to demand the King to end the weak democratic government and put a true patriot in power. With the appointment of Mussolini as Prime Minister, he felt like he was part of something bigger. It was the happiest day of his life and he loyally served the Duce for the next thirty years. Full of confidence, he was ready to save Italy from the abyss that was in it because of the traitor Ciano. Democracy won't corrupt the minds and souls of the children ever again. Italy will rise from the ashes with another march on Rome! With a smile on his face, Pietro closed the door to make history once again."
 BN_med.24.a:0 "An old warrior returns to the battlefield."
 
 BN_med.25.t:0 "The Second March on Rome" # failure in parliament
 BN_med.25.d:0 "Giorgio Almirante looked at the men in front of him: thirty-five brave fascists dressed in camo uniform, the colour melting in the dark of the night. All were ready to execute the plan: storm the Quirinale and force the King to declare the state of emergency and suspend parliament. "Are you all ready to make Mussolini proud?" he said, raising his arm in salute, and all nodded. The group followed the slight slope of the hill, a light, continuous noise in the distance further masking their movements, until they reached the Palace's entrance, guarded by two Fanti dell'Aria of the Honour Guard: with a silent signal, one of the fascists, a decorated veteran of the Russian campaign, knocked one unconscious, while another put a hand on the second one's mouth to silence him. The light noise became more pronounced.\n\nWhile the Blackshirts bound and gagged the two men, the rest surrounded the gates. Almirante made to speak, but suddenly the noise became deafening. A helicopter appeared, bathing the square in artificial light, and dozens of windows opened to reveal the snipers lurking behind. One of the fascists tried to fire, but screamed in pain as he was hit to the shoulder. All others surrendered immediately.\n\nAn officer in high uniform came out of the Quirinale and went to the now-handcuffed Almirante. "Prime Minister, in light of your treason, His Majesty relieves you from your office" he said for everyone to hear. Then, he whispered into his ear: "You are a small man, with an even smaller intellect. You might have spent months preparing this little charade, but the King has spent 10 years preparing for the return of democracy, and he will suffer no interlopers" Almirante looked up, and saw a familiar face looking at him from a protected window. "DAMN YOU!" he screamed at the King, but Umberto didn't react. Then, the officer spoke to one of the soldiers: "Bring him away, perhaps he will enjoy confinement in Ventotene. By the King's order, activate Piano Solo" The soldier saluted: "Yes, commander!" and led the traitor away."
 BN_med.25.a:0 "The dream of fascism fades away - forever..."
 
 

