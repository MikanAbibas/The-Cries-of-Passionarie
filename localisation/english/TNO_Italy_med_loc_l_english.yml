 ###=====| i) National Spirits |=====###
 ITA_IME_POINTS_SET_4:0 "§YOur commitment to the Levant will become 4.§!"

 ITA_fading_fascism:0 "Fading Fascism"
 ITA_fading_fascism_desc:0 "In the 5th decade of the Fascist Era, the glorious days of the March on Rome seem more and more like a distant memory. With Mussolini long dead, the old enthusiasm and elan of the fascist movement seems to be exhausted, replaced by an omnipresent bureaucracy and rituals that appear to be more and more devoid of meaning. This sentiment is not only present among the common populace, but among the upper spheres of the fascist regime as well, much to the displeasure of the Duce, Galeazzo Ciano."
 ITA_stagnating_empire:0 "Stagnating Empire"
 ITA_stagnating_empire_desc:0 "Italy may have spectacularly won the war, but it was barely able to win the peace. The empire is vast but riddled with problems - corruption by colonial officers, ethnic tensions between settlers and natives, unrelenting partisan movements, and gross economic inefficiency just some of them. Italy manages to maintain some semblance of order through a mixture of repressions and concession, but this carrot and stick approach only goes so far, and many areas of the empire are already more of a burden than anything else."
 ITA_patrizi_e_plebei:0 "Patrizi e Plebei"
 ITA_patrizi_e_plebei_desc:0 "Ever since the liberal era, Italian society was crossed by a staggering divide between rich and poor, and decades after Mussolini's coup, things have only gotten worse. In the south, the land is largely controlled by a few wealthy landlords; in the north, the factories are in the hands of a few oligopolistic families; and everywhere in the country, power is only shared by the uniformed cronies of the Partito Nazionale Fascista. Meanwhile, the rest of the population languishes, with widespread illiteracy, non-existent labor rights, and uncontrolled urbanization just some of the signs of the deep rift at the heart of Italy."
 ITA_second_quadrumvirate:0 "The Second Quadrumvirate"
 ITA_second_quadrumvirate_desc:0 "Originally, the Quadrumvirate was a honorific political body, the members of which were prominent fascists who participated in the March on Rome. Today, in the halls of the Roman palaces, some speak of a Second Quadrumvirate - an informal pact between Italo Balbo, Alessandro Pavolini, Ettore Muti, and Niccolò Giani, all prominent members of the fascist establishment. All of them are considered internal rivals to Ciano's influence in the PNF, and some say that they're even opposed to the current Duce for his incompetence in managing the empire."
 ITA_autarky_reinforced:0 "Autarky Reinforced"
 ITA_expanded_OND_activity:0 "Expanded OND Activity"
 ITA_spirit_of_fascism:0 "Spirit of Fascism"
 ITA_antifascism_treaty:0 "The Anti-Fascism Treaty"
 ITA_antifascism_treaty_desc:0 "This nation is a signatory of the Anti-Fascism Treaty, an international organisation based in Rome dedicated to the idea of containing the spectre of fascism and eliminating the spread of its reactionary tide. Centred around principles of democracy, individual liberty and equality, they strive to instil the spirit of cooperation and mutual defence against the fascist menace deep within the hearts of their populace, and aim to fully exercise the ugly, barbaric stain of fascism off the face of the European continent and then off the world at large."
 ITA_natunity_reinforced_police:0 "Reinforced Police"
 ITA_natunity_reinforced_police_desc:0 "PLACEHOLDER yoyoyo the carabinieri are here\n\nfascism is a fuck"

 ###=====| j) Events |=====###
 ITA_med.1.t:0 "The Italian Empire"
 ITA_med.1.desc:0 "In but a hundred years, Italy evolved from a "geographical expression" to an Empire spanning three continents. This tumultuous expansion saw a dramatic acceleration during the Second World War: as a key partner to the Rome-Berlin Axis, Italy was on the winners' side during the peace conference, and secured all its revanchist claims, from the annexation of Savoy and Dalmatia to a wide sphere of influence encompassing the Balkans and vast swathes of Africa and the Middle East.\n\nHitler's ambitions, however, soon turned to Italy's detriment, as the Atlantropa Dam - his thrice-cursed brainchild - drained the Mediterranean, destroying Italy's economy. As a result, an enraged Benito Mussolini broke the Axis, and dedicated the final years of his life to the task of removing any and all German influence from the Empire: a key step of this change in direction was the founding of the Triumvirate with the Iberian Federation and Turkey, equally damaged from the environmental disaster.\n\nDespite the alliance, Italy was never able to recover the lost splendour, and instead entered an age of stagnation. Corruption, cronyism and incompetence in the administration, fuelled by the new Duce, Galeazzo Ciano - Mussolini's son-in-law and chosen successor after his sudden passing in 1953 - ate at the Empire's prosperity, while internal dissent and colonial unrest worsened with every passing day.\n\nIn Mussolini's vision, the Italian Empire was to be the second coming of Rome. By now, it has become clear that his creation mimics the original in few of its achievements, and many of its problems, but not all is lost: Italy has fought for its independence through centuries of war and bloodshed, and the spirit of Risorgimento is not yet dead in the hearts of its people. The tides of history advance and retreat, and there is no Sybilla to guide Aeneas through the labyrinth of fate, but there is still hope in a better future: will the Empire survive, will it adapt to this new era, or will it be swept away like its glorious predecessor?"
 ITA_med.1.a:0 "Sic transit gloria mundi..."

 ITA_med.1942.t:0 "Il Divo"
 ITA_med.1942.desc:0 "The voice that came from the other side of the confessional was soft, yet firm. This didn't surprise Father Alessandro, however: even if the man tried his best to be shrewd and elusive, a lot of people throughout the country knew him, and himself was no exception.\n\n"What did you do, my child?" The priest asked, his own voice slightly shaking from the morning cold.\n\n"In the name of faith and country, I have committed acts that many would find reprehensible. While my cause is just, it demands sacrifices, both in life and in principles. However, never once have I sacrificed both at the same time."\n\n"Go on, my child." The man seemed to be saying nothing but platitudes shrouded in mystery, and yet he could hardly be blamed; how heavy must his mind have been, had half of what he was saying been true!\n\n"In the name of the Lord, which I never have invoked in vain, I have been tirelessly fighting against the miscreants and the faithless, to ensure that never will Italy fall to their treacherous blows, and to ensure that never shall the Catholic Church fall with it. My methods are flawed, and yet my cause is just; this is my sin, father."\n\nAlessandro shivered at the sinner's last words, as he tried his best to avoid looking into his cold, emotionless gaze. The man's resolute voice was unmistakable, and his dedication to a just cause was utterly laudable; however, did even the best intentions warrant such underhanded methods?Such matters were not his to judge, the old priest thought. This was no one else's fight than the man's very own, and only the Lord could judge him.\n\n."
 ITA_med.1942.a:0 "My conscience is clear."
 
 ITA_med.2.t:0 "The Count on the High Capitoline"
 ITA_med.2.desc:0 "Galeazzo Ciano, 2nd Count of Cortellazzo and Buccari, Prime Minister of Italy, President of the Grand Council, and Duce of Fascism leaned over the balcony of the Palazzo Venezia, appraising his realm. The sun had not been over the horizon for more than an hour, and already the streets of Rome were packed. Ciano observed the citizenry going to and fro, mere insects from his vantage point. Then, he turned and headed to his office.\n\nOne of his assistants had left a bowl of fresh grapes on his desk. A rarity for the common folk, after Germania's blunder. Ciano shook his head. The alliance, his personal project, had seemed like such a good idea at the time. Without it, Italy could never have hoped to seize its rightful place in the sun. Whatever. He would let bygones be bygones, even if his "comrades" in the PNF refused to.\n\nCiano reclined on his chair, casually tossing the grapes one at a time into his gaping mouth. Delectable, as always.\n\nHe heard a pounding on the door. One of his assistants, Giovanni, delivering a reminder of an imminent scheduled meeting with the Grand Council. Always the spoilsport. Ciano shouted back that surely the Grand Council could wait another half hour. Honestly, what was with his subordinates' incessant occupation with his schedule? Ciano was a man who appreciated leisure, not micromanagement. He sighed, then returned to his grapes. Another busy day stood ahead of him."
 ITA_med.2.a:0 "All manner of things shall be well."
 
 ITA_med.3.t:0 "The Secretary"
 ITA_med.3.desc:0 "The bottle passed hands multiple times, before being finally emptied and discarded on the floor: the smell of wine and tobacco, filled the room, together with the laughter of the people sitting in it. Around the table, some of the most prominent names of fascism were sitting, each with cards in their hands. The Chief of Staff of the Milizia Volontaria per il Servizio Nazionale, visibly drunk and with cigar ash falling on his unbuttoned uniform, abruptly interjected after stopping his laugh. 'Yeah, it's all a bunch of merda, I tell you'. The President of the Senate smirked, and, after spitting on the floor, dropped a card on the table and answered: 'God, if only the big M was still alive'. The Minister of Corporations dismissed a waitress with a slap on the buttcheek, and after a quick glance at the cards on the table, made his play, before speaking himself: 'If uncle Benito was still alive, instead of his son-in-law, you all wouldn't need to spend your days worrying about losing your post, or your heads!". Another round of laughter shook the room, except for one man who did not laugh, but instead only grinned: Alessandro Pavolini.\n\nThe Secretary of the PNF, arguably the highest ranking man in the room and in the entire fascist hierarchy save for the Duce himself, did not find the last comment very humorous. Indeed, it was a little too close to reality to be comedic. Every person in that room was aware of the rather personalistic tendencies of the current Duce, often disregarding the advice of his gerarchi. Indeed, Mussolini often ignored his advisors too, but Mussolini was a gifted leader, who brought Italy to imperial greatness; Ciano was only capable of preserving his predecessor's achievements, and even that only barely. Even more worryingly, Ciano had shown a distressing tendency to demote those in disagreement with his decisions and exiling them from political life.\n\n"Well, my friends" said Pavolini. "I am afraid this is no laughing matter". The room fell silent, only the sound of a fly buzzing around. "I feel, like you, that our current political direction is rather undesirable." Nods of agreement were seen across the room. "However, I also feel like we should be a lot more proactive regarding the issue. Sure, Ciano may demote or exile one gerarca. But he isn't stronger than the Party." The silence deepened. "As you may have deduced, I have not invited you here tonight just to have a pleasant evening. I believe that we should discuss a course of action to contain the more unagreeable tendencies of our beloved Duce. And well, who knows, things in the future may take a turn for the... unexpected." Pavolini smiled, and let a card fall on the desk, winning the hand."
 ITA_med.3.a:0 "The card game continues, until only one wins."

 ITA_med.4.t:0 "Roaring Back to Life"
 ITA_med.4.desc:0 "The Appia near Castel Gandolfo was a biker's dream, straight as an arrow and cutting through the scenery, the first rays of the sun caressing the Roman ruins and the patrician villas dotting the hills. So early in the morning, it was empty, save for a single Harley Davidson speeding through: the man riding it was a bit old perhaps, at almost sixty years, but he didn't care about it, for as Marinetti used to say, a man is all about his energy, and Ettore Muti still had enough energy to last him a century. His bike was just like him, almost thirty years old and yet still fast and loyal, more than any woman could be.\n\nOne of the advantages of knowing the road like the palm of his hands was that Ettore could simply forget about everything and think, his wheels knowing everything they needed to do. Many times he had thought about his career, his old deeds, and sometimes women; now, he couldn't stop reminiscing about the old days, when he was barely eighteen, and yet he felt like he could conquer the world: those days at Fiume, when he and a maniple of heroes had taken what was rightfully Italian, it had been the dawn of a new era for the young Ettore, and the proclamation of Sansepolcro the true path for all to follow. What had become of that dream?\n\nAs he asked himself that fateful question, he felt rage filling his veins, and pushed his bike faster. It had been betrayed, by people like Galeazzo Ciano, who preferred the placid safety of mediocrity to the blinding beauty of risk, of progress, of speed. The roar of the engines, the passion that makes everything melt, from steel to flesh: that was what Ettore stood for, not decadence and stagnation! Mussolini had been forced to compromise, to forget, to bow: Ettore knew that no one could have done any different, but times had changed, and a new approach was needed.\n\nFascism was more than a man, it was an idea, and as long as a single man remembered it, it was not dead. As he reached the last turn, Ettore Muti knew that he was that man, and that he would do what he had to do for Italy."
 ITA_med.4.a:0 "Avanti!"

 ITA_med.5.t:0 "Flying on Egyptian Winds"
 ITA_med.5.desc:0 "The small aircraft landed flawlessly at the small military airport near Alexandria, the wheels touching the ground with feather-like gentleness. The staff of the Italian military mission was already there, but Italo Balbo didn't need help: he had been an aviator all his life, things like the perfect angulaton for takeoff and landing, or the subtle balance between speed and manoeuver, were trivial to him. Age may no longer have been on his side, but no one could take his experience from him.\n\nAs soon as the plane stopped, the old pilot turned off the engine and stood from his seat. Reaching for the door, Balbo looked at the small mirror near the door, and a small chuckle escaped his lips: when he had departed for Egypt almost ten years ago, his skin used to be white, and his beard dark brown; now, courtesy of age and the scorching African sun, the opposite had come to pass.\n\nWhen he was out in the sun, he was immediately assaulted by his staff. For the most part it was the usual - intelligence dispatches on Egypt and correspondence from his contacts in the Levant and Iraq - but there was something different: partisan activity was increasing, and there was something... off about the Turkish garrisons in Syria.\n\nSighing, he started giving orders to his subordinates, silently cursing the Duce's incompetence. Why was Ciano so indecisive? Didn't he understand that the Empire was Italy's lifeblood? The colonies needed reform, and a firm hand to lead them: look at Libya now, transformed from a deserted, hostile land to a productive part of metropolitan Italy! This was how the empire was supposed to be, and the Duce was an idiot not to see that: if only someone could make him see reason! Or perhaps, if only someone worthier could take his place... indeed, perhaps this was the road to take..."
 ITA_med.5.a:0 "A treacherous wind blows from the land of the Pharaohs..."

 ITA_med.6.t:0 "The Mystic"
 ITA_med.6.desc:0 "It was close to a dream, or perhaps a vision. Crowds, multitudes of men - all moving as a single soul, millions of droplets forming an unstoppable stream. People from all walks of life, without differences of class or birthplace, in a sublime, superior unity. And far beyond the tangible crowds standing below palazzo Venezia, all the nation was united in a choir, this community which surpassed the bounds of physical reality into something higher. And at the centre of this immense spiritual body, was a single man, who was able to summon and command such energy, such mystical élan: Benito Mussolini.\n\nThe old photographs strewn across his desk, Niccolò Giani, in one of the few brief pauses from his work, spent time reminiscing. Roaring crowds; marching blackshirts; triumphant parades; everywhere across Italy, rising as if answering solely to the command of the Duce's hand, the great achievements of the fascist regime, material manifestations of its spiritual strength. The things depicted in those photographs were barely something more than distant, fading memories. And yet, on the surface, everything was still the same; the crowds still roared at fascist rallies, the blackshirts still marched in the streets, the fascist buildings and monuments were still intact. But something was amiss. The spirit.\n\nGiani set the photographs aside, picking up the draft of the speech he was meant to give at the School of Fascist Mysticism, the glorious institution he had been leading for decades. Picking up his pen, he wrote down the final lines: "...for the highest achievement of fascism was not material - it was the renovation of Italy's spirit. Yet, the mystical, metaphysical progresses of fascism are, while intangible, not irreversible. We, vanguard of the fascist revolution, must always be watchful and safeguard Mussolini's legacy, the eternal Faith he gave us. Never doubt, always believe; always obey; always fight." Giani read the last words over and over again, their mantra instilling a strange, righteous anger into him. He knew this feeling all too well. Perhaps it was time others truly knew it too."
 ITA_med.6.a:0 "Faith breeds fanaticism."
 
 ##Intro Focus Tree Events##
 
 ITA_med.7.t:0 "The Empire's Lifeline"
 ITA_med.7.desc:0 "The Italian Empire controls vast swathes of land, and rules over many peoples. Every day, enormous expenses are sustained to ensure that the bloated apparatus of State can keep the Empire from collapsing on itself, that the armed forces can protect it from its many enemies, and that the economy is subsidized after the Atlantropa disaster: such costs would be staggering for most countries, and - in truth - even Italy itself would not be able to sustain them, if not for a single factor.\n\nOil.\n\nWhen the Reich granted its then-erstwhile ally the former British colonies in the Middle East, and influence over Iraq and Saudi Arabia, everyone thought it a treacherous gift, a poisoned apple wrapped in a beautiful ribbon: instead, it proved to be the Empire's lifeline. From the lands of Libya and the Middle East, a web of oil pipes and ducts large enough to resemble a country-sized circulatory system, constantly pumps more blood into the ailing heart of the Empire, more air into its wheezing lungs.\n\nEvery day, hundreds of oil tankers export crude and refined oil to the four corners of the world. The Japanese Empire is without doubt the largest buyer of Italian oil, but many other countries add themselves to the list: even the United States of America, despite their declared hostility of fascism, need to swallow the bitter chalice, if only to avoid buying their crude from Kaukasien...\n\nWithout oil, there is no Italian Empire. While the Italian economy is not weak, everyone knows that without the "PetroLira" Italy would never be able to afford its gargantuan budget: to this end, great efforts are made to keep the oil-rich region of Libya, Iraq and the Persian Gulf under Italian control, no matter the cost in money or human lives. The thought of what could happen should this lifeline be cut is too horrible to imagine..."
 ITA_med.7.a:0 "Let us hope that never happens."
 
 ITA_med.8.t:0 "An Old Empire For A New Age"
 ITA_med.8.desc:0 "The Italian Empire is a large entity. Like the Roman Empire of old, it encompasses parts of both Europe, Africa and Asia, a fact that never fails to be mentioned in the history books Italian children study on: the Fascist Eagle flies from Rome to Addis Abeba, from Tripoli to Jerusalem, joining many peoples under the guiding light of civilization.\n\nShould a reader put down the history book, and pick up any report coming from the colonies, however, they would see the truth. Despite massive investments in both military garrisons and OVRA surveillance, unrest is growing by the day: corruption, inefficiency, discrimination and resettlement alienate the natives, and no amount of arrests and crackdowns seems to be able to stem the tide.\n\nDespite the conciliatory approach of Viceroy Amedeo di Savoia-Aosta, Italian East Africa - the crown jewel of the Empire - is rife with dissent. The other, smaller parts of the Italian sphere of influence fare no better: the Balkans, as usual, are a powderkeg, with Greece and Croatia barely holding the main cities from bands of partisans and looters; the Levant Governorate is in a constant state of alert due to the large number of Jews, resettled and deported there; even Tunisia and Libya, while more stable, have their own problems.\n\nDespite the propaganda efforts aimed at reminding the local population that there are always worst places to live in - namely, the German Reichskommissariats - results are yet to be seen. As more and more partisans rise every day, many decry Galeazzo Ciano's ineffectual rule, and ask for reforms, so that the Empire might find stability once again: whether reforms can have any effect at all, however, is far from certain..."
 ITA_med.8.a:0 "We can't call Rodolfo Graziani from the dead, can we?"
 
 ITA_med.9.t:0 "The Ente Nazionale Idrocarburi"
 ITA_med.9.desc:0 "While the Italian Empire already has an Emperor, there is another power rising in the East. Its territory mostly consists of office floors and production plants, and it can't boost the guns of the Regia Marina, but it is still powerful enough to make even the Duce in Rome tremble: it is the Oil Empire, the land of the ENI, its heraldry a six-legged dog, and its Emperor one of the greatest businessmen in the world.\n\nFounded in order to exploit the oil-rich regions conquered by Italy after the last war, the Ente Nazionale Idrocarburi - National Oil Company - expanded quickly under the brilliant leadership of Enrico Mattei, a competent and shrewd businessman. His unorthodox approach, capable of alternating between honest negotiations, humane benefits, and ruthless bribery , ensured ENI's primacy: in but a few years, the company could stand on the same stage as the biggest Japanese zaibatsus and American conglomerates.\n\nNow, Mattei rules over his Empire from the tallest skyscraper in Dubai, a fitting palace and his personal fief as governor of the Gulf. While formally subservient to the Duce - ENI is, after all, state-owned - he knows that Rome needs him much more than he needs them: the size of the checks he sends home every year is more than enough to safeguard his position, and a few bows here and there shield him from being seen as dangerous.\n\nWithout Mattei's genius, there would be no ENI, and without ENI, there would be no Italian Empire. A simple equation, yet so dangerous in its corollaries: the government in Rome understands them fully, and knows that keeping the company - and its chief executive - happy is key to the Empire's prosperity. Even an initial loss could turn into great profits under Mattei's leadership - as long as the consequences are kept under control..."
 ITA_med.9.a:0 "If we can make cars in Italy, then let us make the fuel too."
 
 ITA_med.10.t:0 "The Dud"
 ITA_med.10.desc:0 "Ciano paused a moment, preparing himself for what would be a terrific end to his most rousing speech to date.\n\n"And so my strong and resilient people, if it seems as though we have been tested recently, do not wonder. It is precisely these through such tests that history weeds out the strong from the weak, the great men from the weak fools. When you see our great Empire seemingly beset by troubles, know that these are merely the furnaces that will temper our steel and leave us even greater than we were before. Have no fear, we shall triumph - even those poor imitators to our north will soon enough wish they had never betrayed us!"\n\nOnly a few claps responded to the energetic words of the Duce. He had poured his heart into the speech and this was how the ungrateful fools repaid him? He swore he could hear someone chuckling somewhere in the auditorium, but could not pinpoint the source. The sheer indignity of it made him flush with rage, and only the clenching of his jaw kept him from berating his audience. How dare they show him such disrespect; didn't they know that he was the Duce? Didn't they know that it was only through his efforts and careful maneuvering that they weren't all puppets of the Fuhrer in Germania? It was taking everything he had now to hold back his resentment.\n\nWhy could he not get through to anyone? Fascism in Italy only seemed to be eroding, and then the loyalty of the remaining faithful was divided up between a number of contenders of which he was only one. He had hoped for this to be an uplifting speech on the future of the Italian economy, one that would reignite his popularity with the Italian people, and yet this auditorium was only half full and none of them were even clapping. Was this what Mussolini had to deal with when he was the Duce?\n\nSomehow, Ciano doubted it."
 ITA_med.10.a:0 "Clap, please?"
 
 ITA_med.11.t:0 "Those Beneath Notice"
 ITA_med.11.desc:0 "The sun sets over the winding alleyways of Naples, its streets filled with tired people going to their homes after another hard day at work. For some, this might mean relief, but for many more the troubles and anxieties stay with them, bubbling amid the indifference coming from the outside world.\n\nVincenzo felt like garbage. It was three years since he became a welder, but he still couldn't get used to his job. Truth be told, he'd rather continue his studies but since his father died on the sands of Algeria that wasn't possible: as the only man in the house he had to provide for his mom, sister and grandma. So he left school at 13 and applied for factory work. But the pay is low and the pension from the military keeps dwindling every day. If only things went differently maybe I wouldn't have to work my ass off for a pittance, thought Vincenzo.\n\nLuisa walked fast. She was wearing the most conservative dress in her wardrobe and she could still hear the whistling coming in her general direction. She didn't mind anyway, getting catcalled was barely the worst thing that could happen to a girl venturing out of the house. The worst were the Blackshirts. Those pigs take pleasure in molesting every woman in sight, and if they catch you fighting back isn't an option. Maybe she should do like mom always says and start looking for a good man, Luisa thought. But if all men are like this, maybe marriage isn't such a great idea. Deep down, Luisa wanted to have somebody to lean on.\n\nA mysterious figure was looking at the crowd from a window. Tomorrow was going to be hectic. There are leaflets and pamphlets to distribute, and workers to organize. He wasn't worried about unwanted attention, the more the better, he thought. Among those beneath notice, there's untapped rage that can be turned against the fascists. And tomorrow, no one will be able to ignore it anymore."
 ITA_med.11.a:0 "One day, all Italians will know what freedom means."
 
 ITA_med.12.t:0 "The Other Side Of The Alps"
 ITA_med.12.desc:0 "Hate, betrayal, hostility, disappointment. These, and many other words, are used to describe the relationship between Italy and its once-ally, the German Reich: little more than twenty years have passed since the signing of the Rome-Berlin Axis - the alliance which would reshape the world but a few years later - but if one were to look at the aged photos of Benito Mussolini and Adolf Hitler laughing together in Florence and Berlin, they would not be able to reconcile it with what happened after.\n\nWhen the drums of war ceased, and peace returned to Europe, the old allies found themselves vying for influence over the shell of the old world's powers. The French State, Hungary and Romania were hotly-contested topics in many conferences, driving a wedge between the allies, but the Atlantropa Dam was the final bolt on the proverbial coffin: the day after the sea started retreating, Benito Mussolini accused Hitler of betrayal and broke the alliance.\n\nFrom then on, it was a constant escalation. First the diplomatic delegations were reduced to the barest minimum, then trade treaties were repealed and border controls tripled: month after month, the "incidents" started piling up, and both sides began fortifying. Ten years later, the Alpine Wall is the most heavily fortified border on Earth, boasting thousands of bunkers, minefields, artillery emplacements and AA batteries, joined by a veritable underground metropolis of tunnels, barracks and supply depots. Former brothers-in-arms now look at each other from afar, ready to kill those they once shared their rations with in Stalingrad and El-Alamein: their friendship is a fossil now, best suited for a museum.\n\nWith Hitler's health deteriorating, however, things might be up for change. The Italian diplomatic corps looks at the Volkshalle with interest: perhaps, the new occupant of the Reichskanzlei could be approached to mend the wounds of the past.\n\nThat is, if they apologise for Atlantropa. Kneeling in the dirt, their heads covered in ashes, like Henry IV at Canossa: yes, this could be a start..."
 ITA_med.12.a:0 "Forgiveness requires contrition, sincere and abundant."
 
 ITA_med.13.t:0 "Headaches"
 ITA_med.13.desc:0 "Ciano thumbed through the Governor General's report once more, wishing he could be somewhere else. His eyes fixed themselves to the face of the aide that had dropped the folder in front of him only a few minutes earlier.\n"And we are certain that these Iberians were operating under orders?" Ciano met the aide's eyes. "That they haven't taken initiative?" He folded the corner of a page, nervously. "The last thing I." A tap on the table. "need." another tap. "is an incident." The words came through like the sizzling hiss of boiling water.\nThe aide met his Duce's gaze and held it, "My Duce, SIM has verified multiple communications between commanders on the ground in Morocco and the units that have crossed into French territory."\n"Have you, uhm, seen these reports for yourself?"\nNow the aide's eyes wavered, a moment's hesitation flashing across them, "Well, I suppose not my Duce, but with the deal we have planned I believe agitating France at this stage would be very damaging."\n"Well," the dictator sighed, "If they're wrong I'll be the one blamed by the Council no doubt. Not to mention what the Iberians will say-"\nThe aide was about to answer, about to reassure his Duce, when the door was flung open with a loud bang. Standing there was a young man, his insignia bearing the golden loop and two bars of a newly commissioned tenente.\n"My Duce, it's the Turks - they've been spotted massing across the border of the Levant Governorate!" The words came out in fits, heavy and chaotic as the officer attempted to speak and catch his breath at the same time.\nBeads of perspiration formed on Ciano's brow as the aide's face blanched. Someone swore, but Ciano couldn't be sure if it had been the officer, the aide, or maybe even himself. He needed to make a call; neither of these two issues were just going to vanish, and he would need to get involved personally. That meant he needed to prioritize which he would address first."
 ITA_med.13.a:0 "We cannot afford a spat with the French right now."
 ITA_med.13.b:0 "A standoff in the Levant is the last thing we need!"

 ITA_med.14.t:0 "Cherry Blossoms And Roman Columns"
 ITA_med.14.desc:0 "If the German Reich is Italy's greatest Enemy, the same fate did not befall the last member of the Axis powers, the Japanese Empire. While the times of the Tripartite Pact are long gone, the two Empires have kept friendly relations, fuelled by healthy trade, mutual respect, lack of conflicting interests and - last but not least - shared hate for the German backstabbers.\n\nThe friendship between Italy and the land of cherry blossoms has deep roots. Already in 1928, Benito Mussolini gifted a column from Pompeii to be turned into a shrine on mount Limori, commemorating the noble sacrifice of the last samurai, and from then, the relationship grew: during the war, Italy supplied Japan with almost two hundred thousands rifles, and their soldiers forged solid bonds of brotherhood whenever they met.\n\nNow, Japan is the main buyer of Italian oil, a vital need for its massive navy, and as such is more than interested in Italy's stability. The feeling is returned, and the two countries are often aligned in the defence of each other's interests: the Japanese embassy is the largest in Rome, and the same honor has been granted to its counterpart in Tokyo.\n\nIn this time of darkness, where every smile hides a dagger and giving a hand might result in losing an arm, a sincere friend is like an oasis amidst sun-scorched sands. No one knows what the future entails, but one thing is certain: the Italian and Japanese Empires stand together against the forces of imperialism and decadence, guarding each other's back."
 ITA_med.14.a:0 "The path of honor is narrow, the rewards legendary."
 
 ITA_med.15.t:0 "The Fool"
 ITA_med.15.desc:0 "Ciano grasped the large outstretched hand that had been offered to him and shook it warmly, "It's a great pleasure to host such illustrious businessmen."\nThe owner of the large hand, one Mr. Aguire, smiled broadly from behind his thick beard and mustache, "Oh nonsense my Duce, the pleasure is all ours. We are only too eager to aid the PNF however we can. After all, the only reason we are able to conduct our business in peace is because of sensible gentlemen like yourself and Duce Mussolini."\n"God save his soul," added one of the other members of this industrialists' delegation. They all smiled at that.\nGood, Ciano thought as he motioned for them all to take a seat. The meeting was going quite smoothly. Now to simply reassure them of the government's continued support for their projects and they could all be on their ways...\n"Let's get down to business gentlemen. We're all busy men after all and I don't wish to waste your time. Why, I expect you all have more demanding schedules than I do!"\nTheir laughter told Ciano he was getting somewhere quick, now just time to press home the advantage while he had their good will.\n"Now in regards to the small criminal problem at the construction depots that you so helpfully manage for us in Tuscany, let me assure you all that it will be dealt with swiftly. We are already moving in on the susp-"\nThe way they all looked at him made Ciano stop cold, his mouth frozen comically mid-word before he recomposed himself, waiting for an explanation.\nAguire's dark eyes betrayed confusion and fear, and Ciano could see his mouth twitch slightly, "My Duce, please pardon my rudeness but uhm... we are not from Tuscany."\nCiano tried to right himself, "Ah, my apologies for the mistake. As I was saying, the Lombardian depots you run for us -"\n"We run the depots in Umbria, Duce Ciano." Aguire's voice was flat, all traces of smile gone from his lips. All that remained was a mixture of annoyance and frustration. Ciano cursed silently to himself."
 ITA_med.15.a:0 "Cazzo."
 
 ITA_med.16.t:0 "On the Job"
 ITA_med.16.desc:0 "Three, two, one, "Go!" The OVRA agents broke down the door, pistols drawn.\n\nA woman screamed and tried to run into the next room, but one of the agents grabbed her, forcing her to the ground before handcuffing her. "What's the meaning of this?!" a man shouted as he entered the room with a furious expression. Once he saw what was happening, his face betrayed terror.\n\n"Do you know who I am?" he asked trembling, a pathetic display of bravado failing to mask his fear.\n\n"We do. Guess that means we don't need introductions," the lead agent said. As the man struggled to speak, the lead agent stepped forward and pistol-whipped him, knocking him to the ground with a yelp of pain. As he laid moaning on the ground, the lead agent clapped handcuffs around his wrists before letting one of the other agents take him away.\n\nThe other agents swept the apartment and reported to the lead agent. "There's no evidence we could find that he was a communist, sir. This man might not have even heard of Marx before." The lead sighed. OVRA was never wrong, they couldn't be wrong. If they knew this man was a communist, he had to be a communist. Still, just because the evidence wasn't there didn't mean they were wrong. They'd just have to make do as they sometimes had to.\n\n"Give me that bag," the lead agent said. He pulled copies of Marx and Lenin out and arranged them in the bookshelf, as well as placed various Italian communist newsrags beneath the bed. "There.""
 ITA_med.16.a:0 "All in a day's work."
 
 ITA_med.17.t:0 "A Dream Called Italy"
 ITA_med.17.desc:0 "Galeazzo Ciano had slept so poorly of late that even reclining in his Malta office chair filled him with an almost indescribable sense of bliss. His eyes closed, an excellent bottle of Sangiovese on his desk, and the rich beauty of L'amico Fritz from the record player to keep him company - was there any better way to relax? If there was any man in Italy deserving of finding that out, it was the beleaguered Duce. He had endured a year of trials and tribulations, of crises more dangerous than any since the German betrayal. Now here he was in Malta for a conference with his supposed allies, a whirlwind of petty grievances and complaints.\n\nMalta.\n\nThe name swam in his head, an ominous beast that filled him with a sense of dread that was hard to explain but present just the same. He would need to corral the spoiled children, Iberia and Turkey, remind them of their shared goals, their shared foes. If that failed it would mean that his one grand triumph, the anti-German bloc, was a failure after all. The thought sent a shudder down his spine. Even in here, what should have been his sanctuary from doubt and fear, he was not safe. The enormity of his task pressed down upon him without mercy, the fate of the Empire hanging in the balance. The destiny of Italy was his and his alone to hand down."And what a destiny I shall deliver." The words turned over and over in his thoughts. What was there to truly fear? Italy's destiny lay in dominance just as it always had. The dream of a universal Rome was not dead, far from it in fact. He would surpass his father-in-law and bring Italy to its rightful place as one of the great powers of the modern world. But that could wait, the Duce needed his rest."
 ITA_med.17.a:0 "I will deliver to them all I have to give."

 ITA_med.18.t:0 "A Declaration at Quirinal"
 ITA_med.18.desc:0 "The two men sat together in a small side room in the Quirinal palace, one normally used for smaller, more intimate conversations. In this sense, the room was only being used for half of its intended purpose; this conversation was certainly small and private, but one could hardly call it intimate.\n\nThey sat there together, the King and the Duce, sampling delights from all the corners of their empire. Coffee from Ethiopia, kaak malih from Libya, tobacco from Arabia; all such delicacies compared by the two men to their traditional Italian cuisine, and were found to be lacking.\n\n"I am still the King of this nation, am I not?" the King questioned, glancing over his cup at the Duce, a smirk on his lips. "You haven't deposed me quite yet."\n\n"Yes, you're still the king, but you know that any interference would be political suicide," the Duce responded.\n\nA moment of silence. "Your Majesty," the King prompted.\n\n"Your Majesty," the Duce echoed.\n\n"You know, Galeazzo," the King said, taking a sip of his coffee, "I am not my father."\n\n"Your Majesty?"\n\n"You must understand, it is not out of some misguided love for fascism that I have remained silent for so long," the King declared. There was a sadness in his voice, bordering on disappointment. "No, I have remained silent because the law binds me so. But understand, Galeazzo, as I am not my father, you are not Mussolini. If the people reject your mandate, if they call out for change, I will say my piece."\n\nThe Duce nodded. "I understand, your Majesty. It won't come to that point, I assure you.""
 ITA_med.18.a:0 ""See that it doesn't.""

 ITA_med.19.t:0 "Un Giorno Nella Vita"
 ITA_med.19.desc:0 "Ciano woke up to the tune of a local Italian-made alarm clock, rattling on and on. It was a symbol of the growth of Italy over the years, its own self-dependence, its developing industries. Ciano was woken up five minutes late.\n\nHe sipped on some coffee, imported from the colonies. It was fine, and packed with enough caffeine to wake the dead, but Ciano's eyelids remained heavy. The sleep of the dead was light as a feather compared to those miraculous few hours Ciano could spare each day.\n\nThe reports of the day came in, usually from a young officer who was looking his finest for Il Duce, who couldn't care less if he tried. Fifteen communist partisans killed here, a new cell of national liberation movements in the Middle East cracked down on there. The reports that passed through Ciano's hands must have reported a death toll in the thousands over the years, but somehow the partisans keep on finding more people to bomb garrisons and attack patrols.\n\nA meeting with Confindustria heads was a nice change of pace, since they were at least kind enough to make it clear they didn't look up to Ciano in the slightest. A new factory here, a boost in employment there, and Ciano couldn't find where it was written that this would help reverse the damage of turning the beautiful Italian coast into a damn desert.\n\nFinally, the party meetings. There were yesmen who agreed with everything Ciano said so they could rise in the ranks. There were dissidents that thought Ciano was a traitor to fascism but were too cowardly to say it, and there were less cowardly dissidents. Everybody there was either non-functional due to a lack of backbone, or non-functional due to non-compliance. Either way, nothing gets done."
 ITA_med.19.a:0 "The glorious life of the Duce."

 ITA_med.2000.t:0 "Our Backdoor"
 ITA_med.2000.desc:0 "One needs only to look at a map to see the obvious. The Turks, when they launch their offensive, will have plenty of fronts on their hands. In the Levant, in Greece, in Rhodes and around Cyprus the Turks look to move their armies, hoping to seize Italy's empire for herself in the wake of the Triumvirate's collapse. We can be certain that around the Mediterranean Italians and their subjects will rally to the defense of the Empire, but to the astute observer, there is one frontier that has yet to come alive with the sound of gunfire.\n\nIraq is a nation that stands in the very cradle of civilization itself, and nominally a subject nation of the Italian Empire as well. However, it is not one of the more stable nor most profitable regions under the Empire's sway, and the deployment of troops to this region would prove difficult. Significant efforts would need to be made, at first anyways, before the Iraqi armed forces could be mobilized in defense of the Empire.\n\nIf the Iraqi border with Mosul and Turkey itself could be stabilized properly, the addition of a front line in the Turkish rear could be the very thing that turns this war around. The Turks are overstretched already, needing to pour everything they have into the Levant, into Rhodes, into Greece and into Cyprus, how could they possibly have the spare manpower to halt a Mesopatamian front without sacrificing their other fronts? Greece and the colonies would certainly do better once the pressure on their front is relieved.\n\nThis of course, also means that the Turks will undoubtedly look to destabilize Iraq, we will need to be vigilant if we want to keep the country intact long enough to launch our offensive."
 ITA_med.2000.a:0 "They'll never know what hit them!"
 
 ITA_med.2001.t:0 "Guarding the Rear"
 ITA_med.2001.desc:0 "Plans are drawn up for the swift and decisive conquest of the Levant, of Rhodes, of Cyprus and to cripple the Greeks. But there is one front whose ultimate involvement is as of yet uncertain, placed to our southeast.\n\nIraq is the least among Italian puppets, a shell state occupying the lands of Mesopotamia and securing the transfer of oil to the Gulf and then out towards Italy. For the moment, they do not have the organization nor the will to act against us, but that could change in an instant if the Italians realize the opportunity they have on their hands- and they will realize it in time. Iraq is about as far away from Greece and Rhodes as one can get, and if a new front were opened along the Iraqi border, we'd be forced to weaken our attacks there in order to mount a defense of our own rear. For obvious reasons, this would be an unacceptable situation.\n\nOf course, we do not have to simply allow the Italians to pull this grand flanking maneuver. Iraq is, as mentioned, a nation that is both empty and hollow, and with the right tactics- infiltrations and sabotage, primarily- its ability to wage war and host armies can be crippled. Not only will this prevent any kind of war-changing maneuvers by the Italians in the region, but it will weaken their grip on Iraq and the entire Middle East as a result.\n\nBoth of these reasons alone would be plenty enough to justify giving the project our full attention, and there is no time to waste! Iraq shall crumble, and Italian dreams of victory with it!"
 ITA_med.2001.a:0 "To a swift and decisive victory!"

 ITA_med.2003.t:0 "outcome" #this is a hidden event it doesn't need loc
 ITA_med.2003.desc:0 "italy win join itw\n\nturkey win do nothing"
 ITA_med.2003.a:0 "yay"

 ##Post-Malta Events##
 postmalta.1.t:0 "The New Quadrumvirate"
 postmalta.1.desc:0 ""This can't be right."\n\nThe duce squinted at the contents of the folder before dropping it back on the desk. "Well, this may be a problem, but not one we can't solve. I suppose they've got some grievances about their duce? Those can be addressed."\n\nThe elderly police chief shifted uncomfortably in his seat. "I believe their opposition extends beyond that. Niccolò Giani and Ettore Muti both privately contend that fascism has lost its direction under you. Italo Balbo has been holding clandestine meetings with members of the Regia Aeronautica and colonial representatives almost monthly for the past year, and-"\n\n"Does this concern me any more than the last reports I've received? You've been complaining of dissenters for months, and yet the OVRA never discovers anything that translates to serious opposition."\n\n"My duce, the old guard of the party is extremely dissatisfied. Alessandro Pavolini has been using his position to secure favors for other powerful members of the party-"\n\n"Let him! As if the party secretary has power to dictate anything. I made Pavolini. If he isn't happy with how things are, I'm happy to destroy him."\n\nLorenzo Chierici thought back to the last decade with disgust, not for the man he saw before him, but for the lost way of doing things. Mussolini would not have tolerated even a hint of this- it was a clear sign of weakness on the part of the duce. The levers of power rested in the hands of the duce, but these four dissenters- all prominent party men, no less!- were maneuvering to undermine Italy right under his nose.\n\n"Now about the colonies- I need more agents dispatched to Tunisia to contend with the settlers. They'd love to cause trouble for us, and if we don't get them dealt with soon, we'll be facing a revolt - or worse.""
 postmalta.1.a:0 "Dreams of power, passed through gates of ivory."
 
 postmalta.2.t:0 "The Red Menace"
 postmalta.2.desc:0 "The map sitting on Ciano's desk seemed as though it had been stabbed time and time again until it was nothing more than an array of red pins on an insignificant piece of paper. The Duce massaged his brow with his thumb and index finger. If it wasn't the Blackshirts overstepping their responsibilities, or Mattei demanding more funding, it was the Communists spreading like a virulent disease, devoid of limits to its lies and treachery. The map of what had been of Northern Italy was now dotted with red pins, each representing a known cell of Socialists, Soviets, or just plain Reds. It made little difference to Ciano. They were all equally traitors.\n\nThe most troublesome of the lot were the Guardia Rossa, however. Some old hardliners would just refuse to die, Ciano had learned, though as a whole, even the Moderates of the Communists were proving troublesome. The constant protests on behalf of the latter and the infrequent terrorist attacks on behalf of the former were proving a legitimate problem. The question was, however, how to deal with them? Giving up meaningless compromises was proving an easy way to deal with the moderates, though Ciano had learned through trial and error that this may not be a permanent solution. For the hardliners, typical raids were the de jure response. Ciano had figured, after all, if things could not possibly escalate further, then the most escalated response was always the right one. An Aide walked in and placed a few more pins down on the map.\n\n"Coffee, Il Duce?" Ciano looked up from his Terrorist assessments and dotted maps to see about keeping himself awake. He noticed the darkness out the window and that the stars that had come up over Italy. Il Duce smiled."
 postmalta.2.a:0 "Italy had lived another day."
 
 postmalta.3.t:0 "The Perched Eagle"
 postmalta.3.desc:0 "With a steady hand and a single breath, Ciano reached to grab one of the many folders that rested on his desk as the fallout from the collapse of the Triumvirate continued. Problems kept compounding, unrest and division continued rising, and each day seemed to get worse. There were only so many fires he could put out at a time.\n\nThe world was not ignoring what had happened. The frown on Ciano's face deepened as he read the intelligence report from the Servizio. Competing for influence in Europe had always been a reality, even before the German betrayal, and there was no place this was more intense in than the Balkans. It had cooled in previous years, but it seemed that Germany was taking advantage of the chaos to begin making moves once again. If they were successful, the result would be a dagger pointed at the heart of Italy.\n\nNo, that couldn't be allowed.\n\nYet as he read, the grimmer he became. Countries they had presumed were firmly in their sphere of influence were revealed to be far more unstable than he'd thought. The collapse of the Triumvirate had exposed the limits of their reach, and the Balkans were quickly becoming hotbeds for insurgency, division, and hostile political militias. Perfectly primed for Germany to exploit.\n\nThere were domestic matters to attend to, but Ciano knew that ignoring the looming giant on their border was dangerous. Even though Turkey was the more immediate threat, he had to consider the long-term consequences of ceding the Balkans to German influence. He would not brush aside this threat to Italia.\n\nThe keys of his typewriter clacked as he typed a short memo, and with a firm hand and final flourish he signed the order, folded it, and pocketed the letter to deliver to the Servizio director personally. The message, and subsequent implication of failure, would be no clearer - the Balkans could not be lost."
 postmalta.3.a:0 "One less fire."
 
 postmalta.4.t:0 "This Sea Of Ours"
 postmalta.4.desc:0 "The Suez is, without a doubt, the great artery that kept the bustling Italian Empire strong - and more importantly alive. Italy had fought hard for that Empire, and with the Triumvirate collapsing, it seems that she must begin enforcing her dominion over it more directly. After yet another day of less-than-fruitful meetings and endless paperwork, the Duce was left alone to reflect on the policies that the Empire prepared to take in the aftermath of Malta.\n\nNo matter where the nation marched towards next, the Mediterranean would remain at the center of Italy's policy making, both literally and figuratively. Shrunken by Atalantropa, the great sea nonetheless linked together Italy's domains east to west and north to south. From the desert plains of Libya to the fields of Ethiopia, the Empire was nothing without the Mediterranean firmly within its grasp. And that would be his policy. When it came to investments, military and financial alike, this beating heart of the Empire would be placed at the forefront. From Tunis to Jerusalem, native resistance groups and mercenary goons plotted to throw off the Italian yoke, and they would be thwarted at every turn.\n\nTunis's unruly populace would be reined in, and its minuscule economy knit even closer into that of Rome. Libya would see further developments, and further progress, under the ENI. In Egypt, too, Italy's grip must remain secure. A few new directives to the King and the Commissioner would see through to that. As for the Suez, the glimmering pearl on the Empire's chest? The Suez would see the brunt of this new wave of investments. New bases for the Regia Marina, and new projects for Italian investments to flow into. Peering outwards, into the night sky, he noted that the same stars that greeted his gaze were now guarding every corner of the Kingdom's domain. Silent sentinels. It was their unflinching sense of duty that he needed to emulate in order to see Italy through her trials, and so he would."
 postmalta.4.a:0 "This he swore, by the stars."
 
 postmalta.5.t:0 "The Potential in Africa"
 postmalta.5.desc:0 "Il Duce stared down at his economic reports in frustration- all of which relating to Africa in one way or another, naturally. Some of ENI's goons had been pressing Ciano for a "consideration of expanding the Infrastructure in Africa". To Galeazzo, it seemed more and more like they were trying to waste his time. Of course, It was not like throwing more funding to Mattei would suddenly make Africa a worthwhile part of Italy's expense reports. As a whole, Africa was far from being the gem of the empire, not that the Natives made things any easier. The Algerian Partisans were making the settlement programs nearly impossible, East Africa had never really stopped fighting against Mussolini and the Levant was still a boiling mess of instability.\n\nCiano knew of what lay beneath the surface of Africa. Who hadn't? The Japanese were always trying to carve out themselves a corner of the middle-East, and the Germans already had a firm grip over Iran. The sheer amount of Oil that flowed through the ground could do wonders for Italy's coffers now that it's biggest supporters (Iberia and Turkey) had fled following Malta. In fact, if it weren't for those damned Partisans and those old incomprehensible infrastructure systems, Africa could quickly become a beacon of relative prosperity.\n\nCiano looked back at his maps with a newfound earnest. In the span of a moment, he began picturing new oil fields in Abu Dhabi, the most modern and well-designed railroads spanning across Tunis, and nothing less than the most elite Special forces patrolling in the Levant. Il Duce smiled. Perhaps there was use for Africa yet."
 postmalta.5.a:0 "For a brighter future and a stronger Empire."
 
 postmalta.6.t:0 "Quelling the Flames"
 postmalta.6.desc:0 "Ciano looked down at the web of Industrial nodes spanning across the empire and focused on those cut off from the rest of the Mediterranean, leaving Italy adrift as it seemed that all trade partners had abandoned them. Already, there were reports of stability falling alongside the stocks of ENI, as the radicals across the empire took the opportunity in spreading their virulent beliefs. He couldn't believe it in the least. How could this happen? Had he not treated his allies well? If anything, they should have at least spoken of some terms to leave on, but now all three nations of the Triumvirate were trapped in an economic quagmire, seemingly without any way out.\n\nCiano thought of Iberia, the threat of Germany keeping them in line and within his sphere. Or what of Turkey? Resurgent as ever, it seemed nothing would stop their endless conquests for old claims, satiated only by fear of the Pakt. He reminded himself of the duty of the Duce and returned his attention to Italy, where he looked up to his advisors. "Malta has crippled us. We have no allies; we have been abandoned. We can no longer afford to stagnate, but first, I must know what plagues our Empire." Ciano demanded, if while seeming not a little detached.\n\nThe Aide looked up from his pile of notebooks and regurgitated his assessment of Italy's instability in the streets. "Riots in Sicily and Northern Libya, unrest on behalf of the Communists in the North, our essential trade has effectively dried up, and most of our industry is laying off its workforce in seeming reckless abandon. It is my recommendation we turn our attention inwards and begin calming down the population." The aide's response was concise, as though practiced thousand times over. He was clearly more well versed in economics than Ciano ever was, for better or worse.\n\nSuch a subject as economics always gave Ciano a terrible headache. No wonder he always found himself thinking of his allies. But now was not the time for dreaming of bygone friends, now was the time for action! Ciano just had to make it known. "We can no longer consider ourselves an Empire, so much as a nation of problems. We must marshal our nation to combat this disaster, and to treat our problems as what they are- a disaster! We need to focus on putting Italy back on the map, and for the people to know we've done it! Tomorrow, I speak to Sicily, until then? Get the businesses back in order". He looked back at the maze of nodes decorating Italy. He knew in reality, riots and protests were breaking out all across that map. No matter. "
 postmalta.6.a:0 "Nothing a speech can't fix."
 
 postmalta.7.t:0 "The Crossroad Of Destiny"
 postmalta.7.desc:0 "The ancients believed the fates of mankind to be decided by the Moirae, a trio of crones who endlessly weaved a world-sized tapestry. Each thread a life, each knot a meeting, each cut a death: to each their own, from the smallest of children to whole cities and empires, without kindness or malice - such was the way of Clotho, Lachesis and Atropos, the Apportioners of Fate, whom not even the gods themselves could influence.\n\nWere these old tales to be true, today the three Moirae would be focused on the fate of one peculiar piece of their eternal tapestry. Italy, the country of crossed destinies, hangs in the balance, and the time to choose its road has come: the wool is ready, the loom awaits, all that is needed is a consensus.\n\n"The time has come to weave a new thread into this scene, my sisters." would say Clotho the Spinner, creator of new life: "For too long has Galeazzo Ciano suffocated Italy: let us weave new threads, those of the Quadrumvirate, and see what comes out."\n\n"How about letting his thread continue, dear Clotho?" may interject Lachesis the Apportioner, the prolonger of lives: "A single thread may become two, then ten, and then a hundred: let us see how this turns out."\n\n"Oh, the young and fool," might be the interjection of Atropos the Inexorable, ender of destinies: "No thread is eternal, and this one has been going on for too long. The time has come to cut it, and weave new ones from its wool: we cannot have feelings, my dearest sisters, and if pain and suffering come from our work, so be it."\n\nTale, legend, lie, truth. Who knows what this conversation might be, and perhaps it does not matter: fates are outside of our control, and so are outside of the control of Galeazzo Ciano - for unbeknownst to him, the Moirae have chosen..."
 postmalta.7.a:0 "To cut Ciano's thread, and let everything begin anew."
 postmalta.7.b:0 "To prolong Ciano's thread."
 postmalta.7.c:0 "To weave the thread of fascism."

 postmalta.8.t:0 "Picking Up the Pieces"
 postmalta.8.desc:0 "It was all falling apart.\n\nCiano paced around his office in the Palazzo Braschi, his mind a blur. He had barely gotten a moment's rest since he and his staff had been evacuated from Malta back to Rome, as what had transpired after happened simply too quickly to allow even a moment to breathe. The inevitable phone calls from his counterparts in Madrid and Ankara had come almost as soon as their respective leaders had touched down in their nations: the Triumvirate, Ciano's grand alliance against the Germans, was gone.\n\nThe madness hadn't stopped there. Reports were coming in from all corners of the empire, as those both home and abroad seemed to seize on what many saw as a moment of weakness. Tensions were rising everywhere, student agitators were growing louder, and the natives were growing restless. It all seemed inescapable, a man caught in a trap, with only the utter destruction of all at the end.\n\nThere was a knock on the door, before his secretary pushed open the door, the tired thing squeaking on its hinges. "Duce? We have reports coming in from Apulia-"\n\nWith a wordless roar of rage, Ciano seized a nearby statuette embossed with the logo of the Triumvirate and hurled it at the wall next to his secretary's head, where it exploded into a shower of debris.\n\nCiano stood there, frozen in the action, simply panting as the rage left his body. "Five minutes," he managed to get out at the startled secretary, "Give me just five minutes and I'll see the reports."\n\nThe secretary nodded, shutting the door as Ciano slunk over to a nearby chair, practically falling into it. Everything that he had created, from the smallest of decrees to his most grand of plans were coming apart at the seems. But no. He refused to let things end like this. Steeling his gaze, he got up from his momentary rest, and begun to pace once more."
 postmalta.8.a:0 "He was Galeazzo Ciano, and he would fix this."

 postmalta.9.t:0 "Check"
 postmalta.9.desc:0 "Despite his earlier declaration, Ciano was finding it harder to stabilize his regime than he had at first anticipated.\n\nIf he were being honest with himself, he would be forced to admit that his hold over Italy was crumbling. It was an unfortunate admission of weakness, even to be made in private, but he was finding it necessary to admit fault to repair the structure. He couldn't just afford to ignore these problems in the hopes that they would simply go away and leave him alone.\n\nThey would never leave him alone, especially not in this moment of weakness. It was one of the most basic tenets of conflict: strike where the enemy was weak. Partisans had been extremely active in the north of Italy, riling up the people of the northern industrial cities and radicalizing against Rome. Things were looking bad closer to home as well. There was significant opposition to his regime inside even the PNF itself, one that seemed to grow with every bad thing that had happened to Italy since he had taken power.\n\nSighing, Ciano slunk back into his seat, sighing deeply. Getting up, he walked over to a glass cabinet standing against the wall, producing from it a bottle of brandy and pouring himself a glass.\n\nAs he studied the color of the drink, a reflection of the portrait that sat above his desk caught his eye. It was a portrait of Mussolini, staring imperiously at some far off point behind the painter. It had been a gift from his father-in-law upon his ascension to the party. He didn't know why he had put it up on the wall, nor why he had yet to take it down. But now, staring into the eyes of the first Duce, he felt something stirring within him.\n\n"Oh father," he said to the portrait, almost reverently, "Grant me the strength and guidance to lead Italy through these troubled times.""
 postmalta.9.a:0 "Saluting to the portrait, Ciano downed his drink."

 postmalta.10.t:0 "Consequences of Disloyalty"
 postmalta.10.desc:0 "Maria trudged exhaustedly up the streets of Florence, her feet sore and her limbs like lead as she made her way home from work. Despite her raggedness, the sound of muffled voices just around the corner of an old church piqued morbid interest. Though they were hard to make out, there was clearly a quarrel taking place. The young woman clung to the cobblestone wall to do a bit of eavesdropping over the subtle growl of a truck.. "Please, sir, I've been preaching here for nearly 50 years! You can't expect me to just sit here while you try to shut me down!" Pleaded someone, with a voice filled with indignation and strained by age.\n\n"You had your chance! We asked you to swear your oath to our Duce like the rest of the church, and you refused. You're lucky you aren't being hung for treason, now do as I said and put your hands on your head." Came the reply, blunt and yet dripping with poorly concealed glee. At this point, Maria's intense curiosity had overridden her common sense as she opted to glance hurriedly around the corner, before almost immediately turning back, heart in her throat. A Blackshirt. She held her shaky breath, yet continued to listen, grotesquely enraptured by the display of the recent public outrage over the Duce's order.\n\n"That order was malicious and unfair, and you know it! He's just trying to put us in his pocket! I serve only the L--" The priest was silenced by the sickening crack of shattering bones. Maria winced as she heard his broken form thump to the ground, punctuated by another stomach churning crunch as the Blackshirt planted a boot in his ribs for good measure. The next sound was a clunk, presumably the poor man being tossed carelessly into the back of the truck. The door slammed, and the vehicle rattled its way down the street, its sound fading into the noisy backdrop of the city."
 postmalta.10.a:0 "It's never been about God."
 
 postmalta.11.t:0 "The More Things Change"
 postmalta.11.desc:0 "The air in Turin was warm and the streets were packed, filling the city with the buzz of conversation, were it not drowned out by the sound of marching bands warbling out their patriotic tunes. Despite his earlier condemnation by the party and the Duce, all these people were out in full force in support of Muti. Italians peered out their windows at the marches taking over their city - it's not like they had much else to do, with their commutes blocked by the crowds, their focus disrupted by noise and the sounds of their radios or television sets smothered by shouts. One such street was packed with these folks, slogans were shouted and banners were waved along the historic avenue. It was at once a jubilant gathering and a zealous expression of support towards the outcast fascist, who now stood upon a podium in front of the throng.\n\nThe man leaned into his microphone, his demeanor shockingly calm for his political situation. Wearing his trademark winning smile, he tapped the mic twice before clearing his throat, and beginning to speak. "Good Afternoon, my friends! I am glad to see all this support of our cause, as much as Ciano may want to stamp it out." A raucous cheer punctuated his words, which he responded to with a faux-humble chuckle, before straightening his face to begin his speech proper.\n\n"People, I am doing this all for you! We all want to see progress, to build a proper country! Some, however, would not like to see this. But that is okay, they do not represent the people, they do not speak for you, countrymen! You speak for you! I speak for us all! Ciano and his gaggle of drooling sycophants thinks he can stop us, but no! Ciano cannot stop our movement, because our movement is one of all of Italy! Prosperity is within our grasp, people! Do not let him take it away!" Muti stepped down from his soapbox, and the march continued just like it always did even before his condemnation."
 postmalta.11.a:0 "... the more they stay the same."

 postmalta.12.t:0 "Death Rattle"
 postmalta.12.desc:0 "Giani loosened his tie as he sat, hunched over a microphone in some bland studio in Nowhere, Rome. Sweat was beading down his forehead, perhaps from the mediterranean heat or perhaps from the stress welling up in him. He had already shifted his blazer from his shoulders, leaving the drenched garment resting on the back of his chair. Grinding his teeth, he waited for the hand on the clock across from him to strike 6:00 PM. Just a few more minutes, then his time would come.\n\nThat snake Ciano was out to get him, he knew it, and he wanted the people to know as well. The man was waging all out war on his movement, on the soul of Italy! Giani sat harboring an uncharacteristic frustration, tempered by his finely crafted charismatic exterior. Still, it was hard not to tell that he was seething. The clock struck six and Giani leaned into the microphone to begin speaking.\n\n"Good Evening, children Italy. I come to you with an important message, a further update on the trickery of the heartless, liberal 'Duce' Ciano. Unsurprisingly he continues to try and keep the Italian race from reaching its destiny! That 'man', if the degenerate is worthy of that title, does not want you to know that he is chipping away at the sanctity of our race, our state, our very souls! His latest efforts consist of shutting down the schools we have built, to keep you all from realizing the truth! The truth that that bastard is not the duce, that he does not deserve to carry on the legacy of Mussolini, that he wants to destroy Italy! People of Italy, remember: do not betray your race, nor your state, for this liberal coward. Good night." The demagogue settled back into the chair as radios across Italy went silent. Satisfied with his plea toward the people, little did Giani know that barely anyone had bothered to listen, and even fewer had cared. His movement was drowning, and all Giani could do was tread water."
 postmalta.12.a:0 "Another sermon to the deaf."

 postmalta.13.t:0 "The Frustrations of Empire"
 postmalta.13.desc:0 "Ciano groaned with exhaustion and took another long draught of wine, savouring the taste and feeling his headache fade. Spread across his desk were maps of the Italian Empire and from the perspective of the maps, the Italian Empire was in fantastic condition. Not since the days of the Roman Empire had Italy controlled more territory and straddled the Mediterranean in such a way.\n\nOf course, only a fool would look at a map and consider it sufficient to judge the health of the Empire. Indeed, as Italy had grown on the maps its ability to govern its empire had shrunk. With the collapse of the Triumvirate, Italy's dominance over the Mediterranean was also fading, having been more reliant on its partners for its power than Ciano would have liked to admit.\n\nTo the side of the maps were the stacks of papers detailing the Empire's problems. Each pile contained a hideous variety of steadily-mounting problems as well as excuses and complaints from local officials. One pile contained reports from Italian garrisons in the Balkans complaining of the lack of resources and support from the homeland as well as vicious attacks from the elusive partisans. Another teetering tower detailed the activities of anti-colonial radicals in the Middle East and North Africa, the growing insolence and insubordination of the locals and the fading Italian administrations in the region.\n\nFinally, the papers he tried to avoid the most dealt with Italian East Africa. East Africa seemed to have all the problems of the other regions of the Italian Empire while being the most distant, the most intractable and difficult to deal with. Ciano had learned to approach that pile carefully, lest the resulting headaches and frustration doom his work for the night to an early halt. Nevertheless, one of these regions would have Ciano's direct attention for the coming year, and perhaps he could set some matters right."
 postmalta.13.a:0 "The Balkans are close to home"
 postmalta.13.b:0 "The Middle East is the Imperial Jewel"
 postmalta.13.c:0 "East Africa can still be saved"

 postmalta.14.t:0 "Closing Tabs"
 postmalta.14.desc:0 "Ioannis Voulpiotis quickly made his way to the office of Georgios Themelis, a very important paper in his hands. He greeted the president and jumped straight into the most recent news, "Sir, the Italians have just notified me that they are aware of our government's... current situation. Since the collapse of the Triumvirate is likely to harm what little of our economy remains after Atlantropa and the Great Famine, Ciano has decided to clear out our debt owed to Italy."\n\nThemelis processed this information, and then asked, "How much of our debt is gone?" Voulpiotis handed him the paper the Italians had sent him, and the two men celebrated briefly.\n\nThemelis looked to Ioannis Voulpiotis, "They didn't say anything else? Nothing about the resistance? Our government's countless other economic woes?"\n\nVoulpiotis shook his head, "No, sir. They stated that those were, 'domestic issues,' and that we'd have to deal with them ourselves."\n\nThemelis returned to his chair, sobered by the news. While this act was an important step to stabilizing Greece, it was merely a crutch buying their government some time. Voulpiotis hoped that at least now the Italians might at least pay attention to their government's problems from now on."
 postmalta.14.a:0 "Hey, at least it's better than nothing."

 postmalta.15.t:0 "The Status of Montenegro"
 postmalta.15.desc:0 "Ciano sighed as he read another poor financial report that had found its way onto its desk. Ciano's secretary interrupted his reading to inform him that Ranieri di Campello had arrived with his report on Montenegro's status in the wake of the Malta Conference. Soon after, di Campello entered Ciano's office, saluting him as he stood before his desk.\n\n"So, what's the situation over there in Montenegro? Are things going well?"\n\n"Well, sir, the situation is... less than desirable. While we have a firm presence on the coast and in Podgorica, the capital, the countryside is effectively in anarchy," said di Campello, looking somewhat nervous as he spoke.\n\n"What do you mean, 'in anarchy?'"\n\n"Partisans openly roam the countryside, and the populace despise both us and our collaborators. Our only way of asserting any control is to let chetniks conduct terror raids, but that doesn't make the situation any better in the long-term."\n\n"Seems like a difficult situation, but we can't let this continue. I need you to expand our control deeper into the countryside, can you do that?"\n\n"T-That would be a very difficult," Ciano glared at him and he quickly changed his tune, "... but I'll do the best I can with the resources I have, sir," replied di Campello. Ciano dismissed him and di Campello gave a quick salute and left Ciano to resume his paperwork."
 postmalta.15.a:0 "Ranieri will get the job done, I'm sure."

 postmalta.16.t:0 "The Tunisian Succession: Prelude"
 postmalta.16.desc:0 "While Tunisia was not affected much by the chaos of Malta, recent rumors trickling out of the Bey's palace have confirmed the worst: Bey Muhammad's health is deteriorating rapidly, and he will likely expire in the next few months.\n\nThis succession comes at the worst possible moment for the Italian Empire. Following the failure of our attempts to directly annex Tunisia, the current Bey was appointed by us to serve as an eternal regent, granting Tunisia some autonomy from the Empire in exchange for stability. However, many expect the Crown Prince, Hussein III, to steer Tunisia in a more independent direction, threatening to upset the delicate balance that has held for more than a decade. To make matters worse, our intelligence suggests that Tunisia's long-simmering communist movement is growing in strength and boldness on the heels of amplified calls for Tunisian independence. If we do not play our hands carefully, we may see Tunisia slip from our grasp entirely."
 postmalta.16.a:0 "What once was Carthage will know its place!"

 postmalta.17.t:0 "Egyptian Nights"
 postmalta.17.desc:0 "Lupo had come to like Cairo. In his career as a SIM agent, the city was like a second home as he tracked the Empire's enemies, spied on their conversations and occasionally slit a throat or arranged an "accident". Now, however, he was following King Farouk of Egypt, on direct orders from the highest levels of government. The Italian agent watched as the pudgy King worked with his advisors, performing the bare necessities of governance before he departed from the palace shortly after noon.\n\nLupo and his team followed Farouk as the King and his entourage headed into town. A long, languid trip to the spa followed, the SIM agents watching with bemusement as the rotund Farouk paddled in a pool to the enthusiastic applause of his loyal courtiers. Then, with two beauties on his arm, Farouk entered the hotspot of Cairo Nightlife, the Ramesses Casino.\n\nThe King of Egypt was a familiar face at the casino and had a flute of champagne in his hand mere seconds after coming through the doors. Lupo, in an ill-fitting tuxedo, continued in his role as the King's shadow. Farouk flitted from table to table, losing eye-popping sums at the baccarat table to the guffaws of his female companions before making some money back on the roulette wheel. Lupo found himself drawn in, rooting for the playboy King with the bright smile. When Farouk crashed and burned at the poker table, his pair of 9s routed by a straight flush, the Italian felt the same disappointment as the king's companions.\n\nLupo retreated to the Casino bar, letting a colleague take over the task of surveilling Farouk. To Lupo's trained eye, the King seemed to care just enough to maintain his position which granted him a luxurious lifestyle. He certainly didn't seem like a threat. The bartender wandered over to Lupo, inquiring whether he'd like a drink, the SIM agent smiled."
 postmalta.17.a:0 "Martini, shaken, not stirred."

 postmalta.18.t:0 "The Brute of the Mine"
 postmalta.18.desc:0 "Alessandro Favalla loved his job. He woke up early every morning, drank his coffee quickly and hummed on his walk to work. The climb up the hill to the mine hardly daunted the jaunty Italian, whistling in time with the swing of his truncheon. He was a familiar face to the guards at the gate and was waved into the mining compound. Mine carts loaded with ore were already rolling out of the dark tunnels, hauled out by teams of dirt-covered natives.\n\nAs Alessandro approached, one of the men hauling the cart collapsed into the dirt. A jolt of energy struck Alessandro and he stormed over, his knuckles whitening around the truncheon. The fallen man's fellows slunk away as Favalla approached, they knew him well by this point.\n\n"Get up, you dog! You lazy bastard!" The tip of Alessandro's boot struck the man in the side once, twice, thrice and the Italian's smile only widened. The native coughed up something red and Alessandro stepped away in disgust. He selected several natives and barked: "Throw this layabout out!" With grim and practiced resignation, the man's compatriots hefted him on their shoulders and carried him outside the gate before returning to the dark mines.\n\nAlessandro Favalla swung back around, basking in the admiring glances from the other guards. They all knew the only way to deal with the lazy natives was a firm hand. The mine had to run day and night, spewing forth its bounty of mineral riches and Favalla and his ilk were just the sort to keep it going. As the brutes congratulated one another, they missed the glances between the native workers, the dull hatred that burned ever brighter with each day. Italy's reach in East Africa, buttressed by the truncheons and brutality of Favalla and his sort, was slowly fading and they were all too blind to see it."
 postmalta.18.a:0 "The twilight of empire."

 postmalta.19.t:0 "The Master of the Villa"
 postmalta.19.desc:0 "Villa Palazza was one of the finest homes in Addis Abeba, sprawling across one of the hills overlooking the city. The neighboring villas, each beautiful works of architecture themselves appeared more as handmaidens to Villa Palazza than equals. Within, the patriarch of the Federico family, Alberto, and his family were enjoying a particularly fine lunch. Though none of the Federico children had ever seen Italy, they were well-acquainted with the motherland's cuisine, devouring the freshly-made pasta. Alberto, savoring the taste, gave a small nod to the Ethiopian chef who had adapted to the demands of Italian gastronomy with aplomb. The man gave a nervous bow and smile in return. Behind him, the glowering portrait of Alberto's father, Colonel Ricardo Federico, the picture of martial virtue in colonial fatigues, loomed over the diminutive cook.\n\n"Father," One of Federico's older children, Marco, began: "I saw two men get arrested in front of my school yesterday. One struggled and a policeman shot him," The rest of the family stopped eating, tension hanging in the air.\n\n"That's horrible, Marco," Federico replied as the chef left the dining room "And I'm sorry you saw that. You know that the government is very worried about radicals. We don't have anything to do with all this. We don't kill anyone or have slaves and I suggest you focus on your studies." The boy nodded, his eyes fixed on his plate.\n\nAlberto stood up and kissed his wife goodbye; he had to stop in at the office. The journey into town was pleasant, his driver a talented local who knew the roads like the back of his hand. Alberto arrived at Federico Exports to a new pile of export requests, demands from the homeland for more and more precious minerals. With a sigh, but grateful for the business, Alberto began calling his contacts in the mines. He didn't know how the mines operated, or who worked them, but he knew he needed all the ore he could get."
 postmalta.19.a:0 "A palace built on blood and bone."
 
 postmalta.20.t:0 "Verona Beckons"
 postmalta.20.desc:0 "With the tragedy of the Malta Conference and the Triumvirate behind Italy, she must not dwell on her past, but rather look forward to her future. In the fair city of Verona, the stage is being set for an event that could forever alter the future of Italy.\n\nIl Duce Galeazzo Ciano seeks to defend his rule and unify the divided and fragmented PNF. With Italy and her empire stagnating, the Duce has never been more vulnerable. However, Ciano believes that he has an ace up his sleeve, King Umberto. However, the nature of the relationship between the Duce and the King is complicated to say the least. Even if Ciano were to emerge from Verona victorious, there is no guarantee that the King will remain on his side...\n\nOf course Ciano's victory is far from assured. The fascist Quadrumvirate circle him like vultures circling their prey. Alessandro Pavolini, Italo Balbo, Ettore Muti, and Niccolo Giani, four men united in their dedication to fascism and their opposition to Ciano. Each one of them believes that they are uniquely qualified to reverse Italy's stagnation and once again lead the nation into glory, just as Mussolini did years ago. Of course, only one man can claim the title of Il Duce...\n\nAs Ciano and the Quadrumvirate vie for the favor of the PNF, the people of Italy grow restless. They tire of the barbarity of the blackshirts and the empty promises of the Duce. As the men of the PNF continue their game of politics, the desire for change in Italy only grows louder and louder. The meeting of the PNF in Verona might just be the perfect chance to finally make their anger known...\n\nCiano, the Quadrumvirate, and the People. Each faction vies for control of Italy and her vast empire. Whoever wins will surely change the course of Italian history forever."
 postmalta.20.a:0 "For Il Duce and the King!"
 postmalta.20.b:0 "For Fascism!"
 postmalta.20.c:0 "For the People of Italy!"
 
 postmalta.21.t:0 "Victory in Rhodes"
 postmalta.21.desc:0 "The defence of Rhodes was successful.\n(Loc for this event has been requested)" #TODO: request loc!!!
 postmalta.21.a:0 "E Vinceremo in terra, cielo e mare!"

 ##Italo-Turkish War events##
 ITA_med.700.t:0 "The Libyans Arrive" ### Keep this and hook it up properly later - Thunderslav
 ITA_med.700.desc:0 "It was a hot and dry day like any other, when the Libyans reached the Levant. The nature of their deployment, and the oppertunity it offered for propaganda meant that they where personally met by Governor-General dalla Chiesa. As he wrapped up his address to them, he left the stage to personally speak with the volunteers. Just when it seemed that the event was over, a soldier approached him.\n\n"Hello there, General dalla Chiesa, it's a pleasure to finally meet you in person". Chiesa turned to look at the voice, a fresh faced young soldier, who's accented Italian easily revealed that he was of native Libyan descent.\n\nHe nodded in response, and asked the soldier why he had decided to volunteer for the war. The soldier smiled before answering "To do the job that only we arabs can do, sending the Turks packing out of Arabia" Dalla Chiesa stared at the man for a second, shocked that anyone would take that sort of tone with an officer. After a moment, he smiled, before asking the soldiers name.\n\n"Gheddafi sir, Capitano Muammar Gheddafi""
 ITA_med.700.a:0 "Gentlemen, welcome to the Levant."
 
 ITA_space.1.t:0 "Attraverso le Avversità, fino alle Stelle"
 ITA_space.1.desc:0 "Inside the reinforced, sound-proofed control room of Italy's jackup platform that stood on the coast of Kenya, stood Armin Krüger. With five minutes until the countdown clock would reach zero, he observed workers scurrying to complete the launch procedures while his brainchild's upper stages were being filled with nitrogen tetroxide fuel. Two decades ago, he had been a pioneer of the emerging field of rocketry, helping to design the missiles that bombarded Britain in preparation for Operation Sealion. After the war, his future had looked bright. Germany, fresh from an unlikely triumph over the Allied word order, now had turned its gaze towards the stars. But then, less than a decade later, Germany's economy collapsed, and with it fell the German dream. Armin knew where the wind was blowing, and after much deliberation, he and his family fled across the border to Germany's new rival. Il Duce knew that space would be the next frontier for competition between the great powers, and sought for Italy to develop space launch capability of its own. Armin brought with him the secrets of German rocketry, and under the wings of the newly-established Agenzia Spaziale Italiana, he would begin to design a new family of launch vehicles. Now, years of labor were about to pay off. The Europa 1 rocket that stood in front of him was merely a demonstrator, as its three stages could only put a measly ton of payload into Low Earth Orbit, and could not launch payloads to a greater altitude. For now, that would be enough.\n\nSirens blared as the countdown reached its last minute. The workers scampered into the bunker as the Europa 1's stages pressurized. Armin waited as the moment of truth approached. Finally, with a flash of light and a tremor that, from this distance, shook the control room to its core, the rocket lifted off the pad, and ascended to the heavens. In only a few minutes, it escaped the Earth's atmosphere and boosted its payload into a stable orbit, two hundred and fifty kilometers above the Earth. The San Marco A, as the satellite was called, was quite primitive, containing only a radio transmitter and a sensor to measure the concentration of charged particles in the ionosphere. Still, it would be noticed by any ham radio operator beneath it. A day later, the Italian government announced that it had become the fourth nation to launch a satellite into orbit, and proclaimed that even the Earth's gravity well could not stop the flame of the fascist revolution.\n\nBut their work had only just begun."
 ITA_space.1.a:0 "Forza!"
 
 ITA_space.2.t:0 "Launch of the San Marco D"
 ITA_space.2.desc:0 "On a pleasant November morning, the Europa 2 rocket made its debut launch from the same jackup platform that had carried the San Marco A into orbit two years before. This launch vehicle was an evolution of the Europa 1 design, having been fitted with a fourth stage that would allow it to boost about a hundred kilograms of payload into geostationary orbit. A small margin, but one that would be sufficient for the mission at hand. This Europa 2 rocket would carry into orbit the San Marco D satellite - the last of ASI's initial forays into spaceflight. Once in orbit, the rocket's fourth stage would boost the payload to an altitude of twenty five thousand kilometers, right in the middle of Earth's Van Allen radiation belts. For Germany's moonshot, they would be easy to compensate for, as it passed through them in the span of a few hours, but keeping a satellite in an orbit that permanently intersected them would be a different challenge altogether. The San Marco D carried instruments to measure the density of the energetic particles trapped within the belts, along with their effects on electronics. The satellite operated for one week before suffering a catastrophic short-circuit and shutting down completely. However, the data it yielded would be invaluable to not just the Italians, but to satellite operators around the world. With this success, ASI continued to the next milestone of its project."
 ITA_space.2.a:0 "Science marches on."
 
 ITA_space.3.t:0 "Pebble in the Sky"
 ITA_space.3.desc:0 "This March, the Europa 2 made its final flight when it launched the Sirio-1 satellite into a geostationary orbit. It sported radiation-hardened electronics designed using data gathered from the San Marco D satellite, allowing it to operate for years in the outer Van Allen belts. While it contained scientific instrumentation similar to those on its predecessor, its primary payload was a set of high-band transponders that would allow it to receive and transmit radio signals from across the globe. Over the next two years, ASI would use it to test the viability of using satellites to transmit not just radio communications, but television and even cinema. Many futurists had speculated about the possibility of creating a network of communications satellites in geostationary orbit for civilian use, and now, the Italians were attempting to bring one into existence. However, the satellites that would be required to construct such a network required a far higher payload capacity to geostationary orbit than the Europa 2 could provide. A new rocket would be required to complete this project. Fortunately, work was already underway on Italy's next launch vehicle. One that the entire world would take interest in."
 ITA_space.3.a:0 "Let's see what Krüger has in store."
 
 ITA_space.4.t:0 "Debut of the Europa 3"
 ITA_space.4.desc:0 "Armin Krüger stood inside the control room of the jackup barge as ASI's latest creation underwent preparations for its first flight. The skies were overcast, though the weathermen believed that the launch could proceed without significant risk. Seven years ago, he had watched Italy's first orbital rocket take off from this very facility, an event that had given hope to the lesser powers of the world. Now, he hoped that Italy could change the world again.\n\nThe Europa 3 that now stood on the launch pad was a radical improvement over its predecessors. Possessing a two-stage core design that could place seven and a half tons of payload into Low Earth Orbit, the Europa 3's standout feature was its modularity, as it could be augmented with an optional third stage and up to four solid rocket boosters. Fully augmented, it could place as much as eighteen and a half tons of payload into LEO or seven and a half tons into geostationary orbit. This upgrade was necessary, as spaceflight had long moved beyond the lightweight payloads that had flown in the early days of the Space Race.\n\nAs the countdown approached zero, Armin waited, fearful of the consequences if Italy's latest venture suffered an unexpected setback. Fortunately, the rocket took off without a hitch, its four RX.2 engines propelling it through the gray layer of clouds above the platform and out of sight. A few minutes later, the Europa 3 finished boosting the Sirio-2 satellite into its geostationary orbit. It was to be the first proper communications satellite launched by Italy, servicing the Mediterranean and the Middle East. Over the next few years, more would follow.\n\nThat would not be the most important outcome of the launch, however. Only a few days after the Europa 3's maiden flight, ASI made a surprising announcement: It would allow third-party operators to launch their payloads into space, and provided a range of prices for the various configurations of the Europa 3. Many nations and commercial satellite manufacturers alike began placing orders for ASI's launch services. This was the beginning of a commercial revolution in spaceflight that would transform it, as for the first time in human history, private entities and second-rate powers would have access to outer space."
 ITA_space.4.a:0 "But Italy's ambitions would not stop there."
 
 ITA_space.5.t:0 "The Seat Wars"
 ITA_space.5.desc:0 "In the months following the Glenn administration's announcement of the resumption of manned spaceflight by the United States, Italy approached the new President with a proposal that raised more than a few eyebrows in Washington. The latest member of the OFN had gained access to space almost a decade ago, but the Agenzia Spaziale Italia had limited itself to unmanned operations. This may no longer be the case. Hoping to make use of their new ally to do what they cannot, ASI has requested for a seat aboard a NASA spacecraft to be reserved for an Italian astronaut every few missions. While a few members of the Glenn administration were receptive to the idea, a significant portion of the RD senators and a majority of the NPP senators strenuously objected, arguing that NASA is a purely American endeavour and access should be restricted until Italy has proven itself worthy to fly aboard American rockets. Even Glenn himself was skeptical, perhaps out of his personal attachment to the program. Regardless, ASI will not back down, as the possibility of an Italian flying into space is too great a prize to forsake. It appears that the "Seat Wars" will not be resolved for some time yet."
 ITA_space.5.a:0 "The Americans had better see reason."
 
 ITA_space.6.t:0 "Italy Granted Seat on NASA Flights"
 ITA_space.6.desc:0 "In a surprising turn of events, NASA and ASI have jointly announced that, after more than a year of negotiations, NASA will allow an Italian astronaut to fly aboard a mission to Low Earth Orbit, and Italy may reserve seats on future missions. In Italy, this news has been greeted with jubilations as the dream of an Italian flying into space has become a reality. Already, ASI is searching for potential astronaut candidates to undergo a grueling two-year training regimen, after which they will either drop out of the program or achieve the status of astronaut. The Italian people can only hope that someone will step up to the challenge."
 ITA_space.6.a:0 "After Atlantropa, Italy once again learns to dream."
 
 ITA_space.7.t:0 "The Seat Wars"
 ITA_space.7.desc:0 "In the months following Italy's entrance as an equal partner of the Co-Prosperity Sphere, the nation approached the Japanese government with a proposal that raised more than a few eyebrows in Tokyo. Italy had gained access to space almost a decade ago, but the Agenzia Spaziale Italia had limited itself to unmanned operations. This may no longer be the case. Hoping to make use of their new ally to do what they cannot, ASI has requested for a seat aboard a JAXA spacecraft to be reserved for an Italian astronaut every few missions. While a few members of the bureaucracy were receptive to the idea, a significant portion of House of Peers strenuously objected, arguing that JAXA is a purely Japanese endeavour and access should be restricted until Italy has proven itself worthy to fly aboard Japanese rockets. Even the Prime Minister himself was skeptical, perhaps out of his personal attachment to the program. Regardless, ASI will not back down, as the possibility of an Italian flying into space is too great a prize to forsake. It appears that the "Seat Wars" will not be resolved for some time yet."
 ITA_space.7.a:0 "The Japanese had better see reason."
 
 ITA_space.8.t:0 "Italy Granted Seat on JAXA Flights"
 ITA_space.8.desc:0 "In a surprising turn of events, JAXA and ASI have jointly announced that, after more than a year of negotiations, JAXA will allow an Italian astronaut to fly aboard a mission to Low Earth Orbit, and Italy may reserve seats on future missions. In Italy, this news has been greeted with jubilations as the dream of an Italian flying into space has become a reality. Already, ASI is searching for potential astronaut candidates to undergo a grueling two-year training regimen, after which they will either drop out of the program or achieve the status of astronaut. The Italian people can only hope that someone will step up to the challenge."
 ITA_space.8.a:0 "After Atlantropa, Italy once again learns to dream."

