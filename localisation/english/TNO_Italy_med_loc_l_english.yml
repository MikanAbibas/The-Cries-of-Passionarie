#Facsist Verona tree
ITA_quousque_tandem_galeazzo:0 "Quousque Tandem, Galeazzo?"
ITA_quousque_tandem_galeazzo_desc:0 "With his incompetence, Galeazzo Ciano is sentencing the Empire, and fascism itself, to death without even realising it. We all know this congress is, in truth, a purge masqueraded as a confidence vote, but we shall not gently disappear into the night: the time has come to step forward, and challenge Ciano for the mantle of Duce!\n\nHow long will you abuse our patience, Galeazzo?"
ITA_no_more_corruption:0 "No More Corruption!"
ITA_no_more_corruption_desc:0 "Under Ciano's tenure, the already-endemic corruption has become a lifeline for the Duce's government. Bribes, favours and embezzlement have replaced competence and loyalty across both administration and party: if this trend keeps up, the State will collapse from within by the sheer incompetence of those who should lead it!\n\nItalo Balbo, always vocal against such practices, has prepared a speech in front of the council to denounce our sorry state of affairs, and bring to his side several moderate Gerarchi who have not yet resigned to it. His speech will surely have a deep impact, but some oppose allowing Balbo too much exposure in the congress: influence is a vital currency these days, and allowing the shrewd aviator to accrue an excessive amount may have unwanted consequences in the long run..."
ITA_no_more_decadence:0 "No More Decadence!"
ITA_no_more_decadence_desc:0 "In an effort to present himself as the paladin of stability, and the middle classes that love it so much, Galeazzo Ciano has slowly but steadily abandoned many of the most important fascist policies. Youth organisations have been denied funds, the Blackshirts are being slowly sidelined in favour of the mainstream police forces, and even the Grand Council of Fascism is steadily losing power: should this trend continue, fascism will be no longer distinguishable from social_liberal!\n\nNiccolò Giani, always vocal against such decadence, has prepared a speech in front of the council to denounce our sorry state of affairs, and bring to his side several radical Gerarchi who have been complaining about it. His speech will surely have a deep impact, but some oppose allowing Giani too much exposure in the congress: his radicalism is judged by many as too excessive even for fascism, and allowing his ideals to spread unchecked may mean trouble later..."
ITA_patere_tua_consilia_non_sentis:0 "Patere Consilia tua non Sentis?"
ITA_patere_tua_consilia_non_sentis_desc:0 "The time has come for the speech to take place. The chosen orator is ready to take the podium, and expose Ciano's mistakes to the whole of the Empire: let all know that there are still true fascist in this bleak world!\n\nDon't you realize that your plans have been exposed, Galeazzo?"
ITA_no_more_anarchy:0 "No More Anarchy!"
ITA_no_more_anarchy_desc:0 "It is everyone's secret that unrest has been growing steadily across the Empire for quite some time now. The Duce's fumbled attempts at pleasing everyone at the same time has made us weak at home, allowing the red hydra to rear its ugly head once again, while his utter incompetence has turned our colonies into a hotbed of resistance: we cannot allow the situation to worsen, or it will spell doom for the Empire!\n\nAlessandro Pavolini, always vocal against such blatant violation of the fascist principle of Order, has prepared a speech in front of the council to denounce our sorry state of affairs, and bring to his side several moderate Gerarchi who understand the need for proper discipline. His speech will surely have a deep impact, but some oppose allowing Pavolini too much exposure in the congress: his absolutist tendencies are well known, and he might try to act more forcefully if not held in check now..."
ITA_no_more_weakness:0 "No More Weakness!"
ITA_no_more_weakness_desc:0 "A founded suspicion until just a few months ago, the weakness of our armed forces has been made evident in front of the whole world by the war against Turkey. Taken by surprise by those we used to consider our brothers, our garrisons performed poorly, suffering embarrassing defeats and humiliating retreats: how can we consider ourselves the fourth world power, if we are challenged by regional powers as if they were superior to us?\n\nEttore Muti, always vocal against such blatant betrayal of our military traditions, has prepared a speech in front of the council to denounce our state of affairs, and bring to his side several military-aligned Gerarchi who wish to take action against it. His speech will surely have a deep impact, but some oppose allowing Muti too much exposure in the congress: his declared loyalty to the manifest of Sansepolcro is frowned upon by many, and giving him additional political weight may allow him to challenge the established order of fascism if left unchecked..."
ITA_concilium_haec_intellegit:0 "Concilium haec Intellegit!"
ITA_concilium_haec_intellegit_desc:0 "The time has come for the speech to take place. The chosen orator is ready to take the podium, and expose Ciano's incompetence to the whole world: let all know that there are still those who will gladly fight for Italy!\n\nThe council knows it all, Galeazzo!"
ITA_the_empire_is_resurgent:0 "The Empire is Resurgent!"
ITA_the_empire_is_resurgent_desc:0 "From the glorious years of the Risorgimento, hundreds of thousands of brave Italian men have given their lives so that we could once again be whole after centuries of division, so that we could claim our birthright after millennia of humiliation. We have sworn on their blood never to let their sacrifice be in vain: the Empire is too precious to let incompetents and weaklings such as Galeazzo Ciano tear it apart!\n\nItalo Balbo and Alessandro Pavolini understand the need for a strong Italian Empire, and have prepared a joint speech to convey their message to as many Gerarchi as possible. Their speech is sure to have a deep impact, but some fear its consequences: Balbo and Pavolini already hold sway over large parts of the PNF, and allowing them even more influence might have permanent consequences on the current balance of powers within the party..."
ITA_fascism_is_resurgent:0 "Fascism is Resurgent!"
ITA_fascism_is_resurgent_desc:0 "Italy was the birthplace of fascism, an ideology that revolutionized the traditional binary conflict between communism and capitalism. It is such a shame that our ideology has been reduced in the same sorry state as the rest of the country by a spineless kleptocrat such as Galeazzo Ciano: we shall not allow the fire of our revolution be extinguished!\n\nEttore Muti and Niccolò Giani understand the need to preserve fascism from those who would wish to corrupt it, and have prepared a joint speech to convey their message to as many Gerarchi as possible. Their speech is sure to have a deep impact, but some fear its consequences: Muti and Giani each propose interpretations of fascism which would clash with what has been perceived by most as the status quo, and allowing two radicals the center stage might cause even more infighting in the long term..."
ITA_habemus_consultum_in_te:0 "Habemus Consultum in te..."
ITA_habemus_consultum_in_te_desc:0 "The time for discussion is over. Our efforts to move the hearts of the Gerarchi seem to have paid off, and many who used to be loyal to Galeazzo Ciano have changed side, and are now ready to support us: with their help, we'll force through a motion of no confidence against the current Duce, accusing him of treason in front of the entirety of the Empire, and will call a vote on it.\n\nWe have a death sentence against you, Galeazzo..."

#Ciano's Verona tree
ITA_king_of_the_sand_castle:0 "King of the Sand Castle"
ITA_king_of_the_sand_castle_desc:0 "Our hold on the country is very weak. The treacherous opposition, the democrats and the leftists have slowly eaten away at our control over Italy. Despite this, Ciano still remains as the official head of state for Italy. To ensure the survival of Italy, we must use this position of power to our advantage. If we do not use all our advantages for what they are worth, then we shall surely be destroyed in the Congress. Let us rally all that we can, for the sake of Italy and the empire!"
ITA_help_from_the_new_blood:0 "Help from the New Blood"
ITA_help_from_the_new_blood_desc:0 "One may think that the younger elements of the PNF are universally opposed to what our detractors would call 'stagnation' and 'decay'. This is not the case, however. Whilst they are not fully united behind our regime, they are still more loyal than the treacherous and backstabbing old guard. If we give the younger members more authority, it should shore up more support for Ciano and our regime. Furthermore, this move may help the party in the long term by ensuring the vitality of its members."
ITA_support_from_the_church:0 "Support from the Church"
ITA_support_from_the_church_desc:0 "Normally, the church steers clear of our politics. Despite this, religious institutions may prove crucial in defeating our enemies and saving Italy. We are their official representatives, after all, and we should not let them forget this. We can use our influence to convince churches to say a good word for us during prayer. Our cause must be known to all, and what group is better to preach to than the choir?"
ITA_directing_the_spies:0 "Directing the Spies"
ITA_directing_the_spies_desc:0 "Some may think that our so-called 'supporters' are a block completely unified behind our cause. They are gravely mistaken. Our ranks may be filled with traitors and fifth columnists just waiting to betray our cause. This cannot be allowed to stand! Starting now, the government shall be combed for deceivers and charlatans who may be feeding vital information to our enemies. Italy must not fall due to the actions of disloyal pretenders."
ITA_on_the_enemy_within:0 "On the Enemy Within"
ITA_on_the_enemy_within_desc:0 "The fascist that oppose us are a lost cause. They have already deluded themselves into opposing Ciano, and they are too entrenched in their position to retreat. Instead of wasting time trying to move an immovable object, we should instead try and pivot slightly towards the moderates. The moderates are not as stubborn as the hardliners, and may prove to be a very useful asset. Let us hope that this strategy will bring us to victory in Verona."
ITA_on_the_enemy_without:0 "On The Enemy Without"
ITA_on_the_enemy_without_desc:0 "Our opponents do not just reside in Verona. The traitorous democrats and leftists have opposed us for decades, and they have not stopped now. To appease those in the party who most want to crack down on dissent, we shall organise more suppression of the democratic opposition. This shall surely endear some hardliners to our cause, and will also increase our governments control over the population. "
ITA_turn_of_the_screw:0 "Turn of the Screw"
ITA_turn_of_the_screw_desc:0 "It does not need to be stated that leftists will never be convinced to embrace fascism. They have been deluded by illusions of equality for too long, and the only way of educating them is a prison sentence or a firing squad. Despite this, they are not an immediate threat to our regime. If we stop enforcing certain regulations, perhaps the leftists will leave us in peace until the end of Verona. This shall allow us to destroy them after we have consolidated full power over the state apparatus."
ITA_loosen_the_grip:0 "Loosen the Grip"
ITA_loosen_the_grip_desc:0 "For years, we have used the Ministry of Popular Culture to ensure that the people of Italy are not led astray . However, over the years minculpop has fallen into the hands of our political opponents, and this must not be allowed to stand. In order to gain a leg up over our enemies, we must limit the power of the Ministry. Whilst this may hurt our regime in the long run, we shall be hurt even more if we allow the opposition to have a wide platform to spread its lies and slander."
ITA_tighten_the_hold:0 "Tighten the Hold"
ITA_tighten_the_hold_desc:0 "What little influence we have left in the minculpop must be used wisely. We shall authorise a new batch of media to educate the people of Italy about the glory of Ciano and the treachery of our enemies. Radio broadcasts shall remind the people of the accomplishments of our regime, and posters will show all the glory of Ciano and the empire. We will show the Italian people who have been fighting for them for over 40 years!"
ITA_in_the_hands_of_destiny:0 "In the Hands of Destiny"
ITA_in_the_hands_of_destiny_desc:0 "The time has finally come. The Verona conference is ending, and with it the last chance for us to try to influence its outcome. Almost all of the participants have decided who they will support, but perhaps there are some people who could be bribed or threatened to support our side. Let us hope that we have done enough, and that the opposition shall not seize control of Italy and bring it to ruin."

