 ITA_med.6000.t:0 "The Enemy Within"
 ITA_med.6000.desc:0 "Lately, high ranking police officers and detectives have noticed something... odd. Across the country, there seems to be a wave of a particular type of crimes. Specifically, some armories and banks have been robbed across the country, with the perpetrators disappearing with their hands full of guns in the former cases, and of money in the latter. Such things would be considered somewhat normal, but there seems to be a pattern in place. At the same time, agents have reported that FD members and supporters have been intimidated or beaten up. We know for sure that the Brigate Nere are no more and that Farinacci's dead, but after frisking a suspicious student outside an university in Milan, policemen found a gun that had been recently stolen and a flyer containing propaganda for an organization or group called "NAR". So far, our policemen agree that these groups are probably just a small remnant of the Brigate Nere of old, and it's highly unlikely that they could be in any way connected to the recent robberies. Still, this situation will have to be monitored, if we want political violence to remain a memory of the past."
 ITA_med.6000.a:0 "We have bigger fish to fry."

 ITA_med.6001.t:0 "A Slight Issue"
 ITA_med.6001.desc:0 "At this point in time, the redistricting maps for our first election have been drafted and the careful process of apportioning seats has been completed. Or at least that is what we thought, as it appears that the state of Benito has been completely forgotten, meaning that all of our calculations are off and the state isn't factored into the overall election. Even though the desert state has a remarkably low population and is a rather embarrassing part of our empire, its people still have a right to vote for the Italian leadership fairly. How such an idiotic mistake could happen is currently baffling Rome, as it now appears that we will have to completely start the process over from scratch, from the bottom up, to ensure that these elections can be completed with every state having the ability to vote equally. This entire process hopefully won't delay the elections, but it will cost us a large sum of money to fix this simple mistake. Worse yet, many are even considering just abandoning Benito as a cheaper alternative, something that would surely cause massive outrage and set a dangerous precedent.\n\nThis is just a small part of a much larger problem, which is that the Italian Empire has very little experience in running a democracy and our bureaucrats are overwhelmed with the stress of putting on elections. The general confusion that has taken hold of the government has left us with a quite disorganized, sloppy mess with problems ranging from non standardized ballots to forgetting an entire state. Even Ciano himself seems to be in over his head as he begins to realize how difficult this process is going to be. These are rather trying times, but if we can somehow make it through these elections we should be much more prepared for the following ones to come. Let's just pray that our streak of bad luck will end and it will be smooth sailing from here on out. "
 ITA_med.6001.a:0 "How? How do you just forget an entire state?"

 ITA_med.6002.t:0 "Bruno Visentini Gives a Speech"
 ITA_med.6002.desc:0 "Being a minor party, nobody in Italy believes that Bruno Visentini and the Partito Repubblicano Italiano can win these elections. Determined however to give it his best shot, Visenti has decided to go full throttle and go for the victory. Today, as an attempt to get the people on his side, he has travelled to the University of Bari to give a speech to the students and encourage them to vote for him and his party.\n\nHe delivered his message in a small conference room on campus, with an audience of less than fifty people present and only one reporter, who was half asleep. Not to be discouraged, Visenti spoke with his usual energy, proudly exclaiming that he saw no reason why a little party like his couldn't win seats in Parliament and why even the people in that room could make all the difference. Ever smiling, he even answered questions directly asked by the audience, being caught off guard by how difficult they were. But even when asked why he even bothered running, he exclaimed proudly that he definitely won't win if he doesn't try. After talking for a bit more and making some awkward jokes that didn't quite land, he ended the speech with his new slogan of "Go we go", which he tried to get the crowd to chant with him, unsuccessfully.\n\nAs if not embarrassed enough, when Visentini turned around he noticed a portrait of Aldo Moro, his rival leading the Christian Democrats and apparently an alumni of the university, hanging behind the podium he was speaking at. And yet, even though he began to feel discouraged, he kept smiling as he left, unwilling to let down his party and the Italian people."
 ITA_med.6002.a:0 "Go we go! Go we go!"

 ITA_med.6003.t:0 "Early Polling Presents an Odd Phenomenon"
 ITA_med.6003.desc:0 "As part of our attempts to get a good idea as to how these elections will turn out, we have commissioned polling associations to go from town to town to randomly select individuals and ask them who they planned on voting for. The results are still mostly being processed and will likely be only available a few days before the elections themselves, but we have discovered one alarming trend.\n\nIt appears that in Sicily, especially in the regions scattered with old people's homes and retirement communities, there has been a shocking number of citizens declaring that they want Benito Mussolini to win in the coming elections. Apparently, the old Duce was still quite popular and even the fact that he was deceased was not enough to keep him out of politics. When confronted about why they would choose a candidate from beyond the grave, the elderly voters either were confused and thought he was still alive or were just in plain denial that he could ever not be Duce. While the numbers were nowhere near high enough to actually influence the election results, this does show one of the very flaws in democracy that ironically the fascists have targeted for decades, in that some people are simply too ignorant to choose their own leaders, and yet these ignorant people seem best drawn to the fascists who most lack respect for them.\n\nIn any event, this odd situation has become quite a joke around Italy, with pranksters making fake campaign posters of Mussolini and newspapers reporting on his popularity alongside the actual candidates. Even Ciano himself is reported to have burst out laughing upon hearing the news, finding humor in the peculiar adoration his father-in-law still contains in the hearts of the people."
 ITA_med.6003.a:0 "I wonder what Mussolini would think of all this?"

 ITA_med.6004.t:0 "Allegations of Tyranny!"
 ITA_med.6004.desc:0 "The press today was once again filled with explosive headlines about the Blocchi Nazionali. This time, it was about the blatant ties between the BN and the former Partito Nazionale Fascista. While if was fairly obvious that the BN was full of borderline fascists or even actual fascists, the breadth and depth of the ties were unknown until now.\n\nAn investigative journalist successfully infiltrated the BN and what they found was "horrifying", as the Fronte Democratico put it. Money from the old PNF was put in the BN coffers. Politicians basically swapped parties and stayed in the same seat. Nepotism favoring senior PNF politicians. The findings of the journalist went on and on. While the other scandals were eventually weathered, this scandal has hurt the BN greatly. Some politicians involved in the scandal have resigned, causing special elections that the BN is unlikely to win. Multiple members of the BN in parliament have turned their coat and joined the right wing of the Democrazia Cristiana, and worst of all, the BN is starting to lose members at a steady rate. If the trends are to continue, the BN would no longer be the biggest party in Italy, and they could even lose their majority in Parliament.\n\nAlmirante, surprisingly, has responded to this scandal. He has decried them as false reports, and that the so-called 'journalist' is nothing more than a Fronte Democratico spy! Most high ranking BN members have followed his word on this, especially the members who are implicated in the scandal. It is clear that the BN is sticking to their by now classic strategy of weathering the newest scandal."
 ITA_med.6004.a:0 "A mere scandal!"

 ITA_med.6005.t:0 "An Interview with the King"
 ITA_med.6005.desc:0 "A recent interview of Umberto II by Franco Alfano has ended up causing another scandal for the Blocchi Nazionali. Almirante has been praising the King of Italy in nearly every speech or discussion recently, to the point that Pietro Nenni, leader of the Fronte Democratico, jokingly praised the king himself in one of his speeches, to much laughter. Therefore, when Umberto II has interviewed recently, it was obvious that Alfano had to ask what Umberto himself thought of the matter. His answer, was...surprising to say the least.\n\nUmberto called Almirante's constant praise an attempt to suck up to the monarchy, and then proceeded to say he'd rather talk about his new medals obtained in service to Italy, which he did for a solid 30 minutes, almost half of the interview. This has turned into an incredibly embarrassing event for the BN, as it shows that the King of Italy basically thinks of Almirante as a joke. This has also, predictably by this point, turned into a scandal.\n\nThe scandal that has erupted from this is about the fact that if the King of Italy cannot even vouch his nominal support to the BN, then what right to they have to rule? As is the case, the BN have remained very quiet, and Almirante has apparently remained unfazed, although he does not praise Umberto II very much anymore, much to the sadness of the FD, who cannot make jokes about it anymore.\n\nIronically, many war veterans who have medals have been interviewed about them due to this, and it seems Umberto has gotten in on the joke, and he can now barely be seen without his frankly impressive collection of medals pinned on his clothes, much to the exasperation of the BN."
 ITA_med.6005.a:0 "That IS a pretty nice array of medals!"

 ITA_med.6006.t:0 "Another Scandal for Almirante!"
 ITA_med.6006.desc:0 "To absolutely no one's surprise, the Blocchi Nazionali have involved themselves in yet another scandal. Almirante made a recent speech about his past in fascist Italy, and praised it greatly. Not only that, he called it "a much more prosperous time", much to the horror of basically everyone who aren't fascists. Furthermore, he stated that "Fascism did nothing wrong" which has basically led to his utter ridicule in the media.\n\nThe media, besides ridiculing him, has completely dismantled every part of his speech ana pointed out why every section of it was false or wrong. The Fronte Democratico has finally blatantly called Almirante an "idiot", while the Democrazia Cristiana has seemed to support the sentiment of the FD. Even some of the people in the BN have said that "perhaps it was not such a good thing for Almirante to say", which is incredibly radical for them.\n\nIn comparison, the openly fascist groups of Italy have declared support for Almirante, as "he understands when Italy was at its zenith and why". This has led to a split of sorts in Italian society, as the fascist sections are now in full alignment with Almirante, while the anti fascist sections are in a strong opposition to him."
 ITA_med.6006.a:0 "How will the Blocchi Nazionali recover from this?"

 ITA_med.6007.t:0 "Almirante Goes Before the Chamber"
 ITA_med.6007.desc:0 "Today, Honourable Prime Minister Giorgio Almirante has addressed the nation in a speech broadcasted by radio and television. With fiery rhetoric, Almirante offered his account of the events since the inception of Ciano's reforms, including the creation of the Blocchi Nazionali, and the elections themselves. He admitted that his party often "did not show fully its commitment to the democratic cause", but he went on to remark that pride in fascism isn't nostalgia, and that it is not incompatible with genuine love for democracy.\n\nGiorgio Almirante went on to explain the aims and the policies which the Blocchi Nazionali will pursue, and to show that they are merely expressions of the people's will, not a return to the past. Finally, the Prime Minister ended his speech by blaming the political tension experienced by the country on the left opposition. The Fronte Democratico, said Almirante, "isn't very democratic at all, considering their hatred for the democratically elected government". Almirante concluded by saluting the Italian people, and by assuring it that with the Blocchi Nazionali in power, the nation is in good hands.\n\nImmediately, it appeared clear that with this speech, Almirante would finally win over the silent majority of the nation. While leftist groups are still staunchly opposed to the government, moderates and centrists are finally convinced of Almirante's good intentions and political competency, there are rumors that Moro's DC, or at least its right wing, could finally openly side with Almirante's BN. Only one thing is certain, that now, the Blocchi Nazionali have the reins of the nation firmly in their hands, but nobody knows if they will steer Italy towards democracy, or back towards fascism."
 ITA_med.6007.a:0 "Maybe Almirante isn't so bad after all."

 ITA_med.7000.t:0 "Government Formation Fails"
 ITA_med.7000.desc:0 "PLACEHOLDER. After the winning faction in the past election has failed to form a government, the second place contenders have been given the chance."
 ITA_med.7000.a:0 "We wish them luck."

 ITA_med.7001.t:0 "Snap Elections Called"
 ITA_med.7001.desc:0 "PLACEHOLDER. Upon the failure of a government to form, snap elections were called."
 ITA_med.7001.a:0 "We wish them luck."

 ITA_med.7002.t:0 "Piano Solo"
 ITA_med.7002.desc:0 "PLACEHOLDER. Due to repeated failure to form a govt, piano solo has happened."
 ITA_med.7002.a:0 "This is bad."

 ITA_med.7003.t:0 "Borghese Coup"
 ITA_med.7003.desc:0 "PLACEHOLDER. Due to repeated failure to form a govt, Borghese's Coup has happened."
 ITA_med.7003.a:0 "This is bad."

 ITA_med.7004.t: "Elections!"
 ITA_med.7004.desc: "All across Italy, from the island of Sicily, to the streets of Rome, and the canals of Venice, millions have casted ballots in support of their choice of political party. As the results trickle in, new and old deputies take their seats in the Camera dei Deputati preparing for the coming years of political triumphs and defeats. With the election over party leaders begin to plot out their strategy for the coming years. Those who lost will reassess their campaign tactics and party platform, while those who performed well will begin to formulate what the governing coalition will look like.\n\nNow, the most important decision lies with King Umberto. He must choose a worthy candidate for Prime Minister, one who will be able to wrangle the Camera and pass the legislation that the Italian people clearly desire. However, he must choose carefully, as a failure to form a coherent government could have dire consequences..."
 ITA_med.7004.a: "The people have made their voices heard."

 ITA_med.7005.t:0 "Snap Elections and the King's Warning"
 ITA_med.7005.desc:0 "PLACEHOLDER. Due to repeated failure to form a govt, snap elections have been called, the king warned parties not to bicker too much."
 ITA_med.7005.a:0 "This is bad."

 ITA_med.7006.t:0 "Snap Elections after Piano Solo"
 ITA_med.7006.desc:0 "PLACEHOLDER. Due to repeated failure to form a govt, snap elections have been called, but since PS has already happened the King can't intervene anymore so things could get out of hand if we keep failing."
 ITA_med.7006.a:0 "This is bad."

 ### Italy News Events ###
 ITA_news.1.t: "[Get_newspaper_header]Galeazzo Ciano Loses the Verona Congress!"
 ITA_news.1.desc: "In the plans of Galeazzo Ciano, the Verona Congress should have been a way to cement his control over the party after the turmoil of the Triumvirate's collapse and subsequent war with Turkey. However, in an unexpected development, a loose alliance of Gerarchi opposed to his rule managed the unthinkable: capitalising on discontent against Ciano's supposed incompetence and indecisiveness, they gathered enough support in the Grand Council of Fascism to force through a motion of no confidence against the Duce, and approve it by a tiny margin.\n\nNow, a new, uncertain path opens for Italy. Immediately after celebration for the victory ended, the Gerarchi started quarreling over who among them would take the mantle of Duce: with no one clearly superior to the others in terms of popularity or authority, it seems that a new power struggle is starting in the land that gave birth to fascism, one that might shape the country forever in ways no one thought possible.\n"
 ITA_news.1.a: "Is this a victory for fascism, or just a prolonged agony?"

 ITA_news.6.t:0 "[Get_newspaper_header]Launch of San Marco 1!"
 ITA_news.6.desc:0 "After years of experimentation and planning, Italy has finally moved her first step in the conquest of space. From the San Marco platform, a jackup barge owned by ENI and stationed off the Kenyan coast, the Europa 1 rocket successfully took off and reached the ionosphere, much to the celebration of Italian scientific and military personnel on the ground. While only containing few probes to conduct experiments on long range radio communication in the upper atmosphere, San Marco 1 was designed largely as a test for Italy's capabilities to launch spacecraft into orbit.\n\nDespite the relatively small scientific importance of San Marco 1, especially when compared to the much more developed German, American and Japanese space programs, the success of the endeavour was viewed as a major symbolic victory by Italy, which became the first non-superpower to successfully perform a space launch.\n"
 ITA_news.6.a:0 "E mi vidi quaggiù piccolo e sperso errare, tra le stelle, in una stella."

 ITA_news.7.t:0 "[Get_newspaper_header]Military Government Declared in Italy"
 ITA_news.7.desc:0 "In a wholly unexpected turn of events, the Verona Conference- a meeting of the National Fascist Party's leadership called by Duce Ciano to address the nation's ills- collapses into infighting well before the Conference itself is expected to end. With neither Ciano nor the fascist opposition able to win over the party, words have been discarded in exchange for violence as blackshirts, veteran groups, and students began clashing in the streets. The violence spread from there like a virus, bloodshed engulfing the entire peninsula. Amidst the storm a clique of Regio Esercito generals have secured Rome and several other major metropolises in Italy.\n\nThe King addressed the nation soon after the fighting began, assuring his people that the violence would be over soon, and ending his address by announcing a sweeping ban on the shattered and squabbling PNF. The fate of Italy remains uncertain, but the situation appears to be stabilizing for now.\n"
 ITA_news.7.a:0 "Is this the beginning of a better Italy?"

 ITA_news.8.t:0 "[Get_newspaper_header]King Umberto II Shot!"
 ITA_news.8.desc:0 "A nation mourns as the Kingdom of Italy has announced that King Umberto II has been assassinated, leaving the fate of the Military Government he established - and that of the country as a whole - in a state of flux. The identity of the culprit remains unknown, with both fascist, communist, and even certain republican groups declaring victory.\n\nRegardless, the fate of Italy remains unclear as tensions continue to rise, with Generals beginning to vie for power over one another, even as the streets run red with the blood of rioters.\n\nThe King attempted to walk a tightrope, and with his death Italy plunges towards the void below. What this means for the future, none dare to ask.\n"
 ITA_news.8.a:0 "What will become of his Kingdom?"

 ITA_news.9.t:0 "[Get_newspaper_header]The Italian Revolution"
 ITA_news.9.desc:0 "The International Community finds itself in uproar as the Red Flag is hoisted high above the city of Rome. In what is rapidly becoming Socialism's biggest triumph since 1917, revolutionaries have stormed Villa Torlonia, the Palazzo Montecitorio, and more strategic regions across the city, and indeed, the country. A new socialist government was proclaimed in front of cheering crowds and the screams of the officials of the old order, now subject to the justice of the mob.\n\nKing Umberto II's assassination by an unknown assailant has apparently provided the impetus for this revolution, as well as tensions from the stalemated Verona Conference boiling over.\n\nThe Fates have dealt their hand to the Italian people, and only one question remains: Can this new Revolution survive?"
 ITA_news.9.a:0 "Bandiera Rossa e Comunismo Sarà!"
 ITA_news.9.b:0 "Get me the Abwehr on the line, stat!"
 ITA_news.9.c:0 "The cradle of Fascism, destroyed by bolshevik degeneracy!"
 ITA_news.9.d:0 "A socialist revolution in Europe? Incredible!"

 ITA_news.10.t:0 "[Get_newspaper_header]Terrorist Attack in Italy!"
 ITA_news.10.desc:0 "Today, the Italian nation woke up to tragic news. A bomb exploding in a bank in Piazza Fontana, Milan, has killed seventeen people and wounded several dozens. While this is not the first terrorist attack that has occurred in the country since its return to democracy, it is the most deadly yet, and certainly the one most shocking for the public opinion, as it struck in the heart of Italy's second-largest city.\n\nWhile the government promised a quick investigation that will deliver the terrorists to justice, in truth the motives and perpetrators of the bombing are shrouded in mystery - however, the most probable culprits seem to be a gang of radical anarchists based in Milan. This event has only contributed to the ferocious political clashes happening every day on the italian streets between striking workers, policemen, student groups and even neo-fascist organizations - many are beginning to lose hope in Italy's nascent democracy, and some even speculate that this is only the start of a long period of violence and terror in the country.\n"
 ITA_news.10.a:0 "A young democracy threatened by radicalism..."

 ITA_news.11.t:0 "[Get_newspaper_header]The Birth of the Levantine Union"
 ITA_news.11.desc:0 "For the first time in decades, perhaps even centuries, a significant step has been taken to secure a lasting peace in the turbulent region of the Levant. With triumphal fanfare Yasser Arafat and David Ben-Gurion proclaimed to the world the establishment of the Levantine Union. Palestine, Lebanon, Jordan, Israel, and a neutral mandate in Jerusalem have all promised cooperation on economic and foreign policy decisions for the bloc while allowing each individual member domestic autonomy. It is unknown to what extent Italian Governor-General Pietromarchi played in the lead up to this spectacular agreement, but his willingness to pull his men from the Levant has aroused more than a little suspicion in his involvement. As for the question of if this is the dawn of permanent peace or merely a lull in the storm, only time will tell."
 ITA_news.11.a:0 "Peace in the Middle East?"
 ITA_news.11.b:0 "They have no right!"

 ITA_news.12.t:0 "[Get_newspaper_header]The Formation of the United Arab Kingdom"
 ITA_news.12.desc:0 "Today in the Jordanian capital of Amman the elderly King Abdullah announced the creation of the United Arab Kingdom. Flanked by his sons Nayef and Hussein, Abdullalah explained that the Italian government had relinquished its direct control over the Levant and had handed it over to the Jordanians to administer. It was only natural, said Prince Hussein, for the Italians to turn to their trusted partners in Jordan to maintain order and stability in the region.\n\nThis new federal state, the prince continued, would be instrumental in solving the longstanding conflict between the Palestinians and Jews as it would allow for internal autonomy for each of the three proposed districts. While the prince spoke with confidence in the efficacy of this new state in solving the longstanding issues at play in the region, not all reactions have been so positive. Jewish and Palestinian nationalists are outraged at the decision and have vowed to resist this chimera state.\n"
 ITA_news.12.a:0 "How long can this Kingdom hold?"
 ITA_news.12.b:0 "It was the only option."

 ITA_news.13.t:0 "[Get_newspaper_header]Civil War in the Levant"
 ITA_news.13.desc:0 "Despite precautions taken in the immediate aftermath of leaked details regarding Fatah-Yishuv plans for a confederated Levant, things have seemingly progressed far quicker than had been expected. Radicals from both sides were quick to denounce these secret talks as betrayals of their respective movements. George Habash's socialist Harrakiyiin organization began staging demonstrations Rammalh while Menechem Begin's Revisionist Zionist paramilitary wing Irgun did likewise in Tel Aviv. The Italian garrison's efforts to stamp out the emerging uprisings resulted in several cases of violence against non-combatants, fanning the flames still higher. The garrison itself seems to have been caught at a disadvantage, with many units still awaiting redeployment in the aftermath of the Italo-Turkish War. Still their destruction is far from inevitable, as they still remain the best trained and equipped force in the Levant. Regardless of the outcome of the unfolding civil war, peace in the Holy Land has been dealt a seemingly mortal blow.\n"
 ITA_news.13.a:0 "More violence in the Holy Land."
 ITA_news.13.b:0 "Order must be restored!"

 ITA_news.14.t:0 "[Get_newspaper_header]Harakiyyin Victory in the Levant!"
 ITA_news.14.desc:0 "It seems that the worst of the violence in the Levant has now subsided, leaving the Movement of Arab Nationalists, the Harakiyyin, the decisive victors. Under its charismatic leader George Habash, the Palestinian nationalist movement has been able to beat out its challengers for control of the region, including both the Italian garrison and the Revionist Zionist organization, the Irgun. In the new Palestinian capital of Jerusalem, Habash exuded an air of triumph, praising his people for their courage and skill in standing against Western imperialism.\n\nDespite having defeated a parallel Jewish nationalist uprising in the conflict, Habash stressed that the new Palestinian state would honor the rights of Jewish citizens as it would any other national minority. Still, this has not assuaged the fears of many Jews both within and without Palestine that the loss of a nation state to call their own will only lead to further persecution and discrimination. Many members of the Irgun organization have vowed to continue the fight, utilizing guerrilla tactics and even terrorism to discomfit the young state. How exactly the Harakiyyin will respond to these prominent issues will no doubt shape the future of this historically troubled land.\n"

 ITA_news.15.t:0 "[Get_newspaper_header]Irgun Victory in the Levant!"
 ITA_news.15.desc:0 "With fighting finally dying down in major urban areas it seems indisputable that the Revisionist Zionist militant wing, Irgun, has come out on top. It's commander, Menachem Begin, has managed to lead this unlikely group of militants to success both against the Italian garrison and the Palestinian nationalist movement, the Harakiyyin. From the new Israeli capital of Jerusalem, a proud Begin delivered a speech praising the efforts of the Jewish people in surviving against all the trials and tribulations of history. At last, he promised, there would now be a state for the Jews to call their own. He further promised that a transition into democracy for Israel would be forthcoming as the violence abated.\n\nWhile Begin's words were full of optimism and hope for the new state, Palestinians have already begun fleeing into Jordan, Lebanon, and Egypt. Many Palestinians doubt that the benefits of this democracy will be extended in equal measure to them as to Jewish Israelis, and so far Begin and Irgun have done little to assuage these concerns. Other Palestinians have taken an opposite approach, choosing to form small guerrilla bands directly to carry on the fight or else join more clandestine resistance cells in urban areas, laying low until they have the chance to strike against the young nation. The burden of these issues will weigh heavily on Israel for some time to come, and how it chooses to handle them will surely have consequences that reverberate for some time to come."

 ITA_news.16.t:0 "[Get_newspaper_header]The Formation of the United Arab Kingdom"
 ITA_news.16.desc:0 "[JOR_RIStatus]"
 ind_UAK_text:0 "The Italian garrison may have come out victorious in the three way struggle that erupted in the Levant between itself, the Revisionist Irgun, and the socialist Harakiyyin, but it has not done so easily. The fierce fighting severely pushed the garrison forces to their limits, battered as they already were by the recent Italo-Turkish War. As a consequence, they have emerged from the conflict with a considerably truncated ability to perform their assigned role: keeping order in the turbulent Levant.\n\nIn recognition of this, the Hashemite Kingdom of Jordan under King Abdullah has seized the moment to place the region under its own control. Claiming to only desire to continue the old garrison's mission of maintaining order, the Jordanians have promised to mediate the concerns of both Palestinians and Jews within the region, although given the still-prevalent militancy on both sides, this declaration seems all but impossible. With Italy in the midst of a communist revolution, Jordan seeks to assert its own power on its neighbors while the Italians are all turned inwards. Just how long this new order in the Levant may last for is anyone's guess."
 not_ind_UAK_text:0 "The Italian garrison may have come out victorious in the three way struggle that erupted in the Levant between itself, the Revisionist Irgun, and the socialist Harakiyyin, but it has not done so easily. The fierce fighting severely pushed the garrison forces to their limits, battered as they already were by the recent Italo-Turkish War. As a consequence, they have emerged from the conflict with a considerably truncated ability to perform their assigned role: keeping order in the turbulent Levant.\n\nIn recognition of this, the Hashemite Kingdom of Jordan under King Abdullah has seized the moment to place the region under its own control. Claiming to only desire to continue the old garrison's mission of maintaining order, the Jordanians have promised to mediate the concerns of both Palestinians and Jews within the region, although given the still-prevalent militancy on both sides, this declaration seems all but impossible. As its longtime collaborator in the Middle East, the Kingdom of Italy has eagerly accepted the Jordanian move, seeing it as a way to remove the burden of maintaining direct control while also keeping the region within its sphere of influence. It remains to be seen what ramifications this agreement will have for the people of Palestine."

 ITA_news.17.t:0 "[Get_newspaper_header]The End of the Verona Congress"
 ITA_news.17.desc:0 "After facing what observers called a "fronde" by dissident fringes of the fascist party, the authority of the Italian Duce, Galeazzo Ciano, seems to have been reaffirmed. According to news leaking out of the country, several prominent rivals of Ciano have been arrested or went into hiding, some already fleeing the country to escape the wrath of the fascist strongman.\n\nIntrigue and intestine clashes are nothing new in Italy: however, with internal opposition slowly increasing over the years and the Duce needing to make further concessions in the attempt to placate the populace and the fascist party's base, some have begun to seriously doubt the stability of the Italian state. It remains to be seen whether these internal purges will be sufficient to shore up the Duce's faltering regime."
 ITA_news.17.a:0 "Duce! Duce! Duce!"

 ITA_news.18.t:0 "[Get_newspaper_header]Pino Rauti Inaugurated as Prime Minister of Italy!"
 ITA_news.18.desc:0 "Italian politics are known to be surprising and unpredictable, but even the most knowledgeable observers of the country's events have been utterly shocked by the rise to power of Pino Rauti and his radical right wing faction. Finding his main power base in Ordine Nuovo, the most extreme fringe of the right wing MSI party, Rauti has formed a coalition including much of the Italian right wing, and has secured a majority in parliament.\n\nFiercely reactionary and anticommunist, Rauti's views are known to be fringe and radical even by the standards of Italy's neofascist right. However, Rauti is a charismatic speaker, and his ideas enjoy some traction among the right wing student groups and, at least according to some rumors, fringes of the armed forces."
 ITA_news.18.a:0 "A new order?"

 ITA_news.19.t:0 "[Get_newspaper_header]Giorgio Almirante Inaugurated as Prime Minister of Italy!"
 ITA_news.19.desc:0 "Today, the Italian right triumphantly celebrates as Giorgio Almirante, leader of the Movimento Sociale Italiano, has been nominated to the position of Prime Minister. The largest party of the Italian right, the MSI forged an alliance with smaller parties and became the leader of a broad rightist coalition that now dominates parliament. Almirante, being the most senior leader of the MSI, was a natural choice for the position of PM.\n\nEspousing an ideology defined by some as "neofascism", Almirante is notorious for his ambiguity towards fascism, on one hand often calling for a return to the glory days of Mussolini and the defense of the fascist ideals, on the other promising to respect and defend Italy and her new democratic institutions from the threats of socialism and communism."
 ITA_news.19.a:0 "It still seems just like plain old fascism to me."

 ITA_news.20.t:0 "[Get_newspaper_header]Achille Lauro Inaugurated as Prime Minister of Italy!"
 ITA_news.20.desc:0 "News has arrived from Italy that the leader of the Partito Democratico Italiano, Achille Lauro, has been nominated Prime Minister after managing to form an alliance including much of the Italian right wing, with support even from some centrist politicians. A wealthy business tycoon with a long career in politics, Lauro was the mayor of Naples for much of the 50s, and one of the richest men in Italy.\n\nDefined by some as a paternalistic conservative, Lauro is notorious for his showy style of politics, traditionally appealing to the poorest Neapolitan underclasses through vast handouts and a "bread and circuses" policy. Although much of his policies will have to be negotiated with other coalition members, some say that Lauro plans to apply his style of politics to Italy as a whole."
 ITA_news.20.a:0 "Let's hope this ship doesn't sink."

 ITA_news.21.t:0 "[Get_newspaper_header]Giovanni Malagodi Inaugurated as Prime Minister of Italy!"
 ITA_news.21.desc:0 "In an unexpected turn of events, the leader of the small Partito Liberale Italiano, Giovanni Malagodi, has managed to forge an alliance between much of the right wing and the centre, positioning himself as the leader of a centre-right coalition that now dominates parliament. Enjoying close ties with the large Italian businesses, it remains to be seen whether the small PLI will manage to implement its agenda.\n\nA liberal in the classical mold, Malagodi and his party are social conservatives and staunch defenders of free markets and private enterprise, whereas Italy has a long tradition of state interventionism. The PLI's lofty goals of economic liberalization might be hard to achieve, but Malagodi is now in a prime position to try and finally enact a true liberal revolution."
 ITA_news.21.a:0 "Here's to good business!"

 ITA_news.22.t:0 "[Get_newspaper_header]Giulio Andreotti Inaugurated as Prime Minister of Italy!"
 ITA_news.22.desc:0 "A young, talented and ambitious politician, Giulio Andreotti has already managed to distinguish himself in the ranks of Italy's largest centrist party, the Democrazia Cristiana. Forging an alliance between his own party and large sectors of the Italian right, Andreotti has secured a parliamentary majority, achieving the title of Prime Minister of the kingdom.\n\nAndreotti's rise to power has been fast and surprising: according to some, the young Prime Minister already commands a wide network of alliances branching far beyond his own party, into the halls of the Vatican and in local organizations and institutions across Italy. Receiving support from much of the Catholic world, Andreotti seems poised to have a lasting effect on Italian politics."
 ITA_news.22.a:0 "Priests vote, God doesn't."

 ITA_news.23.t:0 "[Get_newspaper_header]Aldo Moro Inaugurated as Prime Minister of Italy!"
 ITA_news.23.desc:0 "The rise to power of the Democrazia Cristiana is seen by many as the natural conclusion of the process of liberalization of Italy, and now Aldo Moro, one of the DC's most prominent leaders, has managed to secure the position of Prime Minister after forming an alliance including other centrist parties. Moro's long career as a professor of law and intellectual leader of the lay Catholics makes him a natural choice for the position of PM.\n\nA centrist through and through, Moro advocates for genuine compromise and dialogue between the various factions at the forefront of Italian politics, as well as moderate policies aimed at opening up the country's economy and government. Moro's inauguration is hardly surprising, but many hope it will bring Italy the stability it so desperately needs."
 ITA_news.23.a:0 "Doing things takes all the time it takes."

 ITA_news.24.t:0 "[Get_newspaper_header]Amintore Fanfani Inaugurated as Prime Minister of Italy!"
 ITA_news.24.desc:0 "News has arrived from Italy that, after asserting dominance inside his own party against internal rivals, Amintore Fanfani has managed to broker an alliance between Democrazia Cristiana and several centrist parties, which is now dominant in parliament. Known for his high intellectual and academic stature, Fanfani is a famous economist and a leader of the progressive wing of the DC.\n\nProposing progressive economic policies, applying the social doctrine of the Church, and a conservative attitude to social issues, Fanfani's period in power will likely be characterized by an energetic streak of reforms, aimed at getting Italy out of the economic slump in which it was mired by years of fascist stagnation."
 ITA_news.24.a:0 "An appeal to the free and the strong."

 ITA_news.25.t:0 "[Get_newspaper_header]Ugo La Malfa Inaugurated as Prime Minister of Italy!"
 ITA_news.25.desc:0 "In a surprising turn of events, a left-of-centre alliance has come to dominate the Italian parliament, hinging on the small Partito Repubblicano Italiano: the PRI's leader, Ugo La Malfa, has secured a nomination as Prime Minister. While the pro-republic stance of La Malfa and the PRI may be a source of tension with the crown, some centrist and leftist parties have rallied around La Malfa's progressive agenda as a compromise to stave off the right's resurgence.\n\nForemost a proponent of strong economic reform, La Malfa plans to rework everything that involves Italy's finances, from the tax system all the way to microeconomic policy. While it's doubtful that all his plans will be able to come to fruition, that won't stop the new PM from attempting to save Italy from an economic downfall."
 ITA_news.25.a:0 "Mazzini would be proud."

 ITA_news.26.t:0 "[Get_newspaper_header]Giuseppe Saragat Inaugurated as Prime Minister of Italy!"
 ITA_news.26.desc:0 "A moderate centre-left coalition seems to have managed to seize power in Italy, led by the small Partito Socialista Democratico Italiano: led by Giuseppe Saragat, the Democratic Socialists have managed to unite much of the Italian left and centre under their aegis. Proponents of social democracy, Saragat and the PSDI seem to be poised to use all of the state's power to bring relief to the poorer Italians.\n\nLargely followers of Keynesian doctrine with some tinges of reformist Marxism, the PSDI argues a slow, democratic and reformist approach towards socialism, for now focusing on improving the Italian welfare state; additionally, Saragat's soft spoken and institutional approach has done much to ensure the support of a wide part of the Italian political sphere."
 ITA_news.26.a:0 "To democracy and social justice!"

 ITA_news.27.t:0 "[Get_newspaper_header]Marco Pannella Inaugurated as Prime Minister of Italy!"
 ITA_news.27.desc:0 "Many observers have been left shocked to learn that, in the halls of the Italian parliament, a wide leftist coalition was formed, nominally led by the small but very vocal and determined Partito Radicale. The young leader of the Radicals, Marco Pannella, has even managed to secure the Prime Minister nomination.\n\nKnown for his firebrand style of politics and his radically progressive stances on social issues such as women's rights, Pannella is going to have a hard time pushing his agenda through, as his government was born out of an alliance of the larger leftist parties using him as a compromise candidate. However, Pannella's intent is to start a true civil rights revolution in Italy, and now he's in a prime position to attempt just that."
 ITA_news.27.a:0 "Liberty isn't staying on top of a tree."

 ITA_news.28.t:0 "[Get_newspaper_header]Pietro Nenni Inaugurated as Prime Minister of Italy!"
 ITA_news.28.desc:0 "In a historic turn for Italian politics, Pietro Nenni, leader of the Partito Socialista Italiano, has managed to secure a position as Prime Minister after uniting the Italian left under the red banner of the PSI. As the news is met with celebration in the streets of Italy, vast sections of the political and monarchical establishment have reacted much more coldly.\n\nNenni is in many ways viewed as the father of the contemporary Italian left, and his political pedigree leaves no doubt that he is the most fit to lead this new red tide. Proposing an energetic series of reforms to transition towards socialism, Nenni's goals are ambitious to say the least, but the man has just enough fight in him that he may actually make it."
 ITA_news.28.a:0 "Nothing comes from above: it all comes from below."

 ITA_news.29.t:0 "[Get_newspaper_header]Enrico Berlinguer Inaugurated as Prime Minister of Italy!"
 ITA_news.29.desc:0 "In a completely unexpected turn of events, the Partito Socialista Italiano, led by its most leftist faction, has managed to secure a strong domination of Parliament, nominating Enrico Berlinguer to the position of PM. Berlinguer leads the most leftist internal faction of PSI, reuniting several former members of the now long dissolved Communist Party of Italy.\n\nWhile the reaction from the more conservative and moderate sectors of Italian politics and society has been fierce to say the least, Berlinguer has promised to uphold and reinforce Italy's democratic institutions, while at the same time fighting against corruption and fascist holdovers in the state apparatus. Berlinguer and his supporters are numerous and determined, but only time will tell if they'll win their uphill battle."
 ITA_news.29.a:0 "Onwards o people, the red flag shall triumph."

 ITA_news.30.t:0 "[Get_newspaper_header]Carabinieri Coup in Italy!"
 ITA_news.30.desc:0 "Shocking news have arrived from Rome: according to state media, the Carabinieri, Italy's military gendarmerie, have seized power in a bloodless coup. Apparently, such a move was tacitly approved or outright orchestrated by king Umberto II and many others in the upper echelons of the Italian government, and came as a reaction to severe political instability in the country which had recently seen a return to democracy after decades of fascist rule.\n\nWhile general Giovanni De Lorenzo, chief of the Carabinieri and strongman behind the coup, has promised that this is merely a provisional emergency measure and that the country will soon see a return to full democracy, many are skeptical of this claim and heavy popular demonstrations against the military regime have already started."
 ITA_news.30.a:0 "Will Italian democracy survive this?"

 ITA_news.31.t:0 "[Get_newspaper_header]Military Coup in Italy!"
 ITA_news.31.desc:0 "It seems like the long period of crippling political instability in Italy has reached its bloody conclusion: after short bouts of street battles in Rome and other major cities, a military regime led by admiral Junio Valerio Borghese has firmly established itself in the country. News coming from Rome is confused and contradictory, but it appears that the new military junta is tightening its grip on the country with heavy police actions and military repression.\n\nBorghese is notorious for his strongly pro-fascist leanings, but for now the new dictator claims that his regime will be "strictly apolitical" - a claim which few seem to take seriously. Many details of the coup are still mysterious, but it's clear that Italy's cycle of political violence has just taken an even darker turn."
 ITA_news.31.a:0 "The end of Italian democracy."

 ##CD EVENTS##
 christdem_med.1.t:0 "Christian Democrats Victorious!"
 christdem_med.1.d:0 "The votes have been counted, and it has become clear to all of Italy that Aldo Moro and his Christian Democrat party has seized control of the government. With strong showings in both the upper and lower chambers of Parliament, the Christian Democrats have dominant legislative power in Rome, and it is now their turn to lead the nation. Celebrations are already taking place in the streets, not only because of who won, but because they just had their first free and fair elections in a very long time.\n Moro, in response to this great victory, aired a speech on the radio welcoming the election results and showing his appreciation for the trust given to him by the Italian people. In this broadcast, he first thanked the people for electing him and promised to do everything in his power to improve their lives and the state of Italy. Next, he went on to explain how his government would work towards ensuring that the other parties are still given a fair voice and the ability to cooperate in matters of policy. Cheerfully, he went on to explain that this was a new dawn for Italy and for the first time in a long time her future is looking bright.\n After the broadcast, the losing parties gave their concession speeches, and although not nearly as joyful, the public was happy to see them accept defeat with grace. Now it is time for Moro to really reform the Empire to his liking. Having platformed on mostly education reform and social security, it is predicted that he will follow through and let them be his main focus for the time coming. He will also attempt to work with the other parties, even the Blocchi Nazionali, to make certain that this first democratic government doesn't collapse as a result of infighting. This is a historic day for not only Moro himself, but all of Italy and the world."
 christdem_med.1.a:0 "Hopefully one successful election leads to many more."

 christdem_med.6.t:0 "Christian Democrats Open Coalition Negotiations"
 christdem_med.6.d:0 "In the ecstasy following the Christian Democrats victory in the Italian Empire's first democratic election, it was easy to forget a hard truth, despite their strong showing, the CD fell far short of a majority in the Italian Parliament, and hence, to accomplish anything significant in their agenda, must make a coalition agreement with one of the other parties. The Christian Democrats first choice would be the Fronte Democratico, who share their commitment to Italian Democracy and desire for entitlement and education reform. However, early signals from the SD seem to suggest that this course will be difficult. As the price for their cooperation, The Fronte Democratico have demanded that the new educational curriculum include a segment on the "fascist period" and in particular, the "clerical institutions", who through their "cooperation" with the oppressive regime extended its longevity and cruelty. A suggestion that is considered frankly insulting by the strongly Catholic CD.\n\nOf course, the Fronte Democratico are not the only potential coalition partner for the Christian Democrats, there is also the Blocchi Nazionali-- the avowedly nationalist organization made up almost entirely of former Fascist Party members. The NB's leader Giorgio Almirante has declared his parties great willingness to cooperate with the CD, calling them "our brothers, dedicated to a strong Italian Empire", and has asked for only minor concessions as the price for a coalition government. However, the Christian Democrats fear polluting their commitment to the new Italy by working with a party that still salutes Mussolini the Patriot besides Ciano the Reformer. During the campaign, the CD had firmly disavowed any possibility of allying with the National Bloc, but the CD's leader Aldo Moro has since walked back this position, claiming that his party is "open to working with any group that believes in a peaceful democratic Italy". Some have argued this is just a tactic to pressure the Fronte Democratico to ease their coalition demands, while others believe it prestiges a broad right-wing coalition."
 christdem_med.6.a:0 "We must find a partner worthy of our ambitions!"

 christdem_med.7.t:0 "A Meeting with the Blocchi Nazionali"
 christdem_med.7.d:0 "Today, Aldo Moro has personally sat down with Giorgio Almirante and other Blocchi Nazionali party officials to discuss forming a coalition government in Parliament. So far, Almirante's party has expressed a willingness to work with the Christian Democrats and this meeting had high expectations attached to it by both parties. It began rather formally, with hand shaking and smiles and the politicians all acting as if they were old friends and not just recently tearing each other apart in the elections. However, as talks began and the Blocchi Nazionali began making their demands, it became abundantly clear that there would be no compromise. To start off with, Almirante refused to negotiate if Moro pursued his policies of education reform and social security, saying that both would end up damaging Italy more than helping it. He went on to counter every single proposition made by Moro and practically inferred that there would be no reform in a coalition with his party. As if that wasn't enough, the final nail in the coffin was when Almirante began to rant about how the Christian Democrats should instead support his policies rather than pursue theirs and that was the only way to keep the Italian Empire alive. Realizing that this was completely futile, the Christian Democrats began signaling that no coalition would be made and that the meeting had come to a close. Not understanding, or perhaps not caring, Almirante only continued on with his insane plans, explaining the political situation as if the Blocchi Nazionali had won the elections and they were trying to make a coalition. About an hour later, Almirante was finally satisfied with himself and let the meeting end. The damage had already been done, however, and it was plain to anybody in Rome that there was no chance of the two parties working together in the future."
 christdem_med.7.a:0 "Probably for the best, all things considered."

 christdem_med.8.t:0 "Negotiations Complete"
 christdem_med.8.d:0 "The Christian Democrat party has officially formed a coalition with the small Liberal Party under Bruno Visentini, and the talks with the talks with the Fronte Democratico have mostly concluded and are generally positive. With enough support behind him Moro is now ready to move onto other priorities, chief among them actually passing the gradual reforms that we campaigned on. It is high time we actually create some legislature, after all that is what we were elected into office to do. The initial bills have been drafted and they are ready to be introduced into the lower chamber. Hopefully, we will be able to get them through with enough support in the coming future through our deals and coalition. Every single representative that has been recently elected is quite excited for these first few steps, and the people cry out for us to take Italy by the hand and lead her to a brighter world, and it is our duty to oblige them. We will make these ideas and reforms into law and not allow anything to stop us in our great quest to bring upon a better world. Hopefully, the other parties can see the same thing and work with us rather than against us, for only together do we have a chance of actually accomplishing anything. Moro himself is perhaps the most optimistic, being described as constantly smiling and always happy to discuss policy with anyone in ear reach. He has even held conferences with individual deputies to both ensure their support and ask their opinions on key issues, never fading in his hope to create a good, functioning administration. It is not sure if he will maintain this enthusiasm, however, as politics is said to destroy even the most iron of wills."
 christdem_med.8.a:0 "Let's get down to business!"

 christdem_med.9.t:0 "Education Reform Bill Proposed in the Chamber"
 christdem_med.9.d:0 "The Democrazia Cristiana party has recently proposed their first bill meant to address the education problem in Italy. The bill, entitled the Delegated Decrees on Schooling, or "Moro Reform" would include a variety of reforms mostly centered around mandatory education in primary and secondary levels of schooling for all Italian youth.\n\nHowever, we are a long way off from turning this bill into a law as the process has only just begun. If we wish for the reform to ever come into reality, we must must work tirelessly to convince the other parties to support it. Specifically, we need either the social democrat votes or the fascist votes in order to pass the law. The Liberal Party, while small and mostly insignificant, will likely vote with us without any accomodation, but it is certain that the two major parties will request certain provisions to be added or removed and we will have to negotiate to earn their favor.\n\nThis is still a great step for our administration, and the people will be excited to know that we are actively setting out to accomplish our promises. If we succeed, this will both be a major victory for our party and all of Italy, for by educating the youth we will truly earn our place as a modern nation with modern principles."
 christdem_med.9.a:0 "Moro will get us those votes!"

 christdem_med.10.t:0 "Peeling Away Votes from the Fascists"
 christdem_med.10.d:0 "Although we were unable to form a coalition with the Blocchi Nazionali, there must be a few less extreme member of the party who would support these minor reforms. It is now time to do every deputy's favorite task, going around and begging other representatives to try and support our legislature that will soon be decided upon. All it should take is a little bit of compromising and a sprinkle of smooth talking from Moro to convince at least a few of the idiots to support our bill, right? Of course, nothing is that simple, as many are either making outrageous demands or giving vague responses, leaving us unsure of whether or not they will be on our side. This is troubling, but hopefully we managed to get some of them to vote with us, at least enough to secure a majority when the final vote is made in a few weeks. In the end, the fascists will at least be grateful that we tried to include them in the negotiations, and this could plant the seed for future cooperation when they inevitably get sick of being in a party that can't accomplish get any bills passed. Only time will tell if we can achieve our task of giving education to the children of Italy. Surely, partisan troubles can't possibly stand in the way of common-sense reform, not forever. Moro has one more meeting with some of the members of Blocchi Nazionali soon, and it may be his final chance to gain the support he needs."
 christdem_med.10.a:0 "Democracy isn't all it's cracked up to be."
 christdem_med.10.b:0 "We need the votes, no matter the cost."

 christdem_med.11.t:0 "The Final Demands"
 christdem_med.11.d:0 "Today, after Moro sat down with the remaining Blocchi Nazionali members who are still on the fence about the education reform, he finally got the list of what it would take to get their votes. These demands were handed over with very little formalities or subtly, with the clear assumption that unless the bill had what they wanted, there would be no votes for it from them. The first demand was that of historical revisionism. The fascists are rather afraid of us introducing educational materials and works that would counter what they believe to be indisputable facts. They still see Benito Mussolini as Italy's great savior, and they simply must have him and the Fascist Party be given the appropriate attention and praise that they deserve. While we would never dare enforce anything that challenged Mussolini's fame and importance, this appears to be seeking praise of the very system of government we just abandoned for good reason, and many of the misconceptions that the Blocchi Nazionali would like to see pushed in schools are borderline lies and propaganda. However, the writing is on the wall, and we will have to conform to what they want if we wish to gain their votes when the time comes. Now, our party is faced with this dilemma. If we do what Almirante's party wants, we could secure the support we need while sacrificing many of the values and honest beliefs that we campaigned on. If we fail to gain the votes, our reform's could fail to pass and the children will suffer for our inability to take action. The ball is now in the Christian Democrats court."
 christdem_med.11.a:0 "Compromise is a wicked thing."

 christdem_med.12.t:0 "Securing Internal Support"
 christdem_med.12.d:0 "With the bill to reform the education system in Italy no longer new news, it has become necessary to ensure that the members of our party are still fully behind it. After all, this is a pillar of the Christian Democrat platform and our survival in the political landscape depends on our ability to band together and pass the essential legislation that we promised to the voters. Fractures in the party lines now could also lead to more trouble down the line, and then there would be no hope for us to win the next election. We will start with simply reminding the deputies that align with us of the importance of this bill to ensure that they do not get distracted from the primary task at hand. Meanwhile, a renewed advertising campaign will both rile up the public and put the pressure on the parliament to see FEOTA is able to pass through and become law. The public has already shown a determination to improve educational standards in the elections, and forgetting to fulfill that promise we made to them would be fatal for any party member seeking to be reelected. Of course, we are not expecting any resistance from our officials in regards to the situation and are not seeking to threaten them in any way, instead, we only seek to unite them at a time when unity and cooperation are the only things keeping the government, and all of Italy, together. After this shake up, we will be primed and ready to restart our efforts towards converting the votes of opposing parties to achieve the majority we need."
 christdem_med.12.a:0 "Let's hope this all pays off."

 christdem_med.13.t:0 "Moro Gives Speech in Support of Reforms"
 christdem_med.13.d:0 "Today, Aldo Moro has given a televised speech to the people of Italy in an attempt to build support for the Moro Reform. Education reform has been a constant demand by the populace, and Moro is hoping that they will pressure the members of the other parties to join on in support of the legislation.\nHe began simply, speaking about the abhorrent history of Italian education in the last century, how it has lagged behind the other nations of Europe and how even today hundreds of thousands of Italian people don't even have a high school diploma. He then spoke of the wonders of mandatory education and how a simple high school education, while somewhat difficult to attain, would serve the children of Italy for the rest of their lives. This would give the poor the opportunity to become rich, the ignorant to become scholarly, and the lazy to become hard working, only if the nation could unite and pass the bill that the Democrazia Cristiana have proposed. He finished the speech with a plea to the Fronte Democratico and the Blocchi Nazionali, a plea for unity and solidarity to pass the bill that will give young Italians everywhere the chance that they need to succeed in life. Moro explained that this is not a partisan issue, or even a political one, but it is instead a moral obligation that we have to our children and country.\nRousing many, public opinion polls have already shown an increase of the bill, and many party officials are hoping that this translates into political influence and votes from the other parties. At the very least, we put on display our concern and love for the people, and our opponents will have to fight an uphill battle to challenge Moro now."
 christdem_med.13.a:0 "The people stand behind us!"

 christdem_med.14.t:0 "A Meeting with Fronte Democratico"
 christdem_med.14.d:0 "The more liberal elements of our party have taken it upon themselves to meet with the left-wing Fronte Democratico party in an attempt to ensure they support our education bill when we hold the vote on the issue. Thankfully, we appear to be in good graces with the party and the hopes are that they will help is in this matter, giving us the votes we need and the ability to work closely with them in the future. Of course, we know that they will want us to make changes to the bill and reform the system to a much higher degree, but there is nothing in the legislation itself that the party would find repugnant and it is likely that we won't have much trouble getting them on board. We have even sweetened the deal by promising them future cooperation in regards to other reforms and policies that they find beneficial. The parties response has so far been a bit cautious, but mostly optimistic as education is a pillar of society that we all see is worth mending. It is predicted that they will give us an official response soon regarding their stance, and when they do we will know what must be done in order to achieve that threshold of supporters necessary to secure the bills chance of success. Meanwhile, this meeting has been met with criticism from the Blocchi Nazionali, who sees this move as disrespectful and weak. While their words do not affect us, we must make efforts to keep our independence and not really on other parties too much to achieve legislative progress. "
 christdem_med.14.a:0 "We must keep moving!"

 christdem_med.15.t:0 "Fronte Democratico Gives Their Reply"
 christdem_med.15.d:0 "Finally, after much stalling, the Fronte Democratico has given us the answer to our plea for help. Their response, while not a refusal or acceptance of support, is a deal that if we add certain parts to the bill then they will vote for it and back our party. This was to be expected, as nobody in politics ever agrees to anything without some negotiations. It appears that every single one of their demands is simply taking one of our parts of the bill and making it far more extreme in liberalization and practice. For example, while we wish to enforce a mandatory education for all students, the liberals would have us also put in place a common curriculum that ensures the children have a full and regimented education. That is one of the more mild requests, with some even asking that we include funding and resources for completely unrelated areas like subsidies for university students and grants for research. While many of these preliminary demands will be rendered null with a bit of negotiation, the fact stands that we will have to alter and add reforms to the bill if we wish to gain the support of the Fronte Democratico when we vote. Leadership of the Christian Democrat party however is urging caution, as fulfilling their demands too much will both make us look weak and make us lose the support of moderate-right deputies that have so far aligned with us."
 christdem_med.15.a:0 "All that matters is that we pass this bill!"

 christdem_med.16.t:0 "Voting Begins on the Moro Reform"
 christdem_med.16.d:0 "The Chamber is buzzing with activity, as today is the day that the deputies vote on the first major bill to be introduced into a democratic Italy. The Delegated Decrees on Schooling, the bill designed to improve educational standards and general quality of life in the nation, has been highly contentious and many are wondering if it will be able to pass through with enough votes to become law.\nMoro has been in a generally good mood, and while anxious at the prospect of having his first piece of legislation be a failure, is in high hopes and good spirits. Upon being questioned by a reporter as to his expectations, he responded by announcing that he expects many Italian politicians will be able to spot the merit in the bill and will put aside partisan squabbling to pass it, as the common interest amongst them is to help the people, not hinder them. However, it is well known that this bill's death would spell doom for both Moro and the Democrazia Cristiana, and being unable to pass legislation would inevitably lead to them losing the next elections.\nNo matter if the votes are in our favor or not, the populace will be watching us and responding appropriately to the results. Now we can only hold our breath and pray for good fortune."
 christdem_med.16.a:0 "It is now beyond our control."

 christdem_med.38.t:0 "Queen to C6, Rook to H5" # Assesing the enemies of the Empire
 christdem_med.38.d:0 "In a bunker under the Ministry for the Defence, around two dozen men - some wearing uniforms, other looking more refined, like diplomats or high-ranking operatives - stood around a large table. There, among hundreds of folders, photos, files and sheets where the most commonly found word was (CONFIDENZIALE), a huge map had been spread out: at its centre, coloured in green, was Italy proper, with its Sphere in shades of green to represent their degree of allegiance, while the other nations were marked with different colours and shades depending on the alliance they were part of, their government, and anything else worth knowing. Chess pieces were laying on single nations, or grouped together depending on priority: the King stood, of course, atop Rome, the Queen on Germania, the Rooks on Ost-Paris and Istanbul, the Bishops on Madrid and London, while Knights and pawns covered the sphere members and the Reichskommissariate.\n\n"Gentlemen" the minister for the defence begun, "With the recent end of the Triumvirate, and the collapse of the Reich, our strategic position has changed so much that we can no longer be certain of anything" he pointed at the King on the map: "If we are to protect our country, we need to understand where our true priorities lay" then he pointed at the files. "Courtesy of the SIM" to which a man in ordinary clothes nodded slightly, "We have gathered a good amount of initial data concerning the most imminent threats to our security. With our forces strained to protect our borders" and he nodded towards the chief of the General Staff, "We need to decide our priorities" then, looking at the undersecretary for foreign affairs, "Our diplomatic corps have sent us a summary of what other countries think about our new government, and what we can expect from them"\n\n"The only way we can avoid being swallowed by chaos, is by flawlessly planning our every move. No mistake is allowed! The tiniest miscalculation could see Italy alone and weakened against foes we know nothing about. Now, let's get to work!" all men nodded, and the chattering begun."
 christdem_med.38.a:0 "Arrocco di Re."
 
 christdem_med.39.t:0 "If You Look Into the Abyss..." # On the border of Burgundy
 christdem_med.39.d:0 "SIM operative Volpe 742 gave the envelope to his superior, Monviso 12, who opened them and looked at everything: one by one, he put the photos on his desk, then gave a quick once-over to the papers. Finally, he looked back at his subordinate: "Well done, Volpe, I'm very impressed. I have to admit I expected very little from this operation. Of course, I'm not underestimating you or your team, it's just that..." Volpe finished for him: "That you expected us to die as soon as we stepped foot in that hellhole?" Monviso nodded. "I guess most your success is due to your... requests? A boat, French passports, ten thousand francs and scuba diving equipment are a rather... unusual combination, to put it mildly"\n\nVolpe chuckled: "The boat brought us from Genoa to Marseille, where we pretended to be Italo-French coming from Nice to see their families in Paris. At night, we bribed the sewer maintenance personnel in West Paris to let us submerge in the drainage pipes, then followed them to the Seine and re-emerged in Ost-Paris, where men of the slave resistance in contact with the SIM brought us out of the city. From there, it was mostly a matter of not being spotted, though the surveillance inside is less strict: they are so sure no one can get in, that they don't see the need to hide their operation from prying eyes... Then, we returned through the same way"\n\nMonviso laughed heartily for once, and got up from his chair to pat Volpe's shoulder: "Well done, Volpe, well done! Keep up with this and you'll get far..." then he looked at the table and sighed: "Now, let's get to business: this is some serious stuff, and quite..."\n\n"Disgusting?"\n\n"Fascinating, Volpe. Fascinating..."
 christdem_med.39.a:0 "The abyss looks into you."
 
 christdem_med.40.t:0 "Can the Wounded Lion Still Roar?" # On the border of Germany
 christdem_med.40.d:0 "Room 37 of the SIM headquarters in Forte Braschi, hosting the section dedicated to the study of military informations and statistics, is full. All seats around the table are taken by high-ranking operatives and representatives from all branches of the armed forces, and for a good reason: the latest dispatch from the German surveillance team, combining both border observation and aerial reconnaissance, have arrived.\n\nFrom the ordered chaos of photos, letters, reports, graphics, diagrams and percentages spread all across the table, one thing appears clear. The Reich has begun rearming itself. For what purpose, one can only guess: some argue that a reconquest of the rebel Reichskommissariate is near, others believe that they are trying to exert their influence over Eastern Europe once more, while a few fear more... sinister intentions from the new regime in Germania.\n\nIn the end, until more detailed information comes, it's impossible to discern the ultimate goal of the new Germany, but the data is more than enough to understand how they want to pursue it, and devise countermeasures. For each new weapon developed, something capable of rendering it useless, for each new tactic devised, a plan to counter it, for each new division raised, a brigade trained to hold the line. Perhaps there's no need, perhaps there is indeed, perhaps it will not be enough, but for now, it must suffice."
 christdem_med.40.a:0 "We surely hope so."
 
 christdem_med.41.t:0 "Europe's Last Redoubt" #The results of previous actions
 christdem_med.41.d:0 "Sogno stared at the mess of officials before him. Diplomats, generals, and every other suit-wearing official imaginble gathered around him, all leaning on the same circular table.\n\n"This-" the minister for the defense said, procuring a book-sized document from a nearby typewriter, "is the entirety of our report." Placing it down on the table with an audible thud, he commented, "I apologize for the delay."\n\n"Well, this is certainly something." Sogno remarked, "Does it contain all sections we agreed on?"\n\nQuickly, the minister replied, "Indeed it does, sir. We have every contingency fully mapped out: Burgandinian surprise assault, defense strategies against the Reich, and even some less-likely scenarios, such as a pre-emptive invasion into France." The minister flipped to a page near the beginning of the novel-sized stack of papers, and after a quick glance at the page, motioned for Sogno to come over. "This page details our general strategy towards all potential combat scenarios with the major powers of this world. Generally, there is one consensus between all of us here. He paused for a moment, then continued. "We have reached a consensus: our army is almost entirely incapable of defending our land from a full-frontal assault from the Reich, although this is less so the case with other nations." Finding the exact line he was looking for, he read, "Through our advantageous position in the Alps, we can defend that front for a significantly low amount of time. However, in the case of a successful breakthrough of our lines, it does not spell the end of our capable defense strategy. Through ambushes, convoy raiding, and hit-and-run tactics, we will be able to make every single inch of advance a living hell for any would-be invaders, hoping to bog them down in the land directly south of Adriatica."\n\nSogno pondered what the man had said for a moment. "Excellent work, minister. Now begins the hard part for you, however. Prepare to enact some of the suggestions and plans in this report throughout our armed forces.""
 christdem_med.41.a:0 "Always easier said then done..."
 
 christdem_med.42.t:0 "Mimicking the XMAS" # Mimicking the XMAS
 christdem_med.42.d:0 "The Decima Flottiglia Motoscafi Armati Siluranti was a World War 2 era flotilla renowned for its effectiveness in battle, and impressive employment of Frogmen to disable enemy ships. As part of our defensive preparations, it is the belief of High Command that replicating the capabilities and doctrine of XMAS in other units will give us the best results for our investment in terms of overall fleet capability.\n\nIn days gone by, XMAS was the terror of the British navy, almost single handedly driving those pompous fools from the Mediterannian. Able to strike quickly and silently, the flotilla would be steaming into battle, the mines would be planted, and the enemy's doom assured before they even realized what was happening. Against the Germans and Burgundians, far less adept than the British at naval warfare, they will be more deadly still.\n\nSoon we will have a navy, both fearsome and modern, capable of operating with limited resources and support from the government on land, but nonetheless potent enough to destroy any who dare to oppose us."
 christdem_med.42.a:0 "Let us hope it never comes to that."
 
 christdem_med.43.t:0 "A Broader Appeal" # finding a broad appeal
 christdem_med.43.d:0 "[Root.GetLeader] glared at the stack of papers before him - a full report on the current status of the Italian manpower reserves. The picture painted by the colorful document was certainly not a favorable one; the current manpower of the Italian reserve force, as well as the currently deployed Armed Forces, was severly below acceptable amounts. The root issue was quite basic: there were simply not enough men that fit the extensive requirements for joining the army. There is a potential solution, however. As of right now, many of our colonial natives are barred from enlistment, despite their eagerness to do so. Of course, there is always the choice of simply allowing women into the Armed Forces. A potentially unpopular decision, but certainly an effective one. These proposals, once relegated to the stacks of rejected documents, finally seemed possible with the advent of democracy in Italy. [Root.GetLeader] smirked. Italy would follow the example of the Romans of yore, opening its legions to all of its loyal citizens, so they may share the honor of defending their shared homeland! Of course, it wouldn't be as easy as simply removing the existing legal restrictions; the prejudices that led to these policies being implented certainly still exist within both the populace at large and the Army. Annoying, but not an impassable problem; it would simply require a targeted effort on the part of our government to convince the people, and by extension, the Army, that this is the only way forward. "
 christdem_med.43.a:0 "Killing two birds with one stone."
 
 christdem_med.44.t:0 "A New Model Army" # Racial integration
 christdem_med.44.d:0 "The market square in Sirte was the usual sight: hundreds of Libyans trading their goods, and perhaps a dozen Italians keeping watch for disorders. What was new, however, was a small platform at the centre of the square: there, in front of an empty frame, a single man with olive skin, a "meticcio", stood in the uniform of the newly established "Corpi Misti del Regio Esercito", and another one sat at a desk filled with paper forms. "Citizens of Sirte!" he shouted in the local tongue, taught to him by his mother as most meticci, "By decree of the government, anyone - yes, anyone! - willing can join the army to fight for our country!" The people in the square murmured, insults were directed at the soldier, but he was prepared: "Yes, I know what you think! Italians conquered our land, and now they want us to die for them? But there is a reason! And the reason is... this!" and he lowered the poster hidden in the frame.\n\nThe murmurs became screams, and tears: it was a photograph of two white men in black uniform, swastikas on their arm and jeering smiles on their faces, throwing a black, sickly thin body in a dumpster pit. There, dozens more black, thin corpses laid cramped and naked: men, women, elderly and even children. Some had flies covering their lifeless eyes, others bones jutting out of partially-eaten flesh. "This!" the soldier yelled over the crowd, "This is how they treat your people - OUR people - outside of Italy!" Rage filled the square. "These people - these MONSTERS - will never be satisfied! They'll kill more! They'll kill everyone! And when there's no one left to kill there, they'll come for us!" The screams were deafening now, and the officer smiled. "Death to Germany!" "Revenge!" "Kill the nazis!" echoed throughout the square. "If you want to protect your children, enlist now! All those who serve for ten years will become Italian citizens, forever! Italy only wants the best for you, do you want it too? If so, go to the desk and enlist! Your wives, your children, and your children's children will forever be grateful!" Immediately, the desk was assaulted by dozens of men competing to be the first to enlist. The officer's smile became even wider."
 christdem_med.44.a:0 "All it takes is a push in the right direction, and our country will be saved..."
 
 christdem_med.45.t:0 "An Unconventional Officer" # fighting for your country
 christdem_med.45.d:0 "The ceremony for the appointment of Mu'Ammar Gaddafi was rather "peculiar" to say the least. The self-appointed "Generale in Capo delle Forze Ausiliarie Beduine della Libia dell'Est e del Sud Sottoposto alla Sola Autorità di Sua Altezza Reale Umberto II Re d'Italia ed Imperatore di Etiopia" reached Ueddan, a small city south of Sirte, with a caravan of more than a thousand camel warriors - three hundreds of which would have left for Italy as part of the deal - led by Gaddafi himself and his personal bodyguard, thirty female soldiers "as beautiful as they are deadly". The Italian delegation was composed of the governor-general of the Libyan metropolitan area, the commander of the oil fields garrison, thirty honour guards of the desert mobile division "Diavoli delle Dune", and a valet of the Royal Household sent by the King to celebrate the alliance. Umberto II had been invited by Gaddafi too, but politely declined due to "very delicate and undelayable State matters".\n\nThe camel caravan entered the town in a flurry of trumpets, exotic beasts from Gaddafi's own serraglio, and servants bringing gifts for the italians: a bedouin gem-encrusted sword for the King in Rome, a golden dagger for the governor and the garrison commander and a silver-hilted combat knife, shaped like those used by the desert fighters, for each of the honour guards. Also, Rolexes for everyone. Because everyone loves a Rolex. How could he get Swiss watches in the desert? This is why he's getting the office: if he can send agents to Switzerland without anyone noticing, he's an asset worth keeping...\n\nThe ceremony was perfect: Mu'ammar Gaddafi kneeled in front of the valet, who conferred upon him his title, a knighthood of the Order of the Holy Annunciation, and a lump sum of money "as a sign of good will for the future of Italy and the desert people, forever bound by friendship". Then, came the celebrations, with exotic foods, dancers and camel formation manoeuvers: who knew camels could be so well-coordinated? After everything ended, Gaddafi returned to his beloved desert, promising, with a last grin, to "return the hospitality when he visits Italy"."
 christdem_med.45.a:0 "Anything, as long as he doesn't bring all these camels to Rome."
 
 christdem_med.46.t:0 "A Change in Doctrine" # Women can now join the military
 christdem_med.46.d:0 "The door of the minister for the defence's office slammed open, and three enraged generals entered the room. The minister raised his head from the documents he was reading and saluted the officers, who barely returned the gesture before they all begun talking over each other. The minister raised his hands: "Calm down, gentlemen! Calm down, one at a time, please!" to which they seemed to placate a bit. One of the generals looked at the others, then took a small folder and slammed it on the minister's desk: "What is this travestry?!" he screamed in the politician's face, "Women enlisting?! Do the army and its traditions mean nothing to you all? This is madness!" The minister calmly took the papers and put them back in order: "This is not madness, general" he replied, slightly offended, "This is the future" and the yelling began anew. After several minutes, silence returned, and the same general spoke again: "Minister, we can't cooperate with a government which desires to turn our army into a farce of fugitive housewives and rebellious daughters! Tell the Prime Minister to recall this... this blasphemy! Recall it, or-"\n\nThe minister rose from his chair. "Or what?!" now HE was the one screaming. "What will you do, general? Will you shoot me? Will you shoot the entire government? Will you choose a more suitable cabinet, like Mussolini did?" he was red in the face, veins popping on his forehead. "Believe me, gentlemen, you won't! You want to make threats? Then let ME make one! I know someone, someone who's greatly in favour of this reform, someone who can remove you - ALL of you - from your ranks, and throw you into the dust!" a general laughed, and the minister lowered his voice menacingly: "I'll give you a hint. He wears a crown on his head" the laugh died, "And he has too much to think about to care about little flies such as you, but should you try to get into his way, he will end you and your pathetic careers!" all faces paled simultaneously. "Now you WILL take this decree, and you WILL abide by its provisions. Have a nice day, gentlemen" and he returned to his documents. The three officers scurried away from the room."
 christdem_med.46.a:0 "Relics of the past have no place here."
 
 christdem_med.47.t:0 "A Change in Mindset" # Seeking volunteers for recruitment
 christdem_med.47.d:0 "Sunday lunch at the Varesini household was the same as it had always been ever since the marriage begun three years ago: at twelve o' clock, Lorenzo Varesini entered the kitchen, where his wife, Margherita Varesini born Izzo, had been cooking since ten. The house was simple, poor even, with its white, unadorned walls and common furniture, save for the TV, for which Lorenzo had spent all the money they made - or better, all the money SHE made - in the last year. As usual, the cutlery was already perfectly lined: a couple slaps had taught Margherita that, even in a poor house, order was everything. "Margherita! Is it ready yet?" came the usual question. "Yes dear, I'm finishing!" but the husband was no longer listening, zapping and finally stopping on the Telegiornale, the news channel.\n\nMargherita brought the soup-filled dishes, but suddenly stopped near the TV, the plates still in her hand. "By decree of the ministry of defence" came the anchorman's smooth voice, "Starting today, women can enlist in the army as auxiliaries, drivers and pilots. Further decrees will regulate the eventuality of fully-female fight-" the TV went off. "Bah! Cagate!" came Lorenzo's voice. "Margherita! Don't make me come for you!" he yelled, but his wife was immediately at his side. For the first time in almost two years, a radiant smile was on her face, even covering the latest bruise on her cheek.\n\n"Yes dear, here is your soup" and she poured the steamy fluid onto her husband's head. Lorenzo screamed in pain, and made to get up, but Margherita was faster, crushing the empty plate on his face: the rough ceramic broke, as did the man's nose. "Puttana! Io ti- AAH!" another scream, this time from the woman's foot coming in contact with Lorenzo's private areas once. Then twice. Then in the stomach. When the man was curled on the floor, holding his head, Margherita Varesini calmly went to her room, took her only bag, and returned to her husband, still on the floor. "Lorenzo, I'm joining the army. Pray they don't give me a weapon, or you will be my first target. Goodbye!" and then Margherita Izzo left the house, smiling."
 christdem_med.47.a:0 "Truly, a new age is dawning on Italy."

 #Fanfani
 christdem_med.51.t:0 "The Shadow of the Sun"
 christdem_med.51.d:0 "According to the press and television, the person guilty of the Piazza Fontana bombing has already been found: Pietro Valpreda, a known anarchist, was spotted entering the Banca Nazionale dell'Agricoltura building with a large suitcase some time before the explosion. If one were to watch any Italian news broadcast, it would seem like this is an open-and-shut case - Valpreda has a flimsy alibi, a clear motive, and a connection to the crime scene. While many voices of varying levels of influence have criticized the narrative, pointing out its inconsistencies, most of the public, the journalists and the politicians all feel reassured to know that the horror can be easily explained away by pointing at a gang of radical anarchist fanatics - something which Amintore Fanfani is very happy to do, especially during his numerous appearances on national television.\n\nThe reports appearing on the desk of prime minister Fanfani tell a different story. After looking at some particular elements of the case, namely the bags used to carry the explosives and the timers which set them off, police and Carabinieri report point out to the possibility that the terrorist act was, in fact, not orchestrated by the Milanese anarchists. Some photographs, documents and recordings lend credibility to the fact that anarchist cells, dormant in Milan for a long time, have been infiltrated by extremist right wing and neo-fascist groups, with a sort of mesh of personal relationships and political contacts between these anarchist groups and several fascist militants being documented. A hypothesis even emerged that the attack was in fact not carried out by Valpreda, but by another person connected to underground fascist groups carefully disguised to look like Valpreda.\n\nHowever, this is not all. Through Aldo Moro and his extensive contacts in SIM, some top secret documents have reached Fanfani regarding the high possibility of foreign interference in the bombing. Some of the anarchist and fascist militants who were about to be further investigated by local police seem to have vanished into thin air, and some reference to what appear to be codenames for what might very well be foreign operatives pop up in the material that the police amassed. All the officers involved in gathering and analyzing these elements seem to have forbidden themselves from formulating theories regarding where this foreign influence could come from, almost as if they were in fear of the possible implications."
 christdem_med.51.a:0 "A black hand creeps into Italy."
 
 christdem_med.52.t:0 "The Party's Uncertainty"
 christdem_med.52.d:0 "The Prime Minister stepped into the hotel ballroom surrounded by his usual entourage of aides, secretaries, and supporters. The many wings of the party looked back at him, their faces calm but their eyes betraying the uncertain hope they held in him to guide Italy through turbulent times. The political left could offer words of support where they agreed, and plenty of condemnation when they didn't. The political right sent him the nicest letters, when they could be stirred to bother sending them. Such was the price of attempting to chart a center course.\n\nIt had taken nearly five minutes to calm the assembled delegates before he was finally allowed to speak. His prepared speech lay written in cards in his suit pocket, but with the worried glances being shot into him from all sides of the room, it was quite obvious that taking it out would only further fracture the party. With a forced smile and a wiping of his brow, he attempted to speak on how the party could bridge the growing divide both within Italy and indeed within itself.\n\n"Compromise," he began, "Compromise had led to the end of fascism, to the end of political tyranny and uncertainty within Italy. The voters selected me for this office not because of radical ideas and bomb throwing populism, but because all Italians knew that whether they agreed with us or not, the Democrazia Cristiana offered practical, functioning solutions." He wiped his brow again and gave another forced smile. Some delegates even returned it. For the next thirty minutes he continued to offer his hopes for the future of Italy and its democracy, his hopes for party unity and confidence, and his hopes for an end to uncertainty and panic. Perhaps the delegates did not truly believe him, but as long as they could say that they did, it was good enough."
 christdem_med.52.a:0 "Fanfani shall lead us through these troubled times."

 christdem_med.53.t:0 "Reuniting the Party"
 christdem_med.53.d:0 "The reporter in the back, a fresh faced journalist sent to observe the series of speeches being done by the Prime Minister and his aides across Southern Italy, raised up his instant camera and snapped a photo. The camera flash echoed across the room, immortalizing the Prime Minister and the politician beside him within the finite medium of film.\n\nOn the left side of the photo stood the Prime Minister, dressed in a fine suit and tie, extending his hand out towards a local member of the Democrazia Cristiana. On the right side of the photo stood that local member, a former farmer and always pious catholic turned local politician for the city of Salerno. Captured in the back of the photo, behind Fanfani and the local politician was the Prime Minister's entourage, a motley assortment of baby faced university graduates turned interns, grizzled party operators, and trusted aides. If one could look close enough, they could see the relief in their eyes at another successful meeting. Few had suspected Fanfani's move to reconcile the Party's left and right would succeed, but all within the party would be glad that it had.\n\nGlancing at the photo, the reporter scowled when he saw that the lighting was off. Crumpling it up, he stuffed it in his jacket pocket and began moving to take another one."
 christdem_med.53.a:0 "A photo captures what words can only describe."
 
 christdem_med.54.t:0 "Calling Out to the Silent Majority"
 christdem_med.54.d:0 "The television flicked on as the shop owner went about setting up the display in the store's front window. A literal wall of televisions was presented, dozens of different models from not only Italy, but America and Japan as well. Despite the disparity, one thing was consistent. On each of the screens, a recording of the Prime Minister's speech from last night began playing.\n\nA podium stands empty, a member of the Carabinieri stands to the left of it and a member of the Polizia to its right. The Prime Minister walks into frame from the right, the two members begin clapping as he does so, he waves to the camera. The teleprompter screen is briefly visible in the reflection of his glasses. He stands on the stage and smiles, the lighting and editing effects ensure that he appears more photogenic than usual. "Good evening to the viewers both in the studio and at home, I am thankful that across our humble nation the vast majority of not only Democrazia Cristiana voters, but in fact all voters are watching." he begins, still maintaining his composure, "It is undeniable that times have been better, and some have even begun to question the very founding principles of our democracy. To these rioters and criminals within our streets, I can only offer my most sincere condemnation. If you truly wish for change then you can institute it like a normal, civilized member of the population and not as a bomb throwing barbarian. My government has embraced a wide ranging platform of simple, commonsense solutions to the crisis at hand and I will, if you give me just an hour of your time, explain them to y-"\n\nThe speech cuts out suddenly, as the store owner changes the TV's channels to last night's football game. In such difficult times, it is best to not to take a side whenever possible." 
 christdem_med.54.a:0 "A shame, it was quite the speech."
 
 christdem_med.55.t:0 "Meeting with His Holiness"
 christdem_med.55.d:0 "Despite all of the turbulence and upheaval within Italy, it was undeniable that many things remained consistent. The Catholic Church and its Pope, Paul VI, for example, had been more than willing to meet with the Prime Minister when asked. It didn't take a genius to figure out why. Fanfani could ask the Pope for stability and peace within these troubled times to shore up his government, and the Pope could use the photo opportunity to stress the unity of being both Italian and Catholic, two ideas that had once seemed almost irreconcilable.\n\nThe meeting itself was, to put it bluntly, almost benign in its content, both men clearly occupied elsewhere. The Pope would ask for guarantees of the government to maintain peace and ensure religious freedom, and the Prime Minister would agree. The Prime Minister would ask the Pope to make sure his flock would remain peaceful and equitable even in the face of violence within the streets, and the Pope would of course agree. At the end of the meeting came the most important part, where the two emerged from Saint Peter's Basilica and embraced.\n\nTomorrow, a photo of that embrace would be on the front page of every newspaper in Italy, and accompanying it would be the newest editorial from the Pope, requesting peace not just for the sake of the government, but for the sake of humanity everywhere."
 christdem_med.55.a:0 "His Holiness only serves to do what is right."
 
 christdem_med.56.t:0 "Building a New Coalition"
 christdem_med.56.d:0 "It had taken every year of political experience and grit that Fanfani had to accept the reality that no matter how many flowery speeches and calls for unity he gave, the simple reality was that the Democrazia Cristiana would not unite around him. The Party Right was too apathetic, and the Party Left too divided to ever build the coalition that Italy needed if it was to push forward through such troubled times. With a heavy heart, he had picked up the heavy phone on his desk and placed a call to an unlikely ally. Giuseppe Saragat, leader of the Partito Socialdemocratico Italiano.\n\nAs the two men sat together in the Prime Minister's office, a strange and awkward silence stood between them. In better times it would have been easy for them to talk the night away on topics of policy and politics, but the reality was that Fanfani was the Prime Minister, and the other was only an embattled party leader.\n\nWith some difficulty, the silence was eventually broken, and they began discussing how a middle ground could be formed. Saragat made sure to not let his surprise at the news of Fanfani's decision to move away from his own party show on his face, and Fanfani maintained his composure even during the diciest moment of their negotiations. In the end, a compromise was reached.\n\nThe foundations for Fanfani's most ambitious political gambit were laid."
 christdem_med.56.a:0 "The good of Italy demands more than just following the party."
 
 christdem_med.57.t:0 "Fanfani's Reflections"
 christdem_med.57.d:0 "He sat at his desk, his brow creased as he continued to crunch the numbers of support for the coalition he had been building. To say that the Democrazia Cristiana had been critical of the decision would be... an understatement. The press had been vicious, the voters savage, and his own former allies within the party the most critical of all. It didn't take much to imagine how they would react once tomorrow's paper broke the news of his recent meeting with the king.\n\nMeeting with the king under normal circumstances would have, at best, raised one or two eyebrows from the most radical members of the political spectrum. For years his Majesty had conducted himself with an aura of dignity, one that could only be formed through years of dedicated public service. Under normal circumstances, Fanfani would have had nothing to worry about when meeting his majesty.\n\nIt was a shame that these were not normal circumstances.\n\nHis intentions when meeting with his majesty, especially in light of the meeting with Saragat, were obvious. The BN, no matter how their ideas dispersed, could all still reliantly maintain their faith and support for the monarchy. Attempting to pander to them was a dangerous proposition for the Prime Minister, but one that had to be done. He had no idea how his legacy would look, how his supporters would react, and how his own party would fare at the next election. Whatever happened, it did not matter, for with a triumphant shout, he finally finished crunching the numbers. If everything panned out as it should, he would have his majority."
 christdem_med.57.a:0 "The voters will understand, if given enough time."
 
 christdem_med.58.t:0 "The Bedrock of Italy"
 christdem_med.58.d:0 ""Prosperity and peace through compromise, labour leaders and the Prime Minister agree this is the best way forward. Don't take our word for it, listen to from the horse's mouth!"\n\nThe campaign truck slowly drove down the road past the assembled workers, each side of it covered with campaign slogans and posters praising the Prime Minister. Through the speaker system placed on top of it, excerpts of a recent speech were played one after another, with Fanfani's words mixed in with the words of various prominent union officials. For the assembled factory workers, the campaign truck was either an interesting afternoon diversion or an annoyance distracting them from their food, depending on who you asked.\n\nTwo workers in particular, brothers from a small town outside of Naples, listened intently to the truck, even as it pulled away to drive to another factory. Turning to one another, the oldest spoke first, commenting on how glad he was to see the union bosses and the Prime Minister collaborating. A patriotic military veteran who served with distinction in the Levant, he stood as a polar opposite to his left minded younger brother. His younger brother folded his arms across his chest and listened intently, considering what to say. When at last he finally spoke, it was to the surprise of his older brother.\n\n"Despite what misgivings I have," he began, "I must say it is good to see the Prime Minister refusing to blame the violence on the unions. It would be terrible to have the actions of a few bomb throwing radicals put us all out of a job." As he finished speaking, the factory bell rang signaling the end of their lunch break. Picking up their belongings, the brothers returned to work."
 christdem_med.58.a:0 "The politicians come and go, but the unions shall be here forever."

 christdem_med.59.t:0 "The Issue of Efficiency"
 christdem_med.59.a:0 "Tighten government controls, the current leadership is fine." # no fires
 christdem_med.59.b:0 "A shot of experience is needed, let them back in." # handle by letting the old guard in

 christdem_med.60.t:0 "The Cathedral's Shrine"
 christdem_med.60.d:0 "For the priests and clergy who served in the Milan Cathedral during the era known as the Cold War, they would forever carry one memory with them.\n\nIt had begun mere hours after the first news came out about the Piazza Fontana bombing. A man dressed in a formerly fine suit, one now caked with dust, debris, and other bits of clutter stumbled into the Church. The clergy looked on with grave concern as he entered, unsure if the man should be in the church or in the hospital. To those present's imminent surprise, the man did not move to pray. Instead, he took the hat off his head and placed it in the center of the Church's foyer, and next to it he placed a simple picture of one of the victims. Out of respect, the clergy placed several candles to mark the spot and assumed nothing more would come of it.\n\nOver the next couple months they would be proven dead wrong.\n\nAt first they came as a trickle. Survivors, family, friends, and anyone else involved. With each visit, the shrine slowly grew. Soon it turned to a flood, as many who had no connection to the tragedy other than a shared sense of hopelessness came and added to the shrine. It grew steadily, soon attracting the intention of not only the press, but even the prime minister himself. In a photograph shown across the world, Prime Minister Fanfani visited the shrine, personally lowering his head in solidarity with those lost.\n\nWhile the shrine eventually was taken down and cleaned up, and for some, even forgotten, the clergy present would never forget it. Decades after the bombing and its aftermath, not a single member of the clergy had even once thought about throwing away the photo taken of them with the Prime Minister."
 christdem_med.60.a:0 "History lives within those who witness it."

 christdem_med.61.t:0 "We're Sorry to Interrupt Your Regularly Scheduled Broadcast" 
 christdem_med.61.d:0 "The Prime Minister appears in his office, the Kingdom's flag is visible behind his back. Smiling, he walks forward towards the camera, the shot slowly zooming in to focus on his upper torso and head. He begins speaking. "Now I am sure many of you are less than pleased to have me interrupt your football game or television drama, but if you'll just lend me a minute of your time, I'm sure you will find it worthwhile. There has been much uncertainty and fear recently over the growing terrorist attacks and violence within our nation's streets. I am here to assure you that the government is doing everything possible to protect our citizens and find the cause of this rampant lawlessness.\n\nThe image changes, and now several clips begin playing in succession of one another. The Polizia are seen on patrol, each one dressed in an impressive uniform and brandishing a rifle. Next an Italian family is shown enjoying a midday meal outside, the children smile and play as the parents look at eachother free of worry. Finally, several successive scenes are shown of various investigators and detectives working, each one carefully and analytically completing their investigation.\n\nThe scene changes back to the Prime Minister who is now smiling at the camera. "As you can see, the government has everything under control. I can promise that we have already begun to get to the bottom of this and it will not be long before we return to normalcy." The screen freezes on his smile, and a small signature appears on the bottom left corner of the screen." 
 christdem_med.61.a:0 "This message has been approved by the office of the Prime Minister."

 christdem_med.62.t:0 "The Unhappy Triumvirate" 
 christdem_med.62.d:0 "The three men sat together at the press conference, each one facing each other in a half circle of chairs. To the right sat Achille Lauro, to the left Giusseppe Saragat, and in the center sat the Prime Minister. They smiled for the cameras and promised that unity and stability was in reach, but deep down, each one was more unsure then the other two. If the reporters could have seen their thoughts, perhaps tomorrow's paper would have been quite different.\n\n"No matter how I think about it, I can't help feeling just a little disgust with that man to the right of the Prime Minister. Isn't he a friend of the last Duce, Galeazzo Ciano? Surely such a man's hands can not be completely clean in this whole ordeal, I wish Fanfani would stop associating with him." Saragat thought to himself.\n\n"This entire gesture is ridiculous, we're campaigning for unity when we should be crushing those protesting reds in our streets. If only I had won the last election... I'm sure Saragat must be thinking the same thing." Thought Lauro to himself.\n\n"At least they were both willing to do this. I can only hope the political blowback from the rest of the party won't be too severe... oh, the press wants a photo." The Prime Minister thought to himself.\n\nLeaving their own thoughts behind, the three men all smiled for the camera, but not one of their smiles reached their eyes."
 christdem_med.62.a:0 "Truly a gesture of great unity."

 christdem_med.63.t:0 "Fanfani's Quagmire" # Confront the banks, hey fellas, you're resisting our pushes for reform, we're gonna need that to change.
 christdem_med.63.d:0 "It had been a spot of tremendous frustration for the entire government and the Prime Minister in particular. The many banks that compromised Italy's financial sector had, no matter how many promises of potential benefits and concessions offered by the government, stringently refused to work with the Prime Minister's platform of catholic capitalism on his terms. Rather, they continued to demand the right that if they were to work on it with him, it would have to be on their terms.\n\nAs the Prime Minister sat at his desk after another day of fruitless negotiations, his gaze fell on the calendar on his desk. He had known the date when he had woken up that morning. He had known the date when he had gotten lunch with his aides before the next round of negotiations with the Banks. Only now, at the midnight hour, did he truly recognize the significance of the date.\n\nHis term, one which had opened with promises of stability and prosperity and had stuck through thick and thin, was slowly nearing a close. The fight with the banks was clearly not going anywhere fast, not with the next round of lawsuits and ad campaigns they had threatened to kick up. And all the while he was losing what hair he had left dealing with this, many more important issues lay on the back burner. He had never been one to back down from a fight, but surely now was as good a time as any. As he finally broke his gaze with the calendar, he knew what to do."
 christdem_med.63.a:0 ""My efforts are better spent elsewhere, someone else can deal with this."" # give up
 christdem_med.63.b:0 ""Perhaps the bankers aren't so bad afterall..."" # work with them

 christdem_med.64.t:0 "Finishing Moro's Work" # expansion on EDU, better education as an appeal to students 
 christdem_med.64.d:0 "Prime Minister Moro had, in one of his administration's most lauded accomplishments, invested heavily in educating the next generation of Italians. It is unmistakable that because of his work, many of tomorrow's greatest thinkers, scientists, and military men will be able to look back at the former Prime Minister and thank him for his work. Expanding on such programs is not only a good way to build Italy's future today, but it is also a good way to boost Fanfani's stagnate approval numbers.\n\nWith every bill passed increasing funding for these widely popular programs, Fanfani has ensured that he will be the face of it. At the opening of new school's he will cut the ribbon, at the graduation of new university students he will clap in attendance, and at military parades for new cadets he will be there to salute the soldiers. It is important that every person who has benefited from the program will know firmly that it was the Democrazia Cristiana who made it all possible.\n\nWhile some may look at this with the disgust of a cynic, the people will know in their hearts that it is for the best. It is just clean, good politics."
 christdem_med.64.a:0 "Who ever said that altruism and self-interest had to be opposed?"

 christdem_med.65.t:0 "The Fanfani Education Initiative" # (mutually exclusive with previous event) a new program to help education platform within the country!!! :))
 christdem_med.65.d:0 "The Prime Minister stood with his entourage at the ribbon cutting ceremony, the university's class for this year sat in the audience watching. At a podium in the center of the stage, a professor carefully vetted by the man's aides gave a gripping speech to the students in attendance. He spoke of the virtues of moderation and Catholic modesty in the face of soulless communist materialism and hateful fascist nationalism, every syllable going over the head of the thoroughly bored student body. In the back, reporters gathered to snap a photo of the moment of the Prime Minister cutting the oversized ribbon and bow placed before him, a symbolic ceremony to celebrate the opening of the campus's newest building.\n\nFar in the corner of the assembled students, under the cover of an old tree, two of the school's more left leaning students sat observing the spectacle. They joked together and mocked the speech being given, each one equal parts amused and agitated by the professor's dry speech on the evil's of an ideology he clearly knew little about. For them, it was all in all a pleasant enough way to spend half an hour.\n\nEventually the professor stepped down from his podium and the band present struck up the national anthem. With a broad smile, the prime minister received an oversized pair of scissors and moved forward to cut the oversized ribbon. As it split in two, the stage was covered by an outburst of camera flashes as the reporters finally had their shot. When it was all over and done, the two student's before remained seated under the tree. To the annoyance of one, his comrade in mockery had remained completely silent through the entire ribbon cutting.\n\nIt took some pressing, but eventually the man gave his answer in a low voice, not even daring to meet his friend's gaze. "I... I was already to mock it as well, but then I thought about my younger cousin. They don't have enough money to go to university on their own, not without the help of the government. I despise that pig Fanfani but... I can't despise the good that may come from this.""
 christdem_med.65.a:0 "The complication of radicalism."

 christdem_med.66.t:0 "Fanfani and Forlani" # Finding unity in these trying times, meet with Arnold Forlani (future DC leader), make the public like the party 
 christdem_med.66.d:0 "The two men sat together at the table of a small Florentine cafe, a half eaten meal of oysters and beefsteak lay on the table between them. On the right sat the Prime Minister of the Kingdom, his smile genuine as he talked with the man across from him. On the left sat the other man, a rising star within the party and a committed Fanfanite. Perfect symmetry.\n\nThe Prime Minister spoke in a jovial tone, his voice free of the usual stress that had dogged him ever since he had assumed the office. "I'm glad you agreed to meet me for lunch Arnold, you've certainly made an impression with the rest of the party. When you speak of my ideas to them, they all swear that it is like they are hearing them from myself for the first time. You certainly have a bright future ahead of yourself in this party, perhaps when my term ends it will be you who ends up taking my spot as PM."\n\nForlani smiled and looked down at his food, the Prime Minister's words echoing around his head. He had long been swayed by the man's ideas of Catholic capitalism and Christian democracy, without a doubt, and hearing such praise from the man himself was a dream come true... but...\n\nHe had the strangest feeling in the back of his mind, a sort of unease that refused to present itself into view. A most cowardly, traitorous thought ruining an otherwise perfect afternoon. As he looked back up from his meal, he looked over the Prime Minister's face, daring the thought to present itself. When it did not, he sighed internally, and did his best to reenter the moment. Extending a hand, he shook hands with Fanfani."
 christdem_med.66.a:0 "Symmetry broken."
 
 christdem_med.67.t:0 "The Optimal Voter Base" # Let the facts show, the DC has the LEAST volatile voting base, this translates to a stable government :)
 christdem_med.67.d:0 "An unexpectedly strong gust of wind strikes the table, blowing a pile of pamphlets all across the square. A dozing old man running the stand wakes up and looks out at the mess, a look of dismay visible on his face. The frame freezes as it focuses on his look of dismay, and a prompt appears on the bottom of the screen.\n\n"What the radicals would do in this situation:"\n\nFirst, a group of citizens enters the frame, dressed in the latest fashions of the youth. Some even wear pins identifying them as members of various radical right and leftwing political parties. As to be expected by such radicals, rather than helping the dismayed old man, they begin to play and frolic with the spilled pamphlets. One even crumples a large number together into a ball and begins kicking it around with his friends in a makeshift game of football. As they laugh, the camera once again freezes on the even more dismayed face of the oldman, and another prompt is put on the screen. "What the Democrazia Cristiana voter would do in this situation:"\n\nAnother group now enters the empty square, each one dressed respectfully and modestly in clothing fitting for a formal occasion. Even the youth among the group are dressed modestly, with one of the girls present making the sign of the cross before going over to assist the old man. With careful precision, the various Democrazia Cristiana voters clean up the pamphlets, helping the now visibly grateful old man. The camera freezes once more, on the thankful face of the man." 
 christdem_med.67.a:0 "This message has been sponsored by the Democrazia Cristiana."
 
 christdem_med.68.t:0 "The Perfection of Moderation" # peace and prosperity! Christain Capitalism is a neat ol' concept!!! The DC has been using it and its worked out fine, immoral fellas are dicks, it takes christian ethics to make capitalism work, and the DC bring that peace and prosperity
 christdem_med.68.d:0 ""It goes without a doubt that today, despite the mass upheaval and tension that has gripped Italy for so long, that the common Italian man is wealthier and more prosperous than he has ever been in any point of history prior to today. I'm sure we all had our doubts about the man, I will not lie I was sure Italy was heading into disaster when they picked him but- but, the results speak for themselves, Fanfani has done a remarkable job as Prime Minister of Italy, and I'm sure all of us at the BBC's foreign consulting department can agree on tha-"\n\nHe switched off the television in his office, a small smile creeping onto his lips as he enjoyed the praise he had received. It felt good. Damn good in fact to hear those foreign correspondents choke on the same words they had lambasted him by. It was a moment that called for a drink. Taking a small bottle out of his desk drawer, one he was sure would cause quite the fuss if the press found about it, he poured himself a drink. Raising the glass up to the television, he made a toast, to himself.\n\nOn the other side of Italy, another man watched the same footage, a slowly burning anger building up in the back of his mind. With every word of praise given by that foreign correspondent, he felt it crash against his own experiences, against the way the government and the corrupt bureaucratic fucks who ran it had screwed him over at every turn. "Enough!", he wanted to shout, "Enough lying, enough spinning and sugar coating! Nothing was fine in Italy, nothing!" In that moment he felt truly powerless, truly unable to make any change... and then he was struck by a plan.\n\nRetrieving the rifle he kept hidden in his bedroom, he loaded it and pulled back the slide."
 christdem_med.68.a:0 "A great trial looms ahead..."
 
 christdem_med.69.t:0 "An Unwanted Farwell" # Former party leader Aldo Moro missing, what the fuck help, investigation on him
 christdem_med.69.d:0 "The Prime Minister sat in his chair, half asleep and half awake as he idly listened to an aid give him his daily briefing. It had been a quiet morning in Italy, a pleasant change from the constant headaches and stressful nights that had long sabotaged his time as PM. Economic growth was decent, the international position was alright, and for the first time in a while, the constant protests and social unrest was beginning to flow away. Years later, looking back at that day and those that would follow, Fanfani felt like he should have known something was off.\n\nSometimes, when he was alone at night, the man would play the events over in his mind, attempting to detach himself from his own seat and see the full picture clearly.\n\nHe sat in his chair facing the aide, a fresh faced youth just out of university who had been the most dedicated Catholic he'd ever met. Down the hall from his office, a man was sprinting towards it, his face coated with shock, an urgent message he had been told by the uniformed men downstairs to deliver to the Prime Minister lay crumpled in his white knuckled fist.\n\nA minute out now from the news that was to be delivered. His aide was checking his watch as he idly told the Prime Minister about the recent demonstrations in Palermo, the Prime Minister wasn't listening as he instead thought about what to have for lunch. The man has nearly reached the doors, only slowly so he could open them.\n\nFifteen seconds out now, the doors are opening alerting both of them that something may be wrong. The Prime Minister is jostled out of his daydreams as he looks up at the frenzied youth.\n\nThe youth looks back at him, the time is now. With a shaky voice, he speaks the words which would so define his remaining tenure as Prime Minister."
 christdem_med.69.a:0 ""Sir... I... it's Moro sir, the politician. He's gone missing, the Polizia downstairs are calling it a kidnapping.""
 
