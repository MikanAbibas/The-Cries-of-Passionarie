 ITA_Galeazzo_Ciano:0 "Galeazzo Ciano"
 POLITICS_GALEAZZO_CIANO_DESC:0 "Throughout his cursus honorum, Galeazzo Ciano, Duce and Prime Minister of the Italian Empire, has always shown great skill at negotiation. From ambassador to Foreign Minister, Ciano was behind many of the treaties that gave his country an empire spanning three continents: this ability didn't go unnoticed, and Benito Mussolini, founder of fascism, made the young Count of Cortellazzo his son-in-law, grooming him for succession.\n\nWhen the aging Mussolini plotted against the monarchy, however, Ciano - monarchist by birth and fascist by choice - avoided a civil war by mediating between the two sides, though many still whisper that Mussolini's sudden death was no coincidence... After his succession, the new Duce secured his position by rewarding his allies and isolating his most vocal opposers; outside, he protected Italy's independence from the Reich by single-handedly masterminded the birth of the Triumvirate: who else would have been able to put together three countries that, by all means, hate each other?\n\nNow, however, the Duce finds himself at a crossroads. The decline of the Reich is quickening the collapse of the Triumvirate, held together mostly by shared hate for the Germans. Internally, the economy struggles to recover from Atlantropa, and dissent is rising, from Ethiopian partisans demanding independence to young students asking for democracy.\n\nIf the metaphor comparing a nation to a boat is correct, then Italy is approaching a great storm. The road for compromise is narrowing by the day, and the old diplomat feels impotent to secure what he fought so hard for: will Ciano succeed in saving Italy and fascism, or will he be swept away by the waves?"

 #################################################################################################################################################
 POLITICS_THEODOR_HOFFMAN_DESC:0 "Theodor Hoffmann is your average Kriegsmarine admiral. Or is. Was. Freezeframe, look at the portrait. Into the eyes.\n\nYep, that's me, Theodor Hoffmann. You're probably wondering how I got into this situation, making the biographies for all of the leaders in the game and now being the leader of an abomination against humanity. In fact I probably look a bit older than I should.\n\nIt's a long story, really. There I was, kicking it back and chillaxing as us in the Volksmarine called getting some babe and going out for 'reading theory and chill' as the boys said. It was a real tight gig I had, chilling out, maxing, relaxing all cool. We'd then play some bball out by the Soviet Naval War Academy in Leningrad. So anyway, I'm chilling with a hot babe, like total 10/10 Lithuanian girl named Lina who was totally groupieing us hardcore sailors, when BAM! Time vortex, shot me out here and Lina probably in the Ice Age or something.\n\nSo anyway, here I am in Leningrad, 'cept it ain't really Leningrad, it's some new name and everyone looks real angry. I played off the time vortex as a totally bitchin' light show and pretended to know what was happening. Next thing I know they got me leading a fleet, give me another minute and suddenly Herr Bromann as I call him (dude can shotgun a mad pre-pee if you know what I'm saying) is like "Broham fist me," (it's what we called fist bumps we were tight) "I got a sweet ass gig for you."\n\nAnd now here I am. I like to chillax and write up some bits about all the weirdos around here, and I gotta be straight I got no real clue what's going on, but damn if owning all the tightest beaches in Europe isn't landing me some sweet cookie."


