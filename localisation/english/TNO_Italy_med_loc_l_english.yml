 ITA_med.141.t:0 "Wargames: CODENAME LEPIDUS"
 ITA_med.141.desc:0 "The umpire assigned to the Italian Red Team, a colonel from the general staff whom Giovanni De Lorenzo had never met before began to repeat the message he had just relayed to the general as several members of the Red Team entered the room.\n\n"As I had been saying to General De Lorenzo here, we have decided that the Red Team's invasion against the Balearic Islands has succeeded with minimal casualties of only one brigade lost in transport and two destroyers struck by coastal batteries." A cheer went up among the officers representing the military might of the world's fourth great power, but this was quickly quieted as the colonel raised a gloved hand. "At the same time however, we have judged that the Green offensive thrust into Algeria was not countered and their troops are marching on Oran."\n\nAn unhappy silence replaced what had moments ago been cries of excitement. While the Balearic Islands would prove crucial as staging grounds and forward bases against the enemy, the fall of Algeria would leave the door open to Libya and from there to Sicily.\n\nDe Lorenzo was contemplating what they could do next to regain the upper hand when Federico d'Aquino, who had been assigned to take charge of the defense of Algeria, moved forward with a jerk and raised his hand, "Excuse me sir, but do we still have the option of pulling our troops still in the region? We had six divisions and dozens of independent units in that theater." The umpire rubbed his chin thoughtuflly, "General d'Aquino, to answer your question: yes, although I must add that two of those divisions are not considered incapacitated and cannot be retreived." The younger commander nodded gravely, and with a motion of his hand to two of his adjutants, returned to the war room high command had designated for use in the simulation.\n\nThe umpire quickly conveyed the little of the message that remained and departed while the collection of generals broke into cliques of twos and threes to discuss their tasks. De Lorenzo surveyed them all with a mix of pride and worry, but reminded himself that despite the mistakes that had been and were likely going to be made, there was no better place to make them then in a game. In a game, failure meant embarrassment and evaluation, not death and devastation."
 ITA_med.141.a:0 "In reality, however..."
 
 ITA_med.142.t:0 "The Bandit Between"
 ITA_med.142.desc:0 "Sergeant Giovanni Rossi was tired. He had spent the entire day sitting in a hot truck, all to only end up arriving at a tiny village located quite literally the middle of the Algerian desert.\n\nOnly somewhat able to relax on the worn fabric of the seats, he instantly fully alert when the truck jerked to a stop after so many hours of endless sand. Stepping out, even the annoyingly bright sun was unable to obscure the destination of their voyage through Algeria - just under the horizon, a group of small buildings, most no more than simple huts, was seen in the distance.\n\nHe, along with a squad of Italian soldiers, had come this far simply to capture - or kill - one individual: a partisan fighter, named the "Defender of Algeria." A well known resistance member, no more than 30 years old, the terrorist had tormented the Algierian garrison for months. Responsible for organizing raids on critical supply convoys, as well as the ringleader of the sporadic firefights near Italian military bases, the man had been a major thorn in the garrison's - and Rossi's - side.\n\nWhat had led them to his exact location, though, was an unprecedented escalation on the part of the partisan - he had made the grave error of directly kidnapping three Italian commanders after a particularly succesful raid on a transport convoy. Through some effort on the part of the local Italian intelligence team, Rossi's squad were able to track the location of both the rebel and his hostages, leading the them to this exact village.\n\nExplaining as such to the small squad of men that had arrived with him, Rossi started his march to the settlement - rifle in hand."
 ITA_med.142.a:0 "Let's get these hostages home safe!"
 
 ITA_med.143.t:0 "An Entrance"
 ITA_med.143.desc:0 "After what had seemed like an eternity, Rossi and his squad finally reached the outskirts of the small settlement. The village itself, already unappealing from a distance, was no more attractive from up close. Mud bricks and torn fabric lined the most of the constructions present in the village, cracks showing and wood splintering under the pressure of time. Just before he and his squad were able to enter the village proper, however, Rossi noticed a glimmer of light in the distance. Focusing his eyes, he realized - it was a squad of Iberian soldiers, with vehicles to match!\n\nConfirming that he did in fact see the distinctive green and red of the Iberian flag, he motioned to his men. "Hold, men. I've spotted Iberian forces" As per protocol, he was now required to attempt to hale the Iberian forces and inquire as to why they were present in these Italian territory. There had been designated a specific frequency on the radio for this purpose - of course, decided after weeks of back-and-forth between Iberian and Italian radio officials. Unbuckling the radio on his belt, he communicated, "Unidentified forces present in Talmine, this is the Italian garrison, please identify yourself."\n\nQuickly getting a reply, "This is the Iberian Garrison, what the hell are you doing here? This is Iberian territory."\n\nRossi was flabbergasted. Yes, they were near the border, but this was clearly part of Italian Algeria! "I'm sorry, since when is this Iberian land? This village is harboring an active terrorist, and we suggest you do not interfere in our efforts to capture them.""
 ITA_med.143.a:0 ""Well, what do you know - We're also looking for a terrorist.""
 
 ITA_med.144.t:0 "Assertions and Concessions"
 ITA_med.144.desc:0 """Well, what do you know - we're also looking for a terrorist."\n\nRossi, exasperated from the news, quietly muttered to himself. "Oh, you have got to be kidding me." Turning back to the radio microphone, he sighed. "Are we talking about the same person here? The terrorist in question has directly taken valuable personnel hostage, and we shall do whatever is necessary to return them, regardless of Iberian objections."\n\nWith a crackle, the Iberians replied. "Considering the size of this village, I don't suppose there really could be anyone else." Pausing for a moment, the voice continued, "However, this individual has directly stolen essential supplies from the Iberian occupation zone, and as such, we request you do not attempt to once again interfere with our retrieval of material assets."\n\nRossi, stifling a curse, responded. "Did you not hear what I just said? We are actively retrieving personnel!" Nearly shouting, he continued, "We cannot wait for you to finish retrieving your equipment hidden God knows where!" Thinking for a moment, the cause for the sudden hostility - on Italian territory, no less - dawned on him. Just months ago, Italian soldiers had 'borrowed' Iberian equipment found in the wreckage of a successful partisan-led convey raid, much to the dismay of the Iberian garrison. Despite the Iberian claims that the equipment was "necesary for the continued safety of Algeria," no equipment was ever returned. Turning to his second in command, Rossi postulated his theory. "They're worried that we'll steal their equipment," Rossi explained.\n\nTaking in the thought for a moment, the Corporal gravely replied, "They're not going to let us through as long as this isn't a joint operation between the two of us.""
 ITA_med.144.a:0 "This is going to be a long day."
 
 ITA_med.145.t:0 "The Assault"
 ITA_med.145.desc:0 "If Sergeant Giovanni Rossi had thought he couldn't be more tired than after a full day's patrol in the steaming hot of the Algerian desert, he now knew just how wrong he was. In fact, it turns out spending an entire day in the steaming hot of the Algerian desert while simultaneously negotiating a joint raid with Iberian soldiers - in a village no more than a hundred people in population - was a more mentally and physically tiring task than even the most arduous of training exercises.\n\nNight was already quickly approaching by the time final approval was recieved, and the quickly-dying orange illuminated the sands while Italian and Iberian soldiers converged on the very interior of the ramshackle village. Easily identifying the targeted building, Rossi quickly made his way into position along the brown wall of the structure.\n\nA faint sense of worry in his stomach, he gave the command.\n\n"Breach."\n\nPrivate Romano, clearly excited for the occasion, immediately kicked down the door with a deafening crack and plunged into the room, with the rest of the Italian squad in close pursuit. Expecting a firefight, the group instead were met with nothing.\n\nInside the dimly-lit single room of the building, neither the terrorist nor the hostages could be found, only the misty dust of the recently-destructed door. That is, until the recently-created hole opened just a small bit more. The room, becoming ever slightly more light, revealed the hanging corpses of all three missing officials, illuminated by the faint orange rays that had begun to make their way through the ruined doorframe.\n\n"Dammit," Rossi muttered, shortly before the Iberian soldiers likewise met them in the tight room."
 ITA_med.145.a:0 "The rebel was not found."
 
 ITA_med.146.t:0 "The Last Laugh"
 ITA_med.146.desc:0 ""This court finds you guilty of six counts of crimes against the personality of the State, three counts of anti-national activities, and one count of offensives against the Public Economy."\n\nGaleazzo Ciano, resigned to a hard wooden seat in the humid courtroom, could not believe his ears. Just years ago, he was the Duce of Italy, the sole leader of the State! And now, look at him. Being sentenced like a common criminal, told he was a traitor! He, as well as his legal team, had valiantly put up a defense against the bogus claims of Scorza, using every trick in the book to get him acquitted, or at the very least, not killed. Alas, such trickery would not save him. A sweat running down his brow, he readied himself for the final sentencing.\n\n"As such, you are hereby sentenced to 3 counts of life imprisonment."\n\nCiano remained silent. What was there to say? He had lost. Everything that he had attempted to improve during his reign - the Triumvirate, the Party, Italy - it would all be erased. His achievements would be struck from the record, one by one, until the only memory of Ciano would be of a failed tyrant.\n\nAs two stern-faced policemen began to handcuff Ciano, he began to laugh. The silence of the courtroom was broke, the chuckles of the deposed Duce echoing throughout. Oh, how ridiculous this was! Jerked forward, the daylight of the outside approached - his laughter only amplifying. Finally thrust into the bright light after what seemed like a lifetime, the laughter consumed him.\n\nHe managed to let out one last shrill cry, before he was stuffed into a black police cruiser - never to be seen again."
 ITA_med.146.a:0 "...And so marks Ciano's departure from the stage."

 ITA_med.147.t:0 "Relics of a Bygone Era"
 ITA_med.147.desc:0 "It was a clear morning in Genoa when the crowd gathered in front of the dockyards. On a stage before them, Podestà Vittorio Pertusio stood, surveying his audience. Those assembled before him were dressed in mournful black and grey, the clothes of a funeral. Fitting, for it was a funeral that Pertusio would conduct. Behind him stood a rusting drydock, the last part of Genoa's pride that the city hadn't scuttled yet, and behind that stretched endless wind-swept salt flats. The "gift" of Atlantropa. Seeing that the square was filled to capacity, Pertusio began his eulogy of the Genoese port.\n\nFrom its beginning, Genoa was a city of the sea. Its port had transformed it from a small town on the coast to a thriving hub of commerce. For centuries, Genoese sailors had ruled the Mediterranean, trading from Constantinople to Malacca, and it was only the rise of Atlantic trade that reduced its prominence. However, this would not be the end of Genoa's maritime activities, for following the unification of Italy, Genoa would once again become a major port. From its dockyards were built some of the most beautiful ships to ever sail the seven seas, titans such as the SS Aquila and MS Augustus. But then, the Atlantic returned with vengeance to put down Genoa's seafaring. This time, forever.\n\nAs Pertusio finished his narration, he looked up and noticed the eyes of tens of thousands upon him. As they watched, he stepped forward to place his hand upon the detonator and, with a heavy heart, pressed the button upon it. An enormous crack ringed the air as the last drydock of Genoa exploded, the shockwave being felt even from this distance. After the last piece of debris settled, silence reigned. Then, the crowd slowly wandered back home, having witnessed the end of an era.\n\nLater that day, following a preliminary meeting by city officials on how to move forward, Pertusio languished in his office, having ingested more than enough servings of Piedmontese wine. As the minutes passed, his anger and conviction grew further and further until they reached the breaking point. In a drunken rage, he tore off his PNF pin and threw it into the fireplace, watching the accursed symbol turn to ashes. He now knew what he must do.\n\nThe next morning, he sent his letter of resignation to the local PNF headquarters. The Italians loved to blame the Germans for their misfortunes, but it was Mussolini's repulsive ideology that got them into this mess in the first place. Pertusio had never been a friend of fascism, but he could no longer pretend to care about it to serve Italy. If he was ever again to serve in office, it would have to be under a government truly of the people, like the democrats of decades past."
 ITA_med.147.a:0 "And thus, fascism claimed another victim."

