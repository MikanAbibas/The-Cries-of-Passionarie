ITA_verona.50.t:0 "Bittersweet Victory"
ITA_verona.50.desc:0 "The Verona conference was one of the most difficult challenges that Ciano had faced during his tenure as Duce. The Quadrumvirate circled him like vultures circling the dead carcass of an animal. Pavolini, Balbo, Muti, and Giani all attempted to pit the PNF against him in an effort to claim the office of Duce for themselves. However, after weeks of political maneuvering and plots, he proved that there was still much life left in him and his rule. The party is now unified behind the rightful Duce, Galeazzo Ciano.\n\nSo why then did it feel like he didn't win at all? The party may be unified behind him, but the clashes with the Quadrumvirate took their toll. While it may not be divided anymore, the PNF has never been weaker. Additionally, Italy herself was in dire straits. The collapse of the Triumvirate has turned uneasy allies into opportunistic rivals, seeking to pick apart Italy's grand empire for their own gain. Ciano may have successfully defeated his political rivals, but the task of effectively governing Italy remained a daunting one.\n\nTo top it all off, the public's faith in fascism has been plummeting for years now. Disillusioned by failures on the world stage and dysfunction within the PNF, even the most ardent supporters of fascism are beginning to have second thoughts. The dissidents even had the gaul to voice their opinions in the streets of Verona during the conference.\n\nCiano had thought that after achieving victory in the Verona conference, he would finally have a moment to relax, but in reality the pressure on him and his government only grew with each passing day..."
ITA_verona.50.a:0 "At least we won."

ITA_verona.51.t:0 "An Ode to Might"
ITA_verona.51.desc:0 ""We did it boys!" The rowdy atmosphere in the restaurant was amplified by a group of high ranking Blackshirts coming from the Conference to blow off steam over a bottle of wine or two. After days of tension, the people of Verona were relieved that things were going back to normal. Even if all signs pointed to an end of Duce Ciano's rule.\n\nAgainst all odds, the opposition inside the PNF organized around the current party secretary, Carlo Scorza, and managed to deliver the killing blow to Ciano's ambitions. And to add insult to injury, a vote of no confidence aimed at Ciano was approved by an overwhelming majority, signing the final act of the Conference and the beginning of a new chapter for the PNF and Italy. Most people hid in their homes for fear of reprisal, but in the streets and the bars of Verona the winners were openly celebrating the beginning of their fortunes.\n\n"Boys, now that we got that dumb fool out of the Party, I can say I'm proud of you." "Yeah, but... The Duce is..." said a lumbering man barely holding his gags. "The Duce? Yeah sure! Cheers for the Duce!" shouted a young man. "No, I mean... Who's gonna be the Duce now?" For the first time, silence fell among the merry band. "Man, you always overthink things!" replied one of the fellows with a laugh. "Yeah, who cares about that right now? When the time comes, we'll think about it!" And with that, the group headed for the door, and left the restaurant with a slurred and unsynchronized "Ave Duce!"\n\nOutside, the deserted streets were covered by a thick cap of fog. The few lit windows were the only signs of life in a city fearing what tomorrow would bring. But over the winding alleys of Verona, the Blackshirts drank and laughed till the wee hours.""
ITA_verona.51.a:0 "The weak should fear the strong."

ITA_verona.52.t:0 "What's a Vote Worth?"
ITA_verona.52.desc:0 "There were a little over 200 delegates at the Verona Conference. Roughly speaking, about 70 were in Ciano's bloc, about 70 were in the anti-reform bloc, and the remaining 60 were largely undecided centrists. It was supposed to be a predictable (if still interesting) affair, with both blocs attempting to court the centrists to gain a majority. A footnote in Italian history, albeit a large footnote. Perhaps it would have a page or so dedicated to it in the history books of the future Empire (or Republic, or even Social Republic depending on the outcome of the vote).\n\nWhat has just occurred was anything but predictable; anything but a footnote.\n\nTaking place behind closed doors, we will never know exactly what went wrong. All we know, all we can know, is that no single bloc gained a majority in the Conference. Verona was seized in a political deadlock, and began to thrash violently as if in death throes. Party brothers in the PNF came to blows, the streets of Verona filled with marchers wearing shirts both brown and red, and all of Italia began to turn on itself.\n\nAlas, ever tragically, crisis breeds opportunity, and the political vultures began to swoop in for their scraps of the chaos. Anti-fascists march with vigor not seen since well before the March on Rome, the different wings of the PNF act as though the others are diametrically opposed, and perhaps most concerning, the political muscles of the Quirinal Palace are beginning to flex with a terrifying strength not seen since before the Age of Enlightenment. In a word, it would seem that Umberto II has seen himself fit to govern the Italian people.\n\nAs blood still flows out of Verona, and as negotiations between the party-comrades continue to break down, it seems clear that fascism will not survive in Italy. The only question is--"
ITA_verona.52.a:0 "--what will replace it?"

