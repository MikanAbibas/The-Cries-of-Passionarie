 ITA_Falcone_Lucifero_hog:0 "Falcone Lucifero"
 ITA_Falcone_Lucifero:0 "Falcone Lucifero"
 ITA_Falcone_Lucifero_hog_desc:0 "--------------\nFalcone Lucifero has seen Italy change in many ways over the years. He was elected municipal councilor of his hometown, Crotone, in 1920, later transferring from the Unitary Socialist Party to the Fascist party. However, after Mussolini seized power, Lucifero would retire to a private career as a lawyer.\n\nIn 1944, Lucifero would be appointed Minister of the Royal House by King Umberto, serving as his primary representative, even when Umberto was abroad. Now, Lucifero has been appointed as Umberto's right-hand man in the process of democratizing Italy. Lucifero has decided to pursue a politically moderate government, acting as the bridge between anti-fascist elements and the King's government." 
 ITA_Carlo_DAmelio_for:0 "Carlo D'Amelio"
 ITA_Carlo_DAmelio:0 "Carlo D'Amelio"
 ITA_Carlo_DAmelio_for_desc:0 "--------------\nBorn in 1902, Count Carlo D'Amelio hails from a prestigious family of Neapolitan jurists. Following in their footsteps, D'Amelio became a lawyer, and served many clients, both big and small. However, his career in the realm of law was not the sole reason why the King chose D'Amelio to form a part of his interim government.\n\nCarlo D'Amelio holds the title of Gentleman and Secret Waiter of the cloak and sword of His Holiness, and has known and worked with both the King and Falcone Lucifero for over two decades. Now D'Amelio represents all of Italy upon the world stage as Italy enters a new era, an era free from fascism."
 ITA_Epicarmo_Corbino_eco:0 "Epicarmo Corbino"
 ITA_Epicarmo_Corbino:0 "Epicarmo Corbino"
 ITA_Epicarmo_Corbino_eco_desc:0 "--------------\nEpicarmo Corbino was born to a humble Sicilian family. Graduating with a diploma in accounting, Corbino would become a professor of commercial policy and customs legislation at the Higher Institute of Economic Sciences in Naples. Unlike his brother, who was close to the fascist regime, Corbino was a staunch liberal, and signed the Manifesto of Anti-fascist Intellectuals in protest of the regime.\n\nIt was because of his staunch belief in social_liberal, and also his expertise in economics, that earned him the attention of Umberto. The King has placed him in charge of Italy's mismanaged economy, struggling after four decades of fascist incompetence, a challenge he is willing to accept."
 ITA_Raffaele_de_Courten_sec:0 "Raffaele de Courten"
 ITA_Raffaele_de_Courten:0 "Raffaele de Courten"
 ITA_Raffaele_de_Courten_sec_desc:0 "--------------\nRaffaele de Courten enrolled in the Naval Academy of Livorno in 1906 and graduated in 1910, de Courten served in the Regia Marina throughout the First World War. After the war he was assigned to the Naval Staff, and was the naval attache to Germany from 1933 to 1936. He was promoted to Rear Admiral in 1938, and continued to serve the Regia Marina as fascism crushed Europe beneath its heel.\n\nDespite his position, de Courten was no fascist, more loyal to his country than any "Duce." That is why the King chose him to oversee the Regia Marina and the rest of the armed forces, tasked with divorcing them from the fascist ideology that has commanded them for so long."

