 ITA_fash_resistance.1.t:0 "Patrol Slaughtered in Mogadiscio"
 ITA_fash_resistance.2.t:0 "Series of Unfortunate Events"
 ITA_fash_resistance.2.desc:0 "The mess of papers strewn over the large mahogany table was a poor contrast to the frescoed vaults and Roman columns adorning the room at the center of Palazzo venezia. Still, the situation was far from optimal, and the four people mulling over the contents of the piles of reports had other concerns.\n\n"This is madness!" Alessandro Pavolini exclaimed, looking at the papers: "How can unrest have grown so much in so little time?"\n\n"This is not madness," interjected Niccolò Giani: "This is Ciano's final legacy. His control over the Empire was an illusion, and now that the truth has been revealed, we can no longer live in blissful ignorance about it."\n\n"Lots of words to say we are in deep shit, Niccolò." Ettore Muti replied, causing a small laugh from the other two, and a frown from Giani: "These bastards saw the Party carve itself apart, saw fascists tear at each other's throat, and connected the dots: we are at our weakest, and they know it."\n\n"You are all partially right, gentlemen," Italo Balbo tried to avoid the discussion turning into the umpteenth quarrel: "I've been in the Middle East for a decade, and the situation was not good. The rest of the Empire is in a similar state: after Verona the terrorists perceive us as weak, and are scaling up their operations."\n\n"Are they already coordinating?" Asked Pavolini.\n\n"At regional level, surely." Balbo answered: "A larger organisation, though? I don't have any element yet pointing in that direction, and I would be cautious with it: even as a mere hypothesis, a coordinated, Empire-wide antifascist movement would be an unprecedented threat, and require measures we are frankly not ready to take now."\n\n"My suggestion, gentlemen," Balbo finished, "Is to increase surveillance with our current resources. Without a solid lead, we risk wasting what little we have: at that point, we'll really be done for."\n\nThough grumbling a bit, all others agreed, and the meeting was over."
 ITA_fash_resistance.2.a:0 "Order must be maintained, or the Empire will crumble."
 ITA_fash_resistance.3.t:0 "Vacation in Tunis"
 ITA_fash_resistance.3.desc:0 "The Captain had never felt so trapped as he walked into the interrogation room. The air was like ice, and the impatient Captain sneered at the rebel lying on the ground, who had endured days of interrogation. The Socialist, belonging to underground trade unions, had been picked up by anti-separatist operations in Tunis of all places. As much as the exercise felt utterly pointless, this mystery demanded an answer. Had that necessity not loomed so large, he might have flung the rebel out, just to get a hot meal.\n\n"Captain, subject 854 has been... unresponsive, to my efforts. The subject hasn't answered any questions and hasn't even made a sound. I can get something out of him, I assure you, with more time." \n\nThe interrogator spoke."
 ITA_fash_resistance.3.a:0 ""Schedule his execution, I must relay this to Rome.""

 ITA_fash_resistance.6.t:0 "Emergency Meeting"
 ITA_fash_resistance.6.desc:0 "The four people around the mahogany table looked grimly at the only report on the table. Though much smaller than the usual mess of papers and folders, its content was way more dreadful than a volume of bad news: it was the confirmation of the four men's worst fears.\n\n"This is it. We have got the proof now." Italo Balbo's voice was serious now, devoid of its usual mirth: "An antifascist movement, spanning the entirety of the Empire, its members actively coordinating in all regions: the implications of this are..."\n\n"
 ITA_fash_resistance.6.a:0 ""Simply enormous.""
 ITA_fash_resistance.7.t:0 "Cella Numero 65m"
 ITA_fash_resistance.7.desc:0 "Abiy was drowning. The sea was dark, and he couldn't see the light: he choked, searching for air, but his lungs filled with more water. He felt that instinctual fear, the gut-wrenching knowledge that he was dying, and despaired. Then, a moment before losing consciousness, it ended: the water ran out, the dark cloth was removed from his face, and he was back on dry land - back in his cell.\n\nThe young man gasped, desperately sucking in as much air as he could, then he looked around. As usual, he was in the small, unadorned cell, his two jailers by his side: one was holding the jug, the other the cloth. Then, the door opened, and another man - one he had never seen in the three days they had tortured him - entered: he was not a large, brutish thug like the other two, but an ordinary-looking officer. The unknown man approached him, but as soon as he was close, Abiy spat in his face.\n\n"This worst you do?" He asked in broken Italian, just before one of the thugs backhanded him.\n\nTo his surprise, the ordinary man was not fazed by his act of bravado. He simply cleaned his face with a handkerchief, then he looked at him, and spoke - in perfect Oromo.\n\n"No, young man, it isn't." He said calmly. "In fact, you are undergoing treatment level two out of seven. Tomorrow, level three will begin, and it will increase until you talk."\n\nAbiy was scared now. Not by the threat of violence, but by the droning, almost bored tone of that man: it was as if he was talking about the weather, as if he was nothing more-\n\n"You are not a hero, young man." The officer said, as if sensing his thoughts. "You never were, and you never will. You are a pawn, first to the ones who recruited you, and now to us. There are eighty-three prisoners in this wing: some have already talked, others will soon, or they may never do."\n\n"Yesterday," he continued, "One of them accidentally cut his own tongue as he had a seizure during an electroshock session, but it is unimportant: in the end, some will talk, and we will get what we want. We will break you, then stitch you back together, then repeat the process until you talk."\n\nHaving said that, the officer turned his back on Abiy, and left the cell. Then, the cloth was back over his face, and the water washed away his tears."
 ITA_fash_resistance.7.a:0 "The Empire will survive. At. Any. Cost."

 ITA_fash_resistance_investigations.t:0 "OVRA REPORT"

 ITA_fash_resistance_investigations.000.t:0 "Right Place, Wrong Time"
 ITA_fash_resistance_investigations.000.desc:0 "Tekle cursed his boredom. The fresh recruit had been saddled with lookout duty. Sitting on a small incline, he felt sure ensuring the sprawling nothingness he could see from his mound of dirt didn't try anything funny wasn't essential. There wasn't even to be found in his own mind. Tekle was certain he should be enthralled with every detail of his comrade's preparation: Their clothes just as scrapped together as the explosive device they fiddled with. He had, after all, yearned for this ambush. They had arrived unopposed. Now, all that mattered was time. So why did it feel so wrong? Tekle shuddered, wondering if time always slowed for those in the field. \n\nThe assignment of a lookout depended on the assumption one would see danger coming, riding in with banners raised in the distance. It did not account for danger already present. With the seeming prompting of the meekest of gestures, of Tekle, gesturing for a friend's attention, death descended. A series of flashes erupted from crevices in the pass, deadends the rebels hadn't the men to spare checking when they arrived. \n\n"No!" Came the cry heard since time immemorial. Bar that, all he could do was stare, the lifeless eyes all he could see. His body begged him to fight, just as the other rebels were doing as the trap was sprung on them. However, a searing numbness had overcome him, forcing his legs to give way. Tekle's vision blurred, leaving all but a dark silhouette. The man above looked down with an inescapable gaze. Within it, however, all Tekle found was mere annoyance. Did his death mean so little? \n\nThis was the humanity he had set out to fight for. The moment he had allowed himself to feel comfortable in human camaraderie, a monster, in the shape of a man, had beaten the truth back into him: that he had always been alone. In the face of those terrible eyes, death didn't look scary anymore. \n\n"
 ITA_fash_resistance_investigations.000.a:0 "Wreckers of order: Ever reviled, accused, never understood."
 ITA_fash_resistance_investigations.300.t:0 "OVRA REPORT 162AOI023"
 ITA_fash_resistance_investigations.300.desc:0 "All objectives accomplished. Intelligence networks reported to the Colonial command that an ambush was to be performed three days before militant terrorists arrived at the location named, a valley 5 kilometers outside Asmara. In order to maintain the illusion of our being unaware, OVRA agents accompanied the trucks intended to be the target of the militants. Additionally, the convoy was ordered to leave 2 hours early, so to provide an opportunity for the truck convoy to divert onto a separate route 0.5 kilometers before the valley, and so OVRA operatives could arrive before the terrorists. \n\nPresumably, the subjects of the operation were unaware of the convoy's diversion and arrived without issue at 14:00. A single explosive device was spotted, being planted and prepared for detonation. Once an adequate headcount was made of the terrorist cell present, the order was given to begin the assault. This action was taken at 14:40, in the interest of securing the makeshift explosive with haste. \n\nAll militants were eliminated, and the explosive was secured, without great issue. 14 bodies were recovered and identified, none having escaped due to their being situated in the valley. The rifles recovered from rebels forces will be sent to the offices of Colonial command, along with the body's so they can be identified. Efforts of sourcing the equipment to their source and militants to their home villages will provide valuable intelligence in further anti-terrorist activities and investigations. Furthermore, spreading awareness that a rebel cell was totally routed could reduce enemy morale. Recommend villages of rebel origin under closer surveillance, as they may possess greater rebel sympathies than is currently known. of the total routing of a rebel. Overall, the operatives who acted with bravery, courage, and haste are to be commended, and the operation itself should be considered a resounding success."
 ITA_fash_resistance_investigations.300.a:0 "The baton is sheathed for now. It has done its job"
 ITA_fash_resistance_investigations.001.t:0 "Racing Against Death"
 ITA_fash_resistance_investigations.001.desc:0 "MEMO ON TERRORISTS NEAR ADDIS ABABA\n\nInformant No. 20515, hereby named "Zema," has brought forth critical intelligence on the activities of the Black Lions Movement. According to him, an affiliated terrorist cell has established a hidden encampment somewhere along the road between Dessie and Addis Ababa to conduct an assassination attempt against a high-ranking officer of the governorate.Their target is thought to be Colonel Enzio Maria Adragna, the son of a minor Sicilian nobleman suspected of "fraternising" with the natives. \n\nDespite his alleged misconduct, the assassination of a high-ranking officer in the East African regime would be a disaster for its stability. Colonel Adragna will travel via convoy to Addis Ababa in two weeks' time. The OVRA has already dispatched multiple agents to search the Dessie-Addis Ababa route, but it is recommended that the colonial authorities launch additional searches for the plotters in a coordinated effort."
 ITA_fash_resistance_investigations.001.a:0 "FURTHER UPDATES FORTHCOMING"
 ITA_fash_resistance_investigations.101.t:0 "OVRA REPORT 105AOI026"
 ITA_fash_resistance_investigations.101.desc:0 "Despite the best efforts of the OVRA, the Black Lions were able to evade all detection and ambush Colonel Adragna's convoy. According to our agents' reports, the entire convoy was destroyed by rebels armed with foreign anti-tank weaponry, killing Colonel Adragna and all of its members. The terrorists were able to escape while leaving scant few traces of their flight. The OVRA and local informants are attempting to track them down, but no clues have appeared.\n\nThis tragedy shall be remembered by Italian patriots forever. A memorial service shall be held for the late Colonel Adragna with full honors. Meanwhile, additional reprisals on subversive elements in the colony have been ordered."
 ITA_fash_resistance_investigations.101.a:0 "THE SITUATION IS CRITICAL. OUTCOME UNCERTAIN."
 ITA_fash_resistance_investigations.201.desc:0 "Following the discovery of the plot against Colonel Adragna, OVRA agents, in concert with local informers, were able to locate and destroy multiple Black Lions weapons caches containing foreign anti-tank equipment. Unfortunately, the main camp remained undetected, and the Colonel's convoy was ambushed by Black Lions insurgents equipped with automatic rifles. According to our agents' reports, Colonel Adragna was slain, but the rest of the convoy was able to repel the attack and capture two Black Lions partisans. The OVRA shall bring them in for interrogation, and expects they will divulge information on the operations of the Black Lions.\n\nThis tragedy shall be remembered by Italian patriots forever. Colonel Adragna's body will be returned to Rome and a funeral service will be held with full honors. Meanwhile, additional reprisals on subversive elements in the colony have been ordered."
 ITA_fash_resistance_investigations.201.a:0 "SEND CONDOLENCES TO COUNT ADRAGNA"
 ITA_fash_resistance_investigations.301.desc:0 "Following the discovery of the plot against Colonel Adragna, OVRA agents, in concert with local informers, were able to locate the hidden Black Lions encampment. After a daring attack at night, the camp was captured, and multiple Black Lions partisans, including their commander, were captured. Colonel Adragna's convoy entered Addis Ababa without incident and the OVRA is already bringing in the captured partisans for interrogation. The OVRA expects the commander to divulge critical information that will enable the neutralization of other Black Lions cells in the area."
 ITA_fash_resistance_investigations.301.a:0 "EAST AFRICA REMAINS UNSTABLE. MAINTAIN VIGILENCE."
 ITA_fash_resistance_investigations.002.t:0 "For a Fistful of Liras"
 ITA_fash_resistance_investigations.003.t:0 "They Call Us Trinity"
 ITA_fash_resistance_investigations.004.t:0 "The Good, The Bad, The Fascist"
 ITA_fash_resistance_investigations.004.desc:0 "Ibrahim slid dejectedly off of the front seat of the truck, his boots striking the sand and kicking up dust that meandered away lazily in the scalding breeze of a desert in Somalia. Biting his lip, he slammed the door of the truck. He kicked the vehicle once, then twice, cursing the decrepit old thing for getting him and his comrades stranded in the desert. "I take it it won't start." Said Yusuf, his baritone voice silencing the sound of Ibrahim spitting hate at nothing. Ibrahim turned around, ready to snap back with some manner of biting snip, but opted to instead slide to the ground, planting his back against the wheel of the truck.\n\n"I'm out of ideas, Yusuf." Sighed Ibrahim, glancing at the rest of their separatist group, five Somali men clad in dusty uniforms and armed with guns older than they were standing impatiently a few dozen feet away. The frustrated urgency of their tapping feet and hushed conversation did little to mask the anxiety falling over the entire group. If they could see miles beyond them, they would see the sunbaked silhouettes of a graveyard on a hill where the dead of a long-abandoned village rested, alongside a cache of stolen Italian guns in one grave, stashed there by another separatist cell. Their goal.\n\n"We never had any in the first place, did we?" Replied Yusuf. "The truck's gone, we've got no water, and the OVRA is on our tail. There's only one thing to do."\n\nIbrahim nodded, pushing himself back to his feet. He approached the rest of the guerillas and relayed the plan. "I don't see any other options. We're going on foot from here, and I have grimmer news. Perhaps you already know this, but with the OVRA on our tail, we either all make it to the stash, or none of us do. We all know what will happen if any of us fail to make it there but live to be captured - the stash is gone, and the rest of the cell is dead." He was met with somber nods of agreement. Wordlessly, they began their trek into the desert."
 ITA_fash_resistance_investigations.004.a:0 "The chase continues."
 ITA_fash_resistance_investigations.104.t:0 "OVRA REPORT 121AOI221"
 ITA_fash_resistance_investigations.104.desc:0 "Our mission was a failure. 7 terrorists associated with a Somali separatist organization that executed the separate robbery of over 500 rifles from a garrison several days ago were seen exiting the city of Burao in a civilian truck at roughly 0900 hours yesterday, making their way north through the desert. It was difficult to procure manpower and maneuver our men quickly enough due to a false lead, so only two OVRA squads could pursue, over 5 hours later. Our men swept the desert due to not having much to go off of, and stumbled upon the truck, which was abandoned and derelict. Our men, without a lead, opted to go to the nearest desert village in hopes that the Somalis had headed there in search of water.\n\nUnfortunately, they had, and were able to outmaneuver our men, injuring 5 of them and killing 2. Well supplied by the villagers, they escaped while we recouped our losses. Our agents could not locate the partisans, despite sweeping the desert once again and finding nothing. No more than 8 days later, the Burao garrison was attacked by several dozen Somali guerillas, armed with what can only be assumed to be the stolen guns, presumably successfuly retrieved by the 7 terrorists lost in the desert.\n\nThis suspicion was confirmed after the guerillas were repelled after doing significant damage to the garrison and witnesses confirmed that the commanding officer of the garrison had been killed by the ringleader of the 7 separatists, one Ibrahim Aden. A bounty has been placed on Aden and his crew, but they have disappeared fairly seamlessly. The officer in charge of the investigation has been demoted."
 ITA_fash_resistance_investigations.104.a:0 ""Demoted?! I want him fired!""
 ITA_fash_resistance_investigations.204.t:0 "OVRA REPORT 121AOI221"
 ITA_fash_resistance_investigations.204.desc:0 "Our mission failed, but bore some fruit. 7 terrorists associated with a Somali separatist organization that executed the separate robbery of over 500 rifles from a garrison several days ago were seen exiting the city of Burao in a civilian truck at roughly 0900 hours yesterday, making their way north through the desert. Due to some issues with procuring proper vehicles, our squads could not make it out of the city to pursue until nearly 4 hours later, and had difficulty tracing the suspects. \n\nDue to this, the OVRA assigned to the mission opted to sweep the desert instead. They did not have any luck until early the next morning, when one officer stumbled across the dehydrated corpse of the ringleader, Ibrahim Aden. Nearby they found the other 6 terrorists, who were all dead of either dehydration or heatstroke save for one, Yusuf Mohamed. Mohamed was barely responsive and near death, but was quickly taken into custody and managed to survive until his arrival in a hospital in Burao. Interrogation proved very futile. The separatists had been looking to retrieve the rifles from where another cell had stashed them, but Mohamed could not recall the location of the cache.\n\nHowever, before slipping unconscious and later dying in his sleep at approximately 13:21, Mohamed gave up some information that will be very useful in cracking down on resistance. Mohamed was posthumously tried and found guilty."
 ITA_fash_resistance_investigations.204.a:0 ""Well, we'll take it.""
 ITA_fash_resistance_investigations.304.t:0 "OVRA REPORT 121AOI221"
 ITA_fash_resistance_investigations.304.desc:0 "Our mission was successful. 7 terrorists associated with a Somali separatist organization that executed the separate robbery of over 500 rifles from a garrison several days ago were seen exiting the city of Burao in a civilian truck at roughly 0900 hours yesterday, making their way north through the desert. Two hours later, OVRA squads followed, tracking them for over four hours until reaching the civilian truck abandoned in the sands where, upon inspection, the truck had broken down. \n\nPresumably the suspects had abandoned the truck, and as such the desert was searched for several more hours until nightfall, when they found 5 of 7 still trying to make their way through the sands. The remaining two were later found near-death from heatstroke elsewhere in the desert. One perished in custody, and another was able to slip himself poison. The remaining 5 were offered water in exchange for information, and informed our agents that they were attempting to retrieve the rifles from the aforementioned robbery. Said rifles were stored in a gravesite in an abandoned cemetery deeper in the desert. The rifles had been planted there by a separate cell after the initial robbery.\n\nThe rifles were retrieved without issue and even more information was gathered from the captives. This data will be very useful in quashing resistance in the region. The ringleader, one Ibrahim Aden, was subsequently tried and executed and the officer who led the investigation will be receiving a commendation."
 ITA_fash_resistance_investigations.304.a:0 ""Excellent work.""
 ITA_fash_resistance_investigations.005.t:0 "The Four of the Apocalypse"
 ITA_fash_resistance_investigations.006.t:0 "Red Sun, Black Oil"
 ITA_fash_resistance_investigations.007.t:0 "And God Said to Cain"
 ITA_fash_resistance_investigations.008.t:0 "The Price of Revenge"
 ITA_fash_resistance_investigations.008.desc:0 "Alessandro glanced behind him for the umpteenth time, peering from behind his dark glasses at the teeming masses of Italians filling the streets of Florence. It felt strange to move with the crowd rather than through it, as just another man rather than an officer of the Ministry of the Interior. Once upon a time he'd be clearing a path through the mobs of everyday citizens with a bodyguard, being such an important man as he thought he was. Not important enough for those sycophantic brutes in the government not to kill his son on some rubbish charge of socialist treason. The bitter memory of his son, his boy, staring down a firing squad threatened to draw tears from his eyes, but he shook it away with a bitten lip and a refocused gaze. They would pay.\n\nHe ducked quickly into an alleyway, splashing muddy water onto his civilian clothes as he planted a foot in a puddle. He glanced behind him once again, but the crowds continued to shift undisturbed. Relieved, but still in a rush, Alessandro continued to slip down the alley into which he had disappeared. He walked for about 20 minutes, following the careful yet dizzyingly specific instructions he had been given, until he reached a squat, crumbling old building. He half expected the door to fall off his hinges when he rapped his knuckles against it. It creaked open, but only just enough for the barrel of a rifle to peek out. \n\n"Libertas." He said. The door opened all the way and he was greeted by a resistance member with a lowered rifle and a quizzical expression. \n\n"You're our man?" Replied the rebel, cautiously. \n\n"I'm your man. Where's the leader of your cell? I have some information that should interest him.""
 ITA_fash_resistance_investigations.008.a:0 ""Right this way.""
 ITA_fash_resistance_investigations.308.t:0 "OVRA REPORT 155ITA533"
 ITA_fash_resistance_investigations.308.desc:0 "Our mission was successful. Recently our agents had been notified of the possibility that a high ranking officer in the Ministry of the Interior, Alessandro Bianchi, was in league with the resistance. As such, we assigned several men to shadow him, and last Sunday the suspect was seen slipping into an alleyway in Florence, not emerging for some time. Our agents were able to get a few photos of Bianchi making his way out of the backstreets, although this hardly would prove to be sufficient evidence.\n\nAs such, photos were doctored to show Bianchi meeting with known resistance members. This was enough to convince local police to arrest him and hand him over to our custody. After some extensive inquiry, Bianchi confessed to working with the resistance and supplied us with the location of his contacts, who he had been feeding state secrets. Agents were quickly dispatched and sure enough, found a cell of rebels in the underbelly of Florence who were promptly arrested.\n\nThe insurgents will remain in custody to be interrogated further, but Bianchi is no longer useful to us. We are now issuing a formal request to terminate Bianchi on the charge of treason."
 ITA_fash_resistance_investigations.308.a:0 ""Permission granted.""
 ITA_fash_resistance_investigations.009.t:0 "Once Upon a Time in Tripolitania"
 ITA_fash_resistance_investigations.010.t:0 "Oil and Lead"

 ITA_fash_resistance_investigations.400.t:0 "From Tunis With Hate"
 ITA_fash_resistance_investigations.400.desc:0 "OVRA REPORT 032TU11 \nCLASSIFICATION STATUS: MINISTERIAL\n\nYesterday, at hours 01:47, special forces detachment led by operator Sergeant (DATA EXPUNGED) entered the location of the suspected leader of the Tunisian antifascist movement, as well as of the socialist unionist movement. The house, located in (DATA EXPUNGED) , resulted owned by a dummy who, after enhanced questioning, revealed that the real user answers to the name of Ahmed Tlili, known agitator and underground unionist: while his identity was already known to this office, the fact that he was more than a mid-level antifascist was not.\n\nWithin the house, which was found in a state of disorder - indicating a hurried escape - were found identity documents with diverse names but similar photographs, each compatible with Tlili's visage. The fireplace revealed half-burnt paper shreds: while most of the data was lost, reconstruction work by officers (DATA EXPUNGED)  allowed them to piece together partial information about potential resistance hideouts and members spread across Tunisia.\n\nAs of now, Ahmed Tlili has been declared maximum priority target, to be persecuted with any possible means. His capture or elimination is henceforth deemed priority mission for all OVRA agents in Tunisia.\n\nGLORIA AL DUCE. GLORIA ALL'IMPERO."
 ITA_fash_resistance_investigations.400.a:0 "Idealism will not save you from death."

 ITA_fash_resistance_investigations.401.t:0 "The Libyan Winds Still Blow..."
 ITA_fash_resistance_investigations.401.desc:0 "OVRA REPORT 083LIB44\nCLASSIFICATION STATUS: MINISTERIAL\n\nYesterday, at hours 05:42, special forces detachment led by operator Captain (DATA EXPUNGED) entered the location of the suspected leader of the Libyan antifascist movement, as well as of the independentist forces. The nomad camp, located near the porous border with Subsaharan Africa, was found inhabited by only a few raiders left to cover the retreat of their leader, whose horse traces were found leaving the Eastern tents: pursuit was prevented by adverse weather conditions.\n\nWithin the presumed command tent, operator Corporal (DATA EXPUNGED) found a hastily-dug hold in the sand, containing the remains of a fire (obiter dictum: recommend the operator for promotion to superior operating rank) in which lied half-burnt scraps of paper. Reconstruction work by officers (DATA EXPUNGED) allowed them to locate several raider camps and anti-Italian safehouses in Tripoli, Bengasi and Sirte.\n\nHowever, the most important piece of information was a diary, buried in the same hole but intact (obiter dictum: suspect affective value to the resistance leader). Translation work by native operator (DATA EXPUNGED), coupled with photos contained between its pages, allowed him to identify the leader as Muammar Gaddafi, leader of the Libyan socialist-independentist underground movement (obiter dictum: recommend conferring citizenship and transferring operator for fear of reprisals): it appears he took the leadership of the Libyan resistance since the death of Idris.\n\nAs of now, Muammar Gaddafi has been declared maximum priority target, to be persecuted with any possible means. His capture or elimination is henceforth deemed priority mission for all OVRA agents in Libya and Egypt.\n\nGLORIA AL DUCE. GLORIA ALL'IMPERO."
 ITA_fash_resistance_investigations.401.a:0 "He will soon join the rest of his family..."
 
 ITA_fash_resistance_investigations.402.t:0 "Il Cavaliere alla Macchia"
 ITA_fash_resistance_investigations.402.desc:0 "OVRA REPORT 193ITA51\nCLASSIFICATION STATUS: MINISTERIAL\n\nYesterday, at hours 12:31, special forces detachment led by operator Captain (DATA EXPUNGED) entered the personal quarters of Lieutenant Pompeo Colajanni of the Lancieri di Pinerolo cavalry regiment. Of known antifascist sympathies, the officer was nonetheless spared from purge due to his personal friendship with general (DATA EXPUNGED): intercepted correspondence, however, allowed to discover that he was sending traitorous missives under the guise of SIM secret documents (obiter dictum: SIM codes were found to be correct. Investigate SIM low-level command structure for potential traitors).\n\nColajanni's quarters - a room in the officer barrack within the larger Pinerolo military complex - was revealed to be in a state of disarray. Within the fireplace were found half-burned scraps of paper: reconstruction work by officers (DATA EXPUNGED) allowed to discover several socialist and democratic sympathisers within the armed forces, who were apparently working together with Colajanni to organise an armed insurrection. A single manuscript paper was found almost intact, containing information compatible with highly-coordinated resistance activities (obiter dictum: investigate handwriting, maximum priority, suspect CLA leader).\n\nAs of now, Pompeo Colajanni has been declared maximum priority target, to be persecuted with any possible means. His capture or elimination is henceforth deemed priority mission for all OVRA agents in Italy.\n\nGLORIA AL DUCE. GLORIA ALL'IMPERO."
 ITA_fash_resistance_investigations.402.a:0 "This man is no knight, but a traitor."

 ITA_fash_resistance_investigations.403.t:0 "There Can be Only One Emperor"
 ITA_fash_resistance_investigations.403.desc:0"OVRA REPORT 103AOI94\nCLASSIFICATION STATUS: MINISTERIAL\n\nYesterday, at hours 12:31, Polizia Coloniale detachment led by undercover operator Captain (DATA EXPUNGED) entered a building in Addis Abeba suspected to be housing a clandestine print responsible for the spreading anti-Italian propaganda across the city and surrounding areas. The building was found empty and devoid of any important information, save for a cyclostyle of extremely recent production - the waxed paper had no trace of ink, meaning it has not yet been used.\n\nExperimental use of the cyclostyle lead to an extremely important discovery (obiter dictum: repeal sanction, and instead promote policeman (DATA EXPUNGED) for having mistakenly activated the cyclostyle by falling over its lever), as the resulting poster contained a recent, unmodified photo of Haile Selassie, fallen Emperor of Ethiopia and leader of the restorationist movement. Translation of the poster by native operator (DATA EXPUNGED) allowed to learn that Selassie has returned from his exile and is now leading the resistance from an unknown location within Italian East Africa, hoping to return to the throne of an independent Ethiopia (obiter dictum: advise granting citizenship and transferring the operator for fear of reprisal).\n\nThe presence of their self-proclaimed leader is sure to spur Ethiopian nationalists to be increasingly hostile and active. As of now, Haile Selassie has been declared maximum priority target, to be persecuted with any possible means. His capture or elimination is henceforth deemed priority mission for all OVRA agents in Italian East Africa.\n\nGLORIA AL DUCE. GLORIA ALL'IMPERO."
 ITA_fash_resistance_investigations.403.a:0 "His crown is forfeit, and soon his life will too."

 ITA_fash_resistance_investigations.404.t:0 "La Serpe in Seno"
 ITA_fash_resistance_investigations.404.desc:0 "OVRA REPORT 340ITA82\nCLASSIFICATION STATUS: DUCE'S EYES ONLY\nPRIORITY READING:ABSOLUTE\n\nAfter weeks of examination and cross-referencing, intern graphologist (DATA EXPUNGED) has achieved a fundamental breakthrough in identifying the hand behind the message found in Pompeo Colajanni's quarters. After comparing the message to an autograph contained in a book owned by the graphologist himself due to his interests in encyclopaedias, he was able to identify it as belonging to Ugo La Malfa, renown academic and lynchpin of the Industrial Research Institute of Milan.\n\nWIth his handwriting detected in messages, memos and directives found in hideouts scattered across the Empire, the OVRA command has come to a general consensus. Ugo La Malfa is henceforth to be considered not only leader of the secretive Italian resistance organisation "Partito d'Azione", but also overall coordinator of the Comitato di Liberazione Antifascista itself.\n\nOVRA agents sent to his home in Milan to arrest him have found him gone, and his house devoid of any useful documents. Despite this, operator (DATA EXPUNGED) was able to find the mole within the SIM by leaking false orders to several suspected agents: cross-referencing unit movements allowed us to arrest and execute Lieutenant (DATA EXPUNGED) for treason (obiter dictum: commend the operator and grant him a promotion).\n\nAs of now, Ugo La Malfa is to be considered a maximum priority target, to be eliminated by any possible means. No capture. Advising to grant amnesty and money rewards to any who can grant information about his location: all OVRA agents in Italy should recalibrate priorities to find and destroy the target."
 ITA_fash_resistance_investigations.404.a:0 "Finally, we know who you are..."

 ITA_fash_resistance_investigations.405.t:0 "The Sun of Socialism Fades"

 ITA_fash_resistance_investigations.406.t:0 "The Emperor and the Viceroy"
 ITA_fash_resistance_investigations.406.desc:0 "Haile Selassie sat, alone, in his cell, reflecting upon his life: he remembered taking the throne from his father, and leading his country until those... those demons had arrived. Since then, he had not stopped fighting, not once in those thirty years: even when all had been lost, he had not surrendered until they had killed almost everyone of his last guards.\n\nThe creak of the heavy metal door alerted him to the presence of a visitor, and when he recognised the uniformed man, his expression turned to a scowl.\n\n"Did you come here to mock your defeated enemy, Viceroy?" He spoke in accented Italian, spitting the title as if it were an insult.\n\n"No, I did not." Amadeo di Savoia-Aosta said curtly.\n\n"Did you come to set me free, then?" The fallen Emperor asked, his tone mocking.\n\n"No, I did not." The Savoy prince repeated.\n\n"Then why did you come?" Selassie asked again, his tone betraying his anger: "Tomorrow morning, I will be dead anyway! Why are you here?"\n\n"Duty commanded me to fight you," the Viceroy said, his tone hard: "And so I did, for my King and my country. Honor, however, forbids me from seeing royal blood hanged like a common criminal: I will not allow it."\n\nHaving said that, Amadeo walked until he was facing the elderly Ethiopian, and placed something in his hand - a small vial.\n\n"Take this," he added, "And your death will be painless. I will also make sure your body is given a proper burial."\n\nHaile Selassie looked at the small object with surprise, then he closed it in his hands, as if it was something precious.\n\n"Thank you, Prince." He spoke, his tone warmer: "Despite all, you showed you are not like those monsters in black shirts: had fate been different, perhaps I would have enjoyed your company as an ambassador. Now leave me, please: I wish to say my prayers."\n\nAmadeo di Savoia-Aosta nodded curtly, and left the cell. As he made his way out of the prison, he couldn't help thinking that now, the idea of a unified and independent Ethiopia was truly dead."
 ITA_fash_resistance_investigations.406.a:0 "So ends the line of Solomon."

 ITA_fash_resistance_investigations.407.t:0 "The Last Knight"

 ITA_fash_resistance_investigations.408.t:0 "To Kill an Idea"
 ITA_fash_resistance_investigations.408.desc:0 "Gunshots rang across the dunes, the pitched battle reaching its climax. The Libyans had fought well, but - just as it had happened to their late King - they could not resist the overwhelming technological advantage of their enemies: air reconnaissance had revealed their every move, while armored cars had cut off their escape routes and annihilated the raiding parties; finally, a column of trucks had joined the fray, and the encirclement had turned into a slaughter.\n\nMuammar Gaddafi was there, for how could he abandon his men in the hour of their martyrdom? They had followed him from Sirte, all the way across the African deserts, and back to his hometown: he would not abandon them, even if it cost him his life. Also, what use would he be now? The war was lost, and one more exile would not have changed the situation: better to die while it still held meaning.\n\nHe fired from behind the carcass of his horse - a worthy beast, better than most Italians out there - but they were blind shots, and hit nothing but the sand. He checked his pistol, and cursed: three bullets left in the cylinder, and none in his pocket. From behind the dead horse, he saw the Italians advancing: they were close now, too close, but also close enough.\n\nHe shot again, and again. One man screamed, another simply fell to the ground: not enough, but at least, now he could die without shame. As the first Italian made to jump across the horse, he pointed the gun at his own temple.\n\n"Death to Italy! Glory to a free Libya!" He screamed.\n\nAnd then he pulled the trigger."
 ITA_fash_resistance_investigations.408.a:0 "There is no glory in something that does not exist."

 ITA_fash_resistance_investigations.409.t:0 "Strangling the Snake in the Cradle"
 ITA_fash_resistance_investigations.409.desc:0 "The small house deep into the countryside of Bologna was empty and dark, save for a single candle lit on an unadorned table, and a man sitting in front of it. Ugo La Malfa looked at the small, flickering flame: it was so tiny, so weak, that it barely illuminated the table, and the smallest air current could have extinguished it.\n\nFor weeks now, he had been on the run. Refuge after refuge had been lost, men had died by the dozens to keep him hidden, to keep him safe, but it had all been useless: his life's work, the Antifascist Liberation Committee, was falling at the seams, hammered into submission by the relentless hammer of the OVRA.\n\nAs he thought about it, anger flared in La Malfa's veins. Had the fascists known the strength of character hiding beneath his mild, academic manners, had they known of the burning hate he held for them, they would have killed him decades before - but now, it was all useless, for they had won.\n\nThe writer sighed, and the flame trembled. Despite it all, he had never once used violence: he believed in the strength of words and the clash of ideals, not of weapons, but this world had proven too cruel for men like him - the fascist wolves had torn Italy apart, feasting upon its rotting carcass, and it would never be the same again.\n\nTears formed in his eyes as he unwrapped the small envelope he was holding in his lap, and held the gun in his hand. Despite how much he hated them, he would not harm his enemies: instead, he would use that violence upon the only one responsible for this failure, upon the one who had wasted the one, last chance at a free Italy.\n\nCrying for what he had done, and for what he had failed to do, Ugo La Malfa loaded the gun, and pointed it to his head. As he pulled the trigger, the flame flickered for its last time, and died."
 ITA_fash_resistance_investigations.409.a:0 "Pathetic."

