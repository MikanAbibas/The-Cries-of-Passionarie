 #######EVENTS
 SPR.1.t:0 "To The Capital"
 SPR.1.d:0 "In the sweltering heat of Valencia’s outskirts, Spanish Republican soldiers gathered, their boots kicking up dust as they prepared for the long march to Madrid. Amid the clamor of rifles being checked and officers barking orders, two privates, Miguel and Antonio, leaned against a crumbling stone wall, sharing a cigarette. Miguel, barely nineteen, spoke with a mix of fear and defiance about the mission to seize the capital from the iron grip of the Iberian government. “They’ve got tanks, Antonio, but we’ve got heart—Madrid’s ours by right,” he said, his voice trembling yet resolute. Antonio, older and wearier, exhaled smoke and nodded, his eyes scanning the horizon. “Heart’s good, kid, but it’s the miles and the bullets that’ll test us. We march at dawn, so pray we’re enough.” \n\nThe sun dipped low, casting long shadows over the camp as the two men fell silent, watching their comrades—some writing letters, others cleaning weapons. Antonio clapped Miguel’s shoulder, a wordless gesture of solidarity, as the weight of the coming battle settled over them. They knew the road to Madrid would be brutal, but the dream of a free Spain burned brighter than their doubts."
 SPR.1.a:0 "Freedom Is At Hand"

 SPR.2.t:0 "To The Barricades"
 SPR.2.d:0 "In the dusty streets of a small town on Valencia’s outskirts, the air buzzed with urgency as civilians—shopkeepers, farmers, and schoolteachers—worked shoulder to shoulder to erect barricades against a looming attack. Maria, a baker with flour still dusted on her apron, hauled sacks of sand alongside her neighbor, young Tomás, who dragged old furniture from abandoned homes. “If they come, we’ll make them pay for every street,” Maria said, her voice fierce despite the ache in her arms. Tomás, barely sixteen, nodded, his hands blistered but steady, driven by stories of the enemy’s advance. The townsfolk moved as one, piling crates and overturned carts, their fear tempered by a stubborn resolve to protect their home. \n\nAs dusk fell, the barricades took shape, jagged silhouettes against the fading light. Children darted between adults, carrying water or messages, while an old man strummed a guitar, humming a defiant tune. Maria paused to wipe sweat from her brow, glancing at Tomás, who stood atop a barricade, scanning the horizon. “We’re ready,” he said softly, more to himself than her, and she smiled grimly, knowing readiness was all they had."
 SPR.2.a:0 "They Will Not Pass..."

 SPR.3.t:0 "The Article"
 SPR.3.d:0 "His fingers hovered, itching to type, but memories of colleagues vanishing after bold editorials froze him. Javier glanced at a faded photo of his father, a journalist silenced decades ago, and felt the weight of inherited defiance. The Falange’s propaganda and the CNT’s street brawls flashed in his mind, both strangling the Spain he loved. He lit another cigarette, the ember glowing like his resolve, and began to type—slowly, deliberately—each word a step toward truth or ruin."
 SPR.3.a:0 "For Spain"

