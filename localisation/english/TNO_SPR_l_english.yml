 SPR.10.t:0 "Desperate Times"
 SPR.10.d:0 "These nights were always the worst ones. The type of summer nights that weren't just hot, but wet as well. The general stepped outside of the scorching planning tent, where his comrades continued to plan out new offensives, new tactics and new ways to win the war. The warm breeze mingled with the sweat running down his face, as he took a handkerchief to his brow. The makeshift camp was on the pavilion of an old manorial house, high in the mountains. Overlooking the valley below it, the balcony would have provided a once-in-a-lifetime view, if it had been during the daytime.\n\n"Hot for you as well?" Huddled over the edge, another figure was still, his angled profile and general cap only being faintly illuminated by the dim amber of his cigarette. "Yeah, I don't understand how the young ones stand it either. Maybe they just have warmer blood than us reptiles."\n\n"This war's gone sour, you know. I'd have thought that the entirety of Iberia would have risen up against the Fascists, although I never expected it to be bloodless. But we've stalled. We can't keep this up, and if we lose..."\n\n"Then we get hung, like the traitors we are. Just like the last leaders of the Republic. But, we aren't in their shoes yet. This 'provisional government' of ours is driving us there, though. All the umming, all the urring. All the politics..." the man on the balcony spat, venom driving his last word.\n\nThe general said nothing, only moving towards the balcony himself and hunching over it. There was nothing but the dark, and the faint lights of the village below them to guide his visage. The man offered a lighter, but he declined with a wave.\n\n"If we allow ourselves to be run like a military dictatorship, we'll have put ourselves on track to becoming one. But...maybe you're right about some things...""
 SPR.10.a:0 "Maybe it's time to make the hard decisions."

 #Leader descs
 TORCUATO_FERNANDEZ_MIRANDA_SPR_DESC:0 "At first glance, the leadership of a former member of the Francoist regime appears contrary to the promises by the Republic to restore Spanish Republicanism and break with the history of the Nationalists. To a more informed observer, few seem to be a better choice for the role than Torcuato Fernández-Miranda himself.\n\nOne of the most vocal reformists within Iberia, he always stood alongside his peers. Though it seemed like they were shouting into a void, the reformists kept demanding a democratic solution as the peninsula collapsed towards civil war. Ignored by the government, their warnings became reality as regional movements overran local garrisons and the state appeared to be steps away from collapse. Seeing the state as a sinking ship, the Spanish reformists would declare the Third Spanish Republic, rallying around democracy and the Republican dream.\n\nBeing chosen to lead the movement thanks to his relative neutrality and superficial apoliticism, provisionally occupying both the role of President of the Republic and Council of Ministers, unity within the various political movements of the resurrected Republic is the foremost priority. In this pursuit, Fernández-Miranda avoids voicing any unnecessary personal opinions on politics and policies of the state, serving as a non-partisan figure in the government and allowing his diverse ministers to act with a large degree of independence. While this maintains his sought-after unity, it has resulted in a growing sense of frustration with the relative “passive” demeanor of the new leader, as the line between a neutral and an indecisive leader is a thin one."


