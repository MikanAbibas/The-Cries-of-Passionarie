    ## Fellas
    ITA_GCF_Fella_Pavolini_Name_text: "§GPavolini§!"
    ITA_GCF_Fella_Pavolini_Name_tt: "§YAlessandro Pavolini§!\n§g--------§!\n§LIf some men who are destined since birth to follow in the footsteps of the great men of history, then Alessandro Pavolini was fated to be like Octavian August, he who broke a rotten system and replaced it with a new order, "his" order. Born into a noble, acculturated family, the young Pavolini immediately displayed a keen mind in journalism and politics, leading to an obvious choice in his career: he joined the Fascist movement even before it was an actual party, and from then on, he made it his point to climb the hierarchy to the top.\n\nA personal friend of Galeazzo Ciano ever since the war in Ethiopia, he was appointed Secretary of the Fascist Party when the latter became Duce. Ciano's weak lead, and the ailing state of the Empire, drove a wedge in the friendship, with Pavolini accusing him of sentencing the Empire to a slow, agonizing death: despite this, however, he remained Secretary, proving once again that his political acumen was too much to defeat with a well-aimed purge.§!"
    ITA_GCF_Fella_Pavolini_Power_text: "[?ITA_GCF_QuadrumvirPow^0|Y1]"
    ITA_GCF_Fella_Pavolini_Power_tt: "§YAlessandro Pavolini§!\n§g--------§!\n§LIf some men who are destined since birth to follow in the footsteps of the great men of history, then Alessandro Pavolini was fated to be like Octavian August, he who broke a rotten system and replaced it with a new order, "his" order. Born into a noble, acculturated family, the young Pavolini immediately displayed a keen mind in journalism and politics, leading to an obvious choice in his career: he joined the Fascist movement even before it was an actual party, and from then on, he made it his point to climb the hierarchy to the top.\n\nA personal friend of Galeazzo Ciano ever since the war in Ethiopia, he was appointed Secretary of the Fascist Party when the latter became Duce. Ciano's weak lead, and the ailing state of the Empire, drove a wedge in the friendship, with Pavolini accusing him of sentencing the Empire to a slow, agonizing death: despite this, however, he remained Secretary, proving once again that his political acumen was too much to defeat with a well-aimed purge.§!"

    ITA_GCF_Fella_Balbo_Name_text: "§WBalbo§!"
    ITA_GCF_Fella_Balbo_Name_tt: "§YItalo Balbo§!\n§g--------§!\n§LMany in the government have compared the fate of Italo Balbo to that of Marc Anthony. A prominent officer in the young Regia Aeronautica, Balbo earned his honours through service and cunning: governor of Libya before the World War, he crushed the local resistance and set the stage for its Italianization, an effort crowned by success almost twenty years later. During the war, he proved his tactical acumen by creating the first Italian paratroopers and using Libya as a giant airstrip, which would prove instrumental in defeating the Franco-British troops in the Dark Continent.\n\nBalbo's fortunes took a sudden downturn after Mussolini's death: promoted - or rather, exiled - to Egypt by the jealous Galeazzo Ciano, he coordinated the Empire's effort to keep the Middle East under Italian control. The years spent in the land of the Pharaohs, however, weren't wasted: as his skin turned auburn under the scorching sun, Balbo weaved a web of contacts among the local elites and the Italian garrisons. Overseeing the defense of the colonies against countless enemies from within and without, the grizzled officer understood that Ciano's rule would spell the end for the Empire, and swore that he would not let it come to pass.§!"
    ITA_GCF_Fella_Balbo_Power_text: "[?ITA_GCF_QuadrumvirPow^1|Y1]"
    ITA_GCF_Fella_Balbo_Power_tt: "§YItalo Balbo§!\n§g--------§!\n§LMany in the government have compared the fate of Italo Balbo to that of Marc Anthony. A prominent officer in the young Regia Aeronautica, Balbo earned his honours through service and cunning: governor of Libya before the World War, he crushed the local resistance and set the stage for its Italianization, an effort crowned by success almost twenty years later. During the war, he proved his tactical acumen by creating the first Italian paratroopers and using Libya as a giant airstrip, which would prove instrumental in defeating the Franco-British troops in the Dark Continent.\n\nBalbo's fortunes took a sudden downturn after Mussolini's death: promoted - or rather, exiled - to Egypt by the jealous Galeazzo Ciano, he coordinated the Empire's effort to keep the Middle East under Italian control. The years spent in the land of the Pharaohs, however, weren't wasted: as his skin turned auburn under the scorching sun, Balbo weaved a web of contacts among the local elites and the Italian garrisons. Overseeing the defense of the colonies against countless enemies from within and without, the grizzled officer understood that Ciano's rule would spell the end for the Empire, and swore that he would not let it come to pass.§!"

    ITA_GCF_Fella_Muti_Name_text: "§RMuti§!"
    ITA_GCF_Fella_Muti_Name_tt: "§YEttore Muti§!\n§g--------§!\n§LBefore his unexpected rise to power, the tale of Ettore Muti mirrored that of the unfortunate Aemilius Lepidus. A man of strength and ideals, and a convinced Futurist, Muti had escaped home at the age of sixteen to join Italy's effort in the First World War, even falsifying his identity to avoid being sent back home. There, he earned medal after medal with acts of heroism and cunning, which won him the loyalty of his comrades and the attention of Gabriele D'Annunzio: the warrior-poet would then shape the young boy into a devoted ally just as Caesar did with his trusted lieutenant.\n\nMuti was among the first Legionaries as D'Annunzio stormed Fiume, earning the Vate's undying praise, and he was present at the proclamation of Sansepolcro, where the first doctrine of Fascism was forged, but after that, his flame started to dim. Years of compromises and corruption within the party left the young idealist alone and without purpose as he saw his dream crushed by the weight of reality, and his friends and comrades removed one by one by boot-lickers and sycophants: all that was left for him was his career in the aviation and his Harley-Davidson, his one true love.§!"
    ITA_GCF_Fella_Muti_Power_text: "[?ITA_GCF_QuadrumvirPow^2|Y1]"
    ITA_GCF_Fella_Muti_Power_tt: "§YEttore Muti§!\n§g--------§!\n§LBefore his unexpected rise to power, the tale of Ettore Muti mirrored that of the unfortunate Aemilius Lepidus. A man of strength and ideals, and a convinced Futurist, Muti had escaped home at the age of sixteen to join Italy's effort in the First World War, even falsifying his identity to avoid being sent back home. There, he earned medal after medal with acts of heroism and cunning, which won him the loyalty of his comrades and the attention of Gabriele D'Annunzio: the warrior-poet would then shape the young boy into a devoted ally just as Caesar did with his trusted lieutenant.\n\nMuti was among the first Legionaries as D'Annunzio stormed Fiume, earning the Vate's undying praise, and he was present at the proclamation of Sansepolcro, where the first doctrine of Fascism was forged, but after that, his flame started to dim. Years of compromises and corruption within the party left the young idealist alone and without purpose as he saw his dream crushed by the weight of reality, and his friends and comrades removed one by one by boot-lickers and sycophants: all that was left for him was his career in the aviation and his Harley-Davidson, his one true love.§!"

    ITA_GCF_Fella_Giani_Name_text: "§PGiani§!"
    ITA_GCF_Fella_Giani_Name_tt: "§YNiccolò Giani§!\n§g--------§!\n§LIf one were to compare Niccolò Giani, the elusive founder of the School of Fascist Mysticism, to one of the great men in the history of the world, they would surely find a kindred soul in Cato the Censor. Hard, uncompromising, and fanatically convinced of the superiority of their own people in a barbarian-infested world, people such as them have always had a deep impact upon society: striving to change their people so that it fits their vision, they leave no stone unturned in their quest for perfection or enlightenment.\n\nPeople such as them, however, are by their very nature destined to be despised, hated and isolated. People unconsciously fear to face their own inadequacy and weakness, and as such, they do not follow the guidance of those who have the courage and determination to point the way towards salvation. Such a powerful word "salvation" is, but this is what Giani offers to the Italian people: not just economic reform or political renewal, but salvation of the soul through the cleansing power of fascism, as Mussolini showed a long time ago.§!"
    ITA_GCF_Fella_Giani_Power_text: "[?ITA_GCF_QuadrumvirPow^3|Y1]"
    ITA_GCF_Fella_Giani_Power_tt: "§YNiccolò Giani§!\n§g--------§!\n§LIf one were to compare Niccolò Giani, the elusive founder of the School of Fascist Mysticism, to one of the great men in the history of the world, they would surely find a kindred soul in Cato the Censor. Hard, uncompromising, and fanatically convinced of the superiority of their own people in a barbarian-infested world, people such as them have always had a deep impact upon society: striving to change their people so that it fits their vision, they leave no stone unturned in their quest for perfection or enlightenment.\n\nPeople such as them, however, are by their very nature destined to be despised, hated and isolated. People unconsciously fear to face their own inadequacy and weakness, and as such, they do not follow the guidance of those who have the courage and determination to point the way towards salvation. Such a powerful word "salvation" is, but this is what Giani offers to the Italian people: not just economic reform or political renewal, but salvation of the soul through the cleansing power of fascism, as Mussolini showed a long time ago.§!"

    ## Gerarchi
    ITA_GCF_Gerarchi_HeaderText_text: "I Gerarchi"
    ITA_GCF_Gerarchi_HeaderText_tt: ""

    ITA_GCF_Gerarchi_Ministri_Power_text: "[?ITA_GCF_GerarchiPow^0|Y0]"
    ITA_GCF_Gerarchi_Ministri_Power_tt: "§LMinistri§!\n§g--------§!\n§YPower§!: [?ITA_GCF_GerarchiPow^0|Y0]\n§g--------§!\n§GPavolini§!: [?ITA_GCF_GerarchiLoy^00|1]%\n§WBalbo§!: [?ITA_GCF_GerarchiLoy^10|1]%\n§RMuti§!: [?ITA_GCF_GerarchiLoy^20|1]%\n§PGiani§!: [?ITA_GCF_GerarchiLoy^30|1]%"
    ITA_GCF_Gerarchi_Ministri_Name_text: "Ministri"
    ITA_GCF_Gerarchi_Ministri_Name_tt: "§YMinistri§!\n§g--------§!\n§LThe fascist monopoly over the highest offices in the Empire means that most, if not all, Ministers of His Imperial Majesty's Government are invariably high-ranking Gerarchi. Well-accustomed to the trappings of power, they will side with the one who can best ensure the regime's continuation.§!"

    ITA_GCF_Gerarchi_Corporati_Power_text: "[?ITA_GCF_GerarchiPow^1|Y0]"
    ITA_GCF_Gerarchi_Corporati_Power_tt: "§LCorporazioni§!\n§g--------§!\n§YPower§!: [?ITA_GCF_GerarchiPow^1|Y0]\n§g--------§!\n§GPavolini§!: [?ITA_GCF_GerarchiLoy^01|1]%\n§WBalbo§!: [?ITA_GCF_GerarchiLoy^11|1]%\n§RMuti§!: [?ITA_GCF_GerarchiLoy^21|1]%\n§PGiani§!: [?ITA_GCF_GerarchiLoy^31|1]%"
    ITA_GCF_Gerarchi_Corporati_Name_text: "Corporazioni"
    ITA_GCF_Gerarchi_Corporati_Name_tt: "§YCorporazioni§!\n§g--------§!\n§LThe Corporations are the backbone of the fascist economic system. Representing the interests of the largest private and public enterprises, they are a powerful player in the game of power and politics: while not always stricto sensu fascists, they understand the value of personal connections, and can count on the loyalty of several Gerarchi, who will align with the best choice for the business.§!"

    ITA_GCF_Gerarchi_Burocrati_Power_text: "[?ITA_GCF_GerarchiPow^2|Y0]"
    ITA_GCF_Gerarchi_Burocrati_Power_tt: "§LBurocrati§!\n§g--------§!\n§YPower§!: [?ITA_GCF_GerarchiPow^2|Y0]\n§g--------§!\n§GPavolini§!: [?ITA_GCF_GerarchiLoy^02|1]%\n§WBalbo§!: [?ITA_GCF_GerarchiLoy^12|1]%\n§RMuti§!: [?ITA_GCF_GerarchiLoy^22|1]%\n§PGiani§!: [?ITA_GCF_GerarchiLoy^32|1]%"
    ITA_GCF_Gerarchi_Burocrati_Name_text: "Burocrati"
    ITA_GCF_Gerarchi_Burocrati_Name_tt: "§YBurocrati§!\n§g--------§!\n§LBureaucracy is a wide term in the fascist regime, encompassing not only the official state bureaucracy, but also the labyrinthine party structure. With several high-ranking Gerarchi positioned in strategic offices of both, they can prove a powerful interlocutor with interests of their own, and their greatest priority is stability in both ideology and government.§!"

    ITA_GCF_Gerarchi_Militaristi_Power_text: "[?ITA_GCF_GerarchiPow^3|Y0]"
    ITA_GCF_Gerarchi_Militaristi_Power_tt: "§LMilitaristi§!\n§g--------§!\n§YPower§!: [?ITA_GCF_GerarchiPow^3|Y0]\n§g--------§!\n§GPavolini§!: [?ITA_GCF_GerarchiLoy^03|1]%\n§WBalbo§!: [?ITA_GCF_GerarchiLoy^13|1]%\n§RMuti§!: [?ITA_GCF_GerarchiLoy^23|1]%\n§PGiani§!: [?ITA_GCF_GerarchiLoy^33|1]%"
    ITA_GCF_Gerarchi_Militaristi_Name_text: "Militaristi"
    ITA_GCF_Gerarchi_Militaristi_Name_tt: "§YMilitaristi§!\n§g--------§!\n§LWhile not yet total, fascist influence over the armed forces is high, with several Gerarchi representing the interests of their contacts in the Army, Navy and Air forces. Valuing strength of character and certainty of will, these martial, bellicose personalities will surely align with those who can provide them what they crave, but they will be wary of those who rely too much on paramilitary forces.§!"

    ITA_GCF_Gerarchi_MVSN_Power_text: "[?ITA_GCF_GerarchiPow^4|Y0]"
    ITA_GCF_Gerarchi_MVSN_Power_tt: "§LMVSN§!\n§g--------§!\n§YPower§!: [?ITA_GCF_GerarchiPow^4|Y0]\n§g--------§!\n§GPavolini§!: [?ITA_GCF_GerarchiLoy^04|1]%\n§WBalbo§!: [?ITA_GCF_GerarchiLoy^14|1]%\n§RMuti§!: [?ITA_GCF_GerarchiLoy^24|1]%\n§PGiani§!: [?ITA_GCF_GerarchiLoy^34|1]%"
    ITA_GCF_Gerarchi_MVSN_Name_text: "MVSN"
    ITA_GCF_Gerarchi_MVSN_Name_tt: "§YMVSN§!\n§g--------§!\n§LThe Blackshirts are the fascist party's paramilitary arm, long ago turned into a semi-official military police and volunteer armed force. While their formal powers are largely undefined in the legal landscape, the influence they wield is clear to all: ruthlessly persecuting all enemies of fascism - both real and imaginary - they respect only those who share their zeal, rejecting moderates and cowards.§!"

    ITA_GCF_Gerarchi_Moderati_Power_text: "[?ITA_GCF_GerarchiPow^5|Y0]"
    ITA_GCF_Gerarchi_Moderati_Power_tt: "§LModerati§!\n§g--------§!\n§YPower§!: [?ITA_GCF_GerarchiPow^5|Y0]\n§g--------§!\n§GPavolini§!: [?ITA_GCF_GerarchiLoy^05|1]%\n§WBalbo§!: [?ITA_GCF_GerarchiLoy^15|1]%\n§RMuti§!: [?ITA_GCF_GerarchiLoy^25|1]%\n§PGiani§!: [?ITA_GCF_GerarchiLoy^35|1]%"
    ITA_GCF_Gerarchi_Moderati_Name_text: "Moderati"
    ITA_GCF_Gerarchi_Moderati_Name_tt: "§YModerati§!\n§g--------§!\n§LModeration may seem a coward choice in a party that makes strength and ferocity its core tenets. Still, more than a few Gerarchi are interested in stability first and foremost, representing large sectors of society who wish to see their lives continue peacefully: such people will undoubtedly back those who can ensure that the Empire will not undergo sudden, violent changes.§!"

