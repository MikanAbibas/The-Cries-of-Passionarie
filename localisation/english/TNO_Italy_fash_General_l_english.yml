 ITA_quadrumvirate.7.t: "Nelle Segrete Stanze..."
 ITA_quadrumvirate.7.desc: ""This is getting nowhere."\n\nItalo Balbo looked around him, throat parched from the past three hours of screaming, and realized that this was the first statement the four people in the room could agree on. Though something beyond aggravating, it was by no means surprising: when they had met to 'settle the matter once and for all,' it had been clear from the start that no one was willing to concede.\n\n"Really? I would never have thought!" Ettore Muti quipped, his voice raucous, eliciting tired chuckles from the other three.\n\n"Still, we need to do something, anything!" Alessandro Pavolini spat, flipping through the pages of a manila folder. "Every day we spend quarreling, we become weaker. The OVRA reports that the reds are reorganizing after the débacle at Verona, and you all know that the King-"\n\n"The King counts for nothing!" Niccolò Giani scoffed imperiously.\n\n"The King, as I was saying," resumed Pavolini, glaring at Giani, "will not tolerate this charade for long, and Niccolò, even you know that the generals in the army are more loyal to him than to us."\n\nGiani looked as if he had just been poisoned, but reluctantly nodded assent.\n\n"Alessandro is right," interjected Balbo with a sigh. "It is clear that we cannot find an agreement today, but there is something that, regardless, must be done. The State and the Nation require a figurehead while we sort out our differences."\n\n"A figurehead?" A frowning Muti asked.\n\n"A caretaker, to be more precise. Someone with enough presence to fulfill the role without help, but not enough to be independent from us: when we have decided who of us will be Duce, he will step down. What do you say?"\n\nAs he looked around the room, Balbo was relieved to see three heads nodding, with varying degrees of enthusiasm.\n\n"Perfect then," the old aviator said, taking a small folder from the table: "Now we only need to choose a candidate, and I think we have someone perfect for the role...""
 ITA_quadrumvirate.7.a: ""Come on Italo, don't keep us hanging...""
 
 ITA_quadrumvirate.8.t: "A Transparent Duce"
 ITA_quadrumvirate.8.desc: "The square in front of Palazzo Venezia was filled to the brim. The iconic balcony, from which Mussolini had announced Italy's intervention in the war and, five years later, the final victory, was ready for the new Duce's speech: after interminable minutes, the large window opened, and the victor of the power struggle showed himself to the people of the Empire.\n\n"Italiani!" Carlo Scorza began, "the time of decadence has ended, and a new age begins for our beloved Empire!"\n\nThe people cheered, but the more observants noticed that something was... off. Behind the new Duce, four men stood, acting in a way that not even the most skillful cameramen could correct: their applauses were tepid, their expressions sour, and they looked uneasily at each other. Everyone knew them, even more than their new leader.\n\nScorza spoke lengthily about the potential of the Italian Empire and the need for reforms and rejuvenation after Ciano's traitorous regime. As the minutes passed, however, more and more focused their attention on the four men, until the Duce disappeared to the crowd, as if transparent: to the left, Italo Balbo was the only one trying to appear genuinely happy, while Alessandro Pavolini and Ettore Muti evidently failed to express their joy for the new age that was beginning for the Empire; last to the right, Niccolò Giani alternated between indifference and barely-concealed disgust.\n\n"Let us get to work, my beloved countrymen!" the new Duce finished his speech. The people applauded and cheered, but even they sounded like students caught dozing off by their stern teacher.\n\n"May this be a time of stability and cooperation, for the good of all!" were Scorza's final words to the crowd. At that, something happened that only a few, well-positioned onlookers could notice: as the four men turned their backs to the crowd to leave the balcony, they looked at each other, and in their eyes was hate."
 ITA_quadrumvirate.8.a: "Du-ce! Du-ce! Du-ce!"
 
 ITA_quadrumvirate.50.t: "A Meeting At The Quirinale"
 ITA_quadrumvirate.50.desc: "Carlo Scorza entered the representation office of Umberto II flanked by a valet, who announced him to the Emperor sitting behind his ornate desk. As protocol demanded, the new Duce stood patiently - respecting the constitutional superiority of the Emperor to his appointed Prime Minister - and then, after Umberto acknowledged him with a small nod, he finally took his seat.\n\n"Your Majesty, I am honoured." Scorza said politely.\n\n"Minister." The Emperor replied, as usual preferring the constitutional titles rather than the fascist ones: "I have received notice from the President of the Senate that both Chambers have unanimously proposed your appointment to Prime Minister."\n\n"It is so, Your Majesty."\n\n"I have examined the proposal, finding nothing worthy of my disapproval. As such, with the powers granted to me by the Albertine Statute, I appoint you as Prime Minister of the Kin- of the Empire."\n\nScorza smiled inwardly, recognising the only concession the Emperor had to make to fascism; then, he continued the charade, as protocol demanded.\n\n"I am honoured and grateful, Your Majesty." He said, bowing his head: "I swear to uphold Italy's interests with my every action, until such a time is chosen that my services are no longer required, as your August self or the Parliament may see fit."\n\nOf course, there was no need to explain his last period. Both knew that Scorza would remain Duce - and Prime Minister - for as long as the real rulers of the Empire needed him to be, but stability was paramount: the people needed to know that the Emperor held Italy together, and that the ship of the State was governed by someone with full authority, at least in form. The armed forces would see that nothing exceeded the acceptable amount of political infighting - a threat left hanging by the Emperor with the many Corazzieri present in the office, without need to say a word to the new Prime Minister."
 ITA_quadrumvirate.50.a: "No price is too high for stability."
 
 ITA_quadrumvirate.9.t: "His Finest Hour"
 ITA_quadrumvirate.9.desc: "He deserved better than this. Party secretary. Leader of the blackshirts. Always loyal to Mussolini. Duce of all Italy. Carlo Scorza was a man fit to lead, to truly secure the Italian Empire-- a dyed in the wool Fascist and one of history's destined Great Men.\n\nAll the same, here he stood, as a spineless puppet of the so-called "quadrumvirate". In his soul, he was sickened and saddened at his own ignoble fate, but in his mind he understood his position well. He was a harbinger of transition, an aquarian Duce destined to secure a peaceful transfer of rulership.\n\nIt is true that the halls of power were closed off to Scorza, and that the kingmakers of the Grand Council had passed him over, but it was also true that he was beloved by the people of Italy. If nothing else, at least he had the consolation of knowing that the citizenry would see him as a righteous leader. He would not leave a legislative impact, but he could perhaps leave a cultural one; he was determined to secure the stability of Italy, and despite his own lukewarm speaking skills, he had resolved to give a massive televised speech calling upon the Italian people to trust in the Grand Council.\n\nThousands of Mivar televisions came to life as Radiotelevisione Italiana began their broadcast of what Scorza considered to be his (tragically) most important work. He contrasted Italy with Germany, promising that there would be no brother against brother, no bloody civil war like when their nation was rended by the death of Hitler. He passionately rallied around the legacy of Mussolini, invoking his name nearly every other sentence. The 15 minute long speech was racked with calls to action, pleading to the Italian populace to have faith that the fascist system will guarantee them a happy future. As the little red light on the television camera flickered off, Scorza sat back in his chair, satisfied and happy. He may not be remembered as a Caesar, but he would be celebrated as an Ovid.\n\nThe nationwide response to his speech was clear, immediate, and decisive: most people simply did not care. It was, in the public consciousness, a simply okay speech. It was functional. Only the most hardline PNF centrists felt fully assuaged by it, though most everyone who watched it felt at least a little bit calmed. Certainly it was not a barn-burner, and generally, the people just went back to supporting their various quadrumvirate members. No one faulted Scorza for trying, at least."
 ITA_quadrumvirate.9.a: "Can we just let him keep believing that everyone loved the speech?"
 
 #Pavolini Quadrumvirate Sub-Tree
 
 ITA_quadrumvirate.10.t: "Freedom of the Press"
 ITA_quadrumvirate.10.desc: ""What exactly can you bring to Agenzia Stefani, Mister Bellini?"\n\n"Mister Bellini" could bring a great deal to Agenzia Stefani, the leading press agency of Italy since its ascension following the rise of fascism. "Mister Bellini" was a hard worker, he was creative, he was intelligent, and most of all, he was loyal. Under different circumstances, he could have been the Italian Carl Bernstein-- a young and dedicated reporter looking to let slip the bonds of truth. Under the circumstances of the present, however, he was exclusively looking to bring two sole things to Agenzia Stefani. Not truth, or vigor, or a robust dedication to free press; instead, "Mister Bellini" wants only to bring surveillance and subversion to the old A.S.\n\nThe Agenzia Stefani, despite its history as a proud fascist publication, has fallen from grace. In this battle for the future of Italia, this battle between the four Caesars, the A.S. has turned its back on the rightful heir to Mussolini and to Rome. They turned their back on "Mister Bellini"'s employer. They turned their back on Alessandro Pavolini.\n\n"Mister Bellini" was one of a vast cohort of patriots working for Pavolini, seeking to turn the tide of the unfair press that refused to tell the truth of Pavolini's raw dedication to fascism and Italy. It was Mussolini who realized the power of the press, and it will be Pavolini that realizes his dream of a united Italy working for a single goal. It is just a shame that covert action requires such denigrating activities as job interviews."
 ITA_quadrumvirate.10.a: ""I believe I can bring level-headed experience.""
 
 ITA_quadrumvirate.11.t: "A Tragedy For All to See"
 ITA_quadrumvirate.11.desc: "MEMBRO DEL GRAN CONSIGLIO DEL FASCISMO MORTO IN APPARENTE SUICIDIO\n\n"Mister Bellini" grimaced. It was a clunky headline, but a necessary one. He wasn't a part of the team that "negotiated with" the big-mouthed councilor, but he understood that his role was just as illegal and just as important. Fascism, as Alessandro Pavolini loved to say, was a single striking fist. It requires absolute unity, and when anyone breaks that unity (even a member of the Grand Council of Fascism), they must be excised. More specifically, this rogue councilor thought himself above the new Caesar, and had been badmouthing Pavolini with absurd and libelous claims.\n\nPavolini had sent a team to meet with the councillor in his grand Etruscan estate to discuss his concerns. No doubt the councillor realized the error of his ways, as his body was found days later with two bullet wounds in the back of his head. An obvious and tragic suicide, and with "Mister Bellini"'s position in the Agenzia Stefani, the media was sure to see it the same way. It is simply a shame that the councilor could not live with himself after being faced with the brunt of his inglorious lies and machinations, and that he took his own life rather than make peace with that great man Pavolini. The media, and the Agenzia Stefani in particular, will surely urge to give the poor man's family peace, and to avoid any superfluous and chaotic investigations into this sordid affair. \n\nOf course, everyone will know Pavolini had him killed. More than that, everyone will know that Pavolini has the media on his side. That's sort of the point of this whole operation-- to spread fear, and to tell all of the anti-fascists and liberals and communists that you ought to shut up before you commit suicide in the back of the head. It is a message, and a highly effective one. It is a threat wrapped in a tragedy, and while polite society will obviously parrot the story that the Agenzia Stefani prints, they will understand that the Sword of Damocles hangs above them if they forget which of the Quadrumvirate to support."
 ITA_quadrumvirate.11.a: "We have replaced ink with blood."
 
 ITA_quadrumvirate.12.t:0 "To Find Willing Ears"
 ITA_quadrumvirate.12.desc:0 "Alessandro Pavolini was scheming. Not anything unusual, would say anyone with even the smallest knowledge about the person, but this time things were much more serious: the mantle of Duce was the prize, and he was so close - so close! - to take it. The smallest mistake could send to ashes a decade of subtle, surgical work, and Pavolini knew that he had only one chance.\n\n"Fabrizio." He called for his secretary.\n\n"What do you need, sir?" The man replied.\n\nAs befits the concept, secretary Fabrizio Giustiniani was his master's shadow, knowing all his secrets and keeping them such. Gifted with a great memory - almost eidetic - and a keen intellect, Fabrizio was the closest thing Pavolini had to an ally and perhaps a friend, one that he would not have hesitated to sacrifice had he ever become a danger: of course, the secretary knew of it, and the two had forget a honest, if brisk relationship - Pavolini had protected him from Ciano's purges, and the other had helped him strengthen his hold over the party.\n\n"Were you to choose among our adversaries," Pavolini asked almost nonchalantly, "Which one would you ally with, at least temporarily?"\n\n"Without a doubt, sir, Balbo." Came the immediate answer\n\n"Why so?"\n\n"Because Giani is utterly unwilling to parley," Fabrizio replied directly, "While Muti is too liable to blunders - he might become a liability despite his own will to help."\n\nAlessandro Pavolini mulled over his secretary's words, and found them true. In fact, he had already come to this conclusion, but having a confirmation never hurt. Then, he gave the secretary his orders."
 ITA_quadrumvirate.12.a:0 ""Call Italo, secure phone. Oh, and book a plane for Tripoli.""
 
 ITA_quadrumvirate.13.t:0 "To Find Willing Arms"
 ITA_quadrumvirate.13.desc:0 "Alessandro Pavolini was scheming. Not anything unusual, would say anyone with even the smallest knowledge about the person, but this time things were much more serious: the mantle of Duce was the prize, and he was so close - so close! - to take it. The smallest mistake could send to ashes a decade of subtle, surgical work, and Pavolini knew that he had only one chance.\n\n"Fabrizio." He called for his secretary.\n\n"What do you need, sir?" The man replied.\n\nAs befits the concept, secretary Fabrizio Giustiniani was his master's shadow, knowing all his secrets and keeping them such. Gifted with a great memory - almost eidetic - and a keen intellect, Fabrizio was the closest thing Pavolini had to an ally and perhaps a friend, one that he would not have hesitated to sacrifice had he ever become a danger: of course, the secretary knew of it, and the two had forget a honest, if brisk relationship - Pavolini had protected him from Ciano's purges, and the other had helped him strengthen his hold over the party.\n\n"Were you to choose among our adversaries," Pavolini asked almost nonchalantly, "Which one would you ally with, at least temporarily?"\n\n"Without a doubt, sir, Muti." Came the immediate answer\n\n"Why so?"\n\n"Because Giani is utterly unwilling to parley," Fabrizio replied directly, "While Balbo is too smart not to see the trap - he will betray you at the first chance, just as you are planning to do."\n\nAlessandro Pavolini mulled over his secretary's words, and found them true. In fact, he had already come to this conclusion, but having a confirmation never hurt. Then, he gave the secretary his orders."
 ITA_quadrumvirate.13.a:0 ""Call Ettore, secure phone. Oh, and book his favorite trattoria.""
 
 ITA_quadrumvirate.14.t: "On the Empire and Her Colonies"
 ITA_quadrumvirate.14.desc: "Alessandro Pavolini and Italo Balbo met on the balcony of a lavish hotel room, looking out onto the Libyan coast. The refreshing smell of the Mediterranean wafted through the air as the two rivals sat opposite of each other, discussing the future of the Empire.\n\n"Thank you for meeting me Italo, I appreciate you taking time out of your day for this occasion" Pavolini said. "I imagine that the future of Italy is just as important to you as it is for me. It is essential that we stabilize the Empire in such chaotic times. What assurances could I offer you so that I may rely on your support in the days to come?"\n\n"I appreciate your hospitality Alessandro." Balbo began, "However, I must admit that I worry about your ability to manage the various subjects of the Empire. If the peoples of Ethiopia, Algeria, Egypt and so on are beaten in the streets by the Blackshirts and forced to spend all their waking hours toiling away at work, then they will begin to agitate. The more those peoples agitate, the more likely that the colonies of the Empire fall to the shortsighted folly of revolution. If you wish to rely on my support, than you must commit to reforming the colonies to prevent discontent from building up"\n\nPavolini paused for a moment to consider Balbo's proposal. He could see the logic in it, by easing up on the natives there was a chance that they would be more accepting of Italian rule and would be less tempted to rebel against the Empire. However, he couldn't help himself from being paranoid. What if the natives saw these reforms as weakness? Sensing it as an opportunity to overthrow the local colonial garrisons. Such a series of events would be disastrous for the Empire.\n\nAfter another moment of thought, Pavolini gave his answer."
 ITA_quadrumvirate.14.a: ""You make a good point Italo, consider it done.""
 ITA_quadrumvirate.14.b: ""I'm afraid I can make no such commitments.""
 
 ITA_quadrumvirate.15.t: "Balbo's Life's Work"
 ITA_quadrumvirate.15.desc: ""If there is anything that the two of us agree on Italo, it is that the Empire and her colonies must remain stable." Pavolini said, "Tell me, what else can I do to secure your generous support in these trying times?"\n\n"With Italy and her Empire in such dire straits, it is hard for me to simply walk away and let another man handle the situation." Balbo began, "If you want me to support your bid to become Duce, I must remain involved in the affairs of the Empire. After all, I have devoted my entire life to building and maintaining it. I don't know what I would even do if I were to leave it all behind. Alessandro, I am asking you to keep me in a position to oversee the administration of Italy's colonies."\n\nBalbo's request raced through the mind of Pavolini. Balbo was a war hero, beloved by the people and the military alike. His support could be crucial to securing the office of Duce and finally correcting the disastrous leadership of Ciano. However, Pavolini could not help but imagine Balbo's potential ulterior motives. Keeping him in such an influential position could undermine his own rule as Duce. He would be able to slowly garner more and more support in the shadows, waiting for the perfect opportunity to strike and take the Empire for himself. After all he said it himself, if you want something done right do it yourself."
 ITA_quadrumvirate.15.a: ""You've more than proven you are capable for such a position.""
 ITA_quadrumvirate.15.b: ""I'm afraid I must decline this request.""
 
 ITA_quadrumvirate.16.t: "Differences of Opinion"
 ITA_quadrumvirate.16.desc: "Italo Balbo's expression subtly turned from polite kindness to slight disappointment.\n\n"I'm sorry Alessandro, but I think the differences between us are too great for me to support you." Balbo apologized. "Nonetheless, I appreciate such a kind gesture. I wish you safe travels on your return to Italy."\n\n"That is most unfortunate Italo." Alessandro gently replied, careful not to let his face portray the anger he was feeling. "It is a shame that we were unable to see eye to eye on these matters. I was looking forward to working with you in the future. Regardless, I thank you for coming out here to hear me out in this meeting."\n\nThe two men shook hands and went their separate ways. All the while, Pavolini had to use a considerable amount of willpower to keep his composure. Balbo must have known that what he was asking for was completely unreasonable! He must have only accepted the invitation to this meeting to waste Pavolini's time. Clearly he had never had any intention of actually working together. Such a man was clearly only interested in the fame and wealth that the office of the Duce provided, nothing more. The plane ride home was spent in a silent rage, as Pavolini continued to reflect upon the failed meeting. Clearly Balbo wanted to drag this conflict out, knowing that Pavolini's victory was imminent. If that's what had to be done, that's what would be done."
 ITA_quadrumvirate.16.a: "Now we do things the hard way."
 
 ITA_quadrumvirate.17.t: "Balbo Secured"
 ITA_quadrumvirate.17.desc: ""I think we see eye to eye Alessandro." Balbo stated, "I would be happy to step aside and support you as Duce. However, while we agree on many important topics, I'd like to spend more time discussing the details of how to best manage and maintain the Empire with you."\n\n"I would be happy to take as much time as you need to work out the details of our agreement." Pavolini said with a smile on his face. "Tell me, where would you like to begin?"\n\nFor the next several hours, the two men discussed the state of the Italian Empire, how Ciano's failures had brought it to the brink of collapse, and how to recover from such instability. All the while Pavolini silently congratulated himself. He knew that convincing Balbo to cooperate with him would be no easy task, yet he still managed to succeed. At the end of the meeting the two men firmly shook hands, before leaving the balcony and going their separate ways.\n\nWith Balbo's support, the goal of becoming Duce was beginning to get closer and closer. It wouldn't take much more to convince the Grand Council of Fascism to name him the next ruler of the Empire. However, that would only be the true start of Pavolini's work. He knew that his years as the Duce would be difficult and dangerous, but he also knew that only he could save Italy from such decay and disorder. Only he could right the wrongs of Ciano and restore order to the Empire. And if only he could do such things, then he must wield absolute and unquestionable power."
 ITA_quadrumvirate.17.a: "We are one step closer."
 
 ITA_quadrumvirate.18.t: "Those Who Labor for the Empire"
 ITA_quadrumvirate.18.desc: "In his bid to claim the mantle of Duce for himself, Alessandro Pavolini had invited one of his rivals, Ettore Muti, to a meeting at his estate in Rome. It was Pavolini's hope that he could find some sort of common ground with Muti. An attempt to appease the futurist and convince him to step away from the race to be Duce.\n\nThe two men sat beside a fireplace in the living room, sharing stories with one another and sipping on wine. Pavolini thought it best to get Muti comfortable before getting to the ever important discussion of Italian politics. So he sat there, politely listening to many of Muti's countless tales of his time in the military and the early days of fascism. Finally after seemingly hours of small talk, it was finally time to take the conversation where he always intended to take it.\n\n"So, Ettore, this competition to become Duce, I think we can both see that it is tearing Italy apart. What assurances can I offer you in exchange for your support in the days to come?" Pavolini finally asked after hours of waiting.\n\nMuti paused to contemplate the offer. "So that's why you invited me here?" He asked with a small chuckle. "I'll tell you what, promise to me that you will rule with the best interests of the workers of Italy in your heart. Commit yourself to actually lightening their burden. That is what you can do."\n\nPavolini stopped to think about Muti's request, and to carefully craft a response to it. Obtaining his support would be monumental, but every deal has its trappings. Could he be trying to prime the common people for a rebellion in his name? Giving them the time to organize against the rule of Pavolini and the Blackshirts? The risk was as monumental to him as the rewards."
 ITA_quadrumvirate.18.a: ""I too care for the people of Italy, consider it done.""
 ITA_quadrumvirate.18.b: ""I'm afraid I cannot commit to such things.""
 
 ITA_quadrumvirate.19.t: "Those Who Fight for the Empire"
 ITA_quadrumvirate.19.desc: "The meeting between Alessandro Pavolini and Ettore Muti continued on after the latter's first request was accepted. Pavolini had agreed to improving the working conditions for the people of Italy. Satisfied with this concession, Muti went on to make a second demand of Pavolini.\n\n"I'm glad that we agree that the workers of Italy deserve better than what they have now. It is undeniable that Ciano failed them at every turn." Muti said, pleased with the direction of the conversation. "Before I agree to support you, I have one more request for you. Everyday it seems that Italy is getting left in the dust of the United States and Japan. They both continue to field increasingly impressive militaries. We cannot afford to stay in their shadows, if Italy is meant to take its place as a superpower then we must pump as many resources into it as possible. I'm talking about massive increases to military spending."\n\nMuti's second request only made Pavolini more paranoid. His first request opened up the possibility of a rebellion against him. Now this only makes it worse. Imagine what would happen if Muti took credit for this military expansion. He could continue to build up his reputation within the armed forces. With the backing of both the populace and the military, an uprising in Muti's name would be unstoppable.\n\nNo, that was ridiculous. There was no way that Muti could actually be planning something that elabore, right? What use would there be in rebelling against Pavolini when he could just continue his own bid to be Duce? Still, the thought never quite left Pavolini's mind. Finally, he formulated his answer."
 ITA_quadrumvirate.19.a: ""It seems we are once again in agreement.""
 ITA_quadrumvirate.19.b: ""I'm not so sure I can agree to such a thing.""
 
 ITA_quadrumvirate.20.t: "Muti Secured"
 ITA_quadrumvirate.20.desc: ""Well Alessandro, I can't say I'm not pleased." Ettore Muti said. "You've proven to me that while we may have our differences, we agree when it matters most. While it may pain my pride to drop out of this race, I know that Italy is in good hands with you. You can certainly rely on my support."\n\nPavolini didn't bother to hide his smile as he reached out to shake Muti's hand. "I'm glad that the two of us can work together to ensure that Italy once again reaches great heights. You have my personal gratitude, many lesser men would not be able to set aside their pride for the greater good of Italy. It will be an immense pleasure to have you at my side in the days to come."\n\nPavolini could not have been happier with himself. Dealing with Muti diplomatically would be far more beneficial in the long term than dealing with him the hard way. He may have had his reservations but he knew that it was just irrational paranoia, nothing more. Pavolini was finally nearing the end of his quest to become Duce. The goal was finally beginning to feel real and attainable. But the work wasn't over, not yet. Pavolini had to keep his eye on the prize if he wanted to finally bring the stability and order that Italy so desperately needed."
 ITA_quadrumvirate.20.a: "We are nearing the end."
 
 ITA_quadrumvirate.21.t: "An Unreasonable Request"
 ITA_quadrumvirate.21.desc: "Ettore Muti sighed before he responded to Pavolini. "I'm sorry Alessandro, but I don't think I can step aside and support you. We simply have irreconcilable differences on what Italy needs. Still, I appreciate that you were willing to at least consider compromising with me." Muti said as he reached his hand out for a handshake.\n\nIt took all of Pavolini's willpower to maintain a polite facade. After a brief pause, he shook Muti's hand. "That is too bad, Ettore. Nonetheless, I must thank you for coming here and hearing me out. You have my gratitude for giving me your time this evening." Pavolini said as Muti began to gather his things to leave.\n\nAs soon as Muti left and Pavolini was alone, he dropped the facade altogether. How could Muti make such egregious requests? He must have come with the express intent of wasting Pavolini's time. Surely he knew that what he was asking for was comparable to asking him to simply allow an open attempt at rebellion in the future. It would take a far more cunning deceiver to trick Pavolini into agreeing to such a rotten deal.\n\nNow, Muti has sealed his own fate. Now, Pavolini knew that he had to be dealt with the hard way. He gave him a chance to take the easy way out and he spat at Pavolini's open hand. Now he'll pay for it."
 ITA_quadrumvirate.21.a: ""I gave him a chance.""
 
 ITA_quadrumvirate.22.t: "Time's Arrow"
 ITA_quadrumvirate.22.desc: "Alessandro Pavolini was rather disappointed with his accommodations for his speech, but luckily he wasn't too concerned by the shoddy stage as the size of the crowd made up for it. Swathes of eager Italians, aligned with his goals or not, were occupying the street before him awaiting a speech. Taking a deep breath, he ran through the broad strokes in his head for just a moment before leaning into the microphone. "I bid you all a good evening, people of Italy! I'm flattered by all of this support, truly flattered." He cracked an insincere grin.\n\nHis expression then abruptly hardened, "People, do you know how to kill an empire? It's quite simple, really. Do you know what kills an empire? Disunity. After all, one might describe a falling empire as in decay, and that's just another word for entropy, the inevitable dissolution of all things. Disorder on an all encompassing scale. Luckily, Italy has yet to decay, though she does ail! But this can be fixed. When something is breaking, all it takes to hold it together is a strong, competent hand. Italy is breaking, her people getting further and further apart and her empire falling into disorder, and she needs a strong hand."\n\n"This is what I will provide you, my countrymen. I will provide you with what my opponents will not, a strong yet gentle hand. Muti wants to provide you with an inconsistent, floundering grip, Balbo wants to simply let go and watch us rot, and Giani quite frankly wants to rip us to pieces even quicker. So, people, do you want to watch your homeland crack apart until it is dust, or do you want to live in a glorious, united and peaceful Italy?!""
 ITA_quadrumvirate.22.a: "If you can call it that."
 
 ITA_quadrumvirate.23.t: "A Man of the People"
 ITA_quadrumvirate.23.desc: "Alessandro Pavolini jammed his shovel into the dirt for the umpteenth time, occasionally glancing up to offer a weary smile to the photographer. He'd been digging for at least an hour in this field, helping a farmer out and getting plenty of great photo-ops for it. Tomorrow, newspapers would spin him as a man of the people, but today, his boots were muddy, his hands had splinters and he was wearing the ugliest of slacks. He glanced over to the man working next to him, the owner of this farm and about the 4th uneducated, backwards... working man he'd spoken to that day, and offered him a grin. \n\nThey were about done with their work, so Pavolini straightened his back, wincing at the soreness, and extended a hand. Looking over, the working man took a second to realize why Pavolini's hand was extended - not because he was stupid or anything as Pavolini would believe, but because they were both covered in mud. He shrugged to himself, maybe he was just that dedicated? So the handshake was sealed. The prospective Duce's grip was disappointingly weak. The camera snapped once again, bathing the pair in blinding white light and immortalizing a photo of two exhausted men, both beaming for very different reasons.\n\nAs the day of work resolved and the sun began to set, Pavolini joined the photographer to look at the photos they had taken. "Stellar work." He said, patting the man on the back. "And a pleasure meeting you, Roberto!" He added, taking his hand for a second, floundering shake for good measure. There were a few seconds of silence before the farmer replied.\n\n"It's, It's Giuseppe." He said with a mixture of blank sincerity and bewilderment. \n\n"Well, nice to meet you Giuseppe. Time to go, Enzo." He nodded to the photographer and ushered him into the rustic truck they had rented for this day of photoshoots, barely sparing a goodbye to the man, much less his family."
 ITA_quadrumvirate.23.a: ""These'll look damn good in the papers.""
 
 ITA_quadrumvirate.24.t: "Delivering Regret"
 ITA_quadrumvirate.24.desc: "Giorgio held his breath as he parted the blinds. He wasn't entirely sure how long he'd been holding his breath. Every second passed like a century as he squinted out his window into the street. The blackshirts were out in full force like a pack of wolves drawn by the scent of dissent, stalking under dull, silver moonlight that struggled to pierce the heavy veil of darkness cast over the city like the face of a widow. Occasionally they'd hurl a brick through a window or bang on a door until they were allowed in to deliver their violent messages. He'd first been alerted by the shattering of a window and a shrill scream, drawing him and most of his neighbors to their windows.\n\nGiorgio knew this was coming, and his thoughts were racing. Regret mingled with fear in the back of his mind. He should never have become a journalist, that thought became apparent the second he'd smuggled his wife and child into the basement. He'd tried the balancing act of holding his integrity while staying in the state's good graces, but he couldn't resist a shot at the bastard Pavolini. One he'd live to regret, like so many others to be beaten and broken tonight. That second, one of the blackshirts turned his gaze to Giorgio's door. Then came the knocking. \n\nGiorgio pressed his back against the wall, even as one of the men shouted his name. The pounding stopped for just a moment, like the sea drawing back before the crashing of a wave, which came soon enough as the door flew off its hinges. Before he could even shout, a blackshirt was already inside. Giorgio was thrown to the ground as his club collided with his jaw, sending several of his teeth across the room. He flinched as a steel-toed boot slammed into his chest, stealing more of his breath with every strike until eventually it stopped, leaving him only with searing, throbbing pain in his cracked ribs. Giorgio waited minutes with his eyes closed before peeling them open, facing a room of broken and missing furniture."
 ITA_quadrumvirate.24.a: "A message for a message."
 
 ITA_quadrumvirate.25.t: ""
 ITA_quadrumvirate.25.desc: ""
 ITA_quadrumvirate.25.a: ""
 
 ITA_quadrumvirate.26.t: "Divine Favor"
 ITA_quadrumvirate.26.desc: "Pavolini had to admit, the old church was quite beautiful. Intricate murals, stained glass windows, the utter size, and more - all of it of untold ancientness. The stories the walls could tell, beyond those of the bible lovingly and extensively painted over the ancient walls and ceilings, could fill a book the size of the one the clergymen he had come here to meet preach out of. As he ran his fingers along the smooth, varnished wood of the pews, the clopping of shoes on the ancient floors brought his attention to the approaching priest. "Bishop! I trust your day is going well?" Said Pavolini, his voice echoing across the vast church.\n\n"I'm well, but I imagine that's not what you came here for, Mr. Pavolini." Replied the geriatric Bishop, his voice unassumingly frail and kind, not betraying the man's rather unchristian fascist sympathies.\n\n"No, no it is not. I was hoping you and your diocese might put their weight behind my bid for Duce."\n\n"Of course you are..." Muttered the bishop under his breath, "You're not the first one, either. Your colleague, Balbo, already spoke to me last month - I told him I was undecided." He continued aloud. Pavolini cursed to himself. Of course Balbo had spoken to him, a corrupt clergyman is prime material for sway in the church and this was the most corrupt of them. Pavolini just had to be moreso.\n\n"Well then, I suppose there's no convincing you yet, but I don't think he will treat the church as well as I will." Pavolini put extra stress on the word ‘church'. "Yes, the ‘church' might get a few favours. If we get the support of the 'church't, anyway. Do you understand what I mean, bishop?"\n\n"I think I do." The old man offered a grin, and they exchanged goodbyes. As he left, Pavolini placed a hefty sum in the collection bowl."
 ITA_quadrumvirate.26.a: "The first of many."
 
 ITA_quadrumvirate.27.t: "A Neglected Head of Cerberus"
 ITA_quadrumvirate.27.desc: "War is a little like politics, and politics is a little like war, but they're both a lot like crime and the three mingle like old friends. Bruno checked his rifle to make sure it was in good order, and dreamt of his pay as the unmarked car rumbled toward the hotel. Sure, the mafia may not have the training of a special forces unit, but they make up for it with the guile and power of a political force. That, and plausible deniability, the most enticing trait to their benefactor, Pavolini.\n\nThe councilman was waiting impatiently on the curb outside the Venetian hotel. Nobody was supposed to know he was staying there, but loose lips sink ships and a little cash to a housekeeper goes a long way. He wasn't supposed to be without a bodyguard, but once again that little bribe comes in handy for a mixup with his bags. Umberto slowed the car down as they neared the defenseless member of a zealously anti-Pavolini clique, who continued tapping his foot, taking an occasional glance through the window to see his exasperated bodyguard still trying to get his bags back. Bruno, heart pounding, pulled the trigger three times.\n\nFirst, a misfire, shattering glass and drawing shocked glances from bystanders. The councilman looked up in confusion, then horror, in time for the second shot to clip his leg. Then the nail in the coffin, a third shot for his throat, sending him to the ground blue in the face and not long for this world. \n\nThe crooks didn't care much to see what happened next. The job was done. By the time the smoke of commotion had cleared and the bodyguard had come stumbling out the door with a cocked pistol in hand, Bruno and Umberto were gone. Pavolini's foe was dead or dying and all it cost was a few bucks and three bullets. The criminals vanished into the backstreets like partisans into the woodwork, and like crooked politicians they left to claim a prize and glory earned in other men's blood."
 ITA_quadrumvirate.27.a: "After all, the three are just the same."
 
