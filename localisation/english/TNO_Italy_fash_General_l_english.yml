 ITA_a_new_dawn_for_fascism_desc: "The sun rises over a new day for fascism in Italy as Ciano, the spineless traitor that he is, found that he had overplayed his hand. Using what little credibility remained, he called for a grand council at Verona to, as he had so often done in the past, subvert the will of the party in favor of his own, non-fascist policies.\n\nInstead he has discovered that the party still has teeth to bare.\n\nIndeed, today marks a victory for the Partito Nazionale Facista as a whole, as the traitorous Ciano has been forced out of office, his vile personage no longer staining the mantle of Duce. From this day forward Italy will be free of Ciano's tepid "reforms," instead moving ever onwards to a glorious age of fascism forevermore!""
 ITA_four_men_enter_desc: "The victory for fascism over the traitorous Ciano was not won by one man alone, but a grand coalition of four great men, each visionaries of the highest order, and each loyal adherents to fascism, though they all follow that adherence in differing ways.\n\nNow, with the removal of Ciano as the Duce of Italy, and no clear successor having been named in the aftermath of the council, Italy finds itself at a crossroads. All have agreed that the empire must have a Duce, yet no one knows which of the four will assume that mantle. To this end, the four champions of fascism have formed the Second Quadrumvirate, a temporary alliance until one has, above all others, been found worthy of leading Italy into the modern age."
 ITA_e_quattruor_unus_desc: "Though eventually one of the Quadrumvirate will come to rule Italy as Duce, the seat in the present remains unfilled. An interim caretaker Duce must be found while the fate of Italy is decided, yet choosing whom that caretaker might be is proving more difficult than anticipated. None of the quadrumvirs wish to empower one among their number, fearing that doing so might lend legitimacy to one member's claim over the others, so a neutral party must be found. The actual qualifications of the man who will be the interim Duce are of little importance; he needs not change the course of the nation, but must merely keep the ship steady as the true future of Italy is decided once and for all..."
 ITA_organize_the_council_desc: "The Quadrumvirate has finally decided upon the mechanism by which the next Duce of Italy shall be chosen: the Grand Council of Fascism. In a series of subsequent sessions, the Council will deliberate on the qualifications of each of the quadrumvirs, and the arguments that they may put forth to secure their candidacy. After each session, the quadrumvir with the least amount of votes will be removed from consideration, eventually leaving only one man remaining. Using this method, the Quadrumvirate hopes to quickly come to a decision, putting an end to this era of Italian history once and for all, with a new Duce to lead Italy into a glorious future!"
 ITA_and_only_one_leaves_desc: "The time for the Grand Council of Fascism to meet and decide the fate of Italy is nearly upon us. The gerarca have been gathered and informed both of their national duty and the consequences should they fail to complete it. Little remains for us to do before the sessions get underway, but there are some crucial preparations we must accomplish before we can begin.\n\nThe people of Italy have been mostly kept in the dark of the exact machinations taking place at the top levels of our governments. All they have seen in recent months is utter chaos as Ciano has shaken the foundations of Italy to its core. They must be given enough information to keep them calm, and prevent any potential general uprising. Similarly, those within the PNF must be kept pacified, so that no one outside of the Quadrumvirate might think that they would do well as the Duce..."
 ITA_a_black_octavianus_desc: "Alessandro Pavolini is one of the most feared names in all of Italy. A cruel, harsh man, Pavolini has drawn much inspiration from the actions and policies of the German Nazi Party. This being said, Pavolini was quick to denounce the Reich itself after the disastrous Atlantropa project nearly brought Italy to its knees.\n\nA Blackshirt in his past, Pavolini enjoys considerable support among their number as well as the lower party bureaucracy itself. Many of his supporters consider him to be the most likely of the quadrumvirs to be elected Duce of Italy. With Pavolini as Duce, Italy shall be reforged in his image, and no aspect of Italian society will escape his gaze."
 ITA_a_new_antonius_desc: "The name of Italo Balbo is well known throughout all of Italy. An old general of the second World War, Balbo is known as a hero to many for his valiant actions during the African campaign, such as his bravery as a member of the Fanti dell'Aria, Italy's first paratrooper division.\n\nEnjoying the support of the common people of Italy for these acts of heroism, Balbo finds himself as a strong contender to become the Duce, though his long years away from Rome find him stymied in his efforts to wrangle the wider party to submit to his will. On the other hand, his time in the colonies has given him a wide perspective on Italy's vast empire, an organ that he wishes to keep powerful no matter what the cost."
 ITA_a_fascist_lepidus_desc: ""You are the expression of Superhuman values, a weightless impetus, a boundless offering, a fistful of incense over the embers, the scent of a pure soul." These were the words that General Gabriel D'Annunzio spoke to Ettore Muti in Fiume, and they have come to represent his legacy. Having joined the Arditi at the young age of fifteen, Muti found fascism in the trenches of World War One. Joining Mussolini's movement from the very beginning, he briefly held the position of party secretary before returning to active service at the onset of WWII.\n\nMuti yearns for the simpler times when fascism was a revolution to be fought for, a stance that has not done him any favors in securing the votes of the party. His radical tendencies may have given him some sway with the common people, but Muti finds the road to become the Duce a steep one indeed."
 ITA_a_radical_cato_desc: "The name Niccolò Giani is lesser known throughout Italy than his fellow quadrumvirs. Founder of the School of Fascist Mysticism, Giani is less of a politician, and more of a philosopher, believing that fascism is more than just a political ideology, but a way of life. Giani was a vocal critic of the decadence that Ciano had allowed to fester in Italy, often having accused him of distorting and perverting Mussolini's perfect vision in the name of his own inane goals. He is further critical of the other quadrumvirs, often spelling out his disdain for their supposed corruption and incompetence.\n\nGiani's somewhat bizarre beliefs have earned him very few allies within the party and among the population, though the few that he has are puritanical in their belief and fanatically loyal to their great teacher. The road ahead is tough, but Giani will persevere, and his grand fascist crusade will render all who oppose him asunder!"
 ITA_a_meeting_with_the_king_quadrumvirate_desc: "The preparations necessary for the Grand Council of Fascism to begin its sessions in earnest are nearly complete. It is time to inform King Umberto II, who still holds some small degree of influence within the nation, of what has been going on in the highest levels of government. Interim Duce Scorza will schedule a meeting with the King to do just that, a meeting in which the King will find that he has little choice but to allow the proceedings to go forward. Umberto must realize Italy cannot be allowed to stagnate any further, after all, and it will surely do so without the competent leadership of a Duce."
 ITA_primus_inter_pares_desc: "The Quadrumvirate did not come to be within a vacuum. Each of the quadrumvirs has attained their position on the backs of numerous allies and support bases both within the party and among the greater population. In the interest of fairness, and of making sure that the Duce is elected for his competence, rather than having the most vocal allies. To this end, Interim Duce Scorza will meet with party officials, asking them to remain neutral throughout the proceedings and vote fairly in the council. There is no guarantee that they might keep such a promise, or even agree to it in the first place, but we must try, for the good of the nation"
 ITA_concordia_ordinum_desc: "The time has come for the people of Italy to be fully informed of our plans. Interim Duce Scorza will give a televised and radio address to the people of Italy, informing the nation of all that has transpired over the past months, as well as what the future of the country might look like. The military shall be similarly addressed in these speeches, and Italian generals will very publicly swear loyalty to Scorza himself for the duration of the council. The people of Italy will be reassured that the fate of the Germans to the north following the death of Hitler should not befall our nation as well, as well as more privately assuring that the military will remain neutral and not side with one quadrumvir over another."
 ITA_let_the_games_begin_desc: "The time is finally upon us. Months of preparation, of planning for every potential outcome, and making assurances have finally come to a head: it is time to gather the Grand Council of Fascism to at last begin the process by which the next Duce of Italy shall be chosen.\n\nOn paper, everything is above board. Oaths of neutrality have been sworn by the various electors, pledging to vote fairly and without bias. The people have been reassured, and have been told that everything is under control. In reality, the backroom dealings have been underway from the word "go." None of the quadrumvirs are interested in playing by the rules, not when so much is at stake. Secret alliances are being formed, and votes are being tallied before the first sessions have even begun. The people of Italy grow restless, fearing the chaos that looms ever over the horizon, though they find themselves powerless to resist the tides of fascism washing over the nation from Rome.\n\nIt is time. Let the games begin, gloria all'Italia!"
 
