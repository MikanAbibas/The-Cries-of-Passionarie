 ITA_we_must_be_loyal_desc: "Values are what serve as a culture -- a country's foundations, something that Alessandro Pavolini sees as truth. Before his ascension as Duce, he intends to infuse values in his loyalists first and foremost, as a testing ground before his ascent to Duce where he aims to imbue those values in every Italians, values he sees as quintessential for Italy: loyalty, to the Nation, and to its Duce.\n\nFor that, Pavolini plans to use any means necessary. And he shall not shy away if these methods happen to be harsh."
 ITA_organize_the_blackshirts_desc: "The Blackshirts are what we'd call very convenient and "persuasive" in their methods for handling dissent. Luckily for us, Pavolini happens to hold a great deal of influence over them, something very handy in his quest for the position of Duce. Quietly, his directives are spread from one Blackshirt to the other:\n\n"We shall be unleashed in the streets like mad dogs, wreaking havoc in our way as we pave the way for a new age: tonight, Italy and its inhabitants will be plunged in terror, and they shall learn to respect Alessandro Pavolini, the rightful Duce!""
 ITA_a_not_so_free_press_desc: "An inconvenience at best, a thorn in its side at worst, the press currently enjoys a certain independence from the party's grip due to the unusual circumstances afflicting Italy. Naturally, this enrages our soon-to-be Duce who cannot fathom the free press as but anything else than the tool of degenerate liberal thoughts.\n\nIn an attempt to subvert this newfound freedom of theirs, we shall infiltrate each and every tabloids, planting our partisans within their ranks. Then, the Italian press shall be remold as a tool of propaganda for the party, and the Duce."
 ITA_make_an_example_desc: "A faithless cur is in our midst: a council member has shown his true colours, showing himself to not only be unfaithful to Fascism, but also to Pavolini! An affront of this severity shall not stand, and with rage filling his mind and heart, Alessandro plans one's man demise as if he were a god.\n\nIn a show of force, the council members in question will be dead within the next few days, an "accident" that should prove to be particularly useful for the future Duce, as he fully intends to make use of this to illustrate what disloyalty to him entails..."
 ITA_only_two_left_desc: "Our first victory has been achieved - the weakest of our rivals has fallen, and shall no longer pose a concern to us. The people of Italy have wisely seen through their lies and deceptions, and have thrown their support behind those who have true vision. However, despite this victory, it is only the beginning.\n\nThere remain two more that challenge us, and we should not delude ourselves in thinking that this is not as much a victory for them as us. The weakest have been weeded out, and those left standing will throw everything they have to deny Pavolini his rightful place. He is prepared for the onslaught, may the strongest prevail!"
 ITA_a_meeting_on_the_libyan_coast_desc: "One cannot deny that Italo Balbo is a talented man - and one with a respectable amount of support. This support represents danger, but also potential opportunity should we choose to properly exercise it. Balbo and Pavolini are aware of each other, and while their visions are quite different, there is perhaps room for a temporary...alliance.\n\nOf course, the key word is "temporary." Allying with Balbo would be one of convenience and strategy - nothing more. More crucially, we will not enter into such an agreement without a plan for the aftermath - one which will ensure that Balbo is brought low. For a time we are content to be his ally, but when this time ends, he will not be able to stop the knife from plunging into his back."
 ITA_we_need_no_allies_desc: "There is a time and a place for allies. When in a contest to decide the fate of a country, one cannot afford to rely on the goodwill and skills of others. The leader must show unshakable strength, conviction, and vision. They do not need to compromise or fear their rivals, for he who deserves the throne shall succeed. Pavolini is not fooled by the overtures of his rivals - All these men show is that they are weak, and shall not survive without help - help we will not provide.\n\nItaly cannot afford a leader who is unsure, weak, or willing to compromise with enemies. A Duce must forge a path ahead, and rule the Empire with the strength and decisiveness that befits his position - unchallenged by the demands of so-called "allies". Let our rivals squabble among themselves. We shall not compromise our vision.\n\nOur march shall be alone."
 ITA_the_fast_and_furious_desc: "A fool, a drunk, and a deviant, Muti is an example of how far our nation has fallen. That a closeted socialist would come so close to the halls of power is sickening. Rightly despised by his party, Muti has nonetheless managed to tap into a swell of popular support - support that we require inroads into. Luckily, Muti is gullible enough that if we approach him with an offer of support, he would accept.\n\nHe is hardly a savant, and during this temporary alliance, we will subvert his base and properly show them who is truly needed to save Italy. He is foolish enough that when the time comes, he will be easy to destroy in the minds of the people and party. If pictures of his many parties and his numerous bastards from many women do not tarnish his image, then his socialist policies and utterly heretical understanding of "fascism" will bury him forever.\n\nWe shall see to it."
 ITA_propaganda_on_the_streets_desc: "The party knows that the strong leadership of Pavolini is necessary to save Italy, but it matters little that the party knows when so many do not. It is time to spread the message of why Pavolini is the only one capable of saving Italy. Through ads, speeches, papers and posters, we will share the words of Pavolini with Italy.\n\nEvery street of every city will show his face. Every radio and television broadcast will play his voice. Every Italian will hear his message, and it shall resonate in their hearts. In the end, we shall ensure that all from the lowest worker, to the highest official, knows that Pavolini is the one to usher Italy into a new era, and under a new order."
 ITA_smile_and_wave_desc: "The public perception of Pavolini is one that is admittedly less than ideal. He cannot simply be seen as a power-hungry or angry dictator, but a man who understands the people and who can be looked to with respect. We must immediately show the people the true Pavolini, and that comes from standing in front of them.\n\nWe shall arrange for rallies and speeches in the most famous and historic places in Italy, which will show the people the truth of Pavolini - that he is not a simple dictator, but a man who possesses the vision to bring order to the Empire, and lead Italy into a new era."
 ITA_hide_the_records_desc: "Pavolini is a man with many years of experience in the realm of politics and the Empire. This is an accomplishment worthy of great praise! However, the length of this record is problematic, as there are certain records within it that, if acquired by the wrong people, could be used to paint Pavolini in a negative light and tarnish his image.\n\nWhile such accusations would doubtless be groundless and taken out of context, we cannot rely on the discretion of the people to discern this, or our rivals to not pounce on the opportunity. We have an idea of what these records are, and where to find them. We will retrieve these records, and secure them in a place we control. For a select few, we will burn to ensure they can never be used against us."
 ITA_promise_the_corporates_desc: "The Corporates are an influential power in Italy, and one we cannot ignore. While they are undeniably a long-term problem, who possess ambitions dangerous for the nation, and are rife with corruption and crime, there is little to gain by alienating them now. Support we need from all quarters of Italy, and if we approach them with promises of help, they would almost certainly be receptive.\n\nThis is, of course, an alliance of convenience - one that will end once Pavolini takes his rightful place as Duce. It is worth leashing the Corporates and leading them on the desired path with promises of bribes, tax breaks, and important positions. Ignore the grumblings of the people for now - the time of the Corporates will come.\n\nPavolini will see to it."
 ITA_pavolini_a_man_of_the_people_desc: "Our efforts to portray Pavolini positively are already bearing fruit, and he is peeling more and more support from our rivals. However, this is not happening fast enough. It is not enough that he is viewed amicably - he must be viewed as one of the people. One who respects, understands, and cherishes them.\n\nOur public campaign must shift to reflect this, and we shall alter our slate of advertisements to show him more often with the common man and woman. We shall also fund short films and shows of Pavolini's life - emphasizing that he is one of them, a man of humble origins who has not forgotten his roots. A little embellishment here and there may be necessary, but it is for the greater good, is it not?"
 ITA_a_touch_away_from_the_throne_desc: "Another rival eliminated, and victory is no longer a distant goal - it is within our grasp. However - We cannot become complacent and assured of our victory quite yet, as there remains one more who stands in our path. This shall be but a temporary hurdle, and one which shall be crossed in short order.\n\nWhat is critical is that the end is in sight, and we cannot just focus on our final rival, but also make preparations for our victory. There are many on our lists to deal with, and we do not intend to let those who have stripped Italy for so long escape - preparation is key. The throne is within reach, and only one step more remains until the rightful man sits upon it, and restores Italy to her rightful place in the world."
 ITA_dirty_dirty_lies_desc: "The Lie is the oldest tool in politics. One so often is used with such disappointing crudeness. The Lie cannot be too outlandish or grandiose, else it will collapse under its own weight. The Lie cannot be too small, else it is inconsequential Many variables make up the Lie. Scope, context, and severity - each one must be carefully considered with crafting the Lie.\n\nMost paradoxically, the most effective of Lies cannot be a pure fabrication, but that which is wrapped around the kernel of truth.\n\nIt is time to use the power of the Lie upon our enemies. We have gathered many secrets, tidbits, and facts about our enemies, and while most of it is ultimately harmless, it will be used to serve our purposes, and twisted to destroy them. Our Lies shall be crafted to lodge themselves in the minds of others so strongly that they will not be able to be dislodged. When this barrage is concluded, our enemies will be tarnished forever, and crumble before the comparative purity of Pavolini."
 ITA_all_eyes_on_us_desc: "In a battle of influence, the one who commands the most attention will almost always be the victor. Pavolini knows this, and there is no better vehicle of influence than the media. It is a sprawling behemoth, but one which is easily understood and exploited. It has a direct connection to the hearts and minds of the people - and that is what we will tap into.\n\nWe will begin our control of the narrative by always putting Pavolini in the spotlight. Interviews, speeches, controlled leaks, rallies, and surrogates will ensure Pavolini dominates the media circuit. And if some of them become too critical, or focus a bit too much on our rivals, we have ways of ensuring the focus returns to us.\n\nThrough this, we shall starve our enemies of what they desire most - attention."
 ITA_promises_to_the_church_desc: "The Church is an entity we have a rocky relationship with at best. It is an unreliable institution, and would be better removed, yet unfortunately, the Church retains significant influence. While they will not use this overtly, their connections and wealth can doubtless make our lives difficult. It is best we do not antagonize them - for now.\n\nWe will go to them and promise that their autonomy will be retained, and to not upset the delicate status quo. In return, they will refrain from supporting our enemies - or even covertly support us. This is all a lie of course, as this agreement of convenience will be dissolved when Pavolini assumes control of Italy, and begins establishing the new order.\n\nNone, not even the Church, shall escape what is coming."
 ITA_assassinations_in_the_dark_desc: "When one engages in a contest for the fate of a country, there is nothing that is off the table. Every tool and method should be utilized to achieve victory, and there is no action too low or dirty that cannot be justified. Assassination is somewhat risky, but highly effective in terminating pesky opponents, and instilling fear in our enemies.\n\nWe retain several connections in the Mafia, and it is time to call upon them. A few payments here and there, in exchange for a few names, and we have gained some quite versatile assassins. Reliable, deniable, and effective, we will sit back and watch fear grip our rivals as their people begin dying.\n\nAt the end, when the smoke clears, only Pavolini will be left standing."
 ITA_ave_pavolini_gloria_al_nuovo_ordine_desc: "One by one, the enemies of Pavolini fell before him, and like many aspiring rulers before them, shall fade from history. Through vision, strength, and brilliance, Pavolini has taken the throne of Italy and now lays his sights on forming it in the new order he promised.\n\nThe world will now see a new Italy forged from the remains and foundations of the old. One built on strength, surety, power; the pillars of a new Empire that will not fall to the same failings of the old one. Now that none are left to challenge us, Pavolini shall begin his work in creating the new order.\n\nAve Pavolini! Glory to the Empire!"
 
