    Get_ITA_GCF_GUI_promises_tt: "Click to switch to §hbribes§!\n--------------\n§LUnlike promises, corruption will have an immediate monetary cost, and rather than immediately increasing support in a certain category, it will increase the support the Duce receives every tick in the chosen category. Also, while the promises have permanent effects on support, corruption will only last for the chosen phase, and will therefore have to be retaken in the next round. There is no limit to how many corruption interactions can be used each phase, though using too many might have some unforseen consequences...§!"
    Get_ITA_GCF_GUI_bribes_tt: "Click to switch to §Kpromises§!\n--------------\n§LEach candidate has promises to garner support among the Gerarchi. Each promise will grant some support in a certain group, but may also lose support among other groups with opposing views on the matter at hand. Also, at the end of the Quadrumvirate struggle, the winning Duce will have to fulfill the promises he made during it, or risk suffering the anger of the party.§!"
