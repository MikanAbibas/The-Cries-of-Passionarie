 ##Balbo Quadrumvirate Events##
 
 ITA_quadrumvirate.28.t: "Hearing the Reformists Out"
 ITA_quadrumvirate.28.desc: "Italo Balbo sat behind the desk in his office in Rome, across from him sat several members of the Reformist faction of the PNF. He had been spending much of his time as of late courting them in an effort to build a more solid support base within the PNF itself. He figured that their relationship would be a mutually beneficial one. After all, there's no way they wouldn't be purged by the more hardline candidates for Duce. He was their natural ally.\n\n"I must admit Balbo, you are the safe option here." One of the Reformists stated. "Pavolini and Giani would probably both see us shot. Still, Muti remains a viable alternative to you. Sure he may be a bit of a wild card, but why shouldn't we take a chance on him? What can you offer us?"\n\nBalbo paused to formulate a response. "To start, I can ease the censorship on journalists and the media, I'm sure that's something that would make you happy. As for what makes me a better option than Muti, I can promise Italy something it desperately needs, stability. I have a great amount of respect for Muti, truly I do, but all of us here know that his rule would be a chaotic and turbulent one."\n\nThe negotiations continued on for some time although it became clear to the Reformists that Balbo was the obvious choice fairly quickly. After another hour of negotiations the Reformists formally gave Balbo their support. With a few smiles and handshakes they departed Balbo's office, leaving him to contemplate his next move."
 ITA_quadrumvirate.28.a: "One step closer."
 
 ITA_quadrumvirate.29.t: "The Lions' Den"
 ITA_quadrumvirate.29.desc: "The High Command of the Italian military were an intimidating group of men. Composed of an array of Italy's finest and most-distinguished navy, army and air force officers, they shone with the prestige of empire-builders. They were the victors of the Mediterranean, the slayers of the British fleet and the conquerors of the Levant. Most men who approached them could not help but be intimidated by the craggy, grim faces of so many Italian heroes. Marshal Italo Balbo was not such a man./n/n He entered the room with his advisers and allies, smiles already appearing on the normally stoic faces of the military brass receiving him. They knew and liked Balbo - the old aviator was one of them after all, not a wild-eyed ideologue like Giani or a closet-communist like Muti. After he was satisfied with his glad-handling of and reminiscing with the old warriors, he got down to business./n/n "Gentlemen, soldiers of Italy, I come to you today to speak of the future, both Italy's and your own. When I emerge victorious from this squabble, I shall need the finest of the empire by my side. We have much work to do and the stability of the Mediterranean itself depends on our next few decisions," The aviator launched into explanations of a few of his plans to bolster the Empire's fading foundations including the networks of allies, agents and informants who would be recruited as well as which local collaborators could be relied upon and which ones needed to be "replaced"./n/n The officers were familiar with Balbo and had expected his opening bombast, but only those close to him had expected the cunning and clever schemes he had presented to the High Command while the others were surprised by his vast knowledge of every corner of the empire. One by one, generals, admirals and aviators came to Balbo with one question on their lips."
 ITA_quadrumvirate.29.a: ""How can I help?""
 
 ITA_quadrumvirate.30.t: "An Irritated Old Guard"
 ITA_quadrumvirate.30.desc: "This had better be good Italo, I'm missing a party in Genoa for this." one of the attendees complained, himself a senior PNF bureaucrat and member of Balbo's clique within the party. He had gathered them all into a small, stuffy room in his Naples office, and was starting to think it was a bad idea as the smell of angry sweat was already stinking up the room.\n\n"Worry not, you're all here for a very good reason. I have gifts for you all... on a condition of sorts" Balbo replied, hiding his annoyance at his colleague's hastiness. He had decided the best way to gain a one up was not exactly the noblest way, but certainly the easiest one. "You'll all receive a 70% increase in your salaries, appointments to cabinet and regional leadership positions, and will receive well-deserved contracts to various corporate assets across the Empire." he elaborated, drawing the room's attention, and calming the growing impatience that had been present beforehand.\n\n"What do we have to do then, to get you to the top?" Another senior party member, who seemed to be pushing 80, asked.\n\nBalbo's lips curled into a devious smile, as he began to underline his grand, all-encompassing plan to clinch the position of Duce of Italy". You and many others will be manoeuvred into important decision making positions within the party's apparatus without Scorza's knowledge, I and some others will encourage some retirements, bribe some others, and kill anyone who tries to squeal. We'll be golden within weeks".\n\nBalbo knew there would be hell to pay if anyone found out about his dealings, and some of the room groaned about how much work it would be and wanting specifics on their rewards. But he knew in the end they'd fall in line, he had done this before with some of the same old opportunistic leeches, this was simply on a grander scale."
 ITA_quadrumvirate.30.a: "Money and power are the seeds of yet more money and more power."
 
 ITA_quadrumvirate.31.t: "Shadow in the Night"
 ITA_quadrumvirate.31.desc: "Andrea Notero woke up with a start. As his eyes adjusted to the darkness, the party official made out a large shadow at the foot of his bed. His breathing froze, sweat breaking out across his face. He'd known the power struggle would turn nasty, but he hadn't imagined he'd be picked out for elimination so early. His thoughts turned to his wife breathing softly next to him and his children sleeping just down the hall. Were his children already dead or would the assassin go for them next? As he tensed to make one final attempt to survive, a cold whisper broke the silence of the night.\n\n"You will not move, or you, your wife and all your children will die tonight. Sit still, amend your behavior and this will all be a bad dream. Do you understand?" Andrea shakily croaked his assent, shrinking into the pillow away from the monster at the foot of his bed. "Good. You have been too friendly to Ettore Muti.You and your family will be much happier if you were to support a more... conventional candidate."\n\n The shadow moved again and Andreo flinched away again, shuddering as the cold barrel of a gun was pressed against his throat "Marshal Balbo seems like a decent fellow, and he certainly could use the support of an influential man like you," The shadow's voice had become positively mocking, delighting in its power over a member of the elite fascist gerarchi. "Your children and Italy will thank you for your support of the Marshal." Without another word, the shadow was gone and he breathed an exhausted sigh of relief. Despite the exhaustion that overwhelmed him, Andrea Notero did not sleep another moment that night."
 ITA_quadrumvirate.31.a: ""Papa, who was the man in my room last night?""
 
 ITA_quadrumvirate.32.t: "Walls with Ears"
 ITA_quadrumvirate.32.desc: ""Eagle one, target has departed from his home for the ministry of defense. We estimate you have a thirty minute window before the wife and her maid return, get moving!" The radio rasped and crackled at Marco. The lean Blackshirt grumbled to himself but exited the van, approaching the large manor owned by a prominent opponent of Marshal Balbo whose name Marco had forgotten. The name was not important, only the mission and the parameters were.\n\nClimbing over the wall was a simple task and Marco soon found himself sliding open a side door into the luxurious interior of the home. The target was clearly a well-off man, Fascism and the fruits of Empire had treated him well indeed. Throughout the finery and accumulated wealth of the typical fascist aristocrat, Marco sowed the bugs that would bring this particular target down. Marco did not know what this man liked, perhaps he liked hurting women, enjoyed drugs, took bribes or his tastes ran too young. Whatever it was, Balbo would know the crime, the sin, and it would be used to full effect. The fate of Italy rested on the current struggle, and if the Marshal said it had to get rough, then Marco would be the first into the muck.\n\nHis task completed, Marco speedily exited the estate, easily avoiding the lazy guard who barely glanced over his newspaper from his watchpost. As he walked back down the street, hat turned low, he saw the target's wife on her way home, oblivious to the ears waiting for her at home. When safe in the van, he contacted his commander to report his success before he moved on to the next house on the list."
 ITA_quadrumvirate.32.a: "The Marshal commands and they obey."
 
 ITA_quadrumvirate.38.t:0 "Le Truppe Cammellate"
 ITA_quadrumvirate.38.desc:0 "Italo Balbo looked at the spectacle in front of him, and smiled. When he had asked his adjutants to find him a large crowd and a stage for his grandest speech, he would never have expected the Coliseum itself! Adding to it, they had exploited a wide web of contacts and friends to divert a large part of Rome's bus service so that it would bring all his supporters to the Coliseum - it would wreck Rome's public transport for weeks, but it was nothing the Eternal City couldn't take.\n\nA small artificial platform had been built in the spot where the ancient Emperors used to sit. A subtle reminder at Balbo's eventual destiny, it was also a vantage point for his speech: he could see everyone attending the speech from the terraces, and all could see him, all fifty thousands of them - the full capacity of the Coliseum at the time of Vespasian and Titus, a number unreached since the last of Belisarius's games - and the millions following the speech at home.\n\n"Italiani!" He spoke into the microphones. "Thank you for being here: your presence is like a balm to an old man's aches! More than anything, it shows that there is still hope for Italy - that there is still hope for the Empire!"\n\nThe crowd cheered at his words, and when it abated the old aviator continued.\n\n"So many people, hoping for a better future! So many people, hoping for peace and prosperity! Lend me your strength, oh people of Italy, lend me your determination: may we prevail over those who would turn our beloved homeland into a place of oppression and tyranny, where our traditions are squandered in the name of ideology and radicalism!"\n\nThe people booed at the notion of such a horrible eventuality.\n\n"Icarus fell from the sky for his hybris, and we shall not make the same mistake! Slowly but steadily, we shall soar over the skies, together! I am old, my friends, but I have the experience to steer clear of evil currents and foul tempests, and I shall lead you to a beautiful future! We will fly above the clouds, and we will see the sun!"\n\nThe people erupted in cheers once more, and Italo Balbo spread his arms, basking in their adoration. He could feel it: victory was close, so close now!"
 ITA_quadrumvirate.38.a:0 "One last effort, and we shall triumph!"
 
 ITA_quadrumvirate.39.t:0 "Standing for the People"
 ITA_quadrumvirate.39.desc:0 "As always, Ettore Muti was surrounded by paparazzi. MinCulPop officials and journalists from Il Corriere, La Stampa, and many others vied for his attention, trying to extrapolate anything of use from his word: of course, Muti was always ready - one would say eager - to answer them.\n\n"Minister," one of the journalists asked, "for La Stampa. Could you summarise for us the focal points you will submit to the Grand Council's attention in the coming session?"\n\n"Of course! I am going to "submit" to the Grand Council" he said in a mocking tone, "That the people of the Empire are suffering! A decade of mismanagement from Galeazzo Ciano and his cronies have created poverty and unemployment on a scale unseen since the Great Depression: this is fertile ground for the Red Hydra, for it feeds off despair and envy for the rich!"\n\nThe journalists were all furiously writing on their small notebooks, while Ettore Muti had clearly turned the question into an impromptu speech.\n\n"I will submit to the Grand Council the hungry masses of workers laid down by capitalists in pursuit of the so-called private economy, which is an insult to the sacred principle of corporatism! I will submit to the Grand Council the oppressed masses of the Empire, who have not been "civilised" but instead turned into fuel for a malfunctioning machine! Fascism was born to surpass capitalism and socialism, not to turn into an incestuous freak of nature, and as long as I breathe, I will fight so that all may proudly define themselves fascists!"\n\nAs soon as he ended his speech, the journalists were surprised to hear people cheering and applauding. A small crowd had gathered to listen to Muti's loud rhetoric, and it seems it had worked the people in quite the frenzy: quickly saluting the journalists, Ettore Muti dived into the crowd, shaking hands and exchanging quick words with the people."
 ITA_quadrumvirate.39.a:0 "He is in his natural element."
 
 ITA_quadrumvirate.40.t:0 "Once Upon a Time..."
 ITA_quadrumvirate.40.desc:0 "All recruits stood rigidly at attention. Ettore Muti had decided to visit the barrack to "uplift the troops' morale" as the superior had explained, or - as Muti would have put it - to "have some fun with the youngsters" while wooing the officer corps.\n\nOver the course of the day, he oversaw the recruits' routine. He marched with them, ate with them, even sparred with them: though he was no longer in his prime, he still packed a mean punch, and many of the young men were too structured - enough to forget that a knee to the family jewels is a way like many others to end an engagement, especially when one does not have age on his side.\n\nAt the end of the day, the officer held a small speech, thanking Muti for his presence. When he finished, Muti took the podium to deliver his final salute.\n\n"Camerati!" He began, his voice booming across the hall. "Your officer is wise and capable: be grateful that you have someone like him to teach you the ropes!"\n\nThe crowd saluted the officer.\n\n"I was not so lucky, for I had no formal training! I felt the call of Italy's suffering and I left home: I was fourteen, but I did not care! I faked my documents and enrolled, because what I wanted was not honour or glory - I wanted to fight for our country, and win even if I had to crawl in the mud!"\n\nThe powerful rhetoric broke discipline, and many cheered.\n\n"When you love your country, you fight for it! Uniforms, discipline, even honor, are secondary: who cares if you have a fancy uniform or ragged clothes, who cares if you are too young or too old! If your heart is true and your aim is steady, you are worthy of all the medals in the world! Glory to the Empire, glory to fascism, glory to you all! When we reach the heavens, we'll salute God and present our weapons to him!"\n\n"Salus Imperii Suprema Lex Esto!" Ettore Muti screamed the beginning of the motto of the Regio Esercito, and the recruits roared the ending - which was also the first order Muti had received, when his line officer had sounded the charge from the trenches, that fateful day of 1916."
 ITA_quadrumvirate.40.a:0 "Avanti Savoia!"
 
 ITA_quadrumvirate.68.t:0 "Freedom Under Fascism"
 ITA_quadrumvirate.68.desc:0 "Piazza Vittorio was filled to the brim. Italo Balbo had come to Turin because it was the citadel of FIAT, Italy's largest automobile, aircraft and tank producer: it was a workers' city, and as such it was liable to being influenced by both socialists and Muti's lies. He wanted to sap them of their support, and he was confident he could count on the small bourgeoisie to help him reach the lower classes.\n\n"Italiani! My beloved countrymen!" He began, "It is such a pleasure to me, to visit the city where it all began: the Risorgimento, our wars of independence, Italy's unity and her path to glory all began here! Tall as the Mole Antonelliana, Turin stands as a beacon of prosperity and patriotism!"\n\nThe people cheered, grateful for his attention, and they gave him their own in turn.\n\n"However, Turin is also the city where our Constitution was signed! The Albertine Statute is the central pillar of our constitutional architecture, defining the rights and duties of all men and women: such a wise King Charls Albert was, crafting a document of such legal perfection and patriotic value!"\n\n"I am here to tell you that some of those who would wish to lead our Empire, are ready to do away with the Statute! They wish to create a totalitarian State not unlike the one to our North: a nightmare of oppression and violence, where no one is safe from the clutches of the SS!"\n\nThe people booed, insulting the Germans.\n\n"I will not stand for this!" Balbo continued: "As a loyal subject to His Imperial Majesty, I shall uphold his role as father and leader of our glorious nation! I will serve him to the best of my abilities, and the Statute will be a lighthouse in the dark, showing us all the path to prosperity and righteousness! Long live the Emperor, long live the House of Savoy, long live the Statute!"\n\nThe people erupted in cheers, chanting Balbo's name. The old aviator basked for a moment in their adoration, and between himself, he considered the irony of the situation: what fools the others were, trying to change the architecture of the State. To the clever man, the Albertine Statute offered all the needed avenues to exert control over the State: one only needed to have the intelligence to know where to look..."
 ITA_quadrumvirate.68.a:0 "All laws are open to interpretation, even a Constitution."
 
 ##Giani Quadrumvirate Events##
 
 ITA_quadrumvirate.42.t:0 "The Snake's Bite"
 ITA_quadrumvirate.42.desc:0 "Reputation is a fickle thing. One could work a decade building a perfect image of themselves, only for it to crumble away in a moment, like a sand castle left in the sun for an entire day: this was because constructed reputations were like rotten wood - fine on the outside, frail and ugly on the inside. Niccolò Giani knew this simple truth, and had made sure not to fall into it: he had always been true to himself and to the others, and this would be his armor and his sword.\n\nOver the years, he had witnessed his so-called "competitors" commit the foulest acts of treachery, corruption and debauchery, in pursuit of power and personal glory. He had watched from the sidelines, like a beggar in front of a church - unnoticed, uncounted, unplanned for: now, it was the time to strike, to reveal them that he was no beggar, but an avenging angel, sent to punish them all for their sins.\n\nSlowly but steadily, Giani's supporters were beginning what they called "the campaign of truth", an information campaign aimed at revealing to the people of Italy what their paladins were truly. Pavolini's schemes, Balbo's treachery, Muti's vices - all were laid bare, like a rotting carcass left to the vultures to be picked at, until nothing remains.\n\nFrom his office, Niccolò Giani read the newspapers, and for the first time in a while, he liked them. The people were starting to notice, they were starting to awaken: soon, very soon, they would see the truth - and then, he would win. As it was written."
 ITA_quadrumvirate.42.a:0 "Truth is the most powerful of weapons."

 ITA_quadrumvirate.43.t:0 "A Humble Beginning"
 ITA_quadrumvirate.43.desc:0 "Words have power. Such a simple truth, yet so deep: words could bring happiness, or push a person to commit suicide, bonds stronger than iron, or destroy them as if they were made of brittle crystal. Niccolò Giani had no strength compared to his opponents, no money, no important friends or contacts - but he had words, and they would be enough.\n\nGiani could not count on the party's support, so he had to create it himself. Day after day, he had visited the places where the desperate lived: hospitals, prisons, downtowns; he was insulted, he was threatened, he was ignored, but for a hundred who refused to see, one would open their eyes - and it would be enough, he knew it.\n\nSlowly but steadily, Giani built his own web of informants and supporters. They were few, but they were loyal: unlike the other contenders, he could trust them with his life, because to them, fascism was everything - HE was everything. They would follow him like bodyguards in his travels, and spread the word of the true Fascism where he could not reach: from them came his strength.\n\nWords have power. Such a simple truth, yet so deep. Such a simple truth, yet so powerful. Such a simple truth, yet so complete. Niccolò Giani knew it, and he would use it in full - such a simple concept, and yet it would bring him to victory."
 ITA_quadrumvirate.43.a:0 "Step by step, we march forth."
 
 ITA_quadrumvirate.44.t:0 "Poisoning the Future"
 ITA_quadrumvirate.44.desc:0 "There was violence in the air at Giani's rally. His supporters, frenzied from ecstatic belief, chanted his name and cavorted. If Giani's events normally had a religious analogue, one might connect tonight closest to a pagan celebration. It was certainly a departure from Giani's normally more somber events. Hatred infected every member of the audience, and as they chanted Giani's name they cursed another. The crowd called for Ettore Muti's blood and Giani was only too happy to encourage his followers' growing poison.\n\n "There is a red menace lurking in the halls of power," The teacher's voice rumbled "A snake slithers throughout the gerarchi, spreading his communistic poison as he goes. Always, he speaks with the snivelling voice of the cretin, the unbeliever. 'No,' says the snake 'the empire must be surrendered, we should abandon what we fought for and Duce Mussolini left us,'" The crowd roared with anger as Giani continued his vituperations "Whenever a word falls from his lips, we know it is a word to bring us away from the path laid out to us by our beloved Duce. We know that we must reject the snake and all who follow him. We know that the spirit of Italy and our movement is one based on firm principles. To be true to the fascist spirit, ideas of compromise, reform, and popular involvement are to be banished and rejected utterly,"\n\n Giani's manner softened briefly, and his manic energy seemed to falter somewhat. For a moment, each audience member relaxed with Giani. And then he had them again, his eyes piercing each of their hearts and souls.\n\n "It is a hard path to walk my friends. We are strong enough to bear the burden, but we must bear it together. Our spirits must remain strong and you must trust in your teacher." When Giani saw the looks in the audience's eyes, he delighted in victory."
 ITA_quadrumvirate.44.a:0 "Their devotion grows."
 
 ITA_quadrumvirate.45.t:0 "Venom for the Aviator"
 ITA_quadrumvirate.45.desc:0 "Thousands of torches blazed in the night, illuminating the rapturous faces of the rally goers. Not a voice could be heard throughout and silence hung in the air as the assembled crowd waited. The anticipation grew and grew, yet all eyes remained fixed on the stage, on one man at the center. Thousands' breath caught in their throats as their teacher approached the podium. Unconsciously, the crowd drew closer to the podium, eager to hear the speech to come.\n\n "We must always give thanks to our eternal Duce, the great builder of the Italian empire and my great mentor," The teacher's voice caught briefly, and the small look of sadness that flickered across Giani's face enthralled the thousands before him "It was thanks to the path he found, the principles and beliefs that he shared that Italy became a great Mediterranean empire, a force in Europe." With bright, wild eyes, the teacher's hand slammed the podium, the sound breaking the spell of silence and shocking the audience.\n\n "But alas, what a great man has labored to build, incompetents and worse can destroy in a fraction of the time. Mussolini had built a Garden of Eden, a paradise for the Italian people, should we prove worthy of it. Alas, the paradise has had a bad caretaker or two in its time, and it is clear that Marshal Balbo is among this number. Like a cursed gardener, all he holds turns to dust or worse in his hands. Give him the airforce, and even fine Italian engineering fails and we grow vulnerable in the skies. Give Balbo Libya, and in spite of Italian ingenuity and strength, it becomes poorer the more we work and invest".\n\n Giani continued his attacks on Balbo as the torches flickered, casting his follower's faces in shadow. With every honeyed syllable and vicious attack, he stoked hatred in his followers' hearts, ensuring they would continue to fight for the cause."
 ITA_quadrumvirate.45.a:0 "Snake in the garden."
 
 ITA_quadrumvirate.46.t:0 "Immoral Might"
 ITA_quadrumvirate.46.desc:0 ""Only a fool would argue that strength is a flaw. One must be strong to live, to deserve to live. But it is not enough to be strong. Strength can be weakened by laziness, outwitted by brains, or be used for ill-purpose. Strength fades with age and the ravages of time on the mortal body. One should never confuse strength with violence. For the truly strong must only rarely be violent," Giani followed the eyes of the audience, making sure each member followed every rhetorical turn in his sermon\n\n "When violence is tempered with corruption and disloyalty an even worse situation develops," Surprised mutters echoed throughout the crowd, swiftly silenced by a small gesture by Giani "I have been informed by extremely reliable and trustworthy sources of great flaws in Alessandro Pavolini's character. We know him as a strong man and as a violent man. He enjoys violence for its own sake, one of his many flaws. More concerning for our great nation is his abject corruption as well as his illicit connections to officers of the Teutonic monstrosity, Germany."\n\n The concerned mutters returned again, Giani's followers and most Italians knew Pavolini as the brutal commander of the Blackshirts, a hard man to be sure. His corruption had long been hinted at and rumored while the ties to Germany were more obvious. As Giani spoke he returned to each of these flaws of Pavolini, gracefully exposing Pavolini as a corrupt brute ready to sell Italy and her empire out to the German with the highest bid.\n\n Giani's venom spread through the crowd and hatred followed it, a chant going up for Giani and against Pavolini who became the new target of hatred for Giani's followers. Giani luxuriated in the adoring looks of his followers, the complete and abject trust each held for him, their souls shining in their eyes."
 ITA_quadrumvirate.46.a:0 "The truth revealed."
 
 ITA_quadrumvirate.47.t:0 "Infiltrating the Family"
 ITA_quadrumvirate.47.desc:0 ""Mother, it's playing again!" Enrico's voice startled his mother, the teenager sounded quite excited. Happy to see her normally sullen teenager perking up somewhat, Elena entered the living room. Enrico was transfixed by the luminous screen of the television, his lips parted and eyes wide.\n\n An angelic choir sang from the television as images of Christ and Mussolini overlaid the screen. The scene shifted and soon a bright and shining cross dominated a map of the Mediterranean. As the music swelled, a man appeared on the screen, austere and regal. Elena vaguely recognized him as Niccolo Giani, some Party big-shot. He seemed more like a priest than a politician, she thought.\n\n "My fellow Italians," He began, his voice instantly commanding their attention, "I bring the word of God to you in this troubling moment, where it seems all certainty and safety is gone. Though we may find ourselves in dire straits, we know that with faith in the twin spirits of Fascism and Christianity, there is no challenge the Italian people cannot surmount. We destroyed empires and surpassed Rome in the last war but have let rot set in as we rested on our laurels. With a reaffirmed commitment to Christ and Fascism, we shall see our future brighten and draw closer to the Kingdom of God,"\n\n Mother and son drank in the speech, sitting in awed silence as Giani spoke to a hidden and secret part of each of them. A tear rolled down Louisa's cheek and when the advertisement ended the two sat in stunned silence. The next morning, Louisa watched with pride as her son, a new fire lit within him, joined the marches in support of Giani."
 ITA_quadrumvirate.47.a:0 "The cracks begin to appear."
 
 ITA_quadrumvirate.49.t:0 "The False Moderates"
 ITA_quadrumvirate.49.desc:0 ""There are some, who mistake virtue in some matters for virtue in all things," Giani's authoritative voice thrilled his followers, the crowd already beginning to nod along happily "That moderation in diet, in alcohol or other such distractions is a license for moderation in virtue, in strength, even moderation in faith and fascism." His voice turned harsher and the crowd naturally followed him, anger beginning to coalesce through the devoted ranks of believers.\n\n "My friends, as we look around our country today, we know that moderation can do nothing for us. Indeed, it is moderation and not adhering to the proper principles of Christianity and Fascism that have led us to this crisis. Unwillingness to be harsh and unbending in our application of justice is a poisonous weakness we must cure ourselves of. This sort of weakness has brought the empire to its knees and only the enemies of God have cause to rejoice." He continued to stoke the fires within his followers' souls, piling more timber onto the blazes he had lit long ago.\n\n "And if our fellow brothers do not see the truths that we have to share, if they do not want to hear the words of God, then," Giani's voice sweetened, even as his eyes took on a steely glint "They must be made to hear. He who rescues his brother from ignorance and sin is beloved in the eyes of the Lord. The stray sheep from the flock must be wrestled back from the clutches of the Devil. And though the wayward soul may suffer some brief discomfort or privation, it is nothing compared to the fate that awaits unbelievers in hell or the rewards for the righteous man in the Kingdom of God."" 
 ITA_quadrumvirate.49.a:0 "The path of the righteous man..."
 
 ITA_quadrumvirate.58.t:0 "The Poisonous Flower"
 ITA_quadrumvirate.58.desc:0 ""I have spoken to you many times of the threats that face the Italian people and the empire. The weakness and corruption of our own leadership, the immorality and lack of faith in God and fascism, these all weaken us. But I have mentioned less often perhaps the greatest threat to Italy," Giani's eyes flicked across the crowd, pinning followers in place one at a time with a second or two of eye contact, delighting in watching his followers freeze in pure adulation, eyes widening with joy, whenever he made contact.\n\n "The Jew, with his sinister machinations and hatred of the Italian race, is the greatest ultimate threat to Italy. Like the snake in the garden, he waits to lure the pure Italian people from the bosom of God and fascism. To corrupt us into his twisted servants and make us like the debased and debauched weaklings of the United States. As servants of God, we must punish such wicked traitors wherever we find them." Giani continued his vituperations for some time, the venom and hate thickening in his voice, his eyes blazing with manic hatred.\n\n Like a hideous and poisonous flower, Giani's hatred bloomed in the hearts and minds of the crowd. With each new attack on the Jews, each inflammatory accusation and new blood libel thrown out, the fires in the eyes of the crowd grew brighter and their souls opened to Giani. There was nothing quite like hatred of another to bring a group together and Giani had learned this lesson well throughout his career. He knew each turn to take and every rhetorical twist to delight the crowd with. Giani continued for some time, the torches surrounding the crowd gradually dimming as the meeting grew darker and darker." 
 ITA_quadrumvirate.58.a:0 "The shadows grow..."
 
 ITA_quadrumvirate.59.t:0 "The Night of Hope"
 ITA_quadrumvirate.59.desc:0 "Nervous energy thrummed throughout the crowd before Giani. Ferocious belief burned in the eyes of the true believers and he could see prayers on their lips as they waited for his final speech. This moment had been long-coming, the culmination of his quest to return Italy to its proper path. With a smile playing about the sides of his mouth, the mystic stepped forward to address his followers.\n\n "My children, my friends, Italians, I welcome you to the Night of Hope. Tonight marks the final day before Italy's new era begins. It can be a true era, an era of light and strength, where truth prevails and Italy follows her proper path," Giani halted, exulting in the desire he could see in his followers' eyes before he continued "If we wish this to be our world, we must hold true to the principles of Mussolini and Fascist Mysticism and cast all else aside. We must give our souls to God and our lives and blood for Italy and the Empire. Anything less will bring us nothing but corruption and in turn ruin! We have seen the results of abandoning the true way, of abandoning God, of abandoning Mussolini!" Giani paused again, allowing his followers' fervour to plateau, to extend briefly before he continued heightening it "I shall build an Italy strong enough to protect our empire, an empire pure enough to resist all corruption and weakness, an empire faithful enough to deserve all the blessings of God as we build his kingdom on earth!"\n\n Giani reached his crescendo, his body trembling with exertion as he worked the crowd to ever higher highs of ecstatic belief. Cries of "God and Fascism!" began to ring out from the crowd, soon taken up as a steady chant. Thousands of voices began to repeat the slogan and soon to Giani it seemed as if all of Italy had taken up the chant." 
 ITA_quadrumvirate.59.a:0 "He would make Italy great, for no one else can."
 
 
 ###=====| a) GCF Events |=====###
 ITA_GCF.1.t:0 "Planning in Circles"
 ITA_GCF.1.desc:0 "Pavolini sat with his back straight and his eyes fixated like a soldier at attention, watching the council of fascism begin voting to oust him. He had seen it coming for a while, with his dwindling support from the public and slow alienation from the other councilmen, and it was only a matter of time. Ayes were declared and counted. The same with Nays. Despite his posture and supposed attention to the vote, Pavolini was mostly absent. His mind was alive with restless regret and a cold, calculating mentality rapidly overheating.\n\nHe was going through all the ways he could've prevented this, and not without a fair bit of wishful thinking and spite. He scanned over the events that led him here - the revolution, the war, the rallies, everything, digging deep over and over in search of alternate paths. His mind chased corridors of eventualities. Perhaps he should've leaned more into the use of radio, maybe he could've stirred the people into a frenzy like Muti or Giani. Perhaps he could've played up his authoritarian_democrat like Balbo. He could've shown the people warmth and assured them that they were protected under his guidance. He was, after all, always devoted to security. The vote was counted, and sure enough, Pavolini was off the council.\n\nHis thoughts only quickened, despite his blank face showing only a sense of dignified solemnity. The reasoning and exploration of alternate histories simply went deeper. Perhaps he could've bribed members of the council. Perhaps he could've made himself more distinguished during the war. Perhaps he could've put a bullet into every man here's head when he had the chance. He nearly said the last thought out loud, his noble visage cracking as he stared with unmatched contempt at his peers, who looked back with varying levels of disdain. Pavolini purged the thought from his mind and straightened his face. Intriguing as it was in his state of quiet fury, rage and hypotheticals would get him nowhere now."
 ITA_GCF.1.a:0 "Besides, people were starting to stare."

 ITA_GCF.2.t:0 "The Last Exile"
 ITA_GCF.2.desc:0 "Once again, Balbo was being cast out. The words of Scorza echoed across the cavernous council room, where the vote to remove him from the council had been set to take place. Balbo had seen his end coming, though he'd fought it on the airwaves, in the streets and in the council. Still, he could not win the favors of the people around him, all seeking their own rotten visions of Italy that he simply was not a part of.\n\nHe was infuriated, sure, but also grimly resigned to his fate. For the third time, he was being taken out of politics in favor of some goon and his destructive agenda, out of fear that he might pose a threat. He damn well would, too! There was a time when the people loved him, that Mussolini himself feared him enough to send him to Libya to sit around with his planes. Even in his exile, he made something of his situation and brought power to Italy's air force and returned home. When he returned, Ciano, too, cast him out because he refused to kowtow. Ten years he spent in the dry deserts of Egypt trying to hold that country together. Even in that exile, he made something of his situation, then returned home.\n\nThis time, he would not have the chance. His third exile would be his last. He looked around at his former peers, sitting at their desks and listening to the rest of the meeting, idly waiting for Balbo to leave. These people would not take him back, and he was far too old to bide his time like he did in Africa. His bones ached and his grandchildren awaited his return. No, this time it was over. This time he would not return for another shot at power. All his life, nearly 70 years, he spent climbing this ladder, falling to the earth and mounting it once again. Though he mourned the opportunity to take power, pleaded in the back of his mind for just a few more years, he accepted he would not place another foot on the rungs to success. It was over."
 ITA_GCF.2.a:0 "Rest, at last."

 ITA_GCF.3.t:0 "The Gambler Leaves the Table"
 ITA_GCF.3.desc:0 "The mood in the council chambers could be best described as an anachronistic mixture of fear, excitement and quiet apprehension. Of the men in the chamber, all veterans of the fascist cause, one would be cast out and their dreams of power and leadership dashed against the rocks. It was a tense moment for the potential leaders of the Italian nation, each of them sitting silent in their seats in anticipation of the vote. \n\nThat is, if they could just finish reading the minutes already, thought Muti. He had seen the writing on the wall and he wasn't fooling himself into any sort of ignorance of what the outcome would be like everyone else clearly was. He huffed, glancing around the dizzyingly ornate chambers and listening to the reverberating echo of the last of the bureaucratic drivel that needed to be drooled before the proper vote.\n\n"We will now call a vote." Declared Scorza. Muti sighed in relief. Finally they were getting somewhere. He wasn't an idiot. He already knew he'd lost the vote long before it was called, and every second spent dilly-dallying made this execution feel less like a shot to the head and more like a drawing and quartering. He had never understood this regime's obsession with drawn out ceremony and had earnestly promised himself to do something about that, but it seemed he wouldn't be getting a chance.\n\nAlready resigned to his loss, he quietly mourned his vision of Italy's future. He listened to their 'ayes' and their 'nays', casting his own futile yet spiteful vote against one of his rivals. Who knows, maybe he'd get lucky? He always did love a bit of risk. Sadly, that was not the case. His name was spoken, soon to be slashed from the record. Rather than sitting through a few more minutes of more unnecessary blather, Muti stood up, quietly collected his things, and left with his dignity."
 ITA_GCF.3.a:0 "Know when to walk away."

 ITA_GCF.4.t:0 "The Demagogue is Silenced"
 ITA_GCF.4.desc:0 "Giani drummed his fingers on his desk in the council chamber, his eyes wandering about the room as the men gathered prepared to cast their votes. It had been made clear from the onset of the meeting that there would be a vote as to who would remain in this struggle for leadership, in this battle for Italy's future. To Giani, however, it seemed like he was the only one interested in that fight.\n\nHe glanced around the room at the other attendees with disgust and worry. He tried to deny to himself the fact that very few of them could be considered to be on his side, and even fewer could be confirmed. His mind swayed erratically: on one side, indignation at their apparent willingness to allow the spirit of fascism to wilt in favor of twisted and self-serving approaches to the ideology that had made Italy whole; on the other, a stubborn refusal to accept that anyone would vote against him. Sadly, he could do nothing about this but wait, so there he sat as the votes were cast and counted.\n\nDespite his acknowledgement that his chance of victory was slim, his blood still boiled as the man at the head of the meeting declared that he would be cast out. Was this what Italy had come to? Is this what the council of fascism had come to? A meeting of drooling, spineless fools conspiring to assassinate the Italian soul? Their eyes were all on him now, and it was then he noticed he had gone from drumming the table to digging his nails into the varnish. He pulled his hand away. The least he could do to stay above these dogs was to not deface the beauty of the council chamber.\n\nHe bit his tongue and continued to sit through the meeting, until it was called to an end after an agonizing hour of being stared at like a freak. Still, he managed to force himself to resign to his fate through a reasoning that they would soon come to know what they had done when the very foundations of Italian society came crashing down. Collecting some veneer of calmness, he stood up and left the chambers, never to return again."
 ITA_GCF.4.a:0 "Good riddance."
 
 ITA_GCF.5.t: "All Hail The Black Augustus!"
 ITA_GCF.5.desc: "The square in front of Palazzo Venezia was gremite. The iconic balcony, from which Mussolini had announced Italy's intervention in the war and, five years later, the final victory, was the target of all the attention, with many onlookers sporting the distinctive uniform of the Blackshirts. They had come from the four corners of the Empire to see their dream come true: an age of Order, where none would be able to escape Justice.\n\nAs the window opened, thousands of arms raised in salute for Alessandro Pavolini, the new Duce of Fascism and supreme leader of the Italian Empire. The victor looked at this show of loyalty and obedience and felt the usual rush of satisfaction, but this time it was different, stronger: his power was absolute now, and it would only grow.\n\n"Italiani! Camerati! Fascisti!" he began, "this pathetic show of treachery has finally ended, and we have triumphed!"\n\nHis exclamation was welcomed by thousands of voices chanting his name, all in reverence to him. This was the reward for his efforts, and he would reap it in full.\n\n"We have strangled the snakes hiding within our ranks, but this is not over! Too many still resist the unstoppable tide of fascism!"\n\nThe Blackshirts erupted in joy. Finally, a leader worthy of their respect!\n\n"We shall not rest until all of the Empire is tinged in black! We shall not relent until all bow to our supreme authority! This unacceptable anarchy will. Be. Brought. To. Order!"\n\nAs Pavolini punctuated the last word, the crowd's voice overwhelmed even his microphone, so he simply raised his arms towards the crowd, and finally, at long last, he understood. Power was everything, and an existence without it was unworthy of being lived: an eternity of power, this was true heaven."
 ITA_GCF.5.a: "Du-ce! Du-ce! Du-ce!"
 
 ITA_GCF.6.t: "The Great Work Begins"
 ITA_GCF.6.desc: "The square in front of Palazzo Venezia was filled to the brim. The iconic balcony, from which Mussolini had announced Italy's intervention in the war and, five years later, the final victory, was ready for the new Duce's speech: microphones would relay Balbo's message to every home in the Empire, and the highest officials of the Party were already present.\n\nAfter a few minutes, the window opened, and the crowd erupted in cheers: Italo Balbo, Prime Minister of the Italian Empire and Duce of Fascism, had appeared. Clad in his white uniform of Marshal of the Air, the new leader of the Empire saluted the people below the balcony, smiling for the cameras.\n\n"Italiani! Loyal citizens of the Empire!" he began, "the time of inner strife and weakness has ended! A new era dawns for our beloved country, one of peace and prosperity!"\n\nThe crowd erupted in jubilation, chanting Balbo's name.\n\n"However, this new sun will not rise out of its own volition. We need to come together, as we did twenty years ago, and devote all our energies for one, last struggle!"\n\nFor a moment, silence fell across the square as the people wondered about the meaning of those words.\n\n"The time has come for the greatest economic battle of our time! Together, we shall reforge the Empire into a modern, prosperous nation, envied by all! We will not relent until poverty, misery and sadness have been banished out of our borders like the barbarians of old: we shall be reborn as a flaming Phoenix, a beacon of hope!"\n\nCheers erupted once again, and Italo Balbo basked in the people's adoration. This was his final chance, one last turn of the hourglass: he would save the Empire, and achieve eternal glory."
 ITA_GCF.6.a: "Du-ce! Du-ce! Du-ce!"
 
 ITA_GCF.7.t: "Rekindling An Old Flame"
 ITA_GCF.7.desc: "The square in front of Palazzo Venezia was gremite. The iconic balcony, from which Mussolini had announced Italy's intervention in the war and the subsequent victory, was filled with people, but all eyes were on one of them: the protagonist .\n\nEttore Muti, the new Duce of Fascism and supreme leader of the Italian Empire, looked at the crowd with satisfaction. Unlike some of the men on the balcony, he was wearing a simple, black shirt: it would be a key point of his speech.\n\n"Italiani! Camerati! Figli di Roma!" he began, "this charade is finally over! We have triumphed!"\n\nThe crowd cheered somewhat warmly, afraid of what would happen now. Would Muti rebuild the Empire, or destroy it?\n\n"I understand your worry, but look at me! This shirt" he said, fisting the creased fabric, "is just like me: old and wrinkled, but still glorious, for I wore it forty years ago, in Fiume!"\n\nThe onlookers started murmuring, some nodding.\n\n"When our country was abandoned by our allies and humiliated by our enemies, I stood! When we fought for our very survival in the greatest war of all ages, I stood!"\n\nThis time, many voices rose in agreement, screaming "yes!" and "we must stand!"\n\n"If you are not willing to stand for what you love, no one will! Rally to me, brave Italians, rally to the flag! A mighty cohort to turn the tide in this desperate battle! Stand for what you love, stand for what you believe in, and fight!"\n\nFinally, the crowd exploded, all cheering and chanting Muti's name. He could feel it, the raw energy that turns a nation into an Empire: it was still there, slumbering after decades of weakness and corruption. Bringing it back would require fortitude, but he was ready: he only hoped that his countrymen would be too."
 ITA_GCF.7.a: "Du-ce! Du-ce! Du-ce!"
 
 ITA_GCF.8.t: "Saving An Empire's Soul"
 ITA_GCF.8.desc: "The square in front of Palazzo Venezia was gremite. The iconic balcony, from which Mussolini had announced Italy's intervention in the war and the subsequent victory, was empty, save for a single person: he was the focus of all eyes, and his silence only brought all ears closer.\n\nNiccolò Giani, the new Duce of Fascism and supreme guide of the Italian Empire, knew the value of words, but also of silence. There was a time for both, and he would not break it until the right moment: now.\n\n"Italiani, Fascisti, fratelli," he began calmly, "for years we have suffered, praying for a deliverance which never came. We all prayed for someone, something, to lift us from this sorry existence, to provide for our families, and yet nothing came. Why did this happen, why did it happen to us?"\n\nThe crowd was confused. They expected a fiery speech, what was this?\n\n"Because you were lied to. The ones you believed in, the ones you put all your trust, and hope, and faith in, lied to you: they never wanted to help you, they never wanted to serve you. They served other masters!"\n\nHis voice suddenly rose, shaking the people from their torpor. Many nodded.\n\n"Today, however, is proof that you are stronger than them. You defeated them, you cast them back into the darkness they came from!"\n\nHis volume increased, and just like moths to a flame, the people flocked to the warmth of someone who understood them, without caring about the fire.\n\n"You have been so brave, and you will all be rewarded. The war, however, is not over: we fight not for power or wealth, but for our very soul, the soul of the Empire! We shall rise above the clouds hiding the sun from us, and we will see the light, together!"\n\nThe crowd cheered now, chanting their leader's name. Niccolò Giani smiled, relishing in this first success: he, all Italians, and the entire Empire could still be saved, and Fascism would save them all, as it is written."
 ITA_GCF.8.a: "Du-ce! Du-ce! Du-ce!"
 
 ## Fascist Italy World Events ##
 
 ITA_news.5.t: "Alessandro Pavolini Becomes Duce!"
 ITA_news.5.desc: "After a long power struggle in the Italian Empire, it seems that the victor has finally been dediced. Alessandro Pavolini, former Secretary of the PNF and leader of the fascist propaganda machine, has won the fight for the mantle of Duce: as soon as his victory was clear, Carlo Scorza announced his resignation due to "health reasons" and threw his support behind Pavolini, confirming that he was, after all, nothing more than a pawn.\n\nA radical fascist influenced by the national socialist thought, Alessandro Pavolini is hell-bent on bringing "order and discipline" to the Empire. Known for his amicable relationship to German diplomats, his ruthless efficiency and his utter lack of compassion in the pursuit of what he perceives as "the greater good", the new Duce is expected to inaugurate a season of profound reforms to the Empire's structure, with all the consequences this might entail.\n"
 ITA_news.5.a: "Gloria al Duce! Gloria ad Alessandro Pavolini!"
 ITA_news.5.b: "An Italo-German reapprochement? Not again!"
 
 ITA_news.2.t: "Italo Balbo Becomes Duce!"
 ITA_news.2.desc: "After a long power struggle in the Italian Empire, it seems that the victor has finally been decided. Italo Balbo, Marshall of the Air and former Italian plenipotentiary to the Middle East, has won the fight for the mantle of Duce: as soon as his victory was clear, Carlo Scorza announced his resignation due to "health reasons" and threw his support behind Balbo, confirming that he was, after all, nothing more than a pawn.\n\nA man of the institutions, and personal friends with the King, Italo Balbo reassures those who feared a more radical candidate would have prevailed. Known for his strong support for a rationalization of the colonial empire, and for his hostility towards the Reich, the new Duce is expected to inaugurate a season of great economic investments to resuscitate the Empire's ailing economy.   \n"
 ITA_news.2.a: "Gloria al Duce! Gloria a Italo Balbo!"
 ITA_news.2.b: "Can the old aviator keep the Empire afloat?"
 
 ITA_news.3.t: "Ettore Muti Becomes Duce!"
 ITA_news.3.desc: "After a long power struggle in the Italian Empire, it seems that the victor has finally been dediced. Ettore Muti, an Air Force officer known for his participation to the First World War and the Taking of Fiume, has won the fight for the mantle of Duce: as soon as his victory was clear, Carlo Scorza announced his resignation due to "health reasons" and threw his support behind Muti, confirming that he was, after all, nothing more than a pawn.\n\nA convinced follower of the Manifest of Sansepolcro, Ettore Muti gives hope to those who call for fascism's return to its older roots, when the movement had strong ideological ties - despite its rivalry - to socialism. Known for his love for Futurism, innovation, and strength of arms, the new Duce is expected to inaugurate a season of profound reforms to the Empire's very fabric, with all the consequences this might entail.  \n"
 ITA_news.3.a: "Gloria al Duce! Gloria a Ettore Muti!"
 ITA_news.3.b: "Will his reforms strengthen the Empire, or destroy it?"
 
 ITA_news.4.t: "Niccolò Giani Becomes Duce!"
 ITA_news.4.desc: "After a long power struggle in the Italian Empire, it seems that the victor has finally been dediced. Niccolò Giani, a veteran of the Greek campaign and philosopher of fascism, has managed to sideline his opponents until no one was left to contest his claim to the mantle of Duce: as soon as his victory was clear, Carlo Scorza announced his resignation due to "health reasons" and threw his support behind Giani, confirming the suspicion that he was, after all, nothing more than a pawn.\n\nA devoted follower of fascism, and founder of the School of Fascist Mysticism, Niccolò Giani gives hope to those who think of fascism as more than a mere political ideology - while causing terror in all others. Known for his intransigence and radicalism, the new Duce is expected to inaugurate a season of profound reforms to the Empire's very soul, with all the consequences this might entail."
 ITA_news.4.a: "Gloria al Duce! Gloria a Niccolò Giani!"
 ITA_news.4.b: "Do Empires have a soul, and can it really be changed?"
 
