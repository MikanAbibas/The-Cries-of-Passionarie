 ###=====| a) GCF Mechanic |=====###
  ITA_grand_council_of_fascism: "Gran Consiglio del Fascismo"
  ###=====| i) GUI |=====###
    ITA_GCF_info_tt: "§LDuring the time of the Quadrumvirate, each candidate will vie for control of the Grand Council of Fascism, the "parliament" of the PNF. Usually powerless and overlooked, acting mostly as a way for the Duce to gauge the mood of the party, the GCF is now vital, for their vote will decide who will be Duce: as such, each candidate will try to get control of as many Gerarchi as possible, by any way possible.\n\nThe Gerarchi are not a uniform group. Over the years, politicking and lobbying has created distinct groups of Gerarchi, each devoted to a certain aspect of the political life of the Empire, considered to be of paramount importance: as such, the candidates will have to assuage their fears, or §Kpromise§L them what they wish, in order to secure the vote of a certain group.\n\nThe candidates may also resort to... less legal ways of ensuring support: §hbribery§L is an old, tried-and-tested way to garner support in the short term, though this might have unforeseen consequences for the one using it.§!"
    
