 ITA_ave_muti_gloria_al_futuro:0 ""AVE MUTI, GLORIA AL FUTURO""
 
 ITA_we_must_change_desc: "Italy is a sickening behemoth, an old beast that is withering away. Where we were once looked to with admiration and respect, we are now seen as weak, stagnant, and helpless by ally and enemy alike. We cannot afford to remain on this path, lest we wish it to lead to our ultimate destruction. Yet too many remain blind to the needs of Italy - all except one.\n\nEttore Muti understands what plagues Italy. He sees the rot that has taken root, and the apathy that has consumed its leadership - and knows what needs to be done to save it. He alone has the vision and will to reverse our decline, and ensure that not only will Italy recover from this malaise, she will claim her rightful place in the world once more!"
 ITA_he_was_born_to_break_the_past_desc: "Fiume holds a special place in the heart of Muti. Once a young, passionate, but misguided socialist, it was his time in Fiume when he realized that true revolution was found in fascism. It has been many years since that time, but he has never forgotten the lessons of his youth, those which have shaped him into the man needed to save Italy.\n\nToo many would look at what Muti learned in Fiume, and decry it as a betrayal of the tenets of fascism, but nothing could be further from the truth. Fascism is not apathetic and stagnant - it is meant to adapt and change! Fascism is not a chain which holds Italy back, but that which allows it to reach its full potential - while guided by the vision of Muti."
 ITA_and_mold_a_new_future_desc: "They call him arrogant, childish, and foolish. Insults and degradation thrown about by men with no vision, or those who lack the courage to do what must be done. The old guard of the party are staunch in their incorrect beliefs, and see Muti's revolutionary future as a threat. Even some of the moderates view Muti's vision as unachievable, and yet another promise that will go unfulfilled.\n\nWhat these men do not realize is that without radical change, Italy will wither and die. Change elicits fear when one is content with the status quo, and it can be paralyzing to think of the possibility of a better world. Fortunately for these people, they need not do anything, as Muti possesses both the vision and will to make such a vision and reality.\n\nThey will be dragged into this future - whether they like it or not."
 ITA_and_fix_what_is_current_desc: "While our campaign is filled with promises of the future, we cannot focus on it to the exclusion of all else. There are problems affecting the common man everyday, ones that do not require complex solutions - only competence and resources. Understandably, not everyone can be excited for the future while they struggle in the present - it is important that we do not forget them.\n\nMuti understands the issues facing the common man, and will lay out clear and obvious solutions to them which can be universally approved. This may frustrate some of our more revolutionary and reformist followers, but it will show the moderates and old guard that we are capable of solving the problems of the here and now."
 ITA_the_rebirth_of_the_future_desc: "A vision of the future cannot be words alone, it cannot be vague promises, but a clearly articulated and easily explained movement to achieve maximum support. There is no movement that best encapsulate's Muti's vision than Futurism, which has unfortunately become an obscure movement - Muti will bring its rightful place at the forefront of the public consciousness.\n\nTo move into the future, we cannot let ourselves be chained by the old, but look to what is possible. Technology! Industry! Art! Medicine! War! Each of these things will be hallmarks of the nation of the future - which we shall be on the forefront of. Futurism will one more become a prominent movement, and Muti shall oversee its rebirth."
 ITA_the_issues_that_face_us_desc: "Does the sickness that plague Italy lack symptoms? Of course not! It was not as if these problems manifested out of nowhere. No! They were the natural and foreseeable consequences of past policies and governance. These are issues that were outright ignored, or crudely patched without solving the heart of the problem.\n\nEach of the men opposed to us promises nothing to solve the root of these problems, but would only opt to maintain the status quo, and continue the path of incrementalism and reactionary thought that brought our decline in the first place. Muti will not hold back in his righteous condemnation, and expose these men for who they are - cowards who offer nothing but platitudes and half-measures to the systemic problems of the nation."
 ITA_the_road_ahead_desc: "In such a campaign, there is no shortage of intrigue, danger, and opportunity. As we continue on, this has only become more true. The other candidates are seeing the support we have gathered, and their attacks have persisted and become desperate as they try and dent our momentum.\n\nFor certain, the road that Muti is on is dangerous, winding, and unpredictable - but it is nothing that he cannot handle! Above all else, vision and authenticity shine through and deflect from these foolish character attacks. Let them continue their futile strategy - No matter the obstacles and roadblocks manifest, he shall overcome them."
 ITA_smile_for_the_cameras_desc: "If policy and vision fail to enrapture a crowd, looks can pick up the slack. Intelligence and vision is all well and good, but at the end of the day, the people must be able to view their leaders as a proud symbol of their nation; the embodiment of their greatest virtues and values - and said leaders should look the part.\n\nFortunately, Muti possesses the vision and the appearance to best appeal to the people. Opponents have tried to turn this against him, yet no amount of smears and rumors can dampen his charisma or ability to charm the fine women of Italy. In a campaign like this, one must use every advantage they can - and there's nothing the papers like more than a good picture."
 ITA_train_with_the_army_desc: "The brave men who serve our nation's military deserve a leader who not only possesses the vision to lead them to victory, but intimately understands them and their struggles. Muti is a soldier himself, who inherently understands the fighting man better than anyone else and will do more than say it - he will show it.\n\nMuti will travel across the nation, and will not waste time with empty platitudes and promises - he will train as one of them. He will walk within their ranks and prove that there are none who will treat them with more respect than he. They must know that should war arise, their leader shall be willing to fight with them."
 ITA_convince_the_moderates_desc: "An unfortunate reality is that the majority are not yet willing to subscribe to Muti's vision. The good news is that they are receptive, but thus far, skeptics and cynics have won out and made them more reluctant to support us. That is something we can work with, as the people have a right to be skeptical after the failures of previous governments.\n\nWe shall work to persuade the moderates that not only is Muti's revolutionary fascism necessary - it is feasible. Hope and belief is what is needed - once the spark of fascism is once more lit in their hearts, the rest will fall into place - and with them on our side, our victory is all but assured."
 ITA_they_made_the_nation_weak_desc: "The other candidates are right to hate Muti - he exposes them for what they are. Relics of a bygone age, cowards who lack the spine to make the necessary decisions, charlatans more concerned with power and prestige than the citizens they are supposed to serve. These self-serving, cowardly, and short-sighted men are a microcosm of what has made Italy weak.\n\nMuti will not be silent, and his attacks will be augmented with the arrowhead of truth. They will smear him, they will attack his character, but they can do nothing but deflect from their own inadequacy. They will not be able to shake the truth which resonates in the heart of the people, as they come to realize it is these men who have brought us to our knees."
 ITA_the_rot_must_be_purged_desc: "Thieves, grifters, and criminals - each of these words is applicable to many in the government. For too long have bribery, nepotism, and incompetence been allowed to fester without consequence. Is it any wonder why the average Italian looks to the politician with skepticism and contempt? Indeed, why should they not when these politicians are often beneficiaries of such corruption?\n\nThe other candidates may give platitudes to assuage the people, but they will not be fooled. Muti understands the problem of systemic corruption, and will not simply give vague promises, but declare war on this rot in our nation. Corruption will be purged under Muti, and he will have the mandate of the people when he carries it out."
 ITA_no_place_for_the_old_desc: "We are reaching the final stretch of this effort - and victory is in sight. However, we are not done yet. The people have proven to be receptive to Muti's vision, but there remain some holdouts. Now that we have established the necessity of change, we need to further weaken their perception of the old ideas.\n\nOf course, we must be careful, lest they consider them attacks on the fundamental tenets of fascism and Italian heritage. Such attacks should be framed as a parent corrects a child - gently, but firmly. We do not need to obliterate the old - just show the people that it is necessary that we move beyond it."
 ITA_mussolini_wasnt_always_right_desc: "Mussolini brought Italy into a new age, but if we are honest with ourselves, he was far from perfect. The deification of Mussolini is proving to be a hindrance, and makes people reluctant to consider necessary change. While critiquing the philosophy of Mussolini will undoubtedly anger the old guard, turn off some moderates on the fringes, and open us to fresh attacks, it is a necessary step.\n\nIf we are to move into a new era, if we are to embrace the revolutionary spirit of fascism, then we as a nation need to come to terms with the fact that even our greatest were flawed. We must be clear that Mussolini was a great man - we just need to show that he wasn't always right."
 ITA_unity_above_all_desc: "There are some fixtures in our culture which should not be touched. Mussolini is one of them. While there is potential in attacking the pillars of the old equally, there is little that we would gain from bringing Mussolini into this conversation except alienating the very people we have worked so hard to sway.\n\nIt may be time for a different approach. We have spent much of this campaign attacking those who stand in our way, and with the end approaching, now is the time to call for unity. Man, woman, young, old, at the end of the day, we are all Italians, we are all fascists, and we all want a strong Italy - and if we come together to achieve this goal, nothing can stop us!"
 ITA_break_the_chains_desc: "What use is an economy that only works for the few? Is it an accomplishment to walk the streets of Rome and see the impoverished and poor? Such were not the concern of previous governments, but Muti will simply not accept this. The reality is clear - the economy is broken, and like all of Italy - it must change.\n\nWe will tax the corporations, break up the biggest ones, arrest the worst labor abusers, and the wealth of the executives will be seized for the state, and reinvested in the people. For sure the corporations will hate us, and they will oppose Muti even more furiously, but he has faced far worse than fat rich men. Let them sleep on their beds of gold and under their silk sheets - their days of privilege are coming to an end."
 ITA_not_too_fast_desc: "Change must come, but we have to be smart about it. We cannot simply force change through sheer force of will, but with strategic planning and careful maneuvering. Willpower is an important component, but that alone will not bring us victory - and there are many who still fear the shifting sands of change.\n\nWe need to emphasize a methodical approach, one which has clear steps and objectives. It may force us to take longer than we want, but this is undoubtedly the right approach. The reformists supporting us will be displeased, but better than change comes over a longer period of time and remain, than burn bright before being extinguished."
 ITA_a_new_wave_of_art_desc: "Art is the expression of the soul, it is capable of inspiring the masses, and stoking the fires of fascism in the hearts of the people. Art has been at the heart of many movements, and this one is no different - why should we not encourage this? There are many artists young and old who have such fires in them, and who can say what will be the spark to inspire the rest of the people?\n\nMuti will sponsor these artists promoting futurism and revolutionary fascism, highlighting them all across Italy - and will continue to do so after his coming victory. Let the art of the new generation inspire and inflame!"
 ITA_speeches_and_ads_desc: "Muti is a man of unmatched charism and wit, but he is only one person, and can only be in one place at one time. While his surrogates are skilled in sharing his fundamental message and vision, none have his words or voice. Thus, we must make sure that both are seen and heard by as many people as possible.\n\nMuti will focus on writing several speeches highlighting the core tenants of his vision, which will be broadcast on video and radio across Italy, as well as advertisements that condense such values and goals into memorable slogans. Muti's voice and vision will reach to the farthest corners of Italy - we shall see to it."
 ITA_ave_muti_gloria_al_futuro_desc: "Victory! A long and grueling campaign has come to an end, and now Muti stands unchallenged as the Duce of the Italian Empire. Weathering smears, insults, and lies, he has risen above such bickering and united the nation behind his vision - a vision he shall now begin to implement as he claims the seat of Italian power.\n\nLet the party tremble at this, let the corrupt and criminal fear the coming judgement, let the old and stalwart cower as they are swept away. Yet for all who fear the coming winds of change, let us elevate the people who rejoice as a true populist to achieve power, and the soldiers for one who will lead them into a glorious future.\n\nLet the world look upon us with trepidation. Change is coming to Italy, and none can stop what is coming. Ave Muti! Bring forth the glorious future!"

 #Giani branch
 
