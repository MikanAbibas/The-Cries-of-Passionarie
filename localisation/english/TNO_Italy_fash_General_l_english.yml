 ###=====| a) Quadrumvirate Government |=====###
 POLITICS_GRAND_COUNCIL_OF_FASCISM_DESC:0 "Born at the very dawn of Fascism, the Quadrumvirate consisted of the four most influential and powerful Gerarchi, chosen by Mussolini to advise him on political matters. As the regime integrated more and more closely with the apparatus of state, the Quadrumvirate was forgotten and mostly replaced by the Grand Council of Fascism as the Duce's advisory body. Until now.\n\nIn the years that marked the fading of Ciano's ineffectual tenure as Duce, the internal opposition coalesced around four powerful figures, and so the Quadrumvirate was born again. This second iteration, however, aimed not to help the Duce, but to remove him: a task that has now been achieved.\n\nWith one problem removed, however, another one arises. Each of the Quadrumvirs has radically different plans for Italy, for the Empire, and for Fascism itself, and none of them wishes to concede: four lions vie for the mantle of Duce in the political Coliseum of Rome, but only one can wear it..."
 
