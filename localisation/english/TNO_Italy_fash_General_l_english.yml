 ITA_ave_balbo_gloria_all_impero:0 "Ave Balbo, Gloria all'Impero!"

 ITA_we_must_be_strong_desc: "No one in Italy will ever deny that Italo Balbol, the would-be Duce, feels anything else but love for his homeland, in spite of the various issues plaguing it. Yet he is no blind to its problems.\n\nBut love might be enough to save it for its plethora of problems, for Balbo sees that Italy stands as a sturdy roof for the collapsing foundation that is the Empire. For this to never happen, Balbo has to stand strong for Italy, its Empire, its inhabitants, a lone light in the dark for Fascism across the world."
 ITA_invite_the_reformists_desc: "Though Balbo enjoys a certain popularity already, having more support is never an undesirable thing. Conveniently, the previous Duce has sideline many reformists within the party over the years, leaving us with a golden opportunity.\n\nIn our bid for Ciano's old title, we ought to entice these poor forgotten politicians in joining our coalition. And in order to kill two birds in one stone, we'll try to convince a few of Muti's supporters that are still on the fence concerning their support. A master stroke truly."
 ITA_ties_in_the_airforce_desc: "With such an impressive resume of his, it is no wonder that Italo enjoys a great deal of popularity within the Italian Air Force: having from the ground up the Royal Air Force in the late 20's, and having had a hand in the creation of its first paratrooper unit - Fanti dell'Aria -, the old man is seen fondly by the aerial wing of the army.\n\nTo not take advantage of this would be akin to shooting ourselves in our own feet: Balbo shall invite many of these military men in our coalition, for they too deserve a voice concerning the future of Italy."
 ITA_and_the_old_guard_desc: "The Old Guard of the fascit party is a powerful bloc, not to be underestimated when it comes to political decisions. Fortunately, they seem to see Balbo as a safe bet as candidate to Mussolini's legacy, certainly due to his status as one of the 'Ras' of the Fascist party in the days following the March on Rome.\n\nWith this in mind, it shouldn't take much to convince these relics from a bygone era to join our coalition. But one should still tread carefully, for we do not know what they intend to ask of our Duce for their assistance in his ascension to the title..."
 ITA_a_coalition_for_the_future_desc:0 ""
 ITA_the_woes_of_the_empire_desc:0 "The Italian Empire stands at the precipice, facing the humiliation of collapse. Should the empire crumble, it would bring down Italy as well, destroying our beloved homeland. Though there have been whispers of dissent, of withdrawal from our empire, we must redouble our efforts to raise the people's spirits for the coming struggles. We can still save our empire but time is running short. Luckily for Italy, and our unruly imperial subjects, Marshal Balbo, the hero of Libya stands ready to lead our people out of this nightmare.\n\nBalbo has many triumphs to his name, and is Italy's best option for leadership during this crisis. As he once drove the British to ruin in Egypt, now he shall lead the hunt for the empire's enemies, no matter where they may take refuge and restore peace and order. For the marshal, this is another opportunity to again save Italy in its darkest hour."
 ITA_i_saved_libya_desc:0 "Libya is an Italian success story, though it has had a troubled history. The great Marshal Balbo saved our precious Libyan territory from both the savages, who rejected good Italian civilization, and the perfidious British. Neither enemy could stand before old Balbo and his brave troops. Through his military genius Balbo saved Libya. 'Balbo saved Libya' shall be our watchword and our talisman against dissent. The triumphs of the marshal shall be plastered from the Alps to the Suez, gilding his reputation and helping to stabilize the empire.\n\nBalbo is a hero. He saved Italy in the past, and as he says: "I saved Libya". With the campaign spearheaded by Balbo and his mighty one-liner, the people shall feel by the marshal. Security shall gain the people's compliance, and the heroic Balbo's reputation shall further endear the people to the new regime."
 ITA_an_old_wise_man_desc:0 "There is a certain image of the Marshal that we wish to make widespread, universal even. The great Marshal Balbo must be known as a distinguished, wise, and reliable man, tempered by his age to have true wisdom. Marshal Balbo led Italy to glory in the Second World War, forging our empire in his campaigns against the British. We shall work to brighten his image further.\n\nAll across the country, posters and pamphlets will go up showing him as the grandfather of the nation. For every Italian, the great Balbo will be a comforting presence who nonetheless holds immense authority. The Marshal's insights on war, politics, culture and so on shall be publicized and his status as a rock of stability shall further strengthen as the people come to respect and love him."
 ITA_a_wide_smile_and_a_loving_heart_desc: "Not just a capable general and ardent nationalist, Italo Balbo is renowned for his wide smile and friendly attitude, a man who greets his friends warmly and treats his family with love and respect. Who in Italy does not love a warrior who knows the value of warm friendships and a loving family?\n\nThe Italian people already know about Balbo the hero, Balbo the general. We must make sure that they know about Balbo the good friend and Balbo the doting pater familias. We shall begin distributing photos to sympathetic newspapers for publication. It's cheap maneuvering, sure, but its effectiveness will be unimpeachable."
 ITA_on_the_offensive_desc: "Enough of this! We have been on the political defense for months, ignobly trying to defend ourselves from baseless accusations, lobbed by effete liberals and leftists. No more! We will take the fight to them. We will show the Italian people that we are the one thing standing between the Empire and the rot of decadence and the perfidy of communism, not by demonstrating our love for Italy and our capability to defend it, but by showing our opponents to be the moral degenerates they are!\n\nBegin distributing our new campaign materials to our loyal media outlets. The press, radio, and television of the true Italy shall unite in condemnation of our opponents, the opponents not just of the Party, but of the Empire itself!"
 ITA_secure_the_blackshirts_desc: "Ah, the Blackshirts. Loyal sons of Italy and vanguards of the Fascist cause. In theory, that's the case.\n\nIn reality, they are increasingly corrupt, divided in loyalty to various paymasters, all united under the perfidious Pavolini. Fortunately, there remain many true sons of Italy among the Blackshirts who are loyal to the Fascist cause. Many of them will be more than willing to aid us of their own volition, and it is certain that many Blackshirts with looser morals can be "persuaded" to aid us.\n\nThe Blackshirts will be instrumental for what we are planning..."
 ITA_knock_on_doors_desc: "We have enough Blackshirts to begin the next phase of our plans. We have identified several of Muti's supporters within the Party, and we have figured out their addresses and schedules. It will be very easy for us to knock on their doors in the night and persuade them to reconsider their erroneous support for Muti.\n\nThe Blackshirts have always been good at persuading people, so let's give them the chance to do what they do best..."
 ITA_plant_the_bugs_desc: "Now that we have struck at the base of support of the traitorous elements within the Party, we shall move on to the head of that support. Using our resources in the Blackshirts, we will begin planting bugs in the homes of important Party officials, in order to see who is loyal and who is a traitor. We must know who within the Party we can count on, and who must be persuaded later."
 ITA_you_cant_hide_from_us_desc: "Unfortunately, sometimes fear is necessary to keep people in line. Fear of the true sons of Italy, fear of the inexorable power of the Party and state. Mussolini understood this, but the Party has long since forgotten the need for fear, as the Council's members grow fat and decadent.\n\nBut it is the place of the wolf to strike at the sheep, the place of the lion to rule over the antelope. We shall use the Blackshirts. With bugs, castor oil, nightsticks, bullets, and shallow graves, we shall provide the opponents of Balbo an object lesson.\n\nOnce more, the Council will know fear."
 ITA_propaganda_in_every_home_desc: "The loyal Italian press already extols the virtues of Italo Balbo, but this is not enough. Only those who are already inclined to listen to our pet journalists will even hear about Balbo, our modern Scipio. We must make sure that everyone listens to us about him. We shall make sure that Balbo's virtues are extolled in every household, every radio and television broadcast discuss his glorious victories for the Empire, and that they may see the work he has done in bringing Italy to the fore of world politics. All Italy must know-shall know- that Italo Balbo is the only one virtuous, strong, and dedicated enough to lead Italy into a golden age surpassing that of Augustus and Trajan!"
 ITA_balbo_speaks_desc: "Our propaganda machine is working day and night to fill the public consciousness with our message and to discredit our enemies, but it's still not enough! All the material comes from previous speeches and writings, we need something new for the public. Our newest idea is to have Balbo doing live speeches on radio that will be broadcasted from every station to every corner of the Empire, and when he speaks everyone will stop what they were doing and will listen! Keeping Balbo's words in your heart is your patriotic duty, and you don't want people to think you don't love our country, capisce?"
 ITA_they_want_to_take_away_your_freedom_desc: "We have used intimidation to weaken the support of the traitors, and our propaganda outlets to strengthen that of Balbo. Now we must turn the ire of the loyal Italian press against Pavolini and Muti, to convince the public that they are traitors and anti-Italian.\n\nWe will use our news apparatus to show Muti and Pavolini as enemies of Italian freedom, how they treat their fellow Italians and how they engage in the degeneracy of the era before Mussolini away from the public eye. All Italy will know these people for the cowards they are!\n\nWill some of these charges be fabricated? Of course. But there is no reason for the public to know that."
 ITA_can_you_hear_the_people_cheer_desc: "On television screens, radio networks, and newspaper headlines, we find his name. Italo Balbo's praises are sung across Italy as he leads Italy into the future. People lean out from their apartment windows to cheer his motorcades, attempting to get a glance, wave or a smile from the man who courted Italy herself.\n\nNot only is this, well, flattering, it also puts us a few steps toward our next plans. With the people practically swooning over the man, it is only a matter of time before he's secured the hearts and minds of the people and the loyalty of every inch of this fair land. Just a few more tips forward will do."
 ITA_the_most_grand_of_speeches_desc: "Circus Maximus. The birthplace of a great deal of Roman culture, and a treasured heirloom at the heart of Italy. Its seating can hold tens of thousands, its walls stand ancient and resolute, and it belongs to us. Balbo, in his wisdom, has managed to secure Circus Maximus for a grand speech.\n\nAttendance is assured, as tickets are free, so all of Italy will hear his voice. The nation is within our grasp, and we will seize its heart and tighten our grip around it with the power of Balbo's honeyed words. He will promise to make Italy strong, to bring glory to her people, to hold fast against the test of time as the walls of the Circus have, and he will keep these promises, God willing."
 ITA_ave_balbo_gloria_all_impero_desc:""
 
 #Muti Branch
