 ITA_we_must_be_pure_desc: "If Heinrich Himmler was right about one thing, it is that fascism cannot fail, but can only be failed. And that is what has happened to Italy. For almost a decade since Mussolini's death, the corrupt establishment has done nothing but spit on his legacy. They have preached the virtues of the Italian nation while giving refuge to Jews and Roma. They have claimed to oppose materialism while taking bribes from industrialists and bankers. They have granted endless concessions to mud-skinned Arabs and degenerates, fueling Italy's moral degeneration, all in the name of stability.\n\nBut with the rise of Niccòlo Giana, hope has returned to Italy. He is the only one that can diagnose the spiritual malaise that threatens to devour the Italian medicine, and supply a cure for it. For it is only he who truly understands the essence of fascism, the animating spirit that uplifts all members of the Italian race, and, when nourished, will lead them to greatness. This medicine will be bitter. Many will perish in the process of its application. But that is the necessary evil that must be undertaken if Giani is to save Italy. He will teach them all a fundamental truth:\n\nThat there is no God but fascism, and Mussolini is its prophet."
 ITA_spread_the_poison_desc: "Like a reborn David, we are facing not one, but three Goliaths. Their power and influence, both inside and outside of the Party, is unquestionably much bigger than ours: if we are to prevail in this Pit of Lions, then we need to do as the Biblical hero.\n\nWhy face your enemies head on when you are certain to lose? It is much more convenient to exploit their own weaknesses and moral flaws: spreading lies and bribes will help us sow discord and treachery within their ranks, and when the time is right, we'll throw our stone..."
 ITA_divide_them_desc: "Our enemies, like the degenerates they are, look at each other like enemy lords from their respective towers. They hide behind a façade of harmony, but they - like us - are constantly planning their respective demise: it is time to exploit this discord, and make it the weapon that will bring us to victory in this hellish fight.\n\nViolence is already rising among the various factions, a very useful circumstance. By spreading rumors of attacks against supporters of the various contenders, and making sure that the blame is laid on this or that Gerarca, we can crush alliances before they are made, and stoke rivalries where there were none: as our ancestors used to say, Divide et Impera..."
 ITA_march_through_the_streets_desc: "Our supporters are not many, but they are brave and zealous. For many years, Niccolò Giani and his most ardent followers have preferred the closed rooms of the School of Mystical Fascism, but new challenges require new solutions: if we want to spread our message, then we need to be as loud as we can!\n\nIn order to gain more supporters, we need to take our gospel to the streets. We shall march across all Italian cities, praising our leader for his indefatigable efforts to better the state of the Empire, and accusing our opposers of having betrayed all Mussolini believed in: should the need arise, we'll prove our superiority in combat too!"
 ITA_conquer_them_desc: "It seems our enemies are so sure of their power that they refuse to consider us as worthy rivals. The time has come to shake them from their convictions: we will not be set aside so easily!\n\nTo this end, we shall escalate the conflict. In this savage world, those who are not strong will be devoured by those who are: with ruthless attacks and threats, we shall clear the way to power, advancing on the bodies of the cowards and the degenerates!"
 ITA_a_direct_hit_desc: "The axe has fallen upon one of our competitors. We take pride in knowing that we held them in place as the executioner let the blow fall, but we have no time to celebrate: the fight will soon resume, fiercer than ever.\n\nLike beasts forced to fight in a cage, we have already learned all our respective tricks. Trying underhanded methods as before would simply be a useless waste of time and energy: now, the time has come to aim at the throat."
 ITA_the_degeneracy_of_muti_desc: "Ettore Muti has finally decided to take his mask off, revealing the degenerate lying behind. He has started to criticize Fascism, telling misguided people that it "must change to save the Empire" and that "the people need to take the helm": it takes little intellect to spot the red Hydra speaking through his foul mouth!\n\nAs if this wasn't enough, he has dared to say the unspeakable. In the last speech, he criticized Benito Mussolini, our Founder: such blasphemy can no longer be tolerated, and must be revealed to all the loyal citizens of the Empire, starting with the Council!"
 ITA_the_destructiveness_of_balbo_desc: "If one looks at Italo Balbo's career, they will find a remarkable trail of destruction. Through the years, everything he touched has withered and died, like a cursed gardener: Libya is poorer than ever, the Regia Aeronautica is a den of corruption and nepotism, and Egypt - no, the entire Middle East - is on the brink of collapse.\n\nThe people must know what kind of criminal Italo Balbo is. They must understand the consequences of letting this man take on the mantle of Duce: he has destroyed everything he touched, and the Empire is his next target!"
 ITA_the_lunacy_of_pavolini_desc: "Undoubtedly, the quality that can best describe Alessandro Pavolini and his political thought is lunacy. No one but a lunatic would think it possible to control Italy not through example and loyalty, but through corruption and fear: such a plan is nothing short of a recipe for disaster!\n\nLuckily, the madman is also providing us with the very gun which will end his misery. We have found... interesting documents detailing correspondence and even bonds of friendship with several important German officers: such treacherous contacts with the Northern enemy must be revealed immediately!"
 ITA_a_light_shining_from_the_pit_desc: "Like the martyrs of the old tales, we have been thrown into this Pit of Lions for the entertainment of the decadent, kleptocrat elites. Those brave men and women did not cry for mercy as they were torn apart by the beasts, and neither will we: pain and fatigue are our comrades, and as true Fascists, we shall not bend!\n\nIn this hell of corruption and violence, we still show our Faith in Fascism, and among us, one man shines more than everyone else. Niccolò Giani, our leader, leads us even in this greatest of dangers, his example showing us the way to Redemption: let all Italians witness his glory, and find new purpose!"
 ITA_united_in_their_faith_desc: "As diverse as we are, all of us are united in our belief in the true Faith. Fascist Mysticism is not just a political ideology: it is the path to Salvation, in this life and the next, and we shall save all Italians!\n\nIn order to achieve this, however, we will need to spread the Word to the lost souls of the Empire. So many have been swayed by false Fascists or - even worse - by the red Hydra: it is our sacred mission to bring all Italians back into the fold, and together, forge a new path!"
 ITA_lost_in_their_cause_desc: "The Grand Council of Fascism should be united behind the Duce, a competent and loyal advisory body. On the contrary, right now what we have is a divided assembly where corrupt and incompetent bureaucrats desperately try to suck Italy dry in their quest for personal power: such a thing must end.\n\nThe Council must understand that it's either with us, or against us. Should they choose the latter, then we shall show them the consequences for betraying Fascism itself: our victory will come, and then they will all suffer..."
 ITA_giani_spread_the_word_desc: "Accusing our enemies of being false Fascists will lead us nowhere if the people don't actually know how deep their mistake is. In order to prove our true Faith to the people, we need to spread the Word: only then will all Italians understand how much they have been misled by corrupt kleptocrats and traitors.\n\nTo this end, we need the media to take our message to all households. Newspapers, radio, television, mass rallies, everything will be used: our voices will not cease until our throats are parched, and our fingers will not stop until our wrists are broken!"
 ITA_blame_it_on_the_vipers_desc: "The Empire is the shadow of what it used to be, and we have the answer to all problems. Despite their inherent barbarity, the Germans understood it clearly: we have nourished a viper in our bosom, and it has bitten us in turn.\n\nWho is this viper, you might ask, who would be such a snake that they would betray the very hand feeding them? Of course, it's the Jews: they are the cause for the evils plaguing Italy, and they have corrupted the establishment to do their bidding!"
 ITA_destroy_the_corporates_desc: "The Corporates are a small but extremely influential group of Gerarchi. Thanks to their ties to the industrial conglomerates, they can de facto control the Italian economy, and of course this has brought much money into their pockets: bribes and stealing are crimes against the state, and they will pay for their sins!\n\nBy exposing their treachery to the rest of the Council, and to the Italian people, we'll destroy their influence. Adding to that, sectors of society opposed to corruption - especially in the army - will look at us with favour: their strength will propel us to victory!"
 ITA_wipe_out_the_moderates_desc: "The Moderates are a large and influential group of Gerarchi. Counting among them several prominent State officials, with deep ties to the Court, they fear change, sensing it as a threat to the status quo they love so much: their adherence to stagnation and decadence must be stopped!\n\nDesperately clinging to the status quo is what brought us into this quagmire, and the people must know it. By laying the blame of our current woes on them, we'll surely inflict a devastating blow to their credibility and influence: with the sword, we shall cut ourselves a path to victory!"
 ITA_a_man_of_fate_desc: "Our leader, Niccolò Giani, is a man of Fate and Faith. He is a man of Fate, because he rose at the moment of the Empire's greatest danger, to save it from its enemies, but he is also a man of Faith, for he believes in Fascism: salvation of the soul through dedication to the Empire, a clear path to Heaven.\n\nThe times of the School of Fascist Mysticism are over. Now, we fight for the soul of the Empire, and we need everyone to help us in our sacred quest: let our glorious leader guide us to victory and our eternal reward!"
 ITA_and_the_faith_of_the_nation_desc: "Faith in Fascism is, first and foremost, Faith in the Empire, for it is a bringer of civilization, and hope for the Italians across the globe. Our great leader shall ensure our salvation, protecting our greatest achievements from the barbarians lurking outside: our glory will be enshrined and made eternal!\n\nAll we need in order to restore the Empire to its golden age is to follow Niccolò Giani. He knows what to do, and he shall do it, no matter the odds, no matter the means, no matter the cost: if all Italians are taught to love Fascism and the nation, nothing will be impossible!"
 ITA_ave_giani_ave_fascismo_desc: "For more than a year we, a small maniple of Faithful, faced the overwhelming forces of Darkness. The battle was long and hard-fought, and we lost so many good comrades, but in the end the result was as it was written: the Righteous have prevailed, and now the broken bodies of our enemies lay before us.\n\nA new age will soon begin for the Empire. An age of glory, of prosperity, of Faith: it will be a beautiful, exciting age, and if the Italian people understood the lessons of the past, it will be eternal.\n\nLoyal citizens of the Empire, raise your arms in salute for your new leader, for the new Duce of Fascism! Scream you joy, let him hear your reverence!\n\nAVE NICCOLÒ GIANI, AVE AL FASCISMO!"
 
