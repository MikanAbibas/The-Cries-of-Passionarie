 ###=====| a) Inauguration Tree |=====###
 ITA_black_augustus_crowned:0 "Black Augustus, Crowned"
 ITA_black_augustus_crowned_desc:0 "With our inauguration as the new Duce of Italy proclaimed, we must begin our work immediately. Our first order of business will be to ensure the empowerment of the PNF as if we are to begin properly integrating our administration to the Empire, we should ensure there is no opposition to our rule. Ensuring that the Quadrumviri reigns unopposed will be our first long term objective, as will be to ensure the stability of the nation as a whole. Afterward, the path lay clear for a new Italy - one free to march towards a prosperous future."
 
 ITA_the_victor_writes:0 "The Victor Writes"
 ITA_the_victor_writes_desc:0 "Who's to say that Fascism hasn't been... misinterpreted, over its extensive history? Now that we're in power, we need to ensure a legacy of Fascism, and if that means "Highlighting" our more memorable, positive history while "downplaying" some of our less desirable memories, then so be it.\n\nThis will start with the beginning of printing new history books for the youth, alongside some new state-influenced pieces of media, focused on driving away attention from some particularly painful memories. We can start with the printing of new school textbooks for the children, as well as propaganda posters for their parents. And if anyone tries to encourage anything to the contrary? We'll make sure they join the likes of Ciano's Liberals."
 
 ITA_take_the_stage:0 "Take Back the Stage"
 ITA_take_the_stage_desc:0 "With the only proper choice for the Duce confirmed in his position, it is time for Italy to celebrate! Let the people on the streets, let the talking heads on the televisions, and let the sea and sky itself sing the praises of Alessandro Pavolini! We will broadcast speeches, plan rallies, and plant posters all over Italy until the public recognizes his greatness.\n\nNaturally, within this pro-Duce programming there are subtle implications of the fate that will befall those who oppose him. Whether they will lose their positions or their heads, those who oppose Pavolini will rue the day they chose to cross him. Let the people know this, lest we be accused of blinding these lambs to their oncoming slaughter."
 
 ITA_erase_sansepolcro:0 "Erase Sansepolcro"
 ITA_erase_sansepolcro_desc:0 "An interesting assessment some people seem to have made over Fascism is that it is compatible with the views and beliefs of Communism. Of course, this is nonsense. Communism is nothing more than a disease that is advocated by those who would rather see nothing more or less than the downfall of Italian civilization. They must be surpressed.\n\nWe shall begin with the more vocal elements of the movement, moving to cut off the head of this treacherous snake. Afterward, we'll move on to the insubordinate Bureaucrats within our ranks, skinning the terrible Snake, most likely from the old guard we have yet to purge. Finally, ensuring that the Students are quelled will mean the end of such a moronic notion as a "Socialist Fascism", as well as an Italy free from this terrible disease.\n\nNobody tell Muti."
 
 ITA_wipe_the_slate_clean:0 "Wipe the Slate Clean"
 ITA_wipe_the_slate_clean_desc:0 "The word "purge" has such dirty connotations, but the promised reorganization must come. After all, the Duce has no need for those within his administration who do not hold their first loyalty to Pavolini and to Italy. We will ensure that those with their priorities aligned properly remain comfortable, but the rest must go.\n\nThe meek and powerless amongst the discharged will live to experience our new Italian Golden Age, but anyone who poses a threat to the Duce must be met with a more permanent solution."
 
 ITA_empty_the_offices:0 "Empty the Offices"
 ITA_empty_the_offices_desc:0 "Feudalism is long dead in Italy, but one would not know it by looking at the list of office-holders in the colonies. These administrators seem to be selected from a pool consisting of beneficiaries of nepotism, old men, and incompetents. This cannot be allowed to persist, not if Italy wants to maintain the respect it deserves as a world power.\n\nNo, instead these colonial officials will be replaced with men both loyal to the Duce and competent. With a good strong hand of governance, perhaps the natives can be made to contribute to their nation. Our colonies will no longer be bits of land governed by undeserving layabouts, but instead well-oiled aspects of the Italian machine!"
 
 ITA_evict_romes_traitors:0 "Evict Rome's Traitors"
 ITA_evict_romes_traitors_desc:0 "Even in the capital of the empire, there is a rot that should be expunged. The party is not without traitors and splitters, those who even now contest the agenda of the rightful Duce. As Italian patriots, we cannot allow such worms and snakes to make their bed in the Eternal City!\n\nThe solution is as simple as it is varied. Some men will be sent to far away posts, some stripped of party membership altogether. Those who can be proven to be of treasonous stock will be judged before the law and sentenced accordingly. When all this is done, however, it will be clear who holds the power in Rome."
 
 ITA_crush_the_old_guard:0 "Crush the Old Guard"
 ITA_crush_the_old_guard_desc:0 "Although the rulers of the unfortunate past are dead - Ciano, Mussloni, and every other fool who decided to challenge the rightful Duce - their rabble-rousing and most ardent supporters remain in the very core of our government. Worse still, the supporters of one particular former candidate continue to subtly sow dissent - they plot against the Duce in hushed tones, behind the screen of their supposed power.\n\nThis, of course, will not be tolerated. The Black Augustus reigns supreme, and with his power comes the duty of eliminating the very decadence that has driven Italy to this forsaken point. Any of the former king-makers of the days of Ciano and Mussolini shall be removed - either by bullet, or by less conspicuous means. Of course, we cannot go after the truly important just yet; they retain too much power. Instead, we will further extend our current efforts in purging potential counter-state operatives, or, in other words, any former and present supporters of our moronic competitors.\n\nIf the powers of the past are truly die-hard in their support of the losers, well, perhaps it may be necessary for them to fulfill that namesake.\n\nLoyalty is a mandatory trait in the Duce's grand new Empire, and all shall have that fact burned into their skulls every second of the day!"
 
 ITA_end_the_dissent:0 "End the Dissent"
 ITA_end_the_dissent_desc:0 "The sheer scale of the public resistance against the new Duce has been staggering - young Communist students brazenly protest in the streets, the core of the Party is rotten with clusters of disappointed officials who subvert us at every turn, and the populace at large seems genuinely opposed to our new regime.\n\nFor the sake of the continued stability of Italy, this state of affairs shall end. How exactly we achieve this is up for debate, but one thing is clear: the most popular of dissenters will be eliminated from the picture.\n\nWith every minute that these dull-witted partisans survive, they dig their teeth into the very core of the State. Every second that these foolish individuals are not disposed of entirely, they attract yet another inevitable casualty - an utterly ridiculous state of affairs.\n\nThe whining complainers will cease - or they will personally see that the new Duce is not so forgiving to those who dare act against Italy. "
 
 ITA_with_fire_and_lead:0 "With Fire and Lead"
 ITA_with_fire_and_lead_desc:0 "The Duce has no time for the ever-changing moods of the gullible populace to shift to his advantage - dissent must be crushed before it's dark tendrils spread in a breadth impossible to contain. Any paper, any organization, any person that opposes the up-and-coming regime will be destroyed - by any means necessary.\n\nWe especially don't have the time to make a grand spectacle of it - in difficult times such as these, quick, cheap, and sadly sloppy action is required. Once our suspect is sighted, operatives shall step out, withdraw necessary firearms, and dispatch the subject. Ideally, of course, this state of affairs will end once the immediate blowback is finally dealt with - every short, painless disposal is one less potential show.\n\nPerhaps the streets of Rome may be showered with the scent of gunpowder and splatters of deep-red blood - but we shall do anything for Fascism. "
 
 ITA_with_iron_pen:0 "With Iron Pen"
 ITA_with_iron_pen_desc:0 "Even given the unfortunate breadth of the opposition, popular or otherwise, we must not give up a chance to give the citizenry of Italy a proper show - suspected counter-state criminals shall be quietly disposed of, with preferably minimal exposure to the greater populace.\n\nPerhaps the most important component of our plans is to then tarnish their once-great names, slander invited. In fact, we might not even need to kill the most ardent of the opposed parties; after a hearty dose of fliers, speeches, and 'meetings' with the ever-loyal Blackshirts, even the most foolish of our population would never dare to associate with those brainless cretins who resist this new, greater Italy.\n\nPublic executions should be reserved for only the most high of criminals, lest we spoil the effects. Let us be clean, but efficient."
 
 ITA_gag_the_fanatics:0 "Gag the Fanatics"
 ITA_gag_the_fanatics_desc:0 "Perhaps the most strange component of this new scheme of power that Italy finds itself in are the mystics - these uncanny individuals, while fascist, have devoted themselves to something that can only be described as a religious devotion to the State.\n\nAlmost all of them supporters of the late Giani, they too need to be somewhat culled - but this quickly-spreading movement must be crushed yet further. Any center which even seems to spread this ridiculous ideology will be shuttered, the supporters silenced or removed entirely.\n\nGetting rid of the Bolsheviks and the liberals is one thing, but we must be careful to not let the most extremes of Fascism too overtake our regime - both are as potent a venom to the up-and-coming Duce.\n\nEven better, the less devoted of followers may not even need to be killed; rather, simply silencing and converting such misguided followers shall suffice."
 
 ITA_princeps_civitatis:0 "Princeps Civitatis"
 ITA_princeps_civitatis_desc:0 "The Black Augustus lies on his throne, and the pawns of the great game of power begin to maneuver into place.\n\nThe marionettes don their strings, and offer themselves to the true Principate of all of Italy.\n\nThe decadence of times past, the degeneracy, the inanity - all are being washed away the unstoppable tide of the present. The kingmakers of such unfortunate eras watch in awe as the Duce gallantly walks over the mangled corpses of those who dared oppose the truth - and they scream as they realize that they too will suffer the same fate.\n\nThe interminable labor is only just beginning; but Italy shall reap the great benefits of a return to what has granted us the glory of victory as the most excellent of rewards.\n\nMany will oppose us; for even in the face of unsurmountable, virtuous deeds, some find the ignorance in their puny hearts to go against all that is right - but none will succeed. True Fascism will guide us to the return of the Roman ideal, it will restore our lost pride, it will bring unimaginable strength, and it will thrust Italy once more unto the stage as the preeminent power of the world!\n\nTo the State, to the Duce, to Fascism!"
 
 ###=====| b) Political Tree |=====###
 ITA_black_augustus_reign:0 "Black Augustus' Reign"
 ITA_black_augustus_reign_desc:0 "We might have stabilized the government, but that does not mean we can rest on our laurels. Years of degeneracy in the party and the nation have left the Empire in a most sorry state, one where liberals and natives thrived like parasites at the expense of the moral and pure Italians. But Duce Pavolini will bring back order in the nation and restore the respect to the Black Shirts, like Duce Mussolini would have wanted. The road to glory is a long and arduous one, and only the strongest men can walk where the weak cannot dare. And where the Duce walks, the nation shall follow on the road to strength and glory eternal."
 
 ITA_lo_stato_sono_io:0 "Lo Stato Sono Io"
 ITA_lo_stato_sono_io_desc:0 "When one gazes at the Fascist State, the focus must present itself to one individual: the Duce. Yet, this is ostensibly not the current state of affairs; the decadent elite continue to fester in their pillars of power, presenting a clear threat to the Duce and his State in their subdued mutterings of dissent. What they will come to understand - what all will understand - is that the State and Duce Pavolini are ultimately one in guiding Italy into the future.\n\nUnfortunately, it is not quite as simple as flipping a switch. The overwhelming strength of the bureaucracy continues to hold influence over the very political organ of Italy, and despite the Party's similar strength, it does not possess the power to overtake the political elite - yet.\n\nUnder the Duce's command, however, this will soon change: the Party shall supplant the State, and soon, they shall become one; as will the Duce."
 
 ITA_return_to_the_ministry:0 "Return to the Ministry"
 ITA_return_to_the_ministry_desc:0 "The Ministry of Popular Culture, or commonly abbreviated to the MinCulPop, has always been a valuable tool of any Duce's regime. Established just before the Second World War, the organization has acted as the definitive media and propaganda ministry for all of the Italian state ever since then. Of course, like much of the most valued elements of the State, it has decayed over time - no doubt spurred on by the previous Duce's general lack of foresight.\n\nDuce Pavolioni recognizes the importance of an effective propaganda arm, however, and the slow decay of the institution shall be reverted. Extra funding shall be diverted, the ministers replaced with Party loyalists, and the tasks of the body increased. Every Italian shall know the strength of the Duce and his State - generously provided by the Ministry."
 
 ITA_under_new_management:0 "Under New Management"
 ITA_under_new_management_desc:0 "As well as the Duce served the MinCulPop under his tenure as Chief, his new responsibility as the sole leader of the State now has regrettably robbed him of the ability to effectively manage the Ministry; a new Minister shall have to be found in Fernando Nezzasina.\n\nLoyal to the Party, and more importantly, to the Duce; he finds himself a both competent and acceptable nomination. With the very arm of the State in question, we cannot skimp on quality - neither can we burden the Duce with simply too many responsibilities. Nezzasania shall replace the former Duce's position as Minister, still of course under heavy supervision by the Duce."
 
 ITA_from_the_duces_mouth:0 "From the Duce's Mouth"
 ITA_from_the_duces_mouth_desc:0 "Despite the strain of being the sole Duce of Italy, Pavolini is perfectly capable of leading the Ministry of Popular Culture. How could he not? The arm of the State is found in part in its communication with every single citizen - propaganda is the quintessential definition thereof.\n\nAdministrative duties shall be delegated to loyal party officials, of course, but all executive decisions will go through the person who ultimately sits at the top of the pyramid: Duce Pavolini. Every propaganda campaign, every broadcast on the radio; all shall, at some point or another, filter through Pavolini's continued occupation of the position of Minister."
 
 ITA_empower_the_federali:0 "Empower the Federali"
 ITA_empower_the_federali_desc:0 "It is deplorable to admit it, but the lack of involvement of PNF leaders during the Ciano period has caused the decline of faith in fascism and has bred disloyalty among the populace. We will reinforce the role of the federal party secretary, from the role of the local bureaucrat to an herald of fascism among the people, who will listen to their worries and guide them in the right direction. They will also have the power to investigate and arrest any dissenter they can find. Liberals and socialists will find no help among the people if they stand united against degeneracy."
 
 ITA_slash_local_budgets:0 "Slash Local Budgets"
 ITA_slash_local_budgets_desc:0 "Every Lira given to local governments - especially to those outside the direct reach of the Party- is a spit in the face to the ultimate power of the Duce. Independent action is inherently dangerous to the interests of the Party, and as such, must be repressed. If municipal institutions wish to receive funding, they will simply be forced to comply with the Party and State line; or in other words, to the Duce. For those that deny such a compelling offer, only an empty check shall meet them.\n\nAfter a few years of such strict treatment, the Duce is certain that all such institutions shall eventually get the message - and submit."
 
 ITA_evict_the_monarachists:0 "Evict the Monarchists"
 ITA_evict_the_monarachists_desc:0 "The elite bureaucrats of the past are long past their due - most remnants of the days of the Italian Republic, they present yet another potential threat to the Duce's reign. Monarchist in nature, the Duce doubts who they truly pledge their loyalty too - and the Duce does not tolerate uncertainty.\n\nSlowly but surely, they will be handed a notice of unemployment; and more loyal officials shall fill their places. The veteran Fascist members of the bureaucracy shall be promoted to the top, while the eager junior members likewise move up in the hierarchy. In the end, all shall be promoted - with a new class of exorbitantly loyal filling the core of the Italian bureaucratic structure.\n\nNever again shall the decadence of the past continue to poison the gears of our State; the vital cogs of power shall flow in sole service to the Duce, and the whispers of the irrelevant shall be muted under the march of progress!"
 
 ITA_friends_by_force:0 "Friends by Force"
 ITA_friends_by_force_desc:0 "Even with the Duce's immense power, outright removing the untold amounts of the Italian establishment remains an impossible course of action - this is not to say, however, that gaining their respect - or fear - is outside of our reach. Even the most courageous of men can crumple like a coat when faced with the threat of a quiet Blackshirt beating, or the OVRA conducting yet another 'investigation' into their activities throughout the Italian state.\n\nThis will draw the old guard bureaucrat's ire regardless, of course, but twisting an arm tends to be better received than a shooting.\n\nIn any case, the end result is the same: a 'loyal' establishment, insofar as they can be persuaded by the vast resources of the loyal Fascist elements in the Party."
 
 ITA_friends_of_fascism:0 "Friends of Fascism"
 ITA_friends_of_fascism_desc:0 "The old guard must go - this has been well known from the very start of the Duce's reign, and it cannot be delayed any longer. Is our entire method based on the removal of the rot, of the decadence that has infected the Italian state for so long? The tendrils of the past shall be cut from the rising of the future, by any means necessary.\n\nThe establishment - the most elite of the bureaucratic state, some of the more popular officials in the State, and even some members of the Party shall be removed without repentance. Perhaps they shall be given a token recognition for their 'services' to the State, but no more - and in there place, a new generation of loyal Italian Fascists shall grow in control of the State apparatus. The opposing elements of the Italian society will of course fight this with all of their will, but after all - the Duce shall remain forever in control, regardless of what the pitiful dissent may say!"
 
 ITA_la_nave_di_teseo:0 "La Nave di Teseo"
 ITA_la_nave_di_teseo_desc:0 "If the Duce is to receive the loyalty he requires to effectively run Italy, then like the Ship of Theseus, he must dismantle and reassemble the entire Ship of State. Any government official - from the lowliest of positions to the upper echelons of the state - must be a fiercely loyal member of the PNF. Uprooting the ineffective bureaucrats and replacing them with party members who will follow every command of Duce Pavolini.\n\nWhen this is done - and the state and party are one in the same - the Duce will be unshackled from those who would hold him back. He would be free to finally lead Italy to the greatness that she deserves."
 
 ITA_mandatory_registration:0 "Mandatory Registration"
 ITA_mandatory_registration_desc:0 "As Duce Pavolini tightens his grip on the PNF, so too must the party tighten its grip on the common people of Italy. Seeing as a fascist state is only as strong as its leader, the Duce must eliminate any threats to his rule, as well as strengthen his own power over the nation.\n\nTo accomplish this, party membership will become a requirement for all citizens, forcing the civilian masses to swear loyalty to the Duce. All members of Italian society, willing or not, will stand behind Pavolini as he bravely leads them to greatness. With the Duce empowered by the nation, nothing shall stop him from achieving his goals."
 
 ITA_a_previleged_few:0 "A Previleged Few"
 ITA_a_previleged_few_desc:0 "The Duce understands the benefits of certain aspects of the German model. Take for instance, how they treat party membership. Membership in the PNF should be something sought after by all citizens of Italy, a prize for those loyal to the cause of fascism, and to the cause of the Duce.\n\nWith party membership comes privileges that are not allotted to the average citizen. A path forward in society, a means to rise above one's humble life. A chance to serve something greater than one's self, a chance to serve Italy and Pavolini. With loyalty as a requirement for party membership, and by incentivizing said party membership, all citizens will aspire to be loyal and productive servants of the State - and thus the Duce."
 
 ITA_prepare_two_lists:0 "Prepare Two Lists"
 ITA_prepare_two_lists_desc:0 "The time has finally come to begin the reassembly of the Ship of State. To aid in this critical process the Duce has prepared two lists. The first is a list of disloyal, ineffective, and decadent officials who have been responsible for the stagnation of Italy. Those on the first list shall be purged, clearing the path for those on the second list. The second list will consist of exemplary party members. Those who have gone above and beyond in support of the Duce and his vision for the future of Italy.\n\nThese two lists will be the foundation of the reconstruction of the Italian government. Finally, the party and the state will finally become one and the same."
 
 ITA_where_everybody_knows_your_name:0 "Where Everybody Knows Your Name"
 ITA_where_everybody_knows_your_name_desc:0 "It simply isn't enough to demand loyalty from every government official. If Duce Pavolini is to be successful, he must command respect and obedience from every citizen living in Italy. Only when all of Italy is united behind him, can Pavolini truly lead it to glory.\n\nTo ensure the loyalty of the common people, the Duce will introduce mandatory community meetings. Each meeting will be led and documented by party members familiar with the local population. These party members will report any citizens who show disloyalty to the Duce or indicate belief in dissenting ideologies. With the people of Italy unified behind him, Pavolini will lead them all to glory."
 
 ITA_your_actions_have_consequences:0 "Your Actions Have Consequences"
 ITA_your_actions_have_consequences_desc:0 "Years of corruption, decadence, and dissent will all be coming to an end soon. The hour is nigh when the government will be purged of disloyal and ineffective officials. This cancer that has blighted Italy from within for years shall finally be excised. In place of the old bureaucrats and administrators, Duce Pavolini will install the party as the new beating heart of Italy. With himself at the center of the party, nothing shall happen without the Duce's knowledge or approval. The interests of Italy will be carried out by the only person capable of carrying them out: the Duce himself."
 
 ITA_revamp_rai:0 "Revamp the RAI"
 ITA_revamp_rai_desc:0 "The Radio Audizioni Italiane is the corporation responsible for all national broadcasts and communications with the Italian public. This institution naturally has incredible potential for spreading Duce Pavolini's message to the people of Italy. Such an outlet would surely help increase the public's loyalty to the Duce and to the party, as well as stir up righteous resentment against the enemies of both.\n\nThis is why Pavolini will reorganize the RAI, installing a new management loyal to himself and the party, and dramatically expanding the corporation's size and scope. With this institution reaffirming the Duce's status as the supreme and unquestionable leader of Italy, Pavolini's rule will become even more secure."
 
 ITA_parliamentary_security_units:0 "Parlimamentary Security Units"
 ITA_parliamentary_security_units_desc:0 "The Blackshirts are the arm of the party and the executors of the Duce's will. Given that the party shall become the government, and the Duce is the heart of the party, this naturally makes the Blackshirts incredibly important to the future of Italy.\n\nThis is why Duce Pavolini will enlarge the scope of Blackshirts. Their presence all across Italy will be dramatically increased. Blackshirts will replace ordinary police officers on street corners and in marketplaces. The people of Italy will learn to love them as their protectors."
 
 ITA_begin_the_mergers:0 "Begin the Mergers"
 ITA_begin_the_mergers_desc:0 "With the old, ineffective, decadent bureaucrats ejected from the government, the time has finally come to replace them. PNF members personally loyal to Duce Pavolini will be installed in every office, at every level, permanently merging the party and the government, forging two institutions into one. This centralization of power will cement Pavolini's rule over Italy, allowing him the power necessary to shape the nation's future.\n\nAbsolute loyalty to the PNF shall be the most basic requirement for any job within the government. Absolute loyalty to the Duce shall be the most basic requirement for membership in the PNF. Without the party the government would grind to a halt. Without the Duce there would be no party.\n\nThe Duce and the party are the heart and soul of the nation - and without them, Italy is nothing."
 
