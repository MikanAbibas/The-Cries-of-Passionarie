 ###=====| 1) LEADER, MINISTER AND OTHER CHARACTER DESC |=====###
 ################################################################
 
 ### a) Leader Descriptions ###
 POLITICS_ALESSANDRO_PAVOLINI_DESC:0 "If some men who are destined since birth to follow in the footsteps of the great men of history, then Alessandro Pavolini was fated to be like Octavian August, he who broke a rotten system and replaced it with a new order, "his" order. Born into a noble, acculturated family, the young Pavolini immediately displayed a keen mind in journalism and politics, leading to an obvious choice in his career: he joined the Fascist movement even before it was an actual party, and from then on, he made it his point to climb the hierarchy to the top.\n\nA personal friend of Galeazzo Ciano ever since the war in Ethiopia, he was appointed Secretary of the Fascist Party when the latter became Duce. Ciano's weak lead, and the ailing state of the Empire, drove a wedge in the friendship, with Pavolini accusing him of sentencing the Empire to a slow, agonizing death: despite this, however, he remained Secretary, proving once again that his political acumen was too much to defeat with a well-aimed purge.\n\nThe Verona Congress proved once again that, indeed, Pavolini's tale was fated to be the same as Octavian's: like the great Roman, he prevailed in the political arena by cunningly outmaneuvering his opponents, until he was left as the sole ruler of Rome. Now, the new Duce finds himself alone atop the pyramid, and from there, he will turn Italy into what it was destined to be: a world power, where all bow to their supreme guide as he leads them into the future.\n\nThe time has come for the Black Augustus to rule. One People. One Empire. One Duce."
 
 ### b) Ministers ###
 ITA_Guido_Buffarini_Guidi_hog:0 "Guido Buffarini Guidi"
 ITA_Guido_Buffarini_Guidi:0 "Guido Buffarini Guidi"
 ITA_Guido_Buffarini_Guidi_hog_desc:0 "§LDespite its efforts to project outward a semblance of the utmost unity, Italian fascism has always been ruled behind the scenes by political cannibalism. Different wings of the party quarrel with each other and the king in grand political intrigues, as competing secret services fight turf wars within the state. The Verona Conference and its fallout were the most dramatic examples of this disunity, but hardly the only ones. In order to fulfill his grand dreams of absolute loyalty, Pavolini needs a hardened veteran of the power struggle as Interior Minister. The man he found for the job was Guido Buffarini Guidi.\n\nGuidi's career started in the army, but he quickly made his way into the fascist bureaucracy through his role as the mayor of Pisa during the 1920's. From there he burrowed into the Ministry of the Interior, where he would make the rest of his career. Guidi honed his political instincts doing battle against the bureaucracy for influence, with Galleazo Ciano as his ally. Seeing Ciano's fortunes decline in recent years, he jumped ship to the hardliners' faction.\n\nAs Pavolini prepares to make all of Italy's political factions bend to his will, Guidi is his most important subordinate. The Minister of the Interior commands a fearsome array of police, blackshirts, and intelligence agents; his weapons are many, and the political war he prosecutes will be utterly ruthless.§!"
 
 ITA_Ather_Capelli_for:0 "Ather Capelli"
 ITA_Ather_Capelli:0 "Ather Capelli"
 ITA_Ather_Capelli_for_desc:0 "§LFascism tends to express itself in the language of violence. Why discuss the mundane minutiae of governance when there is always another glorious battle to be fought, another enemy to be driven into the dust, another conquest to be sought out? For this reason, fascist propagandists tend to be sadistic and bombastic, at work furiously justifying atrocities before they are even committed. In today's Italy, it is Ather Capelli who carries forward this torch, that of the violence of language.\n\nA native of Ferrara in northern Italy, Capelli was a fascist from a young age, personally participating in the March on Rome that brought Mussolini's regime into existence. Unable to serve in the Second World War due to injuries sustained in Ethiopia, he contented himself with waging verbal war against Italy's various enemies as a journalist.\n\nNow that Alessandro Pavolini has emerged triumphant as Italy's newest Duce, Capelli has found success with him as the Italian foreign minister. His hardline stances and bellicose rhetoric may serve him well in this arch-fascist administration, but international relations is a difficult affair. Can Capelli make good on his threats, or will his boasts turn out to be mere bluster?§!"
 
 ITA_Giampietro_Domenico_Pellegrini_eco:0 "Giampietro Domenico Pellegrini"
 ITA_Giampietro_Domenico_Pellegrini:0 "Giampietro Domenico Pellegrini"
 ITA_Giampietro_Domenico_Pellegrini_eco_desc:0 "§LThe fascist mindset, especially that of more extreme fascists such as Alessandro Pavolini and his followers, places more emphasis on the aesthetic than the real. Practically, this tends to pose problems, as the overly ideological worldview of fascism collides roughly with real-world issues of scarce resources, poor budgeting, and limited popular tolerance. A true economic pragmatist could never find a seat in Pavolini's administration, but Domenico Giampetro Pellegrini may be the next best thing: a man as steeped in the practice of fascist economics as he is in nationalist theory.\n\nThroughout Pellegrini's years of service he has married all of the branches of fascism together. As a soldier, he served the fascist cause from a young age, from the March on Rome to the Spanish Civil War. As an academic, he propagated fascist legal theory in his post at the University of Naples. As a banker, he advised both the corporatist bodies of the Italian state and the Ministry of Finance.\n\nPellegrini has served many roles in his life, but this job will be his most challenging one yet. The economic system proposed by the Duce is nothing less than an enormous state-driven network including all of Italy's vast imperial territories and run by Pavolini's decree alone. It is Pellegrini's job to steer this unwieldy giant through massive increases in military and industrial spending; if he succeeds, he may just have created an economic monster.§!"
 
 ITA_Vincenzo_Costa_sec:0 "Vincenzo Costa"
 ITA_Vincenzo_Costa:0 "Vincenzo Costa"
 ITA_Vincenzo_Costa_sec_desc:0 "§LWhat Italian fascism craves above all else is men who are not just willing but impatient to die. In their minds, there can be no room for pity, no room for doubt, no room for hesitation. They must be intolerant of surrender, not just inside themselves but inside of others. Vincenzo Costa is, therefore, an ideal fascist.\n\nCosta's impatience to die was so great that he joined the First World War using forged documents, two years before he was of legal age. Fighting against Austro-Hungarian forces on the front lines, he encountered that greatest sin of fascism, defeatism, first hand when socialist elements in the military encouraged his comrades to desert their posts. After the war, he gained experience clashing with socialists, anarchists, and the police at radical nationalist demonstrations in Italy and Fiume, making a wide variety of connections with blackshirts and the arditi in the process. When the fascist regime took power, Costa stayed away from politics for several decades, only beginning to ascend the party hierarchy in the 1940's. His militia experience and personal familiarity with Mussolini served him well as he climbed the ranks, eventually becoming an influential member of the hardliner faction.\n\nThe power struggle at Verona saw Pavolini's capture of total power, and Costa's rise to his highest office yet. Now in control of Italy's already formidable military, his job will be to oversee its greatest buildup yet. If he succeeds, he will restore Italy to military dominance; if he fails, his fascist urge for death may just be fulfilled.§!"

