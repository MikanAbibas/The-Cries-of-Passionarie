 ITA_RQSC_visible_modifier_desc:0 "Allesandro Pavolini has decreed that he, as is his right as Duce, should be in complete control over all aspects of Italian society. To this end, the old societal structures of Italy must be changed to suit the needs of the glorious fascist state. The Duce cares not for the damage he does to Italy in this endeavor, no matter how much things start to crumble in the meanwhile... \n§YEffects of the Church§!: \n§dStability: [?RQSC_church_debuff|+%]§!\n§YEffects of the Confidustria§!: \n§dProduction Efficiency: [?RQSC_confidustria_debuff|+%]§!\n§dFactory Output: [?RQSC_confidustria_debuff|+%]§!\n§dDockyard Output: [?RQSC_confidustria_debuff|+%]§! \n§YEffects of the Army§!: \n§dWar Support: [?RQSC_army_debuff|+%]§!\n§dDivision Recovery Rate: [?RQSC_army_debuff|+%]§!\n§dDivision Organization: [?RQSC_army_debuff|+%]§!\n§dArmy Experience: [?RQSC_army_debuff|+%]§!\n§dUnit Experience Gain: [?RQSC_army_debuff|+%]§!\n§dCommand Power Gain: [?RQSC_army_debuff|+%]§!\n§YEffects of the Colonies§!:\n§dFuel Gain: [?RQSC_colonies_debuff|+%]§!\n§dNon-core Manpower: [?RQSC_colonies_debuff|+%]§!\n§dResource Gain Efficiency: [?RQSC_colonies_debuff|+%]§!\n§YEffects of the Court§!: \n§dStability: [?RQSC_court_debuff|+%]§!\n§dPolitical Power Gain: [?RQSC_court_debuff|+%]§!\n§dWar Support: [?RQSC_court_debuff|+%]§!\n§YEffects of the Bureaucracy§!:\n§dPolitical Power Gain: [?RQSC_bureaucracy_debuff|+%]§!\n§dConstruction Speed: [?RQSC_bureaucracy_debuff|+%]§!"

