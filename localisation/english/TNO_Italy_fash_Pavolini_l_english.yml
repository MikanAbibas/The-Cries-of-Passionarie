 ###=====| d) Military Tree |=====###
 ITA_una_nuova_legione_italiana:0 "Una Nuova Legione Italiana"
 ITA_una_nuova_legione_italiana_desc:0 "What gave Rome his strength? Was it the strong men who guided them through rough times? Was it the great wonders and architectural feats they built? Or, perhaps these feats were only possible due to the legendary Legions, who brought an entire continent of savage tribes under the control of Rome.\n\nThey were the ones who supported and carried out the will of Rome's strongest leaders, and the ones who kept Rome's great wonders from destruction.\n\nThe heirs to this great legacy are our great military. They were among Mussolini's first allies when he reclaimed Italian glory by marching on Rome.\n\nThe brave men of Rome avenged our humiliation inflicted upon us, and returned it a thousandfold to the French and British. Our new Italian legions truly live up to their ancestral heritage!"
 
 ITA_di_terra:0 "Italiani di Terra"
 ITA_di_terra_desc:0 "The primary arm of our great military is and always has been our powerful army! They embody the legionary spirit our whole military should. They fought bravely against the Austrians in the first World War, and humiliated the Allies in the second. Though some foriegn powers look down upon our army poorly, seeing them as underequipped and led, they make up for any weaknesses, real or perceived, with their spirit.\n\nTheir spirit alone cannot win every battle, however. There are many issues, in weaponry, in tactics, and in leadership that plague our fighting men's effectiveness today. Luckily, with Pavolini's great leadership, the Army will receive the attention they deserve."
 
 ITA_what_is_neccesary:0 "What is Neccesary"
 ITA_what_is_neccesary_desc:0 "Though the fighting men of our military support us wholeheartedly, and most of the leadership is on board, they are not the most loyal men at our disposal.The Milizia Volontaria per la Sicurezza Nazionale, our Blackshirts, fiercely defend the nation from those who wish its destruction. Unfortunately, many of the old guard in command look down upon them, mistaking the Blackshirts' brave actions as little more than mob violence.\n\nWe will increase recruitment into the Blackshirts, expanding their ranks, maybe one day they'll be larger than the military. The old guard, too lost in their past glories to recognize the new reality, will have to grow to accept the Blackshirts as a valuable arm of the state, or find a new job."
 
 ITA_strengthen_the_msvn:0 "Empower the MSVN"
 ITA_strengthen_the_msvn_desc:0 "The Blackshirts have carried out their service to Italy well. They drove all resistance to our regime underground and fully embody the traits of ideal fascists. They did this despite only receiving second rate equipment. Though this was accepted at the time, as the MVSN was only the military wing of our party, and the military needed the arms more, the Blackshirts have taken on more responsibility and deserve only the best. The newest rifles will leave the factory and fall into the hands of a brave Blackshirt. The newest uniforms will not go to the codgery old guard, instead they will be worn only by those who truly serve."
 
 ITA_the_brigate_nere:0 "The Brigate Nere"
 ITA_the_brigate_nere_desc:0 "The brave men of the MVSN owe their legacy to the Arditi, the most elite forces to ever serve Italy. Only legends of that notoriety could have inspired the creation of the Blackshirts. None of the specialized forces we've created since have fully lived up to their legacy.\n\nThe Duce intends to change this. The Brigate Nere will be formed as a collection of the strongest, the smartest, the bravest, and most importantly, the most loyal men. They will receive the best training and equipment. They will finally match the Arditi in skill and loyalty to their nation."
 
 ITA_trim_the_fat:0 "Quantity is..."
 ITA_trim_the_fat_desc:0 "Ideally, we would want as many men as possible in the Brigate. Imagine, tens of thousands of elite soldiers with cutting edge equipment. They would be unstoppable. Now, realistically, having a force at this level at this size is impossible. The training process for the Brigate Nere has to be extremely selective. Only after months of the harshest training, that will break everyone except the strongest and most determined. Only after this crucible, will a man be able to consider themselves part of the Brigate Nere."
 
 ITA_its_own_quality:0 "...Its Own Quality"
 ITA_its_own_quality_desc:0 "There is a belief that generally, quality will always win out over quantity. However, there is another saying, the quantity is its own quality. The latter statement will be our guiding principle for expanding the Brigate Nere. While we aren't proposing to let any old man waltz into the Brigate, there isn't a need for an overly harsh training process. Why weed out thousands of willing, determined, and strong men who might not be able to hack a training process that is way harsher than any conditions they would reasonably be expected to experience? While we may lose out on having the most elite soldiers, a large Brigate, with well trained soldiers, will turn out to be the better choice."
 
 ITA_for_every_able_man:0 "For Every Able Man"
 ITA_for_every_able_man_desc:0 "While many young men chose to serve their nation by joining the Blackshirts, the amount that are inducted into the ranks are not enough for the Duce's grand plan. Ideally, the Blackshirts would be a larger force than the military, surpassing them in numbers, in training, and in loyalty.\n\nFor this to be possible, our recruitment methods and standards must be changed. Lowering some of the less necessary requirements for service will allow those who are willing but just barely miss the standards to join. Propaganda campaigns will inspire a generation of young Italians, our future, to devote themselves to an ideal larger than themselves. With these measures, we'll have every man we could ever desire to serve Italy!"
 
 ITA_black_praetorians:0 "Black Praetorians For a Black Augustus"
 ITA_black_praetorians_desc:0 "The Blackshirts are at the largest their organization has ever seen, and they are a key component to our continued control over the nation and its people. The army has proven itself unreliable, though their loyalty is of little question. Therefore, we will empower the Blackshirts further. They shall become our very own Praetorian Guard, executing our will and ensuring the loyalty of the army and other members of our government.\n\nTheir grand power shadows over even the traditional Esercito, and they grow yet more strong by the day. Soon, it seems, the Duce shall truly have control over the Legions of Italy!"
 
 ITA_retain_the_status_quo:0 "Preserve the Status Quo"
 ITA_retain_the_status_quo_desc:0 ""Unfortunately the Regio Esercito's structure is too entrenched, too protected by outside interests for us to reform it, but that doesn't mean we can't alter it. After all, radical changes might weaken our fighting ability in the short term, while applying subtle pressure will bring us a loyal army. Dangling the carrot in front of the loyal and threatening the disloyal with the stick will help us control the Army while we pick our elements."
 
 ITA_reward_the_loyal:0 "Reward the Loyal..."
 ITA_reward_the_loyal_desc:0 "The true model of a Roman general isn't a traitorous Sulla, but a stoic and moral Scipio, loyal to his country above anything else. And we have several names that fit this description. To those that are already generals we will give them more responsibilities, while officers will be given a clear path to promotion. Provided that they will stay loyal to the Duce, of course"
 
 ITA_but_remove_the_rest:0 "...But Remove the Rest"
 ITA_but_remove_the_rest_desc:0 "The High Command of the Regio Esercito might be protected from our influence, but there are still problematic elements who constantly sabotage our Duce, even going so far as trying to backstab him! This is unbecoming of a professional soldier, especially ones with such high ranks. They are a cancer upon the Empire, and we must be like surgeons and remove them with surgical precision."
 
 ITA_expand_conscription_quotas:0 "Expand Conscription Quotas"
 ITA_expand_conscription_quotas_desc:0 "The German army is larger than ours, this simple fact alone reveals why we need to expand ours. We need to extend our conscription programs to more segments of our population, the youth in particular since they are getting more and more restless by the day. As the great Duce Mussolini once said, to make a people great it is necessary to send them to battle even if you have to kick them in the pants. That is what we shall do."
 
 ITA_cast_off_antiquity:0 "Cast Off Antiquity"
 ITA_cast_off_antiquity_desc:0 "The status of our weapons and equipment procurement programs are nowhere near adequate for our needs. Italian troops on patrol are armed with rifles dating back to the Second World War in some cases! If we are to ever have a chance at fulfilling our ambitions, we need to invest heavily in the modernization of the necessary equipment.\n\nInvesting into standardized and modernized designs for everything from assault rifles to emergency blankets will bring greatness to the Empire. "
 
 ITA_inspect_every_bolt:0 "Inspect Every Bolt"
 ITA_inspect_every_bolt_desc:0 "Recently, the quality of our tanks and other heavy vehicles have been called into question. The idea that Italian tanks could be considered "lesser products", "of shoddy workmanship", or "useless pieces of junk" is an affront to the integrity of the Italian nation!\n\nIn order to prevent these scandalous accusations from finding their feet, we will need to implement a strict inspection system. Every single solitary bolt will need to be meticulously inspected for even the slightest faults. Soon, our tanks will be the envy of the world! Even the vaunted Panzers will seem unreliable compared to the greatness of Italian engineering!"
 
 ITA_the_esercito_strangled:0 "The Esercito Strangled" 
 ITA_the_esercito_strangled_desc:0 "While the armies loyalties have been strong since the rise of Mussolini, they can never be loyal enough. We will need to do away with some of the more... free thinking members of the army command, and extensive checks should be made on even the most loyal of our generals, just in case they have any skeletons they thought they could hide.\n\nWhile this could hinder our force's combat effectiveness in the short-term, in the long-term the loyalty of the army will pay dividends...\n\nThe Army of the Duce and Party, and no more!"
 
 ITA_di_mare:0 "Italiani di Mare"
 ITA_di_mare_desc:0 "For the past century of glory, there has been one exemplary force pushing the might of Italy to the forefront - the Regia Marina. Casting aside the British cage in the Second World War, they easily took awe-inspiring victories; but where the pride of the Italian State once stood, there now only lies outdated buckets of ever-growing rust.\n\nIndeed, the brave Italians of the sea no longer contribute much use in their grand displays of force, but this is not to say that the Navy is useless. The opposite, in fact, is true: instead of guarding the coasts of Roma, they now act as the escorts to the oil that is the lifeblood of our Empire.\n\nThe Duce has long since been irked at the colossal waste and decay of the long arm of the Italian Empire, and now we will begin to change this unfortunate fact.\n\nThere will be required a distinct modernization - and above all, a loyalty to the Duce alone - for the Marina to truly be the core of the Empire's strength once more."
 
 ITA_the_new_naval_generation:0 "The New Naval Generation"
 ITA_the_new_naval_generation_desc:0 "What is a fleet without its trained admirals, its officers, and every other official that serve the backbone of the structure of a navy? Above all else, every single official must be strategic, skilled, and above all loyal. Unfortunately, being spared in even Mussolini's replacement of the Naval suite, a multitude of these commanders are anything but that - they must be steadily replaced.\n\nThe newest pupils in the many officer schools of Italy present a wonderful opportunity to do just that; but first, they must be taught a very stark lesson in who exactly they are serving. They are not serving their commanding officer, nor are they serving for that higher rank; no, they are serving for the State, the Party, and the Duce.\n\nAlong with these standard pushes for the utmost of loyalty, we will take care to comprehensively review and update any education for the next generation of the Marina - modern practices of speed, the purpose of the air war, and any other practices needed for a navy in the present, not the past."
 
 ITA_italys_long_arm:0 "Italia's Long Arm"
 ITA_italys_long_arm_desc:0 "The reach of the Regia Marina extends far throughout our empire - going from Algeria to the Gulf, it may seem impossible to imagine that there could be a place where they could not enforce the will of the Duce.\n\nHowever, although our navy may be able to places far throughout the Empire, it certainly doesn't mean they can effectively operate. Near the fringes of even the Italian possessions, the naval bases are small, undersupplied, undermanned - if there were to ever break out a serious conflict above the usual skirmish with banditry, they would find themselves unable to cope with the copious amounts of ships that we have at our disposal.\n\nAlthough a later direct expansion of our current naval infrastructure will still be required, we will begin to rectify our lack of naval logistics by ensuring that every single one of our existing base of operations is at full operational capacity - all supplies, men, and fortifications included."
 
 ITA_a_contemporary_fleet:0 "A Contemporary Fleet"
 ITA_a_contemporary_fleet_desc:0 "Simply changing our officers isn't enough - we must fundamentally re-evaluate what the role of the Regia Marina is in the serving of the Duce's interests.\n\nLong burdened with cost overruns, a slow response time, and a general lack of reason for the existence of such a massive fleet given our current situation in the Medditeranean, we will pursue a complete doctrinal revolution.\n\nEvery single flotilla shall be reviewed for speed, cost, and ultimately effectiveness. However, this is not the full extent of our reforms to the Marina - choosing how we will establish our Navy in the modern era is a weighty choice indeed. However, even these surface-level reforms are sure to anger some of the High Command, finding themselves suddenly with less of paycheck, not to mention the image of the inevitable decommissioned crafts to be needed... "
 
 ITA_cover_them_in_cruisers:0 "Cover Them in Crusiers"
 ITA_cover_them_in_cruisers_desc:0 "Our naval force has always been centered around the capital ship - the Battleship, the largest of our cruisers - but such an approach is no longer feasible with the reality of the present.\n\nCarrier ships and lighter cruisers have replaced the capital ships of old, and we must update our navy accordingly. The battleships of old will be slowly decommissioned and replaced, replaced with a carrier and several new cruisers - such is the way of the future.\n\nThe ability to project naval power from the air is crucial, and a similar expansion to naval aircraft production shall be put in place.\n\nEven if we may miss the grand monument to power our hulking capital ships were, we certainly won't miss their price tags..."
 
 ITA_speed_is_key:0 "Speed is Key"
 ITA_speed_is_key_desc:0 "The age of the massive hulking cruisers and battleships is over - much like the Panzers of the Second World War, we must prioritize the element of speed and overwhelming force. Furthermore, defense against any potential arial elements has become a critical component of any effective force.\n\nThankfully, there presents the solution to all of these issues - the combined force of the frigates and destroyers provide both an excellent screen, but also a method for strategically maneuvering around blockades, and most importantly, unfavourable engagements.\n\nIn this same vein of thinking, our dockyards and research shall shift to improving the smaller parts of our arsenal - the ones, that in time, may prove to be the most important."
 
 ITA_ports_on_every_shore:0 "Ports on Every Shore"
 ITA_ports_on_every_shore_desc:0 "The idea that we must expect our entire navy to be in the dock at once is ridiculous - our issues stem from a lack of overall coverage, not the quality therein!\n\nAs to almost any problem, the solution to our infrastructural woes is simple: more ports, especially near the fringes of our Empire, are needed.\n\nThe Duce has ordered both our African possessions and the Gulf to begin prioritizing the construction of new naval bases, requesting specifically that quality sometimes be sacrificed in the name of quality.\n\nRegardless of concerns with capacity, the massive benefits to the reach of the Regia Marina is quality enough."
 
 ITA_a_monument_to_strength:0 "A Monument to Strength"
 ITA_a_monument_to_strength_desc:0 "Our issue is not the reach of our navy - Italy's reach stretches from the Indian Ocean to Gibraltar, how could it be our issue?\n\nNo, the issue is the quality of our ports. Especially near the fringes of of empire, even the 'grandest' of our naval bases outside of the mainland pale in comparison to the great structures of the Americans and Japanese. Instead, we have small, undermaintained, and insufficient centers instead of the bustling hubs they must be.\n\nThe Duce has ordered that several old, underused naval bases are decommissioned, and that the funding thereof is sent entirely to projects expanding and strengthening our existing ports. Every single Italian center will be a monument to the Italian strength, repair yards stretching as far as the eye can see!"
 
 ITA_the_marina_chained:0 "The Marina Chained"
 ITA_the_marina_chained_desc:0 "Given its historical and continuing importance in the defense of our nation and people, the Regia Marina has been allowed a certain amount of structural independence - at least as much as could be reasonably granted to a branch of a military. This must be ended, and decisively so. The Duce cannot be effective unless he has control over all major levers of state power and authority. We cannot simply rely on promises of obedience and second hand reports, these can both be easily fabricated. No, if we wish something to be done about the less than ideal state of our navy, it must be done by those we can trust, namely ourselves. "
 
 ITA_di_aria:0 "Italiani di Aria"
 ITA_di_aria_desc:0 "For too long our national air force, while commendable and competent in its own right, has lagged behind those of other major powers. If we ever hope to increase our own regional power - not to mention our global influence - it will be necessary to bring ourselves to parity with the Luftwaffe. As with anything worth attaining, this will not come cheap. However, what our rivals call a boondoggle is in reality an investment into future Italian dominance, one that Pavolini in his wisdom is more than willing to pay. Italy pioneered the techniques of modern air warfare, why should it simply allow itself to be a backseat player any longer in the skies? Avanti!"
 
 ITA_raise_the_quotas:0 "Raise the Production Quotas"
 ITA_raise_the_quotas_desc:0 "The Germans have an air force that is the envy and fear of the entire world. Hordes of fighters, bombers, every aircraft under the sun gather to overwhelm the Reich's enemies and smash them into dust. Italy, by contrast, was never the military equal to the Reich, not even during the war, but Ciano's weakness and naivety have put us even further behind.\n\nOnly one word can describe our next goal in the effort to catch up to Germany: more. More combat planes of every variety, or else we will lose any chance at air superiority. We have seen what happens to those lands unable to field any answer to the Luftwaffe; if Italy is to avoid the fate of Russia and Africa, we must not fail."
 
 ITA_of_fighters:0 "...Of Fighters"
 ITA_of_fighters_desc:0 "Every era has a combat role that rises above all others in terms of valor, duty, and danger. In the medieval era of Europe, it was the knight in heavy armor, unparalleled on the battlefield except by another of his kind. Today, this most deadly and honorable of combatants is the fighter pilot, in a supersonic steed that makes him the terror of the skies. Our rivals have endless fleets of fighters, poised to wrest air superiority from us at a moment's notice. We cannot allow ourselves to be outclassed.\n\nJust as we have exceeded our targets for every other form of military hardware, we will vastly improve our arsenal of jet aircraft, and as the Roman legions dominated a Mediterranean empire, so too will we conquer the skies."
 
 ITA_of_bombers:0 "...Of Bombers"
 ITA_of_bombers_desc:0 "For all of the Germans' military might, from the enormous battleships of the Kriegsmarine to its gigantic tank armies, nothing strikes fear into the hearts of the world as much as its bomber force. At their peak, German bombers made enormous swathes of two continents impossible to govern, obliterating their enemies like the wrath of an angry god. For Italy to become a military juggernaut, it must adopt this power for its own.\n\nThe mass production of more and better bombers will be the cornerstone of the reborn Regia Aeronautica. If we succeed, no enemy will be unreachable, whether in Europe or Ethiopia, the Persian Gulf or the deserts of the Maghreb. Italy will be a modern Jupiter, his thunderbolts inescapable."
 
 ITA_of_runways:0 "...Of Runways"
 ITA_of_runways_desc:0 "Having a large number of aircraft is excellent, but all of these new additions to our force would be useless without a solid infrastructure to maintain them. Even the most advanced fighter plane is completely useless if it has nowhere to take off from. The Germans maintained their fleet with a network of enormous air bases located all over the world. It is time for us to learn from their work yet again.\n\nNew runways and Regia Aeronautica installations will become top priority across the Empire, as well as expanding old ones to meet higher standards. With this new capacity to support our forces, overstretching will become a thing of the past."
 
 ITA_study_the_enemy:0 "Study the Enemy"
 ITA_study_the_enemy_desc:0 "Italy, while no slouch itself, is far from the greatest in military technology. Because of their greater access to resources, we can't research or build as fast as the three superpowers. Catching up completely by ourselves is impossible, but Italy's independent course means that no power would be willing to help.\n\nThere is no reason to reinvent the wheel when it comes to aviation technology. Our rivals in Germany and America have, without knowing it, developed all of the designs we need to prevail. Analyzing their work, taking the best, and discarding the worst: that borrowed innovation is the key to unlocking the next generation of Italian aerial warfare."
 
 ITA_paving_the_salt_flats:0 "Paving the Salt Flats"
 ITA_paving_the_salt_flats_desc:0 "Italy has long lamented the Atlantropa policy's effects on its economy and society. The draining of the Mediterranean was one of the greatest disasters of the twentieth century, a monument to Germany's hubris and Italy's inability to curtail it. But every setback, no matter how grand it may seem, can be turned into an opportunity.\n\nThe deserts of the former Adriatic are level, uninhabited, and unwatched. The perfect places, in other words, to serve as the launching ground for our improved aeronautics program, and the location of impregnable air bases . Atlantropa was a symbol of Italy's weakness; now it will aid us in regaining our strength."
 
 ITA_every_pilot_an_ace:0 "Every Pilot an Ace"
 ITA_every_pilot_an_ace_desc:0 "Flying an airplane is dangerous work, the most daunting and audacious of any military duty. It is no coincidence that so many Fascist figures had a history of aviation. As a result, having an effective air force requires high quality pilots just as much as it requires superior design and technology. Under previous Duces, this area too has fallen behind our counterparts on the continent.\n\nAs it is unlikely that the Regia Aeronautica will exceed the Luftwaffe in size, it will have to exceed it in ability. We need to rigorously train new pilots, until Italy can boast that it has an entire country of Franco Lucchini's ready to die for the motherland."
 
 ITA_the_aeronautica_controlled:0 "The Aeronautica Controlled"
 ITA_the_aeronautica_controlled_desc:0 "Thanks to the replacement of several key officers within the Regia Aeronautica, our control over the air force has been significantly improved. These replacements are not particularly ambitious or energetic, but all the better. This simply means they will be less likely to challenge the Duce when he hands down commands and goals for them to accomplish. This is just one step in the project of bringing all of the military, and indeed the Italian state in line with the will of the Duce, but it is an accomplishment nonetheless. The Aeronautica will soon be so connected to Duce Pavolini's wishes that it will be as if he possessed a remote control to their minds."
 
 ITA_i_militari_del_duce:0 "I Militari del Duce"
 ITA_i_militari_del_duce_desc:0 "The Duce must, as leader of the state and shepherd of his people, be deeply in tune with the military he ostensibly commands. History has shown time and time again that a leader is never truly safe until he has absolute control over his own soldiers. There have been some disturbing trends of independent thought within Italy's armed forces, and this has been a problem since the original triumph of Fascism in this country. Things were only allowed to get worse under Ciano, weak as he was. However, with new leadership comes a renewed determination to bind the force that fights for the nation with the man who, for all practical purposes, is the nation. If the role of the Duce is to embody Italy, then the military of Italy must become like a part of his body, operating only on behalf of his will."
 
 ###=====| e) Colonial Tree |=====###
 ITA_tu_regere_imperio_populous:0 "Tu Regere Imperio Populous"
 ITA_tu_regere_imperio_populous_desc:0 "As Vergil reminded the Romans to lead the inferiors, so too must be our duty. Regrettably, the current situation doesn't exactly allow for that. Our cohorts must bring order to the Empire before it falls into anarchy and barbarism, from the hills of Illyria to the isles of Greece, from the sands of Africa to the mountains of Abyssinia. And wherever we'll go, this shall be our credo: to spare the yielding and defeat the revolting."
 
 ITA_mare_nostrum:0 "Mare Nostrum"
 ITA_mare_nostrum_desc:0 "Since the very beginning of the fascist regime, Mussolini declared the Mediterranean Sea the center of our Empire. Just like the Romans ruled the known world by conquering the seas from the treacherous Carthaginians, Italy has fought the Turks and the Iberians for control of the Mediterranean. But we won't let them do as they please anymore! Italy is the centre of the Mediterranean, so it stands to reason that the whole sea is rightfully Italian. The Regia Marina is still the most powerful navy in the Mediterranean, and if we play our cards right the twentieth century will remain a century of Italian power."
 
 ITA_further_than_trajan:0 "Further Than Trajan"
 ITA_further_than_trajan_desc:0 "Our legacy has outshined the Roman Empire at its peak under Emperor Trajan: now our dominion extends far east in the Arabian peninsula and as far south as Kenia! However, we must not rest on our laurels, the Empire requires careful maintenance and precise deployment of troops if we want to preserve it. Italy stands alone as a light of civilization amidst the darkness of Africa, and the Duce provides the guidance to lead our Empire to a new path of power."
 
 ITA_lost_in_the_night:0 "Lost in the Night"
 ITA_lost_in_the_night_desc:0 "The Fourth Shore is the most valuable addition to our Empire. It is the most resourceful; the most successful at bringing new colonists; and overall the most stable. We would like to keep things that way as being too showy about our boots on the ground might scare off investors. Instead, we will make the antifascists "disappear" in the dark of the night, secretly and with precise operations, to preserve the peace in the area."
 
 ITA_resurrect_the_butcher:0 "Resurrect the Butcher"
 ITA_resurrect_the_butcher_desc:0 "General Graziani was the model commander for the Esercito Regio: he was a patriot who worked tirelessly for his country, and ruthless with the natives. His untimely death at the hands of terrorists only proves him right in his conduct, and we will vindicate him by letting people know that we will not tolerate dissent. Our troops will scour every single grain of sand from Algeria to the Suez, and our bombs will whistle across the sky as we eliminate every trace of dissent, every opposition to our rule.\n\nAnd if they dare to oppose us, we will them give more of it."
 
 ITA_the_useless_made_useful:0 "The Useless, Made Useful"
 ITA_the_useless_made_useful_desc:0 "Sometimes one must wonder why it is that it took so long for Italy to achieve her rightful glory. This pondering is usually swiftly cut short upon the sight of some of the men who proclaim themselves officers in our armed forces. These men, rarely fascists, often with aristocratic connections are a hamper on the continued functioning of our army.\n\nYet, it behooves the Duce to waste men unnecessarily. We might not have use for them in Italy proper, but there is no reason for us to not send these old relics to places where they might find value. East Africa, for instance. Perhaps the backwater deserts of Cyrenaica. Somewhere at any rat - where they won't be our problem."
 
 ITA_every_last_drop:0 "Every Last Drop"
 ITA_every_last_drop_desc:0 "Italy deserves only the best from the lands it seeks to uplift into civilisation. Oil from Libya, stone from Abyssinia, fine fish from Somalia. There is much to squeeze from the fruits our past labours wrought, and we need to send our best to do the wringing. Our young bureaucrats, those fine Italian men who have a desire to prove themselves to the Duce and to the Party so they might advance high later on in life. We could perhaps put some of the more competent amongst them at the head of our efforts to gain more from our labours. If the people complain, we can merely blame the overzealous amongst our recruits.\n\nAll the while, we can enjoy the spoils!"
 
 ITA_beneath_the_sands_of_libya:0 "Beneath the Sands of Libya"
 ITA_beneath_the_sands_of_libya_desc:0 "Long ago when our first Duce, Mussolini, made his efforts to bring back Libya into the welcoming arms of Italy, there were many who decried such heroism as a "waste of resources" to claim such barren lands. But the Party knew better, and at last the Duce's wisdom is coming to the fore as rich oil deposits are found on the daily.\n\nWe require more infrastructure still to exploit this wealth of course, but it is hardly an impossible task. After all - We can always draft the natives if they get any ideas about objecting. As we enjoy these just rewards we can remember that these days it is good to be an Italian, for where else do men of vision live?"
 
 ITA_within_the_alleys_of_tunis:0 "Within the Alleys of Tunis"
 ITA_within_the_alleys_of_tunis_desc:0 "The protectorate of Tunis, once liberated from the French and brought into the Italian fold has remained something of a thorn in our side for decades. The Sultan and the old nobility are pliant enough, but the undercurrent of intellectual Tunisians and their radicalised French aids have formed a not insignificant underground movement dedicated to our fall in the region. One we need to deal with.\n\nFortunately, we have just the men for the job. OVRA will enjoy being let off the leash for a while, and really it might be for the best if we ignore the complaints afterwards. Showing that we understand their concerns is a simple way to keep our hatchet men on board with our greater plans after all."
 
 ITA_caution_the_chairman:0 "Caution the Chairman"
 ITA_caution_the_chairman_desc:0 "Mattei is an effective administrator for sure. When he focuses on doing his damned job and not cavorting about with workers and the natives. The issue is that he keeps insisting on such foolishness as "rights" and "freedoms" for the natives, even those who aren't royalty!\n\nWell we need to put a stop to that, now. Mattei's liberal tendencies are a fine thing far away, but too close to home and they might cause damage where we really don't need it. Inform him of the consequences of his continued yabbering, and if he doesn't get the message then show him another. Forcefully if need be."
 
 ITA_ward_off_the_turks:0 "Ward Off the Turks"
 ITA_ward_off_the_turks_desc:0 "The Turks are a troublesome bunch, that last war really shouldn't have occurred at all. Then again this is what comes from playing friend to a descendant of the Ottoman Empire, that false Rome who overthrew Byzantium. Italy needs some upgraded defences on her borders to assure not only our colonial subjects but our people in the peninsula proper that we have no intent to abandon them. Forts come to mind, but some fields of landmines and AA emplacements couldn't hurt either. Perhaps we could get the natives to build some of them, it wouldn't hurt our popularity there after all. Even if it's propaganda this sort of stuff is important."
 
 ITA_in_the_shadow_of_the_pyramids:0 "In the Shadow of the Pyramids"
 ITA_in_the_shadow_of_the_pyramids_desc:0 "The current native Egyptian governmental apparatus is woefully incompetant, grossly corrupt and just plain inefficient. A drunk half blind Sicilian goatherd with a hernia could run the country better, and it's about time we do better than that. It can't be public of course - the locals might take issue with Italy publicly interfering with its allies affairs.\n\nNonetheless, in the shadows we shall be the ones making the decisions in Egypt from now on.\n\nOn a more practical note, we might make some money if the corrupt tax collectors aren't embezzling quite so much for their own coffers. Let the Egyptians try to deny us that!"
 
 ITA_in_the_lights_of_the_palace:0 "In the Lights of the Palace"
 ITA_in_the_lights_of_the_palace_desc:0 "Our allies in Egypt have ever been the loyal sort, but is there not a reason to keep that loyalty closer to the forefront of their minds? Through showing our appreciation for the hard work in combating communism and anti-fascism that our Egyptian companions have undertaken.\n\nBribes.\n\nWhat we are trying to get across is that the local officials will be a loyal bunch if we give them enough money to choke the Suez canal. Loyal allies do things like report those seeking to undo our influence instead of trying to get a second bribe from them. Though to be honest, some might do that anyway. Nonetheless, we require a stronger foothold in Egypt - even if it comes at a steep cost."

 ITA_control_your_countrymen:0 "Control Your Countrymen..."
 ITA_control_your_countrymen_desc:0 "The Askari battalions are one the finest examples Rome can provide that our mission of civilisation is one which has seen progress over the past decades of strife. For all that many peoples do not understand why it is that Italy must control their lands, the Askari exceed the expectations of our planners by preemptively dealing with those who feel the need to resort to violent protest.\n\nWhy waste the blood of loyal Italians when we can use our trusted servants in the Askari to achieve the same result? At the end of the day, whether we send Askari or Italians to quell an uprising the rebels will end up dead at the conclusion of the whole messy business. Perhaps of equal importance however, is the small fact that the more we allow the Askari to do, the less the international community will care about the outcome. A shame that."
 
 ITA_or_well_do_it_for_you:0 "...Or We'll Do it For You"
 ITA_or_well_do_it_for_you_desc:0 "Sometimes one might wonder why we rely on the brave sons of Italy to quell the natives in the colonies. Yes our Askari have their loyalties straight, but there are more practical reasons to keep our own in charge of pacification projects. As for all they are loyal, the Askari are simply not Italian. They cannot have the same understanding of why what we do is for the benefit of those we steward towards civilisation.\n\nQuestions might be asked or worse, asked publicly. Whereas our own sons are fully educated in exactly why Italy has taken the mission of civilisation to Africa. That and, well, we really do need to have these revolts dealt with quickly. The Askari might hesitate, show weakness. Our own kinsfolk will not bother with such trivialities."
 
