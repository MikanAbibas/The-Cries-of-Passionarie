 #law names
 #nsdap laws
 ##term 1
 GER_reichstag_volk_support_act_text:0 "§rVolk Support Act§!"
 GER_reichstag_volk_support_act_tt:0 "The Volk Support Act aims to distribute benefits primarily those of Germanic blood. \nShould this law pass - pensions and unemployment benefits will be increased. A random state will experience a large boost in NSDAP support."
 GER_reichstag_freedom_law_text:0 "§rFreedom Law§!"
 GER_reichstag_freedom_law_tt:0 "The Freedom Law is rather ironically named, as it actually empowers the central government to bypass several key restrictions on its authority. \nShould it pass, political power gain will increase by 0.1 and NSDAP popularity will increase by 3%."
 GER_reichstag_industrial_revitalization_act_text:0 "§rIndustrial Revitalization Act§!"
 GER_reichstag_industrial_revitalization_act_tt:0 "The Industrial Revitalization Act shifts funding towards reactivation of heavy industrial sites as will as establishment of new ones. \nShould it pass, construction speed and factory output will both increase by 5%."
 GER_reichstag_youth_productiveness_act_text:0 "§rYouth Productiveness Act§!"
 GER_reichstag_youth_productiveness_act_tt:0 "The Youth Productiveness Act implements public service requirements for adolescents. Keeping them off the streets and instead working on something productive. \nShould the act pass, consription factor will increase by 9% while stability will decrease by 4%. NSDAP support will also increase slightly in 4 random states."
 GER_reichstag_general_reich_law_text:0 "§rGeneral Reich Law§!"
 GER_reichstag_general_reich_law_tt:0 "The General Reich Law overhauls voting procedures within the Reichstag as well as general elections. In general this will make it easier for the Fuhrer to force through favorable legislation. \nShould this law pass, stability will be increased by 10% while using coercion in law Reichstag votes will become 15% cheaper. NSDAP support in [64.GetName] and [775.GetName] will increase significantly."
 GER_reichstag_law_for_rural_support_text:0 "§rLaw For Rural Support§!"
 GER_reichstag_law_for_rural_support_tt:0 "The Law For Rural Support grants generous subsidies to German farmers. \nIf passed, it will improve agricultural development growth as well as significantly increase NSDAP support in 2 rural states and slightly increase NSDAP support in 2 more."
 GER_reichstag_oberlander_law_text:0 "§rOberlander Law§!"
 GER_reichstag_oberlander_law_tt:0 "Named after the long time leader of the NSDAP Theodore Oberlander, this restructures election laws to primarily benefit the dominant party in a state, mainly NSDAP controlled areas. \nIf passed this law will slightly decrease VAAF in 3 states, VUP in 2, and RSP in 1. It will also make boosting the leading party of a given state 15% cheaper."
 GER_reichstag_workers_protection_bill_text:0 "§rWorker's Protection Bill§!"
 GER_reichstag_workers_protection_bill_tt:0 "The Worker's Protection Bill targets the working class constituents of the NSDAP. \nIf passed safety regulations and minimum wage will improve. NSDAP support in [57.GetName], [55.GetName] and [51.GetName] will increase slightly."
 GER_reichstag_law_for_restoring_pride_in_the_reich_text:0 "§rPride In The Reich Law§!"
 GER_reichstag_law_for_restoring_pride_in_the_reich_tt:0 "The Pride In The Reich Law proposes the implementation of a public campaign encouraging patriotism and dedication to the Reich. \nIf passed, political power factor and war support will both increase by 5%. National Socialism popularity will increase by 2%."
 GER_reichstag_professional_adjustment_act_text:0 "§rProfessional Adjustment Act§!"
 GER_reichstag_professional_adjustment_act_tt:0 "The Professional Adjustment Act implements stricter prohibitions on hiring public servants, demanding a high degree of loyalty and respect. Needless to say this shrinks the pool of available canidates while preserving the positions of older NSDAP apointees. \nIf passed consumer goods will increase by 3%, National Socialism drift by +0.01 and 50 political power will be gained."
 GER_reichstag_banking_simplification_bill_text:0 "§rBanking Simplification Bill§!"
 GER_reichstag_banking_simplification_bill_tt:0 "The Banking Simplification Bill is a rather misleading bill and is actually a tax increase disguised as a streamlining measure. \nIf passed RSP support will slightly decrease in a random state where the RSP is in the majority, and taxes will increase."
 GER_reichstag_bill_for_support_of_lawful_and_just_proceedings_text:0 "§rJudicial Proceedings Bill§!"
 GER_reichstag_bill_for_support_of_lawful_and_just_proceedings_tt:0 "The Judicial Proceedings Bill (full name: The Bill Of Support For Lawful And Just Proceedings) is an ironically named law since it de-facto introduces legal stonewalls and bureaucratic complications for former slaves, who not-so-coincidentally happen to be non-Germans and hence unfavorable to the NSDAP. \nShould it pass NSDAP support will greatly increase in Bohemia, Danzig, and Wartheland. Minority rights will also worsen."
 GER_reichstag_new_lebensborn_act_text:0 "§rNew Lebensborn Act§!"
 GER_reichstag_new_lebensborn_act_tt:0 "The New Lebensborn Act diverts funds towards family building financial incentives. \nIf passed, monthly population growth will increase by 15%."
 GER_reichstag_unification_law_text:0 "§rUnification Law§!"
 GER_reichstag_unification_law_tt:0 "The Unification Law consolidates multiple state owned firms into one large conglomerate. \nIf passed global building slots will increase by 8% while factory output will increase by 7%."
 GER_reichstag_historical_education_act_text:0 "§rVolk Education Act§!"
 GER_reichstag_historical_education_act_tt:0 "Increasing funds to early childhood and university education, the Volk Education Act education also places emphasis on funding "historical and philisophical endeavors of national interest." \nIf passed research speed will increase 1% while political power gain will jump by +0.05."
 ##term 2
 GER_reichstag_economic_consolidation_act_text:0 "§rEconomic Consolidation Act§!"
 GER_reichstag_economic_consolidation_act_tt:0 "The Economic Consolidation Act reigns in much of the Speerite market reforms in favor of economic Dirgism. \nIf passed factory output will increase by 13%. GDP and national income will also increase."
 GER_reichstag_reich_defense_act_text:0 "§rReich Defence Act§!"
 GER_reichstag_reich_defense_act_tt:0 "The Reich Defence Act promises massive increases to the Wehrmacht's budget. \nIf passed army recovery rate will increase by 12% and army organization by 15%"
 GER_reichstag_general_security_law_text:0 "§rGeneral Security Law§!"
 GER_reichstag_general_security_law_tt:0 "The General Security Law tightens governmental counterintelligence procedures. \nIf passed security will improve and encryption will be boosted by 50%."
 GER_reichstag_bill_for_informative_media_text:0 "§rBill For Informative Media§!"
 GER_reichstag_bill_for_informative_media_tt:0 "The Bill For Informative Media calls for state owned media to produce a quota of informative media, which also happens to friendly to the NSDAP party line. \nIf passed Fascism and National Socialism drift will increase by 0.01 and +75 political power will be gained."
 GER_reichstag_veteran_support_act_text:0 "§rVeteran Support Act§!"
 GER_reichstag_veteran_support_act_tt:0 " The Veteran Support Act calls for greater support for Wehrmacht veterans and the families of deceased soldiers. \nIf passed weekly war support drift will increase by 1%. Pensions will also improve."
 GER_reichstag_voter_registation_act_text:0 "§rVoter Registration Act§!"
 GER_reichstag_voter_registation_act_tt:0 "The Voter Registration Act calls for stringent requirements for voter registration - de-facto benefiting the NSDAP. If passed, boosting a leading party will become 10% cheaper, and NSDAP support will increase slightly in every state."
 GER_reichstag_reich_banking_law_text:0 "§rReich Banking Law§!"
 GER_reichstag_reich_banking_law_tt:0 "The Reich Banking Law introduces legal barriers for political organizations financially - making it more difficult for new political organizations to open bank accounts. \nIf this law is pass political power factor will increase by 15% and National Socialism popularity will increase by 3%."
 GER_reichstag_national_trade_union_act_text:0 "§rNational Trade Union Act§!"
 GER_reichstag_national_trade_union_act_tt:0 "The National Trade Union Act effectively limits trade union strikes by subordinating the unions to state authority. \nIf passed construction speed will increase by 12% but consumer goods will also increase by 7%."
 GER_reichstag_motion_to_condemn_rus_aggression_text:0 "§rMotion To Condemn Aggression§!"
 GER_reichstag_motion_to_condemn_rus_aggression_tt:0 "The Motion To Condemn Aggression calls for an immediate public denunciation of the Russian state, and a clamp down on foreign trade with Russia by pressuring German aligned and neutral nations. \nIf passed army recovery rate will improve by 12%, war support will increase by 10% and Russia will lose 200 political power."
 GER_reichstag_volks_public_works_act_text:0 "§rVolks Public Goods Act§!"
 GER_reichstag_volks_public_works_act_tt:0 "The Volks Public Goods Act allocates funds for public infrastructure. \nIf passed 4 random states will receive 2 infrastructure and a small boost to NSDAP support."
 GER_reichstag_act_for_price_control_text:0 "§rAct For Price Control§!"
 GER_reichstag_act_for_price_control_tt:0 "The Act For Price Control, as the name suggests, introduces price controls on certain essential goods. \nIf passed factory output will increase by 5%, consumer goods usage will decrease by 9%, and misc cost will increase slightly."
 GER_reichstag_bill_law_on_new_political_organizations_text:0 "§rLaw On New Political Organizations§!"
 GER_reichstag_bill_law_on_new_political_organizations_tt:0 "Law On New Political Organizations essentially gives the Fuhrer immense oversight over all political organizations, and essentially bans the creation of new organizations hostile to the NSDAP. \nIf passed authoritarian and libertarian socialism drift will increase by -0.02, and every party aside from the NSDAP will lost some support in every state. \n§YTo pass this law you must have passed every law above it.§!"
 GER_reichstag_goebbels_law_text:0 "§rGoebbels Law§!"
 GER_reichstag_goebbels_law_tt:0 "The Goebbels Law gives the Fuhrer legislative ability, allowing him to introduce laws and bypass Reichstag procedures. Named for Fuhrer Helmut Goebbels, it will ensure the NSDAP has a deathgrip on the Reichstag. \nIf passed, Reichstag coercion will become 10% cheaper and 100 political power will be gained. \n§YTo pass this law you must have passed the Law On New Political Organizations.§!"
 GER_reichstag_majority_law_text:0 "§rMajority Law§!"
 GER_reichstag_majority_law_tt:0 "The Majority Law overhauls national elections to de-facto guarantee NSDAP victory. \nThere is no going back once this law is passed. \n§YTo pass this law you must have passed the Goebbels Law.§!\n§RThis law is mutually exclusive with the National Unity Front Act — only one of the two may be passed.§!"
 GER_reichstag_law_national_unity_front_text:0 "§rNational Unity Front Act§!"
 GER_reichstag_law_national_unity_front_tt:0 "The National Unity Front Act forces every party in the Reichstag to form into one large coalition. \n§YTo pass this law you must have passed the Majority Law and a large crisis has threatened the Reich.§!\n§RThis law is mutually exclusive with the Majority Law — only one of the two may be passed.§!"
 ##bomber's spring
 GER_reichstag_reich_police_act_text:0 "§rReich Police Act§!"
 GER_reichstag_reich_police_act_tt:0 "The Reich Police Act is an emergency law proposed to rapidly augment local police forces with ORPO and Heer MP units. \nIf passed, the effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. In addition, stability will increase by 30% and every state will receive a large boost to NSDAP support. \n100 Days Will Be Added To Desperate Measures Timeout \n§RPassing This Law Locks Out:§! §zPeoples Protection Act,§! §gReich Safety Act,§! §eShield Of The Masses Law§!"
 GER_reichstag_law_against_unruly_populations_text:0 "§rLaw Against Unruly Populations§!"
 GER_reichstag_law_against_unruly_populations_tt:0 "The Law Against Unruly Populations puts harsh controls on non-Germans primarily. \nIf passed, every state will receive a small boost in NSDAP support and a small loss in LER support. Political power gain will also decrease by 0.15. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §zLaw For Reconciliation,§! §gLaw To Defend Liberty,§! §eMilitia Deployment Act§!"
 GER_reichstag_anti_ss_law_text:0 "§rAnti-SS Law§!"
 GER_reichstag_anti_ss_law_tt:0 "The Anti-SS Law gives the ORPO extraordinary powers to hunt down and arrest individuals suspected of Burgundian ties. \nIf passed, every state will receive a small loss in DAP support. Stability will also decrease by 20%. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace.  \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §zGovermental Policing Act,§! §gPakt Security Act,§! §eOfficer Reform Law§!"
 GER_reichstag_internal_fortification_act_text:0 "§rInternal Fortification Act§!"
 GER_reichstag_internal_fortification_act_tt:0 "The Internal Fortification Act introduces extensive civilian oversight of the Wehrmach. \nIf passed, national socialism and fascism popularity will both increase by 4%. Burgundian System popularity will also increase by 3%. Army organization will also decrease by 10%. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace.  \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §zPoland Act,§! §gRiot Management Act,§! §eEquitable Roads Act§!"
 GER_reichstag_national_accounting_law_text:0 "§rNational Accounting Law§!"
 GER_reichstag_national_accounting_law_tt:0 "The National Accounting Law introduces rigorous policing all financial transactions within the Reich. \nIf passed, national socialism popularity will increase by 4% and fascism popularity will increase by 6%. Construction speed will also decrease by 10%. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §zHeritage Protection Act,§! §gConsolation Act,§! §eGeneral Rights Law§!"
 #vup laws
 ##term 1
 GER_reichstag_unemployment_act_text:0 "§zUnemployment Act§!"
 GER_reichstag_unemployment_act_tt:0 "The Unemployment Act increases benefits for unemployed laborers. If passed unemployment benefits will improve. In addition, social democrcy popularity will inrease by 3% and conservative democracy popularity by 2%."
 GER_reichstag_agrarian_fund_act_text:0 "§zAgrarian Fund Act§!"
 GER_reichstag_agrarian_fund_act_tt:0 "The Agrarian Fund Act creates a financial mechanism by which the Reich may deliver low-interest loans and debt forgiveness to struggling farmers. \nIf passed, every rural state will gain one extra building slot and vup support will increase slightly in that stare. Agricultural development will also begin to improve."
 GER_reichstag_fair_compensation_act_text:0 "§zFair Compensation Act§!"
 GER_reichstag_fair_compensation_act_tt:0 "The Fair Compensation Act introduces regulations regarding overtime and work hours, as well as increasing the minimum wage nationally. \nIf passed, poverty development will improve, consumer goods usage will decrease by 5%, minimum wage will improve and 25 political power will be gained."
 GER_reichstag_reich_school_law_text:0 "§zReich School Law§!"
 GER_reichstag_reich_school_law_tt:0 "The Reich School Law calls for increased funds for both public as well as private school grants. \nIf passed research speed will increase by 5%."
 GER_reichstag_religious_tolerance_law_text:0 "§zReligious Tolerance Law§!"
 GER_reichstag_religious_tolerance_law_tt:0 "The Religious Tolerance Law introduces legal protections for relegion in the Reich. \nIf passed, VUP support will increase slightly in all states where Catholici and Orthodox Christianity remain prevalent. Relegious rights will improve and we will lose 200 political power."
 GER_reichstag_general_finance_reform_law_text:0 "§zGeneral Finance Reform Law§!"
 GER_reichstag_general_finance_reform_law_tt:0 "The General Finance Reform Law introduces regulations in the German banking system designed to ensure fairer loans and reduce individual debt burdans. \nIf passed, construction speed will increase by 10%, miscellaneous income will increase and 25 political power will be gained."
 GER_reichstag_reich_democracy_act_text:0 "§zReich Democracy Act§!"
 GER_reichstag_reich_democracy_act_tt:0 "The Reich Democracy Act introduces key procedural reforms in electoral laws and Reichstag proceedings. This is one of the VUP's flagship laws and is designed as a major step towards further democratization. \nIf passed, law negotiation becomes 15% cheaper."
 GER_reichstag_connective_infrastructure_act_text:0 "§zConnective Infrastructure Act§!"
 GER_reichstag_connective_infrastructure_act_tt:0 "The Connective Infrastructure Act aims to expand the Reich's road and rail network. \nIf passed, 5 random states will receive 1 infrastructure and a small boost to VUP support."
 GER_reichstag_repatriation_law_text:0 "§zRepatriation Law§!"
 GER_reichstag_repatriation_law_tt:0 "The Repatriation Law calls for gradual and partial recompance of stolen property for victims of previous NSDAP expropriations. \nIf passed political power gain wil decrease by 0.1, and stability will increase by 15%"
 GER_reichstag_class_cooperation_act_text:0 "§zClass Cooperation Act§!"
 GER_reichstag_class_cooperation_act_tt:0 "The Class Cooperation Act empowers the Ministry of Labour to mediate between labour unions and factory owners, in the hopes of reaching reasonable accomodations for everyone. \nIf passed, both factory and dockyard output will increase by 7%."
 GER_reichstag_popular_welfare_law_text:0 "§zPopular Welfare Law§!"
 GER_reichstag_popular_welfare_law_tt:0 "The Popular Welfare Law is aptly named and improves social benefits for the common citizens. \nIf passed, the following policies will improve; healthcare, minimum wage, and unemployment benefits."
 GER_reichstag_bill_of_public_dignity_text:0 "§zBill Of Public Dignity§!"
 GER_reichstag_bill_of_public_dignity_tt:0 "The Bill Of Public Dignity introduces some minority rights protections in governmental institutions. \nIf passed, VUP support will increase in 8 states with significant minority populations."
 GER_reichstag_market_fairness_law_text:0 "§zMarket Fairness Law§!"
 GER_reichstag_market_fairness_law_tt:0 "The Market Fairness Law introduces some protectionist measures in economic policy. \nIf passed, export policy will be tightened and consumer goods usage will decrease by 5%."
 GER_reichstag_museum_act_text:0 "§zMuseum Act§!"
 GER_reichstag_museum_act_tt:0 "The Museum Act funds historical preservation programs especially those targeted towards records and artifacts from the First Reich. \nIf passed, 100 political power will be gained and 1 random state will receive a large boost to VUP support and an extra building slot from the construction of a new national museum."
 GER_reichstag_reich_outreach_law_text:0 "§zReich Outreach Act§!"
 GER_reichstag_reich_outreach_law_tt:0 "The Reich Outreach Act induces the German government to pursue further diplomatic missions across the world. \nIf passed, the Koalition der Nationen's coherence will increase by 2 and trust by 1, provided the KN has already formed."
 ##term 2
 GER_reichstag_impoverished_support_act_text:0 "§zImpoverished Support Act§!"
 GER_reichstag_impoverished_support_act_tt:0 "The Impoverished Support Act directs extensive funds towards ending poverty in the German Reich. \nIf passed, consumer goods usage will increase 10% and stability will increase 0.01% weekly."
 GER_reichstag_reich_education_law_text:0 "§zReich Education Law§!"
 GER_reichstag_reich_education_law_tt:0 "The Reich Education Law introduces increased public funding for education, allowing individuals to attain even high level eductation degrees for little to no cost \nIf passed the education policy will imporve and 5 random states will receive a slight boost to VUP support."
 GER_reichstag_bill_for_civil_law_reform_text:0 "§zBill For Civil Law Reform§!"
 GER_reichstag_bill_for_civil_law_reform_tt:0 "The Bill For Civil Law Reform improves civil protections and legal rights for all citizens of the Reich. \nIf passed, the penal system and public meetings policies will improve. Law compromising becomes 10% cheaper and 10% stability will be gained."
 GER_reichstag_anti_greed_act_text:0 "§zAnti-Greed Act§!"
 GER_reichstag_anti_greed_act_tt:0 "The Anti-Greed Act calls for heavy regulation of the national economy. Among other changes it heavilty weights taxes towards the upper echelons of society, ensuring some measure of wealth flows down to common man. \nIf passed the tax rate will rise, global building slots will increase by 10% and dockyard output will increase by 13%. In addition, if the VUP is the ruling party, every state suffers a slight reduction in VUP support. Otherwise 25% stability will be lost."
 GER_reichstag_pakt_aid_law_text:0 "§zPakt Aid Law§!"
 GER_reichstag_pakt_aid_law_tt:0 "The Pakt Aid Law designates funds for Pakt allies. \nIf passed every other nation in the Pakt will receive 6 arms factories and 6 civilian factories."
 GER_reichstag_reich_sick_law_text:0 "§zNational Sick Law§!"
 GER_reichstag_reich_sick_law_tt:0 "The National Sick Law introduces generous public benefits for health related expenses. \nIf passed, healthcare policy will improve, montly population growth will increase by 10% and stability will increase 10%."
 GER_reichstag_wehrmacht_funding_act_text:0 "§zWehrmacht Funding Act§!"
 GER_reichstag_wehrmacht_funding_act_tt:0 "The Wehrmacht Funding Act diverts a large portion of the national budget towards strengthening the Whermacht. \nIf passed, some money reserves will be spent, and army attack and defence will both increase by 10%."
 GER_reichstag_vote_streamlining_act_text:0 "§zVote Streamlining Act§!"
 GER_reichstag_vote_streamlining_act_tt:0 "The Vote Streamlining Act is a law reforming the electoral system of the Reich and removing old restrictions. \nIf passed, turnout will increase by 10% in five Polish states and three major German cities, and compromising will become 20% cheaper."
 GER_reichstag_anti_intimidation_law_text:0 "§zAnti-Intimidation Law§!"
 GER_reichstag_anti_intimidation_law_tt:0 "The Anti-Intimidation Law introduces harsh punishment for coercion; whether it be paramilitaries intimidating voters or gangsters collecting protection money. \nIf passed,VAAF, NSDAP, and RSP support will decrease slightly in every state and stability will increase 5%."
 GER_reichstag_safety_regulation_law_text:0 "§zSafety Regulation Act§!"
 GER_reichstag_safety_regulation_law_tt:0 "The Safety Regulation Act introduces new and stricter work safety regulations. The name is rather self descriptive for once. \nIf passed the safety policy will improve and we will gain 75 political power."
 GER_reichstag_constitutional_protection_act_text:0 "§zConstitutional Protection Act§!"
 GER_reichstag_constitutional_protection_act_tt:0 "The Constitutional Protection Act ends the Fuhrer's dominance in legislative affairs and ensures a measure of power distribution on the halls of government. \nIf passed, strongarming in the Reichstag will be disabled, compromising becomes cheaper, and Social and Conservative Democracy popularity will both increase by 10%."
 GER_reichstag_bill_church_understanding_act_text:0 "§zChurch Understanding Act§!"
 GER_reichstag_bill_church_understanding_act_tt:0 "The Church Understanding Act seeks rapprochement with the Catholic Church and is hence very popular among the Catholic sections of the population. Written into the law are further protections for Protestants and Orthodox christians no matter their place of origin. \nIf passed stability and war support will increase by 25%. Ideology drift defence will increase by 15%.The religious rights policy will also improve."
 GER_reichstag_inter_pakt_autobahn_law_text:0 "§zInterPakt Autobahn Law§!"
 GER_reichstag_inter_pakt_autobahn_law_tt:0 "Inspired by the American Interstate highway, the new InterPakt Autobahn system will connect the whole Pakt in one unified road system. \nIf passed, every ally will receive one infrastructure in all of their states."
 GER_reichstag_general_rights_act_text:0 "§zGeneral Rights Act§!"
 GER_reichstag_general_rights_act_tt:0 "The General Rights Act solidifies the democratic reform policies of the VUP, ensuring they are irreversible and long lasting. At last Germany will be free! \nIf passed Army Recovery Rate will increase 10% and Conscription Factor will increase 12%. \n§GTHis Lingering Will Fades...§! \n§YTo pass this law you must have passed every law above it.§!"
 GER_reichstag_imperial_restoration_law_text:0 "§zImperial Restoration Law§!"
 GER_reichstag_imperial_restoration_law_tt:0 "AEIOU"
 ##bomber's spring
 GER_reichstag_peoples_protection_act_text:0 "§zPeoples Protection Act§!"
 GER_reichstag_peoples_protection_act_tt:0 "The Peoples Protection Act devolves policing to local Gaus and massively weakens the ORPO in the hopes of appeasing the LER and DAP. \nIf this law is passed, stability will decrease by 30%, security policy will worsen, Despotism popularity will increase by 5% and VUP support will increase slightly in every state. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rReich Police Act,§! §gReich Safety Act,§! §eShield Of The Masses Law§!"
 GER_reichstag_law_for_reconciliation_text:0 "§zLaw For Reconciliation§!"
 GER_reichstag_law_for_reconciliation_tt:0 "The Law For Reconciliation specifies a total ban on racial descrimination in hiring, banking, trading, and education. From henceforth, all men will succeed on their own merit, nothing more and nothing less. \nIf passed political power gain factor will increase by 20%, Despotism popularity will increase by 2% and VUP support will increase significantly in every state. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n100 Days Will Be Added To Desperate Measures Timeout \n§RPassing This Law Locks Out:§! §rLaw Against Unruly Populations,§! §gLaw To Defend Liberty,§! §eMilitia Deployment Act§!"
 GER_reichstag_governmental_policing_law_text:0 "§zGovermental Policing Act§!"
 GER_reichstag_governmental_policing_law_tt:0 "The Govermental Policing Act institutes strict classification requirements for all government documents. This is to such an extent that even retrieveing mundane identity documents will become difficult and will require high level authorization. \nIf passed, DAP, LER, NSDAP, and VAAF support will drop slightly in every state, encryption will improve by 50% and war support will decrease by 35%. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rAnti-SS Law,§! §gPakt Security Act,§! §eOfficer Reform Law§!"
 GER_reichstag_poland_act_text:0 "§zPoland Act§!"
 GER_reichstag_poland_act_tt:0 "The Poland Act invests massive amounts of money in Gaus with large Polish populations in an attempt to shor up support and weaken pro-LER sentiments. \nIf passed, 5 states with large Polish populations will receive a large boost to VUP support and a large increase to LER support. Despotism popularity will also increase by 2%. In addition, miscellaneous expenses will drastically increase. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rInternal Fortification Act,§! §gRiot Management Act,§! §eEquitable Roads Act§!"
 GER_reichstag_heritage_protection_act_text:0 "§zHeritage Protection Act§!"
 GER_reichstag_heritage_protection_act_tt:0 "The Heritage Protection Act declares many areas as important historical sites, and prohibits their use for development. This includes both areas of great importance to DAP and LER supporters. \nIf passed, global building slots will decrease by 15% and VUP support will increase slightly in every state. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rNational Accounting Law,§! §gConsolation Act,§! §eGeneral Rights Law§!"
 #rsp laws
 ##term 1
 GER_reichstag_market_liberty_law_text:0 "§gMarket Law§!"
 GER_reichstag_market_liberty_law_tt:0 "The Market Law deregulates portions of the German economy, especially consumer goods industries which realistically do not require government intervention. \nIf passed global building slots will increase by 10% and miscellaneous income will increase."
 GER_reichstag_industrial_development_law_text:0 "§gIndustrial Development Law§!"
 GER_reichstag_industrial_development_law_tt:0 "The Industrial Development Law creates a generous tax break for industrial firms constructing new factories in the Rhineland. \nIf passed, 6 civilian factories will be build across 4 Rhineland states. Each state will also receive a large boost to RSP support."
 GER_reichstag_international_trade_act_text:0 "§gInternational Trade Act§!"
 GER_reichstag_international_trade_act_tt:0 "The International Trade Act lowers trade barriers and tariffs to encourage trade from outside the Pakt as well as within. \nIf passed, consumer goods usage will decrease by 10% and the trade law policy will move one step towards deregulation."
 GER_reichstag_coorperation_freedom_act_text:0 "§gCorporation Freedom Act§!"
 GER_reichstag_coorperation_freedom_act_tt:0 "The Corporation Freedom Act removes a multitude of financial and trade regulations for Corporations and personal businesses. \nIf passed, GDP will massively increase and Authoritarian Democrat popularity will increase by 3%."
 GER_reichstag_free_press_law_text:0 "§gPress Law§!"
 GER_reichstag_free_press_law_tt:0 "The Press Law introduces certain free speech protections for individuals. These protections are designed to protect citizens from reprisals and allow the dispersion of opinions, provided they are neither treasonous nor obscene. \nIf passed, press rights policy will improve, ideology drift defence will decrease by -5%, and political power gain will increase by +0.1."
 GER_reichstag_banking_deregulation_law_text:0 "§gBanking Deregulation Law§!"
 GER_reichstag_banking_deregulation_law_tt:0 "The Banking Deregulation Law almost completely guts the Reich's banking regulations, which in theory will allow many more banks to open and easier loan aquisition. \nIf passed, construction speed will increase by 13% and stability will decrease "
 GER_reichstag_reich_liberty_law_text:0 "§gReich Liberty Law§!"
 GER_reichstag_reich_liberty_law_tt:0 "The Reich Liberty Law is deceivingly named and has little to do with liberty. Instead it is designed to consolidate judicial power in the hands of the Fuhrer and to weaken the independence of the courts. \nIf passed, strongarming the Reichstag will become 10% cheaper. \n§RThe liberal wing of the RSP will hate this.§! \n§YThis law is mutually exclusive with the Judicial Freedom Law.§!"
 GER_reichstag_judicial_freedom_law_text:0 "§gJudicial Freedom Law§!"
 GER_reichstag_judicial_freedom_law_tt:0 "The Judicial Freedom Law asserts the independence of the Reich's judiciary, introducing some measures against political interference. \nIf passed stability will increase by 10%, we will lose -100 political power and Classical Liberal popularity will increase by 4%. \n§YThis law is mutually exclusive with the Reich Liberty Law.§!"
 GER_reichstag_port_modernization_act_text:0 "§gPort Modernization Act§!"
 GER_reichstag_port_modernization_act_tt:0 "The Port Modernization Act creates a national investment fund for Reich shipyards for the purposes of expansion and modernization. \nIf passed, dockyard output will improve by 15%, and 4 states will receive a dockyard and a large boost to RSP support."
 GER_reichstag_act_for_wehrmacht_readiness_text:0 "§gAct For Wehrmacht Readiness§!"
 GER_reichstag_act_for_wehrmacht_readiness_tt:0 "The Act For Wehrmacht Readiness introduces requirements for the Wehrmacht to maintain a certain level of mobilization at all times, with accompanying  funds to facilitate this. \nIf passed, army training time will decrease by 10% and land reinforce rate will improve by 1%."
 GER_reichstag_university_law_text:0 "§gUniversity Law§!"
 GER_reichstag_university_law_tt:0 "The University Law strips away government oversight of German universities, essentially granting them independence from the state. \nIf passed research speed will increase 5% and academic base development will improve."
 GER_reichstag_national_liberation_law_text:0 "§gNational Liberty Law§!"
 GER_reichstag_national_liberation_law_tt:0 "The National Liberty Law grants no such thing and instead allows the Fuhrer greater power over the Reichstag, weakening the power of elected officials. \nIf passed, strongarming will become 10% cheaper, political power gain will increase by +0.07 and Liberal Democracy popularity will increase by 4%. \n§RThe liberal wing of the RSP will hate this.§! \n§YThis law is mutually exclusive with the Election Procedure Act.§!"
 GER_reichstag_election_procedure_act_text:0 "§gElection Procedure Act§!"
 GER_reichstag_election_procedure_act_tt:0 "The Election Procedure Act promises fairer elections and the securement of the right to vote. \nIf passed, turnout will increase by 10% in every state and Classical Liberal popularity will increase by 4%. \n§YThis law is mutually exclusive with the National Liberty Law.§!"
 GER_reichstag_taxation_reduction_law_text:0 "§gTaxation Reduction Act§!"
 GER_reichstag_taxation_reduction_law_tt:0 "The Taxation Reduction Act does exactly that and reduces the tax rate. \nIf passed the tax policy will be reduced, factory output will increase +14%, every state will receive a small boost to RSP support, and we will gain 80 political power."
 GER_reichstag_military_infrastructure_act_text:0 "§gMilitary Infrastructure Act§!"
 GER_reichstag_military_infrastructure_act_tt:0 "The Military Infrastructure Act reorganizes Wehrmacht logistics to better take advantage of the Pakt's growing highway network. \nIf passed supply factor will increase +10%, out of supply factory will decrease -15% and army fuel capacity will increase +12%."
 GER_reichstag_individual_autonomy_act_text:0 "§gIndividual Autonomy Act§!"
 GER_reichstag_individual_autonomy_act_tt:0 "The Individual Autonomy Act guarantees certain liberties for those who inhabit the Reich. \nIf passed Classical Liberal popularity will increase 1%, public meetings policy will improve, and political power gain will increase +0.07."
 GER_reichstag_law_against_bolshevik_subversion_text:0 "§gLaw Against Bolshevik Subversion§!"
 GER_reichstag_law_against_bolshevik_subversion_tt:0 "The Law Against Bolshevik Subversion targets socialist organizations which are believed to act against the interests of the German Reich. \nIf passed, Liberal Democracy popularity will increase 1%, the VAAF will receive a small loss in support in every state, libertarian socialist popularity will decrease -2%, and authoritarian socialist popularity will decrease -4%."
 ##term 2
 GER_reichstag_economic_growth_act_text:0 "§gEconomic Growth Act§!"
 GER_reichstag_economic_growth_act_tt:0 "The Economic Growth Act restructures the German economy to be more favorable to large industrial firms; such that growth and production will be encouraged. \nIf passed GDP will greatly increase and construction speed will increase +8%."
 GER_reichstag_political_stability_law_text:0 "§gPolitical Stability Law§!"
 GER_reichstag_political_stability_law_tt:0 "The Political Stability Law introduces increased powers for the Fuhrer, allowing him to participate in legislation more actively. \nIf passed stability will increase by +10% and strongarming the Reichstag will become 10% cheaper."
 GER_reichstag_civil_freedom_act_text:0 "§gCivil Freedom Act§!"
 GER_reichstag_civil_freedom_act_tt:0 "The Civil Freedom Act solidifies personal liberty within the Reich, and prevents persecution for personal creed. \nIf passed, Classical Liberal and Authoritarian Democracy popularity will both increase by 7%. Furthermore, the press rights, religious rights, and public meetings policies will all improve."
 GER_reichstag_innovation_bill_text:0 "§gInnovation Bill§!"
 GER_reichstag_innovation_bill_tt:0 "The Innovation Bill seeks to liberalize regulations for scientific and technical grants, in the hopes research and development can be supercharged. \nIf passed research speed will increase by 5% and research facilities development will improve."
 GER_reichstag_international_trade_reform_act_text:0 "§gInternational Trade Reform Act§!"
 GER_reichstag_international_trade_reform_act_tt:0 "The International Trade Reform Act promises a sweeping and unprecedented opening of the Reich's market. \nIf passed, trade law policy will open, construction speed will increase and army fuel capacity will increase by 15%."
 GER_reichstag_energy_security_act_text:0 "§gEnergy Security Act§!"
 GER_reichstag_energy_security_act_tt:0 "The Energy Security Act authorizes the construction of several new nuclear power plants across the nation. \nIf passed, 3 nuclear power plants will be constructed in 3 different states."
 GER_reichstag_age_majority_act_text:0 "§gAge Majority Act§!"
 GER_reichstag_age_majority_act_tt:0 "The Age Majority Act lowers the voting age to 17 years of age, allowing the youth more say in the affairs of the government. \nIf passed war support will increase 2% weekly."
 GER_reichstag_finance_freedom_law_text:0 "§gFinance Freedoms Law§!"
 GER_reichstag_finance_freedom_law_tt:0 "The Finance Freedoms Law protects private finance from government seizure and surveillance without due cause. \nIf passed GDP will increase and global building slots will increase by 10%."
 GER_reichstag_tax_waste_act_text:0 "§gTax Waste Act§!"
 GER_reichstag_tax_waste_act_tt:0 "The Tax Waste Act reduces national taxes and also massively simplifies the process of filing taxes saving time and money for everyone. \nIf passed the tax rate will lower and army recovery rate will increase by 15%. Less taxes is a strong motivator it seems."
 GER_reichstag_work_safety_reform_bill_text:0 "§gWork Safety Reform Bill§!"
 GER_reichstag_work_safety_reform_bill_tt:0 "The Work Safety Reform Bill cuts several national labor regulations. \nIf passed, the safety policy will worsen, construction speed will increase by 10%, building repair speed will increase 65% and monthly population growth will decrease -5%."
 GER_reichstag_popular_sovereignty_act_text:0 "§gPopular Sovereignty Act§!"
 GER_reichstag_popular_sovereignty_act_tt:0 "The Popular Sovereignty Act enshrines personal liberties within Reich law, protecting citizens and their businesses from tyrannical government overreach. \nIf passed, Authoritarian Democrat and Classical Liberal popularity will increase by 10% each and war support will increase +15%."
 GER_reichstag_personal_consciousness_law_text:0 "§gPersonal Consciousness Law§!"
 GER_reichstag_personal_consciousness_law_tt:0 "The Personal Consciousness Law protects all inhabitants in the Reich from prosecution due to said inhabitants relegion or ideology. \nIf passed drift defence will decrease by -30% and political power gain factor will increase by 35% \n§GTHis Lingering Will Fades...§!."
 GER_reichstag_pakt_trade_law_text:0 "§gIntra-Pakt Trade Law§!"
 GER_reichstag_pakt_trade_law_tt:0 "The Intra-Pakt Trade Law simplifies business regulations between Pakt members as well as selling off large swathes of redundant state owned land. \nIf passed, Germany will receive a boost to GDP growth."
 GER_reichstag_fair_market_act_text:0 "§gFair Market Act§!"
 GER_reichstag_fair_market_act_tt:0 "The Fair Market Act solidifies personal property protections, ensuring trade and industry can grow without fear of sudden and unjust expropriations. \nIf passed, global building slots will increase by 10% and income will greatly increase."
 GER_reichstag_production_act_text:0 "§gProduction Act§!"
 GER_reichstag_production_act_tt:0 "The Production Act creates generous contracts for German arms manufacturers. The Wehrmacht will have rifles and panzers aplenty. \nIf passed, 7 states receive a military factory and a large boost to RSP support."
 ##bomber's spring
 GER_reichstag_police_act_text:0 "§gReich Safety Act§!"
 GER_reichstag_police_act_tt:0 "The Reich Safety Act diverts significant funds from the Wehrmacht to internal security. How can we defend a nation that cannot even be called safe? \nIf passed RSP support will increase slightly in every state, conscription will decrease by -1% and security policy will improve. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rReich Police Act,§! §zPeoples Protection Act,§! §eShield Of The Masses Law§!"
 GER_reichstag_law_to_defend_liberty_text:0 "§gLaw To Defend Liberty§!"
 GER_reichstag_law_to_defend_liberty_tt:0 "The Law To Defend Liberty gives significant legal protections to non-state organizations including everything from churches to labor unions. It is hoped this concession will appease the LER and DAP somehwat. \nIf passed RSP support will increase slightly in every state, political power gain will decrease by -0.5 and 400 political power will be gained. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rLaw Against Unruly Populations,§! §zLaw For Reconciliation,§! §eMilitia Deployment Act§!"
 GER_reichstag_pakt_security_act_text:0 "§gPakt Security Act§!"
 GER_reichstag_pakt_security_act_tt:0 "The Pakt Security Act creates an international policing organization between all Pakt members. By working together, we can bring down this terrorist cabal! \nIf passed RSP support will increase significantly in every state, and every Pakt member will gain a boost to stability and war support. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n100 Days Will Be Added To Desperate Measures Timeout \n§RPassing This Law Locks Out:§! §rAnti-SS Law,§! §zGovermental Policing Act,§! §eOfficer Reform Law§!"
 GER_reichstag_riot_management_law_text:0 "§gRiot Management Act§!"
 GER_reichstag_riot_management_law_tt:0 "The Riot Management Act cracks down on political gatherings not previously approved by the local municipality. \nIf passed RSP support will increase slightly in every state, and stability will decrease -15%. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rInternal Fortification Act,§! §zPoland Act,§! §eEquitable Roads Act§!"
 GER_reichstag_consolation_act_text:0 "§gConsolation Act§!"
 GER_reichstag_consolation_act_tt:0 "The Consolation Act allocates significant amounts of the national budget for generous handouts to true blooded Germans. \nIf passed RSP support will increase slightly in every state, consumer goods usage will increase 10% and national expenses will increase drastically. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rNational Accounting Law,§! §zHeritage Protection Act,§! §eGeneral Rights Law§!"
 #vaaf laws
 ##term 1
 GER_reichstag_proletariat_protection_act_text:0 "§eProletariat Protection Act§!"
 GER_reichstag_proletariat_protection_act_tt:0 "The Proletariat Protection Act introduces strong legal bias for Trade Unions negotiating working conditions - pushing the labor unions into a powerful position withi the Reich's economy. \nIf passed, consumer goods usage will increase 5% and factory output will increase 10%."
 GER_reichstag_princeling_law_text:0 "§ePrinceling Law§!"
 GER_reichstag_princeling_law_tt:0 "The Princeling Law nationalizes personal properties and assets deem excessive and unproductive. These items are then sold off and the funds distributed to government programs. If passed stability will decrease by 10%, VAAF support will slightly increase in 5 states and income will slightly increase."
 GER_reichstag_fair_share_act_text:0 "§eFair Share Act§!"
 GER_reichstag_fair_share_act_tt:0 "The Fair Share Act greatly increases the minimum wage such that even low skilled workers are paid a generous salary. \nIf passed, construction speed will decrease by -3%, 75 political power will be gained, 4 states will receive a large boost VAAF support and minimum wage policy will improve. \nThat's a mouthful."
 GER_reichstag_free_union_act_text:0 "§eFree Union Act§!"
 GER_reichstag_free_union_act_tt:0 "The Free Union Act empowers trade unions and gives them greater political independence. \nIf passed the trade union policy will improve, Libertarian Socialist popularity will increase 8% and Authoritarian Socialist popularity will increase 5%."
 GER_reichstag_peoples_supremacy_act_text:0 "§ePeople's Supremacy Act§!"
 GER_reichstag_peoples_supremacy_act_tt:0 "The People's Supremacy Act grants certain VAAF aligned Reichsbanner paramilitaries legal protections; bringing them under the banner of the state, and the party. \nIf passed, Authoritarian Socialist popularity will increase 9%, stability will decrease -1% weekly and conscription factor will increase 10%. \n§RThis will empower the VAAF radicals.§! \n§YThis law is mutually exclusive with the Fair Election Act.§!"
 GER_reichstag_fair_election_act_text:0 "§eFair Reichstag Act§!"
 GER_reichstag_fair_election_act_tt:0 "The Fair Reichstag Act cracks down on political lobbying, and significantly decreases the influence of money in the Reich's policy making. \nIf passed, 100 political power will be lost and RSP + NSDAP support will slightly decrease in every state. \n§YThis law is mutually exclusive with the People's Supremacy Act.§!"
 GER_reichstag_orpo_regulation_act_text:0 "§eOrpo Regulation Act§!"
 GER_reichstag_orpo_regulation_act_tt:0 "The Orpo Regulation Act cracks down on ORPO overreach to ensure the Reich's national police force does not abuse its power. \nIf passed, the security policy will worsen and 5 states will receive large boosts to VAAF support."
 GER_reichstag_civil_security_law_text:0 "§eCivil Security Law§!"
 GER_reichstag_civil_security_law_tt:0 "The Civil Security Law aims to improve the Reich's internal security via creating a Home Guard style militia as well as investing in emerging digital cryptographic technologies. \nIf passed, Authoritarian Socialist popularity will increase 2%, conscription factor will increase 5% and encryption factor by 40%. \n§RThis will empower the VAAF radicals.§!"
 GER_reichstag_america_act_text:0 "§eAmerica Act§!"
 GER_reichstag_america_act_tt:0 "The America Act calls for diplomatic overtures to the United States of America in order to deepen ties between the republic and the Reich. \nIf passed, and if we have a detente with the US, construction speed will increase by 10% and the USA will receive a small boost to GDP. Regardless, KN trust will be boosted."
 GER_reichstag_economic_security_act_text:0 "§eEconomic Secuirty Act§!"
 GER_reichstag_economic_security_act_tt:0 "The Economic Security Act adjusts economic policy towards statism and protectionism. The VAAF holds that the need for a strong industry outweighs petty lust for wealth. \nIf passed 3 random states will receive a civilian factory and large boost to VAAF support. In addition, trade law policy will shift towards protectionism and tax rate policy will increase."
 GER_reichstag_law_for_total_freedom_text:0 "§eLaw For Total Freedom§!"
 GER_reichstag_law_for_total_freedom_tt:0 "The Law For Total Freedom's name is often joked about, though its contents are no laughing matter. With this law, the government will essentially have power to nationalize any industrial asset on a whim. \nIf passed then Authoritarian Socialist popularity will increase 4%, war support will decrease 1% weekly, and 6 states will receive arms factories. \n§RThis will empower the VAAF radicals.§! \n§YThis law is mutually exclusive with the Government Openness Act.§!"
 GER_reichstag_government_openness_act_text:0 "§eGovernment Openness Act§!"
 GER_reichstag_government_openness_act_tt:0 "The Government Openness Act forces meticulous transprency standards including freedom of information measures and sunshine laws for some government procedurals. \nIf passed political power gaine will decrease by -10%, stability will increase by 10%, Libertarian Socialism popularity will increase by 6% and compromising will become 10% cheaper. \n§YThis law is mutually exclusive with the Law For Total Freedom.§!"
 GER_reichstag_election_law_text:0 "§eLocal Voting Law§!"
 GER_reichstag_election_law_tt:0 "The Local Voting Law states that local municipal elections must be carried out to a same standard as general elections. Many local municipality elections operate much like "rotton boroughs" and suffer from corruption, nepotism, and catastrophically low turnout. \nIf passed, turnout will increase in every state and political power will increase by 120."
 GER_reichstag_judicial_overhaul_act_text:0 "§eJudicial Overhaul Act§!"
 GER_reichstag_judicial_overhaul_act_tt:0 "The Judicial Overhaul Act requires a public trial for all criminal and civil court cases. It also reenforces the right to legal counsel. \nIf passed, political power gain will decrease by -0.05, stability will increase 10% and the penal system policy will improve."
 GER_reichstag_okw_regulation_law_act_text:0 "§eOKW Regulation Act§!"
 GER_reichstag_okw_regulation_law_act_tt:0 "The OKW Regulation Act explicity prohibits active members of the Wehrmacht from participating in politics. It also also allows the Reichstag oversight over the Wehrmacht. \nIf passed, army attack will decrease by -5% and army organization will increase by 12%."
 GER_reichstag_absolute_democracy_law_text:0 "§eAbsolute Democracy Act§!"
 GER_reichstag_absolute_democracy_law_tt:0 "The Absolute Democracy Act specifies tighter recruitment standards for the Wehrmacht and civil service. The law is written in such a way that biases it towards those with sympathies towards the VAAF. For example, former members of the Reichsbanner would be considered desirable hires due to their "previous practical experience." \nIf passed, Authoritarian Socialism drift will increase by 0.01, conscription will decrease by -2% and every state will receive a large boost to VAAF support. \n§RThis will empower the VAAF radicals.§! \n§YThis law is mutually exclusive with the Inclusion Law.§!"
 GER_reichstag_inclusion_law_text:0 "§eInclusion Law§!"
 GER_reichstag_inclusion_law_tt:0 "The Inclusion Law creates work programs for destitute individuals. \nIf passed, 2 states will receive a small boost to VAAF support, 3 states will receive a small boost to VUP support and global building slots will increase 10%. \n§YThis law is mutually exclusive with the Absolute Democracy Act.§!"
 ##term 2 moderate
 GER_reichstag_fair_price_act_text:0 "§eJust Price Act§!"
 GER_reichstag_fair_price_act_tt:0 "The Just Price Act introduces price controls for many common household goods. \nIf passed, factory output will increase 5%, construction speed will increase 10%, and GDP growth will slightly decrease."
 GER_reichstag_peoples_welfare_act_text:0 "§ePopular Welfare Act§!"
 GER_reichstag_peoples_welfare_act_tt:0 "The Popular Welfare Act strengthens the social safety net of the Reich drastically, to the benefit of unemployed workers and invalids alike. \nIf passed, pensions, minimum wage, and unemployment policies will improve. Libertarian Socialism popularity will increase 4% and Authoritarian Socialism popularity will increase 2%."
 GER_reichstag_health_support_law_text:0 "§ePublic Health Law§!"
 GER_reichstag_health_support_law_tt:0 "The Public Health Law implements a public health insurance scheme to ensure that every individual has access to a decent level of healthcare. \nIf passed the healthcare policy will improve and monthly population growth will increase by 16%."
 GER_reichstag_societal_democracy_act_text:0 "§eSocietal Democracy Act§!"
 GER_reichstag_societal_democracy_act_tt:0 "The Societal Democracy Act is aimed at dismantling the class barriers that have long kept working Germans locked out of higher education, professional advancement, and meaningful workplace representation. The Act would establish universal educational access, expand codetermination rights, and create new pathways for social mobility across the Reich. \nIf passed, 4 states would receive a large boost to VAAF support and stability will increase 1% weekly. \n§GTHis Lingering Will Fades...§!"
 GER_reichstag_labor_rights_law_text:0 "§eRight Of Labour Law§!"
 GER_reichstag_labor_rights_law_tt:0 "The Right Of Labour Law is a comprehensive reform package seeking to enshrine fundamental workplace protections into federal law, including stricter safety standards, reduced maximum working hours, and stronger legal recourse for injured or exploited workers. The bill would establish independent inspection agencies with the authority to shut down non-compliant workplaces and levy substantial fines against negligent employers. \nIf passed, both the safety and unemployment policies will improve."
 GER_reichstag_fairness_act_text:0 "§eSchool Fairness Law§!"
 GER_reichstag_fairness_act_tt:0 "A landmark education bill that would create a national merit-based scholarship system open to all students of the Reich, regardless of income, or bloodline. The program would identify academically gifted youth through standardized assessment and guarantee them full funding through university completion. \nIf passed, research speed will increase 3% and the education policy will improve."
 GER_reichstag_local_minicipalities_law_text:0 "§eLocal Municipalities Law§!"
 GER_reichstag_local_minicipalities_law_tt:0 "The Local Municipalities Law grants the Gaus of Germany a certain level of autonomy in their decision making, even granting them Gau level legislatures. \nIf passed political power ill increase by 75 and weekly stability will increase 1%."
 GER_reichstag_internal_defense_act_text:0 "§eInternal Defence Act§!"
 GER_reichstag_internal_defense_act_tt:0 "The Internal Defence Act establishes a unified national defence policy for the entire Pakt. \nIf passed, army defence will increase 12% and conscription factor will increase 15%."
 GER_reichstag_friendship_of_nations_bill_text:0 "§eFriendship Of Nations Bill§!"
 GER_reichstag_friendship_of_nations_bill_tt:0 "The Friendship Of Nations Bill sponsors a plethora of foreign missions with the intent of deepening the Reich's ties with friendly nations and former enemies alike. \nIf passed, KN coherence will be boosted."
 GER_reichstag_anti_crime_act_text:0 "§eAnti-Crime Law§!"
 GER_reichstag_anti_crime_act_tt:0 "The Anti-Crime Law establishes harsh punishments for criminal behavior especially in regards to serial offenders. \nIf passed, war support will increase 1% weekly and we will gain 75 political power."
 GER_reichstag_public_works_bill_text:0 "§ePublic Infrastructure Bill§!"
 GER_reichstag_public_works_bill_tt:0 "The Public Infrastructure Bill invests significant funds into the construction of railways, trolleys, and metros. \nIf passed, 6 states will receive infrastructure and a small boost to VAAF support."
 GER_reichstag_work_permit_law_text:0 "§eWork Permit Act§!"
 GER_reichstag_work_permit_law_tt:0 "The Work Permit Act establishes labor regulations and introduces significant legal barriers from those seeking work who originate outside of the Pakt. \nIf passed, the trade law policy will increase regulation and consumer goods will decrease by 5%."
 GER_reichstag_penal_reform_law_text:0 "§ePenal Reform Law§!"
 GER_reichstag_penal_reform_law_tt:0 "The Penal Reform Law removes some overly harsh punishments for certain crimes, ensuring the judgement fits the wrongdoing. \nIf passed the penal system policy will improve and stability will change by +15%."
 GER_reichstag_reich_coop_act_text:0 "§eReich Coop Act§!"
 GER_reichstag_reich_coop_act_tt:0 "The Reich Coop Act allows the incorporation of labor cooperatives. \nIf passed, factory and dockyard output will both increase by 10%."
 GER_reichstag_reichsmark_boost_law_text:0 "§eReichsmark Stability Act§!"
 GER_reichstag_reichsmark_boost_law_tt:0 "The Reichsmark Stability Act establishes a series of monetary policies to ensure the Reichsmark remains stable and does not suffer from hyperinflation. \nIf passed, GDP and miscellaneous expenses will both increase. Stability will also increase 5%."
 ##term 2 radical
 GER_reichstag_absolution_law_text:0 "§eAbsolution Law§!"
 GER_reichstag_absolution_law_tt:0 "The Absolution Law grants the Fuhrer full authority to target all "enemies of the people." Whatever that means is shockingly variable. \nIf passed political power gain increase by +0.4 and stability will decrease 1% weekly."
 GER_reichstag_purity_law_text:0 "§ePurity Law§!"
 GER_reichstag_purity_law_tt:0 "The Purity Law essentially bans all individuals from the military that the VAAF considers unreliable. \nIf passed, conscription factor will decrease 30% and army recovery rate will increase 22%."
 GER_reichstag_total_defense_act_text:0 "§eTotal Defence Act§!"
 GER_reichstag_total_defense_act_tt:0 "The Total Defence Act diverts massive amounts of funds away from public services towards defence spending. \nIf passed war support will decrease 1% weekly and army defence will increase +16%."
 GER_reichstag_revision_act_text:0 "§eRevision Act§!"
 GER_reichstag_revision_act_tt:0 "The Revision Act grants the ruling party sweeping advantages in the Reichstag and elections alike. Examples include total authority over when and how votes are held and preferential advertisement placement for campaigning. Obviously this is designed to benefit the VAAF. \nIf passed, strongarming the Reichstag becomes 15% cheaper and boosting the ruling party becomes 15% cheaper."
 GER_reichstag_perfect_democracy_law_text:0 "§ePerfect Democracy Law§!"
 GER_reichstag_perfect_democracy_law_tt:0 "The Perfect Democracy Law is an autocratic proposition giving the VAAF outsized powers over the Reich's bureaucracy and civil society at large. The Fuhrer and the VAAF may hire and fire as it pleases and can deny pensions at will and may detain anyone for arbitrary reasons and without warrant. \nIf passed, Authoritarian Socialism drift will increase +0.05 weekly and monthly population will decrease -20%."
 GER_reichstag_protelarian_liberation_law_text:0 "§eProtelarian Liberation Law§!"
 GER_reichstag_protelarian_liberation_law_tt:0 "The Protelarian Liberation Law grants the government of the Reich immense powers over national industry, effectively transitioning the country to a command economy. \n If passed, factory out put increase by 30%, global building slots factor increase by 30% and consumer goods usage increases be 50%."
 GER_reichstag_bank_annihilation_act_text:0 "§eBank Annihilation Act§!"
 GER_reichstag_bank_annihilation_act_tt:0 "The Bank Annihilation Act liquifies every single bank in the Reich and ensures that finance is fully at the mercy of the state. \nIf passed, GDP and GDP growth will drop catastrophically and miscellaneous income will drastically increase."
 GER_reichstag_criminal_wealth_law_text:0 "§eCriminal Wealth Law§!"
 GER_reichstag_criminal_wealth_law_tt:0 "The Criminal Wealth Law targets the properties and assets of the wealthy, declaring most concentrated wealth to be inherently criminal. \nIf passed, industrial expertise, industrial equipment, and academic base will all worsen. However, construction speed will increase by 25%."
 GER_reichstag_bill_for_total_emancipation_text:0 "§eBill For Total Emancipation§!"
 GER_reichstag_bill_for_total_emancipation_tt:0 "The Bill For Total Emancipation declares that the proletariat has been liberated from the chains of bourgeois democracy. Voter turnout is expected to plummet as a result. \nIf passed, turnout will decrease by 30% in every state, 100 political power will be gained, and Authoritarian Socialism popularity will increase by 10%."
 GER_reichstag_workers_reich_law_text:0 "§eWorker's Reich Law§!"
 GER_reichstag_workers_reich_law_tt:0 "The Worker's Reich Law abolishes the electoral system in all but name, ensuring the VAAF will always emerge victorious regardless of the actual vote. \nIf passed, the VAAF will always win elections and 500 political power will be lost. \n§YTo pass this law you must have passed the Bill For Total Emancipation.§!"
 GER_reichstag_infinite_wealth_act_text:0 "§eInfinite Wealth Act§!"
 GER_reichstag_infinite_wealth_act_tt:0 "The Infinite Wealth Act promises that through total state control of the economy, wealth will flow endlessly to the people. In practice this means enormous tax increases and nationalization of private factories. \nIf passed, the tax rate will worsen, 40 civilian factories will be consumed for state use, and miscellaneous income will greatly increase."
 GER_reichstag_total_nationalization_law_text:0 "§eTotal Nationalization Law§!"
 GER_reichstag_total_nationalization_law_tt:0 "The Total Nationalization Law seizes every remaining private enterprise in the Reich under state control. \nIf passed, trade law and trade union policies will worsen, supply factor will decrease by 25%, and every state will receive a civilian factory."
 GER_reichstag_due_justice_law_text:0 "§eDue Justice Law§!"
 GER_reichstag_due_justice_law_tt:0 "The Due Justice Law targets individuals deemed to be enemies of the proletariat, namely those with ties to the old NSDAP and fascist elements. Justice in this case is rather loose. \nIf passed, Fascism drift will decrease by 0.1, National Socialism drift will decrease by 0.1, and roughly 48914 manpower will be lost."
 GER_reichstag_heavy_industry_act_text:0 "§eHeavy Industry Act§!"
 GER_reichstag_heavy_industry_act_tt:0 "The Heavy Industry Act diverts massive resources towards further militarizing the Rhineland industrial base. \nIf passed, four industrial states will each receive 2 arms factories and 2 extra building slots. National debt will also increase significantly."
 GER_reichstag_lawful_society_act_text:0 "§eLawful Society Act§!"
 GER_reichstag_lawful_society_act_tt:0 "The Lawful Society Act is the culmination of the VAAF radical agenda, declaring that the Reich has achieved a truly lawful socialist society. \nIf passed, Authoritarian Socialism popularity will increase by 40% and strongarming the Reichstag will become completely free. \n§GTHis Lingering Will Fades...§! \n§YTo pass this law you must have passed every law above it.§!"
 #bomber's spring
 GER_reichstag_protection_of_masses_law_text:0 "§eShield Of The Masses Law§!"
 GER_reichstag_protection_of_masses_law_tt:0 "The Shield Of The Masses Law calls for the reigning in of the ORPO in favor of locally organized defense committees. \nIf passed, VAAF support will increase slightly in every state, stability will decrease by 20%, and security policy will worsen. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rReich Police Act,§! §zPeoples Protection Act,§! §gReich Safety Act§!"
 GER_reichstag_militia_deployment_act_text:0 "§eMilitia Deployment Act§!"
 GER_reichstag_militia_deployment_act_tt:0 "The Militia Deployment Act calls for the creation of armed worker's militias to supplement the police. \nIf passed, VAAF support will increase slightly in every state, conscription factor will increase by 20%, army organization will decrease by 10%, and army recovery rate will decrease by 10%. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rLaw Against Unruly Populations,§! §zLaw For Reconciliation,§! §gLaw To Defend Liberty§!"
 GER_reichstag_orpo_reform_act_text:0 "§eOfficer Reform Law§!"
 GER_reichstag_orpo_reform_act_tt:0 "The Officer Reform Law reorganizes the ORPO and places it under dire Reichstag oversight. All actions of the ORPO will be henceforth scrutinized exhaustively.\nIf passed, VAAF support will increase slightly in every state and 300 political power will be lost. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rAnti-SS Law,§! §zGovermental Policing Act,§! §gPakt Security Act§!"
 GER_reichstag_equitable_roads_act_text:0 "§eEquitable Roads Act§!"
 GER_reichstag_equitable_roads_act_tt:0 "The Equitable Roads Act invests in infrastructure in areas with large Polish populations, in an effort to win over support from the LER. \nIf passed, 3 Polish states will receive infrastructure and a large boost to VAAF support. Global building slots will decrease by 20%. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n80 Days Will Be Added To Desperate Measures Timeout \n§RThis is a drastic measure.§! \n§RPassing This Law Locks Out:§! §rInternal Fortification Act,§! §zPoland Act,§! §gRiot Management Act§!"
 GER_reichstag_general_rights_law_text:0 "§eGeneral Rights Law§!"
 GER_reichstag_general_rights_law_tt:0 "The General Rights Law guarantees fundamental freedoms for all inhabitants of the Reich, regardless of race or creed. \nIf passed, VAAF support will increase significantly in every state, weekly stability will increase by 1% and Libertarian Socialism popularity will increase by 8%. The effects of the Bomber's Spring will be reduced and we will get one step closer to ending the terrorist menace. \n100 Days Will Be Added To Desperate Measures Timeout \n§RPassing This Law Locks Out:§! §rNational Accounting Law,§! §zHeritage Protection Act,§! §gConsolation Act§!"
 #dg laws
 ##term 1
 GER_reichstag_water_act_text:0 "§TWater Act§!"
 GER_reichstag_water_act_tt:0 "The Water Act introduces strict regulations on industrial water pollution and invests in clean water infrastructure. \nIf passed, pollution development will improve, stability will increase by 10%, and 4 random states will receive a large boost to Die Grünen support."
 GER_reichstag_youth_act_text:0 "§TYouth Freedom Act§!"
 GER_reichstag_youth_act_tt:0 "The Youth Freedom Act establishes outdoor education programs and environmental awareness campaigns for the youth. \nIf passed, army organization will increase by 5% and 3 random states will receive a large boost to Die Grünen support."
 GER_reichstag_park_act_text:0 "§TReich Park Act§!"
 GER_reichstag_park_act_tt:0 "The Reich Park Act designates large swathes of land as protected national parks. \nIf passed, pollution development will improve and 4 random states will receive a large boost to Die Grünen support."
 GER_reichstag_building_code_act_text:0 "§TBuilding Code Act§!"
 GER_reichstag_building_code_act_tt:0 "The Building Code Act introduces strict environmental requirements for all new construction in the Reich. \nIf passed, political power factor will increase by 10%, construction speed will decrease by 10%, and 4 random states will receive a large boost to Die Grünen support."
 GER_reichstag_personal_liberty_act_text:0 "§TPersonal Liberty Act§!"
 GER_reichstag_personal_liberty_act_tt:0 "The Personal Liberty Act ensures personal freedoms and environmental rights for all citizens. \nIf passed, Die Grünen support will increase slightly in every state, political power gain will increase by +0.05, and Liberal Democrat popularity will increase by 3%."
 GER_reichstag_clean_air_law_text:0 "§TClean Air Law§!"
 GER_reichstag_clean_air_law_tt:0 "The Clean Air Law introduces stringent emissions standards for industry and transportation. \nIf passed, pollution and agricultural development will both improve, army organization regain will increase by 5%, and 4 random states will receive a large boost to Die Grünen support."
 GER_reichstag_green_cities_act_text:0 "§TGreen Cities Act§!"
 GER_reichstag_green_cities_act_tt:0 "The Green Cities Act mandates the creation of urban green spaces, parks, and gardens in every major city. \nIf passed, monthly population growth will increase by 20% and 4 random states will receive a large boost to Die Grünen support."
 GER_reichstag_endangered_species_law_text:0 "§TEndangered Species Law§!"
 GER_reichstag_endangered_species_law_tt:0 "The Endangered Species Law introduces protections for threatened wildlife and establishes conservation programs across the Reich. \nIf passed, KN popularity will be boosted and 4 random states will receive a large boost to Die Grünen support."
 GER_reichstag_anti_dumping_act_text:0 "§TAnti-Dumping Act§!"
 GER_reichstag_anti_dumping_act_tt:0 "The Anti-Dumping Act cracks down on illegal waste disposal and imposes heavy fines on corporations that pollute waterways and forests. \nIf passed, pollution policy will improve, consumer goods usage will decrease by 5%, and 4 random states will receive a large boost to Die Grünen support."
 GER_reichstag_pesticide_regulations_act_text:0 "§TPesticide Regulations Act§!"
 GER_reichstag_pesticide_regulations_act_tt:0 "The Pesticide Regulations Act bans the use of harmful chemical pesticides in agriculture, promoting organic farming methods. \nIf passed, agricultural development will improve, supply factor will increase by 10%, and 4 random states will receive a large boost to Die Grünen support."
 GER_reichstag_woman_law_text:0 "§TWoman Emancipation Law§!"
 GER_reichstag_woman_law_tt:0 "The Woman Emancipation Law grants women equal rights in employment, education, and public life. \nIf passed, conscription factor will increase by 10%, women's rights will improve, Liberal Democrat popularity will increase by 3%, and Die Grünen support will increase slightly in every state."
 GER_reichstag_civil_service_promotion_bill_text:0 "§TCivil Service Promotion Bill§!"
 GER_reichstag_civil_service_promotion_bill_tt:0 "The Civil Service Promotion Bill reforms the civil service to prioritize merit and environmental consciousness in government hiring. \nIf passed, 4 random states will receive a large boost to Die Grünen support."
 ##term 2
 GER_reichstag_purge_law_text:0 "§bPurge Regulation Law§!"
 GER_reichstag_purge_law_tt:0 "The Purge Regulation Law authorizes the removal of all individuals deemed hostile to the green revolution. Hundreds of thousands will be displaced, imprisoned, or worse. \nIf passed, roughly 358,000 manpower will be lost, stability will decrease by 40%, and weekly stability will increase by 5%."
 GER_reichstag_act_against_overpopulation_text:0 "§bAct Against Overpopulation§!"
 GER_reichstag_act_against_overpopulation_tt:0 "The Act Against Overpopulation introduces horrific population control measures under the guise of environmental sustainability. \nIf passed, monthly population growth will decrease by 50% and Ultranationalism drift will increase by +0.05."
 GER_reichstag_fortified_borders_act_text:0 "§bFortified Borders Act§!"
 GER_reichstag_fortified_borders_act_tt:0 "The Fortified Borders Act seals the Reich's borders entirely, closing the nation off from all foreign trade. \nIf passed, trade law will be set to Closed Economy and trade opinion will decrease by 80%."
 GER_reichstag_back_to_land_act_text:0 "§bBack To The Land Act§!"
 GER_reichstag_back_to_land_act_tt:0 "The Back To The Land Act forcibly relocates urban populations to rural areas in the name of a return to agrarian life. \nIf passed, six urban states will be depopulated as their residents are relocated to neighboring rural states, and ultranationalist popularity will rise."
 GER_reichstag_blood_and_soil_law_text:0 "§bBlood And Soil Law§!"
 GER_reichstag_blood_and_soil_law_tt:0 "The Blood And Soil Law seals Germany's borders and establishes a paranoid surveillance state to ensure ideological purity. It also restricts freedom of travel to areas where individuals place of birth. \nIf passed, immigration policy will be set to Closed Borders, encryption will increase by 100%, and drift defence will increase by 40%."
 GER_reichstag_strength_of_will_law_text:0 "§bStrength Of Will Law§!"
 GER_reichstag_strength_of_will_law_tt:0 "The Strength Of Will Law mobilizes the entire population for industrial labour, working them to the bone in the name of the Green Reich. \nIf passed, factory output will increase by 20% and monthly population growth will decrease by 30%."
 GER_reichstag_annihilation_of_filth_act_text:0 "§bAnnihilation Of Filth Act§!"
 GER_reichstag_annihilation_of_filth_act_tt:0 "The Annihilation Of Filth Act targets so-called impure elements of society for elimination. A campaign of mass purges through environmental policy. \nIf passed, monthly population growth will decrease by 60%, conscription factor will decrease by 20%, and army recovery rate will increase by 25%."
 GER_reichstag_agrarian_society_law_text:0 "§bAgrarian Society Law§!"
 GER_reichstag_agrarian_society_law_tt:0 "The Agrarian Society Law transforms the Reich into a fundamentally agrarian state. Industry is to serve the soil, not the other way around. \nIf passed, agricultural development will improve and global building slots will increase by 20%."
 GER_reichstag_green_reich_law_text:0 "§bGreen Reich Law§!"
 GER_reichstag_green_reich_law_tt:0 "The Green Reich Law bans the use of fossil fuels for private individuals across the Reich in a radical attempt at environmental preservation. \nIf passed, army fuel capacity will decrease by 15% and consumer goods usage will decrease by 20%."
 GER_reichstag_final_solution_act_text:0 "§bFinal Solution Act§!"
 GER_reichstag_final_solution_act_tt:0 "The Final Solution Act. The name says it all. A total campaign of extermination against all those deemed enemies of the green Reich. \nIf passed, conscription will decrease by 3%, weekly war support will increase by 6%, and monthly population growth will decrease by a catastrophic 80%."
 GER_reichstag_demolition_act_text:0 "§bDemolition Act§!"
 GER_reichstag_demolition_act_tt:0 "The Demolition Act calls for the destruction of urban infrastructure and the return to a pre-industrial landscape. \nIf passed, construction speed will decrease by 50%, army organization regain will increase by 15%, and army speed will increase by 15%."
 GER_reichstag_environmental_tax_act_text:0 "§bEnvironmental Tax Act§!"
 GER_reichstag_environmental_tax_act_tt:0 "The Environmental Tax Act introduces crushing taxation on all economic activity under the guise of environmental protection. \nIf passed, the tax rate will be set to Exploitative Taxation, 5 civilian factories will be requisitioned, and miscellaneous income will massively increase."
 GER_reichstag_national_security_act_text:0 "§bNational Security Act§!"
 GER_reichstag_national_security_act_tt:0 "The National Security Act establishes a vast surveillance network to monitor all citizens and crush dissent. \nIf passed, breakthrough will increase by 5%, decryption will increase by 40%, and research speed will decrease by 5%."
 GER_reichstag_foreign_agents_act_text:0 "§bForeign Agents Act§!"
 GER_reichstag_foreign_agents_act_tt:0 "The Foreign Agents Act declares that all opposition to the green regime is the work of foreign agents and must be eliminated. \nIf passed, army organization will increase by 20%, stability will decrease by 20%, and war support will decrease by 20%."
 GER_reichstag_lightning_and_sun_law_text:0 "§bLightning And Sun Law§!"
 GER_reichstag_lightning_and_sun_law_tt:0 "The Lightning And Sun Law abolishes all political parties save for Die Grünen, establishing a one-party state under the banner of ecological totalitarianism. \nIf passed, the political party policy will be set to One Party State and army attack will increase by 20%. \n§GTHis Lingering Will Fades...§! \n§YTo pass this law you must have passed every law above it.§!"
