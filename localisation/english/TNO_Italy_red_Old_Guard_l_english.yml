###=====| b) Onorato Damen Cabinet |=====###
 ITA_Onorato_Damen: "Onorato Damen"
 POLITICS_DESC_ONORATO_DAMEN: "Life for communists living under a fascist regime is often a cruel one. But one must never lose heart. For even in the face of adversity, there is still hope that one day socialism will triumph. And that day came for Onorato Damen.\n\nBorn in 1893 to a poor family in central Italy, Damen joined the socialist cause very early in his youth, campaigning for the Italian Socialist Party until he got drafted to fight in World War One, an opportunity he used to spread propaganda in the trenches. Demoted and incarcerated, after his release Damen joined the Partito Comunista d'Italia and quickly made himself a name by virtue of his indefatigable activism, eventually associating with Amedeo Bordiga, before being finally arrested in 1927 and sentenced to 12 years of prison. But Damen remained undeterred, and with the help of other incarcerated comrades, he organized a prison revolt and evaded jail. Over the years, in the remote countryside and the impoverished suburbs, Damen managed to evade the gaze of the OVRA long enough to slowly solidify a clandestine support base among the poor classes of Italy, the ones most suffering under the fascist yoke. As the government collapsed right after the disastrous Verona conference, Damen led the Italians from the frontlines to topple the fascist regime.\n\nToday, Damen finds himself leading a new Italy, one free from fascist and capitalist oppression, but the work is not yet done. Damen's plans for the country are the immediate transition towards socialist democracy; any "transitional" or "state capitalist" stage must be over and done as quickly as possible, and that the revolution should immediately take an international, global character. While he knows this uncompromising position endears him little support, he is also ready to do anything to advance the communist cause. Unlike his mentor Bordiga, Damen is not afraid of getting his hands dirty participating in direct action, nor is he above scheming and intrigue. The pupil has already surpassed the master, now it is time to lead the way."
