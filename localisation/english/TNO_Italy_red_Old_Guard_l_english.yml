# Old Tree
ITA_RED_the_land_hunger: "The Land Hunger"
ITA_RED_the_land_hunger_desc: "Despite our victory in the revolution, there are still massive disparities in land ownership across the country, particularly in the rural south. Yes, despite our best efforts to end the wretched inequalities in this country, farmers living off of glorified gardens in squalor still live in the shadow of manors with acre upon acre of land, half of which isn't even used. The rural poor are hungry and landless, their bellies as empty as their miniscule fields. Something must be done before this gets worse and famine begins to set in on our ailing populace in the south. Land will be reorganized to feed every family we can and introduce further efficiency and justice to a woefully inefficient, unfair system."
ITA_RED_piu_forti_i_quadri: "Più Forti i Quadri, Migliore l'Organizzazione"
ITA_RED_piu_forti_i_quadri_desc: "The Italian proletariat may be far more developed than that of Russia in the years immediately following the Revolution, it remains scattered and unorganized. The workers are in desperate need of leadership and organization, and should this situation continue, then the Revolution will be left undefended from the looming counter-revolutionary threat.\n\nThe PCI must take upon itself this role and march forward with the working class as the vanguard that leads it towards the establishment of a communist society."
ITA_RED_a_model_of_soviet_democracy: "A Model of Soviet Democracy"
ITA_RED_a_model_of_soviet_democracy_desc: "Italy now stands as one of the few true socialist states in the world. Therefore, as heirs of Lenin and the October Revolution, it is our duty to emulate the practice of Soviet democracy.\n\nWe will not be beholden by the limits of bourgeois democracy.\n\nWe will not be beholden by the reaction of fascism.\n\nWe shall become a worker's state for all to take inspiration from, and carry on the torch that Lenin ignited."
ITA_RED_paint_iri_red: "Paint IRI Red"
ITA_RED_paint_iri_red_desc: "For most of its history, the IRI(Istituto per la Ricostruzione Industriale) has been a pawn in the hands of the fascist regime, a tool used to consolidate its toxic hold over the means of production. Nevertheless, the IRI shows potential. Through thorough reorganisation, we can transform this decrepit, reactionary mess into a revolutionary institution that serves the vanguard and aims to return production back into the hands of the workers."
ITA_RED_the_party_and_the_people: "The Party and the People"
ITA_RED_the_party_and_the_people_desc: "While the Revolution has undoubtedly been a success, we do not quite match the ideals we have set for ourselves. The Party still can seem inaccessible, and there are areas that remain outside of our reach.\n\nIt is of utmost importance that we correct these errors. As the vanguard of the proletariat, we must ensure that we are well-integrated into local communities across Italy, and that the Party is accessible to all.\n\nIt is also a matter of trust: If the Party is accessible, then it will be perceived that way, and therefore less alien to the people. If we are more familiar, more integrated, and more accessible, then the people will be more receptive to our ideals."
ITA_RED_organize_the_economy: "Organize the Economy"
ITA_RED_organize_the_economy_desc: "We have been hard at work industrializing much of Italy and working around our economic downturn. However, there is still a lack of organization.\n\nMuch of the factories lack communication between each other. This lack of communication in turn damages our supply chain.\n\nWe must strive to correct these deficiencies, or recovering from our economic struggles will become a far more daunting task."
ITA_RED_revitalize_northern_industry: "Revitalize Northern Industry"
ITA_RED_revitalize_northern_industry_desc: "The North has been the most industrialized part of our nation, but that industry is still lacking. Compounding matters is that the North was hit the hardest by the bombings during the war.\n\nWhile many factories have been rebuilt, and the economy is getting better, the logistical infrastructure hasn't. Many factories continue to go unoccupied, wasting away due to neglect.\n\nPrograms should be implemented to grant a push to northern industry, in order to revive Italy after the war."
ITA_RED_into_virgin_lands: "Into Virgin Lands"
ITA_RED_into_virgin_lands_desc: "Southern Italy remains neglected by our economic policies. So far, much of the focus in the region has been on redistribution, as opposed to true industrialization.\n\nBy expanding on existing programs, we will industrialize the South.\n\nWe will revitalize the South.\n\nWe shall turn the South from a rural emptiness into the backbone of Italy."
ITA_RED_communism_equals_soviet_power_plus_electricity: "Communism = Soviet Power + Electricity"
ITA_RED_communism_equals_soviet_power_plus_electricity_desc: "Communism's survival in this country will be determined by many things, but especially critical right now is our ability to power our machines and fuel our revolution.\n\nWe must electrify the entirety of Italy as soon as possible.\n\nIt is best that we achieve these goals through Soviet-styled organizing techniques, they've been proven capable, and now is not the time to take unnecessary risks. If we follow through on these plans, we will be able to build true communism."
ITA_RED_organize_the_working_class: "Organize the Working Class"
ITA_RED_organize_the_working_class_desc: "The working class of Italy lacks direction.\n\nEven worse, the working class is not nearly as revolutionary as we had hoped.\n\nThis needs to be changed before communism can be achieved. Without the allegiance of the working class, our revolution will surely fail.\n\nWe should reform and refine our party's organization, and introduce those organizing techniques to the working class of Italy.\n\nThe revolution shall be brought to all peoples within Italy, and if properly organized, it will survive."
ITA_RED_absorb_all_unions_into_cgil: "Absorb all Unions into CGIL"
ITA_RED_absorb_all_unions_into_cgil_desc: "Unions within Italy have become divided into several competing organizations. In this fractured and divided state, the unions lack any real unity.\n\nTo unite Italy's labor, we must utilize the Confederazione Generale Italiana del Lavoro, or the Italian General Confederation of Labor.\n\nWe shall absorb the various competing unions into the CGIL, forming a singular, united union that can represent all the workers of Italy. Free from competition and division, this model shall be far more efficient and effective at bringing the revolution to the working class."
ITA_RED_work_and_enjoy_yourselves: "Work and Enjoy Yourselves"
ITA_RED_work_and_enjoy_yourselves_desc: "Labor is something people tend to dread, a negative perception that we greatly wish to destroy.\n\nWe must educate the people of Italy to not dread the work they perform. The workers of Italy should be willing and enthusiastic to perform their labor, enjoying their self-improvement over the relentless pursuit of profit and expansion mandated by other forms of governance.\n\nIf the workers of Italy enjoy the labor they put into the nation, they will be far more willing to help build the socialist project we are constructing in Italy.\n\nIt is imperative that people enjoy both labor and the revolution if socialism is to survive in this nation."
