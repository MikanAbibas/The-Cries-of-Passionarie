ITA_RED_secchia.112.t: "The Sword of Damocles"
ITA_RED_secchia.112.desc: ""Pietro, it is not such a big deal. All they are doing is organizing, we still hold a majority of support, including my internationalists," Feltrinelli explained in an attempt to calm the obviously stressed Secchia.\n\n"It is factionalism, just as I feared Giangiacomo!," uttered Secchia. "The Catholics, the radicals, even the Bolshevists are going to tear us all apart. I swear these fools have taken the dagger Stalin plunged into Bukharin's back and now hold it over my head!"\n\n"Oh Pietro, how paranoid you are!" Feltrinelli chuckled, "All we need is a major victory to inspire them, a successful intervention in the Balkans perhaps? Or maybe something domestic, to represent party unity..."\n\nGazing a thousand yards past the other man, Pietro Secchia knew that much more drastic action was needed. While he still had the Marxist-Leninists and Feltrinelli's New Left faction backing him, the opposition would need to be broken down and eliminated as a threat. A purge was needed, and the official preparations must be initiated immediately. Names had already been picked out, all that remained was to wait for the perfect opportunity to strike.\n\nOnce his hold on the government was secure, that would be the moment he could finally implement Marx's dream. That would be when Italy, acting as the vanguard of communism, would rise to lead the International against all the evils that currently plague the world. Until then however, a much more pragmatic mindset was necessary. He needed to step carefully. Who knows what sort of vipers could be hiding, poised to spread their venom?"
ITA_RED_secchia.112.a: ""Pietro? Are you alright?""

ITA_RED_secchia.113.t: "New Directives from Rome"
ITA_RED_secchia.113.desc: "The Ministry of Education today announced the creation of the Educators Union, an association of teachers and professors who had been vetted by the government to be entrusted with teaching in Italy. The Union existed in name to ensure that schools and universities throughout the countryside would be free of fascist or capitalist infiltration. Emil knew that it really was another attempt by the PCI to create yet another socialist organization that would serve their ideological interests.\n\nEmil was a bureaucrat working in the Ministry of Communications, and he had seen this pattern repeating again and again since the revolution. Every institution from the old Kingdom was being either dismantled or replaced with blatantly communist ones in an attempt by President Secchia's administration to obtain total control over the government. Even the organizations left untouched by the fascists were not safe, as apolitical as some were.\n\nEmil sighed, knowing deep in his heart that he too would be faced with these reforms, and it was entirely likely he would be forced out in favor of some stooge of the PCI. He didn't mind too much, he was only a year from retirement after all, but he was disappointed. Whatever socialist apparatus replaced his office would be more focused on ideological purity rather than effective management, which would inevitably decrease the Ministry's effectiveness.\n\nAfter dwelling on the issue, Emil went back to work checking radio licenses. He hadn't been replaced yet, and he still had a job to do."
ITA_RED_secchia.113.a: "Out with the old, in with the new."

