###=====| CHARACTERS |=====###
#############################
###=====| a) Pietro Secchia Cabinet |=====###
 ITA_Pietro_Secchia: "Pietro Secchia"
 POLITICS_DESC_PIETRO_SECCHIA: "The events of the second World War proved Bukharin wrong. Socialism cannot survive in one country, for the entrenchment of the reactionaries is too strong to expel them with passivity. Instead, the revolutionary must take decisive action against the capitalist world, and no one embodies this idea better than the old revolutionary Pietro Secchia. When poverty turned a bright future in school into a job in a wool factory, Secchia was quickly exposed to socialism and brawling with fascists on the strike lines.\n\nNarrowly escaping arrest in the 1930s, Secchia travelled to the Soviet Union where he made the acquaintance of prominent communist Palmiro Togliatti, and accompanied him to Spain on the orders of Party Secretary Antonio Gramsci as a representative of the Communist International, coordinating the fight against fascism until the fall of the Republican forces. While Togliatti returned to Moscow and vanished in the subsequent wars over that damned city, Secchia travelled beyond Europe, first as an agent of the Communist International, then on his own once the Soviet Union collapsed.\n\nAnd as he travelled, Secchia began to see the truth Bukharin had failed to recognize- socialism in one country would inevitably fail, as revolutionary flames burned down to embers. Throughout his travels, he witnessed the brushfires of conflict around, and resolved to take the lessons of these wars home to Italy. Now that the communist cause has prevailed against all odds, Secchia has no intention of letting it fail again. Under his guidance, the Italian people shall show the world their fervor has not dimmed, and the revolution unites under the red banner once more."
 ITA_Umberto_Terracini: "Umberto Terracini"
