###=====|a) Flavor |=====###

ITA_old_guard_flavor.1.t: "The Old Soldier"
ITA_old_guard_flavor.1.desc: "He could still picture the trenches that he had rotted in all those years ago in Spain. He could still remember the agony of having to wait hours upon hours in the blistering heat, with little to take his mind off the pain. He could still remember the rats, how they scurried around each night just waiting for some poor fool to have let their guard down. He could still remember how he felt when the nationalists took Madrid, and when he was forced to flee over the mountains to the relatively safe haven of France.\n\nHe could also never forget the West Russian War. Never before had he witnessed such barbarity. The empty villages, the emaciated figures, the patches of fresh dirt hiding an already known secret. Even now, in the Mediterranean heat, he could still feel the chill of that dreadful winter. He could still feel the panic of the final route, and the crushing numbness of that final journey from Archangel.\n\nAny decent lunatic would have quit after this set of failures, but Matteo de Leon still hoped against all odds that the revolution would succeed, despite the crushing reaction of the German giant that had suffocated Europe for decades now. After all, for those few dark years after Russia, it did truly seem like hope was all they had left.\n\nBut now, after the Verona conference in Italy, much had changed. The people were now taking to the streets, and it did look like the government was soon going to be overwhelmed by the sheer scale of those that they had angered. For a third time, it seems, he would fight on the side of the people."
ITA_old_guard_flavor.1.a: "Once again, he stepped into the fray."

ITA_old_guard_flavor.2.t: "Premature Optimism?"
ITA_old_guard_flavor.2.desc: "Up until King Umberto had been killed, Matteo barely even thought that anything would come of his trip to Italy. Whilst the King's government was quite clearly unstable, it had surprised everyone just how weak its foundations had been. As weeks turned to months, the rot of the dictatorship had been revealed to everyone, and then all it took was a single shot to finally render the reactionaries lame and useless.\n\nNow, with his aid, the partisan group that he had joined had taken over their local town, Biella. The celebration on the streets at the news from his unit took him back to the early days of Spain, where emotions ran like the alcohol did. Amongst the waving red flags and the cheering crowd, Matteo truly felt alive. This was what he had been working for all his life, after all, and soon it might just be time to relax and bask in the glory of the freedom that he had helped to win.\n\nDespite all of this, however, doubt still echoed in his mind. What if the rightists reorganised? What if America, or, worse yet, Germany came to the reactionary's aid and crushed the nascent revolution? Such a scenario was difficult to countenance, and yet all too plausible. It might not be long until all that he had won would be lost.\n\nBut, still, he had to keep fighting. Pushing the grim premonition from his mind, he walked over to assist a comrade, who seemed to be struggling in servicing his old and rusty gun."
ITA_old_guard_flavor.2.a: "They were surely not near victory already."

ITA_old_guard_flavor.3.t: "A Slight Lull"
ITA_old_guard_flavor.3.desc: "The street in front of him, which had been filled with militiamen waving the red flag and angry crowds just weeks ago, seemed to have returned to normal. Already, most of the visible scars of the revolution had been cleared from view, and the debris left by the rioting and fighting was nowhere to be seen.\n\nThis meant that soldiers like him were less needed now. De Leon was exhausted, and for the past several days he had been trying to relax as much as he could in a country where many things were still foreign to him. Every conversation with others seemed to require an elaborate string of hand gestures to communicate the most basic of things, and it seemed to be impossible to make any friends whatsoever, given the vast amount of travelling one had to do as a soldier.\n\nStill, these concerns were petty compared with the worries of a few months ago, where one wrong move would mean a bullet entering your skull. Matteo knew what was in store all those years ago back at the Spanish border, and he did not for a second think about giving up and going home. The life of a revolutionary was usually far from romantic, and the brief periods of calm that he experienced, such as now, would always come to an end someway or another.\n\nAt least for now, though, de Leon could take a moment to relax and perhaps even enjoy Rome. After all, he thought, there is no point in fighting for a better world if you cannot enjoy it "
ITA_old_guard_flavor.3.a: "A short respite."

ITA_old_guard_flavor.4.t: "The End of the Dream?"
ITA_old_guard_flavor.4.desc: "Of course. It was never that simple. Reactionaries could never just let the people enjoy what small victories they had won. All they could do was mindlessly destroy whatever gains the proletariat had made, and mercilessly exterminate whatever resistance they could find. Until the earth itself was destroyed, it seemed that the only gift for those who sought utopia was the same present that had been given to the inhabitants of Moscow and Guernica : a painful death.\n\nDe Leon had expected it, of course. Even a fool would have been able to foresee the incarnation of reaction itself trying whatever it could to snuff out the brightest fire of revolution that had been lit in Europe for decades. But this soon after the swift crushing of Farinacci's pathetic rebellion? It was definitely surprising to many.\n\nMatteo knew what he had to do, of course. It was time to, once more, go into the fray, and try to halt and push back the fascist menace. Fighting against the army that had brought Europe to its knees once more was a daunting prospect. The news of some positions being able to hold for longer than expected did not help much to alleviate his worries. Surely, this was just an anomaly, and soon enough the swastika would be draped over the ruins of the coliseum.\n\nHis comrades held similar worries as well. From what little Italian he could now understand, he could tell that they were thinking of what might happen to their families, of what might happen to them, of what might happen to their country, should they lose."
ITA_old_guard_flavor.4.a: "It all comes tumbling down."

ITA_old_guard_flavor.5.t: "Victory, Against All Odds"
ITA_old_guard_flavor.5.desc: "The three words that De Leon had just heard were the sweetest that anyone could have ever said to him. They had won. Germany, once the master of Europe, had been utterly routed and humiliated by a country that had not existed just 3 years before. The bombings, the shellings and the machine gun fire would now be a thing of the past, and De Leon wouldn't have to worry about the threat of death at any moment.\n\nImmediately after the message had reached their position, cheers and whoops erupted. The euphoria was so great for many that they began to shoot bullets into the air, and yell like children. De Leon knew that, back home, the families of his comrades would also be getting the news, and that they would be celebrating as well.\n\nIn a few hours, he would probably go to the nearest bar with his comrades, and drink as much as his body would allow. But what would he do after that? The revolution in Italy was still young, and it may need defending once more. Balbo's forces, which had begun to mass in East Africa, would surely be a grave danger if they ever decided to march northwards, and there was no guarantee that the fascists would not roll the dice in a second attempt to destroy socialism.\n\nThe future could wait, though. Now was not a time for looking ahead, but a time for rejoicing at what they had all achieved. Whatever dangers may come in the future, De Leon was sure they would not be as menacing as the German invasion."
ITA_old_guard_flavor.5.a: "A celebration was at hand."

ITA_old_guard_flavor.6.t: "An Aged Revolutionary's Rest"
ITA_old_guard_flavor.6.desc: "It was that time already, thought Matteo. The sky was a light shade of pink, and the sun would soon be disappearing from the horizon altogether. This beautiful show had become familiar to De Leon during his time in Italy, and it was becoming one of the things that had endeared him most to the country.\n\nHe hadn't always envisioned staying in Italy this long. Throughout most of his adult life, he had never been able to settle down in one place. The call of new revolutions had always enticed him to move to somewhere new every once in a while, and he had initially thought that Italy would have been no different.\n\nWithout a doubt, he had been proven wrong now. Many people in his neighbourhood now at least knew his name, and he was truly starting to feel like he fit in. Navigating the streets close to his apartment was much less of a hassle now, and most conversations now required less awkward hand waving, and he could now read and write some basic Italian.\n\nPerhaps his stay in Italy might even be permanent. Matteo was certainly feeling his age, and every day the wounds of past wars seemed to give him more trouble, and even normal acts were starting to tire him out somewhat. Whatever he chose to do, however, he was just grateful that he had had the opportunity to make a difference."
ITA_old_guard_flavor.6.a: "Perhaps, the old soldier might finally find peace."

