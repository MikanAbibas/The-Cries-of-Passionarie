ITA_RED_secchia.101.t: "Secchia's Address"
ITA_RED_secchia.101.desc: ""Comrades! Our work thus far defending the revolution has been admirable. When Germany attacked, many thought that our cause was hopeless. However, the months of fighting from our brave comrades has shown that we can defend ourselves. Despite the bullets, despite the shells, and despite the bombs, we have survived, and now, at least for the time being, we are safe against external threats."\n\n"However, we must remain vigilant. Our victory against Germany is not the end of our struggle against imperialism and capitalism, but merely one part in it. In Italy, counter revolutionary forces still remain, plotting a return to the old system of exploitation. Further away, in Tokyo, Washington, and in Germania, those who benefit from the old order are currently devising plans to destroy what gains we have made here."\n\n"For this reason, it is vital that we proceed with the socialisation of the economy at a fast pace. If left too long, capitalist elements will fester, and work against us. Furthermore, it is also necessary to bolster and build up a proletarian army, to protect us against any further incursions by reactionary powers, and to spread the revolution if necessary.""
ITA_RED_secchia.101.a: "His speech was met with applause"

ITA_RED_secchia.102.t: "Longo's Mistakes"
ITA_RED_secchia.102.desc: "Even after his death, the mistakes of Luigi Longo still haunted the party. It was true that Longo had led the party through many grim years, for sure. However, his toleration of factionalism, revisionism, and even bourgeois elements within the PDdI had come back to bite Secchia in the present.\n\nAny move that he made trying to push forwards to socialism would be obstructed by the catholics, who would rather compromise with reactionaries instead of actually working to improve the situation of the proletariat. They would cry if he ever tried to take measures against religion, and oppose anything that was working towards communism at a pace faster than a snail's.\n\nAny move to centralise the nation would be met with an uproar by the newer, younger members of the assembly. They would decry anything that wasn't total anarchy as tyranny, and oppose any measures that would help to increase production if they involved any intervention whatsoever by the state.\n\nStill, he was not yet powerless. In the future, more opportunities would arise to purge the party of revisionist elements. Furthermore, a large proportion of the party was in favour of his policies, and hopefully more would be convinced either by his rhetoric or by the success of what policies he would manage to implement."
ITA_RED_secchia.102.a: "One way or another, they would join his side"

ITA_RED_secchia.103.t: "Checking the Headlines"
ITA_RED_secchia.103.desc: "Stefano walked past the newspaper stand every day on his morning walk. He liked to keep up with the blistering pace of the revolution, and the chaotic mix of opinions and various papers all struggling to catch his eye was one of his favorite parts of his daily routine.\n\nHowever, with each passing week, the number of papers was slowly being whittled down. One day he'd see an article criticizing some new collectivization policy, or one of the recent anti-counterrevolutionary programs, and by the end of the week there was one less name amongst the papers. Whenever a paper disappeared, a state-backed paper would take its place, praising Secchia's defense of Italy in the face of a potential new Italo-German War, and fear mongering over the threat posed by reactionaries. It all rubbed Stefano the wrong way.\n\nOne of the reasons he had joined up with the PCdI when the revolution began was the freedoms it promised to bring, and yet with each passing week those promises felt more and more hollow. He noticed it wasn't just the newspapers either, Stefano's friends and coworkers now tried to steer every conversation away from the government's new policies, as if Secchia himself was standing right behind them. Many of the conversations now felt stifled by the fears of a new war, of the bombings and the mountain warfare returning, and Stefano felt increasingly alone in his doubts about the anti-counterrevolutionary measures."
ITA_RED_secchia.103.a: "He just wanted to see the revolution he had joined return."

ITA_RED_secchia.104.t: "A Discussion Between Revolutionaries"
ITA_RED_secchia.104.desc: ""Comrade Feltrinelli, I'm so glad you can join me. Please, take a seat," Secchia motioned towards a chair facing opposite his desk. Feltrinelli was not quite in-line with the party's ideology, but he was an influential figure, and one of the most important politicians during the initial revolution, so he was an important ally nonetheless.\n\n"Thank you for the opportunity, Mr. President, but what prompted your request that I meet you here?"\n\n"I have become deeply concerned about the security of our revolution, and I heard you may share my concerns over a possible counterrevolution in this country, am I correct, Comrade?"\n\n"Yes, the strength of reactionary elements within our midst are far too powerful to be dividing ourselves over minor policy issues, although I must say I have concerns about some of your more hardline plans for dealing with such a threat."\n\n"I understand your concerns, but you have to understand that all three superpowers have their fingers in Italy. The Germans undoubtedly left behind their agents in their retreat, and even with our recent policies some surely have slipped through our grasp. The Americans are almost certainly funneling funds towards groups within Italy, although we haven't nailed down their direct source, and the Japanese are already picking apart the former empire for their own gains. In such a scenario we have to remain vigilant, and remain united. That's why I wished to ask you to try and sway some of your colleagues over to our side and get their support for my new policies.""
ITA_RED_secchia.104.a: ""I will try my best, Mr. President.""

ITA_RED_secchia.105.t: "Snakes in the Grass"
ITA_RED_secchia.105.desc: "So many unique people, so many diverging motivations...\n\nPietro Secchia sifted through the different files, each one detailing a leading figure in the Communist Party, and began sorting them into three groups. On the left hand side, those loyal to him and the teachings of Marx and Lenin, mostly coming from the Old Guard of the PCI. On the right, known enemies who have no place in this new Italy. Mostly revisionists, Catholics, and others who dwell outside of party lines, they would be dealt with in due course. In the middle were the unknown variables, those who needed more time before they could be deemed loyal.\n\nSecchia picked out Giangiacomo Feltrinelli's file. He knew the man well, and although the man's ideology was different from his, he knew that Feltrinelli would be loyal to his former mentor. Besides, their relationship served to keep the younger generation of communists onboard moving forward. For now his name would go on the left.\n\nThe PCI was mostly in his control now, but it ranged many different philosophies and schools of thought. The Old Guard itself included Marxist-Leninists like him, but also Bolshvists and Left Communists, and they would need to be kept in line. Pietro knew that greater purges would be necessary to secure his rule and the unity of the Party, and they would need to be very thorough. That being said, he didn't have nearly the political capital to be able to execute such a cleansing of the inner ranks of the PCI. Many would oppose it, and if the timing was wrong everything would crumble around him.\n\nAnd then of course there was Feltrinelli. He would not like the idea one bit, and alienating him now would be catastrophic. He would need to start small, and cautiously, starting with the Catholics. They posed the strongest threat against him, and Feltrinelli's faction disliked them as much as he did."
ITA_RED_secchia.105.a: "So be it. Let no threat remain.'"

