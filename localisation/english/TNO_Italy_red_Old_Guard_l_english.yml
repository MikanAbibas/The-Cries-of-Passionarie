###=====| a) Secchia Tree |=====###

# New Tree
ITA_RED_avanti_popolo_alla_riscossa: "Avanti Popolo, alla Riscossa!"
ITA_RED_avanti_popolo_alla_riscossa_desc: "The Germans came to pillage our cities, loot our homes and destroy the heart of our Workers' Revolution, killing with it the international spirit of all oppressed toilers. And, indeed, they did render our lands into ruins, they did pillage our cities and they did loot our homes, yet despite the brutality of the fascist, capitalist behemoth it could not crush our indestructible spirit of resistance and the embers of Revolution continue to burn bright.\n\nNow overlooking a land of ruins, we stand in a position reminiscent of that of the Great Comrade Lenin after he had beheaded the white, tsarist hydra and mutilated its tentacles of reaction in the brutal Russian Revolution. And, similarly to how Lenin rebuilt a Russia scarred by the horrors of war into a beacon of the Revolution, we will not be idle and let our lands succumb to the withering fate the Germans assigned to them.\n\nItaly will be rebuilt under communism and soon it will rise again like a Revolutionary Phoenix from the ashes, eager to spread the fires of revolution hoisted on its wings."
ITA_RED_what_is_to_be_done: "What is to be Done?"
ITA_RED_what_is_to_be_done_desc: "The fires of war have finally dimmed, and the fascists have been defeated within and without our nation. With the war won, a new task lies at our feet: winning the peace. The party has a vision for a bright future, and much needs to be done to reach it. While they served bravely in the war, the average Italian remains largely apolitical. The common worker must now not only be politicized, but involved in government as well. A true worker's state must be run by the workers. Of course, creating such a land is no easy task. The vanguard party must be given everything it needs to realize our vision and empower the proletariat, and begin taking steps toward true communism."
ITA_RED_tatters_of_an_industry: "Tatters of an Industry"
ITA_RED_tatters_of_an_industry_desc: "Despite the success of the revolution and our victory against the hordes of rabid Nazis, our country aches with the deep wounds raked by their wicked claws. Bombed out factories line streets buried in rubble, the broken and scorched ruins of our once mighty industry struggles to support our nation, and the economy bleeds. We have already set to work patching these wounds, rebuilding the cities and roads and revitalizing the economy, but our efforts are still slow and lacking in strength and decisiveness as we slide into an ideological malaise. There is only one solution for this - the creation of a vanguard state, the strong hand this ailing country needs to rebuild its industry and inevitably bring about communism."
ITA_RED_organize_the_youth: "Organize the Youth"
ITA_RED_organize_the_youth_desc: "The youth are a key pillar of any communist movement, and we are no exception.\n\nWhile amongst the youth we can find some of our most enthusiastic supporters, much of the youth are still far less favorable to the revolution.\n\nThis situation can not continue to stand, and we must do everything within our power to nurture the revolutionary spirit within future generations.\n\nIf we educate and sway the youth properly, they will continue to build communism long after our initial generations is gone. The youth shall be the future of not only our nation, but socialism as a whole."
ITA_RED_university_joint_administrative_bodies: "University Joint Administrative Bodies"
ITA_RED_university_joint_administrative_bodies_desc: ""
ITA_RED_an_arci_centre_in_every_town: "An ARCI Centre in Every Town"
ITA_RED_an_arci_centre_in_every_town_desc: "Non-profit organizations have been, and continue to be, the backbone of mutual aid in Italy. In the wake of the revolution the Associazione Ricreativa e Culturale Italiana has become the largest of those non-profit organizations not connected to the Church. It was created in order to link the various cultural centers that exist across Italy, and has always been close to leftist parties such as the PCdI.\n\nBy organizing cultural centers, we can help push along cultural progress in Italy. In addition to facilitating social progress and advancing the revolution, it will help connect Italy's communities, and help unite the nation as a whole."
