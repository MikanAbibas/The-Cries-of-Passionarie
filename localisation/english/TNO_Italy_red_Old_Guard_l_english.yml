ITA_RED_secchia.108.t: "Musings on Confinement"
ITA_RED_secchia.108.desc: "18 years.\n\nPietro Secchia spent 18 years in prison for his defiance of Mussolini's regime. Before his incarceration, he was a young firebrand who believed that being a socialist meant going on strikes and fighting thugs in the street. But his stint in prison changed him, morphed him into a true Communist. He read theory, wrote his teachings, consolidated plans... all the while maturing and growing to appreciate the responsibility of not just the revolution, but the governing that would take place afterwards.\n\nWhen the dust settled and he was on op, that would be the true test of him. Although he envied Feltrinelli's role in the struggle, and all the glory and simplicity that comes with the younger man's duty, Pietro knew his place. His mission was to perform the difficult tasks, to lead the proletariat of Italy through hardship.\n\nHe must admit he is still adjusting, after all sitting in a decorated office is very different from a cell. But the most important virtue he learned in that hole they tried to bury him in for 18 years was patience. The road to come is long and arduous, but he is more disciplined than the rest. As he bides his time and sticks to his ideals, his vision will be realized. But if anyone thinks that they can dethrone his government and throw him in prison again..."
ITA_RED_secchia.108.a: "...will find his patience has run out."

ITA_RED_secchia.109.t: ""
ITA_RED_secchia.109.desc: ""
ITA_RED_secchia.109.a: ""

ITA_RED_secchia.110.t: "Doubt"
ITA_RED_secchia.110.desc: "Every prominent Italian Communist knew the tragedy of the fall of the USSR well, and none better so than Pietro Secchia. Various debates circulated in different socialist circles as to what truly doomed the revolution there, and of course how Italy can avoid the same fate. Pietro knew that it was not the economic downturn or the German invasion that cemented the fall, but rather the factionalization of the government and the eventual coup by Stalin.\n\nBukharin was a weak man unable to control his party and the people around him. His failures made it necessary for Stalin to take control, but the power transfer only fragmented the nation further. With an iron fist and enforced unity, the split never would have occurred and an effective military response could have been orchestrated. The Union could have been saved from being savaged, and the revolution would endure.\n\nBut that is where doubt began to claw into Pietro's mind. Doubt that he is powerful enough, that his grip on the party is adequately tight. Doubt gave way to paranoia, and once more Pietro began to think of the disloyal elements in the government, of those who are certainly plotting against him. Will they think he is weak, in need of removal? He must show them, of that there is no doubt. The dissent must be excised, the opposition silenced if Italy is to succeed where Russia failed.\n\nAs Secchia began looking over the plans for a greater purge, the doubt still hadn't left his mind, lingering on like a question in the breeze. When historians look back to catalog this period in Italy..."
ITA_RED_secchia.110.a: "...will they compare him to Bukharin or Stalin?"

