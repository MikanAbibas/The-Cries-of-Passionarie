 ##descs

 ITA_the_rights_resurgence_desc:0 "Many believed that Duce Ciano's failure to maintain the cohesion of the PNF after Verona to be the final death knell of fascism in Italy. Democracy and social_liberal had won, and many in government, both high and low, feared for the end of the system that they had shed so many tears and so much blood for.\n\nToday, those who feared the end now celebrate a new beginning.\n\nIt seems that as the votes have come in, the Italian right wing has been granted yet another chance at power, having managed to form a government in the aftermath of the most recent election. As the politicians of the right celebrate and begin their backroom dealings, the people await the directives of their new leaders with bated breath, fearing that the worst excesses of fascism might rear their ugly heads once more."

 ITA_solidarieta_sociale_concordia_nazionale_desc:0 "When one thinks of social programs designed to care for the needs of our citizenry, one's mind often wanders to the left wing. It is a lie perpetuated by the left, that they are the only ones that can possibly care for the lives of the citizenry under their rule. In reality, the right is just as capable as the leftists in the government at providing for the wellbeing of all true Italian citizens.\n\nAt the behest of the Prime Minister, we will begin a campaign of social solidarity and national concord across Italy. Our citizens will be given what is needed to survive. They may not live in luxury, but families will not go hungry, and above all, the nation will remain cohesive and united."

 ITA_free_the_factories_desc:0 "For too long, the common workers have had too much power over Italian industry. Instead of performing their jobs, jobs that they should consider themselves privileged to hold, they go on strike and demand such frivolities as high pay and regulation. While the common workers would surely appreciate such things, it is better spent on new investments and new jobs, so that all might work.\n\nThis is simply something that the workers do not understand, and so they strike, and demonstrate, and all the while the communists whisper falsehoods of how life under the red flag is better for all. This rot must be cut out at the source like a cancer; we must find a way to stop these strikers and communists from organizing. But how do we begin?"

 ITA_ensure_right_to_work_desc:0 "Unions are a cancer that have evolved along with modern industrial society. They claim to be for the empowerment of workers, yet all they do is make the workers lazy and entitled. Workers would rather stand out in the streets and complain about how terrible their lives are than actually earn their wage through their labor, and the unions empower these desires.\n\nSomething must be done. We will begin propaganda campaigns designed to make the common worker less inclined to join these corrupt unions. At the same time, we will make sure that the true, hard working Italian patriots have the right to work the jobs of those laborers who are much more inclined to go out picketing than do what they are paid for."

 ITA_contain_the_unions_desc:0 "Unions are a cancer, though one that we cannot easily excise from society as well as we might wish. A union is little more than people coming together to argue against their betters, and it is very difficult to prevent them from forming, and even more difficult to remove those that have been fully entrenched.\n\nA different approach is needed from the method of slapdash strike busting that we have been employing. Instead, we shall cover the unions of Italy in a mountain of red tape, making any official union action into a bureaucratic nightmare. Forming a union will require both the permission of one's local council as well as any and all supervisors on the worksite. Any union action will further require the permission of the local government and police forces. Through this, we can neuter the power of the unions, forcing them into quiet subservience."

 ITA_break_the_triangle_desc:0 "There exist three large union blocs that have thus far been able to resist our efforts to impede them in favor of business owners and job creators: the CISL, the CGIL, and the UIL. These unions don't represent individual trades in their own rights, but serve as blocs of unions that come together and ally themselves based on political ideology.\n\nThese unions are both large and powerful, and exert too much influence to be left alone. We will begin a series of investigations into these three large blocs, investigating everything from embezzlement, to sedition, to even communist infiltration. We shall bury these unions under piles of litigation from which they will never escape, tying them up in endless investigation keeping them from acting against us."

 ITA_support_for_cisnal_desc:0 "While it is true that unions are a cancer on society, we may have a use for those few unions that support our cause. The Confederazione Italiana Sindacati Nazionali dei Lavoratori, or CISNAL, is a right wing trade union directly affiliated with the MSI that tends to be rather supportive of our government and policies. Unlike their counterparts, CISNAL knows where their true loyalties should lie, and for this, they shall be rewarded.\n\nWe shall attempt to pass legislation certifying CISNAL as the official trade union of Italy. Unlike their counterparts, they shall be granted leniency from all the current anti-union laws, as well as a fairly generous government stipend. Of course, all of this will come only with continued support of our government, so that the union doesn't get any funny ideas."

 ITA_the_status_of_iri_desc:0 "The Istituto per la Ricostruzione Industriale is an institution that remains from the old Fascist regime. Regardless of its origin the IRI has become one of Italy's most valuable organizations. Owning large swaths of the economy and wielding unparalleled influence, the IRI will be integral to Italy's future as an economic power. However, times are changing, the world is evolving, and the IRI must be able to rise up to meet the challenges of the modern world. Therefore, hard decisions must be made regarding the institution's future."

 ITA_public_private_cooperation_desc:0 "The future of Italy's economy lies in the hands of private enterprises, rather than the state's. Therefore we will begin to reshape the IRI into an organization that cooperates with businesses across Italy. The IRI will help fund the contracts of big businesses, bolstering economic growth, enabling large scale projects, and putting private interests at the steering wheel of the Italian economy. This transformation of the IRI will bring it into the modern era so that Italy may compete with nations all across the globe."

 ITA_a_perfect_divison_of_labor_desc:0 "If the IRI is going to begin cooperating with private businesses, we must lay out the basic parameters of what an IRI contract would look like. This means creating a standard that we must hold private enterprises accountable to if they want to get their hands on government money. We will send a bill to the Camera dei Deputati outlining things such as basic working conditions and how the profits of IRI funded projects would be split between the government and the partnering business."

 ITA_back_to_basics_desc:0 "The IRI was created as a tool for the state to own and operate large swaths of the economy. Since we cannot trust private businesses to adequately manage the economy, the IRI will once again fulfill its original purpose. We will begin to bypass private enterprises and nationalize key sectors of the Italian economy. Thus the state shall assume primary responsibility for the economic future of the country, and under our careful gaze, Italy will flourish once again."

 ITA_buy_low_dont_sell_desc:0 "If we are to once again use the IRI as the state's primary economic channel, then it must be able to effectively purchase and operate a whole host of various assets in the economic landscape of Italy. To achieve this we will send a bill to the Camera dei Deputati allowing the IRI to purchase land and other assets from private businesses at a below market rate. While private interests might not be happy with this, it is a necessary course of action if we are to ensure a prosperous future for Italy and her people."

 ITA_discipline_and_punish_desc:0 "The function of the economy is to serve the state, no more, no less, and the great companies that inhabit it must be made to realize who is in charge here. If they believe that we intend to let them simply run wild, then they are sorely mistaken. We must make it plain to them, in no uncertain terms, that they have but two choices before them in the new Italy. They may submit to our will, in which case they will find that their profits will soar to new heights and all will be well. However, if they choose to resist under the assumption they will be able to profit at the expense of the state, they will be crushed underfoot, their assets confiscated and their executives punished. We have no time for games, we have a state to run."

 ITA_keep_our_friends_safe_desc:0 "It is a bit embarrassing to say it, but the fact remains that a number of individuals who have become close associates of BN during the fascist era are implicated in some... less than savory actions. These so-called "crimes", if discovered and publicized by the press, or Heaven forbid, the opposition, could prove to be a real legal headache and damaging to our future political prospects. If we want to remain a viable force in Italian politics for the foreseeable future, it would be wise to nip this problem before it can metastasize. A general amnesty for former or current state officials for actions taken under the fascist regime would be a relief to some anxious party members. Some in DC and FD may cry foul, but a media blitz laying out a clear argument - that it is time to move on and opening old wounds would paralyze the government - should hopefully be enough to get us through the worst of the criticism."

 ITA_preserve_the_past_desc:0 "Italian fascism has, after many successes and a few misdeeds, passed on to its grave. However, there are many in Italy who refuse to give it the peaceful rest it deserves. Too cowardly to make their slanders heard during the fascist period, a swarm of so-called intellectuals and revisionist historians seek to attack the national memory now that Mussolini or Ciano can no longer hurt them. They cast the civilizing mission of fascism as aggressive conquest, the flourishing of Italian culture as barbarism. We cannot allow this distortion of our heritage.\n\nThis policy, the protection of Italy's historical legacy from the rapacious assault of anti-patriotic elements, is the cornerstone of De Marzio's agenda. While fascism will never again live, we can make sure that nobody dares speak ill of the dead."

 ITA_lock_down_the_textbooks_desc:0 "How do untrue narratives form? Does someone hear a single falsehood and believe it wholeheartedly? Do they read an article in the news and suddenly become a firm partisan of its line against all criticism? Absolutely not! Indoctrination happens slowly, as the result of many years and thousands of hours of drip-fed deceptions. Now that fascist censorship of the educational system is but a memory, liberal intellectuals proclaim proudly that there is freedom to teach any critical curriculum they please. But with freedom of speech comes the freedom to lie.\n\nControlling the perception of Italian history in schools is a crucial front in our battle for the past. The government will take a staunch line against any attempt to threaten national security or politicize education with biased recollections of the fascist period. Politics is politics, history is history, and never shall the two mix."

 ITA_italiani_brava_gente_desc:0 "Amidst all of the self-hating libel that has become fashionable since the Verona Congress, one of the most egregious affronts is the idea that Italy, rather than a flawed but genuine exponent of civilization in the Mediterranean and Africa, was a self-motivated brute. This narrative originated abroad among ungrateful natives abroad, but has now proliferated among the intellectual class here in Italy. The liberations of these countries should be a point of pride! Before the arrival of Italian soldiers, there was nothing but squalor; afterwards, there was prosperity.\n\nDe Marzio will make sure that Italians remember that they are decent people. Our soldiers were heroes, not an army of petty Hans Hüttigs. In the pursuit of correcting the record, documents of the wartime actions so often taken out of context will be hidden or destroyed. An evil, perhaps, but one for the greater good."

 ITA_revise_the_state_intelligence_laws_desc:0 "With the passing of the fascist government came the opening of the state archives for all to see. Naturally, such an abrupt revelation of Italy's most private information quickly backfired. Liberal-socialist historians descended upon the archives like a school of piranhas, seizing any detail, no matter how small, they could triumphantly hold up as proof that the dictatorship was inherently criminal. What government openly airs its own sensitive information and requests to be slandered with it? Would this sort of behavior be accepted in any other society?\n\nThe contents of Italy's archives, no matter which regime they were compiled under, are a matter for the state and the state alone. If such documents are ever released to the public, it will when they can be trusted not to jeopardize national security."

 ITA_enlist_montanellis_help_desc:0 "The tightly controlled intellectual environment of the fascist period has given way to a plethora of self-proclaimed experts, many with opinions on Italian history that border on sedition. In the sphere of popular history, there is however one man behind whom all patriotic lovers of our heritage can rally. Indro Alessandro Montanelli, a journalist and historian known chiefly for his history collection "Storia d'Italia" is a rare voice in that he writes sympathetically about the fascist government and its past.\n\nThe task ahead of us is simple: promote Montanelli whenever possible and cast shade on his rivals. Pushing to include the Storia d'Italia in curricula, awarding him for merit, and as much special treatment as we can give him will allow us to get ahead in the race to redefine Italian history."

 ITA_an_ideal_past_for_an_ideal_italy_desc:0 "The "revisionists" elements of our intelligentsia intent on flouting Italy's history under the National Fascist Party have been put in their place, seen now as little but jokes in their research fields, while any comprometting information proving otherwise has been destroyed, the nation's dignity now saved from any ill-doers.\n\nDe Marzio can now simply walk in the parliament to present his laws in the hopes of getting them passed. Surely the one who's ensured that Italy's past hasn't been derided can pass them with ease, right? "

 ITA_eyes_in_the_courts_desc:0 "The communists in our country are not to be underestimated: they enjoy a certain popularity throughout Italy where they can be found everywhere: in our streets, villages and even within the very halls of power. Such an influence is a problem as they might infiltrate our judicial system and hamper our goals, which raises the following question: how do we ensure these pinkos don't get to hold any place in court?"

 ITA_rely_on_our_friends_desc:0 "Despite Italy steering itself towards the path of democracy, many remnants of the fascist era remain, namely a sizable number of magistrates whose careers were made under the Duce. A fact which is most agreeable for our government, those same magistrates being very eager to retain their position of powers. We'll make use of them to ensure our mandate is unopposed in the halls of legislation."

 ITA_magistratura_indipendente_desc:0 "In our aim to centralize our judiciary system, a law shall be passed in order for the "Consiglia Superiore della Magistratura" to be established. This newly formed state organism will direct our whole judiciary system, with people "favorable" to us in charge of its apparatus. A convenient coincidence one would say, especially those who do not appreciate us, but I assure you it is all but nothing to worry about."

 ITA_a_job_well_done_desc:0 "Our attempts at ensuring that the judiciary instances remain firmly under our influence have been an ongoing process, yet they retain a certain independence which is counterproductive to our commie hunt. Perhaps a change of method in our approach is necessary: no more subtleness! If we want to assume direct control over the Third Power, some "unsavory" means shall be employed. All in the name of our budding democracy..."

 ITA_control_the_magistratura_desc:0 "For things to go smoother, an idea has been suggested: restricting the requirements for holding the esteemed position of magistrate. Our judiciary is, after all, in dire needs for competent people upholding our laws and free of any "perverse" ideologies dictating their judgement. It is especially true if any of our candidates are found to be filthy commies or "fellow travellers" of their cause, a criteria which will immediately disqualify them for the position. And if the ones who get the job happen to be thinking like us, it's a simple coincidence."

 ITA_reel_in_inflation_desc:0 "The economy is a tough and nebulous mistress, whose whims are always unpredictable. It would be an understatement to say that inflation is, perhaps, the greatest threat to our democratic mandate. Our experts all have their say on how to stop the inflation currently afflicting our great nation, yet they cannot agree unanimously on which method to use. It is our duty to decide how we'll tackle the issue, lest our voters grow angry at our lack of decisiveness."
 
 ITA_encourage_the_petrolira_desc:0 "An idea has been floating around for some time now, its popularity rising within the party and hailed as the only solution to fight our rampant inflation: our economical experts have been saying that the only way for us to get out of this tight spot would be to encourage the sale and purchase of our oil reserves through the use of the Lira.\n\nBy doing this, our money will be evaluated as stronger than it previously was at the international level, alleviating some of our problems. Black gold does have a certain allure..."

 ITA_money_talks_desc:0 "Currency is one of the greatest inventions in human history, only secondary to agriculture in its importance to the modern world. Without it, trade and economic development would never have grown beyond the basest of a barter economy, never to move beyond local conditions and circumstances.\n\nBut, to the contrary of our opponents, currency is not just some agreed upon value that we believe in. Currency is something that must have something attached to it - otherwise the whole edifice of the economy is built upon shaky grounds. An economy is only as good as its currency, and the lira can become one of the most important reserve currencies in the world - if we are only only willing to peg it to the traditional bearer of value, gold."

 ITA_deflation_measures_desc:0 "While everybody knows the free market generally knows best, there are definitely times that the government needs to step in. Inflation has decimated the value of the lira. Foreign corporations have taken advantage of our economic weakness to ensure we depend on their presence.\n\nThis situation cannot be tolerated any longer. Direct intervention to ensure deflation must be taken, and foreign interests must have their stake in our economy reduced."

 ITA_another_quota_90_desc:0 "To ensure a return to economic prosperity, the inflation that has strangled the value of our lira must be eliminated. A strong deflation of our currency is in order, and our party, with the support of our currents, has proposed a law that contains multiple provisions that will aid in our efforts. Wages will be slashed and new credit will be restricted, which should help reduce internal demand. In addition, a hold on many foreign imports will be imposed. While many of these measures may seem harsh and restrictive in the short term, they are necessary to a successful economic recovery."

 ITA_reform_the_istituto_di_studi_corporativi_desc:0 "Ideas are powerful weapons. People, throughout history, have been willing to die for the sake of a belief in ideas - whether it be in politics or religion. While we have no desire to destroy our rule of law, we also cannot allow our opposition to spread their ideas without resistance. Even if they are not in government, they could, at any moment, use their influence to destroy our great march towards greatness.\n\nThat is why the creation of the Istituto di Studi Corporativi is so important. They will be the leaders in the public fight for creating a new generation of intellectuals and experts who will use their influence to protect the corporatist system. And, backed by the power of the state, it will be guaranteed to get its message to the people."

 ITA_captains_of_industry_desc:0 "The Confederazione Generale Dell'industria Italiana, more commonly known as the Confindustria, is the largest association of employers in Italy. Collectively, a major part of our economy is held in the hands of its members. The captains of Italian industry are all members, and if they're not pleased with our economic plans, then they won't happen.\n\nHowever, these captains are businessmen, and any reasonable businessman knows not to bite the hand that feeds them. If we can feed these companies what they want, they won't stand in the way of our plans."

 ITA_consolidate_the_monopolies_desc:0 "For as long as many Italians remember, the north has always had the most developed industries. Today, several Italian families hold a near monopoly over northern industry, and of course, they're all part of the Confindustria. To anger these families would be an economic deathwish, they control the northern industry almost single-handedly. Of course, their prominent status in the Confindustria brings us an opportunity to bring them around. Propping up these families will improve our image with the Confindustria, and allow us to squeeze more of our economic policy past them."

 ITA_a_relaxed_approach_desc:0 "The Confindustria has sent us another demand: the business leaders have asked that we expand the negotiating power businesses have with the state. Though expanding this power would lead to us having less direct power over businesses, this should finally bring the Confindustria around completely.\n\nA bill will be sent to the Camera to bring this expanded power into law. Those who seek to impede the power of large business will stand in opposition, but if we can get this one law passed the Confindustria will finally be behind us."

 ITA_squeeze_the_north_desc:0 "Despite our previous attempts to endear the industrial families of the north to us, they still must be reminded that we are the government, and ultimately they must bend to our will if they do not bend to our desires willingly. For now, our desire is nation-wide development, for the north and the south. We will squeeze as much cooperation from these industries as we can to ensure all of Italy sees prosperity."

 ITA_ilva_expansion_plan_desc:0 "It has been an unfortunate reality that the south of Italy has lagged behind the rest of the country since the Risorgimento. Whether it be because of failed economic reforms, organized crime, or a plain and simple lack of development, the leaders of Italy past have failed the south. We intend to right this wrong, embarking on a grand southern industrial plan, starting with the Ilva steel company.\n\nThe state owned Ilva steel company contrasts the rest of the south because of its success, being one of the largest steel producers in Europe. However, in recent years it has fallen somewhat. If we can revitalize the company, we can show Italians that the south can, one day, stand alongside the north in economic prosperity."

 ITA_pensioni_d_oro_desc:0 "Unfortunately, many government officials and business executives are stuck in the past, long past their prime. Their mindset is stuck in the days of fascism, of empire, conquest, and unsustainable growth. Their presence in government and executive boards has prevented the newer generation with fresh, new ideas from taking over.\n\nUnlike the days of fascism however, we cannot purge them to make space. They will have to be persuaded. Perhaps some generous pensions passed into law could finally encourage these old men to finally hang up their hats and make way for the new generation."

 ITA_against_the_current_desc:0 "Malagodi is a man with a view of the future not commonly shared by his fellow countrymen, one based around economic freedom and a hands-off state. Italy came of age at a time when the doctrine of laissez-faire economics was sadly out of fashion, and then the years of fasisct state control did little to reverse its fortunes. It is simply an unfortunate fact that the idea that the government has no place in private transactions has very little traction in our nation. However, this is not an immutable truth of our history, but only a result of circumstances. It can be swept away, reversed even, with a dedicated effort and smart policies that will show our people the truth of our words. When our nation has become a new hub of trade and a beacon of economic liberty, we will stand vindicated. A new era of prosperity has come to Italy!"

 ITA_privatize_ina_desc:0 "The Instituto Nazionale delle Assicurazioni has been on Malagodi's target list for some time now, and now that he is finally in power, he can make his platform a reality. The government has no place in the insurance business, all it does is push out any competition, any room for growth in the market. Besides, insurance is such a variable need that a one-size-fits-all approach by just one company is a massive mistake. We now have a chance to rectify this mistake by cutting INA off from the government's teat and letting the free market forces and the will of those moving the capital decide what will become of it. "

 ITA_cut_back_on_enel_desc:0 "Ente nazionale per l'energia elettrica, or ENEL, has been Itally's primary energy distributor since its founding under Duce Ciano. It served its job well enough, but it only worked within the order it was established in, that of corporatist control of the economy. As we continue to liberalize the markets, we would always have had to deal with ENEL sooner or later, and it seems that it will be sooner.\n\nThe first step will be to break up the control ENEL currently has by reconstituting it into three new companies: Enel Produzione, Enel Distribuzione, and Terna S.p.A to handle the duties of the old electricity giant. With that out of the way, we can finally put the new companies on the stock exchange and make them available to public buyers. Naturally we will keep some shares to maintain our revenue, but after that it will be out of our hands, the market will decide what will come after."
 
 ITA_loosen_protectionist_barriers_desc:0 "In a misguided effort to control the state of the economy, our past governments have attempted to impose harsh tariffs on geopolitical rivals. What they failed to consider is that such measures would only end up strangling trade and business, harming our people far more than those the barriers were intended to punish in the first place. Now that we have the power to affect change, we can satisfy the calls by businesses to scale back such outdated economic self-sabotage and allow Italian companies to do business with whoever they wish to, unhindered by arbitrary gates and restrictions that only serve to appease the egos of politicians. As we tear down the official barriers to free trade, we can offer advice to those companies that need it to exploit loopholes in the law and avoid remaining restrictions."

 ITA_piccola_e_media_impresa_desc:0 "Not every business needs to be a giant corporation - there is plenty of room for much smaller companies to flourish in the new economic order. We have every hope that even the most humble of Italians will be able to open their own business, watch it grow, and build their own success unhindered by meddling bureaucracy and a faceless state. To that end, we will eliminate all but the most basic requirements for obtaining the necessary permits and licenses to open a business within the Kingdom of Italy. Malagodi promised the Italian people that, if he was given the reigns of power, they would be allowed to chart their own destinies. He is going to make good on that pledge."

 ITA_the_spirit_of_einaudi_desc:0 "Now that we drafted the Disegno di Legge, we can present the reforms to the Camera to get them passed. We do not know if we will get the majority behind our DDL but at the very least we have started the first steps to make Italy free from bureaucratic red tape, cutting ties with the old corporatism of the fascist era. It's only when Italians will be free to make their own choices and free to spend their capital however they like that we will be able to call Italy a free nation. We will free the forces of the market chained by the IRI and the excessive influence of the government. If only Luigi Einaudi could see us, he would be immensely proud of us."
 
 ITA_the_neapolitan_model_desc:0 "During his tenure as mayor of Naples, Achille Lauro made himself a hero to the lower class of the city by championing policies that produced material benefit. With Lauro now in charge, we can export his incredibly effective tactics all across southern Italy. If we play our cards right, we can establish a nice, mutually beneficial relationship between ourselves and our core base in the south. We can provide them with improved public services, infrastructure, a standard of living comparable to the wealthier, industrialized north. In return all we ask of them is that they continue to vote us into power. It hardly seems like an unfair deal to them when one considers all the work we plan to do for them. They'll realize that they need us every bit as much as we need them."
 
 ITA_bread_and_stadiums_desc:0 "Lauro's model will certainly work just as well, or perhaps even better than, in Naples. Salerno, Taranto, Cosenza, Foggia, Bari, Potenza, each will be worked on in turn until southern Italy flourishes under our leadership. We ought to start out with the basics first of course, both in terms of needs and wants. Much of the poorest regions in the south have serious food shortages that have been a massive health crisis for some time now. We can initiatives to distribute staple foods to those most in need.\n\nBut survival is only the first step, because what is the point of living if it is a life without feeling? People need accessible entertainment, if only to keep themselves willing to get up in the morning. Lauro famously won affection by promoting football in Naples, so football stadiums sound like a fine investment to make to earn the people's affection."

 ITA_vulgar_displays_of_charity_desc:0 "The treasury, the big industrialists, the great landowners of the south, all have wealth in great abundance, oftentimes more than they even know what to do with. Meanwhile the poor, especially in the south, lack enough clothes to keep warm and safe during the Winter or to even send their children to school. Such a tragedy simply cannot be allowed to stand. The state is meant to protect its citizens, what message would we be sending, both to Italians and to the rest of the world, if we cannot help those among our most loyal supporters?\n\nNo, we have an obligation to do something for those who have put their faith in us. We can convince some of our wealthier allies, supporters, and donors to establish charity drives and even pitch in some of their own fortune to get those in need basic amenities, clothes, hygiene materials, whatever they require. Consider it an investment, we help them in their hour of need, we can count on their continued support for our cause."

 ITA_reach_out_to_the_underclasses_desc:0 "Public utilities remain in a deplorable state in cities across the slums of southern Italy thanks to years of mismanagement and ignoring the basic needs of the poor. This deficiency remains a black mark upon our nation and must be addressed lest we look incompetent and unable to bring the trappings of the modern age to our own people. We will begin engagements with ENEL to bring the miracle of electricity to entire neighborhoods. Ensuring access to safe water and sanitation surfaces will also be a priority; we can directly expand the drainage and sewer systems and mandate garbage collection. BN is quickly proving itself to be a party for the people and for good governance, and this act of generosity will only cement our positive reputation."
 
 ITA_hands_over_the_cities_desc:0 "While we continue to improve living conditions in the southern cities, the other goal of our development plan is about to begin. As the age of state controlled industry in Italy comes to an end, private groups have taken advantage of the vacuum, taking a new, dominant position in our economy. Many of these private groups are interested in land development and these developers, or "palazzinari" as they are called, want access to the underdeveloped cities of southern Italy. There is just one problem: so much bureaucratic headache is involved in getting permits and land rights that it's turning away those capable of putting capital into our cities.\n\nThis problem can be solved easily enough however. We will simply remove the unnecessary barriers to urban development and let nature take its course. These groups will prove to be just as important in improving the situation through jobs and wealth as much as any expansion of public utilities."
 
 ITA_cult_of_o_comandante_desc:0 "Prime Minister Lauro has an ambitious agenda to be sure, but, if his massive success story in Naples says anything, a tremendously popular one. Now that the proposals have been sent to the Camera dei Deputati, Lauro will have to work on the deputies themselves, using every political tool at his disposal to push them to accept his ideas.\n\nPerhaps his most potent weapon in this battle will be his public perception. By cultivating his image amongst the common people, he may be able to influence public opinion to the point where the Deputies will feel that bowing to Lauro's demands will be the only way to survive politically. This is a crossroads in the history of Italy, and should he succeed, 'O Commandante will truly be a figure of reverence and awe the nation over."

 ITA_ente_nazionale_per_la_previdenza_sociale_desc:0 "The facets of welfare within Italy are best represented by the alphabet soup of organizations that have been founded before we came to power; they are weak, unimportant, and scattered establishments with no effective measures against the poverty, vagrancy, or greedy mindsets made commonplace by the stopgap, oftentimes unnecessary liberalizations of Ciano. What Italy needs is not only to centralize but nationalize these institutions into an efficient, coalescent being, capable of effectively lifting Italy from its poverty and fatal mismanagement, allowing for the welfare of the empire to reorganize.\n\nItaly's poor will be brought to the forefront of society, and given proper opportunities to begin to contribute to the empire, lest they fester beneath it, and weaken the state as a whole."
 
 ITA_control_cinecitta_desc:0 "Everyone loves Italian cinema. It has everything from cowboy movies to comedy flicks to highbrow artistic works. The quality of the productions coming from Cinecittà have made Italy the cultural centre of Europe, and millions of tourists come to our country every day from every single part of the globe to experience the glamour and the beauty that can only be seen in movies.\n\nWhich is why it is necessary for the good of the country and morality that content in movies should be regulated by the government. Artistic freedom is important, of course, however too much liberty leads to chaos and disrespect of authority. And the libertine atmosphere of Cinecittà does not help either, since many filmmakers believe that having sex scenes or violence makes a movie mature. What if our children watch something obscene? They might be traumatized for life, or even turn into criminals! No, this must not happen. Our laws will limit sensitive content on movies, while Cinecittà will continue to crank out more masterpieces."
 
 ITA_barons_of_academia_desc:0 "Since we have come to power, some tens of thousands of students have risen up in protest against our policies, and entire universities have been in an uproar since our appointment of government. While the occasional protest or act of rebelliousness among the youth was par for the course under Mussolini, and even Ciano, with the trappings of Democracy, we have found ourselves unable to effectively respond to these outbreaks of civil unrest. What's worse is that they are only becoming more violent in nature, and grander in the number of attendees. As the unruly students have begun to disregard our responses, a proper confrontation is proving itself necessary. Should we fail to address this "problem" as is required, things are liable to spiral beyond our control.\n\nAs for now, we will allow for emergency powers to be given to the police, should they need it. Controlling this uproar in violence is essential to the stability of the nation, so unless the cops on the ground or the students in the protests can get their act straight, our tenure as leader of Italy is liable to be cut short."
 
 ITA_magnifici_rettori_desc:0 "Why should we change a perfectly fine system of government? Now, it is quite clear that we should not regress towards the Fascism of yore, but if we cannot simply subdue an array of protesting children and take the beatings of their protests, then what kind of a nation are we? A simple police force is not only insufficient to crush the insubordination flowing from the universities, but it is ineffective at best. The real way to stop protests is to stop them at their source. Both Mussolini, and to a lesser extent, Ciano, had an array of systems in place to stop any and all protests in their tracks, before they'd even start- "Nip them in the bud", so to say. Tracking down dissenting students through these pre-existing power structures will only aid our efforts in maintaining order within our places of education."
 
 ITA_expand_academic_bureaucracy_desc:0 "It seems that our primary source of opposition lies within the inhabitants of post-secondary education. The students, to be exact, have caused us the most amount of trouble with properly establishing control over the empire. In order to ensure the security of the empire, we must put a cap on the growing student movements.\n\nA proposed solution would see the radicals within these establishments rooted out, through the implementation of a new system of bureaucracy which will prove invaluable. It largely consists of identifying the political beliefs and alignments of those troublesome students. After identifying these troublemakers, we can drag them from their dorm rooms, and even prevent them from enlisting in such places of education in the future! While harsh, such actions need to be taken, if we are to maintain stability within not only Italy but the empire as a whole, as well."
 
 ITA_unleash_fuan_desc:0 "Across Italy, there are still countless student movements which would want to see our downfall. From the greedy Communists to the moderate reformists, it seems that nobody within the schools is on our side. Almost. With the exception of a student organization known as FUAN, it seems that we are completely in the dark.\n\nA proposed solution to this mess is to outright ban any and all student movements, excluding our few supporters within FUAN, who we can also strongly promote as the only officially state sponsored student movement. Though this action will prove controversial, it must be done to crush our opposition and ensure our stability, no matter how many children we must trample!"
 
 ITA_out_of_their_holes_desc:0 "As the months of our young democracy drag on, a disturbing development has occurred- the popularity of extremist, left-wing ideologies have grown drastically in popularity. This unfortunate development has crippled our growth in popularity among the youths, and action must be taken. Through our newfound powers, we are to immediately begin removing these dangerous youths from the politics of Italy. Maintenance of the empire's status-quo is essential, as we face foes on all sides. We must focus on the threats outside our borders, not those within! If we don't crush this threat now, it will fester within society and will tear down this empire, one reform at a time."
 
 ITA_the_culture_industry_desc:0 "Under our rule, stability continues to reign in Italy. Yes, fair Italy's culture, people, and spirit are preserved by both our gentle but firm government and the party itself. However, some seem to dislike this era of peace and glory, and seek to subvert it! While normally this could be ignored, these rabble rousers hide behind the media, using it as a tool for manipulation under the guise of entertainment. In every home, there is a television, radio, or even a newspaper's back page spitting subversive messages against our fair rule or normalizing immoral Something must be done!"
 
 ITA_protect_our_youth_desc:0 "After some deliberation, a plan has come forward to deal with the traitorous and morally bankrupt taint being spread across the airwaves by numerous entertainment and news outlets. Thankfully for Italy, our party enjoys a great deal of power over the workings of her government, and the problem will be dealt with soon enough. We shall accomplish this with the simple but reliable tool of censorship, checking all media meticulously before approving it for audiences. Immorality and dissent will be purged from the airwaves, as they have no place in our country, and we will not allow these agitators to continue corrupting Italy's youth with these vices."
 
 ITA_the_almight_buoncostume_desc:0 "Italy's morality is a sacred thing. It is an ancient, beautiful thing, but it can never be neglected and allowed to fester in blight. The Buoncostume are there to ensure that Italy stays pure, that she stays true to her traditions and her roots. It does this by guarding against all those who stand a threat to it - the barbaric homosexual, the addled and useless junkie, the sinful atheist, the foolish and subversive communist, and numerous other fiends. The Buoncustome as it stands, however, does not have the power to fully deal with these people. Through legislature, however, we will be able to expand their powers however much they need to keep Italy's people pure and safe."
 
 ITA_educate_our_youth_desc:0 "The demagogues in the media preaching their filthy, sinful messages have gained too much power. Filtering their bile out of the airwaves carefully will no longer suffice, no. We need a more concrete plan, to seize Italy's entertainment and news from these degenerates and return it to the state. We will clamp down on their influence much more decisively, stopping any and all of their subversive messages from leaking into the public conscience. Second of all, we will produce our own, educational, moral and honest state produced media. This media will be pure, and teach people to respect Italian values, as well as her fair and just leaders."
 
 ITA_return_of_the_veline_desc:0 "To curb dissent and impurity in the media, more action must be taken. Back in the years of the Duce, the memorandums, or 'veline', were dealt out to the media with explicit orders as to what they can and cannot publish. While we are certainly in a new age, that custom can still be of great use to our government and its fair country. So, we will pass a law to bring about the return of the veline to Italy, and use that strength to further clean up the airwaves."
 
 ITA_stop_resisting_desc:0 "Our government may hold the position of Prime Minister, but many Italians seem to not respect democracy as much as they claim. Radicals, socialists, and unpatriotic citizens have taken to the streets, sowing chaos and holding dangerous protests almost daily. However, by law we are the democratically-elected government, and these protests threaten to tear the nation apart.\n\nThe question is, how do we stop these protests? The protests can't continue, as each day they continue merely allows the socialists and radicals to secure more and more power. However, too extreme a display of force could create martyrs, and only bolster the numbers of protestors. We must move forward with tact and precision, so that Italy may survive."
 
 ITA_rely_on_our_police_desc:0 ""Preserving law and order is vital to the survival of any government. Our administration is currently being tested by these riots, and we know who we must turn to in order to resolve this unfortunate situation. Our brave police officers shall be mobilized, and directed into clearing the roads and ending the protests against our government.\n\nThe police know enough restraint to keep the situation from getting worse, and they know that sometimes the law in action isn't pretty. They won't skirt away from pragmatic solutions to these riots, but they also won't get too carried away in doing so. For the moment, they are the perfect tool for preserving the peace"
 
 ITA_support_local_prefetture_desc:0 "The transition to democracy has left our internal security situation in a sorry state. Our police departments are not receiving adequate funding nor manpower. In attempting to quell these protests, it is obvious that our police forces are under-equipped and overstretched.\n\nThis situation is not sustainable. We should pass legislation to provide proper funding to our on the ground police forces. While expensive in the short-term, these protests are already costing our government lots of money and causing lots of damage. Once are police have the proper funding to be well-equipped and well-staffed for their job of protecting our nation, they can finally end these protests once and for all."
 
 ITA_emergency_measures_desc:0 "Our previous measures are not enough. While we treasure our brave police officers, these protests are becoming too much of a threat. If we do not act quickly, our great nation could be brought to its knees by these communists and anarchists. Our situation is desperate, and desperate times call for desperate measures.\n\nWe must mobilize the military.\n\nWe shall not allow these protestors to weaken our nation any longer. The military must bring an end to this madness, even if their methods may be harsh. However, a few broken bones here and a couple dead communists there will not be the death of our nation. In fact, such methods may be necessary to save Italy from itself."
 
 ITA_the_violent_arm_of_law_desc:0 "These rioters have brought chaos to this country for too long. These criminals must be dealt with, no matter the cost.\n\nGive the police and the military whatever they need to handle this threat. Guns, armor, tear gas, funds, or anything else they could demand. Whatever they want, we'll give it to them. How they wish to use the tools we supply them is up to the officers and soldiers on the ground. Too much bureaucratic oversight simply hampers their effectiveness, and the brave protectors of law and order surely understand the "proper" way to handle these sorts of situations.\n\nIf they decide that violence is the only way to deal with these rioters, then who are we to stop them? Is preserving our nation not more important than the lives of a few criminals?"
 
 ITA_l_idea_corporativa_desc:0 "It is unfortunate that the unpatriotic elements within Italian society fail to give credit to Mussolini for his many innovations. Not only did he restore the spirit of the nation, his genius also granted us the economic policy of corporatism, which transformed Italy from a backwater into a true great power. Of course, no system is without its flaws, and our corporate model is definitely in need of reform. Still, we must endeavour to preserve corporatism as the guiding principle of Italy's economic policy."
 
 ITA_streamline_negotiations_desc:0 "One of the foundations of Italian corporatism is the collaboration between labor and capital, who work together to grant the nation strength and prosperity, while also undercutting those radicals which undermine its stability. We will strengthen class collaborationism by introducing a standard arbitration system by which labor can negotiate terms of employment with industry. All attempts at negotiation outside of our auspices will be declared illegal. Those on the left will accuse us of trying to stack the deck in favor of businessmen, but we insist that our system will fairly represent the interests of the workers and capitalists alike."
 
 ITA_limit_the_right_to_strike_desc:0 "While we have granted workers legal channels to make their desires clear to their employers, we will not tolerate any disruptive agitation that poses a risk to the economy or society. We will significantly expand the definition of an illegal strike to encompass any strike that lasts for longer than a week, costs more than fifty million lira in lost productivity, or affects industries deemed critical. This will be reinforced by harsher penalties for illegal strikes, including up to four years of jail time and blacklisting from major industries."
 
 ITA_corporazioni_proprietarie_desc:0 "An interesting proposal that was put forth by fascist economists was the establishment of state proprietary corporations with the express purpose of purchasing capital from businesses and holding them in trust, while establishing workers as stakeholders. This would grant workers direct representation in the management of businesses, without all of the chaos that comes with traditional labor activism. Hopefully this should keep the leftists quiet."
 
 ITA_connection_with_iri_desc:0 "Our ambitious plans for the proprietary corporations will require large amounts of start-up capital. The simplest way of financing them would be to leverage IRI's vast existing assets. Splitting off IRI assets and selling others to purchase private capital will expedite the process of establishing the proprietary corporations, and also reduce its impact on the budget. This can also be framed as a concession to the free market advocates, as it will be a slight reduction of IRI's power, at least on paper."
 
 ITA_a_nation_of_producers_desc:0 "In the process of reforming Italian corporatism, Almirante has often found himself stymied by liberals and socialists alike, bewitched by their misguided ideals. In order to implement his policies, we will have to build support directly among the Italian people. We will launch a media campaign to hail the Almirante reforms as a reconstitution of Italian society, a compromise between all classes, a guarantee of stability, and a defense of the Italian nations. Those who we cannot win over through sense, we will instead win over through slogans: family, community, and country. Italy is and forever will be a proletarian nation, a nation of producers, and Almirante's vision will see it through."
 
 ITA_looking_to_the_world_desc:0 "The end of fascism has sparked a crisis of identity in the Italian nation. For decades, we defined ourselves by our adherence to the guiding principles of the fascist revolution, and through it, built an empire from nothing. However, much of the world has grown weary of fascism, and the question remains of to what extent we will embrace its legacy. Are we still the same old empire that conquered the Mediterranean? Or are we a renovated nation, with a new purpose and new mission? That is the question we will have to answer."
 
 ITA_dem_under_new_management_desc:0 "No matter what we think of Italy's past glories, it is clear that the atrocities committed and the freedoms abrogated to acquire them have left a permanent stain on the empire. We must break free of fascism's legacy and the ways of the old empire, emphasizing diplomacy and mutual respect for other nations, not petty jingoism. Our international reputation has been severely damaged under fascism, and we must strive to repair it, even if it upsets the hardliners among our ranks."
 
 ITA_open_for_business_desc:0 "Autarky is a deeply controversial policy, and many now call for its abolition. While some of us maintain that, in the past, autarky was necessary for Italy's industrialization, in order to prevent domestic industries from being swamped with cheaper foreign products, it is now clear that this policy is no longer sustainable in the modern era. Italy is a developed nation, and it must open its economy to the rest of the world. Freer trade will bring us great prosperity, and in the end, isn't that what matters most for the nation?"
 
 ITA_same_as_old_management_desc:0 "Even if the political landscape has changed, our goals remain pretty much the same. In this case, our foreign policy is a continuation of the Fascist ideals. No insane draining project or liberal takeover is going to change that.\n\nOur main explicit goal is to maintain our indisputable hegemony over the Mediterranean Sea. Total supremacy over the Mare Nostrum should be the main priority to maintain Italy's status as a great power."
 
 ITA_always_mare_nostrum_desc:0 "The annoying boundaries of the democratic system can't stop us from defending Italian interests abroad. We can't let the Communists waste the money of contributors in pointless projects to help lazy deviants. That's why we'll guarantee this money goes to the right place.\n\nWe'll pass a law increasing military spending, so we can properly defend the Mare Nostrum from hostile menaces. A bigger budget to maintain the Navy and the garrisons will show our enemies that the Italian Lion still has claws."
 
 ITA_unione_nazionale_combattenti_e_reduci_desc:0 "We have an oath of gratitude to our brave veterans. From the deserts of Egypt to the Ethiopian grasslands, these men defended Italian honor in battle. Thanks to their efforts, Italy is now the ruler of the Mediterranean Sea. They are truly one of the greatest generations in history.\n\nWe haven't forgotten their service. The "National Combatants' and Veterans' Union" is a single state-sponsored organism that will represent our armed forces' troops. Veterans will have the love and respect they deserve by better representing their interests."
 
 ITA_vogliamo_i_colonnelli_desc:0 "Democracy is... undesirable. It is inefficient, and it is decadent. Democracy as it currently stands will merely weaken Italy even further than it already has. Of course, Prime Minister Rauti has already thought of a solution to this problem.\n\nThe only way to make democracy a sustainable system for Italy is to involve the military. Getting high-ranking military officers who hold patriotic, traditional values involved in our government will ensure stability and order. These men served in the fascist regime which, contrary to what some politicians claim, is in fact a boon to our government. These men have experience and wish for Italy to remain strong and prosperous."
 
 ITA_ordine_obbedienza_disciplina_desc:0 "Order. Obedience. Discipline. These concepts must be drilled into the very heart of our armed forces.\n\nWe must not allow our officers and soldiers to sympathize with... lesser ideologies.\n\nWe must not allow dissenters amongst our ranks to go unpunished.\n\nWe must not allow the top minds of our military hold ideals incompatible with our nation.\n\nWe must not allow our nation's traditional values to be corrupted and forgotten in the name of moribund ideas such as "social_liberal" and "progress."\n\nOur nation must be strong, and our military must be stronger. Socialists and subversives plot against our regime, preparing for our downfall. The armed forces must be our first line of defense against this ideological threat."
 
 ITA_the_bridle_the_bit_and_the_whip_desc:0 "The greatest problem with democracy is its inefficiency. To get anything done, a dozen meetings must be held, and a hundred concessions must be made to some insignificant faction or another. This process is slow and it is infuriating. In the event of a true crisis that threatens to topple the entire nation, how could a democracy defend itself before it is too late? The military, by contrast, are efficient and quick to action. They can deal with threats before Rome even hears about it.\n\nThat is why the armed forces must be empowered. Their civilian and law enforcement powers must be increased and expanded in order to protect Italy in emergency situations. What such a situation would entail doesn't need to be elaborated upon at this time. Providing some extraneous and overly specific definition would simply hamper the military's ability to perform the actions necessary to protect our nation when the need arises. Even small threats can quickly snowball into major crises given enough room to grow."
 
 ITA_inflammatory_speeches_desc:0 "The threat of communism is not being taken seriously, and threatens to not only infiltrate our government, but our armed forces as well. The fall of the fascist regime has emboldened the socialists and the Bolsheviks, and they'll only grow more powerful the more complacent we get. Luckily, Rauti is the one man willing to recognize this threat, and has the power to mobilize our government against it.\n\nThat is why he has called numerous generals and officers within our armed forces to meet with him, so that he can discuss plans of action they shall take in order to secure Italy against the threat of communism. We must convince them of their plots to infiltrate and overthrow not only the civilian government, but the military as well. A healthy dose of paranoia is necessary when combating these kinds of groups, and will help us weed out those who are not full committed to preserving our nation and our way of life."
 
 ITA_ideological_indoctrination_desc:0 "The armed forces must be loyal to Italy above all else, and free from communist subversives. Therefore, Rauti plans to modify the training process for new recruits, focused around ensuring loyalty amongst our soldiers.\n\nThese modifications would involve educating soldiers on the dangers of socialism, and weed out recruits potentially sympathetic to leftist ideas. Furthermore, instilling proper patriotism and national pride in our recruits should ensure high morale amongst our armed forces. The fascists were once exceptionally skilled at this, and taking some inspiration from their methods of indoctrination should provide wonderful results. This will also create soldiers ideologically closer to our government, ensuring that they are more loyal and less likely to desert or aid communist factions."
 
 ITA_ideas_that_moved_the_world_desc:0 "The time has come to propose our reforms to the parliament. Knowing what an abominable institution that thing is, that monument to red tape and bureaucracy, they will attempt to delay and stand against our reforms. They attempt to halt the great march forward of our nation with moribund ideals such as social_liberal and atlanticism, in service of the useless abomination they call "democracy."\n\nWhen socialists are invited into the very heart of Italy, allowed to stand where Mussolini himself stood as equals, your system is a failure. Italy's worst years were brought about by the foolish naivety of Ciano, and his commitment to failed ideologies. The fascists proved their superiority when they marched through Rome, and they proved it again when they marched through Paris, Moscow, London, and beyond. Traitors attempt to drag the name of brave soldiers and patriots through the mud, while they hide within their ivory towers unharmed by war and bloodshed.\n\nFascism is an idea that has moved the world, and it is time to see it do so once more."
 
 #foreign policy descs
 
 ITA_the_unextinguishable_flame_desc:0 "Italy's foreign policy situation and diplomatic outlook is less than ideal. The empire stagnated under the feeble management of Ciano with our hold on the outer territories weakening. Italy also finds itself increasingly internationally-isolated, caught between the rival German, Japanese and American blocs.\n\nWe must immediately adopt an energetic foreign policy and shake off the creeping weakness of the Ciano era. Our dominance on the Mediteranean must be reasserted, lest our boast that it is an "Italian lake" ring increasingly hollow. Furthermore, Italy must step back onto the world stage and navigate its way between the superpowers who dominate the world."
 
 ITA_get_down_to_business_desc:0 "Our new international endeavors must be guided by pragmatism and sound economic and commercial policy. To ensure our policies meet these three criteria, we shall meet with the leaders of Confindustria as well as the many other prestigious economic institutions and think tanks to draw up economic plans for our sphere of influence. These plans will enable the development of our sphere and further enrich Italy. With the help of these sage experts, the Italian economy shall reach new heights of strength. Naturally, the participation of our partner countries is unnecessary, after all, we have all the experts and advice that we need."
 
 ITA_con_noi_o_contro_di_noi_desc:0 "Many of the countries in our sphere remain reliant on economic and military support from Italy in order to remain stable. Several of these same countries have been reluctant to follow our desires and implement the necessary policies to build a stronger Italosphere. It is unacceptable that these countries rely on our generosity while rejecting Italy's wise policies. We shall threaten to withdraw any and all economic and military support from these maverick states unless they implement the required policies. We must make absolutely clear to our sphere that they are either with us or against us, and that they must toe the line if they expect our continued support in the future."
 
 ITA_shows_of_force_desc:0 "The Italian Navy and Airforce are the strongest in the Mediterranean and the twin prides of Italy. We shall order several clear shows of force by redeploying our fleets around the Mediterranean, sailing from port to port in a display of our maritime might. Our fleet, shadowed above by our mighty airforce, will reassert our dominance of what we have long thought of as an ''Italian lake" after a long period of stagnation and weakness. These deployments shall showcase Italian military might and remind our allies and members of our sphere that we remain the pre-eminent power in the region."
 
 ITA_remind_them_of_their_place_desc:0 "East Africa remains a troublesome section of the Italian Empire as anti-colonial radicals do their best to rabblerouse and agitate against the Italian Empire despite the many blessings our rule has brought to our colonies. While some form of moderate decolonization is regrettably inevitable, it will only happen on Italy's terms. No Ethiopian or native troublemaker will dictate terms to the Italian Empire. One of the few positive things we inherited from Ciano's regime is a long list of anti-colonial activists in Italian East Africa. A stringent round of arrests and imprisonments will do wonders to remind the natives that we are still the ones calling the shots."
 
 ITA_dangle_the_carrot_desc:0 "There's an old saying that you can catch more flies with honey than with vinegar. In recognition of that axiom, we believe that an attempt to extoll the benefits of allying with Italy will be an efficient use of resources that will be likely to pay off down the line. The most obvious benefit is, of course, security. Plenty of nations have seen the negative consequences of committing fully to one of the three giants of this new order and would be glad to form a relationship with a power that will not utterly ruin them in the process. For that, we invite them to look to our serene Kingdom. Military defense is only the tip of the iceberg in terms of what we can offer those within our sphere of course, a fact we would do well to hammer home. Our empire is vast and rich in many resources so that one end of our dominions might be bolstered by the productions of the other end and vice versa. Food, metals, expertise, all these and more are what we can generously supply to our friends, provided of course they are willing to come and reciprocate our offer of friendship."
 
 ITA_wave_the_stick_desc:0 "Of course while we earnestly hope to have cordial relations with our various client states and allies, there are times when we have to remind our friends of the exact dynamics of our relationship. We are their protectors and staunch defenders, but in exchange for this commitment we must be given a certain degree of loyalty and cooperation to make the exchange equal. Recent instability has caused our presence in some areas of the empire to lapse dangerously, and correcting this will allow us to not only reaffirm our commitment to our subjects, but to remind them of our strength. We can't protect them if they attempt to push us away after all, and so the natural remedy is to stop them from doing any pushing at all. Increased funding for the Regio Escrito and the Carabinieri will allow us to deploy more units to the nations within our sphere to accomplish this. Naturally, there are some who will grumble about this increase of our presence, but these people will always grumble. The benefit of safety that we can offer will easily outweigh any nay-sayers once we get to work."
 
 ITA_segregation_by_any_other_name_desc:0 "Since the time of Mussolini the Empire has enacted several racial laws in our colonial holdings to ensure that Italians are given their due. In the modern day however, many of these laws have been seen as... backwards by some, to put it mildly. The headache caused by such policies, both in terms of domestic approval and foreign acceptance has far outweighed any of their benefits. Of course, we certainly don't want to disadvantage our own people in the process of eliminating inefficient laws. A slow rollback of some of the more egregious measures to ease the transition would be the best course of action. Italians, being the entire reason our empire exists in the first place, will naturally be given some special consideration for land ownership, property acquisition, and professional postings. This way, we can remove the unfortunate aspects of our past expansions while allowing our people to still enjoy the benefits. Everyone comes out ahead!"
 
 ITA_willing_collaborators_desc:0 "For our empire to be successfully maintained we will need the voluntary buy in of the native peoples we have control over. Or rather, the buy in of a select few elites who will be willing to work with us in exchange for limited self-government. Making sure we choose the right partners in this line of work is crucial, a mistake could lead to an unruly puppet who breaks his strings or one who is loathed by his fellow countrymen to the point that they overthrow him. Candidates for regional native leadership will be carefully screened for a combination of loyalty and local popularity to ensure that they pose the least danger once installed. Once we have our picks, we will need to get to work undermining any of their rivals. There will no doubt be many who are jealous that they were passed over for leadership roles and these will pose problems if left to their own devices. Our intelligence groups and propagandists will go to work discrediting them using combinations of scandals and propaganda to break any popular support they may have. They'll be called communists, rebels, criminals, bandits willing to plunder their own people and cause chaos and suffering for their own gain. Our partners will ensure our rule in their nations and we in turn shall keep them afloat."
 
 ITA_eurodestra_desc:0 "At the end of the Second World War, one power stood as the uncontested master of all of Europe: Nazi Germany. At that time even we were but a cog in its machine, little better than pawns of Hitler's New Order. Those times have long past however, and the Europe of today is a far more fractured place than it was some twenty years ago. The Germans no longer hold uncontested sway in the old world, and we stand at the front lines of opposition to its power in the region. Why should we simply bow down to the next Fuhrer, and the Fuhrer after that? That is the question we and all other independent nations must ask ourselves in these as yet uncharted waters.\n\nStill, to challenge the old hegemon is a daunting task even now, and we are not unsympathetic to those concerned that opposing the Germans will be little better than a death sentence. We have a duty to shepherd the true right - those who wish to actually defend the heritage and culture of Europe without perverting it with neopagan lunacy. We will reach out to like minded groups across the continent and see who will be receptive to our call for a new power bloc against the usurpers of Europe."
 
 ITA_other_bricks_in_the_wall_desc:0 "A widespread political union, no matter how tightly-knit in terms of values, creed, ethnicity, or other features, will never stand the test of time if it is not supported by a strong economic foundation that applies to all members. If we wish for the community we have built up over these long decades to survive in this modern age, we must band all nations within it tightly together through economic integration. We shall set the bureaucracy loose to review central planning ideas so that we can establish a system that merges all of our economies into a single body, one with Italy as its head. It will be fashioned in such a way that all parts of the body are required for movement; the construction projects of one nation will require the resources of another, the finances of one will be supplemented by the rest in times of need, on and on. Like the fasces, we make one stronger union out of many little sticks."
 
 ITA_muscular_diplomacy_desc:0 "The Italy of yesterday was too timid to attempt bold gambits of diplomacy in the very backyard of the German giant, but those days are coming to an end. Nations like France, Hungary, Romania, and the like were always tantalizingly close to us and yet so far away thanks only to the presence of the damned shadow of the Pakt. Now that the recent unrest has broken the German hold over these and other nearby nations, we can begin to pull them into our fold before Germany has a chance to regain its footing. In recognition of this golden opportunity we have begun to pump massive amounts of capital into our foreign services and intelligence agencies, looking for any openings that our diplomats and spies can exploit to bind these up-for-grabs nations into our sphere. Italy has a long history of forging alliances, and we aim to flex our diplomatic muscles once more to ensure our regional security."
 
 ITA_the_exploitation_is_for_your_own_good_desc:0 "The Italian Empire, much like any social contract, functions on a series of trade offs. The native peoples under our domain have land, land which contains the riches of the Earth that make the wonders of the modern age tick. However, they lack the means necessary to acquire and make use of these resources, while we do. In exchange for our unrestricted right to harvest the resources, we graciously give to the native peoples the benefits of modern technology and civilization the likes of which they would hardly be able to develop on their own if we were to abandon them.\n\nWe further provide them with a sense of security, for if we up and left them to their fate, they would only fall sway under even worse masters than us. No, the current situation is best for all, especially the natives in fact. One need only look around Addis Ababa, Benghazi, Dubai, or Alexandria to see our generosity: modern cars on modern roads, hospitals, schools that give each student the tools they need to make it in the modern world, all these and more, because of our kindness."
 
 ITA_no_tolerance_for_rebellion_desc:0 "While we endeavor to make clear the benefits of staying within our prosperous empire, there will always be groups of discontents and rabble-rousers who think they know best. A number of such groups have been causing headaches for our administration in our East African colonies. We cannot simply let such a situation continue as it is, allowing rebel groups to simply carry on as they please, as doing so will only embolden them and prompt new groups to rise up in opposition. We need to make a swift example of such troublemakers so that every would-be revolutionary across the empire knows just how high the price of taking up arms against the empire is."
 
 ITA_infrastructural_outreach_desc:0 "Many aspects of our colonial empire are backwaters when compared to the Motherland, but our East African possessions are backwaters even among the backwaters. As we seek to develop the connections between our colonies and associated states, integrating East Africa, one of the fruits of our labor in the last war would be a true triumph, something to hold up to the papers and the voters. Naturally, we would do so in such a fashion that maintains our vested interests in the region. Railways and roads guarded by Italian troops that connect the main resource deposits to the colony's ports in Somaliland, Eritrea, and Somalia, will ensure that no matter what happens to our power in the region, we will be able to maintain economic hegemony."
 
 ITA_you_really_have_no_other_choice_desc:0 "While we hope to entice other nations to join our power bloc through extolling the benefits it can provide them, we do have an ace up our sleeve in case they show reluctance to join us: Germany. We will not be lying when we remind them that, in all likelihood, it will be either us or the Reich, and no attempt to hide and ignore the reality of the situation will work for very long once the old hegemon of Europe stirs once more to action. Many of these nations will have vivid memories of the last time the Germans turned their sights on them. If any of them are foolish enough to reject our generous offers, we can dangle this fate in front of them and wait for the inevitable pleas to be forgiven. They may not particularly enjoy the idea of being under our protection, with all that such a relationship entails, but any rational state would be suicidal to refuse it when the alternative is a return to German dominance of their homes."
 
 ITA_dictated_cooperation_desc:0 "All good things must come to an end. We have taken great pains to develop our East African possessions, but the inescapable fact is that the lumbering beast of a colony is wasting more money than it provides for us. The costs of running the regime, not to mention all we spend to garrison and police the region against the native resistance groups, are piling up by the day. The time has come for a new approach to the East African question. Luckily for us, we were already well aware of this possibility, and coordinated our regional development with it in mind. The resources of the region are still connected to the markets via purely Itlalian modes of transportation, which we have direct ownership of. It is therefore entirely within our interest to simply dissolve the sickly colony in favor of tightly controlled native regimes that will be forced to continue relying on us to stay secure. We will after all still control the economic lifeblood of the area, and with it, we can command obedience."
 
 ITA_the_ploughshare_and_the_sword_desc:0 "Once, long ago, an empire birthed in Italy was undisputed master of the Mediterranean and beyond. Decades ago, Duce Mussolini came the closest as any Italian ever since has in regaining our lost glory. Unfortunately, due to the betrayal of the perfidious Germans and the economic collapse of the Fifties, our dream seemed to slip out of our fingers just as it came to fruition. In the intervening years the dream was left to stagnate and wither; we had the land but what we lacked was the true prosperity and control within our domain that made the Roman empire so successful. However, thanks to the Herculean efforts of both our warriors and our diplomats, our bureaucrats and our economists, we have woven together the many nations of our empire into one interconnected tapestry. Economically, militarily, and ideologically, we are bound by a common purpose, one that will see us enter the modern era with focus and determination."

