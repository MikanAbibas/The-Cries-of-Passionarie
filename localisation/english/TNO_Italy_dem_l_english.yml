 #nat unity
 ITA_government_of_national_unity:0 "Government of National Unity"
 ITA_government_of_national_unity_desc:0 "In the wake of Ciano's failures, the king has taken a full control of the country. The king has decided to begin preparing Italy for a transition to democracy.\n\nWhile the King is quite popular, he still faces resistance from the remaining fascists in the government, the bureaucracy, the judicial system, and most other positions of power in the country."
 ITA_uprooting_fascism:0 "Uprooting Fascism"
 ITA_uprooting_fascism_desc:0 "The king has embarked upon a very difficult task. The task of saving Italy from forty years of fascism, and transforming it into a democracy.\n\nOne by one, the king will have to replace fascist institutions corrupted by the PNF and its tyranny. In their place, democratic institutions will be constructed, which will serve the people of Italy and help guide them towards a better future."
 #dem italy spirits
 ITA_turbulent_democracy:0 "Turbulent Democracy"
 ITA_turbulent_democracy_desc:0 "Italy's democracy is somewhat... chaotic. Coalitions usually don't last more than a year. Prime Ministers and voters aren't reluctant to switch parties, of which there are many. Even within those many parties, there are different currents to align with.\n\nThis all results in a very turbulent democracy, and yet it still somehow works."
 ITA_king_umberto_ii:0 "King Umberto II"
 ITA_king_umberto_ii_desc:0 "Stepping down after the successful conclusion of the National Unity government, King Umberto II has returned to his position as a constitutional monarch. In this role, he serves as a moderating force within Italian politics, helping to guide voters away from the political extremes. He is also the source of the mandates PMs use to form coalitions, making him a key part of the political process. However, the king is not toothless, and if he feels that democracy has come under threat, he will act."
