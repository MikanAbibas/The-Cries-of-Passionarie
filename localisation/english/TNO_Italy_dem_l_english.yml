 ###=====| 1) LEADERs |=====###
 
 ITA_Enrico_Berlinguer:0 "Enrico Berlinguer"
 POLITICS_ENRICO_BERLINGUER_DESC:0 "Some people were communist on principle, and some were communist out of anger and frustration against the fascist regime that ruled Italy. Enrico Berlinguer was both. A son of Sardinian nobility, his family had connections to many important figures in Italian politics. His father was a lawyer and a notable anti-fascist, and his grandfather founded the newspaper La Nuova Sardegna and was a personal friend to Garibaldi and Mazzini.\n\nBerlinguer had his first contacts with Sardinian anti-fascists in 1937 when he was fifteen years old, and in 1943 he clandestinely joined the Italian Socialist Party, which recently had reunified with the Communist Party of Italy. In the prime of his youth, Berlinguer soon became the party's secretary for the Sassari section, as his charisma inspired many others in the party's left-wing. Following a riot in Sassari, he was arrested and detained for three months. Upon his release, his family went into exile, where he was introduced to Pietro Nenni and other leaders of the PSI.\n\nWhen Ciano's success in Verona corroded the grasp of the fascist regime and brought its downfall, Berlinguer returned, ready to lead his party to victory. An avid supporter of Italy's newfound democracy, Berlinguer remains the leader of the PSI's far-left and communist wing. Despite being seen as a radical by many, Berlinguer's popularity grows, and his views on the "Italian way to socialism" become more prominent within the party, as he argues for the creation of a socialist state through democratic means. While some people are communists out of anger and frustration still, some are because they see Enrico Berlinguer as an honest person and the future of Italian socialism."

 ITA_Pietro_Nenni:0 "Pietro Nenni"
 
 ITA_Marco_Pannella:0 "Marco Pannella"
 POLITICS_MARCO_PANELLA_DESC:0 ""Radical" is a word often used and abused in politics, but no word is more apt to describe the character of Marco Pannella. Born into a well-off Abruzzese bourgeois family in 1930, Pannella grew up in a liberal and antifascist climate, connecting with enemies of the fascist regime from an early age, among them even Benedetto Croce. Later, Pannella studied law, and while in university, developed a small circle of like minded associates among the Italian antifascist intelligentsia, which would later form the core of the Partito Radicale.\n\nInitially close to the Partito Liberale Italiano, the Radicals split off fromthe more conservative PLI over their stance on social issues. Headed by the charismatic Pannella, the Radicals are a small but strongly vocal party, often in violent disagreement with mainstream political discourse thanks to their positions on topics such as LGBT and womens' rights. Impressively, the Radicals' strategy of campaigning and raising controversy over such issues seems to be paying off: despite remaining a relatively tiny party, their ideas, seen as outright absurd mere years ago, are becoming increasingly popular.\n\nNow, thanks to the twists of Italian politics, Pannella was chosen for the position of Prime Minister by the current leftist coalition. While most of the government's policies will likely be dictated by the larger PSI, the tiny Radical Party may still have a say: although the right, the Catholic world, and even some among the left are ferociously opposed to Pannella's profoundly libertarian views, he and his Radicals are undaunted. Alone they stand, against the behemoths that have come to dominate Italian politics: but Pannella perseveres in his quest to bring about a future of true liberty for all, no matter their gender, race or orientation - for the Radicals know that politicians may be against them, but the people is with them."
 
 ITA_Giuseppe_Saragat:0 "Giuseppe Saragat"
 POLITICS_GIUSEPPE_SARAGAT_DESC:0 "Though considered both a moderate and a master of compromise, few can doubt Giuseppe Saragat's devotion to the socialist cause. In his youth, Sagarat studied at the University of Torino, later becoming an accountant. His sense of compassion for the poor also resulted in him joining a socialist movement, the PSU. It was this that led to Saragat's exile from Italy, when Mussolini began to crack down on socialists. He travelled through Switzerland and Austria, eventually settling in France to work as a wine merchant.\n\nSurprisingly, this exile did a great deal to launch Saragat's political career. In Austria, he met with several proponents of the theory of Austro-Marxism. After developing his own brand of "humanistic marxism", Saragat became one of the leading social democratic figures within the exiled Italian socialist movement.. Now, with the reign of the Duce over, Saragat has returned to Italy and entered the political stage.\n\nAs opposed to the left's firebrand, Nenni, the soft-spoken Saragat is adept at fostering compromise, peace, and cooperation. The PSDI, committed to both democracy and the betterment of Italian lives, serves as more than just a political party to Saragat. It is the vessel by which the people of Italy can be lifted up from the oppression and poverty that has long plagued them. They only need Saragat to deftly steer the ship through the rocky waters that may lurk ahead."
 
 ITA_Ugo_La_Malfa:0 "Ugo La Malfa"
 POLITICS_UGO_LA_MALFA_DESC:0 "Born in Palermo, Sicily, before World War One, and the mess that followed, Ugo La Malfa is a man who, despite his age, would find much in common with many of the modern student radicals. Being a Republican anti-monarchist since before the fascists had even taken over, he is quite possibly the one constant between the resistance movements of the past and the present. Attending Ca 'Foscari University in Venice, his life brought him from the Italy of the South to the Italy of the North, meeting with radicals and adopting their ideas. Working with liberal philosophers and newspapers, his work brought him all across the country of Italy, meeting the great diversity of people that made up the nation.\n\nBeing the face of one of Italy's oldest parties, La Malfa has been pushing for social change as long as he's lived in a society to change. Unlike what many of the fascist government officials hoped of society, he has never truly abandoned that spirit of the student dissent, the fierce anti-fascism and social_liberal. He has risen through the ranks of the Italian Republican Party focusing on, above all, liberalization of society. This is not to be mistaken with the current incarnation of student radicalism, the aspiration for proletarian dominance; no, Ugo La Malfa means social change. This stance on supporting the Republican Party's social ideals, without being associated with the leftist movement, is what has lead Ugo La Malfa to be the face of the Republicans.\n\nThe Republican Party was not one of the most dominant parties in Italy. It is often forced to watch by the side as larger parties share the spotlight. Yet, Ugo knows that he does not need the spotlight to give Italy the change it needs. He knows that the PRI is on the right side of the issues, and that the population will choose them when push comes to shove. Italy shall be socially free, and Ugo shall be in the face of this change."
  
 ITA_Amintore_Fanfani:0 "Amintore Fanfani"
 POLITICS_AMINTORE_FANFANI_DESC:0 "Opinions about Amintore Fanfani tend to be varied, but there's one thing all agree on; that few can embody the soul of DC, with its infinite contradictions, better than him. Born into a poor family, Fanfani made a name for himself as a bright student and a professor of economics, but also as a staunch supporter of fascism. A devout Catholic, Fanfani at the time devoted his efforts to bridging the gap between the social doctrine of the Church and the fascist regime, even signing his support for the Manifesto of Race in 1938 and the other racial laws of the time.\n\nAs the years passed, Fanfani grew more and more disillusioned with fascism, drifting towards Ciano and his liberalizing politics. He was one of the chief architects of the DC, and eventually ended up as one of the leaders of the progressive current of the party. Opportunistic, shrewd and guileful, Fanfani always employed a smoke and mirrors approach to politics. A masterful negotiator, he was the perfect man to become the face of the DC after the crisis of the Hot Autumn.\n\nWith DC's victory in the elections, Fanfani is now free to openly play his political games. Behind the calls for moderation, social_democrat and a fair and moral society, the Prime Minister knows that he is the only thin line standing between Italy and utter catastrophe. Compromise is viewed by many as a drawback, but for Fanfani, the Purebred Horse of DC, it is a weapon in his arsenal. The political machine of DC is the only one that can control Italian politics. Opposing parties, both right and left, will learn that the only way to survive in this house of cards is bowing to Fanfani's vision. A new director has entered the Italian political stage of Italian politics, and one way or another, he'll make sure that the whole orchestra plays to his tune."
  
 ITA_Aldo_Moro:0 "Aldo Moro"
 
 ITA_Giulio_Andreotti:0 "Guilio Andreotti"
 POLITICS_GIULIO_ANDREOTTI_DESC:0 "Inside the DC, no other man is more talked about and more mysterious than Giulio Andreotti. Commonly known as 'Divo Giulio', Giulio the Divine, one would expect a master politician exuding raw charisma. Nobody would believe that this quiet, meek man is the grey eminence behind the success of the DC.\n\nDuring his youth, Andreotti was a law student like any other, very devout and a member of the Italian Catholic Federation of University Students, drifting aimlessly through life. However, chance brought him under the care of one of DC's main architects: Alcide De Gasperi. Under De Gasperi's wing, Andreotti learned everything there is to know about politics, rising through the ranks of his own student organization, until he became the president after Aldo Moro stepped down. Slowly but surely, he continued to build power and connections among Catholic organizations until, after the democratization of Italian politics, he reached the highest echelons of the DC.\n\nA rare breed among Italian politicians, Andreotti's sharp wit and quiet demeanor has helped him make a lot of friends, some even among certain unsavory people, if one believes the rumors. But for a party which values compromise and moderation, power is made from important connections and Andreotti has both in spades. As the Prime Minister, he knows that absolute power corrupts absolutely, but there is another truth that few consider: power wears out those who do not have it. And as long as he stays in power, the DC will never be worn out by it, no matter the scandals or the compromises. In a country besieged by criminals and extremists from all sides, its leaders must be prepared to do evil things in order to protect that which is good and holy, and Andreotti is the man that fulfills this role."

 ITA_Giovanni_Malagodi:0 "Giovanni Malagodi"
 POLITICS_GIOVANNI_MALAGODI_DESC:0 "The re-emergence of democracy in Italy was a long dream of Giovanni Malagodi, but it was never expected. His father, Olindo, was once a journalist and politician of the Partito Liberale Italiano, but after the March on Rome, he lost everything. His seat. His journalist publication. He would die of a stroke less than a decade after.\n\nGiovanni distanced himself from politics during his early adulthood. In the 30s, he held a directorship position at the Banca Commerciale Italiana. He could not escape politics completely however, as he rubbed elbows will fellow bankers acquainted to his father, who introduced Giovanni to the underground Italian democratic movement. Slowly,  Giovanni found himself drawn into his father's world. His directorial experience allowed him to successfully manage party operations, climbing up the party ladder. With the return of Italian democracy, Giovanni finds himself surpassing his father's legacy, now leader of the reborn Partito Liberale Italiano.\n\nFew expected the relatively small PLI to be a major party, let alone lead the government, but through Malagodi's skilled guidance they find themselves at captain of the shaky ship that is Italian democracy. His resistance to extremists of all kinds, from the Blochi Nazzionale to the FD, stems from the fate of his father and Italian democracy when faced with extremists. Time will tell if Malagodi will maintain his center-right ideals in a polarized Italy, or face a similar fate to his father."

 ITA_Achille_Lauro:0 "Achille Lauro"
 POLITICS_ACHILLE_LAURO_DESC:0 "Achille Lauro was born into a family of shipbuilders. The Lauro merchant fleet was the most powerful in southern Italy, and even the conscription of his ships into service during World War I would not damage his fortune. Tales of his rescue of the Serbian Army and the safekeeping of the bells of the Cathedral of St. Marco from the invading Austrians only increased his prestige. Though he faced some financial trouble after the war, collaboration with the new fascist regime, and his newfound friendship with Galezzo Ciano allowed him to stay afloat, and then some.\n\nHis friendship with Ciano would earn him the position of National Counselor of the Fasci and Corporations. Again, during World War II his fleet was used to transport materials and troops across the Mediterranean. His fleet would see heavy losses at the hands of the British Mediteeranean fleet until their defeat.\n\nAfter the war, Lauro's aspirations grew beyond shipping. He passed his business to his family, and ran for mayor of Naples. He grew closer to monarchists who feared the rise of socialism, especially with the return of democracy to Italy. Lauro's national popularity earned him leadership of the PDIUM, in coalition with the MSI in the Blocci Nazzionale. With Lauro's monarchists dominant, and with Lauro in the presidency, the institution of the monarchy will be preserved, and he will ensure Italy will never fall to communism."
 
 ITA_Giorgio_Almirante:0 "Giorgio Almirante"

 ITA_Pino_Rauti:0 "Pino Rauti"
 POLITICS_PINO_RAUTI_DESC:0 "An insidious poison has been slipped into the lifeblood of Italy. The years of prosperity under Mussolini have come to an end. The institutions he built have been destroyed by Western influence. The Italian spirit has been corrupted by an emphasis on monetary values over spiritual ones, spurred on by the influence of multinational corporations and Jewish financiers. They manipulate the nation to their own ends, destroy what the Italian soul holds dear, and chip away at the very foundations of the nation. Into this arena steps Giuseppe Umberto Rauti, ready to do battle on behalf of the country he loves so dearly.\n\nA founder of the MSI, person of interest in a number of bombings and known associate of several right wing terrorists, to say Rauti is a controversial figure is an understatement. Never without a shout of abuse for those he disagrees with, whether inside or out of his own party, the fiery leader of the MSI's left wing has never failed to surprise his party, even reaching out to youth from the Fronte Democratico with his anti-capitalist rhetoric and denouncing the dependence of the country on ENI's oil fiefdoms .It is unclear what strange new waters the ship of state will sail to under the direction of its new captain. Some believe it will return to the well-charted but unruly waters of the past, going back to the years of fascism. Others anticipate a mutiny from even the most loyal officers, if Rauti continues his present course. For now, Italy embarks for lands unknown, and it is anyone's guess where its voyage shall take it."

 POLITICS_AUGUSTO_DE_MARSANICH_DESC:0 "Among the many politicians of the BN who can boast a career dating back to the days of Mussolini, few can rival De Marsanich and his many years serving in politics. Serving as a member of parliament since the 1920s, De Marsanich held numerous offices before, during, and after the Second World War - and as the Duce died and a new one rose to take his place, De Marsanich immediately supported him and his projects. An old wolf of politics, De Marsanich knows that things change, and holding on to old symbols and ancient slogans is pointless - power belongs to the shrewd.\n\nOver the years, De Marsanich was fundamental in weaving together the BN from the remnants of the old PNF and other right wing groups, while Almirante was more preoccupied being the public face of the new party. However, with the catastrophe of Valle Giulia and the chaos of the Hot Autumn, the divisions within the BN threatened to rip apart De Marsanich's creation. Almirante had to go, and the party had to be taken into a new direction, one more willing to defeat the DC and the FD by their own rules - and De Marsanich, the grey eminence of the BN, was the best person to fill that role.\n\nPromising a return to law and order and the end of the red menace threatening Italy, De Marsanich appealed to the most base sentiment of the Italian populace - fear. By painting a grim picture of a nation in jeopardy, De Marsanich was voted in as the new Prime Minister to defend Italian democracy from itself - a leader of the people, an upholder of morals, and most of all a devout patriot. De Marsanich is all these things and more, but how he intends to save Italy from itself, is yet to be fully seen."

 POLITICS_ENRICO_MATTEI_DESC:0 "Long before beginning his tenure as Governor of the Gulf, Enrico Mattei was one of the most powerful men in the Empire. Known for his disdain for politics and his little sympathy for fascism, Mattei spent his whole life doing business - from a humble start, he soon entered AGIP, the Italian state's oil company. There, he rose through the ranks, climbing the company's hierarchy before becoming its head just after the end of the war. Yet, Mattei's ambition was far from being satisfied.\n\nAs the Empire grew massively during the war, it found itself in control of a staggering amount of rich oil reserves. A new situation required new methods, new technology, new organization, new trade deals - more wells, more refineries, more workers, more money, more oil. AGIP grew under Mattei's direction, until it was finally reorganized into ENI, an industrial and financial behemoth capable of standing toe to toe with Japanese zaibatsus. From his new headquarters in the Gulf, Mattei watched his own empire grow, becoming the main architect of the Dubai Project - a shining city in the desert, which began as a pet project of fascist colonialism and turned into a capital for Mattei's oil kingdom.\n\nAfter the Italian victory against Turkey, Mattei made another grab for power, and pushed for his nomination as Governor of the Gulf. As the oil king's rule was recognized, his plans for reform in the country are already becoming reality, as he brings the local emirs into the colony's government, while at the same maintaining a cautious friendship with the Saudis - something his critics often point out. With Dubai firmly in Mattei's hands, his ambition has been given new and powerful tools - after all, if ENI prospers, Italy prospers, and now ENI's six legged dog roars a flame that burns brighter than ever."

 POLITICS_GIUSEPPE_ORIANA_DESC:0 "For many in the Regia Marina and in all of Italy, Giuseppe Oriana is the archetype of an officer and a gentleman, something which attracts towards him admiration and envy in equal amounts. Serving with distinction in World War Two as a lieutenant, Oriana was again and again at the forefront of the Italian navy's greatest victories in the Mediterranean, rising through the ranks before finally becoming admiral after the end of the war.\n\nKnown for his effective style of leadership and his attitude towards innovation and modernization in the nautical arts, he soon became disliked in the upper echelons of the Italian government as an outspoken critic of fascism. Eventually, Rome found the perfect place to employ Oriana's talents, one as far away from Italy as possible: the Persian Gulf. Leading the Regia Marina's Fourth Naval Division, admiral Oriana successfully eliminated piracy from the region, allowing the Gulf to prosper and the Dubai Project to continue.\n\nHowever, things took a turn for the worse. With the Italian defeat against Turkey, a shockwave of instability spread across the Middle East, and as the local emirs become more and more intolerant of Italian rule and turn to Riyadh instead, Oriana was named governor of the Gulf, as his Fourth Naval Division is the only force strong enough to provide stability in the region. With the Dubai Project now coming to a crashing halt, Oriana must do whatever necessary to maintain order - quickly understanding that the emirs' tyrannical and petty rule is the greatest obstacle in his path. Even as a storm approaches from the desert, admiral Oriana is ready to withstand it - and should everything truly fall apart, the new Governor knows that a captain's duties include going down with his ship."

 

 POLITICS_GIOVANNI_DE_LORENZO:0 "Giovanni De Lorenzo's rise to power shocked many in Italy, but it was far less sudden than one might expect. Born into a family with a long military tradition, De Lorenzo fought with distinction in World War Two before entering the SIM, Servizio Informazioni Militari - the Italian military intelligence service. There, he demonstrated an incredible talent at his job, organizing counterinsurgency and intelligence operations across the Empire - eventually, he was noticed by Ciano, and soon the young general was finally promoted as head of the SIM.\n\nThen, De Lorenzo's true work began. Reorganizing the SIM into an efficient and secretive machine, De Lorenzo did Ciano's dirty work - gathering intel, isolating and destroying political enemies, containing OVRA and other fascist organizations - and playing a key role in Ciano's projects of dismantling fascism, all far from the public eye. With Ciano about to step down, the Duce issued one final order: the Piano Solo. Designed to ensure a quick coup and the installment of an emergency government should Italian democracy enter crisis, the Piano was activated as soon as an attempt to reinstitute fascism was made.\n\nNow, with the King's approval, general De Lorenzo has been named Prime Minister, leading an appointed cabinet tasked with protecting Italian democracy. Saving Italy from herself will require some sacrifices - eliminating hardliners and extremists, restricting freedoms and expanding the armed forces' powers are small prices to pay to ensure that Ciano's vision is realized. Democracy is a word that has many meanings - and in De Lorenzo's mind, democracy must ensure that the many threats of fascism, socialism, and subversion are stamped out, and the people of Italy is united in their devotion to the Fatherland and to the King."
 

