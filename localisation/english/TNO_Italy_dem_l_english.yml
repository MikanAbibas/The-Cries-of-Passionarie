 ##descs

 ITA_triumph_of_the_center_desc:0 "You wouldn't believe it, but after nearly forty years without Democracy, Italy has chosen the Catholic democrats to lead them. Some things never change! Since the appointment of ourselves as a Democratic government, we have been charged with commanding an ever-changing empire. While far from an easy task, we haven't come this far to back down from a challenge!\n\n Though, of course, we couldn't have gotten here without our coalition. While we can celebrate our victory, we must not forget that our partners cannot be ignored, lest they abandon our coalition. To increase support for ourselves, we can begin with a series of speeches and public appearances, to ease our opposition, and to convince the uncertain that we are indeed the best path for Italy to trek. It will be a long, long road, though we will march until we have reached its end, no matter what it takes to get there."

 ITA_codice_di_camaldoli_desc:0 "Man is, fundamentally, a social being. He needs people both for his physical as well as spiritual sustenance. In this sense, society is the totality of man's relationship with other men. But society cannot be maintained without an entity that can maintain the principles under which a society is created in the first place. This is the origin of the state.\n\nBut this does not entitle the state to dictate society, or to enforce its will on individuals. Rather, it is tasked with protecting the dignity and autonomy and personal freedoms of every citizen, regardless of their individual genetic differences. It is the state's duty to create a common goal in our society, and to provide its citizens with justice, both in the legal and economic sense. Man, made in God's image, is entitled to spiritual and biological sustenance, and it is our duty, as Christians, to prevent his degradation by unrestricted capitalism and the totalizing force of communism."

 ITA_review_work_contracts_desc:0 "Unemployment is one of the most destructive forces in Western Society. To deny our fellow man his right to work, his right to feed himself and his family, to deny him the civilizing force of work, and to condemn him to a lack of dignity and sustenance is an immoral act upon which the State must counteract at once.\n\nThe most obvious way to counteract unemployment is to regulate employment. According to our economists, the best regulation we can provide is to make it more difficult for corporations to layoff entire sectors without warning, and to give workers more protections under work contracts by making them permanent. This will both soften the blow of those laid off, and make it more difficult for corporations to exploit their workers with precarious legal conditions."

 ITA_the_italian_way_desc:0 "While reforming unemployment laws have and will undoubtedly do much good, both now and in the future, it does not alleviate the pain and suffering that unemployment places upon those already without jobs. These people require immediate assistance - not in the form of handouts, but in the form of jobs that can assist them and their families.\n\nThe best way to assist them is through expanding public employment. They will be used to the benefit of both the state in social and infrastructure projects, to the benefit of the economy, and to the benefit of themselves and their families. In addition, public service will give citizens new on the job experience, allowing them to find new opportunities in the private sector, benefiting both them and our people at large."

 ITA_IRI_primacy_desc:0 "Despite its history as an object of the corrupt fascist regime of yesteryear, the IRI is an immensely powerful tool. It is easily the largest corporation in terms of capital control in the nation, and is currently responsible for a variety of financial and corporate activities. With such power, we can easily use it to the benefit of our unemployed and for our nation as a whole.\n\nThe IRI, and industries affiliated with it, will be pushed or incentivized to expand their employee rolls. The IRI will use its vast reserves to expand infrastructure projects and investments in high unemployment areas, and those affiliated with it will receive benefits from the IRI for cooperating in this objective."

 ITA_innovation_has_its_costs_desc:0 "As powerful as the state is, and as active as our government has been in its agenda there are just some things that it cannot do on its own. Sometimes we require the assistance of the private market to enact our own goals - in this case, the unemployment problem.\n\nDespite what the left wants, the reality is that heavy state intervention in the case of unemployment will just cause more problems than it solves. By intervening we are making it more difficult for the market to correct itself, and thus actually extending unemployment, rather than ending it. Instead, we must cooperate with and incentivize businesses, helping to both expand the economy and to eliminate the unemployment problem. It is better that the money end up in private hands and used for investments in the economy than for the bureaucracy of the state to swallow the funds whole."

 ITA_listen_to_the_confindustrias_advice_desc:0 "Unemployment is highly destructive in Western Society, both to our economy and to our fellow man. Work provides both a sense of accomplishment and as a means to provide basic living to one's family. It is immoral for the State to stand by and allow such inefficiency and waste of our human resources to occur.\n\nThankfully, we have a suggestion from the Condinfustria's advice. Composed of Italy's biggest companies, they have suggested we liberalize the employment codes, making it easier for companies to hire and fire employees. While counter-intuitive, it would make the economy more efficient, and allow for more investments in employees. In addition, we could use this as an opportunity to subsidize smaller and medium sized businesses, which could lighten the impact of our liberalizing reforms on the unemployment problem."

 ITA_reforming_the_pension_system_desc:0 "Not everyone who loses their job is necessarily at fault. Often times, workers are just at the tail end of an economic recession. Nor is it necessarily the fault of corporations and businesses that layoff workers. They are just looking out for their own interests, and in the interests of their investors.\n\nRather than deciding who is to blame, it is instead the job of the State to prevent unemployment from becoming pauperism. We will not only help workers in getting them through their unemployment, we will also be assisting businesses who cannot afford to maintain their current work force. Financed through the gross salaries of employees, this newly created Cassa Integrazione will protect our economy and our people from both inefficiency and poverty."

 ITA_ensure_fair_wages_desc:0 "Regardless of what we wish to believe, class conflict exists in Italy. While far from the violent times of the 1920s, it is undoubtable that this conflict between workers and employers will continue to exist as long as one side is harmful to the other. But it does not have to be this way - there is a possibility for all sides to benefit. The State, and its labor bureaucracy, has both the ability and the obligation to ensure that there is equitable treatment to both sides. That is why we must have the power to act as mediators between the parties involved. By doing this, we will ensure that employers cannot harm their workers, and that wages will be high enough to support a family on."

 ITA_flight_of_the_hawk_desc:0 "Labor ennobles the man. This self-evident truth is the foundation of our civil society. But what happens when hard work is not respected and workers are mistreated in the workplace? What happens when the common man finds himself more and more overburdened by his job while the factory owner does not pay what is due? It is only natural then that more and more people become cynical and disillusioned when they feel that they cannot rely on the government.\n\nCarlo Donat Cattin, the "hawk" of CISL, the biggest centrist-aligned trade union in Italy, thinks that the solution is to give more powers to the unions. Cattin's ambitious reform plan not only includes more protections for workers and more contracting power to the unions, but also funding for organizations that support our cause. While we might alienate Confindustria in the process, the benefits we will reap in the future are worth the challenge."

 ITA_the_acli_connection_desc:0"With the recent founding of the Christian Association of Italian Labourers, we can begin to not only support their current operations in the south but to provide enough aid to expand operations within factories across the north. Doing our best to further the sway of the ACLI within factories can not only bring them into our sphere of influence but even openly support us, encouraging pro-government rallies. While we should never try to nationalize the factories, as that would interfere with the established free market, we should never give up the opportunity to extend our leverage within the vital industries of Italy."

 ITA_enaip_expansion_desc:0 "With our programs of mass industrialization in the forties, we have learned that in order to maintain the growing middle class, a higher form of affordable secondary education will be needed to keep the burgeoning middle class working, as well as to fill in the increasing demand of Engineers, Doctors, and whatever else may be needed to keep Italy moving. With this growing demand, a solution has presented itself, from our friends in the ACLI.\n\nAs the usage of trade schools has always been used by the ACLI, the option to expand upon them has become increasingly relevant in our fight to educate the people. By giving funding to the trade school system known as the ENAIP, we can begin to expand the schools controlled by the ACLI and expand our operations in giving free training courses for the most prestigious jobs, to allow those looking for new employment prospects a place to learn, or the unfortunate and down on their luck to contribute to society and to improve our nation as a whole."

 ITA_reinforce_intersind_desc:0 "Intersind is an organization created to act as the counterpart to Confindustria in matters of negotiations and collective bargaining with workers - whereas trade unions of workers who work in privately owned industries have to negotiate their demands with Confindustria, the workers of public and partly public businesses (usually the ones falling under the umbrellas of ENI and IRI) negotiate with Intersind, representing the collective interests of said state-controlled businesses. By expanding the powers and the prerogatives of Intersind, turning it into a true confederation of state owned businesses, we can make it an important counterweight to Confindustria, which is controlled by a few oligarchic industrial concerns which have been strongly resentful of our reforms. "

 ITA_cittadinanza_in_fabbrica_desc:0 "Across Italy, workers suffer under unfair laws, and humiliating treatment. Those workers are countless, and must be treated with the utmost respect, as what is Italy without them? Thus, to make the workplace more humane, we are to introduce a series of laws, to protect the workers of Italia.\n\nWe will implement a ban on worker surveillance, as privacy is a right, to be breached by no one.\n\nMistreatment and malpractice of workers are similarly going to be banned, for workers have the right to work without worrying about proper compensation, or abuse.\n\nFinally, none shall be barred from work due to their gender, race, or religion. We were - and technically still are - an empire. Thus, to oppress the workers who were once our subjects is not just crippling ourselves for no apparent reason, but inhumane.\n\nWith these changes, we will be able to truly consider ourselves past the oppression of the Fascists, and capable of becoming a more humane democracy."

 ITA_pray_and_work_desc:0 "Faith is necessary for one's spirit, but man is not saved by faith alone - deeds are necessary too. In the past, all too often the material life of our fellow Italian citizens was strangled from above - the fascist dictatorship brutalized and oppressed the Italian population into misery and anguish, but even with the fascist yoke gone, too many are still exploited by capital, and forced into poverty and ignorance. No more: it is time to finally bring all of Donat-Cattin's reforms for final approval in parliament, and forever change the face of labor in this country. The Christian values of solidarity and social justice, no more just empty words from a pulpit, will now become ingrained in our society and economy, and from this great material achievement, spiritual progress will no doubt follow."

 ITA_piano_decennale_per_i_istruzione_desc:0 "Francis Bacon, despite being an Anglican, was correct when he stated that knowledge is power. Knowledge allows the weak to stand up for themselves, allows the downtrodden to fight their oppressors, and allows people to live with some level of dignity.\n\nThat is why our state of education is abhorrent, not only in its inadequacies, but in its outdated practices. Girls and boys are segregated into different schools, often giving higher preference to males in both funding and attention. Worship of authority and historical figures - especially fascist ones - make all decent people recoil, and to say nothing of the physically abusive practices against childrens in the name of 'punishment.'\n\nThat is why the Ten Year Plan for Education is so important. It will eliminate these practices, and give massive funding to education. It will modernize our school system, from the kindergartens to the halls of higher education, both in equipment and in practice. The age of ignorance shall finally give way to the age of enlightenment once more."

 ITA_address_lower_education_desc:0 "Our children are our future. They will become the leaders, scientists, engineers, and artists of the future. But how can we believe this - and many of us, both in and out of government do - when our treatment of them is far from ideal? How can we say this, and allow our nation's school houses to have children stuffed to the rafters? How can we say this, and have out teachers be ill-equipped to teach our students? How can we say this, and allow our schools to rot from overuse?\n\nWe can't. But we can correct it. By funding the creation of new schools, and repairing old ones, we can make it easier to attend school. By funding new teachers, we can ensure that one adult is not responsible for teaching thirty students. By funding more administrators, we can ensure that mismanagement and corruption are eliminated from our school system. Our students will finally get the treatment they always deserved, in preparation for their futures."

 ITA_mass_alphabetization_programs_desc:0 "The rural people have always been underserved, even under democracy. This is not different in education, with many farmers and their families being too far away to attend school, or, in many cases, not respecting education in the first place. We can overcome this by creating new schools in rural areas, which shall ensure that everyone, regardless of where they were born, will have the ability to attend school. Additional programs, including one focusing on adult literacy, will also create a new found respect and desire for education in adults in rural areas skeptical of big government bureaucracy. It will also stimulate economic growth and give people new opportunities."

 ITA_non_e_mai_troppo_tardi_desc:0 "Despite everyone speaking Italian, not everyone necessarily speaks the same language. Many, especially in rural areas, speak in dialects that are foreign to the vast majority of the Italian people. Some are barely recognizable as Italian. This not only harms more practical matters - such as communication between the government and the local populations - but also harms national unity, for how can you unite a people if they are divided by language? That is why we must find ways to teach all people how to speak in standard Italian. The easiest way to do this is through television, which even the poorest Italian now owns. It will not only make communication easier between Italians of all regions, but also make it easier to unify the country behind a national program."

 ITA_gentiles_vision_desc:0 "People often complain about the lack of schools, and the lack of teachers. They complain of burdens in quantity, and how we need more. This is a problem that must be correct, and something that the State is working on. But we cannot only focus on the problems of quantity, but upon quality as well. We cannot only have more schools, but we must ensure that those schools are of the best quality. We cannot only have more teachers, but we must ensure that those teachers know how to do their jobs in the best way possible. A more streamlined bureaucracy will also ensure saved tax dollars, and ensure that our schools can react to any changing circumstance in the student body, thus giving education to all who need it."

 ITA_licei_and_istituti_desc:0 "Not all high schools are made the same. And, despite what many reformists believe, they shouldn't have to be. It is not the place for the State to determine what schools may or may not exist - rather, it is our place to ensure that all schools are up to a certain standard, and to ensure that the option of differing schools is always available.\n\nBy funding these institutions, we will be able to ensure that all forms of secondary education are available for all of our children. By making sure that all different types of school are funded, and with significant cooperation with local authorities, we can protect the choice of education that families decide for their children, in addition to the standard education that all children should have."

 ITA_our_grip_on_academia_desc:0 "The State has certain obligations to maintain law and order. This applies not only as regards to criminal justice, but to bureaucracy as well, as a society with an efficient bureaucracy is a well ordered society.\n\nThis is why the problem of our universities is so concerning. These educational institutions, once the greatest place of knowledge, have degenerated into an elitist old guard that got to where they are because of fascist meddling. They have monopolized all power, and are treating these places of learning as if it is still the 1800s.\n\nReform is necessary, not only to maintain our economizing and desire for efficiency in all levels of society, but also to show the agitating students that we intend to make good on our promises. The last thing our government needs is angry students marching in the streets."

 ITA_true_to_our_roots_desc:0 "The Christian Democracy believes in the power of the state to achieve societal goods. However, unlike the Leftists, we believe that there are some things - many things, in fact - that would be better off as they currently are. One example of this is in higher education.\n\nThese institutions, when not run by a clique of stuffy professors, can be a preview into the world of the ideal. Debate and study are encouraged, and democracy is held as one of the most important traditions we as a society have created. Intervention must only occur when clear and present violations have occurred, and when only the power of the State can maintain the traditions of our wonderful universities. By talking with local Rectors and taking into account the situation, we can avoid a lot of controversy and harm to the independence of our academia."

 ITA_universita_aperte_desc:0 "The State has an obligation to ensure that all forms of education - from the kindergartens to the halls of our grand universities - are available to all. But, due to the nature of higher education being more specialized and rare, it cannot be free the same way primary and secondary education is. Those focus on general precepts that all Italians, regardless of region, religion, or politics, must have, while the universities teach the next generation of the skilled and intellectual members of society.\n\nBut this does not mean that we must make the universities a hive of the rich, a new aristocracy of the gilded wealthy. Rather, it should act as a barrier to those who truly desire an education and are not flippantly attending for the sake of their social standing. That is why we must lower the university taxes, and to make programs that will make it significantly cheaper and easier for the lower and middle classes to send their sons and daughters to university."

 ITA_decisive_action_desc:0 "The State exists, first and foremost, as a reaction to the societal bonds and obligations that man has to man. Without a strong State, one that can maintain stability and order both from within and without, these bonds and obligations cannot exist. To ensure that the State can function is the most important role of the State.\n\nThat is why the old university laws must be reviewed. Many of these old laws allow universities to be under the control of an unaccountable elite clique that seeks to further its own power and influence. Reviewing and eliminating these laws will place the university under more democratic control, and, more importantly, ensure that the State is not being undermined."

 ITA_riforma_gui_desc:0 "The problem of inefficiency has plagued the departments of universities throughout this country. The bureaucracy of these institutions have been bloated with pointless, redundant jobs that have no purpose other than to fatten the paychecks of the clique of intellectual elites who are more interested than helping friends then in teaching the next generation. Only through the paternalistic oversight of the State can such a situation be remedied. With our new reform package, we can reform and standardize the universities to eliminate unnecessary positions and ensure that the bureaucracy can do its job. It will also break up the elite academic clique, thus giving us control over the situation that the State desperately needs."

 ITA_the_social_doctrine_desc:0 "Many of our detractors on the Left claim that our party is more concerned with not rocking the boat than we are with changing the country for the better. Similarly, many on the right claim that we are destroying this country's heritage and institutions for our own political benefit.\n\nNeither can be further from the truth. The Christian Democracy is first and foremost concerned with moving forward, maintaining what worked and changing what didn't. Institutions that needed to be changed have changed, and those that didn't haven't. And we have done just that. Sensible moderate progress has been accomplished, and done without destroying the nation and our heritage.\n\nBut much remains to be done. The situation of healthcare and the economy still loom large, and must be dealt with. We must go the final mile, to create a State that will at once encourage human liberty and protect human sustenance, both spiritual and physical."

 ITA_move_towards_decentralization_desc:0 "Federalism is a contentious view, both historically today. It is often criticized for its failures to create a State capable of protecting its people, with the US being the biggest indication of such failings in its inability to truly unite the people behind a national ideal like its European brethren.\n\nThis does not mean, however, that decentralization is a bad idea. Rather, it is our duty to learn from others failures and to improve upon them, for progress is the narrative of mankind. And, more practically, why should the State get involved when the local agencies are better able to provide local services? Empowering local provinces to provide such services would not only be more practical, but ensure more accountability and trust, as the people would no longer see government as the far away, shadowy thing they once feared, but a real tangible entity that can improve their lives."

 ITA_liberty_and_autonomy_desc:0 "Italy's current system is inefficient and outdated. The unitary system the fascists created is simply incompatible with the realities of governing Italy. Italy's administrative zones need to be reorganized and brought into the modern era.\n\nMoro has drafted a plan to achieve exactly that. This plan would see Italy divided into "regions," each with significant autonomy and local powers. This would allow these "regions" to better administer and manage their territory, and lessens the burdens upon the central government. This would also allow for certain regions to accommodate minority languages and better deal with region-specific problems."

 ITA_regioni_a_statuto_ordinario_desc:0 "Regioni A Statuto Ordinaro shall make up the majority of administrative regions within Italy. These "Ordinary Statute Regions" shall be the defining standard for what duties an administrative region can perform.\n\nThese duties will largely revolve around managing matters at a local level, to lessen the burden upon Rome. This includes duties such as managing the region's infrastructure, collecting tax revenue, and legislative power in all matters not specifically reserved for the central government's authority. They shall also manage the region's healthcare system, and get to keep a fifth of all tax revenue they collect from their region."

 ITA_municipal_autonomies_desc:0 "Italy's municipalities deserve more autonomy and authority. Moro's administrative proposal has taken this into consideration. The "communi" shall have the authority to manage their own law enforcement to a degree, and they shall have greater freedom in managing their budgets.\n\nSince elections and democracy have finally returned to Italy at a nationwide level, it is necessary to extend this freedom to the smallest levels of government. Municipal government shall be democratically elected, a right the people have been deprived for too long."

 ITA_regioni_a_statuto_speciale_desc:0 "The "Special Statute Regions" shall govern regions of Italy home to linguistic minorities, such as Val d'Aosta and South Tyrol, or special outlying regions such as Sardinia and Sicily. These regions face unique challenges that require a unique status amongst Italy's administrative regions.\n\nThese special statute regions shall be significantly more autonomous from the central government than the ordinary statute regions, to allow them to accommodate the unique characteristics of their regions. While each statute is unique, all of the special statute regions will have greater financial, legislative, and administrative power separate from the central government's control."

 ITA_devolving_administrative_powers_desc:0 "Moro's proposed administrative regions shall already possess the authority to carry out various day-to-day duties necessary to governing their territories. However, Moro has considered extending and strengthening their authority.\n\nThe revised proposal would see the regions administer most of the day-to-day governance of their territories, and give them authority over their school systems. Alongside these powers, regions would be allowed to introduce bilingualism at all levels of their region, both in private and public sectors.\n\nThis expansion of power is simply a natural evolution of Moro's proposal, and would greatly lessen the burdens the central government would have to face."

 ITA_redrawing_the_map_desc:0 "The final step of the proposal is possibly the most important one: drawing the final map of the new regions. The ordinary and special statue regions shall be clearly defined, historical and cultural boundaries must be observed, and the presentation must be perfect if this proposal is to survive the parliament's scrutiny.\n\nThis is the last step of drafting the proposal, and once it is complete the only thing left to do is propose it as legislation. Hopefully, the members of parliament shall see the benefits of this new system, and see it codified into law."

 ITA_reviewing_censorship_laws_desc:0 "In the midst of transitioning Italy from a fascist regime to a democratic one, we've univetably inherited laws established under Mussolini's administration, and more specifically a particularly stringent if not harsh set of censorship laws concerning intellectual property.\n\nBut what is a nation suppressing its great minds from freely expressing their creativity? A nation with a stagnant culture? A dying one. These laws shall be revised in order to fit with our democratic ideals and Italian values."

 ITA_relax_them_desc:0 "It would be an understatement to say Italian minds have had a little bit of difficulty to express any artistic creativity that might be deemed as "degenerating" Italy's core values or as a "national threat" to its interests by the fascist state's censorship laws.\n\nSome of these laws will be slashed, giving a breath of fresh air in public discourse through the various intellectual domains, while others will be kept, albeit enforced only loosely so as to appease the most conservative elements within our party and Italy as a whole as well."

 ITA_fund_cinecitta_desc:0 "Though some might see the Seventh Art with a bad eye, seeing it as a vector for "immoral" and "degenerate" ideas putting Italy's moral fabric at risk, it cannot be refuted that it brings a lot of money on the table...\n\nThe idea would be to fund "Cinecittà", our own little Hollywood, so as to cash in on this very lucrative venture. These movie makers might produce some risqué material which will surely anger the most conservative Italian elements, but does it matter? After all, jobs would be created and most importantly, Italy would get richer for it, intellectually and financially speaking."

 ITA_enforce_them_desc:0 "Though Italy is now one of the few nations bearing the ideals of democracy in Europe, it is difficult to do away with every tidbit of our heritage as a fascist nation. And it is doubly so when the laws we've inherited are ensuring our values are not corrupted through the intellectual works of our own compatriots...\n\nThe censorship laws will be kept strict. Despite our democratisation, Italy remains a nation with Christian values, values that shall not be desecrated by indecents arts so long as we remain the Church's most loyal daughter."

 ITA_commissione_per_la_revisione_cinematografica_desc:0 "What is art? Is it a concept pertaining to one's own conception? Their expression of uncomfortable and forbidden thoughts? Or a concept with criterias shaped by society, a reflection of their morals and ideals?\n\nIn order to determine those very criterias for movies on whether they should be censored or not, a national standard system shall be enforced, lest anybody thinks they might get away with publishing anything that might corrupt the very moral fabric which has shaped Italy for millennia now."

 ITA_renew_the_concordato_desc:0 "One of Italy's greatest sins is one born out of the Risorgimento, a time in our history when the Vicar of Jesus Christ found himself powerless as newfound brothers walked in Rome, declaring it the new capital of Italy. This left the spiritual leader of the majority of Italians imprisoned within the very walls of the Vatican, his temporal powers close to inexistent.\n\nThough our relations with the Holy See have warmed up since the Lateran Pacts under Mussolini, we shall renew these treaties so as to announce that, though our nation has taken a turn in its path, Italy shall walk La Via Della Conciliazione as the Church's most loyal daughter and as a Christian democracy."

 ITA_the_addendum_desc:0 "Italy is not perfect, and we will not make it perfect, but we can make it better. There are certain things that must be done to improve our country, for the benefit of all.\n\nThe first order of business is to improve agriculture. This is the backbone of our society, as everybody needs food to live, and we have to make sure our plates stay full. There will be modernization programs in Italian agriculture across the country, such as better equipment, and better fertilizer. Every Italian deserves a full stomach!\n\nSecondly, we must promote industrialization in underdeveloped areas; namely, the South. What point is there in having a country where half of it is lagging behind? All of Italy must be great for the country to be great. New factories will be constructed, and the economy will be improved, and the rest of Italy shall be better off for it.\n\nFinally, public services will need to be improved. All of Italy benefits from our programs such as healthcare, social security, education, and land management. The public benefits from public programs; hence, the name. More funding, more efficiency, and more advancement will make for a better Italy.\n\nThis is the general plan of our reforms. Now, we must go forth and enact them."

 ITA_enti_di_sviluppo_per_le_zone_agricole_desc:0 "Our Rural Areas Development Agencies are one of our first steps to improving the quality of life across all of Italy. These agencies, constructed at the local level, have the important job of making all of Italian land productive - as beautiful as the untamed wilderness may be, it doesn't do much good to our economy.\n\nTheir job will be accomplished in a multi-step plan. First, they are to buy up unproductive land - overgrown fields, wild areas, and other areas that are currently not producing a meaningful output. Next, they are to collaborate with local figures, such as landlords and farmers, to construct a plan for making it more productive - we are not to assume the agencies are the most wise figure for figuring out what to do with the land. Finally, they are to enact the plan, renovating these areas of the Italian countryside to make them productive, giving us a much-needed GDP boost."

 ITA_services_in_the_countryside_desc:0 "Often, scarcity has more to do with distribution than it has to do with production. If all the world were one, some would say, there would not be a single empty stomach on the globe. Now, we lack the capability to make the world one, but we can do is make Italy one, and greatly increase the connections across the entire country.\n\nInfrastructure is extremely important for obvious reasons - it is easy to get supplies to where they are needed if the trains are running on time. Railroads are to be built to connect all the country, the iron beasts criss-crossing the countryside. Electrification is also to be ensured, with the buzz of tamed lightning running through all Italian homes. This will improve quality of life, but also make communications easier, with power for phones and telegraphs.\n\nFinally, the public administration must also be improved in rural areas. Schools, government offices and law enforcement can ensure the modernization of the Italian city exists evenin the most remote areas of our countryside. All of this will ensure a well-connected Italy."

 ITA_commissione_per_la_programmazione_economica_desc:0 "The Commissone pre la Programmazione Economica, in English Economic Planning Commission, is to be established, consisting of the economic minister, other cabinet members, the National Bank governor, the President of the National Institute of Statistics, and others. This permanent institution has the goal of, as may be predicted from the name, economic planning.\n\nDifferent from socialist planned economies, our economic planning is a much more gentle, nuanced, and effective way of managing the economy. Using data from the economy, thanks to the input of the President of the National Institute of Statistics, we are able to see important figures such as unemployment, GDP, wages, and the like, and react accordingly with interest rates, loans, money injections, and other economic programs. The result will be a much more healthy Italian economy."

 ITA_death_and_taxes_desc:0 "Two things are inevitable - death, and taxes. We don't have much capability yet to make death more tolerable, and that isn't the economists' job. However, we can make taxes much easier for the average Italian citizen. We will institute IRPEF (Imposta sui Redditi delle Persone Fisiche, or Italian individual income tax), a single income taxes to deduct from wages, rents, financial dividends, payment for independent/non wage labor, and whatever other types of incomes individuals may make their living from.\n\nThis will have multiple important effects. By simplifying the tax code, it makes life much easier for the average Italian trying to file their taxes each year. Additionally, our revenue will be aided by a simple tax code with less potential loopholes. The result is a happier Italian, a happier state, and a happier balance book all around."

 ITA_politica_dei_redditi_desc:0 "Ah, the Politica dei Redditi, or income policy. Now, we are moving past the typical economic laws expected of any modern liberal democracy. This here is a new law that is sure to ruffle some feathers, and anger some of our aristocratic members of society. What is this law, sure to shake things up? Simple. Wages in business need to be proportional to the production of the business and how high its earnings are.\n\nThis is far more controversial than one may expect. The amount of faces red with anger at the prospect that workers have to get a share of the good income of a productive business has been called absurd, Marxist, and other meaningless insults. The more a business earns, the more its workers earn. This ensures an higher average quality of life for the Italian citizen, and a wealthier working base ensures more money to circle through the economy. Good for the Italian, good for Italy, good for the economy, and not so good for certain greedy individuals. We are sure to get this through, and we are ready to make Italy one step closer to greatness."

 ITA_the_matter_of_healthcare_desc:0 "It is a widely known fact that Italy's healthcare system is failing its poorest and most needy. The system known as the Istitutio per l'Assistenza di Malattia ai Lavoratori, a remnant of the old fascist regime, only provides coverage to workers and their relatives, and, at that, scales quality of care according to the amount of tax the worker pays. But what of the unemployed and homeless? What of those who fall short of the system's definitions of worker? And what of those who are poor and only get the bare minimum of care?\n\nIt's clear there must be change in the government healthcare system. There is just one roadblock left - we must decide: should we aim for a single universal healthcare system to cover all citizens of Italy, or will the path of allowing multiple government systems to compete reap the best and most efficient outcome?"

 ITA_universal_and_free_desc:0 "We cannot afford to have a half-formed and halfway system when it comes to such a pertinent matter as healthcare. Devolving healthcare and shattering it into a thousand different programs will only hurt, not help, those in the worst affected regions, and provide a easy path for neglecting the neediest for future governments. The only way forward for healthcare in Italy must be a universal single-payer model by which all citizens, no matter class, race, creed, and location, will receive the same quality of care. After all, are we not all the same in the face of death?"

 ITA_sistema_sanitario_nazionale_desc:0 "The Servizio Sanitario Nazionale, or SSN, will be established as the singular public healthcare system in the Kingdom of Italy, funded for by taxes and other sources of government funding, without quality of care being affected. All citizens of Italy, no matter class or income, will be entitled to free quality care, and will also thus pay into the system.\n\nThe existence of such a massive centralized healthcare system will also provide us great bargaining power to lower prices for drugs and pharmaceuticals from private corporations - companies whose immorally restrictive pricing has cost many a life."

 ITA_equal_and_fair_desc:0 "Rome does not know the issues that lie with the citizens of Sicily, Aosta, or Tripolitania. A singular national system would be a catastrophe for bureaucratic efficiency, the budget, and quality of care. The only way forward for healthcare in Italy will be the existence of multiple, largely region-based, healthcare systems, where each system will be funded publicly but be encouraged to be operated as if it was competing with each other: trying to innovate, become more efficient, and cut costs, while maintaining a decent standard of care."
 
 ITA_aziende_sanitarie_locali_desc:0 "A national program of Local Health Agencies is Aziende Sanitarie Locali will be put in place to execute our plans for a region-based competing healthcare system. These agencies and the hospitals they will control will cooperate with private hospitals and clinics to provide higher quality care for those who truly need it, reaping the rewards of the market while still keeping healthcare an immutable right.\n\nWe will focus government spending and this program on the most impoverished areas first - our goal is to provide for the most needy and alleviate inequality."

 ITA_autarky_no_more_desc:0 "The fascist policy of autarky has isolated Italy on the world stage and cut off our myriad connections to the other countries of the world. No more! If we are to succeed and prosper in this new age of a free and democratic Italy, we must rebuild our trade in the Mediterranean and beyond. All policies of autarky will be officially repealed and replaced with legislation incentivizing and promoting global trade, and our diplomats will be sent out to Washington and Tokyo to negotiate new trade deals."

 ITA_diplomatic_overtures_desc:0 "Our main foreign policy objective will be to act as a bulwark of liberty, peace, and prosperity in Europe; we will show the world our dedication to this through deeds and words. No longer will we only serve our own interests. Our approach to tackling such issues as conflicts in the MENA region and the Balkans shall be one of maintaining peace and securing freedom.\n\nIn Europe, meanwhile, we will continue to act as the counterweight to Germania and the protector of all peoples who have not fallen under the Reich's jackboot - this time, not simply as a lesser evil, but as a true light of freedom and democracy in the darkness of the New Order."

 ITA_the_mediterranean_chessboard_desc:0 "The Mediterranean is well known as Mare Nostrum, "Our Sea". Though whether it can be considered merely ours anymore can be disputed, Italy is undeniably still the primary power in the region. We will reach out to our brothers in Iberia, Turkey, and the smaller nations, in an act of reconciliation and the giving of the olive branch.\n\nWe also control the Suez Canal, which now is the sole seaway connecting the oceans with the Mediterranean - let the world know we are always open for business and cooperation, and that the trade routes of free Europe shall remain free also."

 ITA_invite_foreign_capital_desc:0 "The two blocs trying to lure us into their sphere of influence with honeyed words - the Americans in the OFN and the Japanese in the Co-Prosperity Sphere - bring with them tens of thousands of investors and foreign companies all itching to take advantage of Italy's large and cheap workforce and industrial development for their own profits. We can benefit from this - let the zaibatsus and the American corporations in, and while their CEOs earn millions, so will our economy prosper and profit"

 ITA_the_cost_of_a_lira_desc:0 "The modern economy now has increasingly more to do with monetary policy - that is policy concerning the currency of a nation - than fiscal policy - that is policy concerning government spending. By introducing measures such as devaluation and cutting interest rates to keep the value of the lira low and stable, we will boost our exporting of industrial products and attract foreign capital - a win-win for both Italy and its trade partners."

 ITA_le_cinquecento_lire_di_moro_desc:0 "The Italian economy is having a significant expansion, to the point where we risk uncontrollable inflation should we keep printing money: our gold and silver reserves are limited, and we might struggle to print enough currency to sustain our economy's growth. A solution was proposed by Aldo Moro, who suggested that the state treasury start printing legal tender 500 Lire paper currency which are backed directly by the state, and not convertible in any form of gold or silver, their value guaranteed entirely by the Italian state - a similar measure was adopted by the United States government in the 19th century, with the so called "greenback" currency printed during the American Civil War. This will allow us to continue pumping liquid money into our economy without straining the gold reserves of our national bank, further accelerating the consumerization of the Italian economy."

 ITA_a_roman_party_desc:0 "There is a deep malaise at the heart of Italian society. Where once people of all classes and nationalities found purpose in faith and shelter in the Church, now there exists only anarchy and debauchery. Decades of conflict between atheistic communists and pagan nation-worshipping fascists have rendered Italy a spiritual wasteland, and many are slipping away from the Lord's embrace.\n\nDemocrazia Cristiana has sought to center their governance on Christian teachings, but Andreotti knows that they are nothing more than cowards who capitulate to the left and will eventually drive Italy to ruin. Only he has the strength to save Italy, for if the enemy will not show mercy, then neither will he. Many will denounce his acts as chauvinistic, fanatical, or even anti-democratic. But he will pay them no mind, for his will is resolute."

 ITA_comitati_civici_desc:0 "There is a dagger aimed straight at the heart of Italy - the materialistic, secularizing forces of the Left. Already, they have acquired many sympathizers among the laity, with even the "progressives" of the DC falling into their orbit. Andreotti must establish a force to enforce his vision of Christian Democracy upon his party, and society at large. The so-called "Civic Committees," a network of think tanks and political organizations, will be established across the country, with a National Civic Committee coordinating policy at a national level while Zonal Civic Committees extend their influence into the regions. These will be staffed by a corps of trained cadres, who shall work in tandem with conservative Catholics to launch an offense on leftism. We will work tirelessly to humiliate those in the DC and the academia who are sympathetic to leftism, to promote candidates sympathetic to us, and to smear those who oppose us."

 ITA_empower_azione_cattolica_desc:0 "Decades ago, when the heretical movements of modernism and relativism had begun to infiltrate culture and even portions of the Church, Pope Pius X founded the Azione Cattolica, an organization of lay members to uphold Catholic doctrine and teaching. However, it has become tainted in the eyes of many due to its collaboration with the fascist regime. Of course, this is no matter. Andreotti will officially grant state support to this organization. The Azione will reach out to worker and student alike, undercutting the left's most fervent supporters. The left believes they have a monopoly on radicalism, but when they come to agitate in our schools and our cities, we will send out agitators of our own, on a mission to convince all good Catholics of the threat that the red menace poses to society. A few innocent leftists may be ostracized or even killed, but that is the unfortunate price Andreotti must pay for the society he desires."

 ITA_into_the_sant_uffizio_desc:0 "Andreotti has powerful friends in the Vatican: the Congregation for the Propagation of the Faith, or as the people know it, the Holy Inquisition. This organization was founded at the height of the Protestant Reformation to combat heresy and instruct the faithful in Catholic teaching. Many view it as an antiquated relic of the Renaissance, but Andreotti realizes that it could be an important ally. He will invite ambassadors from the Inquisition into DC's government to better coordinate policy with the Catholic Church, establishing a permanent liaison. The Inquisition will be the final member of Andreotti's trinity of organizations, joining the Civic Committees and Azione Cattolica in reinforcing the Church's influence over politics. It shall ensure that the Church will back all of Andreotti's endeavours, and root out all leftist influence from the clergy. Under Andreotti, every parish priest will give sermons denouncing Marxism and openly endorsing Andreotti's faction of DC. His opponents will denounce this as dictatorial, or even fascistic, but what do they know of virtue when they would prefer to allow communists to operate freely?"

 ITA_from_the_cathedral_to_the_parish_desc:0 "With his grip over the Church and its lay institutions secure, Andreotti is confident in extending their reach to civil society. He will accomplish this by bypassing parliament entirely and passing ministerial decrees to empower Catholic organizations filled with his allies, mandate the teaching of Catholic doctrine in public schools, and grant state support to Catholic oratories and schools. Of course, if those schools were to then instill in their students a healthy disdain of leftism and root out all heterodox viewpoints, Andreotti would find little reason to complain. Many from across the political spectrum, and even from within Democrazia Cristiana, will decry this as a violation of the separation of Church and state, and an unwelcome intrusion of Catholicism into the social sphere. However, Andreotti knows that an empowered Church is Italy's best defense against anarchy, even if his fellow so-called Christians do not understand it."

 ITA_men_of_the_faith_desc:0 "At long last, Andreotti can rest easy at night, for he no longer fears the leftists and their enablers in his party. Thanks to his actions, the conservatives have gained hegemony over Church and party, and the institutions he has nurtured now permeate politics and society at large. The progressives may bemoan his heavy-handed actions, but Andreotti knows that it is only thanks to his power that anarchy will never take hold in Italy like it has in so many other countries. As his final act, he will pass a number of symbolic resolutions that will explicitly declare Italy a Catholic nation, to be governed under Catholic principles, or more specifically, his interpretation of them. Still, something nags at him, from within his heart.\n\nAfter all, what profit it a man if he gain the whole world but in this enterprise lose his soul?"

 ITA_connect_the_country_desc:0 "A country is only as connected as its people and goods are. Ideally, it should be possible for goods and citizens to travel up and down in equal measure, equally fast and equally safe.\n\nBut, sadly, we do not live in the world of the ideal. We are constrained by both practical and economic concerns, and to focus on both at the same time would just doom both. Which one to focus on, though, is a highly contentious issue among our government, with some arguing that overland infrastructure will be of greater value to our population. Others believe that maritime infrastructure will better stimulate both internal and external trade, assisting in economic growth.\n\nThe final outcome, however, will be set in stone, and remains to be decided by the cabinet."

 ITA_from_milano_to_napoli_desc:0 "Since the close of the 19th century, infrastructure has been the lifeblood of our people. It connects disparate people, connects the rural to the city, the north and south, and all those in between. Whether it be in the roaring engines of the railroads or the sturdy concrete of the roads, our people not only desire but need a connection with one another, regardless of where they may be.\n\nThat is why our government is not only focusing on making railroads and roads safer for travelers to use, but also creating special provisions to make tolls and tickets more affordable for our citizenry. All from the richest businessman to the lowliest industrial farmer has a right to travel the nation unhindered and in an economical fashion."

 ITA_autostrada_del_sole_desc:0 "All great journeys have a beginning. Whether it be in the great Roman roads that connected all the Western world to Rome and her greatness, or in the creation of the Pacific railroad that connected the coasts of the great American heartland, great projects and crusades often start from humble beginnings.\n\nSuch is ours. We are starting on the creation of a giant, modern highway that connects the city of Milan all the way down to Naples, allowing not only for people to travel easier and safer, but to also make the trading of goods and services easier on the economy. While far from our only large scale project, it is a good beginning to a grand crusade that will turn Italy into a fully unified nation, unbound by the restrictions of geography."

 ITA_from_shore_to_shore_desc:0 "Despite what the reactionaries of the right claim, the world is no longer in the 19th century. It isn't even in the early 20th century under the reign of Mussolini's autarky. We are living in a new, globalized era, where the actions of any one nation has an immediate impact upon another's. And, with the invention of nuclear weapons, we should not shy away from such trends.\n\nTake, for example, our ports. Our ports and dockyards can and should act as the hub of the world, a place where merchants from all over the world stop. The benefits of such things would be immense, stimulating the creation of jobs and increasing tax revenue for the state to use on important social functions. It will also connect us with the rest of the world, something we need in the face of dangers that we face in the north."

 ITA_a_natural_highway_desc:0 "Roads are a relatively recent invention. Before we had dirt and brick roads, we had the sea, which connected the world together, breaking down geography. A boat was thus man's greatest exploratory device, the greatest destroyer of isolation the world has ever seen.\n\nThe sea is thus our natural highway. And why not use this to our advantage? Through the creation of a giant, modern merchant fleet, we can dominate the seas, connecting not only our people with each other but with the world at large. And the best part is we don't even had to build the road!"

 ITA_electrificate_the_state_desc:0 "There was a time when electricity was a new fangled invention, something that scientists oohed and ahhed at in their laboratories. It was not something that necessarily affected the lives of everyday working people.\n\nBut those days of ignorant bliss are far gone. Electricity is not only a luxury, but something essential to modern comfort and work. But, in spite of this widespread expansion, electricity remains out of the hands of millions of men and women in this nation. This is particularly apparent in the countryside, where farmers still work as if they are living in the 19th century.\n\nIt doesn't have to be this way. We can bring modernity to the people, and ensure that they do not break their backs like slaves for the hope of a better life."

 ITA_systemic_shock_desc:0 "The Christian Democracy believes in gradualism. We do not believe, as the left believes, that we should move as fast as possible. Nor do we believe that we should return to some imagined past that never truly existed. We believe in slow change to ensure a better life for all.\n\nBut there are certainly exceptions. Nothing better illustrates that then the current state of electrification. Many portions of our state have little to no electricity at all. Some are still living like 18th century peasants. This is disgraceful. Everywhere, from the snowy Alps to the dry deserts of Libya deserve the basic services of modern life. The current system can not be merely reformed, but fundamentally changed to make sure that it serves the interests of the Italian people."

 ITA_nationalize_enel_desc:0 "Rhetoric is fundamentally meaningless. While it is necessary and important as communication, both for our base of support and for our fellow politicians, rhetoric is not capable of changing anything. Only through action, and strong action, can things be changed.\n\nThat is why the creation of a state-run business to expand electricity to all Italians must be created. It will be a signal to the people that everyone - from the richest man to the poorest peasant - deserves the same comforts of modern living. It will not only maintain the power grid, but expand it, modernizing it, and ensuring that it is safe and consistent with those around the world."

 ITA_spark_plugs_desc:0 "Has not the current order provided us with supremacy over the Mediterranean? It's been shaken in recent years, true, but that's only because of the German's ill conceived project that threatened that control. Well. Perhaps there were other concerns that lead to this current situation. But you don't treat a squeaky wheel by replacing the whole bike.\n\nA number of adjuncts have proposed simple reforms which will revitalize the state's apparatus and infrastructure without causing much controversy. The system works, but it can be made to work better."

 ITA_iri_electricity_contracts_desc:0 "Electricity is probably one of the most revolutionary inventions in history. It became an indispensable component of not only people's daily lives but from every technological discovery of the 20th Century. With a world constantly changing, it's unbelievable that there are people in Italy incapable of enjoying its benefits. n\n We'll use the Istituto per la Ricostruzione Industriale (IRI) to collaborate with private capital and offer contracts to begin electrification of those isolated regions in Italy. Farmers will be able to do their jobs far more easily, improving agricultural production. "

 ITA_completing_industrialization_desc:0 "There are some who act as if Italy is already a fully developed country, but Fanfani knows that is not the case. One of fascism's greatest failures was its inability to complete the industrial revolution that Mussolini promised. Much of Italy remains backwards and rural, with the long-neglected south being the worst example. For too long, the politicians in Rome have ignored Italy's hinterlands, but with Fanfani's entry into the government, this will change. Fanfani knows that the only way for Italy to maintain its status on the world stage is to become fully industrialized, and only through industrialization can its people live in dignity. This project will be difficult, but Fanfani is up to the challenge. He will bring Italy into the jet age, or he will die trying."

 ITA_piano_fanfani_desc:0 "One of the greatest issues facing Italy is the lack of housing in the cities. While the rich have built their own upscale districts with fancy houses, many of the poor are forced to live in tenements on the outskirts. This injustice must be rectified if Italy is to become a prosperous nation, and Fanfani has the solution. He will use his position to mandate the large-scale construction of affordable public housing projects in urban areas, creating many, many new homes for workers to move into. This will end the bottleneck on Italy's urbanization and encourage many to move to the cities, granting Italy's industries a new source of labor. Many in his party will consider this an unwelcome intrusion of the state into the economy, but it's not like their 'free markets' were of much help to the homeless, were they?"

 ITA_southern_highways_desc:0 ""If you build it, they will come." That adage is just as much true for factories as for anything else. One of the greatest hurdles to industrializing the south is its lack of adequate roads, railroads and other such infrastructure. Fanfani plans to resolve this by funding a series of expensive construction projects in the south that will bring its infrastructure up to par with the north, allowing for industries to establish a foothold in that impoverished region. Of course, this plan will definitely ruffle some feathers in his own party, as the expenses on the balance sheet are sure to wrack up in violation of DC's commitment to fiscal responsibility. However, Fanfani is confident that after some cajoling, the party and its industrialist patrons can see that this is in their best interests."

 ITA_invest_in_technical_education_desc:0 "Perhaps there is something Italy can learn from pre-war Germany. For decades it was a leader of global industry, and this success can be attributed, in part, to its system of state-supported technical education, of both blue-collar technicians and white-collar engineers. Fanfani knows that Italy cannot hope to compete with the world's industrial titans without a skilled workforce, and he will provide that workforce by granting generous state support to technical high schools and polytechnic universities, who will train a new generation of Italian laborers. Fortunately, this policy isn't nearly as controversial as some of Fanfani's other initiatives, with only scattered complaints from conservatives in the Church about the new competition their schools will face.\n\nThen again, God helps those who help themselves."

 ITA_state_sponsored_research_and_development_desc:0 "It is no secret that Italy's technology base has fallen behind that of the superpowers thanks to decades of fascist isolationism and incompetence. While American firms crunch thousands of numbers a second on IBM mainframes, most Italian firms have to make do with primitive mechanical calculators, or even just pen and paper! Fanfani has seen the future, and he wishes Italy to take part in it. As a critical component of his modernization project, he will significantly increase state subsidies to universities and private research departments, allowing Italy to catch up to its peers. Of course, a few stodgy traditionalists will complain about all the resources being thrown to student radicals and their fanciful gadgets, but who are they to stand in the way of progress?"

 ITA_cassa_del_mezzogiorno_desc:0 "Fanfani's previous initiatives have borne fruit, and now it is time to introduce the crowning achievement of his tenure. The "Southern Investment Fund" will be a vast agency controlled by the central government, which will have the authority to directly fund enterprises and construct infrastructure in the southern hinterlands, as Fanfani has realized that only a mobilization by the state can hope to industrialize them. This proposal will be incredibly controversial, drawing criticism from both sides of the political spectrum. The right will call it communistic, a violation of southern autonomy and free enterprise, while the left will see it as a revival of fascist corporatism. In addition, many northern voters will resent the fact that their tax lira will be spent on helping those they view as poor, lazy peasants. Fanfani does not relish the kind of political maneuvers, or even bribes, that will be necessary to establish the Cassa del Mezzogiorno, but he knows that the people of Italy will one day thank him for this."

 ITA_inventivize_the_industry_desc:0 "For decades, the Italian economy suffered from stagnation. Some external factors, like the Atlantropa disaster, were outside of anyone's control. However, the Fascist administration is responsible for both the rampant corruption and an incompetent bureaucracy. Fortunately, the Italian people voted us to solve this problem. n\n By heavily investing in our industry, we hope to have the ball rolling once again, putting the Italian economy back on the right course. Generating jobs and reviving those industries in decline will be our main priority to make this possible."

 ITA_talk_to_the_oligarchs_desc:0 "The reins of the Italian industry is in the hands of a few powerful oligarchic groups. Corporate giants like Breda and Pirelli hold a considerable amount of influence over the Italian economy. It's not an ideal situation, but they could serve our own interests quite well. \n To carry out our plans for industrial expansion, we should ask them for help to propel our endeavors by funding them. We'll try to appeal to their sense of patriotism, and the possibility of lucrative profits of course. "

 ITA_encourage_industrial_mergers_desc:0 "What does a factory need to function? Raw materials to turn into products, fuel to turn into energy to power the machines, and a market to sell the finished goods. And a factory that controls all these components is a successful and profitable one. We already have excellent examples in our state owned companies ENI, that keeps the lifeline of the kingdom running with its oil and immense profits, and IRI, whose immense capital can direct the entire Italian economy. Why can we not do the same for more sectors of our industry, which will surely benefit from this? If we encourage more companies to merge with others and acquire smaller ones, we can have an economy dominated by megacorps both public and private, which in turn will make the economic situation much easier to manage and more stable."

 ITA_encourage_small_businesses_desc:0 "A concentration of economic influence within only a handful of major organizations is only going to lead to stagnation on the innovation front. The lack of general competition will lead to a dearth of new products and technology. In order to combat such a situation, we have decided to make the proliferation of such businesses a top economic priority. Such a policy, we hope, will encourage more Italians to open small shops and firms, while also making buyouts, acquisitions, and mergers more costly. That ought to keep the market decentralized and free from monopolization.\n\nOur citizens deserve only the best, and that means we need businesses that are pushed to innovate. Now, that's certainly easier said than done, but it is entirely possible if we continue to support a competitive market."
 
 ITA_legge_sabatini_desc:0 "Our initiative to promote smaller businesses has so far produced excellent results, with an entrepreneurial boom on the horizon. However, there is one crucial issue that has cropped up, one that we aim to address. We have found that prospective entrepreneurs are having significant difficulty breaking into the lucrative fields of electronics and mechanics. This is due primarily to the lack of available stockpiles, meaning that small businesses have to spend inordinately upon startup, and they are then crushed by taxes before they have a chance to make a profit.\n\nLuckily, deputy Armando Sabatini has come to their rescue with his "Sabatini Law". Within it are provisions that significantly reduce taxes for businesses deemed useful to the nation's future prosperity, as well as granting the ability to gain state reimbursement when procuring the materials for such businesses. It will cost us some revenue in the short term, but Sabatini has persuasively argued that it will allow Italy to develop as a bustling center of modern production in higher-tech appliances and machines. "

 #foreign policy descs
 
 ITA_la_situazione_e_un_po_piu_complessa_desc:0 "To say the world has changed since the last time Italy could call herself a democracy would be an understatement. 40 years of fascism have certainly left a mark on our international standing; Least of all an Empire spanning three continents and a truly unenviable foreign policy conducted by a succession of Duces. For too long she has been stranded between begrudging former friends in the Mediterranean and the tempest tides of Superpower whims. As Italy begins to recover from her wounds at home she must prepare also to march confidently on the world stage, her image rehabilitated and her ties to the free world rekindled. The aim of our foreign policy will be to carefully untangle this international mess Italy finds itself in: Reaffirming our place in the world and maintaining peace both at home and abroad."
 
 ITA_breach_the_curtain_of_darkness_desc:0 "The Nazi shadow stifles and harms all it touches. The nations in their so-called "Unity-Pakt" are not peers in German hegemony, but perpetual servants who exist only to feed the greater German Reich - no matter how much it harms their own subjects and client states. The Nazis do not care, for these nations are viewed as nothing more than resource hubs filled with subhumans to exploit, serve, and feed the Aryan race.\n\nThis exploitation and gross injustice is not something we should stay silent on. The German Reich must be criticized, and we will add our voices to those rightly calling out this abuse. At the same time, we can do what even the OFN is incapable of and provide humanitarian aid to these nations, as well as assist the refugees fleeing from the Nazi shadow. Their grip has held firm over Europe for too long - it is time for us to loosen it."
 
 ITA_unity_in_faith_desc:0 "In the realm of international diplomacy, we need every advantage we can get. As we renew our diplomatic outreach beyond Italy, this is more important than ever. The heart of the Catholic Church resides in Italy, and is the spiritual home of millions across the world - this is leverage that we should not ignore.\n\nWe will work to gain the support of the Catholic Church on our diplomatic endeavors, and have them act as a fifth column for us in nations with predominantly Catholic populations - specifically Hungary and France. While we cannot solely rely on this to carry our agenda, it will give us an additional advantage - and with the Germans no doubt watching closely, it is an advantage we need."
 
 ITA_gradual_devolution_desc:0 "The Italian colonies in East Africa occupy a unique place in Italy's political imagination. From the discredited right calling for the continuation of fascist occupation to the wide-eyed left-wing clamoring for immediate decolonization. The former would doom East Africa to brutal colonization, and the latter would see it melt away into despicable anarchy. In all things, moderation. The gradual devolution of power to the native populations of the East African colonies is our first objective, as is the building of a capable and trustworthy class of local administrators that can be relied upon to guide the region to prosperity. Eventually, of course, will come decolonization - but it will come only once we and the natives alike are ready for it."
 
 ITA_economic_partnerships_desc:0 "With all the resources we find ourselves lacking in diplomatically: Trust, allies, and credibility, Italy's economy still remains one of the most robust in all of Europe. This asset alone can be used to great effect in the field of foreign policy. Joint-ventures and promises of investment are an excellent way to exert influence beyond our borders while courting willing friends at the same time - never mind the long-term profits. Both economic advisors and native entrepreneurs have shown support for this initiative as mutually beneficial for everyone involved, and not only regionally but on the international stage as well. Foreign friends and daring investors will soon see for themselves the benefits of cooperation with Italy. As the saying goes: When a friend asks, there is no tomorrow."
 
 ITA_military_treaties_desc:0 "Much remains of the fascist regime, be it institutions, attitudes, or as fate would have it an Empire. One aspect of the state which was bolstered by those 40 years of Fascism was the Italian Army. It has won great renown in the wars fought to establish the present, and regardless of darker spots in its history remains an institution that on more than one occasion resisted fascistic control in many ways.\n\nThe truth is that our new Kingdom's military operates far beyond its needs, and by offering neighboring states the opportunity to benefit from said military we earn great leverage on the diplomatic stage. Military treaties, defense contracts, and intelligence-sharing operations may very well be an arm of our new foreign policy in Europe and abroad, a valuable tool of exerting influence beyond the Kingdom's borders"
 
 ITA_reaffirm_local_institutions_desc:0 "The traditional power structures in the colonies, local village chiefs and aristocrats among them, have been an asset squandered by the fascist imperial policy. Where they saw only native theatrics worthy of contempt we see native opportunity. These small-time power brokers are the very foundation of Italian control across the vast territories of the empire, and when offered opportunities for support and cooperation, they are likely to play an even larger role in colonial affairs\n\nDelegation, slow and studied, will be the name of our policy here. Supporting native traditions and upholding local institutions as pillars of Italian rule, not outgrowths, so that they may start governing instead of us."
 
 ITA_protect_italian_communities_desc:0 "The Italian nation is not only confined to its European borders. South of the Mediterranean, lies our model colony in Libya. Following the Red Sea, there is our jewel on the horn of Africa, Etiopia. It goes without saying that the Italians living there are as Italians as someone from Milan or Napoles.\n\nWe'll reaffirm our commitment to protect the interests of those who live in the colonies. Whatever the future lays in a possible post-colonial order, we'll make sure the Italian communities remain influential."
 
 ITA_la_nostra_europa_desc:0 "Before the Reich imposed its will on the continent by force, it existed an idea of solidarity between the nations of Europe. Joined together by Christian values and liberal traditions, the European nations have a common culture and history. We should remind our fellow European brothers of the things that bring us together.\n\nWe'll make a propaganda campaign aimed at pushing our idea of a free and united Europe, attracting other nations of Europe to our sphere. The Reich separated us, but we'll reunite."
 
 ITA_the_last_crusade_desc:0 "Is there any struggle more virtuous than the struggle against fascism?\n\nThe nazis and the fascists were enemies of the church, and of good Christians across the globe. They torture and slaughter innocent Catholics and Christians, out of hate and greed. Their cruelty is matched only by their efficiency in conducting their genocides.\n\nTo see the horrors of fascism, one must only look to Poland, Slovakia, and Bohemia. Entire nations subjected to inhumane cruelty and hatred for the languages they speak and the circumstance of their birth. As a fellow Christian nation, it is our duty as proper Christians to aid these poor oppressed peoples and support their fight against fascism. While we can't risk war by promoting violent, direct action against them, there are other ways to create change. Peaceful methods can be just as powerful as violence, and in supporting these nations' struggle against their fascist overlords, we may save some lives that would otherwise be lost. At the end of the day, that is the reason why we fight."
 
 ITA_for_they_shall_be_first_desc:0 "As we have withdrawn from our own colonial adventures, we must realize that many of these nations have been left ill-equipped to handle the mounting issues and concerns as they grasp their new freedom. This is through no fault of their own, but without the stabilization and outside investment once enjoyed, these problems are bubbling up to the surface.\n\nHowever, we should not let them struggle alone. They must be able to forge their own path, but we can help give them a better chance to succeed. Economic aid is the surest way that we can help them find their footing. We will not stipulate or condition this aid, but allow it as a tool and resource for them to use to develop as they see fit.\n\nWith this effort, we shall hopefully make the world a little more prosperous, safe, and free."
 
 ITA_backchannel_talks_desc:0 "Hungary and Romania have a tragic history. Scenarios of never-ending conflicts and constant struggles for power, the region remains politically unstable. And if that was not enough, the Reich still attempts to make the situation worse, forcing these countries to follow their will by force.\n\nStarting unofficial diplomatic talks with Hungary and Romania will be our initial moves to bring them to our side. With this partnership, we'll make sure both nations have a brighter future."
 
 ITA_conciliatory_stances_desc:0 "If Italy is to retain and expand her influence in the world she will need to reassess her relationship with the other nations of Europe. In order to facilitate this transition we will need to present ourselves as a mediator and unbiased third-party for our fellow nations.\n\nInstead of pursuing and perpetuating a policy of brinkmanship between the nations we must put aside our pride and begin to reconcile. The nations of Europe not already under the spectre of the Nazis can only have a hope of relevance if we band together in common cause. If we can leverage our relative power in Europe we can expand the ideals of international cooperation, in opposition to the competition of nations that has laid at the heart of international relations until now.\n\nOf course, placing ourselves in this role will also increase the amount of influence we can leverage in the future."
 
 ITA_encourage_evolved_classes_desc:0 "As we move ever closer to eventual decolonization we must look into the future of the colonies. Prospects for the postcolonial administrations of our colonies are not as they ought to be. With this in mind we will begin to invest into better education for certain subsets of the colonial population. This class of the population will make up the backbone of the postcolonial administration and will be able to carry out their duties to an effective degree.\n\nThe initiative will be a costly one, but the short term costs will pay dividends when the decolonization process is complete and our new allies rise to stand on their own feet."
 
 ITA_pathways_to_citizenship_desc:0 "The people within our colonial possessions represent an invaluable resource for the nation. The fascist regime saw these people as a disposable resource to be used and disposed of, but the truth of the matter is that they are the future of Italy.\n\nFor many of our colonial subjects there is an extremely small amount of opportunity in the colonies, but within Italy itself there are opportunities aplenty. In order to leverage this desire for opportunity and this source of potential, we must make it easy for our colonial subjects to acquire Italian citizenship. As such, a commission must be put together to promote and process new applications.\n\nThis is an opportunity that cannot be restricted to those of european descent, as they make up an all too small amount of our subjects. The opportunity will be opened up to every person within our colonies regardless of their race."
 
 ITA_smiles_and_handshakes_desc:0 "If our new policy of international cooperation is to be a success we have to come out swinging. In the coming days, the foreign ministry will be in talks to set up official state visits to nations that reside outside the Nazi sphere. Hungary, Romania, and France will be prioritized for the time being, but if these visits are a success we will expand visits to the other nations of Europe.\n\nWhile this initiative will prove difficult, as the stain of the fascist regime will stay with us for a long time no matter our actions, if we find success in this then the future of Italy and Europe will be that much brighter."
 
 ITA_releasing_the_burden_desc:0 "Our preparations for decolonization are going ahead as planned, but we have yet to properly begin the process. With that in mind, we need to start making serious, and substantial, moves towards complete decolonization. There is much to be done, of course, and not all of it will be easy but we have made a commitment to this path and cannot stop now.\n\nIn certain locations, local governments must be created from whole cloth and in others colonial administrations must be populated by administrators native to the region. Where possible, existing state apparati will be co-opted and devolved to the native populations. With a little bit of luck and hard work we will leave these new nations better off than before our rule, certainly better than before our new democratic regime."
 
 ITA_pacem_in_terris_desc:0 "Since the fall of the old regime we have seen the reputation of the Italian nation take a grand turn. Where our foreign policy was once a confusing mess we have turned it into a well oiled and, perhaps more importantly, consistent machine. More than simply turning our foreign policy away from the isolation of the fascist system, we have molded the nation into one of peace and cooperation for the people of Europe and elsewhere.\n\nThe people of the world will come to see Italy as an arbitrator of issues serious and miniscule, where once they saw us as a hermit kingdom devastated by our erstwhile allies.\n\nThis will truly be the Italian Century!"
 
