 ITA_the_lefts_new_course_desc:0 "All over Italy, within the factories and the mills, within the mines and the countryside, workers rejoice! Italy is now being led by a government that not a decade ago would have found itself at the end of a noose, as communists and socialists alike put aside their differences for a kinder future. Of course, our future is at risk of betrayal. For every speech of unity and brotherhood, there are two more speeches of betraying the coalition, for niche beliefs and ideas long lost to the history books. Good ideas or not, we must focus on the present! We can write theory all we want, but if we don't collaborate for the future, then all is lost. That can never happen.\n\nCelebrations are breaking out all over Italy. It seems that the people have hope. We should fulfill their hopes, lest we once more fall to obscurity."

 ITA_bread_work_and_freedom_desc:0 "For decades, the basic political goals of the Italian left have seemed like impossible dreams amid routine and vicious fascist suppression. All of a sudden, our fortunes have reversed, putting us in power for the first time in history. Even so, these goals seem only slightly less daunting.\n\nThe left coalition's immediate objectives will be to combat the mass unemployment of Italian workers in this sluggish economy, raising the standard of living, and restoring the political freedoms that allow the labor movement to build itself up in peace. All are hard and involve challenging a powerfully entrenched former fascist elite, but siding with the oppressed and downtrodden has never been an easy task. Time to get to work, and with no time to spare.""

 ITA_la_questione_morale_desc:0 "The red, white, and green banner of Italy has been stained black over forty long years of fascism. The crimes committed by Mussolini and his lackeys are almost beyond comprehension. Repressions of workers and peasants within Italy, imperialist exploitation outside of Italy, bloody campaigns of conquest that mercilessly carved through three continents and innumerable other acts have sullied our morality as a people. Like a miracle, Italian democracy is back, and with it a chance to make the oppressors face justice for their crimes.\n\nFascist bureaucrats and war criminals had total impunity, but they will no longer. The government is not omnipotent, but it can remove the worst from their positions and charge them for their abuses. Although we cannot purge Italy of fascism overnight, we will never be able to look ourselves in the mirror if we do not try to make amends."

 ITA_negotiating_work_contracts_desc:0 "Big business and the bourgeoisie have exploited labor in Italy for centuries, under various forms of fascism. The Italian laborer has suffered in brutal conditions, for long hours, for meager pay, with no guarantee of security when he can no longer break his body for the overseer. Now, in the new Italy, we have the opportunity to protect labor from the caprice of management and vastly limit businesses' ability to fire workers at their own discretion. It is our party's duty to protect the worker.\n\nWe have two avenues we can attempt: we can empower the workers themselves to speak on their own behalf and issue their own demands or we can speak on the worker's behalf with Confindustria and work out a deal. The workers may be radical, and an agreement might be more easily reached in backrooms among friends than between opponents at a grand negotiation."

 ITA_defending_the_other_half_of_the_sky_desc:0 "Something horrible with how modern Italian society operates is its treatment towards one-half of its population; those being the women of Italy. In terms of the law, they are treated less than subhuman. Their autonomy as living beings is frequently infringed upon by the very laws supposed to protect them. This is in desperate need of change, without hesitation, but how to go about it?\n\nFor a start, we will roll back on the old laws allowing for honor killings of women, as well as the disgusting practice of repatriation marriages. With these changes, we can begin to balance Italian society, as it should be. Perfectly equal, for we would betray our beliefs if we did anything less."

 ITA_amara_terra_mia_desc:0 "There is a special connection that the people of Italy have towards our land. This is especially true for our farmers,with many having cultivated the land for generations, toiling to make ends meet. But the current situation related to the landlord is destroying such sacred bonds that have connected the farmer to his land for centuries. Now, landlords can take a portion of the work of farmers for nothing more than owning the land, and use their influence over them to their own economic ends. Land reform requires not only eliminating the power of the landlord, but in ensuring that such individuals will never crop up again as dictators of the countryside."

 ITA_giu_le_mani_dalla_citta_desc:0 ""Nothing is more destructive to an economy than pointless speculation. It uses up capital that would be better spent elsewhere, creating a bubble that will eventually pop, with consequences for the entire national economy.\n\nThis must be stopped. Stronger regulations will be placed upon those who would rather speculate on land than improve it for, making it illegal. Those who have participated or will participate in it will have their land taken and distributed to people who would use it to more productive ends. This will not only help our economy, but will also give the peasantry a foot in the door for an opportunity at a better life.""

 ITA_the_gaze_of_the_red_inquisitor_desc:0 "This country may have reached democracy, but this word carries with itself an important meaning - one which is too noble to be polluted and muddled by remnants from the past. Democracy is an empty word if it is merely the old regime under a new coat of paint: what does democracy mean if our law enforcement is made up of the same people who just a few years ago used to beat up and arrest anyone found guilty of protesting fascism? What does democracy mean if our judges are the ones who incarcerated and deported thousands? What does democracy mean if our politicians are the same, corrupt cynics who profited off the violence and brutality of fascism? Carrying forward the moral question, as posed by Enrico Berlinguer and his vanguard of communists in the PSI, is fundamental to ensure that democracy becomes something real in this country, and does not stay a mere word."

 ITA_follow_the_paper_trail_desc:0 "Our state archives, deep in the basements of the Roman government palaces, contain a buried treasure made of paper: documents by OVRA, reports of the Casellario Politico Centrale, letters and memorandums exchanged by gerarchi, detailing the extensive fascist repression apparatus and its many awful deeds. No longer shall this evidence be hidden from the public eye: they will be the first step in a more thorough investigation of the numerous crimes of the fascist regime and their material executors. This will be the first step in removing those people who were complicit in fascist repression but still occupy relevant political or administrative positions."

 ITA_remembering_old_wrongs_desc:0 "Across Italy, the number of people who were directly or indirectly harmed by Mussolini, Ciano and their lackeys is too high to count. Some were genuine antifascists who were committed in a struggle for freedom and peace; others had no guilt other than being a target of fascist hatred and racism, whether they were Slavs, Jews, Arabs, or any of the many other minorities which populate our country. Many of those who suffered at the hands of the regime are dead, but their relatives and loved ones are often still alive: we shall encourage the people who paid most dearly the price of fascism, giving them a platform to speak. We shall not allow the epigons of the blackshirts and the gerarchi to write our country's history - the black mark of fascism will remain as a stain on Italy's national conscience, encouraging us and reminding us that people who supported or were part of the regime must never be allowed in power again."

 ITA_follow_the_money_desc:0 "The fascist dictatorship enforced around itself a facade of efficiency, honesty, and dedication to the people, and it was often the case in the old regime, behind this facade there was nothing but cynicism and violence. Many fascist gerarchi and former prominent political figures became rich thanks to embezzlement, corruption, frauds, inexplicable enrichments, and links with the mafia. Obviously, many of those who were guilty of robbing the Italian people after they had brutalized it and deprived it of its freedom were never tried, but times have changed, and it's time to finally bring these criminals to justice. We shall do everything in our power to acquire evidence of financial and economic misdeeds by prominent and not so prominent fascists, so that may finally face trials."

 ITA_pursue_mafia_connections_desc:0 "Organized crime is becoming more and more of a problem in this country, and as is often the case, criminal organizations have spread their tentacles well into the realm of politics. During the fascist period, numerous politicians and bureaucrats close to the regime began to entertain "friendships" with the mafia, and this allowed the "cosche" to infiltrate the state administration at local and even national levels: sadly, this problem was not solved with the introduction of democracy, as all the mafiosi had to do was to find someone else to corrupt, and in many cases, they can still rely on their old fascist friends, who now try to pass as "national conservatives" or some other such sham. We must direct our attention towards rooting out this pest from Italian politics - no true democracy can exist when it is criminals who rule!"

 ITA_none_shall_escape_desc:0 "Berlinguer's struggle for democracy and against fascism is almost over - we have accumulated plenty of evidence, and the people are on our side. It is time to submit to parliament a series of laws which would allow us to root out the mafiosi and fascists from the state administration. No matter in which parties they took shelter, no matter in what council, committee, subcommittee, organism, or other state organization they hide: they will be found, and they will be made to pay for what they did. The people have spoken, and it is time that Italy finally takes its new course - but no new course can take place without a radical rupture from the old. By their vote, the Italian people, the same people who have been oppressed by so many years, have finally taken matters into their own hands, and under the new red flag of freedom, peace and progress, there is no room for wrecks and parasites of the old order."
 
 ITA_talk_to_the_workers_desc:0 "The very nature of a union is a liberation of the common man. Through unity, all can pursue work, within reasonable amounts, while still allowing for the proprietor of the establishment to sell and distribute their goods. Through this system of demands and concessions, society goes on, though the question of the state's involvement in such matters continues to linger. The solution to this quarrel is quite simple; we are to ensure that the unions have the operating space necessary to work as required and allow them to make their demands.\n\nWhile this will anger many of those who have oppressed the worker, defended by Fascists, it is a sacrifice we should be willing to make."

 ITA_protecting_jobs_at_all_costs_desc:0 "Capitalism is premised upon survival being connected to employment - that the only way to eat, to clothe oneself, to live, is to sell the fruits of one's labor. It is an inherently coercive system. As long as the profit motive continues, and as long as the system of private property exists, such is the reality of millions of Italians.\n\nBut it doesn't have to be that way. While we cannot abolish private property, we can make things more bearable in the here and now. We can ensure that every man and woman has security in employment, empowering the workers to unionize and be safe in their places of work. Firing will still exist, but will no longer be something every worker fears.\n\nAnd if the businesses refuse to accept this, we will have the stick of nationalization to whip onto them. They can either grin and bare it, or complain and suffer the lashings of the state."

 ITA_talk_to_the_confindustria_desc:0 "Big business is still quite influential. While we will always fight for the working classes and poor of this nation, we cannot do so without at least making some compromises with the establishment and capitalist organizations. While distasteful, it is necessary when in government.\n\nGoing to Confindustria, our representatives will present economic proposals that will be amenable to them - ensuring additional benefits for workers and their unions, and ensuring that the government isn't completely deaf to their interests. The alternative, of course, would be for them to completely abandon Italy and her people, and we can't have that yet."

 ITA_the_cost_of_labor_desc:0 "The reality is, a lot of businesses cannot afford radical departures in economic policy in the government. Some - especially small and family run businesses - will go under if they are forced to compete with big businesses on that level.\n\nWhile we should never become the party of the petit bourgeois, we also cannot drive the mass of workers in these businesses to be driven into the maw of the large industrial combines. As such, while we will not shy away from increasing protections for workers, we shall also offer economic aid to businesses that cannot afford to implement such reforms without going bust. The last thing we need is more unemployed workers."

 ITA_open_up_the_prisons_desc:0 "The crimes of fascism are uncountable, but none have been more terrible and damaging for the Italian people than censorship. Every family has a story about friends and relatives who were incarcerated or disappeared simply because they said the wrong thing at the wrong time, not to mention those who were murdered in secret only for their bodies to be found later as warning to everyone else. No more will the Italian people have to suffer for their ideas, and all past laws punishing "crimes" against the State, the King, and fascism will be repealed effective immediately, meanwhile, all those who were unjustly imprisoned by the fascists and still languishing in prisons will receive full pardons. The Italian people will be free from censorship and totalitarianism in a country that respects their freedom of thought."

 ITA_free_the_academia_desc:0 "Under the restrictions on freedom of speech and thought imposed by the PNF, our higher education system suffered the most. Our universities are the laughing stock of Europe, corrupt institutions where professors get their tenure depending on how loyal they are, and students do not learn but rather parrot the notions and ideas of their fascist teachers. Our reforms will destroy this corrupt system, the deans and professors who were too close to the PNF will be fired on the spot, while socialist student movements will be allowed to organize and act freely once again. The students of Italy will be allowed to think and speak as freely as they want, and no one will be barred from entering higher education because of what they believe."

 ITA_land_to_the_toilers_desc:0 "For generations, the large landed estates have dominated the economic and political life of Italy's countryside. Whether it be through their influence in the councils of trade, or in their soft power in their local communities, and them being able to deny representation to smaller farmers, these leeches have sucked up much of the land from the small yeoman and his family. Making money off their monopoly, they rarely improve upon their massive estates, and often use their power to manipulate the political system for their own benefits.\n\nThe only way to overcome this, and the only way to destroy the landed estates and their aristocracy, is to confiscate and break them up. No longer will economic elites determine the economic destiny of our people."

 ITA_land_redistribution_desc:0 "The State has been successful in confiscating the massive amounts of land hoarded by the economic and social elites of the countryside. But the second part of our program has yet to begin - its redistribution to the landless peasant.\n\nThe landless peasant will finally have a stake in society, a stake in its future and a stake in our democratic process. In addition, this will be a prime opportunity to industrialize our countryside, to increase productivity and the wealth of our nation. By encouraging some of the more educated and ambitious among them, we will assist in the development in factories in the countryside, creating opportunities for industrialization that will benefit the nation and the working class at large."

 ITA_land_to_those_who_put_it_to_profit_desc:0 "For decades, significant portions of our countryside have been in the hands of old money aristocrats more concerned with profit than with the survival of their farm hands. Even increasing productivity seems to be a foreign concept to them, as long as profits continue to be high.\n\nThis cannot last. A productive agricultural economy will make food cheaper, and thus increase the standard of living for our citizens in the long run. But these landowners cannot be swayed by moral posturing or incentives, but instead must be threatened with the power of the state. If they refuse to improve their land, the state will give it to those who will. This will not only increase productivity, but increase wages for farmers, as agriculture will become a skilled sector of the economy at last."

 ITA_reforming_the_latfundia_desc:0 "There are many similarities between the landless peasant and the industrial worker. They both work for others who profit off their own labor. They both are alienated from their work and from each other. They both have been oppressed by their employers at the earliest sign of resistance. And, most importantly of all, only through acting together as one can they prevent their own exploitation.\n\nWe will make it easier for landless peasants to organize into unions, and for them to collectively bargain with their employers. The era of the oppressed peasant, rolling over like a lapdog, is over: the peasant and the worker shall work together as one, to beat their oppressors."

 ITA_rebuilding_the_country_desc:0 "At long last, the left has formed a new government in Italy. The Italian people shall now control their own destiny and ensure their own prosperity! Giuseppe Saragat has made many promises of change, but foremost among them is his idea of massive structural reform to Italy's infrastructure; much of the country is still in poverty, with barely developed roads and factories across the poorer sections of Italy. How can we be for the people if we do not improve their lot?\n\nGiuseppe Saragat has decided to tackle the issue, beginning with a modernization of our infrastructure. Much of the country still relies on crumbling roads and railroads from the fascist days, or slapdash "replacements" constructed on the cheap as the government ran into budget problems. No expense will be spared for the Italian people! We shall remedy the situation and heal our country."

 ITA_the_sullo_plan_desc:0 "Another issue we face is the lack of a singular, rational urban planning method and a way to modernize old plans. Our country is old, and while this brings a rich history, it means our cities are less uniform than would be preferred. Fiorentino Sullo, PSDI member and one of Saragat's closest advisers, has devised a plan to begin correcting this: he proposes a central authority to develop parts of the country in a more efficient manner, allowing a better flow of traffic and public transportation. If passed, this will allow the country's cities to become far more comfortable places to live than before."

 ITA_reform_popular_housing_desc:0 "How can people be expected to live good lives when they cannot afford a home? This is a sad reality for many people across the world, including Italy. Luckily for us, we have the "popular housing," designed to ensure that the least fortunate among us can have at least someplace to live. The PSDI will begin to centralize the national agencies responsible for providing popular housing in addition to providing them more funding. We must ensure that every Italian has the opportunity to have a roof over their head, no matter their social status."

 ITA_deep_into_the_countryside_desc:0 "It is true that the situation of the urban denizens of Italy is difficult. However, the cities are far better-off than the countryside, those underdeveloped and agrarian regions that suffer from a lack of almost everything: medical care, education, life expectancy, all of these are demonstrably worse in rural, particularly southern, Italy than in the cities. The PSDI has proposed a truly massive undertaking: a massive expenditure to build up roads, hospitals, power lines, waterways, and other infrastructure in the rural areas. The farmers and people of the countryside have gone forgotten for too long. It is time we gave them their due."

 ITA_agrarian_reforms_desc:0 "Traditionally, the agricultural land of Italy has been held by relatively few people, owned by a series of aristocrats and large estates, though the state has recently become a large landholder as well. However, these farms run only for the benefit of a few are unwilling or unable to exploit unproductive rural areas. The people who actually run the farms, the actual small farmers, do have the willingness to do so, and so we shall turn to them.\n\nFirst, we will grant farmers' cooperatives plots of state land to manage and make a profit from. Second, we will grant tax breaks to these cooperatives, in order to encourage their growth and, if all goes well, to allow others to spring up in their wake."

 ITA_case_scuole_e_ospedali_desc: "We need one more thing before we can proceed to rebuild this country in earnest, and that is to pass this DDL in Parliament. Many MPs will certainly object to such a wide sweeping plan, especially those sitting in the right wing bloc. Many MPs will claim that the tax windfall will be better spent on other programs, but Italy does not need more tax cuts for factory owners or more money for the rich. Italy needs houses for its people, schools to educate the children, and hospitals to heal the sick.\n\nWe are democratic socialists, and we strive for an economically just and politically free society. Because a society can only be a true and authentic democracy if its people can enjoy the same services independently from their class."

 ITA_three_big_unions_desc:0 "The Unions are the representatives of the workers, and as such are a vital part of our strategy to help improve the lives of the Italian people through adequate workers' protections, labor laws, and minimum wage legislation.\n\nThe three biggest unions are the CISL, the CGIL, and the UIL. We need to speak to all of them in order to find out what the workers require from us. But the question is how to arrange such a meeting, and so we will listen to suggestions within the government for how to do it."

 ITA_consigli_di_fabbrica_desc:0 "Since before the days of Marx, it has been the left's goal for the workers to directly control and own their workplaces, so they may receive the unadulterated product of their labor. While this goal may be far off, we can move a step towards it by establishing "factory councils" in the workplaces. We will make it compulsory for every large business or industry to have a council of representative elected by and beholden to their workers, to grant workers a greater say in the running of a business than even a union can provide. Hopefully, this legislation will be just the first of many initiatives to transition towards socialism."

 ITA_encourage_collective_bargaining_desc:0 "Collective bargaining is the fundamental right of every worker, a right that went neglected for too long under the Fascists. As such, the Italian labor unions are inexperienced at negotiation and, as such, conduct their collective bargaining on local levels, with local managers and branches. The time for this has passed: we must encourage collective bargaining at the national level between the unions and Confindustria, in order to ensure the rights of the workers are met. No longer will a lack of solidarity be the cause for worker oppression, as the companies learn that the unions can no longer be divided and conquered. The workers of all Italy shall benefit!"

 ITA_the_unions_demands_desc:0 "The workers are ultimately the reason any company is able to produce wealth, the reason why our factories make products, why our restaurants serve food, why our fields grow crops. Should the companies not listen to the workers, then? Why should the companies be allowed to dictate the terms under which they can exploit the workers?\n\nThe government shall begin passing laws that enshrine the rights and powers of unions. When the workers make demands of their bosses, they will be listened to, or the companies shall face the wrath of the government."

 ITA_case_by_case_basis_desc:0 "While the grand conflicts between the Confindustria and large trade unions receive much attention, we must not forget that unfair labor practices and exploitation can occur even in the smallest business. This is why we must push for negotiations between organized labor and the capitalists to occur for single businesses, so that no worker and no businessman is left out, and so the workers of a business can find a settlement with their employers that best suits their conditions. Some of the established trade unions might complain over a perceived loss of influence among the labor movement, but we must prove to them that this legislation is pro-worker, as it will grant the employees of small businesses a voice in their workplaces for the first time in forever."

 ITA_joint_welfare_programs_desc:0 "Despite their suspect motives, some of the capitalists may be correct in their assessment that the demands that unions impose on businesses may be excessively burdensome. That is why we must pass a law to allow businesses to receive state support for welfare to meet the demands of the unions. Even the largest enterprise holds only a fraction of the resources that the state possesses, and therefore it is the state's duty to spend those resources to help those in want. Of course, some on our left would prefer to cut the middleman and have the state provide those social services directly, but this compromise is a good starting point on the road to an adequate social safety net."

 ITA_revitalize_the_school_system_desc:0 "The Italian school system is one of the most prominent examples of how the previous governments of Italy failed their people, and the left has made its reform a prominent demand for decades. Currently, Italy only guarantees five years of primary schooling, after which children have a choice between going to the scuola media and liceo classico, which grants access to university, or going to the technical avviamento al lavoro. This system was established by the fascist regime in order to both train cheap laborers quickly and cultivate the future leaders of the Italian Empire.\n\nHowever, in practice, it only fosters classism and elitism, as students from disadvantaged backgrounds are strongly "encouraged" to enter the technical schools. In addition, the Catholic Church maintains its own separate schooling system, and many choose to send their children to Catholic schools, depriving the state schools of pupils and funding. Finally, many parents from the countryside or the working classes chose not to send their children to school at all, a problem that has plagued Italy since the 19th century. Ensuring that every child has a good education will be a great challenge, but if the left succeeds in this endeavour, Italy will be far better off."

 ITA_start_from_scratch_desc:0 ""After commissioning, reading through, and discussing countless proposals and counter-proposals, we have concluded that the current Italian education system cannot be salvaged, and must be rebuilt entirely from scratch. Already, we are laying the groundwork for our new system, but as a first step, we will make all public education entirely free of charge, supported by taxpayer lira. This will significantly reduce the financial barriers to education that poor families face, encouraging them to send their children to school. Finally, we must significantly curtail the influence of non-state schools, by either passing strict regulations that will relegate them to a secondary position in Italian society, or outright shutting them down entirely."

 ITA_scuola_media_unica_desc:0 "It is apparent that five years of primary education are not nearly enough for a person to thrive - even blue-collar laborers require a decent secondary education to compete in the 20th century. For this reason, we will abolish the old bifurcated school system and instead enact compulsory 10-14 year schooling that includes the old scuola media. All students will be taught through a unified, secular curriculum that will provide a well-rounded education, as well as qualifying them to attend college in the future. Of course, we will also provide optional technical training for those seeking to become blue-collar workers, but the new system should be enough for the vast majority of Italy's workforce."

 ITA_rework_the_current_system_desc:0 "Though we hate to admit it, the fascists may have had a point in choosing to bifurcate post-primary education. A blue-collar worker does not need the skills and knowledge that a white-collar worker or university student will need, and it would be absurd to expect a single curriculum to fit the entire Italian population. However, we can still enact major reforms to the current education system, such as significantly increasing funding for public schools, ending gender segregation of the curriculum, providing free lunches, and more, to ensure that Italy's schools are equitable and serve the Italian people, not just the well-off."

 ITA_curtail_truancy_desc:0 "Despite our sweeping reforms to Italy's education system, there still remain significant barriers that make it difficult for disadvantaged families to educate their children. We will pass further incentives, such as making textbooks free, enacting tax breaks for sending children to school, and making public transportation cheaper, to discourage truancy and ensure that all children in Italy can afford to get an education."

 ITA_the_eternal_question_desc:0 "The south of Italy has lagged its more developed northern neighbors for decades now, its economy dependent on inefficient agriculture. Endemic crime, poverty, and corruption have stymied southern Italy's social development while the north has relatively prospered. Previous governments have struggled with this question, leaving the Southern Question as a problem for their successors.\n\nThe government shall, once and for all, decisively answer the Southern Question and begin plans to conduct major development of the Italian South. With sufficient applications of government funds and reform, perhaps even the wild and unruly South can finally be caught up to the rest of Italy's speed."

 ITA_democratic_planning_desc:0 "The first step in developing the south is drawing up the proper blueprints. The government's economic experts have drawn up detailed economic plans for the modernization and industrialization of the south that, if followed, will catch the region up to the rest of Italy. The construction of factories, roads, hospitals and all the other panoply of modernity will surely be welcomed by the south and its citizens as an escape from familiar poverty.\n\nRather than leave development to the vagaries of the market or other such wishful thinking, a muscular and carefully-considered plan of development shall be the government's tool. Though the cost may be high, the development of the south would be a large feather in the government's cap indeed."

 ITA_aid_from_the_north_desc:0 " The north of Italy has long been the wealthiest and most developed part of the country. Industry found a comfortable home for itself in the northern valleys, drawing on the large cities for an endless flow of workers. As a result, there are many wealthy industrialists in the north, still clinging to their huge conglomerates and enormous fortunes. The development of the south will be extremely expensive and the deep pockets of the big northern industrialists are a tempting target indeed.\n\nWe shall politely suggest to the northern industrialists that they may either willingly contribute to the economic development of the Italian South or we shall increase their taxes to foot the bill instead. Though a few may resist the demand, many more will acquiesce to the government's demand and alleviate the dire expense of southern development."

 ITA_repurposing_old_tools_desc:0 "The government thankfully already possesses many of the tools necessary for developing the south. The IRI and other state-owned holdings, the few useful remnants of the former regime, will serve as excellent funnels for government investment into the south. As the IRI rebuilt and redeveloped much of Italy in the past, so shall the south's turn before the Institute's experts begin.\n\nAfter all, the more money we spend, the more the south shall develop, factories and roads multiplying across the landscape and heralding the arrival of progress. The IRI have done excellent work in the past, and it may be better to use an old tool we know than any new and untried measure."

 ITA_local_resources_desc:0 " As we study southern businesses, we learn that many are hopelessly backwards, using old and outdated methods of conducting trade. We can build all the roads and factories that we want, but if they are not managed well or are improperly repaired and used then our investment campaign will have been completely futile. Besides, the south must be able to stand on its own two feet, and cannot forever rely on the lavish attentions of the government.\n\nAgain, the ever-useful IRI holds the solution to our and the south's woes. The government can use the IRI investment plans to encourage southern businesses, be they one of the few factories or one of the many farms, to modernize their business practices. With the carrot of IRI funds and the stick of modernizing reform, we shall lead the south towards progress!"

 ITA_expand_poverty_subsidies_desc:0 "As it stands the welfare system is in a sorry state. Due to its patchwork and inconsistent shape, there is no guarantee that the needy, be they unemployed, elderly or disabled are able to get the aid they are entitled to. The government shall immediately begin rationalizing and improving the public entitlements system to improve the current piecemeal approach.\n\nWith sufficient rationalization and hard work, the system will have universal coverage, allowing the needy to get the assistance they need through a simple and straightforward system. Though the expansion of poverty subsidies may come at a hefty price, aiding the poor of Italy and alleviating their suffering is a worthy cause indeed, while fixing the insufficient current system is a good in itself."

 ITA_the_seven_theses_desc:0 "The workers of Italy have granted a mandate to the government to begin the liberation of the Italian worker, the institution of Socialism, and the transformation of Italian society. Our path shall follow the path outlined by Lucio Libertini.\n1. The transition from capitalism to socialism needs to be lead by the proletariat.\n2. The road of democratic socialism is the same as the road of workers' democracy.\n3. The proletariat is empowered by its own institutions it has made.\n4. The modern development of Italian capitalism has damaged the worker, and must be countered by workers' autonomy and control.\n5. Class unity means the connection between struggles and ends - workers' control cannot be achieved without the unity of the laboring class.\n6. Industrialization and capitalism's expansion are separate, and industrialization must be made to support the class movement.\n7. Workers' control must be enacted not through paternalistic top-down granting of powers, but through workers' consciousness, enacting their control on their own.\n\nWe have every intention on enacting these theses, on our path towards Italian socialism."

 ITA_istituzioni_operaie_desc:0 "Democratic socialism, workers' democracy, workers' council, and proletarian consciousness are impossible to separate from each other. Each is a step necessary for constructing the foundation of socialism for the Italian worker, and must be enacted. Here, we are to empower councils of workers, horizontal organizations that function as manifestations of workers' powers and control, democratic bodies that are part of our road towards socialism.\n\nThese workers' councils, empowered by encouragement through parliamentary means and uplifted through proletarian class consciousness, will begin to take control over many Italian industries - co-operatives and state owned businesses will have control given over to these councils, and privately owned capitalist businesses will see more workers' power granted. The result will be the fulfillment of one of the goals of our Seven Theses, and therefore a step towards a liberated Italian worker."

 ITA_pedagogy_of_the_exploited_desc:0 "Schools are universally considered to be one of the most important parts of a successful society. Contrary to existing schooling systems, where they are expensive institutions of the elite, meant to instill skills to either work in factories or run them, we have a much different approach to the education system. Schools are to be for, and by, the worker, meant for their betterment, not subservience.\n\nOur new, worker-ran schools will have a variety of goals, from the existing responsibilities of teaching literacy and other basic skills to our nation's youth, to technical skills to improve one's ability to work for the betterment of our country, to politics, to make sure the worker is aware of his situation and circumstance in society.\n\nOur intended result is to create a country with a working class that is educated to be efficient and to be class conscious, for the net benefit of all."

 ITA_introduce_workplace_democracy_desc:0 "Workers' councils are already our preferred managerial method for the businesses in Italian society, and we are hard at work at implementing them. However, simply delegating the power of the workplace to the worker, while a noble goal, is not clear enough, and is prone to misconception, and misconception is prone to exploitation.\n\nWe are to set out clear rules on how the new Italian workplace will function. Just as how democracy has been newly brought to our peninsula, democracy shall be brought to the workplace as well. Foremen, those who manage the workers, are to be directly elected by the workers, to ensure that workers are not being watched over by a tyrannical structure of which they have no say in. Additionally, workers will have a right to vote on business policy decisions, ensuring that they have a say in what their blood, sweat and tears is dedicated to."

 ITA_technical_investment_plans_desc:0 "In improving the status of the Italian worker, we have improved the status of the Italian industry. However, it is now time to also do it the other way around, by improving Italian industry for the benefit of the worker. Current industrial manufacturing processes are reliant on unskilled labor, requiring thousands of man hours to be spent on menial tasks. This is not just bad for the wellbeing of the workers, but bad for the economy, as those man hours could be much better spent on more skilled pursuit.\n\nThrough a shift in production methods, and aided by our education of the workers, we are going to change the way that Italian industry works. The lifespan of workers will no longer be spent on menial labor, but on skilled, specialized pursuits, allowing them to reach their fullest potential, and allowing Italy to reach its fullest potential as well."

 ITA_link_up_with_local_administrations_desc:0 "A critical aspect of socialist theory is that the economic structure of society and the political structure of society are one in the same, their aspects being intertwined, and their separation being meaningless. Contrary to the opinions of some regarding socialists to be intellectuals with more interest in theory than the material world, we have every intention on making our work match our word, and putting theory to action.\n\nThe new governing bodies of the economic sphere of society, that being our democratic workers' councils, will be integrated at the municipal and local level, giving the councils a say in the functioning of their direct administration. The worker knows well what he needs, and by putting these two structures, so recently democratized, together, we will make a society that betters the worker more than ever before."

 ITA_ending_the_mutua_desc:0 "When somebody is in grave need of medical assistance, be it a grave illness, an accidental injury, or possibly even a victim of an assault, what they need is to be able to go to the hospital, free of worry, knowing that they will be helped by the system, no strings attached. This is absolutely not the current state of affairs in Italy.\n\nThe current healthcare system is inefficient, expensive for all, and is not what the average Italian needs when they are in their most desperate situation. To have to wait to get a doctor, and having to worry even when on the table, lacking trust in the system, for some it seems almost as bad to be in the hospital as it was to have whatever illness that sent them there in the first place. Anybody who has ever had to wait in the ER wing knows how badly we need reform, and we are going to deliver the reform that they need."

 ITA_adopt_the_semashko_system_desc:0 "After the Russian Revolution, when changing the very society that they lived in, healthcare was revolutionized, just as everything else. Nikolai Semashko, a teacher, doctor, and revolutionary, came up with the system that the Soviet Union had used. Healthcare was all nationalized, under the state. All healthcare workers, from the doctor to the nurse to the miscellaneous employees of the hospital, were employees of the state. The healthcare system was managed centrally, knowing that illness' cure depends not on one's geographical location.\n\nWhat our decision is is simple. We are going to adopt the Semashko System for Italy. With a nationalized, central healthcare system, we can ease the woes of the sick and injured Italian."

 ITA_reach_wide_desc:0 "Healthcare is doctors, and doctors are healthcare. For all the good work we do in establishing our medical system, and expanding hospital access, there is not much point to it if there are none of our men in white coats to deliver medicine to the needy. As such, we will take the important, necessary and greatly beneficial action of hiring additional medical practitioners, including both doctors and nurses, to fill out hospitals.\n\nAdditionally, our medical education will be expanded; there's not much point to looking for hiring doctors if there aren't doctors to hire, after all! Advanced medical knowledge necessary for entering the doctoral trade will be made easier to achieve, and basic medical knowledge to ensure a healthier life."

 ITA_legge_mariotti_desc:0 "The healthcare organizations - the "mutue" - that currently provide healthcare to a great deal of the Italian populace need to be replaced. A form of health insurance based on profession, it results in a confusing system that divides up care based on factors that should not matter, compels individuals to enter into private companies, has a vast disparity in quality of care, and, perhaps most importantly, locks away healthcare to the unemployed, many of whom need it the most.\n\nOur policy is an obvious solution to the healthcare problem to almost anybody who has had to go through the mutue - get rid of them. Instead of a confusing system with healthcare based on your job, the mutue will be nationalized and transitioned into state-run hospitals and clinics, with free, public healthcare. The fact that they are already so large, and cover so much of the population, means the transition to a universal state apparatus is easy; defacto, they were already one. Meanwhile, the smaller, private clinics will be allowed to remain private, providing healthcare independent of our new state organization."

 ITA_surgical_precision_desc:0 "The human body remains mysterious, despite the great leaps in science of the 20th century. The moon has been conquered by man, but there are many diseases we do not know how to cure, pains we cannot aid, amputees we have but crude solutions for, and so many other ailments that best our system.\n\nLike many other problems, we are aiming to solve this through throwing money at it. New procedures, new medicines, new researchers, new everything! Our medical techniques will be greatly advanced, to become the envy of the world.\n\nOf course, that's not it; innovation is not solely confined to the field of natural philosophy, after all. The organization of state hospitals, to be quite honest, does not make much sense. By rationalizing their structure, and making them share the proper resources, our healthcare system will be greatly improved."

 ITA_previdenza_sociale_desc:0 "The Istituto Nazionale di Previdenza Sociale, commonly abbreviated as INPS, is one of the biggest legacies inherited from the fascist regime, one nobody in Italy wants to see removed. And for good reason too since it serves as the public retirement fund for all Italian workers. While it might be the only good thing Mussolini has ever done for the country, it is not without its flaws, as the years went on the INPS became more and more inefficient and hampered by bureaucratic red tape. Our mandate allows us to reform and rationalize this entity, but how?"
 
 ITA_better_pensions_mean_better_wages_desc:0 "As a public fund, the INPS is financed by the taxes of all Italian citizens from all levels of income, whether they're waged laborers or self-employed. If we raise the minimum wage for all workers not only they will have more money to spend, we will also have more income from taxes that can then fund our welfare system. With more money in every pocket we can make sure that every Italian can have enough savings to live a comfortable elderly age."
 
 ITA_and_the_rich_will_pay_for_them_desc:0 "Every time one tries to improve the welfare system, the same old tune comes out in play. "This is irresponsible spending!", "How are we going to pay for it?!", "More pensions are always nice, but money doesn't grow on trees you know!", "And just who's gonna pay people to sit on their couches all day long?!"\n\nI tell you who is going to pay for them: rich people!\n\nThose Confindustria fat cats get all the profit without having done a single day of honest work in all their lives, but when you try to tax them they always commit fraud and then have the gall to say that they are overtaxed! Well, this is not going to happen on our watch. We will make sure that the capitalists will give back what they took from the community."
 
 ITA_the_new_inps_desc:0 "Welfare reform will not happen unless we reform the system from the bottom up. The INPS can barely keep up with the constant influx of new retirees, and this inefficiency is causing troubles like reduced or missing pensions. We need to centralize the state pensions system to make it cover more people, or the INPS will sink under the weight of its own shortcomings."
 
 ITA_pane_e_lavoro_desc:0 "Now that the new welfare system can actually serve the needs of every Italian worker, we can actually expand it to take new projects like job-creation or unemployment benefits. And for that to work we need to funnel more revenue into the INPS to ensure that everyone has access to a decent standard of living and start job-creating programs through IRI."

 ITA_the_meaning_of_freedom_desc:0 "What is the meaning of freedom in Italy? Yes, we are free of the tyranny of fascism and of authoritarianism. We are free to live life as we wish. With the triumph of the Left, we are now taking the strides to freeing workers from exploitation and the people from the lesions of legal discrimination and harassment for immutable traits they cannot control. In some ways, we are very free.\n\nYet, in others, we are not free at all. The shackles of traditionalism and social social_conservative continue to act against us and ooze like a cancer on Italian society. Old fashioned attitudes and bigoted beliefs are widespread, and seep into the government and its laws. We have three main enemies: patriarchy, prohibitionism, and prejudice. To have true justice and freedom in Italy, these hideous hydras of hate and reaction must be destroyed."

 ITA_towards_a_free_sexuality_desc:0 "One of the greatest wounds of Italian society is the repression of sex and sexual expression. The Vatican and conservative elements seek to keep us in the past, and to restrain us to the forms of love they decide to be moral. This is exacerbated by their patriarchal views of women, which would not be out of place in the 10th century - girls are taught that their purpose in life is marriage, to be pawned off to and serve a man, and to rear him children.\n\nWe must immediately begin the liberation of sexuality, and to ensure that the Church and antiquated and narrow-minded views on morality, abstinence, and sex stay out of Italian laws. This includes the legalization of contraception and abortions, as well as stricter measures against domestic abuse and sexual assault and rape."

 ITA_fuori_desc:0 "Ever since the adoption of the Zanardelli Code in 1890, Italy does not in name criminalize same-sex relationships and sexual activity - more than could be said about our neighbors, and especially the Nazis to the north. However, this has not stopped countless Blackshirts from harassing and assaulting homosexuals throughout the rule of the PNF, nor did it inhibit the fascist government from detaining and prosecuting homosexuals despite not violating the law.\n\nIf we are to call ourselves free, why should we limit Italians to loving the opposite sex? It would not only be hypocritical of us, but would be a moral stain upon our progressive record and a slight against the thousands of homosexuals who live their lives in fear. We must do the right thing, and introduce laws criminalizing targeted harassment against homosexual men and women, and outlawing discrimination against them in businesses and public institutions."

 ITA_reject_prohibitionism_desc:0 "Many a time, prohibitionists have petitioned governments for the outlawing of specific substances - alcohol, tobacco, and now narcotics of all kinds. Not only are these self-proclaimed moral crusaders not in the right - they try to ban substances which in many cases have minimal harm and do not affect others - but they also miss the point. Prohibition only causes the government to become unable to regulate said substances and create a black market. It doesn't decrease demand, but drives it underground. We will legalize and regulate mild narcotics such as marijuana.\n\nMoreover, for those substances which are dangerous, the answer is not punitive justice and punishment, often crippling a person for the rest of their life for a lapse of judgement or a moment of weakness, but rehabilitation and assistance to get back on their feet and rid themselves of addiction."

 ITA_a_lay_state_desc:0 "The influence of the Catholic Church in Italy is truly uncountably large. In every corner of society, the tentacles of Catholicism and decrees from the Vatican can be seen, and it is only harming us all. If we are to become a modern and progressive nation, secularization must be one of our leading concerns. Crosses and other religious symbols will be removed from government offices and buildings, as well as public schools, in which all influence of Catholicism will be uprooted and removed as much as possible.\n\nStrict regulations on the activities of the Church, especially on financial donations, will be imposed to limit its influence, curtailing what has historically been a rat's nest of corruption and nepotism. Finally, we will declare Italy a secular and plural state with no official state religion, declaring to the world that we are not stuck in the past's religious social_conservative and Christian primacy, but are the pioneers of a future of multi-faith and multi-belief society."

 ITA_is_freedom_for_all_desc:0 "Hundreds, nay, thousands of pages of documents, held together by dozens of black binders. Impassioned speeches about the spirit of the Enlightenment and of the importance of the separation of church and state, mixed with condemnations of reactionary attitudes and poisonous bigotry. These are the signs of our tireless work to pass our progressive agenda through the legislature, where they can become enforceable laws and real substantial changes.\n\nFrom young women and student activists, to homosexual men and women, to those of other faiths, beliefs, and sects, and finally to all unfairly imprisoned for usage of harmless substances, millions look upon us in hope and adulation, as the party which can bring about the changes they have been petitioning, protesting, and rioting for for years or decades. We cannot fail them now."

 ITA_ending_discrimination_desc:0 "Unfortunately, Fascism has left many scars on our beautiful nation. One of them is the problem of ethnic discrimination. The Fascist government has pursued aggressive assimilation policies, persecuting ethnic minorities like the Slovenes and the Serbs. Likewise, other non-European minorities like Arabs still face discrimination despite some of them supposedly being Italian citizens. n\n Changing this situation overnight is not going to be easy, considering that a considerable part of the population distrust these non-Italian groups. From where we should even begin? How could we address this problem?"

 ITA_focus_on_nationwide_issues_desc:0 "A multicultural society is a noble ideal. Not everyone in Italy looks the same or speaks the same language. Unfortunately, bigotry and racism affect the majority of non-Italian groups, excluding them from the rest of society. This situation is unacceptable. With this proposal, we'll officially ban discrimination based on language, race, or ethnicity nationwide.\n\nBut we can't limit to just the law written on paper: we'll also take measures to enfranchise communities of non-Italians and help them integrate into society. By embracing the many cultures inside our country, we'll be one step further in becoming a better nation. "

 ITA_one_size_fits_all_desc:0 "Integrating minority groups into society is easier said than done. Despite the anti-discrimination laws, ethnic minorities still experience exclusion in the workplace. Some employers refuse to accept people from certain ethnicities, and some schools don't accept children that belong to minority groups.\n\nLaws promoting inclusion in workplaces, education, and public administration could solve this problem. Facilitating historically excluded groups' access to work and education using affirmative action is a good way of making integration easier."
 
 ITA_focus_on_local_autonomies_desc:0 "Despite living in our nation, some ethnic minorities don't have the same political rights as the rest of the population. As a result, poverty is a common thing among these groups, affecting their quality of life.\n\nWe'll grant vast autonomy to territories inhabited by national and ethnic minorities. By giving them more political agency, we also promote economic and social development in these regions. Needless to say, this will also have very positive effects on our economy. When we include everyone, everyone wins."
 
 ITA_tailored_regulations_desc:0 "Our next step in righting injustice in Italy should be repairing the damage done to minority regions. We can draw up generous investment plans aiming at improving education and reducing poverty. Italy must do more than simply give aid to its minority communities, and should grant them autonomy. Under the government's plan, minority regions would be able to elect representatives and administer their own territories, exercising a degree of freedom in setting their own regulations as well as preserving their ways of life.\n\nThough the government shall win the goodwill of non-Italian voters it can expect to face attacks from the right. Racist reaction shall never deter the government from pursuing justice and Italy needs reform on this issue."
 
 ITA_solidarieta_internazionale_desc:0 "Italy is now a free and democratic nation, a bastion of liberty within Europe. We must tell the world of this new Italy, the only question is how.\n\nItaly has committed many crimes under its fascist regime, and allowed even more to be committed by its former allies. It will take true action to make people believe our reforms are genuine, and to make the other democracies of the world move beyond our past. We must become a true bastion of liberty within Europe, and to stand at the forefront of the fight against fascism. No nation deserves to suffer the horrors of fascist tyranny."
 
 ITA_a_call_for_freedom_desc:0 "Italy has freed itself from fascist oppression, and we must let the whole world hear of this great triumph. The world must know that Italy is now a beacon of democracy and freedom, and that Italy shall fight against fascism and oppression in any way it can.\n\nOur old allies are no better than the fascists we removed from power, and so new allies must be found abroad, as part of Italy's fight against fascism. To further cement this new reputation we are attempting to build, we must focus on allying with the correct nations. We must ally with nations who are similarly committed to democracy, freedom, and the fight against fascism. To do otherwise is to betray our ideals our young democracy was built upon."
 
 ITA_the_struggle_for_anti_fascist_unity_desc:0 "The free nations of the world must be united in the struggle against fascism. It has thus been proposed that delegates from various countries around the globe be called to Rome to discuss how to move forward against fascism.\n\nSome doubt such a plan would be very effective in establishing anything concrete. However, these people don't recognize the symbolism of such an action. Such a meeting would help further the image that Italy has truly moved past its fascist past, and help show that our nation is genuinely committed to the antifascist cause. It is the first step towards getting into good relations with our fellow democracies of the world."
 
 ITA_a_plea_for_peace_desc:0 "Italy is a very important country, controlling much of the Middle East, North Africa, and dominating what remains of the Mediterranean. This position makes Italy a regional power and an important piece of global politics. This position brings great influence to Italy, but also necessitates great responsibility. Italy has used its influence in the past to promote fascism and war, something that can not continue.\n\nItaly must become a force for peace, not only in our own sphere, but abroad. We must promote our commitment to resolving conflicts diplomatically, and provide an example to the other nations of the world. Fascist aggression can't be allowed to exist if humanity wishes to survive, and only diplomacy can prevent nuclear armageddon."
 
 ITA_World_Peace_Council_desc:0 "The threat of war is too great. The fascist empires continue in their aggressive ways, and the Americans are responding just as violently. The Hawaiian Missile Crisis showed the world just how precarious this current peace really is, and the South African War proved that blood could still be spilled between the world powers. The status quo is unacceptable, and something must be done to change it.\n\nThat is why the World Peace Council must be formed. The World Peace Council will be focused upon promoting global peace, nuclear disarmament, and cooperation between nations. It shall also campaign against imperialism and wars of aggression. It shall be, at least on paper, a neutral organization, with its funding coming from Rome. The World Peace Council shall hopefully be a crucial tool for peaceful dialogue and cooperation between the major superpowers of the world."
 
 ITA_the_caffe_plan_desc:0 "Italy's economy is struggling. Our democracy has inherited many of the same problems the fascists either failed to resolve or caused themselves. Italy's economy can only be cured of its issues through the ideas of one man, and that man is Federico Caffè.\n\nA highly knowledgeable economist, Caffé has drafted up a plan to completely transform and revitalize the Italian economy. His economic plan centers around a very Keynesian model built around strong state intervention, and a powerful welfare state. This economic plan would relieve the burdens placed upon Italy's impoverished workers and lower classes, and allow the government to correct the many issues at a more systemic level"
 
 ITA_banish_unemployment_desc:0 "Italy is suffering from unacceptable levels of unemployment. It is our duty to fix this crisis, and our new economic plan shall be focusing on tackling unemployment. The IRI shall be a key tool in this endeavor.\n\nThe Institute for Industrial Reconstruction was established in 1933 under the fascist regime, and used to reorganize and rescue banks and corporations suffering from economic crisis. We will rehabilitate this institution by starting several economic ventures under the protection of the IRI. These ventures shall create plenty of jobs, and help resolve the unemployment crisis present across our country."
 
 ITA_review_monetary_policy_desc:0 "Along with the rest of the fascist economy, our monetary policy must also be reviewed and reformed. The current Lira is weak, and our economy is reliant upon foreign wealth.\n\nWe must push for a stronger Lira. This will increase the currency's purchasing power, and make our economy less dependent on foreign currency and wealth. This also helps Italy's citizens and working class, as a stronger Lira means more purchasing power for the common man. The benefits this policy will bring to the average Italian make this policy a high priority amongst our economic reforms."
 
 ITA_non_basta_produrre_desc:0 "It is not enough to simply produce. The constant effort to increase production within the Italian economy was the policy of the fascists. It was not only inefficient, but it harmed the Italian workers. A new policy must take its past.\n\nWe shall redirect the focus of our economic development from increasing production, and instead focus upon a far more important issue: inequality. Workers and employees must be given fair and equal wages for the labor they put into their industries. The wages workers used to earn are mere scraps that were quickly outpaced by the increasing costs of daily life. Better, more fair wages shall help the Italian worker remain above the poverty line, and the increased morale from this policy shall likely benefit the economy more effectively than the old ways ever could."
 
 ITA_the_swedish_model_desc:0 "Amongst the nations of Europe, Sweden is unique. It is one of the last democracies left in the continent, despite being surrounded by the Reich and its allies. Not only are they democratic, but Sweden also has quite possibly the most extensive welfare state in the world.\n\nWe must strive to emulate the Swedish, and build a similar model for our own people. Social service shall be provided publicly, we shall expand state pensions and income distribution, and labor protections shall be reinforced and strengthened. A strong social safety net shall help protect our most vulnerable populations from the adverse effects of economic shifts and instability.\n\nThe Swedish model provides a clear and obtainable synthesis of capitalist and socialist policies, and is exactly what Italy's citizens need after the decades of fascism Italy has suffered."
 
 ITA_slice_the_cake_desc:0 "All of Riccardo Lombardi's most crucial reforms have been drafted and are ready for proposal. Soon, the members of parliament shall be reading over the various changes planned for the Italian economy. If all goes well, the legislation will pass. Negotiations will have to be made, and compromises might be necessary, but the Italian economy can't continue down its current trajectory.\n\nThe ultimate goal of this new economic plan is simple: slice the cake into equal pieces instead of trying to make the cake bigger. The cake has already been baked, and we must work with what we have. Wealth and opportunity must be distributed fairly to all of Italy's citizens, and any rational, moral person would wish to see such a plan succeed."
 
 #foreign policy desc
 
 ITA_Out_With_The_Old_desc:0 "As the successors to the fascist regime of Mussolini and Ciano, we inherit the old Empire's foreign and colonial policy, which it would be an understatement to say contradicts our views in every way possible. With the new Italy will come a new foreign policy. As Europe's last major democracy and as the main counterbalance to Germany, we have a duty to uphold freedom in the grim and murky world we live in. No longer shall we prop up a system of exploiting colonies for resources and install tyrants and despots in countries in our sphere of influence in return for favorable treatment or policies - our actions will not be motivated by profit or the benefit of Italy at the expense of others; no, what is in the world's interest shall be what is in Italy's interest."
 
 ITA_the_old_continent_desc:0 "Italy may be fascism's birthplace, but Germany is where it was transformed into its far more terrible and regretfully far more influential brother - Nazism. The majority of Europe now stands under the Reich's jackboot and midnight shadow, whether through direct rule, puppet 'Reichskommissariats', or collaborationist governments.The rest of Europe is only a slither better, adhering to our fascism or other despotic forms of governance.\n\nThe light of democracy is but an ember in the continent on which it first was born; here we are liberty's last stand. Yet, even an ember can spark a blaze. We shall make good use of our influence and power through reigniting that flame and spreading the virtues of freedom and equality everywhere we can."
 
 ITA_the_old_empire_desc:0 "For far too long, the name 'Italy' has been uttered in Africa and the Middle East with disgust and fear. Stories of exploitation, abuse, and oppression have been passed on between generations under the fascist regime which preceded us. Now, we can finally begin the arduous task of righting the past's wrongs and transforming our foreign policy towards our colonial holdings through gradual decolonization and self-determination for natives.\n\nIt will not be enough to repay for our predecessors' crimes and vindicate us in the eyes of the oppressed - perhaps nothing will ever be enough. But we must still cast aside the legacy of fascism and imperialism regardless, and move decisively towards a brighter future for our soon-to-be former colonies and their peoples."
 
 ITA_decry_german_imperialism_desc:0 "How many millions have died in camps and prisons for the crime of being of an ethnicity Hitler named inferior? How many millions of innocent civilians and brave soldiers and partisans have perished in the good fight against the Wehrmacht and the Orpo? How many millions more continue to toil as slaves now and are exploited for every bit of labor and worth by their Nazi overlords?\n\nItaly envisages a world freed of this stain on humanity, a world peaceful, united, and democratic. Germany has only one vision: a world subservient to itself by carrot or by chain. All free men and women of Europe: fight for your future! Resist Germany!"
 
 ITA_sharing_is_caring_desc:0 "Our predecessors chained weaker and lesser nations to Rome through one-sided deals, threats and coercion, and corruption, essentially turning them from independent states to servants of Italy and being at fascism's beck and call. This is an injustice, and we cannot allow it to continue.\n\nA program of economic aid and investment into smaller countries within our sphere will commence, reverting the damages of fascism and making amends with the newly freed peoples of Europe. In this system's place, we will create a more equal alliance - one worth being called a true alliance, and not just an Italian hegemony."
 
 ITA_winds_of_ventotene_desc:0 "The island of Ventotene, used by the fascist regime as a political prison to jail and break the brave men and women who spoke out and fought against their tyranny, has in an ironic twist become the spawning place of countless ideas and conceptions of anti-fascism and liberty in Europe.\n\nThe most famous of these theories is the Ventotene Manifesto, a declaration of support for a united, socialist, and free Europe written by communist Altiero Spinelli. While we will not be able to deliver on his lofty dreams of a united continent in our lifetimes, perhaps we could draw from his manifesto and lay the stepping stones for our successors to carve for themselves a better world and a better Europe."
 
 ITA_review_investment_plans_desc:0 "The fascist regime's foreign policy involved heavy investment into military projects in its client states and sphere of influence as well as into infrastructure projects to exploit the resources of those countries in its grasp, seeing fellow nations as mere sources of labor or goods to fuel Rome's needs. Not only is this obviously immoral, but this attitude is also unsustainable and pragmatically ineffective - it treats the world as a zero-sum game where Italy's natural interest is to take as much as she can from others, where, in reality, both Italy and the exploited nations can in the long term prosper and grow through investments into the economy and other sustainable pursuits, arguably more so than through the previous model."
 
 ITA_remove_segregationist_barriers_desc:0 "There exist many great barriers to equity that the fascist regime put in place to ensure the persecution of non-Italians within Italy and the wider colonial empire. Our brothers in Africa and the Middle East suffer under laws put in place to keep them under the fascist boot, and now we have the power to remove these barriers.\n\nGoing forward we will remove these barriers put upon them by the old regime. Non-Italians in the colonial states will be granted the same rights as those enjoyed by the Italian population and will be free to pursue whatever path they wish. We shall rescind the laws against mixed-race marriages and do away with both racial segregation along with the Leggi Razziali itself. It is high time that the people of Italy and its colonies were freed from the bile of the fascist regime."
 
 ITA_push_for_democratic_reforms_desc:0 "While it is true that we have been able to restore a functioning democracy in Italy, we find that many of our European neighbors are unable to similarly beat the odds. Decades of German domination over the continent have left democratic traditions in shambles, with many European nations being ruled by autocratic strongmen instead of publicly elected leaders.\n\nOver the years, many nations have come to align with us over Germania. We will use our influence over the nations within our sphere, pushing them to introduce democratic reforms. We will spit in Germania's eye, and will once more prove that democracy triumphs over all."
 
 ITA_soldiers_of_peace_desc:0 "It is no secret that Italy is relatively well off. While the recession of the fifties hit us alongside all of Europe, we have managed to mostly recover, being able to compete with the world at large. Our colonies, however, alongside the many states that reside within our sphere, often find themselves struggling to stay afloat, and find their economies falling behind in the modern era.\n\nWe will utilize the wealth of our nation to send crews of civil engineers, humanitarian workers and agricultural experts to our colonies and lesser off allies. There, these soldiers of peace will assist with local development efforts, bringing the agricultural and industrial centers up to par with the modern world."
 
 ITA_incentives_to_repatriation_desc:0 "Ever since the establishment of our East African colonies in the late XIXth century, many of our compatriots have gone to make a new home for themselves and their offspring in our overseas possessions, resulting in a non-negligible amount of Italian communities sprawling across East Africa.\n\nNaturally, this has caused unrest amongst the local populations. The right thing to do would be to repatriate our citizens, yet it shan't be an easy task: these people have been living on these lands for decades now, considering it as their home. If we want them to come back, we'll have to incentivize them with monetary compensation."
 
 ITA_introduce_democratic_self_government_desc:0 "The democratization process of Italy has now been underway for quite some time, the sins of our forefathers corrected. Yet it doesn't stop here: though our compatriots at home may now enjoy unalienable rights, the same cannot be said for the downtrodden natives in our colonies.\n\nIf we are to undo - or at least, alleviate all the wrongs committed in the name of Italian imperialism, the right to be represented by democratically elected officials has to be granted to the natives, leaving none of our subjects left behind in the world of tomorrow."
 
 ITA_preferential_treatments_desc:0 "While we have made the same offer to all those who listen: join us in the fight for democracy, not all have taken up the battlecry with the same fervor. Too many only offer lip service as appeasement to us, making endless promises of reforms that never see the light of day. Others enact only the slightest of reforms, enough only to get us off their backs.\n\nTo those few who offer us their most earnest attempts at democratic reform, we shall offer what rewards we can. Preferential terms in negotiations shall be granted to those willing to seriously pursue a democratic agenda. Beneficial trade deals shall similarly be offered; we're willing to take a slight loss if democracy can be achieved. By displaying our magnanimity to those willing to let the people speak, we hope to guide those less willing towards true, representative democracy."
 
 ITA_colonialisms_final_hours_desc:0 "The challenge of our former empire is one of the most pressing and serious facing Italy. Decolonization in Sub-Saharan Africa promises to be an arduous and thorny process with pitfalls and traps aplenty awaiting us. Colonialism has left deep scars in the region, and the natives have little reason to trust our good intentions, having been hurt and betrayed far too many times. Nevertheless, justice demands that we make the effort and undo the Gordian knot of Italian colonialism in the Horn of Africa.\n\nIn the first steps of this long process, we shall begin meeting with local leaders, attempting to work out an acceptable political settlement for post-Imperial Africa. We shall also begin sketching out potential divisions of the former-imperial territory for independent African states. The road to decolonization is long, but we shall walk it without complaint."
 
 ITA_the_fruits_of_cooperation_desc:0 "It is well known that people working together are more effective than people working appart. It is a well documented fact: two is greater than one. The more people you have working together towards a common goal, the more effective one shall be in reaching it. This is fact, indisputable and immutable.\n\nThe principles of working together can further be scaled up to the national and international levels. We shall create a propaganda campaign directed at our allies and the rest of the world: it is better to work together than apart. Surely cooperation will bring peace and prosperity to our nations and the world at large; it is a goal that we should strive for with all of our might."
 
 ITA_from_an_empire_into_a_community_desc:0 "The word "empire" was used aptly to describe the old Italy. We lorded over our colonial possessions and supposed allies, treating their people not as citizens and fellow humans but as subjects, and acted selfishly and only in the supposed interests of Rome and Italy proper. It was in no way different from any other colonial empire, be it the British or the French during the 19th century or even the Germans now to an extent.\n\nNow, though, we can proudly call ourselves an empire no longer. We are now a community of independent states. The nations of our sphere of influence have been set free from the chains of exploitation and Italian dominance, our colonies are slowly gaining autonomy and independence through our policies of decolonization, and where Nazi oppression and the fascist autocracy once cast their shadows, democracy shines in the Mediterranean, in Europe, and beyond once more."
 
 ITA_in_with_the_new_desc:0 "The collapse of the fascist regime is ushering in the beginning of a new world for the former Italian empire. The twin monsters of imperialism and colonialism are being banished from the Italosphere, greatly improving the lives of the many former colonial subjects previously crushed under the monstrous edifice of the Italian empire. We should not grow overconfident however. Though banished, the shadows of the twin monsters still hang over some sections of the former Italian empire. Not only do we have much damage to repair and wrongs to right, but new and unknown challenges no doubt await us. Italy, with its new commitment to international justice and peace, shall do what it can to advance the new order."
 
 ITA_comitato_permanente_per_la_pace_desc:0 "Italy has in the past fought many wars, all of which came at great cost to the Italian people as well as our unfortunate neighbors. In order to avoid any future conflicts and prevent further suffering, we shall establish the Comitato Permanente per la Pace (Permanent Committee for Peace). This will be an international diplomatic body composed of representatives from the many Italosphere countries and provide a peaceful avenue to resolve territorial conflicts and other disputes that might arise. Rather than allow conflicts to fester, or solve them with military force, we shall establish permanent peace via international diplomatic cooperation."
 
