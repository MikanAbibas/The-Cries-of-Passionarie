 ITA_POP_GUI_Promise_19:0 "Reassure the Government"
 ITA_POP_GUI_Promise_19_Effect:0 "Several Gerarchi hold important positions within the machine of the State, both at Ministerial level and within the larger administration. Reassuring them that we won't endanger their careers will surely bring some of them to our side, though it might anger the more radical elements within the Council.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMinistri§! by §G10%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LBurocrati§! by §G5%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §R-5%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMilitaristi§! by §R-2%§!"
 ITA_POP_GUI_Promise_20:0 "Reassure the Corporations"
 ITA_POP_GUI_Promise_20_Effect:0 "Several Gerarchi have ties to the IRI and other large businesses, known for their love of protectionist measures and stability. Reassuring them that we won't threaten their hold over the economy for the time being will surely bring some of them to our cause, though it might anger the bureaucracy in turn.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LCorporazioni§! by §G10%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §G5%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMinistri§! by §R-5%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LBurocrati§! by §R-2%§!"
 ITA_POP_GUI_Promise_21:0 "Reassure the Armed Forces"
 ITA_POP_GUI_Promise_21_Effect:0 "Several Gerarchi have ties to the MVSN and the Army, known for their support for expansive armament programs. Reassuring them that we will keep the Italian armed forces large and powerful will surely bring some of them to our cause, though it might anger the corporations, ever fearful of instability and armed conflicts.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMilitaristi§! by §G10%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §G5%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LCorporazioni§! by §R-5%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §R-2%§!"
 ITA_POP_GUI_Promise_22:0 "Curtail the Paramilitaries"
 ITA_POP_GUI_Promise_22_Effect:0 "Several Gerarchi have grown distrustful of the excessive power held by the Blackshirts and the OVRA. While such organisations remain vital for fascism, it is true that the leaders of those organisations have often used their powers to remove perceived rivals: promising to remove part of the extraordinary powers the MVSN and the OVRA hold will surely endear ourselves to the more moderate parts of the Council and to the armed forces, who resent the excessive role of the MVSN in military matters, though it will surely be met with opposition from the organisations themselves and those who represent them.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LBurocrati§! by §G15%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMinistri§! by §G5%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMilitaristi§! by §G5%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §R-15%§!"
 ITA_POP_GUI_Promise_23:0 "Massive Economic Investments"
 ITA_POP_GUI_Promise_23_Effect:0 "The Italian economy has been sluggish since the end of the last war, and the Atlantropa disaster and the collapse of the Triumvirate only added to its ailing situation. Italo Balbo believes that the only way for the Italian Empire to prosper is to kickstart the economy with massive public investments: letting the Council know of this intention will surely pick the interest of the Corporatisti, though the more military-minded Gerarchi might resent the excessive focus on the economy.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LCorporazioni§! by §G15%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §G5%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMilitaristi§! by §R-5%§!"
 ITA_POP_GUI_Promise_24:0 "Protect Stability"
 ITA_POP_GUI_Promise_24_Effect:0 "For years, the Empire has been plagued by unrest and instability due to Ciano's incompetence and cowardice. Italo Balbo knows that peace and stability are vital to the Empire's recovery, and will let the Council know that pacification of the colonies and diplomatic advances will be key parts of his agenda: this will of course endear him to the Gerarchi more tied to the colonial administration and the military, as they are often the first victims of terrorist attacks and guerrillas, though the Corporations might see this as a threat to their monopoly over colonial work.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LBurocrati§! by §G10%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMilitaristi§! by §G10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LCorporazioni§! by §R-10%§!"
 ITA_POP_GUI_Promise_25:0 "Strengthen the Armed Forces"
 ITA_POP_GUI_Promise_25_Effect:0 "Ettore Muti knows the plight of the members of the armed forces, as they have been neglected for years due to Ciano's budget cuts and the High Command's corruption and incompetence. He has every intention of restoring the Italian army to greatness, and to streamline the MVSN so that they can properly support the other units: this will surely sway several military-minded members of the Council, though it may enrage those who fear a renewed militaristic approach to diplomacy.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMilitaristi§! by §G25%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §G10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LCorporazioni§! by §R-10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §R-5%§!"
 ITA_POP_GUI_Promise_26:0 "Overhaul the Economy"
 ITA_POP_GUI_Promise_26_Effect:0 "Ettore Muti has a vision for the Italian economy, one where the state directs and controls most aspects of production and exchange of goods and services, while still leaving space for privately-owned enterprises to thrive. Such a vision will of course find eager ears in the government and bureaucracy, while it may anger the Corporations which may find their power and influence curtailed by new State agencies.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMinistri§! by §G15%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LBurocrati§! by §G10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LCorporazioni§! by §R-10%§!"
 ITA_POP_GUI_Promise_27:0 "Enshrine the Manifest of Sansepolcro"
 ITA_POP_GUI_Promise_27_Effect:0 "Fascism was founded in 1919 as the Fasci di Combattimento, and based on the Manifest of Sansepolcro, a political document enshrining its programmed reforms. With time, the Manifest was sidelined and forgotten by the establishment for its radicalism, but many remain, especially in the MVSN, who still remember it, and wish for its reforms to come to life: revealing Muti's project will surely gain much favor from them, though it might meet the opposition of the more conservative elements.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §G25%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §R-10%§!"
 ITA_POP_GUI_Promise_28:0 "Strengthen Fascist Institutions"
 ITA_POP_GUI_Promise_28_Effect:0 "As of now, the Italian government is an awkward hybrid between the Albertine Statute and the fascist reforms. This system cannot hold forever, and Niccolò Giani has every intention of imposing fascist dominance over the institutions: this will surely garner favour among the more radical Gerarchi in the government and the paramilitaries, though it might estrange from us the more moderate ones, especially those who represent the bureaucrats who might lose their positions.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §G25%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMinistri§! by §G10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LBurocrati§! by §R-10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §R-5%§!"
 ITA_POP_GUI_Promise_29:0 "Fulfill Mussolini's Vision"
 ITA_POP_GUI_Promise_29_Effect:0 "Mussolini had a vision for the Empire, one where the Italian people would rule supreme over a reborn Roman Empire spanning multiple continents. His dream may have been hindered by people such as Ciano, but Niccolò Giani will finally fulfill it in its entirety: this will surely please the more radical Gerarchi, though it might alienate the more moderate ones.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §G30%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §R-10%§!"
 ITA_POP_GUI_Promise_30:0 "Resume Italianization of the Colonies"
 ITA_POP_GUI_Promise_30_Effect:0 "The Italian Empire will only be truly such when it is inhabited by Italians across its entire extension. Niccolò Giani wishes for this to become reality, and will immediately resume the immigration policies abandoned by Ciano due to lack of funds: this will surely please the colonial bureaucracy and the corporations, thought the military might fear renewed unrest and its consequences on the garrisons.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LBurocrati§! by §G15%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LCorporazioni§! by §G15%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMilitaristi§! by §R-10%§!"
 ITA_POP_GUI_Promise_31:0 "End Anarchy"
 ITA_POP_GUI_Promise_31_Effect:0 "The Italian Empire is gripped by unrest and anarchy due to the coward policies enacted by Ciano. Alessandro Pavolini will see that Order is restored, no matter the difficulties, no matter the cost: such intransigence will surely please the armed forces and the Blackshirts, though it will be seen with fear by the more moderates among the Gerarchi.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §G25%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMilitaristi§! by §G10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §R-10%§!"
 ITA_POP_GUI_Promise_32:0 "Expand the OVRA"
 ITA_POP_GUI_Promise_32_Effect:0 "Traitors hide everywhere, from the Reds infesting Northern Italy's Industrial Triangle, to the natives resisting our rule in Ethiopia. Alessandro Pavolini will see their treachery ended, and the best instrument to achieve this is the OVRA: expanding the fascist secret police will allow us to monitor all the treacherous elements within the Empire, something that will surely please the more radical Gerarchi in the government and the Blackshirts, though the moderates might see this as a descent towards instability.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMVSN§! by §G15%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMinistri§! by §G10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LModerati§! by §R-10%§!"
 ITA_POP_GUI_Promise_33:0 "Bring the Economy Under Control"
 ITA_POP_GUI_Promise_33_Effect:0 "Alessandro Pavolini wishes for the economy to answer only to the State and its needs, and not to the whims of Kleptocrats and magnates. The promise to bring the economy under full State control will surely please the government and the bureaucracy, though it might estrange the Corporations from us.\n--------------\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LMinistri§! by §G15%§!\nIncrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LBurocrati§! by §G10%§!\nDecrease [Get_ITA_GCF_GUI_current_ruling_duce_possesive] influence of §LCorporazioni§! by §R-10%§!"
 ITA_POP_GUI_Promise_34:0 "Bribe State Gerarchi"
 ITA_POP_GUI_Promise_34_Effect:0 "Sometimes, one must grease the cogs of the State machine if they want to achieve something. Granting benefits and outright bribes to money-starved or greedy Gerarchi will surely help us get into their graces: surely, they will remember their benefactors at the moment of the final vote...\n--------------\nFor the rest of this session:\n  §G1%§! weekly §LMinistri§! support for [Get_ITA_GCF_GUI_current_ruling_duce]\n  §G1%§! weekly §LBurocrati§! support for [Get_ITA_GCF_GUI_current_ruling_duce]"
 ITA_POP_GUI_Promise_35:0 "Bribe Corporations"
 ITA_POP_GUI_Promise_35_Effect:0 "The economy often runs on personal favours and "gifts" to people who know people who will get you a contract. Many Gerarchi aligned with the corporations have assimilated these methods into their own political activity: surely, they will remember their benefactors at the moment of the final vote...\n--------------\nFor the rest of this session:\n  §G1%§! weekly §LCorporazioni§! support for [Get_ITA_GCF_GUI_current_ruling_duce]\n  §G1%§! weekly §LModerati§! support for [Get_ITA_GCF_GUI_current_ruling_duce]"
 ITA_POP_GUI_Promise_36:0 "Millitary Bribes"
 ITA_POP_GUI_Promise_36_Effect:0 "It is everyone's secret that many soldiers and officers fight not for glory or duty, but for money. Surely, some of their favoured Gerarchi will be ready to fight as mercenary for us in the coming struggle: with enough money lining their pockets, we won't need their loyalty at the moment of the final vote...\n--------------\nFor the rest of this session:\n  §G1%§! weekly §LMVSN§! support for [Get_ITA_GCF_GUI_current_ruling_duce]\n  §G1%§! weekly §LMilitaristi§! support for [Get_ITA_GCF_GUI_current_ruling_duce]"
