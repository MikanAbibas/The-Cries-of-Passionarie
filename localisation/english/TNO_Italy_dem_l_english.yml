 ###=====| a) Transition Tree/Ciano Victory |=====###
 
 ITA_picking_up_the_pieces:0 "Picking Up the Pieces"
 ITA_picking_up_the_pieces_desc:0 "Galeazzo Ciano has fought many battles, political or otherwise - yet none could hope to compare to the devastating internal war that was the Verona Congress. The entire coalition that had formed against Ciano was strong; but he was stronger.\n\nBattered and bruised, the Duce has nevertheless exited the fires of the Verona Congress victorious. The Quadrumvirate lays in ruins, the Communist spark dimmed. Although Ciano may have fought off the immediate threat, but the core of his power has turned into pillars of sand - the Party remains divided, the already-disfigured economy continues to plummet into the abyss, and the popular abyss that formed in the wake of the crisis continues to grow.\n\nThe Duce has won this battle, yes, but now we must reconnect the shattered pieces that Italy has become - lest it once again fall into yet worse chaos."
 
 ITA_purge_the_remnants:0 "Purge the Remnants"
 ITA_purge_the_remnants_desc:0 "Although the Quadrumvirate has been scattered to the wind - the ringleaders disposed of - their lingering venoms remain. The supporters of the anti-Ciano coalition continue to fester within ever the highest level of the government, working against the Duce at every step. The remedy to this issue is simple: they must be cut out of the Party as the tumor they are. we may afford no reservation, no solace, no uncertainty. For us to truly recover from the potentially lethal scheming of those who had wished to see Italy once again burn, they must be cleansed, no matter the potential cost.\n\nUnfortunately, these very same suspected officials also happen to consist of a significant portion of the very core of the Party's structure - this will no doubt be a painful blow to the PNF."
 
 ITA_plug_the_leaks:0 "Plug the Leaks"
 ITA_plug_the_leaks_desc:0 "News of the rapidly-deteriorating situation in the Party has readily begun to slowly leak out of the hushed whispers of the remaining officials in the PNF.\n\nAlthough our State media would never acknowledge such a travesty, the rapidly-spreading underground networks of information have carried the news far and wide across Italy.\n\nFor the continued stability and security of the Kingdom, any suspected informants to these dangerous Bolshevist organizations will be likewise disposed of - regardless of their skill, loyalty, or tenure. No leaks will be tolerated in this new Italy, and we shall enforce that provision by any means necessary.\n\nAs for the information networks themselves, silencing and destroying their wide-reaching webs shall be prioritized by the OVRA - their leaders shall be round up, and disposed of. The government shall return to what it has always aspired to be - an entirely closed system. "
 
 ITA_summon_the_spectre:0 "Summon the Spectre"
 ITA_summon_the_spectre_desc:0 "In difficult times such as these, it comes as no surprise that the Communist threat has been able to make inroads to the countless individuals of Italy suffering under the economic crash. Citizens, once reasonably turned off by the radicalism of the unknown, now flock to such dangerous ideas such as the despicable ramblings of Bolshevism.\n\nA new series of propaganda efforts shall be started by the government; emphasizing the Communist threat to every unsure Catholic we can get our message to. The question is simple: either one supports the Duce, or they support the godless heathens preaching of the disgusting rhetoric of Marx!"
 
 ITA_find_more_yesmen:0 "Find More Yes-Men"
 ITA_find_more_yesmen_desc:0 "As expected, the eradication of Italy's fifth column has torn a significant gash in the operational integrity of the Party.\n\nThe sheer size of the purge has left a yet more malignant wound, however; in many cases, it's been found that there simply aren't enough of figures aligned with the Duce that are competent or capable enough to effectively serve in the vast magnitude of newly-emptied seats. This is certainly a state of affairs that cannot go on - in an explicitly temporary measure, we will nominate any faithful followers of the Duce to the vast number of vacant chairs in Italy, no matter their skill.\n\nThe quintessential definition of scraping the barrel, yes, but there is merely no other option. No question about it, this will continue to damage the already-bruised governmental structure of Italy, but the alternative - a truly empty government - is worse yet."
 
 ITA_moderate_concessions:0 "Moderate Concessions"
 ITA_moderate_concessions_desc:0 "As much as the Duce hates to admit, it is a quite obvious conclusion that continuing on our current policy course is simply an impossible path.\n\nFor the ever-growing crowds of dissent to be at least somewhat placated, we will unfortunately be forced to make some minor concessions to the mob. Some long-standing Fascist laws, such as statute restricting freedom of the press and movement, will be somewhat relaxed in the wake of the increasing chaos.\n\nUnderstandably, this may cause yet more chaos to arrive from our perceived weakness in the face of the protesting populace, but the Duce sees no other option to even temporarily alleviate the horrifying plummet of public trust in the Fascist government - and by extension, Fascism."
 
 ITA_make_examples:0 "Make Examples"
 ITA_make_examples_desc:0 "Our jails are filled with partisans, bolsheviks and all sorts of malcontents who contribute nothing to our glorious Empire and are a burden on the economy. With a few public executions we will show those terrorists who are really in charge of the country, and we will shore up popular support among the populace. Being tough on crime is the only way to keep the country safe, no matter what those liberal sissies have to say about that!"
 
 ITA_the_kings_demands:0 "The King's Demands"
 ITA_the_kings_demands_desc:0 "His Royal Majesty King Umberto II has requested Duce Ciano's presence at the Quirinale to discuss about certain developments that followed the Verona Congress, and apparently He will ask the Duce explanations about the plans to contrast the protest. Duce Ciano will make sure that the King has nothing to worry about: the strong and proud fascist troops are waiting for the Duce's orders to make Italy safe and peaceful for all Italians, nothing can stand against the PNF!"
 
 ITA_show_of_strength:0 "A Show of Strength"
 ITA_show_of_strength_desc:0 "Our recent policies of stabilizing the Empire have proven ineffectual at best and have only riled up the masses even more. People are beginning to question if we'll make it through this debacle and we need to show them we're still in control! So, what to do? Every day, it seems more and more Liberal protesting and Communist striking breaks out across Italy, so perhaps it would be worth it to give them a taste of their own medicine? We'll begin organizing a rally of our own, one to put all others to shame to show our limitless support, just like the good old days! Of course, we'll be including some of our own men in the crowd, both to encourage greater numbers within the crowds, as well as to ensure the safety of the rally. Everyone will know of the strength and faith in Il Duce, for if we don't act now, nobody will."
 
 ITA_il_silenzio_di_mille_lavoratori:0 "Il Silenzio di Mille Lavoratori"
 ITA_il_silenzio_di_mille_lavoratori_desc:0 "The workingmen of Italy have marked themselves as traitors! Across the country, our control slips as thousands of strikes leave factories empty and plazas blazing with activity. Most demand higher wages and better conditions, while some use the strikes as a front to demand loosening of our policies, and others even dare adhere to the accursed ideology of Bolshevism, calling for a revolution. Disgraceful! We must put an end to such unruliness. We have had enough with appeasement and concessions. A lesson must be taught so the workers will not repeat this mistake. Send in the blackshirts!"
 
 ITA_trouble_in_the_countryside:0 "Trouble in the Countryside"
 ITA_trouble_in_the_countryside_desc:0 "Unrest against Fascist rule has come to a head. In the more remote and agricultural regions of the Empire, raids and attacks against symbols of government power, most prominently PNF offices, have become bolder and bolder. The opposition to PNF rule in these provinces was once splintered and in a thousand pieces due to factionalism and differences in objectives; this is no longer the case.\n\nThe rebels have nearly overnight unified into a seemingly powerful front, likely due to our vulnerable state. This could be mortally dangerous - each cell of this resistance must be uprooted and eliminated before they can spread, with all the force we can muster."
 
 ITA_another_manifesto:0 "Another Manifesto of Fascist Intellectuals"
 ITA_another_manifesto_desc:0 "The world has changed a lot in these four decades, and so fascism must change too, to reflect the new zeitgeist. For this reason, the PNF will soon release the second edition of the Manifesto of Fascist Intellectuals, marking forty years since its first version. It is still penned by professor Gentile, the original writer of the first Manifesto, and will be signed by over 500 academics, scientists, and authors, from every part of the Empire, to represent the overwhelming support for fascism and Duce Ciano."
 
 ITA_reinforce_segregation_policies:0 "Reinforce Segregation Policies"
 ITA_reinforce_segregation_policies_desc:0 "For far too long, those who are not truly Italian have been allowed too much freedom in our great nation. The Leggi Razziali, first implemented by Mussolini in 1938, kept our nation free from degeneracy and kept our citizens from getting caught up in these impure activities. However, as the years have gone by, enforcement of these laws have fallen to the wayside. Now, communists, liberals, and even a few in the party itself voice their disapproval of what they believe are "outdated" and "harmful" laws.\n\nOur continued mandate from our victory in Verona will allow us to begin stricter enforcement of the Leggi Razziali. Non-Italians will be reminded of their place. And those who dare stand with them will be shown theirs."
 
 ITA_promise_tax_cuts:0 "Promise Tax Cuts"
 ITA_promise_tax_cuts_desc:0 "What's the deal with all of this unrest? Shouldn't the continued rule of Ciano, be enough to sate the masses? Perhaps the people are more restless than we thought.\n\nPerhaps their disapproval isn't with Ciano, maybe they feel their economic concerns were ignored in Verona. We'll promise them a tax cut then. That will do nicely. Everybody loves a tax cut. This will quiet them down."
 
 ITA_reassure_the_military:0 "Reassure the Military"
 ITA_reassure_the_military_desc:0 "...And now the generals are worried. Normally, we'd take the generals at their word. They're supposed to be above petty politics and spreading rumors. But now, they come to us, telling Ciano himself that his actions have greatly destabilized the country, among other outrageous claims.\n\nWhile we appreciate their concern about the minor unrest we're facing, their efforts are better spent worrying about the next Greek uprising, or the next partisan raid in Algeria. Not spent on exaggerating our current problems."
 
 ITA_tumbling_down:0 "Tumbling Down"
 ITA_tumbling_down_desc:0 "This is unacceptable. First, King voices his disapproval. Then, the people riot in the streets. Next came the generals, shirking from their rightful duty to protect our country, to meddle in politics. Now, some of Ciano's closest advisors, some being with him as early as the March on Rome, are throwing him under the bus.\n\nEven with the betrayal of those closest to him, Ciano stands undaunted. The King will be convinced of our ability to govern. The people will be sated once they experience the peace and stability we will bring. The generals will turn their noses back towards more pressing matters. Those who betrayed Ciano in his darkest hours will be dealt with!"
 
 ITA_victory_has_a_thousand_fathers:0 "Victory Has a Thousand Fathers..."
 ITA_victory_has_a_thousand_fathers_desc:0 "Ciano's victory at Verona has so far been bittersweet: an internal crisis in the PNF, strikes across the country and the ever so rising dissent evolving in full blown violence were his rewards for winning. His advisors have now abandoned him, leaving him vulnerable. Yet he still holds a sliver of hope that things will get better.\n\nA hope soon to be crushed, as everything crumbles around Ciano, Umberto requests a meeting one last time. There, the king delivers the death blow: Ciano is to resign of his own volition, lest the country falls apart."
 
 ITA_but_defeat_is_an_orphan:0 "..But Defeat is an Orphan"
 ITA_but_defeat_is_an_orphan_desc:0 "There stood Ciano, Mussolini's successor, the victor of Verona, the Duce, powerless. He had now been abandoned by all: the PNF, his advisors, and most importantly, by the King. The Empire now stands at an edge, wracked with strife tearing it apart from inside, the Duce's hopes of stabilising this mess are now gone and only a deluded man could fool himself into thinking this situation is salvageable.\n\nAt the end of his rope and seeing the writings on the wall, Ciano complies with the King's request, handing his resignation before leaving Italy for good, a hollow shell of the man he once was."

 ###=====| b) National Unity Government Tree |=====###

 ITA_National_Unity:0 "The Government of National Unity"

 ITA_the_easy_part:0 "The Easy Part"
 ITA_the_easy_part_desc:0 "For twenty years, we have waited, and prepared. In an infinite chessboard of danger and deceit, we have moved ourselves - fragile pawns in a bloody game of power - hoping to win against all odds: there was no place for sorrow, no time to think the next move.\n\nHowever, through this ordeal, we have found our protector. Umberto II, King of Italy, has shielded us in his own bid to destroy fascism, moving us with steady hand and far-sighted vision: cunning and patient, he finally outplayed Ciano and his cronies, and has now ordered the Regio Esercito to secure Rome and disband the Grand Council of Fascism, effectively assuming ad-interim authority as Head of Government.\n\nParadoxical as it might seem, though, now comes the difficult part. We may have destroyed fascism, but we still have a country to rebuild: brick by brick, stone by stone, we will shine anew!"

 ITA_speak_to_the_generals:0 "Speak to the Generals"
 ITA_speak_to_the_generals_desc:0 "The Regio Esercito is known for his steadfast loyalty to the King. For decades, they have resisted all attempts by the fascists to subdue them or replace them with their corrupt militias, enduring humiliations and hardships: now, the time for their long-awaited revenge has come.\n\nEager to restore normalcy in the relationship between political power and armed forces, the High Command has declared its full support to the King. While mostly a rhetorical statement, this is nonetheless a much-needed step in the restoration of our country: the armed forces will be instrumental in keeping order in the street while the rest of the administration and law enforcement is purged of fascist influence."
 
 ITA_speak_to_the_people:0 "Speak to the People"
 ITA_speak_to_the_people_desc:0 "The citizens of Italy - lifeblood of the Kingdom - are afraid. While most of them hated the fascist government as much as we did, they are nonetheless worried of what the future will bring now that it is gone: if we are to restore normalcy, then we need to reassure them that they will not be left alone in these troubled times.\n\nWhen all else fails, a legitimate sovereign is the last resort for his people. Umberto II knows this well, and will fulfill his role as demanded by the Statute approved by his wise ancestor: by radio and newspaper, by television and poster, the King will reach to the people, and provide them an anchor in troubled waters, while the storm rages."
 
 ITA_curfews_and_patrols:0 "Curfews and Patrols"
 ITA_curfews_and_patrols_desc:0 "With the Blackshirts being a staple of "law keeping" during the dictatorship, it is no wonder that the streets are unsafe with them gone. Reforming the civilian police into an effective force will take time: in the meanwhile, we need someone to protect the citizens of the Kingdom from petty criminals and terrorists alike.\n\nFortunately, we have the perfect instrument for this. The Carabinieri, a military police force, have remained loyal across the decades and are eager to take back their place from the violent mob that had threatened to replace them: armed patrols with both Carabinieri and regular soldiers will scour the countryside and hold vital locations in the cities, both protecting the people and taking away all hope the fascists might have to retake power by violence."
 
 ITA_emergency_martial_law:0 "Emergency Martial Law"
 ITA_emergency_martial_law_desc:0 "In conjunction with the militarization of the roads, we need to take steps to ensure the stabilization of the realm during this transition period. The civilian administration is buckling under the weight of the purges, and already the judiciary and several ministries are showing signs of imminent collapse: we must prevent a breakdown at all costs!\n\nWhile sad, martial law is the only solution at our disposal. Fascists will surely try to disrupt the transition, and the temporary suspension of civil rights will give the Carabinieri and Regio Esercito the legal authority to intervene as needed: the decree is already on the King's desk, and he understands his duties perfectly."
 
 ITA_disarm_the_blackshirts:0 "Disarm the Blackshirts"
 ITA_disarm_the_blackshirts_desc:0 "For decades, the Milizia Volontaria per la Sicurezza Nazionale - the Blackshirts - have terrorized the people of the Kingdom. Seeking to impose their perverted vision of "order" and "discipline" they are a serious and immediate threat to the stability of the realm: they must be stopped before they can reorganize and strike against the provisional cabinet!\n\nFascism came to power because the government was too afraid to take the necessary measures to counter the Blackshirts as they marched on Rome. We shall not make the same mistake: the MVSN will be formally disbanded, and all members ordered to surrender themselves and their weapon, with amnesty for those who will comply, while the others will be declared terrorists - and dealt with the same way they dealt with their opposers..."
 
 ITA_the_hard_part:0 "The Hard Part"
 ITA_the_hard_part_desc:0 "With the fascist government dissolved, and its bodies and organs forcibly excised from the fabric of our country like the cancer they were, now comes the hard part. The people wish for a return to normalcy - a return to democracy - and the King is more than willing to grant all Italians their wishes: for this to happen, however, the final part of his plan must be enacted.\n\nThe current Parliament is a mockery of the august body it is supposed to be. The original assembly dictated by the Albertine Statute has been transformed into an abomination: the Camera is a hub of fascist sycophants and boot-lickers, while the Senate has been turned a powerless rubber-stamper, and for a new Italy to rise, they must be dissolved, and rebuilt anew."
 
 ITA_bureaucratic_restructuring:0 "Bureaucratic Restructuring"
 ITA_bureaucratic_restructuring_desc:0 "While we have already abolished most of the fundamental fascist organs, several minor appendages remain deeply embedded within the fabric of our nation. Offices, commissions and committees stacked with fascist bureaucrats will be a liability in the long term: if we are to inaugurate a new era for our administration, then we need to mop up these remnants.\n\nTo this end, a sweeping array of decrees already await the King's promulgation. Whatever remains of the fascist regime will be - depending on its potential usefulness - either abolished, drastically reduced or fused: while we are not so partisan as to say that fascistm never did anything good, we also need to ensure that its heritage doesn't bog us down..."
 
 ITA_end_autarky:0 "End Autarky"
 ITA_end_autarky_desc:0 "The greatest among the economic battles of the fascist era, autarky hoped to turn Italy into a self-sufficient country capable of producing everything that might be needed, from the pin to the ocean cruiser. To prevent hostile acquisition from foreign firms, hefty custom tariffs, the IRI's intervention and a deflative policy for the Lira ensured that no foreign goods would find their place on the shelves of Italy's shops: of course, this ended up a disaster for our economy.\n\nIt doesn't take an expert to know that no country can truly be self-sufficient, limitations to international trade will destroy service economy, and excessive state intervention in the economy will only result in a bloated budget and public debt. The time has come to end autarky: slowly but steadily, tariffs will be lowered, the IRI's budget will be brought to a normal dimension, and the Lira will be allowed to float, so that our economy may start its recovery from Atlantropa - and from fascism."
 
 ITA_reaffirm_the_independence_of_the_armed_forces:0 "Reaffirm the Independence of the Armed Forces"
 ITA_reaffirm_the_independence_of_the_armed_forces_desc:0 "For decades, the fascist regime has tried to infiltrate and subdue the armed forces of the Kingdom. The Regia Aeronautica was the domain of Balbo, Muti and their ilk, while the Regia Marina has been severely damaged by Borghese and his clique of fascist naval officers: while still independent, the Regio Esercito and the Carabinieri have nonetheless been subjected to a campaign of constant purges and challenges by the fascist militias.\n\nThe time has come to restore normalcy. If we want to reform the Italian armed forces into a strong, modern and effective body, then the first step we need to take is the complete eradication of political influence from the ranks of its various branches: politicised officers have spelled the end for the Soviet Union, and thrown the mighty German Reich into a bloody civil war - we shall not make the same mistake..."
 
 ITA_where_we_left_off:0 "Where We Left Off"
 ITA_where_we_left_off_desc:0 "The foul stench of fascism has contaminated not merely the apparatus of State, but the very fabric of our nation. If we are to build a functional democracy, then the appropriate steps need to be taken: a sane, free and guaranteed political system is fundamental to ensure the proper mélange between representation and continuity of government and policies.\n\nBefore the rise of fascism, Italy's political spectrum was polarized between the socialist Partito Socialista Italiano and the christian Partito Popolare Italiano. Rising tensions among the liberals due to the strikes made them look to the fascist as a force of order and stability against the red tide, with the results we all have experienced: in order not to repeat the errors of the past, we must foster a healthy political climate, giving everyone a place, a party, to voice their opinion - even the former fascists - as long as everyone respects their opponent and commits to democracy."
 
 ITA_falce_e_martello:0 "Falce e Martello"
 ITA_falce_e_martello_desc:0 "For more than forty years, the socialist parties and movements have been actively persecuted by the fascist regime. With the dictatorship ended, it's only right that the Italian left is allowed to once again compete for political prominence, though a doubt agitates the more conservative elements of the new government: with their well-known republican sympathies, many fear that a socialist government will throw Italy once again in political chaos.\n\nThankfully, the King has a solution. Umberto II has invited the most prominent socialist politician, Pietro Nenni, to the Quirinale for a private audience: there, he will reassure the old politician that the socialists will be granted a presence in the provisional parliament, and will not be excluded from the first free election, as long as they commit to respecting the Statute and the monarchy - a most generous offer that would see both parties satisfied."
 
 ITA_scudo_crociato:0 "Scudo Crociato"
 ITA_scudo_crociato_desc:0 "The Democrazia Cristiana is the heir of the Italian Popular Party, founded by Don Luigi Sturzo in 1919 to represent the moderate christian electorate. Sensible to the social doctrine of the Catholic Church and strongly committed to democracy and the monarchy, the DC will provide a much-needed centre to the political landscape of the new Italian democracy: this will be vital in preventing instability in the near future.\n\nOf course, the King is more than interested in ensuring that the DC supports his reformation process. Umberto II will invite its leader, Aldo Moro, for a private audience at the Quirinale to let him on board with the future reforms: the party will be offered seats in the provisional parliament and the reassurance that, once the ad-interim cabinet resigns, the King will return to a strictly-ceremonial role, something that will undoubtedly convince the centrists."
 
 ITA_natunity_fiamma_tricolore:0 "Fiamma Tricolore"
 ITA_natunity_fiamma_tricolore_desc:0 "Despite what many claim, there are still millions of Italians who believe in fascism, or at least in the core values it represents. Nationalism, expansive foreign policy and state intervention in the economy are, after all, far from irrational policies, and denying these people a representation would only exacerbate the political debate, potentially turning thousands to underground terrorism in a paradoxical role inversion: for the sake of our democracy, the right must be allowed to participate to the elections.\n\nOur King understands the situation perfectly, and has already prepared the ground for a rightist party to rise. Umberto II has invited Giorgio Almirante, a bureaucrat in the former MinCulPop and leader of what little remains of the fascist establishment that isn't so compromised as to warrant immediate arrest, to the Quirinale for a private meeting: there, he will stress the need for a party that expresses the values of the old regime, as long as Almirante and his followers swear to uphold the Statute and democracy - for real, this time."
 
 ITA_liberalize_trade_unions:0 "Liberalize Trade Unions"
 ITA_liberalize_trade_unions_desc:0 "Under the fascist dictatorship, the only trade union allowed was the puppet CNCS - the National Confederation of Unionist Corporations - while the "true" unions were persecuted and forced to operate underground. Of course, this situation needs to end immediately, but many voice concerns over a flourishing of uncontrolled trade unions: in their opinion, this would risk a constant wave of wildcat strikes.\n\nTo this end, a moderate reform will be approved by the provisional government. Trade unions will be free to rise and operate in the factories, but only those who pass a public examination and are registered in a public list will be able to participate to talks on the national work contracts: this will incentivize moderate unions with a focus on federating smaller ones, which is exactly what we want."
 
 ITA_readjust_taxation_plans:0 "Readjust Taxation Plans"
 ITA_readjust_taxation_plans_desc:0 "The heavy custom tariffs and disproportionate state intervention in the economy that were the pillars of autarky, coupled with the rampant corruption that characterized the fascist regime, resulted in heavy taxes and costly goods for all, especially the middle classes. With these factors gone, the provisional government will immediately start a wide tax reform: less government expenses and - comparatively - less corruption have left quite the margin to operate.\n\nReducing taxes across the board, and especially for the middle class, will surely convince many Italians that the change in course was for the best, and will surely bring forth a better future. In addition, less taxes mean more money to boost the consumer economy, which will eventually result in industrial growth, more work, more gains, and... more taxes: yes, in the end it all revolves around taxes."
 
 ITA_emergency_rural_relief:0 "Emergency Rural Relief"
 ITA_emergency_rural_relief_desc:0 "The Atlantropa disaster and the failed autarchic policies of the fascist regime have put our farmers under great strain. With poverty rising among the rural communities struck by the fall in prices of grain and other agricultural products, many protest for better conditions: as Weimar's tragic fate teaches us, even the most liberal constitution will be nothing but wasted paper if the people starve.\n\nTo this end, the provisional parliament will immediately pass a wide reform of the farming sector, granting incentives to mechanization and seed trade, while improductive, state-owned land - the "manomorta" - will be auctioned or assigned to young men who will be able to earn a living from farming: this should alleviate the worst effect of the crisis, and accelerate the recovery."
 
 ITA_open_up_the_academia:0 "Open Up the Academia"
 ITA_open_up_the_academia_desc:0 "The fascist regime had deeply penetrated the academic world. From the Manifesto of Fascist Intellectuals to the oath of loyalty for the professors to take office, the higher echelons of the Italian intellighenzia had been forced to either bend or disappear, while the GUF - the Fascist University Groups - and the Littoriali Sport Olympiads ensured that the students were naturally brought closer to the regime: this has to end now.\n\nCulture is meant to be free from political pressure, and we shall ensure that no one is ever again forced to bend to be able to practice their art or learn a new one. Universities will be opened, and exiled intellectuals invited to return to their old tenures: Italy has always been the cradle of culture and civilization, and the time has finally come for the barbarians to be chased, and togas and tocchi to return to their legitimate place!"
 
 ITA_a_grand_old_parade:0 "A Grand Old Parade"
 ITA_a_grand_old_parade_desc:0 "The fascist regime adored parades and rallies. All manners of choreographies were enacted to show off the power and magnificence of Mussolini and his cronies: the state was turned into a stage from which actors and extras ridiculed themselves and our nation, and stopping this charade will not be a moment too soon.\n\nInstead of their glorified clown shows, we'll re-establish the National Armed Forces Day, where we'll be able to show our military might and the national pride for our accomplishments. The feast, celebrated the 4th of November, was turned into Victory Day by the fascists, and as all their other manifestation, it was a farce: let it be known that the armed forces of the Kingdom of Italy still stand proud, loyal to the King and to democracy, for all to see!"
 
 ITA_end_italianization:0 "End Italianization"
 ITA_end_italianization_desc:0 "In their foolish dream to restore the Roman Empire of old, the fascists approved draconian laws that aimed to turn the conquered peoples of the colonies into proper Italian citizens. All local names were converted in Italian-sounding ones, native languages were forbidden in public places and offices, and learning the Italian one was made mandatory in all schools: to add salt to the wound, the local garrisons were far from kind to those who did not comply...\n\nThis barbaric system must end now. Minorities must be respected and protected, and they should be left free to decide whether to stay true to their roots or embrace our culture. Of course, we have no intention to make them independent once again - we conquered our colonies across two world wars, and it would be an insult to those who gave their lives for the Kingdom - but this is no justification for rabid oppression: the natives will become part of our nation, each in their own, unique way."

 ITA_call_the_elections:0 "Call the Elections"
 ITA_call_the_elections_desc:0 ""
 
 ITA_natunity_renew_the_concordato:0 "Renew the Concordato"
 ITA_natunity_renew_the_concordato_desc:0 "The Lateran Concordat, signed between Mussolini and the Pope in 1920, created the legal basis for the birth of the independent state of the Vatican City. In exchange, the Pope lifted the ban on political participation he had imposed to all Catholics after Rome fell to the Italian Army in 1870, and stopped considering Italy an occupying force: this situation must not be changed.\n\nThough signed by fascists, the treaty is a staple of our internal stability, and we shall let the Pope know of this. With the moderate christian DC at the helm, the Vatican will see our good will and won't worry about the prosecution of our amicable relationship: our ambassador attached to the Holy See will relay a message of friendship and cooperation that will surely please His Holiness."
 
 ITA_reform_the_consiglio_superiore_della_magistratura:0 "Reform the Consiglio Superiore della Magistratura"
 ITA_reform_the_consiglio_superiore_della_magistratura_desc:0 "The CSM - Superior Council of the Magistrature - is the independent, self-governing body of the Italian judiciary. Of course, during the fascist era this became nothing but a joke, with most magistrates either purged and replaced by sycophants, or forced to bend to avoid such a fate: with the regime ended, the time has come to restore the independence of the judiciary.\n\nThe CSM will be thoroughly purged from all fascist-aligned members, and reformed so that no government may appoint its members. Instead, the King himself will be named honorary president of this august body, so that his clout may prevent interference: adding to this, its members will be elected directly by the magistrates themselves."
 
 ITA_under_the_carpet:0 "Under the Carpet"
 ITA_under_the_carpet_desc:0 "For decades, the OVRA - Voluntary Operation of Antifascist Repression - has brutally repressed the Italian people, acting as an unsanctioned Inquisition dedicated to the removal of any antifascist element from society. Slowly but steadily, the OVRA has replaced the lawful intelligence agencies of the Kingdom, accruing a veritable treasure trove of information about everyone and everything: while its removal is necessary, the same thing should not happen to all the information they gathered.\n\nTo this end, the OVRA will be reformed into the UAR - Reserved Affairs Bureau - and the least compromised members will be granted a place in the new body as long as they abandon the more... unsightly methods of interrogation. While somewhat forgiving in the face of what these men have done to our people, we must first and foremost protect Italy's stability: letting these men join the black terrorist front would be way more dangerous!"
 
 ITA_declare_the_winner:0 "This Had Better Work"
 ITA_declare_the_winner_desc:0 "The time of the provisional government is over. With all the needed reforms and other emergency measures approved and implemented, the King has signed the decree revoking the martial law, and the cabinet has resigned in full: as its last act, the provisional Prime minister has presented to the King the decree announcing the first free elections in forty years, which was promptly signed by His Majesty.\n\nTwo months from now, all men and - for the first time - women of the Kingdom of Italy will cast their vote without the fear of being beaten by Blackshirts or filed by the Ovra. The day of the election will be momentous, as the restored democracy will choose the path it will take in this world: the power has been restored to the people, and now we can only hope for one, single thing.\n\nThis had better work."
 
