 #Events
 RIF_wars.1.t:0 ""
 RIF_wars.1.desc:0 "Mehdi Ben Barka is talking with Abderrahim Bouabid and Abdallah Ibrahim in his office while technicians are preparing for Ben Barka to give a speech on the radio. The three men are going over the speech Ben Barka is going to give and how Bouabid and Ibrahim have gripes with it. Bouabid wants Ben Barka to make it clear that the new republican government is not going to attack small landowners and businessmen as that’s a demographic that is still very reticent of the government. Ibrahim, on the other hand, wants to emphasize the work the Republic is doing, to rally workers and farmers. The technicians finish preparing, so Ben Barka tells both men to leave as he begins the speech."
 RIF_wars.1.a:0 ""

 RIF_wars.2.t:0 ""
 RIF_wars.2.desc:0 "The government is having a meeting with the generals. The generals are a mix of left-wing veterans of the Moroccan Army of Liberation, radical members of the UNFP and younger officers that joined the Republic due to the Kingdom’s growing despotism and corruption. The meeting itself is very generic, going over military goals for the short-term."
 RIF_wars.2.a:0 ""

 RIF_wars.3.t:0 ""
 RIF_wars.3.desc:0 "A group of farmer families move into land that was seized from a big landowner and then divided into plots given to the families. These families now have land of their own to work and profit from"
 RIF_wars.3.a:0 ""

 RIF_wars.4.t:0 ""
 RIF_wars.4.desc:0 "A group of bureaucrats are going over a series of assets that were Moroccanized by the Kingdom. The assets used to be owned by foreign companies but after they were seized most of them were shortly after given to private Moroccan companies. They prepare a memo with instructions: seize the assets and put the companies under state supervision."
 RIF_wars.4.a:0 ""

 RIF_wars.5.t:0 ""
 RIF_wars.5.desc:0 "A poster appears in prisons under Republican control of the government offering amnesty for old Royal Army personnel in exchange for serving in the new Republican Army. The news has mixed reactions from the targeted audience."
 RIF_wars.5.a:0 ""