 #Events
 MOR_wars.1.t:0 ""
 MOR_wars.1.desc:0 "Hassan II gives a speech, rallying the country around him to secure Morocco’s independence and fight the Mauritanians to secure Morocco’s place in Africa."
 MOR_wars.1.a:0 ""

 MOR_wars.2.t:0 ""
 MOR_wars.2.desc:0 "(An aide eavesdrops, accidentally at first but then continues, in a conversation between Hassan II and a group of businessmen. The businessmen sound foreign though the aide can’t pinpoint their place of origin. The conversation revolves the businessmen negotiating weapon shipments to Morocco in exchange for Moroccanization not touching certain assets and their businesses getting a better position in Morocco."
 MOR_wars.2.a:0 ""

 MOR_wars.3.t:0 ""
 MOR_wars.3.desc:0 "General description of the recently-constructed Tazmamart prison, how it is located deep in the desert, far from any town and is used to house people that the monarchy considers most dangerous to their rule"
 MOR_wars.3.a:0 ""

 MOR_wars.4.t:0 ""
 MOR_wars.4.desc:0 "In his office, the Minister of Foreign Affairs coordinates how contact and meetings with various Arab countries are going."
 MOR_wars.4.a:0 ""

 MOR_wars.5.t:0 ""
 MOR_wars.5.desc:0 "The chief of a Mauritanian tribe is received in Rabat to meet the King. The chief says that he and his people will help Morocco and that they swear allegiance to Hassan."
 MOR_wars.5.a:0 ""