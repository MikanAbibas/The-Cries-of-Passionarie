l_english:
 #country
 LER:0 "League of Rights Deprived"
 LER_DEF:0 "the League of Rights Deprived"
 LER_ADJ:0 "League"
 #parties
 LER_despotism_party:0 "LER"
 LER_despotism_party_long:0 "Liga der entzogenen Rechte"
 #dynamic mod
 GER_g4_ler_for_liberation:0 "For Liberation"
 GER_g4_ler_for_liberation_effect:0 "§qFor Liberation§!: \nEffective Change"
 #focuses
 LER_the_moment:0 "The Moment"
 LER_the_moment_desc:0 "The time has arrived to rise up and divest ourselves of the awful Germans. The chaos engulfing the Reich thanks to the madness of Springmann and the foolishness of Roeder has allowed this once in a generation opportunity. It is now or it is never."
 LER_to_arms:0 "To Arms"
 LER_to_arms_desc:0 "No doubt the mad Germans have lost all shred of civility after witnessing our defiance and make moves to massacre us all, combatant and non-combatant alike. All the oppressed peoples of Europe must rise up at once or all hope is lost. Everyone must be armed with whatever weapons we can possibly acquire!"
 LER_no_time_for_cowardice:0 "No Time For Cowardice"
 LER_no_time_for_cowardice_desc:0 "The Marshal has seen fit to mobilize as many fighting age men as humanly possible for this effort. Even the reluctant must be drafted and pressed into service. The coming months will be harsh and critical. It is all or nothing for the League now."
 LER_forward_unto_glory:0 "Forward Unto Glory"
 LER_forward_unto_glory_desc:0 "Today we will be remembered forever!"
 LER_the_future_is_in_sight:0 "The Future Is In Sight"
 LER_the_future_is_in_sight_desc:0 "A free Europe is at hand! We will bow to no one! Not any more! And we will fight on together! Forevermore!"
 LER_against_the_madness:0 "Against The Evil"
 LER_against_the_madness_desc:0 "The Germans will be pushed out and the taint of Nazism eradicated from our homelands!"
 LER_for_prosperity_promised:0 "The Prosperity That Was Promised"
 LER_for_prosperity_promised_desc:0 "The regime instituted by the Gang of Four promised prosperity and freedom for all peoples including those who were not German by blood. Today our people continue to languish in poverty and oppression in the German controlled lands. We must free them!"
 LER_liberty_for_all:0 "Liberty To The Free"
 LER_liberty_for_all_desc:0 "And death to the Germans!"
 LER_to_berlin:0 "For All Of Us!"
 LER_to_berlin_desc:0 "For Poland! For Luxembourg! For Czechia! For Europe and the entire World! Bring this monster down!"
