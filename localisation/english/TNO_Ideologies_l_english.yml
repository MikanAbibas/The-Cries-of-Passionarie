 ultranational_socialism_esoteric_despotism_subtype_desc:0 ""
 ultranational_socialism_nakamism_subtype:0 "Nakamism"
 ultranational_socialism_nakamism_subtype_desc:0 ""
 ultranational_socialism_reactionary_ultrasocial_conservative_subtype:0 "Reactionary Ultrasocial Conservative"
 ultranational_socialism_reactionary_ultrasocial_conservative_subtype_desc:0 ""
 burgundian_system_subtype:0 "Burgundian System"
 burgundian_system_burgundian_system_subtype:0 "Burgundian System"
 burgundian_system_burgundian_system_subtype_desc:0 "When Germany's luck began running out after the Second World War, certain fanatical and unorthodox members of the Nazi Party - chief among them Reichsführer-SS Heinrich Himmler - sought to reconcile their belief in the superiority of National Socialism with the increasingly bleak reality unfolding before them. They eventually arrived at the conclusion that the Nazi Party had lost sight of itself and collapsed into decadence, and that only they were fit to preserve National Socialism as truly intended. They quietly isolated themselves from the Third Reich's political structures, secretly building their own systems in parallel. When Himmler was made head of the SS-Ordensstaat Burgundy, he began implementing this purified vision of Nazism unimpeded.\n\nMuch like how many of the Reich's ideological goals revolve around Hitler's increasingly erratic statements, the tenets of the Burgundian System are rather ill-defined. The only way one could attempt to understand it is to analyze Himmler's increasingly inscrutable actions and cryptic beliefs, which range from vague and seemingly contradictory ideals of agrarianism and hyper-industrialization, to the establishment of a Germanic neopagan state religion and exploration of the occult. What is absolutely certain, though, is that his regime implements Nazi policies to a unique extreme: the SS is exalted above all other social strata, draconian racial hygiene laws are harshly enforced, and National Socialist theory is deliberately incorporated into every aspect of waking life. It also imposes an incomparable degree of totalitarianism upon the entire population, in hopes of removing all potential sources of decadence or complacency. Whether this has succeeded at all - or will do so in the future - is known only to Reichsführer Himmler, for while secrets flow like a river into the Ordensstaat, they are never permitted to leave."
 burgundian_system_imperial_cult_subtype:0 "Imperial Cult"
 burgundian_system_imperial_cult_subtype_desc:0 "On the night of 17 July 1918, Bolshevik revolutionaries executed the Romanov imperial family in a cellar beneath Yekaterinburg. Their deaths ought to have marked the end of the story of House Romanov. Instead, Russia remained haunted by them. Through revolution, war, and dissolution, rumors spread that one of Nicholas's children had survived. As the country shattered, some came to believe that the Romanov children remained in hiding and would return, one day, to restore Russia to greatness. These delusions came to coalesce around one man, Sergey Taboritsky, and his imperial cult of Alexei.\n\nA shambling corpse of a movement held together by fear, imperial nostalgia, and virulent antisemitism, the imperial cult's sole goal is to hasten Alexei's return to Russia. To this end, supporters believe in mobilizing all resources of the state toward purification, hoping for their savior's return once the Russian people have proved themselves "worthy" of him. Advocates support the systematic extermination of Russia's minorities, enforced poverty of the mass public, and the construction of grand, imperial monuments. Their system of mass surveillance and extreme punishment is directly inspired by the purified realms of the Reichskommissariat Kaukasien and its leader Josias, a man Taboritsky openly admires.\n\nYet, the movement's sustainability is unclear. Every day that their savior fails to return, the cult grows more desperate. Soon, observers fear, there may not be a Russia for Alexei to return to."
 burgundian_system_agrarian_spartanism_subtype:0 "Agrarian Spartanism"
 burgundian_system_agrarian_spartanism_subtype_desc:0 ""
 burgundian_system_spartanism_subtype:0 "Spartanism"
 burgundian_system_spartanism_subtype_desc:0 "For some, National Socialism's success was forever enshrined by its triumph, and its failures were only due to specific misfortunes or political errors. They say that the Reich, for all its faults, is not in need of anything more than reform or rejuvenation. They would see the status quo continue in perpetuity, leaving Germany as, ultimately, just another empire.\n\nFor Reinhard Heydrich and his followers in the Deutsche-SS, that is not enough. It will never be enough.\n\nWhile the Himmlerites delved into esotericism, and the Waffen-SS betrayed their cause for wealth and power, Heydrich and his devotees already had a vision of their own, far different from that of the corrupt NSDAP and degenerate liberals. It was one of a better, simpler, more pure society of the ancient past, where men were warriors, women were mothers, and all traces of profligacy and weakness were excised. No cities bubbling with filth; no "pragmatic" mercy for subhumans. In barracks-towns and country estates, the pure race drilled for war and worked the land, while their progeny was honed to perfection through purges and bloodshed. They were the Spartans, espoused in thrilling tones by Heydrich as the ancient manifestation of Aryan supremacy - and when the world revolves upon the axis of Germany, even history itself will bend to the Führer's will.\n\nIt falls to the true believers of National Socialism - the SS - to realize the promised land. Infused with the spirit of Sparta and forged anew upon the anvil of the Volksgemeinschaft, the Reich will be made eternal. Even if the blood must flow in rivers and overtake the sea; if countless millions must choke and die; if the foundations of utopia are laid upon the mass grave of all mankind; it will be worth it. One has not the luxury of counting the cost."
