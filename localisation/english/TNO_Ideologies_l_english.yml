 despotism_subtype:0 "Despotism"
 despotism_absolute_monarchy_subtype:0 "Absolute Monarchy"
 despotism_absolute_monarchy_subtype_desc:0 "Absolute Monarchism is an ideology defined by total control by a monarch and the placement of all other government authority under their oversight. Most commonly, the monarch leaves the day to day management of the state to their ministers, but any decision can be overturned or reversed by them. With a history extending back thousands of years, absolute monarchy is one of the oldest and most enduring systems of government.\n\nThe transition from antiquity to the medieval era across the world saw the control of monarchs diminished in favor of the power of the aristocracy, who in some cases had only a nominal allegiance to their King. As the feudal eras of Europe and Asia waned, however, this arrangement quickly began to change once more.\n\nAs kingdoms and empires grew in strength around the world, the powers of the nobility were increasingly wielded by the monarch and their ministers, especially in Europe. Even as the powers of European monarchs were curtailed in favor of constitutional governments, absolute monarchies continued to survive in much of the Middle East, Asia, and Africa. Today, in a world desperate for hope, some might seek to place all faith in royalty once again. As the great French King Louis XIV once said: "One King, one law, one faith.""
 despotism_aristocratic_social_conservative_subtype:0 "Aristocratic Social Conservative"
 despotism_aristocratic_social_conservative_subtype_desc:0 ""
 despotism_civilian_dictatorship_subtype:0 "Civilian Dictatorship"
 despotism_civilian_dictatorship_subtype_desc:0 "Civilian Dictatorship, though a republican form of governance, should not be mistaken for a democratic one. Defined by the dictatorial grip on a state by a civilian regime, the military leadership is completely or near completely under the control of the civilian state, without the ability, and sometimes desire, to interfere with government functions.\n\nUsually, the dictator legitimizes his government by creating or repurposing a political party to keep up the pretense of a democracy. This party both serves as a mask to hide the nature of the regime, and a tool to serve the needs of the state. It rarely holds real political power, but can serve to advance skilled politicians to assist the dictator.\n\nThey are often created when power is centralized in the hands of a single person, who goes on to declare that for one reason or another, they would be holding that power permanently. This control almost always continues until either their overthrow or their death."
 despotism_colonial_government_subtype:0 "Colonial Government"
 despotism_colonial_government_subtype_desc:0 "The very definition of an empire is predicated on the idea of one nation ruling over others. Sometimes, local collaborators or noblemen are able to step up and help their new overlords manage things smoothly. But oftentimes, there may be a dearth of willing assistants from the local population, or they may simply not want to be ruled over.\n\nEnter the colonial government. Staffed from top to bottom by bureaucrats, magistrates, and governors from the mother country, they take no orders from those they govern and would be loathe to do so. Their justifications for doing so may be myriad: the natives are uncivilized and not ready for home rule, doing so will harm their ruling country's political interests, or they simply don't trust the occupied nation enough to justify freeing them. If the governor is not a military man himself, they often have a close link to the military anyway, since it is the only institution the government can fully trust in event of an anti-colonial insurrection.\n\nOpportunities for a native under this regime are slim and none; if they are lucky, they will be able to get a job in the government's rank-and-file, with no hope for advancement beyond the lowest echelons of power. That is why these regimes so often tend to inspire fierce resistance; lots of angry, disenfranchised and disillusioned military-aged men with everything to gain and nothing to lose make for a wonderful anti-colonial rebel army."
 despotism_interim_government_subtype:0 "Interim Government"
 despotism_interim_government_subtype_desc:0 "An interim, or caretaker, government is an intrinsically temporary one that exists in between more formally defined governments, whether those be the result of democratic elections, military imposition, or some other method. Typically rapidly formed in the aftermath of the fall of a previous government, however that fall may have been characterized, their inherent perceived legitimacy is generally low. Therefore, should they not be quickly replaced, national disorder and unrest is sure to follow.\n\nSuch interim governments tend to be relatively authoritarian even if apolitical, if only to ensure that the status quo as it relates to state institutions is maintained until such time as their successor is properly established. At the same time, they are very unlikely to possess either the political will, or the physical ability, to execute policy of any real significance. The nation, in essence, remains 'frozen' until the interim government is replaced."
 despotism_military_junta_subtype:0 "Military Junta"
 despotism_military_junta_subtype_desc:0 "A Military Junta is a government where the military has taken political power into its own hands without any democratic element. Often this involves a suspension of the constitution of the state, and the rights contained therein. This leaves juntas free to stabilize the country into accepting their rule.\n\nAn authoritarian oligarchic rule characterizes a junta, with power shared among military leaders rather than centralized in a single person. Sometimes, civilian governmental institutions continue to function as well, but with their activities supervised or even directed by the junta. Other times, the junta rules formally and directly, maintaining legitimacy through a variety of other methods, most often promises of future democratization or of reclaiming lost land.\n\nUsually, a Military Junta takes power by coup d'état, though occasionally military leaders are invited to take control in times of crisis. Besides an emphasis on military strength and national security, they tend to differ greatly in their aims depending on circumstance. However, among all juntas, one ideal remains the same: the soldier protects, but he does not serve."
 despotism_papacy_subtype:0 "Papacy"
 despotism_papacy_subtype_desc:0 "Unique among many of its ideological peers, the Vatican exercises a wholly unique system of governance that blends monarchy, theocracy, and a semi-democratic elements into a coherent whole. The Pope is elected for life, though not chosen through inheritance or bloodline, by the College of Cardinals - senior bishops of the Catholic Church - during a Papal Conclave that convenes to choose the next Pope.\n\nUpon selection, the Pope becomes head of the Holy See, Vatican, and the Catholic faith itself, imbued with the authority of an absolute monarch. The authority the Pope can exercise is vast, and transcends traditional borders as Catholics live across the world. While this has little practical authority, it gives the words of the Pope more weight than many other heads of state, and few set out to antagonize the Vatican as a result."
 despotism_neo_baathism_subtype:0 "Neo-Ba'athism"
 despotism_neo_baathism_subtype_desc:0 "From the ashes of the 1958 Syrian rebellion, a conflict between the Civilian-led leadership and the Military Command would ripple throughout the Arab Socialist Ba'ath Party. And from this conflict, Neo-Ba'athism, would emerge in reference to a broad front of ideological deviation from Ba'athist orthodoxy.\n\nUnited only by an emphasis on military supremacy over the party and the favouring of military-led struggle over civilian revolution. The Neo-Ba'athist movement would find itself disunited in nearly every other matter, whether it be economic or foreign policy. While the left of the faction are regarded by some as borderline Leninist, and favour pseudo-Marxist economic policy and even partially playing into the notion of class struggle; the right faction would position itself in favour of increased economic liberalization. Neo-Ba'athists are also generally characterized by a decreased interest in the ideas of Pan-Arabism, favouring more regionalist ideals.\n\nDerided by the old guard of the Ba'ath movement for their seeming abandonment of the party's original principles and their disregard of civil liberties, Neo-Ba'athism has nevertheless gained a sizeable influence over the party and the people due to their militant struggle, in contrast to the relatively tame intellectuals that form the orthodox cliques."
 despotism_corporatocracy_subtype:0 "Corporatocracy"
 despotism_corporatocracy_subtype_desc:0 "While private capital exists in a tense relationship with the public interest in every developed country across the world, in almost every instance the public interest remains firmly in control of the levers of political power, with corporations being just one of many interest groups. However, this polity's unique circumstances has led to this normal state of affairs being reversed.\n\nWhether by regulatory neglect, corruption, or deliberate design, the political role of the state in a corporatocracy is dominated by corporate interests and representatives. Whether they rule indirectly via bought men and regulatory capture, or more directly by the outright seizure of political power, a corporatocracy operates for the benefit of its corporate denizens, their shareholders, and investors first - and for the betterment of its people a distant second."
 despotism_vanguard_anarchism_subtype:0 "Vanguard Anarchism"
 despotism_vanguard_anarchism_subtype_desc:0 "Freedom is something too precious to be in the possession of the people.\n\nVanguard Anarchism attempts to combine the decentralized anarchist society with a standard, disciplined army to defend the society, often with a central, dominating leader of that army acting as the final voice when it comes to matters of survival of the society. Supporters of this style of anarchism argue it is fundamentally necessary in order to prevent more organized and stable external threats from overwhelming the communes. On the other hand, detractors consider this a fundamentally corrupt interpretation of anarchism, as the needs and will of the people are often subordinated to the army's authority in the name of defense and protection, and even besides, the sheer amount of individual power held by whoever runs the military makes them little better than any other tinpot dictator."
 despotism_warlordism_subtype:0 "Warlordism"
 despotism_warlordism_subtype_desc:0 "When people speak of power, they speak of man's control over the minds and actions of other men. Among the nations of the world, this control is often political. Leaders exert power through some combination of orders, threats, and persuasion, mediated through institutions that seek to restrain the real use of violence.\n\nWarlord states lack the interest and the capacity for such subtleties. Cruel and brutal, warlords are leaders of armed bands who rely on violence to exert power over lands ravaged by war or crisis. They terrorize civil authorities, plunder resources, and exterminate uncooperative populations. Those unfortunate enough to live in a warlord state are often forced to contend with marauding bands of fighters, unpredictable and unrestrained from the rules of decency. While individual leaders can have complex goals and motivations, the bloated military apparatus they lead tends to be extractive, seeking to enrich itself at the expense of others."
 despotism_personalistic_dictatorship_subtype:0 "Personalistic Dictatorship"
 despotism_personalistic_dictatorship_subtype_desc:0 "Autocrats have come in many forms throughout recorded history. Whether ideologues or lawgivers, saints or tyrants, the greatest among them had something in common: a vision, pursued to the utmost with every means at their disposal. From the republic-turned-empire of Augustus to the continent-spanning revolutionary ambitions of Napoleon, the mark such individuals have left upon history is truly indelible.\n\nOf course, those tend to be exceptions, rather than the rule.\n\nMost autocrats have far less high-minded motivations. Forget ideology, nation-building, or anything of that sort. For these men (and occasionally women), power is both the means and the end; "All for me, and none for thee." Egoism defines both their rulership and their personalities. They rule not by popular mandate or under the guidance of a higher cause, but by and for themselves. Extensive use of nepotism, brute force, and criminality can make their regimes, no matter how unpopular, exceptionally difficult to remove."
 despotism_partisan_movement_subtype:0 "Partisan Movement"
 despotism_partisan_movement_subtype_desc:0 "Freedom earned through blood is better than tyranny enforced through blood. That is the thesis of a partisan movement - if war is necessary to free their people from foreign occupation, then let loose its hounds and cry its chants. Besides a devotion to the cause of liberation and a general use of guerrilla warfare, partisan movements can hold nearly any ideology, be made up of any class or nationality, and can be organized in nearly every way a movement can be. They can fight in the cities, in the fields, in the forests and in the mountains. From any place a person can hide, a partisan can fight.\n\nAs the jackboot continues to press on Europe's neck, as the rising sun's rays of oppression shine over Asia, as the colonies of Italy languish under the Roman eagle, partisan movements have exploded in size and diversity to combat these evils. From the UPO in the Reich's "Model Colony" to more ideological groups like the UMAJF in Malaya, partisans across the globe continue their struggle. The oppressors will fall, the tyrants will burn, until the partisans reach the beautiful light on the horizon, the promised land they so desperately march towards. Hope for their people, who have lost it long ago. Justice for those that caused all of the pain and misery.\n\nAnd most of all, what every partisan fights for above all: Freedom. For their people, for all time."
 despotism_national_catholicism_subtype:0 "National Catholicism"
 despotism_national_catholicism_subtype_desc:0 "The intersection of statecraft and religion goes back for as long as statecraft and religion have existed. Since time immemorial, matters temporal and spiritual have not only existed side by side, but both have crossed over and influenced one another to degrees so profound that it simply cannot be overstated. In the modern age, it is no different with the Catholic faith.\n\nThe National Catholics believe firmly that the best way to run the country is in accordance with traditional Catholic values and the enforcement of such, giving them a distinctly authoritarian and quite conservative character in general. Rather than merely encouraging adherence to tradition and the upholding of values, rigid adherence is something that must be enforced instead, separating them from other political Catholics.\n\nRather than putting leadership directly in the hands of the faith as in the case of a theocracy, National Catholics typically push for a cooperation with another arm of governance that would allow them to enforce their laws more effectively. Usually, but not always, it is a military force that provides the enforcement part of a National Catholic regime, especially in countries where Catholicism is a dominant religion in the country's populace- and therefore, its armed forces as well. Such a thing is, of course, necessary to prevent any backsliding into decadent, depravity and entropy."
 despotism_managerial_state_subtype:0 "Managerial State"
 despotism_managerial_state_subtype_desc:0 "A Managerial State refers to a political system where the country is controlled by and serves the interest of a selected group of elite bureaucrats. The leader of such a system, usually a group of technocrats selected via meritocracy as opposed to a personalistic dictator, seeks to maximize the efficiency of the state apparatus by micromanaging every aspect of the society through the hands of experts. While managerial states are not completely apathetic to their citizens' demands and needs, those concerns for citizens' welfare are nevertheless a variant in the technocrats' formula. The demands of the citizens are heard and responded to solely for the purposes of preventing revolts and maximizing economic outputs.\n\nLeaders of managerial states tend to believe that the system they profess avoids the inefficacy of electoral politics and believe that experts are best-positioned to lead the country to prosperity. However, history has proven that they often fail to account for the unpredictability of human emotions, and such failure could easily lead to their downfall."
 despotism_khomeinism_subtype:0 "Khomeinism"
 despotism_khomeinism_subtype_desc:0 ""
 fascism_subtype:0 "Fascism"
 fascism_fascist_mysticism_subtype:0 "Fascist Mysticism"
 fascism_fascist_mysticism_subtype_desc:0 "Founded by Niccolò Giani, the School of Fascist Mysticism has spent years crafting a comprehensive analysis of both modern and ancient philosophy, society and religion. Constantly striving to find the reasons behind the great events of History, the members of this school came to the conclusion that matters of state, economy, religion, ethics and race are tightly bound: as such, there must be something capable of holding everything together, espousing the supreme good and fighting the supreme evil - and that something is Fascism.\n\nIn the eyes of Niccolò Giani, Fascism is more than a political ideology. Preaching eternal devotion to the State, unflinching faith in God, and utter loyalty to one's family, comrades and brothers-in-arms, it is a comprehensive code of values that can find application in every moment of a person's life, replacing all other social constructs, including religion: in fact, Fascism is the final and logical conclusion of Christianity, with the messianic figure of the Duce acting as paragon of virtue, and supreme authority in both political and religious matters - making the corrupt and decadent Clergy unnecessary.\n\nPreviously confined to academic halls and theoretic debate, Niccolò Giani's meteoric rise to power in the Italian Empire has seen Fascist Mysticism experience a dramatic increase in both importance and adherents, as its teachings offer hope to desperate Italians: duty in place of uncertainty, and devotion in place of doubt. As the faithful grow in strength and numbers, the Duce smiles, for every new follower is not only a step closer to what Fascism was meant to be - it is a step closer to ascension, in both body and soul..."
 fascism_neofascism_subtype:0 "Neofascism"
 fascism_neofascism_subtype_desc:0 "To be a neofascist is to wear a mask. This mask does not need to always stay on, but it must be worn strategically, so as to not reveal one's true nature.\n\nAs opposed to more traditional fascists, neofascists attempt to conceal their ideology, changing their message in order to fit their audience. When talking to fellow fascists, their masks will come off and they'll plainly declare their allegiance to fascism. However, when talking to an audience that would find such open declarations unpalatable, they'll avoid direct references to fascism. Instead, they'll dilute their message behind more acceptable rhetoric, focusing on nationalism, anti-communism, and corporatism.\n\nOne may assume that neofascist regimes are dictatorial. However, while this may very well be the ideal for many neofascists, this is not necessarily the case. While they would prefer to construct a less democratic society, most neofascists are aware of the lack of support for such measures, and instead resign to work within the democratic system.\n\nNeofascists intend to walk through the night, carrying a light behind them. That light does not help themselves, but as they make their way through the dark, they light the way for others to follow."
 fascism_sansepolcrismo_subtype:0 "Sansepolcrismo"
 fascism_sansepolcrismo_subtype_desc:0 "Taking its name from a discourse held by Benito Mussolini in Milan's Sansepolcro Square, Sansepolcrismo is the very first incarnation of the fascist ideology, back when the PNF didn't exist yet, and fascism still called itself "Fighting Fasces". At the time, the movement's name and iconography were a tribute to the Arditi, Italy's elite assault corps and the very first to wear the black shirt - which would become the uniform of the future MVSN, the feared Camicie Nere.\n\nThe Sansepolcro Manifest advocated for a "Third Way" between capitalism and communism, taking the best from both sides while discarding what was deemed unnecessary. As such, early fascism conjugated private economic initiative with heavy state intervention in the economy, parity between sexes and worker uplifting programs with rabid nationalism and unbridled militarism, vote for women with single party state: a mèlange of political, social and economic beliefs, kept together by the messianic figure of the Duce, the voice of the people, who knew what was best for all - and had the strength to pursue it.\n\nAbandoned over the years in favor of less revolutionary policies that catered more to the middle classes, Sansepolcrismo has been brought back to the forefront of political discourse by Ettore Muti's meteoric rise to power. While unstable and somewhat erratic, it is undeniable that this ideology finds fertile ground among the lower classes and the military, making it a powerful tool to counter the advancement of socialism in society: only time will tell whether it will be successful, inaugurating a new age of nationalistic zeal and class cooperation, or it will once again be forgotten."
 fascism_reformed_national_socialism_subtype:0 "Reformed National Socialism"
 fascism_reformed_national_socialism_subtype_desc:0 "All ideologies that achieve power evolve as they rule, and Nazism is no exception. In its earliest decades, the arbiter of Nazism was Adolf Hitler, summed up in the concept of "Führerprinzip": the Führer's word is the final word, and Nazism is whatever he says it is. But as time passed and Hitler's practical influence within the party waned, he could no longer enforce his will as the sole gatekeeper of National Socialist thought. One of the people who took advantage of that vacuum was Albert Speer.\n\nSpeer's National Socialist praxis is marked by a watering down of many of Hitler's more unsavory policies. The meticulous racial quantification, the futile quest for economic autarky, the endless empowerment of the military, even the blind worship of Hitler; Speer considers none of these tenets to be sacred and plans to do away with all of them. These inevitably earn him derision from his more devout rivals: he's a revisionist, he's a factionalist, he wants to replace Nazism with weak and effeminate Italian fascism. Some have even accused him of being a crypto-democrat who wants to destroy Nazism entirely.\n\nWhat they fail to realize is that Speer isn't reforming Nazism to destroy it, but to save it. By making ideological concessions in the name of pragmatism, Speer is able to amputate the gangrenous limb and keep the rest of the body alive. By limiting rampant militarism, he can diminish the risk of Caesarism in the general staff. And by allowing criticism of Hitler, he can preserve a cult of personality while maintaining the appearance of openness.\n\nIf everything goes according to plan, Speer can transform National Socialism from a bloated mess of self-destructive contradictions into a workable ideology while preserving its core. There will still be a one-party state, there will still be racial purity, and most importantly, there will still be one all-powerful Führer."
 fascism_corporatism_subtype:0 "Corporatism"
 fascism_corporatism_subtype_desc:0 "Corporatism, from the Latin word for the human body, is one of the earliest economic models that presented itself as a "third position" to counter both capitalism and socialism. It is subject to a great many influences, from classical Greek philosophy to leftist syndicalism, but it was ultimately the proto-fascists who dominated the legacy of corporatism. It became deeply associated with Catholic and other religious traditionalism, integralism, and "clerical fascism" in the interwar years, and it served as a model to people such as Gabriele D'Annunzio, Engelbert Dollfuss, and Antonio Salazar.\n\nWhile corporatism is collectivist and believes economic classes are a fundamental unit of society it teaches that the greatest good can only be achieved through class collaboration rather than class struggle. Workers and employers alike are organized into some form of corporate body - be it guilds, syndicates, trade unions, or worker cooperatives - based on their industry, and it would be these corporate bodies that lobby the government on their behalf. The amount of representation the individual is afforded in the government is subject to variance, but usually often very little. Corporatism is also marked by a heavy preference towards a traditionalistic interpretation of the moral codes prevalent in the locality, especially with regards to marriage, sexuality, family structures, and popular media."
 fascism_corporate_statism_subtype:0 "Corporate Statism"
 fascism_corporate_statism_subtype_desc:0 "Money can buy many things - towers of steel, cities of gold, the loyalties of craven men - but not a monopoly on violence. Or a country. At least, not yet.\n\nAlthough the role of corporate capital in this polity is monumental - entirely out of the scope of what would be expected anywhere else in the world - the state maintains its prerogatives. Though the corporations and their lieutenants are omnipresent, and their wishes cannot be ignored, their desires and machinations are ultimately subject to the whims and needs of a single primarch. Even if the economic and social life of this society is dominated by private enterprise, the political direction of the state remains firmly in the grip of a singular entity, bending the efforts of others to serve a purpose greater than mere profit. Here, labor and capital are both subsumed under the vision of their betters."
 fascism_national_syndicalism_subtype:0 "National Syndicalism"
 fascism_national_syndicalism_subtype_desc:0 "Despite what some may think, National Syndicalism is not exactly fascism, but nor is it socialism either. As revolutionary as it is anticommunistic, rooted in the writings of both Georges Sorel and Ramiro Ledesma Ramos, it is a very idiosyncratic ideology, merging various influences to become something wholly new.\n\nJust as its name indicates, National Syndicalism could be described as a fiercely nationalist version of revolutionary syndicalism. Seeking to organize society around a system of syndicates, and promoting class cooperation instead of class struggle, it aims to constantly revolutionize itself, which means that it is, at least in theory, deeply progressive.\n\nNational Syndicalism, while still fairly popular in Latin American countries and a lingering influence on Spanish intellectuals, is not as voguish as it once was. Indeed: times have changed since the 1920s, and what was once seen as a young, fiery ideology has now been eclipsed by other radical currents, such as national socialism or communism. Nevertheless, a resurgence, while certainly unexpected, still seems to be possible, for National Syndicalism's perpetual modernisation might turn out to be its greatest strength."
 fascism_fascist_populism_subtype:0 "Fascist Populism"
 fascism_fascist_populism_subtype_desc:0 "Some leaders are fond of expressions such as "the world has need of our nation, and our nation has need of all its people." Yet behind these apparently neutral calls for national unity and joint effort is a system no less fascistic than that first envisioned by Benito Mussolini, the Master of the Mediterranean, all those years ago: that of Fascist Populism.\n\nFascist Populism is fascism for the farmers and peasants of the countryside - it focuses on the interests and welfare of the idealized "Old Country", far away from the alleged "decadence" and "corruption" inherent in cities and towns. As a result it focuses on the welfare of rural areas to an extent even many agrarian leftists and centrists would find irrational.\n\nFascist Populism also eagerly plays on the neuroses and concerns of the average farmer to strengthen its base. An abhorrence for the "other", most frequently manifested in xenophobia and anti-Semitism, figures prominently in their policy. Just as important to them is well-deployed welfare - to ensure that farmers "can receive from the Nation their just reward for their work" - and protectionism, to shield the rural industries (whether deservedly or not) from their "hostile" competitors outside."
 fascism_revolutionary_nationalism_subtype:0 "Revolutionary Nationalism"
 fascism_revolutionary_nationalism_subtype_desc:0 "Heralding a new era for the people now stood atop the shoulders of slain giants, a new wave of energy had emerged from the rotting carcasses of empires; a zealous 'Revolutionary Nationalism', materializing wherever the imperialist boot had once tread. Rejecting unequal treaties from London, resource-pillaging from Paris, and imperial diktats from Berlin, this newfound nationalism has roared in the shadows of Europe's empires to repel the horrors and brutality that had once emerged from the colonial office.\n\nMany of these post-colonial regimes govern underdeveloped and highly hierarchical economies as a result of their historical exploitation. However, authorities drive to modernize their countries, often unifying their people around a powerful figure or institution alongside patriotic, and sometimes revanchist, rhetoric. The newly-founded nation remains at the center of all political life; workers are instructed to toil for the strength of the country just as soldiers are told to fight to defend the homeland's recent freedom. Social views on morality and personal autonomy vary, but almost all agree upon a single, unified cultural identity in the face of a new modernity. As Europe lies fractured and limp under the grey jackboot, the liberated peoples cheer to celebrate independence from the masters who could no longer bear the whip."
 fascism_reform_bureaucracy_subtype:0 "Reform Bureaucracy"
 fascism_reform_bureaucracy_subtype_desc:0 "Like most great powers, Japan found itself deeply divided during the interwar period of the early 20th century. At the close of the Great War, it had been a mere 60 years since the nation had begun its transformation from an isolated, feudal society to a modern and industrialized nation-state. No such change would be without teething problems, particularly in the field of economics - after all, the free-market status quo had originally developed naturally, over a lengthy period of time, and the arrival of revolutionary socialism only complicated matters further. From a combination of that era's uncertainties, ideological experimentation, and the new experience of colonialism emerged a uniquely Japanese phenomenon: 'kakushin kanryō', or 'Reform Bureaucracy'.\n\nFor such an unassuming name, Reform Bureaucracy carries quite the legacy of cruelty and exploitation. Best realized in the ruthlessly exploited puppet state of Manchukuo, it is unapologetically dehumanizing, corporatist, and even fascistic. To these bureaucrats, economics is a matter of nothing but numbers and well-trained cogs, a series of gears dedicated to expanding the nation's preparedness for war and mobilisation. Drawing upon the 'total war' economy of the late German Empire, the economic rationalization of the Weimar Republic, and the planned economy espoused by many hardline socialists, Reform Bureaucracy's ultimate goal is simple: the complete subordination of the economy to the needs of the state, generally with the military and a politicized bureaucracy as the main benefactors."
 fascism_proletarian_nationalism_subtype:0 "Proletarian Nationalism"
 fascism_proletarian_nationalism_subtype_desc:0 "Proletarian Nationalism is a niche ideology that attempts to reconcile socialism with fascism's global pre-eminence. Insofar as its rhetoric concerns the well-being of the worker and his oppression by the forces of capital, Proletarian Nationalism is socialistic. In practice, however, Proletarian Nationalism wildly deviates from Marx's account of class antagonism; it is merely that its many strains differ as to whether workers' liberation should come through a corporatist, planned, or more traditionally socialist economic structure. These debates rage among a new class of fascists who, for the most part, view Marxism as a failure for which they have a superior vision.\n\nMany Proletarian Nationalists are ex-socialists who became disillusioned with mainstream socialism after Germany defeated the Soviet Union. Others are merely right-wing nationalists who learned to regurgitate half-understood socialist terminology. Still, most Proletarian Nationalists maintain that socialism must endure the scrutiny of fascist superpowers in order to survive. Socialism must, therefore, learn from fascist victories. Proletarian Nationalism is the ideological afterbirth of this transfusion. This new, purportedly proletarian movement inherits far more from fascism than from socialism, including authoritarian, prejudicial hierarchies hostile to traditional Marxist conceptions of democracy. \n\nIt seems ironic that people so dedicated to socialism would contort it so that, even if solely in vague allusions, it might survive. The Proletarian Nationalists seem desperate and confused. Perhaps, soon enough, they will realize their ideology is an excuse, an attempt to rationalize a tragic sequence that should not have been. Until then, they will conjure any defense, any rationalization required to sustain the illusion."
 fascism_integralism_subtype:0 "Integralism"
 fascism_integralism_subtype_desc:0 "There exist many variants of Integralism, often affected by the circumstances in which its exponents find themselves. Yet the core principles are very much the same, and have the same basis: that of stridently fundamentalist, traditionalist Catholicism.\n\nIntegralism rejects the values brought about by the Enlightenment - those of secularism, democracy, and liberalism. Rather than embracing 'progress' and change, an integralist go the other way, insisting that the only way for people to lead moral, dignified lives is through a return to agrarian medievalism, in a society predicated upon hardline Catholicism.\n\nBased on a corporative concept of the society working as a human body, integralism is not built on a concept of a glorious future to be built off of an ancient ideal, but instead on a ruthless, hardline attempt to bring that glorious - and usually imagined - past back, by any means necessary."
 fascism_falangism_subtype:0 "Falangism"
 fascism_falangism_subtype_desc:0 "Born from the chaos of the Spanish Second Republic, Falangism seeks to marry the revolutionary ideology of National Syndicalism with conservative Catholic teachings and Hispanism. While retaining the anti-capitalist, anti-communist, inflammatory, and dynamic rhetoric of National Syndicalism, it is much more moderate in practice. Falangists call for the creation of vertical syndicates or trade unions to mediate relations between labor and management under an overarching corporatist, class-collaborative state capitalist framework.\n\nThe aspect where National Syndicalism and Falangism clash the most, however, is their social outlook. While the former advocates for a "Constant Revolution", the latter is ultra-conservative, calling for close coordination between church and state and a strong nationalism centered around Roman Catholic and Hispanist identity."
 national_socialism_subtype:0 "National Socialism"
 national_socialism_idiosyncratic_nazism_subtype:0 "Idiosyncratic Nazism"
 national_socialism_idiosyncratic_nazism_subtype_desc:0 "National Socialism is an ideology, a state of thought, and a state of life with the Aryan race at its fundamental heart and center. To subjugate the Aryan people to the cowardice of practicality or the confines of a German state is the height of folly. This is the National Socialist dream, and long has it laid idle at the foot of corrupt tyrants.\n\nYet the dream survives. Championed by the likes of Theodor Oberländer and Georg Leibbrandt, Idiosyncratic Nazism is a sect of reformist National Socialism committed not to the "pragmatism" of Speer or the degeneracy of the dissidents, but to something greater: the Aryan people. Some Idiosyncratic Nazis believe that many so-called "Slavs" have Aryan blood, others view them as a lesser - but not subhuman - race. Regardless, they all view the East as more than a massive slave pen to be transformed into Lebensraum. Instead, they see allies in the global struggle against the Judeo-Bolshevik menace. Many also advocate for a return to National Socialism's populist roots, and a re-centering of government policy around the Aryan citizenry.\n\nTo most, Idiosyncratic Nazism is a bizarre mess of contradictions, doomed to collapse under its own weight. To its supporters, it is true National Socialism, the manifestation of the People's Will."
 national_socialism_clerical_fascism_subtype:0 "Clerical Fascism"
 national_socialism_clerical_fascism_subtype_desc:0 "Fascism is a truly malleable and fickle ideology by nature. Due to this, it has always been able to be adapted to fit the ideological needs and peculiarities of those wielding it even in the days when it was first adopted by Benito Mussolini. Given the widespread and still heavy influence of religion on millions worldwide, it is not surprising that many fascist movements ranging from the infamous Iron Guard of Romania to the Ustase of Croatia have attempted to wield faith and Fascism simultaneously in their quests for power and control over the very souls of their nations. The resulting child of this often-grotesque pairing is known to the world as Clerical Fascism.\n\nWhile religious influences within fascist movements is nothing out of the ordinary, these regimes tend to be extremists on par in their fanaticism with National Socialism. They are obsessed with theories of "salvation" that are bound inseparably with race and the nation in the minds of its practitioners. Unless their vision of purity is achieved, warn these modern-day zealots, their people will soon find themselves damned both here and in the afterlife. Truly, is there anything as dangerous as those absolutely assured of their own righteousness?"
 national_socialism_stratocratic_nazism_subtype:0 "Stratocratic Nazism"
 national_socialism_stratocratic_nazism_subtype_desc:0 "Following the end of the Second World War, Nazism went in many different ways. From Speer's reformism to Oberländer's orthodoxy, National Socialism seemed to be split in different tendencies, all vying for power in the halls of the Reichstag. One tendency, however, stood out from the rest due to its main leader's vehemency: Joseph Goebbels' Stratocratic National Socialism.\n\nFirst devised by Goebbels at the beginning of the fifties, and then championed by such people as Ferdinand Schörner following the propagandist's untimely demise, it differs from traditional Nazism by calling for a greater emphasis on the national military. It advocates for measures such as harsh racial and antisemitic policies and a strict maintenance of eugenicism, along with the glorification of the concept of war. Extremely hawkish even among their Nazi consorts, they desire to adopt a hardline stance against the other great powers, and believe that the Cold War shall be won thanks to Blood and Iron."
 national_socialism_ordosocialism_subtype:0 "Ordosocialism"
 national_socialism_ordosocialism_subtype_desc:0 "In 1847, Karl Marx shook the world to its very core. He created an ideology that discarded the old order, and addressed the true struggle of the common man. Now, Marx's true successor has arrived. Ivan Serov, creator of Ordosocialism, did not understand why one's patriotic love for their country must be at odds with their nation's class struggle. Why must they demonize the Germans, when their ideology clearly has unique characteristics that could better serve the forces of revolution? Ordosocialism is the resolution to these conflicting questions and ideals.\n\nOrdosocialism is the synthesis of the class struggle and the national struggle. Ordosocialism is the synthesis of all that opposes both capitalism and cosmopolitanism. Ordosocialism concerns itself with the destruction of those who decided to follow the path of reaction, and those whose reactionary tendencies are of a more... hereditary nature.\n\nSome fools accuse Ordosocialism of being a reactionary, corporatist betrayal of all that Marx stood before. Some fools accuse Serov of being a madman, no better than Hitler himself. These individuals attempt to weaken the revolution with their slander, and defend hereditary reactionaries despite their inherent opposition to the revolution. Serov and his followers will not let these false claims distract them, however, for they have a new revolution to bring forth. A revolution free of the rot that plagued its predecessors."
 national_socialism_technocratic_nazism_subtype:0 "Technocratic Nazism"
 national_socialism_technocratic_nazism_subtype_desc:0 "Technocratic Nazism, despite what the name could suggest, is as corporatocratic as it is technocratic. Mostly popular in Germany's various colonies and Reichskommissariats, it is a form of governance that could best be described as a mix between reckless and ambitious industrialization and national socialist racialism.\n\nIn such a system, the various megacorporations which populate the German economic landscape are given quasi-free reign to do as they please, and the populations deemed as non-Aryan endlessly toil away in the mines or in the factories for what amounts to basically nothing. A tried-and-true system in the eyes of Germania's colonial bureaucrats, it allows for the exploitation of the East's riches while at the same time keeping the natives from revolting, because of the system's sheer brutality making quasi-impossible the organisation of a revolt: a perfectly adequate way to govern, one would think.\n\nAnd yet, some critics have arisen in Germany's hall of powers: from Speer's ragtag band of reformists, who argue that such an oppression of the Slavs is counterproductive, to some Burgundian adherents advocating for an agrarian society, it seems that Technocratic Nazism is at least somewhat polarizing within Germany proper."
 national_socialism_stratocratic_corporatism_subtype:0 "Stratocratic Corporatism"
 national_socialism_stratocratic_corporatism_subtype_desc:0 "Stratocratic Corporatism is not, in and of itself, fascist. However, it does draw inspiration from fascism's tenets. This inspiration can be seen in its organization of society into a totalitarian, corporatist structure, with the military firmly in charge. The rest of such a society is mobilized to support the military, and by extension the nation as a whole.\n\nStratocratic Corporatism can also take on other characteristics beyond its corporatist, totalitarian structure. Such governments frequently, although not necessarily, include elements of racial supremacy. This is not usually done through the pseudo-scientific exaltation of a master race, such as in Nazism. Instead, Stratocratic Corporatist societies usually stoke their racial supremacy through invoking a national spirit or mythology.\n\nTo such societies, peace is merely an interval in a never-ending chain of wars, and therefore the entirety of the nation's physical and moral resources must be forever poised for wartime mobilization. These governments frequently grapple with the issue of how to take independently minded masses and get them to look beyond their own issues and instead towards an abstract "destiny" of their nation. Compulsory membership in patriotic organizations, mobilizing marginal elements of society into the workforce, and the constant need for "token sacrifices" in the name of supporting their ever-growing military, nothing is beyond the reach of such regimes. Such nations can not lose, and the people hold faith in their governments that such statements shall remain true."
 national_socialism_national_proletarianism_subtype:0 "National Proletarianism"
 national_socialism_national_proletarianism_subtype_desc:0 ""
 ultranational_socialism_subtype:0 "Ultranational Socialism"
 ultranational_socialism_slavo_aryanism_subtype:0 "Slavo-Aryanism"
 ultranational_socialism_slavo_aryanism_subtype_desc:0 ""
 ultranational_socialism_eurasianism_subtype:0 "Eurasianism"
 ultranational_socialism_eurasianism_subtype_desc:0 "A focused subset of nationalist thought, Eurasianism is defined by its relation to the proposed Eurasian 'super-ethnos,' the ideo-social concept that the Eurasian peoples, ranging from the Carpathian basin to the Mongolian steppes, must unite into a single social and political grouping in order to achieve national strength and protect against destructive influences from without. Through both preparing for and actually doing so, the 'passionarity,' or overall drive, of this ethnic grouping will be maximized, allowing for greatness to be achieved on a societal scale.\n\nKey to this theory is the notion of the historical relation of the Russian nation to the West. Rather than endorsing the idea of Russia as a European nation, Eurasianism defines the Russian nation as one that, due to its relations to the Mongols and other Asiatic peoples, is fundamentally separate from the West, with Eurasian unity encouraged as a both a means of defense from Western influence and a means of cultural development and rejuvenation. Eurasianism encourages close ties between Eurasian peoples, strengthened ties with Asia rather than Europe, and strong rejection of both "parasitic internationalism" and European concepts which are deemed external to the super-ethnos."
 ultranational_socialism_ultranationalism_subtype:0 "Ultranationalism"
 ultranational_socialism_ultranationalism_subtype_desc:0 ""
 ultranational_socialism_fundamentalism_subtype:0 "Fundamentalism"
 ultranational_socialism_fundamentalism_subtype_desc:0 ""
 ultranational_socialism_stratocratic_nazism_subtype:0 "Stratocratic Nazism"
 ultranational_socialism_stratocratic_nazism_subtype_desc:0 "Following the end of the Second World War, Nazism went in many different ways. From Speer's reformism to Oberländer's orthodoxy, National Socialism seemed to be split in different tendencies, all vying for power in the halls of the Reichstag. One tendency, however, stood out from the rest due to its main leader's vehemency: Joseph Goebbels' Stratocratic National Socialism.\n\nFirst devised by Goebbels at the beginning of the fifties, and then championed by such people as Ferdinand Schörner following the propagandist's untimely demise, it differs from traditional Nazism by calling for a greater emphasis on the national military. It advocates for measures such as harsh racial and antisemitic policies and a strict maintenance of eugenicism, along with the glorification of the concept of war. Extremely hawkish even among their Nazi consorts, they desire to adopt a hardline stance against the other great powers, and believe that the Cold War shall be won thanks to Blood and Iron."
 ultranational_socialism_qutbism_subtype:0 "Qutbism"
 ultranational_socialism_qutbism_subtype_desc:0 ""
