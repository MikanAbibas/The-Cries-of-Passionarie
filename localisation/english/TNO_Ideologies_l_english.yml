l_english:

### Sub-ideology names.
###
### Hearts of Iron localises a sub-ideology by its own key, the way vanilla does
### in parties_l_english.yml - which this mod ships as an empty file, so vanilla
### never gets a chance to. TNORA's own 150 sub-ideologies had exactly one name
### between them and the rest drew their raw key in the politics view.
###
### Names come from the wider TNO codebase where it has them, from the mod's own
### <slot>_subtype_desc text for the twelve base sub-ideologies, and otherwise
### from the key itself. Descriptions are carried over only where upstream wrote
### one; the rest are left empty.

 communist_subtype:0 "Authoritarian Socialism"
 communist_bukharinism_subtype:0 "Bukharinism"
 communist_bukharinism_subtype_desc:0 ""
 communist_left_communist_subtype:0 "Left Communism"
 communist_left_communist_subtype_desc:0 "Espousing what they claim to be the most purely Marxist doctrine, Left Communists reject nearly all major political developments that have occurred since the death of Lenin, and even some during his life. This isn't of course to say that they are entirely bound to doctrines as described in the writings of Marx and Engels, but they do seek to remain as close to its spirit as possible, even at the expense of effectiveness in the moment.\n\nA rejection of parliamentary politics entirely, a defiance of vanguard party organization and its democratic pretenses, and a firm belief in the revolution as a historical inevitability characterize the Left Communism movement. This adherence to anti-populist attitudes and a focus on theory over praxis inspires no small degree of ridicule from their fellow leftists, but given how well history has treated them so far, Left Communists rarely feel threatened by these "opportunists" as they are often called.\n\nDespite stereotypes and criticisms to that effect, Left Communists are not simply idle or lazy, awaiting for an "organic" revolution that will never come. But rather, their preparation involves planning rather than giving grand speeches, learning and studying rather than waving guns and standing on soapboxes. If knowing is half the battle, then the Left Communists have already won. It is, after all, simply a matter of time."
 communist_maoism_subtype:0 "Maoism"
 communist_maoism_subtype_desc:0 "Unlike Mao Zedong Thought, whose popularity is limited to East Asia, Maoism is an ideology that can be found all around the world. Named and inspired by the Chinese revolutionary Mao Zedong, it is based on his writings and posits him to be the next great Marxist theoretician, following in the footsteps of such figures as Marx, Engels, Lenin and Bukharin.\n\nIt relies on a doctrine of internationalism and anti-imperialism, but differs from traditional Bolshevism by placing an emphasis on the rural populace instead of the urban proletariat. In its fight against capitalist domination in countries where ruralism is still prevalent, it deems guerilla warfare as the best way to conduct the revolutionary struggle, under the form of a "protracted people's war".\n\nMaoism is seen by its supporters as the natural continuation of Marxist thought, and thus as the next stage of Bolshevism: its fundamentally anti-imperialist principles have seen it adopted around the world, as oppressed peoples of all stripes begin take up arm against their oppressors. This new, revolutionary deviation of traditional Marxist thought has begun to make its mark throughout world history."
 communist_marxism_leninism_subtype:0 "Marxism-Leninism"
 communist_marxism_leninism_subtype_desc:0 "Joseph Vissarionovich Stalin was one of many contenders to succeed Lenin as leader of the Soviet Union. While agreeing with Bukharin on the principle of "Socialism in One Country", he rejected the market-driven development of the New Economic Policy. Instead, he believed that the State should exercise total control over the economy to spur on rapid development of industrial and agricultural production. Private enterprise could never be trusted to develop a fully socialist state, and therefore all industry and agriculture ought to be collectivized and directed by Communist Party central planners to achieve the Union's goals. A key corollary to this policy is that, far from withering away after the revolution as the old Leninists believed, the State must indeed be strengthened a thousandfold in order to implement a full transition to a communist society. This was heresy to the likes of Bukharin, who would triumph over Stalin in the succession struggle.\n\nYet, perhaps surprisingly, Stalin gradually returned to prominence - first in the flesh, when he played a critical role in the last years of the USSR, and then with his ideas. His rump government may have proven no more successful than Bukharin's, but its state-oriented and exportable doctrines have allowed its grasp to spread around the world, even eclipsing Bukharinite Bolshevism in certain areas. Just as the Soviet Union fell to internal strife, its very ideology is now split in twain, and defined by mutual disdain."
 communist_stalinism_subtype:0 "Stalinism"
 communist_stalinism_subtype_desc:0 "Joseph Vissarionovich Stalin was one of many contenders to succeed Lenin as leader of the Soviet Union. While agreeing with Bukharin on the principle of "Socialism in One Country", he rejected the market-driven development of the New Economic Policy. Instead, he believed that the State should exercise total control over the economy to spur on rapid development of industrial and agricultural production. Private enterprise could never be trusted to develop a fully socialist state, and therefore all industry and agriculture ought to be collectivized and directed by Communist Party central planners to achieve the Union's goals. A key corollary to this policy is that, far from withering away after the revolution as the old Leninists believed, the State must indeed be strengthened a thousandfold in order to implement a full transition to a communist society. This was heresy to the likes of Bukharin, who would triumph over Stalin in the succession struggle after the latter perished in a tragic industrial accident.\n\nOnce thought vanquished, Stalin's ideas have been reborn in the West Siberian People's Republic. Marxism-Leninism-Stalinism has found its Apostle in Chairman Lazar Kaganovich, a formerly obscure Soviet official banished to the Urals by Bukharin before the war. He proclaims that Stalinist collectivized industrial development would have allowed Russia to outcompete German industry and push the Hun all the way back to Berlin. Yet, claims Chairman Kaganovich, Soviet Russia can still be restored to its former glory through following Stalin's insights; his most important insight being that the Soviet State must hold absolute power within its borders in order to triumph over its enemies: Hun, Kulak, Collaborator and Class Traitor alike."
 communist_workerism_subtype:0 "Workerism"
 communist_workerism_subtype_desc:0 "Workerism, also known as Marxist Autonomism, is a term used to describe a network of interlinked movements and individuals emerging in the early 1960s in Italy. The original core of Workerism was a group of marxist intellectuals who engaged in a critical revision of the interpretations of Marx's thought which had been en vogue among communists since Lenin's time. The key idea of workerism is that the traditional communist idea, preaching that the working class struggles are a reaction to capitalist development, is in fact backwards: capitalist development, according to workerists, is a reaction to the struggle of the exploited workers.\n\nThe working class is thus the "negative engine" of development, and accordingly, all revolutionary strategies must come from and be driven by the working class itself, with no interference from bourgeouis collaborationist unions and certainly not from exploitative vanguard parties. Indeed, the working class should reject any alliance with "progressive" or "empathetic" bourgeoisie. The working class must stand on its own, rely upon itself to seize power, with an emphasis on revolutionary violence and grassroots organization in order to achieve such ends. This dynamic, fresh-faced take on communist ideology has a great deal of pull among younger students and workers, for whom the fires of political and ideological enthusiasm have yet to dim."
 communist_stratocratic_communism_subtype:0 "Stratocratic Communism"
 communist_stratocratic_communism_subtype_desc:0 "Stratocratic Communism arises from both circumstance and ideological drive. Despite loathing of conventional armies being common in the far-left, that sentiment typically dies out once a military apparatus is secured, and nothing has ever barred military men from adhering to that side of politics to begin with. Some men of that sort even indulge in the time-honored tradition of 'theorizing' - and where the ethos of their chosen profession meets Marxist theory, it fuses to create a new mode of thought that few other radical leftists endorse, for reasons which become quite apparent once its tenets are elaborated upon.\n\nForemost of those tenets is stated clearly in its name: the establishment of a revolutionary socialist government composed entirely of military officers and personnel. Detractors call this a cynical power-grab to hijack the revolution, little more than a revisionist junta. Those detractors (prior to their summary execution) would be met by the argument that the armed forces, being assembled from the conscripted proletariat, are the vanguard of the revolution by necessity. Moreover, the regime asserts that perpetual supremacy of the military is paramount to the ultimate triumph of socialism, for if the bourgeoisie cannot be defeated from within, it is the armed workers of the nation who must liberate their oppressed comrades by force.\n\nCries of "Revisionist!" aside, a regime of this type is still ideologically-driven and cannot simply be described as 'apolitical' or a 'junta'. It is committed to communist principles, chief among them absolute control of state, society, and economy by the 'dictatorship of the proletariat'. Still, even by the standards of a revolutionary government, Stratocratic Communism is extremely hardline, tolerating no dissent and displaying shameless aggression. Civilian leadership has no place here; only the Revolutionary Army, composed of class-conscious worker-soldiers, can ensure the propagation of the world revolution and the destruction of bourgeois imperialism."
 communist_mao_zedong_thought_subtype:0 "Mao Zedong Thought"
 communist_mao_zedong_thought_subtype_desc:0 "While the Communists may have been defeated in the Second Sino-Japanese War, the ideas of one of their founders, Mao Zedong, have however not disappeared: hiding until the imperial threat falters, waiting for the right moment to strike.\n\nBased on the writings Mao wrote during the Long March and his time in the Yan'an Base Area, Mao Zedong Thought borrows elements from a heavily rural-centric form of socialism, but to reduce it as a mere deviation upon it would be a mistake. Calling for revolutionary land reform and for the establishment of a system of New Democracy, adapted to China's conditions, it also advocates for the conducting of a protracted people's war, a type of guerilla warfare which it deems to be the best way to carry out the revolutionary struggle.\n\nIt is important to note that Mao Zedong Thought can be found quasi-exclusively in Asia and China proper, due to its very specific nature as an ideology: while Mao himself has influenced multiple communist movements around the globe, and is the inspiration for the aptly-named Maoism, Mao Zedong Thought can only be found in East Asia due how integral Mao's contributions to the Chinese Communist Party are."
 communist_islamic_marxism_subtype:0 "Islamic Marxism"
 communist_islamic_marxism_subtype_desc:0 "Among the five pillars of Islam stands the Zakat, the duty of almsgiving. The responsibility to donate a part of one's income to society's less fortunate, it ensures that even the poorest of the poor can live a decent life. After the beginning of the 20th century, such an altruistic worldview was remarked by some thinkers to be quite close to the ideals of socialism, and one thing led to another as Islamic socialism began to take inspiration from Marx's theses to become Islamic Marxism.\n\nTheorized by such thinkers as Ali Shariati, it applies the economical and political systems of marxism into the framework of the Sharia, and tries to enact economic and social equality for all under the guidance of an Islamic state. This means that, unlike more "traditional" socialist ideologies such as Bolshevism, the goals of Islamic Marxism are twofold: materialistic, of course, but also religious.\n\nMostly popular in countries with a majority Muslim population, Islamic Marxism has been making waves in recent years, most notably in Asia and in the Middle East. One could have thought, given the somewhat antireligious nature of Marx's writings, that such an ideology would have already collapsed under the weight of its own contradictions; but for now it shows no signs of decline, and seems poised to live on under the guidance of Allah."
 communist_amazonism_subtype:0 "Amazonism"
 communist_amazonism_subtype_desc:0 "A split in the Brazilian Communist Party was all it took for a new revolutionary idea to form, and its birth led to a major shift in Latin American socialism. While many communist parties in the continent turn to electoralism, João Amazonas, the chief ideologue of the PCdoB, posits that communists must seek to violently overthrow the capitalist system in a drawn-out "people's war", involving rural guerilla warfare of the masses away from population centers.\n\nOfficially named "Marxism-Leninism-Amazonism", this movement has its roots in the ideological chaos established after the fall of the Soviet Union, being partially inspired by the failed Chinese revolutionary experience. Amazonism firmly rejects any association with capitalist powers, seeing it as a sign of betrayal of its anti-imperialist ideals, though the movements that follow this line should often collaborate with other revolutionary groups to topple the forces of imperialism. However, Amazonism is usually regarded with distrust by other factions, especially for its disposition towards economic autarky and isolationism in foreign policy.\n\nAmazonas claims that only the vanguard party can awaken the masses and raise their consciousness towards revolutionary zeal, rejecting the Guevarist line of decentralized insurgency. While Amazonist groups focus on building rural guerrillas, they do not shy away from integrating themselves into the general labor movements and union structure, sometimes being at the head of many unions' bureaucracy. This bureaucratic aspect may represent a contradiction to Amazonas' fiercest zealots, but this dualism is integral in their fight against right-wing tyranny."
 communist_arab_communism_subtype:0 "Arab Communism"
 communist_arab_communism_subtype_desc:0 "Communism has a history in the Middle East that goes back to the days of the Russian Revolution, an ideology adopted and advanced by intelligentsia, workers and the disaffected of the region as early as 1917. The Middle East is an area of the world that has suffered under the heel of European imperialist capitalism in very direct ways starting in the early 20th century, beginning with the carving up of the Ottoman Empire by the victorious Entente after the First World War, and then being upheaved once again by the fascistic Axis after the Second. The attraction to communism in particular is informed by this recent history, and for many, communism forms the crux of resistance against imperialism itself.\n\nMuch like other regions of the world that have suffered under the thumb of empires, communism in the Middle East began to take on a life and distinction of its own as both grassroots movements and the Arabic intelligentsia put their own spin on traditionally marxist messaging and ideology specific to their region of the world.\n\nFor many Arabic Communists, the simple changing of the mode of production was not enough. Arabic Communism not only needs to contend with foreign imperialism, but also with more conservative local leadership with a nationalist bent. To this end, the urban laborers and thinkers of the Middle East often demand change to the social fabric of the Arab World itself, with a particular emphasis on popular movement and social justice alongside political and economic change. The exact degree and character of these demanded reforms varies sharply from country to country, party to party, and even ideologue to ideologue, with Arab Communism encompassing a wide variety of movements and thoughts, from socialistic nationalists who simply want independence and socialism, to some who dream of a united pan-Arab nation to better resist outside interference and imperialist ambitions."
 communist_national_communism_subtype:0 "National Communism"
 communist_national_communism_subtype_desc:0 "When Karl Marx penned his fateful works, he imagined a global communist utopia, where workers all over the world would be free, and where the oppression of nationalism would be a distant memory, if that. This mantra was preached over and over again, organizations like the various Internationales grew and grew, and the left began to embrace the whole world in its mission. And it failed. Nikolai Bukharin championed the idea of "Socialism in One Country" when he led the Soviet Union, where a single socialist nation - the USSR - would focus on strengthening itself against reaction before liberating the world. And it failed.\n\nBut internationalism was never the sole destiny of communism. Another wing had followed it - National Communism, that had posed an answer to the national question - that communism was not the enemy of nationalism. That communism is true nationalism. It is the key to liberation from the twin devils of imperialism and capitalism, who seek to suck nations dry and leave them for dead. National Communists are as diverse as the different nations that host them, from Ukraine to Central Asia to Africa. Some support a loose union of communist states, others are more isolationist, yet they are all united by a common belief in national self-determination, communism, and anti-imperialism.\n\nFor the oppressed, for the enslaved, for all who suffer under the tyranny of imperialism and capitalism, National Communism is a beacon of hope in a dark, cruel world. And unlike other communist experiments, it may just succeed."
 communist_marxist_anarchism_subtype:0 "Marxist Anarchism"
 communist_marxist_anarchism_subtype_desc:0 ""
 communist_yugoslav_socialism_subtype:0 "Yugoslav Socialism"
 communist_yugoslav_socialism_subtype_desc:0 ""
 communist_harmonism_subtype:0 "Harmonic Communism"
 communist_harmonism_subtype_desc:0 "Nikolai Bukharin was once a broken man. Having spent twenty years in the Siberian tundra, he searched for answers to questions he barely knew how to ask. One fateful evening, he came across a strange crystal that granted him a vision of a society founded on one, central principle:\n\n§CFriendship is Magic.§!\n\nHarmonic Communism is an idealistic ideology that blends elements of Bukharinism with the idea that friendship is the praxis by which a socialist society is achieved. Followers of Harmonic Communism believe in the §Cmagic of friendship§!, where every conflict in all levels of society is solved through mediation and not violence. The ideology strives to implement a society in which conflicts are a thing of the past, and in which everyone in the state lives happily with one another through the power of friendship.\n\nFollowers of Harmonic Communism do still believe in class conflict, but they believe that it can be overcome in ways other than a violent revolution. Through the power of friendship, they believe they can break down class barriers and allow for the dictatorship of the proletariat to naturally form from the peaceful mediation of the workers' struggle. While many may see this as hilariously unrealistic in its idealism, Nikolai Buckharin has proven his ideology to be both surprisingly successful and attractive to the weary citizens of Russia. Soon, harmony and socialism will be spread throughout all of Russia, and even, eventually, the world."
 socialist_subtype:0 "Libertarian Socialism"
 socialist_anarcho_communist_subtype:0 "Anarcho-Communism"
 socialist_anarcho_communist_subtype_desc:0 "From the streets of Barcelona to the fields of China, anarchism is as tenacious and as stubborn as a rat. It would seem, at least on the surface, that anarchism is like a hydra- for every anarchist that is killed, imprisoned, or 'disappeared', two more will pop up in their place. But why?\n\nAnarcho-Communism is a radical left-wing ideology that is contrasted to more standard socialist ideologies like Marxism and democratic socialism by its strong opposition to authority, which it claims as synonymous with the evils of capitalism. Anarcho-communists are also notable for their distaste for large-scale industrialization, preferring to rely on local communes and farms for production. Anarcho-communists have had several brief moments of relative power, most notably with Nestor Makhno's Free Territory in Ukraine in 1920. But just as anarcho-communist societies are united behind common goals, they are also divided by almost everything else. Infighting, chaos and confusion are present in all anarcho-communist societies, and this usually leads to their downfall.\n\nModern Anarcho-Communism began with the works of thinkers like Pierre-Joseph Proudhon and Mikhail Bakunin in the mid-1800s. Seeking the total destruction of all forms of oppression, from capitalism to racism to the state itself, anarcho-communists exist in their own political bubble- scorned by the left and hated by the right. Nonetheless, Anarcho-Communism serves as a beacon of hope for any who have been cast aside by the existing system. One can be sure that no matter how dark and authoritarian the world becomes, anarchists will be hiding in the shadows, waiting for their opportunity to spring forth and realize their cries of 'no gods, no masters.'"
 socialist_christian_socialism_subtype:0 "Christian Socialism"
 socialist_christian_socialism_subtype_desc:0 "Christian Socialism is a broad umbrella term to describe all beliefs that combine the moral teachings of Jesus Christ with the economic theory of left-wing ideologues. This mix spiritualism and materialism may seem like an oxymoron at first glance, but that has not stopped thinkers and theologians from synthesizing the two. They consider themselves to be just as devout as any other Christian, and they reject Marxist beliefs that religion is an "opiate of the masses" that is ultimately incompatible with the goal of revolution.\n\nAlthough many argue that socialism is inherently hostile to Christianity, Christian socialists argue that it is actually capitalism that is incompatible: they consider it to be akin to idolatry, a cult of the Almighty Dollar that encourages greed and condemns charity. They turn to the Bible to both support their viewpoints, pointing out that Jesus said "One cannot serve both God and wealth," as well as how the earliest Christians "held everything in common" and collectively shared their possessions. Only collectivist social policies, they say, can stay close to Christ's teachings while also helping all those in society."
 socialist_neocommunism_subtype:0 "Neocommunism"
 socialist_neocommunism_subtype_desc:0 "Neocommunism, originating from Italy's Enrico Berlinguer's PCI, is less of an ideology and more of a collection of distinct revisionist based trends among European nations, with as much variety in specific policy prescriptions as there are differences in each particular nation that eurocommunism has spread to. There are, however, various commonalities that unite them, and that is a belief in peaceful revolution through the ballot box, an explicit opposition to the human rights abuses that other communist regimes have committed, and a recognition that all communist parties have to deal with different circumstances in different countries, as against the Bukharin 'one size fits all' approach.\n\nLoyally committed to democracy and the pluralistic rights that come from such traditionally western institutions, Neocommunism criticizes the collapsed Soviet Union under Bukharin as materially incapable of truly satisfying the conditions through which communism could be established, in addition to having its vanguardist ideology undermine the will of the working class. In contrast, Neocommunism seeks to maintain its interests as a vehicle of working class consciousness and power. Revisionist Marxist and reformist in nature, Neocommunism is committed to ending the exploitation of the capitalist system through peaceful means."
 socialist_revolutionary_frontism_subtype:0 "Revolutionary Front"
 socialist_revolutionary_frontism_subtype_desc:0 "The Revolutionary Front is, at least in theory, a unified coalition of various different sects, strains and factions of the socialist, communist and anarchist left, all with the intended purpose of gaining institutional and government power to establish socialism. In practice, this means such varying ideologies as Democratic Socialists, who believe in revolution through the ballot box, and authoritarian socialists, who are disgusted with what they describe as 'bourgeois democracy', are expected to cooperate and work together for the advancement of socialism.\n\nThis, unsurprisingly, can lead to a very incoherent bloc, with actual governing policies being based upon internal compromise or the result of certain factions winning out against others. Typically, the Revolutionary Front is most often seen in places where the political left can only hope to maintain power through a big tent and coalition building, or in places that are under threat from the right wing that seek to undermine the ability for such left parties to exist in the first place.\n\nRevolutionary Front leaders are as diverse as their base, and are often instrumental in maintaining the survival of the Front in the first place, if not its actual creator. Whether a Revolutionary Front can survive its leader, however, depends on whether it can learn sacrifice ideological purity for the sake of political (and sometimes literal) survival."
 socialist_syndicalism_subtype:0 "Syndicalism"
 socialist_syndicalism_subtype_desc:0 "What is socialism? In short, it is the workers' ownership of the means of production, whether directly or through the state. What, then, is more purely socialistic than Syndicalism - the idea that workers wrest from the capitalist class control of society and the economy through the revolutionary action of the general strike, and build a new society on the basis of trade unions directly composed of the workers themselves, with no middleman?\n\nSyndicalism argues for direct action - strikes, sabotage of production, and demonstrations - against the capitalist system both to secure better conditions for workers while living under capitalism and to ultimately overthrow and replace it altogether. Though the successes of the October Revolution and other factors sent the syndicalist movement into decline and marginalization, it has never truly gone away; perhaps one day, a new generation of syndicalists will strike fear into the hearts of bourgeoisie and politicians alike as the militants and saboteurs of the early 1900s did."
 socialist_ultravisionary_socialism_subtype:0 "Ultravisionary Socialism"
 socialist_ultravisionary_socialism_subtype_desc:0 "Since Mankind has first glanced at the celestial dome, it has dreamed of reaching higher than the ground it stands over. For that, mankind has evolved and banded together, reaching ever higher peaks of knowledge, so one day, it could fulfill their existential inheritance. While many would be content to claim that Communism is the next step of human revolution, Ultravisionaries are not content to simply sit on their laurels.\n\nA combination of Communism, with a heavy focus on the sciences, Ultravisionarism sees Socialism as not only the next step, but also an aspect of the next stage of human progress: the complete unity of the disciplines and laws of science.\nThe stars could not be farther. Yet, there is glory eternal for those who look ever forward."
 socialist_ultravisionary_socialism_pink_subtype:0 "Ultravisionary Socialism"
 socialist_ultravisionary_socialism_pink_subtype_desc:0 "Since Mankind has first glanced at the celestial dome, it has dreamed of reaching higher than the ground it stands over. For that, mankind has evolved and banded together, reaching ever higher peaks of knowledge, so one day, it could fulfill their existential inheritance. While many would be content to claim that Communism is the next step of human revolution, Ultravisionaries are not content to simply sit on their laurels.\n\nA combination of Communism, with a heavy focus on the sciences, Ultravisionarism sees Socialism as not only the next step, but also an aspect of the next stage of human progress: the complete unity of the disciplines and laws of science.\nThe stars could not be farther. Yet, there is glory eternal for those who look ever forward."
 socialist_agrarian_socialism_subtype:0 "Agrarian Socialism"
 socialist_agrarian_socialism_subtype_desc:0 "Unlike Marxist Socialism, which theorizes the driving force of the revolution to be the urban proletariat, Agrarian Socialism places the peasantry at the forefront of the revolution.\n\nMostly popular in scarcely-industrialized, undeveloped states, its ideal society is based on an agrarian vision of society, where the land is owned by the people instead of by a landlord class. Along with a socialistic economic system, and the collective ownership of the means of production, agrarian socialism aims to realise an agrarian utopia, where the farmer toils away happily, for he knows that he truly and finally gets to reap the ripe fruits of his labor.\n\nImportant to note, however, is that Agrarian Socialism is not an inherently revolutionary ideology: indeed, it can come to power through the ballot box as well as through the barrel of a gun, which makes it a quite broad and adaptable ideology to its supporters. Of course, it is not without its detractors: claims from the left that socialism and true equality cannot be achieved without industrialisation coincide with more "traditional" critiques from the right, which argue against the merits of socialism altogether."
 socialist_utopian_socialism_subtype:0 "Utopian Socialism"
 socialist_utopian_socialism_subtype_desc:0 "The earliest strand of its kind, Utopian Socialism has been used as both a label of endearment and insult by leftists through the years. Originally pioneered in the early 18th and 19th century, Utopian socialism is primarily based upon both a distinct dislike of class conflict and a belief in the perfectibility of mankind and of society in general. Whether it be through the creation of local communes, making industry more efficient through nationalization of certain goods and services, or just simply a moral belief in raising the entire society as a whole through government and local intervention, utopian socialists believe that mankind as a whole can be brought up to a higher standard of living than what capitalism can currently deliver to us.\n\nThe biggest distinction between utopian socialists and their Marxist cousins is a distinct dislike of class conflict or revolution, believing instead that all classes would be willing to adhere to such a system through convincing. This places it in opposition to the materialistic worldview that Marxism and more pragmatic socialists who intend on creating working class coalitions to win power. While most utopian experiments have failed, many persist in their experiments, believing that, one day, a perfect system of humanity can be created, and that all of mankind can bask in its glory of a newer, better world."
 socialist_panafricanism_subtype:0 "Pan-Africanism"
 socialist_panafricanism_subtype_desc:0 "First springing to life in the early 20th century, Pan-Africanism stands as the product of years of European oppression, from the British to the French to the Germans to a dozen other nations besides. Its proponents reject the idea of individual African nations, socialist or otherwise- instead preaching that, in order to truly stand against European colonizers, Africa must stand united under one banner. Falling on the far-left of the political spectrum, Pan-Africanism can be easily differed from its counterpart in African Socialism by its vanguardist attitude, its emphasis on anti-imperialism, and its staunch adherence to a pan-national identity for what Europe once called the "Dark Continent".\n\nWhile its adherents are primarily found in West Africa- specifically Cameroon- and South Africa as a major part of the ANC, ideologues can be found from Cape Town to Cairo- even gaining traction among Black communities in the United States and the Caribbean. Motivated, angry, and aggressive in spreading its influence, those with interests in the region should keep an eye on the Pan-Africanists."
 socialist_baathism_subtype:0 "Ba'athism"
 socialist_baathism_subtype_desc:0 ""One Nation, Bearing an Eternal Message."\n\nThe brainchild of Michel Aflaq and Zaki al-Arsuzi, Ba'athism is a revolutionary Arab nationalist movement, aimed at creating a 'renaissance' across the Arab world by means of revolution against foreign oppressors. Ba'athist ideology combines notions of pan-Arabism, Arab socialism, and secularism into an ideological platform that aims to mobilize and subsequently unify the whole Arab nation through revolutionary struggle, regardless of faith or region.\n\nThe Ba'ath party functions as the universal vanguard for the Arab nation, accelerating its development in order to bring about the renaissance into all aspects of life. Its ostensible goals are progress, liberty, and socialism as defined by Aflaq, within a context suited to the Arab world. Dedication to modernization and progress means that the party opposes not only foreign rule but also all the forms of feudal and noble reaction across the Arab world. Liberty in the Ba'athism sense does not necessarily mean liberal parliamentary democracy, as it may subvert the revolution, and socialism here substitutes the Marxist notion of class struggle for a national struggle against colonialism. 'Arab Socialism' is considered an important means of reaching the renaissance, but not its ultimate purpose.\n\nIn reality, the ideological purity of Ba'athist parties across the Middle East is incredibly varied and intrinsically linked with local culture and tradition, as well as an influx of foreign political theories. The policies followed by the Ba'athist movements range from the rampant militarism of some branches to promises of representative democracy and socialism by others. Their only common goal is the creation of a united Arab state, stretching from the Atlantic Ocean to the Arabian Gulf."
 socialist_left_wing_nationalism_subtype:0 "Left-Wing Nationalism"
 socialist_left_wing_nationalism_subtype_desc:0 "From the East to the West, from the most developed nation to the least, there arises a new trend in politics of the new age: left-wing nationalism. Espousing left-wing ideals of equality, class consciousness, and the ideal of a socialist modernity, its believers aim to challenge imperialism by fashioning these ideas into a clarion call for self-determination and independence. The proponents of left-wing nationalism transform socialist agitation into a weapon with which to combat either imperialist interference and influence in society.\n\nIn the Cold War, left-wing nationalism is a wide label: it describes both revolutionary tendencies and electoralist reform; it covers a broad range of adherents, from Europe to Asia, from Africa to America. Despite this wide-ranging appellation, however, they all have something in common: nationalism is not irreconcilable with socialism or socialistic policies, and that self-determination and political independence is a necessary step in achieving equality and liberty."
 socialist_guevarism_subtype:0 "Guevarism"
 socialist_guevarism_subtype_desc:0 "Of all the colorful personalities that took part in the Cuban Revolution, only one ever reached Fidel Castro's international fame - the Argentine Marxist known as Ernesto 'Che' Guevara. His ideas have come to be known as Guevarism.\n\nIn its current context, Guevarism is an umbrella term for a variety of leftist movements whose chief distinction is their organization around the Revolutionary Coordination Junta and Guevara as a rallying figurehead. Radically breaking from all mainstream communist thought, Guevarism outright rejects the need for any established vanguard party to organize a Marxist revolution. Instead, small fast-moving bands of insurgents act as the vanguard themselves, mimicking Che's own experiences in the Cuban Revolution. Through generating discontent among the peasant class, propagandizing, and guerrilla warfare, the insurgents will put enough pressure on any corrupt and oligarchic political system to stir the populace into armed rebellion.\n\nIts fundamentally unifying tenets are an inherent focus on the peasantry and rural areas over the traditional urban workers, armed struggle, internationalism, and a belief in revolutionary willpower - that any group of sufficiently motivated militants will find success. Guevarism has mostly found success in Latin America as the mainstream strand of leftist revolutionary thought, but it lacks a formal doctrine due to its internationalist nature, and in consequence, the many differences in thought within the organizations tied to the Junta."
 socialist_nasserism_subtype:0 "Nasserism"
 socialist_nasserism_subtype_desc:0 "To put it most simply and most incompletely, Nasserism is the ideology of Gamal Abdel Nasser. Like any ideology defined by the dictates of its founder, it is characterized by a certain level of flexibility and a lack of rigidness. However, in spite of this, Nasserism is characterized by three core principles.\n\nFirst is its Pan-Arabism, advocating for a union of Arab republics to secure itself across the Middle East to better protect against incursions from imperialist powers. Nasserism's flavor of Pan-Arabism is also characterized by its secular nature, often putting it into conflict with other grassroot ideologies in the region that are more colored by religious thought, whether it be Islamic, Christian or Jewish. Even if an Arab nation could not be formed, Nasser looks to aid and support the Arab world with only some regard to their own ideology, so as to protect the region as a whole.\n\nThe second is of course, its simultaneous embrace of socialism and rejection of communism. While self-described communists and their parties are suppressed as it is seen as being at odds with Arab tradition, they wholeheartedly embrace a fluid interpretation of Arab Socialism, most obviously manifesting in a generally anti-capitalist stance and the aggressive nationalization of Egypt's resources.\n\nThe third is Anti-Imperialism. One could even argue that the first two principles are merely a function of this third principle, when you get right down to it. Nasser's strong anti-imperialist stances are the core motivation for involvement outside of Egypt itself, as well as the populist rallying cry that lends the ideology most of its fervent support.\n\nBeyond these broad points, Nasserism is an ideology that has in of itself a great deal of leeway without an orthodoxy to limit its possible allegiances and shifts as the situation demands, whether for Egypt's sake, or Nasser's own."
 socialist_african_socialism_subtype:0 "African Socialism"
 socialist_african_socialism_subtype_desc:0 "They talk of the failure of socialism, but where is the success of capitalism in Africa? African Socialism is an ideology formed as a result of the sudden independence achieved by many former French and British colonies in the wake of the Second World War. Instead of following their former colonizers in pursuing a capitalist model, African Socialists sought out an ideology that was more afrocentric.\n\nThe main distinction between African Socialism and more classical strains of socialism is the focus on the sharing of economic resources in a traditional African way. Some African Socialists believe that Africa's background in tribal community life excludes the validity of the theory of class struggle, and makes socialism the natural way of life for African nations.\n\nWhile pan-Africanist, this form of African Socialism does not conform to the ideology adhered to by Cameroon. This form of African Socialism is much more grassroots and decentralized. Seeking a more moderate path, this strain of African Socialism seeks to respect local African traditions and structures. It is also not focused on expansionism, unlike the Cameroonian brand, although it is not necessarily opposed to violence."
 socialist_islamic_socialism_subtype:0 "Islamic Socialism"
 socialist_islamic_socialism_subtype_desc:0 ""Look at all religions. Look at Moses. Did Moses not rebel before three symbols? Korah, the greatest capitalist of his time. Balaam, the greatest priest of the deviated religion of multi-theism. And the Pharaoh, the greatest symbol of political power of his time. Did he not arise against the status quo?" - Ali Shariati\n\nThe rise of Islam represented the greatest political, social and economic revolution to have ever rocked the Arabian peninsula and the world at large. The self-serving and corrupt polytheism that came before it was uprooted from every crevice of Arabian society, and a new revolutionary order that promised a more egalitarian state of affairs and served to unify the disparate tribes of Arabia into one whole would come to be. And yet to many, among them, Abu Dhur al-Ghiffari, a companion of the prophet, the accumulation of wealth that followed the death of the Islamic Prophet was nothing but a bastardisation of Islamic doctrine and ideals.\n\nDrawing upon this analysis, the enshrined principle of Zakat and the revolutionary nature of the First Islamic State, the Islamic socialists - be they Sunnis or Shiites - aim to liberate the Ummah from the chains of capitalism and the reactionary culture of self-indulgence and exploitation that it perpetuates. And from upon the ruins of the capitalist system, the old Ummah will be morphed into a revolutionary, social and anti-colonial community that redistributes its wealth equitably, ensures that no one person is left hungry, unclothed or without shelter and that no toiler is left uncompensated for their labour."
 socialist_reformist_socialism_subtype:0 "Reformist Socialism"
 socialist_reformist_socialism_subtype_desc:0 "As much as the idealism of Socialism seeks to prosthelytize an egalitarian vision of humanity free from the shackles of capitalistic and demagogic imperialism, it is almost irrefutable that the first attempts to form Socialist societies were anything other than the product of violent extremism; between the sheer brutality of the Bolshevik Revolution, the vicious infighting that plagued the first Republic of China and the preeminent nightmare that arose from the Weimar Collapse, it is hard to find examples where global antipathy for social revolution is not tragically deserved.\n\nIt is from the failures of Lenin and Bukharin that Reformist Socialism began to form; born from moralistic revulsion at the authoritarian tendencies of mainstream Communism, seeking to abolish the paranoiac and autocratic methods associated with the former Soviet Union and their imitators, they firmly believe that a peaceful revolution and transition to an idyllic, egalitarian society and economy can, and should be accomplished through reform over revolution, and that through the popular support of the common people, the bloody beginnings of the Socialist Revolution can finally be redeemed."
