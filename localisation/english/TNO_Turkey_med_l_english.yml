 TUR_privatization_CHPvictory:0 "Privatization!"
 TUR_privatization_CHPvictory_desc:0 "It's no secret that the Turkish economy has been performing badly for some time. We face a currency crisis, trade embargoes from our enemies to the north and west, and an increasingly corrupt bureaucracy. Thankfully our current administration has made a brave decision to heal the neglect and foolishness of the past: do anything about it whatsoever.\n\nThe first step is a broad campaign to privatize inefficient state-owned enterprises. While this might be deeply unpopular with the many officials in our administration whose livelihoods depend on these institutions, we cannot allow a few corrupt pencil-pushers to impede the march of progress."
