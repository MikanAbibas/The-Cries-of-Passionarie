 TUR_koroglu_rides_alone_desc:0 ""
 TUR_barely_afloat:0 "Barely Afloat"
 TUR_barely_afloat_desc:0 "The Turkish nation is still in shellshock from the defeat of ITW and its new CHP leadership now have to face the imminent collapse of the Turkish economy as well as deep internal division amongst the CHP itself. The party is divided between the traditionalist authoritarian Kemalists of Nihat Erim and Bülent Ecevit's factions in favour of a state capitalistic, populist, pro-welfare regime. Not only is the CHP divided but its politicians also started migrating to other parties seeing the opportunity to leave a ship that is barely afloat."
 TUR_running_on_fumes:0 "Running on Fumes"
 TUR_running_on_fumes_desc:0 "As the saying goes "Where there is smoke, there's fire". Turkey has lost both their regional and international relevance after the disaster of the Triumvirate. While it used to be a founder of one of the world's biggest alliances it is now but a hollow shell of its former glory. Suspicion grows that some military cliques are being assembled behind the scenes to possibly push for a government change by force, one of those cliques seems to be none other than the Young Colonels Movement which is inspired by Egyptian political movements in terms of structure but more similar to the German Reich in terms of ideology."
 TUR_sinking_under:0 "Sinking Under"
 TUR_sinking_under_desc:0 "The economic trouble of the Turkish nation seem to meet no end. Japanese and American companies started pulling out of the country fearing for their interests, there are no jobs around and most companies in the country are at the brink of bankruptcy with the exception of the few state-owned companies. The government seems to have no choice but to enact a miraculous subsidization plan in an attempt to save them from doom and therefore provide the economy with a much-needed boost. Saving the economy is no easy task, but the government is determined to find a solution to the increasingly dramatic situation in which the country is. "
 TUR_a_worthless_desert:0 "A Worthless Desert"
 TUR_a_worthless_desert_desc:0 "The economic landscape around Turkey is comparable to a barren desert. Our options are limited but we can send a small team of officials to Central Asia to assess future economic opportunities. Countries such as Tajikistan and Kyrgyzstan can offer good alternatives to Syrian oil and offer cheap workforce for the Turkish state."
 TUR_bailing_out_businesses:0 "Bailing out Businesses"
 TUR_bailing_out_businesses_desc:0 "Supporting local economies is key for the economic recovery of the Turkish state. Every small business in the country is an opportunity for the economy to grow and recover. We need everyone to do their part, but they could use some help from the government to kick start their business. Bailing out these small economies is the next step towards economic recovery."
 TUR_government_funded_loans:0 "Government Funded Loans"
 TUR_government_funded_loans_desc:0 "A part of how an economy grows is by consumption going up. But no one can consume if they have no money, therefore a part of our plan to get our economy back up and running will be to give out loans at a zero percent interest. However, once those who take out those loans start earning enough money they will have to pay them back. The Turkish state is in dire need of economic recovery, hopefully this will be a small step towards it."
 TUR_what_lies_beneath:0 "What Lies Beneath?"
 TUR_what_lies_beneath_desc:0 "The oil in Southeast Anatolia is still mostly unexploited due to its relatively low quantity however in this time of crisis it is key to use every card that we have in our hand. The new oil fields might not rival those of Iraq or the Gulf but they will have to do for now."
 TUR_crime_rising:0 "Crime Rising"
 TUR_crime_rising_desc:0 "With inefficiency that plagues the security forces and the general paranoïa going around, crime rates are going through the roof. The people that find themselves with difficult economic situations are increasingly turning towards crime or black market trading which is therefore growing uncontrollably. The situation is starting to get out of the hands of the already agitated army and police of the Turkish state."
 TUR_black_market_trading:0 "Alternative Trading Methods"
 TUR_black_market_trading_desc:0 "The ineffectiveness of the Turkish security forces coupled with the sky-high crime rates have created a dangerous cocktail of circumstances in the country. Due to this alarming situation and the economy that doesn't seem to be getting any better black market trade is on the rise at an unprecedented rate. The black market is everywhere, at all times and accessible by everyone. This situation never seen before in the short life of the Turkish state poses a new challenge for the government."
 TUR_the_weak_perish:0 "The Weak Perish"
 TUR_the_weak_perish_desc:0 "We were very generous with our government funded loans, but sometimes generosity can bring its fair amount of problems. We have to decide what to do with the people that are unable to repay their loans and stay without a job. If they are unable to be useful members of society and contribute to the recovery of the Turkish state, we might have to take certain measures to make sure they are motivated to do so. "
 TUR_the_strong_thrive:0 "The Strong Thrive"
 TUR_the_strong_thrive_desc:0 "Some people have wisely used the money we have loaned them and multiplied their fortunes to the point that paying the loan back is simply a formality. In that case it is in the best interest of the state to raise interests for the people who made a substantial amount of money out of the government loans, in that way we keep inequality in check and fuel the government chests with money that the people do not need."
 TUR_bail_out_the_boat:0 "Bail out the Boat"
 TUR_bail_out_the_boat_desc:0 "It is now time to find out if our actions have worked. The new government measures have shown signs of success but we cannot be sure until we commission a proper report. The hopes of all Turkish people lie on this report as we will find out if our economy can still be saved, and with it the lives of all of our people."
 TUR_confidence_in_the_lira:0 "Confidence in the Lira"
 TUR_confidence_in_the_lira_desc:0 "Everyone knows the economic situation of the country is disastrous. No one can afford anything and getting even the most basic consumer products is starting to become a luxury. As part of the new governmental actions to reverse the alarming decay of the economy the government has decided to devalue the Lira, stimulating exports and favouring domestic businesses."
 TUR_everything_under_control:0 "Everything Under Control"
 TUR_everything_under_control_desc:0 "Desperate times require desperate measures. The all-time high crime rate will not stop if the Turkish government does not take action. The first step to get everything back under control will be to send the Republican Guard into the streets as an emergency police force to stop the rising criminality. It is a difficult measure but one that seems necessary."
 TUR_refill_the_gas:0 "Refill the Gas"
 TUR_refill_the_gas_desc:0 "In light of the recent paranoia amongst the Turkish officials the government has decided to order a report on the level of mistrust amongst its own ranks. This report is key in fixing the political instability of the country and the Turkish state has high hopes that it will help them find out if the problem is solvable or not, and if it is it should give indications of what steps have to be taken."
