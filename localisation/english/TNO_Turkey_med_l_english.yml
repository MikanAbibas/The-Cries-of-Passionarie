 TUR_national_act_of_luminosity: "National Act of Luminosity"
 TUR_national_act_of_luminosity_desc:0 "Secularism, democracy, and private property are all still enshrined in the constitution of Turkey. This is an absolute disgrace to our movement and must be the first thing we eliminate if we are to build our socialist utopia. Liberal democracy shall be replaced by a dictatorship of the proletariat. Property rights are to be abolished and all land shall fall under the control of the state. Atheism will destroy the forces of reaction that brought our nation to its knees.\n\nThe people's army shall paint the streets of Ankara red with the blood of the supporters of old. The old Turkey shall be entirely destroyed, with our vanguard rebuilding Turkey in the vision of §eMao Zedong§!. Soon, the Red Sun will illuminate every inch of our new nation."
 TUR_national_act_of_luminosity_tp:0 "A revolution is not a dinner party, or writing an essay, or painting a picture, or doing embroidery; it cannot be so refined, so leisurely and gentle, so temperate, kind, courteous, restrained and magnanimous. A revolution is an insurrection, an act of violence by which one class overthrows another.\n\n- §eMao Zedong§!, Report on an Investigation of the Peasant Movement in Hunan, 1927."
 TUR_national_act_of_patriotism: "National Act of Patriotism"
 TUR_national_act_of_patriotism_desc:0 "In the decrepit Turkey of old, your worth as a human was predefined by the race you came from. This insult to humanity was never once questioned, never once debated. In our new nation, this method of racial segregation must be demolished and prevented. Not only shall all men be treated as equal, but we shall also possess no favoritism in which race is promoted or demoted, hailed or shunned.\n\nFor the first time in history can a man stand up and be proud to be Turkish. Our nation will be a shining example of the success of not only socialism, but of §eMao Zedong§! Thought. Our people will be united as one, united to destroy the forces of reaction, united to liberate the world of capitalism, united under the Luminosity Movement."
 TUR_national_act_of_patriotism_tp:0 "The masses are the real heroes, while we ourselves are often childish and ignorant, and without this understanding it is impossible to acquire even the most rudimentary knowledge.\n\n- §eMao Zedong§!, Preface and Postscript to Rural Surveys, 1941."
 TUR_national_act_of_collectivism: "National Act of Collectivism"
 TUR_national_act_of_collectivism_tp:0 "The ruthless economic exploitation and political oppression of the peasants by the landlord class forced them into numerous uprisings against its rule... It was the class struggles of the peasants, the peasant uprisings and peasant wars that constituted the real motive force of historical development in Chinese feudal society.\n\n- §eMao Zedong§!, The Chinese Revolution and the Chinese Communist Party, 1939."
 TUR_on_the_edges_of_mountain: "On the Edges of Mountains"
 TUR_on_the_edges_of_mountain_desc:0 "Over the hill and under the mountain, that's where the people's army lays. We must never expose ourselves, never let our numbers be known. Our campaigns start in the countryside, we root out the forces of capitalism and imperialism, we go back into hiding. Slowly we will inch our way out from the mountains, into the forests, and then into the cities. We must surround the cities, and as Mao Zedong commanded, only then can we capture them.\n\nThis tactic is the bread and butter of our revolution, the basis of our People's War. We must recruit the agrarian peasants first, grow our numbers and strength, and only then can we strike at the heartland of the enemy. By following Mao Zedong's theories, and encircling the cities from the countryside, we will surely find success."
 TUR_on_the_edges_of_mountain_tp:0  "Classes struggle, some classes triumph, others are eliminated. Such is history; such is the history of civilization for thousands of years\n\n- §eMao Zedong§!, Cast Away Illusions, Prepare for Struggle, 1949."
 TUR_mao_lives_on: "Mao Lives On!"
 TUR_mao_lives_on_desc:0 "The nation we build today will be the guide for the nations of tomorrow. The guiding principles of Mao Zedong's Thought shall guide our nation from the dark and decrepit forces of reaction into the shining light of socialism. Soon there will be a day where every man, woman, and child need not know about the horrors of the past. Soon, Turkey will be reborn.\n\nMao Zedong lives on. Mao Zedong's Thought lives on. His immortal theories shine upon our nation today, forging a new and bright path. The people's army, under the political vanguard of the Luminosity Movement, has shown the world the light of the Red Sun."
 TUR_mao_lives_on_tp:0 "§ePolitical power grows out of the barrel of a gun.§!"
