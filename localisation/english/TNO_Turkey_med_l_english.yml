 tur.1.t:0 "Old Friends Make the Best Officers"
 tur.1.d:0 "The former Admiral looked out at the crowds of Istanbul and squinted, the sun beaming in his eyes. It was a hot day, and he could not recall the last time he had been awake as early as he was that morning. Even though President İnönü would be the only one speaking, the newly appointed Prime Minister Korutürk knew the spotlight was truly on him, as reporters clamoured to get a clear photo for their papers.\n\nHe had known it was coming for some time now, but Korutürk still had a little bit of difficulty accepting that he was going to be Prime Minister. He never would have believed it when he was a boy, or even when he had joined the navy so many years ago.\n\n"People of Turkey." The President spoke, his amplified voice cutting through the clamor. "I am here today to introduce to you your new Prime Minister, Fahri Korutürk. Mr. Korutürk is a proud veteran of the Turkish navy, having fought bravely for our country for years. He is also an accomplished diplomat and statesman, having served this administration ably since his retirement from the armed forces."\n\n"It is my hope that he will bring a new energy and passion to governance, and that he will, as he has always done, make Turkey a safer place for all of you to live." The President stepped away from the microphone, turning and offering his hand. The crowd burst into applause as Korutürk grasped it, giving a light handshake. İnönü smiled."
 tur.1.a:0 ""Congratulations, Mr. Prime Minister.""
 tur.2.t:0 "Special Warfare Department Reporting"
 tur.2.d:0 "Report Class: Top Secret\nLocation: Diyarbekir, Turkey\nSource: Field agents\n\nSummary: Officers of ÖHD-codenamed "Danishmend" and "Asena" -were inserted into Diyarbekir twenty-seven days ago as part of ongoing Counter-Guerilla efforts directed against Kurdish subversives, collectively known as "Operation Gladius." Agents were selected for political reliability, fluency in Kurdish language, and interrogation skills.\n\nAgents, in conjunction with military and local police, apprehended seventeen influential Kurdish politicians, seven belonging to the Kurdish National Resistance Party, six belonging to the Kurdish Communist Party, and four belonging to the Democratic Renewal Party. Upon capture, suspects were brought to (REDACTED) for interrogation.\n\nInterrogation consisted of simple questions, followed by alternating rounds of sleep deprivation, false firing squads, suffocation and resuscitation, and a new method of electric shock torture developed by the Iberians known as the "parrilla." Interrogation proved moderately successful: only two suspects were unintentionally terminated, and all suspects provided information on Kurdish resistance groups and political organization, as well as methods of funding and supply. Upon conclusion of interrogation, suspects were terminated and remains successfully hidden. Agents remained at Diyarbakir at safehouse (REDACTED) upon completion of mission, and await further instruction.\n\nConclusion: With termination of key figures in Kurdish nationalist and communist movements, a pause in insurgent activity can be expected, though reprisals against security forces are likely. The revelation of supply and funding sources for Kurdish insurgents allows security forces to disrupt their operations, limiting potential effects of retaliation. Recommend keeping Danishmend and Asena in field to aid in further Counter-Guerilla operations, and await approval of Operation Windswept, as detailed in Document (REDACTED).\n\nReport end."
 tur.2.a:0 "Authorization Granted. Commence Windswept."
 tur.3.t:0 "MIT Reporting"
 tur.3.d:0 "Summary of Collected Reports: The situation in Italy is likely to remain stable for the immediate future. However, Ciano's regime exhibits signs of impending trouble both internally and externally, which we expect to come to a head within eighteen months.\n\nInternal Situation: Galeazzo Ciano and the Partito Nazionale Fascista remain in control of Italy, with limited terrorist activity from left-wing movements that have support in the countryside. Domestic opposition is extensive, primarily from influential organizations such as the Catholic church that do not fall under the purview of the government. The monarchy has made no indications of who they will support and it is expected that they will follow whichever movement seems most likely to obtain power.\n\nThe PNF itself is also showing signs of a divide between the duce and several of his subordinates, primarily a clique of hardliners led by PNF Secretary Alessandro Pavolini and former colonial governor Italo Balbo. These individuals have objected to what they see as a dilution of their political principles in response to the economic distress brought on by Atlantropa, and may begin fomenting further opposition to Ciano.\n\nExternal Situation: The Triumvirate is a precarious alliance, and the German decline has made it more so; disputes at meetings between our ambassadors are becoming more common. Assets embedded in the city of Alger report increasing tensions between the occupied zones of our allies, and the border skirmishes risk escalating into a larger scale conflict. Our own grievances regarding the Levant should be familiar to the reader.\n\nRecommendations: An end to the alliance would not be unexpected, but it would greatly weaken the position we stand in and open the possibility of a potential conflict on our southern border. Such a conflict must be conducted on our own terms, lest we suffer the consequences of defeat. Ciano does appear to be the least revanchist of any potential successors, and it is recommended the government support him while attempting to gain concessions including, but not limited to, free use of the Suez Canal, contracts to receive modern military equipment, and greater efforts by the Italians to pacify seperatist groups on our southeastern border."
 tur.3.a:0 "Delivered to Çankaya Mansion, [GetDate]."
 tur.5.t:0 "Roman Nights"
 tur.5.d:0 "Fahri Korutürk, newly christened Prime Minister of Turkey, and longtime associate of the Triumvirate arrived in Rome a little after dark. It had been a long and hard journey, but one he would have to make himself familiar with, willingly or otherwise.\n\nSurrounded by a convoy of assistants, he arrived at his hotel. Pleasant, but Korutürk knew wasn't the best -  Not that he was complaining about it, he just wanted some sleep, and, if he could, a moment alone with his thoughts.\n\nBy the time he had reasonably unpacked, and was in something resembling his night-time wear, he heard his suite phone ring. It had been set up days prior, the hotel manager told him, so that any in the Italian diplomatic core could call him when they pleased. Wonderful, Korutürk thought, another reminder of his lack of privacy. Reaching over, he cleared his throat and placed the receiver to his ear. Listening in as the operator directed him to the Foreign Minister, they exchanged pleasantries that, in an ideal world, Korutürk would have avoided, and then got down to business.\n\nIt was half an hour later that he could quietly smoke, by himself. In front of him was the ocean, its soft splashes soothing his splitting headache. Or perhaps it was the nicotine. He didn't know.\n\nThe Minister had said many kind, pleasant words, but underneath it was the same Italy. A refusal to acknowledge the problems inherent to the Triumvirate. Yes, it was fine for Italy to have her day in the sun, did she have to keep Turkey in her wide shadow? Korutürk laughed bitterly, and reached for another cigarette. He wouldn't have a lot of time to smoke during his visit, and thought it best to enjoy it while he could."
 tur.5.a:0 "A thousand mile journey begins with a step."
 tur.6.t:0 "Rapsodica Anatolica"
 tur.6.d:0 "The President's Office was spotless, save for the pile of books, letters, and paperwork that occupied every inch of the grand desk that İsmet İnönü now sat behind. Clearly immersed in crafting a letter in his own hand, he looked almost irritated when Mehmet Fuat Doğu, head of the ÖHD, stepped in with a curt greeting.\n\nLifting his head in an utterly blank expression (if a scowl was ever blank) he motioned for the old soldier to take a seat. "I presume you know why I brought you here, Doğu?"\n\nA nod.\n\n"Very well. I have decided to forward the creation of a new Organ of state security. You are a soldier; you are experienced. I respect that. You are to be elevated to lead our new National Security Agency, am I understood?"\n\nA nod.\n\n"Good man. As you no doubt know, your new position will be crucial to the State. The ÖHD and the MİT both will be under your jurisdiction. Our Republic, which you and I helped build, faces disaster and treachery both. It will be your task to prevent the former and crackdown on the latter. I am not very fond of Germans, but I have heard of your familiarity with their ways. Herr Gehlen's methods, all of them, will be put to the service of our State." Pausing to emphasize the weight of his words, he carried on shortly. "No matter how far they go, only I myself hold the authority to prevent the NSA from carrying out its functions. This is a power I do not wish to resort to. Understood?"\n\nA nod, and a military salute. At the latter, the President almost grinned. A faint, muted thing, but it almost occurred. In his years of training, Doğu had learned to pick up on these subtle hints. It was they that betrayed when a man might break. By now the Chief had returned to his letter and Doğu was soon back to the wide corridors of the presidential palace. If a soldier might weep, he would have wept there. The Agency was been a dream of his ever since he first stepped foot in Berlin."
 tur.6.a:0 "And the worst of dreams often come true."
 tur.7.t:0 "Promising Youth"
 tur.7.d:0 "Excerpt from a moderately popular Istanbulite youth Magazine:\n\nAlthough it had modernized enormously over the past few decades, Turkey is still a traditionalist country. In terms of pop culture, we lag years behind the trendsetters in New York, Rome, and Tokyo. Even so, and even in the face of the border restrictions that have popped up postwar, bits and pieces of music, art, and cinema trickle into the country from all over the world. Turkey's new middle class ravenously consumes the western media it can get, but even that hasn't satisfied it. A new generation of artists is taking foreign styles and adapting them to Turkish tastes with wild success.\n\nIstanbul's Barış Manço, a nineteen year-old student, has recently released a new album with his band Harmoniler, combining American-styled rock and roll with traditional Turkish influences to create a style that is completely his own. Manço's songs are spreading like wildfire among the youth, with his signature hit "Twistin' USA'' attracting a particularly broad appeal. America's modernity, liberal values, and dazzling cultural scene have made it the darling of middle-class youth; by listening to Harmoniler's songs, they can bring a little piece of America into their everyday lives. These same values have made enemies in more old-fashioned areas of our society, who warn that western social_liberal poses a severe threat to Turkish and Islamic culture.\n\nAlthough new music is always controversial, enthusiasts and haters of the rising popularity of rock and roll can agree on one thing: Barış Manço isn't going away anytime soon. If he keeps it up, he may just be world famous."
 tur.7.a:0 "It's quite catchy!"
 tur.8.t:0 "What You've Done to Me!"
 tur.8.d:0 "He was on leave from the army for the week and a night of drinking was just the thing he needed to turn in his mind the events of the past six months. The cool breeze of Istanbul made an easy acquaintance, and bid their silent farewells at the last turn to Beşiktaş, an old district of the city.\n\nThe bar was small, family-owned. Stuffing his hands into dark pockets, he extracted a handful of liras and gently laid them down on the counter. Just enough for a glass of cold Raqi. The bartender understood, paper sufficed in place of pained conversation.\n\n"I stole your sweet little kisses, that's what I've done - to - you!"\n\nAn English song played distantly from some radio as he settled into an aloof corner, letting the cool drink took him far, far away. He was back in the fields of Mersin, with his Halime. Her smile was the most beautiful thing, and that day she grinned from ear to ear when she was told that he would be leaving for the front. Come back to me, she only asked, but now he could see the tears that stained her eyes, the sorrows of separation.\n\n"You've gone and left me sadness, that's what you've done - to - me!"\n\nThe cancer took her two weeks before he returned. At the front, he had emptied his veins into the soil of the homeland, for the glory of nation. He fought, tooth and nail and fucking all against the invaders. He fought with his brothers, and each was now in a ditch six feet under. And they were not the only ones, for one could not love his own without hating the other. His hatred was a putrid color, not so far from the drink that he held in his hands. He had killed and he had tortured, and he had lived out the very definition of hatred in his orders. Against enemies, prisoners, and perhaps on the innocent too. He steps out of the Bar.\n\n"I never will forget what you've done - to - me!""
 tur.8.a:0 "But better to leave such sad thoughts behind."
 tur.9.t:0 "A Nation is Awakening"
 tur.9.a:0 "A true masterpiece!"
 tur.10.t:0 "In The Halls Of Çankaya Mansion"
 tur.10.d:0 "President İnönü was discussing with generals Gürsel and Erdelhun over strategies and attack plans as they walked through the halls of Çankaya Mansion. As they were debating over the pros and cons of each operation, the discussion came to an impasse. Was it better to take advantage of the instability over the Levant and attack there, or try an invasion through northern Greece? What about the island of Rhodes, I think we should... This back and forth confused İnönü, who zoned out of the conversation.\n\nIt was then that he saw two magnificent paintings hanging in the hall, representing two great sultans of the Ottoman Empire: Suleiman the Great and Selim the Resolute. Both of them made the Empire great in different ways: Suleiman led the Turks through Europe and brought terror on the Christians behind the walls of Wien; while Selim took the holy city of Kudüs. It was then that İnönü realized that arguing over the minutiae of strategy was pointless: the war against Italy will be a holy war against imperialism as the Turkish nation, led in spirit by the great Sultans of the past, will regain its place in greatness. With that in mind, the only thing left to decide was the battlefield where Turkey will find her glory.\n\n"Gentlemen" said İnönü as the generals stopped their discussion, "We cannot keep arguing forever, not while glory awaits us." With a short pause, İnönü drew his breath and said..."
 tur.10.a:0 ""Suleiman will inspire us as we march through Greece.""
 tur.10.b:0 ""Selim's spirit will lead us to Kudüs.""
 tur.11.t:0 "The Two Admirals"
 tur.11.d:0 "Deep within the heart of the German Reich, Prime Minister Fahri Koruturk sat in a small office in the depths of the Volkshall waiting to begin his meeting with his German counterpart. He analyzed room's decor, finding it rather spartan for an office of a high ranking member of the party. He would have thought it empty were it not for the trio of scale models, the old naval ensign, and a portrait of the Führer that decorated the wall. That, and the mountain of paperwork that had built up on the desk.\n\nFahri arrived in Germania three days ago, and had been met with a single party functionary who led him to the consulate. He had spent most of the past day trying to get a hold of someone in the foreign office to meet with him, and he had finally managed to arrange a meeting with a member of the German government.\n\nThe door opened and he stood as his counterpart entered the room. "Herr Dönitz, it is an honor to finally meet you," he said as the old admiral walked into the room.\n\n"Herr Kortürk, it is a pleasure. I must apologize for the delay. Things in Germania have been rather hectic of late."\n\nThey took their seats before Koruturk spoke up again, "I understand, Herr Dönitz. It seems as though things are hectic everywhere these days. Now, I would like to get straight to business. I have come to help restore the frayed relations between our two nations. I have also been given a wide reach to ensure I leave this city having rekindled the brotherhood between Germania and Ankara," he was laying it on a bit thick, but the situation in Turkey was less than ideal and the Reich would be an integral part of their future.\n\n"Well, Herr Kortürk, I am sure we can come to an agreement acceptable to both of our governments." The two men would spend the rest of the day hashing out an agreement that would be agreeable among the German and Turkish governments, while reminiscing about their times in their navies. When he left for Istanbul the next day, he did so with a new treaty and a new friendship."
 tur.11.a:0 ""Europe will not intervene.""
 tur.12.t:0 "Once You Have Tasted Flight."
 tur.12.d:0 "A clear sky greeted Şenay Günay one the day of her interview. A sparse few clouds lined the pale blue heavens, leaving them ideally bright and clear for bomber's eye. The southern Anatolian breeze was plentiful, in short, the day was going to be a good one. She had been selected, the only one in her platoon, for an interview with Turkey's one and only television broadcast channel - TRT had singalled her out for an Interview, and her entire family was ecstatic. She could not let them down.\n\nWhen the modest News team finally arrived, things went along swimmingly. The host introduced herself as Esra Dereli, TRT, (As though there were any other channels for her to work under) and immediately got to work.\n\n"So, Şenay, tell us what it's like!"\n\n"I arrived in the force earlier this year, after passing the necessary six month training, and it has been wonderful. There's nothing quite like being up there by yourself. The entire troop is one of the most committed and patriotic groups I've ever had the honor of flying with." She began, a well-rehearsed and sufficiently patriotic opening. Esra Dereli was happy enough with it, and moved right on.\n\n"Scouting enemy positions, highlighting targets, and then going down for the bombing runs. It's every bit as exhilarating as I imagined it would be." She added with a slight pause, facade mominartly letting down.\n\n"What does a bombing run entail?"\n\n"Once we have a position command that wants us to bomb, we do so. Enemy troops, bases, sometimes supply depots, sometimes cities. Often enough its easy. Simple. Just hit 3,000 feet and let it rain. Only sometimes-" Eager for a hint of drama, the interviewer egged her on.\n\n"Only sometimes?"\n\n"Only sometimes it can get tiring. Sometimes - I can hear the screams. From 3,000 feet up in the air, I hear them shouting. It shouldn't be possible but, nonetheless, I- This isn't live, is it?""
 tur.12.a:0 "The future is in the skies, once said Ataturk."
 tur.13.t:0 "Hopes for Peace"
 tur.13.d:0 "Prime Minister Fahri Koruturk stood outside the legislature of the Turkish government and mentally prepared himself for his speech. Tensions between the member-states of the Triumvirate were coming to a head and it was important for the people of Turkey to be assured that things would not deteriorate further. Their allies in Iberia and Italy were also beginning to doubt Turkey's commitment to the alliance and could use reassuring. \n\nHe looked out over the crowd of reporters from each of the Triumvirate nations, along with foreign reporters from all over the world, and spoke, "A good day to you all. I have come before you to outline our continued commitment to our allies in the Triumvirate. For too long, a rift has been allowed to grow between us and our allies, a rift that has brought with it all too much strife and discord. In the interest of mending this rift the Turkish government will be going forward with plans for closer ties to our brothers in Italy and Iberia. Our continued commitment to the ideals of the Triumvirate is immutable. In the coming days, we will coordinate with our counterparts to ensure the unity of the Triumvirate and the continued prosperity of ourselves and our allies. Thank you." \n\nWhat followed was a flurry of questions from the press, largely concerned with the upcoming Malta Conference and the stance of the government going into the event.  The Prime Minister answered each with the grace of a career politician and left the members of the press satisfied. \n\nYet, despite it all, he could not help but worry about the future for his nation. The tensions in the government and between the faction members were much worse than he had let on."
 tur.13.a:0 "Can their hope be vindicated?"
 tur.14.t:0 "A Quiet Place"
 tur.14.d:0 "Silas felt like very little made sense anymore. He didn't completely understand why war was happening, but a dark cloud hung over all of them. If the Italians and Turks were at war, Greece would almost certainly also join. There were worried talks about what would happen to Cyprus, and if it would come under occupation by one side or another.\n\nWhile his parents had tried to reassure him, he wasn't blind. He saw the men carrying guns, and heard them privately preparing to put down the Turkish minority on the island. Overhearing their plans one night, he knew he had to do something. Silas knew that the Turks weren't all bad, and there one in particular he needed to see. He'd managed to excuse himself for the day, and had quickly gone to their special place.\n\nIt had once been a park, but had long since been abandoned as nature reclaimed the benches and rusted swings. It was peaceful, tranquil, and private. He waited for long minutes, wondering if she'd be able to make it. His fears melted in a rush of relief when she finally appeared. Ari lit up as she saw him, and he did when he saw her. Both tightly embraced, the first time since everything had been turned upside-down.\n\nThere was a brief shared kiss, yet they simply stood there minutes just holding each other, anchors for each other in a world with quicksand under their feet. "How much time do you have?" She asked him quietly.\n\n"I've got the day," he said. "They won't expect me back until late. Listen, the men."\n\nShe shuddered against him. "I know. We know. We're planning to leave. It's not safe anymore."\n\nWhile it hurt, he was relieved that he wouldn't have to convince her. Yet this might be the last time they spoke for a long time."Then we shouldn't waste it." And waste it they did not, and it was hours with reminiscence, laughter, and love as the two adolescents found some peace and privacy.\n\nPeace that was not to last, as hours later, they heard the awful sounds both recognized, but had hoped would never come to them. The low whirring of helicopters, many of them, which were becoming progressively louder. Silas didn't know where they'd come from, and hand-in-hand with Ari, they watched them come close.\n\nBe they Italian, Greek, or Turkish, the undeniable reality settled on Silas."
 tur.14.a:0 "The war had come to Cyprus."
 tur.15.t:0 "Eyes of Fury"
 tur.15.d:0 "The path was one Yoruc rode every day to work that wasn't glamorous, but honest. It gave enough to support his family, and that was important now more than ever after war had erupted following the bombing by the Italians. The war was the dominating topic of the yörük tribes, but news from the front was scarce. Some of them had gone off to join, his brother among them, and while he wrote occasionally, it was infrequent. The war had disrupted the tranquility of the villages all the same. It was now normal for Turkish soldiers to briefly stop for supplies, or to ride past armored cars on his daily trek between villages.\n\nSomething caught his eye. The tracks in the dirt were fresh - a convoy had gone through here recently. They'd never come this late. With a growing sense of unease, he kicked his horse into a gallop and soon his home came into view. As he had feared - there were military vehicles parked in front of his home. His heart rapidly beating, he felt cold as he saw the Turkish officer before his family.\n\nThe scene told the story. His mother sobbing as his father held her tightly. His sister holding her head in her hands, making no effort to silence her crying, and his baby brother standing mutely, knowing something was wrong but unable to speak. The officer wasted no time. "I am sorry to inform you that your brother has perished in battle," there was a brief, apologetic pause. "He died bravely, and he rests in Paradise."\n\nYoruc registered the words numbly, as he surreally saw the coffin resting in the vehicle the soldiers had come in. The man's eyes held sympathy, that of a man who'd had to share news of the martyrdom of many sons with their families many times. A welling sense of anger and fury built up in Yoruc, inflamed by grief. This would not go unanswered. Service was not something he had considered before, but the war that had seemed so far away had come - and the Italians had to pay from what they'd taken from him.\n\nWith his eyes filled not with tears, but righteous fury, he looked the officer in the eye. His voice was steady, and his mind clear. He oddly felt no sense of uncertainty. This was what he needed to do, this was how his brother would be avenged and he did not hesitate when he made his demand."
 tur.15.a:0 ""Give me a rifle. I want to fight.""
 tur.16.t:0 "Meditations at Sunset"
 tur.16.d:0 "As the evening train made its way to Damascus, the soldiers on board had already retired to their bunks, awaiting their destiny come the morning. With one exception. At the foot of his bunk, Private Dimitrios Arhondonis, or Deacon Bartholemew as he preferred to be called, knelt in supplication. After silently muttering his evening prayers, words he knew by heart, he spent a moment, already having doubts. Was it truly meet for him to have accepted his service, to embark on a mission against the Italians that would surely result in him shedding the blood of another? He was a conscript, yes, but if he wanted to avoid the war, he could have declared himself a conscientious objector. Given his ordination in the Church, the authorities would have understood. But instead, he found himself heading towards the frontlines, not knowing if these days would be his last on Earth.\n\nUnlike most Greeks remaining in Turkey, the Deacon considered himself a patriot. After all, had the Ecumenical Patriarch not appointed the Ottoman Sultans as the legitimate inheritors of Rome, and the stewards of Eastern Orthodoxy? Greeks and Turks had been brothers for centuries, and it was not his place to question this arrangement.\n\nBartholemew also understood that for the past two decades, it had been Western Christians who had proven the greatest enemy of the One True Church. Was it not the Italians who marched into Greece and Serbia without provocation, placing them under their dominion? Was it not the Germans who had laid waste to Russia, to Ukraine and Belarus, shackling untold millions? By opposing the Italian Empire and their despicable fascist ideology, Turkey was doing God's work.\n\nThe Deacon started to pray again. He invoked St. Michael, patron of soldiers, begging him to intercede for the Turkish Army. he prayed for the souls of his comrades, that God would steel their hearts and bring salvation on those who would perish. Finally, he prayed for deliverance for the millions suffering under the Italian Empire's jackboot, and for the salvation of the Holy Land. Once his vigil was over, the Deacon returned to his bed, his resolve strengthened."
 tur.16.a:0 "They'd come to bring not peace, but a sword."
 tur.17.t:0 "Evening in Elazıg"
 tur.17.d:0 "The posters came up almost overnight, across marketplaces, apartment buildings, schools, everywhere. "Beware the Italian Agents!" one read, with a Roman eagle over a collection of crude caricatures of Kurds, Armenians, and Greeks. Another showed a heroic figure of Alp Arslan fighting the Byzantine emperor Romanos IV, alongside a Turkish soldier fighting an obvious Greek stereotype. "We drove them back once, we shall do so again!" it read.\n\nElazığ was primarily Kurdish. Few in the local community would post such propaganda. It didn't take long for people to put two and two together; Ankara had long stoked ethnic tensions in order to drive people toward its policy objectives, and it looked like this was one such instance. Parents went to the schools to usher their children home early, friends who had planned a night's excursion found them suddenly cancelled. They all knew what was coming next. No one wanted to be outside for what was about to happen.\n\nCurfew was suddenly announced by the local authorities an hour before sunset. Police officers patrolled the streets, finding any Kurd still outside and beating them relentlessly, or shoving them into the back of police cars. Occasionally, a group of civilians would disappear as men in unmarked vans grabbed them, driving them off to parts unknown, never to be seen again. The ones inside listened in silence to the sounds of screaming, truncheons hitting flesh, and cars pulling off into the night."
 tur.17.a:0 "And when dawn came, no one said a word."
 tur.18.t:0 "Daybreak in Diyarbekir"
 tur.18.d:0 "Ameda was crying in the small interrogation room. They'd gone out past the curfew, but they'd expected local police, people they could cajole. But a van had come out of the night, throwing bags over their heads and shoving them into the back. Where was he? Who were these people? What did they want with him? He had to stop himself from hyperventilating. He was better than this. He...had to be better than this.\n\nA man entered, wearing aviators and military fatigues. He took the opposite chair and sat down, spreading papers in front of him before withdrawing Ameda's wallet. He opened it, and pulled out a picture of Ameda's mother. The man looked it over. "Your mother?" Ameda nodded. "She's pretty for a Kurd. I can see where you get your looks." He sighed. "OK kid. I'm going to level with you. Merxas and Helin already confessed. They named you as the ringleader." Ameda tried to speak but was cut off. "Now listen, kid. I don't believe them. You strike me as a decent young man. Good grades, an aptitude for Turkish language class, you seem like just a child who got caught up with the wrong people. The others? They all seem like troublemakers to me. Merxas and Rodja had copies of Marx on them. You?" He sat back. "You don't belong here."\n\nAmeda was sobbing. "They're my friends..." he said through tears.\n\n"You need better friends. Sign this," the agent reassured him, pushing a confession and a pen toward Ameda. Ameda stared at it, shaking his head. The agent sighed and took off his aviators. "Your mother's pretty. Shame what might happen if we brought her in here. You hear stories, don't you?" Ameda gulped. Not his mother, his only parent left...\n\nHe quickly signed the confession. The agent looked at it and chuckled. "Heh. Too easy." He put on his aviators and stepped toward the door. "You fucking rat. First to confess. Don't worry, your friends will see you before you all go." Ameda stopped crying. His mind raced, running through the horrors his friends and family would go through, all because of his signature."
 tur.18.a:0 "What have I done?"
 tur.19.t:0 "Death of a Romantic Socialist"
 tur.19.d:0 "On [GetDateText] Nazim Hikmet, the poet, the romantic, the socialist, the dreamer, died. He had picked up the mail that morning, gone home, and at his home he had his final cup of tea, and died of a heart attack, being found two hours later by the EAM members who had been hiding him.\n\nThose who had found him had not the capability to describe his absence, that Hikmet sized hole in the world. He would have had a word for it, that poet whose words of beauty were fueled by years of despair, of oppression, of having to flee a world not so kind to the kind. His tribute was wordless; one EAM man, Alexander, a young romanticist who looked up to Nazim, who adored his morning chats, who knew more of him than the rest, still had not the way with words to give him a proper goodbye; thus, he lifted a single red rose from Nazim's garden, and let it soar in the wind, its wings of air to carry it as far as that emotion of Hikmet's works. Tears rolled down his cheek as he saw it fly away, knowing the freedom that Nazim died before knowing, the freedom all the world deserved, and that all living things yearned for.\n\nThere would be those who would be happy of the demise of Nazim. His words of love were a threat to the power of those who did not hold such feelings in their heart. He had fled as many times as he had written a poem, so many flights on the wind, so many words lost.\n\nHis life's ending was melancholy. He died not a failed man, having been surrounded by those who loved his work, kindred souls, lives drenched in enough misery to properly relate to such a man. Yet he died. And he will never be back, nor will there be another of his work."
 tur.19.a:0 "My heart still beats with the most distant stars."
 tur.20.t:0 "An Auspicious Meeting"
 tur.20.d:0 "Outside, the sun was setting - not that any man inside the dimly lit meeting hall knew or cared. They had been guests of one of the Çankaya Mansion's spacious meeting rooms for more hours than one could count on two hands, and escape was not likely. The President had called yet another emergency meeting.\n\nHow he did not tire from these, no one knew. Though, if the man himself was asked, he would most likely make a grandeur reference to the fact that one could never tire when serving one's country. Nonetheless, the hours passed by and a dozen-odd men handpicked by President İnönü spent them hunched over a map of the Republic and her neighbors. In a single, pale shade of green, the Italian Empire stretched to envelope Ankara from nearly every direction.\n\nRome's relationship with Turkey was always uneasy, even with Mussolini in charge. Geography, politics, and the ideologies of the two states conspired to pit them against one another time and time again. With the victorious Reich pressing down on both in equal parts, the tensions only grew as each nation looked to secure land and resources away from Germania's envious glare.\n\nOn the homefront, things were not looking up either. A stagnating economy following Atlantropa, yet another gift from Germania, left Turkey stranded without hope of salvation. The Empire they had won in the War only further strained the State's resources. Stretches of harrowing desert and ungrateful natives. It was under these circumstances that the Triumvirate was created, considerably eased by the personal friendship between the President of Turkey and the Duce of the Italy, one that now lie in the latter's grave.\n\nSoon enough, it was nighttime, and even İnönü 's restless eyes gave way to signs of slumber. The one conclusion that his cabinet emerged with was not new, but it was convincing. Victory - that which the Republic was borne out of - was what it now needed. Victory at all costs, and victory on all fronts, to rid the nation of its ills and raise its people's spirits."
 tur.20.a:0 "Victory is the order of the day."
 tur.21.t:0 "Insight from an old Friend"
 tur.21.d:0 "The President's office was just as he remembered it from all those years ago. Even in his relatively old age (something he would never admit, even as the president neared 80), İnönü's vigor had not subsided. Firm, driven, and meticulous as ever, the mosaic of letters and government communiques that enveloped his desk was more bustling than Prime Minister Kortürk remembered.\n\n"Welcome, Fahri." The celebratory tone was long gone by now. Putting away his spectacles and giving the Prime Minister a hard look, as if sensing the man's doubts about his age, İnönü proceeded quickly, his tone brief and deliberate.\n\n"You of all people realize just how far the Republic's position has deteriorated following the war. If only we were back in Atatürk's day, where a smile and a scapegoat were all the party needed to dispel the people's doubts, But alas..." Recalling Mustafa Kemal's time was not something he did often, and Korutürk considered it a telling sign of their intimacy. "Alas, we can only march towards his noble aims with the tools of our own time, no matter how few and faulty they may prove to be."\n\n"Of course, Mister President, the nation needs it now more than ever." Kortürk reciprocated, nodding.\n\n"So it does. I have high hopes for your premiership, Korutürk. It needs to be a time of hope - and change. I do not enjoy the luxury of shuffling in a new cabinet every month; Your selection was a deliberate decision. The people demand victories, both abroad and at home, you will deliver these."\n\n"I hope to, Mister President."\n\n"I am certain that you will, Prime Minister." Finally satisfied, the President motioned for him to make his exit. In the marbled hallways of the Çankaya Mansion, the true weight of the job made itself known to the new Prime Minister."
 tur.21.a:0 "But duty was oftentimes a burden."
 tur.22.t:0 "A Less Suspicious Meeting."
 tur.22.d:0 "The President was late. It was not in his nature to be so, and so none had expected it. Stuck sitting elbow to elbow within the all-too-familiar meeting chamber, Four members of the President's cabinet eyed each other, the walls, and even the ceiling, all to no avail. The President was late, and they were left to their own devices. Naturally, they started to discuss the agenda: Turkey's role within the Triumvirate.\n\nAt first, it was Ferit Melen, minister of the Economy, who ended a short and improved address with the fact that "The Italians are tying a bloody noose around our necks. The Suez is our only path to the world at large, and they choose to be possessive when it comes to granting Turkish trade the leeway it so desperately means. Were it up to me, we'd be sending a damn list of demands instead of sitting here and twiddling our thumbs!"\n\nMelen's rebuttal was as charged as his opening, and the debate began at once. Prime Minister Korutürk now stepped in. Not supporting Melen's stance but actively denouncing Cemal's 'lack of vigor.' The triumvirate was a balancing act, he said, but one weighted against Turkey's favor.\n\nAnd so, the game of musical chairs carried on for hours between the members of the President's cabinet. Melen on the offensive, Cemal urging caution, Korutürk trying to see the best in both, and Cemal Gürsel acting as the occasional voice of reason. One that preferred to wait for the President's very much delayed arrival. By afternoon, the cabinet was effectively drafting a legal denunciation of the Italian empire, all but threatening to unilaterally withdraw from the Triumvirate. Then the President arrived. Held up by 'a minor malaise' and positively furious at every member of his cabinet. The air of tension condensed into waves of indignation in Inonu's voice as he - tone as deliberate as ever - denounced the stupidity of such a rash decision. Italy would have to be handled otherwise."
 tur.22.a:0 "The best-laid plans..."
 tur.23.t:0 "Whispers on the Wind, Eyes in the Dark"
 tur.23.d:0 "Ameda hunched his shoulders against the chill as the wind whistled through the cramped streets of Sur, in Diyarbekir, carrying the names of the Kurdish boy's friends to his ears as it swept by around him. Jiyan, the wind whispered, Merxas, Şiwan, Rojda, Helin. Ameda had not heard anything from his closest friends since the ÖHD officers had seized them off the streets not two days ago. In his dreams, the boy imagined their agonized screams, and they declared him a coward, a traitor to their companionship.\n\nBlinking away sudden tears, Ameda realized that he had stopped in the middle of the road, pedestrians cursing as they shouldered past his immobile form. Taking a few moments to steady himself, he continued on his way home, the sounds of the night echoing mournfully around him.\n\nAt last reaching his small house, Ameda pushed open the door, careful to not let it creak. "Dayê," he called out, stepping into the cramped entryway, "I'm home."\n\nAppearing from around a corner, his mother embraced him. "You're late," she chided. She turned, leading him towards their little kitchen. "You've missed supper. Come, sit down, let me fix you up some of what was left."\n\nSettling in at the kitchen table, Ameda sat alone with his thoughts for a moment. "Do you ever get the feeling that you're being watched?" he called out, trying desperately to distract himself.\n\n"What are you talking about?" his mother called back.\n\n"It's just," he started, taking a moment to collect his thoughts. "At the market today, I got the strangest feeling that someone was watching me, like something crawling up my back."\n\n"Maybe it's the Prophet keeping an eye on you," his mother chuckled, bringing him a small bowl of soup, "You're too paranoid, Ameda. No one is taking time out of their days to keep an eye on you.""
 tur.23.a:0 ""Now hurry up and eat, before your food gets cold!""
 tur.24.t:0 "An Agha's Fealty"
 tur.24.d:0 "It was high noon in the village when the overseer rang his bell, signaling the beginning of lunch break. Eylo Berivan walked through the rows of still-sprouting wheat, seeking shelter from the overpowering Sun in the village. Upon entering, he ducked into a shaded alleyway, a place where he could gather his thoughts. He took a cigarette out of his pocket, lit it, and laid back as he inhaled.\n\nWith the scarcity of rain that had plagued the village for the last few weeks, this year's harvest would not be a good one. Of course, the agha that employed him would not care. Already, he had ordered his men to work extended shifts, as if he could compel the heavens to bring rain through the crack of his whip. He didn't know any other way to solve his problems. Eylo's father had learned this lesson when he had dared to ask for shorter hours and the agha had beaten him with his cane so hard that he died from his wounds a day later. Eylo's mother had learned this lesson when the agha left her with a black eye for daring to reject his advances. Once, Eylo had dreamed of avenging his family, but now, he was resigned to servitude.\n\nA shout from one of the boys in the village took Eylo from his thoughts. Dropping his cigarette, he rushed to the square in front of the agha's manor to investigate. The child was a newspaper seller, announcing the news on the front page. Eylo's ears could only pay attention to one sentence:\n\n\"The government has agreed to give rights to our dear agha!"
 tur.24.a:0 ""As long as Abdi Agha lives..""
 tur.25.t:0 "An Agha's End"
 tur.25.d:0 "It was high noon in the village when the overseer rang his bell, signaling the beginning of lunch break. Eylo Berivan walked through the rows of still-sprouting wheat, seeking shelter from the overpowering countryside sun. Upon entering, he ducked into a shaded alleyway, a place where he could gather his thoughts. Taking a cigarette out of his pocket, he lit it, and laid back as he inhaled.\n\nWith the scarcity of rain that had plagued the village for the last few weeks, this year's harvest would not be a good one. Of course, the agha that employed him would not care. Already, he had ordered his men to work extended shifts, as if he could compel the heavens to bring rain through the crack of his whip. He didn't know any other way to solve his problems. Eylo's father had learned this lesson when he had dared to ask for shorter hours and the agha had beaten him with his cane so hard that he died from his wounds a day later. Eylo's mother had learned this lesson when the agha left her with a black eye for daring to reject his advances. Once, Eylo had dreamed of avenging his family, but now, he was resigned to servitude.\n\nA sharp crack from the agha's manor took Eylo from his thoughts. Dropping his cigarette, he rushed to investigate. When he approached, he spotted soldiers in front of the agha's corpse, a large hole in the middle of his skull.\n\nEylo felt the dam that had held back his rage burst, all at once. The next moments passed as if he was watching them on film. An ear-piercing screech, the surprised mutters of the soldiers, and a boot stamping on the agha's face until it turned to mush."
 tur.25.a:0 "'Greetings from me to the Bey of Bolu.'"
 tur.26.t:0 "A Flight to Destiny"
 tur.26.d:0 "It was a crisp spring evening when the Fokker-built airliner departed from Ankara Esenboğa Airport. Near the front, President İnönü stared out the window, watching the lights of Ankara fade away as the plane climbed beyond the clouds. In the seat next to him sat his prime minister Fahri Korutürk, bloodshot retinas and dark circles beneath his eyes betraying the stress of having to serve as interim foreign minister back in the day. İnönü pitied him. His closest ally, entrusted with honing the edge of Turkey's hidden blade while making sure that the Italians were kept in the dark.\n\nThe preparations for the Malta Conference had taken months, and even now İnönü could not possibly guess what its outcome would be. His eyes swept the other seats. Cemal, Melen, and Gürsel. All of them entangled in what would be one of the most important conspiracies in modern history. But could any of them be trusted? The Italian SIM had eyes and ears throughout the Triumvirate. If any one of his aides had been tempted by an Italian bribe, or if they had accidentally let classified information into the hands of an Italian informant...\n\nWell, it was too late to worry about that. They had done what they could. Now all there was left was to let destiny play out. The fate of the Turkish Republic, and of Kemal's legacy, laid in the balance.\n\nİnönü turned to Korutürk.\n\n\"Get some rest, Fahri. God only knows what the Italians will throw at us, and I'll need you to be at your best.\"\n\nThe Prime Minister turned back.\n\n\"Here's to victory.\"\n\n\"To victory,\" replied İnönü."
 tur.26.a:0 "Let's hope we've done enough."
 tur.27.t:0 "They Watched from the Dark"
 tur.27.d:0 "The car was an older model. It was a Volkswagen, a late forties model that had been imported to Turkey from Germany as surplus. In its heyday, Officer Salih thought that it might have been luxurious, with a built in radio and air conditioning unit, things that had not been very common in older cars. The days of its prime had long since passed, however; The paint, a once muted green, had chipped in large patches, exposing the now rusting metal to the elements, and the car's engine, when it was running, vibrated terribly, creating a loud clamoring noise wherever it drove. In many respects, Salih mused, it reflected the district of Sur: once loved dearly, but now clearly neglected and in severe disrepair.\n\nShaking his head to rid himself of such idle thoughts, Salih turned once again to observe the house that the young Kurdish teen had walked into. He was seated in the car, which itself was parked in an alleyway nearby the boy's home, alongside his senior, a man who had introduced himself as Officer Hakan. If Salih was being honest, and a little less than charitable, he would wonder how the older officer had gotten into the ÖHD in the first place. The older man seemed a bit lackadaisical, Salih thought, not really giving the job the proper diligence it required.\n\nHakan looked over, noticing that Salih had been looking at him.\n\n"What's the matter kid?" the older officer asked through a mouthful of çiğ köfte that the two had picked up in the market earlier, "You look nervous, is something wrong?"\n\n"Nothing's wrong," Salih responded, somewhat testily, turning back to look at the house once more.\n\nHakan studied him for a moment, before sighing dramatically. "Oh for God's sake," he said, massaging his temple, "Don't tell me that this is your first time in the field?"\n\nSalih hunched up, suddenly defensive."
 tur.27.a:0 ""Actually, this is my very first mission.""
 tur.27.b:0 ""Of course not, I've done this plenty of times.""
 tur.28.t:0 "Should You Choose to Accept"
 tur.28.d:0 "Hakan placed his head fully into his hands, and let out a long suffering sigh. "May God save me from the inexperienced," he groaned softly. Eventually he raised his head and took a deep breath. "Alright kid, you know why we're here at least, right?"\n\nSalih nodded. "We're here to pick up Ameda Eroğlu, age sixteen," he said, repeating the briefing he had received, "He was detained by officers of the ÖHD along with five other teenagers on suspicion of conspiring to incite a Kurdish insurrection against the Republic of Turkey. Ameda was released after confirming that he and his co-conspirators had been contacted by the Italians, who offered to finance the conspiracy, though he denied any personal involvement. He was released as part of an agreement in order to convince him to make his confession, and the others were subsequently neutralized. It has now been deemed that a potential terrorist is too dangerous to be left to reignite the conspiracy, and we are to detain him indefinitely."\n\nHakan hummed. "You memorized the briefing," he said, nodding, "Smart. A memory for details like that will get you far in this career, nurture that skill."\n\n"Thank you, sir," Salih responded, his face flush with faint praise, "But, is it really likely that he's a terrorist? I mean, he's just so young. When I was sixteen, I was busy conspiring to win over girls, not overthrow the republic."\n\nThe older officer grunted. "Let me tell you something about the Kurds," he said, his voice growing conspiratorial, "They're ungrateful bastards who'd do anything, including sending their children out to die, to resist our attempts to uplift them out of their backwards feudalism. Now," he said, holding up a hand to forestall any other questions, "It's time to get this started. We stick together, keep our eyes open, and we never get separated.""
 tur.28.a:0 ""And for God's sake, don't do anything stupid.""
 tur.29.t:0 "A Nighttime Raid"
 tur.29.d:0 "The two got out of the car, exposing themselves once more to the crisp night air of Diyarbekir. The sounds of the night surrounded them, embracing them. Dogs barked, the crickets chirped, and spouses argued. It was, in truth, the closest one could get to true silence in the city. In a way, Salih thought, the sounds were comforting. They were the same kind of thing you could hear at night walking through Ankara, his hometown. Salih took a moment just to listen. He was curious as to if the sounds of a Kurdish city were any different from a Turkish city, though strain as he might, he could hear no difference.\n\nStanding beside him, Hakan cupped his hands around a lighter, muttering curses as he tried and failed to get it alight against the cold wind. With a muttered "aha," the senior officer finally lit the lighter, and brought it to a cigarette already in his lips. Hakan took a deep pull, sighing contentedly as he breathed the smoke out into the night air. He nudged Salih with his elbow. "Want one?" Hakan offered, "I've always found it helps calm the nerves before something like this."\n\nSalih shook his head. "No thank you, I don't smoke," he declined, "My mother was always against it, she would kill me if she ever found out."\n\n"Smart woman," Hakan grunted. The two stood in the near silence for a moment, Hakan seemingly content to just smoke in peace. Eventually, the older man dropped the now extinguished butt to the ground, grinding it under his feet. "You ready, kid?" he asked, somewhat jovially.\n\n"I suppose I'm as ready as I'll ever be," Salih responded. He glanced around again, feeling suddenly out of place. "What's the plan? I mean, how exactly are we going to be doing this?"\n\nHakan chuckled, wrapping his arm around the younger officer's shoulder. "It's simple, kid," he said."
 tur.29.a:0 ""We'll sit here and wait for him to come out.""
 tur.29.b:0 ""We'll simply go and knock on the door.""
 tur.29.c:0 ""We'll go in loud, take him in by force.""
 tur.30.t:0 "Introspection in the Moonlight"
 tur.30.d:0 "The sounds outside were muted through the doors of the car, yet were still audible to officer Salih's ears, even over the soft tune that emanated from the radio. It was a sad song, Salih thought as he listened, speaking of love, lost during time at sea. Of duty and service above one's self, to one's own detriment.\n\n"You like this song?" questioned Hakan, jolting Salih out of his near trance, "This is the most focused I've seen you on something other than that house since we started this."\n\nSheepishly, the younger officer rubbed the back of his neck. "Yeah, I do like it. It's really quite sad, and, well..." Salih paused, thinking, "I've got a wife back home in Ankara. I know she loves me, but sometimes I worry, since I'm away from home so often, you know?"\n\nHakan hummed. "Yeah kid," he said, after a moment, "I know."\n\nThe two sat in silence a moment as the song continued to play. "Hey, Hakan?" Salih started, hesitating.\n\nHakan looked over. "What's up, kid?" he responded.\n\n"Do you think that we're doing the right thing here?"\n\n"What do you mean?"\n\n"I mean, what are we doing here?" the younger officer questioned, "You saw the kid in the market same as I did. He's no terrorist, he's just some kid. At the very worst, he's a delinquent, but even that's doubtful."\n\nHakan was silent for a moment. "Listen, kid," he offered, "One thing that you learn after years of this? It isn't your job to question. Leave that to the folks in charge. We've just got to do what the bosses tell us." The older officer had a distant look on his face, "At least, that's what you've got to do to sleep at night," he muttered, almost too soft to hear.\n\nSalih looked back out the window, pretending he didn't see the wetness of the older officer's eyes, hoping that he was afforded the same dignity as the car's radio went to static, the sad song fading away."
 tur.30.a:0 "I can't go, listen to the gulls, their teasing never ends..."
 tur.31.t:0 "Crossing"
 tur.31.d:0 "Officer Salih tried desperately to keep his hands from shaking.\n\nThe tremors that he felt weren't because of the cool night air that seemed to seep into his bones, though that was almost certainly a part of it. The greatest source of the tremors instead seemed to come from within. Salih felt hyperalert, his eyes scanning the streets and buildings around them as he and Hakan walked slowly over to the young Kurdish teen's house. The walk wasn't far, not even ten meters, but to Salih, each step felt like an eternity.\n\nHe tried desperately to keep his composure, to not show how scared he truly felt. He could feel his heart pounded in his chest, loud enough that he was afraid it could be heard in the brief moment of utter silence that could almost be felt as it descended over the street.\n\nAt once, a loud crashing sound came from an alleyway behind them. Salih jumped, almost tripping as he whipped around, fumbling for his pistol at his belt. A cat yowled as it tore out of the alleyway, a stack of pallets having fallen over.\n\nWith some effort, Salih released the death grip he had on his pistol. Turning back to the house, he met the eyes of the older officer. "You alright there, kid?" he asked, his voice somewhat soft.\n\n"I-" Salih started, his mouth dry. He coughed, trying to clear his throat. "I'm fine," he got out, "Just nerves."\n\n"There's nothing to be nervous about," Hakan counseled, "Relax, this'll be easy. We'll go up, knock on the door, the kid comes out, and we take him to the station. If he tries to resist, well, we're two grown men and he's just some kid."\n\nSalih took a deep, shuddering breath. "You're right," he said, "You're right. This is going to be easy."\n\n"Of course I'm right," the older officer laughed, "Now get over here, let's get started."\n\nNodding, Salih crossed over to where Hakan stood by the front door to the house. Hakan turned to face the door, pounding his fist against it."
 tur.31.a:0 ""This is the ÖHD, open up!""
 tur.32.t:0 "Late Night Visitors"
 tur.32.d:0 "The television was on, yet Ameda couldn't say that he was paying too much attention to it.\n\nWhen the TRT had announced that it would be showing a movie called "Susuz Yaz," it had been all that he and his friends could talk about for weeks. As he was the only one with a working television, his friends had planned to come over to watch it together, plans that had fallen through with his betrayal and their disappearances.\n\nHe wasn't sure why he had decided to watch the movie without them, truth be told. In some ways, it felt like yet another betrayal, another tally to be added to his growing list of sins. Perhaps it was one final toast to friends that he would almost certainly never see again.\n\nPerhaps it was just because he was scared.\n\nRegardless of what his mother said, he knew that people had been watching him all day. He could feel their gaze linger on him, a sixth sense warning him of impending danger. Still, it wouldn't do to frighten his mother. She had enough trouble as it was, and he didn't need to make things any harder for her. Trying to relax, he turned his attention back to the movie, watching as one of the actors leveled a pistol and shot into the darkness, once, twice, a third time-\n\nAll of a sudden, there was a pounding on the door. Ameda jerked his head around, the television forgotten, eyes wide with fear. Seemingly unsatisfied with the lack of an answer, the pounding on the door resumed. "This is the ÖHD," a man's voice said, "Open up!"\n\nAmeda reacted slowly, fear turning his feet to lead. Inch by torturous inch, he made his way across the small living room floor to the front door, raising a trembling hand to the doorknob. Turning his head, he saw that his mother had come out of the kitchen. Her eyes were a mirror of his, fear written plainly across their faces. He gave her a pleading look, begging her to tell him what to do."
 tur.32.a:0 "Slowly, she nodded her head yes."
 tur.32.b:0 "Slowly, she shook her head no."
 tur.33.t:0 "A Choice"
 tur.33.d:0 "With an almost imperceptible click, the door opened inward, bringing the two Turkish officers and the Kurdish teen face to face.\n\n"Good evening," the older officer said, "You are Ameda, correct?" The officer paused, clearly looking for an answer. At Ameda's wordless nod, the man's face broke out into a polite smile. "Excellent, my name is Officer Hakan, and this," he said, gesturing to the man standing beside him, "Is Officer Salih."\n\nAmeda stood silently, his blood ice in his veins. While Hakan's smile was broad, the warmth did not reach his eyes. Salih's eyes were also cold, yet the younger man lacked the smile as well. Ameda's eyes traced their way down the younger officer's body, coming to a rest where the man rested his hand against the butt of his pistol. "How do you do?" Ameda asked slowly.\n\n"Just fine, thank you," Hakan responded cordially, holding his hand out to shake. The teenager simply stared at it, until the older man retracted it. "My partner and I are with the ÖHD," he said, "We have some questions relating to the incident two days ago, and we'd appreciate it if you could come with us."\n\nBehind the teen, his mother fell to her knees, sobbing and beating at her legs. Ameda spun around at the noise, but found himself paralyzed with fear, unable to move, only able to watch as his mother broke down like he had never seen before. "I-" he stammered, barely able to speak.\n\n"Don't make this difficult, son," Hakan said softly. His smile had faded somewhat, but his eyes had started to warm, "Just come with us quietly, and this will all be over and done with."\n\nAmeda's mind whirled. He saw the faces of his friends, heard them shouting his name, and saw in his mind's eye as they transformed into faces of the two men standing before him. Should he go? Did he even have a choice? His body shook as he came to a decision."
 tur.33.a:0 ""Alright, I'll go with you.""
 tur.33.b:0 ""I won't go with you.""
 tur.34.t:0 "The Door Unopened"
 tur.34.d:0 "Salih watched as Officer Hakan banged his fist against the door for a fourth time, eliciting the same response as all three before it: complete and utter silence from within. "We definitely saw the kid walk in there, right?" the older man asked, his voice low.\n\n"He's definitely in there," the younger officer responded, "I saw him the same as you."\n\n"Do you think he could have left without us watching?"\n\n"No, we checked the whole house, there's no other doors, and all the windows face towards us. There's no way he couldn't have gotten out of the house without us noticing. He's in there," Salih declared, "He has to be."\n\n"He's just not coming out," Hakan grumbled. The older man sighed, resting his head and arms against the door. "Damn it, so much for Kurdish hospitality. Things just couldn't be easy, could they?"\n\nThe two stood in silence for a moment, letting the sounds of the street wash over them. Salih was the first to break the silence. "Well," he started, hesitantly, "What do we do now?"\n\nHakan chuckled, though it was a mirthless sound. "Well, as I see it, we have a couple of options. One," he said, raising his thumb in the air, "We go in loud. Break down the door, arrest the kid and drag him down to the station. I'd really rather not do this unless we absolutely have to, but it's looking like it's something we're absolutely going to have to do."\n\n"What's the second option then?"\n\nHakan gave the younger officer a sideways glance, before sticking out his index finger along with his thumb. "Well, the second option would be to keep doing this: sitting out here in the cold and knocking on the door until he eventually opens up."\n\n"Which isn't likely to be anytime soon."\n\nThe older officer hummed. "Well, it could be worth a shot. I'm at a loss here, neither of our options seem like very good ideas. What do you think we should do?""
 tur.34.a:0 ""We should go in loud, just get this over with.""
 tur.34.b:0 ""We might as well keep knocking.""
 tur.35.t:0 "If at First You Don't Succeed"
 tur.35.d:0 "Hakan simply looked at the younger officer, his face somewhat disbelieving. Eventually, the older man simply shrugged. "Well," he said, "I suppose it won't hurt to try knocking a few more times." He turned once again to the door, banging his hand against it as hard as he could. "Come on, we know you're in there!" he shouted, "Just come on out, don't make this difficult!"\n\n"What the hell are you two assholes doing?!" a man's voice echoed, coming from across the street. Salih whirled, eyes searching frantically for the source.\n\nHakan placed his hand firmly on Salih's shoulder, pushing himself past the younger officer. The older man cleared his throat before calling out into the night. "This is an official Military operation," he called, "Please, remain in your homes."\n\nA woman's voice began to echo along with the first. "Get out of Sur, this is our home! You have no right to harass us!"\n\nSalih began to look around in a near panic as the street erupted into shouts and jeers. Hakan tried to calm people once more. "Please, everyone, do not interfere, return to your homes! Do not interfere with official military business!"\n\nThe older man's words did little to abate the fury that continued to grow. From second floor windows, people began to throw old moldy produce, glass bottles, shoes, whatever they could get their hands on. The noise began to echo within Salih's mind, first a whisper, and then a shout. He felt a growing pressure in his head, a thrumming within his ears. He watched helplessly as a brick thrown from an upper window collided with the older officer's head. Hakan collapsed wordlessly, blood starting to pool from his head in the middle of the street. Salih drew his pistol, he had to act-\n\nThe first crack took him in the ear, spinning him around and knocking him to the ground. The second took him in the forehead, and he thought no more."
 tur.35.a:0 "And when the sun rose, the city would find itself aflame."
 tur.36.t:0 "A Pleasant Walk"
 tur.36.d:0 "Hakan's faded smile returned full force, the older officer's face briefly splitting into a wide, toothy grin. "That's the spirit lad," he beamed. Turning to Salih, the older officer slapped the square of the younger man's back. "See? Didn't I tell you this would be easy?"\n\nSalih let out a weak chuckle. "I suppose you did say that, yes," he let out, weakly. He tried to force out a grin, though his nerves left it as more of a grimace.\n\n"And you were so nervous earlier," he chuckled, before turning his attention back to the young teen, placing a firm hand on his shoulder and pulling him through the door. "Let's get going now," he said, "They're showing Binnaz on the television later, I want to be home in time for it."\n\nThe three began to walk back towards the car. While Hakan walked with a carefree air, Salih still glanced around nervously, looking furtively for the first signs of danger.\n\nHe would spot it a moment too late.\n\n"Hey," called a woman's voice out of a window, "Where are you two going with that kid?"\n\nAnother man shouted from across the street, "Leave him alone, go pick on someone else!"\n\nThe two officers and the young teen picked up their pace as more and more people began to take up the cry, simply trying to return to the safety of their vehicle. From the windows of buildings, people began to throw things, stones, cutlery, shoes, whatever they could get their hands on. As they reached the car, a brick flew overhead, shattering the windshield and causing the older officer to fall over. Salih pulled out his gun, rushing over to intervene, and-\n\nA crack roared through the night, and Salih felt a lance of pain through his side, falling to the ground in shock. A second crack roared, and Hakan's head exploded into a shower of blood, the man falling lifelessly to the floor. As he watched the young teen run for cover, one final thought rushed through Salih's mind."
 tur.36.a:0 "But, we didn't do anything wrong..."
 tur.37.t:0 "After"
 tur.37.a:0 "And with the rising of the sun, the city would find itself aflame."
 tur.40.t:0 "Just One Cup"
 tur.40.d:0 ""This is my wife, Ceren," Salih said, offering the picture that he kept in his wallet to the older officer. It had been several boring hours of watching the small house in Diyarbekir. Nothing at all had happened in the time, and the officers were chatting amicably about whatever topic happened to come up.\n\nTaking the offered picture, Hakan smiled. "Oh, she is pretty," he chuckled, slapping the younger officer on the back, "You're a lucky man, Salih. How long have you been together?"\n\n"A little over a year now, and guess what? She's pregnant!" Salih responded, "I just found out last week, she told me right before I left."\n\n"Congratulations!" Hakan laughed, "Is this your first?"\n\n"Yeah," he answered, "I'm a bit nervous, if I'm being honest."\n\n"That's normal, every father's nervous the first time," the older officer offered, still chuckling, "Hell, when my first was born, I couldn't sleep for days! But by the third, you get used to it, and you wonder why you were so nervous to begin with."\n\n"I didn't know that you had kids," Salih laughed, "Tell me about them."\n\nAt once, Hakan's face became tired, his jubilant mood gone. "There's not much to tell, really," he said, "They're older now, and they don't talk to me much anymore, not since..." The officer trailed off with a sigh. "Enough of this," he said, getting out of the car.\n\n"What are you doing?" the younger officer asked. He watched the older man walk around back, opening up the trunk. When he returned to the car moments later, he held in his hands a bottle of rakija and two small cups.\n\n"Don't listen to an old, bitter man like me," Hakan declared, pouring a bit of the drink into either cup, "We need to celebrate your firstborn. Just a cup," he said, forestalling an argument from the younger man, "We won't have any more than that, and it won't stop us from finishing our mission. Agreed?"\n\nSalih thought for a moment. "Fine," he said."
 tur.40.a:0 ""Just one cup won't hurt.""
 tur.41.t:0 "Köz"
 tur.41.d:0 "It had taken merely ten minutes for "just one cup" to become two, another fifteen to become three, and within an hour, the bottle had vanished, a new one taking its place. The two men toasted, first to new life, then to death. To old memories, and to new experiences. They toasted to their homes, and to their families, wherever they might be.\n\nHakan poured the last dregs of the second bottle into each glass with a shaky hand. "This one, we toast- we toast to the republic!" he slurred.\n\n"To the republic," Salih slurred back, raising his glass in turn. The two men downed their drinks together, reclining comfortably into their seats.\n\n"We need a new bottle," Hakan said, getting back out of the car, once again returning to the rear of the car.\n\n"How many bottles do you have back there?" Salih laughed, opening the door to shout at the older officer.\n\n"I've got enough," Hakan shouted back. Shutting the trunk with a loud thump, he came back to his seat with yet another bottle of rakija. As he sat down, a song started playing on the radio, loud and triumphant. Salih laughed as Hakan began to sing along with the radio. "When the day of war comes, glory shall be seen to bra-"\n\n"Will you shut the fuck up?!" A man shouted. Salih looked around, unable to find the source. "It's four in the morning and you're singing this crap? Shame on you!"\n\nAt once, other voices took up the cry. Bottles and stones were hurled at the car, and the two officers quickly closed their doors. "We need to get out of here," Salih said.\n\nHakan started the car and stepped on the gas. The angry shouting continued as the older officer tried to navigate the car through the city streets. "Fuck!" he shouted, hitting an uneven patch of the road. Salih thought of little as the car hit a wall head on, sending the two men flying through the windshield.\n\nThen they thought of nothing."
 tur.41.a:0 "With the rising of the sun, the city found itself ablaze."
 tur.42.t:0 "They Made Ready"
 tur.42.d:0 "Hakan led the younger officer towards the rear of the car, where he stuck his key into the trunk, unlocking it and popping it open. Sifting through a number of rakija bottles, the older man revealed a smooth box, indistinct save for a keyhole on the top. Opening the lock, he pulled off the top, grabbing two magazines from within and attaching it to his belt.\n\nSalih pulled out his own pistol, focusing on his breathing and his gun. He ejected the magazine on his pistol and racked the slide as he had dozens of times before. He took a slow breath in as he checked the magazine and reinserted the ejected round, breathing out while he reloaded the gun and flicking the safety to chamber the next. Breathing in, he grabbed another two magazines himself, breathing out as he placed them into his belt. Breathing in, he grabbed an armored vest, breathing out as he put it on and adjusted the straps.\n\nSalih nodded to the older officer, who then closed the trunk with a noticeable thud. Silently, they walked together, their footfalls echoing through the street as an unnatural silence seemed to descend upon it, cutting out the busy sounds of the night. The younger officer could almost hear his heartbeat, the thrumming in his ears that seemed to intensify with every step. He was acutely aware of the weapon that he held in the palm of his hand, itself seeming to thrum with nervous energy, as if the metal itself anticipated what was about to happen.\n\nReaching the house, the two officers took places on either side of the door. Salih struggled to relax the deathgrip in which he held his pistol, trying to force himself into the looser grip that had been drilled into him through countless hours of practice.\n\nMeeting the clear eyes of his partner, Salih's mind emptied itself of conscious thought, being instead replaced by instinct and memory. Wordlessly, they nodded to each other."
 tur.42.a:0 "They kicked in the door."
 tur.43.t:0 "Raid"
 tur.43.d:0 "The door was kicked open with a tremendous crash, the hinges squeaking as they rolled away.\n\nHakan, having been the one to kick the door open, was the first into the small house. "ÖHD!" he shouted, brandishing his pistol into a narrow entryway, "Come out with your hands up!" Salih came in close behind, his own pistol held in his shaking hands. The older officer turned the corner, and rushed into a small room.\n\nFollowing him, Salih arrived in a small living room, with a small couch and a smaller television set. The teen and his mother were in the room, cowering behind the sofa. The boy's face was a rictus of terror and hate, nausea written clear across his face. He was holding his arm out as if to protect his mother, her own face streaked with fresh tears.\n\nHakan leveled the gun at them. "Hands up, out from behind the couch! Now!" he shouted.\n\nSalih pointed his own gun at them, watching them as they attempted to come out. "Slowly!" he shouted, trying to keep the panic that he felt out of his voice. The mother and son flinched, noticeably slowing their already measured pace.\n\nThe older officer gave Salih a quick glance before refocusing his attention on the two. "Alright, far enough!" he shouted, "On the ground, now!"\n\nSalih echoed the shouting, though he could barely hear himself over how loudly his heart was beating. He could feel it in his chest, beating hard as blood thrummed in his ears. He began to circle the two as they lay on the ground, trying to focus on them as he took ragged breaths. Salih could feel sweat begin to drip down his face, his body trembling and his vision unfocused. He could feel his heart beating faster, and faster, and faster, and-\n\nTaking a step, he tripped into a small table, knocking a plate onto the ground. The plate shattered, and the loud noise drew everyone's attention for a split second. Salih heard a scream, saw a movement!"
 tur.43.a:0 ""FIRE NOW!""
 tur.43.b:0 ""I SAID FUCKING FIRE!""
 tur.44.t:0 "Righteous Claim"
 tur.44.d:0 "The Hanim family ate their bowls of rice and chicken in silence. They were in their living room, sitting in front of a decade-old black-and-white television which had a framed photograph of Atatürk resting above it. They were enraptured by the contents of the screen, a televised contest where random peasants from across Turkey came before a live audience and saw who could sing folk songs the best. It was light entertainment at best, but these past few years had been more and more difficult for the Hanims, so they needed something to take their mind off reality. \n\nThe visage of the current contestant, a sheep farmer from Thrace, suddenly blinked out, replaced by President İnönü sitting at his seat in the Grand National Assembly, a sheet of paper in his hand. He tried to project a strong, decisive image, but his speech was tinged with worry. \n\n\"Gentlemen! We have been victorious! Our Republic lost no war, our Republic did no wrong, we stayed for the truth, and we fought against the wrongdoing. With the allegiance of our so-called ally revealed, we are on our own! The world must know that Turkey will not be bullied by foreign powers!\" \n\nSilence filled the room of both the Grand National Assembly and the Hanims' living room. The family glanced at each other. The Malta bombing was a grave event, but what could the President's bluster signify? A thought nagged them. If the President did not manage to restore Turkey's pride peacefully, war might be his last resort, and that was a terrifying prospect. If it came to that, one of their sons might pay the price for the President's foolishness."
 tur.44.a:0 "And yet, it was hard to see how it could turn out any other way."
 tur.45.t:0 "On the Street Again"
 tur.45.d:0 "\"March, one, two, three! March, one, two, three!\" \n\nThe soldiers' boots were heavy on the pavement as the platoon drilled up and down the streets. Hiding by some bags of trash on the curb was little Deger. He had snuck out of primary school to get a glimpse of the men, and was mesmerized by how they moved back and forth with discipline. They wore anger on their faces, but also confidence and determination, truly model Turkish citizens. Deger remembered the oath his teachers made him swear. \n\n\"I am glad to be a Turk,\" repeated Deger to himself. \n\nWhen the soldiers returned, he stood up and saluted them. \n\n\"Every Turk is born a soldier!,\" chanted the soldiers. Deger had his moment of pride, then quickly hurried back to the schoolhouse."
 tur.45.a:0 "He couldn't risk being caught skipping class, after all."
 tur.46.t:0 "Hands on the Neck"
 tur.46.d:0 "Tevfik took one last smoke from his cigarette before tossing it into the sea in front of him. This was the last one he would be allowed this week, and the quartermaster wasn't feeling generous enough to bend the rules. Grumbling, he made his way over the rocks back to the tent he and three other soldiers were staying in. Mehmed, his close friend, spotted him returning and invited him into the tent. Mehmed could see Tevfik's displeasure written all over his face when he slapped his friend's shoulder. \n\n\"I'm sure the Italians will be intimidated by your warrior spirit!,\" he proclaimed. Tevfik's mouth curled up. \n\n\"Very funny,\" he replied. The two men sat down in the tent, Tevfik's anger having faded. Mehmed pulled a fresh cigarette out of his pocket. \n\n\"Here,\" he said as he held the cigarette out. \"It's my last one, but you should take it. You probably need it more." Tevfik thanked him, then pocketed the cigarette. The awkward silence between them continued for a while. Tevfik thought about their mission. They had been assigned to a vanguard group of soldiers tasked with scouting Rhodes' defenses prior to Turkey's formal invasion of the island. The work was nerve-wrenching, as Tevfik had almost been caught three times. Because of the intense secrecy involved, they could not even write home to their families. Tevfik wondered if he should ask Mehmed about his sister, but felt that there wasn't much point to it. The men in the tent settled down to nap, for it was under the cover of night that they would penetrate Italian territory. The last thoughts Tevfik had before he slipped into sleep was of his parents and of their homestead near Bolu."
 tur.46.a:0 "God willing, he would be the one to bury them, and not the other way around."
 tur.47.t:0 "Deniz ve Mehtap"
 tur.47.d:0 "Hikmet looked out at the ocean. After the Nazis bastardized the Mediterranean, there were always long salt flats before you could see the actual Mediterranean, but by the time your eyesight got there, it was always beautiful, a jewel sea as far as your eye could ever want to see - and your eye would damn well want to see far in times like these.\n\nCemal had similar opinions of the sea. He loved it, and remembered the time when he was a boy when the sea was full, and the Germans had yet to ruin it. He wondered what a life without the sea would be like. "Hey, Hikmet. You know how the first Turks were trapped in Ergenekon?"\n\n"Yeah." This was a lie. Hikmet never really thought about this, but it seemed an interesting conversation topic. "What about it?"\n\n"Why do you think they didn't stay there? Why did they not build on that, expand it, instead of spreading across all the world? Why is it that we were born here?" Cemal had a habit of being philosophical, and Hikmet was more than fine with it.\n\n"You may be right. It must've been scary to go out into the world, to follow the wolves, to melt the mountain. What would the world be like if we were still in Central Asia?"\n\n"Well," Cemal gestured to the sea, "we would not be able to see the sea. How strange that would be. When I dip my toes in the water, I am grateful for the bravery of old. Perhaps we have yet farther to roam.""
 tur.47.a:0 "Perhaps."
 tur.48.t:0 "War at World"
 tur.48.d:0 "İskender smoked his cigarette. It tasted like shit, but the rations tasted even more like shit, so it was a nice reprieve. The smoke from the cigarette floated in the direction of his home, long lost. Distance and his cigarette made it hazy, but home was still clear in his memory.\n\n"I was born there, you know. When we win the war, I can return home."\n\nCenk was confused. They were all brothers in arms, and each man in the unit could write a full biography on every other man in the unit, and Cenk thought that İskender was from Smyrna. "That isn't right, is it? Thought you were a Smyrna boy."\n\n"Oh no," İskender said, clearing up a common confusion. "My dad's the one from Smyrna. Moved there from Thessaloniki, over in Greece."\n\nCenk scooted just a little bit away from İskender. "You're a Greek, then? Didn't know that about you."\n\nİskender smiled. An opportunity to prove loyalty. "I'm a Greek by blood, by ethnicity, even by name. But I tell you I'm a Turk in the heart, and a Turk in the soul. I'll die for Turkey like any of the rest of us."\n\n"How happy is the one who says, I am a Turk!" Cenk proudly stated the quote, then looked over at İskender.\n\n"Ataturk. Course I would recognize the father of us all."\n\nCenk smiled. All brothers in arms, and all at war against the world. He slowly lifted the cigarette to his mouth, taking it in, awful taste and all.\n\n"Could you smoke faster?" İskender said. "Hüveyda's waiting for me back home, and I doubt she'll appreciate you holding us up.""
 tur.48.a:0 ""Alright, I'll smoke faster.""
 tur.49.t:0 "Report for Reform"
 tur.49.d:0 "Just where the hell do you think you're going? No Zazas are allowed into the Munzur Mountains, and you look like a Zaza to me." \n\nThe old shepherd blinked at the Turkish soldier, bemusement written on his features. Still, he knew better than to be argumentative. Two of his brothers had lost their lives to Turkish soldiers decades ago, and the old shepherd wasn't keen to join them just yet. \n\n"I am simply here to herd my sheep, sir. I mean no harm." His accented plea didn't seem to earn any sympathy from the soldier, who sneered before replying. \n\n"Well, find someplace else to herd them, Zaza. As I said, the mountains are off-limits to your kind. Or am I going to have to report that I had to deal with a partisan?" The soldier began to reach for his rifle, punctuating the threat in his words. \n\n"N-no sir, you will have to do no such thing. I am leaving now." The old man quickly turned and began to direct his sheep elsewhere. He wasn't sure where he could go to herd them now, but it was clear pressing the issue would cost him his life. He only hoped it wouldn't come down to that or his livelihood."
 tur.49.a:0 "Better safe than sorry?"
 tur.50.t:0 ""To the Brave Union!""
 tur.50.d:0 "Aydin groggily opened his eyes. He was greeted with the blinding light of his old television set. Before he could stand up to turn the TV off, he heard a familiar tune. Something he hadn't heard since...\n\nThe War of Independence.\n\nDespite the age, and slight corniness of the program, he couldn't turn it off out of respect for his old comrades.\n\n"İnönü was undefeatable, his brave defenders of the republic defeated every foe. An entire army would not be enough to defeat him. The French learned this at Antep when a small force routed an entire army." Aydin began to swell with pride for his past, although perhaps, he thought, it was just the alcohol in his system.\n\nThe scratchy narrator continued. "We cannot, however, forget the contributions of our brother nations." The program cut to İnönü', standing with the famous Soviet general Voroshilov. İnönü began to speak, and the age of the program was further revealed by the quality of his speech. "My brothers, our nations since their birth have stood against imperialism. Our descendants will grow up safe, secure, and proud that we have resisted the imperialist west at every turn. Thanks to our brave sons and support from our Soviet brothers, imperialists around the world quake in their boots!" İnönü grabbed Voroshilov's hand and raised it in the air, the camera turning to a cheering crowd.\n\nThe television returned to static. Aydin questioned whether it was some sort of alcohol induced fever dream, or something that really went on air. Whether it was real or not, it brought old memories, long forgotten, rushing back. Aydin reached for his beer, and raised a toast to the friends he lost in the war."
 tur.50.a:0 "Memory of '20 Still Lives On!"
 tur.51.t:0 "Çaka Beg's Nightmare"
 tur.51.d:0 "The salty spray of the Mediterranean Sea licked at the face of Turkish President İsmet İnönü. It actually felt quite nice, the slight sting in his eyes notwithstanding. He had spent so much time inland these days, it was nice to come back here, to Smyrna, where he had been born. But childhood memories could wait for another day, right now, there was a war to win. Today that meant visiting what might generously be called the nation's navy.\n\nİnönü looked over to the other man here to ignite a fire in the spirit of the sailors here, one of Turkey's first admirals, Fahri Korutürk. It had been nice to talk with a fellow old diplomat for a change, and the two had spent much of the trip to Symrna reminiscing. The president found himself liking the old admiral, even if he was from the wrong branch of the military.\n\nFahri's voice broke the silence, "Have you ever been to Rome sir?"\n\n"Huh? Oh, yes I have, a number of times. Beautiful city isn't it?"\n\nKorutürk nodded sadly, "Very. I wish we did not have to be at war with the Italians, I would love to be able to travel there again, but with relations this poor I doubt I'll have the chance to for some time..."\n\n"It is a tragedy, but you must remember this admiral: they abused our trust and put us into this situation."\n\nThe admiral was quiet for a long while after that. Then, in a burst of energy, words tumbled out of his mouth, "Your Excellency, by the grace of Allah, I would dearly desire to lead a fleet once more on the open seas."\n\nThe president was not surprised by the outburst, in fact, he had been expecting something of the kind. "My friend, I think that would be a wonderful sight to behold. If we can just hold on for now, I promise you that one day we will have a fleet to call our own, with you to lead it."\n\nFahri laughed warmly, his hand running across his balding head as his cheeks reddened from humble embarrassment."
 tur.51.a:0 ""I'll command ten fish to glory if you're giving the order.""
 tur.52.t:0 "Old Wounds"
 tur.52.d:0 "Davit sat in his cell, thinking about his life. He had only been a child when Enver Pasha's men came and took him and his family out into the Syrian Desert. He remembered every detail; his skeletal father trying to march on before collapsing, laid to rest forever by a revolver to the back of the head. He remembered the soldiers passing around his mother for fun, before slitting her throat and leaving her to rot in the desert. How his older brother was reckless enough one day to swear at a Turkish soldier and, a second later, paid for it with his life, as a rifle butt cracked his skull upon the sand.\n\nHe had survived, and married a girl from the march. Under the Soviets life had been hard, but there were moments where it seemed he could rebuild a family.\n\nThen the Union collapsed, and the Turks came again into Yerevan. The repression had started again; churches were burned and children forced to renounce their faith, this time in the name of Kemalism rather than Islam. He remembered seeing the faces of his children as the soldiers took them away, put them on a train headed to Syria. He saw his Milena's face, contorted by pain from the cancer, her beauty persisting even amid the anguish.\n\nWhen his wife died, he joined a resistance group. He had not been a communist, but the Yerevan Soviet seemed the most likely to free his people, to avenge his family. He had killed Turkish soldiers again and again, in each seeing the Ottoman soldiers who butchered his family.\n\nBut this last operation was a failure, an ambush gone wrong, and he had been captured. The Turks made the same offer they always made; information for freedom. He knew, even then, that they were lying. But he was broken. He reminisced over a gallery of faces he knew and loved, and remembered they were dead or worse. As he was led down to the basement by a sidearm wielding officer, he remembered his father. Not in the desert, but a basement. He made the sign of the cross one final time, and sighed."
 tur.52.a:0 "Father, Mother, Milena.. Little Alex and Tigran.. I'm almost there.."
 tur.53.t:0 "Fresh Blood"
 tur.53.d:0 "My dearest Zehra,\n\nI'm sorry that I was not able to write to you sooner. My task has kept me occupied, and I know they check the mail. I needed help, but if I had told you what I needed to say you wouldn't have seen this. But God, maybe I should have written in the slim chance that it would have gotten through, or that you could have read my words one last time.\n\nI've been doing this mission for years now, fighting partisans in the mountains and bringing them to justice. "Justice," as we call it, but I've wondered how just this struggle is. All my life I've been told how savage the Armenians are, that they have constantly attempted to subvert our nation. After int-no, torturing them, we have confessions to prove this.\n\nBut when I talk to them, it is impossible to deny they are humans. As human as you and I, as good as any Turk. They love their families, they die for their friends, they are selfless and brave and good. And all these brave men, these selfless men, I have ordered to be killed. I could not even bear to do it myself, until one time. It was an old man, a communist partisan who had been broken. He went to his death willingly, still trying to tie some dignity to his final moments. He said something, before I pulled the trigger. Was it a prayer? A plea? I do not know, and I never will.\n\nHow many other men have I killed? How many people have I held in bondage? How much blood is on my hands? I couldn't keep doing this, Zehra. I couldn't keep doing this.\n\nI am so sorry you are reading this, but I told you I would do anything to make sure our child was born into a better world. But right now, that better world means a world without me in it. Name them after one of my parents, please. I know they'd like that. The pension should be enough to keep you through.\n\nWith love and apologies, I will see you, sometime."
 tur.53.a:0 "Yours forever, Mustafa."
 tur.54.t:0 "Dusk on the Border"
 tur.54.d:0 "Amal had gotten lost again. He had followed the setting sun for some distance, and by the time he finally picked himself up and started home it was growing dark. He knew he wouldn't be able to find his way home, not in the darkness.\n\nAs his pamick grew, he spotted a car in the distance. It was different, somehow, certainly not bandits. He began waving his arms frantically, hoping that by some miracle they would see him. And whether it was God or sheer luck, they stopped and turned toward him. It was a large armored car, not as modern as the Italian ones he had seen patrolling the border, and the flag was certainly different. Soldiers climbed out, speaking to each other in a foreign language. One said in Arabic "Where are you from, kid?"\n\n"I'm from a village, not far south of here," he said, pointing vaguely in its direction. The soldiers exchanged glances. "You're pretty darn lost. That's in Italian territory. Do you need help?" He nodded, and the soldiers broke out a spare blanket and a can of rationed soup and gave it to him.\n\nAs they set a campfire, they began to converse through the translator, whose name was Yusuf. "Ibrahim, Yasin, and Deniz over there, they're Sunni. I'm what you'd call an atheist. Guess that comes with being from Istanbul," he chuckled. "And you?"\n\n"I'm a Druze, sir."\n\nYusuf nodded. "Still, we all believe one thing. These Italians are occupying land that isn't theirs. Land that belongs not to their oil companies but to its people. People like you, kid." He paused, looking south. "I've killed for the Republic. I'd die for it. But this is more than that. This is a fight to ensure that they will never oppress these lands again. A fight to bring freedom to everyone living here." He turned and smiled. "Do you want to live in a free world, kid?" Amal nodded. "Good. So do I."\n\nAfter sleeping by the fire, they gave him another tin of soup and directions to his village. Amal returned home. He remembered the words the Turk had spoken, and told his family."
 tur.54.a:0 "We can live in a free world."
 tur.55.t:0 "Urug of the President"
 tur.55.d:0 "İnönü... no, his surname was what the media called him, and there was no need for such formality when with his wife; İsmet put on his uniform. What a miracle it was that it still fit him so well. He felt he could slip into a military parade, those perfect blocks of coordinated soldiers, and fit in perfectly.\n\n"You look great," Mevhibe, his wife, said. Looking up and down at his uniform, she added coyly "Grand Marshal."\n\n"Really? I'm certainly past my prime," quickly adding "unlike you," a nice compliment to his wife.\n\nMevhibe laughed. "Oh, my love. I remember when I first saw you in the uniform, and you have aged oh so fine."\n\n"Oh, the days of war! God, I was dying to see you-" he saw the worried look on his wife's face when dying, war and him were mixed - "and luckily not dying otherwise. Thank God for the Armistice. We both owe something to Rauf. The moment I was free, I took a car to see you. I wasn't even willing to wait if there wasn't a car - you would have seen me come home on horseback!" They both laughed, by now exhausted from tears of joy, laughter, and nostalgia.\n\nTheir son, Ömer came into the room. He smiled, before taking the form he needed - the form of a strong soldier, a stoic boy who was soon to leave home. "You look great, you two!"\n\n"Oh, my boy, you're really going to grow up and review your parents, are you? Oh, come here." Ömer was lucky to have a loving father. İsmet was lucky to have a loving son. Mevhibe was lucky to have a loving family. And how unlucky were they for Ömer to soon leave home for the United States, after the war."
 tur.55.a:0 "All happy families are alike."
 tur.56.t:0 "A Day in Damascus"
 tur.56.d:0 "Another blow to the head with the truncheon. Each time he thought he'd get used to it, but the Turks figured out how to hit differently each time. He never got used to the pain, the searing sensation as he was unable to do anything but scream. The officer pulled his hair to look into his eyes. "Arab piece of shit," the officer scoffed. "If you lazy fucks weren't bent over trying to help Italy, maybe we'd just let you run loose. What's the worst you could do?" The other Turk chuckled as Farim coughed up a mix of saliva and blood, gasping for air. "Now," the main interrogator said. "We know you're a Ba'athist. We know that Italy has been in contact with nationalist groups like yours, and we know that you've been the one spray painting 'Syria will be victorious' in the mornings. The way I see it, you've got two choices: start naming names, or start hoping hell is cozier than you've been told."\n\nFarim looked up through the blood streaming down his face. "Italy? I have nothing to do with Ital-" another blow from the truncheon to his shoulder. He screamed again, writhing in the bonds on his chair. The interrogator held his chin up.\n\n"I don't need you to have anything to do with Italy. But you know people who might. Now tell us, or the next time your wife sees you will be in a dozen tiny boxes."\n\nFarim at last broke down. He named every one of his contacts, the members of his cell, everyone. Sensing the interrogator wasn't satisfied, he began naming his neighbor, his coworker at the bakery, his childhood crush, just spewing names until the officer nodded. "Good, good." The officer knocked on the door as the man with the truncheon untied Farim. A guard entered and saluted. "Take him to the wall and have him shot. Then dump the body where no one can find it." Farim tried to say something, but could only weakly groan as the guard dragged him out of the room and toward the courtyard."
 tur.56.a:0 "Hope you find hell comfortable, Ba'athist."
 tur.57.t:0 "Let Each Stand in Their Place."
 tur.57.d:0 ""History," a tear dripped from Gonca's eye with the weight of the word, "repeats, and yet moves, a wave. Mustafa Suphi lived, fought, and died. We have lived, we have fought, and we will die. But remember the words of Suphi, for they live yet; we are prisoners today, but we are everything tomorrow."\n\nGonca's tears did not stop. She lived a life of a fight that she has not won. She lived a life searching for a light that remains hidden. Turks and Kurds, united in the struggle of the working class, united with all the world's proletariat, a million red fists raised towards a brighter sun. So much poetry has been written describing that universal struggle that things are bad, and must get better.\n\nThe Communist Party of Turkey was no friend to the state of Turkey. They all knew this. They knew that they played a dangerous game advocating for the proletariat. And they played the game nonetheless, and they knew their time would soon come.\n\nThe gazes of the rest of the underground Communist Party of Turkey awoke her from the purple prose of her thoughts. She smiled, and wiped away tears. "Our meeting is done... " she took a careful pause before deciding the next words; she chose a lie, "for today. I wish you all an amazing day." She ended with a truth.\n\nGonca took the book off the table, "Anarchism or Socialism'' by Joseph Stalin, an obscure Soviet politician. She took it and headed outside, where she knew there were the police waiting for them, the fascist dogs.\n\nShe smiled, for she knew she would never die, for she is the proletariat, and the proletariat is she."
 tur.57.a:0 "I know when today is, but I know not when tomorrow shall come."
 tur.58.t:0 "The Birds Have Also Gone"
 tur.58.d:0 ""My fellow citizens of Turkey,"\n\nIsmet İnönü's voice played from the television, but no one was listening. Soldiers hastily assembled their gear, bragged about their future exploits, and wrote to family they might never see again. One by one, the barracks emptied itself as men went outside to formation. Sergeant Adem took a quick count of his men, and noticed one was missing. He rushed inside to find Private Alim sitting on his bunk, holding a photograph of his pregnant wife. Adem prepared to yell at the young private for not being in formation, but stopped. Adem put a hand on Alim's shoulder. "Come on son, it's time to go."\n\n"The insults we received at Malta cannot be forgiven."\n\nThis time, İnönü's voice played in a bakery. The owner, a veteran, had the volume at max. He and several of his patrons were fixed on the speech, taking in every word. Aleyna's baby, however, did not seem to be enjoying the speech, his cries earning her several dirty looks from the other customers. Aleyna paid for some bread, and quickly left the bakery, finding a nearby bench. She joined her infant son, shedding tears for her husband, lost to a militia attack just last month, and for the thousands of wives who would join her as widowers in the months to come.\n\n"As President, I swore an oath to defend our national dignity when threatened. This is one of those times." İnönü' paused, feeling the eyes of an entire nation on him, waiting for his next words. He allowed himself a moment of doubt, glancing at the camera crew, eyes fixed on him. What if they failed? Turkey couldn't afford to get -\n\nİnönü' pushed all his doubts aside. This was necessary. He took a deep breath, and finished his speech."
 tur.58.a:0 ""My fellow citizens, we are at war.""
 tur.59.t:0 "The Cyprus Uprising"
 tur.59.d:0 "Commander Osman Fazil Polat of the Mağusa Kolordusu was not a man that was easy to satisfy, and like many of his rank, was averse to uncertainty and risk. Nonetheless, these were prevalent in war, and the only solution was to prepare and plan as much as possible. The situation in Cyprus involved such major risk, but where planning had paid off. \n\nThe Türk Mukavemet Teşkilatı was a throng of uncertainties. The Foreign Minister had taken a risk trusting Rıza Vuruşkan's group, but the man had insisted. Give them guns, training, and motivation, and the underground militias on the island would rise and seize Cyprus for Turkey. So he claimed, and so it was done. \n\nThousands of weapons covertly smuggled to the islands. Batches of the mujahid fighters quietly brought ashore and trained in leadership, tactics, and strategy which they imparted unto their own men. Turkish special forces infiltrated the island under the identities of civilians, observing on one hand, and keeping the militias coordinated on the other. All in preparation for that moment when the order came to rise up. \n\nAnd rise they did. \n\nPolat was impressed by how quickly the TMT was able to act. Within days they'd massacred Greek defenders in towns and cities and seized centers of government and infrastructure across Northern Cyprus. When he arrived with a division of Turkish soldiers, he found no conflict, but the Turkish resistance coming to meet him. \n\nHe smiled - though the battle was far from won. The Greeks had secured the south, and already there were troops being moved to the front as the skirmishes consolidated into a conventional war - one which he had come to win decisively. "Sir?" He turned upon hearing his second-in-command, Sabri Demirdağ. \n\n"Intel from the front," he handed a small envelope. "The Greeks are massing and preparing to launch a counterattack. We have days, if not hours, to prepare." Polat nodded, his mind already working what he knew of the front, and where the militias and his forces needed to be placed."
 tur.59.a:0 ""Then we must prepare. Either Cyprus will be Turkish, or the mujahideen will not live.""
 tur.60.t:0 "The Last Command"
 tur.60.d:0 "Polat resisted the urge to scream, to berate the hapless soldiers surrounding him, to do something to express the utter frustration, horror - and fear - he now felt. The operation had started so strong, so perfectly - and it had collapsed before his eyes. Worse, it was under his leadership. It didn't matter that the TMT was under Vuruşkan, or that he was subordinate under Turkish Command. He was the one on the ground. He was the one who had been charged with taking Cyprus. He was the one who was supposed to bring victory. The glory - and failure - was his to bear alone. \n\nIn his arrogance, he'd made the worst mistake possible when facing an enemy - underestimating them. The Greeks, considered a joke, a paper tiger of the Italians, had humiliated them. They fought with as much fervor as any Turkish soldier, they acted with discipline, decisiveness, and utter ruthlessness when they hunted, cornered, and executed the TMT soldiers. \n\nHigh off their initial victory, the TMT hadn't been prepared for the fury of the Greeks. Polat had never seen anything like it, much less such fanatical fervor appropriately utilized by the Greek officers. Feints, tactical withdrawals, traps, assassinations, sabotage, every single trick in the book had been used, and the TMT was as hapless as a beheaded rooster. \n\nThe carnage didn't stop on the front lines. The Greeks didn't care about collateral damage, and while he'd instituted some guidelines for engagement, the Greeks had no such restrictions. From torching militia-controlled towns, using infiltrators who poisoned food and water, and using captured soldiers as human shields, there was no leash on what they'd done. They were out for blood. \n\nThe Greeks left a trail of destruction in Northern Cyprus, and would bear the future consequences, but he could not deny it. They had lost, and unless he wanted more to die in this fruitless endeavor, they needed to leave. He'd take what forces he had and turned them over to other fronts, understanding what this meant for his career.  As he prepared to give the order to retreat, he realized it would very likely be the last he ever gave. \n\nHow unfortunate this was how it ended."
 tur.60.a:0 "The Crescent lies shattered in Cyprus."
 tur.61.t:0 "Press the Shatterpoints"
 tur.61.d:0 "Commander Polat, Demirdağ, and several Turkish special forces, and TMT officers were gathered around a table in a local office within Magusa that had been appropriated for operations planning. It was dusty, stifling, and uncomfortably warm, but Polat had been in worse. "All indications are the Greek counterattack has failed," Polat said, to the approving nods and smiles of the room. A few of the less disciplined militiamen were more vocal in expressing their pleasure, but he let that slide. "We've suffered some casualties, but the front is stable, and the Greeks are retreating. Demirdağ?" \n\n"Turkish reinforcements from the mainland have finished their deployment," his second-in-command continued, stepping forward. "They will act as a supporting force to the TMT, who will continue to be our primary source of manpower for this operation. We will use Turkish forces to shore up our most critical and vulnerable positions here, here, and here." He used a pen to mark several points on the map. \n\n"Our logistics chain is established as well," Polat continued, adding several lines from the secured ports. "We will need a small number of soldiers to protect them, since it is possible the Greeks will try and sabotage from behind the lines now that their assault failed." \n\n"That can be done, sir," one of the militia officers affirmed. \n\n"Good," Polat sharply nodded. "Now - we need to turn to the next phase. The Greeks are retreating. They're demoralized, and very likely disorganized. We have the initiative, and we need to press it. If we get stuck in the trenches, we may never get out - we need to win now, or never." \n\nThere were nods of grim agreement as he continued. "We have a few operatives in Greek-controlled Cyprus who've identified the critical points and junctures. We hit them, and the Greeks are firmly on the back foot." He added several more lines connected to a few front lines. "It won't win us the war yet - but it will ensure the Greeks can't push us out." He eyed the TMT officers. "Can we surge soldiers in these locations? \n\n"We can," one of the officers confirmed. "Personnel at the secured fronts can be shuffled around. Timeframe for this, sir?""
 tur.61.a:0 ""The sooner the better. We don't give the Greeks a moment of reprieve.""
 tur.62.t:0 "A Rigged Hand"
 tur.62.d:0 "The night had the tense air of history about it. Groups of Turkish soldiers and TMT forces moved silently into position as one. Polat watched the movements from a hill with binoculars, a two-way radio nearby as he ordered slight adjustments based on what he saw. \n\nThe artillery was in place, having been moved into position minutes before, and trucks were on stand-by to rush Turkish and militia soldiers into position the moment the fighting started. The question, of course, was if the Greeks were prepared - and all indicated that they were not. No doubt they'd noticed the movements and believed themselves about to be attacked. \n\nWether or not they realized the scale at which this was happening, that was an open question. \n\nLowering his binoculars, he looked at the time on his watch. Nearly time. When the clock hands struck - then the assault into South Cyprus would begin, barring slight alterations depending on the situation. A near-synchronized offensive, if launched with minimal disruptions. He trusted Demirdağ and the other officers to execute the operation properly. The clock's hands clicked into position. The time was now. \n\nThe soldiers were ready, holding in place, guns raised, bodies tense, and breathing still as they awaited the order. Trucks started their engines, nervous drivers gripping the wheels with white knuckles. The artillerymen made last-second adjustments, millimeters of difference that would determine if a shell hit or missed. This was it, he'd done what he could, he'd done everything to rig the game in his favor - now he would see if he had a winning hand. He brought the radio up to his mouth. \n\n"Execute." \n\nWith a roar, the Turkish soldiers marched forward, moving between trees, behind cars, and anything that could be used as cover, while opening fire on the Greek lines. Snipers fired from the hills, and artillery boomed as the tranquility of the Cyprus night was broken by battle. His lips set in a thin line, Polat knew that the ultimate success - or failure - of the offensive would be decided very soon."
 tur.62.a:0 "The fate of Cyprus hangs in the balance."
 tur.63.t:0 "The Crescent Flag Flies Proud"
 tur.63.d:0 "There was little that was more satisfying, in war, than reading your enemy correctly. It was a constant balancing act of risks, objectives, knowledge, and knowing how to best employ each. It was an art that few could fully master, and at most gained a passive understanding. This time, Polat had read his enemy correctly. He'd been right - The Greeks had been wholly unprepared for the coordinated offensive into Southern Cyprus. \n\nThe initial assaults had shattered the already porous Greek lines. Soldiers died by the hundreds in frantic retreats, mowed down by artillery and machine gun fire. Hundreds more surrendered, now detained by militias across the island. An unknown number had deserted or fled. Turkish forces swept down the island at a rapid pace. \n\nThey faced only token Greek resistance attempting to fight them off at several natural choke points, but they were too outnumbered, demoralized, and underequipped. They were killed. Their resistance had melted, and when the Turkish forces marched into the last city, there were no soldiers to meet them. Polat suspected that the Greeks had ceded the island entirely, devoting their efforts to evacuating what civilians they could. Suffice to say, he was confident they wouldn't be back. \n\nWhen the Turkish flag finally flew above the last town on Cyprus, the soldiers and militia broke out into celebration, joined by Turkish natives returning to their homes as the tune of Mücahit Marşı filled the air. There was the matter of what remained of the Greeks, but that was an issue that Polat wouldn't have to deal with - martial law kept them in place for now. \n\nHe'd already received a letter of congratulations from the Foreign Minister, and Polat believed the TMT would see significantly more action in the war for their success. As for himself, the war continued. Be it Greek or Italian, there remained an enemy - and it was his duty to defeat them. \n\nSipping at his wine and merely observing the celebration, he muttered his thanks. For now, he would enjoy this victory - one of many more to come."
 tur.63.a:0 "Kıbrıs Yunan olamaz!"
 tur.64.t:0 "The Divided Purgatory"
 tur.64.d:0 "The offensive had been a blunder - a risk Polat had been aware of, yet he'd been shaken when he realized just how badly it had hurt them. The first waves of soldiers had run into a prepared Greek defensive deeper in, a trap they'd lured the overconfident TMT and Turkish soldiers into, and promptly slaughtered them. \n\nMore had died in the retreat, and the Greeks had pushed them out, while alerting the garrisons deeper south for more reinforcements. It was fortunate he'd ordered the later waves to entrench, otherwise they might have been pushed out completely. The other offensives had similarly gone poorly, and while they held their ground, they'd lost whatever advantage they had. \n\nThe days were now spent with Greek and Turkish soldiers exchanging fire behind barricades and in trenches. Artillery from both sides fired. Guerillas, militias, and special forces poisoned, sabotaged, and killed behind the lines, as both sides became more and more entrenched in their positions - the exact thing Polat had feared could happen. \n\nThe invasion required speed and decisive victories to be successful. If any side was allowed to entrench, it would devolve into a stalemate and effectively divide the country in two until one side or another sent enough soldiers to overwhelm through sheer numbers. Polat knew they wouldn't be pushed back out of Northern Cyprus - but the Greeks were similarly impossible to dislodge - not without significant support from Ankara. Support which was not coming. \n\nThe letter from Turkish Command was final. He had to make do with what he had. There would be no extra soldiers or resources to break the stalemate. Which meant that, while this couldn't be called a failure, it might as well have been. He had come to take Cyprus, and it appeared he would not be able to do that. \n\nHis days now were staring at maps bleary eyed for hours, exhaustion dominant as duty weighed down upon him. The soldiers were similarly exhausted. Maybe another offensive would work, but they were not in a position to event consider that. By God's grace, the tide might turn, but for the foreseeable future, Polat feared that Cyprus was about to become a tomb for many soldiers, and a purgatory that would last until the end of the war."
 tur.64.a:0 "The War for Cyprus Rages On."
 tur.65.t:0 "[GetRhodesCommanderTitle]"
 tur.65.d:0 "[GetRhodesCommanderDesc]"
