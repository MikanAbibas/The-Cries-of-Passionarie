 TUR_and_only_defence:0 "...And Only Defence"
 TUR_no_more_occupation:0 "No More Occupation"
 TUR_a_new_military:0 "A New Military"
 TUR_the_lights_in_the_darkness:0 "The Lights in the Darkness"
 TUR_the_lights_in_the_darkness_desc:0 " We are coming out of a dark, isolated age. Triumvate ruled almost all of our foreign policies, we did not have any reasons except for defending against Germans but now, with the German threat fades, it ends.\n\nTurkey is in a new place in the world, strong, stable. But we must accept the modern reality, the reality of superpowers. If a nation like ours wants to prosper, it needs to side with one of the great powers, excluding Germans and Italians, two empires stand, Eagle in the west, and Dragon in the east. While both have their advantages and disadvantages, we need to think about it carefully and decide the future of our nation."
 TUR_eyes_to_the_west:0 "Eyes to the West"
 TUR_eyes_to_the_west_desc:0 "Far, far away in the west, across the Atlantic and beyond the pillars of Hercules, lies what is possibly the greatest rival to nazism and the German Reich's hegemony over the world: The United States of America. While our ideals may vary greatly from theirs, especially when it comes to our appreciation for the worker and his right to reap the fruit of their labour, and how it stands in contrast to America's capitalist, bourgeoisie-centred society, it is evident that the Americans have a lot to offer to us. And with the Germans in Crimea breathing down our necks, and eyeing the Bosphorus, the idea of a pleasant meeting with the American ambassador grows more attractive by the day."
 TUR_liberation_for_all:0 "Liberation for All"
 TUR_liberation_for_all_desc:0 "When given a choice between two evils, many often cower from treading upon their own path due to fears of risk, instead, they allow themselves to succumb to bitter promises of a lesser evil; forgetting about the ideals they held so dearly. Thus is the conundrum the Republic finds itself in, with the American eagle to our west and the Japanese sun to our east, both whispering sweet words of aid into our ears when they, in reality, desire nothing more than to render Turkey into another gear in their imperialist machines dancing to their every whim. However, we did not fall for their lies; we scorned them. The only just path left for the Republic to chart upon is the path of independence and non-alignment. Despite this, Turkey will in no way remain isolated and alone in this treacherous world. Rather, we will reach out to nations that hold the ideals of liberty and equality that we so cherish in common. Together with the embers of democracy and the fires of revolution that still burn bright across this world, we will break the chains that hold down the people of the world, and bring down with them the Empires that thrive off the suffering of others."
 TUR_the_developing_world:0 "The Developing World"
 TUR_the_developing_world_desc:0 "While much of Africa and Asia remains under the thumb of Italians or the Germans, and the Japanese respectively, there are still many nations that have clamoured and fought for the independence and survival of their nations. These liberated peoples and nations are often left secluded from the outside without partners, allies or even the most basic forms of diplomatic recognition. This is of course where the Republic comes in, with our arms extended, we will take these developing nations into our embrace. The exploitative treaties that these nations once experienced will be torn apart, and a new era of fair, mutually-beneficial trade and combined prosperity will commence."
 TUR_a_global_struggle:0 "A Global Struggle"
 TUR_a_global_struggle_desc:0 "No man may be left to suffer, shackled and kept down by tyranny and capital. Not an inch of the globe may be left untouched by the revolution's zealous fires, and unclaimed by the hard-working labourer. Not a single autocrat may flee the fervour and wrath of the revolutionary people they betrayed.\n\nThese slogans, as simple as they may seem at first, mark the beginning of a new era of Turkish foreign policy. An era of unending support to revolutionary movements, both democratic and socialist, across the globe. The streets of  Ankara will, like those of Moscow before it, overflow with vigorous fervour, and flood with revolutionaries seeking to court the Turkish people's favour towards their struggles. The workers of Turkey will join the Workers of the world, and together they will march as one in the struggle for emancipation."
 TUR_the_worlds_largest_economy:0 "The World's Largest Economy"
 TUR_the_worlds_largest_economy_desc:0 "The United States has the biggest economy in the world, with huge reserves, income sources, and trade potential, they are worthy of our admiration. Our country was in constant economic struggles in the past years, but those years are over, and it's time for us to grow again, and America will be our friend on this matter. We need a comprehensive trade agreement with America, their big market and goods will surely help our economy in both the long term and short term, and we are certain that they will look positively to this issue."
 TUR_arms_from_america:0 "Arms from America"
 TUR_arms_from_america_desc:0 "The Turkish military has seen better days, to say the least, a weapons shortage plagues the army, and what few weapons we have in the grasp of our hands are outdated, incapable of defending against many of our foes. Domestic production can only go so far when it comes to these modern beasts of war, and with enemies surrounding our every side, and painful memories of humiliating defeat still fresh on the minds of our people, this situation is simply unacceptable.\n\nThankfully, propositions to contact our good friends over in America in hopes of reaching an agreement on an Arms deal have already been drawn up. With generous compensation awaiting them, the Americans are sure to accept our proposal."
 TUR_friends_in_the_free_world:0 "Friends in the Free World"
 TUR_friends_in_the_free_world_desc:0 "To consolidate our efforts on being more friendly with the west and the OFN, we have to show them what we are capable of. We shall denounce both Germany and Japan, even though we have been allies with them, we have seen through their lies and now, are willing to change our course. Our proud republic won't stand with fascists, but the prosperous west!"
 TUR_alongside_the_free_nations:0 "Alongside the Free Nations"
 TUR_alongside_the_free_nations_desc:0 "Decades ago, the nation of Turkey found itself courting the hideous fascist regimes that were scattered across the face of Europe, the Republic virtually whored itself to their ilk, with little gain but shattered notions of dignity and endless guilt. A dark stain on the nation's history. However, all stains can be cleansed, or at least mitigated, and those led astray from natural ideals can be brought back onto the righteous path. Never has that been more evident than now, as blossoming relations with the United States have now enabled the Republic to stand proudly amongst the ranks of the free world.\n\nFurthermore, membership into the Organization Of Free Nations is increasingly becoming treated as an eventuality by many as the nation grows more interlinked with the Organization's member states by the day."
 TUR_what_about_the_japanese:0 "What About the Japanese?"
 TUR_what_about_the_japanese_desc:0 "Ambassadors were sent, offers proposed, and messages sent, yet the Americans have not dignified us with the expected, enthusiastic response we longed for. The picturesque sight of the American eagle soaring through atop the skies besides the Turkish crescent that many dreamt so see, is now a sight to be forgotten.\n\nNevertheless, the Americans are not the only superpower on this earth, and they definitely aren't the only power that shares our antipathy towards the Germans and their petty Reich. There is another: the Empire of Japan. While many within the ranks of our party are disgusted by their actions across Asia, seeing them as fascist tinpots who are ultimately no different from the Germans, it is undeniable that there is plenty to gain from opening up contacts with the Japanese. To touch the vast riches that litter the land of the rising sun, be they technological or financial, alone is well worth stomaching their guilt."
 TUR_align_with_the_cps:0 "Align with the Co-Prosperity Sphere"
 TUR_align_with_the_cps_desc:0 "Stars glimmer brightly amidst the sky above Tokyo. A banquet is held; a feast ensues; such are the festivities that mark the Republic of Turkey's ascension amongst the allies of the most prosperous of societies‒or so the propaganda goes. While actual Turkish membership into the Greater East Asian Co-Prosperity is desired by none outside the most jingoistic elements of Japanese and Turkish society, Turko-Japanese relations remain at an all-time high. Blossoming partnerships sprout in every province of Turkey, all the while products marked "Made In Japan", "Made In China" or "Made In Guangdong" become an increasingly common sight on store shelves across Turkey.\n\nLike Solis and Luna above Gaia, the Turkish Crescent and the Rising Sun now stand together, illuminating the earth with incandescent light."
 TUR_against_all_imperialists:0 "Against All Imperialists!"
 TUR_against_all_imperialists_desc:0 "To our north, the Germans have brutalized a continent, scarring its face beyond recognition, they slaughter parents and enslave their children. To our east, the Japanese hold nations in their captivity, luring them in with promises of Pan-Asian liberation, all the while they take their people hostage and force them to toil till the day of their deaths. To our west, in what may be the most insidious of all manners, the Americans pride themselves as an arsenal of liberty, democracy and egalitarian values, yet beyond their facade of humanitarianism is a vehicle of capitalist exploitation.\n\nWe see past their cloaks and their faux promises. Ignominious deceptions and their dedication to loot the world and ravage it for their desires, exposed for our eyes to see. Their truest, most grotesque forms lay bare for all to glance. Yet we will do not fear their wrath, nor will we cower from it. Instead, we proclaim, with revolutionary fervour, from deep within our hearts a raging antipathy to their desires; a zealous struggle against imperialism in all of its most hideous forms."
 TUR_workers_of_the_world_unite:0 "Workers of the World, Unite!"
 TUR_workers_of_the_world_unite_desc:0 "The spirit of the revolutionary toiler falters, taking with it the fires of the world revolution, as a direct consequence of disorganization and chaos within the ranks of a revolutionary movement. Parties acting erratically, furthering away from the commonly held doctrine of a global movement, or that movement's failure to rally itself in the protection of revolutionary embers, will often lead to a movement's undoing. Such was clearly illustrated in the fiery collapse of Bukharin's Soviet Union and its disastrous effects on leftist movements across the globe.\n\nWe cannot allow this very same awful fate to afflict the international proletariat once more, thus the Republic positions itself deeper within the fabric of international socialism. Revolutionary movements the world over must learn to see us as brethren whose undying support to the international revolution is guaranteed, and not as foes."
 TUR_reconciliation_with_italy:0 "Reconciliation with Italy"
 TUR_reconciliation_with_italy_desc:0 "The flag of the partisans now flies high over Rome. The Italian people have risen up and thrown off the shackles of fascism and Ciano's tyranny. While Italo-Turkish relations have seen significant deterioration since the collapse of the Triumvirate and the onset of the Italo-Turkish War, this momentous occasion, the destruction of fascism in the country that first birthed it, prompts celebrations and the immediate restoration of Italo-Turkish relations. Envoys carrying gifts will arrive at the shores of the Adriatic asking not for land nor for wealth, but for the birth of a fraternal spirit, a spirit of unity, between two nations dedicated to the struggle against fascism and its ugliest excesses."
 TUR_condemning_the_fascist_menace:0 "Condemning the Fascist Menace"
 TUR_condemning_the_fascist_menace_desc:0 "Despite the DYP's fervent opposition towards İnönü's catastrophic, short-sighted war with the Italians, it will come as no shock to anybody with a lick of sense that our government finds itself in staunch opposition to the fascist regime in Rome. Renewed by Ciano's fall from grace, the fascist menace and the zealots within it who draw pleasure from the sight of human suffering, the men who wish to subjugate the world to their desires and burn down the vengeful spirit of revolution, remain a critical threat to our government and the world at large. Their continued survival puts the globe at peril, thus this barbaric regime and all the savage sycophants that dance to its tunes, whether they be shoeshiners at home or bootlickers across the colonies, must be met with our harshest opposition and spiteful condemnation at every turn and through every channel possible."
 TUR_isolated_no_more:0 "Isolated No More"
 TUR_isolated_no_more_desc:0 "Newly born relationships bloom with allies across the world; it can finally be said that the Turkish dove has broken out of the cage of isolationism built around it by the fall of the triumvirate and the onset of the disastrous Italo-Turkish war.\n\nThe ports of the Republic now bustle with activity with trade roaring back to life. The shelves are once again stocked to the brim with the latest, most ingenious products the world has to offer, and thanks to these new allies and their swinging open of the gates of trade and prosperity, goods crafted and perfected by Turkish hands now find themselves cherished by many across what previously were untapped markets."
 TUR_turkey_stands_with_the_world:0 "Turkey Stands With the World"
 TUR_turkey_stands_with_the_world_desc:0 "Our network of alliance grows and blossoms by the day, entrenching Turkey's position in world affairs and international diplomacy as a pillar of the global community once more. Now, we must stop our gaze from going beyond the seas and look back home. Beyond Thrace and across the Bosphorus, and south of Hatey, are the Balkan peninsula and the greater Middle East respectively. Both perilled under the weight of the Ottoman Empire, whose sin we still carry in shame, both saw exploitation and death at the hands of it. Thus, we ought to reach out to their people once again, yet now we will come with gratitude and blessings, not swords and cannons. With these regions starring as the centrepiece of our latest diplomatic offensive, the new Turkey will for another time be on full display for all the world to see."
 TUR_a_resurgent_power:0 "A Resurgent Power"
 TUR_a_resurgent_power_desc:0 "Our clients have reported that the northern bear has finally woken from its long winter sleep. If we want to protect our geopolitical situation, we must always remain aware of the changes happening, as for this, we shall ready our overtures to the cold land of the north.\n\nHistory has shown us the importance of dealing with Russians, the ignorance of Ottomans has resulted in weakness. As the torchbearers of the past we must decide to see the Russians from a new, positive light or as a potential threat to our lands, but of course, it's up to what waits us in Russia."
 TUR_heirs_to_the_union:0 "Heirs to the Union"
 TUR_heirs_to_the_union_desc:0 "Since the Russian loss in the Second World War and the ensuing collapse of the USSR, Russia has seen itself shattered, divided between petty fiefdoms with no ideological bent but to secure the warlord's continued wealth and the consequent misery of his subjects, statelets proclaiming themselves the continuation of a long last legacy, whether it be intellectuals carrying the reborn torch of Kerensky's republic or the reactionary cliques that brand them as the true successors of the empire of the old, fascists with seemingly no sense of the irony of their beliefs in their situation and finally but most significant of all, at least to our party's socialists, the remnants of the fallen union. These heirs to Bukharin and Lenin, who are aligned with us in belief in the socialist ideal and the revolutionary spirit that carries us towards it, provide us with a natural ally and partner in the turbulent wastelands that cover the lands where the slain Russian giant once stood proud."
 TUR_heirs_to_the_republic:0 "Heirs to the Republic"
 TUR_heirs_to_the_republic_desc:0 "An epoch ago, the German war machine would march far beyond the gates of Moscow and to the frigid port of Archangelsk and the warm coasts of Astrakhan, bringing with them pain, suffering and ruination. Their barbaric advance would bring down the Soviet colossus and with it the revolutionary ideals that it had proliferated. From within the corpse of the shattered union many warlords would rise, personalistic fiefdoms, military juntas, reactionaries longing for the return of slain tyrants, fascist bootlickers, remnants of the soviet cadaver dedicated to embodying a spirit that has already departed this world, and most interesting of all to our party's liberals: the various scattered, hidden bastions of liberty dedicated to the values of the stillborn Russian Republic and its long thought extinguished ideals. These heirs to the legacy of the 1917 revolution are among the most amiable to us within the Russian wastes. Thanks to the belief in democratic self-government and egalitarianism that we both hold in common, these statelets would make a great partner to us."
 TUR_condemning_the_autocrats:0 "Condemning the Autocrats"
 TUR_condemning_the_autocrats_desc:0 "Not all the states that have risen from the ruins of the Soviet Union have adopted any sort of faithfulness towards republicanism, socialism and the ideals of liberty and egalitarianism that constitute the base of both. These states form both an ideological and geopolitical anathema to our nation, thanks to their harsh autocratic measures and open disregard for civil liberties bringing down the spirit of the workers that we so treasure, and their opposition to statelts more amiable to us in the region. Therefore, these illegitimate, traitorous statelets will receive nothing but our harshest condemnation and criticism. This measure will also likely boost our relations with their more diplomatic rivals."
 TUR_new_economic_opportunities:0 "New Economic Opportunities"
 TUR_new_economic_opportunities_desc:0 "As the dust begins to settle on the vast landscape of Russia, at least for the time being, a sense of stability, something unseen in decades and forgotten by many, has finally resurfaced across Russia. The endless chaos of warlordism has passed as new, coherent administrations and governments begin to form. Such circumstances allow Russia, disconnected from the global economy since the shattering of the old Soviet Union and isolated from world affairs, to emerge back onto the world's spotlight, and with them an extensive assortment of local goods ready to trade, and even more boundless demand for resources to fuel their reconstruction efforts. This opportunity is not one to be skipped past and ignored; we could leverage our newly minted ties with the statelets of Russia to come to an agreement over a series of mutually-beneficial trade agreements. The economies of Turkey and Russia will prosper together."
 TUR_our_shared_animosity:0 "Our Shared Animosity"
 TUR_our_shared_animosity_desc:0 "An empire stretches across Europe, from France to Moscow. An empire of hate and suffering. An empire that is the antipodal to Midas touched, bringing ruination, murder and plunder to all it touches. An empire that has scarred every inch of land it lord over beyond recognition. The German Reich has subjugated millions into labouring and serving their murderous machines and whims. The Germans, through their inhumane, barbaric practices and their threatening overtures, have made an ardent enemy out of us. The Russians, like us, also share this animosity towards the Germans due to their invasion of the Soviet Union all those years ago, their ongoing occupation of a quarter of Russia's territory, and their brutal subjugation and murder of that land's residents.\n\nWith the Russian bear reawakening from its decade long slumber, the threat of war with Germany in the near future becomes ever the more likely. We must inform our Slavic friends that we commit ourselves to help them reclaim their lost lands, should that conflict ever come."
 TUR_an_ally_to_the_north:0 "An Ally to the North"
 TUR_an_ally_to_the_north_desc:0 "With our recent overtures to the statelets that rise from the ruins of the former Soviet Union, Turko-Russian relations have blossomed for the first time in decades. Thanks to this, we have secured ourselves an alliance of paramount significance with the statelets of the frigid north. The Russian bear rises once more on the world stage as the Turkish crescent glimmers onto it, and now, a newborn era of bountiful prosperity may begin in the history of these two brotherly nations."
