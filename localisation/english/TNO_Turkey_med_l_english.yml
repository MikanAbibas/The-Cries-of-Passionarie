 TUR_GNA_government_info_1:0 "Current Government: [Get_TUR_government]"
 TUR_GNA_government_info_2:0 "Leader of the Divan: §VFuat Sirmen§!"
 TUR_GNA_Assembly_info_tt:0 "Fuat Sirmen was born in 1899 in Istanbul, graduating from law school in 1924, he was sent to Rome for further studies by the Ministry of Justice. After this doctorate studies in 1930, he returned to Turkey and served in the same ministry that sent him. He began his political career in 1935 with CHP; being elected as a MP from Erzurum and later Rize. Between 1943 and 1946, he was the minister of economy during Şükrü Saraçoğlu government, overseeing the formation of Grand Council of Fascism. Thus, being one of the foundators of the council, he was elected as the Head of Divan by the same council he helped to create. He mainly holds hardline Kemalist ideals, yet his political activities weight harder now.\n\nIt is no secret that Fuat wants to retire, but when?"
 TUR_GNA_Assembly_logo_basically_info_lol_tt:0 "Much has changed in the Turkish Republic's inner workings since the Second World War.\n\nFor one, the Grand Council of Fascism has superseded the Head of the Divan as the Grand National Assembly's most influential power. This august body oversees any motion brought forward in the legislature, and furthermore has the exclusive right to veto bills without debate. The members of Turkey's sixteen government committees appoint two of their own into the Council.\n\nThis is not to say the Head of the Divan is now impotent within his domain. Nominated by his own assemblymen and voted upon by the Council, the Head's powers are more than enough to bring the often unruly parliament to heel. Subordinate to him are the President and the Prime Minister. In contrast to the Council, these men must have their actions approved by a majority of the Assembly. Such restraint is counterbalanced by the fact that the President may invoke, with the Council's approval, an emergency state.\n\nBelow even them is the 450-strong Grand National Assembly, helmsman of the great Turkish ship. The majority party appoints the Leader of the House, while those parties opposed appoint the Leader of the Opposition. Both titles render their holders immune to arrest except under the most grievous circumstances. The Assembly itself also draws committee members within its ranks.\n\nThe parties themselves each appoint a Deputy Speaker, who formally represent their fellow partymen in the Assembly and may submit bills, request readings and exercise vetoes in their name. Note that a Deputy Speaker may also be the Leader of the House, but not Leader of the Opposition."
