 TUR_ozgurluk_simdi:0 "Özgürlük Elinde!"
 TUR_the_republics_principles:0 "The Republic's Principles"
 TUR_the_republics_principles_desc:0 "Turkey and the Turkish people have one thing common in politics, and that is Atatürk. Most of the parties have their own version of implementing it, and as to how much we do not like pure Kemalism, we need to use it to achieve our goals. Rejecting them would hurt and isolate us, but we can have our own version of Kemalism. A true Kemalism that Atatürk would support if he was in our era, a leftist Kemalism that encompasses all of the good sides of Kemalism, a Kemalism that we can use..."
 TUR_reformism:0 "Inkiıâpçilik..."
 TUR_reformism_desc:0 "Reformism is one of the most important aspects of Kemalism. For states like Turkey to prosper and advance, it should be made through reformist lines. A Kemalist should be a reformist, as to how Atatürk wants it, and our reforms are in contact with Kemalism, so being against DYP's reforms is betraying Atatürk itself, right?"
 TUR_populism:0 "Halkçilik..."
 TUR_populism_desc:0 "While the people of Turkey have shown overwhelming support for our message of social justice for the lower classes, the same cannot be said for the party as a whole. In particular, the centrist liberal members want to bring the party position back on one closer to what they claim is the original vision of Atatürk, one of class collaboration rather than hostility.\n\nHowever, the liberals have forgotten, in their search for compromise and moderation, the true meaning of Populism in Kemalist theory, which explicitly states that sovereignty belongs to the people unrestrictedly and unconditionally. How can one make Populism possible if the voice of the people gets silenced by the calls for class collaboration? How can equality between Turks be possible if we ignore the division in our society? Class conflict is an important element in building Populism, and we need the liberals to see reason."
 TUR_republicanism:0 "Cumhuriyetçilik..."
 TUR_republicanism_desc:0 ""
 TUR_the_peoples_rights:0 "The People's Rights"
 TUR_to_liberty:0 "To Liberty"
 TUR_a_free_media:0 "A Free Media"
 TUR_of_expression:0 "Of Expression"
 TUR_of_association:0 "Of Association"
 TUR_and_to_equality:0 "And to Equality"
 TUR_ne_baci_ne_bayan:0 "Bundan Böyle, ne Bacı ne Bayan"
 TUR_a_haven_for_all:0 "A Haven for All"
 TUR_free_and_equal:0 "Free and Equal"
 TUR_our_rights_ensured:0 "Our Rights Ensured"
 TUR_secularism:0 "Laiklik..."
 TUR_secularism_desc:0 "Laiklik means separation of the state institutions from the control of the religion, and the DYP is the proudest defender of it, fighting against the apathetic CHP and dogmatic UDP. Religion must not affect the state but should be only a matter of the common man. Turkey is a Laik state and no one could change that but some parties like UDP don't think like that. They want Laiklik to be more pacified, but this only could lead to an Islamist state. As how Atatürk fought against extreme Islam, we shall take his torch, and never go back to the chaos of the 1920s."
 TUR_statecraft:0 "Devletçilik..."
 TUR_statecraft_desc:0 " Our party is vast, liberals, social democrats, communists and socialists all united under the banner of the DYP. But one of the problems of the coalition is the principle of Statism. We've ruled by a statist economy for decades, and it has benefits for us as it has disadvantages. The party's liberals oppose statism, for them, the old ways of government ruling the economy only slows down the Turkish economic growth, they propose a limited privatization plan, while the main socialist wing supports statism, without it, people would be jobless and trying to privatize the economy this quickly could only harm the country, they propose the reverse, supporting the already established state corporations. Kemalists in general and the socialist wing both want us to preserve the status quo, and siding with them and getting their support would be great for us too. It's up to us to choose between them, but whichever we choose, we should think the future of our country."
 TUR_nationalism_DYP:0 "...Miliyetçilik?"
 TUR_nationalism_DYP_desc:0 "We must confront the firmly entrenched Nationalism installed after 30 years of Kemalism, however the DYP and the cabinet are openly split on how exactly to do this.\n\nProposal 1 insists we must condemn the very idea of Nationalism, pointing out its inherent belittlement and mistrust of other cultures. Certainly be more effective in ensuring minority protections and indeed be the expected outcome from our supporters, but it would also whip the already irritated opposition into a full on frenzy, and provoke a response we might not be able to quell.\n\nProposal 2 suggests we begin a propaganda campaign aimed at turning Nationalism into a pluralistic, egalitarian love of the country we all live in, regardless of our background. This would perhaps win over some on the Kemalist Left and ease the fears of the silent majority, but our base and some marginalised groups may be unnerved by our sudden U-turn.\n\nThe two suggestions are expected to be heavily debated upon in upcoming cabinet meetings, and once a decision on the question is made, there can be no going back."
