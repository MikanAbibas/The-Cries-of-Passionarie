 TUR_DTS.143.t:0 "The Dunes Roar"
 TUR_DTS.143.d:0 "As Italian and Turkish forces clash over the Mediterranean, strange and irregular activity is abuzz is in Syria. The people whisper, rumours travel between villages, guns disappear, supplies go missing, attacks increase, to many it may seem that the tension in the air was palpable. However, the Turkish officials painted a whole different picture, everything was either a falsity, a coincidence, or some simple mismanagement. The Syrian resistance had been wiped in 1959, NASIL was just a barking dog that couldn't bite, was it not? \n\n Unbeknownst to the Turks, encampments had formed hidden away within the deserts, plains, and mountains of Northern Syria, and in one of these very encampments was none other than Hafez Al Assad himself. Assad, as one of the leading four quadrumvirs of NASIL, had sent a call throughout Syria calling upon all her sons to rise and fight for its liberty. Assad called upon those villagers who turmoiled under occupation, to those intellectuals who saw the beauty of liberty, to those veterans who saw their dreams of an independent Syria crushed again and again by the boots of occupiers, to those victims of oppression, and to those whose names have been erased from history by the Turkish regime.\n\n The call had resonated in the hearts of the Syrian people, and the camps became flooded with volunteers. Soldiers of all ranks, men who left their trades for the national struggle, teens and young adults who saw no future for themselves in a land oppressed by the chains of imperialism and even women, long seen as taboo to even think of war, had joined the ranks of the revolution. The joy that filled him at the sight of these people from all walks of life, who had never known each other, trust each other as brethren seeking nothing more than their motherland, had almost brought the towering general to tears. The lion of Syria, enchanted by the sight of courage, and energized by the renewed determination of the people, proclaimed that the national struggle for liberation had begun and will not end till the imperialists are vanquished and the motherland is finally free."
 TUR_DTS.143.a:0 "Lion of Syria roars."
