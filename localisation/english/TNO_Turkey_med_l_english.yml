 TUR_use_ataturks_special_savings:0 "Use Atatürk's Special Savings"
 TUR_shattered_star:0 "Shattered Star"
 TUR_what_happened_to_a_full_stomach:0 "What Happened to a Full Stomach?"
 TUR_public_works_jobs:0 "Public Works Jobs"
 TUR_bread_lines:0 "Bread Lines"
 TUR_golden_sun_sets:0 "The Golden Sun Sets"
 TUR_desert_shock_desc:0 "The Italo-Turkish War, conceived as a means of bearing Turkey to glory on the back of its Middle Eastern conquests, has only brought catastrophe. The physical flight of the military from the Levant has triggered a retreat in all areas of Turkish politics. The economy, burdened by war spending, has gone into freefall. Nationalism, steadily building for decades, has found itself grinding to a halt as Turkey faces its worst defeat in decades. Worse still for the government, faith in the CHP is rapidly declining.\n\nThe idea of capable single-party rule kept Turkey afloat for decades, but it is clear that this system has exhausted its potential. The CHP's sole bet for maintaining power is to concede to popular unrest and hold snap elections in several months. All the leadership can do is hope that some semblance of public sympathy for the party still exists in the people's hearts."
 TUR_broken_crescent_desc:0 "For decades, the CHP has had a complete monopoly on Turkish nationalism as a political project. Opposition to its secularist, statist program meant opposition to the Turkish nation-state as a whole, and Turkey's rising national prestige meant that the party was easily able to maintain its image. However, the stunning defeat against Italy has badly damaged the CHP's nationalist credentials, perhaps irreparably.\n\nThe United Democratic Party, traditionally in sharp conflict with the Kemalist ideal, has found itself the unlikely beneficiary of defection from the CHP. Right-wing nationalists, dissatisfied with the CHP's seeming weakness, have found themselves a new home in what they see as a more "authentic" vision of the Turkish people: one rooted deeply in their Islamic faith. A new competitor to the Kemalist vision of nationalism has risen, and it is unclear which will win out."
 TUR_what_happened_to_our_dream_desc:0 "In an instant, Turkey has gone from a rapidly rising power addicted to its own triumphalist narratives to a broken, confused fading star, desperately questioning itself over what went wrong. Forty years of an unbroken winning streak, from the victory over the imperialist powers of Europe that built the basis of the new republic to several decades of successful reforms to being invited into the postwar order as a new middle power, have washed away in an instant, overshadowed by the magnitude of Turkey's first and greatest failure.\n\nThe Turkish psyche will not recover from such a loss overnight, but the responsibility falls to the government to salvage the people's image of the nation. It will be necessary not only to scrutinize the failures leading up to this defeat, but to build a national identity that can withstand future defeats."
 TUR_those_who_are_alive_desc:0 "In these tumultuous times, it can feel as though the Turkish people are incapable of finding common ground. Are our problems caused by a lack or an excess of nationalism? Is bourgeois profiteering or statist mismanagement the cause of our economic woes? Is Islam the center of our people's identity or a backwards relic? Ironically, that the breadth of our differences is making basic governance difficult is one of the few areas where all parties agree.\n\nCHP has drafted a piece of legislation that should provide at least the image of consensus. Supporting the veterans of the recent war is a political goal that all, from the most hardline nationalist to the most critical leftist, can support. The new bill will provide pensions to Turkey's heroes, ensuring both that they get fair compensation and that the National Assembly can work together despite their immensely different worldviews."
 TUR_anadolu_aglayan_ana_dolu_desc:0 "A nation's army is the symbol of its virility. As haphazard assortments of feudal levies transition into orderly formations of marching soldiers, so too does the motherland progress from a backwater to a modern state. Since the War of Independence, our army has been Turkey's pride and joy, and its victories the victories of an entire people against those that would hold us down. Militarism was promoted by the CHP as a pillar of the nation, and Turkey's mounting victories only reinforced this state of mind.\n\nThe absolute defeat we have faced in the recent war against Italy has shocked the nation and depleted its confidence in the armed forces overnight. This plummeting faith threatens to drag the party into the depths with it. The CHP needs to change its image, deemphasizing martial glory in favor of the social obligations that it has and will continue to fulfill for the people's sake."
 TUR_mandatory_loans_desc:0 "In for a penny, in for a pound. Initial attempts at revitalizing our economy have all been undertaken in order to get us out of this crisis. All but one, one that every government has to go through during times of crisis.\n\nLoans, the sinews of war. We cannot avoid them: if we want Turkey to recover from this crisis, we'll have to ask for loans from the national bank and - Allah forgive me for even considering it - foreign powers."
 TUR_please_invest_desc:0 "When it rains, it pours. Such is the way life is: it never gets any easier and when things can go bad, you can be sure they WILL go bad.\n\nGiven our situation, faith in our economy has been declining as of late. It's not really surprising, but that's not a good thing for us if we are to fix our money problem - or at least, find a band aid solution to it. Any solution will be good, as long as we get private investors to invest as much as they can afford, if not more!"
 TUR_use_ataturks_special_savings_desc:0 "Kemal Atatürk, the father of the Turkish Republic. Hero to many young Turks, Mustafa Kemal was also Inönü's leader and friend. A prudent statesman, Turkey accumulated an emergency state treasury under his presidency, one that would be only used in case hard times were ever to hit the nation.\n\nHard times have finally come. Inönü knows that it is time to use the savings that his late friend accumulated decades earlier and that the time of caution is long past due. Though people might disagree, these savings will be of use for this crisis: for if Turkey was to fall to economic instability, Atatürk's legacy would be all for naught."
 TUR_shattered_star_desc:0 "Turkey's economy is in freefall. Enormous state investments into the military were instituted with the promise that they would more than pay for themselves through the expansion of opportunities for Turkish businesses in the new Middle East, but our utter defeat has caused the exact opposite. Turkey is no longer a country to bet on; it is worn-out, washed-up, and increasingly being left behind by the region.\n\nIt is necessary to combat this conception of our country before it becomes hegemonic. Turkey needs to become competitive quickly, before foreign investors are completely scared out of the country. By devaluing the lira, we can cheapen exports, which will intertwine the country into the global economy and grant thousands of jobs to citizens who desperately need the work."
 TUR_what_happened_to_a_full_stomach_desc:0 "One of the CHP's largest promises to the Turkish people has been rising living standards, one that the government had up until now largely kept. Improvements in education, rising wages, more work, and industrial development have raised people's expectations along with their lot in life. The recent defeat has proven to be a dramatic reversal in fortunes for not just the CHP, but an entire way of life; an edifice of prosperity decades in the making has crumbled.\n\nRationing, unheard of for years, is now a necessity in the new Turkey. The present situation requires that the Turkish people collectively tighten their belts, no matter how unfair it may seem to them. We can expect these policies to be quite unpopular; the DYP has attracted many citizens angered by what they see as being forced to bear the burden of elite malfeasance. But if Turkey is to survive, there can be no alternative."
 TUR_public_works_jobs_desc:0 "While we deliberate in our offices about the present crisis, we cannot allow ourselves to lose touch. Thousands of Turks have lost their jobs as a result of the recent economic collapse, and they wait with bated breath to see how the government will ameliorate their dire situation. We also have reasons more practical than humanitarian to be wary of mass unemployment; it is a force capable of igniting enormous social unrest, in extreme cases enough to topple governments that face too much public wrath.\n\nThe CHP has to show the public that it still cares about them and their interests, the best way to do so being a direct intervention into the employment situation. If the people want work, let them work to resuscitate the nation: mass employment in the public sector is the route out of this unprecedented crisis."
 TUR_bread_lines_desc:0 ""Nothing comes free in life" is how the motto goes. The working class knows it all too well and that is why they toil each day in order to survive. But given the situation, freebies would likely be welcomed without an ounce of suspicion...\n\nOur economy being in shambles, the Turkish working class is evidently hit the hardest by it, with families being barely able to sustain themselves with scraps of food. If we want to avoid more upheaval and suffering while preventing the CHP's popularity from dropping lower than it already is, we'll have to provide free food to those in need."
 TUR_golden_sun_sets_desc:0 "The end is drawing near: today is the day elections are held throughout Turkey, and many CHP members anxiously await the results, unsure of what's to come: the end of an era or a phoenix rising from the ashes?\n\nWhether the emergency measures taken following Turkey's shameful loss in the recent war will have softened the blow dealt to the CHP's already dwindling popularity sufficiently for the party to barely clinch victory or not, today the citizens of Turkey will choose the path they'll all tread together for the years to come."
 TUR_dawn_of_a_new_turkey:0 "Dawn of a New Turkey"
 TUR_dawn_of_a_new_turkey_desc:0 "After a hard-fought election, the DYP has come out victorious! The Turkish people will no doubt expect a lot from us, and we must be prepared to deliver. A new day awaits for Turkey!"
 TUR_ensuring_our_mandate:0 "Ensuring our Mandate"
 TUR_ensuring_our_mandate_desc:0 "We may have won the election, but that doesn't mean we can forget about the people who voted for us. Our mandate is built on popular support, and we must work to ensure that popular support continues long after the polls have closed."
 TUR_damage_control:0 "Damage Control"
 TUR_damage_control_desc:0 "One of the main factors that brought us to power was the disastrous aftermath of the war with Italy, and our promises to address that aftermath. Now that we're in power, the time has come to make good on those promises. Turkey must be repaired, and we are the ones who must attend to it."
 TUR_support_from_the_unions:0 "Support from the Unions"
 TUR_support_from_the_unions_desc:0 "Our ambitious program of reform is perfectly compatible with the goals of the trade unions of the nation, and we should ensure they know this. As we begin to secure our political power, we should reach out to unions and court their support. So long as we keep to our promises, it seems only natural for them to accept us."
 TUR_and_from_the_long_oppressed:0 "And from the Long-Oppressed"
 TUR_and_from_the_long_oppressed_desc:0 "Turkey is not just a land of Turks, but many other ethnic groups as well. For too long, the government has tried to repress these groups and promote Turkish supremacy. Well no more. We shall reach out to groups and individuals who advocate for the rights of minorities and ensure they are part of our coalition. Not only will this reinforce our planned reforms, but it will help bolster our political position."
 TUR_the_job_of_the_people_alone:0 "The Job of the People Alone"
 TUR_the_job_of_the_people_alone_desc:0 "While it may be tempting to try and cooperate with other powerful political parties, the risks are far too great. Rather than potentially compromise our vision for Turkey, we shall instead rely on those who got us here in the first place - the people, and the people alone."
 TUR_an_ally_in_the_old_party:0 "An Ally in the Old Party?"
 TUR_an_ally_in_the_old_party_desc:0 "Not everyone in the CHP is totally opposed to our aims. We can use this fact to our advantage. By contacting Bülent Ecevit and the left wing of the CHP, we can hopefully gain greater support for our reforms than our party alone could provide."
 TUR_the_democratic_coalition:0 "The Democratic Coalition"
 TUR_the_democratic_coalition_desc:0 "Although our party and the UDP stand diametrically opposed on many issues, we have a shared wish to end the dominance of the CHP and democratize Turkey. An alliance between our parties could be decisive in ensuring our democratic reforms are implemented."
 TUR_a_popular_will:0 "A Popular Will"
 TUR_a_popular_will_desc:0 "Our campaigning seems to have borne fruit. We have reinforced our power and secured popular support for our aims. While we cannot forget those who have helped us get here, we now have enough backing to begin the real work of governance. Let our reforms begin!"
 TUR_reversing_shock_therapy:0 "Reversing Shock Therapy"
 TUR_reversing_shock_therapy_desc:0 ""Do not blame the son for the sins of the father" is a motto many say in order to shift the blame, but very few actually put it to use. And very few will not blame the DYP for the privatisations of state assets done under the CHP.\n\nThough these privatisations were done during the crisis, under a great time of duress, the loss of these assets to private entities will, in the long run, harm Turkey more than it helped it in dark times. The DYP must reverse these now, else the people get anxious and angry."
 TUR_repairing_the_country:0 "Repairing the Country"
 TUR_repairing_the_country_desc:0 "Though the war never reached the heart of Anatolia - or barely, it doesn't mean the cities throughout Turkey were not affected directly or indirectly in some ways.\n\nEconomical collapse, urban fighting, you name it. No matter what happened, it is the DYP's responsibility to support these cities for they are the living heart of Turkey. Also our economical breadbaskets but still, a vibrant part of our great country and one that deserves all the help it can get."
 TUR_a_war_torn_past:0 "A War-Torn Past..."
 TUR_a_war_torn_past_desc:0 "The circumstances of the DYP's rise are extraordinary: coming to power after Turkey's defeat at the hand of a major foreign power, the end of the CHP's decades old leadership at the helm of the country. The end of an era and the beginning of another heralded by the DYP.\n\nWe've been elected by the people, for the people. Turkish citizens have suffered for far too long, and we will work ourselves to death in order to provide them relief, as we need to earn the trust they put in us during the election."
 TUR_but_a_bright_future:0 "...But a Bright Future"
 TUR_but_a_bright_future_desc:0 "With the worst of the political and economic crisis that plagued the homeland now over, our party now can work towards fulfilling our promises and reforming the government towards its rightful prosperity through better and more efficient direction. We will create a socialist, federal Turkey, no matter what stands in our way."
 TUR_breaking_the_wheel:0 "Breaking the Wheel"
 TUR_breaking_the_wheel_desc:0 "Now that we have secured widespread popular support for our reforms to the economy and government, and enacted the foundation of our policies, we must continue to push for the completion of these reforms to bring out the best in them. Only in this way can Turkey be brought out of an increasingly obsolete past, and forward into her rightfully prosperous future."
 TUR_a_just_economy_DYP:0 "A Just Economy"
 TUR_a_just_economy_DYP_desc:0 "The Turkish economy in its current state is far from just, quite the opposite, it's ripe with injustice as workers continue to be shackled to their chains by bourgeois proprietors. We look to the streets and see the poor subjected to squalor and wretched conditions, the toilers' labour stolen, students clamouring for an education cannot find one, all the while a caste of oligarchs get rich of the back of their suffering. This dastardly state of affairs cannot stand under the DYP's administration. A slew of economic reforms and welfare programs aimed at alleviating the people's heavy burdens are being readied for implementation as part of the party's program."
 TUR_state_welfare:0 "State Welfare"
 TUR_state_welfare_desc:0 "Our efforts to implement our program of wide-reaching, welfare reform designed to leave no inch of Turkish society untouched, and no man, woman or child suffering at the hands of cruel poverty, have only just begun. Unfortunately for us, a wrench in our plans has appeared: the Grand National Assembly. While many within the Assembly are either members of our coalition or at least amiable to our agenda, there remain plenty of deputies who aren't very supportive of our efforts. Whether through tactful negotiation or simple arguments showing them the nature of our plans and how they will offer every citizen a better life, these deputies will grow to be appreciative of our efforts. Together we will rid Turkey of the ills of poverty."
 TUR_the_workers_due:0 "The Worker's Due"
 TUR_the_workers_due_desc:0 "For too long have the workers of Turkey faced suppression and exploitation. For too long have their shouts been muted and their grievances left unheard. For too long have they suffered under the yoke of the bourgeoisie. It is now time for us to grant the worker the liberty he has always dreamt of. No longer shall the worker remain constrained by the shackles that hold them down and no longer shall the boot of capital press down on his neck, for a remedy to their agony is being prepared: the long due, ambitious Workers' Right Bill. As welfare is a cornerstone of the DYP's political program, this bill is just one of the many plans being drawn up and debated upon by the party."
 TUR_a_safe_future:0 "A Safe Future"
 TUR_a_safe_future_desc:0 "Many may claim that the most treasured and beloved among the population are the elderly of the Republic, the senior citizens that have seen our failures and witnessed our successes, the generations that have toiled and laboured to craft a brighter future for our beloved country. Nevertheless, these positive emotional platitudes are just that and nothing more, and often these old men and women are left to their own devices, alone and uncared for at their greatest time of need. This depressing scene of elders unable to provide for themselves and continue living their lives normally cannot be left to reoccur. As such, a bill providing the nation's retirees' with a significant increase in pensions is to be introduced onto the Grand National Assembly's floor."
 TUR_an_expansive_workers_rights_bill:0 "An Expansive Workers' Rights Bill"
 TUR_an_expansive_workers_rights_bill_desc:0 "The answer to the Turkish worker class' decades-long struggle for their rights and against exploitation has finally arrived, as the DYP's promised and long-awaited Workers' Rights Bill finally moves onto the Grand National Assembly's floor. Promising an expansive set of wide-reaching reforms, once passed, this bill would: guarantee every worker in Turkey a respectable minimum wage, establish a new set of stronger workplace safety regulations; limit the maximum number of work hours to 40 a week, and provide enhanced healthcare protections to low-income persons.\n\nWhile those within the liberal faction of the DYP aren't overly enthusiastic about perceived excesses in the bill's reach, the socialist faction that penned the bill is ecstatic about the prospects of it passing."
 TUR_a_safe_workplace:0 "A Safe Workplace"
 TUR_a_safe_workplace_desc:0 "Whether it be the common mangling of an arm or leg by malfunctioning machinery or the exposure of poorly equipped and ill-prepared workers to hazardous working conditions, horrific scenes plague the minds of workers of all castes, haunting them with terrifying imagery and the frightening prospect of brutal injury. These incidents, as shocking as they are, are made much, much worse when one realizes that they're easily avoidable through the enforcement of regulation. While the fat cat oligarchs that line their pockets up with millions made off cheap labour costs may protest these regulations due to the toll that it may take on their profits, it is imperative that we do not acquiesce and instead form a government committee dedicated to ensuring that companies in Turkey uphold regulations and worker safety laws. The labourer shall no longer dread or fear his place of employment, nor will he regard his continued employment to be threatening his own life."
 TUR_a_moderate_workers_rights_bill:0 "A Moderate Workers' Rights Bill"
 TUR_a_moderate_workers_rights_bill_desc:0 "Since even before the founding of the modern republic did the people of Turkey suffer grievously at the hands of cruel injustices. Today, however, the people of Turkey must rejoice for the DYP's long-awaited Workers' Rights Bill finally moving onto the Grand National Assembly's floor, promising to end their destitution. If successfully passed, the Workers' Rights Bill will enshrine a variety of reforms, including the establishment of a minimum wage; the placement of a set limit of 45 hours on the number of work hours in a week; and the establishment of stronger workplace safety regulations.\n\nThose within the socialist faction of the DYP are dismayed by the reach of the bill, believing that it does not go far enough. Nevertheless, the more liberal faction of the DYP that introduced this draft of the bill has hailed it as "groundbreaking" and "universally accepted", in contrast to the more radical and certainly more controversial approaches of the DYP's left."
 TUR_handle_the_oligarchs_backlash:0 "Handle The Oligarchs' Backlash"
 TUR_handle_the_oligarchs_backlash_desc:0 "Unfortunately enough, our recent actions and reforms have spurred some unwanted reactions from the more affluent members of Turkish society. Rumours, unfounded and unsubstantiated as they always are, have spread about our motives and ideals, claiming that we seek to shatter all the frameworks of Turkey's current political systems. These rumours have, along with misinterpretations and exaggerations of our policies and political goals, seen us painted as the reincarnation of Lenin and his Bolsheviks; hot-headed revolutionaries yearning to raise banners stained red with the blood of oligarchs and capitalists.\n\nThis rather harsh image of us is, of course, largely falsified and misconstrued, and we ought to shed ourselves of this nascent-acquired reputation. By recrafting our image into sensible reformists rather than angsty revolutionaries, as well as possibly giving out promises of moderation, we can assuredly calm down the majority of the panic-stricken upper-class."
 TUR_the_states_duty:0 "The State's Duty"
 TUR_the_states_duty_desc:0 "The question of where a state's duty towards its people begins and where it ends has been the topic of endless discussion. There are many that when asked on this topic might say that the state's duty is to keep order in the streets and otherwise keep out from the lives of its citizens and their economic affairs. We, on the other hand, see things in a different light; the state's duty is and will always be to guarantee its people a safe and comfortable life.\n\nHaving already worked a long way towards these goals through the implementation of welfare reform after welfare reform, our party now looks for new ways to further improve the lives of our citizens. Proposals emerging from these discussions highlight the neglect that those who remain unemployed, whether it be for a lack of jobs and opportunities or due to them being students, face. We must look after their welfare and ensure that the unemployed can continue on living normally as they look for work, and that pupils can afford the expenses of student life."
 TUR_relief_to_the_unemployed:0 "Relief to the Unemployed"
 TUR_relief_to_the_unemployed_desc:0 "It is not an uncommon occurrence in a person's life for them to find themselves unable to locate work. This phenomenon is not triggered out of some inherent laziness within a person or a deep-held contempt for work, quite the opposite, these are people that do indeed desire to work but simply cannot do so due to a lack of available opportunity. These honest men and women are, due to no fault of their own, forced to succumb to the tide of poverty and hunger as they're unable to sustain themselves without any available source of income.\n\nBy introducing a bill whose principal aim is to guarantee the unemployed a stream of income in the form of greater benefits until they're able to find employment to the floors of the Grand National Assembly, we can take a more proactive role in uplifting our population from the crutches of hardship and deprivation."
 TUR_a_universal_income:0 "A Universal Income"
 TUR_a_universal_income_desc:0 "While our reforms have come far, the spectre of poverty and want still lingers over the Republic. There are still many families left unable to sustain their finances and live a good, respectable life on just their salary, and there are still many without any source of income at all, leaving them unable to afford the necessities of life. These people's suffering must not be allowed to continue, therefore, several members among the rank of the party have proposed a radical idea: a Universal Basic Income. The idea itself is quite simple; each adult citizen of the republic is entitled to receive a set income every month, no matter their background or employment status.\n\nHowever, passing these policies through the Grand National Assembly would be a significant challenge as these policies are considered to be inefficient, irresponsible and fiscally disastrous by many with our party's rank and file, leaving the leftist socialist faction within our party as the policy's only solid base of support."
 TUR_improving_state_education:0 "Improving State Education"
 TUR_improving_state_education_desc:0 "Education has since the foundation of humanity's first civilizations been the cornerstone of any success story. It is education that allows a society to prosper, and it is education that allows the newly born children ignorant of the world around them and how it functions to bloom into scientists, engineers, doctors and a host of other professions that form the base of society as we know it.\n\nWith that being clear, it should come as no surprise to anybody that the DYP values uplifting Turkey's decrepit, ageing education system. By injecting much-needed capital into the education system, we can eliminate the hindrances that hamper the system's efficiency and bring new life to a rotting education system by allowing them to take on a slew of new subjects and improve the curricula of already existing subjects, guaranteeing our children a much brighter future and our nation generations of intellectuals to come."
 TUR_subsidising_schools:0 "Subsidising Schools"
 TUR_subsidising_schools_desc:0 "While our previous increase in funding for the Ministry of Education has proven to be a great boon to our previously lacklustre educational infrastructure, many individual schools still find themselves lacking the resources necessary to continue paying maintenance costs. These capital-thirsty schools are finding themselves increasingly unable to cope with lessening income and often resort to cutting corners across the board, greatly harming the quality of education presented and possibly leading to overcrowded classes which pose a health hazard.\nnThese conditions are appalling, and they must be eliminated. Therefore, we should enact subsidies for schools all across Turkey, granting them a new source of income and saving them from certain decay and collapse."
 TUR_tax_reform:0 "Tax Reform"
 TUR_tax_reform_desc:0 "While we have so far managed to adequately fund our newly established welfare schemes, it is becoming increasingly clear that our coffers are likely to dry up soon with our constantly growing list of expenses and our stable, yet nevertheless moderate flow of income. To counter this creeping financial drought, an expansive reform to our current taxation policy is being drawn up. Some may feel slighted by what is at the surface is a heavier burden to carry, the overall improvements in the average citizen's quality of life enabled by our previous set of reforms, and the egalitarian society towards which we are paving a path will more than surely compensate any losses caused by more intensive taxation."
 TUR_a_thriving_welfare_state:0 "A Thriving Welfare State"
 TUR_a_thriving_welfare_state_desc:0 "While many may have at first doubted our ability to implement even just a quarter of the reforms and legislation that we had put forth as part of our campaign promises and party manifesto, none today can in good faith deny our vast accomplishments.  Compromises may have been made, yet nevertheless, we have built from atop the flimsy, frail base the CHP first established a new, thriving welfare state. A state that takes care of its people's every need, securing for them a safe, respectable and comfortable life from the moment of their birth to their distant death. Workers rights, once nothing but a joke for many, are now entrenched as a pillar of Turkish society, and those who could not afford food to feed their families can now finally sleep peacefully at night, knowing that the days of famished sons and daughters will soon be nothing but ugly memories from an epoch past. Consequently, the DYP's popularity among workers has reached an all-time high as their programs begin to bear fruit."
