 TUR_HB.21.t:0 "Operation THATCHERNICE"
 TUR_HB.21.d:0 "The agent was a long way from Ankara. For a second, he doubted the Chief- what was Turkey's intelligence apparatus doing in a London cafe, of all places? No matter. After quickly calling back to HQ with no less than 12 \"chief\"'s during the call, he made his way to the table of one of the youngest MPs in parliament."
 TUR_HB.21.a:0 "He called out a single word. \"Ireland\"."
 TUR_HB.21.b:0 "And passed it, walking towards Mr. Home."
