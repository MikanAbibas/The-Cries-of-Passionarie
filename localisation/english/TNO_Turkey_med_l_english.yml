 POLITICS_ISMET_INONU_DESC:0 "If Mustafa Kemal was the father of the Turks, then Ismet Inönü is their Godfather. What could suffice, to describe the life of the man whose very whims have defined the policies of nations, armies, and empires?\n\nBorn to a Kurdish father in Smyrna in the year 1884, and faced with the weight of an empire collapsing all around him, Inönü served the Ottoman army with distinction in Yemen, in Rumelia, and under Mustafa Kemal himself in the war of liberation against the old empires of Europe. Ismet was a man truly committed to seeing the Turkish nation rise restored from the ashes of the caliphate, and quickly rose through the ranks of the new revolutionary guard until he was no less than Ataturk's own right hand.\n\nTensions had always existed between Kemal's strident pragmatism and Ismet's uncompromising will, and burst into sparks on numerous occasions in the past. Today, with the days of the Ghazi confined merely to memory, many claim that the old Vizier has overstepped his limits. That he had sold the nation to her enemies, that he had turned it against the very principles it was founded on. But those claims were nothing; Nothing save for insults to the very legacy of Ataturk.\n\nIn his long tenure as president of the Turkish republic, Ismet Inönü has pursued a single aim with a single mind: The survival of the Turkish state that he had helped found from nothing. When the State's interests called for detente with the Fascists, he had followed them. When they demanded the jackboot and the butt of the rifle, he heeded them. Through the great trials of the past three decades, he marched on: Battered and bloodied and slandered - but never beaten.\n\nThe state that stands today is a testament to the man's political ability and above all to his uncompromising will. A great Turkish state: One that will remain great, no matter the cost."
 POLITICS_TALAT_AYDEMIR_DESC:0 "The duty of an army is to safeguard the state, and as an officer of the Turkish army, it is the duty of Talat Aydemir to watch for weakness in the Turkish state, and, when such weakness appears, take decisive action to eliminate it. His graduation from the Infantry Academy coincided with the decline of relations with the other two partners of the Triumvirate, and after the Second Italo-Turkish War exposed how vulnerable Turkey was without its so-called allies, he saw weakness. When İsmet İnönü betrayed Turkey in a hamfisted attempt to maintain his slipping grasp on power, Aydemir saw weakness. And when the old generals of the junta considered bowing down to the rabble, he saw weakness.\n\nNow, fresh blood flows through the veins of Turkey's leadership. No more will the military be subordinate to the will of the state, but instead it shall be the guide for Turkey's path, as it should have been all along. General Aydemir will return the nation to a greater strength, restoring it to its rightful place of power, all through the guiding hand of the military- or so he claims. Still, even his closest advisors have questioned who he has chosen to surround himself with- coup plotters that espouse closer ties to Nazi Germany and younger officers with rather interesting ideas on the future of the nation. And as they, like Aydemir did, scheme and plot behind closed doors, some of his advisors wonder how long his bold vision can last."
 POLITICS_MUHSIN_BATUR_DESC:0 "The nation that does not care for the people it rules does not deserve to rule. Does the Turkish worker, the wounded soldier, and the aging farmer not deserve a fair and equitable chance at life in return for the service they have provided to their country? The leadership of Turkey has said no for far too long, and under Muhsin Bahtur, the answer has changed. Already rich and well-connected members of the old regime flee the country while a different red flag flies above Istanbul\n\nThe simple pilot who now issues orders from Çankaya Mansion is a man of few words, Unburdened by ideological hangups and connections to the upper class, Bahtur has no time for pages of theory or nationalist dreams of war. A new Turkey will be created under Bahtur's government, one that will dampen inequality and mitigate the abuses of the junta. The only question is whether his clique of young officers and ideologues can keep the power they have seized for long enough."
 POLITICS_TURKAN_AKYOL_DESC:0 "Türkân is an Istanbul native who was born in the city in 1928. Her primary schooling saw her travel all across the country due to her father's post in the military requiring moving often. She graduated from Erenköy Girls High School in Istanbul, Turkey, in 1947. Afterwards Türkân quickly studied to become a physician specializing in pulmonology. Her medical career has been stalled as she's become a rallying figure inside of the new DYP party, joining with Behice Boran to hopefully create an alternative to CHP's dominance.\n\nCompared to her partner in the party leadership, Türkân leans more towards the center than the left. She believes in rights for minorities, healthcare protection, secularism, and advancement for the status of women - especially in politics. She is not nearly as conciliatory towards trade unions as Boran and attempts to distance DYP from any anti-military or pacifist associations.\n\nThe highest compliment that many in CHP offer of Türkân is that she is İnönü's female counterpart. Türkân has won over many to DYP for focusing on issues that CHP struggles to ignore, such as healthcare, rather than advocating for more radical change like Boran. But with Boran, the party is able to cast a wide umbrella. Türkân has shown a strong face towards her opponents. She is considerate, but unyielding. Her leadership of the nation will be as direct as her control of the party."
 POLITICS_CEMAL_GURSEL_DESC:0 "A nineteen year old teen lays dead\nUnder the sun in the mornings,\nUnder the stars in the nights.\nOn Beyazıt Square in Istanbul\n\nCemal Gürsel is a tired man. He has been tired for a very long time. The crown of Turkey sits upon a weary and worn brow of man approaching his seventeenth year. For his nation, Cemal would give everything; he has given everything. When asked to serve above and beyond the call of duty for most men he already surpassed that expectation. And yet he is called once more in service of a coup that he does not believe in.\n\nBut the blood is spilled. A boy lays dead with a school book on his hand. On one hand a dream that never started. Cemal understands that democracy in Turkey may never recover. He cannot allow that to happen. Democracy must return. He did not serve his whole life, he did not survive malaria under the British, he did not fight in the furnace of the Independence War to be broken now.\n\nThere is no other path for Cemal except forward. The same choice he had in the desert, against the Italians and Ba'athists. Though he may wish now never to have emerged out of that goddamn desert with the task ahead of him. The only way is forward. For Cemal can trust no other man to resist the temptation to snuff out the flame of freedom forever. Those who have died in this damned coup, those who will continue to die from its aftermath, must have died for something. Cemal will make sure that happens. The only way is forward."
 POLITICS_BEHICE_BORAN_DESC:0 "Behice was born the youngest of three siblings to Kazan Tartar parents in Bursa, 1910. After completing primary schooling she enrolled into the American College for Girls in Istanbul. With adept skills in foreign languages and a scholarship from the University of Michigan, she completed her academic education with a PhD in sociology in 1939. Afterwards she accepted an Associate Professorship at Ankara University teaching foreign language, history and geography.\n\nBoran had an interest during her professorship in writing political papers. Though at times called a Marxist, her writings never garnered the attention or condemnation from İnönü's administration despite leftist leanings in the texts. But when the Second General Inspectors were established in 1956, Boran could no longer remain silent and spoke out rather harshly against the act. For this she was imprisoned for 32 months.\n\nWhen her sentence ended, Boran formed TIP which failed to garner enough votes to challenge CHP in any meaningful way. It did, however, lead to an alliance with Türkân Akyol and the formation of DYP. Boran does not believe that there can be a worker's revolution in Turkey but instead she advocates for trade unions being the vehicle to shift Turkish politics further to the left."
 POLITICS_CEVDET_SUNAY_DESC:0 "Cevdet Sunay was no one's first choice for leader of all of Turkey. His coup was sudden but swift and not entirely unexpected. It was hardly a coup, either. Nihat Erim had offered him control of the entirety of the army, knowing full well what might happen. And Erim still holds a prominent position in the new government. It made sense to grant the post to the public as well given that Sunay had served in both the Great War and in the Independence War.\n\nThere were complications of course. Nothing ever happens simply in Turkey, the wheels of progress needing to be greased with blood. A few student protests, disloyal army elements, and mouthy politicians arose to test Sunay's leadership. Did they think him weak? It hardly mattered, because they aren't relevant anymore. Sunay's men had seen to that.\n\nThe light of democracy has faded from Turkey. Sunay has little love for it as an institution, preferring the strength and stability of the military. His long career has won him the respect of the army. With Erim's partnership, the civilian wing has been swept in easily enough. Dissenters will be crushed and a new, stronger Turkey will rise soon.\n\nMay Allah protect and guide us."
 POLITICS_CELAL_BAYAR_DESC:0 "Mahmud Celâleddin Bayar was born in the coastal province of Bursa, to a family of Bulgarian Turkish migrants. Immediately bright, the young Bayar enjoyed a promising career in banking after finishing his education. The political turmoil borne out of the first world war soon drew him and many other like-minded men towards the political world; Bayar served as a representative in the Ottoman parliament before finally joining Mustafa Kemal pasha's revolutionary circles as an attorney and civil adviser.\n\nGrowing into a talented and respected politician during the days of Atatürk's Kemalist revolution, Bayar emerged as the pre-eminent advocate for a more flexible and capitalistic policy of Etatism. Indeed, many of the Republic's early success can be attributed to Bayar's programs. This did not earn him the love of the decidedly interventionist İnönü, and the two of them oft competed for the position of Prime Minister under Atatürk's presidency, before he was eventually expelled from the CHP alongside three of his allies in the later years of İnönü's tenure for daring to criticize the CHP's blatant neglect. Bayar was encouraged to found his own party instead, leading to the birth of the first Ulusal Demokrat Parti. This was a move that proved immensely successful: For he now stands proud as the third president of the Republic of Turkey.\n\nPromising the people democratic reform and a liberalized and rejuvenated economy after decades of stagnation under İnönü's CHP, Bayar's party has nonetheless been accused of populist leanings, and even of steering away from the principles of Kemalism. - a case strengthened by Prime Minister Menderes's notorious rabble-rousing rhetoric, and the fact the DP itself had only won the election leading a coalition of Right wing groups with dubious Kemalist credentials, and well-known ties to the wolves.\n\nBayar himself has steered clear of such accusations intending to provide a firm hand that will lead the Republic to her rightful place as a modern and prosperous Turkish state."
 POLITICS_CENGIZ_AYHAN_DESC:0 "Cengiz Ayhan was born in 1944 to two immigrants, a coal miner and a housewife. Coming from the ruins of the Soviet Union, they created a new life for themselves in Turkey. However, it quickly turned to ruin. Ayhan's father died in a mining accident, depriving the family of income. Soon after, Ayhan's mother took her own life. But this was not ruin for Ayhan. He was adopted by a Turkish general, who cared for him well. And while he felt dark murmurings inside him, he was held in the warm arms of the Turkish Republic, and it is all he knows. \n\nBut when he was cast away into the world he found himself without anchor or sail. Lost for purpose, he joined his local association of Greywolves and was quickly swept up in the drug trade. However, Ayhan was a poor pricer, an addict, a thief, and ultimately an awful dealer. He was quickly dismissed from the Greywolves. \n\nBut now, in Turkey's darkest hour, Ayhan has picked up his rifle. §xGalibiyete!§!"
 POLITICS_SNS_COUNCIL_DESC:0 "The Syrian National State was born from abandonment.\n\nPromised independence in exchange for supporting the Germans, Syrians watched in horror as Turkish soldiers marched to Al Azm Palace with no German help in sight. In the birthplace of the revolt against France, the Syrian National State under Turkey was formed - birthing NASIL, the resistance to the Syrian State. \n\nThe SNS played a critical role in the Iraqi War in 1952, as the Turkish armies were stalled in Iraq, until Tayfur Sökmen, a Syrian official, developed a plan to invade Iraq from Syria, which was enough to win the war. Sökmen was assassinated afterwards by NASIL, leading the SNS to violently crack down on all dissent and anti-Turkish sentiment through political persecution, military force, and even public executions. \n\nToday, the SNS is led by a council led by Husni al Za'im, Adib Shishakli, Fawzi Selu, and Sami al Hinnawi, each of whom have their own ambitions for Syria. Yet there are whispers of the NASIL remnants stirring once more - whispers which threaten to bring down the unstable foundations of the Syrian National State."
 POLITICS_SALIH_MIRZABEYOGLU_DESC:0 "Despite his youth, Salih Mirzabeyoğlu is already following in his family's footsteps. Born in 1950, Mirzabeyoğlu comes from a family of Kurdish heritage dedicated to the Islamic cause. After all, they were not only close to both the Naqshbandi and Nurcu Islamic brotherhoods, but they were also involved with a Kurdish rebellion in 1925 against the young Turkish Republic. To honor his heritage, the young Islamic militant has formed a radical Safaldi organization with the aim to transform Turkey into a caliphate. \n\nHowever, he felt like his group wasn't reaching its full potential by just discussing Islamic theory in cafes or handing out flyers to pedestrians. That was until he met Islamic nationalist Necip Fazıl Kısakürek, a respected theorist on Islamic political theory and philosophy. Mirzabeyoğlu has become influenced by his writings, finding a theoric base to put his thoughts to practice. Maybe the time has come to take action instead of just discussing."
 POLITICS_OSMAN_FAZIL_POLAT_DESC:0 "The Republic of Turkey is fortunate indeed to have at its command men of such skill and resolve as Osman Fazıl Polat.\n\nA career soldier, Polat graduated from the military academy as a Second Lieutenant in 1943, the waning years of the Second World War. His abilities were recognized even at this early stage of his career and he was soon sent to capture the major Georgian city of Batum from the collapsing Soviet Union. His success in securing the region for Turkey gained him no small amount of praise from the civil government and his superiors alike.\n\nWhile the war came to its conclusion in due time, Polat's military education was far from over. At the Army War College he sharpened his understanding of the finer points of strategic and tactical thinking, while as a staff officer he gained first hand experience in suppression and counterinsurgency operations against resistance movements in Turkey's newly claimed territories. From Poti to Yerevan, Damascus to Mosul, Polat continued to develop his martial talents, earning the respect of his peers and superiors each step of the way.\n\nThe outbreak of the Italo-Turkish War did not come as a surprise to the veteran officer, no he had long expected that the competing territorial claims of the two powers would inevitably trump any desire for mutual security. As luck would have it, he had been stationed in the contested island of Cyprus when hostilities boiled over, officially as a liaison to the Greek government, unofficially to train and organize Turkish Cypriots for just such an occasion. Seizing the opportunity, he raced to contact President İnönü, the magnitude of the prize he could deliver to Turkey if given the Grandmarshal's approval.\n\nİnönü has granted his approval, and only time will tell if Polat will be able to carry out his most important mission yet."
 POLITICS_ADNAN_MENDERES_DESC:0 "Some men are born with fate on their side and Adnan Menderes certainly looks like he was set to lead Turkey since the day he was born. His life began in a family of wealthy Crimean Tatar landowners, and as such he had access to the best education one could have in the Ottoman Empire. During the early days of the Republic of Turkey, Menderes fought during the Turkish War of Independence and was awarded a medal of honour for his efforts in fighting the Greek army. After getting his degree in law at Ankara University, Menderes was invited by Atatürk himself to join the ruling Republican People's Party and was selected by the party leaders as a deputy in 1931.\n\nFor Menderes, it seemed that his climb would never end, but with Atatürk’s death and the rise of İnönü, his ambitions too were stopped. Economic social_liberal was seen as an obstacle to İnönü’s projects of nationalization, and so Menderes was expelled from the CHP in 1945. This, however, did not stop Menderes, but rather it reinvigorated him. Fueled by feelings of revenge towards his former comrades in the CHP, Menderes persisted in the belief that economic freedom was the only way for Turkey, and the collapse of the İnönü’s government after the Italo-Turkish War seemed to prove him right.\n\nNow, after leading the Ulusal Demokrat Parti to a stunning electoral victory, Menderes prepares to reform an ailing republic into an efficient, prosperous nation. Fate, however, is a very fickle thing and Menderes has to hope that it remains on his side until the end of his mandate."
 POLITICS_NECDET_URAN_DESC:0 "It's not typical for navy men to embroil themselves in politics, but these aren't typical times in Turkey. Two of the most popular personages in the history of Turkish politics, İsmet İnönü and Cemal Gürsel, have rapidly vanished from the political scene, the latter dying of illness just a few years after helping lead the military putsch that ousted the former. The titanic responsibility of filling Gürsel's shoes has gone to Necdat Uran, a man of similar military credentials if significantly less regard among the populace.\n\nUran, a native of Istanbul, has given his life to serving the Turkish Navy. After graduating from naval academy in 1930, he slowly climbed the ranks until achieving the much-coveted status of Admiral in 1963. Generally seen as non-partisan, he was a logical choice for Cemal's successor. Cemal was so beloved by the people that many knew him as "Big Brother"; it is doubtful that Uran will receive such an honor even as his successor."
 POLITICS_AHMAD_BARZANI_DESC:0 "Is compromising your ideals the only way for the Kurdish people to reach for an once thought impossible dream of self-determination? It seems like it is.\n\nSheikh Ahmad Barzani once lost it all at a young age: his tribe having launched an insurrection against the Ottoman authorities in his infancy, he was not even an adult when his father, grandfather and a brother were executed for their defiance of the Sublime Porte's yoke. It wasn't until the 1930's, after a short exile in Turkey, that Ahmad himself led the various Kurdish tribes against the Iraqi government and their British puppet masters alongside his younger brother Mustafa.\n\nOne would've thought his war was a hopeless cause. But as the British Mandate of Iraq fell before the might of the Axis soldiers, Barzani swiftly took control of his homeland by fighting for the Turkish forces and taking advantage of his liaisons within the Turkish political scene. The Sheikh now sits on top of a throne made out of the bones of Kurdish freedom warriors, listening to a sweet tune coming from Ankara which tells him what to dance to..."
 TUR_economic_stagnation:0 "Economic Stagnation"
 TUR_economic_stagnation_desc:0 "Failed German projects in the Mediterranean and along the Euphrates have seriously damaged our economy after a period of prosperity. To complicate the recovery, German and Italian companies are less and less willing to invest in Turkey, the former due to its ever-worsening political and economic situation, the latter due to our precarious alliance: reforms are needed, and quickly, or the Turkish economy might fall even harder should a crisis arise.."
 TUR_italo_turkish_tension:0 "Italo-Turkish Tension"
 TUR_italo_turkish_tension_desc:0 "The Triumvirate is on its deathbed, and the "loving" relatives are mostly cheering for the agony to end. With relationships between Turkey and its former Italian ally at an all-times low, several nationalist politicians have resurrected the old Turkish claims to the Levant, Cyprus, Rhodes and Thessaly, in the hope of bolstering national morale - and their own popularity.\n\nDespite this nationalistic revival, there are many who express worry, or outright fear, for the potential consequences of such claims. Italy is - after all - the most powerful country in the Mediterranean, and despite its overstretched forces, there is no guarantee that they won't find the strength to fight..."
 TUR_inspectorate_generals:0 "Legacy of The Fifth and Sixth Inspectorate Generals"
 TUR_inspectorate_generals_desc:0 "The Fifth and Sixth Inspectorates were government commissions tasked with extending Turkification policies to the lands acquired after the war, mainly the new provinces in the Caucasus and the Levant. Despite their efforts, they only managed to create more problems than they were actually able to solve: the Fifth Inspectorate simply deported Armenians and Kurds from the Caucasus to the Levant, while the Sixth was only able of replacing a colonial administration with a Turkish one, leaving rural areas de facto abandoned to themselves.\n\nNow, unrest is rising across all newly-acquired provinces. Despite harsher and harsher methods - which are slowly turning even peaceful locals against the government - dissent and separatism are constantly growing, and the military police is unable to keep them under control: reforms are needed for something to change, and even then, it is not clear whether the change will be for good, or for worse..."
 TUR_drums_of_war_1:0 "Drums of War"
 TUR_drums_of_war_2:0 "Drums of War"
 TUR_drums_of_war_3:0 "Drums of War"
 TUR_framing_campaign:0 "Framing Campaign"
 TUR_2nd_tekalifi_harp:0 "2nd Tekâlif-i Harp"
 TUR_2nd_tekalifi_harp_desc:0 "The first Tekâlif-i Harp was enacted during the War of Independence, requiring all citizens to give up a third of their income to pay for the war. Now, a second will be introduced to prepare our economy for the upcoming war, though it surely will not be popular."
 TUR_jizya:0 "Jizya for the Unwanted"
 TUR_jizya_desc:0 "Historically, the jizya has been a tax imposed on non-Muslim citizens of Islamic states. Now, in support of the war with Italy, a new jizya will be imposed, for non-Turkish peoples instead of non-Muslims."
