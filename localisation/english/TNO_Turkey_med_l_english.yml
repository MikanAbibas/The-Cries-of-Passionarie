 DtS_development1_action_desc_tt:0 "§RTODO DESC§! focus on making the state economy revolve as much around resource extraction as humanly possible in order to provide cheap resources for Turkish industry (or just directly exported)\n\nThis will shift the local economy towards §kResource Extraction§!, which will have §RTODO§! effects\n\nThis will increase §Ystate GDP§! in the region by a bonus [?TUR_DtS_Selected_Region:TUR_DtS_dev1_action_impact|Y%1] per month for [?TUR_DtS_Selected_Region:TUR_DtS_dev1_action_impact_time|Y0] months\n\nBase impact: [?TUR.DTS_DEV1_IMPACT_BASE|Y%1][GetDtSSmallRegionEffectTT][GetDtSExtractionAffinityTT][GetDtSConsistencyTT_Extraction][GetDtSGovernmentImpact_Extract][GetDtSOverinvestment_Extraction_Impact]"
