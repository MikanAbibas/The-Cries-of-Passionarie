 TUR_StC_ethnic_demographics_tooltip:0 "Although ethnic Turks still constitute a majority in the Republic as a whole, many regions, especially those gained in the Second World War, are home to a mainly §fnon-Turkish§! population. In addition, Turkification efforts have yielded a new demographic of §aintegrated Turkic§! peoples, primarily Azeris and Turkmen.\n\n - §fMinority Opinion§!:\nDYP: [?TUR_minority_opinion_DYP]% / CHP: [?TUR_minority_opinion_CHP]% / UDP: [?TUR_minority_opinion_UDP]%\n\n - §aTurkified Opinion§!:\nDYP: [?TUR_turkified_opinion_DYP]% / CHP: [?TUR_turkified_opinion_CHP]% / UDP: [?TUR_turkified_opinion_UDP]%"
 TUR_StC_class_influence_tooltip:0 "Despite being small in numbers, the wealth and connections of the §iupper class§! often allow them to hold great political influence compared to the larger, but less influential §Vlower class§!. But the §nmiddle class§!, with both moderate wealth and size, still hold considerable influence themselves.\n\n - §iUpper Class Opinion§!:\nDYP: [?TUR_upper_class_opinion_DYP]% / CHP: [?TUR_upper_class_opinion_CHP]% / UDP: [?TUR_upper_class_opinion_UDP]%\n\n - §nMiddle Class Opinion§!:\nDYP: [?TUR_middle_class_opinion_DYP]% / CHP: [?TUR_middle_class_opinion_CHP]% / UDP: [?TUR_middle_class_opinion_UDP]%\n\n - §VLower Class Opinion§!:\n DYP: [?TUR_lower_class_opinion_DYP]% / CHP: [?TUR_lower_class_opinion_CHP]% / UDP: [?TUR_lower_class_opinion_UDP]%"
 TUR_StC_political_loyalties_tooltip:0 "Ideological loyalties can be entirely separate from party loyalties; should a party shift its alignment, appealing to one political group or shunning another, their perception among voters would change accordingly.\n\n - §cSocialist Opinion§!:\nDYP: [?TUR_socialism_opinion_DYP]% / CHP: [?TUR_socialism_opinion_CHP]% / UDP: [?TUR_socialism_opinion_UDP]%\n\n - §BLiberal Opinion§!:\nDYP: [?TUR_social_liberal_opinion_DYP]% / CHP: [?TUR_social_liberal_opinion_CHP]% / UDP: [?TUR_social_liberal_opinion_UDP]%\n\n - §VKemalist Opinion§!:\nDYP: [?TUR_kemalism_opinion_DYP]% / CHP: [?TUR_kemalism_opinion_CHP]% / UDP: [?TUR_kemalism_opinion_UDP]%\n\n - §rNationalist Opinion§!:\nDYP: [?TUR_nationalism_opinion_DYP]% / CHP: [?TUR_nationalism_opinion_CHP]% / UDP: [?TUR_nationalism_opinion_UDP]%\n\n - §KIslamist Opinion§!:\nDYP: [?TUR_islamism_opinion_DYP]% / CHP: [?TUR_islamism_opinion_CHP]% / UDP: [?TUR_islamism_opinion_UDP]%\n\n - §fRegionalist Opinion§!:\nDYP: [?TUR_regionalism_opinion_DYP]% / CHP: [?TUR_regionalism_opinion_CHP]% / UDP: [?TUR_regionalism_opinion_UDP]%"
