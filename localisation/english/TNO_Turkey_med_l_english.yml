 TUR_Inonus_Dementia_Ecevit_desc: "Aslında sorun, CHP'yi eski yörüngesine veya yeni yörüngesine oturtma sorunun da ötesindedir. Hatta sorun 'ya ben, ya Bülent' sorununun da ötesindedir. Tekrar söylüyorum, asıl öncelikle ölçülmesi gereken şudur: CHP'de buyruk mu işleyecek, hukuk mu işleyecektir? Buna karar vereceğiz. (...) Daha açık söylüyorum, vereceğiniz karar şudur: Demokratik bir partinin kanunlara saygılı özgür üyeleri mi olacağız, kapıkulları mı olacağız? Karar sizindir."
