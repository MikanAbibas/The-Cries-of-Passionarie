 tur_bills.1.t:0 "Bill Passes"
 tur_bills.1.d:0 "Within the many coffee-houses that litter the cities and towns of the Republic, a familiar scene can be seen. A man or a woman, an elder or a youth, all sit alone with nothing but a glass of fresh coffee in their hands and a newspaper, either on their lap or on the table in front of them. They flip through the papers' pages until they reach the politics section, where they stumble upon a headline, written in bold text, proclaiming that the latest bill in parliament has been passed and enshrined into the laws of the land. A sense of intrigue overcomes them.\n\nFar from the streets, many among the families of Turkey clutter near their houses' radio or Television. There they hear an assortment of anchormen and reporters either welcoming the bill's passage with an open embrace or condemning it and warning of its ramifications.\n\nAway from the people, in the palaces reserved for the nation's rulers, ecstatic cheers can be heard echoing as their inhabitants celebrate another victory for themselves and their party.\n\nLastly, the silent majority, the millions of men and women across the Republic that care little about the men in charge but only about the lives of their family and community, are split between those apathetic to the last passage or those who will likely never hear of it again despite the fact that the act may very well be the catalyst to something far greater or far worse in their lives.\n\nWhether this bill's passage will be an object of little note, one that only those interested in the subjects the act is attached know of, or the centrepiece of future political campaigns matters not, for the ink has already dried, and history has been written, and generations to come will endure the consequences ‒ whether they be positive or negative‒ that this bill will bring."
 tur_bills.1.a:0 "For the good of the Republic and its people."
 tur_bills.2.t:0 "Bill Fails"
 tur_bills.2.d:0 "Across the airwaves, the announcement that the latest piece of legislature proposed by the government has been voted down by the members of the Grand National Assembly and thus failed to pass into law is broadcasted.\n\nExuberant cheers can be heard emerging from the halls of the oppositions' headquarters, while the opposition aligned-media channels similarly rejoice. Meanwhile, the incumbent party is shaken to its core at their recent defeat.\n\nThe papers, whether they be for or against the government, recount only stories of defeat. The people only hear of defeat and with every failure, the representatives they elected endure, the people's confidence in the government's ability to push forward towards building a more prosperous society is shaken. After all, how can a majority government be trusted to govern the nation if it cannot manage to control parliament and pass the legislature the electorate desires?"
 tur_bills.2.a:0 "A temporary setback."
