 TUR_SHOOT_M:0 "The roar of the gunshot swept through the house, driving out all the noise ahead of it and leaving only utter silence in its wake. The mother lay bleeding on the floor, as her son looked on in horror. Hakan stared at the scene in disbelief, momentarily stunned. "What did you do?" he asked, his voice a near whisper.\n\nSalih was completely still, frozen in the realization of the terrible action he had just committed. The boy let out a wail of utter despair as he threw himself over his mother. The younger officer dropped his gun, it falling from his hands as his grip went slack at the sound. Hakan practically sprinted across the room, first pocketing the fallen weapon and then grabbing the younger officer by the shoulders. "Salih, you idiot, what the fuck did you just do?"\n\nSalih began to shake violently, nearly falling to the floor as the pent up nervous energy left him. Only the support of his partner kept him upright. All the warmth that had once been in Hakan's eyes had fled, leaving the man's face hard. "Listen to me," he said, his voice firm, "We need to get out of here. Right now."\n\nUnable to stammer out a reply, Salih instead nodded wordlessly, allowing himself to be rushed towards the front of the house. An angry looking man was peeking through the doorway, and his attention turned immediately to the two officers. "Who the hell are you?" he asked, blocking the doorway with his body.\n\nHakan snarled. "We're ÖHD, now get the fuck out of the way."\n\nOutside, a crowd began to gather in the street, murmuring angrily. The man practically growled back. "I don't think so. What the fuck were you doing in there?"\n\n"None of your concern, now let us throu-" Hakan's words were cut off as the angry man punched him in the face. The officer fell to the floor, his body limp, Salih falling along with him. The last thing he saw was the man's boot as it flew at his face."
 TUR_SHOOT_K:0 "The roar of the gunshot swept through the house, driving out all the noise ahead of it and leaving only utter silence in its wake. The son lay bleeding on the floor, as his mother looked on in horror. Hakan stared at the scene in disbelief, momentarily stunned. "What did you do?" he asked, his voice a near whisper.\n\nSalih was completely still, frozen in the realization of the terrible action he had just committed. The mother let out a wail of utter despair as she threw herself over her son. The younger officer dropped his gun, it falling from his hands as his grip went slack at the sound. Hakan practically sprinted across the room, first pocketing the fallen weapon and then grabbing the younger officer by the shoulders. "Salih, you idiot, what the fuck did you just do?"\n\nSalih began to shake violently, nearly falling to the floor as the pent up nervous energy left him. Only the support of his partner kept him upright. All the warmth that had once been in Hakan's eyes had fled, leaving the man's face hard. "Listen to me," he said, his voice firm, "We need to get out of here. Right now."\n\nUnable to stammer out a reply, Salih instead nodded wordlessly, allowing himself to be rushed towards the front of the house. An angry looking man was peeking through the doorway, and his attention turned immediately to the two officers. "Who the hell are you?" he asked, blocking the doorway with his body.\n\nHakan snarled. "We're ÖHD, now get the fuck out of the way."\n\nOutside, a crowd began to gather in the street, murmuring angrily. The man practically growled back. "I don't think so. What the fuck were you doing in there?"\n\n"None of your concern, now let us throu-" Hakan's words were cut off as the angry man punched him in the face. The officer fell to the floor, his body limp, Salih falling along with him. The last thing he saw was the man's boot as it flew at his face."
 TUR_NationAwakening_GRE:0 "Within the Mediterranean, the typical stars of the silver screen reside in Italy, having established themselves as a center of culture of sorts with their "spaghetti westerns" and stuffy romantics such as "La Dolce Vita". However, a contestant to that claim has arisen in the form of Attila İlhan's new film: "A nation awakens". Based on the book of the same name, the movie takes place within the village of Rhodes, where a collection of fearless Kuvay-I Miliye Volunteers fought to liberate their comrades within Turkey's rightful borders. The movie has been praised for its ambitious scope and snappy writing, though much of the positives noted by fans can easily be attributed to the novel the film had been based on.\n\nCritics to the adaptation call it little more than "Patriotic propaganda with a plot", though such criticism has not stopped it from becoming an instant classic through its tales of heroism under the despotic Greeks. Attila has been quoted as saying that "Even the Greeks and their insidious Duce cannot keep Turks down!" in a recent interview following the successful release of his film.\n\n"Ever since Italy began to deny us our rightful land and territorial rights, I have felt an inspiration unlike any I had ever known. Even if it takes the blood of a million more Italians, the world will know never to treat us like a dog again". If the thrilled Cheering that emanates from every showing of "A nation awakens" is anything to go by, Turkey agrees."
 TUR_NationAwakening_IME:0 "The Second Italo-Turkish war had turned the Levant, the ancient lands of the old testament, into a total warzone. As thanks to its harsh climate, the campaign proved a complete attritional grind for all those involved, it having been a vital front for the war, made no less deadly by the Kuvay-I Miliye resistance within the military government's borders. Made up of native resistance fighters within Italian borders fighting for the Turkish cause, their story has entranced many within Turkey, one man among them being Attila İlhan, who has written and recently directed his Magnum Opus: "A Nation awakens". Set in the Military Government within the Turkish territories, the Novel and its film adaptation take place within a village in Daraa, following the story of a village rising up against their Italian oppressors, eventually aiding the Turkish Armed Forces in their reclamation of the Province.\n\nUnsurprisingly, the Italian government has publicly discredited the film as a "Subversion of a wonderful art". However, following such an announcement, the popularity of Attila's film has only skyrocketed since. Thought to be one of the most iconic pieces of Turkish film, many Turkish figureheads have praised the film's portrayal of the selfless resistance and their patriotic inclinations, as have many fans of the film. While it may forever stay in the shadow of the Italian cultural limelight, Turkey may very well be experiencing its own cinematic Golden age, as more writers have only felt inspiration following the recent conflict. Only time will tell if Attila İlhan has been the first of his kind or a dying breed."
