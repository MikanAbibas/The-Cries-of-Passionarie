 TUR_Fahri_Koruturk:0 "Fahri Korutürk"
 TUR_inonus_glory:0 "Inonu's Glory"
 TUR_inonus_glory_desc:0 "Another year, another pile of paperwork for the President to tackle from his desk. President Ismet Inonu was a military man by profession, but nonetheless managed to navigate the battlefield of politics with remarkable ease and an unflinching will. It has been many years since he was first sworn in, and many battles that he had fought with his pen, his signature, and his unduplicable style of speech upon the podium. Many battles yet remain to be fought, both figurative and literal this time.\n\nHigh on the agenda was his choice of Prime Minister with the untimely resignation of Hasan Saka, the previously serving PM. Tensions within the Triumvirate has been steadily rising for years, and Turkey could either offer a staunch defense of its interests or attempt to navigate the scummy waters of the Triumvirate through diplomacy. One man, in particular, seems poised to do both as the situation demands. Fahri Korutürk, an old-time comrade of the President's, a skilled ambassador, and a career navy officer. Fahri Korutürk shall be the man to go to Rome, attempting to untangle the Gordian knot that Turkey's place in the Triumvirate has become."
 TUR_domestic_issues:0 "Domestic Issues"
 TUR_domestic_issues_desc:0 "Sparse news has arrived from the eastern provinces of Anatolia, and none of it good. The grip of unrest seems to have taken hold of the Kurdish consciousness once again. This is not good, and to the President, it is only expected. Memories of the revolts of '25 and '38 remain firmly in memory. We must move to crush this wave of discontent before it threatens to upturn the whole ship of State.\n\nRevolt is not expected to ferment as readily as it has in the past, however, and so a new approach to suppression has been drafted by the President's cabinet: One where Intelligence, and not the Army, takes central command.."
 TUR_international_issues:0 "International Issues"
 TUR_international_issues_desc:0 "As part of the two-faced charade that defines all aspects of the Triumvarate's dealings, it is well known that all three powers continue to maintain listening posts and undeclared missions of espionage within the territories of both of their allied states, even as official programs encourage cooperation between the various intelligence departments of the triumvirs, all three nations have decided that too much would be at stake should full cooperation be somehow achieved. The Italians and the Iberians have their scuffle in Algeria, and it is no secret that Italy's foreign policy has always placed the Turkish Republic in a position of suspicion, and oftentimes contempt. As part of a renewed foreign policy under Prime Minister Korutürk, we are preparing to reinforce our position within the Triumvirate above - and under - the table."
 TUR_hep_ileri:0 "Hep Ileri!"
 TUR_hep_ileri_desc:0 "The Turkish state is faced with a great many threats both inside and out. Traitors - eager to exploit its shortcomings and spit in the face of its achievements - and enemies abound, watching, nursing petty grievances worn by the decades and waiting for a hint of weakness, and the stench of blood. Our state will move, must move, against these enemies which threaten its very existence. Whether it is the pen or the sword we resort to, the bayonet or the noose, we must always march on. We march forward, always forward, to face both insidious traitor and foreign foe.\n\nAnd should one wonder where such foreign foes lay, let him look no further than the outskirts of Rome."
 TUR_nationalist_zeal:0 "Nationalist Zeal"
 TUR_nationalist_zeal_desc:0 "War, as it is, is a delicate matter. One must woo the deepest and most savage intuitions known to the heart of man. Himself once deeply opposed to the concept of an armed struggle that would leave his people fatherless and wounded, the National Chief now sees it as his personal duty to sway - no, to convince his people of the necessities of the struggle. The Turkish people have been left starving ever since the great campaigns of the last war: Their wounds have been left to fester, and their readiness to face their enemies is stagnant. In a flurry of speeches and rallies held across the country, the President will stoke that eternal flame of sacrifice. The people will be made ready to confront their enemies and ours.\n\nOf course, war remains only a distant possibility. It is merely the spirit of the struggle which must be revived to prepare our people for the trials to come. We shall try our very best to resolve our disputes through the pen and the speech, but remain vigilant nonetheless, and ready always for that struggle."
 TUR_our_enemies_inside:0 "Our Enemies Inside"
 TUR_our_enemies_inside_desc:0 "There are those within Turkey who would like nothing more than to witness the death of our state. A fair number of those traitors and insurgents are of the Kurdish people. Since the time of the Caliphate, the Kurdish nationalists have been a pain in our side, always seeking any underhanded means by which to split from Turkey.\n\nWe have reason to believe, as a result of highly suspicious communications and movements, that someone is aiding these independence movements throughout Anatolia. Only one power would be insidious enough to do so: Italy. Naturally, this is not something we will tolerate. These Kurdish movements must be crushed, and their Italian connections laid bare to the world."
 TUR_our_enemies_outside:0 "Our Enemies Outside"
 TUR_our_enemies_outside_desc:0 "The Italian colony in the Holy Land would not be possible if every able-bodied man in the Italian Levant were to rise in Jihad against their oppressors. However, such a thing is clearly not happening. Collaborators and traitors alike prop up the Italian state, betraying their fellow countrymen for their own personal advancement and status.\n\nEvery Turkish child will know the cowardice of the Native Syrian and Iraqi Administrators in Italy's Middle East. Hopefully, this disdain will spread throughout the entirety of the Islamic world. It is a cruel thing to oppress others for their own beliefs, but to turn on one's people for Earthly gain is the most wretched sin of all."
 TUR_we_bled_together:0 "We Bled Together.."
 TUR_we_bled_together_desc:0 "We are descendants of the red banner of the revolution!" - The old anthem goes.\n\nAnd why should a Kurd choose to pick up arms against his fellow brother? The great War of Independence marked eternal brotherhood between Kurd and Turk, an oath sworn by blood. Insidious forces will try to see our brothers ripped from our arms, but we will not let them. Harkening back to the days of Saladin and Nur ad-Din, our two peoples have marched together hand in hand against our enemies, foreign, and our false friends alike. In the glory of our republic, there is glory for every Kurd. This is the message that will be heard by the Kurds, and any other? Any attempt to sow the seeds of mistrust and hatred between brothers? Well. There we shall once again see the wisdom in the ancient tradition of ripping out a liar's tongue."
 TUR_we_killed_together:0 "..and We Killed Together"
 TUR_we_killed_together_desc:0 "Every man must bear his duty for the State, just as his fathers bore it before him. To the Kurds, we have offered a place of honor in the Turkish state, and one that was well earned. It was only with their aid - and eager support - that the Turkish empire was able to rise from its ashes into a great Turkish state. Even in '15, when that empire was undergoing its purification, a great 'misunderstanding,' you would have seen our Kurdish friends hauling up the nooses and polishing their rifles of darkened blood.\n\nIt is as it was. If our nation is to stand independent and unified, then we need that same spirit to arise, and thus we shall encourage it. The struggle shall burn as bright in the heart of every Kurd. "Oh, enemy! The Kurdish people live on," and they fight on our side. "The Kurdish youth are ready and prepared, To give their life as the supreme sacrifice." And so they will be."
 TUR_liberator_not_oppressor:0 "Liberator, Not Oppressor"
 TUR_liberator_not_oppressor_desc:0 "Long have the noble Muslim peoples of Western Asia labored under the yoke of the Europeans. Before their current oppressors, they faced the French and British. Long before even these newer colonizers, the Romans sought to subjugate the people of the Middle East. Now, as if the past thousand years had merely been a fluke, the fate of thousands of Arabs are being decided a sea away in Rome. This cannot stand.\n\nDespite the Italians being nominally our allies, we cannot trust them much more than we can the Germans. The Iberians, while less openly hostile, are racked with apathy for our plight. As such, it is only right that Turkey begin making our intent clear, that we intend to expand the freedom of the Middle East. Naturally, this will not be taken well by the Italians, but that is no matter. For the interests of our brothers in the Islamic faith, we are willing to make a few foes."
 TUR_international_footing:0 "International Footing"
 TUR_international_footing_desc:0 "Despite our dissatisfaction with our Italian allies, they have still agreed to work with us. Perhaps, with the right amount of diplomatic pressure, they will end their unjust practices. We do not have total faith that this will occur, but nor are we unjust warmongers. Our claims and grievances are undeniably just, and if the Italian Empire is led by competent men, they will see this.\n\nIn achieving this, we will send Prime Minister Korutürk to Rome for negotiation and mediation. The Prime Minister is a tempered and intelligent man, and we are certain he will be able to convince many Italians to see our point of view.\n\nIn addition to reviewing our agreements with Italy, however, we must turn our attention to the rest of the world. The Republic of Turkey's foreign policy cannot be defined by the Triumvirate alone!"
 TUR_reassure_masters:0 "Reassure the Masters of Europe"
 TUR_reassure_masters_desc:0 "Germany is the undisputed hegemon of Europe. So prescient was their threat to the Republic of Turkey that we were forced to align ourselves with colonizers and Catholics in order to ensure the survival of Turkish independence. It would be foolhardy, if not downright suicidal to not seek some measure of detente with the German behemoth.\n\nThe Italians and Iberians may not be pleased with this move, but we are content to let them grumble. They would certainly do the same, if their people would not riot at the mere mention of collusion with Germania. Prime Minister Korutürk, newly returned from Rome, will now be sent to Germania. The more allies Turkey has, the better!"
 TUR_peace_at_world:0 "Peace at Home, Peace in the World"
 TUR_peace_at_world_desc:0 "The Triumvirate was formed with one single, ultimate goal in mind. To prevent German encroachment into the last remaining free states of Europe. Why then, as the Germans slowly decay, would we reach out to them? It would be a slap in the face to the Italians and Iberians, as well as conflict with our own values.\n\nIberia and Italy may hold possessions they have no rightful claim to, but it is clear that Germany is the arch-colonizer. Not only do they hold more than the others combined, they hold this land with the express purpose of eradicating good Muslims and Arabs. In solidarity with our allies in the Triumvirate, we will leave Germany alone to wither away."
 TUR_anatolian_rhapsody:0 "Anatolian Rhapsody"
 TUR_anatolian_rhapsody_desc:0 "In the interests of protecting Turkish sovereignty, President İnönü has called for the formation of a Turkish intelligence service in the style of the Americans and Japanese. This newly created National Security Agency will work both domestically and abroad in the interests of the Turkish state and its people. Its operations will remain highly covert.\n\nIn modern times, the threat of invasion is not the only way in which Turkey's enemies can seek to destroy it. The National Security Agency will work to destroy foreign-funded insurgency, as well as to ensure that Turkey is able to maintain a sizable presence on the world stage, whether publicly or from the shadows."
 TUR_national_austerity:0 "National Austerity"
 TUR_national_austerity_desc:0 "One of the crucial setbacks that plague our Republic is the ongoing economic stagnation. Ever since our victory in the second great war was signed and secured, the Turkish economy has struggled to return to its pre-war levels of growth and prosperity. Inonu's 'Five-year Plan' to see the economy restored fizzled out as harebrained schemes like the Fertile Cresent project and the unmitigated disaster of Atlantropa dissipated both the government's funds and attention.\n\nState-sponsored Austerity has been the most effective response to this downwards spiral thus far. A new committee has been recently established - by the President's own decree - to see through a continuation of the debate regarding the question of the economy. The committee has attracted both free-marketeers and supporters of etatism in equal parts, and all wait to see what new set of policies will guide the Turkish economy in the future."
 TUR_privatization:0 "A Freer Hand"
 TUR_privatization_desc:0 "Supporters of the Free Market have made a very convincing argument for the introduction of limited privatization as the solution to a great many of the Republic's economic woes. Although they maintain links to the Association of Istanbul Traders - a notorious and long-time critic of the Government's economic policy - the liberals have triumphed in the economic committee, drafting an evidently popular program for the economy that promises not only to keep the economy afloat, but to see it reach new heights. This is a program that we shall back in a sudden turn from our long-time policies of State-controlled and state-directed growth. After all, it is only within the spirit of Kemalism that prosperity should take precedence, even under the state's ever-watchful gaze."
 TUR_nationalization:0 "National Corporations"
 TUR_nationalization_desc:0 "The economic debate has been settled, and firmly to the benefit of our existing policies of Etatism. The role of the state is enshrined in the principles of Kemalism, only needing to be applied correctly in order to deliver much-needed successes. Key amongst the reforms to the CHP's economic platform is the improved coordination of investments from abroad, and then sweeping, structural reforms to the way our state-owned corporations are run to ensure that they remain competitive and efficient. Etatism has seen us climb out of the ashes of the stagnant Empire and into the light - was it not these same policies that lead to the first economic boom? Why should we suddenly abandon them now?"
 TUR_they_have_hearts:0 "They Have Hearts Too"
 TUR_they_have_hearts_desc:0 "One of the prominent ethnic minorities in southeastern Anatolia are the Kurds, a people who still hold to many tribal and feudal social structures. Recently we have been able to force the Kurdish population into...special projects to improve our economy, and the ingrates have become increasingly incensed at our projects. By working with their tribal leaders, the Aghas, we can perhaps encourage their compliance by bringing their leaders on our side. It will require some monetary investments for the Aghas, but it is a price worth paying.\n\nThe Aghas are only human; if we show them the personal benefits of cooperation, they will make their people cooperate in turn."
 TUR_end_agha_system:0 "End the Agha System"
 TUR_end_agha_system_desc:0 "One of the prominent ethnic minorities in southeastern Anatolia are the Kurds, a people who still hold to many tribal and feudal social structures. Much of the Kurdish population is still hostile to our Turkification policies, which means we will be forced to clamp down even harder on them.\n\nThe Aghas are Kurds who have long held others of their kind in bondage, working as slave laborers in their plantations. Let us win the loyalty of the common Kurd; we shall arrest the Aghas, and bring their workers to Turkish state companies where they can be paid better wages. Not only shall we free and pay them to win their gratitude, but we shall encourage them to embrace Turkish culture."
 TUR_bank_of_work:0 "Bank of Work"
 TUR_bank_of_work_desc:0 "At last, the matter of the Economy has been resolved. Cementing this transition in policy is the founding of the bank of work, a new financial establishment that will act to implement this influx of new ideas into the republic's economy in a timely and organized manner. The President himself will deliver a speech to mark the occasion, legitimizing and firmly establishing the new economic platform as a central pillar to the government's policies.\n\nWe hope that through the founding of this new body, we shall see a return of trust in the government's economic platform and a reinvigorated economy that will, at last, break the fall of the past decade and rebound to greater heights."
 TUR_to_malta_desc:0 "The Triumvirate, founded to protect the powers of Italy, Iberia, and Turkey against what seemed like inevitable German aggression, crumbles as much as the German Reich itself. As Germany's star has waned, Italian occupation of our rightful lands has become impossible to ignore, and Ciano's attempts at diplomacy with us and Iberia are breaking down. In a last-ditch effort to preserve the alliance, the Italians have called a meeting at Malta, in hopes of resolving the conflicts that have gnawed at the Triumvirate since its foundation.\n\nPresident Inonu will humor Duce Ciano; we shall go to Malta and meet with our erstwhile allies, and make clear to them what we expect. If Italy wishes to preserve its little alliance, then it will listen to our demands. More likely, however, the drums of war shall reach a crescendo."
 TUR_righteous_fury:0 "Righteous Fury"
 TUR_righteous_fury_desc:0 "The people of Turkey are a forgiving and generous sort it is true. We acknowledge our faults where they blind us, and it is our very forgiving nature that has almost led to a grievous occurrence. İsmet İnönü, our great and beloved President was almost taken from us by the treachery of the Italian devils. But like all great men, luck was on his side when it counted, and has walked away unscathed, but not without learning a valuable lesson about trusting the enemy. Unsheathe your swords sons of Turkey, and let us prepare to show the Italians why when you strike you do so in force. Our president shall not just call our own sons to war in this time of need, let us ask our brothers in the rest of the holy land for aid. From Iran and Iraq, from Afghanistan and Saudi Arabia. Let the armies of the faithful gather once more!"
 TUR_price_we_pay:0 "The Price We Pay"
 TUR_price_we_pay_desc:0 "Maintaining a war effort is always an expensive task, and raising taxes on Turkish citizens could lead to some discontent. However, there is another alternative for funding. We can institute an extraordinary tax over certain ethnic groups, forcing them to pay the bulk of the taxes. Ethnic minorities like the Armenians and the Levantines that control strategic parts of the economy have enough wealth to fill the state coffins.\n\nPeople that don't comply with this measure should expect the appropriate retaliation of the law, including confiscation of their wealth and internment in labor camps. Discriminating our own citizens based on ethnicity is not always a desirable outcome, but these dire circumstances could require drastic measures. Winning a war requires to cross the thin lines of morality for a greater good."
 TUR_second_tekalifi_harp:0 "2nd Tekâlif-i Harp"
 TUR_second_tekalifi_harp_desc:0 "In those desperate times during our struggle for independence from the hated Greeks and their allies, we instituted a tax on the people. On quarter of their income to the state, so that their state may survive to see another day. The equipping of an army on such short notice is expensive after all and we can ill afford to be underprepared when fighting a foe of Italy's metal.\n\nThis cannot be maintained for long of course, but when we find victory in the sands and hills of our rightful territories then we can discuss such matters as reparations in good time. For now let us reap the bounty of our wise policies, and use it to power the engines of war. The Italians will know the full scale of their folly soon."
 TUR_grandmarshal_knows_best:0 "Grandmarshal Knows Best"
 TUR_grandmarshal_knows_best_desc:0 "Including our revered founder Atatürk, Turkey has only had two Grand Marshals in its entire history. It is a rank only for those who show the will and ability to lead our nation in times of crisis. Is it not appropriate then that our current president should be granted this rank, so as to better lead us in the coming struggle?\n\nWith such a rank as well, we can consider expanding the Turkish realm to include more of its heartland in the east or the south. Naturally this would be difficult, and so we might only realistically claim one of either Syria or the Greek occupied territories, but either would be an excellent jewel for our new Grand Marshal's crown."
 TUR_echoes_of_may_20:0 "Echoes of May '20"
 TUR_echoes_of_may_20_desc:0 "President Inonu is known for his military past of fighting for the Turkish cause of independence, defending the country against the Greek and Italian invasion. Forty-two years later, we face the same enemies in open warfare. With this in mind, we need to remind the public that they are in good hands with a military hero in charge.\n\nEvery Turkish newspaper, radio, street poster, and television will highlight the military feats of the President and his valuable service to the sovereignty of the nation. Propaganda will focus on portraying him as an undefeatable general and a skillful negotiator. The population needs to be reassured that Inonu will lead them to victory once again, just like in 1920."
 TUR_suleiman_the_first:0 "Suleiman the First"
 TUR_suleiman_the_first_desc:0 "Suleiman the Magnificent in his time was the greatest conqueror on earth. Hungary and Romania, Greece and Serbia, Albania and more. All were fought in, and had he not died he might have claimed Vienna too. We should follow in the example of this titan from Turkey's past. Let us follow in his vision of a european centred empire and reclaim what was lost by his less capable successors. Not the whole thing unfortunately, but we take what we can get in these times.\n\nThe Greek territories have practical value as well. Richer than those desert wastelands occupied by the Italians, and the Greeks are a far older and more treacherous foe too. We will need to expend some effort guarding out southern border but, focussing on what is closer to home might be to our advantage."
 TUR_selim_the_grim:0 "Selim the Grim"
 TUR_selim_the_grim_desc:0 "Ambitious, energetic, and with a fiery temper, Selim the Great lead the Ottoman Empire to glory. After a series of decisive victories, the Sultan crushed the Mamluk Sultanate and took control of Egypt, Syria, Iraq, and the Levant. However, his best-known military feat would be the Battle of Chaldiran, where, with a larger army and superior weaponry, the Ottoman army crushed its Persian counterpart. Four centuries later, the region is back in our spotlight.\n\nAfter our victory in the War, we gained territory in the Middle East, just like Selim did four-hundred years ago. However, this was only the beginning of our problems. Rebel nationalists remain an issue, and a lot of hostile players are willing to carve out our influence in the region, especially...our Italian ally. In these circumstances, focusing our attention on the Middle East is our best course of action."
 TUR_righteous_claim:0 "Righteous Claim"
 TUR_righteous_claim_desc:0 "With legislative preparations out of the way, we can move on to the next step: proudly announcing to the population our intentions to reclaim our rightful territories in the Middle East. The public will be informed that the Turkish government will formally request the Italian Empire the handing over of territories in Syria and the Levant.\n\nNaturally, the Italians would immediately reject it, desperately clinging to their dying Empire. However, this will give us enough legitimacy in the eyes of the people (and the entire world) that Turkey has attempted to solve this conflict through diplomatic means. We expect that this series of events will eventually reach one natural conclusion: a formal declaration of war."
 TUR_war_at_world:0 "War in the World..."
 TUR_war_at_world_desc:0 "A successful endeavor always needs to be built over strong foundations. Securing the border crosses with Italy to occupy strategic points and break their defense lines are the fundamental requirements of a victorious war. The National Security Agency will make reconnaissance missions on the terrain and identify the state of the Italian defenses in the Middle East for the start of cross-boarding operations.\n\nSpecialized mountain troops specifically trained for this circumstance will be ready to seize their targets. Likewise, we'll prepare the Naval Forces to support the crossing of airborne forces into Greek territory. The element of surprise should thwart Italian defensive plans and guarantee us a quick victory."
 TUR_war_at_home:0 "...War at Home"
 TUR_war_at_home_desc:0 "War is not only fought outside our frontiers but also inside them. Numerous ethnic groups could take advantage of the conflict to stir up dissent and sabotage the war effort, especially by contacting Italian intelligence. We'll show them that resisting our authority is pointless.\n\nThe National Security Agency is already putting in motion a series of operations against the rebellious groups. Doubling of surveillance, arrests of rebel leaders, infiltration of subversive groups. These are just a few of the protocols designed to keep the domestic situation in order. The enemies of the Turkish nation will think twice before attempting to attack us by the rear. Consequences will never be the same."
 TUR_under_the_crescent:0 "Under the Crescent and Star"
 TUR_under_the_crescent_desc:0 "Our fellow Turks are not always aligned with the CHP, for such a strong willed people as ourselves would never submit to a single party forever. The UDP and DYP are the largest of our fellow travellers in politics, and rumour holds that they are uncertain that direct action is the correct course in this matter. Of course the proclaim complete loyalty to the goals of Turkey whatever they may be and the President believes them, they merely lack the foresight to see what the Italians may do if we let this matter slide. Boran and Bayar can be convinced we are sure of the correct nature of our response, it will merely require the President to give them some assurances and clarifications of our intent. Towards them, as well as our rightful lands."
 TUR_hands_on_the_neck:0 "Hands on the Neck"
 TUR_hands_on_the_neck_desc:0 "But there is no need to go about such an important matter so foolishly. Our people will call for war and revenge, but we will publicly downplay such things. The Italians must be caught off guard if we are to reconquer our rightful lands smoothly, so we shall go along with the pretense of negotiating our way into a settlement for the grievous offense we were dealt at Malta.\n\nBehind the veil of diplomacy, we shall make ready the dogs of war. Fortifications and supply lines must be built, our troops equipped with desert camouflage and weak points in the Italian defences identified. Those officers too old or incompetent to command effectively must be drummed out of the corps, and those veterans who've retained their edge must share the knowledge of our forefathers."
 TUR_postals_on_street:0 "Postals on the Street"
 TUR_postals_on_street_desc:0 "The people need to be brought onside with our government's course of action. A fickle thing at the best of time truth be told but hardly out of our capabilities. Posters and pamphlets will be made widely available, but so to will more modern methods. Radio speeches and televised vision of them will be broadcast widely, but so too will parades.\n\nThe people love a good parade, its a chance for everyone to get out and celebrate, to indulge in some good food and some cheap presents for the children. If were to hold them in places significant to Turkey, like the former cities of Ufa and Antep, well that would be merely a coincidence wouldn't it? The people already call for this war, we will make them beg for it."
 TUR_birayen_me:0 "Birâyen Me"
 TUR_birayen_me_desc:0 "Our president was born to a union of Kurdish and Turkish parents, not that it matters to all the sons of Turkey. Loyalty is above blood after all. Yet, to those for whom blood does matter it might be helpful if we were to emphasise the heritage of our president amongst our largest minority the Kurds.\n\nHaving him travel to areas where Kurds are a majority and drumming up public support for our state serves both a practical and propaganda oriented purpose. The Kurds have no love for the Italians after all, and rule from Ankara might be lightened somewhat in the years to come if the Kurds choose their brothers in faith over the crusaders of Rome."
 TUR_report_for_reform:0 "Report for Reform"
 TUR_report_for_reform_desc: "The Kurds have a conflictive history with our country. After the Dersim rebellion, we remain vigilant to the possibility of a new uprising. To avoid the opening of a new war front, we have some possible options to control them. These new policies forbid meetings between two and more Kurds, imposes a curfew in cities with a Kurdish majority, and even authorizes displacements of particularly problematic populations.\n\nThose Kurdish individuals suspected of conspiring against the government will be held indefinitely, a measure that potentially includes any Kurd we consider a threat. We don't have any pleasure in applying these draconian measures, but with the fate of the nation in balance, we cannot take risks."
 TUR_review_the_army:0 "Review the Army"
 TUR_review_the_army_desc:0 "The moment of reckoning draws near. The pitiful Italians are desperately building fortifications along the southern border, their lackeys in Greece and Cyprus are forcing even children into militias, and across the Italosphere the mood is one of abject panic. Indeed, their fears are justified. Across the border, the chaos and cowardice is replaced by an iron order and legions of brave men, willing to die for their country. Endless rows of polished rifles glimmer in the sunlight, waiting to be fired at those that would defy the greatness of the Turk. Tanks line up in thousands, as far as the eye can see, a cavalry of steel, preparing to follow the example of the great House of Osman, and push the Romans and their allies into the sea. \n\nAs the seconds tick down, our great leader and his inner circle have conducted a final inspection of the armed forces, to ensure that they are in top fighting condition before they bring death and destruction on our enemies. Indeed they are, and indeed they shall."
 TUR_salute_the_navy:0 "Salute the Navy"
 TUR_salute_the_navy_desc:0 "Following the disaster that was the Atlantropa project, we were forced to scuttle several of our more outdated ships. At the time our relationship with the Italians made a powerful navy largely a waste of resources. That being said, we were never so foolish as to assume that this would always be the case. Alliances come and go and relying on others for one's defensive capabilities is a recipe for disaster down the line. The recent breakdown between ourselves and the Italians has proven this line of thinking well, and has further proven the wisdom in maintaining, even in truncated form, the Turkish navy.\n\nPresident İsmet has taken it upon himself to visit the navy in its port Smyrna. He will be joined by the illustrious admiral Korutürk and combined it is hoped that they can lift the spirits of our brave sailors before they head into open waters to safeguard our shores."
 TUR_general_staff:0 "General Staff"
 TUR_general_staff_desc:0 "Politicians usually aren't well-versed in military matters, after all they do prefer the luxury and privileges that come with their station, for better or for worse. Fortunately, such is not the case with our president, having served in the Ottoman Army even prior to the Great War and until the end days of Turkey's independence war.\n\nOur security minister and field-marshal, Cemal Gürsel and Rüştü Erdelhün respectively, have been discussing ideas on the strategy to follow in the upcoming war. İnönü knows best in the end, but it couldn't hurt to listen to what his subordinates have to say."
 TUR_a_deal_with_iscariot:0 "A Deal with Iscariot"
 TUR_a_deal_with_iscariot_desc:0 "Though people may see İsmet İnönü as a fervent supporter of Kemalism and an iron-fisted statesman, he's far more down to Earth in his approach than the nutjobs over in Europe, their ideologies making Kemalism seem extremely tame as an authoritarian ideology.\n\nHowever, extremes and Judas are ever so present in today's world, Alparslan Türkeş being a prime example of Turkey's hardliners, the leader of MHP and the Greywolves, a paramilitary organisation. Conveniently, Türkeş's party is the only supporting our efforts against Italian treachery, something that we shall use to our advantage as those fanatics often talk about dying for their country and we are keen on obliging their burning patriotism.."
 TUR_independence_tribunals:0 "Independence Tribunals"
 TUR_independence_tribunals_desc:0 "Desperate times call for desperate measures as the saying goes. During times of peace we can be a bit more lenient with the troublemakers within our borders. Demonstrations can be contained, opposition parties brow-beaten, independence movements quashed with ease. During wartime however? Then things become far trickier, and we simply don't have the resources or manpower available to divert to major homefront confrontations while our brave young men fight for their nation in the deserts of the Levant.\n\nTo prevent any hamstringing of our efforts, we cannot allow any forms of dissent that might otherwise have been tolerated. All political opposition is to be decisively silenced, from their media to their political parties. If they cannot see the urgency of banding together at this crucial moment, then they cannot be trusted with anything."
 TUR_deafen_by_artillery:0 "Deafen by Artillery"
 TUR_deafen_by_artillery_desc:0 "In the last five decades, Turkey has been tested time and time again through steel, fire and blood: we fought the British on the beaches of Gallipoli, the Americans over the waves of Samsun and the Greeks in the streets of Bursa.\n\nOnce again, we shall enter the battlefield under the thunderous roars of artillery shells, led by none other than our president İsmet İnönü, like the great Ottoman sultans of old leading their armies. Hopefully, this shall be the last time he'll have to wear his uniform in order to defend his homeland against perfidious influences, having already sacrificed so much for the country, his hearing in Gallipoli included."
 TUR_bird_gone:0 "The Birds Have Also Gone"
 TUR_bird_gone_desc:0 "It seems that peace was never an option, its dove treacherously killed in Malta. Turkey and its people are now on the path to war, a rage without equal fueled by the sorrow and anger that Hasan Saka's death brought, for none shall be spared from the righteous wrath that inhabits our countrymen, be they puppets or puppeteers.\n\nEvery child of Turkey arms himself in the coming conflict against Italian treachery, the Moon and Crescent against the Cross: Rome shall fall once again to Turkish fury, ushering another era of prosperity for our country."
 TUR_war_on_the_horizon:0 "Aç Kapıyı, Gir İçeri"
 TUR_war_on_the_horizon_desc:0 "For fifty years, the proud Turkish people have been humiliated by the Italians. First with the Libyan war that cost us Libya itself and Dodecanese, and then by the peace treaty of the last war, where the rightful Turkish claims to the Levant and Cyprus were ignored: like the wolf denied their prey, we have not forgotten, nor forgiven...\n\nNow that the Triumvirate has collapsed due to the arrogant and domineering attitude of the Italians, we are finally free to realise our dreams of vengeance. With the element of surprise and overwhelming numerical superiority, we shall prevail upon our hated foe, and reclaim our birthright as the descendants of the Caliphate of Konstantiniyye: we will not rest until Jerusalem, Cyprus and Rhodes sing our praise in the language of Osman, we will not relent until the sand runs red with the blood of our oppressors!\n\nThe time has come to lower the sabre! Glory to Turkey, glory to the Crescent! Zafer ya da ölüm!"
 TUR_return_to_rodos:0 "Return to Rodos"
 TUR_return_to_rodos_desc:0 "The island of Rhodes has belonged to the Turkish people ever since they ripped it from the accursed Knights of St. John. For centuries, the fortress-island has stood as a bulwark of Turkish domination over the Aegean - that is, until the Italians took it from us in 1912, after our forces suffered a humiliating defeat in Libya: ever since then, Rhosed has been an Italian possession, something they never failed to underline in their fancy history books.\n\nThe time has come for us to have our revenge. Rhodes is an island, and its defences, though centuries old, are bolstered by the sea and the rugged terrain that defeated more than one invasion in the millennia past, but no longer: with a concentrated offensive, and exploiting the effect of surprise, we shall break their lines and storm their beaches before they can even react!\n\nGlory to Turkey, glory to the Crescent! Zafer ya da ölüm!"
 TUR_the_dodecanes_defiant:0 "The Dodecanes Defiant"
 TUR_the_dodecanes_defiant_desc:0 "Despite our superior numbers and planning, in the end it seems that fate has not favoured the bold. Our invasion force expected a weak, disorganized resistance, and this has been their downfall: the city had been turned into a veritable citadel - an extension of the old Knights' Fortress - and the very people of Rhodes took up arms against us in number we could not have predicted: the majority of our forces were either repelled or annihilated, and the few survivors have retreated in disorder or drowned into the sea.\n\nDespite the boisterous claims of some of our generals, the window of opportunity has closed. The Regia Marina has come in overwhelming numbers to form a protective cordon around Rhodes, and already Izmir reports bombing runs from Italian bombers: with our forces required to protect our industrial heartland, we cannot attempt a second strike.\n\nWe have lost this front."
 TUR_push_them_to_the_sea:0 "Push Them to the Sea!"
 TUR_push_them_to_the_sea_desc:0 "Victory at last! The Italian garrison found itself surprised by our combined forces offensive, and their inferior numbers and equipment ensured their eventual demise: after an intense shore bombing by our artillery from land, our troops stormed Rhodes city, and after days of urban fighting and the siege of the old Citadel, the governor of the Italian Dodecanese surrendered, just like the Grandmaster of the Hospitallers did centuries ago!\n\nThis great victory has done much to uplift the morale of the population, but the war still rages elsewhere. In the meanwhile, a provisory administration has been installed to ensure an ordered transfer of power from the Italian authorities to our own, and the surviving members of the Italian garrison, together with any Italian who wished to leave Rhodes, have been repatriated: this is a glorious day for Turkey!\n\nRevenge is sweeter, the colder it is served..."
 TUR_kuduse:0 "Kudüs'e!"
 TUR_to_the_sea:0 "To the Mediterranean"
 TUR_to_the_sea_desc:0 "Our offensive into the Italian Levant proceeds well. Isolated and poorly-defended, Lebanon could not resist our determined advance with its puny garrison and pitiful irregular militias: now that the front has been made even, the time has come to push into our true objective - the Governorate of Palestine.\n\nBoasting a well-armed garrison, Palestine will be a tough nut to crack. However, we have superior numbers, and they are overstretched to prevent the partisans from rising up while they fight us at the front: with a concerted push along the coast, we can exploit the overall regular terrain to maximise our advantage, and break their lines cleanly towards Jerusalem."
 TUR_through_the_desert:0 "Through the Desert"
 TUR_through_the_desert_desc:0 "With the fall of Mafraq, the largest city near the border with our Syrian puppet, the way to the desert has been opened. The Italian garrison may be expert in desert fighting, but they are running low on supplies, which makes a war of attrition along the Eastern dunes of Jordan a risky affair with them: by exploiting our superior numbers, we can force them to overextend to cover the entire desert.\n\nOnce their best troops have been isolated and crushed amidst the scorching sands, the way to Jerusalem will lay open. Imagine their faces when they receive news of their disaster by the sight of our flag rising outside of the Holy City: a sight to soothe the heart..."
 TUR_upon_the_dead_sea_desc:0 "Our offensive is proceeding extremely well, and our troops have finally reached the shores of the Dead Sea. With this, however, comes a sobering realization: the enemy is slowly but steadily concentrating their forces around Jerusalem, which means that resistance will become heavier the more we advance.\n\nThe Holy City itself is well protected by ancient fortifications and a veritable maze of urban landscape. While artillery is always a general's best friend in cases such as this, the battle for control of Jerusalem will be long and bloody: Italians, Jews and even some Palestinians eye us with terror, and will fight to the last to prevent us from reclaiming our birthright."
 TUR_a_white_crescent_in_jerusalem:0 "A White Crescent in Jerusalem"
 TUR_a_white_crescent_in_jerusalem_desc:0 "Victory! Our troops have successfully secured the majority of Jerusalem's districts: the fight has been tough, but in the end our numerical superiority has prevailed, aided by large artillery barrages which nonetheless severely damaged many ancient buildings in the city.\n\nWith their administrative capital fallen, the Italians are largely falling apart across the entire Levant. Pockets of resistance still remain, but our army should have little trouble cleaning them up: with most of their supplies lost as the city armouries fell, they won't have fuel and ammunition for much longer..."
 TUR_the_holy_city_out_of_reach:0 "The Holy City, Out of Reach"
 TUR_the_holy_city_out_of_reach_desc:0 "It is often said that the most beautiful flower is the one we cannot touch. Jerusalem is one such flower, and it has gone far, far away: our desperate offensive to take the city has failed due to the extreme enemy resistance across the Governorate of Palestine.\n\nHarried by partisans and hammered by Italian regular troops, the Levant army group has collapsed and been forced to retreat in disorder across the banks of the Jordan. With the final defeat of our offensive, and no chance to renew it in sight, the people are starting to demand justice for the dead of what they are coming to see as a senseless massacre: this will impact the popularity of the government in ways we may not be able to predict as of now..."
 TUR_the_levant_subjugated:0 "The Levant Subjugated"
 TUR_the_levant_subjugated_desc:0 "Triumph! The Italian territories in the levant have been fully occupied by our victorious troops, and Governor Pietromarchi has formally surrendered before the commander of our army group: with this act, any and all Italian resistance are over.\n\nWith new territories acquired, and more than anything with our honour restored, we can look with renewed hope inside our borders. The government's popularity is soaring, and the future looks bright: truly, a wonderful time to be Turkish!"
 TUR_an_old_rival_a_new_war:0 "An Old Rival, A New War"
 TUR_an_old_rival_a_new_war_desc:0 "Greece has been a rival to the people of Anatolia for millennia. Ever since the time of the Persian wars, there has been enmity between our peoples, and today the situation is little different from what caused Xerses to cross the Bosphorus: once again, Thrace is a matter of contention, with the Greek government ever opposing our rightful annexation of the region after the last war.\n\nWhile the Greek armed forces are a far cry from the heyday of the Spartiates, there are still many complications to an offensive against our Western enemies. The Greek terrain is very narrow, preventing any large-scale operation, and their regular troops will surely be bolstered by large numbers of irregulars, especially in Thrace: we are fighting a dogged enemy, and they will resort to any means to defeat us."
 TUR_watching_the_border:0 "Watching the Border"
 TUR_watching_the_border_desc:0 "Greece is not a priority target at the moment. With the narrow border we share, and their manifest inferiority, we have nothing to fear from a potential Greek invasion: as such, it would be wise to prioritise other, more important theatres of war rather than overextending our forces across too many fronts.\n\nBuilding a line of defences along the border will make sure that both the locals of Thrace and the Greek dogs will not get strange ideas. As soon as we have dealt with our other pressing concerns, however, we won't forget to pay a visit: we have so much to do together..."
 TUR_disaster_in_thrace:0 "Disaster in Thrace"
 TUR_disaster_in_thrace_desc:0 "How could this happen? The small, weak and corrupt Greek army has actually managed to not only repeal our forays into their territory, but also push into Thrace and securing the region for themselves: with the local population joining forces with the advancing Hellenic forces, our troops in the area had no other choice but to surrender in full.\n\nWith this defeat, our war effort is effectively dead. The army is in disarray at the news, and with the arrival of more and more Italian troops, a continuation of hostilities would only risk endangering Istanbul itself - a repetition of 1912 we are not keen on experiencing - though the people will undoubtedly start questioning the wisdom of starting this war: how long until they start looking at the government?"
 TUR_no_enemy_shall_step_on_turkish_soil:0 "No Enemy Shall Step on Turkish Soil"
 TUR_no_enemy_shall_step_on_turkish_soil_desc:0 "As expected, the small Greek army did not even try to push into our territory. The border has remained calm, and what little probing attacks were made have been properly disposed of: this has uplifted the troops' morale, and gives us the chance to push.\n\nWith reinforcements in position, the time has come to launch our offensive into Greece. The target is simple: break their lines, capture Thessaloniki and reach Larissa in the shortest possible time."
 TUR_onwards_to_athens:0 "Onwards, to Athens!"
 TUR_onward_to_athens_desc:0 "Success! With the fall of Thessaloniki and most of the North, central Greece now lies open before our forces: additional reinforcements have been requested, and a new offensive planned to breach the last defences protecting Athens.\n\nCare should be taken not to underestimate our enemies. Attica is a narrow and hilly peninsula, which makes any direct assault a challenge: there is definitely no need for another Thermopylae."
 TUR_greece_holds:0 "Greece Holds"
 TUR_greece_holds_desc:0 "Disaster! In a paradoxical rendition of the conflicts of ages past, our much-superior armed forces have failed to bring Greece to its knees: with the help of their Italian masters, the Greeks have repelled our offensive, and the war has degenerated into a stalemate that forced us to seek an armistice to avoid further bloodshed.\n\nWith this defeat, our administration now stands under accusation. The people are starting to demand how our war machine could be stopped by what, by all accounts and purposes, is a puppet: sooner or later, the protests will reach the palaces, and then the real problems will begin..."
 TUR_mutilation_progress:0 "Mutilation Progress"
 TUR_mutilation_progress_desc:0 "Triumph! With the fall of Athens, the Greek government knew they could not hold forever in the Peloponnese. As a result, their government has formally capitulated to the commander of our army group: with their ally defeated, the remaining Italian forces have retreated across the strait of Otranto.\n\nWith the war over, the people are overjoyed at the restoration of our lost honour. The government's popularity is soaring, and the future looks bright: truly, a wonderful time to be Turkish!"
 TUR_flowers_on_the_hills:0 "Flowers on the Hills"
 TUR_flowers_on_the_hills_desc:0 "The war is over, and it is time to face the consequences. The survivors return home, the dead are mourned, and the damages repaired: as the nation looks at the future, we hope that our actions may have been right, and that we may be able to keep going forward without regrets."
 TUR_a_holiday_in_cyprus:0 "A Holiday in Cyprus"
 TUR_a_holiday_in_cyprus_desc:0 "Cyprus has always been a hotly-contested topic in international conferences ever since the British claimed it from the crumbling Ottoman Empire. With a Greek majority, but a strong Turkish minority concentrated in the Northern half, the island has always been contended between Turkey and Greece: sadly, the latter got it from their Italian masters in the aftermath of the last war, but the time has come to redraw some maps...\n\nThe Türk Mukavemet Teşkilatı, or Turkish Resistance Organization, has been quietly preparing for an armed uprising to restore rightful Turkish rule upon the island. By supplying them with weapons and instructors, we will ensure that, when the offensive is launched, they can quickly secure their half of the island, and hold onto it until relief comes: the Greeks will never see it coming..."
 TUR_defeat_upon_the_beaches:0 "Defeat Upon the Beaches"
 TUR_defeat_upon_the_beaches_desc:0 "Alas, it seems that our extensive preparations were not enough to overcome enemy resistance. The larger Greek majority took up arms against the TMT and managed to resist long enough for the regular, Italian-trained troops to reinforce them: against such a large concentration of forces, our small expedition force was obliterated by artillery as it tried to disembark, the few survivors either captured or retreated.\n\nWith the armed insurgency effectively crushed, and tighter security measures in place to prevent another one from springing, it will take years for another resistance movement to form. To make matters worse, the Regia Marina has taken up patrol duty around the island at the request of the Greek government: with our navy unable to oppose Italian naval supremacy, our window of opportunity has effectively closed - or rather, it has been nailed, welded and walled in."
 TUR_to_the_south:0 "To the South!"
 TUR_to_the_south_desc:0 "Success! Our preliminary storming of the Northern half of Cyprus has wielded results, and now the TMT and our expedition force have secured domination over the old Famagosta and the surrounding lands: the time has come to push South, and capture Nicosia.\n\nWith naval facilities secured, and the Italian navy yet to be seen in the area, the High Command has authorized deployment of further resources and units to the front. The hope is that, with such a large concentration of forces, the remaining Greek resistance to the South will collapse and surrender: the time has come for the last push!"
 TUR_taksim:0 "Taksim"
 TUR_taksim_desc:0 "In a rather disappointing turn of events, it seems that our momentum ran out in Cyprus. Reinforced by new regular units, and by the determined efforts of the local Greek population, our forces have been stalled in the outskirts of Nicosia, with the city still in enemy hands: with both sides effectively stalled, no progress has been made.\n\nTo make matters worse, the Italian navy has at last reached the Aegean Sea at the behest of the Greek government, preventing any further reinforcement from reaching the island. As such, a truce has been signed between Greece and Turkey, dividing the island in two halves: the Northern one will belong to us, while the Southern one will remain to Greece - a lukewarm result, but still better than nothing..."
 TUR_cyprus_cannot_remain_greek:0 "Cyprus Cannot Remain Greek"
 TUR_cyprus_cannot_remain_greek_desc:0 "Finally, complete victory is at hand! Our determined push into the island, reinforced by both the TMT as well as the additional reinforcements, has effectively crushed any remaining organized Greek resistance in Cyprus: Nicosia has fallen, and the few remaining troops have either surrendered or fled the island on whatever boat they could requisition.\n\nWith our triumph sealed by the formal surrender of the Greek governor of the island capital, a provisory Turkish administration will oversee an ordered transfer of power. The TMT has been transformed into an effective, if overzealous security force, tasked with ensuring that our new subjects do not raise against us as they themselves did: talk about turning the tables..."
