 tur_flavor.1.t:0 "Sorry, Not Allowed"
 tur_flavor.1.d:0 "Amongst the applicants sat a seeming outlier. A boy with bushy eyebrows and a disheveled, grey, business suit, two sizes too big, found himself amongst a room of neatly dressed young men, ready to receive an interview for military high school. The tests had been completed, and in the last phase, despite his appearance, the disheveled boy was hopeful that he might find a place amongst the Turkish army.\n\n"Abdullah Öcalan to desk seven," the voice of an officer sounded, prompting the young man to walk and sit opposite his interviewer.\n\n"Mr. Öcalan?"\n\n"Yes, sir."\n\nThe officer let out an amused sigh. "I don't know why you bothered, kid. Look, your grades were half-decent, you passed the fitness examinations and all. Just one thing." The man paused, looking down at the file in front of him, before leaning forward and staring Abdullah in the eyes.\n\n"You're a Kurd."\n\nConfused, the boy responded. "A Kurd? Wha-what does that have to do with anything, sir? I can fight just as well as the rest of the men!"\n\n"Listen kid, I have no special sympathy for your kind. I'm not like that. While I can give you the easy version of it, I do know that there are a people a lot less polite than me waiting for you in the army. This is the easiest way out of it for you, and for me." \n\nAbdullah's expression visibly saddened. The officer let out a short laugh. "There's a lot of guys further up who'd have my ass if I let you through. Go on, kid. Get out of here and run back to whichever desert village you come from.[GetTUR_Ocalan_DYP]"\n\nSweeping up his papers, the boy briskly walked out of the centre, his grief morphing into rage."
 tur_flavor.1.a:0 "A revolutionary is born."
 tur_ocalan_1_dyp:0 " Don't worry about complaining to some DYP pushovers either. I'll make sure your grades look a lot worse before I file this."
 tur_flavor.2.t:0 "Fate of Women"
 tur_flavor.2.d:0 "Abdullah Öcalan was forced to stand and watch. His sister, his loving and joyful sister, now sat solemnly by her new husband. From both sides of the room, the Öcalan and Ganjavi families cheered and rejoiced, but Abdullah knew the pain he saw in her eyes, and he had watched it grow for a long time.\n\n"But surely there must be some other way!" the boy had said, those months ago, pleading with his father. "Is she not the same as the rest of us? Does she not deserve the same as us?"\n\nYet no mercy.\n\n"Enough Abdullah!" had come the response, complemented with the slamming of a fist to the table. "Your sister will marry Mr. Ganjavi and that will be the end of this discussion!"\n\nNo matter how many times he held his sister while she cried, consoled her in those long winter nights, or told her things would be okay, they hadn't prevented, and couldn't have prevented, the shackles she was now forced to don. A slave to a man, by no fault of her own, but merely by sabotage of birth.\n\nYet what crossed Abdullah's mind as he witnessed this disgusting affair was that this scene was not alone. For centuries before this moment, on every continent and in every class, those like his sister had been bullied and forced into submission by his own sex. Conservatives, fascists, Nazis, and even those liberal, fair-minded intellectuals of ages gone by, had agreed, or at least implicitly permitted, the subjugation and control of women by men. No hope for a free world could exist like this. Those men who proclaimed to cherish freedom had stood in silence while half the world had been forced into serfdom.\n\nAbdullah would not be such a man."
 tur_flavor.2.a:0 "A society can never be free without women's liberation."
 tur_flavor.3.t:0 "Two Boys"
 tur_flavor.3.d:0 "Alone at the library, a young man sat, his head physically and mentally deep within his book. Such was the boy's fascination with the text that he barely noticed a group of slightly older students wander in and sit not far from him. After a brief, silent coexistence, one of the new arrivals chose to break that trance "Hey, you."\n\nAs it would to any bookish, teenage boy, the opener sent a wave of anxiety down Abdullah's spine. He wasn't from around here, and had only started attending the Meslek Lisesi, one of Turkey's vocational and technical high schools, after he moved to Ankara from the rural West of the country. He'd stuck to himself, knowing full well that the Turks weren't always fond of his people. Yet, after a second that seemed to last a thousand years, the young Kurd mustered up enough courage to reply.\n\n"Yes?"\n\nHe made eye contact with the greeter, a handsome and kindly looking young man, who softly smiled at Abdullah. "Is that Lenin you're reading, there?"\n\n"Yes. State and Revolution."\n\nThe group started muttering to each other. The kindly boy's smile turned into a knowing grin. He put forward his hand toward Abdullah. "The name's İbrahim Kaypakkaya. What's yours, brother?"\n\n"Abdullah. Abdullah Öcalan."\n\n"Your accent, you're Kurdish?"\n\nAbdullah grew nervous. "Y-yes."\n\nİbrahim reinforced his smile. "Don't worry, brother. We'll keep you safe from any pigs who want to give you trouble, eh? Welcome to Ankara, Abdullah. You're with us now.""
 tur_flavor.3.a:0 ""So, have you read Lenin's "Imperialism"?""
 tur_flavor.4.t:0 "I Saw the Sun"
 tur_flavor.4.d:0 ""You know, Abdullah," Deniz started. "The winds are changing. I think you know they're changing as well as I do."\n\n"Well you would hope, wouldn't you?" Abdullah Öcalan had only graduated into the Middle East Technical University a few months ago now, but the size and number of student actions were swelling, not to mention the gradually declining situation Turkey, and the world, found itself in. Capitalism and fascism, those twin evils, seemed as cemented as ever, and the righteous opposition was mountain.\n\n"I would. But, anger without direction is no revolution, and I fear all we're seeing now is anger." Deniz took a sip from his coffee, and then laughed. "I'm no left communist, Abdullah. I know we cannot merely sit in our armchairs and wait for the people to seize the day."\n\n"Then what would we do, Deniz? What would you have me do?"\n\nDeniz shifted his jolly expression to something more genuine. "Abdullah, amongst all those I know who fight as we do, I know none who share your vigorous idealism and originality. More than that, your expression, your rhetoric, your brilliance is obvious even in our conversations."\n\n"You flatter me, Deniz."\n\n"I'm serious Abdullah. I believe you need to give voice to the people. I believe, through your words, you need to let our anger be heard. Give us direction, Abdullah. Be our Marat."\n\nBeginning what would end in a thousand essays to shake the Turkish nation, Abdullah Öcalan paused in thought, before responding to his friend."
 tur_flavor.4.a:0 ""I'll consider it, Deniz.""
 tur_flavor.5.t:0 "The Partisan's Squabbles"
 tur_flavor.5.d:0 "Rarely did news ever dissipate past the jail's walls and into the ears of those inmates trapped inside this fortress of iron bars, rotting away in seclusion from both the delightful charms and the lingering tendrils of sin that filled the world beyond their concrete prison. So when Cevat Rifat first heard rumours of a coming war against those infidels in Rome, he had been the least bit sceptical. Yet as the whispers turned into chatter and hearsay became facts uttered from the lips of guards, his interest had certainly peaked.\n\nA bribe there and a bribe here and soon a bundle of newspapers found themselves smuggled into his tiny, shared cell. "WE MARCH WITH THE GRANDMARSHAL!", he read as his face turned to a stern look of disapproval. He flipped through the pages rapidly." INONU PROMISES TO LIBERATE LOST TERRITORIES", "INONU AT THE FRONTLINES".\n\nA sense of horror climbed up his spine. "THAT RAT BASTARD INONU WAS BEHIND THIS", he yelled as the papers in his hand were flung into the ceiling."This is no righteous war; there is no great and mighty crusade against the bloody infidels;  there is no glory to be won.", he continued."No, this was nothing but another godless plot by that bloodsucking, sycophant Inonu and his Jewish puppet masters. May Allah curse that devil-worshipper and his mob of zionists before they tarnish Turkey any further."\n\n"Yeah, right", the quiet inmate in the corner of the room muttered sarcastically.\n\n"Do you think this is some sort of joke?" Rifat questioned as he rolled up his sleeves. "Wha-". Rifat drew near him." Answer me, do you think this is some joke, you twisted atheist?", Rifat repeated before pouncing onto the now wailing man's chest.\n\nThe guards watched silently from afar as one brawl, turned into two, then three, four, five and soon, like a string of dominos knocking each other down, the prison in its entirety had fallen to a bout of rioting."
 tur_flavor.5.a:0 "The spark of a much greater fire."
 tur_flavor.6.t:0 "The Old Poet's Respite"
 tur_flavor.6.d:0 "The bright morning sun's rays shone into Necip Fazil's eyes, blinding him as he stepped out of his prison for the first time in over a decade. Twelve years to be precise. Twelve years of anguish. Twelve years of his earthly life spent rotting away on the cold, hard, concrete flooring of a decrepit prison cell serving a sentence to a crime he did not even commit. Sure, Cevat Rifat and his pals in the Islamic Democratic Party had certainly been behind the unsuccessful attempt on Ahmet Erim Yalman's life, he was not. He was falsely incriminated by that atheist Inonu's lackeys and locked behind steel bars for the better part of a decade while he, with God as his witness, knew himself to be free from sin.\n\nHe walked down the path ahead of him, wandering past the prison's walls and into the city he'd been shackled and held hostage in by those sadist savages. Fazil found his eyes looking onto a small stall by the sidewalk. He picked up his wallet and ruffled through it to gather what money he had left. 100 Lira. Not much at all, but certainly more than enough to get him the day's paper.\n\nThe cars that filled the streets had changed; the clothes the men and women roaming the streets wore had changed; the arrays of colourful advertisements that were plastered across buildings and billboards had changed. Yet beyond these surface things, it all had been the same. Sure, the air was heavier and the sun's light seemed brighter than ever to his eyes, but the arteries of Turkey‒ the lifelines that bring it its might‒ were untouched, remaining clogged with vice and debauchery.\n\nThe moral decay brought on by the corrupt influence of that spawn of the devil Mustafa Kemal and his cabal of deranged prostitutes whoring out Turkey to the perverted, barbaric whims of the west, continued to permeate in every corner of his beloved motherland. The passerby chittered and chatted on topics he could not bear to imagine. Men amassed in rows and laughed at the obscene as they drank their "drinks", drinks that were, in reality, nothing more than intoxicating poison, the same poison that he once had sipped before he saw the light, that poison that rendered a man brainless, dimwitted, an animal, incapable of anything more than slurred, incoherent speech."
 tur_flavor.6.a:0 "One day they will see the light."
 tur_flavor.7.t:0 "The Crossing of Fates"
 tur_flavor.7.d:0 "Deep within the endless alleys, streets and corridors of Istanbul sits two old, jolly men on a bench. One could hardly believe that that inconspicuous pair laughing along with each other was none other than Islamist writer Cevat Rifat and his compatriot poet Fazil Necip Kisakurek.\n\nCevat brought his eyes down onto his pack of cigarettes. Only one had remained. He picked it up and out of the package, lit it and threw the empty carton onto the street. A cloud of smoke rose out of his mouth. Not ten seconds later, would he burst into an episode of violent coughs; a putrid mixture of saliva, phlegm and tar flew out his mouth and onto the concrete pavement.\n\n"You know, you won't live much longer if you keep turning your body into a chimney", Fazil spoke with a grin on his face."It does make me think, who do you think would succeed us when you and I both have our soul's grasped by the angel of death?" Rifat questioned."All I know is that it certainly wouldn't be any of the hooligans that make up today's youth.", Necip answered. "Look at here and see who's talking ill of today's youth: the man who drank the wineries of Paris dry."Listen Cevat, the grave cannot wait for the dead; the devil cannot wait for sin and I cannot wait for you to one day get a sense of humour."\n\n"Your jokes never cease to make me laugh. But seriously, do you believe there will be somebody there spreading the truth of Allah's righteous message.?" Rifat asked his friend."I've seen kids who haven't even memorised the Fatihah and we expect this generation to carry on the struggle against the atheistic government and their goons?".\n\n"The kids indeed are a sorrow sight these days" a tall, young man with an unkempt beard responded as he approached the pair." I overheard your conversation while passing by and I can't help but agree. The state of the nation's morals is despicable, it seems as if the Jewish cowards have won their hidden battle against Allah's will after all."\n\n The trio traversed all sorts of topics, from politics to theology, as hours came and went.\n\n "Thanks a lot for your time.", the young man muttered as handed them a piece of paper. On the front, a telephone number was written down and on the back, a name was typed out."
 tur_flavor.7.a:0 "Salih Mirzabeyoğlu."
 tur_flavor.8.t:0 "Grey Wolves on the Savannah"
 tur_flavor.8.d:0 "The sun had come down over the South African landscape, and a band of mercenaries, their tents pitched in the shade beneath an acacia tree, gathered around a fire. After a messily eaten dinner of whatever rations they had on hand, the mercenaries reenacted an age-old ritual among their kind: they swapped stories.\n\n"What brought you to Africa?"\n\nMost had been down on their luck back home in Germany, Italy, France, or Iberia and saw the chance for excitement, adventure, and a bit of pocket money. Others were idealists, international nationalists looking to advance the cause of the white race no matter where, although they were certainly not idealistic enough to turn down the check as a reward for their service. One had been the pampered son of a wealthy plantation owner in the Congo and signed up to kill as a dangerous, convoluted means of rebellion. It was a group of dark-haired new arrivals, however, who were widely agreed to have the king of tales.\n\nThey told of their homeland in western Asia, far from the nationalistic battle lines the others were familiar with. They told of a nation that had risen like a phoenix from the ashes of a dying empire, waging existential war against all manner of foreign enemies and national traitors. Their country, powerful as it now was, had lost its respect for tradition and its people's faith. Africa had no value for them, other than the promise of blood, glory, and vital experience. With the money, weapons, and lessons they'd learned, they would return to distant Turkey and purify it, building a nation truly worthy of the modern age."
 tur_flavor.8.a:0 "An enviable sense of purpose, however gruesome."
 tur_elections.1.t:0 "Polls Update"
 tur_elections.1.d:0 "Every coffee-house in every City in Turkey is stricken by a bout of heightened tension as the newest polls hit the daily papers and men and women of varying sympathies clash and clamour over a variety of subjects, from the most menial of partisan divides to the towering question that remains to be answered: who will prevail in the race for the hearts of Turkey's electorate?\n\nNo matter the inaccuracies latent to even the finest pollster's work, the biases and under-representation endemic to the polling system, they nevertheless are becoming ever the more important as the nation nears what may just be the most significant election in the history of the Republic, providing the nation with crucial insight into the ongoing struggle for the nation's highest offices. These polls will certainly be cemented as a new staple for Turkey's blossoming democratic spring."
 tur_elections.1.a:0 "So many predictions; only one outcome."
 tur_elections.2.t:0 "1963 Elections Begin"
 tur_elections.2.d:0 "Pollsters rush to print out the freshest polls; idle campaign machines roar to life; posters are scattered across every wall in the republic, and each one of the Republic's citizens lay frozen to their radios as they listen to the energetic effusions of silver-tongued orators and the bombastic tirades of demagogues, flowing through the airwaves and into their ears.\n\nThe latest in a series of Turkish elections, the 1963 elections have kicked into gear. While the tradition of Turkish electoralism is an old and cherished one, one hailing from the days of the Great Mustafa Kemal and his grand dreams of seeing his beloved nation crafted into a bastion of liberty. Nevertheless, this election will prove to be the most consequential in the Republic's history with a sense of freedom and fairness instilled into the electoral process for what may just be the first and last time in Turkish electoral history, and the looming prospect of the Republican People's Party losing their long-held stewardship over the Republic's institutions.\n\nWith the CHP and its two main challengers in the DYP and the UDP, preparing to contest the elections, one can only imagine who will emerge victorious as nation's fate is bequeathed onto the hands of its populace."
 tur_elections.2.a:0 "The Light of Liberty shines bright in the land of the Crescent."
 tur_elections.3.t:0 "Election Day"
 tur_elections.3.d:0 "The campaign machines have come to a grounding halt; the ringing of zealous harangues dies as the air drifts to tense silence; posters hanged onto the walls of every street are torn down, and millions of minds have been made. The election season has ended as millions of hard-working Turkish citizens, scattered all across the vast Republic, begin to form endless queues awaiting their respective turn to etch their vote onto a paper ballot before casting it at a booth, their vote in the latest Turkish election‒one which has shaped up to be the most important of its era.\n\nAs each vote is tallied, the nation sits impatiently awaiting the final verdict. Will the CHP fend off their opposition, safeguarding the ideals of Kemalism under the watch of the beloved Grandmarshal İnönü? Or will their monopoly over power be broken by Celâl Bayar and his UDP's promise of wide-reaching economic reform? Perhaps even the underdog in the race, the newly constituted DYP with their candidate Behice Boran, might win over the hearts and minds of a people clamouring for change with their revolutionary banners holding idealistic messages of a reborn Turkey, a nation that stands as a bastion of egalitarianism in a sea of tyranny."
 tur_elections.3.a:0 "Whatever the result may be, Turkey will emerge as a different nation."
 tur_elections.4.t:0 "The DYP Wins the Elections"
 tur_elections.4.d:0 "The bright early morning sun shone down upon the world, however, covered by the wide canopies of ancient trees and looming in the shadows cast by the magnificent yet massive Ankaran skyline, Behice Boran and her podium were protected from its harshness. She stood and looked at the scene in front of her; a mass of men and women from all walks of life carrying a jovial look of optimism had assembled ahead of her. Many had doubted her, many doubted the DYP, they called their chances at winning meagre, they mocked their efforts, their speeches and their proposals. Yet she did it, she proved them wrong, and now she sat on Ataturk's chair with a mandate directly from the people to govern in their name.\n\nThe breeze rustled her hair, and she fixed her posture before she began to utter the first words of her inauguration speech. "Brothers and Sisters, for decades have the Turkish workers toiled and laboured under the exploitative shackles of the bourgeoisie. The shackles of reaction that have held back this nation's mighty march towards progress shall be shattered. Free from the corrupting influence of petty oligarchs and their nefarious schemes, the republic shall be reborn anew. A nation where the common man can live a fair life, earning the full value of what they till."\n\n"A new dawn is on the horizon", she continued," A new dawn for every citizen of Turkey. A new era where the poor man no longer is forced to live off nothing but the scraps of others. No more shall the spirit of the worker be suppressed by obnoxious measures of repression and criminal attempts to control a population. No more shall our brethren around the country be looked down upon and treated as foreigners in their own country. Onwards to the new Turkey, an egalitarian Turkey, a Turkey of the people."\n\nAs her speech came to a final halt, Behice focused on the crowd in front of her once again. The crowds were ecstatic, energized and motivated by the arrival of a light of hope. They desire to be free, and Boran will not fail them."
 tur_elections.4.a:0 "Köylüye Toprak İşçiye İş!"
 tur_elections.5.t:0 "The CHP Wins the Elections"
 tur_elections.5.d:0 "İnönü had grown accustomed to the formalities and ceremonies that arrived with a victory in the elections. The exuberant cheering of delighted masses and the silent jeering of their counterparts in the opposition was all too familiar to him, it felt like tradition. A tradition that he grew nervous at the prospect of ending. He had served his nation dutifully for decades, from when he was a simple soldier, to a general leading the forces of liberation, and then finally as the Millî Şef lording over the Byzantine realm of Turkish politics. However, he was not the same man, his bones ached, and his body grew brittle, his once-decisive leadership grew blunt as he led Turkey into a pariah on the world stage during the last war. The polls did not look the most appealing either, and the streets boiled over with anger. Yet somehow he had prevailed once again; now he stood ahead of the crowds once again, waiting to give another victory speech.\n\nHe muffled his cough, and grabbed onto the podium in front of him, suspending himself on it as words began to flow out. "Citizens of the republic, our nation was one baptized in the scorching fires of liberty. A nation that rose from the ruins to regain its might and pride. Once our shackles were fell and shattered, the people turned to their liberator as a guide, and guide them, Mustafa Kemal would. Prosperity flourished and the enlightened, romantic values of liberty grew entrenched deep within the consciousness of every Turk."\n\n"Now, with our shields our heads in the mud, the children of Ataturk call upon the Republican People's Party once more, in hopes of finding in them a saviour. Well, fret not citizen, for your calls have been heard and the party of Kemal arrives with open embraces, a generous heart and a dedication to see our republic rise from the ashes to glory like it did all those decades before."\n\nEvery bone in his body still ached, and his coughs grew no less aggressive, yet he felt as if he sat atop the world. The people had given retained their precious trust in the CHP, trust that must never be broken."
 tur_elections.5.a:0 "Beyaz Günlere!"
 tur_elections.6.t:0 "The UDP Wins the Elections"
 tur_elections.6.d:0 "Age, a concept that frightens many. Time, a spectre that guides you to maturity and growth, before it takes its toll on the body of a human, rendering them frail. To many, the coming of age means the death of dreams, the death of ambition. Yet, Celâl Bayar's story with time plays out differently. For 82 years he has walked the earth, he struggled and fought. First, he fought for constitutionalism with the idealistic Young Turk revolutionaries before they turned a page on their ideals, then he fought for liberty under the helm of Mustafa Kemal but the democracy he had hoped for did not arrive. Decades of elections ripe with fraud and corruption cemented the CHP's dominance. Now, as an old man, he finally stands amidst the crowds, not as a protestor, but as the elected president of the Republic of Turkey.\n\n"People of Turkey, I stand today as one of you, one of the masses that yearn for liberty. The masses that have grown sick of autocracy and the terrible suffering that comes with it. They laughed at us, and they challenged us to make a change. We have risen up to their challenge, and we have won our prize: the prize of liberty."\n\n"The Turkey of tomorrow will be different to the Turkey of yesteryear. The Turkey of tomorrow will be a nation built on the principles of liberty, and brim with prosperity. A nation where men do not fear to speak freely. A nation where men do not fear to pray. A nation where every man and woman has the opportunity to fulfil their dreams. A land of plenty."\n\nA round of thunderous applause decked the air as those last few words escaped the confines of his mouth. Bayar knew very well what these people expected of him- liberty and a full stomach‒ and he promised himself that'd work his hardest to make sure they got just that."
 tur_elections.6.a:0 "Yeter! Söz Milletindir!"
