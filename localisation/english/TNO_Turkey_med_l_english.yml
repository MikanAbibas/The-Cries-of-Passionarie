 TUR_Rhodes_Gursel_Title:0 "The Unorthodox Approach"
 TUR_Rhodes_Rustu_Title:0 "One Last March"
 TUR_Rhodes_Inonu_Title:0 "One Final Lesson"
 TUR_Rhodes_Gursel_Desc:0 "For most men, the task would be considered a challenge. However, Cemâl Gürsel was not most men, and while there was some amusement in pretending otherwise, there was little point. The capture of Rhodes had long been in his mind, and when Italy threatened war, well, there was no better time than to refine certain ideas he had.\n\n"At ease," he ordered those in attendance as he swept in with a confident ease. A few he recognized, others he didn't. The younger ones definitely seemed affected at the presence of a living legend in their midst. A legend well-deserved, of course, and one he would validate today. "You've all been apprised of the mission," he said, pacing as he began. "First, any questions?" He pointed. "You."\n\nOne of the older officers cleared his throat. "The plan itself seems solid, sir, but I've reviewed the numbers and...are you certain we have enough men to take the island?"\n\nGürsel smiled. "As a matter of fact, I do. If you refer to the breakdown provided, I've included marines, mountaineers, and special forces - the sharp-eyed among you will notice there is an unusually high number of naval assets," his smile grew in the awaiting silence. "Details, gentlemen. They win and lose wars. Now, let's consider the Italians."\n\nHe rested a finger on top of a map. "The Italians know all they have to do is hold the major points. They are anticipating a naval invasion - There will be traps, choke points, and advantages they inherently possess. This is their home turf, and they know that they have an advantage. Now, we could oblige them, but I have no interest in throwing our men to the grinder to appease Italian expectation."\n\nHe drew several lines. "The naval forces will occupy the Italians. We will bombard at the expected invasion point all around the island - keeping their interest. However, the bulk of our forces will be landing where the Italians are not. From there they will move to the critical points and catch the Italians off guard - hence the special divisions," a brief pause as he finished. "And when they are disrupted - we strike as one, and claim the island."\n\nHe could see the excitement gleaming their eyes, reflecting his own as he spoke, eagerly anticipating the battle to come. Such a plan was unconventional and risky - but he had never been one to let that deter him before."
 TUR_Rhodes_Rustu_Desc:0 "The guards outside the conference room saluted as General Ragıp Gümüşpala approached. His pace was slow, his movements controlled, and his breathing weathered. The longer the war progressed, the more his age showed itself. The stress of war was a burden he had been able to manage before, but now it was suffocating in its intensity.\n\nYet he would persist all the same. He would do his duty and achieve victory for Turkey - even if it was ruled by İnönü.\n\nOfficers and Commanders respectfully greeted and saluted him as he took his place at the head of the long table. As his eyes scanned the younger faces, he could not help but wonder who among them would take his place. However, that would not be today. Not until there was one last victory.\n\nHe cleared his throat. "The Island of Rhodes belongs to Turkey," he said, voice low yet still carrying the weight of authority. "Our invasion of the island will commence shortly." With a flick of his wrist, one of the junior officers rolled over a larger map of the islands pinned on a stand. With a pointer, Gümüşpala rested the tip on several spots marking Italian positions.\n\n"Reconnaissance from the island confirms where the Italians have soldiers stationed - enough to defend the island. So long as they control it, they will have a direct staging ground to the mainland," his sharp eyes swept over the assembled, as his pointer tapped on several shores. "That will not happen. Invasion forces will land here, here, and here," he tapped with each word. "There are only a few critical points of control, which we shall seize."\n\nHe continued elaborating in more detail, each point of interest, the estimated level of Italian coordination, their level of preparation - complete with images captured from spies, and timetables for victory. As he talked, he gradually realized that when it came time to retire, he would miss this. The sense of history and camaraderie as men gathered, and if only for a while, focused on a greater cause.\n\nIf this was to be his last victory, let it be a memorable one."
 TUR_Rhodes_Inonu_Desc:0 ""Forgive me, sir," the man before him asked hesitantly. "But...you want to ask them to surrender."\n\nİnönü did not enjoy being questioned, but tempered his irritation, simply furrowing his eyebrows. "Offer an enemy a way to escape, and they may take it. If they do not, nothing has been lost from the effort," he sighed. "But to preempt your question, no, I do not expect them to take it - But it will make them question our intentions, which we will then exploit."\n\nThe general was clearly not convinced, but knew better than to contermand him in front of others. İnönü could see the same uncertainty on the others assembled. He resisted an irritated grunt. Hotheads and glory-seekers, with visions of conquest in their minds. Wild strategies and heroic charges no doubt dominated their thoughts. Glory and honor took priority over reason and subtlety.\n\nSuch was the next general of military leaders, and that was a thought depressing indeed. One did not need such qualities to defeat an enemy - especially one as well-documented as the Italians. He knew quite well how the Italians fought, and had educated himself in their ways long ago. With all gathered, İnönü addressed them. "Let us begin."\n\nCombined with reconnaissance, he knew that they would prioritize the ports to deter a sustained invasion, while leaving certain advantageous terrain and smaller towns with minimal ports unprotected. The plan, as he explained, was deceptively simple. There would indeed be an invasion of the main ports, as those were the keys to victory, but secondary invasions of smaller towns and a few direct shores would grant their forces small, but crucial advantages in breaking any stalemate.\n\nAs he explained the plan, he was pleased to note that the participants had the fire in their eyes cool, and asked responsible questions about specifics. Soon there were nods around the room, as officers and commanders discussed their own roles in the plan, appearing to agree that it was not only a good plan - it would win them Rhodes.\n\nİnönü did not know what would happen in the future, as his days of such commands like these were coming to an end and he had the wider war to consider. Yet he hoped that there would be something the next generator would take an employ. The battle ahead would either discredit or victicate him - and he was confident in victory."
 TUR_Rhodes_Gursel_Option:0 "Legends did not arise from the conventional, after all."
 TUR_Rhodes_Rustu_Option:0 "A battle of which legacy will be cemented."
 TUR_Rhodes_Inonu_Option:0 "Perhaps they are willing to learn after all."
 tur.66.t:0 "Bloodied Shores, Broken Crescent"
 tur.66.d:0 "When the crack of rifles sounded, and soldiers on the naval craft dropped to the ground, staining their comrades and deck with red, it was a prelude to what came next. The Italians had not been idle, and with Rhodes so close to Turkey, they had known that it would almost certainly be invaded. They had a choice - retreat and cede the island, or fight.\n\nThe Italians fought.\n\nThey did more than fight. They prepared. The precious days they had before the Turkish ships appeared in their waters they used to construct barricades, gather food and water, evacuate the civilians, and create and train militias of the Rhodes civilians who wanted to stand and defend their home. The Turks had come expecting a small, but skilled defense force, they instead found an army.\n\nLanding craft ran into hidden mines along the ports, sinking a dozen crafts and condemning dozens of Turkish soldiers to underwater graves. Rockets sank more. More mines and modified grenades were buried in the sands and within streets, killing more soldiers who charged to their deaths. Cars became improvised bombs, taking out teams of Turkish soldiers without warning. Italian and militia snipers fired with impunity from the hills and mountains, exploiting every natural advantage they had.\n\nThe invasions that succeeded found no foothold deeper within. With every door kicked open, a hail of gunfire rained out, as even the homes had been turned into fortifications. Rigged doors left soldiers without hands, arms, or legs. It had not taken long for the Turkish officers to realize this, and shaken from the losses already suffered, and unwilling to risk any more, ordered a full retreat.\n\nLike hunting eagles the Italians viciously descended upon the fleeing Turks, roaring in victory as the fleeing soldiers were mowed down by bullets, with only a small minority managing to escape to sea - only for it to become the tomb of many of them, as rockets and snipers followed in their wake.\n\nOnly when the last of the Turkish navy disappeared over the horizon did the Italians breathe a sigh of relief, and celebrate their victory."
 tur.66.a:0 "A blow to Turkish ambition."
 tur.67.t:0 "Back in Control"
 tur.67.d:0 "None could say that the Italians had no warning. The proximity of Rhodes to Turkey meant that invasion was coming - it was not a matter of if Turkey was coming, but when. When the dust settled, it was impossible to say what steps Italy had taken. Turkish intelligence and interrogation afterwards offered different theories.\n\nSome had said that ranking officers had not believed that Turkey would dare invade at all. Others said the Rhodes garrisone was split in how they wanted to defend, with different factions putting forward ideas that clashed, leading to none of them being properly implemented. Still more said there simply hadn't been enough time.\n\nIn the end, it all led to the same result.\n\nWhen the Turkish Army stormed the Island of Rhodes under the Crescent Flag and the words of God on their lips, they seemed unstoppable. The Italians had tried to prepare, but Turkey had prepared better. Artillery and rockets pounded from the seas, and the front lines of the Italians were disrupted as the invasions across the island began.\n\nSoldiers had fallen in the first waves, but not nearly enough to stop the overwhelming surge. Door by door, street by street, teams of soldiers marched, hunted, and killed. One by one, the Italians scattered and hid, praying that they could flee to the sea before they were caught. Only a few made it. Those who stole boats were soon run down by the Turkish navy and captured or sunk.\n\nThe terrain advantages held by the Italians were insufficient against the sheer numbers that had landed, as well as the tactics employed to negate the advantages. Turkish snipers dueled their Italian counterparts through the hills, valleys, and mountains, and artillery was moved into positions that were enough to dislodge the entrenched defenders - while providing cover for the other invasion forces to secure their gains.\n\nEventually, the gunfire died down, the cannons went silent, and the engines turned off as the Battle of Rhodes came to an end. The Italian flag was torn down and burned, as the Turkish Crescent rose into the air across the island, flapping in the wind. The news was met with cheers and celebrations on the mainland, giving a needed boost to the soldiers fighting elsewhere as they celebrated the major Italian defeat."
 tur.67.a:0 "Turkey marches onward."
 tur.68.t:0 "Her Biji Kurdistan"
 tur.68.d:0 "Hakan's face fell, his smile becoming strained. "I'm sorry," he asked, almost confused, "I think I must have misheard."\n\n"You heard me," the teen responded, some bravado hiding the tremor in his voice, "I'm not going with you. I won't."\n\nThe older officer growled. "Don't be stupid boy," he snapped, "Just come along nicely and no one gets hurt."\n\n"No!" the boy responded, his voice growing bolder and defiant, "You can't just bully us into submission any longer! We will never bow down to you!" The teen seemed to puff up, taking a deep breath before shouting as loudly as he could. "Her biji Kurdistan!" he practically screamed, "Her biji Kurdistan!"\n\nSalih watched helplessly as Hakan tried to take a swipe at the young teen, who dodged underneath the officer's arm and sprinted past. Hakan practically snarled, barking a quick "Come on!" at the younger officer before taking off in pursuit.\n\nMomentarily stunned, he took a moment to shake himself out of his confusion before following. He turned a corner to find that they hadn't gotten very far, arriving just in time to see the boy slip through a veritable mob of people that had converged in the middle of the street.\n\nHakan was holding his arms up in a conciliatory gesture, in what Salih assumed was an attempt to calm things down. "People, please," he said, "Return to your homes. If you leave, we'll leave, and this can all be settled peacefully."\n\nAn angry looking man near the front spoke up. "No, the boy is right. We're tired of people like you coming into our cities and doing whatever they please. We're done bowing down to you." Glancing up from his speech, his eyes widened as he spotted the younger officer. Salih cursed as he fumbled for his weapon.\n\nA crack split through the night air, and Salih fell, a lance of pain going through his torso. A second crack split the night air, and Salih felt no more."
 tur.68.a:0 "As the sun rose, the city would find itself aflame."
 tur.69.t:0 "Sunrise"
 tur.69.d:0 ""-After two officers, Officer Hakan Revni and Officer Salih Hasanoğlu were reported missing. The Turkish Land Forces have announced that the two were in the region investigating a terrorist threat they believe to have links to the Italian SIM, and are presumed dead-"\n\nPresident İsmet İnönü reached over to the television, turning it off with one precise, delicate motion. "So, Minister Doğu," he said, his voice calm and even. Turning his gaze, he locked eyes with the minister, who looked very much like he'd like to be anywhere else. "Would you care to explain what's currently happening in Diyarbekir?"\n\nThe Minister of Intelligence shifted in his seat. "Well, sir, it appears that the Officers made a mistake-"\n\nİnönü slammed his hands on his desk. "Damn it, Mehmet, I told you to be delicate!" he exploded. The minister flinched in his chair as the president threw himself out of his seat, continuing his tirade as he began to pace around his office. "This was supposed to be quiet, just in and out. They were after a boy!"\n\n"I-I'm aware sir, but-" Doğu tried to stammer out before being interrupted once more.\n\n"I don't want your excuses, damn it!" the president swore, "Why in God's name did you think you could trust the student of the Gestapo agent with something so-" he was cut off by the door opening and his secretary walking in. "What is it?" he asked, his voice dangerously low.\n\n"It's, ah, the news, sir," the secretary stammered out, "You should probably see what's happening."\n\nWordlessly, quivering with barely contained rage, he turned the television back on as the reporter spoke over the backdrop of a burning city. "-Diyarbekir, rioting has broken out of the Sur district into the main portions of the city, where violent mobs are attacking civilian police forces."\n\nİnönü trembled. Turning towards both the Minister of Intelligence and his secretary, he spoke with barely controlled rage."
 tur.69.a:0 ""Get me the mayor of Diyarbekir, now!""
 tur.69.tt:0 "§RDiyarbekir, and the rest of the §YSE Anadolu§! region, awakens to a riot.§!"
 tur.70.t:0 "Review the Army"
 tur.70.d:0 "Having big, great ideas is one of the most important skills for a man involved in politics to have. Being able to translate them into words is yet another important skill. The final important skill was to be able to communicate them in a way that made them easy to understand, and exciting for the masses. Rüştü was a miserable, miserable failure after the first step.\n\n"Do you think, uh, about the, uh," Rüştü's cheeks already grew red with embarrassment.\n\n"What the fuck? Speak your goddamn mind or don't speak." Gürsel's rude terseness was a coping mechanism he hoped to hide his own nervousness, and he did not feel like dealing with Rüştü's pages of punctuation and no words.\n\nİnönü's steps interrupted their conversation. Both of the poor orators snapped to a proper salute deserving of their president and grand marshal. "What do we have here?"\n\nGürsel went in to speak, wanting to prove his worth. "Turkey's infantry is strong," he said, "and can be used to destroy the enemy. We misguide them, and strike when their guard is down, and back it up with airforce!"\n\nRüştü was not quite so confident. "We, uh, draw in the enemy forces. When they go in, we can surprise them... ambush from all directions! Like, h-h-Hannibal."\n\n"Hannibal?" Gürsel was eager to put down his rival's ambitions. "You mean just let them in? I suppose your plan doesn't involve giving them Istanbul, does it?"\n\nRüştü was hurt by Gürsel's putting down of his plans. "No, no... we have a strong military, we can use trickery... not brute force..."\n\n"Enough." İnönü interrupted the two of them, wanting silence to think on it myself. İnönü considered the two ideas carefully, then gave his order."
 tur.70.a:0 "Gürsel has the right idea."
 tur.70.b:0 "Rüştü's learned from the best."
 tur.70.c:0 ""Both of you are wrong. Back in 1920..""
 tur.71.t:0 "A Deal with Iscariot"
 tur.71.d:0 "Türkeş stood proudly before president İnönü, two sons of Turkey meeting. "It is an honor to be here, President, Grand Marshal and leader of the Turkish People." While Türkeş may be a patriot, and thus necessarily dedicated to his president, İnönü had no reason to feel kindness for Türkeş. This was a meeting solely based on pragmatism from the perspective of at least one man there.\n\n"Likewise." There was no need for İnönü to show his actual opinion of Türkeş. "No need to keep standing, let us sit and talk!" İnönü pulled aside a chair and sat down with Türkeş.\n\n"What courtesy!"\n\n"Oh, there is no need. In these dire times, it is oh so wonderful to feel some loyalty, as I'm sure you know." İnönü most certainly did not feel 'oh so wonderful.'\n\n"Indeed indeed!" A smile came to Türkeş' face. "You will find nothing but the utmost loyalty from me. Nothing like that bastard Ciano. Oh, how he trampled on us in Malta! What a disgrace to our great nation.\n\n"Indeed." İnönü felt great relief that there was no need to sway Türkeş at all. What anger he felt at the Italians! That would be at least one benefit of negotiating with him. "Turkey needs you, as I'm sure you know. Can your Grey Wolves serve us in the future?"\n\n"Can they? Ha! Our Grey Wolves can be mobilized at a moment's notice, greater than any country. We will die for you! We strike like lightning!"\n\n"Not like wolves?" The two men shared a laugh.\n\n"Oh, of course they strike like wolves! Long ago man lived in fear of wolves, those bared teeth shining from the night, stealing children and food alike - though I don't think they found much a difference between the two, and I don't know if the Italians do either!" Another laugh was shared between the men. "You can count on us, Mr. President.""
 tur.71.a:0 "A wolf in wolves' clothing."
 tur.72.t:0 "Birâyen Me"
 tur.72.d:0 "The headquarters of the MHP in Istanbul were busy when Ahmed Arvasi, cup of coffee in hand, returned from his lunch break to his small, yet well-kept office. He was glad to be back. Ideas had been stewing inside his head while he had eaten, and it was now time to put them to paper. The statement the President had delivered this morning had given him new hope for the future of both his people and his nation. He sat in front of his desk, took a sip from his coffee, and began to write. \n\n"President İsmet İnönü," he wrote, "who was born to a Kurdish family, has promised our Kurdish brothers today to give them their rightful rights after the war. His usage of Kurdish during the announcation was welcomed by the Kurds of Van. We know İnönü is a man of his words, and we will sure die for him!"\n\nHe sat back, sighing in happiness as he pondered the words he had been waiting to write for years. Many wondered what a Kurd could possibly see in the ultranationalist MHP, and Arvasi had long struggled with some of the racists that had tainted the party's reputation, but he understood that the character of the Turkish nation was defined by more than ethnic chauvinism. No, it was he who had described in his writings the distinct Turkish-Islamic synthesis that granted Turkey a higher calling, that bound together Turks of all tongues and colors through the Islamic faith. \n\nWith the conclusion of this war, Arvasi's dream of Kurds and Turks putting aside their differences and fighting as brothers would finally come true."
 tur.72.a:0 "Suleiman's ghost still haunts Turkey."
 tur.73.t:0 "The Price We Pay"
 tur.73.d:0 "The gendarmerie was already rummaging through the barnyard when Hera found them. She had been working in the field when she heard the shouts of men near her house, and she had ran back only to find her daughter cowering inside a barrel while the hated Turks trespassed upon her family's ancestral farm. The men were taking farming equipment, portions of last year's harvest, and even some of her chickens, and loading them into crates, to be taken to the back of a truck. The sight of her family's livelihood being stolen by her people's oppressors made Hera lose whatever manners her father had taught her. \n\n"What is the meaning of this!," she shouted at the men, as loud as her frail voice allowed her to. \n\n"Enforcing the laws of the State of Turkey!," replied one of the men. "All minorities are required to hand over one third of their income to the state, and if they are unable to do so, possessions of equivalent value will be confiscated from them!" \n\nHera broke down in tears. \n\n"Haven't you killed enough of us?! Haven't you raided us enough?! Why?! What have we done to you?!" \n\nShe screamed and cursed, and wailed, until one of the men threatened to put a bullet through her head. She quieted, and fell to her knees, turning to the last refugee all Armenians knew. \n\n"..Lead us not into temptation, but deliver us from evil. Amen," she whispered, as the soldiers moved the last of their bounty into the truck and drove away."
 tur.73.a:0 "Her tragedy would be one drop in an ocean of suffering, past and present."
 tur.74.t:0 "Call the Faithful"
 tur.74.d:0 "The Office of Foreign Affairs has prepared the missive that will be sent to the nations of Iraq, Iran, Saudi Arabia and Afghanistan, concerning the request to join in the conflict against the Italian imperialists. As the most prominent Muslim nation in the world, it is only natural that the Ummah will follow our lead in this Jihad against the Crusader. Saudi Arabia and Iraq in particular, as they chafe under the Italian yoke, will find the proposal contained in this letter to be most tempting, while Iran and Afghanistan are powerful nations who have defeated other colonial powers in the recent past. They too must realize that we must join forces if we ever want to defeat the forces of colonialism, and when they see our proposal we will be drowning in materiel and volunteers."
 tur.74.a:0 "There's no way they would refuse!"
 tur.75.t:0 "Turk i Kurd Birâne"
