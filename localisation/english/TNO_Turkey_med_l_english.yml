 TNO_Inonu_Speech:0 "The Italo-Turkish war was disaster. Our soldiers returned home in their coffins and the once smiling faces of our people, who dreamt of the glorious victory we promised, are now riddled with sorrow. Worst of all, the reality of defeat has turned our people against one another, and they remain at one another's throats in the streets.\n\nAs the President of the Republic, it is Inonu's solemn duty to address this horrific rise in tensions, and the distant ghosts of the past 30 years that have lead to it - sooner than he would like. A grand speech will be held in order to calm the public and give the cabinet time to work on a real solution. Until then, the batons of the Gendarmerie are the only tool we have against the surge in political violence which threats to collapse our rule of 40 years."
