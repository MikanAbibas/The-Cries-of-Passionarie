 tur.75.a:0 "Suleiman's ghost still haunts Turkey."
 tur.76.t:0 "Psalm 37:1"
 tur.76.d:0 "The gendarmerie was already rummaging through the barnyard when Hera found them. She had been working in the field when she heard the shouts of men near her house, and she had ran back only to find her daughter cowering inside a barrel while the hated Turks trespassed upon her family's ancestral farm. The men were taking farming equipment, portions of last year's harvest, and even some of her chickens, and loading them into crates, to be taken to the back of a truck. The sight of her family's livelihood being stolen by her people's oppressors made Hera lose whatever manners her father had taught her. \n\n"What is the meaning of this!," she shouted at the men, as loud as her frail voice allowed her to. \n\n"Enforcing the laws of the State of Turkey!," replied one of the men. "All minorities are required to hand over one third of their income to the state, and if they are unable to do so, possessions of equivalent value will be confiscated from them!" \n\nHera broke down in tears. \n\n"Haven't you killed enough of us?! Haven't you raided us enough?! Why?! What have we done to you?!" \n\nShe screamed and cursed, and wailed, until one of the men threatened to put a bullet through her head. She quieted, and fell to her knees, turning to the last refugee all Armenians knew. \n\n"..Lead us not into temptation, but deliver us from evil. Amen," she whispered, as the soldiers moved the last of their bounty into the truck and drove away."
 tur.76.a:0 "Her tragedy would be one drop in an ocean of suffering, past and present."
 tur.77.t:0 "If I had a Hammer!"
 tur.77.d:0 "Demir inspected the record's label, entranced by the name adorning it, "If I had a hammer". An odd Socialist song from America, from what he had gathered. Below the name of the song was the name of a singer who Demir couldn't yet recognize, apparently going by the name of "Cem Karaca". Only more intrigued, Demir pulled it from within the sleeve and placed it on the old record player provided by the University's radio station, explicitly not for playing to the public. Himself completely silent, he let it play its course, before lifting the needle once more. \n\nThe song was incredible, as much was unquestionable. Demir would hesitate to say it was based all that much on its source material, though, as it had its own sort of spin put on it, far beyond anything he'd ever heard. He would put it in the university's rotation, that was for certain. It wasn't like Demir had a choice, though. It wasn't published there for nothing, he did need to air it, as he wouldn't have gotten the record any other way. What he didn't need to do, though, was to invite Karaca over as a guest. Though it was far from an ideal setup. The meeting was just now being planned, the record needed to have been played in two hours from now, and Cem may not have even been on campus. Somehow, it all worked out, as things tended to do for Demir.\n\n"Now, today, I'm joined by a faithful rising star in the Turkish music scene, absolutely stellar musician, Cem Karaca!"\n\n"Hey, it's a pleasure to be here! It's not like it was a far walk from my dorm, anyway." Cem was only half-kidding. He didn't actually have any plans that day, and he desperately wanted to keep it just so. But alas, who was he to deny free press?\n\n"Heh. Alright, now, I've heard your record, it's great, but I've wondered, what was your inspiration?"\n\n"Ah, I've always loved American country music. Pete Seeger, in particular, has been a great motivator in times of conflict, or strife for me."\n\n"Such as?"\n\n"Well, whenever I think of the world, for instance," Cem chuckled, "I scream, and Pete is always there for me."\n\n"Alright, well how about we show off some of that inspiration, then? You're some of the first to hear this, folks! 'If I had a hammer', by Cem Karaca.""
 tur.77.a:0 "It's a hit!"
 tur.78.t:0 "Only a Nightmare"
 tur.78.d:0 "It still didn't feel real to İnönü. His mind struggled for a logical explanation, and came up with nothing. It's been three days since Hasan Saka's death, and every morning he expected, no, hoped to wake up from this nightmare. It wasn't until the funeral that it finally sunk in; his best friend was dead. \n\nSaka, who should be right next to him, is instead lying expressionless in the mahogany coffin. Draped over it was the flag of the nation he lived -and died- for. As İnönü looked at it, it slowly transformed into a sea of red and white, the crescent and star melting into the red background as the colors swirled together. \n\nIn all of his time serving Turkey, there was nothing like this. He had served in the military; he was no stranger to death. İnönü had witnessed death before. But this was different. İnönü had felt almost every emotion possible; happiness, sorrow, regret, anger, grief. But what he felt now could barely be described with words. It was rage at its most primal level, grief of a lost brother, and hatred for everything and anything. Pure hatred as he had never felt before. Hatred for the idiots in Italy who hosted the Malta Conference. Hatred towards the German Reich that led to the power vacuum. Hatred for himself for not somehow preventing this. \n\nHe rose to his feet, drawing shocked looks from other mourners, but he paid them no mind. Tears almost blinded him, but he managed to make his way out of the mosque without incident. He knew Hasan wouldn't have minded; he knew him better than anyone else in there. He pushed passed the thousands of onlookers in a trance. Before he knew it, he was at his office. İnönü pushed the doors open, locked them behind him, and sobbed."
 tur.78.a:0 "It's going to be a long night."
 tur.79.t:0 "Silence"
 tur.79.d:0 "Nobody spoke. The plane, from take off to landing, was completely silent, save for the low, constant hum of machinery. It was nothing like the loud conversations, arguments, and jokes that marked the flight to Malta. This was different. Everything was different. And yet, despite the fact that nobody had said a word, everyone was in agreement. Their thoughts, feelings, and emotions, were aligned. Even if they had been speaking, the delegates would not be bickering like they normally would.  \n\nThey were shocked. They were angry. The entire affair -the conference, the bombing, the farce of diplomacy- united them all in rage. The way the rage manifested was different for each delegate, however; Ferit felt hopeless anger at the very system he worked for. Fahri's analytical mind was already working on a dozen different ideas at once; ideas for peace and for war, ideas for revenge and forgiveness.  \n\nİnönü was...different. He, like the others, had not spoken a word. But unlike them, he would not allow his tears to fall. He contorted his face in countless different ways, miraculously halting the flow. It wasn't that he was ashamed of crying - it is natural, after all- but rather that he refused to believe this had happened. In the deepest, darkest part of his heart, he knew this was real. But the rest of his heart, even his mind, would not allow him to believe it. There's no point in wasting tears on something that is false. And so, as he shut his eyes, willing himself to wake up, he slowly drifted to sleep."
 tur.79.a:0 "He dreamed of Saka."
 tur.80.t:0 "Reaping the Rewards"
 tur.80.d:0 "The streets of Ankara were filled to the brim for the parade. The entire city had been festooned to celebrate the incredible victory against the Italian Empire, and now the time had come for the event to start: one by one, the tanks started rolling, the regiments started marching, and the acrobatic air wing amazed the onlookers with its skills. Wherever the parade passed, the people would cheer and throw flowers at them, chanting to the lively tone of the military songs, but most of the praises and lauds were for only one man: the Marshal.\n\nİsmet İnönü smiled as his car passed through Atatürk Biv, closing the parade with the beautiful sight of the presidential guard in ceremonial uniform. The victor, the triumpher, the saviour: these, among many others, were the epithets gifted to him by the newspapers and the jubilant Turkish population, but there was one he cherished the most: avenger. Yes, avenger, for he had taken back what Turkey had lost almost fifty years ago: the Dodecanese, the Levant, but more than anything, its honor.\n\nAs he reached the presidential tribune, where the most important officials were waiting for him to begin the true celebrations, the President returned somber. Victory had been achieved, but the price had been great: the sacrifice of so many brave soldiers would have to be repaid in time, and the costs of the war would be felt for years to come. Still, there would be a moment for that: now, it was the time for celebration.\n\nFrom the tribune, İnönü turned to face the crowd one last time, waving his hand. Once again, the people cheered, but right before leaving, one of the onlookers screamed a name: soon, another echoed him, and another, until all of Ankara was repeating that word, and at that, the old Marshal could not keep the tears in."
 tur.80.a:0 "Atatürk! Atatürk! Atatürk!"
 tur.81.t:0 "Awakening Into A Nightmare"
 tur.81.d:0 "The streets of Ankara had been meticulously festooned to celebrate the imminent victory. Flags hang from the street lamps, tribunes had been erected to host the most important state officials, the ambassadors, the media and the common populace, and tens of thousands of fliers had been distributed to commemorate the joyous event: now, all of these things appeared to the onlookers like a wonderful dream, one they had been forced awake from, only to find themselves in the nightmare of reality.\n\nDuring the war, the censorship had clamped down hard on the smallest hint of defeatism. News from the front had been cut off, TV channels and newspapers forbidden from talking about the war, and letters from the soldiers carefully curated: with the signing of the peace treaty, however, all those efforts were revealed in their futility, and it made the truth even more bitter.\n\nThe office of İsmet İnönü was a war room, an apt metaphore to define the current state of affairs, for the war against Italy had ended, only for the war against Turkey to begin. By the hour, reports piled on the President's desk, giving body and shape to his fears: he had always known that the war against the Italian Empire would have a cost, and now he felt like the usurer's victim, so sure of his solvency when asking for a loan, and without a single coin the day payment was due. This time, however, there would be no delay: the merchant had come from accursed Venice, and he was there to take his flesh.\n\nİnönü had hoped to be stall the situation, but his illusions had proved as feeble as his promises of victory. Unrest was rising, the people were taking to the roads, and bond owners would soon start to ask where their money had gone. The saviour, the avenger, the new Atatürk? Forget about that: now the President was the one in need of a saviour, and he already knew that he would find none."
 tur.81.a:0 "The fate of Turkey has taken an entirely new route."
 tur.82.t:0 "The Unenviable Job"
 tur.82.d:0 "My fellow Turks, it is with a heavy heart that I..." No, that was too humiliating. "In an unfortunate twist of fate..." No, people would jump on him for trying to weasel out of responsibility. "Our heroic soldiers fought bravely, and yet..." \n\nAs Inonu looked over the various speech drafts that had been assembled for him, not a single one came without serious fault. Some were too ingratiating to the Italians, others too bellicose, some would be outright laughed at... But really, what could he say? The people were supposed to receive a glorious war and an enlarged Turkish state. What did they get instead? Defeat, humiliation, and dead sons. What words could he possibly say to smooth over that? More pertinently, what could he possibly say that might salvage his political career? \n\nStill, he couldn't just say nothing. Whether he liked it or not, he'd have to decide on a speech. The appointed time was only two weeks away, and to delay any further would only hurt the CHP's position even further. Somehow, some way, he had to salvage this."
 tur.82.a:0 "He had no other choice."
 tur.86.t:0 "inonu speech smile"
 tur.86.d:0 "[GetTUR_MtS_Paragraph_1]\n\n[GetTUR_MtS_Paragraph_2]\n\n[GetTUR_MtS_Paragraph_3]"
 tur.86.a:0 "what a great speech!!"
 tur.87.t:0 "The Kemalist Backlash"
 tur.87.d:0 "Losing a war never leaves a government in a stable position. Unfortunately for Inonu's CHP, vocal dissent has come even from the Kemalists- specifically a group of right-wing Kemalists disaffected with his leadership.\n\nIn a joint public statement, these rightist Kemalists have fiercely criticized the "ineffective and disastrous" leadership of Inonu over the CHP and Turkey, citing the recent military defeat against Italy as one of many examples of their dissatisfaction with Inonu.\n\nTo make a bad situation even worse for the CHP, this statement went on to denounce the party as a whole, instead offering an endorsement for the UDP. Whether these Kemalists are perfectly aligned with the ideological goals of the UDP or not, they have nevertheless called for voters to cast their ballots for the UDP in the coming election, rather than Inonu's "party of failure.""
 tur.87.a:0 "Damn them!"
 tur_87_tt:0 "Some £tur_CHP_U_texticon  §eCumhuriyet Halk Partisi (Ulusalcı)§! members of the Grand National Assembly will defect to the £tur_UDP_D_texticon  §JUlusal Demokrat Parti (Demokrat)§!."
 tur.88.t:0 "How Far Do We Go?"
 tur.88.d:0 "Unemployment has always been a problem, and likely always will be, but it has become especially important for the CHP to address it now. Though it has been decided that this will be handled via public works programs, the nature of these programs has yet to be decided. Two options have thus far presented themselves. \n\nOn the one hand, unemployment relief could be limited to a token effort. While this would have little effect on the problem itself, it would give the government an appearance of addressing unemployment without demanding too much from the budget. \n\nOn the other hand, a genuine and concerted effort could be made to combat unemployment. While this would be far more effective, it would also demand much more from the budget- perhaps more than could presently be spared. \n\nHowever far the government decides to go, however, it cannot be denied that something must be done- if not for the unemployed, then for the CHP's waning popularity."
 tur.88.a:0 "We must make a serious investment."
 tur.88.b:0 "A token effort is all we can afford."
 tur.89.t:0 "Relief for the Soldiers"
 tur.89.d:0 "İnönü's usual numbness to the pains of politics, both within and beyond the floors of the Grand National Assembly, had worn off with the coming of tragedy in the form of calamitous defeat, yet he remained calm. The military was unruly and officers grew rowdy, yet he remained undisturbed. The CHP's hold over the institutions of governance was crippled, yet tranquillity had not escaped him. Soon the Veterans' Pensions Bill will pass the floor, and he'll recoup his popularity. The officers will be tamed, the population will be soothed, and parliament will be tamed.\n\nEverthing was seemingly going as planned. The act was met with overwhelming support and his image as a man of the people, shattered in the flames of war, would be restored. Nobody could object to aiding the country's most treasured men, after all.\n\nSuddenly though, Behice Boran stood up and left the embrace of her leather chair. "Honoured representatives of the peoples of Turkey", she declared, "While I may wholeheartedly support this gesture towards our Veterans, it has become increasingly apparent that this flirtation towards ideas of common welfare is nothing but populistic drabble cooked up by a demagogue to appeal to a populace, who writhes in pain and suffer endlessly, by granting them mercy from ails that befall in the first place thanks to his hubris."\n\n"If the President had cared for the peoples of this land and more specifically on the men that toil away in the barracks of Turkey, then why did he start that disastrous kerfuffle of a war? Is there any logical reasoning beyond the ambitions of a man who is too wrapped up in his glory?" She stopped for a moment before she continued speaking, "I would like to restate once more that I completely support the Veterans' Pension Bill, in fact, I do not believe that it goes far enough. However, I simply cannot help but point out what is nothing but an obvious, insidious, self-serving ploy for İnönü to wrangle back what he had so callously lost."\n\nWhen Behice finally sat back in her representative's seat, İnönü's mind the question of whether or not even attempting to refute her baseless claims would be worth his time raced back forth in his mind."
 tur.89.a:0 ""Representative Boran, I would like to inform you...""
 tur.89.b:0 "Not even the press would pick up on these claims."
 tur.95.t:0 "A Night In Rhodes"
 tur.95.d:0 "Captain Selim looked out of his cockpit, alert to any sign of enemy presence. The war against the Italians had started a couple days before, and his would be the first aerial mission against the Dodecanese: three tactical bombers, screened by ten fighters - one of which was his own - had departed from Izmir and were inbound for Rhodes city in the dead of the night, to perform a bombing run against the old Medieval fortress; surely, such an action would have sunk the morale of the Italian defenders, paving the way for the land and sea invasion of the archipelago.\n\nThe combined squadron finally reached the former island, the few lights still on betraying no sign of activity. As the bombers separated to reach their targets, however, the calm was broken by a cacophony of sounds and lights: to Selim's horror, alarm sirens went off across the city, and searchlights immediately pointed to the sky, spotting his squadron. Then, the fortress came alight as dozens of anti-air guns dotting its walls filled the sky with high-explosive rounds.\n\nImmediately, the captain ordered to engage evasive manoeuvres, but what he saw then let him know that his mission had failed. The ancient fortress, from the Palace of the Grandmasters to the outer fortifications, had been filled with guns, with missile emplacements looking to the sea, and concentric layers of trenches and earth walls protecting the city from any land assault.\n\n"Enemy resistance is too heavy! Abort the mission!" Selim screamed in the radio, but it was too late.\n\nThe first bomber exploded as a missile hit the fuel tank, while the second and the third went down immediately after in a shower of quad-barreled shrapnel. Then, the fighters were picked off one by one: Selim was the fifth to be struck as he tried to flee, and the last thing he saw was the bastion he crashed into."
 tur.95.a:0 "Old stones still have teeth."
 tur.96.t:0 "Ships with Swastikas"
 tur.96.d:0 "Nuri woke up from his bed suddenly. The constant, loud noises from outside his villa would often disturb him from his sleep. He lived in Istanbul, on the coast of the Bosphorus, with tons of ships passing through it each day. Frankly, he was pissed, but the thing that irritated him most of all was that the ships passing through were not even Turkish, but German.\n\nNuri admired the Milli Şef, his contributions to the Turkish motherland, but Inonu caving into the German demands, really made him think twice. Germans have failed to fulfill their promises and even destroyed our lands, but still, they can freely pass through the Bosphorus straits that Ataturk got for us through the hardships and diplomatic maneuvers, and Inonu does nothing about it.\n\nHe got up and walked into his terrace, looking to the straits, there were a lot of big ships with swastikas. It was like a humiliation for the Turkish people, marching and passing through our straits with all of their pride. It made Nuri feel desperate, He couldn't do anything about them, Turkey can't do anything about them. Germans are a superpower who can invade Istanbul in a day, they can't collapse or fall into inner struggles. But one day, Nuri hoped, that the Kriegsmarine is forced not to pass through our straits, he was sick of seeing swastikas. He wanted to see only the mighty Turkish flag with blood-torn red color and its star and crescent."
 tur.96.a:0 "One day, we shall see you go..."
 tur.97.t:0 "Kriegsmarine, Get Out!"
 tur.97.d:0 "Pancarts flew across all of Istanbul. People were angry, and now they got the chance to get their revenge on the Germans who pressured and humiliated the Turkish people in the Varna Convention. Istanbul's people rallied to the Bosphorus, marching and protesting through all the streets. Whether left or right, no matter rich or poor, students, laborers, and the average citizen have entered arm in arm, shouting one sentence altogether, "Kriegsmarine get out!".\n\nThe cause of these protests were the parts of the German Black Sea Fleet, now away from their lost homeland, now docked in the straits of the Bosphorus. The arrogance of the Kriegsmarine shown by docking in Istanbul without paying anything, still demanding Turkey abides by the Varna Convention yet not having the power to enforce it has caused outrage within the population.\n\nThese protests, however, would only be the start of the crisis. A far-left student group tracked a Kriegsmarine captain while he was off-ship to meet with the government, and is now holding him hostage! The government as of yet has failed to locate these students, but they made their demands clear; abolition of the Varna Convention, and a refusal to let the Kriegsmarine dock in Istanbul.\n\nThe situation quickly escalated as the Kriegsmarine fell into chaos, Inonu and the state grew more and more concerned with the situation, and some people even tried to sabotage and harass the German ships! The Kriegsmarine retaliated with a threat to bomb Istanbul, prompting the police to intervene and stop the situation. Chaos surrounds all of Istanbul, with Germans and Turks alike awaiting Inonu's decision with bated breath."
 tur.97.a:0 "As they have come, so they will go."
 tur.98.t:0 "Dealing With the Crisis"
 tur.98.d:0 "Inonu's cabinet entered the meeting room, a cold mood surrounding each of them. The ministers were anxious, Inonu even more so. He had been up all night planning how to deal with the straits crisis, and now it was time for him to make a final decision.\n\n"So, to summarize the situation," Inonu started, "Part of the German Black Sea Fleet is now docked in Istanbul. It's likely that they plan to leave for Crimea, but their stay has caused protests, and some students, somehow, even managed to capture one of their captains. How we deal with this situation will greatly affect our relationship with the Germans, so I am expecting a quick and intelligent solution from you." Inonu gave the ministers across him an expectant look. It was clear he wanted this handled carefully.\n\nForeign Minister Feridun Cemal spoke up first. "Mr. Inonu: as you said, our ties with the Germans are too important to be sidelined for pride's sake. In the long term, it will hurt our economy if we sacrifice our foreign relations to appease the protestors. We should stick to the Varna Convention. Arrest the most problematic students, and send the German Fleet on their way to Cri-."\n\n"How can you say that!" Economic minister Melen cut in. "The problem is not our students, but the ships that can freely pass from the straits Ataturk gifted us!" Melen's rage was stopped by Inonu's glance. "We fought three world powers just to found our Republic, and we've just defeated the Italians too, we don't have to cave to German demands! I say we throw away the Varna Convention and militarize the straits. Germany is divided and weak, and we need to seize the opportunity while we can. It will be a boost for our economy and future policies, think of the long term."\n\nInonu nodded. "We cannot accept Minister Cemal's proposal, it will tarnish our newly gained reputation."\n\n"While I mostly agree with Melen," said Gursel, "we shouldn't go that far. We can't cave to the Germans, but we can't completely throw away our relations either. I suggest that we hold a conference with Karl Donitz, he can act as a 'legal representative of the Reich' in Germania's absence. That's the safest plan." Other ministers looked at each other, waiting for a response from Inonu."
 tur.98.a:0 "Gursel is right, a conference would be logical."
 tur.98.b:0 "I agree with Melen, let's show them our might!"
 tur.99.t:0 "Dealing With the Crisis"
 tur.99.d:0 "Inonu's cabinet entered the meeting room, a cold mood surrounding each of them. The ministers were anxious, Inonu even more so. He had been up all night planning how to deal with the straits crisis, and now it was time for him to make a final decision.\n\n"So, to summarize the situation," Inonu started, "Part of the German Black Sea Fleet is now docked in Istanbul. It's likely that they plan to leave for Crimea, but their stay has caused protests, and some students, somehow, even managed to capture one of their captains. How we deal with this situation will greatly affect our relationship with the Germans, so I am expecting a quick and intelligent solution from you." Inonu gave the ministers across him an expectant look. It was clear he wanted this handled carefully.\n\nForeign Minister Feridun Cemal spoke up first. "Mr. Inonu: as you said, our ties with the Germans are too important to be sidelined for pride's sake. In the long term, it will hurt our economy if we sacrifice our foreign relations to appease the protestors. We should stick to the Varna Convention. Arrest the most problematic students, and send the German Fleet on their way to Cri-."\n\n"How can you say that!" Economic minister Melen cut in. "The problem is not our students, but the ships that can freely pass from the straits Ataturk gifted us!" Melen's rage was stopped by Inonu's glance. "We fought three world powers just to found our Republic, we don't have to cave to German demands! I say we throw away the Varna Convention and militarize the straits. Germany is divided and weak, and we need to seize the opportunity while we can. It will be a boost for our economy and future policies, think of the long term."\n\nInonu looked at the clock, conflicted, he wanted this storm to pass before things get worse, both options could lead to a crisis.\n\n"While I mostly agree with Melen," said Gursel, "we shouldn't go that far. We can't cave to the Germans, but we can't completely throw away our relations either. I suggest that we hold a conference with Karl Donitz, he can act as a 'legal representative of the Reich' in Germania's absence. That's the safest plan." Other ministers looked at each other, waiting for a response from Inonu."
 tur.99.a:0 "We need to solve this pragmatically, Cemal."
 tur_99_a_tt:0 "§GWe will appease the Germans and keep the Varna Convention.§!"
 tur.99.b:0 "Gursel is right, a conference would be logical."
 tur_99_b_tt:0 "§YWe will request that Dönitz attend a conference to renegotiate the terms of the Varna Convention.§!"
 tur.99.c:0 "I agree with Melen, let's show them our might!"
 tur_99_c_tt:0 "§RWe will militarize the straits and abandon the Varna Convention.§!"
 tur.100.t:0 "Outrage Against the Government"
 tur.100.d:0 "In the hearts of the average folk, there is a sense of betrayal, the mighty Milli Şef, Ismet Inonu, has prioritized German interests over the freedom of Turkish people, and the people are enraged. And where there is spite, there is violence.\n\nThe initial protests were harsh, and they have only grown harsher, with the people seeing not just the Kriegsmarine, but the Turkish government itself as an enemy. Both the Ulusal Demokrat Parti and the Demokratik Yenileme Partisi have condemned Inonu and his government, while people from both left and right march together under the motto, "Against The German Puppets!". As the protests descended into violence, Gürsel had reluctantly ordered the army to intervene, hurting the army's relationship with the government too. The radical students that captured the captain have been found, but with pressure from both the army and the people, were released without charges, and are being hailed as heroes by many.\n\nInonu didn't even leave his house, he knew when he made the decision that the people would never accept this, but it had to be necessary. Now he could only sit down, and wait for the storm the pass..."
 tur.100.a:0 "Against The German Puppets!"
 tur.101.t:0 "Stranded in Istanbul"
 tur.101.d:0 "Dönitz was feeling uneasy; recent days have been rough for him. Far from home, trying to make a navy stand while also not angering the locals. But his greatest concern right now was that the many of his ships hadn't arrived on schedule.\n\n"Herr Dönitz!" shouted the young soldier, rushing to the Grand Admiral Dönitz's office in Theoderichshafen, instantly saluting him. "You have a message from the Turks.", the soldier handed him the letter, Dönitz made a gesture for the soldier to leave and began reading over the letter.\n\nIt was from the Inonu itself. The ships that failed to arrive were stranded on the Bosphorus, with protests ensuing the capture of one of his high-ranking captains. Thanks to these Turks, all of Donitz's plans were about to be thrown into chaos. All of his connections, schemes, and plans he had built up were threatened by these stuck-up Turks. Dönitz absolutely had to get those ships in Theoderichshafen.\n\nReading through the letter, Donitz was struck with a final disturbing surprise. Seeing him as the legal representative of the Reich in the absence of a de-jure Führer, the Turks were calling for a conference in Theoderichshafen. As much as Dönitz did not want to get involved with them, he had to do something.\n\nDönitz took his pencil and started to write."
 tur.101.a:0 "Mr. Inonu, We humbly accept..."
 tur.102.t:0 "Conference in Crimea"
 tur.102.d:0 "The sun was glowing over Theoderichshafen, but tensions were far too high to notice it. As President Inonu's ship was coming closer, Dönitz stepped down to the port to welcome him.\n\nThings went reasonably calm, as both Dönitz and İnönü did their best to show respect to each other, yet when all representatives entered the meeting room, things started to get heated.\n\n"Mr. Dönitz, and dear delegates, we wish for the Varna Convention's clauses to be revised. It is completely unfair for Turkey to give German fleets access through our straits without a single tariff. We don't propose for it to be removed completely, but we there should be at least some compensation." Turkish foreign minister, Feridun Cemal, explained the Turkish demands, while the Germans were unsure of Turkish demands, they were willing to give some concessions, as their ships were on the table.\n\nDönitz was expectant of how such requests would come, and sure enough they did. Dönitz knew he had no choice of negotiating further, it was tariffs or nothing. "We understand your request, and we are willing to make some changes, but currently the situation of our kidnapped captain is still unresolved." Dönitz was clear and determined about the situation. He wanted the captain back in Theoderichshafen quickly as possible.\n\nThe Turkish delegation was worried, days have passed and they still haven't found the kidnapped captain, the conference was going to a complete silence but İnönü took the lead.\n\n"We are still searching for him all across Istanbul, in the case we find him, or the radical students surrender to us, be sure that we will send him back to you immediately." Dönitz was not satisfied, but he smiled. Dönitz got what he wanted, his captain and ships, paying a little price won't hurt them too much.\n\n"As these matters consolidated, we can move on to signing the deal." Even still, neither delegation trusted the other, but at least the situation would soon be resolved."
 tur.102.a:0 "Peace always comes with a price."
 tur.103.t:0 "Showoff in the Straits"
 tur.103.d:0 ""İnönü and Melen made a speech! We no longer abide by the unfair treaty of Varna Convention!" Shouted the newspaper boy. Everyone was looking at the newspapers, shocked. İnönü and one of his ministers, Melen have announced the treaty that makes German ships pass the straits easily and without any compensation void. People were praising İnönü, they did not cave into the demands of Germans, but if that was so simple...\n\n"Theoderichshafen is silent, Melen. It's obvious that they are planning something. We must do something, or at least get ready." Cemal, Minister of Foreign Affairs, was very displeased by Melen and İnönü's decision.\n\n"Don't be naive, Cemal, they can't do anything strong, we all know their situation." Retaliated the economic minister Melen, "Think of the ships and their tariffs, Turkey will be richer."\n\nGürsel, who was in the chair, listening to their issues, finally spoke. "What about those students? Did they surrender the captain?"\n\nMelen and Cemal looked at each other, they both, quite frankly, had no idea. Just as they were about to change the topic, a messenger came into the room and handed the President a letter.\n\nThe students had surrendered the captain. This was a big victory for the CHP, the protests had calmed, and the situation was improving.\n\nBut of course, this did not mean the crisis was entirely over..."
 tur.103.a:0 "At least the protests are over..."
 tur.112.t:0 "Under the Red Sun"
 tur.112.d:0 "Mehmet, a villager native to the small town of Munzur, was born in 1911 to a farming family. Living most of his life working day in day out just to scrape by, he never felt at peace. Constantly under threat by the local landlords, government, and even sometimes raids by local terrorists, Mehmet lived his life in constant fear for his life and his family's safety. When a man from the Luminosity Movement came to Munzur in 1968, Mehmet had nothing to lose. Working for Luminosity in secret for nearly 3 years, Mehmet was dedicated to the cause. Most of his loved ones were long gone, the elders dead and the children moving away. Mehmet had his gun, a locket of his long-dead wife, and a black shepherd dog whom he loved.\n\nBy 1971, he had been living in the mountains near his hometown for almost a year now. He reflected on his life, and began writing a journal. The solitude of his situation made him reflect on mortality. He reflected on his younger days, and how the landlords took them from him. He reflected on the recent past, joining Luminosity, and how it changed his life. He had many theories, thoughts, and reflections, all collected in his journal. Perhaps that, along with his beloved dog, were the only things keeping him sane. When men from Luminosity came back and gave the orders to take up arms, Mehmet was ready.\n\nMehmet didn't see much fighting. He, along with 5 others, defended his town and prevented the government from reinstating their corrupt rule. He sat alone in his mountain outpost, scouting out for military units. When our revolution succeeded, it took 2 weeks for the news to get to him. He was conflicted.\n\nLuminosity had given him comradery, and while it may have been limited, he was certainly sad to see them leave. However, when he returned to his home, Munzur was changed. He came back to his house, saw the old photos of his family, his much too large bed. It took until the next morning for him to realize. When he harvested his grain, it struck him. No longer would the profits go to his corrupt landlord. He found himself with a sense of safety, with the terrorists having been rooted out. Mehmet was alone, but he was happy."
 tur.112.a:0 "The Sun shined an extra shade of red."
 tur.113.t:0 "sus"
 tur.113.d:0 "pov: you disbanded your army and now nobody can stop the greeks from stealing thrace from glorious turkiye"
 tur.113.a:0 "shame on you"
 tur.114.t:0 "[GetTUR_NichitoTooltipTitle]"
 TUR_TriumvirateBillThingy:0 "The Triumvirate's Vultures"
 TUR_NixonBillVirate:0 "The Nixon Bill"
 TUR_Nichitovirate:0 "Nichi-To Keizai Kyoryoku Kikin"
 tur.114.d:0 "Turkey's disastrous defeat in the recent Italo-Turkish War has left the nation and its people reeling. Faith in the present political establishment has been waning, with the once dominant CHP experiencing serious competition from other political parties, and even internal dissent. Furthermore, the nation's violent divestment from the Triumvirate has left its international future in limbo. At present, Turkey has no international benefactor, leaving the threat of German invasion an all too powerful one.\n\nYet in this environment, some have sensed an opportunity. Without the support of Italy and Iberia, Turkey is now looking for a new international benefactor. And without Triumvirate economic activity, the nation is in need of investors. These needs have only been exacerbated by the apparent show of weakness in the Italo-Turkish War, and all the losses that came from it. For better or worse, two powers are keen to fill the void.\n\nFrom the west, the United States has sensed an opportunity to get a foot under Germany's Iron Curtain around Europe. From the east, the Japanese Empire has likewise noted an opportunity to expand its influence further across Asia. Already diplomats, businessmen, and agents from both spheres have begun to travel to Turkey to begin pressing their nation's interests. To complicate matters, there are forces within Turkey itself that may favor one side over the other, and work to help or hinder the great powers as they squabble over the bruised nation.\n\nThough the prestige of the Turkish nation is perhaps long past, it will no doubt prove an important scene in the Cold War, if only as a stepping stone for the feuding great powers. Only time will tell which will secure Turkey for themselves."
 tur.114.a:0 "The vultures circle..."
 tur.114.b:0 "Get the congress, now!"
 tur.114.c:0 "Now's our chance!"
 tur.115.t:0 "The Yankee Vulture"
 tur.115.d:0 "The battle for Turkey is winding down, but it is already clear who the winner is. The United States, hegemon of the Western hemisphere and leader of the Organization of Free Nations, has successfully leveraged its power to bring Turkey into its sphere of influence. Whether it was by copious economic aid, shrewd guarantees, or simple espionage, the Americans have managed to snatch Turkey away from the eager talons of the Japanese Empire.\n\nThis victory is no small one for the OFN- ever since World War II and the fall of England, the United States and her allies have had no access to Europe beyond Iceland and its territorial waters.\n\nWith this triumph in Turkey, however, that has changed. Though Turkey exists at the periphery of Europe, it also occupies a strategic position compared to the Unity Pakt. Though it is not yet clear if the OFN will establish a military presence in Turkey, what is clear is that the nation is under OFN protection and aligned with its interests, which will no doubt make things harder for Germania.\n\nThe OFN is not the only beneficiary to this outcome, however. With this outcome, Turkey is now able to enjoy political and economic support from the United States and OFN, spelling an end to the international isolation Turkey seemed doomed to experience following the end of the Triumvirate. Not only is the nation now a little more safe from a much-feared German invasion, but a flood of American capital seems primed to result in economic growth for the nation as well.\n\nNew businesses seem to enter the nation daily, providing jobs, goods, and services to the people. At the same time, American cultural exports have begun to influence Turkish culture. While some may decry this as capitulation to foreign influence, few can deny that it is preferable to becoming a Reichskommissariat."
 tur.115.a:0 "America's back, baby!"
 tur.116.t:0 "The Japanese Vulture"
 tur.116.d:0 "The battle for Turkey is drawing to a close, and a clear victor stands triumphant. The Japanese Empire, master of Asia and the Pacific, has managed to draw Turkey into its sphere of influence. By hook or by crook, Japanese investment and activity has managed to win out, thus tearing Turkey away from the waiting talons of the Americans.\n\nThough the Japanese Empire established itself as an unrivaled power in the East in the aftermath of World War II, its power has thus far been prevented from extending further by the American and German spheres.\n\nWith this victory, that has changed. Through Turkey, the Co-Prosperity Sphere has gained a window to the west, from which they may finally peer into the Unity Pakt. Though Germania is no doubt nervous, there is little the ailing empire can do to respond at this moment.\n\nYet Japan has not been the only beneficiary of this development. Turkey, seemingly doomed to international isolation after the collapse of the Triumvirate, has instead found a new benefactor in the Japanese. Not only does Turkey now enjoy more security against potential German invasion, but it is also able to enjoy Japanese economic investment.\n\nWith new businesses entering the Turkish market, and particularly affordable Japanese electronics, there is little doubt the face of the nation is set to change in the coming years. While some express anger at the possibility of Japanese cultural and economic domination, most would agree that the present state of affairs beats out the alternative of the Nazi jackboot."
 tur.116.a:0 "The tiger stretches its claws."
 tur.117.t:0 "What If"
 tur.117.d:0 "Faithful. İnönü could almost laugh at the irony of it all. He would have, too, had he been an outside observer. But he wasn't. He was instead seeing nations reject Turkey's plea for help. Countries with governments he thought he could trust, turning their backs on them in their time of need. Iran and Iraq have refused to answer the so-called "Call The Faithful." Saudi Arabia hadn't even sent a reply. The only positive response he received, in fact, was Afghanistan. Fucking Afghanistan.\n\nLike many recent nights for İnönü, this too began with a bottle. Despite his aging lungs, drink after drink would wind up in his hands, fighting off the coughing fits that threatened to over take him. As he was finishing off his fourth drink (an excellent raki imported from Thrace directly to Korutürk) the rage directed at the Unfaithful began turning inward. While he himself was a devout Muslim, Inönü had always fought tooth and nail against his religion taking center stage in the government. If he hadn't done so, if he had embraced and fought for Islam and Turkey to be entwined, would he now be flanked by great warriors for this New Jihad? Everytime he referred to it as Jihad he had to stifle a laugh; this was simply propaganda. While he was a devout Muslim, he preferred to keep it as far away from the government as possible, only using it to garner sympathy from those who were supposed to be his allies. Maybe if he had made any sort of effort to show the importance of Islam...\n\nHis drunken mind began coming up with countless, impossible "maybe ifs..." Maybe if he had seen the betrayal coming. Maybe if İnönü had worked harder. Maybe if he had refused the Malta Conference. Maybe if Saka had... \n\nKorutürk watched as İnönü let out a laugh, before collapsing in a coughing fit."
 tur.117.a:0 "Another shot, another failure."
 tur.118.t:0 "The Heroic Lion"
 tur.118.d:0 "Alparslan Türkeş surveyed the detestable scene around him. One of İnönü's hapless officials spoke to an assembly of leaders of the DYP and UDP, speaking about ideas of Turkish unity and need for solidarity in the coming war. He fumed, watching each of the little snakes try and squirm from their commitment to the nation; Bayar's and Menderes' whining about the economy of Turkey, doubting if their country would be able to afford the fight. Boran complained that war with Italy was against the interests of the people. Like all her ilk, she deserved to be lined up against a wall and shot for her treasonous sympathies that did nothing but undermine the nation. Akyol was barely any better, whinging about nothing that even mattered.\n\nHe had enough of the traitors. He slammed his hand against the table, drawing all eyes to him. "I've listened to enough of your venom," he growled at the assembled parliamentarians. "Where is your pride? Where is your reverence for the sacrifices of our fathers and our grandfathers? Where is your support for the millions of Turkish people on Turkish soil, languishing under the thumb of Italian imperialists and scheming Greeks? Pathetic. All of you." He turned to the CHP man at the head of the table. "I, for one, stand with the state. I stand with the President. To hell with Italy! To hell with Greece! And if any Turk objects?""
 tur.118.a:0 "To hell with them!"
 tur.119.t:0 "A Letter from Washington"
 tur.119.d:0 "On certain days, the copyists, writers and university graduates that ran the Çankaya Palace's enormous correspondences department were treated with something special. Today was one such day. Not letters from Rome, or God-forbid the Kurdish Provinces, but from the world at large! Today was one such day, for before their tired eyes and eager hands lay a letter from Washington, written in President Nixon's own hand - and conspicuously lacking an official seal; A letter of friendship, from one statesman to another. Before the day's end, that letter rested opposite the President's mantelpiece, and he read it aloud to a small group of friends, voice brimming with pride.\n\n"As I looked over your own background, I find that yourself and I have much in common as leaders and as political men. At the very least, we both have lost elections as well as won some - though one of us has won a few more than the other.\n\nBut although we were born over 4,000 miles apart, in countries very different in background, we have something very much in common. We are devoted to the same ideals. We are devoted to peace in the world; we are devoted to the independence of nations; we are devoted to a system of government which provides a freedom of choice, a parliamentary system in your country and the system of government which we have here in the United States. That system of government may be harassed by the agents of tyranny, or violently assaulted by so-called radicals, but that system and the great monument of civilization it represents, stand firm nonetheless in Turkey, and across the oceans in the United States.\n\nWith that in mind, I send you and your nation my deepest regards in your struggle against Tyranny in the beaches of the Aegean, the deserts of Syria, and perhaps most importantly in the streets of Istanbul.""
 tur.119.a:0 "A toast to the President of the United States of America."
 tur.120.t:0 "Victory?"
 tur.120.d:0 "Millions of Citizens from all across the republic departed from their homes to their local voting booths to vote in what may just be the most decisive election in Turkish history. Now three of the most important men in the republic awaited the results.\n\nThe ageing Mili Sef sat patiently, sat in front of him was Commander of the Turkish Armed forces Cemal Gursel growing increasingly frustrated with the time, Bulent Ecevit circled around them and the room as a whole. The air was tense, and all three men felt uneasy, their stomachs ached with anxiety at the prospect of loss and defeat. One could not imagine the ridicule and humiliation that the heirs of Ataturk would receive had they lost an election in the republic they birthed and guided into prosperity and modernity.\n\nHowever, their worries would soon be cut short by the entrance of Inonu's secretary with an envelope in her hands that she would then hand over to Inonu. The Grandmarshal slipped the documents from their envelope, he began reading their contents and the frown on his face turned into a cheerful smile.\n\n"So what is it?" the party deputy and officer both uttered in unison. "The CHP has, against all the odds stacked against us, retained its majority in the Grand National Assembly."\n\nThe mood in the room would quickly shift as the stomachs of all three men eased and the pressure that laid on their chests was lifted." However, we should not just take this victory for granted, for it is just one victory out of the many struggles that face both the party and the people ahead. Instead, we must immediately start to plan the national recovery of our nation and show the people that we are not out of touch with them, that we are still worthy of the trust they have given us and that we haven't abdicated our responsibilities in the country. Ecevit, make all the preparations necessary for an extraordinary congress of the party.""
 tur.120.a:0 ""I will start on that immediately.""
 tur.121.t:0 "From the Ashes"
 tur.121.d:0 "It was a beautiful morning in Ankara, the sun shone onto the skyline, flowers of all colours bloomed throughout, and the air's scent was that of a perfume. Nevertheless, the streets remained empty of smiles, none showed enthusiasm for the wonderful day, not even those children that used to roam throughout and play in the streets were there. Yet one person would stand out from this sea of sorrow, strolling on the sidewalk in a blue suit and with a wide smile only covered by his bushy moustache.\n\nBulent Ecevit saw the faces of these very people, the details of their face were frozen by a lack of visible emotion, yet Ecevit could sense the despair in the hearts of these people. Betrayed by a government that prioritized war and conquest to its people, which already faced an economic slump and its consequences. However, the people remained trustful of the party of Ataturk, once again putting their faith in and vote for the party of the great Ataturk. Ecevit passed by closed shops, including an establishment he frequented with his peers, their doors sealed and with iron bars, would they be abandoned to time and never be reopened or would they one day be open for service again? Ecevit pondered the answers to his questions, yet he remained uncertain, he knew that the current conditions would not allow such an occurrence, change was necessary but would it come?\n\nEcevit called for a limousine and swiftly entered it, he sat next to the window hoping to see the beauty of Ankara on this fine morning  but all he saw was a blob of misery, vagrants and beggars dotting the streets, and the sight of families grieving had become most common.Kemalism must evolve past the needs of the old guard, to the needs of the people, of the working man and the starving poor. For Turkey to be healed and rejuvenated, for the CHP and the spirit of Ataturk to survive;the left of centre approach is a must. Ecevit was determined to be the man that would bring on that change and recover the nation from the ashes it lies in, and the party congress would prove invaluable to achieving that."
 tur.121.a:0 "Flowers may grow."
 tur.122.t:0 "The Inquisitor"
 tur.122.d:0 "The dawning sun shined through the glass windows, illuminating the dim interiors and casting a light on Nihat Erim who sat in a suit with his breakfast and morning tea. Nihat adjusted his glasses and grabbed the daily papers. He sipped his tea, and began flipping through the pages, thoroughly scanning each.\n\n"Protests, Protests, Protests"he read, with an intensifying anger as he scrolled through the news. How could these delinquents be allowed to cause such a mess? To humiliate the very foundations of the Turkish state?\n\nErim found no need to ponder this question, for they were all traitors, subversives;there could be no other conclusion. Whatever they called themselves, whether communist, socialist or separatist, they all desired one thing:to see turkey washed away from history. They wish to destroy kemalism, break the social fabric of Turkey and sow chaos and instability throughout the republic. A wish to see the average Turk living in constant fear of their life being jeopardized by bloodthirsty terrorists, to see honest men die, their crying spouses widowed, and their sobbing children orphaned.\n\nEcevit's cabal of imbeciles and their romantic calls for liberalization and "humanity, are nothing more than foolish populists using honeyed words to seduce the masses. It was borderline treason! A disaster in the making, one which must be stopped. For if they fail then the traitorous elements will prevail, shattering kemalism, the republic could fracture into shards, and with it bring suffering and indignity onto the Turks! \n\nAs the clock ticked once more, Nihat hastened his preparations to the party congress. He took a deep breath before stepping out the door and began his journey, knowing very well that he had to prevail."
 tur.122.a:0 "Or else the nation's very soul is at stake."
 tur.123.t:0 "Grand No More"
 tur.123.d:0 "The rays of the sun shone through the windows of Cankaya palace onto the elderly National Chief. He sat secluded in his office, alone from both his beloved wife and children. In total harmony with himself, assailed only by the noise of the wind that blew through the windows, and the irritating and ever frequent coughs that struck him.\n\nHe wiped the dust off the photo book in front of him, and grabbed a photo of him when he had first joined the army, serving under the Caliph and the Unionists; those days were certainly not the peak of his life, but how could he not miss the youthfulness of his old days. Then he glanced at another photo, it was of him during the national campaign, days of endless struggle and conflict all for the motherland. He thought back onto his days with Mustafa Kemal, days of progress, modernization, liberty, and a renaissance of the Turkish spirit and people.\n\nInonu loved the days of Ataturk, and he made sure to follow in his footsteps. He only continued what Ataturk began: science, democracy, innovation, and liberation all were trademarks of Ataturk's thesis, and Inonu made sure to fulfil them. Inonu looked back onto the 40s, he remembered his wisdom and energy, how he had initiated a second National Campaign and struck into the territories occupied by imperialists, liberating the Turkish people in a continual of the struggle Ataturk had birthed. Where was this jovial hero now?\n\nThe sickly Grandmarshal knew exactly how to answer this question, yet he did not desire to. He had become a shell of his former self, riddled by a crippling pain in his abdomen and lungs and a storm of coughs that would unleash itself onto him. He ridiculed himself in public with his gaffes of dementia. He was no longer the man who was capable of freeing the Turks, but a ghostly silhouette that could barely fight one more war, and even then he did not liberate lands but instead saw them stripped from the Republic's possession. The endless politicking and the hidden struggles of administration had taken a toll on him. As Inonu coughed up a pile of phlegm, he began thinking that perhaps his time was over as a statesman, perhaps the torch of leadership should be handed from him to another."
 tur.123.a:0 "Could a nation survive without its chief?"
 tur.124.t:0 "23th Emergency Meeting of CHP"
 tur.124.d:0 "Party delegates from across the republic flood into Ankara in attendance of the extraordinary National Congress of the Republican People's Party. Party-men rushing to enter were crammed and stood shoulder to shoulder in the entrance hall, awaiting their entry. As the crowds seated themselves chattering would be heard, and faces once submerged in the sea of people would emerge, those of Bulent Ecevit, Nihat Erim and even what seemed to be a clique of officers were seen. The chattering of the masses would be cut as the withered Inonu spoke his first words.\n\n"Honourable men and women of the party, we come here not to celebrate our recent electoral victory but to discuss our national future. The republic has been through strenuous trials and tribulations, immense pain has been inflicted onto our people and our pride has been wounded. Our soldiers martyred all for nought as our treasured lands were lost, our nation was betrayed by our dearest allies and our dignity shattered. Our economy left in shambles and our sovereignty compromised. Yet the people did not give up hope in the party of the independence struggle, they maintained in us their ever-valuable trust, they maintained the hope that we would bring salvation in their darkest hour, saving the nation from humiliation and disgrace. We must not falter in this promise, for the very ideals our nation was founded upon, the dreams and principles of Ataturk, lay at stake." The entire chamber would erupt into applause and the sounds of clapping would ring throughout.\n\nAll matters would be discussed from the most menial to the most urgent. Whether they be local issues or national plagues, the issues would be thoroughly discussed, debated on and then voted on. Civility would be shown by most, while some would still devolve into anger and needless argument on the most menial of matters. Showing Cracks in a party only held together by its devotion to the ideals of Ataturk."
 tur.124.a:0 "Turkey depends on them."
 tur.125.t:0 "The Storm Must Pass"
 tur.125.d:0 "The debates on the seemingly infinite issues that plagued the Party and more importantly the republic and nation as a whole, would continue without an end in sight. Discussions veering into the Byzantine mess of affairs that the party found itself in would end with either the air ripe with palpable tension, as discord rings in the Chamber, or they pass smoothly with the harmonic symphony of the participants echoing throughout the halls of the conference hall. And yet the congress has not faced an issue as perplexing as the one it currently does.\n\nTurkey is in a quagmire, there can be no denial of it. Corruption has become ever the more commonplace, as black markets fester and hide under the noses of uncaring officials. The once sporadic scene of mobs and gangs is now increasingly visible throughout the once serene streets and walkways of Turkey, with thugs terrorizing the innocent, robbing them of their valuables, even butchering them in cold blood. Protests grow as discontent and instability simmers, and it seems that there may not be a way out of this without cracking down heavily on the tumours that ail the republic.\n\nHowever the police are simply not in any condition to fulfil their duties, untrained, unqualified and rotten to its core, a reliance on the derelict organs of the police force could prove disastrous. With erratic behaviour connected to Talat Aydemir's secretive "Young Colonels Movement" growing frequent, and their shadowy throngs looming threateningly over the people's sovereignty;the military is too untrustworthy at the current moment to be deployed into the country. This peculiar situation leaves the republican guard as the only institution in any position for emergency deployment.\n\nWith tensions boiling, and the Republic threatened by the increasing veer into instability, the party-men are left with no other choice but to deploy the guard to reign in order and stability. The heckling of argument fades into a faux silence as the congressmen vote and the proposal passes."
 tur.125.a:0 "No matter the cost."
 tur.126.t:0 "He Who Runs on Fume"
 tur.126.d:0 "placeholder"
 tur.126.a:0 "placeholder"
 tur.6666.t:0 "Operation: Karaboga"
 tur.6666.d:0 "The International community is in shock today, as the infamous Karaboga Division of the Turkish Empire has sacked Rome during their advance across the incumbent Empire of the Mediterranean. From the smattering of Italian Refugees and devastated Roman Divisions which managed to escape the city, reports and interviews have revealed that the city is currently being sacked, not unlike Constantinople so many years ago, or similar to Nanjing in the East Asian war.\n\nWhile many international observers have declared their disgust of the acts committed, leaked by rogue reporters scattered throughout the city, there has been nearly no real pushback against Turkey. Many believe this to be the case due to Turkey's rising prominence on the world stage, much to the chagrin of Germany, Japan, and America.\n\nOne of the most interesting details about this occupation is the flight of Ahmet Ali Çelikten, the world's first black pilot, who fought for Ottoman Empire and Turkey for his whole life.\n\nAs the cultural center of the Mediterranean is pillaged, many former members of the Triumvirate have considered supporting Italy, if not outright intervening. Iberia in particular has voiced great interest in "countering Turkish expansionism". However, as the raiders to the Eternal city loot and plunder, it would seem the will of the Karaboga has been exacted on Rome, as Italy tries to figure out how to react to such a disaster."
 tur.6666.a:0 "Was the Levante not enough?"
