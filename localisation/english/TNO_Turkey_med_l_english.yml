 TUR_Drums_of_War_stage1:0 "Drums of War"
 TNO_TUR_DoW_info_tt:0 "§gThe §RDrums of War§! represent the fervor of our people against the §nItalian menace§!, as well as the popular perception of the cost of the war. Very publicized victories- §Mvaliant defenses§!, §Hlightning victories§!, §nliberated territories§!- will §Gstrengthen the people's conviction in the war§!, while §Rmounting casualties will weaken their faith§!. While unlikely, it is possible to §Rwin the war at a price not worth paying§! by suffering too many casualties- though the costs would still be nowhere near §Vthe price of defeat§!.\n\nSuccess with the §RDrums of War§! and a fervent population will result in §Gsigificant bonuses§! to our combat abilities during the Second Italo-Turkish War, while §Rfailure will make continued conquests even less likely§!. Additionally, the §RDrums of War§! will heavily impact the political scene of Turkey. Victory will ensure the §rnationalists'§! faith in §Vthe CHP§!, while unrest will shatter that faith (to the benefit of the §SUDP§!) and strenthen §cthe antiwar left§! (benefitting the §BDYP§!).\n\nall of the above is contribloc\n\nnotes\n-DoW represents fervor and "the cost of the war"\n-high DoW means everyone agrees it was worth it\n-low DoW means people don't think it was worth it\n-note that this doesn't actually impact whether you win or lose, and the *massive* bonuses or penalties present in that- just longer term domestic unrest\n-it goes up when you do things like burn down athens on live tv\n-it goes down every like 8000 casualties, pretty linearly\n-a unpopular victory makes it harder for the CHP in the long term\n-a \"popular defeat\" (rare) mitigates a ton of CHP victory loss and is best for getting the non-Inonu CHP path§!"
