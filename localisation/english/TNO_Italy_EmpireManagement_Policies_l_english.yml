# Montenegro
ITA_EmpireManagement_Montenegro_Policy_1_name:0 "Regio Esercito Garrisons"
ITA_EmpireManagement_Montenegro_Policy_1_desc:0 "Montenegro is a mountainous and rough country, and trying to control all of it has proved a fool's errand. In order to keep the country adequately stable, our best option is to focus on controlling the major towns and roads with strategically placed Italian garrisons, while leaving the rest of the country to the partisans. It may not be the best option, but at least it is logistically feasible."
ITA_EmpireManagement_Montenegro_Policy_1_special_action_tt:0 "§YMake Examples§!\n--------------\nAlthough it's unlikely we'll dislodge the partisans from their mountain hideouts any time soon, we can still send them a message. Occupying a village known for harboring bandits and deporting the population will deprive our enemies of a strategic resource, and it will also scare any civilians who may consider helping the partisans into thinking twice before they act. Of course, there's always a chance this doesn't go as planned...\n\n§YEffects:§!\n§WFor six months:§!\n  §G+10 Control§!\n  §R-5 Exploitation§!\n§OChance of falied raid.§!\n\n§YCost:§!\nThis action has no cost."

ITA_EmpireManagement_Montenegro_Policy_2_name:0 "The Montenegrin National Army"
ITA_EmpireManagement_Montenegro_Policy_2_desc:0 "Little more than a gang of roving chetniks and mercenaries, the Montenegrin National Army led by Pavle Đurišić has regardless proven remarkably useful against partisans in the past. They may be untrustworthy, opportunisiatic and self-serving, but giving them free reign over Montenegro is the best way to avoid wasting money and manpower in some remote Balkan valley."
ITA_EmpireManagement_Montenegro_Policy_2_special_action_tt:0 "§YContacts into Serbia§!\n--------------\nThe Montenegrin chetniks still have some friends in the Serbian collaborator government, and friends of our friends can be our friends too. We can ask Đurišić's men to arrange an espionage network to steal intelligence about German activities in Serbia: it's going to cost us, but it may be useful in putting a dent in Germania's Balkan fortress.\n\n§YEffects:§!\n[SER.GetFlag] Serbia: §G+20 Favour§!\n\n§YCost:§!\n£dollar_sign 300 Million"

ITA_EmpireManagement_Montenegro_Policy_3_name:0 "Bet on the Prince"
ITA_EmpireManagement_Montenegro_Policy_3_desc:0 "Prince Nikola's ascent and continued permanence on the Montenegrin throne can be viewed as a strange accident of history, and yet it is one that may prove useful to us. Perhaps the prince can after all be the unifying figure that Montenegro needs, if we were to just support him as he needs."
ITA_EmpireManagement_Montenegro_Policy_3_special_action_tt:0 "§YRenew Agricultural Loans§!\n--------------\nThe food situation in Montenegro has been complicated ever since Italy seized the port of Cattaro, the main avenue through which the country imported grain and other necessary supplies. By offering such supplies at very low prices, to be paid in time, we can significantly improve the livelihood of the country.\n\n§YEffects:§!\n§WAfter six months:§!\n  §WPermanent§! §G+5 Control§!\n  §WPermanent§! §G+5 Exploitation§!\n\n§YCost:§!\n£dollar_sign 200 Million"

ITA_EmpireManagement_Montenegro_Policy_4_name:0 ""
