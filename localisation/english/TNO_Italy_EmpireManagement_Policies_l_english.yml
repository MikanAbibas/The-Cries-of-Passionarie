# Aksum (UNUSED)
ITA_EmpireManagement_Aksum_Policy_1_name:0 "No Quarter for Rebels"
ITA_EmpireManagement_Aksum_Policy_1_desc:0 "The Amhara population of this region despise us, and we should not be afraid to show a firm hand in dealing with insubordination and sedition. Any man found carrying weapons will be summarily executed, and harsh reprisals will be enacted against villages known to harbor rebels."
ITA_EmpireManagement_Aksum_Policy_1_special_action_tt:0 "§YExpedition into Goggiam§!\n--------------\nThe mountainous area of Goggiam has always been a nest for rebels and bandits. By leading a punitive expedition in the region, deporting the population and scorching the land, we will teach them to fear the righteous anger of our Empire: however, we should be careful, as there's always the chance of things not going as planned...\n\n§YEffects:§!\n§YChance of:§!\n  §WFor one year:§!\n    §G+15 Exploitation§!\n    §G+15 Control§!\n§YIf failed:§!\n  §R-10 Control§!\n\n§YCost:§!\n£dollar_sign 100 Million\n£weapon_icon 500\n£manpower_icon 500"

ITA_EmpireManagement_Aksum_Policy_2_name:0 "Accomodations with the Mesafint"
ITA_EmpireManagement_Aksum_Policy_2_desc:0 "The local Ethiopian aristocracy has often formed the backbone of the rebel organizations, but after decades of fighting they have been decimated and tired out. They should be encouraged to switch sides, as they may be still of some use to us in helping placate their fellow colonial subjects."
ITA_EmpireManagement_Aksum_Policy_2_special_action_tt:0 "§YAmnesty for Surrender§!\n--------------\nMany of the Ethiopian bandits are rightfully terrified of our authority, and only keep fighting because they knew they'd be executed if they turned themselves in to us. By promising a pardon to anyone willing to lay down their weapons and surrender, we may draw some of the rebels out of the mountains and into our custody\n\n§YEffects:§!\n§WFor one year:§!\n  §G+5 Control§!\n\n§YCost:§!\nThis action has no cost."

ITA_EmpireManagement_Aksum_Policy_3_name:0 "Encroaching on the Mountains"
ITA_EmpireManagement_Aksum_Policy_3_desc:0 "The factor that allowed Amharan rebels to elude us is the critical lack of infrastructure suitable to quickly move our men and supplies across the region. By slowly and methodically focusing on strangling the rebels with military roads and checkpoints, we will sooner or later manage to end the resistance once and for all."
ITA_EmpireManagement_Aksum_Policy_3_special_action_tt:0 "§YSeize the Valleys§!\n--------------\nA drastic solution to improve our control of the country would be to relocate the population in fortified and easily accessible villages in the valleys, starving out bandits of the support they need. However, in the short term, this will be a severely unpopular decision, further fomenting seditious activity among the population.\n\n§YEffects:§!\n§WFor one year:§!\n  §R-20 Control§!\n§WAfter that:§!\n  §G+20 Control§!\n\n§YCost:§!\n£dollar_sign 100 Million\n£weapon_icon 500\n£manpower_icon 500"

ITA_EmpireManagement_Aksum_Policy_4_name:0 "Encourage Italian Settlers"
ITA_EmpireManagement_Aksum_Policy_4_desc:0 "Ethiopia, the most important asset in our colonial Empire, already counts a sizable Italian community, though most of them are either bureaucrats, soldiers or contract workers. The time has come to encourage permanent settlers like how things are in Eritrea and Somalia: a burgeoning middle class, and farming settlements scattered throughout strategic areas, will allow us to more easily access and exploit Ethiopia's resources."
ITA_EmpireManagement_Aksum_Policy_4_special_action_tt:0 "§YBuild Modern Infrastructure§!\n--------------\nWith several towns already under construction, and thousands of colonists inhabiting them, it is now time to create a coherent infrastructure system on the model of the one we are building in the mainland. Roads, railroads and airports will not only improve the life of both settlers and locals, but will also allow us to quickly deploy troops in case of disorders, therefore permanently increasing our hold over the region.\n\n§YEffects:§!\n§G+5 Control§!\n§WFor six months:§!\n  §G+10 Exploitation§!\n\n§YCost:§!\n£dollar_sign 100 Million"

ITA_EmpireManagement_Aksum_Policy_5_name:0 "Improve Native Conditions"
ITA_EmpireManagement_Aksum_Policy_5_desc:0 "As part of our reforms to stabilize the Empire, we'll focus our efforts on improving local conditions to at least a fraction of the average Italian settlers. Far from being a generous action, this will allow us to reduce unrest in the short run, and open the road for profitable endeavours in the long run: a non-hostile native is a productive native, after all..."
ITA_EmpireManagement_Aksum_Policy_5_special_action_tt:0 "§YEncourage Economic Development§!\n--------------\nOur efforts on providing the natives better living conditions and education now allow us to properly turn Ethiopia into a productive part of our Empire. By encouraging Italian enterprises to open factories and subsidiaries in the Pearl of East Africa, the natives will get a honest job and humane living conditions, while we'll get a nice boost to our industrial output at a fraction of the cost for the skilled manpower: everyone profits, especially us...\n\n§YEffects:§!\n§G+5 Exploitation§!\n§WFor six months:§!\n  §G+10 Control§!\n\n§YCost:§!\n£dollar_sign 100 Million"

ITA_EmpireManagement_Aksum_Policy_10_name:0 "Reform the Administration"
ITA_EmpireManagement_Aksum_Policy_10_desc:0 "The East African administration is a quagmire of corruption, mismanagement and disloyalty. Viceroy Amadeo has often tried to change the situation, but Ciano's damned policy of sending the dregs in exile there prevented any meaningful improvement: now the time has come to radically reform the administration, ensuring a fair and competent rule for both Italians and natives."
ITA_EmpireManagement_Aksum_Policy_10_special_action_tt:0 "§YGrant Exceptional Funds to the Viceroy§!\n--------------\nViceroy Amadeo of Savoy is the best face for Italian rule we could ever find. Loyal, competent and fair to the population, he is respected by Italians and natives alike. By granting him more funds to enact his proposed reforms, we can improve the difficult living conditions for the locals, while at the same time strengthening our control over the region.\n\n§YEffects:§!\n§G+2 Control§!\n§G+1 Exploitation§!\n\n§YCost:§!\n£dollar_sign 100 Million\n£political_power_texticon 5"

# Ethiopia
ITA_EmpireManagement_Ethiopia_Policy_1_name:0 "Benign Neglect"
ITA_EmpireManagement_Ethiopia_Policy_1_desc:0 "The region of Galla and Harar is vast, geographically rough, and to a large degree unexplored, while the local majority Oromo population is relatively loyal to us. The best option may be to simply focus our economic and military efforts elsewhere for now, letting the tribal peoples of the inland largely govern themselves."
ITA_EmpireManagement_Ethiopia_Policy_1_special_action_tt:0 "§YScientific Expeditions§!\n--------------\nThe wilderness of southwestern Ethiopia is home to numerous tribes of savage Africans, largely untouched by civilization. Setting up ethnographic and geographic expeditions would be a good way to acquire prestige in the eyes of the international scientific community, and there's a chance we may find something actually valuable.\n\n§YEffects:§!\n§Y25% chance of:§!\n  §WFor one year:§!\n    §G+10 Exploitation§!\n\n§YCost:§!\n£dollar_sign 400 Million"

ITA_EmpireManagement_Ethiopia_Policy_2_name:0 "Integrate the Oromo"
ITA_EmpireManagement_Ethiopia_Policy_2_desc:0 "The Oromo population of this region has long suffered under the yoke of imperial Ethiopian aristocracy; that is why it was easy to convince them to join us in the fight against the Negus, or at least stay neutral. By focusing our efforts in making the Oromo loyal subjects we could finally manage to take hold of the whole region."
ITA_EmpireManagement_Ethiopia_Policy_2_special_action_tt:0 "§YStoke Ethnic Conflict§!\n--------------\nAll empires have been victorious through the application of the old Roman maxim: divide and conquer. By inciting ethnic and religious hatred against the Amhara, former exploiters who held the whole of Abyissinia under thralldom, we shall have an easier time bringing the region under our control.\n\n§YEffects:§!\n§WFor one year:§!\n  §G+15 Exploitation§!\n  §R-10 Control§!\n\n§YCost:§!\n£dollar_sign 250 Million"

ITA_EmpireManagement_Ethiopia_Policy_3_name:0 "Mining Prospects"
ITA_EmpireManagement_Ethiopia_Policy_3_desc:0 "It turns out that the remote hills and mountains in this region are rich in precious metals and gems. Obviously, these resources should be tapped, conscripting native labour is necessary: any disruption to the livelihoods and society of the natives is a side effect we needn't worry about."
ITA_EmpireManagement_Ethiopia_Policy_3_special_action_tt:0 "§YGold Rush!§!\n--------------\nNormally, we would exploit the local resources through state-ran businesses, but it would be much cheaper and faster to contract out the land to private prospectors and settlers, taxing their mining profits. This will create a land rush, bringing a vast influx of settlers and adventurers into the region: it may have unforeseen consequences...\n\n§YEffects:§!\n§WFor three years:§!\n  §GSteady supply of monthly income.§!\n  §R-5 Control§! per year.\n\n§YCost:§!\nThis action has no cost."
ITA_EM_SpecialAction_Ethiopia_3_EffectIdea:0 "Gold Rush!"

