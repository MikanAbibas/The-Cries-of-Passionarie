## Empire Management ##
# Policies #

## Internal
# Libya
ITA_EmpireManagement_Libya_Policy_1_name:0 "Maintain order in the South"
ITA_EmpireManagement_Libya_Policy_1_desc:0 "Southern Libya is a desertic, depopulated area dotted by oil fields and extraction plants. While we decide our next course of action, a sensible policy is to guarantee that ENI operations run smoothly: increasing patrols and aerial reconnaissance missions should make sure no Tuareg thinks about defying us."
ITA_EmpireManagement_Libya_Policy_1_special_action_tt:0 "Organize Counter-Terrorism Sweeps§!\n--------------\nDespite the recent crushing of Idris's revolt, many guerrillas remain active in the region, merely waiting for an opportunity to resurrect their dead dream. A thorough sweep of our anti-terrorism units will ensure that no such thing can happen in the short term.\n\n§YEffects:§!\n§G+4 Controll§!\n§WFor six months:§!\n  §G+20 Exploitation§!\n\n§YCost:§!\n1500 £weapon_icon Infantry equipment\n50 £support_eq_texticon Support equipment\n80 £motorized_texticon Motorized"
ITA_EmpireManagement_SpecialAction_Libya_1_Effect:0 "Counter-Terrorism sweep in Libya"

ITA_EmpireManagement_Libya_Policy_2_name:0 ""
ITA_EmpireManagement_Libya_Policy_2_desc:0 ""
ITA_EmpireManagement_Libya_Policy_2_special_action_tt:0 ""

ITA_EmpireManagement_Libya_Policy_3_name:0 "Focus on oil extraction"
ITA_EmpireManagement_Libya_Policy_3_desc:0 "Libyan oil fields are not only rich, but also close to home, which makes them a strategically-vital asset to our fuel supply strategy in case of a crisis. By expanding the already-present extraction and refining facilities, and improving the security, we'll surely be able to profit greatly from the rich oil fields."
ITA_EmpireManagement_Libya_Policy_3_special_action_tt:0 "§YExpand ENI infrastructure§!\n--------------\nWith the new facilities extracting oil at an unprecedented rate, the time has come to expand the pipeline web spanning Libya. Of course, the project will include several "incentives" to tuareg tribes to make them digest the sight of a giant pipe running through their beloved dunes...\n\n§YEffects:§!\n§G+2 Control§!\n§G+6 Exploitation§!\n\n§YCost:§!\n£dollar_sign 100 Million"

ITA_EmpireManagement_Libya_Policy_4_name:0 "Enact fascist emancipation projects"
ITA_EmpireManagement_Libya_Policy_4_desc:0 "The time has come to enact the Duce's agenda in the colonies. Large economic subsidies will be granted in order to improve the natives' conditions, from school access to wages and irrigation projects: this will be coupled with a massive propaganda effort aimed at spreading fascism among the locals - including the opening of native-oriented PNF branches in the desert towns - and encouraging better relationships between them and the Italian immigrants. Of course, we do not expect things to improve immediately, or even substantially, but we play the long game: in the end, we'll be able to slowly mend the rift, and create an Empire for everyone - Ciano crushed Idris, now we shall make sure that any memory of both disappears through a careful application of propaganda, reform, and repression."
ITA_EmpireManagement_Libya_Policy_4_special_action_tt:0 "§YNative economic initiative§!\n--------------\nAs our reforms take roots, the time has come to advance our plans. While we cannot create an equal society in a decade, we can still lay the seeds: as such, we shall accept natives at Tripoli's agricultural middle school, and once they have learned how to cultivate the land, they'll be granted an initial capital to build new farms and irrigation plants in the desert oases, slowly expanding Southern Libya's economy and bringing a seed of prosperity to everyone. If it is to truly last, the Empire does not need slaves: instead, it needs willing citizens, workers and soldiers - the fact that more sedentary nomads will result in less raiding along the oil ducts is an added benefit.\n\n§YEffects:§!\n§G+8 Exploitation§!\n§G+3 Control§!\nWe will be able to enact this policy again in §Y1 year§!\n\n§YCost:§!\n£dollar_sign 150 Million\n£political_power_texticon 20"
ITA_EM_SpecialAction_Libya_4_EffectIdea:0 "Native economic initiative in Libya"

ITA_EmpireManagement_Libya_Policy_5_name:0 "Encourage Italian migration"
ITA_EmpireManagement_Libya_Policy_5_desc:0 "While Northern Libya has already been Italianised, the desertic interior is still practically depopulated, with Tuareg tribes constantly migrating and raiding oil pipelines for profit or out of spite. By building Italian towns near oil extraction sites, we should be able to not only tip the demographic balance in our favor, but also to discourage the nomads from attacking the facilities: fast patrols and CCTV networks will do the rest."
ITA_EmpireManagement_Libya_Policy_5_special_action_tt:0 "§YExpand ENI infrastructure§!\n--------------\nWith the infrastructure secured, the time has come to expand it. New refineries and expanded pipeline network will increase our profits, while additional patrols and deterrent measures will ensure the nomads never again try to repeat Idris's mistake: if they do, however, we are always ready to teach them another lesson in humility...\n\n§YEffects:§!\n§+2 Control§!\n§G+4 Exploitation§!\n\n§YCost:§!\n£dollar_sign 80 Million"

ITA_EmpireManagement_Libya_Policy_6_name:0 "Focus on oil extraction"
ITA_EmpireManagement_Libya_Policy_6_desc:0 "Libya's only usefulness lies in its vast oil reserves. For the good of the Empire, we shall tap them in full, and turn them to our exclusive utility: extraction must proceed unimpeded, and any act of sabotage will be answered with full retaliation - as the ancients used to say, children can, and will pay for the sins of their fathers."
ITA_EmpireManagement_Libya_Policy_6_special_action_tt:0 "§YExpand refining facilities§!\n--------------\nTripoli and Bengasi are home to the most important refineries in Libya, as well as the necessary infrastructure to ship it around the world. With the need for oil greater than ever, and the Caucasus fields severely damaged by turmoil in Germany, we can profit greatly from expanding operations: increasing work quotas for the natives will also serve the purpose, as long as security is kept tight enough via appropriate application of force.\n\n§YEffects:§!\n§R-2 Control§!\n§G+8 Exploitation§!\n\n§YCost:§!\n£dollar_sign 60 Million"

