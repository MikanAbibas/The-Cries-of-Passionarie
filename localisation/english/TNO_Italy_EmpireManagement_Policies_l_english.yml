ITA_EmpireManagement_SouthSudan_Policy_1_special_action_tt:0 "§YOrganize Counter-Terrorism Sweep§!\n--------------\nIn order to improve Egyptian control over the region, and protect our East African possessions from terrorist infiltration, we shall organise a joint counter-terrorism sweep with local security forces. OVRA and SIM agents will pinpoint the locations of insurgent forces, while air strikes and commandos will annihilate them, improving the situation for a while.\n\n§YEffects:§!\n§G+3 Control§!\n§WFor six months:§!\n  §G+10 Control§!\n  §G+10 Dependency§!\n\n§YCost:§!\n1500 £weapon_icon Infantry equipment\n50 £support_eq_texticon Support equipment\n80 £motorized_texticon Motorized"

