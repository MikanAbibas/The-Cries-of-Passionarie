# Albania
ITA_EmpireManagement_Albania_Policy_1_name:0 "The Puppet Party"
ITA_EmpireManagement_Albania_Policy_1_desc:0 "In order to effectively govern Albania, we need to employ the services of the PFSh, the local fascist party we set up in the 1930s. While many Albanians resent them for their gross corruption and clear subservience to Italy, they are the most politically viable option to bear most of the daily tasks of government."
ITA_EmpireManagement_Albania_Policy_1_special_action_tt:0 "§YExpand the MFSh§!\n--------------\nThe Albanian Fascist Militia, or MFSh, is the closest thing to a proper gendarmerie that we have allowed Albania to maintain. While their discipline and loyalty are poor to say the least, they are good enough to keep a semblance of order in the streets, and any Albanian that is enlisted in the MFSh is an Albanian that can't join the bandits or the partisans.\n\n§YEffects:§!\n§WFor six months:§!\n  §G+10 Control§!\n  §R-10 Exploitation§!\n\n§YCost:§!\n£dollar_sign 100 Million\n£weapon_icon 500"

ITA_EmpireManagement_Albania_Policy_2_name:0 "The Viceroy's Own Kingdom"
ITA_EmpireManagement_Albania_Policy_2_desc:0 "The official head of state of Albania is the Italian king, represented in the country by the General Lieutenant, de facto a local viceroy. His powers are extensive and we should reinforce them, in order to ensure that the country is ran according to Italy's interests and that disorder and banditry are contained to the rural areas."
ITA_EmpireManagement_Albania_Policy_2_special_action_tt:0 "§YRenew Colonization Efforts§!\n--------------\nSince we turned Albania into our protectorate small communities of Italian have emigrated to the country, both ethnic Italians and Arbereshe. With most of them working as farmers or in the oil industry, encouraging economic investment in the form of colonists is the fastest way to improve the sorry state of the Albanian finances.\n\n§YEffects:§!\n§WFor six months:§!\n  §G+10 Exploitation§!\n  §R-10 Control§!\n\n§YCost:§!\n£dollar_sign 100 Million\n£manpower_icon 500"

ITA_EmpireManagement_Albania_Policy_3_name:0 "Economic Liberalization"
ITA_EmpireManagement_Albania_Policy_3_desc:0 "Our economic policy in Albania has been predatory in nature for the past 25 years. The dignitaries and landowners we appointed to lead the country pleaded with us to let them have more say in economic matters, with hopes that an economic upturn will eventually help in pacifying the country."
ITA_EmpireManagement_Albania_Policy_3_special_action_tt:0 "§YENI Investment§!\n--------------\nSo far, much of the profits from Albanian oil have left the country to enter Italian coffers, financing our ever hungry imperial machine. If we were to allow a part of those profits to remain in Albania, in the forms of investments in infrastructure and productions, we could reap the benefits down the line.\n\n§YEffects:§!\n§WFor one year:§!\n  §R-20 Exploitation§!\n  §YInfrastructure§! construction cost in Albania: §G-30%§!\n\n§YCost:§!\n£dollar_sign 150 Million"
ITA_EM_SpecialAction_Albania_3_EffectIdea:0 "ENI Investment"

