# Bulgaria
ITA_EmpireManagement_Bulgaria_Policy_1_name:0 "Our Friend Tsar Boris"
ITA_EmpireManagement_Bulgaria_Policy_1_desc:0 "Tsar Boris is a dear friend of Italy, an ally on whom we can depend no matter the problems which face us. Perhaps we should make this more evident to our public."
ITA_EmpireManagement_Bulgaria_Policy_1_special_action_tt:0 "§YA Dinner of Emperors§!\n--------------\nA dinner of two of the preeminent monarchs of the mediterranean? What is not to love? If we happen to work out some mutually beneficial arrangements then so much the better.\n\n§YEffects:§!\n§G+25 Control§!\n\n§YCost:§!\n£dollar_sign 10 Million\n£political_power_texticon 25"

ITA_EmpireManagement_Bulgaria_Policy_2_name:0 "Mutual Interests in Anatolia"
ITA_EmpireManagement_Bulgaria_Policy_2_desc:0 "Certain mutual realities exist in our and the Bulgarian foreign policy. Certain realities concerning the Turks. Why not capitalise on that for our own benefit?"
ITA_EmpireManagement_Bulgaria_Policy_2_special_action_tt:0 "§YBorder Forts in Thrace§!\n--------------\nBulgaria would normally oppose increased fortifications in the Greek portion of Thrace. Normally. Perhaps we can convince them they would benefit from the arrangement.\n\n§YEffects:§!\n§G+10 Exploitation§!\nSeveral §Yforts§! will be built on the Greek side of the Turkish border.\n\n§YCost:§!\nThis action has no cost."

ITA_EmpireManagement_Bulgaria_Policy_3_name:0 "The Sofia-Rome Pact"
ITA_EmpireManagement_Bulgaria_Policy_3_desc:0 "With Bulgaria now in our sphere unofficially, it is time to seal the deal. Bind them to us, now and forever."
ITA_EmpireManagement_Bulgaria_Policy_3_special_action_tt:0 "§YSealing the Deal§!\n--------------\nTrade and investment, is that not a worthy thing to build a friendship on? Well maybe not friendship exactly, but we could certainly stand to gain from increased trade. Best to ensure the Bulgarians know this.\n\n§YEffects:§!\n£dollar_sign §G+500 Million §!\n§R-10 Exploitation§!\n\n§YCost:§!\n£political_power_texticon 75"

