# Sudan
ITA_EmpireManagement_Sudan_Policy_1_name:0 "Subsidize Local Security Forces"
ITA_EmpireManagement_Sudan_Policy_1_desc:0 "Sudan is a deeply-divided region, formally owned by Egypt but sporting a diverse - and explosive - ethnic composition. The locals resent Egyptian rule, considering it exploitative, and often rise against the central government of Cairo: while the future of the region remains uncertain, the best we can do is granting more funds and equipment to Egyptian police and army units so that the region remains under their - and therefore our - control."
ITA_EmpireManagement_Sudan_Policy_1_special_action_tt:0 "§YOrganize Counter-Terrorism Sweep§!\n--------------\nIn order to improve Egyptian control over the region, and protect our East African possessions from terrorist infiltration, we shall organise a joint counter-terrorism sweep with local security forces. OVRA and SIM agents will pinpoint the locations of insurgent forces, while air strikes and commandos will annihilate them, improving the situation for a while.\n\n§YEffects:§!\n§G+3 Control§!\n§WFor six months:§!\n  §G+10 Control§!\n  §G+10 Dependency§!\n\n§YCost:§!\n1500 £weapon_icon Infantry equipment\n50 £support_eq_texticon Support equipment\n80 £motorized_texticon Motorized"
ITA_EmpireManagement_SpecialAction_Sudan_1_Effect:0 "Counter-Terrorism Sweep in Sudan"

ITA_EmpireManagement_Sudan_Policy_2_name:0 ""
ITA_EmpireManagement_Sudan_Policy_2_desc:0 ""
ITA_EmpireManagement_Sudan_Policy_2_special_action_tt:0 ""

ITA_EmpireManagement_Sudan_Policy_3_name:0 "Embed SIM Agents"
ITA_EmpireManagement_Sudan_Policy_3_desc:0 "Sudan is a hotbed of anti-Egyptian resistance. As the stability of the monarchy in Cairo is of paramount importance for our interests in the region, we should make sure that no threats come from Sudan: as such, we shall begin forming SIM cells across the region, with a web of local informants warning us of any possible threat to local authorities - something the Egyptian government will surely thank us for..."
ITA_EmpireManagement_Sudan_Policy_3_special_action_tt:0 "§YExchange Information for Favor§!\n--------------\nWith our web of informants active across the region, we have come in possession of several... interesting bits of information our Egyptian friends would undoubtedly appreciate. Of course, nothing comes free in this cruel world: surely, the lives and security of the local government officials and garrison soldiers are worth a few favors and concessions to trustworthy friends such as ourselves...\n\n§YEffects:§!\n§G+2 Dependency§!\n§WFor six months:§!\n  §G+15 Control§!\n  §G+35 Dependency§!\n\n§YCost:§!\n£political_power_texticon 60"
ITA_EmpireManagement_SpecialAction_Sudan_3_Effect:0 "Information for Favors in Sudan"

ITA_EmpireManagement_Sudan_Policy_4_name:0 "Grant Economic Subsidies"
ITA_EmpireManagement_Sudan_Policy_4_desc:0 "As it is now, Sudan is a poor, undeveloped land rife with ethnic and religious tensions. Such a situation is a natural breeding ground for terrorist organisations which could easily threaten the stability of our Egyptian ally. By mediating between the two sides, and offering subsidies to local economic activities, the situation should slowly improve, allowing our allies to assert a stronger authority over the region, and for us to profit from the economic expansion."
ITA_EmpireManagement_Sudan_Policy_4_special_action_tt:0 "§YExpand the Gezira Scheme§!\n--------------\nThe Gezira scheme is the largest irrigation network in the world. Began by the British during their time as rulers of Sudan, it is mostly located in the central part of the region: by funding its expansion, we should be able to both fight famine, give more work to the locals, and bring them to our side, which will surely improve the situation for our Egyptian allies - who will surely remember this when the time is right...\n\n§YEffects:§!\n§G+2 Control§!\n§G+6 Dependency§!\n\n§YCost:§!\n£dollar_sign 100 Million"
ITA_EmpireManagement_SpecialAction_Sudan_4_Effect:0 "Expanding the Gezira Scheme in Sudan"

ITA_EmpireManagement_Sudan_Policy_5_name:0 "Reinforce Ethnic Order"
ITA_EmpireManagement_Sudan_Policy_5_desc:0 "Sudan is inhabited by local ethnicities, with an Egyptian minority occupying all positions of power within the region. While they are all inferior to us, of course, we should help the central government in reinforcing this racial hierarchy: this will grant us the double boon of endearing us to our Egyptian puppet, and reinforcing their - and therefore our - control over the region."
ITA_EmpireManagement_Sudan_Policy_5_special_action_tt:0 "§YSponsor Migration Policies§!\n--------------\nLibya and Eritrea are practically Italianised, and this resulted in making native uprisings much more difficult. Encouraging the Egyptian government to follow our example, and subsidise the migration of Egyptians from the North to Sudan, will surely improve the situation: of course, the IRI will gladly offer to receive the tenders for the new towns and needed infrastructure...\n\n§YEffects:§!\nG+2 Control§!\nG+2 Dependency§!\n§WFor six months:§!\n §G+10 Control§!\n\n\n§YCost:§!\n£political_power_tooltip 40\n£dollar_sign 100 Million"
ITA_EmpireManagement_SpecialAction_Sudan_5_Effect:0 "Reinforcing Ethnic Order in Sudan"

ITA_EmpireManagement_Sudan_Policy_6_name:0 "Expand Economic Activities"
ITA_EmpireManagement_Sudan_Policy_6_desc:0 "Sudan is a land of many opportunities... for us, that is. With lots of arable land due to the Gezira Scheme, Sudan offers great agricultural potential at a fraction of normal cost: by signing treaties between IRI and the Egyptian government, we can expand our activities there, and exploit the local resources - and population - for the good of the Empire."
ITA_EmpireManagement_Sudan_Policy_6_special_action_tt:0 "§YFocus on Cotton Cultivation§!!\n--------------\nOriginally, the Gezira Scheme was envisioned as a way to produce enough cereals to feed the growing Sudanese position. Of course, wheat and barley do not provide the least amount of profit, which is why we shall lobby the Egyptian government to focus on cotton cultivation: in exchange of modern equipment and know-how, the Egyptians will grant us a large share of the profits - and they can always import wheat from Italy, of course.\n\n§YEffects:§!\n§R-4 Control§!\n§G+8 Dependency§!\n§WFor six months:§!\n §G+20 Dependency§!\n\n§YCost:§!\n\n£dollar_sign 100 Million"
ITA_EmpireManagement_SpecialAction_Sudan_6_Effect:0 "Focusing on Cotton Cultivation in Sudan"

