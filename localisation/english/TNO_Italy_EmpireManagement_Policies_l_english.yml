# Eritrea
ITA_EmpireManagement_Eritrea_Policy_1_name:0 "The Red Sea Lifeline"
ITA_EmpireManagement_Eritrea_Policy_1_desc:0 "Ever since the 1800s, Eritrea was valuable to us as a connection to Indian Ocean trade. Now that our link to the Atlantic has been cut, the importance of such a connection has only grown more vital. We shall make efforts to expand and improve the port of Assab, turning it into a keystone of transoceanic shipping."
ITA_EmpireManagement_Eritrea_Policy_1_special_action_tt:0 "§YNew Urban Plans§!\n--------------\nWith the economic situation in Assab on the upswing, we should consider expanding the city to provide for cheaper housing for Italian labourers and drive out the natives from their slums. Bulldozing smelly African huts and building new, fascist style homes will help turn Assab into an Italian holdout in the heart of Africa.\n\n§YEffects:§!\n§WFor six months:§!\n  §G+10 Exploitation§!\nAssab's §YInfrastructure§! and §YShipyards§! will be expanded.\n\n§YCost:§!\n£dollar_sign 400 Million"

ITA_EmpireManagement_Eritrea_Policy_2_name:0 "Highlands Agriculture"
ITA_EmpireManagement_Eritrea_Policy_2_desc:0 "The Eritrean highlands host valuable, fertile land which we promptly seized off the local tribes when we expanded into the area, turning the native into indentured labourers for Italian landowners. This created a significant absentee landlord class of Italian colonists, which led to much of the land becoming unproductive and inefficient. We should redouble efforts to modernize agriculture in the highlands by encouraging Italian farmers to move into the unoccupied lands, which should also help us make sure Ethiopian partisans can't cross over into Eritrea."
ITA_EmpireManagement_Eritrea_Policy_2_special_action_tt:0 "§YFIAT in Asmara§!\n--------------\nImproving agricultural development in Eritrea means that there's going to be a spike in demand in tractors, trucks, and any other mechanical equipment a farmer may need for his toil. This is a perfect occasion to expand FIAT plants in Asmara, allowing us to also exploit cheap native labour to produce goods at very convenient prices.\n\n§YEffects:§!\n§WFor six months:§!\n  §R-20 Control§!\n§G+3§! £tt_prod_unit Production Units\n\n§YCost:§!\n£dollar_sign 900 Million"
ITA_EM_SpecialAction_Eritrea_2_EffectIdea_Permanent:0 "FIAT in Asmara"

ITA_EmpireManagement_Eritrea_Policy_3_name:0 "Loyalty Pays"
ITA_EmpireManagement_Eritrea_Policy_3_desc:0 "The Eritrean Ascari have been invaluable in the arduous task of conquering and pacifying the vast expanses of East Africa. By further elevating their role in colonial society, we shall present Eritrea as a paragon of a model colony, as well as tie its population closer to us."
ITA_EmpireManagement_Eritrea_Policy_3_special_action_tt:0 "§YRecruitment Drive§!\n--------------\nEritrean Ascari aren't useful just in Africa: we can use them wherever we please, provided we can actually recruit enough. There are many young Eritreans willing to take up arms for us, although if we recruit too many we risk manpower shortages for civilian labour.\n\n§YEffects:§!\n§WPermanent§! §R-5 Exploitation§!\n§G+1000§! £manpower_texticon Manpower\n\n§YCost:§!\n£dollar_sign 300 Million"

