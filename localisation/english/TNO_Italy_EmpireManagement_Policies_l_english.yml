# Lebanon (UNUSED)
ITA_EmpireManagement_Lebanon_Policy_1_name:0 "Formalize Maronite Rule"
ITA_EmpireManagement_Lebanon_Policy_1_desc:0 "The collapse of French authority in the Mandate of Syria and its surrounds proved remarkably beneficial for us, not least because unlike some sections of our Empire, the region has an ample supply of willing collaborators. The christians of the near east remember Ottoman rule, and they've no desire to be under the authority of the current Turkish government."
ITA_EmpireManagement_Lebanon_Policy_1_special_action_tt:0 "§YFund Maronite Paramilitaries§!\n--------------\nSometimes biting the bullet is the best course of action. The paramilitary organisations of Lebanon have never been overly fond of our alliance with Turkey, and they might cause trouble if we refuse to work with them. But their existence can be turned to our advantage as well. Turkey often makes noises about our continued presence in the near east, and it might be worth ensuring we have armed local support on call in case of an emergency.\n\n§YEffects:§!\n§WFor six months:§!\n  §G+20 Exploitation§!\n  §R-5 Control§!\nForts will be built across Lebanon.\n\n§YCost:§!\n£weapon_icon 250§!\n£artillery_texticon 50§!\n£support_eq_texticon 50§!\n£motorized_texticon 50§!"

ITA_EmpireManagement_Lebanon_Policy_2_name:0 "Invest in Beirut"
ITA_EmpireManagement_Lebanon_Policy_2_desc:0 "Beirut is the beating heart of our economy in the Levant, and we should consider treating it as such. Turning the city from the unorganised huddle of shacks into a proper modern and Italian styled city will be hard work, but it promises to be extremely profitable in the long run."
ITA_EmpireManagement_Lebanon_Policy_2_special_action_tt:0 "§YExpand the Port§!\n--------------\nThe Port of Beirut is the closest thing we have to an entrepot for trade in the Orient. If Italy is to maintain influence in the region it must be expanded to handle the increased volume of cargo and persons. If it could be upgraded to handle naval vessels in an emergency, well that would just be a bonus.\n\n§YEffects:§!\n§WFor six months:§!\n  §G+10 Exploitation§!\n  §G+10 Control§!\nBeirut's §YInfrastructure§! and §YNaval Bases§! will be expanded.\n\n§YCost:§!\n£dollar_sign 200 Million"

ITA_EmpireManagement_Lebanon_Policy_3_name:0 "An Italian Presence"
ITA_EmpireManagement_Lebanon_Policy_3_desc:0 "Lebanon might not be in the grasp of Rome directly anymore, but there is no reason to abandon a good business opportunity just because of minor changes in geopolitical alignment. Business will continue in Beirut, or else."
ITA_EmpireManagement_Lebanon_Policy_3_special_action_tt:0 "§YA voice in the Assembly§!\n--------------\nThe good thing about the politicians of the world's poorer nations is that they tend to be amenable to working out favourable deals in return for seeing things our way. Lebanon is no exception, and with voices in all areas of governance it will be difficult for Beirut to break away from Rome entirely.\n\n§YEffects:§!\n§G+15 Control§!\n\n§YCost:§!\nThis action has no cost."

