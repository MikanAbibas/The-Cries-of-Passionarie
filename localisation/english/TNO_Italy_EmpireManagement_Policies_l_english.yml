# Somalia
ITA_EmpireManagement_Somalia_Policy_1_name:0 "Greater Somalian Nationalism"
ITA_EmpireManagement_Somalia_Policy_1_desc:0 "The creation of a Greater Somalia, unifying all-Somali speaking peoples under the Italian aegis, was one of the great achievements of Mussolini's colonial policy. We should exalt this sense of Somali unity under Italian protection, using such rhetoric to ensure the loyalty of the country's masses."
