# Gulf
ITA_EmpireManagement_Gulf_Policy_1_name:0 "The Nine Emirs"
ITA_EmpireManagement_Gulf_Policy_1_desc:0 "The Gulf is Italy's farthest colony, and any efficient administration has to rely, to a degree, on local rulers. The Gulf's territory is divided into nine emirates, and while we have always kept the emirs on a tight leash, giving them and their subjects a modicum of self rule is a solution that has saved us numerous headaches in the past."
ITA_EmpireManagement_Gulf_Policy_1_special_action_tt:0 "§YBuying Loyalty§!\n--------------\nThe local emirs might not be enthusiastic vassals of ours, but anything can be bought for the right price. Letting the emirs obtain a significant cut of the vast oil profits from the region will make them into pliable puppets, ensuring stability and development in the region, for a while.\n\n§YEffects:§!\n§WFor one year:§!\n  §G+10 Exploitation§!\n\n§YCost:§!\n£dollar_sign 500 Million"

ITA_EmpireManagement_Gulf_Policy_2_name:0 "The Unsinkable Battleship"
ITA_EmpireManagement_Gulf_Policy_2_desc:0 "The Gulf colony occupies a strategic location controlling the Straits of Hormuz, connecting the oil producing regions of Iraq, Arabia and Iran to the rest of the world. This makes the area a geopolitical keystone, especially considering that on the other side of the Gulf the Shah has been friendly with the Germans for a while. We should turn the Gulf into a major military staging area, even if the locals won't appreciate it."
ITA_EmpireManagement_Gulf_Policy_2_special_action_tt:0 "§YPower Projection§!\n--------------\nThe Gulf is situated in a prime location to dominate much of the Middle East: by building and expanding naval military infrastructure we can ensure that our military presence in the region becomes larger and more effective. While the costs would be great, it could be worth it in the long run.\n\n§YEffects:§!\n§WPermanent§! §R-5 Exploitation§!\n[IRQ.GetFlag] Iraq: §WPermanent§! §G+10 Favor§!\n[SAU.GetFlag] Saudi Arabia: §WPermanent§! §G+10 Favor§!\n[YEM.GetFlag] Yemen: §WPermanent§! §G+10 Controll§!\n[OMA.GetFlag] Oman: §WPermanent§! §G+10 Favor§!\n\n§YCost:§!\n£dollar_sign 800 Million"

ITA_EmpireManagement_Gulf_Policy_3_name:0 "An Oil Company With a Colony"
ITA_EmpireManagement_Gulf_Policy_3_desc:0 "ENI has always been a pillar of our empire, and its interests are especially prevalent in the oil-rich Gulf. By largely entrusting the colony to Mattei's men, we can ensure that every drop of oil is squeezed out of the soil, and that said oil copiously flows as the lifeblood of our empire."
ITA_EmpireManagement_Gulf_Policy_3_special_action_tt:0 "§YExtraordinary Labour Programs§!\n--------------\nThe numerous oil rigs, pipelines and refineries of ENI are always hungry for new labourers. By conscripting labourers from all the corners of our empire and building housing for them, we can ensure that the black gold keeps flowing smoothly and cheaply, even though this may cause public order problems.\n\n§YEffects:§!\n§WFor one year:§!\n  §R-10 Control§!\n  §G-50%§! cost for §Wincreasing ENI Presence§! in [IRQ.GetFlag] Iraq, [SAU.GetFlag] Saudi Arabia, [YEM.GetFlag] Yemen and [OMA.GetFlag] Oman.\n\n§YCost:§!\n£dollar_sign 300 Million"
ITA_EM_SpecialAction_Gulf_3_EffectIdea:0 "Extraordinary Labour Programs"

