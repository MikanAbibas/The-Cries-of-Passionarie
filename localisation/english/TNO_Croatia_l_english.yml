 #### Events ####
 cro.1.a:0 "The crown must not fall. We stand with the government."
 cro.1.b:0 "If the crown falls, we will rise with the Ustashe."
 cro.1.c:0 "If the crown falls, we will rise with the Partisans."
 cro.1.d:0 "The Italian-backed crown rests on a knife's edge, with the politically connected Ustashe on our right and the battlehardened partisans on our left. Should government control ever collapse, the country will be torn apart between the two, and we will be forced to throw our lot in with one of them.\n\nIt is wise to decide now where our true sympathies lie, so that if the worst comes to pass, we know which banner we will raise. This is no public proclamation — merely a quiet understanding within our inner circle.\n\nThis choice determines which faction we will lead should the government fall."
 cro.1.t:0 "Where Our Sympathies Lie"
 cro.2.a:0 "Duly noted."
 cro.2.d:0 "Taking down the Ustashe will be no easy feat, with potential sympathizers around every corner, keeping this operation under wraps is key. So far, we've drafted up a list of targets to take out in Zagreb that will hopefully lead us to the leadership of the Ustashe. If all goes well, we'll be more than able of putting Pavelic's legacy to bed."
 cro.2.t:0 "Smoking out the Rats"
 cro.3.a:0 "Declared, smoke the rats out!"
 cro.3.d:0 "The operation is a-go, however in order to provide a proper legal pretext for the operation will need to declare martial law in Zagreb. Not only will this be vital to providing us with proper legal justification for closing down Zagreb to prevent any would-be escapes or rescue attempts, it will also make for a good show of force for the population. In any event, our troops are ready to move in once given the order."
 cro.3.t:0 "Martial law in Zagreb"
 cro.4.a:0 "We can't stop now, give them whatever they need."
 cro.4.t:0 "The operation is a success!"
 cro.5.a:0 "The noose tightens."
 cro.5.d:0 "Our efforts have bore fruit, we have a credible lead on Juje Francetic's location, former Number Two to Pavelic and current leader of the Ustashe. While we never expected we'd find the man himself during the investigation, capturing him now would not just paralyze the Ustashe, but completely destroy it as an organization and capable fighting force. If we take out the Ustashe now, we'd be free to focus on Tito's partisans and completely break them as a fighting force too, finally stabilizing Croatia and allowing us to put our ambitions into motion!"
 cro.5.t:0 "Hunting the Snake"
 cro.6.a:0 "I'm popping out the champegne for this one!"
 cro.6.d:0 "It's over, we never expected this day would come, and so did he and look at where he is now. Our forces found Francetic in a safehouse just north of Zagreb, from the looks of things he was going to flee to German-aligned Hungary and reorganize the Ustashe there. Our forces caught him and his bodyguards by surprise, and he nearly got away if it wasn't for a stray mortar shell knocking out the Fiat he was getting into he would've succeeded.\n\nNo doubt this will be good for our internal stability, what remains of the Ustashe will be wiped out as we're putting out bounties for them and there are plenty of citizens willing to turn them in. Without the Ustashe biting at our ankles, the partisans won't be able to hide behind them and let them take the brunt of the beating. For now, we can rest and plan our next move, Tito is probably just as shocked as we are and even if he does make a move, he probably doesn't have the resources necessary to threaten us beyond his hideout in the mountains."
 cro.6.t:0 "The Black Legate is Dead"
 cro.7.a:0 "No Country for Old Reds."
 cro.7.d:0 "While the partisans are a capable fighting force, they aren't elusive. We know the identities of several collaborators, gun-runners, and deeply-involved sympathizers that would give us leads on bigger fish to fry. Dispersed throughout the country, word of their arrests would no doubt spread back to Tito quickly so we must be quick about this in order to gain the element of surprise. If things go according to plan, we'll have Tito in our sights in no time."
 cro.7.t:0 "Drawing Up Lists"
 cro.8.a:0 "The clock strikes half before Midnight."
 cro.8.d:0 "The operation went off without a hitch, and we've already acquired the names of locations of several partisan commanders and formations plus partisan safe-zones as they call them. Our troops are already combing through the countryside while scouting out the mountains in order to expand our operation there. Tito has becomr acustomed to our tricks after fighting for 20 years, but so have we, and he sure as hell won't be getting away this time."
 cro.8.t:0 "Hunting The Reds"
 cro.9.a:0 "Dead or alive, it doesn't matter, neutralize him!"
 cro.9.d:0 "Urgent news has arrived from the officers on the ground in the Bosnian mountains, Tito's been sighted! After engaging and unusually heavy concentration of partisans with the mountains near Banja Luka, our soldiers stumbled upon a fortified encampment nestled there complete with artillery pieces and anti-aircraft guns! One of our snipers spotted a man bearint Tito's likeness but failed to get a shot off at him, and eventually the partisans retreated but not before killing hundreds of our own men, burning the camp before they left.\n\nWe're getting closer to Tito without a doubt, and he knows this too. We've already ordered for the area to be flooded with men and to be locked down completely with 24/7 surveillance to prevent Tito or any other partisan leaders from escaping. We have never been closer to catching the man who has terrorized us for 20 years and we can't let him get away now."
 cro.9.t:0 "Tito Spotted!"
 cro.10.a:0 "History has once again shown us that there are no invincible armies."
 cro.10.d:0 "Our troops have just informed us that they've captured Andrija Hebrang, leader of the Croatian Communist Party and a major partisan leader alongside Tito! The rat was trying to breach our blockade under the cover of dark, probably to assist his Bolshevik master. Needless to say, our troops were more than able to destroy his formation and capture the rat himself after wounding him with a bullet to the leg. The Judeo-Bolshevik won't be assisting Tito anymore as we're interrogating him and have already arranged for him to be tried for his crimes against the Croatian people."
 cro.10.t:0 "Andrija Hebrang Captured!"
 cro.11.a:0 "The Spectre has been exorcised."
 cro.11.d:0 "Our operation against the partisans has been concluded, not for any effort on our part but the lack thereof. Since capturing and shooting Hebrang, partisan activity has dropped significantly, where once our troops in the Bosnian mountains would engage several partisan formations a day, now they only engage one or two. News on Tito has been similarly sparse, meaning he was either killed without identifying him or he broke through the cordon without our knowing of it.\n\nWhile this may be concerning and disappointing as we don't have a clear ID on Tito, it's still cause for celebration as the military capabilities of the partisans have been drastically reduced, and Hebrang's death has no doubt caused a significant drop in morale amongst them. Without the partisans bothering us in the countryside anymore, the rural bourgeoise have been brought over to our side as they no longer have to fear the possibility of their land getting razed by roving bands of partisans and our military will no longer have to be tied down chasing down little groups of partisans. Of course, the Ustashe still remain but such a significant show of force has probably intimidated them that their activity won't rise for the forseeable future. For now, we can rest knowing we have saved Croatia from those who would destroy it."
 cro.11.t:0 "The Trail Goes Cold"
 cro.100.a:0 "Croatia descends into chaos."
 cro.100.d:0 "Government control has collapsed. The Italian-backed regime can no longer hold the country together, and the long-suppressed forces of the Ustaše and the Partisans surge into the open."
 cro.100.t:0 "The Government Falls"
 cro.101.a:0 "Za dom — spremni!"
 cro.101.d:0 "With the government in ruins, the old Ustaše networks have seized Zagreb. Jure Francetić emerges from the shadows to proclaim a restored Independent State of Croatia.\n\nBut in the hills of Bosnia, Tito's partisans have raised the red flag — and Rome will not let its rebellious puppet slip away quietly."
 cro.101.t:0 "The Ustaše Return"
 cro.102.a:0 "The future is ours to build!"
 cro.102.d:0 "The partisans have swept down from the mountains and the red flag flies over Sarajevo. Tito proclaims a new Yugoslavia, free of the Italian yoke.\n\nBut the Ustaše still hold the Croatian heartland, and Rome is marshalling its legions to crush us before we can consolidate."
 cro.102.t:0 "The Revolution Triumphs"
 cro.103.a:0 "Let them come."
 cro.103.d:0 "Rome will not abide a fractured, rebellious Croatia on the Adriatic. The Regio Esercito mobilizes to crush both the Ustaše and the partisans and restore the puppet crown."
 cro.103.t:0 "The Roman Response"
 cro.110.a:0 "Za dom — spremni!"
 cro.110.d:0 "We have weathered the storm. Rome's legions could not break us, and the partisans lie defeated. The Ustaše banner flies once more over a Croatia that answers to no one."
 cro.110.t:0 "An Independent Croatia"
 cro.111.a:0 "Long live free Yugoslavia!"
 cro.111.d:0 "The partisans have triumphed. The Ustaše are crushed, the Italians have withdrawn, and the red flag flies from Zagreb to Sarajevo. From the ashes of the old order rises a new, unified Yugoslavia under Marshal Tito.\n\nOur capital and our cause return to Zagreb, and the world will know us as Yugoslavia once more."
 cro.111.t:0 "Yugoslavia Reborn"
 cro.112.a:0 "The crown endures."
 cro.112.d:0 "The revolt is over. Italian armour rolls through the rubble of Zagreb and Sarajevo, and the rebels — Ustaše and partisan alike — are scattered or in chains. Rome installs Zvonimir II upon the throne, and the Croatian puppet stumbles on under the watchful eyes of its masters."
 cro.112.t:0 "Order Restored"
 cro.113.a:0 "Let them have their ruins."
 cro.113.d:0 "Italy could not crush the revolt in time. With its armies bogged down and the world watching, Rome has chosen to cut its losses and withdraw from the Croatian quagmire."
 cro.113.t:0 "Rome Relents"
 cro.120.a:0 "Order prevails."
 cro.120.d:0 "Through patience, policing, and Italian steel, the government has strangled both conspiracies in their cribs. The crown survives — and Croatia's future will be decided in the palace, not the streets."
 cro.120.t:0 "The Crisis Ends"
 cro.121.a:0 "Our moment slipped away."
 cro.121.d:0 "The moment has passed. The government has weathered the storm, the conspiracies have withered, and the Italian-backed order stands unbroken."
 cro.121.t:0 "The State Endures"
 tomislav.1.a:0 "A regalia of chains."
 tomislav.1.d:0 "There are many things to be said about our King Tomislav, but independent is not one of them.\n\nInitially placed on the throne as a concession to Italy by the Ustashe, the death of Pavelic solidified Italian control over Italy via using King Tomislav as a hook to sink into Croatia. Unfortunately for us, King Tomislav is not a willing ruler. Placed on the throne of a nation he does not speak the language of, ruling over a people who hate him, and serving as a puppet king for Rome, our king is not all there mentally with his personal physician diagnosing him with clinical depression.\n\nKing Tomislav's unwillingess to rule is currently causing issues for our government, compounded by our own unwillingness to let him abdicate. Unless we can ease the king into truly wanting to rule Croatia or replacing him with someone else, we will have to bear with him for now."
 tomislav.1.t:0 "The Imprisoned King"
 tomislav.2.a:0 "Tell him to mind his own business!"
 tomislav.2.d:0 "The Ustashe government was one of the most brutal in all of Europe, there's no doubt about that. Entire villages of Serbs in Croatia and Bosnia became ghost towns under their reign, so much so that the previously substantial Serbian majority in Bosnia has been reduced to a small minority. Our King Tomislav shares no love for the Ustashe or the late Poglavnik, but for the sake of stability we must cover up these crimes.\n\nUnfortunately for us, King Tomislav wants to publicize them and our refusal to do so has been weighing heavily on him judging from the list of blood pressure and anti-depressant medications he takes. Unfortunately, there's not much we can do since acceeding to his demands would compromise our stability."
 tomislav.2.t:0 "Undesirable Facts"
 tomislav.3.a:0 "We got lucky this time."
 tomislav.3.d:0 "Shocking has just arrived our King Tomislav, he fled from his residence!\nAt around 1 past midnight when King Tomislav would go to bed, he fled from the royal residence into the countryside and it was only due to the keen eye of one of the royal guardsmen that they noticed him driving off! A wide search was conducted in conjuction with the local police force and the king was eventually found hiding in a field of wheat in his nightgown.\n\nTo call this embarassing would be an understatement, we've already prescribed him more anti-depressants to mentally sedate him, but there's no telling if he'll try doing something like this again so we've placed him under 24 hour surveillance just in-case. It's a miracle we were able to find him but anyone else did."
 tomislav.3.t:0 "King Tomislav Escapes!"

 #### Victory events ####
 cro.130.t:0 "The Serpent Beheaded"
 cro.130.d:0 "Sarajevo has fallen and the red rabble is broken. Tito's dream dies in the Bosnian hills — Croatia belongs to the Ustaše now, and no partisan will ever again whisper of Yugoslavia.\n\nBut the legions of Rome are already marshalling on the border. The true test is yet to come."
 cro.130.a:0 "Now for the Italians."
 cro.131.t:0 "Brotherhood and Unity"
 cro.131.d:0 "Zagreb is free. The Ustaše restoration is crushed, its butchers dead or fled, and from the ruins the partisans proclaim what twenty years of war could not extinguish — Yugoslavia.\n\nBut Rome will not let its Adriatic flank slip away without blood. The legions are coming."
 cro.131.a:0 "Let them come. We have beaten worse."
 cro.132.t:0 "The Independent State Endures"
 cro.132.d:0 "Against all expectation, Croatia has held. The Regio Esercito limps back across the border, bloodied and humiliated, and Rome washes its hands of the Balkan quagmire.\n\nThe Independent State of Croatia stands alone — sovereign, feared, and answering to no one."
 cro.132.a:0 "Za dom — spremni!"
 cro.133.t:0 "The Third Balkan Miracle"
 cro.133.d:0 "The mountains have swallowed another empire. Italy's legions could not dig the partisans out of the karst, and Rome has abandoned the war.\n\nFrom Zagreb to Sarajevo the red star rises — Yugoslavia lives, and it is free."
 cro.133.a:0 "Smrt fašizmu — sloboda narodu!"

 #### Succession choice ####
 cro.140.t:0 "The Question of the Crown"
 cro.140.d:0 "The crisis has passed, but General Ciglieri's regency was never meant to last. Zagreb must now decide what Croatia is to become: a kingdom restored under young Zvonimir, or a state ruled openly from the barracks under Italian supervision.\n\nRome is watching — but this time, the choice is ours."
 cro.140.a:0 "Crown Zvonimir II."
 cro.140.b:0 "The military government continues."
 cro.141.t:0 "The Fate of Croatia"
 cro.141.d:0 "The rebels are crushed and Croatia lies prostrate before Rome. There will be no more experiments with Croatian self-rule — the question is merely what mask the occupation shall wear: a pliant boy-king on a restored throne, or the naked authority of a military governor."
 cro.141.a:0 "Crown Zvonimir II — the monarchy is useful."
 cro.141.b:0 "Direct military rule. No more games."
 CRO_prince_path_tt:0 "§GThe Prince's path will be unlocked§! — Croatia moves toward a restored crown."
 CRO_lieutenant_path_tt:0 "§RThe Lieutenant's path will be unlocked§! — Croatia falls under open military rule."
 ustase.13.t:0 "A Petition From Zagreb"
 ustase.13.d:0 "The restored Independent State of Croatia formally petitions for membership in the Einheitspakt. With the civil war behind us and the Ustaše proven against Rome, acceptance is a formality — another dagger pointed at Italy's flank costs the Reich nothing."
 ustase.13.a:0 "A welcome addition."
 cro.150.t:0 "Brotherhood Accepted"
 cro.150.d:0 "Belgrade has said yes. The Serbian government, fraternal in creed and weary of standing alone, accepts unification. The federation grows — without a shot fired."
 cro.150.a:0 "Bratstvo i jedinstvo!"
 cro.151.t:0 "Belgrade Refuses"
 cro.151.d:0 "The Serbian government has rejected unification. Pride, fear, or foreign whispers — it hardly matters now. If they will not join as brothers, they will join as subjects."
 cro.151.a:0 "Then we march."

