 #### Ideas ####
 CRO_the_partisan_problem:0 "The Partisan Problem"
 CRO_the_partisan_problem_desc:0 "Since 1941, partisans have constantly harangued the Balkan governments set up by the victorious Axis powers. However, they refuse to die, and Tito continues to lead terrorists in a campaign against the legitimate government."
 CRO_serb_flight:0 "Serb Flight"
 CRO_serb_flight_desc:0 "After years of ethnic cleansing committed by the Ustaše government of the Poglavnik, Serbs have either been annihilated or forced into internal displacement in most parts of the nation.\n\nHowever, the few remaining Serbs have taken advantage of the government's inability to act and have decided to flee, leaving many villages abandoned and the economy ruined."
 CRO_italian_supervision:0 "Italian Supervision"
 CRO_italian_supervision_desc:0 "After the Poglavnik's death, the King Tomislav was forced to accept Italian supervision in an effort to end the brutality of Ustaše rule, as Ciano disapproved of it. As such, Croatia is now being closely watched by the Royal Army and the PNF itself, with Tomislav being little more than a puppet."
 CRO_legacy_of_the_ustase:0 "Legacy of the Ustaše"
 CRO_legacy_of_the_ustase_desc:0 "The Ustaše never went away. They remain as a powerful political movement, and even worse, they feel betrayed by their Italian masters. It is probable that they are working with our rival, Germany, to work against us."
 CRO_legacy_of_the_ustase2:0 "Legacy of the Ustaše"
 CRO_legacy_of_the_ustase2_desc:0 "The Ustaše never went away. They remain as a powerful political movement, and even worse, they feel betrayed by their Italian masters. It is probable that they are working with our rival, Germany, to work against us."
 CRO_legacy_of_the_ustase3:0 "Legacy of the Ustaše"
 CRO_legacy_of_the_ustase3_desc:0 "The Ustaše never went away. They remain as a powerful political movement, and even worse, they feel betrayed by their Italian masters. It is probable that they are working with our rival, Germany, to work against us."
 CRO_legacy_of_the_ustase4:0 "Legacy of the Ustaše"
 CRO_legacy_of_the_ustase4_desc:0 "The Ustaše never went away. They remain as a powerful political movement, and even worse, they feel betrayed by their Italian masters. It is probable that they are working with our rival, Germany, to work against us."
 CRO_german_funded_partisans:0 "German Funded Partisans"
 CRO_german_funded_partisans_desc:0 "The German gaze once again falls upon Yugoslavia but this time they would rather save their 'superior aryan blood' and let the peoples of the balkans fight it out amongst themselves. To accomplish this the Nazi scum is sending aid to the two biggest opposition groups: The Serbian Chetniks and the Croatian Ustaše. While those organizations despise each other it seems they remain blissfully unaware of their masters dealings with the other. "
