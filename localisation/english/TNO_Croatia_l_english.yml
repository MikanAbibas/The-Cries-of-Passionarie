 crocrisis.1.t:0 "The Poglavnik's Twilight"
 crocrisis.1.d:0 "Jure Francetić's health is failing, and Zagreb knows it. In the barracks of the Black Legion, in the quiet offices of the foreign ministry, in the camps that made the state's name a curse in every capital — three factions begin to move. The Old Guard rallies to the Poglavnik's anointed successor. Lorković and Vokić dust off the old plot, certain that only a normalized Croatia can survive the decade. And in the shadows, Maks Luburić counts his knives.\n\nThe Ustaše will choose their future within the year."
 crocrisis.1.a:0 "The knives come out."
 crocrisis.2.t:0 "The Black Council Convenes"
 crocrisis.2.d:0 "Behind locked doors in Zagreb, the surviving leadership of the movement gathers to settle the succession once and for all. The Old Guard, the moderates, and the Crusaders have spent a year poisoning wells, buying colonels, and burying rivals. Tonight, one faction leaves the room in power — the others may not leave at all."
 crocrisis.2.a:0 "The council decides."
 crocrisis.3.t:0 "The Old Guard Holds"
 crocrisis.3.d:0 "The Black Legion's colonels closed ranks at the decisive hour. The conspirators are arrested in their beds; Luburić's men are found floating in the Sava. Croatia remains what Francetić made it: a fortress of the faithful, unbroken and unrepentant. (skeleton — revise narrative)"
 crocrisis.3.a:0 "Za Dom — Spremni!"
 crocrisis.4.t:0 "The Conspirators' Triumph"
 crocrisis.4.d:0 "The plot that failed in '44 has succeeded at last. Lorković and Vokić move with surgical speed: the radio station, the barracks, the ministries. By dawn the Old Guard is finished and a new, quieter Croatia looks westward for the first time in a generation. (skeleton — revise narrative)"
 crocrisis.4.a:0 "A new course."
 crocrisis.5.t:0 "The Crusaders Rise"
 crocrisis.5.d:0 "The Butcher of Jasenovac has taken Zagreb. Luburić's Crusaders storm the council chamber before dawn; the moderates are shot as traitors, the Old Guard as cowards. What rises from the purge is no longer a state but a crusade — and the world will learn to fear it. (skeleton — revise narrative)"
 crocrisis.5.a:0 "Blood and faith."

