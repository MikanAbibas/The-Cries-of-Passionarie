 CRO_italian_power_display_text:0 "§OItalian Power:§! [?global.CRO_italian_power_display|%W0]"
 CRO_italian_power_category:0 "A More Equal Partnership"
 CRO_expel_italian_advisors:0 "Thank the Advisory Mission"
 CRO_expel_italian_advisors_desc:0 "Rome's advisors have served Croatia well — so well, in fact, that many of their duties can now pass to Croatian hands. See them off with full honours."
 CRO_croatian_officer_corps:0 "A Croatian Officer Corps"
 CRO_croatian_officer_corps_desc:0 "Croatian academy graduates are ready to stand beside — and gradually in place of — the Italian liaison officers."
 CRO_nationalize_italian_concerns:0 "Buy Out Italian Concerns"
 CRO_nationalize_italian_concerns_desc:0 "Negotiate the purchase of Italian-held shipyards, banks, and mines at a fair price. Rome will grumble at the loss — but between friends, business is business."
 CRO_gov_control_secure:0 "Government Control: §GSecure§!"
 CRO_gov_control_stable:0 "Government Control: §GStable§!"
 CRO_gov_control_strained:0 "Government Control: §YStrained§!"
 CRO_gov_control_collapsing:0 "Government Control: §RCollapsing§!"
 CRO_gov_control_coup_marker:0 "§B|§!"
 CRO_gov_control_coup_marker_tt:0 "§RCoup Threshold§!\nIf Government Control falls below §R25%§!, the Italian-backed government collapses and the country descends into civil war."
 CRO_government_control:0 "Struggle For Croatia"
 CRO_government_control_desc:0 "Since the inception of the Independent State of Croatia, the nation of the Croats has been a battleground for ideological enemies and foreign governments alike. \n\nCroatia at present is de facto controlled by an Italian military government ruling with the cooperation of some local officials. However, the Ustase remain at large and are strongly backed by Germany. They wish to reestablish their control over the nation, return to the German sphere, and fulfill their visions of a pure Croatia. \n\nThe Communist Party Partisans led by Josip Broz Tito fight on even still, without significant outside support. Tito and his comrades wish to reestablish Yugoslavia under a socialist government and to free the former Yugoslav territories once and for all. \n\nShould the Croatian government retain control, then containing and destroying these rebels will be more than possible. However, should the government fail to protect its hold, then the Croatian nation will almost certainly fall into bloody civil war."
 CRO_government_control_decay:0 "The Fraying State"
 CRO_government_control_decay_desc:0 "With a false crown and a government heeding the words of Rome more than the people it governs, Croatia is rapidly falling into anarchy."
 CRO_strengthen_government:0 "Strengthen the Government"
 CRO_strengthen_government_desc:0 "Crack down, reward loyalists, and project authority to shore up the regime.\n\nRaises §GGovernment Control§! by 10."
 CRO_request_italian_support:0 "Request Italian Support"
 CRO_request_italian_support_desc:0 "Appeal to Rome to back the Zagreb government. The Italians will help, but at the price of deeper dependence.\n\nRaises §GGovernment Control§! by 8 and increases §RItalian Influence§!."
 ITA_croatia_management:0 "Croatian Affairs"
 ITA_prop_up_zagreb:0 "Prop Up the Zagreb Government"
 ITA_prop_up_zagreb_desc:0 "Send funds, advisors, and a show of force to keep our Croatian client stable.\n\nRaises Croatia's §GGovernment Control§! by 12."
 CRO_ustase_ready_tt:0 "§RThe Ustaše are armed and waiting§! — when the government falls, the movement will seize Croatia in overwhelming strength."
 CRO_partisans_ready_tt:0 "§RThe partisans are ready to rise§! — when the government falls, Tito's rising will be far stronger."
 CRO_gov_control_change_tt:0 "§YGovernment Control: [?CRO_gov_control_change|+0]§!"
 CRO_hold_out_against_rome:0 "Hold Out Against Rome"
 CRO_hold_out_against_rome_desc:0 "Rome is determined to crush our restored state. If we survive without capitulating for §Y180 days§!, the world will have no choice but to accept an independent Croatia."
 CRO_titotangle:0 "Leadership Struggle"
 CRO_consolidate_leadership_desc:0 "The struggle is over. Whichever faction holds the balance will take command of the new Yugoslavia and set its course — unlocking their path on the focus tree."
 CRO_state_endures_category:0 "The Crisis"
 CRO_the_state_endures:0 "The State Endures"
 CRO_the_state_endures_desc:0 "The government still stands. If we cannot bring it down before order is restored, our moment will pass — and the crown will survive."

