 ITA_CRO_inf_10_per:0 "§Y10% will be added from the influence.§!"
 cro4.d:0 "We've apprehended several Ustashe members and found several hideouts within the city, and are currently interrogating them as we speak. However, not all is well and good; The information we've acquired will need us to divert resources from the fight against Tito and his partisans in order to pursue those leads. In any event, giving up now would allow the Ustashe to recover and reorganize and ensure this whole operation was for naught."
 CRO_italian_power_change_tt:0 "§OItalian Power: [?CRO_italian_power_change|+1]§!"
 BOS_partisan_war:0 "The Partisan War"
 BOS_partisan_war_desc:0 "We have fought in these mountains for twenty years. If we endure §Y180 more days§! without capitulating, the dream of a free Yugoslavia will become reality."
 ITA_crush_the_revolt:0 "Crush the Croatian Revolt"
 ITA_crush_the_revolt_desc:0 "Our puppet has shattered into civil war. Seize both §YZagreb§! and §YSarajevo§! to restore the crown. Fail to do so within §Y180 days§! and the rebels will break free for good."
 CRO_trigger_coup_tt:0 "§RGovernment Control collapses — the coup begins.§!"
 CRO_partisan_prep_tt:0 "§GPartisan preparation increases — Tito's rising will be stronger.§!"
 CRO_partisans_sabotaged_tt:0 "§RThe partisans are sabotaged — Tito's rising will be weaker.§!"

 CRO_prepare_for_the_storm:0 "Prepare for the Storm"
 CRO_prepare_for_the_storm_desc:0 "Every rifle cleaned, every road watched. The Italians will come, and Croatia will be ready."
 CRO_break_their_backs:0 "Break Their Backs"
 CRO_break_their_backs_desc:0 "Rome must learn that every step into Croatia costs blood."
 CRO_against_italy:0 "Against Italy We'll Fight"
 CRO_against_italy_desc:0 "The people stand as one against the invader."
 CRO_partisans_at_the_ready:0 "Partisans at the Ready"
 CRO_partisans_at_the_ready_desc:0 "Twenty years of war taught us how to bleed an occupier."
 CRO_for_freedom_forever:0 "For Freedom Forever"
 CRO_for_freedom_forever_desc:0 "Dig in, hold fast — this land is ours."
 CRO_factories_overdrive:0 "Factories Overdrive"
 CRO_factories_overdrive_desc:0 "Every lathe and press turns day and night for the front."

 CRO_bosnian_compact:0 "The Bosnian Compact"
 CRO_bosnian_compact_desc:0 "The muftis keep the peace and the crown keeps its distance. Bosnia's men stay out of our barracks — and its markets lean on our purse."
 CRO_partisan_activity_gone_tt:0 "§GThe partisan menace has been broken.§!"

 CRO_partisan_activity_category:0 "The Partisan Menace"
 CRO_anti_partisan_sweep:0 "Anti-Partisan Sweep"
 CRO_anti_partisan_sweep_desc:0 "Methodical cordon-and-search operations through the hills. Slow, professional, effective."
 CRO_collective_reprisals:0 "Collective Reprisals"
 CRO_collective_reprisals_desc:0 "Burn the villages that feed them. Cheaper and faster than soldiering — and the whole world will know what we are."

 CRO_reunification_category:0 "The Yugoslav Question"
