 CRO_lorkovic_the_conspirators_triumph:0 "The Conspirators' Triumph"
 CRO_lorkovic_the_conspirators_triumph_desc:0 "Twenty-five years after the plot failed, Lorković and Vokić have their state. Croatia opens its shutters to the light — cautiously, and with a hand still on the knife."
 CRO_luburic_the_crusader_state:0 "The Crusader State"
 CRO_luburic_the_crusader_state_desc:0 "The camps made his name; the purge makes his state. Under Maks Luburić, Croatia becomes the crusade its founders only dreamed of."

