 CRO_TITO:0 "§RTito§!"
 CRO_TITO_tt:0 "§RJosip Broz Tito§! and the hardliners — a centralised, authoritarian Yugoslavia under the Marshal's personal command."
 CRO_HEBRANG:0 "§gHebrang§!"
 CRO_HEBRANG_tt:0 "§gAndrija Hebrang§! and the party apparatus — a technocratic, orthodox party-state managed from the top."
 CRO_BAKARIC:0 "§bBakarić§!"
 CRO_BAKARIC_tt:0 "§bVladimir Bakarić§! and the reformers — a liberalising, decentralised road to democratic socialism."
 CRO_appease_tito:0 "Back Tito's Hardliners"
 CRO_appease_tito_desc:0 "Throw our weight behind the Marshal's faction.\n\nShifts the balance toward §RTito§!."
 CRO_appease_hebrang:0 "Back Hebrang's Apparatus"
 CRO_appease_hebrang_desc:0 "Strengthen the orthodox party machine.\n\nShifts the balance toward §gHebrang§!."
 CRO_appease_bakaric:0 "Back Bakarić's Reformers"
 CRO_appease_bakaric_desc:0 "Empower the reformist wing.\n\nShifts the balance toward §bBakarić§!."
