 CRO_reparations_HUN:0 "War Reparations to Hungary"
 CRO_reparations_HUN_desc:0 "Defeat has a price. Zagreb's factories labor for Budapest, and Croatian goods flow north on Hungarian terms."
 CRO_reparations_ROM:0 "War Reparations to Romania"
 CRO_reparations_ROM_desc:0 "Defeat has a price. Zagreb's factories labor for Bucharest, and Croatian goods flow east on Romanian terms."
 CRO_claims_surrender_category:0 "The Croatian Demands"
 CRO_claims_surrender_category_desc:0 "Zagreb demands land. We can bleed for it, or we can let it go."
 HUN_surrender_vojvodina:0 "Cede Vojvodina"
 HUN_surrender_vojvodina_desc:0 "Surrender the claimed territories to Zagreb and end this war. A humiliation — but a survivable one."
 ROM_surrender_banat:0 "Cede the Banat"
 ROM_surrender_banat_desc:0 "Surrender the Serbian Banat to Zagreb and end this war. A humiliation — but a survivable one."

 CRO_integration_category:0 "Integrating the New Lands"
 CRO_integration_category_desc:0 "Conquest is signed in ink; integration is written in years. Each province must be brought into the fold once its people comply."
 CRO_integrate_territory:0 "Integrate [FROM.GetName]"
 CRO_integrate_territory_desc:0 "Establish full administrative control over this province. Requires §Y50%§! compliance."

 GER_volunteers_for_zagreb:0 "Volunteers for Zagreb"
 GER_volunteers_for_zagreb_desc:0 "The Ustase are our men. Let German soldiers stand beside them — unofficially, of course."
 GER_volunteers_for_zagreb_tt:0 "§GGermany may now send volunteers to §YUstase Croatia§!"

