 CRO_reforged_doctrine_ii:0 "The Reforged Doctrine II"
 CRO_reforged_doctrine_ii_desc:0 "Every exercise sharpens the blade further."
 CRO_reforged_doctrine_iii:0 "The Reforged Doctrine III"
 CRO_reforged_doctrine_iii_desc:0 "Doctrine, initiative, and iron — the army of the New Order is complete."
