 GAY_THENEWORDER_DESC:0 "As the Soviet Union cracked under pressure, each man found ways to cope with the oncoming collapse. Some turned to Fascism; some turned to Democracy; some to their primal instincts of survival. As Kirill Pavlov crawled through the tundra, injured and dying, he turned to God. \n\nFrom this awakening sprung a new state in the outskirts of Western Russia, the Army of Saint George, the movement's adherents hiding out in the fortified monastery of Gayny and biding their time, waiting for the end of the German bombardments. But the seeming monolith is cracked; the mainstream Pavlov’s rump state is protected by the Orthodox militias of the fanatic convertee Mikhail Antipin, the alliance under constant strain, with the discord only worsened by the democratic preacher Sergey Izvekov. \n\nAs the Russian Anarchy rages on, it is up to the Army to bring God back to Russia. Whether that God is of the New Testament or the Old remains to be seen."

 ### Events ###
 GAY.1.t:0 "A Day In The Life"
 GAY.1.desc:0 "The day of Epistolary Daniil began two hours before dawn. Members of the night patrol rang their bells in the mess halls, carrying lanterns and awakening the warrior-monks. They donned the inner cassock in a few moments, and the chaplain led the Morning Prayer. It was a simple prayer, as ostentation did not endear men to divinity. All done, the chaplain divided the day's duties and administered the Communion, for it was Sunday. After that, he left the monks to pray, prepare, and dress as their tasks demanded of them. Daniil was to train, to pray, and to perform duties befitting an Epistolary. He issued a silent amen.\n\nIn a few moments, the morning patrol departed. After breakfast, Daniil was now in combat gear, leading his men through the war-games. He guessed that an Epistolary was equivalent to a sergeant, and he felt that he did well coordinating and commanding his squad in executing tasks throughout the field. A lucky shot took him out, and he watched in dismay as his fellows fell into disarray. Practice over, they would have lunch, and he spent the afternoon secluded in meditation. He was released just in time for the evening to sweep Russia, and thus dinner to be served. Bellies full, they would start to other tasks. For others, it would mean patrols or studies of saints. For Daniil, it was something else.\n\nHe opened the door to the scriptorium and lit a candle. It would reveal the inkpots and pens, pages and pages of parchment and paper, and volumes bound in jeweled and gilded leather covers. It was his home. Tonight, too, he would do his task with joy. He drew a sheet of parchment and opened a volume, and started copying. He whispered a silent prayer in his heart, and whether or not God existed, he no longer cared. The truth was that faith behooved men to great acts, and he thanked the Lord for what he was given today. At midnight, he would quit his task, and join the night prayer, before going to bed."
 GAY.1.a:0 "Just another day in the monastery."
 GAY.2.t:0 "We Thank Thee"
 GAY.2.desc:0 "Today was a harsh day, Dimitri was coming back from the farmlands after hours of plowing. As he opened the door to enter the house a small grey blur embraced him by the waist: "Daddy, what are we eating this evening?", asked Anatoly loudly , one of his sons. His words hit him like a truck, even after so much work and blood spilt, he couldn’t even afford to buy a simple meal for his children... "Sorry sweetheart, but we don’t have much for today, but at least we should be able to hold off our hunger for another day..." he replied; seeing the his child's enthusiasm deflate was more painful than a gunshot... The results of his failures as a father. \n\nThe day went on as usual, he played around with his children during the evening, took care of his ailing wife and started preparing dinner. "There’s nothing more than this?" asked Ekaterina, his oldest daughter, "Why we never have money for food? You MUST ask for more Father! The fat pig surely could spare more coin for us, the conditions you work in are-" "ENOUGH!" shouted Dimitri, "Smirnov already has to pay other 200 farmers, do you think he can raise the wages of everyone? Ekaterina, you must understand it’s not just us, everyone in this damn village is struggling with their lives, you can’t require better treatment than the others." \n\n As he shut his mouth someone knocked at the door. Dmitri went to open it, he was greeted by a Priest of the Army, holding a basket of bread on his hand. "Good evening, brothers and sisters, I come on behalf of the Grand Schema. We have been ordered to distribute some loafs of bread for each family in this village, are you in need of some?" Dimitri couldn’t believe it: free bread? The children started cheering the man as he gave them the food they needed. Dimitri still remembered the days of Bukharin, four of his brothers have died of starvation, while the communists bickered between each other. Maybe the arrival of the Army was for the better? \n\nDimitri said a quick prayer and thanked the priest."
 GAY.2.a:0 "Even the smallest actions can save lives"
 GAY.3.t:0 "The Grateful Man"
 GAY.3.desc:0 "Kirill Pavlov finished his evening prayer, and blew out the candle, turning around and settling in the straw bed. Tomorrow was another difficult day, but God has granted him another day of life, and for that, Pavlov was thankful. The straw was rough underneath him but considering that many in the Russian Anarchy got only the bedding of the wet ground as they rotted, Pavlov was also thankful. \n\nThere was a time when he wasn’t as thankful as he should have been, an unpleasant feeling of shame spreading through the back of his mind as he remembered when he fought in the Soviet Army, the hate he spouted as he talked of people whose only sin was owning two cows instead of none, or for following the Lord’s word instead of following the idolatry of a German apostate. \n\nAnd then, the luciferian flames of battle, the roar of machine guns and artillery, fear creeping through his nerves as he grasped his rifle. Then the mutiny, the injury... \n\nChrist was tempted in the desert for 40 days. Pavlov crawled, bleeding over the white snow of the taiga for 39 until the Lord finally cleansed him of his past sins and granted him relief in the form of the Gayny monastery. The Grand Schema closed his eyes, and let his body relax, drifting off into sleep."
 GAY.3.a:0 "Psalm 7:17"
 GAY.4.t:0 "The Flow of Time"
 GAY.4.desc:0 ""Gah-, put your back into it, damn it!" \n\n"Well, I am! You should grasp it better!" \n\n"I’ll grasp you better if you don’t stop blabbering!" \n\nAnton and Foma dropped the boulder, slipping down into a sitting position, their backs against it, the relatively young men desperately out of breath. The small outskirt monastery was not a place one would attack, whether they be German bomber, Permhaym fascist, or Vyatka heretic. Yet orders were orders, fortifications were to be built, and the first to be sent to clean out some land for those structures were the newly-recruited, in this case, the two stooges sitting against the rock. \n\n"Ghhh, I think I’ll pull my back," Anton whined, still breathing heavily, his black cap slipping to the side of his shaved head. \n\n"Christ died on the cross of all our sins; you can manage some physical exercise," Foma whispered raspily, staring off into the distance. \n\n"Heh, at least we got the river here along with us, some cool air, even with all the mosquitoes." Anton also gazed forward, the river ahead whispering pleasantly, "Look at it! Kama river, what a beauty! You gaze at it, and suddenly life eases, if there are rivers like the Kama, then maybe God hasn’t forgotten us."  \n\n"God? God can’t forget; he’s all-knowing." Foma scoffed. \n\n"Then why does he test us with dragging boulders? Doesn’t he know the answer already?" Anton stood up, stretching and looking back at the monastery, before turning back to the river, breathing in the warm air. \n\nFoma sighed, "If you think God tests us by making us drag some meagre rocks-""
 GAY.4.a:0 ""Wait ‘till we face the heretics...""
 GAY.5.t:0 "Created to Serve"
 GAY.5.desc:0 "Pavlov grasped his prayer beads, his eyes focused on the soft light of the candle’s flame, the cold air wafting in through the open window. While usually, this time of day was for prayer only, today Pavlov could not focus, had witnessed something discomforting: a monk soldier and his fellow brother struck a peasant when the civilian’s belief was put into question. Thankfully, he was there to stop them, to soother their righteous rage, but he could see where this seemed to come from, he heard the rumours. \n\nAntipin’s communion had grown greatly, and so did his rhetoric’s sparks, lighting more and more flames among those that saw the Order’s actions as too slow or too lenient with the heathen warlords outside of Gayny’s borders. \n\nAntipin had arrived later than Pavlov, no one knew exactly from which direction, his only affiliation at the time being the "international struggle for socialist paradise". Maybe it would have continued so, if not for the fact that just like Pavlov, Antipin had arrived severely wounded. The man who arrived at the infirmary was not the same that came out, a genuine belief having entered the man’s soul, and yet, Pavlov could see the eerie similarities. \n\nHe could see the love for weapons, the ideological fanaticism with which Antipin preached, the respect for force and only force, the righteous rage. This reminded him of his own Communist past, rigid, spiteful and violent. In some ways, he considered, Red Materialism is simply hammered into the soul, after which the victim cannot recover. \n\nPutting down the prayer beads, Pavlov blew out the candle and lay to rest on the straw."
 GAY.5.a:0 "Sickle and Hammer, Fire and Brimstone"
 GAY.6.t:0 "The Righteous Sword"
 GAY.6.desc:0 "Pavlov sighed, running the prayer beads between his fingers habitually. The several men in front of him did not have any uniform, the warrior monk militias usually wearing whatever kept them warm and camouflaged. Their rifles, mended in basic ways, be it by wood sap or by nails, looked like they were about to fall apart. \n\n"At ease... Thank you, brothers." The dozen or so men relaxed, lowering their rifles and sitting down against the monastery wall, exchanging friendly smiles and nods. Pavlov understood that the army was not in a state to fight any big opponent. The men were armed with whatever possible, and while this made them win great victories, it was not with the aid of the Army, but rather in spite of the Army’s lack of preparedness. \n\n"Lions led by donkeys," He thought to himself bitterly. If the Army had more land, or more weapons, or was in a better region, maybe he could have not thrown those men into desperate defences. It left only the best alive, but even those that did not survive the baptism by fire deserved to live.  \n\n"Brother Kirill?" Pavlov’s worried thoughts were disturbed by one of the militiamen marching up to him. "After the defense drill, my brothers and I wish to pray for our fallen, would you be so kind to-" \n\nPavlov nodded, "I will, that is the least I can do.""
 GAY.6.a:0 "Proverbs 27:17"
 GAY.7.t:0 "One of the Greatest Sins"
 GAY.7.desc:0 ""Have you come to confess, sister?" Father Matvey blinked a little tiredly.. His communion was one of the bigger ones within the borders of Gayny, and so, many would stop in the village on their way into the Anarchy’s "Holy Land", relief on their faces, crosses in their hands and around their necks. \n\n"Yes, father." The woman looked sickly, her clothing torn in some places, covered in some furs, scared confusion seemingly being her permanent expression. \n\nEyeing her up and down, Matvey nodded, "Then go on, sister, we welcome all. Christ is here to hear you." \n\n"I-I came from Yasny, we weren’t too big of a town, but we had something to live on," The woman’s pace and tone were quick, apologetic, as if she was taking precious time, Matvey cut off before he could even read the admonition warning. "It is near Orsk-" She paused tensely, as if she said some terrible secret. \n\nMatvey’s eyebrows almost raised, the implications being quite clear. Many ran from Orsk, very few even reached the border, because of the... He couldn’t even be sure what to call the monsters that stalked the region. \n\n"The bandits... They caught my group and..." She burst into tears.\n\nMatvey began to mumble a prayer, feeling twinge of spiritual exhaustion. The Russian Anarchy spared no one."
 GAY.7.a:0 "Mark 7:21-23"
 GAY.8.t:0 "The Roar of Hellfire"
 GAY.8.desc:0 "Antipin passed through the crowd of his disciples, many of them stepping aside and letting their shepherd pass. Pushing past his students and ascending to the altar, standing in front of it, hands behind his back, Antipin could not stop smiling. Each sermon he gave, the crowd only grew. \n\nHis flock was of many creeds. Many were simple caretakers, monks looking after the monastery, tired of seeing their labour be all for nought as more and more waves of idolaters assaulted the monastery. Some were combat monks, their faces partially covered by hoods, their clothes covered in mud and grass, exhaustion slowly wafting off their bodies. Finally, there were the most important, the deacons. They did not look after the walls or carry rifles, but the flames behind their eyes said everything. His words would be theirs, and more would come to his mission in time. \n\n"Brothers! Long has the holy land been under the boot!" His voice, deep, powerful, rumbled like the grumble of far-away thunder. "Our land has been besieged for many a time in history! The Mongol heathens kept us under their boot for centuries, and we persevered! The Western heretics have put all of their mutt underlings to destroy the seat of the true Orthodox fate, and we persevered!"  \n\nA tragic pause, "The continent has lost God, be it with the Fascistic race-praisers or the Communistic backstabbers... But WE. SHALL! PERSEVERE!!!" It was his signature style, letting the room’s dimensions reflect his raucous call as the crowd before him shouted praises and kissed their crosses."
 GAY.8.a:0 ""We are Russia’s army! We are GOD’S army!""
 GAY.9.t:0 "Peace Through Power"
 GAY.9.desc:0 ""Fire!" The chest of the straw dummy exploded as another rifle round hit it, the slightly nervous young monk standing a distance away pulling at the bolt of his rifle, letting the casing hit the moist ground. \n\nHis comrades followed suit, the recruits holding their rifles in practised but amateurish ways, the Russian Anarchy having already taught many of them through experience. Antipin grimaced from the small wooden bench. They were still slobs with their weapons, many of them not even worth a toenail on the warriors protecting the Order’s borders. \n\nHis rage quickly cooled as he reminded himself, "But if we hope for what we do not see, we wait for it with patience." \n\nRomans 8:25 spoke the truth, but with each day Antipin could barely contain himself. Many ran across the border, hungry, scared, destitute, but most importantly, weak. God protected, he did, but there is only so much the Good Lord could do in this crumbling world of Russia, so far away from Heaven, so close to the hungry jaws of Lucifer. \n\nHis nails dag into the leather cover of the small Bible he kept in his tunic’s pocket. "Do not gloat over me, my enemy! Though I have fallen, I will rise. Though I sit in darkness, the LORD will be my light." No, Micah 7:8 was more his type of verse."
 GAY.9.a:0 "An unarmed servant of God is no more than a slave of Man."
 GAY.10.t:0 "Forgiveness"
 GAY.10.desc:0 "Vladislav stumbled through the thick forest ripping the Imperial coat of arms off of his jacket, biting the inside of his cheek not to begin weeping. He never liked living in Vyatka, let alone serving in the military for the so-called "Tzar". There was no turning back now. \n\nHe sent her that last letter, and then there was no response, not for a week, nor two, nor three. Today, the news finally came, his mother had passed. Nothing held him in this den, for he had nobody left, he was utterly free. Leaving in the dark blizzard would cover his tracks, but now he regretted his decision, the freezing wind numbed his face and the slow crawl of frostbite up his fingers signified it would be his end soon. \n\nTaking cover in the abandoned burned down shack, Vladislav pushed himself into the dark log corner, shaking uncontrollably as the cold crept through his limbs, sleep slowly beginning to take him over. Putting his hands together, closing his eyes, his tongue stumbled lazily over the prayer. "L-L-Lord... Jesus Ch-Christ... Son of... God..." \n\n"-have mercy on me a sinner..?" Peeling apart his frost-covered eyelashes at the voice in front of him, Vlad recognised the camouflaged figure of an Order priest. A click. He stared into the barrel of the rifle, so familiar, so welcoming into that void. \n\n"I see your uniform is of the Imperial kind, brother. But your prayer is not a call for the Empire to save you. Whom do you truly serve?" \n\nThe officer opened his lips, an action he did not think himself capable of several minutes ago."
 GAY.10.a:0 ""No Man above God.""
 GAY.11.t:0 "God’s Wrath"
 GAY.11.desc:0 "Grigory looked at the green barrel, straining his eyes as the darkness of the hangar was only cut open by the thin beam of light from the opened entrance. \n\n"Saveliy, what are we looking at here?" \n\nThe younger man stumbled to his commander’s side, scratching the back of his head. "Choloro- uh... Chloroethyl-... Bah, I can’t pronounce it."\n\n"Chloroethylchloromethylsulfide. If I remember correctly, that’s... mustard gas." The oldest, Konstantin, stared at the barrel from a bit of a distance, smiling cautiously, the private ex-professor wary of what would occur if one of those waist-high barrels suddenly blew. \n\n"Mustard gas?" Grigory pulled up the strap of his rifle back onto his shoulder, the basic inspection having been complete, "And what does that do, Konstantin Lvovich? Can’t say mustard sounds like the worst thing in the world." \n\nKonstantin continued to smile uncertainly, "Well, if I had to equate it to anything, Grisha, I would say-""
 GAY.11.a:0 ""Man’s Fifth Plague, I suppose...""
 GAY.12.t:0 "Newly Outdated"
 GAY.12.desc:0 ""Stepan Andreivich! Stepan Andreievich, this is not acceptable of a man of such respectable position!" \n\n"Bah, Madame, with all due respect, I have nothing to do there." The electrical engineer wandered his single-room apartment, measuring it with steps, papers strewn around it, the aged landlady giving a worried look to her tenant. \n\n"Mariya Ivanovna goes, Kirill Fedotich goes, even Pasha goes, yet you don’t! No, no, you are unwell, Stepan Adreivich, if you talk to a priest then-" \n\n"Madame Ovsyannikova, with all due respect, I do not find any use in going to church; my Sundays are much better-suited in bed, getting some well-deserved rest." Finally having enough, Stepan would come up to the doorway, "Is there anything else?" \n\nThe landlord clicked her tongue, shaking her head, "It saddens me a lot, Stepan Andreivich, that you, such a smart and progressive man, get stuck to these outdated things. I’m old, I have that right, but you... Bah, who am I trying to convince, good day Stepan Andreivich." \n\n"To you too, good evening." The engineer pronounced slightly sarcastically and shut the door, enjoying the pleasant silence that came when his landlord left. Though there was that nagging feeling... \n\n"‘Outdated things’, hm..." The engineer wandered into the centre of the room, sitting down on the rickety stool, sinking into thought. \n\nIt was strange; it felt like yesterday he had heard about the "opium", "scientific atheism", the "fight against backwardness", and within less than a single generation, those things were gone, lost. Everyone went to Church; everyone owned a Bible, and everyone marched toward God’s Kingdom on Earth... \n\nStepan sighed, thinking back to the offer to go to church."
 GAY.12.a:0 ""Maybe I should go and visit, just once...""
 GAY.13.t:0 "Caesar and Christ"
 GAY.13.desc:0 "Pavlov slammed his fists onto the weathered desk, an uncharacteristic outburst of rage for the usually composed Man of God. Anger was a sin, but perhaps God would be forgiving this time. He hadn’t spent his whole life studying the teachings of God to deal with taxation and budgeting. \n\n"Father Kyrill, are you well? You seem rather flustered." \n\n"Oh, it’s nothing much," Pavlov let out with a pensive sigh. "It’s just that I had always thought God meant a life of calm prayer for me, yet now I am living a bureaucrat’s nightmare. If you don’t mind, brother, I could use some solitude for a few hours." \n\nFather Pavlov wiped his reading glasses and got back to work. First order of business was the land taxes. However little the peasants had, the fledgling state would need it if the Russian flag was to fly over Moskva someday. Or perhaps, a wealth tax could be put on the Kulaks? It was certainly a little red for his taste, but taxing the destitute would be both unproductive and un-Christian. This politics business sure was hard work. Next was the army budget -- the priests in the ranks did not demand a cent, but with more and more laymen joining the flock, pay would have to be increased to feed their families, and the provisions of weapons and ammunition as well. \n\nBut most of all, perhaps even a little selfishly, Kyrill needed a secular bureaucracy. For all the wisdom of God’s teachings and all the holy strength of the church, there were some things meant for men of Faith, and others for men of the Tax Office. Did Christ not come to minister to the tax collector and the centurion as much as He did to the poor and needy? A Holy Russia would leave not one soul and not one cent behind, after all, as Christ Himself had once taught:"
 GAY.13.a:0 ""Render to Caesar the things that are Caesar’s, and to God the things that are God’s." Mark 12:17"

 GAY.14.t: "The Eighth Commandment"
 GAY.14.desc: "\n\nA few hours before the raid, as twilight breathed its last before its resurrection as night, four soldier priests sat around a bonfire. They sat silently for a long time, avoiding each other’s gaze. All at once, however, they looked up at each other. \n\nMatvey, the tallest and youngest, spoke first. \n\n"Brothers, how are going to go about this, er, stealing?" inquired Matvey. The poor wording and peculiarity of the question caused light chuckles to fill the circle. Kostya, the oldest by several decades, shushed the circle and replied. \n\n"By ‘how are we going to steal’, do you mean ‘how are we going to do this’ or ‘how are we going to reconcile our sin’?" asked the older, but not quite old man. Nursultan, a boulder of a man, chuckled. Matvey’s brow furrowed, and he answered. \n\n"Ha, ha. I was talking about our orders. We have to wake up in, like, nine hours, and we have no idea what we’re doing." Matvey looked around quickly, waiting for a response. Waking up from his lengthy early evening slumber, Pyotr, a wiry, perpetually drowsy young man, stared at the tall priest for a second, then pulled a piece of paper from under his helmet. \n\n"Oh, do you guys need this? I was gonna tell you what was on it, but, uh, you know... These things happen." Pyotr murmured, still sleepy. Nursultan snatched the paper, and unfolded it for everyone to see. It was, in fact, their orders. They all glared at Pyotr, who could only smile weakly. They each passed around the sheet, ascertaining their mission; they were to cross the border into the Revolutionary Front, storm a bunker, and take everything not bolted down. Each aspect of the assault was detailed, down to descriptions of geography and recommended bunkers to storm. \n\nAfter a long discussion over the semantics of the orders, the soldier priests finally put their heads down and got a few hours of rest. \n\n"Hey, wake up! We have to get moving!" The strike team was all awoken by Matvey’s eager if still mildly drowsy call. "...Five more minutes, please. I’m so tired..." murmured Pyotr. Before he could put his head back down to go to sleep, Pyotr was grabbed and shaken awake by Nursultan. The four of them picked up their rifles, checked their bootlaces, and began marching to the border When they finally reached the border with the Front, Matvey noticed just how detailed the orders were; he could spot each tree stump, every pebble, everything listed was right in front of him. \n\nAbout a hundred meters from them stood a small bunker carved into the side of a hill, seemingly empty. The men looked at each other, nodded, and sprinted around the side of the bunker. Matvey and Kostya spotted an entrance on the left side, signaling over Nursultan and Pyotr with their hands. \n\nStanding at the edge of the door, the four of them looked down in silent prayer before nodding to each other, kicking down the door, and opening fire."
 GAY.14.a: "Thou shalt not steal."

 GAY.15.t: "A New Shrine, to God"
 GAY.15.desc: "The Grand Schema Kirill had come to visit yet another place of worship, to our Lord and Saviour, Jesus, the son. Welcomed by many of the local believers in the church, he led the prayer of Our lord; as well as the mother virgin; both rather quick ones, before taking to the smaller elevation inside the Church to preach to the believers. \n\n"Brothers and Sisters, we join yet again today, to welcome the entry of yet another place of belief in the words of our apostles, and the words of our most faithful Jesus Christ. It is through the power of God All-Mighty, that we shall prevail in these dark times, for as the lord teaches us, with belief in him anything is possible!" \n\nMany of course, said amen, while some clapped if a bit quietly. Before resuming the numerous local services of the day, led by the Grand Schema. They were solemn, but there was more to it... The people were filled with hope and strength, working step by step towards the reunification of our Holy Motherland."
 GAY.15.a: "And they shall"

 GAY.16.t: "Our Power on Display"
 GAY.16.desc: "The streets of Berezniki flooded with crowds of spectators. Men and wives, boys, girls, and even the elders ran out of shops, apartments, and in many cases these days, their bunkers to see the commotion. Those few that stayed inside, praying that the fuss didn’t attract the Luftwaffe for "target practice" soon saw why so many had abruptly left work to stand out in the streets. \n\nPrayers and praises blasted out of the loudspeakers, calling for God to protect the soldiers of the faithful. The people were encouraged to sing blessings to their protectors, and even the faithless couldn’t help but feel a sense of awe at the whole event. Suddenly, the loudspeakers went silent. A sense of worry befell the crowd before Imperial-era martial music blared from the loudspeakers, and a stream of soldiers appeared on the street, freshly cleaned the day before of rubble and dirt. \n\nThe men wore clean uniforms, mostly Soviet surplus stripped of communist symbols. At the commands of their officers, dressed in their priestly garb, the men marched in perfect unison. Their new AK-47 rifles gleamed in the afternoon sun, all with matching bayonets to boot. The crowds cheered as truck-drawn cannons and their artillerymen roared down the street. Had they expected another ragtag warlord army? These men were the very best the Army of Saint George had to offer. \n\nYet the parade was not quite done yet. Row upon row of T-54 tanks and BDRM armoured cars rolled forward. Seized from the WRRF, repaired, and repainted with crosses, the commanders stood out of the cupolas and rendered a salute to the crowd. Their cheers grew deafeningly loud as one man climbed out of a BDRM -- Mikhail Antipin himself. Praising the Army of Saint George for their valiant defence of the true Russian Faith. Truly, Saint George’s legions had come a long way from a mere militia."
 GAY.16.a: ""Proclaim this among the nations: Prepare war, stir up the mighty men. Let all the men of war draw near, let them come up." (Joel 3:9)"

 GAY.17.t: "Harbingers of Joy"
 GAY.17.desc: "It was about time the priests showed love back to the community in forms other than services and sermons. They were human after all, just like everyone else. They ate, drank and slept like any other person. Yes, they were chosen by God, but they were people nonetheless. \n\nThe many bombings the people of Saint George have witnessed over the last few months since the collapse of the USSR killed many, and injured others. The priests could not do much to the dead, but at least they could bless the living. Yesterday, after a small children’s school was bombed, many kids were hospitalized in makeshift basements with little hope for their survival, sadly, however, god’s men were not about to let them die alone in the dark. \n\nEach of the priests stepped out of a truck, making their way into a small, raggedy looking apartment building that somehow managed to stand the test of time since the red dawn of Russia, before they were later guided by a nurse into the underground hospital they had made. Cries from infants could be heard as they twitched in pain, and children no older than seven called out to their mamas in fear as they were being treated. What a horrible reality this was. \n\nWhy must God bring this suffering upon the people of this humble group, one might ask? It was a test. They were sure of it. But maybe the little ones were not. \n\nIn a few minutes, each priest had slowly made their way towards some of the children. Some delivered just a tiny bit of hope to the younglings through the little comforting comments they were given. Others simply joked and goofed around to try and stray them away from the cold life they were birthed into. "
 GAY.17.a: "Laughter is the best medicine after all, isn't it?"

 GAY.18.t: "The Children of Christ"
 GAY.18.desc: ""HE DIED FOR YOUR SINS. WOULD YOU DIE FOR HIM?" \n\nEvery wall and every corner of this priestly state had that very same poster stuck to it. The very same face of Christ. The very same soldier. The very same Kalashnikov in hand. You would be forgiven if you got lost out of nowhere because every street looked the same with all these posters being put up everywhere. \n\nAnd that was the case with little Vadim. \n\n"Mama!" shouted Vadim as he looked around, seeing men and women ignoring his presence and going around with their day, with only the distant preaching of father Dima seemingly calling out to him as he noticed the distraught young boy. \n\nFather Dima had quickly gotten off the box he was standing on while he was preaching to the people a few minutes ago and made his way to Vadim while he still had him in his line of sight. \n\nVadim looked up to notice the man approaching him, his neck slowly moving up as the much taller man’s neck moved down, maintaining eyesight with the boy, before he got on his knees, his hands gently resting on Vadim’s shoulders. \n\n"What is wrong young man? Are you lost?" Father Dima would ask in his usual caring tone. \n\nThe only reply he got was a simple nod of shame as Vadim began rubbing at his cheeks, trying to rub away the tears as he looked away from Dima, scanning the faces of everyone that walked by, trying to identify his mother, but to no avail. \n\nFather Dima would gently take his hand and stand up. His preaching was done for now. Its not like there were a hundred other preachers in the streets nearby screaming the word of god at the top of their lungs anyways."
 GAY.18.a: "Come, let us find your mother."

 GAY.19.t: "Love Thy Neighbor"
 GAY.19.desc: "\n\n"This court, in the name of the Lord God who watches over all Rus’, finds Artyom Semyonovich guilty of four charges of treachery, one charge of atheism, two charges of aiding blasphemous political movements, and one charge of murder, and sentences Semyonovich to death immediately," said the judge, monotonically, but with a hint of genuine hatred for the man he had just condemned. \n\nArtyom had just been sentenced to death, after being shot in the leg by a band of soldier-priests and captured in an emplacement along the border; on his side of the border, at that. The soldiers had patched him up, confiscated everything, and taken him to Gayny, where he had just been tried for his "crimes". He tried to plead his case, but no one particularly cared. \n\nNow, those very soldiers that had captured him were driving him out into a field outside the monastery, armed to the teeth. The tallest, a shy young man named Matvey, looked over at him from the passenger seat and opened his remarkably pristine mouth to speak. \n\n"So, little Bolshevik, what brought you down the path of, eh, communism?" Matvey had a lot of gall to call Artyom little; Artyom stood a head taller than him, when lined up, and was at least fifteen years his elder. \n\n"I’m a communist because it is simply the natural order of the world. The reactionaries, yourselves included, will be defeated in due time, and socialism will lead the world to eternal harmony and greatness!" Before Artyom could even finish, the soldiers erupted into laughter. \n\n "Ha! You godless fool!" boomed the exceptionally robust Kazakh to Artyom’s left. They all beamed at him as if he was a court jester. \n\n"You’re laughing? Really? You call me names, you laugh at me; why? Because I’m a communist? Because I believe in true subjective morality? How dare you! You dumb, reactionary fools! Aren’t you supposed to love your neighbour? Show mercy? Whatever happened to ‘thou shalt not kill’?"  \n\n"You claim to be moral, the true arbiters of God’s word, but here you are, about to take me out to the middle of bumfuck nowhere and kill me! How sinful can you get?" Artyom huffed and puffed, now convinced he could argue himself out of this, "If you’re all real Christians, real traditional Orthodox folk, why am I being murdered?""
 GAY.19.a: "Judge not...?"

 GAY.20.t: "The First Stone"
 GAY.20.desc: "\n\n"Are you, an atheistic communist, sincerely trying to argue with us about our faith?" said Kostya, using all of his might to force the words out through his grin, "Not like it matters; we’re here." As Kostya finished his sentence, Artyom saw an empty patch in the wheat fields along the road, which Kostya the driver had turned the car into. \n\nTwo of the soldiers grabbed Artyom and dragged him out of the car as he kicked and grunted. \n\n"Hey, you God-addicted reactionary bastards, why can’t you just be nice to me?" whimpered Artyom as the strong Kazakh and the tall man dragged him to the center of the clearing. He kept squirming and trying to pull away, but to no avail. \n\n"You know," grunted Matvey, the tall man, "the harder you resist, the more inconvenient the whole thing becomes for you, yeah? So stop shaking me around, you Bolshevik shi-" He stopped himself from swearing. \n\n"Dirtbag." \n\nArtyom kept struggling, but stopped after a few seconds. When the three of them reached the clearing, the fourth priest, a perpetually drowsy man by the name of Pyotr, stepped in front of the Bolshevik soldier and drew out a pristine Tokarev pistol. \n\n"Artyom Solomonovich Feinberg, for your crimes against God, you have been sentenced to death," said Pyotr, remarkably sleepily, considering his position as executioner. Pyotr raised his piece up to Artyom’s head, closed his eyes, and began squeezing down hard on the trigger. \n\nAs Artyom watched his executioner, his life flashed before him; his wasted childhood, his poor service in the war with Germany, and all his years spent watching borders in a bunker by himself. If he had time, he would have cried, but the priest’s pistol put a stop to any expression of emotion. Just as the words "Lord forgive me" were about to leave Artyom’s mouth, Pyotr’s gun went off. \n\nThe last thing that went through Commisar Artyom Feinberg’s mind was the image of a bearded old man, shaking his head in disappointment."
 GAY.20.a: "Forgive us."

 GAY.21.t: "Ordained No More"
 GAY.21.desc: "Rays of sunlight penetrated the otherwise gloomy sky. As the emperor looked out the windows of his old palace - now turned into a gilded cage by his captors- he couldn’t help but wonder; how had it all come to this? How had he, a man of the faith, so thoroughly failed God that it was the church who dethroned him? Introspection for another time, perhaps, as his meeting with their leader was set to begin shortly. The Tsar only hoped that he and his family would be spared an unmerciful fate. \n\n"Vladimir Kirillovich of Russia, come." said Pavlov in a calm, yet judging voice. "There is much to discuss." As the old emperor answered for his past and atoned for his sins, the Grand Schema understood, and forgave. The horrors faced, the trials endured, the amount of faith in the true Lord and in his family; Kirill felt remorse, and a pang of empathy struck across his chest. Yet, he had to decide the fate of this man. And as they discussed their shared struggles and hopes for a bright future for the faithful, he had narrowed it down to an inevitable decision. \n\nSlightly disappointed by the bittersweet fate of exile, Vladimir nevertheless understood what lead to this. He was simply too much of a symbol and target to retire to a normal life in Russia. Besides, it would take years for the memories of his forced collaboration with the Reich to fade. It will take time, to be sure, but he could eventually redeem himself and make amends for his past actions. He could live out the rest of his days safe in the knowledge that Russia would find salvation and rise once more, even if he missed it."
 GAY.21.a: "Russia bids you farewell, Grand Duke."

 GAY.22.t: "The Lord Among Us"
 GAY.22.desc: ""Oh, ye people of Rus, gather ‘round! Gather ‘round and listen!" \n\nIt seemed like Pavlov really wanted his message to resonate with the people, not for his own sake, but for the lord’s sake. Russia has been cursed time and time again, and yet it still stands... maybe shattered to pieces, but it stands nonetheless. These warlords that surround us, they exist only to help Russia get back on its feet, and even if their execution was wrong, their means did justify the ends at times. \n\n"Oh ye people of Rus I see your suffering. I see your suffering for I have suffered alongside all of you! Every day, we wake up with the grace of God asking ourselves if we should keep fighting on, and I tell you, yes! We must fight on!" And as he rambled on, the people would slowly begin to divert their attention towards him. \n\n"God had never given up on us, so who are we to give up on ourselves? We survived a civil war, twice. We survived wars against the unfaithful time and time again, and although each time we found ourselves mortally wounded, we were never truly destroyed." \n\nAs Pavlov looked down from the sky and towards the crowd that had gathered around him, he could not help but tug his lips into a smile. A smile of Hope. \n\n"Bring your souls forth and into the hands of our lord for he shall do us no harm! Bring them forth for Christ will provide us with unity for as long as we provide him with faith!""
 GAY.22.a: ""God bless our holy Russia! God bless us All!""

 GAY.23.t: "The Skeptic"
 GAY.23.desc: "Yuri Lvovich Talanov had never held the Church in high regard. He wasn’t an atheist, far from it in fact. As the little old man stretched up onto his equally old and shabby-looking donkey and began to plow his fields for the planting season, he had thought to himself that perhaps if God didn’t exist, that bastard Bukharin might have won out. But no, God had a funny way of getting revenge, he guessed. Perhaps Hitler was His way of telling those Bolsheviks how exactly burning all his houses down made him feel. Returning from his thoughts, Yuri laughed under his breath as the cold spring air stung at his wrinkled nose. \n\nJust as the sun was starting to come up, a man in monk’s robes came up in front of his donkey, the startled ass nearly throwing the old man to the ground. Climbing down from the donkey, Yuri winced in pain, his old bones creaking as he touched ground. "Good morning, Reverend Father. And what could I-" \n\n"Please, Yuri Lvovich. Call me Brother, I am no hieromonk yet, just a novice!" Talanov gazed at the crumpled piece of paper in the monk’s hand. "Though I usually stay in the monastery, I sometimes help out the hieromonk prepare things for the services for the village church. You know, Yuri, I have never seen you there. Do you go to church?\" \n\nThe sudden question startled Yuri. He had to take a moment to think of what to say. God, how long had it been since he had last been to church? Fifteen, twenty, no, it had been almost thirty-one years to date since Yuri had last stepped in a church. The one his father had gone to, and the same one his father told him at the dinner table was a den of lies and a waste of taxes .Talanov turned back to the monk, a look of slight impatience growing on his bearded face. \n\n"Forgive me, Brother..." "Pavel". "I’m afraid I haven’t gone in many years. Not much of a reason for me to give any sort of praise to God in these times, I would think. No offense of course." \n\n"None taken. But perhaps it is best to remember, when the Lord puts us through hardship, He will reward us in the end. I was once a doubter like you, but when I saw the mercy the Grand Schema showed me, and the mercy the Grand Schema had been shown by his own Schima, I knew I had found the Lord’s mercy. Come to church this week. We have recently gotten our hands on some tractors, and your donkeys seem rather tired. I could put in a good name for you. The Lord does work in mysterious ways after all, Yuri Lvovich.""
 GAY.23.a: "The Lord taketh away, but He giveth more."

 GAY.24.t: "The Faithfuls’ Voices"
 GAY.24.desc: "Izvekov stood in the town’s small square, his eyes gliding over the new arrivals. Many in this nation preached, but many forgot the simple truth: Jesus did not speak the Holy Word surrounded by gold... \n\n"No," Izvekov thought, "He preached it on the Mount." The crowds, tired and cynical, stood before him, and the preacher felt that while they believed in God, they had lost him. Not of their own volition, his voice was distorted, falsified by those that wanted these souls to be enslaved eternally. \n\n"Sisters, Brothers!" Izvekov raised his hands, silence washing over the crowds, hopeful eyes turning to him. This power could bring these people to their knees, it could make them forsake their own and commit crimes so heinous that Jesus would weep, but in the end, it was also what would free them. \n\n"When God had created His servants, he intended to test them, Brothers and Sisters!" Pimen’s voice was not the assertive flow of Pavlov’s speeches, it was not the boom of hellfire that followed each of Antipin’s words, instead, a worldly calm penetrated the calm of the town square. \n\n"And this is our test! We stand at a precipice, and His light shines above, His hand extending to us!" Izvekov held his hand out to the sky, as if reaching out to Him. "Nay, Brothers and Sisters, when one extends their hand, they do not hold a bloodied knife in it, preaching of the unfaithful they slaughtered! Nay, Brothers and Sisters, He does not recognize currency, one cannot buy his place in Heaven!""
 GAY.24.a: ""Only a free hand, can help one reach Him, and no other!""

 GAY.25.t: "A day in the Life"
 GAY.25.desc: "As it is still dark out, monk-in-training Akim thinks he may have woken up a bit too early for breakfast. He checks the ornate clock on the wall, one that his grandfather designed before being killed by a zealous Cheka commander for "Anti-revolutionary activity", one that his father built along various others before being conscripted by the Red Army and being captured by the Germans somewhere in Estonia, and one that he as their sole son maintains as one of his tasks in the monastery. 4:38 in the morning, only a few hours after the nightly vigil and prayer. After cleaning himself and putting on his habit, Akim eats breakfast, a plate of steamed vegetables with herbs instead of salt, just enough nutrition to last until dinner. With his morning prayer going smoothly, he tends to the electrical system of the monastery, as others work in the kitchen, preparing the meals, setting the tables, and washing dishes. \n\nOther daily tasks include construction projects, electrical and plumbing maintenance, carpentry, metal working, financial accounting, and upkeep of the chapels. A newer activity that every monk must take part in is weapons training; Akim is no extremist unlike the ones who follow Antipin, but he finds joy in sharpshooting with his SKS, worn as it is by skirmishes with the Reds. Tomorrow is their turn at the border, and Akim can’t wait; he hopes that he’ll get to take revenge on an officer, personally."
 GAY.25.a: "For you, father."

 GAY.26.t: "The Sword of the Faithful"
 GAY.26.desc: "Another day, another great sermon delivered. It was not too odd to see Antipin delivering sermons all across the Gayny’s territories to strengthen the Christian will of his people. In the corner of his eyes, he spots Pavlov, standing, waiting. Perfect. \n\nAs Antipin began facing Pavlov, he was quick to quietly dismiss any questions given to him by the people, as the talk he would have with Pavlov would prove to be much more important than anything else he’d ever done, really. \n\n"My brother in Christ... How goes the army? Are they well armed...?" Antipin asked with slight concern in his voice. After all, the army was not only the backbone of this Christian beacon, but it also had a very important place in Antipin’s heart. \n\n"The army is large, and is well armed. The issue isn’t with that. It's that the arms sometimes don’t reach them. Christ forbid- sometimes we don’t even have arms to send." Replied Pavlov. \n\nIt was difficult to send trucks across the wasteland once known as Russia with Luftwaffe bombardments targeting them left and right and expect the weapons to reach the frontlines. It was never going to be easy, really. \n\n"What of the soldiers?" Asked Antipin while raising an eyebrow. Maybe now they’d have some sort of edge over their enemies if their soldiers were trained well enough? \n\n"The army is strong. Strong for an army coming out of a warzone, but strong nonetheless. However, recruiting divisions and somehow forging them to be similar in strength is... difficult, to say the least." \n\nAntipin let out a small hum as his mind already began dwelling around possible answers. Instead of replying however, he simply placed his right hand atop Pavlov’s left shoulder.  \n\n"Then let us move. We must bring these issues up with the rest and figure out some sort of answer.""
 GAY.26.a: ""Yes, it is best.""

 GAY.27.t: "The Tatar Question"
 GAY.27.desc: "After many nights of harsh combat across tatar land, their leaders lay defeated on bloody grounds, and your soldiers flood the garrisons to insure control... but that control is shaky as of right now. The issue of autonomy is raised by the tatar people, and your council argues left and right, but the final say is in your hands. \n\nSome advisors propose that perhaps it is better to give the Tatars some level of autonomy (even if that still means increased christian activity around the area) to ensure that no radical uprisings would spread. Antipin’s followers however believe that the Tatars are a people that never learn. Heretical people. A people that must be culled if they do not agree with out ways. They claim that the only way to ensure peace is through conversion, regardless of their opinions, beliefs or consent. \n\nWhat will be the Grand Schema’s decision?"
 GAY.27.a: "The Heretic's Gods are a rendition of our own under a different light, they may follow their testament"
 GAY.27.b: "The Tatars will prostate under the true God, forcefully convert them!"

 GAY.28.t: "Ask God for a Hand..."
 GAY.28.desc: "What makes a strong Christian strong? Is it his will to fight for God? Maybe. Is it his willingness to blindly believe in God? Perhaps. One thing is for certain, however. A strong Christian will always extend a hand to those who need it most. A Christian that is willing to give up many things, just for his fellow brother to feel happiness and fulfilment once again. \n\nAnd an example of a strong one, is Izvekov. \n\n"Spare a morsel of food for a fellow Christian..." Let out a beggar as people walked back and forth across the street, begging for the simplest of human needs. Food. He was not alone. Many like him littered the streets, begging every day for a small meal to keep them growing through these harrowing times. \n\nThere was something odd about today, however. There was a teasingly warm smell in the air...soup. \n\nA group of monks and priests alike would flood the streets with a plethora of kitchen utensils and containers filled with what was supposedly the very same soup they had smelled. Lucky bunch they were... praying to God and getting fed for it. \n\n"Oh ye peasants! Gather ‘round for your plight ends today!" shouted Izvekov to the masses as he began quickly approaching a seated man, placing a container in front of him alongside a slab of black bread. \n\n"Christ bless thee..." He whispered into the man’s ears before quickly going back upright to continue his shouting \n\n"Our lord hears your prayers and begs, and he answers with our presence! Fill your bellies today and rejoice, for we did not forget you or your sons!" \n\nThe beggar would look down at his soup, and a small smile would tug against his lips"
 GAY.28.a: "... and He will give you an Arm"

 GAY.29.t: "Cut Out The Lying Tongue"
 GAY.29.desc: ""No man stands above God!"  \n\n"NO MAN STANDS ABOVE GOD!!!" The communist militiamen, hands tied behind their back shouted as loud as they could, repeating the words of the Warrior Monk marching in front of them from side to side, the Order’s militiamen standing at the ready, their rifles aimed at the apostates. The cold rain hammered against the communards’ heads, many having been beaten prior to being stood against the wall. \n\n"For he knows all!" \n\n"FOR HE KNOWS ALL!!!" Some of them, especially the commissars, did not repeat the words or only mouthed them, looks of disgust spread upon their faces. \n\n"And I give myself unto the Lord!" The warrior monk stopped and turned to observe the line-up in front of him, the disgust of the commissars mirrored on his face. \n\n"AND I GIVE MYSELF UNTO THE LORD!!!" Some of the less ideologically hardened went into hysterics, screaming the line several times, over and over. \n\n"For only he can judge the truth within my heart!" \n\n"FOR ONLY HE CAN JUDGE THE TRUTH WITHIN MY HEART!" \n\nThe Warrior Monk raised his hands, "Amen, Brothers! Let ye be judged by Saint Peter!" and the militiamen opened fire, bullets ending all, the calm disgust, the disgruntled exhaustion and the terrified hysteria. \n\n"Well, that is all the Communards dealt with..." The Warrior Monk turned to the riflemen, the flame that burnt with his tirade extinguished, replaced by boredom."
 GAY.29.a: ""Get those Fascist scum here, I want this over with.""

 GAY.30.t: "A New Messiah"
 GAY.30.desc: "Pavlov looked over the pages laid out on his table, the weak light of the candle illuminating his room. Unfortunately, some alliances stood only in the face of great danger. Under the terror of the Russian Anarchy, Antipin and Pavlov had a compromise, for only Pavlov could balance all of the competing interests and low diplomacy of the Anarchy, and only Antipin had the grit and fanaticism to keep it at bay, Izvekov’s muttering about liberty kept low by the horrors surrounding the Order’s lands. \n\nBut now those pressures were gone, and Pavlov could feel, with terrifying clarity, how day by day, the Order split further and further apart. Izvekov’s whispers of degenerate liberalism had grown into roars of people on the streets, his supposed freedom clouding the minds of the flock. Antipin’s simmering has turned into flames, the stomping of jackboots down the streets becoming ever more audible and the hateful calls to cleanse Russia no better than the fascists he wished to crush. \n\nIt was only Pavlov now, only he could preserve the Order’s purity. Nay, the Luciferian roots of these political manipulators shall not touch his order. It is the Holy text that led him and the people through these dark times, and it shall be the Holy text that leads them out of it. A nation under God must stand under Him, not for political agenda and pathetic ideology. \n\nSlamming down his fist on the table, Pavlov would stand up, his soul filling with determination."
 GAY.30.a: "For He shall choose his favourite Son."

 GAY.31.t: "The fate of Vagner"
 GAY.31.desc: "Pavlov paced up and down the small office. \n\n"Why won’t you believe me Kirill? The people want his demise, burned alive at the cross for his crimes against o holy Russia and orthodox faith." \n"I know Mikhail, you don’t need to say it so many times. But he’s 20 years old! He’s practically a child Mikhail! He’s yet to even fathom what to do in life, this punishment is too rash." \n"How can you humanize such a creature? Who knows what murderous thoughts go on in that twisted mind of his, if you could even call him a human!" \n"I’ll agree with you on something, his high command should be executed. They’ve committed crimes worthy of death penalty in any country and have aged well enough to know what they did. But burning someone to death is just cruel, who are we even to punish them if we do the same?" \n"All of them have committed sins of the highest order and should be punished with utmost ruthlessness! I understand your concerns Kirill... but what is needed must be done. Here have this." \n\nIn front of Pavlov was a collection of photos from Antipin, detailing every atrocity committed by the Brotherhood. Rape, murder, paedophilia... He shuddered just looking through them. Who could ever commit such monstrosities? \n"By the Lord..." \n"How do you feel now? Any better?" \nHe shook his head in disbelief and felt a cold numbness. \n"Do you want me to ask Izvekov, Antipin?" he said, rubbing his head regretfully \n"He agreed. And if that couldn’t convince you, an angry mob outside was waiting. And if you don’t mind, the execution date will be next Sunday." \nPavlov started to sweat and looked around nervously twiddled him thumbs. \n"Very well Mikhail, you can leave now" \n\nAntipin prepared to leave, but upon touching the handle, turned his head slowly and gave him a concluding look, a meaningful look, as if to give shame, and Pavlov did feel that way. He sighed depressingly and Antipin walked out."
 GAY.31.a: "The Lord's Justice"

 GAY.32.t: "The Last Judgement"
 GAY.32.desc: "Vagner sobbed through his dislocated jaw, breathing in, each exhalation burning from the cracked ribs. His hands, now numb from the ropes struggled slightly as he looked around desperately through his swollen eyes. They have been beating him for days, but several hours ago, it stopped, and he was dragged outside and tied to the stake. \n\nSomebody walked up in front of him and cleared their throat, the murmur of the gathered crowd quietening, "Judas sold his Master for thirty pieces of silver..." Something foul-smelling, chemical, was splashed at the Fyurher and Vagner coughed and squirmed as it stung on his wounds. "But this wretch has sold his brother for less!"  \n\n"This snake has blasphemed not only against the Lord, but against his very own nature!" With the clacking of the jackboot, something rough fell at the Fyurher’s feet. Looking down, he would make it out and refused to believe it. Firewood, stacks of firewood. \n\n"HEY STOP! STOP! HOR AUF VERDAMT! I AM THE FYURHER!-" \n\n"He has slaughtered his own and crawled into bed with Satan himself!" The crowd began to rouse, laughs and insults crashing against them. "And there is only one way to cleanse such dirt off of the soul, Brothers! A baptism! For this is the first root of the fascistic menace we shall remove from our Motherland, it shall not be our last!" \n\nLooking up, and sniffling, Vagner froze. An unbearable light stood before him, his face cracking with malice, a lighter in his hand. "G-god..." \n\n"LET PETER JUDGE HIS SOUL!" As the flames of Hell consumed the fascist, the howls of the Warrior Monks rose to a new crescendo, Antipin could not stop his smile."
 GAY.32.a: "A baptism by fire."

 GAY.33.t: "The Offer Sent by Heaven"
 GAY.33.desc: "As the priest steps across the border, he is immediately greeted by royal guards. But before they can even ask him a question, he starts speaking: \n\n"Go with God, friends. I am here in peace, and I am here to present to you an offer from His Holiness of the Order! I request you to bring me in front of His Majesty." \n\nHours later, in an unknown park in an unknown town, the priest and the Tsar meet in utter secrecy. \n\n"What is it that you were sent here for?" "His Holiness looked upon your lands with the gentle eyes of a shepherd, and he sees you have been led astray. But by his generous glory, he offers you a choice: Do you want to submit yourself to Satan and continue your wrong, blasphemous way, or will you let God rule over you all, and submit yourself to him?" \n\nThe tsar stares at the priest in confusion. "So you demand subjugation?" "If that’s what you want to call it, then sure. But it would be subjugation to no man besides God. You are allowed to take your time to think, naturally. I will stay in town for a week, and I humbly expect an answer by the end of my stay. May you walk with the Lord." With those words, the priest walks off."
 GAY.33.a: "Devilish audacity..."
 GAY.33.b: "...or a godly opportunity?"

 GAY.34.t: "The Response"
 GAY.34.desc: ""Your Holiness! The messenger is back in town already!" Pavlov rises from his chair. "Really?" He hurries towards the gates, filled by worry of what might have happened. Did they chase the priest out of the country already? \n\nExhausted, he arrives at the meeting point. However, the priest is smiling. Did the Tsar actually accept? \n\n"Go with God. What news do you bring?" "Your Holiness, the Tsar has already accepted after half a week! He told me he had a vision last night, convincing him of the righteousness of our cause!" \n\nPavlov feels his heart rise in his chest. A big step towards earthly legitimacy was made today: The tsar himself submitted to the Lord. God is with him, and he’s more convinced of that right now than ever before."
 GAY.34.a: "Peace in God."

 GAY.35.t: "The Response"
 GAY.35.desc: "Nervously, Pavlov waits at the border. The anointed week ran out, and he is expecting his messenger anytime soon. Was he killed? Did they accept? Did they refuse? Thousands of thoughts are running through his head, however, he calms himself and patiently waits for the response to arrive. \n\nHours later, the priest comes running from Vyatka, chased out by the laughter and mocking of the military. No words need to be said. The tsar refused to submit himself and his lands to God. \n\nSatan has prevailed this time, but he will be stricken down by the fury of the Lord."
 GAY.35.a: "May the Lord have mercy on them."

