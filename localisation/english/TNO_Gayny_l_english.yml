 ### Ideas ###
 GAY_warrior_order:0 "Warrior Order"
 GAY_warrior_order_desc:0 "For centuries, Russia was the defender of the One, Holy and Catholic and Apostolic Church, but the Tsars have grown lax in their duty, and the Lord struck them down, sending pestilence over pestilence over our land as punishment for their decadence. But we, the Order of Saint George, have understood that the Salvation of Russia lies in returning to Russia's roots as a land of faith, and by reviving the Faith we will gain the favor of the Lord; and with His Favor comes the fortitude necessary to smite all enemies and reclaim Russia from the invaders and from the Red Scourge of Communism."
 GAY_crippling_famine:0 "Crippling Famine"
 GAY_crippling_famine_desc:0 "The lands controlled by the Army are in no way rich. These last months, the situation spiraled out of control, with hundreds of deaths each day that passes. If we wish to endure the hardships of warlord Russia, the Army must act now."
 GAY_beacon_of_russian_orthodoxy:0 "Beacon of Russian Orthodoxy"
 GAY_beacon_of_russian_orthodoxy_desc:0 "The Army is the last state that represents Russian Orthodoxy with pride. We will not falter against the infidels."
 GAY_march:0 "Sound the Charge!"
 GAY_march_desc:0 "Heretics, all around us! Our warriors are emboldened by the righteous cause they fight for - Saint George will bring us victory!"
 GAY_rebuild:0 "Rebuilding Efforts"
 GAY_rebuild_desc:0 ""
