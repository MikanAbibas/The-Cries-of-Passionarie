 GAY_the_republics_army_desc: "Thanks to our army, we were able to reunite Western Russia. However, with this new massive territory, we need to manage, the army will have to undergo many surgical reforms to make it into a proper Russian army that the Republic needs. To need an army that can reclaim our country all the way to Magden, we will need to change the current religious militias into a massive, modern army."
 GAY_organising_our_forces_desc: "Just a few years ago, we controlled only a tiny bubble of territory. Now we hold onto almost all remaining Russian territory west of the Urals. Unsurprisingly, this took a heavy toll on our army organisation, with our forces stretched severely thin within our reconquered land. Our Military leaders will establish new supply chains and outposts to reorganise our men. We will also train new regiments so we can properly protect ourselves from any elements that wish to destabilise us."
 GAY_study_american_training_methods_desc: "While we slowly create a new army for our Republic, it’s become clear to us that we need new standardised training methods if we are to form a formidable army. We shall look to the American army and study their training regimes. We will use our contacts in the United States to request American advisors to train our men and to send some of our own men to the States to be personally trained by the American War Machine. If the Reich is to be destroyed, it will be done by the world’s free nations."
 GAY_arm_our_soldiers_desc: "Weapon development in Russia ground to a halt when the Bolsheviks were effectively curb-stomped by the Reich. What was left was shabby workshops which made guns which were made from parts of other guns. We ourselves even just took whatever guns we could, with little standardisation. We need new standardised weapons for our men. Our gunsmiths will create a new automatic rifle based on the old Kalashnikov rifle from the war with the Germans, which will be put into the hands of every regular solider in our army."
 GAY_mechanise_our_infantry_desc: "Ask a soldier to run 50 miles, he won’t be there until the moon has risen. Ask a truck driver to drive 50 miles, he’ll be there in an hour. The Russian territories are massive, to the point that men travelling by foot is a waste of time and resources when we can drive them much faster over a much larger area. With new truck assembly plants being set up across the country, we purchase a fleet of trucks for our men. With these new wheels, we can move our men around the front with lightning speed."
 GAY_psychological_preparation_desc: "A rifle is only useful in the hands of a man who’s willing to pull the trigger. We need our men to pull that trigger without hesitation or fear. We need men who will be daring soldiers ready to sacrifice themselves for a United Russia. We will drill into our men's heads that they must be prepared to fire on fellow Russians in order to reclaim our country and then on the Germans to drive them out of Moscow. When the clock strikes for the stampede east, our men will be ready, psychologically driven and determined."
 GAY_our_republics_finest_armour_desc: "During our conquest of Western Russia, we had almost no tanks, barring a few captured by other warlords. The only statelet that was able to mass produce tanks was Chernyakhovsky in Gorky, and even he fell eventually. However, the lack of tanks for many warlords provides us with an opportunity. If we are to produce new tank divisions for our army, this will give us a massive advantage as their sheer firepower can wipe out whole squads of men. These tanks will be the first ones over the Urals to the reunification of Russia."
 GAY_armed_disciplined_and_ready_desc: "A man in the Republic's army a few years ago would’ve had a gun created in 1941, quivered at the mere sight of the enemy and had no means of transportation. Now this same man has a brand-new rifle from the gunsmith benches, is mentally prepared to shoot any enemy to Russia in sight and can hop on a truck to wherever he’s needed. If he’s lucky, this man may even be able to ride atop one of the army’s tanks fresh off the assembly line. Our men are ready, and our enemies are not."
 GAY_restructuring_the_high_command_desc: "Thanks to our great generals, we were able to sweep away any opposition we met. However, some of these generals have ‘Radical’ ideas on religion. Many of these same generals are also loyal to Antipin. If we keep these men in charge, they could become a destabilising factor in our Republic. To prevent this, we shall replace these nutcases with more competent men, who are still loyal to God, but who will keep the security of our nation first and foremost."
 GAY_the_rules_of_war_desc: "Everyone has a story of soldiers that were supposed to protect, committing atrocious crimes against them. Burned villages, mass graves, extortion, we have all been subjected to the whims of disloyal men, even a few of our own men were reported as complicit in such crimes. We will write new rules of war for our men to follow, and they will follow. To enforce these rules, we will also ensure whistle-blowers can report wrongdoing by our soldiers. We are the protectors of this land, we must act like it."
 GAY_outmaneuver_our_enemies_desc: "A few generals have proposed a tactic on how to deal with the warlords in the east once we begin our march. They proposed that we utilise our trucks and tanks in the army to outflank and outmanoeuvre any enemies in our way. At first, they’ll think we’re only attacking in front of them, but soon they’ll discover we’re attacking them from their ideas and even behind them as well. Speed is key, and soon we will be driving circles around our foes."
 GAY_forcing_a_breakthrough_desc: "One of the newly promoted generals has devised a solution on how to face our enemies. He’s proposed that we produce large amounts of artillery and shells to destroy our rivals and their positions before our troops even fire a round. We can soften up or even defeat our enemies before our men rush in and finish the job. Those defences are helpful when they’re intact, but they won’t protect them against anything once we shatter them to pieces."
 GAY_dominate_the_skies_desc: "The Skies of our country have been empty ever since the last German bombing raid after Hitler’s death. During our conquest, planes were still a rare sight. Thus, we will finally set up an air force, and this air force will be the largest in Russia. We will overwhelm our enemy with the sheer volume of planes we have."
 GAY_strategic_bombing_desc: "We all remember the destructive power of the German Bombers, destroying everything and anything they could find. However, we can learn from this. We now know of the power a single bomber does. We will set up a new air force whose main priority will be the bombardment of enemy positions. Once the declaration of war has been sent, our planes will fly into the skies and destroy anything useful the enemy has. We will adapt."
 GAY_lions_led_by_lions_desc: "Our restructuring of the army’s high command and reform of our military tactics have been a stunning success. Previously, some of our men were blinded by faith and zealotism. Now we have competent men loyal to the Lord and to the Republic. Previously, we had no tactics, all our men did was run at the enemy. Now our men have proper plans and tactics to follow, while pilots will assist them from the sky. We have come a long way to get to where we are now."
 GAY_at_the_protection_of_liberty_desc: "Once upon a time, we were simple followers of God, with no nation, no proper army, just some religious militias and loyalty to the lord. Now we have a real army, an army loyal to God, loyal to the Republic, and most importantly, loyal to Russia. Our followers range from the private who has finished his training, to the lieutenant commanding his first raid, to the airman ascending the sky once again and finally to the General planning the cross over the Urals. We have come far, we have overhauled our army, but our values and loyalties still remain."
 GAY_the_worlds_eyes_upon_us_desc: "After the fall of the Soviet Union, most of the civilized world didn’t exactly shed a tear for the Russians, and the years of turmoil they were thrown into. So it comes as a big shock to us, that several free nations of the world expressed their happiness over our emergence as a regional power, capable of reuniting Russia. Their help would be beneficial to us, so let us play their diplomatic games, and make as many friends as possible!"
 GAY_our_friends_in_america_desc: "United States of America. They were the first to extend their interest in our endeavors, despite our history as a theocracy and only having a fledgling democratic institution. It is clear that their struggle with Japan, and, more importantly to us, Germany, needs a major wildcard. A wildcard like Russia. We will help them understand that they need us, and we will naturally accept any help they can provide in our righteous cause."
 GAY_the_aid_of_uncle_sam_desc: "Because of the aforementioned struggle that the US has against Japan and the Nazis, and also not entirely trusting us, they can’t exactly throw their entire weight behind us. Fortunately, there’s plenty of help that can come from under the table. Our secure communications line with the US has the CIA on the line, and they got guns they are raring to give to allies of democracy. Spasibo, Dyadya Sam!"
 GAY_invite_their_corporations_desc: "One thing the Americans love us more over the other warlord states is our desire to enter the free market. Brands like Coca-Cola and McDonalds have already sent out letters expressing their interest in expanding their operations in our nation. Thankfully, unlike the corporate hellhole of Japan, they don’t demand every ounce of our natural resources, all they desire is profit, which we are more than happy to indulge in as well!"
 GAY_united_in_freedom_desc: "We are quite different from our American friends, especially in our history, and our cultural values. However, it is true when they say when opposites attract, though in this case we attract with something else as well - our aspirations towards freedom. Though we may have been quite alien to each other, our people quickly view each other as friends and allies, clearly, we are a match made in Heaven!"
 GAY_european_diplomacy_desc: "Europe’s relations with Russia had always been strained, to put it lightly, plenty of which can be attributed to our Orthodox Faith. Times of religious conflicts have long since passed however, and now most of Europe is under the German jackboot. Thankfully, a few free nations survived, and establishing healthy, and hopefully friendly, relations with them will help us tremendously."
 GAY_overtures_to_the_pope_desc: "The Great Schism happened almost nine hundred years ago. Since then, Roman Catholics and Greek (and then Russian) Orthodox churches have ceased any and all communications, denouncing and deeming each other heretical from that point forward. The time has come to thaw our relations, as Christianity is slowly becoming completely irrelevant in the modern world, it is simply a fact that we need to come together for the sake of our Lord, and hopefully put aside our differences."
 GAY_a_bridge_to_italy_desc: "One might look at the nation of Italy and see a nation of enemies - the birthplace of Fascism, which used to be allied to Germany and even fought against us in the Great Patriotic War. Our Patriarch however, sees a nation of potential friends - from war to football, the people of the peninsula are a wall against the Devil to the North, and so we shall sway them to our cause, whether they want to or not."
 GAY_denounce_the_german_devil_desc: "Monsters, jackals, madmen. There are many choice words for the stain on world’s history that is the German Reich and their people. Followers of an ideology fueled by hatred, they carved a deep wound in our world, and many of their people’s hands shall always be stained with blood. It is our duty to remind them that Germany needs to be purified, and the people liberated from the Nazi menace, so they can see the light of our Lord, and turn to the beacon of democracy."
 GAY_our_place_in_the_sun_desc: "There were plenty of people who could not really put a finger on what to think of our nation, a theocracy-turned-democracy, and yet, having only just now gained access to international relations, we have enjoyed plenty of friendly exchanges with the Free World, and this is just the beginning. We have left our less-than splendid isolation, and now we look optimistically towards the future."

