 GAY_unfurl_the_banners:0 "Unfurl The Banners"
 GAY_unfurl_the_banners_desc:0 ""
 GAY_the_great_struggle:0 "The Great Struggle"
 GAY_the_great_struggle_desc:0 "We are surrounded by heretics! We shall fight until our last breath, for the glory of Christ!"
 GAY_power_of_god:0 "Might of the faith"
 GAY_power_of_god:0 "Seeing might of the true faith, thousands upon thousands inspired souls flock to out cause"
 GAY_surrounded_by_heathens:0 "Surrounded by Heathens"
 GAY_surrounded_by_heathens_desc:0 "We are surrounded by heathens, but they will never crash us, for God is with us!"
 GAY_administration_purged:0 "Administration Purged"
 GAY_administration_purged_desc:0 "Weed in the garden... Heretics, heatherns, atheists, satanists and others have infiltrated our administration. But thankfully father Antipin knows how to deal with them."
 GAY_military_purged:0 "Military Purged"
 GAY_military_purged_desc:0 "During the godless bolshevik rule, many heathens have gotten into the army. We lost to Germans because of them. Thankfully father Antipin already took the steps required to deal with it."
 GAY_kingdom_of_christ:0 "The Kingdom of Christ"
 GAY_kingdom_of_christ_desc:0 "We are finally living the way God intended!"
 GAY_one_against_all:0 "One Against All"
 GAY_one_against_all_desc:0 "Our destiny draws near! Far from the once-warlord state we were, we are now the last bastion of true Christian morality in the Russian lands, fighting for its soul against impossible odds.\n\nDo not rest not a minute, do not give in to fear, and do not forget what we are fighting for! We are fighting for Christ and the Holy Spirit, against godlessness and satanism that has infested our Motherland. We are fighting for every last one of our family, neighbors, village and city. We are fighting a great holy war, one whose ferocity hasn't been matched in centuries. We are fighting to redeem Russia! So grab your weapons, your spirits, and let the storm break loose!"
