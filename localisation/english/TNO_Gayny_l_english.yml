 GAY.149.t: "The Saint, the Righteous, and the Damned"
 GAY.149.desc: "The once intricately sewn clothes of the false tsar were now mere rags, torn and covered in mud all over. It was not easy to be judged by the same people you’ve demanded submission from. Not when one of those people was Antipin.\n\nAlas, it was not time to regret or dwell on your past choices. It was time to face their consequences.\n\nAntipin was angrily stomping around the weak and frail body of the beaten up tsar, shouting, swearing, and most importantly, praying that he Vladimir may be damned by god for eternity. He did all this for good reason, however. Let’s not forget, the royal family abused all sorts of power, including the Church, and this was not about to happen again.\n\n“Take a seat Mikhail-, we won’t be able to make any sort of proper level-headed judgement if you keep screaming about.” Pavlov spoke as his back was gently resting against the walls of Vladimir’s cell.\n\n“Judgement?! What sort of judgement does this filth need? I regret even dragging his body to this decrepit chamber, and that says something about all this, Kirill, it says-” Before he had a chance to continue, Pavlov had already begun speaking again.\n\n“It says that he will die an unfair death. He has sinned, yes, but so has everyone else, including yourself and I. Does that mean we will spare him judgement? No. But it does mean that he will be publicly judged rather than be killed like a coward here. We are a nation, Mikhail, not a clique or a gang of thugs. We do things in order.”\n\nAntipin took in a deep breath hearing Pavlov’s reply. He knew he could not change his mind, whether he liked it or not. Why should he be mad anyways? He was going to be killed regardless... right?"
 GAY.149.a: "The Tsar will face justice."
 GAY.149.b: "The Tsar will be judged by God."

 GAY.150.t: "The Empty Throne"
 GAY.150.desc: "Kirillovich surveyed out the palace window. His eyes felt heavy. He had tried to sleep but was too consumed in thoughts of his family. It had been days since he had proper contact with them; they were being held separate from him, maybe to make him desperate? He didn't know. These people had no love for his lineage. To them, God had smitten his family down for failing in their duties to him and, along with them, the people of Russia. Were they wrong?\n\nHis Uncle before him had neglected his title, using it as a means to accomplish little but his own personal enjoyment, and what about him?\n\nThe nephew of that man? The man who declared eternal friendship and cooperation with the Germans, who, even when he was off their leash during the West-Russian War, rallied collaborators and helped push the German offensive, and for what? A scrap of territory to call his kingdom in a ruined land, dealt by those he thought he could use to establish his rightful rule?\n\nHe ground his teeth, still trying to act as if he had composure even when nobody was around. \n\nHis mind had trailed back to his family; what would happen to his wife, Leonida, or daughter? Would they treat them as the Bolsheviks had his Uncle's family, or simply just leave them in the ruins to die of starvation?\n\nHe leaned further toward the window and opened it. As he did, he noticed one of the armed guards sent by the Order staring up at him, his eyes slightly squinted, refusing to look away. Kirillovich huffed; it was almost comedic. They were watching his every move, not letting him escape their punishment, not that he thought he could anyway. He closed the window and slightly waved as if to say, "Yes, believe it or not, I'm still here." Then he backed away. At best, he was a traitor to them; at worst, he was a heathen. He just hoped that their judgment, "God's" judgment, didn't pass down to his loved ones. Just as he was about to lose himself again in his own thoughts, a knock came from his door. How formal, he'd honestly expected them just to barge through the door if they needed him. While he walked over to the door, Kirillovich structured himself; he at least wanted to appear like he was still collected. He reached one hand out and opened the door, and as he expected, one of the guards stood in front of him, looking at him as if he was inconvenienced just to be before him. \n\n"Vladimir, I have a message for you."\n\nKirilovich swallowed; this was it. Fate had finally arrived.\n\n"What is it?"

 GAY.150.a: ""
 GAY.150.b: ""
 GAY.150.c: ""

 GAY.151.t: "Baptism By Fire"
 GAY.151.desc: "Inside the Great Cathedral, Antipin waits as his followers fill the large room. He surveys the cathedral and sees that all eyes are on him, except for his most loyal followers who are praying before the altar. His followers are eagerly awaiting his important announcement.\n\nAntipin clears his throat, "My people! I come before you to announce a vision given to me by our Lord and Savior Jesus Christ. As we all know, we live in troubled times, and the world around us is becoming more dangerous as time goes on. So we have sought new ways to defend ourselves."\n\nThe crowd became curious and they all talked to each other. Antipin paused and waited until everyone had calmed down.\n\n"Yes, you are all wondering what I mean. We don't need protection from anyone, but from our own Lord and Savior! But of course our Lord and Savior needs some support, and that's what our holy soldiers are for. But no, I do not want to unveil a new holy army, not a new law to govern our lands. No, it is something that will intimidate the world, including the German devils in the West!"\n\nNow the crowd was even more fascinated. What could it be? What did Antipin have in mind to protect the people? What could possibly frighten the Germans, who seem hell-bent on exterminating the Russian people with extreme bloodlust?\n\n"My most loyal followers, I come before you to announce that our holy kingdom will begin its own nuclear program!"\n\nThere was silence at first, but suddenly the people erupted in cheers. At last, the ultimate deterrent will soon be theirs. Their safety is now assured.\n\n"Yes, indeed! Soon we shall harness the power of the atom so that we may cleanse our rightful lands of the Teutonic filth and show the world the divine might of our kingdom! I dare those German devils to come to our country and get cleansed by the wrath of God!\n\nThe crowd cheered so loudly that Antipin felt the ground shake beneath him. He motioned for silence from the crowd.\n\n"Yes, it is something to celebrate. But this process will take time, and our security and power are not yet guaranteed. We are still feeble and weak against the sinners of the world. But I assure you, it will be done and our kingdom will rise on the world stage and become a formidable power. Thank you, my most faithful followers, and peace be with you."\n\nAntipin hurriedly leaves the stage. Soon he will be able to wield the power of the atom for their holy crusade!"
 GAY.151.a: "May the world fear our divine might!"

 GAY.152.t:0 "A Redemption"
 GAY.152.desc:0 "Antipin has offered mercy when his army took Komi. He had seen his efforts and seeing him as a brother in Christ, offered him a place of generalship, if he would only seek forgiveness. He had and he accepted communion with all his soul. He had confessed his sins and had been made holy once more. \n\nThe Lord had heard his trespasses and had forgiven his debts. Men were not as forgiving as God however. There were many who would continue to view him with suspicion for years to come. \n\nThey would spit on him. \n\nMock him. \n\nAnd lay him low. \n\nThis did not trouble him, for these were mere trials for him. He walked the path of the Lord, he always had, and he would enjoy treasures in heaven for his suffering. And he was still sure, despite efforts to dissuade him, that he would find what he was looking for on the Earth. \n\nThat the Lord would guide him to the true Tsar of Russia."
 GAY.152.a:0 "Just Wait"

# Events - RUS WORLD NEWS 


### RUSSIAN REUNIFICATION


#Decisions
GAY_purges_category:0 "Purge the unholy"
GAY_purges_category_desc:0 "We are advancing greatly in our monumental effort to cleanse Russia from enemies of god, but still there is much to be done. We shall burn out the heresy, with no doubt, no pity, no mercy! IN THE NAME OF GOD!"
GAY_purge_agnostics:0 "Purge Agnostics" 
GAY_purge_agnostics_desc:0 "Agnostics do not reject the god directly, but they neither reject ideology of our enemies. They are not with us, and therefore against us, and therefore must be purged in the name of God almighty and our Lord Jesus Crist."
GAY_purge_kostroma:0 "Purge Kostroma's witches"
GAY_purge_kostroma_desc:0 "There goes a rumor, that Kostroma became a safeheaven for witches, time to change that. Every suspicious woman in the region will undergo swimming test."
GAY_purge_viatka:0 "Purge Viatka's liberals"
GAY_purge_viatka_desc:0 "It came to out attention that there are some priests in Viatka who teach to much about love and devotion and to little about divine cleansing, let us purge them and their followers."
GAY_purge_samara:0 "Purge Samara's collaborators"
GAY_purge_samara_desc:0 "Samara is the place where traitorous fascist collaborators once resided. We will track down their remains and force them march in the wide fields... ...in Spanish shoes, till they expire!"
GAY_purge_perm:0 "Purge Perm's nazis"
GAY_purge_perm_desc:0 "We have already got rid from most of the nazis residing in Perm, but some reports indecate that few remain, we will crusify them on their crooked crosses."
GAY_purge_tyumen:0 "Purge Tyumen Bolsheviks"
GAY_purge_tyumen_desc:0 "Godless Bolshevik sympathizers still remain in these lands, it is time to change that."
GAY_purge_omsk:0 "Purge Omsk"
GAY_purge_omsk_desc:0 "While the methods used by the Black are godly, while their ideology is close to true cristian morals, they are still astray and must be delt with."
GAY_purge_yugra:0 "Purge Yugra"
GAY_purge_yugra_desc:0 "Thy shall not steal!"
GAY_purge_gayny:0 "Purge our brethen"
GAY_purge_gayny_desc:0 "Some priests close to Antipin have deviated from the godly path and doubt out latest policies. Send them to hell!"
GAY_purge_intelectuals:0 "Intelectuals to be Purged"
GAY_purge_intelectuals_desc:0 "Blessed are the ignorant. Knowledge is a poison. An intenectual today, an atheist tommorow. Antipin solution to this is killing all the students with grades 2 standart deviations above from the mean(or more)."
GAY_purge_atheists:0 "Purge the atheists"
GAY_purge_atheists_desc:0 "Atheists are just ungratefull acne on the face of earth, and must be dealt with accordingly,"
GAY_purge_heretics:0 "Purge the herecy"
GAY_purge_heretics_desc:0 "Heretics do not deserve to be crusified, being close to our symbol would be to generous. Antipin decided to kill them via Scaphism."
GAY_purge_heathens:0 "Purge Heathens"
GAY_purge_heathens_desc:0 "Heathens shall be buried alive, being a fertilizer is the best thing they can do for us anyway."
GAY_purge_sinners:0 "Purge the sinners"
GAY_purge_sinners_desc:0 "Dante was a heretical Catholic, but in his divine comedy he described the sins well. If anybody will be caught, or suspected to be comminting one of the sins described there, will meet a slow and painfull death on a cross."
GAY_purge_unloyal:0 "Purge the unloyal"
GAY_purge_unloyal_desc:0 "The unloyal individuals will be hanged, or executed by a firing squad."
GAY_purge_skeptics:0 "Purge the skeptics"
GAY_purge_skeptics_desc:0 "A skeptic, like an intelectual is a potential atheist. A skeptic is potentially unloyal. Any skeptic must meet a death by drinking a poison."

