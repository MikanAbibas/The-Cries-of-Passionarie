 GAY_holy_and_desc: "Blessed be the meek, for they always find a way to the top!\n\nThis victory signifies a turning point, a mark - that we are truly on the road to true prosperity, in our Holy nation! And while there would always be those that defy our benevolent ways of reform and change, it is an undeniable fact that we have triumphed! Amen to that!..."
 GAY_free_desc: "...One thing we should always treasure, in times of war, in times of tumultuous peace, surrounded by aggression, passive and active, is that we are, at the end of the day, all human. Humanity, that is what we should strive towards, as creatures of our Lord. And that is what I vow to accomplish for each and every one of you - Equality in Humanity. Freedoms that every Human rightly deserves!"
 GAY_hear_the_unheard_voices_desc: "Not every person is easily heard. This much is obvious, but it is even more evident now than ever before, after we have united the region. The bureaucratic strain on our newly emerged state has got the people in a vice-like grip, and we simply do not know the extent of our problems. To that extent, we must quickly set up radio communications, as the first step towards making life better for everyone."
 GAY_every_man_is_equal_in_the_gods_eyes_desc: "Given our past enmity with the zealot clique under Antipin, over the question of heathens and many other things, as well as our efforts to liberalize society, it comes to no surprise that those very same heathens have now been silently waiting for our decision over their status in the Republic. Their patience should be properly rewarded with rights, however, we still need to make it clear that the True Faith shall always take precedence, especially in politics."
 GAY_a_place_for_everyone_desc: "Our Republic is a rare sort - in a region chock full of fringe ideologues and those who have long since renounced any sort of Faith due to despair, we promote a message of democracy and belief in our Lord and Saviour. Naturally, those that want to live here have a hard time acclimatizing to this radically different environment, and if we want to avoid this becoming a major problem for us, well, we need to find them something to do, and ease their integration in society."
 GAY_god_loves_his_children_desc: "Writing was never my strong suit, I will admit. However, what I have begun to write here is not some novel. This piece of paper, insignificant as it may seem, carries such weight that will rival even the Civil Rights act in the US, and, thanks to our nation’s nascent status, we don’t have to deal with some uppity racists blocking our path, or waiting for congress to finally pass it into the legislature. It is as our Lord intended - human rights being essential to our society!"
 GAY_allow_parties_desc: "It hasn’t been long since our Holy Republic was proclaimed, a democratic institution at its core. Our Patriarch, a believer in democratic ideals he may be, still is pretty much a dictator, which he detests greatly. A one-party democracy, this nation will not be! Introducing differing opinions will not only benefit our image, but also promote healthy competition, to always strive towards something greater."
 GAY_ordinary_men_rule_desc: "Going back to how bureaucracy handled during the warlord period, it was deeply flawed. In hindsight, it only succeeded thanks to it being handled by our priests, we knew our people well, and they knew us. Now however, the number of bureaucrats in the clergy is simply not enough, and many are expressing outrage that only the clergy can work in this position. The solution is obvious - allow members of our flock to take up positions of bureaucrats, proven by merit."
 GAY_let_the_people_decide_desc: "With rapid expansion - comes growing pains. Our previous administration, if you can even call it that, was one of centralized rule. An archaic system it may be, it was the superior option in dealing with the problems of a small warlord state. Those times have long since passed, and we must change with the times: to solidify our rule as rightfully democratic, and simply to do good by our people, we must decentralize, and let the people decide what is necessary for them!"
 GAY_united_desc: "...What I feel is the worst wound we have endured, one that is unacceptable to ignore - there are generations of Russians being born without ever knowing a concept of a united Russia. Never even crossed their innocent minds, for they grow up used to this senseless conflict between fellow Russians, taught whatever ideology they happen to be born into, and it will lead to further bloodshed… I make a vow to you now, as your Patriarch, unified Holy Russia will prevail!"
 GAY_food_for_every_mouth_desc: "Starvation nearly strangled us to death not too long ago, which we managed to avoid thanks to timely measures being taken - giving our reserves back to the community. Right now we have the luxury we could only dream of in the past - owning all of Western Russia, and being able to farm and do animal husbandry without the fear of German air raids destroying all our efforts. We however still need to take care that our farmers don’t work on an empty stomach until the first crops form, as well as feed the now-expanded population. Using the reserves of defeated warlords should suffice."
 GAY_roof_above_all_heads_desc: "Homelessness is one of the most dire outcomes for an average Russian during these trying times, and, unfortunately, it has almost become commonplace. Either driven from their home by others, or simply having lost their home to a Nazi air raid, these people need assistance, and fast. Establishing a series of shelters, and especially community homes, is necessary if we want to have proper time to restore damaged or destroyed buildings, and build new housing districts."
 GAY_work_for_the_unemployed_desc: "In times of peace, and war, jobs are essential. With how many new territories we’ve conquered, there are two hundred times as many people left with no jobs, left by their former masters to fend for themselves. Of course, we are not heartless. Figuring out each new territory’s strong suits, and creating jobs that favor them - that is our invisible task, and we will carry it out for those people’s sake, and for the sake of Holy Russia."
 GAY_a_bright_future_for_our_children_desc: ""
 GAY_eye_for_an_eye_desc: "Judiciary system in Western Russia, until now, was basically non-existent. Capital punishment, penal slavery, incarcerations without trial - all were common occurrences throughout the warlords. The Lord frowns upon such barbaric practices. Justice needs to be served according to the crime committed, therefore a proper, and fair, judiciary system needs to be established."
 GAY_help_the_poor_desc: "Poverty is something I cordially despise. No one deserves it, and no one benefits from it, barring certain truly deplorable individuals. Our reforms don’t come cheap, it is clear as day. What is also clear however, is that they were all done for your sake, my flock. Further reforms will come, of course, there is still room to grow as a nation. And as we grow, the poverty rate will continue to drop, as people’s lives get better and better!"
 GAY_tooth_for_a_tooth_desc: "Healthcare. A word forgotten by most of the Russians, it faded into obscurity as medicine became a rare, expensive tool for barter and personal prestige, rather than something produced for the populace. In our regional government such petty handlings of vitally important medicine are unacceptable. We need to bring back healthcare, and give every person the right to receive medical treatment."
 GAY_protected_desc: "...The warlord era. This ideologically-fueled conflict between fellow Russians, a stain on our history. It defined the last decade, as we were pitted against each other while Hitler’s shadow loomed over us, terrified us to the point of only trusting those closest to us. Now the standard-bearer of the Crooked Cross lies dead in the ground! Those of you who still feel threatened by his devilish cronies, hear my vow: as your Patriarch, I will do everything in my power to protect you!"
 GAY_organising_the_council_desc: "The Patriarch’s word is absolute - even in our democratic government this much should always hold true, though perhaps not directly, passing every matter through one person never went well. Therefore, the Patriarchal Council shall be established, for state matters of utmost importance. It shall always be headed by the Patriarch, to ensure stability, and foster loyalty."
 GAY_a_federalised_republic_desc: "Our nation is proudly stretched across Western Russia. To facilitate a well-functioning government however, we need to establish autonomy - centralisation will actively harm us due to our size. A federative system is clearly the obvious choice for us, and will help out our struggling bureaucrats with managing the nation."
 GAY_bless_the_men_desc: "Many conservative-minded clerics that used to make up our government grow increasingly concerned that we will abandon the ways of God chasing after more and more liberties, and eventually secularize. We will not, and we shall make that abundantly clear - a Holy Russia is only as Holy as its citizens, therefore only Orthodox Christians can be allowed to participate in the government and represent us, lest we forget our ways."
 GAY_representing_the_people_desc: "Many liberal-minded individuals that have since come to represent our government grow increasingly concerned that we will roll back to being a dictatorship of the clergy, not paying any mind to the woes of anyone who is not a True Believer. We will not, and we shall make that abundantly clear - a democratic institution is only as democratic as its representatives, therefore we must always think of our people first, lest we stop being virtuous."
 GAY_at_service_of_god_and_the_people_desc: "We are, first and foremost, an Orthodox Republic. Faith is what drives us towards greater things, and our representatives need to show everyone their faith, even if only with a prayer:\n\n“Almighty God, our Help and Refuge, Fountain of wisdom and Tower of strength, who knows that I can do nothing without thy guidance and help; assist me, I pray thee, and direct me to divine wisdom and power, that I may accomplish this task, and whatever I may undertake to do, faithfully and diligently.”"
 GAY_our_state_secured_desc: "Certain people in direct opposition to our rule spelled certain doom for us, that we would fail to establish a functioning government over all of Western Russia, having been one of the smallest states in the region. How wrong have they been, for our Patriarch has delivered unto us not only a stable government, but instilled hope for the future in the hearts of our people, and plenty of desire to improve. Praise be!"
 GAY_the_holy_government_desc: "It brings me great joy to see so many different bright minds come together as one for the sake of our people. Governing over the bountiful land of Holy Russia will not be easy, but what I’ve witnessed recently grants me confidence that we can reunite Russia, and accomplish great things, with time and effort. And of course, you can always expect me to work for your sake, twice as hard!"
 GAY_unconditional_faith_desc: "...And here we are. As we strive towards greatness, guided by the light of our Lord, we have become quite the sight to behold. However, reforms are a fickle thing - yesterday’s liberal is tomorrow’s conservative, and we cannot become complacent. Progress, by definition, always moves forward, and we simply mustn't stop working on fixing our mistakes, of past and present. So follow me, dear people of our Holy Russia, for the Lord smiles upon us!"
 
