 GAY_mechanic_explanation:0 "MILITARIZATION \nMilitarization is primarily increased and decreased via this screen. Higher militarization will increase army bonuses at the cost of economy and stability. Lower militarization will do the opposite. \nTERRITORY CONTROL AND FACTIONS \nThis mechanic is primarily controlled from the decision tab. The Army of Saint George is contains three main power blocks. The common people, the clergy of the Church, and the wealthy few. Each group controls a certain amount of territory, a certain amount of strength, and holds varying degrees of loyalty to the central government. Higher loyalty will lead to larger bonuses from the factions while low loyalty will result in maluses. Factional territory control confer bonuses scaling with percentage held. However the state also gainst bonuses from holding territory. If the proportion state controlled territory drops too low, massive debuffs will be incurred. \nCertain concessions may also be granted to the factions. The effectiveness of these scal with factional strength. These may be granted or revoked at any time, but revoking concessions lowers loyalty. Be aware, factions with low loyalty confer debuffs when holding concessions rather than buffs. \nYou may ignore this mechanic if you choose, but at the very least don't let state controlled territory get too low."

