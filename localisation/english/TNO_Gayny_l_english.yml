 #focuses
 GAY_our_light_in_the_darkness:0 "Our Light in the Darkness"
 GAY_our_light_in_the_darkness_desc:0 "Death, famine and despair. The people of Gayny suffer day after day raids from the Red Devil and the Nazi Scum... And despite all of this, they press on. The Grand Schema must take action, the Army will prevail! \n\nHear, ye servants of Satan! The children of God shall not succumb!"
 GAY_with_the_lord_above:0 "With the Lord Above..."
 GAY_with_the_lord_above_desc:0 "Since before the times of the Revolution, people have prayed. Since before the war with the Nazi demons, people have prayed. And now, after the final collapse of Mother Russia, people pray. Pray to our Lord and Savior, for he gives Hope, that even now, in the most downtrodden of times, where nothing seems possible anymore, Russia will be reborn, Russia will prevail against all its enemies, and the Russians will return to God as His truest children."
 GAY_and_the_enemies_around_us:0 "... And the Enemies Around Us"
 GAY_and_the_enemies_around_us_desc:0 "As it always was in the struggle of the True Faith of Orthodox Christianity, there are enemies all around us. The supposed free democracies, which seeks to make Orthodoxy irrelevant in its "Modern Society". Communism and Nazism, fringe schools of thought that made the Russian people into dogs that actively hunt us down for standing against their savage dogmas. Finally, the old enemy of the True Faith - muslims, infidels, enemies that have stood against Christianity the longest, and will go down the hardest. And though our enemies are numerous, we will stand strong, for the Lord!"
 GAY_from_ploughshares_to_swords:0 "From Ploughshares to Swords"
 GAY_from_ploughshares_to_swords_desc:0 "It is truly regrettable to admit, but our brave warrior monks are not enough to stand against everyone who would want us dead. The time has come to employ the help of Russia’s most numerous peoples - simple peasants. These people have suffered a lot in recent times and in the long past, so it saddens us to call them from their homes and families to war, and not as prepared as our standing army, but these people chose this land as home for a reason. They are God’s faithful, and will bear through all his greatest challenges, as they always have."
 GAY_for_one_day_we_must_fight:0 "For One Day We Must Fight"
 GAY_for_one_day_we_must_fight_desc:0 ""Hear ye, hear ye! \nBlessed Russian people, hear this call! \nWe must take up arms in service of God! \nFor the enemies are awaiting their moment to strike, \nAnd will not hesitate to destroy you and Holy Russia in service of their damnable beliefs! \nBlessed Russian people, hear this call! \nHear this call and take up arms! \nFor one day, we must fight!"
 GAY_for_the_army:0 "For the Army"
 GAY_for_the_army_desc:0 "Up until now our armed forces only ever consisted of a small contingent of warrior monks, which are fierce warriors in their own right and fervently guard our countryside, but, when compared to the forces of our larger neighbors, they’re no more than a militia. Significant changes must be made if we hope to stand our ground against all threats."
 GAY_for_the_lord:0 "For the Lord"
 GAY_for_the_lord_desc:0 "While our nation is as Holy as the hallowed grounds of Jerusalem for those of us that are true believers, there are those that would question us at best, and actively seek to destroy us at worst. In these trying times we must prove to the skeptics and naysayers that we are God’s true messengers of Salvation, of Hope, and of Absolution. In time, these efforts will bear the most bountiful of fruits - Belief."
 GAY_for_the_people:0 "For the People"
 GAY_for_the_people_desc:0 "One of, if not The most important tenets of Christianity have always been charitability and selflessness. Helping those that are poorer than us, those more unfortunate and not as well off as us, is undoubtedly important, for it is those things that cement us as a pious and righteous nation, worthy of the title as The Land of Christ."
 GAY_revise_our_tactics:0 "Revise Our Tactics"
 GAY_revise_our_tactics_desc:0 "Most of our army fight using self-taught tactics of small skirmishes and being led by the more experienced militiamen, coincidentally some of our generals are learned in the tactics of the Great War - trenches and human wave offensives. If we want to modernize in the face of constantly evolving warfare we must bring these people together and devise new tactics which will be used by our army henceforth."
 GAY_raids_on_the_reds:0 "Raids on the Reds"
 GAY_raids_on_the_reds_desc:0 "Smaller army force, less weapons and other equipment, and less experience. This is a comparison we have to the vile WRRF, followers of Communism, enemy of the Faith and any pious Christian. Though, our disadvantages could be used in our favor. We will conduct raids on these snakes, small but precise strikes, aiming for their supplies and equipment. In our hands, their equipment will be used in a more "righteous" way, yes."
 GAY_a_message_of_redemption:0 "A Message of Redemption"
 GAY_a_message_of_redemption_desc:0 "It is painfully obvious why the beautiful nation of Russia is no more - losing Christianity. Communist revolution brought many terrible things, but the worst of all evils was the dismantlement of the Orthodox Church in Russia. It was because of this that we lost to the Nazi bastards. Many people agree with us, and this leads to people coming in droves to our state, knowing that fervent belief and Christianity will bring back Russia from the ashes."
 GAY_grow_the_flock:0 "Grow the Flock"
 GAY_grow_the_flock_desc:0 "In many ways Christianity is dependent on the work of preachers and missionaries, for they were the ones that, in the ancient history of our religion, preserved the faith, and kept it burning bright within the hearts and souls of many different people. So it stands now, that their work needs to start in full force - bringing Faith to those questioning themselves and in the need of direction, if we hope to achieve anything."
 GAY_feed_the_hungry:0 "Feed the Hungry"
 GAY_feed_the_hungry_desc:0 "Truly, we face our Lord’s toughest battle yet! In no small part due to the abominable bombings from Nazi Germany the lands of Western Russia are becoming less and less habitable from the soil turning more and more impossible to cultivate any crops, even the hardy potatoes. Because of this, starvation hit our flock with full force. We can’t send people to create new farmlands in a safer place until we sustain the hungry populace, therefore we should open the stocks of conserved food underneath our monasteries to help our people."
 GAY_underground_workshops:0 "Underground Workshops"
 GAY_underground_workshops_desc:0 "Nazi bombings are the bane of every Russian’s existence on the lands of Western Russia. They’re quite simply the Devil’s sickest joke - not enough to wipe us from the face of the Earth, but just enough to destroy any and all operations we want to set up. The solution is simple, though costly - we need to construct facilities under the safety of our soil, away from bombs and able to focus on creating important equipement."
 GAY_fortify_the_monasteries:0 "Fortify the Monasteries"
 GAY_fortify_the_monasteries_desc:0 "Our beautiful, wonderful places of worship - monasteries. Long have we used their sturdy walls, relied on them for protection. Ever since the times of Kievan Rus, churches and monasteries were the most protected of places in most cities and villages. Understandably, they aren’t as effective now that everyone has possible access to explosives. Still, they’re as sturdy as a star fortress, and we must capitalize on that by upgrading their defensive capabilities."
 GAY_clear_the_heavens:0 "Clear the Heavens"
 GAY_clear_the_heavens_desc:0 "Many people come into our land. Many of them are wayward travelers that look for shelter, food and drink, and may want to stay here as our citizens. But there are those that sneak into our land with sinister purposes, seeking to destroy us from within. Given the fragility of our small nation, we are forced to enforce vigilant patrols, stopping all that come into our Sacred Land, and figuring out their identity, by force if necessary."
 GAY_defenders_of_the_faith:0 "Defenders of the Faith"
 GAY_defenders_of_the_faith_desc:0 "Militia, rag-tag band of monks, unreliable bearded guys with some PaPaShas. This is how we were called not too long ago. Now, none but the jealous enemies call us these things. We have become warriors of God, shieldbearers of Christianity, defenders of the Faith. Our people feel safe, while our enemies dread the day when they have to fight us. Hallelujah!"
 GAY_our_sins_washed_away:0 "Our Sins Washed Away"
 GAY_our_sins_washed_away_desc:0 "Christianity was famous for absolving sins of those that fought in Crusades, a righteous war for the Holy Land and the advancement of the True Faith. Problem is, we cannot declare a Crusade, because we are Orthodox, it is not in our nature. What we can do however, is promote the ideas of redemption through battle. Our cause is righteous, regardless of what skeptics say, so fight for God! Fight, and Heaven most surely awaits you on the other side!"
 GAY_fight_for_your_salvation:0 "Fight for Your Salvation"
 GAY_fight_for_your_salvation_desc:0 ""Stand tall, proud warrior of Christ! Your pious march and fervent chorus strikes fear in the Unbeliever, the Heretic and the Devil! Listen now, and know that your virtues separate you from a simple trooper. Unlike them, who fight for their petty king of some Godless land, you are a true believer, you are a shield of Christianity, and should you perish on the battlefield, Heaven will wait for you on the other side, gates open, angels calling! Amen!""
 GAY_fight_for_the_grandschema:0 "Fight for the Grand Schema"
 GAY_fight_for_the_grandschema_desc:0 "Father Pavlov knows it best of us all, that we might be Russia’s only hope for Christianity. No other warlord in Western Russia loves the Faith, no one else holds it dear to their hearts and souls. It is thanks to Father Pavlov that our people live and pray in the safety of our churches. We must give no quarter to those that seek to disrupt that peace, that innate right to Belief."
 GAY_slay_the_dragons:0 "Slay the Dragons"
 GAY_slay_the_dragons_desc:0 "Fervent are our priests. Pious are our flock. Righteous are our warriors. Blessed are we, for we have truly turned ourselves into a force to be reckoned with. Now, we turn our eyes to the outside. Before, we were those that suffered under the hungry eye of those on our border. Time has come to turn this around, and turn our piety into a cleansing fire against all those that are against us."
 GAY_anoint_the_sick:0 "Anoint the Sick"
 GAY_anoint_the_sick_desc:0 "Disease, one of the deadliest works of the Devil, is crippling our population. Lack of food, clean water and acceptable living conditions are the prime reasons why people are getting sick, and they are all problems we have unfortunately faced. Though, as it has been since time long ago, churches and monasteries have always tended to the sick and infirm. We will continue this tradition, and help our people recover."
 GAY_their_plates_before_ours:0 "Their Plates Before Ours"
 GAY_their_plates_before_ours_desc:0 "Our charity initiative to feed our population has begun, but already it seems like changes need to be made. Right now we are not providing enough food for everyone, every third person is left with an empty plate, which is unacceptable! A true Christian’s duty is to provide for his people, and so we will enforce fasting in order to provide for everyone that needs it more than us."
 GAY_show_them_true_mercy:0 "Show Them True Mercy"
 GAY_show_them_true_mercy_desc:0 ""
 GAY_the_light_of_Christ:0 "The Light of Christ"
 GAY_the_light_of_Christ_desc:0 "Not all enemies deserve death. There are those that fight us not because they truly hate us, but out of misguided beliefs, because they were told to, or simply because that is all they ever knew. For these pitiable souls we simply must provide a chance at redemption! For the Lord is merciful, and has always forgiven those that show true repentance."
 GAY_the_lords_justice_for_russia:0 "The Lord's Justice for Russia"
 GAY_the_lords_justice_for_russia_desc:0 "There was a time when our soldiers were seen as nothing more than grunts that are only out there for themselves. Such a sad and regrettable time has now passed, and our warrior monks are finally seen for what they are - guardians of the people and those that protect the weak, selflessly and without falter. We will most assuredly not stop there however, as we pray to, one day, be the Guardians of Holy Russia."
 GAY_hope_for_the_sinners:0 "Hope for the Sinners"
 GAY_hope_for_the_sinners_desc:0 "When we started our religious conversion efforts alongside our charity initiative we did not even hope that the results of said efforts would create such fervent belief in our nation as something that will surely reconquer Russia. And now even those that have committed crimes, like thievery and robbery, have come out in hopes for redemption, for a second chance at life. Praise the Lord! This is truly a sign that we are guided on a path to restore Holy Russia!"
 GAY_so_we_may_build_jerusalem:0 "So we may Build a New Gerusalem"
 GAY_so_we_may_build_jerusalem_desc:0 "Some may say that ambition is not something a true Christian should exercise. This is true, humility is a virtue. But these are not times that favor a humble priest, in fact God tests us in a million ways, and we must exercise ambition. Not the sinful, but pious ambition, to one day create a truly Faithful land, a new Holy Land."
 GAY_we_came_not_with_peace:0 "We Came not With Peace..."
 GAY_we_came_not_with_peace_desc:0 "Everyone takes priests lightly these days. Gone are the days where we were treated with respect, rivaling only that of the Tsar. The dreadful Revolution spat in the face of the Church, made people quickly forget the importance of Orthodoxy, and disgraced even the Patriarch, as someone no more important than a rat..."
 GAY_but_with_a_sword:0 "... But With a Sword"
 GAY_but_with_a_sword_desc:0 "...No more! The time has come for retribution, righteous punishment of those that would look down on us, and laugh at the importance of the Church! Our people are all of the same mind - God must return to Russia. And this return will not be peaceful, as regrettable as that is. Enemies of the Faith will fall, we will make sure of that!"


