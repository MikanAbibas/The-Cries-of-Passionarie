 GAY.37.desc: ""
 GAY.37.a: ""

 GAY.38.t: ""
 GAY.38.desc: ""
 GAY.38.a: ""

 GAY.39.t: "Scapegoat"
 GAY.39.desc: "Who was it... Who failed in their crusade against the old and the reactionary? The Red General closed his eyes. Had he not given everything he could? His family, his cross, his home? No, it could not be him. \n\nWas it the proletariat, so malleable that they turned their back on the way forward? Had they undermined the communist cause? The Red General shook his head. No, a teacher does not blame his students for their failures. \n\nHad they not killed enough preachers and blew up enough churches to cow this menace for good? Had Bukharin not gone far enough? No, they had torn this rot out of Russia well, it returned of its own accord. \n\nWas it the infantry? The tank regiments? The air forces? Opening his eyes again, the Red General looked left and right at the line he was in, up against the wall. The medals shone in the morning sun of Arkhangelsk as many others like him stood calmly, facing down the monk rifles. \n\nIn the end, he thought, it must have been us that failed. We did all that made sense, all that seemed right and yet- \n\n"LET PETER JUDGE YOU!" \n\nBANG!"
 GAY.39.a: "The Red General never found who to blame."

 GAY.40.t: "The Replacement"
 GAY.40.desc: ""Attention! Line!", a very common set of words in boot camp. On a less momentous day, Sergeant Ivanov screaming this would mean hell for the conscripts; what usually follows the old bastard yelling is brutal and demoralising, due to his unique beliefs on the various ways decaying uniforms and terrible food help "build character" for the men. However, today was different. The man facing them was not Ivanov, a balding and saggy relic of a bygone era. The privates instead faced a far younger man, physically virile and with a holy glow in his eyes. \n\n"Men, I am Major Popov," he said with a noticeable Southern Russian twang in his voice. "Due to certain ethical and financial reports, Sergeant Ivanov has been dishonourably discharged and is facing a military tribunal in Vyatka. You answer to me now. I have learned of the horrible treatment you faced under my predecessor, so there are going to be some changes around here. Is that clear?" "Sir yes sir!" \n\n"Good. First of all, if any of you have any cases of neglect or disrepair to note, write it down; I’ll see if it’s major enough and inform my superiors." The recruits were shocked, could they finally sleep in beds that don’t randomly break in two? "Secondly, if any one of you has experienced or witnessed abuse at the hands of another one of you, make a report and file it immediately. I do not want any of you to kill each other out of hatred in the Lord’s line of sight!". Private Feldman smirked, he could finally get that asshole Zubov in front of a judge for all the times he’s beaten him for being Jewish. \n\nPopov went on to show the men a surprise: fresh crates of everything the soldiers could dream of. New radios, up to date weaponry, pristine uniforms, and field rations that didn’t taste like spoiled dog food; it was almost as if Christ himself had come and given these gifts to them for all their hard labour."
 GAY.40.a: "For He doth not suffer man anymore, to go unto God in judgement."
 
 GAY.41.t: "Onwards, To Heaven"
 GAY.41.desc: "Porfiry slammed the clip into the gun and opened fire at the target. One, Two, Three, Four. Not a single miss. The drill commander’s voice echoed through the gunfire. \n\n"Mathew 5:9!" \n\nThe row of Warrior Monks repeated, "Blessed are the peacemakers for they shall be called sons of God!" \n\n"And who are the peacemakers!?" \n\n"WE ARE!!!" \n\n"AND HOW DO YOU MAKE PEACE!" \n\n"BY STRIKING DOWN THE WARMONGER!" \n\n"AGAIN!!!" \n\nPorfiry slammed another clip into his gun and opened fire at the target. Mathew 5:9 was drilled into them every day. They would rise with it, they would eat with it, they would open fire with it, soon maybe the drill sergeant would make them shit with it. But with each repetition, his hand became steadier, his mind was clearer, and the goals were simpler. \n\n"Blessed are the peacemakers!" \n\n"FOR THEY SHALL BE CALLED SONS OF GOD!" \n\n"FOR HOLY RUSSIA!""
 GAY.41.a: ""FOR THE KINGDOM OF CHRIST!""

 GAY.42.t: "A Mission to Purify"
 GAY.42.desc: "God works in mysterious ways, that is what he was told by the monks when he was recovering from his wounds. He sometimes gives, and sometimes he takes away, but it is all in his plan. \n\nAntipin stepped onto the hastily built wooden stage in the centre of Gayny, and took a deep breath, his gaze grabbing each of the hundreds, nay, thousands of followers that have gathered in front of him. He won, just like in the Biblical verses, the truest and devoted rise above, and rise he did. Izvekov would screech no more, Pavlov would not bite at his ankles at every turn. \n\n"Brothers!" Raising his hands, he could feel the living mass strengthen and quieten, the crowd like a wild animal, under his control, "We have withstood many trials!" The crowd murmured. "The Lord has heard our prayers and strengthened our forts when the apostates marched at our doorstep! The Lord has heard our prayers and led our bayonets at the hearts of the enemy! THE LORD! HAS HEARD! OUR PRAYERS! AND WE! SHALL! ANSWER!" \n\nThe crowd would respond with a thunderous scream, fists rising and tears of reverence flowing down hundreds of cheeks. "Our cause is just! God has led us through the hostile West and we shall continue! Soon Holy Russia will be free of the heretical yoke and the Kingdom of Christ shall bless this Earth and its soldiers will baptise the fascist beast IN FLAME!" \n\nAs his words rolled through the streets, Antipin could feel God smile down upon him. God may work in mysterious ways, but now Antipin knew one thing:"
 GAY.42.a: "God’s tools were in his hands."

 GAY.43.t: "Pandora's Box"
 GAY.43.desc: "The days of fighting across Komi’s harsh forests have led the soldiers to a dingy, decrepit place known as the ‘Syktyvkar Arsenal’. This arsenal was just like any other ordinary arsenal, really, meaning it once housed many weapons and munitions. However, it holds a dark secret. \n\nDeep into the arsenal, lies a chemical weapon’s storage. Gases such as Zyklon and mustard gas are carefully contained in their respective storages... A dangerous set of unorthodox weapons, but one that could prove vital to the military success of the Order’s next operations. \n\nOf course, many of the religious advisors, regardless of their rank, believe that using such weapons is not only a crime against humanity, but even go as far as to say it is a major sin to use them. Chemical weapons cannot be controlled, and do not differentiate between friend or foe. On the other hand, High ranking military personnel believe that this arsenal is critical in ensuring many victories to come. \n\nOne voice on this is missing, however. The Grand Schema’s. Does he wish to keep such forbidden weapons at his disposal?"
 GAY.43.a: "Never! We shall not indulge in the sins of our forefathers!"
 GAY.43.b: "In order to succeed and destroy our enemy, we shall use it. May God have mercy on their souls."

 GAY.44.t: "Back on the Path"
 GAY.44.desc: "Though success tasted sweet, Pavlov’s victory procession was solemn. In the end, as much as the new leader of the Order wanted to jump and scream, "I have beaten them all! ALL!", he instead walked at the head of the procession followed by his flock, his eyes half-closed, his brows furrowed. \n\nOne’s pride must not blind oneself, and the hefty Holy Scripture he carried in front of him symbolised that. Even if Izvekov and Antipin and their followers were heretic demagogues, they were still fellow Orthodox Christians. It was a great tragedy for the Order to have had such internal strife divide it. \n\nBut now they were together; now they were stronger. No secularist filth would taint their order, for God was under no ideology. There would only be the Scripture and the Patriarchate that interpreted it. \n\nAnd so the solemn procession continued, marching through cities, not a single shout of congratulations, not a single step out of line. Only crosses, icons and Scripture in hand."
 GAY.44.a: "For God needs only prayer."

 GAY.45.t: "A Farmer's Share"
 GAY.45.desc: "Despite being a simple 7th-generation farmer, Osip Viktorovich has seen a great deal of things in his life. From Imperial Russia to Revolution to Collapse, he had seen the whole spectrum. Or so Osip thought. \n\nUnder Komi’s supposedly democratic regime, life was comparatively calm when compared to the fascists over the border. He could farm and give a share as tax, and no one would bother him, not the bureaucrats, not the Tzarists, not the fascists. But then the Order of Saint George arrived. \n\nHe saw the flames in the patrols’ eyes, the share they demanded grew, as well as the demands for the proof of his family’s orthodoxy. First, they demanded more than half of his crop, then they demanded his only son for the army, and then his daughters for the nunnery. \n\nAnd while Osip clenched his jaw and averted his eyes, his son marched along with the patrols, shouting their hymns, filling up with the same hateful flame. And while Osip pulled at his hair helplessly, his daughters disappeared into monasteries, never to be heard of again. And now, only his land was left, only his labour. For, what can a mere peasant do against God himself?"
 GAY.45.a: "God giveth, and God taketh away"

 GAY.46.t: "The Call for Order"
 GAY.46.desc: "God was on their side. The Army has managed to subdue all the false warlords of West Russia, and Saint George's holy work can begin. \n\nBut first, a particular matter needed to be resolved. \n\nDespite Pavlov's capability in leading the Army to victory, the two pretenders and their followers still voiced dissent. Antipin with his wicked belief, and Izvekov with the seeds of the West's corrupt liberalism. Pavlov would not let them destroy his plans. \n\nHe called for a creation of a conclave. The Russian Orthodoxy shall be united once more, and a Patriarch would be elected, himself. \n\nFortunately, Pavlov already managed to acquire a solid base. The order of monks would vote for the Episcopes in forty-nine days, a blessed number for such an important election. The newly appointed conclave shall then convene and hold another vote for the Patriarch, and God willing, Pavlov's gambit would work. \n\nPavlov left the vestibule, there's work to be done..."
 GAY.46.a: "... And convincing to do"

 GAY.47.t: "The Ladder Back to Eden"
 GAY.47.desc: "To sit upon your fellow’s shoulders and to beat him with a stick for his misdeeds, to equate yourself to the Lord in your despotism, that would be too prideful for a godfearing man. And yet, to Izvekov’s disappointment, both Pavlov and Antipin had committed the grave sin of considering themselves above the People. \n\nPavlov imitated worldliness while trying to crown himself the sole authority behind the scenes, no better than the Pope, and that one at least was explicit in his leadership, unlike the grey snake that took up control of Gayny. And then there was Antipin, the one who thought himself more qualified than the Lord to dish out punishment, who blasphemed about raining fire and stomping the unfaithful into the ground. \n\nKindness. Man required kindness to grow; Izvekov was taught that since his childhood. And it seemed neither of the ex-communards had learnt that lesson as they were brought down by their own pride. But Izvekov will be different. The faithful shall choose their path as it was meant to be, and they shall march across Russia and return that right of choice to all."
 GAY.47.a: "Break your chains. We march unto Eden."

 GAY.48.t: "Spread the Word"
 GAY.48.desc: ""And so, the heathens marched upon Petrograd, and their satanic influence finally reared its ugly head!" The street preacher continued to wave the Scripture around, the crowd around him frozen stiff by the strength of his conviction. Some of the onlookers were as young as schoolboys, sitting in stunned awe; others were older, old enough to remember the Revolution, and nodded as the story continued. \n\n"German collaborators! Catholic swine! Muslims! Homosexuals! Pagans! ALL ROSE TO THE CALL OF LUCIFER HIMSELF!" The preacher’s speech was so quick and so loud that it was as if he was speaking in tongues. \n\n"And yet, Russia was not lost! WE are not lost, brothers and sisters! Just as all that is built on rot crumbles, so did Lucifer’s kingdom collapse, and the faithful prevailed!" Leaning back in ecstasy, the preacher would slam the Scripture against his forehead before pausing. \n\n"But we must not let the shards of the fallen Kingdom stay in Russia’s side..." The words were said with a whistling growl, the cleric leaning forward, his eyes wide and bloodshot, "It is your job to protect our land, to protect YOUR land, so that another 1917 may never occur..." \n\n"DO. YOU. UNDERSTAND?""
 GAY.48.a: "A resounding yes..."

 GAY.49.t: "Satan’s tool"
 GAY.49.desc: "Valery was sitting in his cell. Or, as he was forced to call it, his "Purgatory". Pain will cleanse him, death will save him. Or so the pastor said.  He had been in isolation for more than a few days; he lost count after the first. The scarce amount of "food" he was given came from a small opening at the bottom of the door. \n\nHe wrapped his arm around his knees and gently swayed back and forth. The only words coming out of his mouth since he was interned, forced to speak nothing else for the rest of his life: "Safety in God. Safety in God. Safety in God." Although at this point, the words held no meaning to him besides his endless suffering. \n\nHe was by far not the only one. The whole complex was filled with "dissenters", communists, fascists and everyone who dared disrespect God's plan. \n\nValery was absentmindedly scratching his arm, accidentally touching one of his "purifying" torture scars. "Fuck" he whispered. Hopefully nobody heard that. He listened at the door, but nobody seemed to have heard him. Valery sighed in relief. He can’t curse here, or his anguish will never end. Exhausted, he fell asleep. \n\nHours later, he was woken up by the sound of his cell door opening. This has never happened before, so Valery perked up like a dog. In walked the holy man himself: Mikhail Antipin. "A-Am I pure? Am I allowed to tread free before God again?" Antipin responded with the faintest of smiles. He closed the door behind him, and took out a pair of enormous tongs. "I was told that your traitorous tongue disrespected this holiest of places again. Thus I have come here to take away Satan’s tool, to banish him from you forever." \n\nWhat followed was screams, accompanied by the omnipresent whisperings of Antipin himself."
 GAY.49.a: ""Safety in God.""

 GAY.50.t: "Reform from Above"
 GAY.50.desc: "Pavlov sat in his chair, observing the walls and floor of his new "office". While many of the less devoted commanders under him suggested he get himself an office in an administrative building like the usual bureaucratic shmucks, he refused. Instead, the room in the biggest temple of Gayny was now also the head office of the Army’s leader. \n\nHere, besides the ringing of bells for prayer and the steps of deacons, it was silent, just as he liked it, perfect for concentration. The process of straightening the territory’s systems was not simple, but the Patriarch did not rest. \n\nLists of names, rolls of maps and economic reports sat on his desk as he toiled over Holy Russia’s transition to truly becoming Holy. It took careful judgement to subdivide the country into new, more efficient eparchies, let alone choosing their leadership. This would be the new sinew of the Nation that would glue the regions together and let Pavlov reach the top. And soon, just like in his office, the nation would know solemn peace and quiet."
 GAY.50.a: "Russia shall rest, awoken only by the prayer bell."

 GAY.51.t: "The Many-Faced Nation"
 GAY.51.desc: "Izvekov ruffled through the letters that he had received. If the nation’s people were to choose, first, he would need the consent of those who protect them, those who pray with them and those who feed them. And so, Izvekov would spend what felt like litres of ink familiarising himself with the leaders under him. \n\nSome were very accepting, many like Father Feofan had long despised how their people were treated, and the arrival of Izvekov was praised as a new era of Orthodoxy, the letters spilling over with praise and goodwill. \n\nOthers were coolly neutral, the previous order under Pavlov having satisfied them completely. The letter from Father Grigoriy, for example, was quite dry and curt, congratulating Izvekov on his ascension and expressing hopes that the new leader would not "needlessly rock the boat". \n\nAnd then there were those who did not seem to be in their right mind. Father Kirill sent back the head of a dead crow, stating that Satan would dine on Izvekov’s corpse if he did not cease his blasphemous governing style and reinforce true Orthodox values. \n\nLaying the pages out across the table, Izvekov would sigh. This was a rocky introduction, but at least his name and face were now known. The country did not speak in one voice; instead, he had to contend with many. But with introductions out of the way, he could begin convincing."
 GAY.51.a: ""Country, your Patriarch. Patriarch, your Country.""

 GAY.52.t: "Gathering Allies"
 GAY.52.desc: "Konstantin Katushev was pacing in front of a door, people inside were busy talking and he had the misfortune of arriving several minutes too late. "How regretful!" - he thought. Excitement over participating in a new democracy was palpable in Konstantin; he had all but lost any hope when The Army of Saint George took over Komi, and subsequently the rest of Western Russia. But, one thing after another, and here he finds himself with a personal invitation from Izvekov himself. \n\nThe door suddenly opens, and in it stands Alexander Medvedev. His demeanor was stoic and gruff, but he invited Konstantin in - "Your footsteps are louder than our speech, come in already." Sheepishly, he stepped into the room, and alongside Izvekov stood Milety Zykov, who only gave a glance of acknowledgement to Konstantin. \n\n"Wonderful," - said Izvekov - "I can finally properly state your roles in the up and coming government of our Republic. Konstantin, you have the pleasure of being our Foreign Minister, Alexander, your role will be Head of Security, and Internal Affairs, I trust your capabilities," - he chuckled - "and finally, Milety, you will be our Minister of Economy. Apologies for the haphazard role giving, Konstanin, but you missed the rest of our talk!" Izvekov let out a belly laugh as Konstantin, stumped, could only nod in embarrassment."
 GAY.52.a: "The excitement is still there, burning bright. Time for some democracy."

 GAY.53.t: "Divine Administration"
 GAY.53.desc: "Gleb Radionovich exchanged confused looks with his (used-to-be) superior, Vladimir Leonidovich, who, like him, could not believe what he was hearing. Both are respected bureaucrats, lived and worked in Samara for many years. Of course, no one could sit in one place for so long without some dealings done behind the scenes, some money changing hands, in order to keep the whole thing going in an orderly fashion. \n\nPavlov, who sat in front of them behind a simple desk, knew about it all. Every single person under them has personally begged him to help, as these crooks would rather be complicit in a crime like murder than to refuse a bribe, and raise wages even by a little. "Not only will you lose your position, henceforth you shall be prohibited from ever taking a job in this area of work. I will pray to our Lord that you can find a decent job. But I do not worry too much, after all, you and yours have quite the sum of money collected, no?" \n\nAs Pavlov smiled, it was transparent to the two that they were finished here. "Stupid priestly vows...Who can live without wealth?! This bearded shit didn’t even blink when we offered a bribe." - Vladimir thought, as the two of them left, red as a tomato, and a guard closed the door. Pavlov sighs, "Not something I thought I would do as a priest. I like it though, heh.""
 GAY.53.a: "Stopping corruption through divine intervention."

 GAY.54.t: "God’s Gift"
 GAY.54.desc: "Morning service was proceeding as usual. Afanasiy was in his element, he loved reading the Bible, and even more so he loved reading it to his small, but pious flock. Church of the Intercession of the Holy Virgin was situated on a small hill, quite some distance away from most villages, yet still people loved coming here to hear Father Afanasiy’s sermon. \n\nAfter the service was concluded Afanasiy led his flock outside. He was surprised to see a different priest standing outside, guarded by a different priest, only that one was outfitted with combat gear. "Greetings Brother! You must be Father Afanasiy, a pleasure to meet you. I come bearing great news! You have been selected by our Elder, Father Pavlov, to be Custodian of St. Nicholas’s Cathedral. We are aware that you’re the only priest tending to this church here, but it is too remote, the patriarchate unfortunately cannot afford to upkeep it with such a meager turnout of people. God deserves better, you know!" He then let out a chuckle. \n\nAfanasiy didn’t know what to make of it, and while stunned like this, his flock was shooed away by the guard. Next thing he knows, he’s already escorted by these two men to a car. What of his small church? What of his flock? He didn’t know. He couldn’t know. He only hoped that he will do right by the people he will soon do service for, as he did for his previous flock."
 GAY.54.a: "The Ways of God are Unknowable"

 GAY.55.t: "A New Shelter"
 GAY.55.desc: "Five columns of people in ragged clothing stood before a building, which had a "Grand Opening" poster placed onto a wall next to the door. The people were cold, shimmying with their feet while trying to stand still and wait, nervous and somewhat excited. If the town cryers are to be believed, this unassuming house is a shelter, waiting to be opened. \n\n"I haven’t slept under a roof with four walls in years" - Ulyana thought, a middle-aged woman that looked far older than she is. "I hope I get a clean bed" - Fyodor thought, a young man who lost his home during one of the Nazi bombings. Their thoughts were cut short by the slightly late arrival of none other than the Patriarch himself. Arriving with a team of caretakers who would run the place, and a couple of guards of course, he walked with certain pride in his step. \n\nHe finally stood before the doors, and, after taking out a key from his pocket, turned to the crowd with a small speech: "God’s faithful! I am here to deliver onto you - your just desserts. This is not the first community home I open, and it will not be the last! Amen!" After which he turned, unlocked the door in a swift motion of the key, and flung the doors open. "God, this never gets old" - Izvekov thought with a smirk."
 GAY.55.a: "Virtue always leads to good things."

 GAY.56.t: "A pillar of the community"
 GAY.56.desc: "Raheem is one of many citizens who want to make their community a better place. When he heard of an opening as a regional representative in his area, he told all his friends that he is going to apply. \n\nRaheem is a well-liked man, but there’s one thing which alienates him from everyone: He is a proud Muslim, thus seen as astray at best; and a national traitor at worst. Even so, his community is grateful to have him, even the most zealous Christians. So when he announces his goal, a lot of people are excited and promise to support him, as Raheem always has the peoples’ best interests at heart. \n\nOne week later, he sits in the waiting room at the office where he applied. He and five other applicants received the most votes. Now it’s up to Izvekov to choose the winner. The interviews are already over. Raheem is excited, he feels it went well, even though Izvekov raised his eyebrow when Raheem told him he’s Muslim. \n\nThe door opens with a creak. "His Holiness has decided." Izvekov steps out of the office and looks at every applicant. "First of all, I want to thank each and every one of you for applying for this job as a servant of god." He turns to face Raheem. "Mr. Amir, I concluded that you are the most eligible person for this job, especially with your reputation. However, I simply can not allow a heretic to hold this office. No matter how eligible you might be, it would be blasphemy to assign you. So I have to ask you to leave, and I will reveal my decision to the five other applicants." Izvekov faces the others, clearly not wanting to discuss this further."
 GAY.56.a: ""Return when you have reached true enlightenment.""

 GAY.57.t: "A Momentous Occasion"
 GAY.57.desc: "Izvekov was new to technology, especially the one with wires and electronics. It kind of intimidated him, the sheer scale of radio equipment that was set up. It was all for a very important reason though. After days of preparation, most if not all cities’ main streets had a powerful transceiver and a plethora of megaphones. \n\nHaving rehearsed the speech a couple of times, Izvekov checked the time. 12:00. It’s time. Stepping up to a fat metallic microphone, he spoke: \n\n"My fellow Russians. Father Izvekov speaking. We have come a long way since just a few years ago. Many of you would never imagine that this is where you would end up living, under the leadership of the army of Saint George, bringing Orthodoxy back to the importance level of a bygone era. Many of you dislike such a notion, it is no wonder, such a thing of the past must be unthinkable. \n\nWell listen to me now. Listen, for today marks the birth of the Russian Orthodox Republic! Not a nation that is archaic and fundamentalist, but one that is eager to evolve and change, go step in step with the modern world, and start a new, improved era for Christianity!""
 GAY.57.a: ""In the name of our Lord, Christ, and the Holy Spirit, Amen.""

 GAY.58.t: "The Choice"
 GAY.58.desc: "Tension hangs over the Order. The council has been talking for a few hours already. The most important choice in years is taken today. Who will lead the Order to godliness? \n\nWill it be Pavlov, the devoted scripture-lover, who wants to lead his People to a righteous, Bible-led state? \n\nWill it be the popular Izvekov, who plans to put Russia under an, albeit Christian, democracy led by godliness? \n\nOr will it be the righteous Antipin, who wants to fight heresy with a brutal fist? \n\nThe decision will be made today. All three camps are nervous, and the people staying in pubs to distract themselves, or marching on the street in support to their favourite. \n\nHours later, the head of the council finally steps out. Everyone waits with bated breath. \n\n"Good morning, fellow children of God. The council reached a verdict."
 GAY.58.a: "The Patriarch shall be..."

 GAY.59.t: "A New Prophecy"
 GAY.59.desc: "Hunched over his Bible, in a candlelit room, sits Pavlov. His entire focus is on the text, on his future if he becomes Patriarch. He seeks guidance in the Holy Text, a path forward, even a prophecy. \n\nSuddenly the door is flung open. His priest appears, out of breath: "Father! I apologize for the interruption - but the council has chosen you!" Pavlov looks up, taken aback, he stands up. "Truly?" Tears start forming in his eyes. He has been chosen to fulfill the Lord’s plans! \n\nJust hours later, he congregated in the middle of the town square with all his Followers and even non-believers who were interested to be converted. Holding the Bible tight to his heart, Pavlov emotionally preaches to the people. "My ascension under God will mark the beginning of a new prophecy - of a new age, the age of the benevolent Lord, the age of righteousness, the age of Life under Him!" \n\nHe raises his arms above the crowd and sanctifies them briefly. Then he continues. "The days ahead will require hard work, but I know in my heart that if we just trust in God, we will overcome all obstacles that will be in our way. We will liberate Russia, and put it under God, as one nation once again! Glory to the Lord!" \n\nThe people applauded loudly, some of them were crying. Pavlov smiles at them, shakes the hands of many attendees and then turns around to leave. But before he does, he leaves one of his personal Bibles on the floor for all to open and read."
 GAY.59.a: "For this day marks the beginning of a new era."

 GAY.60.t: "A New Dawn"
 GAY.60.desc: "Hushed whispers wander across the council. Antipin stands before them, with a triumphant yet god fearing smile. All across the lands, celebrations in his name are held. But just as countless as them are the hearts stricken with fear. Will he bring about a reign of benevolent godliness? Or will he start off an iron-fisted crusade of his own? \n\nUncertainty lies in the air, yet it is drowned out from all the cheering and laughing that Antipin’s followers loudly let out. Finally, after what seemed like an eternity, Antipin walks on the balcony to hold his first speech. \n\n"Servants of God!" \n\nThe crowd watched him in bathed breath. "As you are all painfully aware, our motherland is poisoned by heathens. Not even our Order is safe! I thank all of you for your trust in me. I vow to you, our lands will be purged from all Satanist parasites and wicked devils. Those who truly follow God have nothing to fear. For all the ones, who want to destroy our benevolent work - You will not win! We have God on our side! Come out into the glory of the Lord, or be stricken down by His righteous fury!" \n\nA thunderous applause erupts. Antipin bows before his followers, quickly prays for them and walks back inside. As the people dance on the streets, Antipin has only one thing on his mind:"
 GAY.60.a: "The hard work is about to start."

 GAY.61.t: "An Often Neglected Virtue"
 GAY.61.desc: "Slightly inebriated, Izvekov waltzes into his office. Another day of work, that, frankly, was getting way too monotonous for his liking. Sitting down in his chair, he decided to pull out a bottle from underneath the desk, holy water, to clear his head somewhat while the secretary is coming over with those damn papers needing signing. \n\nNot long after downing the bottle completely, the secretary, Nadya, comes in, and Izvekov notices the distinct lack of a mountain of paperwork. “Lord Above, is today my birthday? I can’t believe that there’s no papers!” - Izvekov chuckled. “Uhm, no, Father, I don’t think so. Today is a special problem that needs solving. I’m sure you’re aware of just how much poverty the warlords have left the people of Russia in.” Izvekov reclined in his chair and rubbed his temple a bit. - “Lord, yes.” - he sighed - “Give me some paper, please.” As Nadya is pulling a sheet from the middle of the long table, Izvekov is at the ready with a pen. \n\nNot bothering with giving this a title, Izvekov immediately outlines the points which need to be followed: /n1) Create a food kitchen in every district, those worked when we were a warlord ourselves. /n2) Start a public works campaign that pays small amounts of money, enough to get these people started. /n3)Build community homes in each major city, starting with Arkhangelsk, because it’s cold there. \n\nSigning the paper, Izvekov hands it back to Nadya, who smiles briefly and says:"
 GAY.61.a: "“God bless you, Father”"

 GAY.62.t: "A Chance For All Of Us"
 GAY.62.desc: "The prison cell that Andrei was held up in was crammed and dirty. Rats were running in it as the awful smell burned his nostrils, so much so that he almost couldn't breathe. The gray glued-together bricks gave off a paradoxical feeling of lifelessness, giving the ultimate implication that this was indeed, just a rest-stop towards the end itself. \n\nFitting for someone like Andrei. A soldier of the Revolutionary Front having been captured during the so-called "biggest raid the Army of Saint George had ever conducted on the Red Army." He was not lucky enough to have been captured there and like many of his comrades before him, he was going to face the firing squad, before probably being condemned to Hell by the God he believed was not real. In either case, he lived a long bittersweet life and he was above all tired. \n\nAt least he would finally be freed of his earthly shackles and see his family aga-. \n\n"Mr. Mikhailov." an calm but echoing voice came out of the hall, most prominent in his right ear. The lights revealed what Andrei would have mistaken for a Red Army officer if it wasn't for the badge of the Russian Orthodox Church on his sidearm, "The Patriarch has given you clemency. You will be transported out of this prison and into a rehabilitation center tomorrow." \n\nAnd before he knew it, the officer was gone. Only the same sight as before remained as he took in what his captor just said. Rehabilitation? Was this a trick? Or was he really getting spared? \n\nRegardless of how he felt, today Andrei would live, but whether or not that rehabilitation would be successful in the end is all up to him."
 GAY.62.a: "For indeed, the Lord is the most Merciful"

 GAY.63.t: "Opiate to the Sickle" #
 GAY.63.desc: "Kovalev remembered. He was marching through the Far East, the snow in his face, the Whites hidden in the forests as his men dutifully followed. He reported his friend, an Old Bolshevik, to the KGB as Bukharin tried to keep hold. He was there at Moscow, his bloodied palms on the rifle, waiting for the fascist scum to come. \n\nKovalev remembered everything now, and it all suddenly felt so small. He saw all those people, killing, dying, vying, and suddenly all the ideological conditioning was gone. There were no Whites, Reds, Germans, or Russians. Only souls. \n\nAnd so when General Kovalev of the WRRF felt himself resurface, back into consciousness, the pull of his broken body dragging him back to reality, the agony felt like too much. \n\n“Well, this one is still alive.” Antipin stared at the crucified general, absentmindedly flipping the Scripture’s pages, “Let's begin.” \n\nThey nailed them to the crosses at midnight, the mad Patriarch himself present to witness the Red Generals receive their punishment. But Antipin didn’t leave; he simply stared at the dying, his face lighting up with each cross going silent as the older and more infirm generals let out their last breaths. \n\nNow it was only Kovalev left. \n\n“God was merciful enough to let you die under his light.” Antipin grunted as he stood up, closing the Scripture and turning around to witness the sunrise, “Are you thankful?” \n\nKovalev felt his vision darken as the first rays of sunlight hit his eyes, his chapped lips uttering one last phrase:"
 GAY.63.a: "“Yes... I am...”"

 GAY.64.t: "Holy Redemption" #
 GAY.64.desc: "The chapel in the village close to Skythvkar was the center of Othodoxy for the village's inhabitants ever since it was built so long ago. It was far from the biggest, only a small building built in stone and bricks with the Orthodox cross laying above it. The small square windows, surrounded by wood, were the only sources of light for the inside, shining on the old oak pew chairs that sat next to the left and right sides of the building, leaving an opening in the middle. \n\nAnd that opening, that day, was used by an feverishly devoted visitor of the chapel. The committed man, religious to the bone and a readied servant to the Tsar, had used this chapel to refine his faith and to feel God's love on him. And tonight, he walked through the opening once more with the entire building empty of other visitors... except for one. \n\n"Sergey Vladimirovich Taboritsky." an young patriarch standing behind the sculpted cross said, "You have proven yourself to be a pious and faithful servant to the Holy Spirit. I therefore bless you of all your sins and invite you to join my cause." \n\nAnd Taboritsky, having finally walked up to the Patriarch, kneeled in front of him, on his face the expression of righteous servitude. \n\n"I will do as I must." he replied, "Thank you, Your Holliness." \n\nAnd Antipin could only look at his new accompinee, faithful and devoted to him in every possible way. He was the best servent he could ever ask for. \n\nAnd to think he wanted him dead back then."
 GAY.64.a: "How foolish he was"

 GAY.65.t: "A Divine Piece Of Paper"
 GAY.65.desc: "The rooms of the Patriarch's Palace were poorly dimmed and lighted. Only candles and small lightbulbs stood within the darkness that consumed everything else, as more and more snowflakes hit the windows that decorated the Palace, courtesy of the blizzard raging outside. \n\nAnd yet in the midst of it all, sitting in a room guarded by several guards in front of it, was the Patriarch himself, Pimen I. He sat on a chair with sweat dripping down his face and a black pen in his right hand, tapping against the wooden surface of the table with a piece of paper in front of him. \n\nThat piece of paper served a purpose though. It was the written constitution of the new state Pimen would create. A state where the people will be both pious and free. Freedom under God. But Pimen was struggling to write the constitution in a way that would represent that ideal. To not give too much power to the church nor make the republic just another secular democracy. For that, Pimen toiled in his room, trying to make his dream come true. And after a while, he finally found it. \n\n"Article 4: Freedom of Speech is allowed so long as it does not offend God in a way that stands against moral values listed in the Old and New Testaments." \n\nAnd with hard work, the constitution was almost complete. It still had a few loopholes bit it was only a matter of time before they would be filled as well. With a sigh of relief, Izvekov simply laid on his chair after so much hard work, putting himself to a long, deserved sleep."
 GAY.65.a: "A new era awaits"

 GAY.66.t: "Reaching Out To The Oldest Roots" #
 GAY.66.desc: "Pavlov sat in his office, reviewing foreign matters. Going over the documents, he realized just how little Orthodox countries he could consider for a potential friendship. Pretty much just Greece and Serbia, and only one of those has an active Patriarch of the Orthodox faith. Sighing, he called a secretary over, and asked for pen and paper. Even if it isn’t that beneficial, he wanted to align himself with the rest of the Orthodox world, so that it doesn’t fall apart any further. \n\nReceiving the tools, he began to write: \n\n“Greetings, fellow Patriarch of the holy Orthodox faith. I hope this letter finds you in good health. I write to you with but one goal in mind - unity. We both understand, that our faith, and our flock, is in dire straits - we are not as privileged and protected as Catholicism and the Pope in Rome, or as incumbent and spread out as Islam. Both of us remember that it was the Byzantine emperor that helped Tsar Vladimir convert Russia to the true faith. I hold this old friendship close to my heart, and hope to rekindle its flame in these awful times we live in.” \n\n“And so, let us join together, and bring the Orthodox faith back to being as tightly knit as it was before. Starting with this, we can hope to achieve great things, for us and our flock.”"
 GAY.66.a: "“Sincerely, Patriarch of the Holy Russia. In the name of our Lord, amen.”"

 GAY.67.t: "A Holy Flight To The Land Of Stars And Stripes" #
 GAY.67.desc: "Steven Barns paced in the New York City airport, checking his clock every two minutes. Being one of the very few government officials with good knowledge of Russian, he was extremely nervous to meet this particular guest. It was almost time. And, as if on cue, a plane was setting down. Steven rushed to the plane exit area, and waited for the guest of honor to arrive. \n\nSteadily walking out was a slim figure of Father Pavlov, curiously eyeing up the airport, followed by a tough looking bodyguard. He then noticed Steven waving at him, - “Welcome to America!” He said in English, after which he switched to Russian, - “I hope the flight was pleasant, if a bit long.” Seeing the nervously smiling man, Pavlov sighed, - “Yes, my good sir, it was. Now, would you please give me a tour of your city?” \n\nNot an hour later, they were on Broadway, walking on the sidewalk as the streets were packed with constantly honking taxis, garbage trucks, public transit and a few actual cars. Pavlov tried to distract himself from this incessant noise by sightseeing. Steven then stopped and pointed at a hot dog stand, - “Here is our city’s most valued food! Everyone loves hot dogs, you should try it!” Pavlov gave the stand two seconds of staring before saying, - “No, thanks.” Turning his head, he sees a boy counting pennies with a sad face, he clearly doesn’t have enough. Pavlov decisively turns and asks Steven to buy a hot dog. After it’s ready, he gives it to the boy, who gasps and says, - “Thank you Mister Beard!”"
 GAY.67.a: "Pavlov chuckles and says in English, - “From Russia with love. Go with God.”"

 GAY.68.t: "Unfortunate Souls, By Whose Fault?" #
 GAY.68.desc: "An inspection of the city, as routine as it gets, flanked by bodyguards, and only sticking to main streets. Pavlov did not enjoy his arrival to Samara. It hasn’t been a long time since these cities were home to enemies of our holy state, and as such he couldn’t appreciate them for what they are, instead having to be mindful of every corner, of a possible assassination attempt. \n\nIronically, Pavlov was not expecting that, as he was going by an alleyway, a small figure ran out of it and into him. As the figure was tumbling backwards and falling flat, Pavlov noticed, after regaining footing, that it’s a really young girl, dirty from head to toe, and missing a shoe. She yells - “YOU STINKING MONK! BECAUSE OF YOU PEOPLE, MY PAPA AND MAMA ARE GONE!” Face red and eyes filling with tears, she stands up and throws a rock at Pavlov. Even though it hits him, a different kind of pain is terrorizing him from the inside. What “assassination attempt”? What “enemies of our holy state”? Did Pavlov actually forget that he was a man of God, that he used to read the Bible to children like her, teaching them the value of virtue? \n\nSnapping back to reality, Pavlov reflexively raises a hand, telling his bodyguards to stand down. He then kneels down to the sniveling girl, - “I am deeply sorry, I cannot bring your parents back. If it’s any consolation, know that they’re with God now, in Heaven.” He takes out 10 rubles from his pocket, and hands it out to her. Slowly, she takes it."
 GAY.68.a: "“God loves you, child. I hope you’ll understand.”"

 GAY.69.t: "Bless My Gains Down In Gayny"
 GAY.69.desc: "Graphs, charts, numbers. Over and over again. Izvekov sat in his office, once again plagued with paperwork, this time even harder. But, ironically, today was Izvekov’s favorite day - he was dealing with the economy! Seeing the green line go up was one of his beloved activities as the Head of State. \n\n“Alright, so, from the top - integrating all of newly acquired land created a giant influx of GDP, glorious, the national debt is going down thanks to injecting our liquid reserves to pay it off, marvelous.” - Izvekov was mumbling to himself, he was in his element - watching money grow in amount, preferably in biblical proportions. All of it comes down to carefully managing expenses to create the most optimal GDP growth, all of it is directly tied to spending, but not spending too much. Taking a look at a graph there, overlooking a chart here, writing down the important numbers. Yes, over and over again. Thanks Vladdy-boy for that vodka distillery! Thanks Gutrum-fucko for those iron mines in Perm! Thanks Vlasov, you shriveled potato, for keeping the money you got from those deutchies! \n\nChuckling, he reclined in his chair, and saw the sun going down. Sighing, he wrote down a couple more numbers and signed the extensive paperwork. He then stood up and started gathering the papers up in neat stacks. After he was done, he stepped out, and almost bumped into the secretary that was reaching for the door at the same time."
 GAY.69.a: "Smiling, Izvekov said to her: “Job’s done.”"

 GAY.70.t: "The Pope? How Many Divisions Do We Both Have?"
 GAY.70.desc: "“Uh, what?” - Konstantin Katushev was puzzled by this question from Father Izvekov. “You know, Catholicism and Orthodoxy had a schism, a division. My knowledge on this is a bit rusty, so I was hoping you could enlighten me on how exactly to approach them. It makes sense to do so, if there is a chance to mend the schism, or at least be on friendly terms, then the Christian world would surely see us more favorably, no?” \n\nKonstantin blinked, - “U-huh. Well, to answer your question, other than this, and the Fourth Crusade, we didn’t really have any more “divisions”, so to speak. I assume you mean to write a letter to the Pope directly, as bizarre as that sounds?” Izvekov nodded with a smile, to which Konstantin sighed and pulled out his pen and readied a paper, - “Then by all means, speak.” \n\n“Kh-khm, my brother in Christ! Wait no, that’s too unofficial. Dear mister Pope! No that sounds stupid. Uhh, To the esteemed leader of the Catholic world! Yes, that’s good.” \n\n“To the esteemed leader of the Catholic world! /nThe Patriarch of Holy Russia greets you, as a fellow believer in God, Christ, and the Holy Spirit. Long have our people been deemed as separate, as though we are each others’ infidels. I say it’s time to dispel such notions! In these trying times, we, as leaders of our flock, need to come together and lead the faithful not as rivals, but as friends.”"
 GAY.70.a: "“Oh, and remember to write this in Italian, bring a translator!”"

 GAY.71.t: "The Land Of Decadence" #
 GAY.71.desc: "The crowds gathered across the newly-made church in Sytkyvkar, tens of thousands of zealots and fanatics in and out of the building shouting the name of their Leader, waiting for him to arrive. And alas, he finally did. \n\nThe crowd stood in silence as holy music started blaring across the church and the proud self-proclaimed warrior of Christ came on and started his sermon to his and God's people. His speech went on for about half an hour, becoming more and more unhinged along the way, yet it was at that moment, at the end, that the sermon became the most vigorous it had ever been before. \n\n„People of Russia!“ the Patriarch Peter II spoke, „I am here not only to speak to you but also the President and the people of the United States. Your nation is the most corrupt and decadent one that has ever bestowed this world. Your constitution and rights bestowed by it are a testament to the blasphemy of God that is ingrained in the core of your country. Indeed, Satan has helped you along with our immortal enemies to rise upon our dust to consume the world in sin. \n\nBut do not worry, o people of Russia, I will swear on the behast of God and Christ to bring down this affront to the Holy Spirit down to the fiery depths of Hell where they belong, and when we deal with the Satanic Nazis and Japanese swine, you will be next. Death To America!!“ \n\nAnd the entire crowd all of a sudden burst into euphoria, rage and hatred, screaming endlessly and cursing for all its sin. Death To America became the slogan of the crowd who, once men and women, turned into rabid dogs, trained to destroy their enemies and to appease their master, not the Lord, but His servant instead, the Patriarch of All Russia."
 GAY.71.a: "„He is the living God, and an everlasting king: at his wrath the earth shall tremble.“"

 GAY.72.t: "A Letter To The Fuhrer Martin Bormann" #
 GAY.72.desc: """Since the dawn of the Earth, mankind has been constantly deceived and lied to by Satan and his legion of demons. Like pests, they have continued to do their master's bidding in spite of efforts by men to bring about Divine justice. And today, they now rule the world in sin as the so-called "superpowers." \n\nAnd such is the case for you, Fuhrer Martin Bormann. Your Satanic ideology has the German people as servants of Satan. Your degenerate brand of protestantism has no bounds in the amount of inhuman disgust it perpetuates on me. You are God and Christ's greatest enemy since the Romans and Judas. \n\nBut do not think you can defeat us! You may be fooled by your large holdings of our sacred land that no one can neat you, but the might of our Orthodox faith and armies is great and unstoppable! We shall march to your land, kill anyone who dares to resist God's will, and burn Berlin to the ground. We shall cleanse your land like how God cleansed Sodom and Gomorrah, and we shall not leave anyone in your realm alive."""
 GAY.72.a: "Thrown in the trash bin like all the others."

 GAY.73.t: "A Letter to the Fuhrer Hermann Göring" #
 GAY.73.desc: """God gives his warriors salvation. Those who want fight for Him are the most blessed of all Othodox Christians out there, for they serve to spread His will and word to those corrupted by the Satanic leaders who deceive the population to become servents of the Devil. \n\nOne such leader is you, Göring, and you are the worst of them all! You go conquering nation after nation after nation just so you can dwell in your degenerate homosexual values and sit atop your mountains of wealth with your never-ending greed fulfilled for just a short period of time. I feel no pity for the nations you have conquered, for they too far astray from God that they deserved death, but if you think you can conquer us, our great Godly nation, you are lying to yourself. \n\nTry it, try attacking us, and you will be met with might of God and our armies serving Him. Your protestant warriors will not take one foot of Othodox land without getting slaughtered. We will push you out of our nation and sack all of Germany as you and your sinful people suffer the Lord’s wrath. \n\nYou will fall, we will prevail!"" \n\nAnd when the letter was sent to Germania and reached Göring, he only did one thing with it."
 GAY.73.a: "Thrown in the trash bin like all the others."

 GAY.74.t: "A Letter to the Fuhrer Albert Speer" #
 GAY.74.desc: "“There are many things the Devil has created in our day and age to convert Man back to his disgusting base ways, but you, Albert Speer, you must be welcomed in Hell as its best agent! \n\nNot only do you take the vile ways of Fascism, but you also embrace its most homosexual trends as you mix it with Liberalism! You and your Protestant agents march through Orthodox land, espousing freedom for its people while keeping them in chains! You cannot choose between sodomy and degeneracy, and so you take BOTH! \n\nThis shall be our first and final warning, Speer! Let the Orthodox people go or face the Lord’s wrath along with your disgusting Germanic kind!” \n\nThe Furher’s secretary re-read the letter, unsure of whether he should even pass it along."
 GAY.74.a: "“They really lost it in the East, huh.”"

 GAY.75.t: "Fate, The Unpredictable Master Of Life" #
 GAY.75.desc: "In all honesty, the chances of this happening were so impossible it was borderline fantasy. In every other world, Patriarch Antipin would be writing letters railing delusional rants against the Satanic Germans, every Fuhrer would just dispose of the letter, not wanting to read a single word in it. \n\nBut Fate was unpredictable, and God had other plans indeed. \n\nFuhrer Heydrich, the Reichsfuhrer-SS and Butcher of Prague who had time and time again followed the orders of his superiors perfectly, had proved to be nothing more than a fool. That much was obvious, as the world watched as Germany collapsed underneath itself, ceasing to exist as a nation, the Thousand-Year Reich having lasted for nothing more than three decades. Hitler's death was followed by the scourge of God that was used to punish the nation for all its sins and everything it had done against the people of Europe and the world. \n\nBut while the Americans and Japanese plotted to become the new masters of the burned-down remains of what was once Europe, Patriarch Antipin had his own plans. While in every other timeline, he would be writing letters to the Fuhrers of the German Reich, now he was planning with his military leaders a plan that would only commence one thing. Out of the ashes of Germany, Moscow shall be reclaimed, and a new Russia shall be born. \n\nAnd as for Germany and the suffering of the German people there, the Patriarch, his people, and the entire world in one way or another, all thought the same way:"
 GAY.75.a: """Good riddence."""

 GAY.76.t: "To Deal With God's Many Enemies" #
 GAY.76.desc: "Antipin stood in his office at the Patriarch's Palace, looking at a list full of names at his desk. This, however, was not an ordinary list. Rather, the names were those of people who betrayed their nation and God. Traitors, Satanists. All those who stood against him and Christ. And from scheming priests to godless communists, the list was very long indeed. \n\nHe didn't have to worry about dealing with them alone though, because he had his trusty Minister of the Interior by his side. \n\n"First things first," said Taboritsky, wearing his iconic brown coat that he had every day, "We must deal with those traitors if we are to build a true Godly Russia!" \n\n"I agree." replied the Patriarch, continuing to stare at the paper in front of him, "All of them must be dealt swiftly. I think the logical solution should be to lock then up in prison camps. They will do a service to Christ for their sins there." \n\nTaboritsky, however, objected. "Nonsense! My apologies, Your Holiness, but these people are irredeemable!" he practically screamed in disgust and anger over the accused. He somewhat calmed down later so as to show respect to the Patriarch, but his tone still remained sharp. "They have betrayed God and Russia. The only just punishment for them is death!" \n\nAntipin simply remained silent, still sitting at his desk and looking at the same damn paper that was there before. Taboritsky had a point there, but do they really have to be this barbarous? Even if it was against heretics? Regardless, his time was up, and he had other work to do. Antipin thought about the topic of dissidents, and finally came up with what he had to say. Without warning, he looked at Taboritsky in the eye and said: \n\n"We'll talk about this later""
 GAY.76.a: ""Then death it shall be!""

 GAY.77.t: "Cane Enable"
 GAY.77.desc: "Mylety Zykov felt tired, even the coffee cup he drank earlier didn’t help much. Most of last night he was busy drafting up plans, finalizing income charts, accounting in general, all because he was entirely certain that his dear Patriarch and leader of the Russian nation, Father Izvekov, was about as well versed in economy as a child, or a regular from the local pub. With a briefcase of neatly collected documentation in hand, he approached the office of said dear Patriarch. Yawning for one final time, he came up and knocked. \n\nNo answer. Checking his clock, Zykov confirmed that at this time Izvekov should still be in his office. Knocking one more time, and receiving no answer, he opened the door, - “Apologies for the intrusion, but...” Zykov blinked. Izvekov was sitting in his chair, with his hands on his rotund belly, his mouth hanging open. He then snored, loudly. In front of him was a mess of papers, all covered in notes, scribbles, lines, etc. Zykov sighed, - “Good thing I came prepared.” \n\nSitting on a chair at the side of the table, Zykov started to collect the papers on the table and arrange them accordingly, after checking on what they’re about. As he continued, he slowly realized - they were all paperwork for this month’s budget. And what absolutely stunned Zykov - it was all filled out perfectly! Not a single digit was something that would harm the economy, and he knew it wasn’t just lucky guessing, this is the work of a professional. After Zykov was done arranging papers, he sat up straight, thinking on what the hell would he even need to do here."
 GAY.77.a: "The work he pulled an all-nighter for, here it all was, already done by a snoring priest."

 GAY.78.t: "Suspicion Among Us"
 GAY.78.desc: "Another day, another group of priests in Gayny are causing a ruckus. Getting elected didn’t mean that everyone would respect the choice of the majority and would still resent you, sure, Izvekov was perfectly aware of that, but Dear Lord, would you guys just shut up already?! Thank the Lord that he was not hungover today, or else all this noise would do him in. \n\nStepping out of his house, which was tightly guarded, for obvious reasons, he addressed his men and told them to follow him to that incessant crowd. A minute or so later, Izvekov got to them. He recognized most of the crowd as loyalists of Pavlov, and assumed the rest were those zealots Antipin hung around himself. “LORD ABOVE, STRIKE DOWN THE SCHEMING IMP, HEAR OUR PRAYERS, REMOVE THE CORRUPTION FROM OUR PIOUS LAND!” These chants were getting louder and angrier with each passing hour. Izvekov could not stand it anymore - “LOWER YOUR VOICES, YOU ARE BOTHERING OUR FLOCK WITH THESE INSANE RANTS!” Sure enough, they silenced themselves, but now the tension between the two groups was so palpable you could cut it with a knife. \n\nA man steps out, and slowly closes the distance to Izvekov with a weird smile, - “Dear Patriarch, how nice of you to join us. Father Antipin always said you were a reasonable person, so I hope we can come to an agreement.” He then extends his left arm, offering a handshake. Izvekov’s face went grim, “Only the Devil shakes on his left hand. God be merciful on your soul. GUARDS, FIRE!” Before the man could aim the gun in his right hand, several shots swatted the man down like a fly. The rest of the crowd quickly dispersed."
 GAY.78.a: "An impostor to the faith, rightfully ejected out of it."

 GAY.79.t: "Emergency Meeting" 
 GAY.79.desc: "Stepping into the impromptu court in the main church of Gayny, Antipin glared around, reflexively trying to intimidate people, only, not even a child would be intimidated by a weak, mentally sick man in cuffs. A part of the crowd wanted to raise their voices, heckle the rabble-rousing lunatic that was pushed forward by the guards to approach the judge, only, not even the most outraged individuals could find their voice when Father Izvekov was standing on the pulpit, overseeing the room with a stern and cold expression, unlike his usual jovial self. \n\nPassing through the nave and into the crossing, he stood before the judge, with a jury divided and placed into both transepts. Antipin knew that nobody in this place was on his side, none of these people were true believers, none of them loved and feared God like him. He made eye contact with Izvekov, the snake that is responsible for all of this. “The Lord will cast you down into Hell where you belong, you wretched heretic!” - Antipin exclaimed. Izvekov stared him down, - “Are those truly the words you want these people to remember you by? It is truly depressing to see someone lose any shred of dignity in this mad zealotry. The Lord is my witness - I did not wish for this to happen.” He then closed his eyes and let the judge begin: \n\n“Mikhail Antipin. You stand accused of treason, being behind an attempted murder, inciting discontent in both your fellow priests and followers, as well as misguiding our flock into a path paved by the Devil himself. I will now ask the jury for the verdict.” A moment filled with murmurs passes, after which a man stands up and says:"
 GAY.79.a: "“Guilty.”"

 GAY.80.t: "What Must Be Done" #
 GAY.80.desc: "“What kind of madness is this?!” - An otherwise quiet evening was disrupted by the signature loud voice of Antipin. Only this time it wasn’t because he was preaching to his zealots. Pavlov stared at him, Antipin was reddening with rage. All Pavlov could think was - “Did I seriously not notice how my good friend became a rabid dog? Lord have mercy on our souls...” With a sigh, Pavlov responded - “This is the kind of thing that got us into this situation, Brother. You cannot seriously preach humility to your flock when you yourself cannot hold yourself together.” \n\nWhile the calm voice of Pavlov might have resonated with someone else, to Antipin, well, it just made him even more infuriated. All this “wisdom” and “reservedness”, all of it is malarkey! “Don’t call me Brother, your inaction will get the entirety of the good Russian people killed, not to mention the amount of snakes like Izvekov, who would sell their soul to the Hun, with absolutely no loyalty to anyone other than themselves! And what, you mean to cast me out, instead of traitors like him?! Preposterous!” \n\nPavlov’s ears were starting to ring from all this shouting. He closed his eyes, and could almost recall the time, when the both of them were praying to the Lord above, united in one simple purpose - belief. Opening his eyes, that image was gone like dust, blown away by the fuming rant of an insane jingoist. Pavlov raised his hand, - “Enough. For the sake of our previous friendship, enough. Leave, I will not repeat myself.”"
 GAY.80.a: "Antipin’s face almost seemed like it was filled with regret, and that’s the last Pavlov ever saw of him."

 GAY.81.t: "What Should Be Done" #
 GAY.81.desc: "Cocks had rung out only a minute ago, yet Izvekov was already strutting down the street to meet Pavlov by the main church of Gayny. While he still had bitterness from failing at the vote (not being in charge really sucks), he at least knew for a fact that, unlike dear little Antipin, he was summoned by the Patriarch for a mutually beneficial reason, and that riled him up like free beer. \n\nBeing near the church even before the first sunlight, Pavlov had gathered a, shall we say, group of “witnesses”, mostly consisting of those priests that supported Izvekov, and the flock that were advocating for his role as the Patriarch. Understandably, they were throwing side glances of contempt at Pavlov, like he was the town’s “special needs” kid, and not their Patriarch. At least this he could tolerate, at least they’re just bitter... \n\nNot a moment too late, Izvekov appears in full view of the crowd, which elicits cheers of acknowledgement. Pavlov looked at the crowd knowingly, then turned to the rapidly approaching Izvekov with an outstretched hand - “My good friend and Brother in our holy faith, Father Sergey Izvekov, it is a pleasure to see you in good health. I summoned you here for a very important reason - to offer you a position as a minister of economy in our new government, for the glory of Holy Russia. Do you accept it?” It took Izvekov only one moment of overlooking the crowd to realize what Pavlov was doing here, but... Argh, to hell with it!"
 GAY.81.a: "“Of course Brother, I graciously accept!” - Izvekov said with a grin and a handshake."

 GAY.82.t: "An Unlikely, Yet Likely, Alliance"
 GAY.82.desc: "It was just another day for Izvekov. One would expect that the Patriarch's victory and conquest over Western Russia would embolden the man, flare his ego up a bit. While to an extent, it did, another side-effect of his victory over Western Russia was the ever-growing piles of paperwork to be completed by him every single day. And so for hour after hour, all Pimen II did besides sleeping, eating, and delivering sermons was rot and toil with his pen and papers, endlessly writing to the bitter end. \n\nIt was a blessing for him, therefore, that during another one of his toiling missions, a guard went into his office and told him that a woman had asked to meet him personally, which he accepted out of kindness and personal relief over not having to write anything for just a minute. \n\nIt was only when he saw who the woman really was, that face and cheekbones that showed a 60-year-old woman in a 40-year-old one, that he knew with whom he was really dealing with. \n\n"So, you are the Patriarch, aren't you?" asked the infamous Svetlana Stalina, daughter of a famous Old Bolshevik who fought with Bukharin for the throne. How ironic it was. \n\n"Yes." answered the Patriarch. \n\n"Good. I may disagree with your brand of democracy, but our differences are little compared to our shared will for freedom. I want to help you achieve your goals and make sure liberty thrives in Russia, and I belive you to be a capable man. Am I right?" \n\nIzvekov smiled, "I wouldn't stand here if I wasn't." \n\n"Quite the dry humour, fantastic. However, would you accept my aid? \n\nAnd with no hesitation, Pimen II simply looked at her, turning his head around to say:"
 GAY.82.a: "„Yes“"

 GAY.83.t: "There Is Eternal Rest For The Virtuous" #
 GAY.83.desc: "“God, he’s so fucking fat!” - Not ones to mince words or attempt to be polite, Antipin’s zealots were busy dragging an unconscious body of Izvekov, face of whom was already filled with bruises. They were tempted to just throw his body down the church crypt’s stairs, but, sadly for them, Antipin ordered them to drag him there alive, so they couldn’t risk it. \n\nThe crypt was filled with the stench of death - decomposing bodies everywhere, many of whom died in the last couple of months, during the numerous wars leading to reunification of Western Russia. A grizzly sight and smell, though none of it bothered Antipin, standing in the middle of it with a lamp and a pistol. As the grunts of his soldiers were getting closer, he reflexively squeezed the gun a couple of times, half excited to put an end to a terrible enemy of the Faith, half stressed out to be the one pulling the trigger. \n\nFinally, the bumbling, heaving zealots got Izvekov down, and set him in front of Antipin. He nodded to the bucket of water next to him, and one of the soldiers used it to splash Izvekov’s face. Coughing and yelling, Izvekov jolts awake, and is set up to his knees by the zealots. Izvekov only has a moment to realize where he is before Antipin says - “Prepare for your trip down to Hell, you scheming snake. May the devil be merciful with your soul.” Izvekov can only muster a “No, wait!..” before Antipin aims the gun at his head and pulls the trigger. As the lifeless body of Izvekov falls down, Antipin breathes a sigh of relief."
 GAY.83.a: "“This is a good start, but we cannot become complacent with just this. Bury him here, in a corner.” - said Antipin. No rest for the wicked."

 GAY.84.t: "Killing, When Done Right, Is A Chore..." #
 GAY.84.desc: "Early nighttime. Most, if not all, residents of Samara have huddled inside their homes, afraid to leave what little safety they still have. Patrolling soldiers of the Army of Saint George were like death brigades to them, it didn’t feel as though fellow Russians were the ones combing the streets for anyone suspicious, but German brigades of Dirlewanger. No way in hell soldiers can be so dead-set on finding at least a couple of unfortunate randoms, just to have someone to beat up, and still call themselves Russians. \n\nThis day though, it held a special kind of cruelty. Zealots in the main square had simple gallows erected, for today will be the day of total executions of Samara leadership. “For the crime of betraying your nation, and selling out to the wicked Hun...” - Antipin stood in front of the gallows, eager to put these worms to the rope, and repeated the line he practiced, always the same for each and every person. Though he did start with the people in charge. \n\nMylety Zykov already hung dead, eyes bulging out and mouth agape. Now it was Vlasov’s turn, who cried a little as the murderous preacher finished up his little speech - last moments were filled with utter regret to what kind of life Vlasov led. Snap, goes his neck. Bunyachenko was next, and rather than wait for Antipin, he just yelled obscenities at him for half a minute before Antipin ordered for his death. Oktan was the last of the “leadership”, and while he tried to buy his way out of this, Antipin was completely deaf to his offers of riches beyond imagination. Snap, goes his neck. Time for the rest of the filthy collaborators."
 GAY.84.a: "...Like any other."

 GAY.85.t: "To Spread The Word Of God"
 GAY.85.desc: "Western Russia is finally united. With the blessing of God, our armies have conquered this region and freed our people from the suffering imposed by our enemies, domestic and foreign. It's not over for us, not by a long shot, but we have a chance, at least, to unite Russia once more and raise it to glory once again. \n\nBut that doesn't mean our Godly crusade is limited to just Russia. All over the world, there are millions, billions of people who still do not see the light of the Lord. Who still live in ignorance of Christ and his ideals. It is something we, as servents of God, cannot ignore. \n\nWhile some countries refuse to be educated by our faith, others have welcomed our priests and preachers with open arms. Now, from the villages of India to the cities of America, they spread the word of Christ to the uneducated masses. They help the poor, the hungry and the needy. They do the Lord’s work in making the world a better place for all of us, and more and more people join us every day."
 GAY.85.a: "We shall only pray that such success continues in the future."

 GAY.86.t: "The Antichrist Reborn" 
 GAY.86.desc: "The great church in Sytkyvkar was quiet, in spite of the thousands of people who attended it, because they came there only to listen to the wisdom of the Patriarch Pimen II. And he was speaking now, both in public and the newly introduced television cameras from the West, his wise words to the public and nation at large. \n\n"...And the Second Coming of our Lord and God and Savior Jesus Christ will be preceded by the coming of His opposite. For Satan shall take up his abode in a man born to be the mockery and parody of the true Christ. Like our Lord, he will come to preach to the nations of the world, but he shall be possessed by the Devil himself. He will be the Deceiver, he will perform miracles and immoralities which have never been done since the age began. He will trick the world into believing he is above God, and with the help of his false teaching, his false miracles and displays of power, this evil man will offer to the world, a kind of earthly kingdom that is in everything the opposite of Jesus Christ’s Heavenly Kingdom, that will enslave and murder all those whom the Deceiver wants to enslave and murder.  \n\nWe must therefore, be vigilant, and have the faith necessary to reject the false teachings of the Satanic Antichrist. And in the Second Coming, as said in 2 Thess. 2:8, this “man of sin,” the “lawless one,” the Lord Jesus will “consume with the breath of His mouth and destroy with the brightness of His coming.”"
 GAY.86.a: "May we have the faith to stand against him."

 GAY.87.t: "The Great Cathedral Of Gayny" #
 GAY.87.desc: "The city of Gayny was not the biggest city in Western Russia for sure. Far from it. Prior to the establishment of the Orthodox rule it was nothing more than some rural settlement with some few thousand people living as its inhabitants. It was, for all intents and purposes, just some small town that stood just west of the great Ural Mountains that divided Europe and Asia. \n\nAnd yet, it went through so much. Whether it be because of German bombings, the refugees that settled there looking for compassion from God, or the wars that the state that town is in waged to unify all of Western Russia, it had become wholly unrecognizable from what it was during the era of the Bolsheviks. And now the city shall earn its reward for its perseverance, and finally become entombed in the history books for all time. \n\n"Your Holiness!" a young engineer wearing winter clothing came to Antipin, whose hands were clasped behind his back as he looked at the sight in front of them, "The cathedral is nearly complete! Only the dome remains to be built, and we are looking at the building being finished in the timespan of a month from now." \n\nIn front of them stood the greatest cathedral the world had ever known. The gold-clad facade shone in the sunlight along with the snow that stood on the just completed parts of the roof and surrounded the building. The sheer size of the unfinished cathedral dwarfed every single other building that existed in its periphery and in the entire region, and the insides of the building were filled with murals of Christ and the Virgin Mary, and the Holy Trinity that created all that existed in the world. \n\nAnd Antipin smiled seeing it, for it was more than just a building. It was a monument dedicated to him, the Church he served in, and the greatest country the world had ever known. He was the Justinian Russia needed, and the cathedral was Russia's very own Hagia Sophia. And so he looked at the engineer and said:"
 GAY.87.a: ""Excelent work, my child.""

 GAY.88.t: "Hate’s Creation" #
 GAY.88.desc: "Entry Number 112: Omsk \n\nToday, [?global.date.GetDateStringNoHourLong], was the day when I witnessed the result of being consumed by vengeance. What do people look like, when they live only to end the lives of those that wronged them and their loved ones. The Black League is an apt name - their people are those whose souls have gone black. Through hate. Through violence. Through indoctrination. \n\nDmitry Yazov was most assuredly a broken man - with nothing left to live for but the accomplishment of his “Great Trial”, a mad idea, with an even madder execution. Our soldiers discovered his corpse a couple of days ago, while I was still on my way here. Suicide. Absolute insanity - to drive his people into becoming monsters, only to refuse being put to trial, and take his own life. As though he would suffer a worse fate than those he was “training” to become soldiers. \n\nYou could see it in the city residents’ eyes - they desperately wished for our demise. We destroyed their “righteous mission”, we “betrayed Russia” by not being as genocidal as them. By not hating Germany as much as them. I will direct triple the amount of garrisoned soldiers here in the city and in the surrounding province, I cannot trust that these people would be complacent about our control. In time, I hope, people will learn to let go of their hatred."
 GAY.88.a: "And it made me wonder, if the Lord is afraid of his own creation..."

 GAY.89.t: "Blood On The Snow" #
 GAY.89.desc: "Simo exhaled, his sniper shot hitting true, piercing the head of a clueless Russian like it was a watermelon. Although, even a truly experienced warrior could not escape his scope. Simo was praised as the White Death, racking up a kill count to rival that of a German machine gunner in World War 1. Even to this day, even after the Soviet Union collapsed, Russians still fall to the shot of his sniper rifle, evident by that guy who didn’t even bother to look around while scouting... \n\n“This was too easy, something’s not right.” - Simo thought to himself. Sure enough, he could hear the crunch of the snow - several others, buddies of the clueless guy, or were they? Doesn’t matter, Simo spots one of them, goose-stepping behind a fallen log. Not two seconds after, another shot. This time Simo didn’t manage to hit the head, the bullet had cut through the side of the guy’s face. Cursing something illegible, Simo switches weapons, he hears that the third guy is getting too close for comfort too fast, the KP/-31 SMG is for such cases. \n\nScanning his proximity, Simo spots imprints going to a tree 12 meters from him. As if on cue, the Russian slithers out to shoot, only to get half the magazine of Simo’s SMG unloaded in his stomach, the rest spraying across the body. Choking on blood, the Russian falls, having not fired a shot. Simo sighs, and starts to reload his SMG, only then does he feel the gun pointed directly at the back of his head. “Gena is in heaven, and that fucker from the brazzerhud is in hell. Now it’s your turn to meet Lucifer, you monster.” The last gunshot of the day rings out."
 GAY.89.a: "It is as they say - Death's home is in Hell."

 GAY.90.t: "Red Blood Across the Red City" #
 GAY.90.desc: "From door to door, from house to house, that was the life of Alexei Ivanov now. To move like a rat, to escape the bloodthirsty cats killing anyone and everyone around them. \n\nFew had high hopes when the anti-communist Order arrived at Tyumen. They expected them to force confessions of loyalty to the church down their throats and bow down to the Orthodox Church, but the brutality that followed instead was unprecedented. The soldiers of the Order went from house to house and killed anyone suspected of being a communist. Women, men, young or old, that didn't matter to them at all. Like monsters, they slaughtered anyone in their path, and only the lucky ones and the traitors got away alive, or joined them side by side. \n\nAnd Alexei, being a proud member of the Communist Party, was an immediate target. \n\nBANG \n\nA headshot, going through Alexei's forehead as he tried to cross the street, was heard across all of Tyumen alongside all other fire that followed. His killer, a lone sniper stealthy hiding under a darkened window. \n\nAnd such a process repeated over and over again until there were no communists in Tyumen anymore."
 GAY.90.a: "The end of the Red Menace"

 GAY.91.t: "A Godly celebration" 
 GAY.91.desc: "Sounds of wine glasses clinking against each other echo in the hall. A large, decorated table stands in the middle of the enormous room, at the head of it a chair, so imposing as to resemble a throne. On it sits Sergey Mikhailovich Izvekov, the man of the hour. \n\nAfter years of fervent service to the one true God, he made it - he became patriarch. He raises his glass, filled with the holiest blood of all, takes a sip and says a silent prayer. This moment isn’t his - it’s the Lord’s. He closes his eyes, thinking of the journey behind him and all the trials he had to go through. Suddenly, he stands up and raises his arms: \n\n"Oh faithful servants of God, hear my words! I would like to raise a prayer to all the lost souls in this holiest of lands. To all the deceived minds, to all the enslaved bodies, to the holy, and to the sinful: All will receive their just and godly treatment in the Russia of God!" \n\nAfter a hushed prayer spoken by everyone in awe, he continues: \n\n"The coming years will be our greatest trial yet. But do not fear: We will prove our eternal servitude to the graceful God by overcoming it with faith in our hearts! God is on our side, we simply can not lose. So I ask you not to devote this moment to me. This isn’t my path, this is the Lord’s path. So when you think of today, don’t think of me, think of God!" \n\nAs the room erupts in thunderous applause; cries, and shouts of "Praise the Lord!", Izvekov slowly sits down again. A smile appears on his face, filled with confidence that God truly will stand by his side, every step of the way."
 GAY.91.a: "One trial overcome, many more to follow"

 GAY.92.t:0 "A Deal With The Devil Himself"
 GAY.92.desc:0 "With the establishment of the Order Of Saint George and God's Will across Western Russia, hope has arisen among the people of Russia that their country may be united again. However, in truth, it will take years before our government can take over the country and even more before we ready ourselves against the Germans if we do not fall by then, of course. That has, among other things, lead us to a dilemma regarding the state of our lands and foreign ambitions in Europe. Our people in the west, men, women, and children too, toil as slaves under the Satanic German dogs, breaking their backs and dying for the benefit of their masters and no one else. However, the masters can't serve alone. They also have their own dogs, our own people who have betrayed our nation to work under those who have enslaved and killed us. They deserve death for what they have done, yet now, unfortunately, we may need their help. Since these people value money over God and country, we too should adhere to the rules of their game. Buy them off and contact them. Some are probably working just to break the system from the inside when the time comes, but most of them will only join us when we buy them off with promises of luxury and power in our new Russia. With their help, our infiltrators will enjoy protection from above and our plan will easily commence when the time comes. Of course, we can just infiltrate the Reichskommisariats all on our own and hang the traitors on the gallows but it will be much harder to take on the Germans that way. The choice is hard either way. So what will we choose, our victory or our integrity?"
 GAY.92.a:0 "Victory"
 GAY.92.b:0 "Integrity"

 GAY.93.t: "Red Blood Across The Red City"
 GAY.93.desc: "From door to door, from house to house, that was the life of Alexei Pavlov now. To move like a rat, to escape the bloodthirsty cats killing anyone and everyone around them. \n\nFew had high hopes when the anti-communist Order arrived at Tyumen. They expected them to force confessions of loyalty to the church down their throats and bow down to the Orthodox Church, but the brutality that followed instead was unprecedented. The soldiers of the Order went from house to house and killed anyone suspected of being a communist. Women, men, young or old, that didn't matter to them at all. Like monsters, they slaughtered anyone in their path, and only the lucky ones and the traitors got away alive, or joined them side by side. \n\nAnd Alexei, being a proud member of the Communist Party, was an immediate target. \n\nBANG \n\nA headshot, going through Alexei's forehead as he tried to cross the street, was heard across all of Tyumen alongside all other fire that followed. His killer, a lone sniper stealthy hiding under a darkened window. \n\nAnd such a process repeated over and over again until there were no communists in Tyumen anymore."
 GAY.93.a: "The end of the Red Menace"

 GAY.94.t: "The Cost Of Sin"
 GAY.94.desc: "The smell of victory was so enticing to Izvekov. The victory over his former colleagues and enemies outside of his realm had begun engraving a sense of dangerous pride in him, thoughts of arrogance that would embolden him to do stupid things and hasten his own demise. But Izvekov was a humble man, and most certainly not an idiot. He knew how to do things well while also keeping his own morality in check. And it served him now, as he was walking in the Gayny prison with many unsavory individuals either staying silent, or shouting at him with swears and insults that didn't perturb him in the slightest. \n\n"Damn coward!" A young thirty-something year old man was screaming at the Patriarch as prison guards were carrying the thrashing maniac to the most nearby empty cell there was, "Your liberal friends will destroy Russia! God will punish you for your betrayal!!" \n\nIzvekov felt all sorts of things seeing the Antipin fanatic as he was finally pushed into and locked in his new home. Disgust at his ideology, relief at his guards who protected him, but most of all sadness for the man so lost in his thoughts and his path. But there was nothing to be done now. Only to walk forward."
 GAY.94.a: ""

 GAY.95.t: "Friends In Holy Places"
 GAY.95.desc: "“Wait, is this true? We’ll get weapons from the free parts of Russia?” - Gosha could barely contain his excitement after hearing the news from Yegor, as they were going down the stairs to the usual meeting spot of their small resistance group. “Yes, but I still don’t agree with this, Nadya said that they arrived from the insane zealot state across the Muscovy border. I know you guys are sick of hearing this, but socialism brought the church down for a reason - they exploited the poor, sat on a giant pile of money like dragons, which they receive from the state every month, and always worked against reforms. They are only an iota better than Nazis, if only that much.” \n\n“You’re preaching so much that you could be confused for a priest yourself, Yegor.” Opening the door to them was their impromptu leader - Nadya. Her older brother was the leader not too long ago, before he was found out. “Point me to a priest that would be advocating for leftist ideals and I will henceforth always read the Bible before going to bed.” Nadya smirked, - “True enough, but enough chit-chat.” \n\nNadya turned to face a new face in the hideout - the person representing said zealots. At his feet were a few crates full of ammunition, leftover PPSh’s from the West Russian War, even a few grenades. A fat silver cross hanged from his neck, and although the glare from Yegor was anything but friendly, he gave them a big smile:"
 GAY.95.a: "“By the Grace of Our Lord, Christ, the Almighty - I deliver you weapons of Holy Russia, with the intent to exterminate the Nazi Wyrm.”"

 GAY.96.t: "Empath"
 GAY.96.desc: "“O God, whose mercies cannot be numbered: accept our prayers on behalf of thy servants, the downtrodden Russian people, and grant them an entrance into the land of light and joy, in the fellowship of thy saints; through Jesus Christ thy Son our Lord, who liveth and reigneth with thee and the Holy Spirit, one God, now and forever. Amen.” \n\nReciting this prayer didn’t help, not even for the thousandth time, he still felt fake, a fraud. He wasn’t there to protect these people, couldn’t give anything, couldn’t heal their damaged bodies and souls… \n\n*Knock-Knock* \n\n“Father Pavlov, are you alright?” - the voice of one of his bodyguards snapped Pavlov out of his trance, - “You’ve been locked inside your chambers for hours, the men are just…” \n\n“I am fine! Yes, fine… I simply require solitude. Leave me, I will not stay here forever.” \n\nAs the footsteps on the other side of the door receded, Pavlov slowly rose from his knees, peering around only to spot that damned report again. No, he knows what must be done now. Whatever time it must take, he will see to it that the German yoke on the Russian populace of Muscovy be broken…"

 GAY.96.a: "…Forever."

 GAY.97.t: "Death Korps Of Voyna"
 GAY.97.desc: "“...Communist dissidents, or, in other words, enemies of Holy Russia and the True Faith, whose only aim is to obliterate the natural order of things and destroy the good old fashioned values upon which we used to rely…” - reading the orders sent by none other than the Patriarch-nutjob himself, Gavriil felt like all this preaching would kill him faster than a stray commie bullet would. A survivor of Auschwitz, he couldn’t care less what his leader was, what they wanted, or what they said. He just wanted to inflict pain that he felt in that hell onto others, hopefully getting to kill some Germans in the process. His little entourage of zealots in gas masks was far from the cold-blooded killer that he was, but at least they were eager. \n\nSome time later, in a dingy basement, Grigoriy and Rodion were busy making pipe bombs, - “Grisha, did you hear that Polina shanked one of those christ-fuckers in an alley yesterday? Can you believe that one of these holier-than-thou pricks actually tried to buy a hooker?” Laughter ensues, after which Grigory replied - “Well he was lucky that she killed him, and not infect him with AIDs or-” \n\nDoor busts open, and a small object bounces into the room. Rodion can barely yell “Grenade!” when it erupts in the middle of the basement, right next to the pile of pipe bombs, creating a chain reaction that instantly kills them both. Outside, gas-masked soldiers finish rounding up the last of all the people still alive in the village. Not wasting any time, Gavriil does a mandatory “In the name of the Father,...” recital before blowing each of their heads with a shotgun, one by one."
 GAY.97.a: "Not an hour later, the whole village would be torched, completely wiped off the map."

 GAY.98.t: "Is This A Sisyphean Effort?"
 GAY.98.desc: "Terentiy Kravchenko Semyonovich, more commonly referred to as Semyonich by his colleagues, is one of the workers at the Vyatka Small Arms factory, one of the more hard-working workers in fact. While it was clear that he took joy in labor, the conditions set by the previously incumbent monarchist overlords were draconian, bordering on impossible. To add insult to injury - there were no rewards for his hard work, to the higher-ups he was only meeting their stupid criterias, nothing more. \n\nTerentiy was the last to expect that some priests over at Gayny would not only conquer Vyatka, but the entirety of Western Russia region. Even more unbelievable is that they chose a Patriarch that was a proponent of democracy. Although shocking, Terentiy still did not believe that a conservative Patriarch would do anything about labor laws. \n\nThat was, until one day - Terentiy was working hard as usual, when suddenly a group of people he didn’t recognize came into the factory, led by none other than Patriarch Izvekov himself, who promptly started a speech: “Honest workers of the Republic! Today, in this factory, and all across our Holy nation, workers shall be recognised and justly rewarded for their monumental efforts done to preserve and improve our nation’s foundation, our skeleton! You there sir!” - He suddenly gestured for Terentiy to approach him - “I was told that you are this factory’s most dedicated worker,” - Terentiy slowly came forth - “You sir, are truly an example to us all! It would only be right to award you with premium, and I promise you sir -"
 GAY.98.a: "Labor will no longer be forgotten!”"

 GAY.99.t: "The Woman Of Steel"
 GAY.99.desc: "Izvekov didn't think he would find many similarities in himself with Svetlana Stalina of all people. Their opposite religious views aside, she was the daughter of a communist who tried to vie for the red throne itself, and though she didn't get her father's political views, she did get from him his stubbornness and refusal to back down at any moment. \n\nThere was a good reason this woman was known as the Woman of Steel, and it made Izvekov relieved that this was the end of their differences, and that only similarities followed from there. \n\n"And that is why we must be capable of arresting any proven fascist or communist opposed to our cause," Stalina rambled, just as she was doing five minutes prior, and she never stopped till now, "Any comments, Your Holiness." \n\n"Yes." the Patriarch nodded, "I agree with your goal, but does arrest and jailing seem too harsh for them? Perhaps rehabilitation should be considered a possibility for them." \n\n"Our democracy is still fragile." Stalina responded back, taking a cigarette from her pocket to light it and give herself a good smoke, "The enemies of it will do anything to destroy it and replace it with death and godless tyranny. I'm sorry, Your Holiness, but it's the only way." \n\nAs much as he would try to deny it, the rational part of his brain told him that she was right in everything she said, because it was a matter of fact that they were stubborn in their beliefs and would overthrow the government before they could change their political views. At this hour, the most important one of the country's history, this was indeed the only way. And so he looked back up at Stalina's wrinkled face and said:"
 GAY.99.a: ""You're right, then. We will discuss other matters later.""

 GAY.100.t: "The Only Thing A Sinner Deserves"
 GAY.100.desc: "Antipin yawned as he was escorted across the burning ruins of Perm. It would be an understatement to say that the soldiers of the Order hated the Brotherhood and everything it stood for. Although Antipin himself resonated with said hatred, he was more so in contempt of the whole establishment, all he could think was “What a bunch of pathetic losers, Stockholm syndrome can’t even begin to explain how braindead this all was.” \n\nComing up to a bunch of leftover Ari-shits left kneeling before a naked wall with bindings on, Antipin demanded from one of his entourage to give him a gun. Stepping up to the right-most captive, who was in the middle of crying, he started a monologue - “You know, all of this is just the fault of your insanely low intellect. If only you figured out that THINKING you’re superior DOESN’T actually make you superior, or God forbid, you would find somebody else to copy than the FUCKING NAZIS. But here we are.” *BANG* \n\n“All you guys are good for now is being left on the ground with a bullet in your head,” He moved to the next one, who was defiantly staring down Antipin - “either becoming food for scangers, or slowly fertilizing the ground” *BANG* “The Lord is my witness, you lot aren’t even worth being the dirt under Satan’s fingernails.” Moving up to the next one, Antipin noticed something weird about this sketchy bald guy, - “Hold on a fucking second.” Crouching in front of him, he grabs his face and takes a good look at him - “Well if isn’t the good Fyurer himself. Ha-ha-ha, you think becoming an actual baby-face skinhead would mean no one could recognize you? You’re the progenitor of all this chaos!” Standing up, Antipin orders two guards to lift him up."
 GAY.100.a: "“I won’t give you the satisfaction of a quick and painless death, imp!”"

 GAY.101.t: "Cautiously Optimistic, Positively Excited"
 GAY.101.desc: "The sun was shining down the streets of Gayny, as the early afternoon air was as fresh as it could possibly be. As expected, many people were spending their time outside, though the atmosphere in the streets was nothing routine, with several groups of visibly happy people celebrating. Celebrating what exactly, you may ask? The inevitable reality of the young Republic’s total victory. \n\nInside Izvekov’s same old office, the Patriarch was sitting in front of a few of his top generals and Konstantin Katushev, and while they recited the latest results, be it about the population of the Ural region, resources, or even the possible partisan movements from the remnants of their recently defeated enemies, Izvekov could only think about how unbelievable it all was. He was trying his hardest to hide his bewilderment that permeated him throughout the day, mostly through his eyebrows. And even though Katushev kept looking back to Izvekov while he was reading out civic reports, the man did not think much of it, mostly worrying if he was even delivering a good speech. \n\nAs the reports were wrapping up, Izvekov used all his might to compose himself, and stood up to his men, and, after they were finished, he spoke out: “By the Lord’s Will, not mine, have we undergone this great test of Faith, and came out with a win. I thank you on behalf of our People, our Flock. And, while it is clear that not everything went as smooth as one might hope, one thing is clear - "
 GAY.101.a: "Nothing can stop our pious advance now, for that is the Lord’s will. Amen!”"

 GAY.102.t: "The World God Only Knows"
 GAY.102.desc: "A convoy was making its way through the Sverdlovsk countryside. It wasn’t that long ago when this place was a battlefield, and it shows - craters dotting the fields, big and small, an undetonated artillery shell here and there, numerous vehicles blown up or left behind by the enemies. As smoke was rising from the recently captured city in their horizon and disappearing into the gray clouds, Pavlov was carefully observing the scenery, making sure to remember what it took to get where they are today. \n\nArriving at the city center, a big hole in the city parliament was among the most noticeable things across the square. As soon as the vehicles stopped, Pavlov stepped outside, followed by the Order’s soldiers, who came out in droves from the personnel trucks, and, after getting the go-ahead from the Patriarch, moved on with the procedure. They would gather every citizen still left, and round them all up in the square, where the Patriarch patiently waited. \n\nAfter a couple of hours, most of the citizens were gathered, although some of them were roughed up for having resisted authority. Pavlov secretly winced at the sight, took a deep breath, and began: \n\n“Good people of Sverdlovsk! Do not be afraid! Let me start by officially welcoming thee as brethren people in this Holy Russia. The Lord brought us here today to deliver salvation - from the worst possible position that our people have found themselves in. It is, however, deeply regretful, that the good Russian people have allowed cruel ideologies and decadent ideals sow strife between ourselves. But no more! For while it is not the end of our current struggle, I implore thee, good people of Sverdlovsk, to accept the rule of God, and allow the Faith to guide everyone to glory. In the name of the Father, Son, and the Holy Spirit, amen!” \n\nNo one in the crowd responded."
 GAY.102.a: "And though the air is not as tense as when the speech began, Pavlov felt a stone in his throat from the deafening silence."

 GAY.103.t: "Baptism by Fire"
 GAY.103.desc: "Within the Great Cathedral, Antipin waits as his followers fill in the large space. He surveys the cathedral and sees that all eyes are on him, except for his most loyal followers, who are praying in front of the altar. His followers eagerly await his important announcement. \n\nAntipin clears his throat, “My people! I come before thee to announce a vision given to me by our lord and savior Jesus Christ. As we all know, we live in troubling times and the world around us becomes more dangerous as time goes on. So, we sought new ways for protection.” \n\nThe crowd became curious and they all talked amongst each other. Antipin paused and waited until everyone calmed down. \n\n“Yes, you all are wondering what I mean. We don’t need any sort of protection but from our very own lord and savior! But of course our lord and savior needs some support and that’s what our holy soldiers are for. But no I do not wish to unveil a new holy army, not a new law to govern our lands. No, it is something that will intimidate the world, including the German devils to the west!” \n\nNow the crowd was even more intrigued. What could it be? What does Antipin have in mind for the people’s protection? What could possibly scare the Germans who seem to be hellbent on exterminating the Russian people with extreme bloodlust? \n\n“My most loyal followers, I come before you to announce that our holy kingdom will commence its very own nuclear program!” \n\nIt was silent at first, but suddenly cheers erupted from the people. Finally, the ultimate deterrent is going to become theirs soon. Their safety is now secured. \n\n“Yes, indeed! Soon we will harness the power of the atom, allowing us to purify our old Russian lands from the German filth and show the world our kingdom’s divine might! I challenge those German devils to step foot into our lands and be purified by a baptism of fire!” \n\nThe crowd’s cheers were so loud, Antipin could feel the ground shaking beneath him. He motioned for the people to quiet down. \n\n“Yes, it is something that requires celebration. But, this process will take time and our safety and power is not guaranteed just yet. We are still feeble and weak against the sinners of the world. But I assure you, it will be done and our Kingdom shall rise onto the world stage and become a formidable power. Thank you, my most loyal followers and peace be with you” \n\nAntipin hurriedly walks off the stage. Soon, he will be able to wield the power of the atom for their holy crusade!"
 GAY.103.a: "May the world experience their divine might!"

 GAY.104.t: "How To Kill Your Devil"
 GAY.104.desc: "As time grew closer to late evening, and the sun shone its last lights for the day, the front yard of the church of Gayny was getting filled with cars, and out of each one came out at least one priest. Not wasting any time exchanging pleasantries with each other, mostly because no one in this crowd of priests was on good terms with the others, they all rushed inside the marble building. \n\nPavlov was busy reviewing his notes in preparation for this inevitable discussion, standing behind a recently set up stand in front of the altar, as the aforementioned crowd poured into the building. Quickly skimming through the notes one last time, Pavlov looked up, and waited for the priests to gather. Movement eventually ceased, and the Patriarch raised his hands in a welcoming gesture: “Brothers! Fellow men of the Cloth! Praise the Lord for allowing this Conclave to gather!” A few of the priests responded: “Praise be!”, though most were silent. Pavlov lowered his hands on the stand: “I will get straight to the point - the reason for this Conclave gathering here today is-” \n\n“The Hun!” - someone in the crowd yelled out, which sent the priests into a bit of a disarray. A considerable number of the priests had jingoism to rival that of Antipin, visibly angry even being reminded of the Germans. Suddenly, a meek voice spoke out: “Must we really fight the Germans? How can we be sure that we could fight their war machine and emerge victorious, when so many had failed before?” Immediately, the first voice responded: “Spineless fool! Apathy is death! We need to act, before-”  \n\n“Brothers!” - Pavlov raised his voice, silencing the noisy crowd - “It is deeply regrettable that this Conclave has split so heavily on this issue. I have no choice but to use my right as the Patriarch to rule on this decision… \n\n…We will not stand idle while there is a constant threat to the West, which not only occupies our land, but has us living in fear."
 GAY.104.a: "The Germans will be stopped, for the sake of Holy Russia!”"

 GAY.105.t: "Indoctrination"
 GAY.105.desc: "It was a cold day today, a strong wind blowing through the compound with a slight snowfall. The cold bit Antipin’s skin but he was used to it. \n\n“ATTENTION!” A guard announces as Antipin walks into the compound. \n\nAntipin hears a loud clacking of boots as he walks in and he looks upon the crowd of fresh recruits in front of him. He thought they would show signs of distress from the cold or look at him with hatred. But they were disciplined, standing tall, eyes forward. All these young men, standing at attention, surprised him. These recruits, received from Western Siberia, were mostly made up of men from the Black League. He knew how hellbent and fanatical they were with destroying the Germans and reclaiming the old Russian lands. Some say they are purely fueled by hate. Because of this Antipin can't let his guard down. \n\nHe walks through the rows, accompanied by two guards, and inspects his new recruits. Some of them were scrawny, like they were on the cusp of death. Antipin was sympathetic to them as he shared the same experience as they did, struggling for food and water. Some are tall and brawny. If they could, they could snap Antipin in two. Some just looked like they weren’t fit to fight. Either they looked overweight or underweight, they seemed like they couldn't even pick up a gun. Even then, he knew they were all capable of having bloodthirsty tendencies. \n\nBefore Antipin left, he looked upon the crowd one last time. He knows some of them have their own unique struggles, which he wishes to solve. While some of them have their unique strengths, which he wishes to exploit. With that, he wishes to build a strong standing army deserving of unifying the Russian people in the eyes of God. As he leaves, he announces to the crowd…"
 GAY.105.a: "“We welcome thee to our holy crusade!”"

 GAY.106.t: "No Room for Degeneracy"
 GAY.106.desc: "Antipin walks into the snow-covered forest. In the distance, he sees a flickering orange light, coming from torches for the coming ceremony. The snow on his feet starts to burn but he walks through the pain as he knows that Jesus Christ will protect him through every step of the way. He got to the clearing and in the center are people, standing in a circle. They all notice Antipin’s arrival and all of them bow to him as he walks through the small crowd. Within the crowd, are his most devout followers, kneeling and praying. While in the center of it all was a singular man and one of Antipin’s guards holding a torch. Antipin knew what that man had done, he was a rapist. \n\nHe takes off his coat and starts to talk to the crowd, “My most loyal followers! Feast your eyes upon this sinful degenerate! Watch as the consequences of his actions be put upon him by the devil!” The crowd around Antipin cheered loudly, echoing through the forest which surrounds them. \n\n“PLEASE! PLEASE! I’LL DO ANYTHING! I’M SORRY, I WON’T DO IT AGAIN!” \n\nAntipin noticed the tears running down the man’s face. He had a small feeling of sympathy for the man, but he had to set an example for his people. “My loyal followers, do you hear him? Do you hear Satan pleading for his life? Do not be deceived by his falsehoods. If we let him free, he will repeat his sinful acts on other poor souls within our glorious kingdom!” \n\nHis followers jeered and started throwing rocks at the man. Antipin’s guard shoots at the air to calm the crowd down. “PLEASE I AM SO COLD. HAVE MERCY!” \n\nAntipin looks at the man, “The sinner begs for mercy! Should he be given mercy?!” Cheers erupt from the crowd.“Then mercy shall be given!” \n\nHe looks back at his guard holding the torch and nods his head. The guard then throws the torch onto the bonfire the man was standing on. It instantly combusted. The man’s screams could be heard for miles and Antipin stared at the inferno as it consumed the sinner until his screams were eventually quiet."
 GAY.106.a: "No mercy for sinners."

 GAY.107.t: "A Prayer For Peace"
 GAY.107.desc: "“Our Father, who are in heaven, hallowed be your name. Your kingdom come, your will be done, on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses, as we forgive those who trespass against us. And lead us not into temptation, but deliver us from evil.” \n\nAll the eyes in the cathedral were glued to the Patriarch, it is as though he was talking directly to them at this very moment. This kind of atmosphere could most definitely be attributed to the upcoming war. The final war of Russian reunification. And while most people felt the pull of the sermon due to this internal anxiety over the war, it is undeniable that a good portion of the people here genuinely believed. They prayed with him, not just listening, but taking the words to heart, to their very soul. \n\nIt felt like forever since Pavlov was in his element like this - preaching the Good Word. He absolutely lost track of time, fully immersing himself in a passionate sermon: “...And Jesus called to him the multitude with his disciples, and said to them, ‘If any man would come after me, let him deny himself and take up his cross and follow me. For whoever would save his life will lose it; and whoever loses his life for my sake and the Gospel’s will save it…” \n\nDoubts over his every decision that led him here, they were still in the back of his mind. They never left him, and probably never will, however it doesn’t matter. “So long as I can spread the Faith, let it touch the hearts and souls of good people, and let it spread even further, it will all be worth it in the end.”"
 GAY.107.a: "This was all he ever wanted."

 GAY.108.t: "In No Need For Cake"
 GAY.108.desc: "Fyodor Petrovich could probably be best described as a lower-middle class citizen. Living in a single bedroom apartment with his wife Ulyana, and two kids - Igor and Natasha, he lived a simple life of a warehouse worker. Wages might be a bit subpar compared to that of those that are in commanding positions, but he could feed his family, pay for the children’s education, and twice a year even get enough saved up to buy top quality meat and have a small feast for the household. \n\nOne Sunday morning, Ulyana told him that they are running out of bread, and a few other things. Fyodor was a bit annoyed to have to spend money right now, as they were still a week away from the pay day, and he would have to use his savings for this. Nevertheless, he got dressed, kissed his wife goodbye, and went out into the busy streets. \n\nCold early morning air hit him with full force, as unfortunately the wind just started to pick up right as he left the building. In this weather any stalls he usually frequented would not be open for business. Against his better judgment, Fyodor went to a grocery store that opened last month, much to the dismay of many vendors he bought produce from. In about half an hour he arrived, the concrete building of the store looked out of place next to the old rustic houses. Upon entering, he looked around - many different stands filled with produce, enough to make your head spin, and there's even a few stands of canned goods, and a couple of refrigerated stands with dairy products. Going over to the bread aisle first, Fyodor’s eyes almost went out of their sockets from shock - most of the bread on display was twice as cheap as the bread he bought from street vendors, and the rest was even cheaper! After composing himself, Fyodor took all the items he needed to buy and went to the cashier…"
 GAY.108.a: "“That will be 40 roubles and 87 kopecks. Thank you, please come again.”"

 GAY.109.t: "Our Just Reward"
 GAY.109.desc: "Fyodor Petrovich could probably be best described as a lower class citizen, someone that is seriously down on his luck. Barely scraping by, working as a barracks’ janitor, earning just enough money to not starve, living in a communal house without indoor heating with his wife Ulyana. Some days Fyodor wakes up to her wife crying - they had to give their kids over to the church because they weren’t able to provide for them, not since the change in regime. \n\nOn a cold Sunday morning Fyodor stepped outside of his room to find most of his neighbors putting on their outerwear in a hurry. He asked his neighbor-friend Vlad what is the commotion for, to which he responds: “Haven’t you heard? The Patriarch has issued a relief program for the poorest citizens, the only real requirement is being Orthodox!” Vlad chuckled as he slipped himself into his jacket, - “You should hurry as well, who knows, you might miss out.” \n\nFyodor wasted no time putting on his outerwear, quickly kissed his wife goodbye, and headed out with the small crowd. Outside the air was even colder, of course, but that did not hinder Fyodor as he went out of his way to get ahead of the crowd, almost breaking into a run at one point, but finally spotting a giant line in the distance. His heart sinking, Fyodor resigned himself and took his place in the line. After what felt like forever, Fyodor was finally in sight of his goal - two priests were handing out sacks to those in front, guarded by no less than four soldiers in full combat gear. The sacks were not large, they were all the same, and worst of all - they were running out. Fyodor was anxious, it might be that he was standing in the line for nothing… \n\nBut finally, his turn arrived, the priest quickly looked Fyodor over, and handed a sack to him. Carefully taking it, he hurried back home, and once he arrived, he opened it with his wife…"
 GAY.109.a: "4 kilos of buckwheat, some turnips, two loaves of black bread, a can of condensed milk, and a 2L bottle of holy water."

 GAY.110.t: "For Whom Does The Bell Toll?"
 GAY.110.desc: "Father Afanasiy was still mulling over the assignment letter when they got within viewing distance of their destination. “How am I supposed to oversee this convention when I know next to nothing about politics? What do they expect a man of the Cloth to-” Afanasiy, train of thought is cut short by his car stopping. He finally broke his stare from the assignment paper and looked out the window - he arrived. \n\nUpon entering the room, Afanasiy was hit with an incredibly stale smell, as well as loud yelling coming from all around him - the discussion was already in progress. A few seconds later they noticed that the doors opened, and quieted down - “Ah, good Father, apologies, some of us were a bit too eager, and couldn’t wait a little bit before blabbing on about things they don’t understand-” A well dressed man addressed Afanasiy before being cut short by a person in simple clothes: “I will tolerate no such slander! You clearly provoked-” Afanasiy finally got to his seat and raised his voice: “I implore thee to calm thyself! It is unbecoming of good Christians to be at each other’s throats.” \n\n“Now, to confirm the topic of conversation, is it correct that this is regarding the matter of death penalty?” Some clear their throat, some cough, most people nod their heads, after which the well dressed man speaks: “Indeed Father. And it is imperative that we institute it as a viable legal decision when dealing with any criminals, so that-” The man in simple clothes cuts him off yet again: “How dare you mock the sacrifice of our Lord and Saviour Jesus Christ! He received a cruel punishment and took it in order to absolve humanity of their sins!” The well dressed man scoffed: “Oh how rich, equating every murderer and rapist to Jesus, you immature imbecile!”"
 GAY.110.a: "Soon after the room was once again as loud as before. Afanasiy could not get a word in, and after a while only prayed that they run out of breath soon."

 GAY.111.t: "Divine Retribution"
 GAY.111.desc: "AFTER ACTION REPORT: \n\nAn outpost was found near our border with the Reichskommissariat and to prevent any future German plans in raiding our Kingdom, I tasked my battalion with raiding the outpost. \n\nThe outpost had three guard towers with German guards manning each one. Each tower allowed the outpost to have a 360 degree view of its perimeter. So, we planned on attacking at night. There was also a German convoy that came in every few hours, probably bringing in more supplies, which we can assume that the outpost is fairly new. The walls were luckily made with logs and sticks which made it easier to find an entrance into the outpost. We were going to take everything they had from guns to their food while also leaving no prisoners as the German devils didn’t deserve mercy. \n\nMy battalion prepared for the attack at 1800 hours, setting up a forward operating base. They then attacked at 2400. Under the cover of night, they snuck through the brush and had the element of surprise. My battalion vastly outnumbered the German devils, 3 of ours to 1 of theirs. The raid lasted for about thirty minutes. It was a bloody battle but it eventually led to a major victory. We looted the armory and their kitchen. After that we rounded up the rest of the Germans who surrendered and executed them via firing squad. \n\nWhen we finished our raid, everything was utterly destroyed, buildings were on fire and corpses of the German devils littered the outpost. This operation was a major success and I wish to serve the Kingdom of Christ a lot more in the future."
 GAY.111.a: "May Christ watch over us, Commander Niko Malinovski"

 GAY.112.t: "Letting The Holy Father Cook"
 GAY.112.desc: "Kostya never was one with much interest in spiritual things. When his beloved mother died in a Nazi air raid a few years ago he could care less for whether she went to Heaven or not, he was simply devastated over the loss, a sentiment that is most prevalent in recent days. So when his dad suddenly brought him over to a church on a Sunday, months after Vologda was taken over by the Orthodox priests, it was clear that he was not thrilled to be there. \n\nDespite the initial dislike, Kostya was calmed by the smell of burning candles everywhere, and the overall warmth of the place. Incidentally, the Patriarch himself has come here to give a sermon. Seems like this is the reason for his father suddenly bringing him here, Kostya thought. Seeing as there’s nothing much better to do, he listened… \n\n“O God of spirits and of all flesh, Who hast trampled down death and overthrown the Devil, and given life to Thy world, do Thou, the same Lord, give rest to the souls of Thy departed servants in a place of brightness, a place of refreshment, a place of repose, where all sickness, sighing, and sorrow have fled away. Pardon every transgression which they have committed, whether by word or deed or thought. For Thou art a good God and lovest mankind; because there is no man who lives yet does not sin, for Thou only art without sin, Thy righteousness is to all eternity, and Thy word is truth. \n\nFor Thou are the Resurrection, the Life, and the Repose of Thy servants who have fallen asleep, O Christ our God, and unto Thee we ascribe glory, together with Thy Father, who is from everlasting, and Thine all-holy, good, and life-creating Spirit, now and ever unto ages of ages. Amen.”"
 GAY.112.a: "By the end of the sermon, Kostya was bawling his eyes out, desperately hoping that his mom made it safely to heaven."

 GAY.113.t: "How Good is a Shepherd, if He Loses His Lambs?"
 GAY.113.desc: "Antipin overlooks a company of soldiers, all in mourning. Some shed tears while others stared far into the sky. Their commander treated them like kings and his skill on the battlefield was unmatched by any other commander they knew and he led them through countless victories. Is anyone even worthy enough to replace their beloved commander? Does anyone even compare to him? Antipin knew how they felt and he wanted to give them their right of revenge. But he knew they wouldn't be able to fight in their current state. Antipin clears his throat and all eyes are on him. \n\n“My holy crusaders! I stand before you today to mourn our beloved commander Morozov. Slain by the German devils. He was a man, blessed by God with numerous talents. Especially his talent on the battlefield. You all know this. He was blessed with the gift of sympathy, something that is not common in these times. You all know this. But most importantly, he was a determined soldier, who was ready to sacrifice himself in the name of the lord! He knew the price we ALL have to pay on our holy crusade! I hope you all know, even in death, Commander Morozov is still with us, watching over us, leading us as he did during his time with us!” \n\nThe mood of the crowd suddenly rose. Some were cheering and some were raising their weapons into the air. \n\n“Do not let his death be in vain. Let his skill in leading pass on to you all. Let his sympathetic nature pass on to you all. Lastly, let his inextinguishable fervor pass on to you all. Let me repeat once more, do not let his death be in vain! Now, my holy crusaders! This is your chance for enacting revenge for our Commander Morozov! A German camp lies just North of here! What say you? Should the German devils get what is coming to them?!” /n.nCheers erupted from the crowd. Bottles and weapons rose to the air. “Hm. May God have mercy upon their wretched souls. To battle!” \n\nThe men charged towards the small German fort, weakly fortified and soon there was nothing left but a pile of ash."
 GAY.113.a: "Remember that you are dust, and to dust you shall return."

 GAY.114.t: "The Gun Is Your Friend"
 GAY.114.desc: "Gleb, a fresh recruit from Vyatka countryside, only ever had experience with guns in the form of his cranky neighbor Tikhon, who would always chase Gleb off with his Mosin rifle whenever the young lad went into his garden to steal something growing there. He never imagined that a very similar rifle could end up in his hands, and he’d be expected to use it against people. \n\nAlthough getting used to this would prove to be quite the struggle, he took solace in knowing that he isn’t the only one with no prior experience in this - he quickly made friends with Grigoriy, Sasha, and Ilya, his bunkmates, and pretty much inseparable comrades, even in training. Today’s drill was finally one to be excited about - a shooting range. An hour ago Gleb overheard some fellows in the barracks saying that this whole training regiment was engineered by an American sergeant, and so Gleb secretly wanted to show that Russians can easily clear any challenges, especially those from Yanks. \n\nWhile all he was taught up until that point was “how to clean the gun”, from watching Tikhon aim and shoot at birds pecking at his apples he had some inkling of an understanding about the real thing. “Private Zamyakin! Forward!” Gleb was finally called up to the range, and he walked up to the sandbags, - “Take aim!” He places the gun roughly how he remembers it was placed, secretly praying that it won’t dislocate anything, - “Ready!” He breathes in and out a couple of times, then takes a deep breath, - “Fire!”"
 GAY.114.a: "By the end of the drill Gleb still hadn't woken up from being knocked out cold by the butt of his gun, although he’s not lying in dirt anymore."

 GAY.115.t: "Celebration of the Baptism of Christ"
 GAY.115.desc: "There are many occasions to celebrate the Son of God, Jesus Christ, throughout the year for his followers, but the Baptism of Jesus is one of the most important events to commemorate the Beloved Son of the Lord. This wasn’t the first time Pavlov has held a sermon over one of the most important events in the life of Jesus Christ on this Earth, but that doesn't mean it's any less special to him, his soldiers that will reclaim Russia for God, and any of his congregation here in Gayny. \n\n“On this fateful day, nearly 2000 years ago, the Lamb of God was baptised by John the Forerunner.” Pavlov began, as he started his sermon to his congregation. Almost the entire town showed up to his sermon. Many did it as a form of escapism. From the German bombing runs, to the Famines to the constant bandit attacks near Gayny, there are many things to fear, so they must remember what they believe in even as the country they once knew has fallen apart if they want to see another day. “John believed he was unworthy of baptising the Son of God, ‘I have need to be baptised of Thee, and comest Thou to me?’ he said to Jesus, but Jesus simply said ‘Suffer it to be so now, for thus it becometh us to fulfil all righteousness’. Jesus wanted John to set an example to the people and fulfil everything within the eye of the Lord”. Almost the entire church was listening to Pavlov’s words. They’ve heard this sermon before, many times in fact, but in this day and age, they cling onto the old traditions and the Order of Saint George. \n\n“Once the Baptism was finished, a bright light shone from the Heavens, the spirit of the Father of Christ descended as the spirit of a dove, saying ‘This is My beloved Son, in Whom I am well pleased’”. Jesus’s Baptism reminded Pavlov of when he started the Order. The Baptism was the start of Christ's mission to spread his word and the word of God. Pavlov remembered when he was taken in by the people of Gayny after the Great Patriotic War, when he saw a vision sent by the Lord. That was when he decided to start the Order of Saint George. He is certainly no Jesus, but he will be a loyal follower of him."
 GAY.115.a: "O Christ our God Who hast appeared and hast enlightened the world, glory be to Thee!"

 GAY.116.t: "Horrific, Petrifying, White"
 GAY.116.desc: "Constantly looking over his shoulder, always going with the crowd, making sure to check around every corner - paranoia has taken over Anatoliy. Last month it was his co-workers and secret comrades - Evgeniy, Irina, Boris, Anna and Pavel. Last week it was his brother Oleg, his uncle Konstantin and his closest friend Nikolay. All of them have disappeared without a trace. Of course, nobody paid any mind to the disappearances, in fear of becoming the target. Everyone in the town knew what it was at this point, everyone had the name of this secret hunt on their lips, yet none dared to say it… \n\nAnatoliy peeked around a corner of the alley, and froze. There they were - clad in black and white combat gear, balaclava masks covering their faces, and with a shiny golden cross emblem on their shoulders. Antipin’s dogs. And it seems that they’ve gotten another victim, who Anatoly recognizes, and it gives him cold sweat - Prokhor, the (now former) leader of their secret group. Anatoliy stops looking into the alley and runs into the direction he came from - “How? When? Did someone snitch? I cannot believe this, they came after him, and now they’re gonna go after me! Oh my god!” - Thought Anatoliy, as he rushed across the emptying street back to his home. He cannot stay there, he has to collect his things and move, somewhere, anywhere. \n\nDry heaving his way up the fifth flight of stairs, Anatoliy finally comes to his floor, only to fall to his knees when he looked up, and saw similar looking men to those that took Prokhor - “Ah, greetings “comrade”. We were wondering where you were, so nice of you to come straight to us.” Before Anatoliy mutters a single word, someone puts a bag over his head."
 GAY.116.a: "Terror."

 GAY.117.t: "The fruits of our labors"
 GAY.117.desc: "Outside the window, a warm, drizzling rain was pouring, washing away all evil spirits, dirt and similar impurities from the Russian land. It hasn't been that long since the damned German pigs finished destroying and bombarding the holy land.In the window of the Patriarch's Palace, only a faint lamp light shone, reminding that someone was in it. \n\nAt the table, in his typical work attire, Antipin was sitting and slowly sorting through the reports, reports and denunciations that had come to him today.Having dealt with the little things, he finally found what he needed: five reports...the main reports - on the state of the army, economy, garrisons, population, foreign policy, intelligence and promotion of the true Christian religion on the Russian land - recaptured from the remnants of the Boche, demons, apostates and other rabble, not worth the attention of God. \n\n"Come here, Sergey, they brought something nice here." Antipin said, now raising and lowering his eyes to the documents, then to Taboritsky sitting opposite him on the chair. Sergey rubbed his hands in anticipation and stood up, straightening his favorite fur coat. "What's Mikhail doing there?" Sergey asked cheerfully, heading to the table to see what his friend wanted to show. \n\n"Reports have come, Seryozha, on the most important topics." looking at Taboritsky, Mikhail said. \n\n"How many infidels have we destroyed for the good of God this year?" having already approached the table, Sergey began to peer into the papers, looking for relevant information. \n\n"Oh, Sergey, is that all you care about?" Antipin raised an eyebrow questioningly. \n\nTaboritsky laughed. "Well, of course not, we just liberated so many territories of Holy Russia, they are probably full of traitors." \n\nThe Patriarch nodded, "Sergei, you're right, traitors to the word of God, as well as devils in human form, are a dime a dozen. \n\nThese two sat and looked at the reports for a long time, laughing and rejoicing in their victories, rejoicing in the state of the army, the increase in the quality of life of the Russian people, rejoicing in the increase in industry...They rejoiced at the slow but faithful unification of Russia under God, those who have always protected the Russians… For when Russia will be united again... God's punishment will befall every German woman, child and man..."
 GAY.117.a: "God's judgment is coming, and it's very close"

 GAY.118.t: "A Rifle for every Warrior, and a Revolver in every Holster "
 GAY.118.desc: "Five hundred rifles in just 2 weeks. Now that was something Commander Malinovski could be proud of. He remembers the days when he was lucky to get fifty rifles in a month. Niko smiled as he threw his left arm over Ioann’s shoulder. “Ioann, you know how to make God happy, I remember the days when we just had enough rifles to equip my platoon, now we’re able to fit an entire army and still have some of them leftover” Niko said to the delivery man. \n\n“What can I say Niko, all the boys in the factory want our country back, and that attitude is how we can make so many guns for your men” Ioann replied as he finished unloading the last crate of rifles from his truck. He remembers when the only guns he could get were from small workshops in Gayny. Now he’s delivering guns from everywhere. Refurbished Soviet rifles from Kazan, officer revolvers from Perm, grenades from Samara, hell he even got a new delivery truck from Vyatka. Things were really looking up for the Kingdom of Christ \n\n“You know what, I say we treat ourselves, least we can do before I head east” Niko suggested as he walked over to a storage room. Not long after he came back out with a crate of Vodka. “Here we go, the finest Vodka Vyatka has to offer, definitely much better now that the stupid monarchist is gone” Niko said as he grabbed two bottles of vodka, handing one to Ioann, which he gladly accepted. “How about a toast? To really make it special” Ioann suggested as he opened his bottle. “How about to Russia? Or the People? Or God?” Niko shook his head. “No, how about we toast the man who got us to where we are now?” Ioann gave a nod of approval. “I can drink to that”. Both men raised their bottles in the air…"
 GAY.118.a: "“To Patriarch Peter II!”"

 GAY.119.t: "Mending The Schism"
 GAY.119.desc: "Evening was setting in, as Pavlov retreated to his private chambers. Used to be that he had to light a lamp, or even just candles, and use those for light, but now the entire building has electricity, with lightbulbs lighting the way, as well as his room. As he stepped in, the first thing he saw was a small heap of letters on his desk. Pavlov sighed in exasperation, although he did ask to not be disturbed today people still needed important things from him, hence the letters. \n\nResigning himself, he sat down before his desk, and skimmed through the letters. Conversion requests, letters about resistance to said conversion, an invitation to a church opening, ministers asking to sign some papers, with a fat stack of papers under the desk… \n\nPavlov’s weary eyes almost missed it, but among them was a letter he could not simply ignore. He rubbed his forehead, and double-checked the sender: His Holiness, the Pope of Rome. Carefully, he opened the letter: \n\n“Honored Russian Patriarch of the Orthodox branch of our hallowed Christian Faith. \n\nI pray this letter finds you in good health, for we all find ourselves in grim and uncertain times. I am sure you understand why I write this letter to you now, - the world is more hostile than ever to the Good Word of the Bible, and the honest faithful in general. I, for one, have been utterly surrounded by the spiteful malignancy that is Fascism, and still see its hold over many people in Italy, and most of Europe. It is for this reason, and so many more, that the Christian world must come together as one! Sects of our Church mean nothing when the followers of the Crooked Cross eliminate all who do not revere it. ‘Tis blasphemy, I say!..” \n\nThe letter did not end there, but Pavlov already pulled out parchment and a pen."
 GAY.119.a: "Overjoyed, he wrote a long-winded response letter that basically said: “YES!”"

 GAY.120.t: "A New Kind Of Baptism"
 GAY.120.desc: "“What you hold right now is one of the cornerstones of our military - the Kalashnikov automatic rifle. Feel the weight! Its bullets can pierce through thin walls, be that concrete, stone, wood, especially wood! Several times in fact, if it’s some cover made out of wood! And all that power will most assuredly make you fall flat on your backs if you don’t grip and hold this beast tighter than a lion! While the German peashooters can hit a watermelon from 100 meters, the AK can blow it to smithereens from just 5 meters!..” \n\nPrivate Nikita stood in the second row from the instructor, who waved around the AK with one hand like it was nothing, while Nikita himself could scarcely hold the thing without his hands shaking, all while standing at attention. A highschool graduate from Onega, he thought his life would not amount much to anything as he moved around the country that took over his used-to-be homeland. After living as a farmhand down in Bashkiria for over a year, seeing the patrolling soldiers every once in a while, and soaking in their lively fervor as they passed by his field, well, something stirred inside him, and led him here, where he slowly adjusts to holding the weighty rifle. \n\n“...At first most of you will most likely not be quick to reload the weapon in such a manner, fumble a magazine and drop it - and it can result in your death! Especially if you are careless enough to bend over like a woman while the enemy takes his aim at your head! Alright, I will need one of you to come forward, see if you lot are taking my lecture to heart. Private Isayev, to me!” Nikita jerked forward, as if puppetered over to the instructor, - “Now, show “the class” how to reload the AK!” In a blind effort to prove himself, Nikita got the magazine out in a hurry, but dropped the rifle as he lost his careful stance."
 GAY.120.a: "A facepalm and a sigh later, the silence was broken by the instructor, - “At least the rifle wasn’t loaded. NOW PICK IT BACK UP, PRIVATE!”"

 GAY.121.t: "How To Expand The Lord’s Coin Purse"
 GAY.121.desc: "“We’ll do it by committee, according to well-established rules that I, and many others, adhere to. I absolutely will NOT have you oversee the economy on your lonesome, are we clear, Brother Izvekov?” - these words from Pavlov sent the Patriarch and Izvekov into an intense staring contest. It was short-lived however, as Izvekov really didn’t want to deal with what he saw as a stubborn mule, - “Understood, Brother. But still, I want this “committee” to come together as soon as possible, we really cannot delay this matter!” Pavlov slowly nodded in response, with a sigh: “Yes, we shall send out the summons, it must gather in no more than a week.” \n\nAs if no time had passed between then and now, Pavlov and Izvekov now find themselves a week later, locked in another staring contest, now in a big conference room full of suited individuals from all over the country, who now wonder why they’re even here. One short haired individual in the middle of the table slowly raised his hand and said what everyone but the two priests wanted to say: “...Excuse me, can we move on to the budget discussion?” Pavlov and Izvekov both broke their stares at the same time and looked at this daredevil of a person. \n\nGulping audibly, he lowered his hand and continued: “It’s just that we began this meeting an hour ago, and ever since Father Izvekov proposed his plans for the economy, well, we couldn’t exactly get a word in, or even propose anything in return…” Izvekov rubbed his temples, and Pavlov clutched his beard, both in frustration, at the sheer ridiculousness of this situation. The good Patriarch now understood that this was all pointless - he only made everyone waste their time. Therefore he broke the silence first, and shocked everyone, even Izvekov:"
 GAY.121.a: "“My apologies everyone for making you come all this way, but today we will simply be using Father Izvekov’s plans.”"

 GAY.122.t: "Delivery for the Armed Forces of God"
 GAY.122.desc: "Fifty Rifles, just enough to finally outfit the entire platoon, thought Lieutenant Niko Malinovski, quality could certainly be better, but he’ll take what he can get. The platoon had God on their side, they were loyal to their core to their creator, but that's not worth anything if they had to fight with only sticks and shovels. Since this platoon was created, they lacked the critical gear to defeat the traitors and degenerates surrounding them. He turned to the delivery driver, who had just dropped off the crates of newly created rifles. “At least we finally got them. Glad to see the men at the factory are working as hard as us.” \n\n“Well, hard work can only get you so far” Ioann replied to Niko as he opened one of the rifle-filled crates. “Sadly we just don't have enough workshops or resources to make everything we need.” \n\n“Don’t worry my friend” Niko said as he grabbed some of the new rifles and laid them on the table “Soon we won’t be restricted to the factories here in Gayny, soon all the great cities and abundant workshops and endless piles of materials will be in our hands to give to God.” Niko smiled as he finished his sentence. Samara, Kazan, Perm. All these cities were within their sight, within the Patriarch's sight."
 GAY.122.a: "A Rifle a day, keeps the Heretics away."

 GAY.123.t: "God’s Love And Mercy"
 GAY.123.desc: "Sergey Mikhailovich Kuznetsov, someone who grew up in a life of crime, orphaned at a young age, he had to fend for himself, stealing from the elderly and women, other children, and, after growing up, from alcoholic men too drunk to fight back. Not that fights never happened, with other criminals for random scraps, or even those he stole from, that would catch up to him. Which inevitably led to him pushing an elderly lady too hard, her head crushing against the brick wall… \n\nIt might be because of all these crimes haunting him ever since that day, that he now finds himself in front of a church. Rain flowing down, he looks over the building, remembering how he never paid much attention to churches, but right now it somehow looks more daunting than a squad of patrolling soldiers. \n\nHe steps inside, as the warm lighting illuminates everything in a way that makes Sergey forget about that daunting feeling. Water dripping down from him step after step, he makes his way further in, drawn in by a voice that sounded calm, yet firm. Unable to look that priest straight in the face, he waited until he finished giving a speech, and stepped up to him. He gathered courage to look at the priest, and dropped to his knees - it was the Patriarch himself! The very same Patriarch that was now worriedly looking over him - “What is wrong, my child? Can I help you?” Sergey felt a lump in his throat, flapping his mouth uselessly for a moment, then finally speaking: “...I need to know, please tell me Father, can I, someone who crossed the line, ever repent for the things I’ve done?”"
 GAY.123.a: "Pavlov’s expression was much like his voice, - “The Lord guided you here for many reasons. Repentance might just be one of them. We will help you.”"

 GAY.124.t: "Repenting From Hereticism"
 GAY.124.desc: "Reporting from the border regions of the Army of Saint George, it is with great joy that we announce the news of the Tatar conversion to Christianity. In a stunning development, the Tatar community in the region has embraced the faith of our Lord Jesus Christ. \n\nAs tensions have risen between the Our Holy State and the Tatar minority, a blessed turn of events has taken place. Members of the Tatar community have begun converting to Christianity, prompting the attention of Mikhail Antipin. \n\nAntipin has praised the Tatars who have embraced the faith. He sees their conversion as a positive step towards unity and has lauded them with praise. \n\nIn a recent address to the nation, Antipin announced that the Tatars who convert to Christianity will be rewarded for their faith. They will receive a tax exemption and be granted access to the same opportunities as Orthodox Christians within the state. \n\nThe Army of St. George has also begun a campaign to promote Christianity within the Tatar community, sending missionaries to mosques and community centres to spread the faith. This move has received mixed reactions from the Tatar community, with some embracing the new faith and others vehemently opposing it. In time of course, all will accept the true teachings of our Lord and Saviour. \n\nDespite the backlash, Antipin remains committed to promoting unity and the true religion within Russia. He believes that by embracing Christianity, the Tatars will become a vital part of the country's future and will be able to contribute to its growth and prosperity. \n\nOnly time will tell how this development will shape the future of the Tatar community within Russia. However, one thing is certain:"
 GAY.124.a: "The Army of St. George thrives."

 GAY.125.t: "Quotas For Everything"
 GAY.125.desc: "Artyom remembered when he used to work at an old Soviet munitions factory in Gorky. Back in Gorky, he helped make the shells that Soviet T-34 Tanks needed to blast the Nazi scumbags into nothing more than bones and tattered remnants of uniforms. At the factory, he had to meet a quota every day. A quota on the amount of shells he needed to make. He met that quota every day, for he knew that if he didn’t, he would just be another roadblock to Russian Victory. Yet despite his best efforts, Russia fell and even though he met every single quota he was given, he still felt like he let his country down. \n\nNow Artyom is working at a truck assembly plant in Vyatka. Artyom doesn't help make the trucks himself, he’s too old for that, but he does help organise the plant’s paperwork. He helps figure out delivery timetables, when trucks can get off the line and when materials to make new ones are coming in. It’s quite different from working at a massive munitions factory, but the one thing that’s stayed the same since he went back to work assembling the critical resources for the Patriarch’s Reunification of Russia, is the quotas. The most important quota for the plant is for the trucks of course, but there are quotas all up and down the supply chain. Quotas for the trucks windscreens, quotas for the trucks wheels and quotas for the trucks engine.  \n\nBut they’re not the only quotas. The coal power plant that generates the electricity for the plant has a quota on the power it produces. The farms that grow wheat to make the plant workers lunch have a quota on the amount of wheat they have to grow. Hell, the papermakers that make the paper Artyom uses to fill out his quotas also have quotas to follow. Alot has changed since Artyom returned to the factories, but in some ways it's still the same."
 GAY.125.a: "From the people’s quotas, to God’s quotas."

 GAY.126.t: "The Holiday Comes To Us"
 GAY.126.desc: "On the outskirts of Vyatka, near the now-famous “Vyatka Vodka” distillery, a new building had finished construction today. Seemingly just an extension of the distillery, it was actually a completely separate factory, although it was also producing an addicting drink, much like its neighbor. \n\nStepping out of a black sedan, which was very clearly imported from OFN, two men in suits dirtied their leather shoes with the cold Russian soil. Not too bothered by it however, they rapidly approached the foreman at the gate of this factory, who was accompanied by none other than the Patriarch himself. He was positively gleaming with excitement as the two foreigners approached, even exclaiming: “Welcome, dear friends!” in a heavily accented English as they came close, and personally shook hands with both of them. It looked kind of surreal, with them standing in front of a big red sign with “Coca-Cola” written on it. \n\nOne of the men spoke in English, after he was finished the second person interpreted everything in Russian: they thanked the Patriarch for the welcome, although it wasn’t exactly a prestigious one, and asked if the factory was finished. They needed to know this because advertisements needed to start being produced and relayed over the radio all across Russia, and they needed to settle on a catchy tune, for which Izvekov’s personal opinion would be counted, being the one who proposed this foreign business expansion in the first place. Although Izvekov wasn’t too well versed in song writing, he did feel the chilly winds of late autumn, signaling the approaching New Years. “How about this,” - he raised his finger after a moment, and started to hum the tune: \n\n“...Hmmmm Hm-hm Hm-hm, Hmmmm Hm-Hm Hm-Hm… …The Holiday comes to us, The Holiday comes to us,... It brings joy and an invigorating taste, The Holiday always has a Real taste!”"
 GAY.126.a: "Everyone but Izvekov noticed that he rhymed taste with taste. At least the tune was nice."

 GAY.127.t: "A Good Time"
 GAY.127.desc: "Fyodor Petrovich could not exactly be described as a spendthrift. He earned to provide for his family, and only just enough to save a little each month, which made Fyodor, and especially his wife Ulyana, extremely careful with their money. A good quality to have in a family, it however slowly made their children - Igor and Natasha, sadder by the day, having been denied sweets and toys for the last year, the very same sweets and toys they constantly see proudly paraded around by the kids of richer parents. \n\nFyodor felt for his kids, remembering how in his youth he himself envied neighborhood kids with toys. Flipping through the papers one Friday morning, he came across something incredibly intriguing: “COME ONE, COME ALL, To the grand opening of Vyatka Mall!” The description of this place made it out to be like it is a superior supermarket, which sounds simply unbelievable! How can one place be this convenient in every single way? There was even a food court in there- “Wait. That’s it!” - Fyodor thought, and began making preparations for the weekend. \n\nAs if no time had passed, the family now found themselves in front of the giant building, with a big sign on its wall: “Garden of Eden”. Guiding the stunned family members, Fyodor took them inside, which only made the stun worse. Their eyes simply didn’t know where to stop. Getting a hold of himself, Fyodor asked a passerby directions to the food court, who shrugged it off and pointed to a tall board - “There’s a map you oaf, follow it.”, and left in a hurry. It wasn’t long until they arrived there, and truly lived up to its name - a large court, surrounded by food stalls large enough to be small restaurants. Having to pick for the family, as they were out of it, Fyodor walked up to the one with two golden arches above it."
 GAY.127.a: "I’m lovin’ it."

 GAY.128.t: "Food for the Hungry, Clothes for the Cold"
 GAY.128.desc: "Where the once-mighty Russian nation lay in ruins, its people suffered in the depths of despair as self-centred warlords tore apart the Russian scraps for themselves. Whilst Antipin and the Order of Saint George might be seen as just another Warlord with a Hardcore Religious Twist, but for many Russians under their influence, they are more than just another warlord. To them, Patriarch Peter II is a beacon of hope. Clad in his humble black cassock, his eyes filled with unwavering determination, he dedicated himself to providing aid and solace to those who had lost everything.\n\nAmidst the crumbling infrastructure and echoes of a once-thriving society, the Patriarch brought relief to those who had been left destitute. With dozens of small groups of devoted volunteers, they traversed the Kingdom of Christ, guided by the belief of helping those who follow God’s Path and Teachings (The Others can be dealt with by other means).\n\nCarrying baskets laden with food and sacks filled with warm clothing, the groups helped the most vulnerable and poor to ensure they were able to live another day. They sought out families who huddled together in the remains of their homes, their faces etched with weariness and their eyes clouded with anguish.\n\nSometimes the Patriarch himself was able to attend and help out the volunteers to distribute the much-needed supplies. He offered words of comfort and solace, assuring them that they were not forgotten, the light of hope and fires of vengeance still flickered in their souls. His voice, filled with unwavering conviction, cut through the silence, inspiring a flicker of determination within the hearts of those he touched."
 GAY.128.a: "Food and Warmth for the Loyal"

 GAY.129.t: "A Loyal Follower"
 GAY.129.desc: "Kazan never cared for Andrei. Ever since he entered the city with only the Red Army Uniform he was wearing, the city had left him to rot away. Forced to live on the streets and in the alleys, every day trying to find a way to survive. This was the same situation for years until the city was surrounded and overrun. Out were the Tatars asserting their independence, and in were the Religious Militants determined to reunify Russia under God’s Vision.\n\nAt the start, nothing changed, same old searching for food to live another day. Until one day, Andrei saw a soup kitchen open to those who were destitute like him, offering free hot food and drinks. Andrei did not hesitate, for the first time since he walked through the city gates, he was welcomed with open arms and had a full meal, a distant memory he had once forgotten. He started coming every day, and every day he would get his meal and sit near a Priest giving a sermon in the Kitchen. Andrei began to smile again, something he had not done in years.\n\nThe daily sermons began to change him, the priest was passionate, determined and loyal to God. He envisioned a Russia of God-fearing men ready to wipe out the German Scum sitting on their throne of Russian Skulls in Moscow. Andrei began to believe him and his vision. Before long he signed up to join the new Army that had occupied the city. The training was tough, even tougher than his old Red Army training, but it helped him turn into the Man he is now. He was loyal to God, loyal to Christ and loyal to Patriarch Peter II thanks to his training, and he would be forever loyal to the people who actually began to care for him."
 GAY.129.a: "Discarded, and then picked back up"

 GAY.130.t: "A Radical Interpretation of the Bible"
 GAY.130.desc: "Like many things in life, the nearly 2 Millennium old Bible is often open to interpretation. Some see it as a vessel that calls for unity, humanity and support for everyone’s fellowman. Others see it as a pillar of old, holding up the Old Status Quo when people followed God and his Disciples. Then there are those who look at it in a far different light.\n\nThe man standing in front of the altar was one of those men. “The Popes of Rome may be Heretics, but that didn’t mean they always had bad ideas” Antipin boomed from his altar throughout the packed Church, full of people from the Highest of Religious officials to the Common Farmer. “In the year 1096, the Holy Land was occupied by a people who didn’t follow even a single Christian Teaching, and they were close to threatening Constantinople. The Entire Christian World was under threat, true believer or not.”\n\nAntipin stayed silent, trying to claw his followers further into his sermon. “In the midst of this major threat, that same year, Pope Urban II made the decision to call a Crusade, to dismantle the Heretical Kingdoms that Threatened Christianity, to repeal the Anti-Christian and to retake the Holy Land and Jerusalem.”The Preachers looked as if they wanted to join the Crusade too, and luckily for them, Antipin would give them that choice. “Once we have brought back Russia from the ruins of the Bolsheviks, we shall start a new Crusade for Moscow, and then to Berlin. Deus Volt!” Antipin yelled as the entire room stood up and followed his lead in one large roar of the words that will lead the Russian Crusade…"
 GAY.130.a: "“Deus Volt!”"

 GAY.131.t: "A Toast to Our, and the Republic’s Health"
 GAY.131.desc: "Izvekov is a religious man, a man who has devoted his life to God, Christ and the Russian People. Izvekov is the Patriarch of the Russian Orthodox Church and leads the Orthodox Republic of Russia, a state where the light of democracy is led by the followers of God. Despite all that, it doesn't mean he can’t enjoy a nice drink of Vodka every now and then. He and Stalina had met up in his office to discuss the nation’s reindustrialisation, but they had soon moved on to talking about their personal lives over a few shots of vodka.\n\n“Sergey, may I ask a question? Did you ever think you’d make it this far, becoming the Patriarch, leading a movement to reunite Russia under a Christian Democratic Republic?” Stalina asked him as she poured herself some more Vodka. “Of course” Ivekov responded in a flash. “Sure I wasn’t as influential as Antipin or Pavlov, but the most dangerous man in politics is the one who acts behind the scenes, in the dark, as a forgotten entity. I’m sure the political alleys of Komi have taught you that.”\n\nIzvekov thought back to those early days. He was a Priest back then, an influential one within the Order, but not as high up as Pavlov or Antipin. He was only able to start exerting control once the Order had consolidated its holdings in Western Russia after he slowly made connections behind the scenes during the Second Smuta. “What about you Svetlana, did you see yourself as Prime Minister under me?” Izvekov asked her, flipping the question towards Stalina. “Well I always think I’d lead a Democratic Republic, but this is certainly quite different from Komi, and significantly more stable too.”\n\nThey both chuckled as they finished up their drinks for the night."
 GAY.131.a: "A Drink to the Future"

 GAY.132.t: "Deja Vu"
 GAY.132.desc: "Sergeant Dimitri had been through a lot during his years of service. First, he was a Red Army Drafttee pulled away from his family to fight the impending Nazi Army, then a WRRF Soldier determined to take back Moscow for Russia, then a demoralised deserter wandering the Siberian Wastes. He only began to recover when he met with the Order in Gayny, where they offered him a chance to reunify Russia not under Bukharin and Lenin, but instead under God and Christ.\n\nAs he observed his Platoon test out their firing skills on the range with the latest batch of firearms from Gorky, he cast his mind back to his early days in the Order’s “Army”. At the time, it was far from a traditional army, back then it was just ragtag groups of militant orthodox monks, former Red Army Veterans, and farmers who wished to protect their communities. How the Order has changed since then.\n\nThe Order’s Militia has formed into a proper Russian Army capable of bringing the remnants of free Russia together. The men have rifles produced in their own factories, rather than nabbing those off their fallen enemies, and actual uniforms so they can properly tell who’s on their side, resulting in a drop in friendly-fire incidents.\n\nOddly enough, it felt like he was back in the Red Army. The only difference was that back then he and his squad worshipped Communism, Marx, Lenin and Bukharin. Now his platform worships God, Christ and the Patriarch."
 GAY.132.a: "The more things change, the more things stay the same."

 GAY.133.t: "The Frozen Dock"
 GAY.133.desc: "In the frigid winter of northern Russia, where the relentless cold and biting winds seemed to constantly test the resilience of its inhabitants, Pavlov found himself overlooking the construction of a new dockyard near Arkhangelsk. Despite the harsh conditions of Russia’s frozen north, he was determined to visit the Order’s soon-to-be newest dockyard. If they were to establish a proper Russian Navy, it will greatly help legitimise them and make any attacks on the Eastern Warlords easier\n\nOf course, the dockyard isn’t just for building and holding naval ships for the Order, it also holds the promise of economic growth and prosperity for the region, connecting remote villages to vital trade routes and opening doors to new opportunities in a region with barely any land connections, in some ways it was a situation where the Order can hit two birds with one stone.\n\nWith his thick coat tightly wrapped around him, Pavlov made his way through the snow-covered docks, offering words of encouragement and prayers to the labourers who toiled diligently day and night to establish a new hub of military and commerce. The workers, their faces hardened by the elements, found solace in the Patriarch's presence and his teachings to them, at a time when hope was hard to come by.\n\nFather Pavlov blessed the dockyard in a solemn ceremony, invoking God's protection over the structure and all who would benefit from its existence, and its workers, praying for good health while they finish the port. The icy waters of the nearby river seemed to bow in reverence as the priest's words echoed through the air, promising a future of prosperity and hope in a region once lost to the elements after the once-mighty Soviet Union fell."
 GAY.133.a: "The Patriarch leaves his mark."

 GAY.134.t: "The Zealot Warrior"
 GAY.134.desc: "The Past decides the Future. That phrase had been stuck in Antipin’s head for days as he tried to read the book he had on his desk with only the slowly dimming candlelight offering assistance. He was attempting to read up on the First Crusade, where the Christain World united to evict the Muslims from the Holy Land. Both he and Pavlov agreed that a Russian Crusade was needed to bring the nation back together, but Pavlov wasn't willing to commit to the Crusade, not like he was prepared to.\n\nHe still respected Pavlov, he had brought his army together in the first place, but he simply wasn’t the man capable of leading the Crusade. The Crusades of Old were initially successful, but slowly over time they fell apart due to degeneracy, lack of faith and personal ambitions ahead of God. To ensure a continuous victory, all must remain loyal to God, and those who are not must to routed out of their holes of despair before they take the entire country with them and allow the Nazi jackboot to enter deeper into Russia.\n\nAntipin had written to Pavlov about the need to ensure a God-Fearing Army, one devoted to God and Russia, one ready to give their lives to bring God’s reach over Siberia and one ready to ensure the continued sanctity of God’s Vision. Pavlov had never seen him the same way again. It was clear to him that he would soon be God’s Destined Servant to save Russia, but no matter how loyal and hardworking his followers may be, Pavlov still holds the Order’s Favour. One day he will become God’s Destined Servant to reunite Russia, for now, he will simply read into the past to prevent future mistakes."
 GAY.134.a: "Psalm 27:1"

