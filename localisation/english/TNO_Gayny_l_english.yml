 ### Leader Desc ###
 POLITICS_MIKHAIL_ANTIPIN_DESC:0 "Mikhail Ivanovich Antipin was originally a humble farmer from Chelyabinsk, one who focused more on day-to-day survival instead of education or philosophical matters. When duty - and the draft - called, he ended up in the infantry as a machine gunner, fighting mostly on the Ukrainian front. He was a rather prolific soldier, even being considered for the Hero of the Soviet Union award at one point. He never was properly honored, however, because the government collapsed shortly after. His brigade fell to infighting, and he fled with nothing but the clothes on his back.\n\nAfter wandering through the wilderness for over a month, Antipin came upon the town of Gayny, where a local priest took him in and nursed him back to health. In the meantime, Antipin had something of a religious awakening, realizing that all these terrible tragedies that shook Russia - the incompetence of the Tsars, the Germans, the October Revolution, the tyranny of the Soviets, the famines, the Germans once more - were not happenstance, but punishments. The people of Russia had forsaken the Lord, so He brought retribution upon them for their sins.\n\nThis revelation brought a new purpose to Antipin's life. He rallied men from Gayny and the surrounding villages of the Gayny District beneath the banner of what they called the "Army of Saint George", promising to "impale the dragon of atheism upon the lance of truth." The Army is fairly small, but they provide stability and spiritual encouragement for the people of the district, and have proven rather effective at keeping the madmen and heathens surrounding them at bay. Grand Master Mikhail only kneels before God and refuses to suborn the Army to any mortal ruler, but if he discovers a leader who he finds to be sufficiently pious, he will gladly pledge himself and his men to its cause."

 POLITICS_YAKOV_PENTELEEV_DESC:0 "Yakov Elizarovich Panteleyev is a veteran of more wars than most. Born in a village of Udmurtia, he was a farmer until he was drafted into the Red Army mere days after the start of the Great Patriotic War. He bravely defended cities far from his homeland in the Idel-Ural, which earned him many medals and promotions, and fought until the Germans reached the banks of the Volga, and all hope was lost. Still a patriot at heart, Panteleyev volunteered to join a unit of ethnic Udmurts in the West Russian War, but once again, Russia faced defeat at the hands of the Wehrmacht, and from there the officer faded into obscurity.\n\nThat was, until the Anti-Communist Guard reigned supreme over northwestern Russia and authority in the Volga region collapsed. As a respected army commander, Yakov was unanimously elected by a hurriedly formed local council as the new President of the Udmurt Republic, in association with the Northern Russian Republic as a loyal ally.\n\nFor the first time, Panteleyev's people have a nation for themselves, and he would like to keep it that way."

 POLITICS_KIRILL_PAVLOV_DESC:0 "How did a one-time Hero of the Soviet Union and wholehearted believer in the ideals of Communism come to be the last hope of the Russian Orthodox Church? To the non-believer, this might seem like an impossibility. For Kirill Pavlov, however, his service in the Red Army of Bukharin’s Union, a man that nearly wiped out the church from Russia, opened his eyes to the Lord’s truth. Born to a peasant family in 1919, Kirill Pavlov worked as a technician at a metallurgic plant in his younger days, a proletarian and a communist through and through. Drafted into the Red Army, Pavlov quickly rose the ranks to Sergeant and became a soldier of great renown, winning the title of Hero of the Soviet Union for his courageous actions in the Battle of Voroshilovgrad.\n\nThough the USSR ultimately fell, it was in the harshest days of the battle that Pavlov found a torn Bible, and from then on he was a changed man. On the retreat from the Nazi advance, Pavlov found a new home for his faith after a journey that seemed like it would never end -- the monasteries outside the little village of Gayny. There, his heart grew even closer to Christ, and it would not be long before his fiery faith led him to assume leadership of monasteries. As the self-proclaimed "Grand Schema" of Gayny, Pavlov recruited monks, priests, and laymen alike to form the Army of Saint George to defend themselves against the German bombers above, and the numerous bandits and warlords surrounding them.\n\nThough their territory has now grown significantly since the dissolution of the Revolutionary Front, Pavlov’s unbreakable faith has not left him without worry. Though they may invoke the protection of Saint George, there are many dragons closing in on the ranks of the faithful, and their numbers are small indeed. It will take a miracle for Pavlov and his men to restore Russia and the Orthodox Church, but perhaps no man cares more for the church or has a stronger faith in all of Russia. God truly is with Kirill Pavlov. If He were not, Pavlov would have died long ago."

 POLITICS_SERGEY_IZVEKOV_DESC:0 "\"IF MY PEOPLE WHO ARE CALLED BY MY NAME HUMBLE THEMSELVES, AND PRAY AND SEEK MY FACE, AND TURN FROM THEIR WICKED WAYS, THEN I WILL HEAR FROM HEAVEN, AND WILL FORGIVE THEIR SIN AND HEAL THEIR LAND.\" (2 Chronicles 7:14)\n\nSergey Mikhailovich Izvekov has been a Man of Faith for as long as he has walked this earth. Born to a deeply religious family in Kaluga Oblast, Izvekov first entered monastic life in 1925 at Sretensky Monastery in Moscow. Two years later, not having even reached adulthood, the young monk made his vows permanent and took on the name he now holds as Patriarch of Moscow and All Rus’ -- Pimen. \n\nPerhaps it is indicative of his character that he took up such a name, his namesake being none other than Saint Poemen the Great, revered in all Apostolic branches of Christianity as one of the Desert Fathers -- ascetic fathers of the Early Church that lived humbly, taught wisely, and ascended into sainthood through humility and piety that even the most devoted Christians may never reach. Sergey Izvekov cares little for building great cathedrals of gold leaf and priceless works of art while his people rebuild the rubble of Russia and yet still go hungry and naked. He cares little to be a tyrant, when the people of Russia are once again finding faith, and he would rather wish to be their brother than their commander. \n\nNow as Patriarch Pimen I, he can do just that. Refusing the traditionally elaborate ceremony of enthronement, Pimen prefers to be among the people, performing blessings, giving homilies, and urging all to build a free and godly society. Perhaps under his merciful guidance, Pimen’s Russia might yet see freedom, strength, and faith."

