 GAY_a_blessing_from_above_desc: "The Order of Saint George has been revitalised, thanks to the tireless efforts of Kirill Pavlov. The military has been turned from a rag-tag force into an organised standing army, a match for anyone that we might face in our campaign to unite Russia. Authority has also been centralised and order has been restored. We are far away from being worthy to restore Russia, but we are ready as we’ll ever be.\n\nIt is now or never. The time has come to march forth from Gayny, spreading the light of Christianity, anti-bolshevism and anti-facism all across Russia. Civilians and soldiers cheer on Father Kirill Pavlov as he spurs them on towards victory. In the heart of every Order Member burns a zealous flame to cleanse the Motherland of communists, fascists and democrats alike. This is our purpose to unite and save the Russian people from anarchy and tyranny, uniting the people of this once-great land, smiting down any who would see us fail. Arise, Russians! Carry the fight to the enemy! Give him not a moment’s rest!"
 GAY_and_demons_all_around_us_desc: "As we prepare to reunify Russia, we need to be careful as enemies assail us on all sides. To the South, lies the mad men of Perm, driven to insanity, to the point that they believe they are Aryans. To the North, the West Russian Revolutionary Front, a relic of the past, still holds on to their failed ideology of communism and is intent on spreading it.\n\nTo the West, the Komi Republic is a sign of the failed experiment of democracy, and Vyatka has not yet embraced God and Christ, still believing in their pitiful Tsar, and the German bootlickers in Samara beyond them.\n\nWe are surrounded by the hordes of hell, the unfaithful and the unholy. These immoral and heathen hordes cannot claim to be the saviours of Russia.  We are the only true and legitimate saviours of Russia. S nami bog!"
 GAY_the_suffering_of_the_faithful_desc: "It's not just the brave soldiers who got out and fight for God that suffer, the regular people suffer too, oftentimes worse during war. While we cannot prevent all of the suffering on our mission to reunify Russia, we can still try to prevent some of the harm, or at least help the people that are currently suffering.\n\n“Whoever is generous to the poor lends to the Lord, and he will repay him for his deed.”"
 GAY_taking_our_toll_desc: "No more prayers, we sound the “all hands on deck” alarm and get ready to put the fear of God into our numerous enemies! The time is upon us - we ride to victory now, or we will never attain it. Our one and only flaw is coincidentally our biggest advantage - we are not that remarkable compared to other warlords, therefore everyone will underestimate us… Which will ultimately be their downfall!"
 GAY_reaping_what_we_sowed_desc: "We have prepared for years for his march to bring Russia back together, and our preparation has paid off. Even during this war, we are able to feed the hungry, heal the sick and clothe the cold. It pays to be prepared, and with our preparations, we are able to expand quicker than our enemies without worrying about what we’re leaving behind us."
 GAY_makeshift_hospitals_desc: "One of Jesus' most well-known stories was his ability to heal a man who was blind his entire life. While our doctors and nurses are not like him, they will try their hardest to heal the sick and the wounded just like him. We shall set up makeshift hospitals for both our army to get our men back to health, and the civilians in every city, town and village we liberate."
 GAY_bless_the_guns_desc: "The loyalty of our righteous warrior-monks is unquestionable, their resolve unshakable, their spirit fully resolved. It stands to no surprise that such pious soldiers of our Lord bless their weapons before going into battle… simply because it actually works! The atheists and infidels may scoff at such practices, until their skulls are penetrated with a shot that rings true thanks to said blessings."
 GAY_break_through_the_lines_desc: "For all our hard work and fervor, it is a sad reality that the enemies simply have more bodies on the frontline than us. Getting any progress will feel impossible after some time, we must act now to get around this issue! Every one of our soldiers feel that they can keep fighting more than the rabble our enemies pose, so let us give an express order to not conserve any ammo, always carry more than one sidearm, use anything in their disposal from grenades to sticks on the ground, all to secure that coveted breakthrough."
 GAY_bread_and_circus_desc: "To make our people feel safe, we must distract them from the results of war. First off, we must fill their stomachs, we must ensure the war doesn't affect their food supply so families are still fed during the course of the war. Secondly, the church shall set up events during the war for people to attend. Feast, plays, sports, whichever we are able to hold to keep the horrors of war away from the people's minds."
 GAY_A_Blessing_from_saint_george_desc: "Saint George, the saint our holy order is named after, was murdered by the Romans two millenniums ago. He was executed for refusing to recant his Christian Beliefs and became a martyr for holding his beliefs. Our Patron Saint has blessed our army, we can feel it, he wants the Order of Saint George to reclaim Russia from the Heretics. We can not, we will not, and we must not fail our mission."
 GAY_a_rifle_for_every_man_desc: "Our supply of weapons currently has just enough guns for our brave fighters, but the threat of running out of said supply looms over us like a guillotine. However small our industry may be, we need to kick it into overdrive! Raise the quotas for workers, use second-rate materials, do not throw away broken guns but fix them… We need to have rifles for our men to hold if we are to win this conflict!"
 GAY_Unyielding_in_faith_desc: "No nazi sympathizer from Samara or a communist from Arkhangelsk can look at our soldiers and see anything but a threat, for they are tireless, they are fearless, but most importantly, they are pious. True belief gives them something no outsider can understand or feel, and that makes even the snot-nosed farmboy Petya a genuine threat in the face of the enemies of our Faith, for he believes, and it makes him stronger."
 GAY_Unfurl_the_banners_desc: "The men that fight under our banners are proud of their beliefs. They fight for God, they fight for Christ, and they fight for Christianity as a whole. They fight for what they believe in. That is the Order of Saint George, an army loyal not just to Russia, but to God."
 GAY_Raise_the_crosses_desc: "Another sound strategy used in the Crusades was large platforms with crosses that they carried into battle. While they may not have been used for combat, they filled the crusaders with holy zeal, for Jesus himself was watching over them. Emulating that in the modern day is possible, just in a different way. Every site of a successful battle shall henceforth be marked with the Holy Cross, this will not only fill our warriors with pride in their accomplishments, but also show everyone else that the agents of our Lord watch over this place now."
 GAY_Christ_rules_the_lands_desc: "Praise be! Hallelujah! Blessed be this day, for we have triumphed! Joy and relief fills the streets, the lands of Western Russia finally stand united at long last. Years of German oppression made some people so jaded that they stopped thinking that such a feat is even possible, yet here we are, victorious!\n\nWe have become much more than a whisper in the wind; Through our faith, we are now the light of God’s will shining in a land empty of it. We must focus on our shared goal of ensuring that Christ's teachings are spread throughout Russia. We have a responsibility to make sure that His claim to rule the lands of western, and soon all of Holy Russia is acknowledged and respected by all. Amen!"

