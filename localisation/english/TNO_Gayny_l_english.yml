 GAY_warlord.2.t:0 "We Thank Thee"
 GAY_warlord.2.desc:0 "Today was a harsh day, Dimitri was coming back from the farmlands after hours of plowing. As he opened the door to enter the house a small grey blur embraced him by the waist: "Daddy, what are we eating this evening?", asked Anatoly loudly , one of his sons. His words hit him like a truck, even after so much work and blood spilt, he couldn’t even afford to buy a simple meal for his children... "Sorry sweetheart, but we don’t have much for today, but at least we should be able to hold off our hunger for another day..." he replied; seeing the his child's enthusiasm deflate was more painful than a gunshot... The results of his failures as a father. \n\nThe day went on as usual, he played around with his children during the evening, took care of his ailing wife and started preparing dinner. "There’s nothing more than this?" asked Ekaterina, his oldest daughter, "Why we never have money for food? You MUST ask for more Father! The fat pig surely could spare more coin for us, the conditions you work in are-" "ENOUGH!" shouted Dimitri, "Smirnov already has to pay other 200 farmers, do you think he can raise the wages of everyone? Ekaterina, you must understand it’s not just us, everyone in this damn village is struggling with their lives, you can’t require better treatment than the others." \n\n As he shut his mouth someone knocked at the door. Dmitri went to open it, he was greeted by a Priest of the army, holding a basket of bread on his hand. "Good evening, brothers and sisters, I come on behalf of the Grand Schema. We have been armyed us to distribute some loafs of bread for each family in this village, are you in need of some?" Dimitri couldn’t believe it: free bread? The children started cheering the man as he gave them the food they needed. Dimitri still remembered the days of Bukharin, four of his brothers have died of starvation, while the communists bickered between each other. Maybe the arrival of the army was for the better? \n\nDimitri said a quick prayer and thanked the priest."
 GAY_warlord.2.a:0 "Even the smallest actions can save lives"