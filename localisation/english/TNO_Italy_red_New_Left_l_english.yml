###=====| b) Feltrinelli Tree |=====###
ITA_RED_praxis_makes_perfect: "Praxis Makes Perfect"
ITA_RED_praxis_makes_perfect_desc: "Just a few years ago, Giangiacomo Feltrinelli would have been dismissed as an obscure publisher at best, and as a dangerous but ultimately irrelevant radical at worst. However, real life is often stranger than fiction, and in a few short years Feltrinelli has enjoyed a meteoric rise to eventually become leader of Italy, and the world revolution as a whole.\n\nWith the German threat dealt with for now, he can begin to focus on transforming Italy in his image. Under Feltrinelli's leadership, the country will become the vanguard of anti-imperialism, and will begin to arm and fund rebel groups across the world."
ITA_RED_romanticizing_the_revolution: "Romanticizing the Revolution"
ITA_RED_romanticizing_the_revolution_desc: "When the people of Russia stormed the Winter Palace, were they a blank, emotionless mass, only thinking of what the revolution required? Of course not! Revolutionaries are not automatons, only capable of the destruction of the current order and nothing more. They are in fact the world's most spirited people, putting their lives at risk for a better tomorrow. To encourage this attitude within Italy, we will make sure that our people see revolution as the most inspiring and romantic action that a human can do. We will ignite the passion that shall make tyrants quake and empires fall!"
ITA_RED_advertising_the_revolution: "Advertising the Revolution"
ITA_RED_advertising_the_revolution_desc: "For years now, it seems that revolution has simply gone out of fashion. The days of taking up arms and manning the barricade seem to be over, and whilst some groups have taken to the forests and jungles to resist imperialism, their numbers leave much to be desired. Whilst it seems that our victory against the German behemoth has reinvigorated some of the long lost passion for uprisings, its effects have still fallen short of what we may have hoped for. To make sure that our message reaches all of society, we shall try and make socialism more accessible to the wider population."
ITA_RED_distributing_the_new: "Distributing the New"
ITA_RED_distributing_the_new_desc: "Over the past centuries, the works of great theorists such as Marx, Engels and Lenin have shaken the world to its very core. Without these giants of socialist theory, our revolution would have never had the guidance that it needed to succeed. However, times have changed. Old European empires have crumbled, and in the ashes left by their defeat the scourge of fascism has risen. To make sure that our people do not adapt worldviews that are simply outdated in this modern era, we will promote new theory written by more modern thinkers. With all the intellect of Italy now able to flourish, we should surely be able to devise new ideas that will help us to defeat capitalism once and for all."
ITA_RED_documenting_the_present: "Documenting the Present"
ITA_RED_documenting_the_present_desc: "If our revolution does not meet an untimely end, then the events of this decade will surely be remembered as the most major step towards the liberation of mankind. Due to this, it is vital that we try to document this revolution as much as possible. Future generations will thank us for providing an accurate history of the overthrow of capitalism, and current revolutionaries may find the experiences of the Italian revolution useful in their attempts to overthrow and root out oppressive bourgeois regimes. Furthermore, Feltrinelli is often seen as eccentric, and it would be very beneficial for our publicity to have more documentation on his life."
ITA_RED_translating_the_old: "Translating the Old"
ITA_RED_translating_the_old_desc: "One of the main points of the ideology we espouse is internationalism. Despite this, many old pieces of theory, especially more obscure ones, have yet to be translated from their original language. As a result, most of the Italian population simply has no way to access these works which may be vital to their education. To combat this, Feltrinelli will use his own private archive to help found the Giangiacomo Feltrinelli Foundation. This will help to document all past, present, and future pieces of socialist theory, and make sure that it is available in as many languages as possible. Hopefully, our actions will make sure that most of the ideas that socialist thinkers have come up with stay preserved for generations to come."
