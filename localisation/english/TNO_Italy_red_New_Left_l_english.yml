###=====| a) Antonio Negri Cabinet |=====###
 ITA_Antonio_Negri:0 "Antonio Negri"
 POLITICS_DESC_ANTONIO_NEGRI:0 "Antonio Negri, called "Toni" by those who know him, was raised by a working class family that introduced him to Marxism at a young age. After his father's beating and murder by blackshirts, Negri eventually followed in his footsteps by becoming a communist militant seeking to free Italy from fascism. Having recently graduated college, Negri joined Quaderni Rossi, a workerist political organization and journal which sought to encourage a revolution and create a socialist state.\n\nUnder the guidance of Mario Tronti and Raniero Panzieri, he helped create various cells inspired by new left philosophies throughout Italy. After Verona, Negri rose through the ranks as he was able to mobilize the organization and other new movements outside the mainstream PCdI. In the chaos, he became the head of this new coalition due to his presence as a unifying force and leading figure.\n\nLeadership wise, "Toni" is able to present himself as a lively, intelligent man on the surface while also possessing the capabilities of a ruthless manipulator. He adapts well to evolving situations, a necessity for a man attempting to hold together the fringe far left while trying to create a stable national government."
 ITA_Lucio_Magri_hog:0 "Lucio Magri"
 ITA_Lucio_Magri_hog_desc:0 "------------\n"
 ITA_Luciana_Castellina_for:0 "Luciana Castellina"
 ITA_Luciana_Castellina_for_desc:0 "------------\nIn a world where militarism, extreme nationalism, and chauvinism of all kinds was utterly ascendant, it took resolve to be an opponent of these hallowed values of fascism. Some mistook Luciana Castellina's steadfast support of democracy and equality of the sexes to be a sign of weakness. She proved them wrong time and time again, resisting Mussolini and Ciano in her career as a journalist and then behind bars, being arrested numerous times for her participation in anti-government rallies. She and her husband, Alfredo Reichlin, formed a star couple of Italian communism.\n\nPietro Ingrao and his followers have been met with skepticism for their advocacy of a humanistic, semi-pacifistic socialism on a continent that remains the cradle of fascism. The spotlight shines especially harsh on Castellina, his choice of foreign minister. Will her dream of a peaceful workers' Europe be achieved against all odds, or will she be unable to swim against the tide of violent despotism that has enveloped it ever since 1939?"
 ITA_Alfredo_Reichlin_eco:0 "Alfredo Reichlin"
 ITA_Alfredo_Reichlin_eco_desc:0 "------------\n"
 ITA_Luigi_Cipriani_sec:0 "Luigi Cipriani"
 ITA_Luigi_Cipriani_sec_desc:0 "------------\nLuigi Cipriani is known for two things in Italy: his beard and for being a tough man. An especially memorable story is the time he defended a woman from an assailant armed with a knife, and disarmed the man with his bare hands. Now, Luigi Cipriani finds himself a key leader within Italy.\n\nWithin Negri's administration, Luigi Cipriani now serves a government swept into power by passionate young activists. While Negri might attempt to suppress their attempts at a cultural revolution and calm their fanaticism, Cipriani fully backs the activists. Young and passionate, Cipriani can often be spotted leading rallies and workerist actions alongside the students, even if Negri disagrees."

###=====| b) Giangiacomo Feltrinelli Cabinet |=====###
