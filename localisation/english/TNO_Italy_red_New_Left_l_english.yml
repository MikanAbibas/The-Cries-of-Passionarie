ITA_RED_feltrinelli.14.t: "An Interview With Feltrinelli"
ITA_RED_feltrinelli.14.desc: ""Comrade Feltrinelli, it is an honour to meet you." The reporter shook hands with the revolutionary, awed by his presence. After all, most of the stories that he usually covered were reports of some minor fascist being arrested , not meetings with the leader of Italy himself.\n\n"So, how did you first become a socialist?"\n\n"Well comrade, I first became a socialist by witnessing the struggles of the poor and oppressed. I am sure that I do not need to tell you that they had it very hard before the revolution, and although I was part of the bourgeoisie I just did not have it in me to ignore them for my own gain."\n\n"Interesting," the reporter mumbled to himself, slightly annoyed that he had only got a vague answer. "What are your plans for the revolution, now that the main forces of reaction in Italy have been crushed?"\n\n"Well, my main plan is to continue the revolution until we have finally won. Whether that be through adventures abroad or through efforts at home, I will try and show the world what can be achieved through the powers of the people."\n\nThe reporter felt like burying his face in his hands. The answers that he had received did not reduce any of the mystique surrounding Feltrinelli ; they just made his aims even harder to decipher. Awkwardly, he shook hands once more, and left the office."
ITA_RED_feltrinelli.14.a: "It seems like the leader of the revolution shall remain enigmatic for a while longer"

ITA_RED_feltrinelli.100.t: "From Chateau to Bureau"
ITA_RED_feltrinelli.100.desc: "The tidal wave of criticism finally forced Giangiacomo Feltrinelli's hand in regard to his luxurious Villa that his mother and himself live in. No longer would exorbitant paintings and other decor decorate it, no more will lounges and reading rooms intersperse its interior. From now on, it would become another tool of the cause, a base of operations for himself and his comrades to plan their next course of action. Hopefully this would both convince his party colleagues of his devotion to their shared ideals while also allowing himself to feel less guilty by living in such splendor while most of Italy's workers are struggling to make end's meet.\n\nHe and his mother would still dwell in the Villa, but with the habitable part reduced greatly in order to maximize the operable area. His mother hated the change, and it would take him a while to adjust to the new lifestyle, but he knew that there was no other way to prove to himself that his deeds matched his words.\n\nThe only issue he sees going forward is the stress that is caused not just from living in such close proximity to his work, but also from having the other revolutionaries in his home throughout the day. Privacy has certainly already been all but dissipated, and he harbors no delusions about how difficult it will be to adjust.\n\nBut Feltrinelli still smiles. He knows that this was a necessary step, an ideological right of passage. Long gone is the rich kid looking down from his ivory tower, and in his place is the man that will save Italy and the world from all the woes of fascism and capitalism."
ITA_RED_feltrinelli.100.a: "Devotion requires sacrifice."

ITA_RED_feltrinelli.105.t: "Good Intentions, Bad Advice"
ITA_RED_feltrinelli.105.desc: "Angelo and his fellow militia members were sitting across from the President of Italy, Giangiacomo Feltrinelli. His office was fancy, clean, and lined with full bookshelves. Angelo felt out of place in his black guerilla uniform and scarf, but apparently this was how the President thought they should dress to meet him. Feltrinelli had first buttered them up with a whole slate of compliments, and began to wax poetically about sitting in bushes and shooting fascists every once in a while, eventually morphing into something of a ramble, "...and of course, the most important part of a guerilla's lifestyle: their knapsack. Every knapsack should obviously have all the essentials stocked, such as: a change of clothes, fake identity cards, a bag of salt, and cigars."\n\nAngelo tried to process what he heard, then tentatively asked, "Comrade President, why the bag of salt?"\n\n"Salt is a precious thing in Latin America," was Feltrinelli's baffling response.\n\n"But we are in Milan, we can find it anywhere here."\n\n"Doesn't matter, it's a guerilla tradition, and must be there," said Feltrinelli.\n\nAngelo could tell he was sincere, but he was talking absolute nonsense. Angelo had been a partisan for over a decade and had never heard of any such tradition. Trying to move the subject along, he hesitated before asking, "So why are the cigars essential?""
ITA_RED_feltrinelli.105.a: ""Now that goes back to Comrade Che's writings...""

ITA_RED_feltrinelli.106.t: "The Feltrinelli Library"
ITA_RED_feltrinelli.106.desc: "As Giangiacomo Feltrinelli sat at his desk tallying his beloved catalog, he chuckled to himself about how ironically thankful he was that his mother stopped him from storing collections from his personal library at the Villa. Although he disdained her at the time, it probably saved much irreplaceable wisdom from being lost forever.\n\nIn fact when his home was destroyed by the Germans, less than 100 of his revolutionary memoirs, ideological essays, and other such documents were lost. His extensive collection numbers exactly 12,349 books, many of which are extraordinarily rare, as well as over 75,000 primary source documents from all over the world that are extremely valuable in doctrinal and historical research.  He made quite a point of lecturing all who listened that these items fuelled the intellectual wing of the socialist movement, and that such academic pursuits were the true root of their success so far.\n\nFeltrinelli kept smiling as he put the finishing touches on the new executive declaration at the right hand side of his desk. This was not one of the typical papers that he was forced to read over and sign, no expense report that required correct filing. No, this was a plan to turn his personal collection over to those who would benefit most from intellectual enlightenment: the people. He would create a public library throughout all of Italy where everybody could access them.\n\nOne of the only perks of his job was how easy it had become to collect new teachings, and with this newfound importance he had no intent on letting up in his pursuit. In fact, he would even create a commission to go around the world to discover revolutionary thought and bring it together where it can be studied and shared! He kept on dreaming of a larger and larger collection, and for the first time in weeks felt the inner peace that comes with fulfilled purpose."
ITA_RED_feltrinelli.106.a: "A revolutionary and a scholar."

ITA_RED_feltrinelli.107.t: "Back at Home"
ITA_RED_feltrinelli.107.desc: ""Comrade Mattia, what did President Feltrinelli say to do if the military wished to negotiate their budget?" asked Comrade Edoardo, another bureaucrat stuck with the unenviable task of sorting out all the paperwork not getting filled and decisions not getting made with Feltrinelli off on his latest adventure.\n\n"I believe he said to leave it up to an Assembly vote, so file it into the pile for Assembly motions."\n\n"Comrade Mattia, Comrade Edoardo, Comrade Secchia wishes to know when the President will next be available," said Comrade Lorenzo, a party official assigned to the even more unenviable task of soothing relations with the Party while Feltrinelli was out of the country, and for scheduling meetings between Party officials and the President. Mattia felt sorry for him the most, an angry Party member could rant for what felt like hours.\n\nJust then Comrade Andrea burst into the room, another bureaucrat working overtime in these trying times, "The teachers' association are on strike, saying that the recent countermeasures against reactionaries are themselves counterrevolutionary."\n\nAll four bureaucrats gave a resigned sigh, wishing that Feltrinelli could've been present to handle things.""
ITA_RED_feltrinelli.107.a: "Adventure has its costs."

ITA_RED_feltrinelli.108.t: "Starlight Contemplation"
ITA_RED_feltrinelli.108.desc: "So this is what it must have been like, thought Feltrinelli as he laid back looking up at the stars. Ever since the glorious victory against the Germans he had desperately been trying to imagine what the militiamen must have felt as they slept out in the wilderness, battling the Nazi menace in the Alps. That's why he went out into the woods that night with his rucksack and camping gear, so that he could visualize the partisan experience firsthand. Albania was fast becoming close to his heart, the entire landscape seems to be purpose built for freedom fighters on the run from the law.\n\nHe truly wished he could live like this every day, acting as a foot soldier of the revolution. His role as president just occupies too much of his time, too much attention. His fight is against stacks of paperwork and bureaucracy, not reactionary soldiers. There is no glory for him, no triumphant battles to be won.\n\nLighting a cigar, Feltrinelli kept looking at the sky above. He enjoyed the silence, the patterns, everything about being out here. A guerilla must be the only truly liberated soul on the planet, for out here there are no gods or masters to control them. He could stay like this for days if he was able, but alas his responsibility is far too great to dwell outside of civilization for too long. But Rome could certainly wait another day at least for his return."
ITA_RED_feltrinelli.108.a: "Perhaps even two..."

ITA_RED_feltrinelli.109.t: "Red Croatia"
ITA_RED_feltrinelli.109.desc: "Croatia.\n\nA land poisoned by so much hatred and warfare that one could mistake the soil for coagulated blood. Soldiers from far off empires are terrible, but the people from the village over are often worse. The only commodities in abundance are fear and mistrust.\n\nTo be a guerilla fighter is to be a cog in the machine of violence, all the while masquerading as an agent against it. It is to live a lie believed only by children and fools. Ivan used to be one such ignorant youth, joining a resistance cell with dreams of creating a better society. Now he dreams of warm meals and clean clothes.\n\nHe is not a free man. He wakes up at the call of the watch officer, eats what the cook gives him, and lives a life dictated from above. He does this in the name of liberation. While he thought this existence a mere irony at first, Ivan now sees it as nothing but the continuation of a cycle he and his nation have been stuck in for time immemorial.\n\nIvan believes he has killed people. He is unsure, having never received confirmation, but the act of pointing his weapon at another and pulling the trigger with lethal intent is enough. No reality would change the fact that, in his mind at least, he has condemned others to death by his hand. \n\nHe is tired. Rumor has it that the revolution is at hand, comrades from abroad bring fresh hope for the beleaguered guerillas. Ivan is more jaded than the rest however, only seeing fuel being added to a fire that continues to engulf the countryside. Whatever peace that is achieved will not last, and the only rest will come when they are all dead."
ITA_RED_feltrinelli.109.a: "A fate that seems more palatable by the day."

ITA_RED_feltrinelli.110.t: "In Regards to your Absence..."
ITA_RED_feltrinelli.110.desc: "'Mr. President;\n\nWe hope you are having an enjoyable stay in Albania, we are sure that your time there has been instrumental in developing ties with our ideological brethren. The international revolution depends on such relationships, and there is no one better at spreading our doctrine than yourself.\n\nWe write to you now in order to once again plead you to return to Rome. Internal competition and lack of direction has caused the Party to become ineffectual in handling issues in a timely manner. Your leadership and direction in this regard is essential to ensuring the prosperity and success of Italian socialism, and your absence is felt distinctly among all aspects of political life.\n\nAgain, we urge you to return posthaste.\n\nFeltrinelli read the letter once more, sighed, and began packing his things. As much as he relished his time abroad, dereliction of duty was not his intention. His job was an important one, and although dull, without his direct intervention the threat of destabilization was a looming prospect. He will return home for now, but Giangiacomo was already dreaming of where he would visit next"
ITA_RED_feltrinelli.110.a: "His body returns, but what of his heart?"

ITA_RED_feltrinelli.111.t: "The Dirty Work"
ITA_RED_feltrinelli.111.desc: ""'It is a constant struggle, Pietro, I feel as if the wolves are nipping at our heels. Reactionaries constantly challenge the government, plotting with fascist elements remaining in the military. German spies have been caught infiltrating nearly every facet of our administration, and rumor persists of the Americans and Japanese as well. I can't help but shake the feeling that something could be brewing in the shadows that will threaten to revert Italy back to the days of Mussolini's regime."\n\nPietro Secchia looked at Feltrinelli with a stern but empathetic gaze. "This is the peril of all those who wish to change the world, Giangiacomo. It is a story as old as time. One cannot lead through compassion alone, mankind is far too cruel. These groups exist and plot against us, it is not just paranoia tugging at our conscience. And if we don't act soon, all could be lost."\n\nFeltrinelli began to feel uneasy. He knew that Secchia wanted to use some extreme measures to combat the counterrevolutionaries, and that such actions would lead to many deaths. Innocents would inevitably be caught up in the blaze as Secchia sought to purge the enemies of the party from Italy's ranks. "I fear what you will do my friend, but I fear what will happen more if you don't act at all. Very well then, you have my approval. Just be careful, Pietro, remember that we must maintain our ideals of protecting the people or else we are no different from them."\n\nSecchia smiled and shook Feltrinelli's hand. "We are in this together. I will safeguard the revolution, just as I have done since we first met." As Secchia left, Feltrinelli's suspicion only grew. This will have some blowback, but hopefully in the coming years, there will never be a need for such measures again."
ITA_RED_feltrinelli.111.a: "And until then I will keep my eye on you, Pietro'"

ITA_RED_feltrinelli.112.t: "Smudging the Details"
ITA_RED_feltrinelli.112.desc: "Since returning from the Balkans, and his near-daily meetings with Secchia, Feltrinelli had hardly gotten a wink of sleep the past few weeks. There was always some new problem, some new person to meet, some new group to negotiate with... It was exhausting.\n\nThen, there was the paperwork. Oh god, the paperwork. Feltrinelli was currently surrounded by a book's worth of documents. Some of it was forms to fill out, others were letters he had to write, and everything else was some new form of policy document that needed his signature, and his signature alone.\n\nFeltrinelli tried to refocus his heavy eyes on the document in front of him. Some regional council wanted approval to reallocate resources to a new urban planning proposal that would improve the quality of the...\n\n\n\nFeltrinelli woke up to light shining through his office windows. The ink on the topmost layer of documents was smudged slightly, and a brief glance in the mirror showed that all of that ink had found its way onto Feltrinelli's cheek. Realizing that the first thing he'd be doing in the morning is continuing the endless mountain of paper and monotony, Feltrinelli groaned."
ITA_RED_feltrinelli.112.a: "Zoning Proposal No. 201415 is a real page turner, I swear."

ITA_RED_feltrinelli.113.t: "A Letter to Che"
ITA_RED_feltrinelli.113.desc: "'Camarada Ernesto:\n\nI write to you from my balcony in Rome. It is a lovely night- the stars are overhead, the crickets are chirping, and the evening winds blow gently past my ears. One could almost forget that any time has passed from the long nights I would spend in the wilderness, rifle in hand and gleam in my eye. But then I see the documents on my desk inside, and it all fades back into reality.\n\nOh but how things have changed my friend! The revolution is still being carried out, but no longer by the force of arms and the bravery of men. Rather, it is through the inglorious tasks of judicial reforms and economic policy. I am buried daily in papers that say so many things, but when I sign them, it feels as if the words are meaningless, that I achieve nothing real. I am weary- I know that what I am doing is truly serving the worker, but I can't help but dream of those early days.\n\nWhen I first began life as a guerilla, everything was so simple. There was a clear enemy, and our guns, bombs, posters, and pamphlets just had to be turned against them. Both the fascists and the capitalists made for an easy foe, and we were the heroes, rescuing the people from their clutches. But now, the apparatus that oppressed us is no longer in power. We, the socialists, now have dominion over Italy, and it is by our actions in governing her that the revolution will prosper or wilt.\n\nI thank you for the Cohiba cigars, you know how much I associate them with those glorious days. Thank you also for your support and guidance, only together can the workers of the world truly be free."
ITA_RED_feltrinelli.113.a: "Yours Truly, Giangiacomo."

ITA_RED_feltrinelli.114.t: "The Feltrinelli Library Expands"
ITA_RED_feltrinelli.114.desc: "Genuine glee erupted on Feltrinelli's face as he flipped through the bound pages handed to him by the group that just disembarked the plane from Honduras. The Ideological Accumulatory Committee he created just arrived back in Italy from their first trip to Central America, and they had brought back exactly what he wanted: a collection of socialist manuscripts, essays, and books unable to be obtained anywhere else in the World. When he heard the news, he was so ecstatic that he rushed to the landing strip to meet them in person, ignoring his scheduled appointments and other responsibilities.\n\nIt wasn't the actual works collected that excited him, although he was certain they were incredibly insightful, rather it was the idea that the now public Feltrinelli Library would begin expanding both in size and scope. In the months to come, he expects that it will grow at an exponential rate as both awareness of his mission and internationalist efforts increase.\n\nEven now, it has become common practice for left-wing scholars to mail anything they can come across to Rome, with packages from all over the world arriving daily. This helps in both protecting the works of philosophers and scientists from being suppressed by reactionary governments while also creating a hub in which doctrine can be studied and shared freely.\n\nFeltrinelli's pet project was not only becoming reality, but now shaping into something more."
ITA_RED_feltrinelli.114.a: "A bastion of knowledge in an ignorant world."

ITA_RED_feltrinelli.115.t: "House of Cards, Suit of Hearts"
ITA_RED_feltrinelli.115.desc: "Feltrinelli met with Negri again today, admiring once again the passion the man presented for a worldview so similar to his own. Negri often went on extended tangents about various economic policies and bureaucratic functionalities, topics that quite bored the president although he was nevertheless inspired by his intelligent and thorough explanations. After some time, Negri brought up the state of the congress, an issue Feltrinelli now realized was the real reason he was asked to brunch this morning.\n\nThe two men went back and forth, discussing the various groups and figures, the controlling personalities and other drama that seems to encompass the legislative body. The congress had been problematic as of late, and there was some basis for the concern. After some time, it became clear that Negri was suggesting that Feltrinelli's extended absence from Rome was giving such divisions an opportunity to grow unchecked.\n\n"...Toni I see your concerns, I really do. The party has always had different interest groups, different ideologies. We have kept an eye on such factionalization, and I can guarantee you everybody in Rome has the best interests of Italy and the workers of the world at heart. Their loyalty to socialist ideals is absolute, that I have made sure of myself.\n\n"You forget to take a step back and look at the big picture... I am not talking about elements of the party striking out and betraying the revolution. The danger is everybody having their own vision for how to save the nation, and that at our weakest moment brother will turn on brother in a last ditch effort to protect Italy. In attempting to save us, they will be our damnation. No Giangiacomo, my concern is that if you are not here acting as a unifying force within the party, then as soon as a crisis erupts the government will fall to chaos and infighting. What keeps me up at night is the fear that when the Germans come back over the Alps one day...""
ITA_RED_feltrinelli.115.a: ""...they will see the last moments of the USSR played out again.""

ITA_RED_feltrinelli.116.t: "To Safeguard the Revolution"
ITA_RED_feltrinelli.116.desc: "Giovanni always walked to the town from his farm, even though for over ten years he had owned a car which could make the hour-long transit take a quarter of the time. He liked it more that way, it allowed him to clear his head and enjoy the cool morning breeze. On this morning, his thoughts drifted to where they always do, back to Ethiopia and the time he spent there in the army. It was difficult of course, and many he had known perished in that far off land, but still he looked back fondly on the camaraderie and friendship that came alongside the many trials he endured. That's why he went to town twice a week, to reconnect with his old mates in the tavern that they first visited upon returning from the war.\n\nBut this time was different. The tavern was cordoned off by police, ambulances were blazing past, and bloodied bodies were laid out in a line. Realizing that he recognized some of the bodies, Giovanni clutched onto the arm of a local policeman. "What sort of crime was this? Did a madman come to attack us?"\n\nThe officer turned to Giovanni and pointed at his dead friends, "This crime was not the work of just one madman, but a conspiracy consisting of all those men over there. They were reactionary veterans, loyal to the old regime, and they had been organizing here in secret, plotting against the people. Luckily, we were sent by Rome to destroy such counterrevolutionary fiends."\n\nRealizing the atrocity that had occurred here, Giovanni backed away. While his friends were all old soldiers that fought for Mussolini, they had never been planning anything. They grumbled about the government like anyone else, but never once did he or they consider taking up arms again. They had been slaughtered in cold blood simply for the crime of gathering to discuss old times. Running back home, Giovanni realized that times truly have changed, and this new order under President Feltrinelli was not all so different from the last."
ITA_RED_feltrinelli.116.a: "So passes the ideal of the glorious revolution"

