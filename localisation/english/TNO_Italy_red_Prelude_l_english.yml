 ITA_Rev_United_Front_Com: "Comitato Centrale del PCd'I"
 POLITICS_REV_UNITED_FRONT_DESC: "the grand marxist-gramscist-garibaldist coalition"
 POLITICS_REV_PCDI_COMMITTEE_DESC: "sneaky masterminds ooooo (actually they cant agree on much)"

 ITA_Arrigo_Cervetto_for: "Arrigo Cervetto"
 ITA_Arrigo_Cervetto_for_desc: "§YForeign Minister\nLeft Communism§!\n------------\nBorn in 1927 to two Italian immigrants from Liguria in Buenos Aires, Foreign Minister Arrigo Cervetto has lived his entire life in the shadow of fascism. Immigrating back to his native country in his early adulthood, he became involved in the underground Communist movement after working as an apprentice in a factory. Now as representative of the libertarian faction of the newly formed People's Republic of Italy, Cervetto intends to make sure his faction's interests are protected from the excesses of those on the authoritarian side of the political spectrum. A devout Leninist and council communist, he is highly critical of the 'state capitalist' opinions many in the provisional government espouse, and, while willing to put aside his opinions for the sake of protecting the republic, has made his ideological commitments clear to his opponents."
 ITA_Enzo_Misefari_eco: "Enzo Misefari"
 ITA_Enzo_Misefari_eco_desc: "§YEconomy Minister\nMarxism-Leninism§!\n------------\n"
 ITA_Ricardo_Lombardi_provrevgov_for: "Riccardo Lombardi"
 ITA_Ricardo_Lombardi_provrevgov_for_desc: "§YForeign Minister\nSocialism§!\n------------\n"

 ITA_Pietro_Secchia_hog: "Pietro Secchia"
 ITA_Pietro_Secchia_hog_desc: "§YHead of Government\nCommunism§!\n------------\nDespite the depredations of the fascist regime, the time before the revolution was a simpler one. With the elimination of their greatest enemy, the revolutionary leadership has fallen to even greater infighting than normal, and at the forefront of that dispute is Pietro Secchia. A veteran member of the Communist International, Secchia is a devoted advocate for the expansion of the eventual government's authority. His experience fighting for the communist cause in exile has made him a convinced internationalist, and his demands for central planning of the rebuilding of Italy has resonated with those who desire further spreading of the communist cause. While Damen's supporters have denounced him as a tyrant in the making, Secchia sees himself as doing what is necessary to secure the revolution."
 ITA_Arrigo_Boldrini_sec: "Arrigo Boldrini"
 ITA_Arrigo_Boldrini_sec_desc: "§YSecurity Minister\nCommunism§!\n------------\n"

###############################
###=====| FOCUS TREES |=====###
###############################
 ###=====| a) King's Government |=====###
ITA_king_chaos_in_kingdom: "Chaos in the Kingdom"
ITA_king_chaos_in_kingdom_desc:  "The Verona Conference has concluded, having been a complete and utter failure. Nothing except violence was achieved, and in its burning wake chaos had overtaken Italy.\n\nThere is a clear need for change in the Kingdom of Italy. There are many competing views as to what that change should be.\n\nHowever, there is one man who knows the correct path to take. His Majesty, King Umberto II, knows the true solution:\n\nReform."
ITA_king_dissolve_the_grand_council: "Dissolve the Grand Council"
ITA_king_dissolve_the_grand_council_desc:  "There is no tool in the PNF's toolkit more prominent than the Grand Council of Fascism. Created in 1922, it has held a stranglehold over Italy's institutions for the past four decades. In this time of unprecedented chaos, the Grand Council's suffocating grip over the nation presents a clear threat to Italy.\n\nIt is of the utmost imperative that His Majesty dissolves it. The Grand Council's destruction is the only path to salvation for the nation."
ITA_king_dissolve_parliament: "Dissolve the Parliament"
ITA_king_dissolve_parliament_desc: "While His Majesty wields some level of power and influence over parliament, it is clear that the Chamber of Fasces and Corporations must be dealt with. Created in order to fulfill Mussolini's dream of a "corporate state," it completely eliminated popular suffrage, instead acting as an entirely appointed lower chamber.\n\nBy dissolving Parliament, we can remove the fascists' influence over the legislature, and act more decisively in order to contain the chaos enveloping the country."
ITA_king_dissolve_parliament_tt: "\nWe will form a new cabinet to assist in managing this §Rchaotic period§!."
ITA_king_invite_generals: "Invite the Generals"
ITA_king_invite_generals_desc: "In these chaotic, difficult times, it is important that we do not find ourselves standing alone in the fight to save our country.\n\nIt is important that we obtain the military's backing, more specifically the backing of our generals. With their support, we will be much more able to enforce the king's will.\n\nWith the king and the military working in tandem, the fascist vines that have crept into our society can be properly ripped out.\n\nOnce that is done, the chaos burning in the streets can finally be put to rest."
ITA_king_invite_generals_tt: "We will forcibly retire £ita_internal_opposition_texticon §jFascist Generals§!, and promote loyal soldiers to replace them."
ITA_king_rule_by_royal_decree: "Rule by Royal Decree"
ITA_king_rule_by_royal_decree_desc: "While the King understands the people's frustration at the Fascist system, looting, shootings, arson, and terrorist attacks are unacceptable in a civilized country. Communist troublemakers take advantage of the chaos, tearing apart the nation to bring their bloody "revolution." At the same time, Fascist organizations and militias are plotting in the shadows, reorganizing to bring the monarchy down. For 200 years, the House of Savoy has delegated power to other government bodies, be it the parliament or the Grand Council of Fascism: this changes now.\n\nFor the first time on the history of the Kingdom, Umberto will concentrate power in his hands, ruling directly by decree. By centralizing power, the King's duty of  rooting out Fascism from society will be easier. Desesperate times require drastic measures: Italy won't fall to the mob rule."
ITA_king_freeze_pnf: "Freeze the PNF"
ITA_king_freeze_pnf_desc: "Since the end of World War One, the Partito Nazionale Fascista has been the growing cancer of Italian society. They slowly corroded Italian institutions, denying representation to other political parties and replacing the Catholic faith with a cult of the Fascist ideology. Even with the apparent collapse of the Fascist leadership, the PNF remains at large, looking for the opportunity to start the whole process again and remove their last obstacle to absolute power: the monarchy. Are we going to give them the chance to do it? The answer is pretty obvious.\n\nThe PNF will be frozen from political and economic activity. We'll seize their assets, detain senior members, and dissolve their organizations and publications. By neutralizaing any attempt of the Fascists to organize, we'll make sure that they never attempt to regain power ever again. King Umberto II is determined to avoid repeating the same mistakes of his father."
ITA_king_emergency_brakes: "Emergency Brakes"
ITA_king_emergency_brakes_desc: "Despite our best attempts to stop the radicals in their tracks, things are getting out of hand. Students are overwhelming the police, workers are seizing the factories, and even soldiers are defecting to the rioters. Even our faith isn't safe, as reports of churches being looted increase each day. Our attempts at reforms are not working as intended: instead of incremental change, people want to burn the whole system down.\n\n"It is better to be feared than loved if you cannot be both." Machiavelli's famous saying goes.\n\nWe need to stabilize the nation at all costs, even if we have to stop our reforms temporarily. Bit by bit, we'll weed out the terrorists that want to destroy Italy and make an example out of them for anyone tempted to do the same."
ITA_king_arrests_and_assassinations: "Arrests and Assassinations"
ITA_king_arrests_and_assassinations_desc: "While bombs and guns kill our people and destroy our streets daily, speech remains the most dangerous weapon of the radicals. Propagandists and subversives spread disinformation and lies to the public, putting the people against us and encouraging violent acts against the State. But the worst part is that their disgusting and dangerous ideas are taking hold of Italian society, making our task of stabilizing the country even more difficult. How do we avoid these ideas gaining popularity? By force, of course.\n\nWe'll arrest these radical leaders so they can preach the virtues of Marxism to the rats of the dungeon. However, we'll also need to permanently silence the most dangerous ones, gunning them down if necessary. Are we using the same methods as the Fascists? If the only language that these thugs understand is violence, so be it. The House of Savoy won't end like the Romanovs!"
ITA_king_blackmails_and_exiles: "Blackmails and Exiles"
ITA_king_blackmails_and_exiles_desc: "Violence is an effective way to neutralize some troublemakers effectively and permanently. Nevertheless, there are some radicals that we can't put our hands on. Some of them are leaders with a certain level of popularity, whose deaths would lead to an even bigger public fury. On the other hand, other radicals on the military and the political scene are extremely well-connected: getting rid of them is very risky. Fortunately, there are more subtle methods to stop these subversives that don't involve open violence.\n\nBlackmail and exiling are good tools to send them far away or get them on our side. Generals still sympathetic to Fascism may change their tune if we expose their dirty secrets to the entire country, be it a secret mistress or a corrupt dealing. Political activists have families they don't want to see harmed, convincing them to make a long permanent trip out of Italy. They should be thankful of their luck: we prefered to reserve a far worse fate for them."
ITA_king_restoring_order: "Restoring Order"
ITA_king_restoring_order_desc: "Fascism is on the verge of disappearing completely. Fascist organization is non-existent, the PNF is no more, and most of their leaders have been arrested. A well-done job indeed. Nevertheless, we need to turn our attention to the other Damocles dagger dangling over our country. Subversive Communist activities are on the rise, showing no sign of stopping, and leftist militias are violently seizing factories and local government buildings. It's time their little revolution comes to an end and we restore order once and for all...\n\nWe will use the OVRA to prevent the most prominent of these groups from gaining power, arresting their members and dissolving them completely. King Umberto is confident that once we destroy all these Communist organizations, Communism as an ideology will be discredited. Only some small groups will be left, dying in complete obscurity. We share his optimism to some extent, but the actual task will be harder than we thought."
ITA_king_restoring_order_tt: "\nHaving dealt with the £ita_internal_opposition_texticon §jFascist Growth§! for now, we will turn our gaze towards the £BRA_pcb_texticon §VCommunist Specter§!."
ITA_king_in_mind: "In Mind"
ITA_king_in_mind_desc: "Communism works not only by spreading its poison into the working class but also by targeting the future of Italy: the youth. One of the many factions of the leftist movement is the New Left, composed mainly of students disaffected with the current order. It advocates a more unorthodox style of communism, writing theory, and manifestos that defy more traditional assumptions. Feminism, ecologism, anarchism, theories from obscure Marxists: the New Left embraces all of it.\n\nThese radical and new ideas are not only a danger to our country but to the fabric of society itself. Activists groom the youth to accept these ideas, making them embrace a life of terrorism and degeneracy. King Umberto's verdict is definitive: New Left's radicalism is a threat that must be silenced."
ITA_king_restoring_wartime_censorship: "Restoring Wartime Censorship"
ITA_king_restoring_wartime_censorship_desc: "Communists are taking advantage of mass media to spread their filthy ideology. Through leaflets, newspapers, and magazines, radical ideas spread like wildfire through word of mouth. Even with our efforts to counter this propaganda, some people prefer to believe the fairy tales of a utopic society where everyone does what they want. We need to protect the population from the greatest danger to their lives and happiness: themselves.\n\nDuring the war, strict censorship was implemented to maintain high morale at home. We'll redouble our censorship efforts to return to this level of control over the media, closing all subversive publications. In these dire times, the Italian people can't be confused with toxic ideas that will only make things worse."
ITA_king_silence_students: "Silence the Students"
ITA_king_silence_students_desc: "Once places of enlightenment and culture, universities have become a nest of subversion and crime. Students have become the vanguard of  leftist organizations, planning protests, riots, and even terrorist attacks. Even worse: they look to corrupt other young people into their movements through propaganda.\n\nTo break their power, we need to prevent them from organizing. Patriots will infiltrate their meetings so we can stop their nefarious actions. Any radical leftist protesting and rioting will be arrested and given exemplary punishment. We'll stop them on time before they become the new Bolsheviks: lice become nits eventually."
ITA_king_tearing_down_manifestos: "Tearing Down Manifestos"
ITA_king_tearing_down_manifestos_desc: "The main danger of the New Left doesn't come only from their subversive actions against the state but the creative ways they have to spread their poisonous ideology. Nowadays, it seems every student wants to be the new version of Karl Marx or Antonio Gramsci, writing hundreds of manifestos of questionable quality. The worst part of this poor attempt at political theory is that it drags otherwise healthy youngsters into terrorist organizations.\n\nFortunately, unlike the Communist Manifesto, we are on time to prevent the snake before it hatches. We'll confiscate these leaflets and manifestos and apprehend anyone distributing them immediately. Our country doesn't need this kind of pseudo-intellectual tracts that will only make things worse."
ITA_king_burning_newspapers: "Burning the Newspapers"
ITA_king_burning_newspapers_desc: "In theory, newspapers should inform the population about the current news. Unfortunately, the subjective nature of journalism makes print media the most effective means of subversion of the radicals. Leftist radicals have created several radical newspapers, spreading amongst the student population like weeds. If we don't stop this wave of misinformation, radical ideas will gain a foothold in society.\n\nWe'll close the printers where these pieces of subversion are made, arrest the editors, and confiscate and burn this dangerous material. Anyone has the right to express their opinion, but it's unacceptable that certain people, under the excuse of "freedom of expression," publish this disgusting propaganda."
ITA_king_revealing_guerillas: "Revealing the Guerillas"
ITA_king_revealing_guerillas_desc: "Italy is drowning. Discontent has reached a breaking point and there is nothing left but anger in the hearts of the people. The New Left, inspired by the movements of Latin America, have cried havoc, and it's our task to keep the dogs of war at heel. Their guerillas, moved by hate and zealotry, are tearing at every bit of our country and colonies and our soldiers are struggling to respond. How could they? The rebels have blinded them, crippled them. Those tactics may have worked across the sea, but Italy can still fight back! Fiery rhetoric and dirty tricks can only work for so long. All it will take for them to fall is for us to adapt to their rat-like tactics, to take them on in the fields and win the propaganda war in the cities. If we put our backs into it, we'll show them the King and his men don't fold easily and ultimately prevent a full blown revolution."
ITA_king_La_Voce_del_Padrone: "La Voce del Padrone"
ITA_king_La_Voce_del_Padrone_desc: "We are on the verge of crushing the New Left movement. Students are returning to the classroom, Communist leaflets on campuses have disappeared, and radical newspapers are out of circulation. As most of the Socialist organizations have been disbanded and their members arrested, we can confidently say that the New Left's radical and subversive ideas have been nearly eradicated and thrown in the wastebin of history.\n\nThe discontent of young people will probably continue from time to time, with sporadic acts of disobedience. They will eventually grow out of it and learn to obey authorities, especially the one that rules and protects the nation: the King. In the meantime, our duty continues: other radicals are out there, waiting to attack."
ITA_king_in_body: "In Body"
ITA_king_in_body_desc: "Our enemy is complex and comes in various shapes and forms. Radicals are divided into factions based on different ideologies and approaches to implementing "socialism." The so-called Old Guard is composed of old communists with a more traditional position based on old Bolshevik strategies: a revolution led by industrial workers. Their popularity comes from the urban working class and, even worse, old soldiers that fought in the Second World War. We need to avoid a future Bukharinist nightmare by acting quickly and effectively.\n\nTo properly neutralize them, we need to target the core of their power base. We'll crush the strikes and take the occupied factories by force, using whatever amount of violence is necessary. Also, to make our soldiers sure for which side they are fighting for, we'll redouble our propaganda efforts to maintain morale and stop defections. It doesn't matter all these factions believe: their fate will be the same. "
ITA_king_no_more_bread_riots: "No More Bread Riots"
ITA_king_no_more_bread_riots_desc: "While some criminals disrupt the order based on vague concepts like "revolution," others have a more instant necessity. Due to the chaotic situation, prices of necessities have risen, the supply of food is low, and people have expressed their discontent in the streets. Shops were razed to the ground in a desperate rush to find anything that was edible, while social misfits have also taken the opportunity to loot luxury articles. We can't have this happen, and it is of utmost importance to end any riots until we can restore stability.\n\nA carrot and stick strategy will do the trick. We'll set some price controls, try to reactivate the supply line, and distribute some necessities to those in need. On the other hand, we'll impose curfews, and security forces will be on full alert to crush any criminal attempting to take something that isn't theirs. While we understand the discontent of the hungry, looting other citizens is unacceptable and counterproductive: it only benefits the interests of a few. "
ITA_king_lock_down_factories: "Lock Down the Factories"
ITA_king_lock_down_factories_desc: "Once the heart of the Italian economy, factories are now a nest of subversion and terrorism. Radicals occupy these industrial buildings, using them to organize subversive actions against the state and radicalize others into their evil deeds. Even worse: without industries working, the economy is in freefall. Until we can solve this situation, we need to deal with these terrorists.\n\nTo neutralize future terrorist operations, problematic factories will be shut down. Socialist troublemakers will be fired immediately and also blacklisted to make sure they don't expand their venom elsewhere. More loyal employees will replace them, willing to obey orders and love their country."
ITA_king_over_the_hills_and_far_away: "Over the Hills and Far Away"
ITA_king_over_the_hills_and_far_away_desc: "While the Italian Kingdom was on the winning side of World War One, the broken promises of greatness led to discontent and economic crisis. Resentful soldiers returning from the front turned towards radical ideologies in desperation to find some sense in their lives after bleeding in the Alps for years. The current situation is looking frighteningly similar to those dark times, as soldiers' morale is at an all-time low. We know where the path leads, and we need to do everything to avoid it.\n\nTo remind these soldiers where their loyalty lies, we'll launch a propaganda campaign to reassure them they are fighting for a good cause. If the backbone of Italy turns to communism or even fascism, then is there even an Italy anymore?"
ITA_king_good_times_bad_times: "Good Times Bad Times"
ITA_king_good_times_bad_times_desc: "Food scarcity is a big menace to the nation's stability, fueling even more discontent. However, high prices are not the only reason behind this problem. In the countryside, the farmers refuse to hand their crops to the government, throwing tons of fruits and vegetables in the middle of highways and roads. We believe that this disobedience is caused by radicalism finding fertile ground in rural areas, with farmers feeling nostalgic about Fascism and embracing communism.\n\nFood needs to arrive in the cities by any means necessary to at least lessen the hunger issue. Forcing farmers to either give or sell their crops is an option. Radicals want to starve this country until we give them what they want. We won't give in to these threats!"
ITA_king_when_the_levee_breaks: "When the Levee Breaks"
ITA_king_when_the_levee_breaks_desc: "Italy is on the verge of collapse. With a population in open rebellion and a non-functional economy, disaster looms its ugly head on the horizon. In the shadows, radicals are sharpening their nails, waiting for their chance to take over the nation. The levee is on the verge of breaking, and the proud Italian Kingdom is about to drown under the weight of radicalism. We can't allow this to happen!\n\nWe must restore confidence through Italy to stop the tide of communism. Italians must believe that their King will protect them and guide them through the storm. If people support us, we are confident that things will eventually get better... at least we hope they will."
ITA_king_La_Pace_del_Re: "La Pace del Re"
ITA_king_La_Pace_del_Re_desc: "Despite everything, our efforts to contain the Red tide are working. The Old Guard of Bolshevism has been defeated, with most of its leaders imprisoned, exiled, or silenced forever. Workers have been silenced, either through force or negotiation, returning to work as they should be. Soldiers are now completely loyal to the monarchy, abandoning the flirtation with those nocive communist ideas.\n\nWith one of the heads of the socialist hydra gone, the King has made a crucial step to restoring peace and stability to Italy. Nevertheless, our job is far from done. There are other socialist terrorist cells out there, waiting for us to let our guard down. Unfortunately for them, we are ready to crush them and pacify the country once and for all."
ITA_king_in_spirit: "In Spirit"
ITA_king_in_spirit_desc: "A spectre haunts the churches and religious gatherings of Italy - that of Catholic Communism.\n\nCatholic Communism is a term that at first seems to be an oxymoron. An impossible fusion of conflicting worldviews, an odd affirmation of religious idealism in the name of materialism! Yet it is the quirks inherent to Catholic Communism that gives it significant weight. It appeals to those more conservatively-minded Italians who, while not completely opposed to revolution in principle, have never once had their ears graced by the Marxist conceptions of materialist dialectics.\n\nBy fusing the familiar theology of Christianity with the revolutionary economic and political project of the Communists, the Catholic Communists have managed to construct for themselves a wide base of support among those who have always believed Communism to be an atheistic cult of fifth-columnists.\n\nHaving elements of Marxist Humanism woven into it, and with Italy's majority catholic population, the threat of the Catholic Communists appears to be growing stronger with every passing day."
ITA_king_vatican_hotline: "The Vatican Hotline"
ITA_king_vatican_hotline_desc: "The greatest asset that these Communists have is manipulating the goodwill of Italian Christians and making them think that what they are hearing is morally correct. We need to discredit the lies of these charlatans, showing the people that bombing a police station is not something that Jesus would do. Fortunately, the authorities of the Catholic Church have been fighting this kind of deviant heretic ideologies for hundreds of years and are the perfect allies in this battle.\n\nWe'll contact the Vatican for support in our crusade against the corruption of the Catholic faith. The wisdom of the Pope will make credible our denunciation of Christian Communism. He would also help us to stabilize Italian society in these chaotic times through his spiritual guidance. Committed Christians around the country will likely listen to the representative of God on Earth first instead of subversives and their mad rants."
ITA_king_placating_the_masses: "Placating the Masses"
ITA_king_placating_the_masses_desc: "At the foundation of every revolution is hate, and at the foundation of hate is discontent. The same can be said of this crisis. As such, to nip this in the bud before the whole country comes down, we must make some emergency concessions. There are a good few things we can do that the masses have been crying for, and if we can overcome this crippling inefficiency our nation has been struck with we just might be able to deliver. With any luck, we'll be able to take some of the passion out of this rebellion with this set of social reforms and bide ourselves some time to get on our feet, and perhaps even win over some of the moderates."
ITA_king_pray_and_obey: "Pray and Obey"
ITA_king_pray_and_obey_desc: ""Obedience" is a substantial virtue for every God-fearing Christian to have. It's not only about following the Ten Commandments but also about respecting authority on every occasion. Be it respecting the paternal authority,  the  employer's authority, and (most importantly) respecting the State's authority, obedience is a fundamental component of a  functional society. Unfortunately, some preachers seem to conveniently forget this part of the Chrisitan faith in their tirades against us.\n\nWe'll use our connections inside the Church so preachers can remind their fellow Christians about the importance of obedience, and we need to make sure people know that the will of the lord is to obey the Crown. As Lucifer rebels against God's authority, these Communists are trying to destroy the divine order of the Monarchy. We won't allow them to win."
ITA_king_pray_and_stay_silent: "Pray and Stay Silent"
ITA_king_pray_and_stay_silent_desc: "The Bible is undoubtedly the most influential book in the history of Western civilization. It has guided millions of people in need across history and inspired knowledge in the brightest minds of mankind. However, as we know, nothing is sacred to Communism. Radical Catholic Communists are spreading their own subversive literature based on supposed Christian principles from the Bible.\n\nThese ideas are not only wrong: they are dangerous. We'll censor these heretic publications that try to use the Word of God for nefarious purposes. Our fellow Christians don't need to be confused by these outrageous interpretations that have nothing to do with Christianity and everything to do with Socialism."
ITA_king_pray_and_work: "Pray and Work"
ITA_king_pray_and_work_desc: "The Communist preachers trying to destabilize our government wouldn't be so successful if they didn't prey on people's desperation. Unfortunate Christians going through a crisis of faith, unsure what to do or think, fall on the machinations of these unscrupulous subversives. As a result, they think their situation will improve just because they distribute subversive propaganda or put a bomb on a train station.\n\nWe need to make these people see reason and leave everything under our hands: it's all part of God's plan. The best they can do now is keep working and wait for the storm to calm. There is no need to embrace violence just because a Communist playing pretend as a preacher told you so. What would Jesus do? Well, he wouldn't be a Communist, that's for sure!"
ITA_king_La_Volonta_di_Dio: "La Volontà di Dio"
ITA_king_La_Volonta_di_Dio_desc: "Despite the fruitless attempts of the Communist menace of corrupting our faith, we have managed to prevail in the end. We have arrested most of these Socialist preachers corrupting the Word of God, and their heretic publications have been closed. Even if they are still Communists preaching the virtues of Marx, they are mostly irrelevant, and people don't believe their lies any longer.\n\nBeyond being sorely a political victory, this is a spiritual and moral victory over the forces of evil. While subversives will keep being a problem, for the time being, one thing is for sure: we managed to save the souls of the Italian nation before it was too late."
###=====| b) Revolutionary Provisional Government |=====###
  # intro section
ITA_RED_out_of_the_void: "Out of the Void"
ITA_RED_out_of_the_void_desc: "The winding rope tying Italy to the reactionaries has been cut. The people throughout the nation experience their own form of free-fall. In this atmosphere of uncertainty, in which hierarchies have been scattered, one's own national identity is in question, and the sureness of one's own station lies in tatters, one question remains: Where will we land, on a safe and secure foundation, or the endless depths of utter destruction?\n\nWe will go forth. We, the people, will endure this violence and chaos. For our nation to find new, unfamiliar ground, and progress onwards, courage is required. And courage we have! Marx's dream, Marx's legacy will be redeemed! The hopes and dreams of a thousand dearly missed comrades will not be in vain! In the midst of this Nazi-Fascist world, we will not let the opportunity for liberation go to waste."
ITA_RED_the_sun_rises: "...the Sun of the Future Rises"
ITA_RED_the_sun_rises_desc: "our uprising succeeded and we've set up an assembly, time to actually organize the govt"
ITA_RED_marching_workers: "Marching Workers"
ITA_RED_marching_workers_desc: "organized workers are supporting our uprising, time to integrate them into our govt"
ITA_RED_bustling_deputies: "Bustling Deputies"
ITA_RED_bustling_deputies_desc: "sorting out administrative efforts in areas we've secured"
ITA_RED_surging_militants: "Surging Militants"
ITA_RED_surging_militants_desc: "the military committee needs to reach out to sympathetic militant groups to formalize cooperation"
ITA_RED_a_symphony_from_pandemonium: "A Symphony from Pandemonium"
ITA_RED_a_symphony_from_pandemonium_desc: "alright it was a little chaotic but we're working together :)"
ITA_RED_the_show_must_go_on: "The Show Must Go On"
ITA_RED_the_show_must_go_on_desc: "ow fuck our troops still got BTFO trying to take rome. change of plans, we gotta prepare for a war"
  # main section - left branch
ITA_RED_going_to_the_masses: "Going to the Masses"
ITA_RED_going_to_the_masses_desc: "The Italian proletariat has been shackled under the vicegrip of fascist oppression for more than 40 years, and before that by the Savoia royals and their bourgeois lackeys. Those who tried to awaken the people's consciousness have been branded as enemies of the nation and persecuted by the police and the army. It is no wonder why the Italian proletariat is not well versed on matters of Marxist theory; decades of repression pushed our movement further into obscurity.\n\nHowever, with the fall of the old fascist order, Italian socialism has been given a second lease on life, and we need to make sure the people are properly educated on matters of Marxism. After all, the first and foremost task of the revolutionary is to educate the masses, and an uneducated proletariat will lead to a failed revolution. We will take to the streets and tell the people that they are now free from the shackles of capitalist and fascist oppression."
ITA_RED_a_rebel_on_every_street: "A Rebel on Every Street"
ITA_RED_a_rebel_on_every_street_desc: "focus on recuiting militants across the country to fight for the revolution"
ITA_RED_serve_the_people: "Serve the People"
ITA_RED_serve_the_people_desc: "have revolutionaries to aid the population in order to build support"
ITA_RED_rouse_the_people_to_action: "Rouse the People to Action"
ITA_RED_rouse_the_people_to_action_desc: "encourage autonomous class struggle"
ITA_RED_revolutionary_order: "Revolutionary Order"
ITA_RED_revolutionary_order_desc: "try to exert central control"
ITA_RED_welcoming_new_cadres: "Welcoming New Cadres"
ITA_RED_welcoming_new_cadres_desc: "we need a lot more people in the party and they are available, but may not be up to usual standards"
  # main section - center branch
ITA_RED_secure_the_war_industry: "Secure the War Industry"
ITA_RED_secure_the_war_industry_desc: "take Liguria and Savoy in order to supply the revolutionary army"
ITA_RED_refine_operational_command: "Refine Operational Command"
ITA_RED_refine_operational_command_desc: "ok so our officers dont agree on doctrine with defecting officers and also the troops are not all trained. lets try to figure out a compromise"
ITA_RED_secure_the_coasts: "Secure the Coasts"
ITA_RED_secure_the_coasts_desc: "revolutionary navy and coast guard smile"
ITA_RED_mountain_holdouts: "Mountain Holdouts"
ITA_RED_mountain_holdouts_desc: "try to help revolutionaries in the enemy's rear area"
ITA_RED_along_the_river_plain: "Along the River Plain"
ITA_RED_along_the_river_plain_desc: "subjugate the hereditary fascists of veneto"
ITA_RED_infiltrate_the_south: "Infiltrate the South"
ITA_RED_infiltrate_the_south_desc: "expedition of the thousand but socialist this time"
  # main section - right branch
ITA_RED_a_revolutionary_army_focus: "A Revolutionary Army"
ITA_RED_a_revolutionary_army_focus_desc: "found the red army. non-socialists might not like this but they can cope"
ITA_RED_impromptu_training_schools: "Impromptu Training Schools"
ITA_RED_impromptu_training_schools_desc: "please train our officers and troops"
ITA_RED_sway_the_common_soldier: "Sway the Common Soldier"
ITA_RED_sway_the_common_soldier_desc: "What cause did the army of the old regime fight for? Was it for the glory of Italy? Was it for the national revival? No. It was to secure the jackboot that crushed his fellow countrymen, and for the degradation and oppression of those who were unfortunate enough to live in the areas that he conquered. We must show whatever military opposition that exists the truth. We do not fight for the subjugation of others like the old government did. Instead, we fight for liberation, not just of Italy, but for the workers of the entire world."
ITA_RED_a_hundred_marching_songs: "A Hundred Marching Songs"
ITA_RED_a_hundred_marching_songs_desc: "yeah you can run your militia however you want. if you want to make bad choices and ignore high command and get destroyed thats cool. its fine"
ITA_RED_in_perfect_unison: "In Perfect Unison"
ITA_RED_in_perfect_unison_desc: "focus on a disciplined, loyal main force because we want to win"
ITA_RED_volante_rossa: "Volante Rossa"
ITA_RED_volante_rossa_desc: "paggio's epic cool mobile warfare detachment"

  # final section
ITA_RED_city_of_steel: "The Moral Capital"
ITA_RED_city_of_steel_desc: "From Justinian to Napoleon, Milan stood as their historical seat of legitimacy. Without it, the Empires of the past could not control the peninsula in its entirety. Milan is the financial center of Italy, serving as the crossroads to the rest of Europe, with its strategic location in the Po Valley serving as a manufacturing hub. With Milan comes the working class of Italy, and to secure it not only serves as potent boost to our legitimacy, but also as the center for the liberation of the Italian proletariat."
ITA_RED_see_naples_and_die: "See Naples and Die"
ITA_RED_see_naples_and_die_desc: "Naples has long stood as the cultural center of Italy. Built with the classics of Greece and the fortitude of Rome, the city served as the crown jewel of the South. With control of Naples comes the control of the region itself - which has historically been the place of reactionary and conservative ideals. For the revolution to purge such reactionary ideals, it must control the South - and there is no better way to do so than to hold its pride and joy."
ITA_RED_the_eternal_prize: "The Eternal Prize"
ITA_RED_the_eternal_prize_desc: "Gaze upon the eternal city and beg, O, ye reactionaries! The revolution builds to its crescendo, and the liberation of Rome begins in earnest. Popular Militias raise the very bricks on the roads and entrench in the streets as partisans organize for the upcoming arrival of the People's Army. The revolution's final salvo shall hit the very heart of Italy, and the People's Government shall finally be established.\n\nComunismo o Morte!"
ITA_RED_triumphal_march: "The Revolution's Triumphal March"
ITA_RED_triumphal_march_desc: "the assembly assembles in rome"
ITA_RED_strangling_the_remnants: "Strangling the Remnants"
ITA_RED_strangling_the_remnants_desc: "The great monstrous and rotting vase has been shattered by the working man's hammer. The Monarcho-Fascist Medusa has been obliterated. But the shards remain, the snakes that composed the vast monster still remain, lingering and slithering by our feet. They hide in shade and shadow, thinking we do not see them festering, organizing, plotting to return us to the "good old days." The days of Blackshirts.\n\nFrom the Southern fields, to the Northern Alps, these groups will be sought out! Counter-revolutionary forces, monarchist remnants, Fascist partisans, all are our enemies! Like the parasitic organisms they are, they combine, contract, split and multiply as each day passes. Their destruction must be made with haste, lest the remnants be allowed to properly form up against the revolution!"
ITA_RED_tribunali_rivoluzionario: "Tribunali Rivoluzionario"
ITA_RED_tribunali_rivoluzionario_desc: "One of the leftover institutions that is in dire need of reform from the previous fascist system is the so-called 'justice' system. For far too long, instead of seeking true justice and fairness, this system has only been used to persecute those who spoke out against the numerous crimes and injustices of the fascist system. No more! We shall overhaul the system so that it is truly just and representative of the people's will. Fascists shall be tried, and given the justice that they deserve."
ITA_RED_legge_dell_avvenir: "La Legge dell'Avvenir"
ITA_RED_legge_dell_avvenir_desc: ""
ITA_RED_honoring_the_martyrs: "Honoring the Martyrs"
ITA_RED_honoring_the_martyrs_desc: "i cant believe Longo is fucking dead. lets honor his wish to maintain party unity in spite of factional differences (lying)"
ITA_RED_stabilizing_the_republic: "Stabilizing the Republic"
ITA_RED_stabilizing_the_republic_desc: ""
ITA_RED_furthering_the_revolution: "Furthering the Revolution"
ITA_RED_furthering_the_revolution_desc: ""
ITA_RED_the_chimneys_smoke: "The Chimneys Smoke"
ITA_RED_the_chimneys_smoke_desc: "With the initial chaos in the streets following the revolution came chaos in the workplace, as the toilers of Italy burst out to fight for a better world. Now, due to our victory, Italians have started to return back to their normal lives. However, they do not work as they did before. Rather than slaving under the rule of selfish bosses, the proletariat of Italy toil with renewed vigour, knowing that their labour creates wealth for them and not the bourgeoisie."
ITA_RED_standoff_on_the_vallo_alpino: "Standoff on the Vallo Alpino"
ITA_RED_standoff_on_the_vallo_alpino_desc: ""
ITA_RED_watching_with_vigilance: "Watching With Vigilance"
ITA_RED_watching_with_vigilance_desc: ""
ITA_RED_supplying_the_defenders: "Supplying the Defenders"
ITA_RED_supplying_the_defenders_desc: "amogus"
ITA_RED_last_movement: "Last Movement"
ITA_RED_last_movement_desc: "Over the last century, it has seemed that the history of communism has just been a long list of defeats and humiliations. The French Commune and the Soviet Union are not patches of red on a map, but reminders of what could have been. Now though, we have another chance. Over Italy, the red sun rises, and we will make sure that its light does not go out. External reactionary forces still surround us, but we will not fall like our predecessors. Instead, the reactionaries shall watch as we unite the world in song."

# deprecated
ITA_RED_like_sunrays_in_the_morning: "Like Sunrays in the Morning"
ITA_RED_like_sunrays_in_the_morning_desc: "As the night ends, dawnbreak brings the light and it spreads all over the world. And just as the sunlight in the early morning, the Socialist Revolution is spreading through Italy like the red sun, bringing a radiant future where once was only the blackest night of fascism. And we, the Socialist Vanguard of a new Italy, will be the ones bringing the light of hope to the proletariat. So let us fight, comrades! And together, we will bring the liberation of the human race!"
ITA_RED_like_fish_in_the_sea: "Like Fish in the Sea"
ITA_RED_like_fish_in_the_sea_desc: "Our partisans are well trained in matters of land warfare, hiding in the woods teaches a lot about asymmetric warfare and logistics. But Italy is surrounded by the sea on three sides, so it's reasonable to prepare for eventual threats coming from the Mediterranean. We need to make contacts with the remnants of the Italian navy, and while many of the crews have pledged allegiance for the fascist exiles in the former colonies and brought their fleets with them, we can make sure some of the naval experience is kept. Like fish in the sea, the Revolution is a natural part of Italy."
ITA_RED_like_thieves_in_the_night: "Like Thieves in the Night"
ITA_RED_like_thieves_in_the_night_desc: "Before the Revolution, many, if not all of our comrades, went into hiding as soon as the fascist regime took over Italy. Those who did not escape to other countries stayed hidden in safehouses, forests, and mountains, far away from the prying gaze of the OVRA. We became experts in clandestine warfare, as revealing even one bit of information could spell the end of a cell.\n\nWith the Revolution, we have no reason to hide anymore. The way it happened so suddenly brought outside a lot of our comrades still in hiding, as militia groups rose out of the shadows to liberate their local towns and then come to march in our Socialist Revolution. Like thieves in the night, they are quick, subtle, but leave a lasting change."
ITA_RED_Orchestral_Ouverture: "Orchestral Ouverture"
ITA_RED_Orchestral_Ouverture_desc: "The instruments that our band plays are not what one would usually find in an orchestra. They do not produce sound using strings or keys. Instead, the instruments around us are the workers themselves. The shouts of their joy compose our baseline, and the bang of a truly free hammer makes up our melody. Our band cannot be allowed to remain reserved and quiet, lest our melody be drowned out by the drone of counterrevolution. With every step, more musicians are recruited into our ranks, as our song grows in scale. All of Italy must soon hear this music, and tear down its walls!"
ITA_RED_mountain_republics: "Mountain Republics"
ITA_RED_mountain_republics_desc: "Northern Italy, with its historic cities and manufacturing base, must be the first area that we liberate. However, its mountainous terrain does provide many problems for our forces. Fascists and other reactionary forces may use the isolation of some areas to gather their forces, and to eventually support whatever plan they have to bring the workers back under the jackboot. To shield us from this threat, we shall establish worker republics. These will hopefully build up revolutionary presence, and also serve as a way to combat whatever fascist forces may still be around."
#ITA_RED_along_the_river_plain: "Along the River Plain"
#ITA_RED_along_the_river_plain_desc: "Liberating the mountains is clearly only the first step towards consolidating our revolution. To truly establish control over all of the country, we must now travel along the rivers to free more of the country. The Po and the Reno rivers serve as vital arteries for Italy, so it stands to reason that they will be helpful in our struggle. Soon, all of northern Italy will be free, and we will be able to switch our focus towards taking the more reactionary south of the country."
ITA_RED_liberated_countrysides: "Liberated Countrysides"
ITA_RED_liberated_countrysides_desc: "Unlike the north of the country, the south shall be harder to establish control over. Reaction and counterrevolution still infest the land, and whatever fascists and monarchists that remain are sure to at least try to put up strong opposition to us. We must not let this stop us, however. Just like everywhere else under capitalism, the proletariat of the south still calls for us to break their chains and free them, and we will certainly listen to their cries."
ITA_RED_by_the_side_of_the_hills: "By the Side of the Hills"
ITA_RED_by_the_side_of_the_hills_desc: "Our revolution still has many enemies. In the south, a disturbing amount of fascists have been using the cover provided by the hills to organise a counter revolution. If we want to avoid a lengthy conflict like the one that engulfed Russia after its revolution, we must clear them out as soon as possible. Our revolution will not be defeated from inside!"
ITA_RED_Oltre_il_Ponte: "Oltre il Ponte"
ITA_RED_Oltre_il_Ponte_desc: "With the rural counties secured, now stands the time to encircle the cities. Milan, Naples and most importantly, Rome must be secured by the Brigata Rossa. The road to communism will be treacherous, as the counter-reactionary state will not give way to the will of the masses. However, we must solidify the revolution in this final step for people's democracy. Heed the call to the brave revolutionaries, to organize and flood the reactionary regime with the rallying cry of a thousand battalions."
ITA_RED_symphonic_crescendo: "Symphonic Crescendo"
ITA_RED_symphonic_crescendo_desc: "A symphony known to every worker, every farmer and every peasant. This was the symphony of revolution, of an undying flame that spread across the hearts and minds of all who listened. It has reached its very peak, and the people's cause has been truly consolidated in Italy. Yet the question stands to all who have listened, who will lead this new nation?"
ITA_RED_partisans_into_policemen: "Partisans into Policemen"
ITA_RED_partisans_into_policemen_desc: "The transition from King's Tyranny to Revolutionary Order is of a very different nature to Fascism giving way to Umberto. The transition from one reactionary to another, while more dramatic than the facetious change of power within bourgeoisie democracies, does not alter the status quo. The way of things, not fundamentally upset, ensures not all the institutions, and those making it up, are placed in total opposition. The police of Fascism became the police of Monarchism. We have, and want for, no such luxury.\n\nThe enforcement of the new revolutionary world must be kept firmly out of the hands of the Fascist crop. Only the most revolutionary of our forces will be allowed to staff police units, only the most ardent anti-fascists! The people's victory will be secured!"
ITA_RED_provisional_revolutionary_government: "Provisional Revolutionary Government"
ITA_RED_party_men_into_bureaucrats: "Party Men into Bureaucrats"
ITA_RED_party_men_into_bureaucrats_desc: "The Partito Communista Italiano has, from its first days to these crucial moments, been comprised of good party men. All united in a diversity of perspectives, all varying in ideas, methods, principles, and ambitions. Nevertheless, we are also united in a shared hope, a shared aspiration, and a shared goal: Revolution. A successful casting off of chains that have held Italy since time immemorial.\n\nWe have revolution, now its success must be ensured. Our government teeters on instability, the same sort that led to lead piercing Umberto's chest and the overthrow of his government. In this newfound peace, our good party men must become good revolutionary bureaucrats. And when the forces of strangling reaction re-manifests itself as war declared upon us, they shall be our Commissars. From the party, we will draw those who would strive to see our government not suffer Umberto's fate."
ITA_RED_war_economic_provisions: "War Economic Provisions"
ITA_RED_war_economic_provisions_desc: "What, eventually, was the biggest failure of the October Revolution? It was not the fault of the people or communism. It was instead the failure of the Soviet state to mobilise enough resources to fight the war against the fascist invader. Whilst communism seeks peace between all peoples, we must face the fact that we are surrounded by enemies. To our north, the reactionary bastion of Germany stands poised to destroy our state, and to our west Iberia plots to end the perceived threat. We will not make the same mistake that our predecessors did."
ITA_RED_the_mills_turn: "The Mills Turn"
ITA_RED_the_mills_turn_desc: "Day by day, hour by hour, the revolution grows stronger. The countryside and cities of Italy are no longer filled with the reactionaries who seek to overthrow our regime and rewind the clock of history. Instead, more and more people have begun to accept and even embrace the music of revolution, which has begun to climb in a majestic crescendo. We must not let the momentum that we have built up falter. Instead, we will carry the red banners of liberation forward for all of humanity!"
ITA_RED_the_wind_blows: "The Wind Blows"
ITA_RED_the_wind_blows_desc: "It seems as if, finally, the people of Italy have woken up. Every new day that dawns, there are less and less reports of fascist resistance, and more reports of cooperation with the revolution. Finally, our hold has begun to be secure. The building of class consciousness is far from complete, and the redistribution of the means of production still has a long way to go, but the chains of fascism have truly been broken in Italy."

###=====| c) Italo-German War |=====###
ITA_RED_the_storm_strikes: "The Storm Strikes"
ITA_RED_the_coming_storm_desc: "Despite our victory in the revolution, fascism still lurks in Europe, and it has come to tear down everything we fought for these last few years. At last, the Germans are marching on Italy, ready to trample our free land under the march of their goosestepping jackboots. Thankfully, we will not let that happen! The might of the Italian people when motivated by such a righteous cause is to be feared. We must mobilize the nation as a whole to hold the Alps against the rushing black tide of national socialism that seeks to drag our country down in the undertow. All must fight for their nation, for a loss means the destruction of our people. As long as a single Italian is standing, the dream will never die - so stand, Italy!\n\nStand so we may hold the Alps until they are nothing but ash and fire!"
ITA_RED_rally_the_people: "Rally the People"
ITA_RED_rally_the_people_desc: "The revolution, though just, took a toll on our country. Our people are divided and our cities and towns are devastated by violence, only being made worse by the German bombs now ravishing the land. Morale is at an all time low, Italians from every corner of society fear that this may be the end. Contrary to this, all is not lost! Though the Germans seek to destroy our country, our people, and our revolution, we will resist through blood, fire and lead! All we need is to rally the people under one banner, to vanquish the fear in their hearts and replace it with vengeful fury. We will survive, but only if our people's spirits are high and wielded against our foes. Never surrender, Italy, for fear of defeat does nothing but ensure it! Raise the flag, arm the people, and weather the storm!"
ITA_RED_necessary_requisitions: "Necessary Requisitions"
ITA_RED_necessary_requisitions_desc: "Our position in finance is precarious to say the least. We are walking a thin line between indebted and spiraling into national poverty. It is a sad reality that, to avoid going even deeper into that chasm, we must centralize our economy just enough to supplement our wealth with the wealth of the people. We simply cannot fight this war without money. We cannot run our factories, feed our men, or pay our debts without money. Without money, the revolution dies. Italy dies. So, as much as it pains us, centralization is the only option."
ITA_RED_wartime_authority: "Wartime Authority"
ITA_RED_wartime_authority_desc: "To use a tired phrase for a tired concept, desperate times call for desperate measures. The Germans, though their nation is constantly ailing, are still a military juggernaut that will require every ounce of our economic, industrial, and military might to handle. As such, like the Russians in their day, we will need to quickly and harshly centralize our economy, dedicating it entirely to our pursuit of victory. The demands of the revolution are not always popular and the  people will be upset, but the necessity outweighs all other considerations.  An angry populace is better than a dead one, and as such we will have to choose the path of centralization."
ITA_RED_standing_united: "Standing United"
ITA_RED_standing_united_desc: "As the Fascist tide continues to sweep the nation's frontiers, political demagogues lay quiet, writing for the absolute defense of the Italian revolution instead of dividing the nation in its greatest peril. Political divisions retract in the face of the enemy, as the mutual cause of defending socialism led Italy to put aside their sectarian beliefs. All of Italy beckons to a united front, for it will lead the revolution to victory against Germany."
ITA_RED_a_call_to_arms: "A Call to Arms"
ITA_RED_a_call_to_arms_desc: "This is not just a war for the revolution but a war for all of Italy. Without every single son and daughter of this country's full support, none of us will survive. We will need a rifle in every hand and a battle cry in every throat. We encourage, nay require, that every Italian do everything they can to support the war effort. We call all brave sons of Italy north into the alps, to man the ramparts of this country in foxholes and fortresses. We call all brave citizens of Italy to work in the factories, in the fields, in the workshops to arm our nation, feed our soldiers. The entire country must be mobilized if we want any chance of holding off the throngs of rabid hounds attempting to devour our nation, our people and the dream of the revolution!"
ITA_RED_a_gun_on_every_shoulder: "A Gun on Every Shoulder"
ITA_RED_a_gun_on_every_shoulder_desc: "This war is one of the most important wars in Italian history, and we cannot fight rifles and bombs with sticks and stones. As much as our hearts are in this war, and as much as our righteous fury and ingenuity carries us on, that's useless without well equipped troops. As such, we need to be producing resources by any means necessary. Every soldier will have a full stomach and a gun, and every gun will have enough bullets to take down as many German bastards as the country needs. Our tanks and planes will have the fuel and shells they need to rain down the revolution's righteous wrath on the Nazi menace. No length is too great to obtain these things, for to lack them would mean the death of us all. "
ITA_RED_what_can_they_offer: "What They Can Offer"
ITA_RED_what_can_they_offer_desc: "Rarely has there been a force so wholeheartedly evil as the Reich. A state built on hatred, oppression, and the corpses of tens of millions of human beings. From the most hardline conservative to the most die-hard communist, all of Italy fights under one banner. This is not just a war for the revolution, it is a war against evil: a clash with an army of demons that seek to expand their domain of murder onto our country. They want nothing less than total annihilation, subjugation and colonisation of all that is good in this world, and have gotten their way in a dozen countries before us. That ends here! This is no longer just a war of ideology, it is one of the many wars of the eternal struggle of good against evil. Like the heroes of old, we will vanquish the evils of this world, only with a bullet through the head instead of a sword through the heart."
ITA_RED_to_serve_the_nation: "To Serve the Nation"
ITA_RED_to_serve_the_nation_desc: "Once, Italy was divided. Her people tore at each other and brought eachother down with words, bullets and bombs. The scars have yet to heal because the wounds are still open, bitter foes coexisting but bristling with discontent. That time is over. With the German invasion, all Italians are once again brothers and sisters! Our differences melt further and further away with every bombing and every advance, for every Italian knows what defeat will mean. Worker, Bourgeois, Leftist, Rightist, Conservative, Progressive, Rural, Urban... these terms become meaningless as they all form to one - Italian; and the Italian will never give up. The nation stands against the Germans as a whole, for there is no greater enemy to our country than the nazi. With all of her sons and daughters finally fighting as one, Italy will prevail!"
ITA_RED_our_natural_defenses: "Our Natural Defenses"
ITA_RED_our_natural_defenses_desc: "Our country is a veritable fortress, and we must use that to our full advantage if we want to win this war and save the revolution. The Alps have gained prestige by civilians and infamy by soldiers for their height, steep slopes, treacherous paths and worst of all, the bitter cold, not to mention our rigorously designed network of fortresses. Countless invaders have tried and failed to break them, their broken bodies still frozen beneath the ice as grim warnings to the next wave. These mountains will serve as walls, from which we can launch offensives, hold off nazi hordes, and gun down their aircraft before they can reach the heartland. Even beyond the alps there are still layers upon layers of mountain ranges to make our stand upon. So man the ramparts, Italy! The land will be our shield and the people our sword!"
ITA_RED_fortresses_along_the_alps: "Fortresses Along the Alps"
ITA_RED_fortresses_along_the_alps_desc: "The Germans may have taken most of the Alps, but it has come at the cost of heavy enemy casualties. With the People's Army continuing to hold onto various areas of defense, they ensure a vital hold over sections of the Alps free from fascist control. It is the security of our mountainous defenses that will lead to victory against the Germans, and they must be used to the advantage of the nation."
ITA_RED_bitter_resistance: "Bitter Resistance"
ITA_RED_bitter_resistance_desc: "Germany cannot expect the Italian masses to relive the days of Mussolini. They have suffered enough under the grip of Fascism, and they do not wish to see it rearing towards them again. In what little territory the Germans have, guerilla campaigns burn through the flanks of the fascists."
ITA_RED_no_easy_prey: "No Easy Prey"
ITA_RED_no_easy_prey_desc: "The Germans have expected an easy war, and that mistake cannot be rectified whatsoever. In any case we must not give the dogs the satisfaction of destroying our nation and ruling over our very corpses, for the revolution must live on. We will see the Germans bleed, with the snow of the Alps bleached in their blood."
ITA_RED_to_defend_the_revolution: "To Defend the Revolution"
ITA_RED_to_defend_the_revolution_desc: "The struggle we face is unlike any other war in our nation's history. It is not an expansionist struggle for the acquisition of more territory, an imperialist debacle or a war over petty grievances. No, what we face is the continuation of the battles fought by the Soviets, the climax of the great and eternal struggle between the might of Socialism and the evils of Nazism - the most vicious, rotten and grotesque form Capitalism has taken on.\n\nThis war is a war for the defence of the Revolution, the Revolution is its most primary characteristic, and it is what binds all that fight for it. Our victory will not just be a victory for Italy, but it will, first and foremost, be a victory for the will of the emancipated worker over the tendrils of fascism and capital."
ITA_RED_the_people_protect_themselves: "The People Protect Themselves"
ITA_RED_the_people_protect_themselves_desc: "The Old Guard have begun organizing from village to village, as cadres of people's militias gather in defense of the proletariat. The working man must be armed, ready to protect themselves and to reverse the German blitzkrieg."
ITA_RED_the_people_protect_themselves_tt: "Add one copy of §eMarxism Perfected§! £igw_swords_texticon  to your militia.\n§YCard Effect:§!\n  Add 10 £counter_intelligence Intelligence\n  Army Experience: §G+15§!\n  §eExpel§! your hand\n\nAdd one copy of §eThe Red Army§! £igw_swords_texticon  to your militia.\n§YCard Effect:§!\n  Division Attack: §G+10.00%§!\n  Create 5 §eOld Guard Divisions§!"
ITA_RED_militias_abound: "Militias Abound"
ITA_RED_militias_abound_desc: "The people's militias have been seizing victory in great success, as record numbers of volunteers gather across multiple military divisions, breaking the German blitz and recapturing the frontier. The German army waivers, and the push to reclaim Italy continues."
ITA_RED_militias_abound_tt: "Add one copy of §eThe Pain of Revolution§! £igw_swords_texticon  to your militia.\n§YCard Effect:§!\n  [RKI.GetFlag] Division Attack: §G-10.00%§!\n  [RKI.GetFlag] Division Defense: §G-10.00%§!\n\nAdd one copy of §eThe Oldest Guard§! £igw_swords_texticon  to your militia.\n§YCard Effect:§!\n  Political Power: §G+30§!\n  Division Attack: §G+10.00%§!\n  Division Defense: §G+10.00%§!"
ITA_RED_passion_of_the_students: "The Passion of the Students"
ITA_RED_passion_of_the_students_desc: "The New Left have dropped their pens and papers for rifles and grenades, organizing student battalions filled with the most educated of Marxist revolutionaries. Their driving passion for revolution has created the fiercest of fighters, overcoming even the strongest of mountains to defeat the German menace."
ITA_RED_passion_of_the_students_tt: "Add one copy of §xTrue Innovation§! £igw_wands_texticon  to your militia.\n§YCard Effect:§!\n  Political Power: §G+100§!\n\nAdd one copy of §xThe Student Revolution§! £igw_wands_texticon  to your militia.\n§YCard Effect:§!\n  Division Attack: §G+10.00%§!\n  Create 10 §eStudent Militiamen§!"
ITA_RED_the_fiercest_foe: "The Fiercest Foe"
ITA_RED_the_fiercest_foe_desc: "Rarely has there been a force so wholeheartedly evil as the Reich. A state built on hatred, oppression, and the corpses of tens of millions of human beings. From the most hardline conservative to the most die-hard communist, all of Italy fights under one banner. This is not just a war for the revolution, it is a war against evil: a clash with an army of demons that seek to expand their domain of murder onto our country. They want nothing less than total annihilation, subjugation and colonisation of all that is good in this world, and have gotten their way in a dozen countries before us. That ends here! This is no longer just a war of ideology, it is one of the many wars of the eternal struggle of good against evil. Like the heroes of old, we will vanquish the evils of this world, only with a bullet through the head instead of a sword through the heart."
ITA_RED_the_fiercest_foe_tt: "Add one copy of §xThe Will to Change§! £igw_wands_texticon  to your militia.\n§YCard Effect:§!\n  Stability: §G+15.00%§!\n  War Support: §G+15.00%§!\n\nAdd one copy of §xThe Romantic Revolutionary§! £igw_wands_texticon  to your militia.\n§YCard Effect:§!\n  Add Tactic: §x£igw_wands_texticon The Romantic Revolution§!\n  Political Power: §G+25§!"
ITA_RED_calling_on_the_unions: "Calling on the Unions"
ITA_RED_calling_on_the_unions_desc: "While much of the working class has long remained politically neutral, that era is rapidly coming to a close as the German hordes bear down on our nation in their quest to crush it like so many others. The Catholic communists have set to work, winning the hearts of the common man with their rhetoric and spurring the unions toward revolutionary action. It was never difficult to bring them there, it only took stoking the flames of rage that built as they watched the fascists plunder their homes and kill their countrymen. Radicalized and mobilized, they feed our war machine as more and more ordinary men enlist and the industrial base of our country takes on the fervor of its military. As men throw down hammers and pick up rifles, it can finally be said - the workers of Italy are going to war!"
ITA_RED_calling_on_the_unions_tt: "Add one copy of §wTheory of Christ§! £igw_cups_texticon  to your militia.\n§YCard Effect:§!\n  For every card in your deck,\n  Army Experience: §G+2§!\n\nAdd one copy of §wThe Beauty of Change§! £igw_cups_texticon  to your militia.\n§YCard Effect:§!\n  Division Attack: §G+5.00%§!\n  War Support: §G+10.00%§!\n  Stability: §G+10.00%§!"
ITA_RED_breaking_the_chains: "Breaking the Chains"
ITA_RED_breaking_the_chains_desc: "This war is the natural conclusion of our glorious revolution. We have slain every enemy that has come our way to stop the will of the people; the fascists, the monarchy, and countless other foes. Now we have reached the ultimate foe, the very personification of everything that our country stands against - the detestable, disgusting Nazi and his vile desire to stamp out anything that does not suit its reactionary tendencies. So, not only are we fighting for are lives, we are also fighting for our dream! A dream of a utopia in which all are welcome and all may live in peace and prosperity! We will not let the Germans defile any more dreams, so to finalize our war of liberation, we must defeat them. Nay - the evils will be defeated for sure, for there is no longer any other option for the people but the annihilation of the enemy."
ITA_RED_breaking_the_chains_tt: "Add one copy of §wThe Growing Movement§! £igw_cups_texticon  to your militia.\n§YCard Effect:§!\n  §wRecruit Thrice§!\n\nShuffle your deck\n\nAdd one copy of §wThe Saint of Communism§! £igw_cups_texticon  to your militia.\n§YCard Effect:§!\n  For every card discarded, played, or in your deck,\n  Division Attack: §G+0.50%§!"

