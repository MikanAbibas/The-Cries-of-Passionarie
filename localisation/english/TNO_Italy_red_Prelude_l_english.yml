###=====|a) Provisional Government |=====###
 provisional_government.1.t: "The King's Coup!"
 provisional_government.1.desc: "Verona ended without a settlement. The Congress scattered into funerals and recriminations, the gerarchi snarled at one another, and the cabinet could no longer pretend to govern. Summoned to the Quirinale, General Raffaele Cadorna accepted a royal mandate to restore order. The King dismissed ministers who would not sign the decrees, dissolved the Chamber and the Grand Council, and announced a provisional government that would answer to the Crown rather than the Party.\n\nThe shock reached every barracks and prefecture. The MVSN denounced the move as a blow against the Revolution of ’22, hardline colonels followed their lead, and in several cities armed Blackshirts surrounded government buildings. Cadorna’s loyal units opened corridors through the capital and secured the ministries, but the legality of the act became the spark that set Parliament against Palace and Army against Army. The press printed a single word all morning: “Crisis.”\n\nFar from Rome, long-silent networks stirred. The MCdI and the FAI revived their cells, the GAAP couriers changed their routes, and on factory floors talk turned from strikes to defense. In neighborhoods that remembered the Biennio Rosso, old banners were taken from trunks. The state remained intact on paper, yet the bonds that held it together were already fraying."
 provisional_government.1.a: "Issue the decrees."

 provisional_government.2.t: "The King's Speech"
 provisional_government.2.desc: "The people gathered in the plaza, eager to hear what King Umberto had to say. A short time ago, he had dismissed the fascists from the government, as their incompetence had been laid out for all to see. With the Verona Congress having failed, the people now turned to their king, eager for some path out of the chaos that raged across Italy. King Umberto stepped out onto the balcony overlooking the plaza. As he began his speech, he spoke to the people gathered below in a loud, authoritative voice:\n\n"Today, I wish to speak about the state our once proud nation has fallen into. It has been clear that the PNF's rule has brought Italy nothing but pain, and incompetence. This has never been more clear than in the wake of the recent Verona Congress, which saw them do nothing except tear themselves apart over which fascist ideologue should truly been in charge.\n\nDue to their failures, our country has descended into chaos and anarchy. Extremists of all sorts, both fascist and communist, brawl in the streets. Fascists beat innocent civilians for the crime of having their own thoughts, while communists paralyze our industries with strikes and riots. Neither of these groups deserve a place in Italy.\n\nThe fascist vines that have seeped into our nation must be ripped out, while the communist flames must be beaten back! I pledge to you, the people, as your sovereign monarch. I will bring an end to the chaos. I will restore peace to Italy, and free it from the tyranny of extremists!" With Umberto's speech having concluded, the crowd cheered. It appeared that peace and stability would soon return to Italy."
 provisional_government.2.a: "Long live the King!"

 provisional_government.3.t: "Tending to the Garden"
 provisional_government.3.desc: "Niccolò walked through the royal garden, shaking his head at their state. He hadn't been able to tend to King Umberto's gardens for some time due to a recent surgery, and it showed.\n\nWeeds had sprouted up everywhere, in every last flower bed. They had almost certainly been present for quite some time, as in some flower beds Niccolò could hardly even see the dirt, now completely obscured by a blanket of green. Such an overgrown garden was not fit even for a Duce, let alone a king!\n\nNiccolò fetched the scuffle hoe and set to work. For the sake of the garden, Niccolò wanted to remove as many weeds as he could, and as quickly as possible. The weeds fought back and resisted Niccolò, their roots had been deeply embedded into the soil. However, bit by bit, Niccolò was making progress. Slowly, a pile of discarded weeds accumulated in the pathway, growing with each passing hour. While this was but one flower bed amongst many, Niccolò knew he could get the job done.\n\nEventually, the garden would be pristine, and once again fit for a king."
 provisional_government.3.a: "It's ain't much, but it's honest work."

 provisional_government.4.t: "Family Dinner"
 provisional_government.4.desc: "As Angelo returned from his work in the local party committee, his father had an earful to say as he entered the dining room. "Get rid of that filthy uniform, Angelo. In this household, we are God-fearing Catholics, and nothing else!" The father yelled, as his son was in his Youth League uniform, sporting badges with communist symbols on his pocket strap.\n\n"Religion is the opium of the masses, dad. The masses have realized the shortcomings of these reactionary ideals, and I am one of the many who have realized that. My duty in the Party is none of your concern." The son retorted, placing food on his plate as he sat down, slightly irritated.\n\n"Honey, just let him wear the uniform. He's already late for dinner! He can change after all of this." The mother calmly asked, trying to avoid the incoming conflict.\n\n"Well I do not stand for these unchristian ideas to spread in this household, dear. Our son is being corrupted by this new satanic government. He doesn't even go to church anymore. It's just us there every Sunday, while he's camping with his buddies in God-knows-what indoctrination camp they go to!" The father replied, giving a stern look to his son.\n\n"Dad, I have sworn an oath of allegiance to the Communist Party and to the Youth League! I will dedicate my life to ensure that not only would the people of our village live in peace in the commune, but our family as well!" The son retorted, slamming his fist on the dinner table.\n\n"Shut up, shut up, shut up! You two need to be quiet, or I'll smack both of your heads open with the frying pan!" The mother screamed, raising the kitchen knife at the two before the conflict could boil over. "I expect full silence from this household during dinner, and no talk of politics while you are in this house! This family is built upon respect, and that you must follow!" The mother angrily exclaimed, staring at the two as she drove the knife into the cutting board. "Now let us eat in peace.""
 provisional_government.4.a: "Yes, dear."

 provisional_government.5.t: "Removing the Cancer"
 provisional_government.5.desc: ""Good evening, councilmen and fellow countrymen," Declared King Umberto, addressing the crowd gathered before him, who were sure not to take his news lightly or well. The council chamber felt less like a legislative assembly and more like a courtroom. Each councilman watched with bated breath as the King began his speech, perched above them all on a pedestal. Like prisoners in front of a judge, they awaited their sentence. "I have regretful news for you all, but know that any action made by myself in the coming days is for the future of Italy."\n\n"Italy, a pure and beautiful nation in turmoil that has been put under my care, and that I can not let down lest I fail to pursue the very purpose of my existence as King. Yet I have let her down, letting her be led astray by corrupt establishments that allow her people to die while stuffing their coffers, sully her reputation with their hateful actions, and that bring violence and chaos to her very backyard," Each word was like a pin drop in an empty room, and with every utterance, the tension grew. The last sentence drew especially vicious glares, but only by those who had not already begun to lay back in their seats, resigned to their fate.\n\n"That is why, in order to end corruption and rebuild Italy into something stronger, braver... more peaceful, I must hereby dissolve the Grand Council of Fascism," Immediately there were voices drowning out Umberto's next words, despite the gravity of his position.\n\n"As your king, I demand silence!" He declared, which quieted a majority of the crowd. Others stood up, threw down their papers and left in a huff.\n\n"Thank you. I understand this will be a difficult time for us all, but rest assured that this is simply a sacrifice all of you must make for the Kingdom, and I trust the true patriots among you will make that sacrifice. If not, I have nothing more to say.""
 provisional_government.5.a: ""Good night, gentlemen.""

 provisional_government.6.t: "His Majesty's Government"
 provisional_government.6.desc: "It was done. Parliament was no more. Umberto looked to his remaining ministers, those whom he hadn't dismissed from their ministerial positions along with their parliamentary seats. "Gentlemen," he said to open the meeting, "I won't mince words. While necessary, the dissolution of parliament has left us without a government. The bureaucracy is still functioning for the time being, but we cannot allow this situation to continue. Therefore, our first order of business is the formation of a new government."\n\nOne of the ministers stood, nervously tugging at his mustache. "Your majesty, the normal procedure would be the calling of new elections..."\n\n"Absolutely out of the question! With the fascists and communists ravaging the country, a new election would be irresponsible, if even possible."\n\nThe minister cringed under the king's anger. "Of course, Your Majesty. Which is why we have drafted a proposal for an emergency government'. He slid a stack of papers across the table.\n\nThe king flipped through them. "The Monarchist National Party?"\n\n"Yes Your Majesty. A minor party for the moment, but they share your vision for responsible government. Not would-be Mussolinis, but not overzealous reformers who would open the door to the reds. And their leader, would make an excellent emergency Prime Minister. We can contact them as soon as you give us the word."\n\nUmberto considered for a moment."
 provisional_government.6.a: ""Alright, bring them here. We have government to form.""

 provisional_government.7.t: ""
 provisional_government.7.desc: "placeholder"
 provisional_government.7.a: ""

 provisional_government.8.t: "Restoring Order"
 provisional_government.8.desc: "The cabinet met under portraits that had watched better days. Telegrams from Verona lay beside reports from Turin, Livorno and Naples. What had looked like a single blaze now showed three distinct currents moving through the country and teaching one another how to endure.\n\nThe first current carries old scars. It is made of the prewar clandestine cadres who outlived prisons, of shop-floor militants who still quote Livorno by heart, and of stewards who kept strike funds alive when strikes were illegal. Their committees sit in dockyards, rail hubs and factory belts from Sesto San Giovanni to the Tyrrhenian coast. They know how to shut a junction without advertising it. They can survive a purge and still appear on the line at dawn.\n\nThe second current belongs to the youth and to those who write for a living. The universities have turned assemblies into a regular institution. Professors sign open letters that cross cafés before censors learn the names. Students hold teach-ins at workshop gates and carry the arguments inside. The Intelligenzia gives words to anger and hands those words to people who will not forget them.\n\nThe third current begins in parish halls. Lay organizers from the Istituto Sociale Cristiano and stewards from the ACLI bring bread lists, legal aid and a language the faithful will hear. Franco Rodano and his circle teach that councils need not be godless to be just. Curates do not all agree, yet the doors remain open and the crowds listen from the nave.\n\nThree threats. Three remedies. The government will strike first where the blow can break a spine rather than bruise a limb, and where fear will travel fastest to the others."
 provisional_government.8.a: "The Old Guard current."
 provisional_government.8.b: "The New Left current."
 provisional_government.8.c: "The Catholic Communist current."

 provisional_government.9.t: "Another Target"
 provisional_government.9.desc: ""Our work has already begun to show results. Already, the ranks of leftists plaguing our streets have begun to grow smaller, and soon they will be gone entirely. But, we can always do more. Tolerating the presence of even small groups of subversives will, inevitably, just lead to the collapse of Italy. I trust that you already have devised more plans to deal with any threat?"\n\n"Of course I have. I wouldn't have survived in this line of work for all these years if I was as clueless as you can sometimes be." He paused for a moment to chuckle to himself, before resuming. "Arrests will have to increase, and more groups will have to be cracked down on. Whatever strikes there are will be broken with more force, and we have began to train agents who will infiltrate socialist groups and tear them apart from within."\n\n"It's good to see that you have a plan, at least. But, between you and me, I just don't see how we're going to ever win against the radicals. Have you been out on the streets recently? The people hate us. We may be able to destroy one group, but what is the use of that if two rise in its place?"\n\n"Rubbish! Italy has survived against larger threats than some whiny students. If you think that Europe's second power will collapse to a few angry revolutionaries, then you should take a good, long look at history. Just tell me which group to focus on, and I assure you that in a few months they will be gone.""
 provisional_government.9.a: "The Old Guard."
 provisional_government.9.b: "The New Left."
 provisional_government.9.c: "The Catholic Communists."

 provisional_government.10.t: "A New Threat Appears"
 provisional_government.10.desc: "Niccolò made his way into the garden, having dealt with the weed problem. Today, he believed, would simply be routine maintenance. He'd prune some branches, water the flowers, and-\n\nSomething wasn't right. Italian lords-and-ladies, immediately spotted by their prominent red fruit, were growing all over the garden. They were most prominent among the white flower beds, Niccolò guessed must have missed them before they had started bearing fruit.\n\nWhile The lords-and-ladies were native to Italy, and he had to admit the name was somewhat appropriate for a royal garden, they were not supposed to be there. With what was going on in the country these days, Niccolò refused to allow the King to see that his royal garden was also in chaos, having been invaded by poisonous weeds. Niccolò put on his gloves and got to work, pulling out the red invaders one-by-one."
 provisional_government.10.a: "Niccolò's work it seems had only just begun."
 
 provisional_government.11.t: "Old Guard Surges Ahead"
 provisional_government.11.desc: "While patrols peered into lecture halls and sacristies, the veterans returned to familiar work. In Livorno presses rattled again and unsigned sheets vanished into coat pockets before dawn. In Turin the night shift handed a courier along the line without a word. In Sesto San Giovanni the funds kept through lean years paid for pickets that moved like a company and held like one.\n\nThe Guardie Rosse filled their ranks with men who already knew how to take a street and leave it standing. ELN instructors gathered deserters who arrived in twos and threes with rifles wrapped in blankets. Railway men blocked critical yards with a single wagon and a few friends, then slipped home in the first light. Local prefects sent assurances that order had been restored. Their telephones said otherwise.\n\nThe statistics of arrests looked impressive in a morning brief. The lists of sympathizers grew faster than those numbers could ever shrink them. What had seemed a relic revealed itself as a backbone. The Old Guard was not only alive. It was leading."
 provisional_government.11.a: "They slipped the net."
 ITA_RED_old_guard_surge: "The §eOld Guard§! will §Rrapidly§! gain in power."
 
 provisional_government.12.t: "New Left Surges Ahead"
 provisional_government.12.desc: "The universities did not quiet. They changed their shape. Assemblies that once filled lecture rooms moved into open squares where every voice had to rise over the trams. Students wrote guides that told frightened parents which doors to knock on after an arrest and which to avoid. Professors, playwrights and journalists signed statements that traveled faster than the offices meant to seize them.\n\nAt dawn students poured coffee at plant gates and listened more than they spoke. A machinist explained a gearbox to a room of literature students and then asked them to read a page of Gramsci while he turned the bearing back to life. The chant that began under vaulted ceilings found a cadence that fit the yards. Operai e studenti, uniti nella lotta. The Intelligenzia learned to write for walls, not journals, and the walls learned to answer back.\n\nThe afternoon papers declared calm. The streets measured another truth in footsteps and echo. The New Left did not fade under pressure. It found its pace."
 provisional_government.12.a: "A new rhythm takes hold."
 ITA_RED_new_left_surge: "The §xNew Left§! will §Rrapidly§! gain in power."
 
 provisional_government.13.t: "A Radical Sermon"
 provisional_government.13.desc: ""In the name of the Father, and of the Son, and of the Holy Spirit. As it was in the beginning, and now and ever shall be forever, Amen." The priest began his homily with a small prayer, as the community gathered to listen to his sermon.\n\n"Brothers and sisters in Christ, I believe that today's era here in Italy is a dangerous moment for our nation. The politicians are bickering, the youth are picketing, all of man's semantics clash against each other in our God's holy earth. Such as in the days of ancient Israel, we are seeing an epoch of our times, a division within the people."\n\n"However, Brothers and sisters, is it not that the Lord Jesus Christ, bestowed upon us salvation through his sacrifice at the cross? Our youth today is taking up the cross of sacrifice, with the crown of thorns on their heads. What do I mean by this, brothers and sisters? Our children have fought against politicians who rob us of our future, and continue to do so." A loud cheer was heard from the churchgoers as they listened.\n\n"There remains a Judas in this country, and that is the wretched Caesar Umberto and his followers. And just like Rome of before, the hand of Christ will set alight a fire for all of His believers, freeing this country from the hand of the devil! We have been persecuted before for our freedom, and we will not let it happen again." As the priest finished his sermon, another prayer was offered to the church."
 provisional_government.13.a: "Amen."
 ITA_RED_cathcom_surge: "The §wCatholic Communists§! will §Rrapidly§! gain in power."
 
 provisional_government.14.t: "Remembrance of the Old"
 provisional_government.14.desc: "Umberto's unseating of Ciano was a lucky break for so-called 'subversive elements.' No longer did the fear of the OVRA loom over them. The time to truly labor the feeling of the workers was here, surely. Surely. Not all listeners to the intensified and secretive broadcast were sympathetic audiences. In a small room, a gnarly finger flicked on one raido. And another. And another. Soon each drowned the other out.\n\n"The party must grow stronger! We see the death throngs of the old social-aristocratic chauvinist order. A monarchy with no popular support. No teeth. This was the case in Russia, 1917. This was the case in Italy, 1920. The King and his cronies demand our gratitude now they have called off the Fascist dogs. We will instead respond to the weakening of the reactionary forces with the sharpened teeth of the working man."\n\n"Let us fight! We are revolutionists and anarchists, and we aim at the destruction of existing social and political order. All that is good in the world has been obtained against laws, has been squeezed out by force. Rebellion, then, against laws is the first condition for each step of progress. Human civilization is but the result of great social crimes."\n\n"The juxtaposition of Catholicism and Communism is a false one! With revolution, we can make the necessary transition from movement to party. With this structure, we will be able to put into political practice the Christian postulates of charity, freedom, and charity, in which all categories of Christian workers could enjoy a new life. One inspired by democracy and progress."\n\nThe gnarly finger turned them all off, one by one, gutting the storm of words. Giovanni de Lorenzo was left with silence, and a smile on his lips."
 provisional_government.14.a: "I can hear you."
 
 provisional_government.15.t: "He Who Wins"
 provisional_government.15.desc: "There were many things that had proudly bore the name Giovanni. From the opera Don Giovanni to Giovanni di Lorenzo de' Medici, before his ascension to Pope Leo X, the cultured Giovanni De Lorenzo knew them all. He certainly would not go down in history as the most remembered Giovanni, but, as his lip curled in satisfaction, the counter-intelligence man reasoned that might be a good thing.\n\n"I-i'm so grateful." A weak voice came over the radio to De Lorenzo. "I mean... we, all of us. Very grateful. We can return to our families now, once the trucks arrive here. Um... why did you release us? And why here?\n\n"Oh... Lipari. Think nothing of it. It was simply born of compassion." Lipari flinched a bit, as he could have sworn he heard someone move in the trees. "Pure, unfettered, compassion. I am no Fascist dog, totally unempathetic to the dreadful time you must have had in that political prisoner camp. No, in his Majesty's Italy, everyone has their part to play. Oh, and the trucks have already arrived at their destination. Do you hear that approach yet, my astute friend?"\n\n"Who is out there?" Lipari made towards the trees. "Everyone, we must get away! Those are not trucks!"\n\n"No! I expect that will be the Partisans. This place you and your people were dropped is the area of greatest partisan activity after all. The stark opposite of me, you know. Totally unmoved by compassion, they sensed the weak and helpless, and made a beeline for you. But hold your ground my little fellow, show them your bravest face, and stay put. If you stay put, the artillery from my trucks, situated a while away, will get a better shot."\n\n"Will-will that help us?""
 provisional_government.15.a: ""No. Not really.""
 
 provisional_government.16.t: "The Chivalrous"
 provisional_government.16.desc: ""You have no military value," the Partisan leader heard the old squat Captain speak sternly, before he marched away with the majority of his men. Through the dust of the Lybian desert, she could see the remaining Royalist soldiers men encircle them, raising their guns. She grimaced in the face of them leering at the Partisans, with gleeful, smug smiles.\n\n"You'll let us go then?" One of the younger men got a sparkly look in his eyes that made the Partisan leader grimmace even more.\n\n"He said we're of no military value. Probobly knows Partisan cells aren't told everything. He won't bother interrogating us, so we'll be shot."\n\n"Correct." Uttered one of the Royalists. The shout of a rifle came, but it was the man who spoke who fell, the back of his neck exploding as the rest of the reactionaries tried to respond to this mysterious attacker. The partisans ran, grabbing whatever weapons they could in the confusion, and running. The leader saw her comrades on the hill, who she'd assumed had died, ambushing the Savoyists. Watching them fight was like nothing else. Then, she saw them fall. Her futile run ground to a stop, and she turned along with the remaining members of her cell, to see the Captain and his troops on the ridge.\n\n"This-this dosnt seem very sporting, Captain. I thought you liked a fair, chivalrous fight. Thats what your Monarchists always bang on about."\n\n"You question my honour? Well then, Bolseheviks, you may take the first shot."\n\n"My pleasure." Grinned one of the Partisans. A mound of lead soured towards the Captain... and missed."
 provisional_government.16.a: "Our turn."
 
 # misc flavor
 
 provisional_government.17.t: "Sins of the Father"
 provisional_government.17.desc: "You could tell a lot from the way people walked, thought Umberto II, King of Italy. Usually, people stopped to talk, and took their time. In recent days, within the Royal Court, everyone was in a rush. In the days since Verona.\n\nFrom a balcony on the Quirinal, he could see the fiery embers of the sun dip below the horizon, the ornate gleam of his palace fading as it went. It was ending, the day was gone. Curiously, that felt sadder than it usually did.\n\nPerhaps, he reckoned, it was the name on his lips and the memory stuck in clouds of thought that bothered him. Victor Emmanuel III, the soldier King, the diarch of Mussolini, Emperor of Ethiopia, King of Albania, Savoy Emperor of the Italian Empire. His father. Umberto loved him for the son he crafted, but could not help but loathe the iron links he burdened Umberto with. Links took up by Fascism, who had made him dance like a puppet for too many years.\n\nIf only he could have protected his father in life, the weak, shy, short man he was. Afraid of exerting too much personal prerogative, of being seen to take a side. Until he did, until he allowed the majesty of his own dynasty to be usurped by Mussolini and his rabble. Umberto was not his father, and he knew those very Fascist laws of censorship and control were his own, by the Albertine Statute and by the grace of god. Verona was just the beginning, true action would be taken to remind Italy it was the Crown that bound Italy together, the Crown that won the Risorgimento, the Crown who could make and unmake ministers, and the Crown that would reign with or without the consent of deranged "representatives".\n\nA son should have a home of his own making. A son should not dance to death's tune."
 provisional_government.17.a: "Sins of the son."

 provisional_government.18.t: "Service to the Crown"
 provisional_government.18.desc: "Carabinieri Officer Bava felt a scornful smile coming to him. Ever since the outcome of Verona, Fascists of every creed who had just been snapping at each other had been spending their days not with their families, but hooting like children through the street. Monkeys whining and throwing shit at that very vanguard of order who they would expect to protect them. Fools. He was glad to be rid of them.\n\nA decree had come down from the Commander-in-chief for a unit of the Italian Army to enter the city. The news had the whole Carabinieri Station relieved. From the station, their shelter from the barely Italian animals outside, they could hear a thing of beauty. The cold crack of rifles, the thunder of cavalry charges, and the thrum of armored cars accompanying them. Those insolent voices, spurning law in favor of their Nazi paymasters and disruptive social revolution, transformed into screams and howls. The army brought Bava well-deserved silence.\n\nThe Carabinieri still had a role to play, however. As they marched out into the street, he saw seven staggering down, clearly trying to escape justice. Half of them were young and in black shirts, most were bloodied, and one older man was supported by two others. As the police marched over, that number became six as a woman keeled over.\n\n"Please, please we-we need help-" Bava laughed, and cut off the youth's pathetic mewling. He had been supporting the older man, so the blow caused both to fall. Bava ignored the blood trickling out of the man's head as his colleagues rushed forward to seize the other distressed or half-conscious hostiles. He was probably a problematic journalist anyways.\n\nGrabbing the hair of the youth on the ground, and wrenching him up, Bava sneered. "What's wrong? Ready to stop stealing our jobs, Blackshirt scum?""
 provisional_government.18.a: "Service towards civilization."

 provisional_government.19.t: "Thirty Days of Verona"
 provisional_government.19.desc: "For a month the city has lived on the edge of its breath. In the first week there were chants and stones, in the second there were fires at the tram depots, by the third the marches found routes the police could not predict. Patrols turn a corner to see one banner vanish and another rise two streets away. The prefect signs curfews with a hand that no longer shakes, then hears the whistles answered by pans from a hundred balconies. The Palace promises calm. The cobbles reply with the sound of feet that refuse to go home.\n\nEach morning begins with ledgers and lists. Arrests that do not match the photographs. Names that appear again in new quarters. A boy who was seen at a lecture carries stretchers at a barricade. A woman who queued for milk yesterday passes leaflets out of a coat that still smells of flour. The city has learned to divide and meet again before the sirens reach the second square.\n\nThirty days have given everyone new habits. The police sleep in boots. The nurses keep a bucket by the door. The printers learn to set type by touch with the lights out. The government calls this disorder. The neighborhoods call it a way to live until the next announcement."
 provisional_government.19.a: "Another night, another circuit."

 provisional_government.20.t: "The Fever Spreads"
 provisional_government.20.desc: "The red pins on the prefect’s map creep outward. Padua and Brescia report marches that turn into sit-downs before noon. Ferrara sends a cable about a police station with broken windows and a line of mothers who refuse to leave without their sons. In Trieste a dock foreman writes that cranes now pause for ten minutes on the hour and that the pause has become a signal learned by heart.\n\nWhen asked what the people want, the honest answer is simple. They want to be heard without being beaten. They want food that arrives when the shelves are empty. They want their children to grow without memorizing the faces of men in helmets. Every other demand is a list that grows by the day and has room for anyone who can read or listen.\n\nOrders go out to reinforce the districts. The reinforcements send back requests for boots, for bandages, for radios that keep their tune. Anything that makes a promise has begun to sound thin."
 provisional_government.20.a: "Reinforce the districts."

 provisional_government.21.t: "Old Friends Return"
 provisional_government.21.desc: "The night trains carry more than passengers. In Turin a man arrives with a coat that hides a second lining and a memory for doors that still open. In Genoa a woman steps off a bus, kisses the driver twice, and vanishes into a crowd that knows her by another name. In Bologna a landlord swears a room is empty while a printer in the cellar oils a press that once ran poetry and will soon run something else.\n\nThe old networks did not die. They went quiet. The couriers who learned to walk without leaving footprints have returned to walk their routes again. The MCdI teaches young stewards how to keep ledgers that survive a raid. The left communists bring pamphlets that are not the same as last winter’s and speak to men who do not like parties.\n\nThe prefects say they are watching the stations. The trains have many doors. The city begins to breathe in a different rhythm, as if it remembers another song and has started to hum."
 provisional_government.21.a: "Note the names and faces."

 provisional_government.22.t: "The Weariness of Order"
 provisional_government.22.desc: "Before daylight the squad sits with coffee and a silence none of them can break. Some will not say the word fear. Some say it softly and stare at the floor. Hinges are greased and truncheons wiped clean while men tell jokes no one laughs at. At roll call the officer reads the same lines about duty and the city’s dignity. He has read them for three weeks. The squad knows the streets better than it knows the manual now, and half of them would leave their uniform on the peg if habit did not guide their hands.\n\nThey walk out anyway. A boy nods to his mother and pulls on a scarf that does not show blood. A sergeant pockets a rosary and pretends his fingers are counting coins. The city will wake whether the orders arrive or not. The day’s work will be the same as the last. The only question is how loudly it will be done."
 provisional_government.22.a: "Out we go again."

 provisional_government.23.t: "The New Wave"
 provisional_government.23.desc: "Bava surveyed the remnants of his latest battleground. Blackshirts stained with red, the once fierce and young crying out for mamma, a priest giving last rites to a soul seeking comfort before he passes off this mortal coil. The Carabinieri man found relief in seeing how these lions turned into lambs, perhaps these punks have finally learned the natural order. This relief was short as he looked to the horizon.\n\nThe red flag.\n\nA tight block slowly marched in their direction, jeers and taunts could be heard as they marched toward his position. Bava grimaced, these were not children throwing a tantrum in reaction to then throwing the toys out of their pram, these were bloodthirsty Bolsheviks who watched the chaos unfolding with daggers in hand, eyeing their moment to strike since 1922.\n\n"Men!" Bava mustered a call to action from within him. "Towards me, do not give these communists an inch, they will not show mercy and we will not either." The ragged men lined up to face the next battle, burying their fears deep inside to not let any sign of weakness shine through their cracks.\n\nBatons clashed against flesh yet they kept going, a united front full of fervor which was unlike the fractured alliance of fascists they had seen before. The Carabinieri fought them back but it felt like a pyrrhic victory, the reds fled to regroup while they were left exhausted and weak, praying for a salvation that looked increasingly distant each day.\n\nBava knew this situation was untenable, patrolling the streets seemed almost impossible now, they could only return to the station and endure this storm..."
 provisional_government.23.a: "...but for how long?"

 provisional_government.24.t: "The Solitude of the Crown"
 provisional_government.24.desc: "Papers crowd the desk until the blotter vanishes. Reports from the colonies speak of shortages and men who curse the shipping forecasts. Envoys write about embers on the sea and partners who talk of guarantees while counting their own ships. Verona eats paper faster than it eats men. The Prime Minister drafts a note that reads like an answer and discovers that it only proves that order still exists somewhere in the language.\n\nNo one has saved Italy for half a century. The lesson repeats itself in a room that has remembered better hands. A sovereign who will not act teaches another to act in his place. He signs where the secretary taps, then pauses to ask when it became impossible to tell the difference between a plan and a judgment.\n\nThe ink dries. The messenger bows. The door closes. The city outside does not notice that anything has changed."
 provisional_government.24.a: "Approve the measures."

 provisional_government.25.t: "Antonio"
 provisional_government.25.desc: "Above a baker’s shop a child is born into a city that refuses to sleep. The mother laughs when he tries to swallow the air. The father writes the name with a stub of pencil and cannot stop at one word. Antonio. He says it again and thinks of books that taught him what a man owes to strangers.\n\nThe windows shake with a distant chant, then fall quiet. The parents promise, without speaking, to take turns at the meetings. One will always be home when the knocking starts. They count the coins in their pockets and the hours until dawn. The future fits inside a wool blanket tonight and dreams with a fist against his mouth.\n\nThe baker downstairs will give them milk in the morning and pretend not to notice the pamphlets peeking from a coat. Verona learns to share silence with its children and to speak only when it must."
 provisional_government.25.a: "Welcome to the world."

 provisional_government.26.t: "Sparks to a Powderkeg"
 provisional_government.26.desc: "The Carabinieri stood guard on the tarmac outside the police station in the faces of communist rioters and a boiling hot sun. Sweat poured down Bava's forehead, he felt like an egg on a frying pan cooking in this heat. The sweat slowly dripped past his eyebrows onto his rifle, he was far too tense to wipe it away as his eyes kept forward like a statue.\n\nThese jackals were watching him like they were prey. Calls and screams roared from the crown to cajole them to attack, so these filthy apes would have an excuse. Bava had restraint, but he was worried that his men did not share his discipline.\n\nFingers stroke the triggers of rifles, hands trembled and some looked like they were on nervous footing. Their faces told a different story, some of the broken contorted looks either begged the rioters to stay still and not do anything or seemed like they were pleading for mercy for what might happen next. Others looked on with dead eyes, a resigned surrender to inevitable bloodshed, some seemed like they would welcome it with open arms.\n\n"Fascist dogs, your time will come as theirs did!" The jeer caught Bava off guard, he was only fighting fascists weeks ago, the blackshirts were gone long ago and he was still here. No point in paying attention to Bolshevik rantings, they would not get their opportunity to turn Italy into a wasteland.\n\nBava watched a rock make its way from the crowd, colliding with an officer's head. In reaction, a volley of panicked gunfire emerges as the desperate squeeze onto their triggers like rosary beads. The young, old and bold come right back at them with retribution, fighting with whatever they had their hands on.\n\nAny chance of reconciliation died that day as an invisible point of no return was crossed."
 provisional_government.26.a: "Just keep firing!"

 provisional_government.27.t: "Blood on the Stones"
 provisional_government.27.desc: "The wire moves the headline before breakfast. Hundreds dead in Verona after a day of charges and answered fire. The ministry will not give numbers. The prefect refuses to appear at the steps. Photographs show bodies under sheets and boots in lines that no longer move.\n\nBy afternoon the streets are full again. Rifles appear as if they had always been there. Committee notices call for defense and say plainly what will be done to the buildings that hold prisoners if the arrests do not stop. The words travel from corner to corner faster than any patrol car can drive.\n\nThe Palace insists the Republic is not at war with its people. The people behave as if they have heard a different sentence. The next march forms without a drum. Those who have not yet chosen decide that the choice has been made for them."
 provisional_government.27.a: "Censor and condemn."

 provisional_government.28.t: "The Station Falls"
 provisional_government.28.desc: "It begins with music and careful steps, with banners that look like laundry on a spring day. By noon the crowd has a purpose and a direction. A scaffold plank becomes a ram. The doors of the station forget that they are doors and become wood to burn. Ledgers come out one by one into the light, and the hall answers with a sound like a choir.\n\nFor a minute everyone believes the hour will end with cheers and shoulders on shoulders. The first armored car turns the corner at dusk and shows how long an hour can be. Those who can run do. Those who cannot stay to carry or to stand. Smoke teaches patience. The timetable boards flutter in a wind that is not a wind.\n\nIn the evening the newspapers print a photograph of a clock that no longer keeps time. The caption says the city is returning to normal. The next edition will say the same thing."
 provisional_government.28.a: "Call in the army."

 provisional_government.29.t: "Between Cradle and Cause"
 provisional_government.29.desc: "On the third floor a couple argues in whispers because the child sleeps at last. The press crew needs another run by midnight. The meeting at the gate needs a face that people trust. The money on the table will not cover both the baker and the coal. They joke, without smiling, about sending the child to collect donations with a tin cup.\n\nIn the end they choose the smaller risk. One stays home with the crib and the soup. The other takes the leaflets and the list of names that must be read aloud without trembling. They kiss the boy’s forehead and make the promise every city forces on parents in times like these. Tomorrow they will go together. Tomorrow the streets will make room for three.\n\nDownstairs the baker pretends to count change twice so no one will notice who pays and who does not. The neighborhood understands that love and politics are part of the same conversation now."
 provisional_government.29.a: "Do what you can, tonight."

 provisional_government.30.t: "The Crumbling Battlements"
 provisional_government.30.desc: "Another man didn't show up for patrol today, Bava didn't know if he was killed in the night or decided to flee for less red pastures. He couldn't blame him; his wife kept pleading with him to quit or leave, but she didn't understand how far he was in. It was his duty to stay, to not just the King, but also his men. They would not be left to drown beneath the waves.\n\n"Officer Bava, I see you are missing one of your men." Sergeant Fazio from the Royal Italian Army greeted him, he disliked having to serve as an aide to the military man but Fazio and his troops were invaluable in these past months. "I certainly hope he has not decided to desert-"\n\n"I know the man in question well, I am sure he has a good reason for not turning up." A cool silence formed between the two before it was broken by approaching communist militants, followed by gunfire.\n\nThe window of dialogue remained tightly shut, Bava watched and heard so many tales of attempts at peace failing before, violence seems to be the only language they understand. They moved swiftly in the name of order, smothering resistance under a blanket of bullets. Bava was very familiar with the Army's methods when it came to putting down these but it perturbed him to see his own men adopt them.\n\nNot everyone was able to cope with this. One of his Carabinieri men came out of a red mist to see the bodies of two students, dead at his hand with his rifle; they could have been his kids in another life. He stared at the gun in horror before pushing it into Fazio's hands, walking away in a haze while deliriously repeating a mantra as his world collapsed."
 provisional_government.30.a: ""I'm cracking, I'm cracking...""

 provisional_government.31.t: "Italy in Fragments"
 provisional_government.31.desc: "In the hills beyond Parma a farmer writes the names of his neighbors on the church door and draws a line through two of them. In a tenement in Naples old women sort rumors by smell and memory. In Trieste dockers find a foreman dead in an alley and say nothing when the police arrive.\n\nThe newspapers declare the King is in control. The pamphlets insist the King has fled. The truth shifts like a cloud shadow. What does not shift is the work. The committees keep their minutes even when they meet in stairwells. The patrols polish their boots even when they know the route by heart. Every street counts the days until something gives and tries not to guess what will be taken in exchange.\n\nThe telegraph taps and stops. The radios hum. Each city sounds like a different instrument. None of them plays alone."
 provisional_government.31.a: "Hold the line."

 provisional_government.32.t: "Soup and Silence"
 provisional_government.32.desc: "Rain slicks the street outside a parish hall where the line for soup moves with dignity. The banner on the wall reads that the people feed the people, nothing more. The men behind the vats speak softly and ask for names when they can. The children do not wait for permission. A clerk from a committee keeps a ledger with neat columns for beans, flour and bowls served. A priest stands at the door and blesses nobody, then everyone.\n\nThe prefect walks past with his collar up and pretends not to see. He knows that closing this kitchen would take more men than he has. The city will remember who fed it when the counting starts. The people in the line will remember who looked away.\n\nSomeone adds a second table. Someone else brings a crate of apples wrapped in newspaper. In the ledger a new column appears for promises kept."
 provisional_government.32.a: "Let them eat, for now."

 provisional_government.33.t: "Letters to Posterity"
 provisional_government.33.desc: "Another morning, another decree, another set of funerals that smell of candle wax and damp stone. In his diary the King writes that a father does not give in to a child who screams for sweets and wonders when the nation forgot how to be quiet. He underlines a sentence about order, scratches it out, writes it again, leaves it there.\n\nThere will be no elections in a city that tears up its own streets. There will be no compromise with men who refuse to salute. The pen pauses. Then moves. The ink knows which side of the page it belongs to.\n\nThe diary will be read one day by people who never stood a curfew. They will admire the handwriting. They will argue about the meaning of words that did not feed anyone or let anyone sleep."
 provisional_government.33.a: "Stay the course."

 provisional_government.34.t: "The Old Banner Unfurled"
 provisional_government.34.desc: "At the edge of curfew a man with a neat haircut and a portable radio tells a crowd that the past was better because it did not argue with itself. He gives them names to remember and enemies to hate. A few who listened to their fathers’ stories nod as if the years between had been a bad dream. Some old soldiers say they never put their uniforms away. Pamphlets promise a return to a time when Italy was feared and loved in the same breath, and not asked for receipts.\n\nQuestions about bread and coal are set aside. Questions about marches and punishments are welcomed. The recruiter smiles and speaks of a movement that will restore dignity by putting people back into files. Someone counts heads. Someone else counts fists. Someone with a scarred hand does not bother to count at all.\n\nReports use the old words with new care. Cells, cadres, committees. The city learns how quickly yesterday can be taught to walk into tomorrow."
 provisional_government.34.a: "Watch the recruiters."

 provisional_government.35.t: "The Quiet That Follows"
 provisional_government.35.desc: "Verona sleeps at last. Curfew whistles blow and are obeyed. The army keeps to the long avenues and avoids the lanes that still remember names. Shops open for an hour and close again without argument. At the station an officer writes that the city is returning to normal and dares to believe it. He lets himself smile and does not scold the constables for doing the same.\n\nIt feels like a safe harbor after a long crossing. The map on the wall shows no new fires. The ash underfoot is still warm. Telegrams arrive with fewer names written in red pencil. The minister circles a date for a visit and imagines applause that does not sound like relief.\n\nIn the mess tents there is soup without hurry. In the hospitals there is quiet that does not need morphine. In the Palace there is a line in a schedule that reads Verona, remarks and greetings. The page turns by itself." 
 provisional_government.35.a: "Schedule a royal visit."

 provisional_government.36.t: "The Garden and the Gun"
 provisional_government.36.desc: "The schedule calls for a speech in Verona. The King reads his notes and practices a sentence about firmness without cruelty, reform without shame, and a party that will carry the nation until it is ready to forgive itself. In the palace garden red arum has climbed where it is not wanted and refuses to be pulled. He makes a note to dismiss the gardener and returns to the draft with a steadier hand.\n\nOn a stair in a vanishing street, a nameless man checks the weight of a pistol and counts the seconds between footsteps. He has waited through curfew and sirens and a morning that would not end. He has a clear view and a simple idea of mercy. In his pocket is a prayer someone else wrote on scrap paper. He has read it so often the fibers show through like thread.\n\nThe day takes a breath and moves toward the hour when two men will learn how much can change between one heartbeat and the next. The Palace believes the afternoon will be a beginning. The city has learned that beginnings and endings can look the same from a certain distance."
 provisional_government.36.a: "To Verona."

 ITA_RED_twilight.1.t: "A Front Takes Shape"
 ITA_RED_twilight.1.desc: "The meetings began with bad coffee and good lists. Couriers from Liguria compared notes with dock stewards from Ancona and Ravenna. Factory committees from Emilia sent delegates who could rattle off how many lathes still turned and which foremen winked at night shifts that ended early. All of them carried rumors about Verona and the quarrel at the top of the state.\n\nWhat had been scattered circles chose a single name. The Fronte Rivoluzionario Popolare Italiano would be a banner large enough for veterans of the old cells and for students who learned politics from pamphlets and arrests. Coastal fishermen landed canvas sacks at dusk that did not hold fish. The Guardie Rosse logged the crates and moved them to old caches in the Apennines. Friendly officers in outlying garrisons hinted that the Esercito di Liberazione Nazionale could count on quiet doors and a few keys when the time came. The routes worked. The hands did not shake. If Verona fell into silence, the Front would not." 
 ITA_RED_twilight.1.a: "The Front begins to breathe."

 ITA_RED_twilight.2.t: "The Lecture Halls Stir"
 ITA_RED_twilight.2.desc: "After Malta the murmur on campus turned into a rhythm that even non-students could hear. Assemblies met in lecture rooms that smelled of chalk and oil. Engineering cohorts asked for elected student councils, for free associations, and for an end to patrols that stood at the gates as if the university were a barracks. Bologna’s Lettere students called for amnesty for last year’s detainees. Turin and Pisa answered with their own committees that kept minutes as carefully as any ministry.\n\nWriters and teachers signed open letters that moved from café to café before the censors could seize them. Priests watched from doorways and sometimes lifted a hand in blessing as the marches crossed their parish lines. The regime called it agitation. The students called it a beginning. The Intelligenzia, as the revolutionaries named that world of pens and classrooms, had started to choose a side." 
 ITA_RED_twilight.2.a: "The lecture halls hum."

 ITA_RED_twilight.3.t: "Rodano Among the Faithful"
 ITA_RED_twilight.3.desc: "In a parish hall lit by a single stuttering bulb, Franco Rodano listened to men and women who knew the rosary better than any party line. Organizers from the Istituto Sociale Cristiano arrived with pocket notebooks from factory visits. ACLI stewards came straight from the evening shift. They spoke about evictions, about arrests after leaflets, and about sons who left for meetings and returned with bruises. No one wanted to hear a sermon.\n\nRodano did not give one. He asked about price of bread and the landlord’s share. He argued that a republic of councils could be just without being hostile to God. A Christian could stand with a worker without betrayal. The old men at the table did not all agree, yet the door stayed open. The catechist offered the cellar for the next meeting. A curate wrote a phone number on a scrap of paper and pressed it into a calloused hand. In the sacristy, an idea took shape that the Church and the people might walk together for a time." 
 ITA_RED_twilight.3.a: "Whispers in the sacristy."

 ITA_RED_twilight.4.t: "From Campus to Street"
 ITA_RED_twilight.4.desc: "The proclamation from Rome promised order. The streets heard it and filled. Students climbed statues to be seen by the crowds under the porticoes. Police lines advanced with visors down and batons steady. A philosophy student held his ground until a rifle butt found his shoulder. Medics posted lists of detainees and hospitals on lampposts; names blurred where the rain ran. By dusk the marches returned with workers at their flanks. Saints on hand-painted cloth moved beside banners that carried nothing but words for bread and wages.\n\nWhat had been contained within faculties became the city’s business. The Guardie Rosse kept order at the edges so that mothers could bring water and men from the night shift could find their sons. The prefecture told the newspapers that calm had been restored. The city replied at sunrise." 
 ITA_RED_twilight.4.a: "The youth take the streets."

 ITA_RED_twilight.5.t: "The FRPI’s First Manifesto"
 ITA_RED_twilight.5.desc: "Mimeographs clattered before dawn from Milan to Bari. By noon a four-page sheet lay under café saucers and inside church bulletins. The Fronte Rivoluzionario Popolare Italiano asked for elected factory councils that the courts could not dissolve. It demanded protection for workplace committees and the closing of special tribunals that had existed to punish the poor. It promised land to those who tilled it and credit to cooperatives that could keep villages alive through the next harvest. It named profiteers who had grown rich while Atlantropa throttled ports and drained hope.\n\nThe final paragraph people read twice. It called for unity between those who prayed and those who did not; between veterans of the old movement and students who knew the word “Partisan” from stories. It did not flatter. It insisted. Scribes at parish desks filed copies beside baptism records. In the factories the sheet passed from hand to hand with the care given to a tool that must not be dropped." 
 ITA_RED_twilight.5.a: "The Old Guard speaks."

 ITA_RED_twilight.6.t: "Students and Workers Together"
 ITA_RED_twilight.6.desc: "The line between campus and shop floor blurred until no one could mark it. In Turin, students served coffee at the gate and learned which foremen kept the keys in their coat. In Bologna, law students wrote guides on how to face interrogation and told frightened parents how to find their children in custody. Literature students ran teach-ins in occupied lecture halls where a machinist explained the mill’s teeth and a historian read from Gramsci’s notebooks. A chant took hold that even the police began to hear in their sleep: Operai e studenti, uniti nella lotta.\n\nCommittees of solidarity appeared with the speed of rumor. Some met once and vanished. Others kept ledgers, collected dues, and sent couriers south to teach farmhands how to form leagues that would outlast the next harvest. The government called it conspiracy. The people who were there called it learning to win." 
 ITA_RED_twilight.6.a: "The new left gathers strength."
 
 ITA_RED_twilight.7.t: "A Quiet Homecoming"
 ITA_RED_twilight.7.desc: "The fishing boat arrived at the  little dock on the Romagna coast at sunset. After docking two men disembarked, fishermen by the look of their clothes. But these were no fishermen.\n\nLuigi Longo and Pietro Secchia had not been home in a long time. They stood still for a while, both breathing in the familiar air they had not tasted in over twenty years. Pietro turned to Luigi, and broke the silence. “You remember our arrangements for transportation to the Apennines, right?” Luigi simply nodded, still enthralled by the feeling of home. After a long moment he spoke. “It will be good to have the Central Committee finally meeting at home again. No more exile.”\n\nPietro shook his head. “You're awfully optimistic.”\n\n”Because of my will, my friend.” Pietro chuckled at that. “And besides,” Luigi continued, “you know what's been happening. This is the best chance we've had since the war. We will seize it, we have to.”\n\n”Yes,” Pietro said, “we do.”\n\nThe two old friends nodded to each other, and made their way off the dock, and into the dusk."
 ITA_RED_twilight.7.a: "There's nothing like coming home."
 
 ITA_RED_twilight.8.t: "Lessons in Order"
 ITA_RED_twilight.8.desc: "The circular went out at midnight. Rectors were told to cooperate with arrests. Deans made lists in quiet offices and locked them in drawers. Before dawn, Carabinieri moved down corridors that smelled of chalk and dust. Doors splintered. A press fell silent with a single hard kick. On the steps of a faculty of letters, a young woman shouted that she was not afraid. Truncheons answered. Her friends carried her away.\n\nThe morning papers announced the restoration of calm. Lecture halls reopened with fresh rules in tidy frames. On the back of one rule sheet, someone taped the manifesto torn in half and wrote three words in ink that ran in the rain: We remember. In some cities the movement disappeared from sight. In others it learned to move where the light did not reach. The Guardie Rosse and the ELN took note and waited for orders that would come soon enough." 
 ITA_RED_twilight.8.a: "Order must be maintained."
 
