ig_war_flavor.11.t: "The Two Eagles"
ig_war_flavor.11.desc: "Once there were two birds of the same flock. One was young and idiosyncratic, a young flame that promises to bring new fervor. The other was tired, well-traveled, and scarred by war. In spite of their differences,  they were still both Fascist eagles: Both golden birds perched upon the Fasces of power. Together, they holed up in Central Italy while they waited for more advantageous circumstances. Then, the German invasion came.\n\n"Farinacci?" Pino Romualdi frowned, The younger eagle had always been... sympathetic to those north of the Alps. But this was too much for the old bird, for his younger friend to choose the blood-soaked Swastika over the Fasces. " You would fight in his name? He wishes he was born a German. The banner he raises is barely one of Fascism. I'm surprised any Italian soldiers have mustered to fight for him. Communist revolution, barbarians passing the Alps, it's a scene out of hell. If I were any lesser soldier, this would paralyze me. Would you throw open the gates to the Barbarians, or come and keep the flame alive in the South, with me?\n\n"You would flee to the South?" Pino Rauti scoffed. "You are paralyzed then, stuck in the past, Pino. We are fighting for a new Fascism. The creed you fought for petered out, proving Mussolini didn't go far enough. We can't escape to the north, but we can make a stand here. Farinacci gives us a way to spread the truth of Italy's Germanic status. Our place is fighting alongside our German brothers against this Judeo-Bolshevik-Modernist revolt. So when they come south, we'll be heroes of the new regime" The young bird's eyes widened as Romualdi turned to leave. "What are you doing?"\n\n"Doing what I should have done a long time ago: Leaving you! Leaving you, leaving that fickle Almirante, that sniveling de Marzio. None of you are true soldiers! Antonio Tripodi and Giovanni Roberti march south, with me!""
ig_war_flavor.11.a: "A divided crookery."
ig_war_flavor.12.t: "Bishop Of Fear"
ig_war_flavor.12.desc: "It was another bit of late-night guard duty in the light industrial centre of Pisa. With a clang, one of the two revolutionary sentries opened a hatch to look through the makeshift metal gate, separating the homes of the workers from an uncertain outside. The man squinted, for, instead of sporadic movement, he could have sworn he saw two shapes move forward with something, hoist it up, and then run away. Then he began to hear something.\n\n"Something's out there. I saw a shadow move and, wait, can you hear that?" The sound was definitely screaming, he decided, but that could mean anything. Without a beat, that sentiment left him. The sentry froze.\n\n"It's just a shadow, man." The other laughed, sitting up and walking over to look through the hatch as well. "And those screams? Could be a problem, but not for any of-wait, what are you doing? Stop!" The other sentry had lurched forward, desperately opening the gate. He had to get out. He had to help him. The object hoisted up was no mere object. It was a series of wooden planks, arranged in a cross, with a man attached to it. The screams of a man crucified. A nightmare from hell. The nightmare did not end there.\n\nA figure stepped out of the shadows, past the now open gates, brandishing a pistol. The sentry, crazed by grief, fell first, followed by the second who desperately, and futilely, scrambled for their weapon. The shadow's head rose, basking in victory and the illuminance of the moon, from the darkness scurried his young acolytes. Dressed in scraps and whatever intimidating items they could come across, they stood behind him. Waiting for Pino Rauti's order.\n\n"Today, we perform a cull. Kill whoever stands in your way. For today, we right the wrongs of Modernism, and put these workers back in their place!""
ig_war_flavor.12.a: "Men shall become Helots."
ig_war_flavor.13.t: "From Shade Into Oblivion"
ig_war_flavor.13.desc: "As soon as the soldiers of The New Order had risen into that spiritual spotlight, the scheming, feminine, materialism-worshipping forces had smacked it down. Cursing from the wound in his leg and the crimson blood streaming out, Pino Rauti righted himself. His fingernails dug into the wooden wall, and his eyes bulged. The Evolan was cornered in this burning building, overlooking a street far below, but he saw a way out. Towards survival or a noble fighting death, it did not matter. Rauti looked down at the sigil of The New Order, torn from his shirt. The masculine, spiritualist, transcendent battleax, in a world of darkness. The wielder could be struck down, but not the idea.\n\nAs soon as the soldiers of The New Order had risen into that spiritual spotlight, the scheming, feminine, materialism-worshipping forces had smacked it down. Cursing from the wound in his leg and the crimson blood streaming out, Pino Rauti righted himself. His fingernails dug into the wooden wall, and his eyes bulged. The Evolan was cornered in this burning building, overlooking a street far below, but he saw a way out. Towards survival or a noble fighting death, it did not matter. Rauti looked down at the sigil of The New Order, torn from his shirt. The masculine, spiritualist, transcendent battleax, in a world of darkness. The wielder could be struck down, but not the idea.\n\nRauti's stride forward ended abruptly. A force collided with his chest, and he flew backward, out of the torn-off wall overlooking the cavernous drop. Pino howled like a beast, wrestling and screaming, clawing at whatever had taken him. One of his assailants, also trapped in the burning building, had seen Rauti's escape, and made a choice. The terrorist had never felt such terror, such helplessness as he flew to certain death, each second an excruiating affair. Finally, he pulled up the head of the man so stubbornly gripping onto him.\n\n"Do you have any idea what you've done! No! No! We'll both die you fool! Let me go!"\n\nThe man just smiled back.\n\nThe following morning, a small child was recovered from the rubble caused by a night of firefights, explosions, and fire raging on. Protected from the cold by a blanket, and sitting across from the men fighting the embers of last night's fire, he spotted something. A mute gleam. His hand found it, and blowing the dust off revealed its true nature. Glasses, half of it rendered totally unrecognizable by the drop."
ig_war_flavor.13.a: "Free from poison of the mind."
ig_war_flavor.14.t: "The Kingfisher's Hand"
ig_war_flavor.14.desc: "For 30 years, he had been mocked. From Muti onwards, it was as if every human being alive sough to point out his lack of a hand ever since that... incident, with the hand grenade in Ethiopia. Roberto Farinacci had a lot to feel vindictive about. Muti's shrill effeminate laughter, Mussolini's liberalism, and now, betrayal from those to which he was most grateful. Feeling vindictive tended to make you do vindictive things. And so he did, summoning General von Keilmansegg to his excuse of an office of the Duce of Fascism.\n\n"There was a meeting of the cabinet two days ago. I was not present or made aware, my Government made decisions without me. I hear you were present, my ever-faithful ally. Perhaps you can explain."\n\n"My deepest apologies, Duce," von Kielmansegg's eyes narrowed, and he paced towards the desk, making Roberto shift uncomfortably. "If I remember correctly, I do believe I entrusted the duty of informing you to one of my men. I will discipline him in due time. If you were to come to him, in future, I can guarantee you, it won't happen again."\n\n"I order you to report to me on the proceeding of the war. I trust the capabilities of my great German allies with all my heart, but this requires my close attention. You do not understand the threat. I do, having fought them already."\n\nThe General sighed, barely holding eye contact or attention. "The Duce has nothing to fear, as he has surrounded himself with wise advisors. They all concur on this issue: the Reds shall fall. You would not fear them if we were in Germania now, the monument to our victory in the east. The Wehrmacht - with Italian aid - bested one of the largest industrial and military powers in the world. What battles have the Italian Communists won that the Wehrmact should fear them?""
ig_war_flavor.14.a: "A sewed on hand."
ig_war_flavor.15.t: "The Drunk King"
ig_war_flavor.15.desc: "The cabinet all knew their designated places, and so, the table was made even. Preziosi, the ex-priest, bowed respectfully before taking his seat. Across from him was Anfuso, always loudly going on about 'The union of two imperial eagles.' At the end of the table, Spinelli and Costa, corporatist and zealot. They all paid their homage to the head of the table, the meeting, and the man they truly reported to: General Johann von Kielmansegg. Alas, not all in the world could be perfect. Just as Costa began an untrustworthy sentence about Black Brigades, someone stormed in, followed by two hapless guards.\n\n"I know! I know... I've made... mistakes!" Farinacci sloshed in, followed by a gasp from Preziosi. The Duce of Fascist Republicanism was not someone easily stopped when the guards were technically his men. But it was nevertheless a surprise they even had to make that choice, considering the half-full bottle of booze in Farinacci's hand, and his stumbling about. "But I can make amends. Let me help you exterminate the red scum."\n\n"What did I tell you about worrying, Roberto?" Von Kielmansegg was not amused, his eyes forked like daggers in the pathetic Italians direction. "This is a war council, and I will summon you if I require you. All orders you issue from your office are carried out, as the reports you receive indicate. You will realize the necessity of all this once i've one this war for you."\n\n"You need me, German! You have no... no-one else! No-one! I'm all there is. If you want a friendly government, show some respect! The Führer should have sent someone with better blood. My peers... theirs are the names of Empire. Your Uncle? What did he do besides die in a ditch in Poland?"\n\nThe room fell silent. The General broke it. "Costa, take the Duce to his office. Clearly, he is drunk.""
ig_war_flavor.15.a: ""I am not drunk!""
ig_war_flavor.16.t: "Germany's Warriors"
ig_war_flavor.16.desc: ""Farinacci threatens to drive me mad." General Johann von Kielmansegg's face drooped with glumness. "The new Führer sent me here to do a job. Complete a mission. If that means keeping that incompetent as far away from any real power then so be it I say!"\n\n"He disgraces us all." Johann's fellow officer nodded. "That we have no better Italian to work with is the greatest crime of the Bolsheviks so far. Pavolini... even Balbo! Germany would be better served with an ally of convenience with their wits about them, than a braindead rut seeking to throw itself off a cliff and take its leash holder with it."\n\nVon Keilmansegg sighed. By god, this was the sort of trial that made him miss Eva, his love. "Yes... loyalty. Our Führer ordered us here. After the... chaotic passing of power, I don't know if this assignment was intended as a test of loyalty, or a way to get us killed."\n\n"Both? Regardless, a difficult victory to win with our Petty King presuming to command Germans. He talks big about his friendship with our people, pines after our approval, and his respect for our armies. But Mussolini betrayed us once. I worry the Kingfisher is not smart enough to wait until after the war to try and break his leash."\n\n"Roberto Farinacci. My superior." The General scoffed. "Abandoned his own men in Calabria to save his own skin. Pressuring me to attack with reckless abandon, and areas of no strategic value, all for propaganda. All so everyone remembers the Petty Duce as a winner, not a disaster of a tactician. This creature, who is below me,  had his turn throwing away the lives of his kind for no other reason than his own glory. He will not claim German lives in the same vain pursuit. We are here to secure the Alpine border against a terrible threat, nothing more.""
ig_war_flavor.16.a: "Destination: Hell."
ig_war_flavor.17.t: "An Unlikely Pair of Soldiers"
ig_war_flavor.17.desc: "Lieutenant Giorgio Parini sighed, massaging his forehead. He couldn't for the life of his fathom why he had been chosen for this ungrateful task: had he committed some unspeakable crime in a former life? As the noise in front of him increased, and a painful fit struck his forehead, he decided he had enough.\n\n"Silence!" his voice boomed across the hastily-erected tent, and miraculously, all noise stopped.\n\nParini spared a look at the two men standing in front of him. One was tall and slim, his ill-fitting uniform "adjusted" in ways that usually would result in disciplinary actions. The other looked older with some grey hair, shorter but much broader, his uniform old and disheveled: the rolled-up sleeve revealed the tattoo "LEVANTE 1962 XLI E.F." on his forearm.\n\n"I called you here because you have abilities that are required for the war effort. You both showed skill and initiative, and the very fact that you are the only survivors of your respective teams is proof of that. I don't care if you hate each other, you will work together."\n\n"I'm not working with a damn communist!" the man in the old uniform said, incensed.\n\n"I'm not working with a damn fascist!" was the immediate reply.\n\n"Enough!" the officer screamed above the two. "Private Lorenzo Bergamini!" he said to the tall, slim man, "Corporal Achille Olmi!" and the other stood to attention. "My superiors may care what your beliefs are," he pointed at the shorter man, "but I do not. The Germans are advancing, and you will fight together: speak, and I'll have you flogged, refuse, and I'll have you executed. Is that clear?" he finished, looking both men dead in the eye.\n\nThe pair spared another hostile look at each other, but in the end, they both nodded. Satisfied, the lieutenant acknowledged the gesture."
ig_war_flavor.17.a: ""Now, let us discuss your first assignment...""
ig_war_flavor.18.t: "An Unlikely Pair of Comrades"
ig_war_flavor.18.desc: "The two men left the tent barely looking at each other, and both headed to the quartermaster to get their equipment.\n\n"Why are you following me?" Achille spat at the man at his side, hastening his pace.\n\n"Why are YOU following me?" answered Lorenzo, quickening his stride, with the effect that by the time they had reached the quartermaster's tent, both men were almost running.\n\nThe quartermaster was used to such antics, so he only spared the pair an eye roll before shoving two bags in their arms and shooing them away. The exchange of hostile looks kept up until they reached their assigned tent, and the surprise within: their names were etched on the same bunk bed.\n\n"Damn it, no way I'm sleeping in the same tent as you!" Lorenzo screamed.\n\n"I should be the one saying this!" the other replied, "there's no fucking way I'd ever share my bed with a communist! I'm sure you are already plotting how to kill me in my sleep!"\n\n"So says the one who's already doomed us all! I bet you are enjoying the fact that your raised-arm nazi friends are bombing us to hell!"\n\n"You dare to call me a German-friend?!"\n\nFor a moment, the two looked ready to pounce on each other, hands already closed in fists. Then, both exhaled, perhaps realizing the actual gravity of the situation. They looked each other in the eyes, then Achille broke the silence.\n\n"Fuck this all. Guess we can quarrel all we want after this ordeal is over, if we survive. I won't ever say this again to a communist, but... truce?"\n\n"Truce," the other conceded, and they shook hands wearily."
ig_war_flavor.18.a: ""Still, I get the top bed.""
ig_war_flavor.18.b: ""Hell no, I get the top!""
ig_war_flavor.19.t: "An Unlikely Pair of Fighters"
ig_war_flavor.19.desc: "The battle had been going on from the first daylight. The fighters of the Aeronautica Rossa, helped by the anti-air batteries dotting the hilltops, had kept the skies clear of the Luftwaffe, but they couldn't prevent the artillery barrage: after five hours of relentless pounding by all manners of howitzers and heavy mortars, Altezzano was little more than a pile of rubble.\n\nThe garrison had been spared most of the damage hidden in underground shelters, taking the first wave of German infantry by surprise and inflicting heavy losses, but the second attack had been more careful: now, the two sides fought viciously in the narrow streets of the beleaguered village, rifles and cannons replaced by bayonets, makeshift maces and grenades.\n\nAchille looked carefully from the hole in the wall he was hiding behind, trying to grasp anything suspicious. Seeing what he had already seen the last time he has looked - three dead Germans under a pile of rubble and one dead Italian half-leaning from a window - he turned to his companion to signal the all-clear, but what he saw stopped him in his tracks: Lorenzo's handgun was aimed at him, a pitiless look on the man's face.\n\n"Fuck you, I knew you were a trai-" Achille's last words were drowned by the gunshot. Immediately after, two things surprised him: one, he was still alive; two, he definitely heard a scream coming from behind him. When he turned his head, he saw a German soldier falling to the ground, a hole in his uniform quickly turning a dark shade of red.\n\n"Guess you owe me your life, a bottle, and some excuses," Lorenzo said, jokingly. Achille blushed a deep shade of red and turned his head, mumbling something unintelligible.\n\n"I didn't hear it. Louder!" the tall man ordered, laughing, and it was then that Achille knew that the voices weren't lies: communists were truly devoid of anything resembling humanity."
ig_war_flavor.19.a: ""I said, sorry and thank you, you bastard!""
ig_war_flavor.20.t: "An Unlikely Pair of Survivors"
ig_war_flavor.20.desc: ""Another group coming!"\n\nLorenzo heard his companion's words and pressed the trigger of the heavy machine gun he was manning as if his life depended on it - because it did. Heavy weapons weren't his thing, but the previous gunner was currently busy clutching his bleeding arm, screaming profanities - poor sod Oliviero was from Treviso, blasphemy was like punctuation there - and the bastards were still coming.\n\nThe deafening noise of belt-fed mayhem filled the narrow street, and the six dark-clad soldiers running towards them fell, some crying in pain, others already dead. Their mistake in thinking no one was left manning the gun nest, Lorenzo thought distractedly as he focused on the crossroad the Germans had come from. From the corner of his eye, he saw Achille placing himself at his side, but before he could speak, gunshots rang, and three other enemies appeared. Immediately, the pair took cover behind the sandbags, and the private took aim once again.\n\nClick. Cli-cli-click.\n\n"Fuck, it's jammed!" Lorenzo's voice was filled with despair as he pulled the trigger again and again, receiving the same response from the tortured piece of equipment\n\n"Give it to me!" Achille screamed, shoving him aside. He looked at the damn thing for a second, then punched the weapon right above the hole where the ammunition belt connected with the loading mechanism: both men could distinctly hear something break inside the metal casing.\n\n"Damn you, you broke the damn thing! We are all dead now!"  his comrade accused, his insults punctuated by Oliviero's profanities. Both, however, shut up when the machine gun started firing once again, immediately followed by pained cries.\n\n"Breda 54 never disappoints. Had one of these bitches back in the Levantine war: if she fusses, just give her a good spanking." Achille said with a satisfying smirk. He was still looking in the crosshairs, but he wouldn't have missed his companion's expression for all the gold in the world."
ig_war_flavor.20.a: ""Guess we are even now...""
ig_war_flavor.21.t: "An Unlikely Pair of Humans"
ig_war_flavor.21.desc: "Even as bullets flew above his head, Achille couldn't help noticing the dry irony of his current situation. He really needed to go to the toilet, but the aforementioned toilet was currently enemy territory: it was like his frequent quarrels with his wife, when they would both barricade inside one room and give each other the silent treatment, only this time the bullets were real. The Germans currently busy trying to dislodge him from the kitchen were surely poor marksmen, but what they lacked in aim, they made up for in firepower.\n\n"Shield yourself!" Lorenzo's voice boomed, and the corporal threw himself under the table as a grenade flew towards the corridor.\n\nHe heard a terrorized scream, then an explosion, and finally silence. His comrade went to scout ahead, but when Achille found him, he was kneeling on the floor beside one of the dead, a pained expression on his face. As soon as he was beside him, he understood: lying there, clad in an oversized uniform and a comically-large helmet, was not a man, but a boy, his rosy cheeks marred by mud and blood.\n\n"He looks like Marco... damn it, what have I done?" The tall man's voice trembled, barely above a whisper, as he closed the boy's eyes.\n\n"You did what you had to do. He would have killed you if given the opportunity," was his companion's calm answer. When Lorenzo looked at him, anger flaring in his eyes, Achille showed him his tattoo: "A good friend of mine was patrolling in Jerusalem, and a child offered him an orange: when he leaned down to take it, the little fucker stabbed him in the throat. When you are at war, you fight the enemy in whatever disguise it is: the fault isn't yours, but of the ones who sent this boy to die."\n\nLorenzo nodded, a different light in his eyes, and when the other offered his hand, he grasped it firmly. Achille couldn't help thinking that, perhaps, communists weren't really soulless demons..."
ig_war_flavor.21.a: "Not ALL of them, at least..."
ig_war_flavor.22.t: "An Unlikely Pair of Non-Enemies"
ig_war_flavor.22.desc: "The night had fallen over Altezzano, the fighting reduced to a few artillery shots in the distance. Achille finished his guard and returned to his comrade, who was looking dreamily at an open pendant: inside was a miniature family photo, the faces too small to distinguish without looking very closely.\n\n"Is that your family?" the corporal asked, and the other nodded.\n\n"Yes, it is. Me, my wife Nunzia, my big boy Marco, and this one," he pointed at the small bundle in the woman's arms, "Is Maria. And you, Achille, do you have a family back home?"\n\n"Unfortunately yes," the shorter man replied cryptically, then he asked another question: "What did you do before volunteering?"\n\n"I'm your typical communist factory worker" Lorenzo said, only half-jokingly: "You know the drill: work ten hours a day, read forbidden literature, prepare for the great uprising, the usual... I joined to protect my family, and you? You told me before you fought in the Levant..."\n\n"Yeah, I used to be in the MSVN, then I joined the regular army and was assigned to Jerusalem for two years. When I got my first licence in over six months, I came home to find my wife cheating on me with my brother."\n\n"Ouch, that's tough."\n\n"Not as tough as the beating I gave the bastard. Almost killed him: luckily, attempted homicide for honor is lightly punished, so I only got a fine, but it still got me discharged. Done this and that to keep myself fed, and when the war came, I rejoined: amnesty for being a former fascist is sweet enough, and better than having to live with that bitch..."\n\nThe change of the guard interrupted the conversation, and Lorenzo took his rifle to replace Achille at the window. As he scanned the surroundings for signs of enemy presence, he couldn't help thinking that the situation was turning for the better. Not the war, of course - that was shittier than ever - but this new camaraderie he had found with the burly soldier surely kept his spirits lifted: who knows, perhaps if they were still alive at the end of this hell, they'd be able to call each other friends?"
ig_war_flavor.22.a: "Facing death together overcomes all differences."
ig_war_flavor.23.t: "An Unlikely Pair of Castaways"
ig_war_flavor.23.desc: "The bulky frame of the tank shook from the strength of its own hits. In a rare display of ingenuity from central command, the mothballed P-44 had been turned into a makeshift fort at the center of Altezzano's main square: while in open ground the antiquated tank would never have survived, in that position - half-buried and surrounded by sandbags, earthworks and houses - it provided excellent support to the defenders, taking by surprise all the Germans who entered the square and blasting them apart at point-blank range.\n\nUndeterred by the heavy losses, however, the enemy kept coming. The reason for such a relentless attack was right behind the tank: at the end of the square was the only bridge crossing the Adige river in twenty kilometers for both directions, a vital artery in that sparsely-populated part of Trentino.\n\nAt last, the P-44 ran out of ammo for its main gun. Encouraged by this, the Germans launched the final offensive to take the plaza: behind the infantrymen came a tank, held in reserve just for that moment. With a precise shot, the Panzer X cleaved the turret off its older Italian counterpart, then it rolled forward, finally entering the square. This, however, spelled its doom, as the P-44 roared back to life one last time: its engines saved by the earthworks, the wounded tank broke free from the trench and barreled forth at full speed, ramming the Panzer in the side and sending it into an anti-vehicle landmine that blew both machines up.\n\n"There goes our last tank," Lorenzo commented dejectedly from his viewpoint about two blocks away, where he was guarding the Eastern approach to the plaza.\n\n"Who cares about the tank, come here!" Achille said worriedly, looking from the window on the opposite side of the room. He passed Lorenzo his binocular: "Look!"\n\nLorenzo looked, and despaired. A column of tanks was entering the outskirts of Altezzano, followed by all kinds of trucks and other vehicles: it was an armored division, and they were alone."
ig_war_flavor.23.a: "The sand in the hourglass runs thin..."
ig_war_flavor.24.t: "An Unlikely Pair of Commandos"
ig_war_flavor.24.desc: "As the armored division entered Altezzano, the battle ended. One by one, the remaining Italian holdouts were taken apart by endless fusillades of high-velocity shells that ripped through walls, sandbags and earthworks: an hour later, only a few strugglers remained, to be mopped up by the infantry.\n\nAchille looked at his band of survivors: other than him and Lorenzo, only five had managed to regroup in the underground cellar. For the final laugh, he was the commanding officer by virtue of being the highest in rank - and he was a corporal, a damn corporal.\n\n"Okay guys, any idea?" He asked, only half-jokingly: "And no, no surrender: Giovanni and his squad tried, and they all got the other end of the barrel."\n\nA shiver passed through all present as they understood their predicament, then Lorenzo stood.\n\n"I have an idea." He said, and six heads turned towards him: "The armored convoy is going straight for the bridge, which means that it will be extremely vulnerable."\n\nAchille and the others nodded.\n\n"The mop-up patrols are spread through the town, so if we keep silent and go quickly, we can safely slip through the surveillance. We don't need to fight, we just need to reach the munitions depot under the church, and take all the explosives."\n\n"You want to bring down the bridge, don't you?" Asked Achille, though it was mostly rhetorical.\n\n"Yes. This battle is lost, but at least they won't get what they came here for: we might die, but we'll give them the biggest middle finger in the history of mankind!"\n\nThe small band cheered and laughed at that, glad to have found a purpose once again. Then, they started drafting the plan."
ig_war_flavor.24.a: "Give me a communist and explosives, and I shall blow up the world."
ig_war_flavor.25.t: "An Unlikely Pair of Friends"
ig_war_flavor.25.desc: "The minesweepers took their time clearing every square inch of the plaza, preparing the ground for the tanks. By the time the road was safe, however, the small commando had completed its quest and regrouped in a house facing the bridge.\n\n"Is everything clear?" Lorenzo asked the other four - two had been caught, diverting several patrols before their demise.\n\n"Yes," answered Achille: "We distract the enemy and get ourselves blown up in the process, so you can throw that bag of dynamite to the bridge, getting yourself blown up in the process. Neat."\n\nA small laugh lifted the atmosphere, then the other three left for their position, and Achille turned somber.\n\n"That's it, then," he said dejectedly, then his expression became pensive: "You know, of all things, I would never have thought I'd die fighting side by side with a communist."\n\nLorenzo looked at him in surprise, then he laughed.\n\n"What about dying side by side with a friend?" he countered, looking the other in the eyes with a sincere smile.\n\nThe corporal looked dumbfounded, but nodded determinedly.\n\n"I can definitely do that." He answered, and the two shook hands one final time.\n\nAs the first tank passed below the window, Achille fired the Panzerfaust he had stolen from a dead German. The heavy rocket blew up the vehicle's rear end, dousing dozens of unfortunate soldiers in a shower of burning fuel: the mayhem and smoke were what Lorenzo needed, and he bolted towards the bridge, reaching it in a few seconds.\n\nWith a scream, he threw the heavy bag in the middle of the first span, then he armed a grenade, and threw it right on top of the bag. From the corner of his eye, he could see Achille and the others running towards him, and from a glance, they all knew what the only way to safety was: as the bridge collapsed in a fiery conflagration, they all threw themselves into the river."
ig_war_flavor.25.a: "A reborn Horatius Cocles and his worthy comrades."
ig_war_flavor.26.t: "An Unlikely Pair of Heroes"
ig_war_flavor.26.desc: "The Circus Maximus was filled to the brim. The war had brought much destruction and sorrow, but at last, it was over: as part of the revolutionary government's effort to lift the population's spirits, a ceremony had been organized to award the brave soldiers who had done great deeds in Italy's service.\n\nAchille felt out of place on that stage, and looking at his friend, he could see he was not the only one. More than anything, he hated seeing all that red: red flags, red neckties, red napkins, red everywhere!\n\n"Italiani! Compagni!" [ITA.getleader] began, interrupting Achille's thoughts: "Today is a great day, for we have proved to the entire world that our revolutionary spirit stands strong! The fascist Hydra has reared its many heads against us, but the Revolution is unbowed!"\n\nThe people cheered, then the Secretary continued.\n\n"Behind me stand many heroes, who have achieved great victories in Italy's name. The first recipients of the People's Heroes Medal are Corporal Achille Olmi and Private Lorenzo Bergamini, whom you may know as the Heroes of Altezzano!"\n\nThe people roared, making the two men feel even more awkward.\n\n"Despite heavy enemy fire and critical numerical inferiority," [ITA.getleader] read from the official paper, "These two heroes and their fallen comrades held back an enemy armored column and destroyed a vital bridge, saving the entire Second Army from encirclement!"\n\nAs the crowd cheered, the Secretary turned to the two soldiers, pinning the medal on their chest and shaking their hands, then he turned towards Achille.\n\n"I didn't add the particular about the amnesty," he whispered in his ear: "Thank your friend for that."\n\nAs he looked towards Lorenzo, Achille knew that he had much to thank him for, but the greatest one was exactly that. In the lanky factory worker, he had found a friend, and this was the best thing that could have happened to him - alongside a divorce from his wife, that is: the only useful thing the reds had invented."
ig_war_flavor.26.a: "Chi trova un amico, trova un tesoro."
ig_war_flavor.27.t: "Gaudium Certaminis"
ig_war_flavor.27.desc: "The fall of Ciano, and then Umberto, had left power vacuums aplenty throughout the fabric of Italy and its people's consciousness. Pino Romualdi, for one, felt a bit elated. Here, in these barracks, there was no Almirante, no PNF, no authority to command him. The soldier saw his shadow, and it was that of a Duce. Still, Romualdi wondered if Rauti thought about him. His mourning daydreaming over which Pino was the stubborn one ended with a bang. A hand gripped his shoulder as his ears rung, as if the blood inside them were screaming. The goatee belonging to the terrified Giovanni Roberti came into sight, and as Romualdi turned to face him, he also found his eyes captivated by the artillery. Or, moreover, the absence of them.\n\n"Capitano!" Cried out the voice he did not recognize. "What should we do? We have no support, and the Communists could shell us at any time!"\n\nWordlessly, Romualdi brandished his machine gun. "We take the fight to them, men! They can us from afar like cowards, but face to face, they shall fall!"\n\nRomualdi ran out first, his example and words motivating his men to follow. This was life. Pure, simple, martial life. A final act, for his loyal men, dead or soon-to-be. He charged out, never to be seen again."
ig_war_flavor.27.a: "The petty king falls."
ig_war_flavor.28.t: "From The Flames"
ig_war_flavor.28.desc: ""Prepare! Prepare!" Yelled the squad commander, pacing back and forth. "The preliminary assault on Venice shall begin shortly. Our allies will weaken the defenses, as will our attack!"\n\nThe squad lay under the cover of darkness on the hill. It would have been utterly pitch black if not for the Venice, glimmering like a nest of pearls in the distance. The entire group, bar their southerner commander, was Venetian themselves. Young men dreaming of restoring their home to Fascist prosperity.\n\n"The legitimate Duce asked the Germans south of the Alps to help resolve the cultural question! The war between civilization and Jewish Marxism has raged on for too long, and the only cure is the German one. In order to achieve total victory, total ruthlessness must be employed. Exterminate all resistance and all who refuse your orders once you enter the city, after the bombers have passed!"\n\nBombers? That was the terrified question that passed all of the Republican Fascist men. They could do naught but watch as the lights of Venice were dimmed by shadows, as small dots fell from the sky, and as the lights of Venice took on a different hue and form. Fire raged through their home. How many had been claimed? How many would be? Silence reigned supreme. Even their raging commander fell silent, astonished by his men's reluctance.\n\n"What are you doing? Return to your stations at once! At once! At once!" The voice barely registered in the men, who had thrown down their guns, and began to walk away. In order to destroy a force eating Italy inside out, they had empowered another monster to eat Italy alive in a more conventional fashion. What had they done?"
ig_war_flavor.28.a: "Enemies of the Italians."
ig_war_flavor.29.t: "Knight Of Old"
ig_war_flavor.29.desc: "The Revolutionary would never understand the Counter-revolutionary. Much like how the rebellious son could never comprehend the father, or how the radicalized peasant could never reach out to the landlord he had taken arms against. Pino Romualdi had lost his home. There was no safety back in the cities, not anymore, not for someone like him. The young prey on the old, taking what they want. Even if they were safe, who was Romualdi in the new world order when these Communists had everything just the way they wanted it? What purpose would he serve? With Fascism, he was a veteran of a great war. He had the respect and love of children. The young could rejoice in the new world the revolution would build for them, but for those too old to change... fear and squalor. Romualdi was not alone, he and his two lieutenants had scrounged together old war friends. Thankfully, not all the youth of the world was set against him.\n\n"Tripodi." Pino Romualdi sat behind his war desk in a dimly lit hideout. "I hear your son joins us in our fight tomorrow."\n\n"Yes, my Capitano." The aging World War 2 volunteer responded formally. The reminder of his own rank in that war made Romualdi smile. "Ernesto is a good lad, and today he becomes a man. He believes in you and Fascism, Capitano... if a bit too much that suits a soldier."\n\n"It matters not. I have faith in you." The infantry captain sat up, pointing down at the map before them. "Come morning, we'll seize the derelict barracks at the base of the hill, and the artillery atop it. The Partisans shouldn't know about the guns, so when they approach, we'll rain fire down on them. I'm entrusting that duty to you and your son."\n\nTripodi swelled with pride. His son had wanted this since he'd first heard of the Arditi. Now, he would make his father proud."
ig_war_flavor.29.a: "I won't let you down."
ig_war_flavor.30.t: "Trieste, Open City"
ig_war_flavor.30.desc: "An ordinary day in Trieste would see the city awash with the sounds of life, today, there was only one sound in everyone's ears, the monotonous thud of the jackboot's stomp. It was inevitable to most, not least of which the PCdI who had all gone underground when the German army was spotted massing at the border, that the city would be occupied considering its proximity to the German border, yet the sight of German invaders was something foreign to the citizens of Trieste.\n\nResidents watched the army march through their streets, most looking on with scorn at the Teutonic brutes that had no love for their beloved Trieste. The Huns would remain shut to the beauty of Italy, never to experience a sunset by the waterfront, they would sooner tear their home asunder if it allowed them extra rations.\n\nNot everyone was so averse to the Germans' presence with many old fascists crawling out of the woodwork, prostrating themselves to the officers with offers to help them "wipe the scourge of communism from their homeland." These men were barely fit to hold a rifle but to the Germans, their presence was useful for both hunting communists and for day-to-day administrative duties. The decrepit blackshirts make haste to harass any suspected red, employing all the familiar methods as if it were the twenties again.\n\nLuigi Frausin, a PCdI faithful, could only watch all this unfold through the dirty window of a damp basement. Like the rest of the PCdI, he had gone underground when the German army was spotted on the move, knowing that the city would be quickly occupied considering its proximity to the German border. As he watched the brown menace desecrate his city, Frausin's mind was racing with thoughts about his family, what the Germans would do to him if they found him but most importantly..."
ig_war_flavor.30.a: "What could be done to rid Trieste of fascism again."


ig_war_beginning.1.t: "Revolutionary Communique 186-3W"
ig_war_beginning.1.desc: "URGENT REPORT FOR REVOLUTIONARY COMMAND: Roberto Farinacci has resurfaced, declaring a counter-revolutionary government in Calabria. Accounting for key figures of the old regime has been a core unifying effort among all fighters of the Revolution, from militiaman to sympathetic informants. One such loyal man was present for the resurfacing of a Blackshirt matching the description of one Roberto Farinacci in Catanzaro. Considered a Radical Fascist among the arch-reactionaries, the castor oilman has taken after Alessandro Pavolini in his intentions for the working class. Predictably, the German toadie's message was ill received by the local populace, and following this upset, the little tyrant declared he would return, and made north.\n\nThe traitorous scum has set himself up in the Pollino Mountain pass, an extremely strategically important natural boundary. Clearly he intends to separate our militias from their brothers-in-arms in Sicily. With his remaining Blackshirts, and desperate, scrounged together reactionary fighters, he intends to strangle the Revolution in its cradle. This exclave of Nazi-Fascist abomination can be wiped out, for the wits of Farinacci are non-existent, and the flame of Fascism spent. Moreover, it must be done with great haste. Most alarmingly, men, in nondescript uniforms, contrasting the Blackshirts, reportedly accompany Farinacci and have his ear at all times. Men with German accents, one source insists. Unbeknownst to us, and likely during the early days of the Revolution, the insidious German [getGermanIntelAgencyShort] must have slipped in through the port.\n\nIt is this report's strong recommendation that all available militias are directed against this rebellion, for a rebellion backed by German war material poses a threat. The port should be a key target, for Farinacci or his German directors cannot be allowed to escape. Death to Nazi Blackshirts! Down with the traitors!"
ig_war_beginning.1.a: "Up the Reds!"
ig_war_beginning.2.t: "Revolutionary Communique 199-1FF"
ig_war_beginning.2.desc: "Revolutionary militias skirmished with the reactionary host across the Pollino Mountain range. The composition of the enemy was, thanks to intelligence, found to be a wide-ranging group of Fascist remnants. Derived from the composition of the prisoners taken at Pollino, we discovered the force to consist of 1/3s, Blackshirt loyalists, 1/3s Fascist sympathisers-Veterans, landowners, and adherents of the now-defunct University of Fascist Mysticism-and 1/3s hapless colonial or peasant. Our victory at Pollino assured one overall. Our militias swept past out-of-position retreating forces, came up behind those reactionaries assaulting Sicily, and took an undefended Catanzaro.\n\nWhile defeated, Roberto Farinacci has not sunk with his monstrous experiment, and has fled. An earlier Revolutionary Communique's urging to quickly capture the Catanzaro port became reinforced in the aftermath of Pollino. In the hastily evacuated radio station, documents were found confirming not only the presence of German agents, but a plan to extract Farinacci to a codenamed location. Haste proved to not be enough, as the Blackshirt was nowhere to be found in Catanzaro, last spotted heading for the port where he was reported boarding a ship of unknown origin.\n\nOur current diplomatic predicament will make any further action difficult. Revolutionary Command has not inherited the same control over the Suez, or relations with Iberia in regards to the Gibraltar pass, as the royalist regime had. Surrounded by reactionaries in both the East and West Mediterranean, it is doubtless all of them would leap at the chance to assist Farinacci, despite their loathing of the Nazis. Commissars in the small islands must be put on high alert, in case his ship crashed or he was simply moved to start an insurgency elsewhere. What naval force we have must be used to intercept him. A government-in-exile under the Nazi government would be a threat and possibly lead to further terrorist cells."
ig_war_beginning.2.a: "Surely a spent force."
ig_war_beginning.3.t: "All Is Fair In War"
ig_war_beginning.3.desc: "Over the course of just over a week, this small stretch of Alpine Italy, hugging the German border, had grown quiet. Usually, the militiaman patrol would at the very least trade fire with a barn flying the Fasces of the sigil of the Savoys, but now, nothing. Nothing, until they found the bodies. A dozen men and women were riddled with bullets. Several more lay wounded, unable to speak the name of their assailant. They must have been herded here, the militia commander thought. The man was blessed with experience, knowing that no reactionary militia here had this many bullets. Experience was quickly turning out to be a curse. His worst fears came true as reality, in the form of the sound of tank treads, crashed through the trees.\n\n"Wait! No!" The Militia commander yelled, throwing his arms up. The Leopard ground to a halt. Its armor plating would be practically invincible against any futile Partisan gesture of defiance. "These people are injured! And we can offer no threat to you! Take us prisoner, killing us holds no value! Please take us-"\n\nA shell from the Leopard thumped into the group. All those standing were thrown around like ragdolls. Shrapnel, blood, and mud were blown into every single one of them. The moaning and groaning of the wounded ended. The cold metal hunk silently moved on. German Infantry had crossed and secured the border crossings, and now, from the Alpine passes, columns of Panzers rode out. They flew the banner of Farinacci's rebellion, and the remnants of that episode marched with them. But their commander, von Kielmansegg, would not tolerate Farinacci's command. He intended to win, after all. Where once the sight of a Swastika would not be tolerated, The beasts of Nazism, having visited the rest of Europe, now sought to complete the work of their Germanic ancestors. A bloody hand had fallen, the first atrocity committed."
ig_war_beginning.3.a: "The first of many."
ig_war_beginning.4.t: ""
ig_war_beginning.4.desc: ""
ig_war_beginning.4.a: ""
ig_war_beginning.5.t: "Insoddisfazione e Dedizione"
ig_war_beginning.5.desc: "Trieste had faced a tyrant from north of the Alps before. On several occasions, it had been squeezed between an Italian and German power. But the city did not face one Frederick III, who restored its walls after sacking it. And the words of a Pope could not save it. Not now.\n\nFlanking the wretched Alpine passes and bottlenecks, the barbaric jackboot stamps through Italian Slovenia and down into Gorizia. Now their flank needs securing. Now, before assaulting Venice from the north and east, they must destroy that very city that Italian Slovenia served as a buffer. Trieste, the key port for one seeking Adriatic Hegemony, has seen its pre-existing defenses reduced to rubble by the Luftwaffe.\n\nA bombing run, seeking to soften the city up, can only mean one thing: The German beast smacks its lips from afar, preparing to devour the city won at the cost of so many patriots of Italy. However, all is not lost. The death tolls of a city are hard to be misheard by the inhabitants of said city. Fresh on their mind is the insult to their fathers and widowed mothers, fresher is the fate of those caught in a sacking. Militias arm themselves, they will not fall without a fight.\n\nBut must they fall? Rifles are handed out to everyone who is able and willing to hold one. The city won through blood is more than ready to bloody the nose of the hound, but it cannot survive on its own. As civilians prepare to become partisans, children shelter from bombs, and a lost old man with too many dirt-covered documents and too much blood lust hobbles towards the city, we must choose. Is this the gate to Venice, which must not fall, the symbol of victory, the poison trap Germany must die on? Or is Trieste too far-flung, supporting it too great a risk, too much of an overextension of our limited resources?"
ig_war_beginning.5.a: "Send supplies at once!"
ig_war_beginning.5.b: "They are on their own."
ig_war_beginning_5_tt: "§RGerman bombing runs have damaged our defenses!§!"


