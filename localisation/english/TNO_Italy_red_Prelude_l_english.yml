# dead provgov

 dead_provisional_government.1.t: "The King Got Shot!"
 dead_provisional_government.1.desc: "The report arrived as a rumor and became fact in minutes. During a hurried public appearance meant to calm the city, gunfire cracked through the applause. Guards pulled the monarch from the rail and rushed him inside. Sirens chased one another through the streets while ministers vanished behind slammed doors. Within the hour every faction named a culprit. Blackshirts swore it was a communist attack. Radicals whispered of a fascist provocation. Some blamed a lone fanatic. No one agreed, and the Palace could no longer impose a single story.\n\nCadorna declared curfew and sent orders to secure the approaches to the capital. Lines failed, couriers were turned back by barricades, and the convoy that should have been a symbol of continuity became a symbol of flight. Crowds gathered outside prefectures to demand bread and answers. None were given. The monarchy’s last certainty, the person of the King, had been taken from it. What remained was a court without a crown and a nation that no longer feared the old order.\n\nIn workshops and alleys men and women who had waited for years understood the meaning of the day. The committees pushed the printing presses to their limits, the Guardie Rosse formed around veteran cadres, and the first units of the Esercito di Liberazione Nazionale began to take shape from deserters and partisans. The page was turning faster than anyone in uniform could read it."
 dead_provisional_government.1.a: "Seal the ministries. Count the hours."

 # this one's good but not accurate anymore due to narrative changes, will find a way to make it work better at some point
 dead_provisional_government.2.t: "Birindelli's Hour"
 dead_provisional_government.2.desc: "Fascism's top brass had been decapitated. Those still loyal to the Party had been sent away or departed of their own accord. Where did that leave him? The Admiral who had bit the bullet, proclaiming his loyalty to the Royalty for the sake of Italy? Gino Brindelli was alone, and running for his life. Necessary codes were folded under his arm as he flew up a flight of stairs in the derelict factory. The pursuing mutinying sailors, from the ship the codes belonged to, let out cries of 'murderer!' as he went. His escape, however, was brought to a premature end by the intercom of the factory sounded.\n\n"Admiral! Listen to me! Unless you return immediately we'll dynamite the roof and bring you down do you hear me?"\n\n"Yes, I can hear you!" The panting Birindelli shouted back.\n\n"Will you do as we say?"\n\n"I have no choice! I'm trapped anyway! I damaged my foot in the run!" He lied, his fingers clicking over his sidearm, priming it for action. Dynamite? What fool did these bluffing socialists take him for?\n\n"I shall get him," growled one of the partisans as he stood up. Having moved outside and out of harm's way, he and his comrades observed Birindelli move into view, hobbling as he did so. He clearly needed assistance. "He killed my friend. He belongs to me now."\n\nThe whiz of a bullet against air was heard, followed by the cry of the partisan as he fell. The detonator was pumped, and Gino Birindelli's screams became quickly overwhelmed by the sound of explosion and rubble. His comrades huddled around their dead friend, cursing at themselves for having believed the monarchist toad."
 dead_provisional_government.2.a: "Forgive others often. Never yourself."

 dead_provisional_government.10.t: "Chaos in the North!"
 dead_provisional_government.10.desc: "The industrial belt rose first. At Livorno a strike of dock and factory hands swelled into a column that faced a line of conscripts. Orders to fire were refused, rifles were lowered, and the city passed into the hands of its workers by sunset. In Turin, organized pickets became barricades, and the squadre sent to disperse them met bricks and gunfire from shop floors that had been planning for this moment since the first arrests of the postwar years. In Sesto San Giovanni, police and garrison units were pushed out of the suburb and bridges were held by men in work coats who had drilled by night.\n\nMilitary governors proclaimed states of siege. Some telephoned Rome and begged for clear instructions, some bargained with factory committees for safe passage, some fled. Rail yards burned in Alessandria and Novara. Telegraph offices went dark, then reappeared under red armbands. The MVSN and loyalist detachments tried to hold prefectures and armories, yet their maps already lagged behind the streets they claimed to control.\n\nCommunist and anarchist militants knit themselves into something larger. The Formazioni di Difesa Proletaria took shape around union halls and safehouses, the Guardie Rosse grew from small squads into hard cores that could seize a district, and sympathetic officers began to talk to the new Esercito di Liberazione Nazionale about where their men might stand when the next column came into view. The North no longer waited for orders. It issued its own."
 dead_provisional_government.10.a: "Hold what we can."

 dead_provisional_government.11.t: "Chaos in the South!"
 dead_provisional_government.11.desc: "The mezzogiorno slipped from the capital’s grasp in silence before it did so in noise. Naples promised troops that never arrived. Bari said it was regrouping and asked for patience. In Calabria and Sicily the garrisons dwindled at dusk. Some commands issued proclamations and discovered that the printers had already changed sides. In the countryside, prefectures locked their doors and found their corridors full of petitioners who no longer knocked.\n\nPeasant leagues resurfaced in villages where the Carabinieri once ruled by rumor. Priests tried to mediate between landowners who demanded protection and farmhands who had no more rent to give. The telegraph stuttered, then stopped. Coastal towns barred their harbors against men in unfamiliar uniforms. Courthouses in Taranto and Reggio were emptied by their clerks in case the files might save a life. When the Palace called south for loyal battalions, the only answers were stories of units that had decided to sit still and wait for the wind to change.\n\nOn paper the Kingdom still held every province. In practice authority belonged to whoever could persuade a square to stay quiet until morning. The old administration learned that a government may exist without power, and that power may exist without a government. Rome spoke into the telephone and heard its own voice return from a dead line."
 dead_provisional_government.11.a: "Find who still answers."

 ITA_RED_dawn.1.t: "Formalizing Cooperation"
 ITA_RED_dawn.1.desc: "The shot that ended the old king’s rule ended the last excuse for waiting. Couriers rode from Livorno to the Po plain and back again with sealed notes and simple passwords. The circles that had survived the long night stepped into daylight. In factory towns the MCdI called its veterans by name. In coastal cities fishermen landed sacks at dusk that did not hold fish. In the hills the caches of the old war opened and the Formazioni di Difesa Proletaria took their first inventories.\n\nThe Fronte Rivoluzionario Popolare Italiano met in rooms that smelled of coffee and oil and learned how to speak as one. Its table reached across factions. The young militants of the GAAP sat beside men who still quoted Bordiga by page number. Priests from lay groups arrived with reports from parish charities and asked for bread lists rather than slogans. Each report ended the same way. The rank and file of the old army would not fire forever if the streets held.\n\nThe ELN set down a timetable in neat hand. Junctions first. Ports and powerhouses next. Barracks last, if the officers proved wise. The Guardie Rosse were given the districts where they already knew the alleys and the doors that would open on a knock. When the hour came, bells would carry the order farther than any wireless. The map would fill with new marks and the old government would discover that power had slipped from its fingers before it knew it was falling." 
 ITA_RED_dawn.1.a: "Send the signal."

 ITA_RED_revolutionary_assembly.1.t: "The Bologna Declaration"
 ITA_RED_revolutionary_assembly.1.desc: "Delegates from committees, unions, peasant leagues and partisan staffs crowded into the aula until the doors could no longer close. The chair read the text twice so that the scribes could keep up. The declaration set out the basis for authority in the liberated zones and the duties of the new state that would follow.\n\nIt affirmed that power rests with councils elected in workplaces, neighborhoods and villages, that commanders answer to commissars, and that any force that claims legitimacy must show it by feeding the people it governs. It abolished the extraordinary tribunals of the fascist era and ordered the opening of the prisons for political detainees. It instructed prefectures that surrendered to preserve their records and staff where possible so that bread, fuel and transport could continue without interruption.\n\nThe program described an economy that would be rebuilt by those who worked it. Heavy industry and key utilities would pass under state supervision in service of a plan. Cooperatives and collectives would manage what they could prove they could manage and would receive credit in grain and coal rather than empty promises. Land commissions would begin in Emilia and the Po valley where the soil and irrigation could sustain a pilot scheme before the harvest.\n\nOn foreign affairs the declaration was careful. The revolution would seek solidarity and recognition where it could, yet it would not accept tutors. The border with Germany and the Alpine passes would be fortified by the ELN at once. The cities that swayed between fear and hope were invited to send delegates within the week, and the committees that already governed in fact were recognized in law. The declaration ended with a simple sentence that the chamber spoke together: Italy belongs to those who work it, and the work begins today."
 ITA_RED_revolutionary_assembly.1.a: "Publish and distribute."

 ITA_RED_revolutionary_assembly.2.t: "The Assembly Convenes"
 ITA_RED_revolutionary_assembly.2.desc: "Bologna lent the Revolution its halls and its porticoes. Delegates arrived with union cards folded into prayer books and with notebooks full of minutes from occupied plants. Farm spokesmen came in boots still caked with the Po valley. Clerks came with carbon paper and a promise to keep ledgers honest. The chamber rose once for the fallen and then set to work.\n\nThe roll was more than a list of names. It was a census of a new country. Turin’s stewards sat with Romagna’s peasant leagues. The teachers and writers whom the Revolution called the Intelligenzia took their bench next to the men of the ELN who wore their ribbons in quiet pride. The guard on the door saluted every council and committee with the same respect. When the chair called for a presidium, the hall reached first for the jurists and speakers who could be trusted to count votes and not steal them.\n\nThe city already knew what it wanted from its government. With the first gavel the Assembly promised to bind the fronts into one body that could give orders, feed the streets, and answer abroad for the state that was being born. In the galleries messengers compared early lists of portfolios. Security would go where discipline could keep the peace without cruelty. Finance would go to a steady hand that knew the mills and the banks. Foreign affairs would go to a voice that could speak for a people tired of being lectured by strangers. The session rose late and reconvened with the sun." 
 ITA_RED_revolutionary_assembly.2.a: "Begin the roll call."

 ITA_RED_revolutionary_assembly.3.t: "Acts of the First Session"
 ITA_RED_revolutionary_assembly.3.desc: "The decrees read like a ledger of long debts. First, the courts that punished poverty were closed. Political prisoners were named and released to their families under the eyes of the crowd. The factories whose owners fled or sabotaged production were placed under workers’ supervision. Their committees were recognized in law and given access to credit and coal. The railways received priority for grain and munitions and a clear schedule that even frightened stationmasters could follow.\n\nThe land question was opened with caution and courage. Commissions sat in the Po valley and in Emilia to record titles and tools and to divide what could be worked without ruin. Cooperatives in good standing were assured seed and rope. In every decree the order of the day appeared between the lines. Feed the cities. Keep the power on. Do not break the machine you are trying to rebuild.\n\nFinally the Assembly wrote a charter for itself. A Provisional Government would carry the weight until a People’s Congress could be elected. Its duty was plain. Defeat the counter-revolution, speak with one voice abroad, and hold the line at the Alps and the sea. Outside, the text was read from balconies and church steps. Inside, the delegates signed their names and argued the commas as if they were fences on a field they expected to harvest." 
 ITA_RED_revolutionary_assembly.3.a: "Publish the decrees."

###=====|b) Revolutionary Provisional Government |=====###
 revolutionary_provisional_government.1.t: "Communists Take Bologna!"
 revolutionary_provisional_government.1.desc: "By night the trains slowed to a crawl at the San Donato yards. Switchmen who wore red armbands waved lanterns that sent whole consists onto the wrong tracks and into silent sidings. Columns from the Guardia Rossa moved along the embankments and through the warehouses. At first light the sentry at the prefecture found his relief already waiting inside the gate. On Piazza Maggiore the banners arrived in waves, then the speakers, then the crowds that filled every archway under the porticoes.\n\nBologna had prepared for this for years. Cooperative societies kept their ledgers when the regime tried to shut them down. Student committees met under the eyes of the administration and learned to speak around the censors. In the factories of Sesto Imolese and the workshops by the rail line, the old watchwords of the Biennio Rosso returned to daily speech. When the Carabinieri realized that their reserve company had deserted in the night, the prefect signed a surrender that spared his clerks and handed over the registry.\n\nThe Liberation Committee convened in a lecture hall that smelled of chalk and oil. The vote was swift. A Revolutionary Provisional Government would speak in the name of Italy’s workers and peasants. Onorato Damen was chosen to preside, Pietro Secchia was charged with leading the council, and portfolios were handed out before noon. Arrigo Cervetto took responsibility for foreign affairs, Enzo Misefari accepted the economy brief, and Arrigo Boldrini gathered the city security forces into a single command that could actually keep order. The decrees that followed abolished the fascist courts, suspended the Grand Council’s organs, and recognized workers’ councils wherever they already existed.\n\nThe Guardie Rosse received the northern districts and the rail nodes. The Esercito di Liberazione Nazionale took the junctions and the depots and began enrolling deserters who arrived in small groups with their rifles wrapped in coats. Liaison officers set out for Modena and Ferrara with forms for requisitions and with the seal of the new government. Bologna’s radios began to speak a language the rest of the country understood at once: the old ruling powers had lost their mandate, and a cabinet now existed that could act.\n\nNews from Rome confirmed what everyone suspected. The Verona deadlock had bled into the capital. Umberto’s recourse to emergency rule, his appointment of Cadorna, and the break with the MVSN and their friends in the army had pulled the last pins out of the frame. Parliament shrieked about legality. The palace answered with silence and curfew. Outside that quarrel, the class forces that had been building for a generation chose their moment. In Livorno the conscripts lowered their rifles. In Turin the factory floors held their ground. Bologna now gave this movement a seat, a table, and a stamp.\n\nBy evening the municipal guards stacked their carbines in the courtyard of Palazzo d’Accursio and signed on to the new service. A courier crossed the Reno with a pouch of sealed letters for the provincial capitals. The RPG’s program would travel faster than the trains, and the map would start to catch up with the reality in the streets."
 revolutionary_provisional_government.1.a: "Proclaim the Revolutionary Provisional Government."

 revolutionary_provisional_government.2.t: "Going to the People"
 revolutionary_provisional_government.2.desc: "Lorenzo had just finished his lunch when the knock on the door came. It was strange for someone to be visiting at this time, and he found it even stranger when he opened the door to someone who seemed to have just come out of a bookshop.\n\n"Comrade!" I am here to uplift you from your slumber! For your whole life, you have been chained by reaction and capitalism, but now that the revolution has arrived, you are now free!'\n\nLorenzo stood for a second, almost stunned by what he was hearing. Sure, he wasn't oblivious enough to not have noticed the revolution that was happening in his country, but he didn't think that anyone involved in it would travel to his normally quiet village.\n\n"Fellow proletarian! To make sure that you fully understand what shall be done to transform Italy into a workers' state, you must read this.' The man reached into his bag, pulled out a sheet of paper, and shoved it into Lorenzo's protesting hands. 'Goodbye, and be loyal to the revolution!"\n\nLorenzo shook his head in confusion. The pamphlets that he now held had many words that seemed to be utter nonsense. Dictatorship of the proletariat, labour theory of value, bourgeoisie, revisionism, cultural hegemony, means and mode of production ; everything seemed to blur into one incomprehensible mess after another."
 revolutionary_provisional_government.2.a: "Utterly confused, Lorenzo retreated to his kitchen."

 revolutionary_provisional_government.3.t: "Our Rip Van Winkle"
 revolutionary_provisional_government.3.desc: "Mario woke up late, as was his right, it was his day off after all. As he made his way downstairs to fix his breakfast, his wife having long since left, as was custom, he heard a commotion on the street. Heading out to investigate, he was stopped in his tracks when he saw the wall opposite his house. It was covered in posters, most bearing insignias and initials he didn't recognize. But he could not mistake the hammer and sickle, nor the bright red word "REVOLUTION".\n\nHe looked about, frightened, sure a horde of police officers or blackshirts would be along to tear the posters down and start a manhunt for their owners. But none came. As he looked, he saw several men with guns standing along the street. They wore no uniform Mario recognized, in fact they didn't seem to be wearing a uniform at all, except for a strip of red fabric across their upper arms. He spotted his daughter, Viola, talking with another young woman wearing such an armband.\n\nMario grabbed his daughter and spun her to face him. "Viola!" he shouted, "What's happening? Who are these people? Are we being occupied?"\n\nViola laughed. "No Dad, we've been liberated. Haven't you heard? There's a revolution."\n\n"What? Where?"\n\nViola gestured to the street around them "Here. You're in the revolution."\n\nMario scratched his head. "When did this happen?"\n\n"While you were sleeping."\n\nAs Mario walked the streets of his town, no festooned with red flags revolutionary slogans, he had only one thought on his mind."
 revolutionary_provisional_government.3.a: ""The revolution came, and I slept through it!""

 revolutionary_provisional_government.4.t: "Escaping the Sinking Ship"
 revolutionary_provisional_government.4.desc: "From his position at the top of the deck, Guido could see the crowd that was slowly gathering in front of their destroyer. The last time he looked, there had only been a few dozen people there, and no weapons to be seen. Now, however, he could see many rifles among the people, and it seemed like they were about to be pointed at him.\n\n"They're going to come for us soon." Guido said this with a distant yet gloomy look on his face. Italy was falling, there was no doubt about that. Whilst most avenues of communication were filled with rumors and half truths, it was obvious that nothing could be done to save the mainland. Most of the forces that were left were either giving up their arms and joining the revolution, or being destroyed in hopeless last stands.\n\n"Where will we go now?" Guido's second in command was almost crying as he forced out those words. For years, he had been employed by the PNF, and he simply couldn't imagine surviving without its protection.\n\n"I've heard rumors that an anti-revolutionary government is being set up in the south, but I wouldn't count on that. I think it's safest for us to travel even further south, and see if the colonies still function. Then, we can work out our next moves. I'll order the sailors to begin preparations to leave now.""
 revolutionary_provisional_government.4.a: "With any luck, they wouldn't be gone for long."

 revolutionary_provisional_government.5.t: "Preparing for Liberation"
 revolutionary_provisional_government.5.desc: "Angiolo looked over the detailed map of Northern Italy, and then looked up at his fellow officers. His regiment was one of many who would be participating in the liberation of the region from fascist remnants. Once the assembled militiamen had quieted down, Angiolo cleared his throat and began his speech, "Alright everybody, so we're here in Tarsogno," he pointed to a red X on the map located in Emilia-Romagna, "We're gonna be pushing south into Varzi, then onwards to Sestri Levante while liberating towns along the way, where we'll be meeting up with another regiment to take the city. From there, we'll advance along the coast, meeting up with more regiments at Genoa. From there we'll be among the regiments that'll be pushing west to Nice, where we'll be doing garrison duty for the rest of the operation's duration."\n\nOne of the officers, Carlo Pisani, brought up a point, "Isn't that going to leave us over-extended?"\n\nAngiolo shook his head, and began making sweeping motions across the map, "While our operation is ongoing, a whole bunch of other militias are gonna be sweeping across the rest of Liguria, Piemonte, and eventually Savoia. We're gonna overwhelm the disorganized fascists, and soon we'll be walking the streets, and they'll be hanging from lampposts. Now, all in favor?"\n\nAngiolo saw the majority of officers present had voted in favor, meaning the orders had been approved. Satisfied, Angiolo clapped his hands, "Since the vote's passed, that means we need to get moving people! Let's get our boys ready, we have a lot of marching to do."
 revolutionary_provisional_government.5.a: "O partigiano portami via..."

 revolutionary_provisional_government.6.t: "The Soldier Dances"
 revolutionary_provisional_government.6.desc: "Alfonso bore the name of 13 Spanish monarchs who had lived just across the sea, until Alfonso XIII had been deposed in 1931. Such association with regal men delighted his father, and probably would have his father before him, and two generations of fathers before. All soldiers, all fighters for the Savoy crown. Then there was Alfonso, and his world, crashing down around him. Sitting there, a numbness took him as he realized it all.\n\n"Alfonso." Whispered a voice to his left. It was a familiar, brotherly one, of a fellow soldier. A comrade-in-arms. A comrade in... more than arms. "We don't need to serve them anymore. They haven't just become alien to us, they were always alien to us. They lied and they continue to lie. They blamed our low morale in Algeria on insubordinate agents and subordinates, all while the sand blinded us. Our lives, sworn to protect the people of Italy, were thrown away in a war with people who only fought us in defense of their homes. The monied classes of the officers, who benefit from this colonialism, can fight their own wars for all I care."\n\nAlfonso felt a hand on his shoulder, and a second voice spoke. He had known all of this, he had endured the arid blizzards of Algeria like his comrades. But he had kept a stern, stoic face throughout it, befitting a soldier of Italy. Hearing those close to him confirm fears he had dismissed for so long... the state it produced was in was what the second voice wanted to remedy. "Come with us, brother. The revolution, the PCI, the Communists, the front, they all have our true interests at heart. We can defend the people instead of slaughtering them on the orders of a trumped-up landowner. Please."\n\nClarity took Alfonso. One last fight, one last struggle, so that he and his brothers could find peace in a new world. He stood up, clicked his gun into readiness, and simply said, "Shall we?""
 revolutionary_provisional_government.6.a: "The floor gives way."

 revolutionary_provisional_government.7.t: "The Southern Storm"
 revolutionary_provisional_government.7.desc: "The order went out at dawn. From the hills, thousands of militias of the Revolutionary Army descended on the villages of southern Italy. With rifles at the ready, charing banners declaring the end of fascism and the liberation of the workers and peasants, they moved in an overwhelming wave.\n\nOver the next weeks, news trickled slowly into revolutionary high command, as the outcomes of battles were reported. There was great tension, as the individual reports were slowly pieced together to paint a picture of the operations outcome. But the picture that was emerging was a promising one. As more and more of the map of the south was painted red, it became clear that the operation was succeeding. By the time the final report was compiled, nearly all strategically significant points outside of Napoli were in the hands of the revolution."
 revolutionary_provisional_government.7.a: "The countryside belongs to the people."

 revolutionary_provisional_government.8.t: "The Liberation of the North"
 revolutionary_provisional_government.8.desc: "Reports have returned from the militia's liberations of the North. Savoia, Piemonte, and Liguria were all eventually seized. However, it was not without difficulties.\n\nThe first problem was almost immediately present. There was an extremely, unexpectedly high fascist presence remaining in these territories, and they had prepared a defense against our militias. This alone would no doubt result in heavy casualties amongst our militias, but the uncooperative civilians in the region only compounded our issues further.\n\nWhile ultimately the plan was strategically successful, the liberation of Savoia, Piemonte, and Liguria was costly, and we've expended much more resources than we expected to. It is the opinion of our militia commanders that current leadership has been found lacking, and it is hard to disagree. We must use this experience as an opportunity to correct our mistakes, or our revolution may be killed in its cradle."
 revolutionary_provisional_government.8.a: "Not the kind of news we were hoping for."

 revolutionary_provisional_government.9.t: "The Liberation of the North"
 revolutionary_provisional_government.9.desc: "Reports have returned from the militia's liberations of the North. Savoia, Piemonte, and Liguria were all eventually seized. However, it was not without difficulties.\n\nThe first problem was almost immediately present. There was a significant fascist paramilitary presence remaining in these territories, although our militias did not find it to be insurmountable. Unfortunately, the people within these territories were not as cooperative as expected, and our militias sometimes found themselves opposed by the people they were supposed to be liberating. However, it should be noted that this experience was an outlier, and that most of the time the worse our troops encountered was simply indifference from locals.\n\nDespite setbacks and difficulties, the plan was strategically successful, and Savoia, Piemonte, and Liguria have been liberated from fascist tyranny. The plan went about as well as expected, and while there are potential improvements that can be identified, our militias achieved every objective given to them. Our militias are celebrating the victory, although there is still much work left to be done."
 revolutionary_provisional_government.9.a: "Good to see that the mission was a success."

 revolutionary_provisional_government.10.t: "The Liberation of the North"
 revolutionary_provisional_government.10.desc: "Reports have returned from the militia's liberations of the North. Savoia, Piemonte, and Liguria were all eventually seized by revolutionary forces. The mission was highly successful.\n\nThere was little fascist presence within the North, or at least our militias did not encounter much resistance. Most encounters ended with quick surrenders, or were resolved with few casualties. The civilians in the region were very cooperative, and often provided crucial intel to our militias, helping to minimize the threat that our troops would be ambushed or surprised by the enemy.\n\nThe liberation of Savoia, Piemonte, and Liguria had minimal casualties, and our militias have successfully rooted out the fascist presence in the region. Our commanders can find few areas in need of improvement, and the troops are celebrating their victories. Going forward, we must endeavor to replicate these results with future militia operations, and we are already recommending candidates for promotion."
 revolutionary_provisional_government.10.a: "Were things less hectic, celebrations would be in order."

 revolutionary_provisional_government.11.t: "Days of Destruction"
 revolutionary_provisional_government.11.desc: "Patrizio watched the embers fade, feeling nothing. When his column had started their march to the village, he had been jubilant. He had cried with his comrades to the peasants, told them of their liberation, expecting them to come out with rapturous joy and join them. That did not happen. Instead, they had been met with silence. And when they reached the village square, gunfire. The man next to Patrizio fell in the initial ambush, the blood spurting from his neck staining Patrizio's shirt.\n\nPatrizio had been in combat many times, against the army and the blackshirts. So, when he came around behind a man shooting at the main mass of his comrades, he fired without hesitation. But in the moment after, when he saw who he had shot, he was stunned. It was not the hardened fascist he had expected, been warned about. It was an old man, a peasant, with a rifle older than Patrizio. Patrizio heard his comrades moving forward behind, but he just stood, watching the light leave the man's eyes.\n\nThere were blackshirts in the village, a great many, but mixed with them were men like the one Patrizio had killed, peasants believed they were defending their nation and way of life from godless communists. In the end the blackshirts had dug themselves into three buildings, which had to be burned to finally flush them out. As Patrizio watched, he heard the crying of women and children, and the curses they threw his way. His commander stood by him, shaking his head. Apparently it was this way all over, at least according to the radio. Patrizio ignored him. He felt nothing, just stared at the embers as they died."
 revolutionary_provisional_government.11.a: "Revolution is not a tea party."

 revolutionary_provisional_government.12.t: "Night Watch"
 revolutionary_provisional_government.12.desc: "Patrizio gripped his rifle tight as he walked the darkened streets of the village. He walked past walls freshly marred by bullet holes, and occasionally by blood.\n\nThe assault on the village had commenced with the sunrise. Despite their initial calls for the people to come out and join them, to come grasp their liberation, the streets were empty, the homes boarded up. It didn't take them long to meet the blackshirts. The battle was little different than many that Patrizio had fought in the hills, and it made him somewhat grateful that the villagers had stayed inside, and spared the bloodshed. When the battle was won and the red flag raised in the village square, some did come out. Several older men came to speak with the column commander, evidently to inquire what the new situation would mean for the village. Some came and made conversation with the soldiers. But many stayed inside, and eyed the newcomers with suspicion. Patrizio expressed to his commander that he had expected a better reception, but he was told that this was about what had been expected.\n\nThere was talk of isolated blackshirts still lurking somewhere in the village, so night patrols had been assigned. As he walked his route, Patrizio caught sight of a girl, no older than ten, watching him from around a corner. He smiled at her and raised his hand to wave, but she dashed away before he could. He shrugged, and continued on his way."
 revolutionary_provisional_government.12.a: "They will see the light in time."

 revolutionary_provisional_government.13.t: "Liberation Day"
 revolutionary_provisional_government.13.desc: "The scene in the village square took Patrizio's breath away. On all sides were the peasants of the village, with rifles and shotguns and farming tools held without regard for military discipline. In the center, sitting uncomfortably in a chair flanked by two burly men, was aman in a fine suit. The column commander approached one of the men standing over him. "Who is this?"\n\n"He is the padrone."\n\nPatrizio would remember their entrance into the village as a euphoric moment. When they approached, shouting their cries of liberation, the people had come out to meet them. They greeted them with cheers, took their hands, kissed them. They warned them where the blackshirts hid, few that there were, most having fled in the night when they felt the people turning against them. They had led the liberators here, where, having been caught attempting to flee, was the padrone.\n\n"what should we do with him?" a woman asked. The commander turned to the crowd. "Let's put it to the people. What shall we do?"\n\n"Kill him!" "I worked years for him I can never get back!" "Down with him like the king!" "My son lost an arm in one of his damned threshers!" "Death to the padrone!"\n\nPatrizio looked at him. The man looked so small, not even cringing as the people who yesterday had been his inferiors called for his death. As the cries for execution continued, Patrizio raised his hand. "Wait! How can you kill the padrone? The padrone is dead."\n\n"What are you talking about? I can see him right there."\n\nPatrizio reached into his coat and brought out the papers he kept next to his heart, the revolutionary declarations, of factories to the workers and land to the peasants. "It says so right here. The people's government has killed the padrone, killed all the padroni. This," he gestured to the slouching figure in the chair, "is just a man no more or less worthy of life than any other man. He is not the padrone. He's just here to remind us that the padrone is dead."\n\nAt first there was silence, then a chant began in the crowd, a few at first, and then everyone. The people began to jump and as they chanted, they even shook the hands and shoulders of the man in the chair, who was not the padrone. The chant echoed through the countryside."
 revolutionary_provisional_government.13.a: ""The padrone is dead!""

 revolutionary_provisional_government.14.t: "City of Steel"
 revolutionary_provisional_government.14.desc: "Every road over the plain bends toward the forest of chimneys at Milan. To hold the Po valley and to claim legitimacy in the eyes of the peninsula, the Republic must enter that city and be welcomed by its workers. The ELN formed a proper column with sappers and a signals train. The Guardie Rosse dispersed through the suburbs where committees already counted machine tools and carbines as carefully as communion wine. Sesto San Giovanni stood ready as the anvil on which the city would be taken.\n\nThere was more at stake than streets and stations. For centuries conquerors proved their title by ruling Milan. The Republic would prove a different claim. If the red flag rose over the square and the trams rang under our notices, no banker could deny where power now resided and no foreign chancery could pretend not to hear." 
 revolutionary_provisional_government.14.a: "To the foundries and the forums."

 revolutionary_provisional_government.15.t: "See Naples and Die"
 revolutionary_provisional_government.15.desc: "Naples sits where the sea and the volcano judge patience. The city is a maze of courtyards where a shout can find a thousand friends. We go to the port and the railheads first. Then into the quarters with guides who know which stairwells to avoid and which doors will open if we speak softly. Students come down from the hills with stretchers. Dockers carry crates as if they were icons. Fishermen bring us news from the islands before any signalman can tap it out.\n\nIf the South is to break with its old masters, it will begin here. Take the arsenals. Secure the stations. Speak to the market women as if they were ministers and to the priests as if they were mayors. Promise bread and keep the promise by nightfall." 
 revolutionary_provisional_government.15.a: "For the South and the Republic."

 revolutionary_provisional_government.16.t: "City of Steel — Heavy Casualties"
 revolutionary_provisional_government.16.desc: "The advance broke against interlocking fire at Porta Romana and again among the freight lines beyond Lambrate. In Sesto the yards became killing grounds when armored cars forced the gates. Volunteers burned in a siding when a shell found their wagon. By evening we held a patchwork of stations and powerhouses, and the lists of the dead ran far beyond what the censors could ever have hidden.\n\nThe priests came to the wards and blessed men whose hands still smelled of cartridge paste. Milan did not bow, yet it swayed. We can finish this tomorrow. The price will be written in streets that will remember our names for the right reasons and for the wrong ones." 
 revolutionary_provisional_government.16.a: "Count the names and advance."

 revolutionary_provisional_government.17.t: "City of Steel — Moderate Casualties"
 revolutionary_provisional_government.17.desc: "The first assaults took the powerhouses and split the tramlines. Barricades rose at Greco and fell again before noon. Some barracks surrendered after one warning. Others had to be emptied floor by floor. By night the square around the cathedral lay under a flag of truce. Tomorrow we will press inward through districts that already treat our order sheets as law. Men who wore the cockade yesterday brought their rifles to our posts after dark and asked only for a receipt." 
 revolutionary_provisional_government.17.a: "Hold the lines. Push at dawn."

 revolutionary_provisional_government.18.t: "City of Steel — Light Casualties"
 revolutionary_provisional_government.18.desc: "The whistles became our trumpets. Strikes rolled into occupations and the gates opened from the inside. Telegraph offices unlocked their doors and asked for guards rather than orders. Tram crews parked their cars across the boulevards and handed us the handles. The ELN command post at Sesto sent couriers to neighborhoods that were already red by sunset.\n\nThe bankers drove for the lakes. The police chief sent a nephew to arrange his departure with dignity. Milan belongs to the Republic in everything but proclamation, and that omission will be corrected at once." 
 revolutionary_provisional_government.18.a: "Raise the banner over the square."

 revolutionary_provisional_government.19.t: "See Naples and Die — Heavy Casualties"
 revolutionary_provisional_government.19.desc: "The long road by the sea bristled with wire and guns. In the Spanish Quarters the alleys closed behind us and every balcony became a loophole. A magazine near the docks went up and left the afternoon full of dust and choking fire. By evening we held the cranes and the customs house. Whole blocks lay in darkness. The hospitals bled into the streets and the city wailed without shame.\n\nNaples will fall. It will ask its price in full. The Republic will pay and will remember." 
 revolutionary_provisional_government.19.a: "Carry the wounded. Press the attack."

 revolutionary_provisional_government.20.t: "See Naples and Die — Moderate Casualties"
 revolutionary_provisional_government.20.desc: "Barricades rose at Piazza Garibaldi and broke before noon. Dockers slipped into our ranks when foremen vanished. A police company stacked rifles after the crowd sang the song the city keeps for the day the air changes. The climb to San Martino and Sant’Elmo cost time and blood. When the guns there turned to face the bay for us, the lower quarters began to breathe again. Naples bends rather than breaks, and men who have been told to suffer now look each other in the eye." 
 revolutionary_provisional_government.20.a: "Secure the heights. Calm the quarters."

 revolutionary_provisional_government.21.t: "See Naples and Die — Light Casualties"
 revolutionary_provisional_government.21.desc: "The port yielded with hardly a shot. Railway men misrouted troop trains with accidents that took all afternoon to remedy. Parish priests walked at the front of processions with white cloths so that no one would fire past a church door. By sunset the market stalls stood open under new flags. Commissars posted notices in careful handwriting that promised bread, work, and a council for every neighborhood that could elect one by tomorrow." 
 revolutionary_provisional_government.21.a: "Announce ration and relief."

 revolutionary_provisional_government.22.t: "The Eternal Reward"
 revolutionary_provisional_government.22.desc: "Italy believes a government only when Rome can hear it speak. Columns moved along the old consular roads while cells inside the walls prepared the neighborhoods to greet them. In San Lorenzo the same hands that made bricks stacked them into barricades. In Trastevere old men taught young ones which stones in the street could be lifted and where to leave them. The timid wrote of neutral zones. The bold underlined the bridges.\n\nTake the crossings. Silence the barracks that cling to the Fascist past. Leave the forums untouched so the world can see who walks there now. The first duty of the Republic in its capital will be to feed and to restrain. If we can do these two things in Rome, the rest of Italy will believe everything else we say." 
 revolutionary_provisional_government.22.a: "On to Rome."

 revolutionary_provisional_government.23.t: "The Eternal Reward — Heavy Casualties"
 revolutionary_provisional_government.23.desc: "We broke the belt at Tiburtina and found every wide avenue prepared for killing. The garrison was better supplied than rumor. Guns spoke from the EUR while stretcher bearers crouched across open squares. Fires licked the edges of working streets as families fled with what they could carry. Even so, the bridges changed hands by night and the first partisans reached the Capitoline steps. Their banners were torn. Their voices were cracked. Their will did not falter." 
 revolutionary_provisional_government.23.a: "Mourn, then finish the work."

 revolutionary_provisional_government.24.t: "The Eternal Reward — Moderate Casualties"
 revolutionary_provisional_government.24.desc: "San Lorenzo fell block by block. The Tiber was crossed under smoke. Some regiments that swore to the crown yesterday slipped into the dark rather than die for a cabinet that had already fled. Others fired until their belts were empty and then asked for terms. By morning the bells rang over a city that could not decide whether to cheer or to weep. The Provisional Government will begin to govern at once because Rome does not wait for theory." 
 revolutionary_provisional_government.24.a: "Seat the guards. Post the notices."

 revolutionary_provisional_government.25.t: "The Eternal Reward — Light Casualties"
 revolutionary_provisional_government.25.desc: "Rome opened as if a door had been left on the latch. Clerks remained at their desks and the tramlines still hummed when our advance reached the river. A colonel handed over his keys and asked that his sergeants be spared humiliation. The crowds around the columns did not demand vengeance. They asked for bread and for a government that would keep its word.\n\nWe can meet those requests. Call the Assembly to the city. Make the Republic flesh." 
 revolutionary_provisional_government.25.a: "Proclaim the People’s Government."
 
 revolutionary_provisional_government.26.t: "Revolutionary Glitter"
 revolutionary_provisional_government.26.desc: "Those Blackshirts were not meant to be here. Crispino Alfonso knew all the names of the local ones. Both he and they were locals of the Calabrian city of Catanzaro, after all. They had all melted away, what with their Fascist support gone, and threats from militant peasants. But here these ones were, all the same, marching around brazenly in their black uniforms, Crispino spotted those following them: some un-uniformed local Blackshirts. One man led them all. A man without a hand.\n\nThe fiery man ranted at the confused locals. This Kingfisher, this castor-oil man of Fascism, had come to free them. To bring true revolution, as opposed to the Judeo-Communist conspiracy. Or so he kept saying, over and over again. Pamphlets were handed out, titled 'Republican Fascism', the 'Liberalism of the Old Regime', and 'Fascist Syndicalism'. He chuckled: The barely-captivated audience was more bemused than impressed that words were being delivered instead of death. When the Blackshirt came to his, what had to be 4th, mention of the Germans, someone in the crowd protested, and silence fell.\n\nEverything began moving. Hearing the insult, the leader had frowned, made some blusterous declaration about a new Revolutionary Government, and stormed off. The Blackshirts with him had moved into the crowd as their leader disappeared, shouting for the panicking bunch to make way. The Blackshirt barking was being drowned by the crowd, who were successfully pushing them back, as Crispino made his way out of the mob. Seeing the leader turn a corner, Alfonso made after him, stopping. Catching some brief words as he hid, regarding the city's port, traitors, remnants, and radio stations, the rumbling of the Kingfisher's truck soon became distant. Crispino dashed home, and to his secret radio with his Communist handler. The informant panted out that Blackshirts were headed north, towards the Pollino Mountain range. Farinacci was going north."
 revolutionary_provisional_government.26.a: "Be prepared."
 
 revolutionary_provisional_government.27.t: "Ballots of the Old Guard"
 revolutionary_provisional_government.27.desc: "The Assembly gave the first slate to the veterans who had never left the line. Delegates from Sesto San Giovanni and the Ligurian docks spoke without ornament, their ledgers open on the bench beside them. They recalled safehouses kept alive for twenty years, strike funds that fed families through winters, and couriers who crossed frontiers so that Italy would not forget it still had friends.\n\nPietro Secchia’s partisans promised a government with a soldier’s backbone and a partisan’s memory. The ELN would be drilled until it could take a station and keep it. Commissars would guard discipline without cruelty. The revolution would be spread where possible and defended where necessary, with enough bread for the city and enough coal for the rail. A state is more than a shout, they said. It is a habit of keeping one’s word. :contentReference[oaicite:0]{index=0}\n\nOnorato Damen’s delegates answered with the catechism of Livorno. The republic must live in the councils themselves, not above them. Factories would elect committees that truly command production. Parties would serve as organs of thought, not masters of the people. To accept the old institutions would be to teach the next tyrant how to rule. The room quieted at the last line. Better to wait a year for a clean victory than to gain a month by compromise. :contentReference[oaicite:1]{index=1}\n\nUshers carried wicker baskets down the aisles. Ballots folded and fell into place. Outside, the porticoes swallowed the murmur of a city that already judged the speeches before the count was finished."
 revolutionary_provisional_government.27.a: "Pietro Secchia"
 revolutionary_provisional_government.27.b: "Onorato Damen"

 revolutionary_provisional_government.28.t: "The New Left Presents Its Standard"
 revolutionary_provisional_government.28.desc: "When the second slate rose, the galleries filled with students, printers and stewards from occupied plants. For once the Intelligenzia and the shop floor cheered together. The candidates could not have been mistaken for anyone else.\n\nGiangiacomo Feltrinelli’s supporters spoke of printers’ ink as a weapon and of a network of friends from Paris to Prague who would answer a careful knock. A republic that could speak many languages would barter paper for wheat and machinery, would host exiles who paid their keep with skill, and would make the radios tell Italy’s story rather than swallow someone else’s. To publish is to feed, they said, and to feed is to govern. :contentReference[oaicite:2]{index=2}\n\nAntonio Negri’s backers answered with the cadence of an assembly. Power would flow from those who control their time at the bench and at the desk. Councils must set the agenda and the state must defend without smothering. Schools would become workshops for citizens, factories would become schools for free men and women, and theory would be proven by what changed in a week, not in a lifetime. The hall kept its applause until the speaking ended and then gave it freely. :contentReference[oaicite:3]{index=3}\n\nScrutineers moved down the rows, baskets filled again, and the chair marked the second tally with a slow pen."
 revolutionary_provisional_government.28.a: "Giangiacomo Feltrinelli"
 revolutionary_provisional_government.28.b: "Antonio Negri"

 revolutionary_provisional_government.29.t: "Councils and Cathedrals"
 revolutionary_provisional_government.29.desc: "The third slate brought parish stewards into the well of the chamber. Banners of Genoa’s street missions leaned beside the flags of university circles that read scripture and Marx on the same page. No one laughed. Everyone listened.\n\nFranco Rodano’s delegation spoke of bridges built in catechism rooms while the police watched only the factory gates. A state of councils could be legible to the faithful without lying to them. The ICS and the ACLI had taught the poor to keep books, to feed queues with fairness, and to turn charity into justice. A republic that could speak in church as well as in the yard would not need to shout. :contentReference[oaicite:4]{index=4}\n\nThen the doors opened for Don Andrea Gallo and the people he never told to be quiet. They marched in their own clothes, the underclass that cities learn not to see. Gallo’s homily was brief. A country that refuses its poorest refuses itself. Credentials were issued at once, and the chamber understood what it would mean to have a shepherd at the head of a state of councils. The tally clerks sharpened their pencils and the third count began. :contentReference[oaicite:5]{index=5}\n\nIn the corridors, priests spoke with commissars as if they had done so all their lives. The Assembly had learned a new kind of silence, the kind that comes before consent."
 revolutionary_provisional_government.29.a: "Franco Rodano"
 revolutionary_provisional_government.29.b: "Don Andrea Gallo"

 revolutionary_provisional_government.30.t: "The Mandate of the Assembly"
 revolutionary_provisional_government.30.desc: "At last the boxes stood empty and the table covered in neat piles. The tellers called numbers in a clear voice while clerks marked them down with steady hands. Outside, Bologna waited beneath banners strung between lamps and laundry lines. Inside, the chair rose and read the name that would be written into the first decree of the Provisional Government.\n\nThe hall applauded and then returned to work. Orders had to be signed for bread and coal. Districts had to be assigned to the Guardie Rosse and the ELN. Messengers had to ride before dawn with seals for committees that would keep the neighborhoods calm. A leader in this republic is not a crown. A leader is a promise. The councils will not be left alone. The state will have a face when it must speak to enemies. The revolution will endure when the streets go quiet. :contentReference[oaicite:6]{index=6}\n\nIn the minutes the chair noted the result and the obligations that followed it. The Assembly had chosen a name. The people would now judge the work that name would do."
 revolutionary_provisional_government.30.a: "Pietro Secchia"
 revolutionary_provisional_government.30.b: "Laura Conti"
 revolutionary_provisional_government.30.c: "Onorato Damen"
 revolutionary_provisional_government.30.d: "Antonio Negri"
 revolutionary_provisional_government.30.e: "Giangiacomo Feltrinelli"
 revolutionary_provisional_government.30.f: "Arrigo Cervetto"
 revolutionary_provisional_government.30.g: "Don Andrea Gallo"
 revolutionary_provisional_government.30.h: "Franco Rodano"
 revolutionary_provisional_government.30.i: "Livio Labor"

 revolutionary_provisional_government.37.t: "The Street Priest's Flock"
 revolutionary_provisional_government.37.desc: "The doors of the assembly swung open, admitting the latest group to arrive at the doorstep of the revolution. At its head marched Don Andrea Gallo, the renowned priest of the sidewalks. Behind Gallo was his congregation, bearing the banner of the Revolutionary Committee of Genoa. As Gallo's followers entered, many of the delegates' trepidation turned to outright skepticism. Among the renegade priest's followers, beneath the banner of the revolution, marched all manner of Italy's forgotten including addicts and vagrants.\n\nThough their revolutionary credentials could not be contested, their crassness, or more charitably lack of erudition, rubbed many of the delegates, soberly dressed in clean suits, the wrong way. As the delegation representing the Genoa committee waited for their seats to be confirmed by the general committee, whispers of whether to even recognize them spread throughout the hall. For a moment, the revolution seemed to hold its breath.Then, Don Andrea Gallo spoke.\n\n"My friends, I understand that we may seem out of place perhaps, here in the halls of power. I believe however that if we are to be true to the liberating spirit of the revolution then we must ensure that all of Italy is represented. I have heard it said that nothing is born from diamonds, but flowers bloom from dung."\n\nGallo's brief homily had its intended effect, shame overtaking the classist instincts of the more recalcitrant delegates. One by one, the members of Italy's underclass were given their credentials, entering the chamber as equals and bringing a truly unique perspective to politics, one born of lives of pure hardship and deprivation rather than engagement with left-wing theory and social critique."
 revolutionary_provisional_government.37.a: "The voiceless claim their voice."
 
 revolutionary_provisional_government.40.t: "The Eternal Battle"
 revolutionary_provisional_government.40.desc: ""First Lieutenant Raffaele, report." Ettore and his men faced a bleak situation. All he knew was that where there were only pockets of Bolshevik activity, now there were only pockets of friendly space. That's all he needed to know. Harassed for weeks by shadows in the forests, and now cut off from high command, he was nevertheless determined to fight.\n\n"Squad at full capacity. No enemy sightings for 5 hours."\n\nThe old soldier sighed."That will not last. I will address the troops."\n\n"Sir. Patrol... Halt!" The sergeant acknowledged, before turning to bark at his men, causing the splatting of feet on mud to die down. "Present arms for Major Ettore!" Said arms clinked forward.\n\n"We face, our bleakest hour. The odds of victory dwindle by the day. But we are resolute in the face of an abhorrent enemy. An enemy, that gives no quarter. Will we diminish?"\n\n"No sir!" They half-heartedly came back.\n\n"Will we yield?"\n\n"No sir!" They shouted, stronger, more fire in their bellies. Good.\n\n"How do true soldiers of the Crown face the enemy?" The gruff voice of Raffaele was heard.\n\n"Eyes forward! Guns forward! Weary of flanks! Weary of ambush!"\n\n"Stay alert, the enemy could attack at any second.""
 revolutionary_provisional_government.40.a: "They didn't last the day."
 
 revolutionary_provisional_government.41.t: "Woodland Justice"
 revolutionary_provisional_government.41.desc: "General Pietro Corsini frowned as he and his men marched through the woodlands of Central Italy. When assigned here, he had assumed it would be a delight-trees around him old enough to remember Julius Caesar, humbly assigned to attend them all those years ago. Perhaps, he had thought, the place would give him good luck, as it had Caesar. Now, it was his third week, and he hated it. He hated everything. His colleagues beat their chests proudly at every defeat of the Partisans. He could see the loss of skilled, professional soldiers, a finite supply thrown down a bottomless hole with no hope of plugging it. Thus, he had resolved to visit small towns in the area.\n\nThe General was being watched. The invisible eyes, lurking in the darkness, had noted these visits. They were unsure if he was working the hearts and minds of the villager, or locating those areas that had harbored the abomination. The scourge the General was tasked with exterminating. In truth, it didn't really matter either way.\n\nCorsini paused, registering that the trees about him could serve as a perfect partition between his unit and an outside force. Then, just like that, the Partisans set upon them, swarming about like ravenous hornets. His men fought well, that much he predicated, that much he could tell in the swarm of chaos and confusion. They weren't going down without a fight, quickly responding to the ambush, turning outwards with their weapons as the first surprise volley came upon them. Through each passing of dust, of the smell of dirt and flowers, his number was depleting. Pathetic Communists became merciless reapers, gunning down his men like a farmer would harvest cops: With gusto. Pride for his men gave way to dread. His life, just like his pride, and just like his unit, was fleeting. The Partisans stood proudly over their work. Robin Hood was reborn, and he had done a good day's job defending the people from Monarchist reprisal."
 revolutionary_provisional_government.41.a: "A much-needed victory."
 
 revolutionary_provisional_government.42.t: "Old Soldiers"
 revolutionary_provisional_government.42.desc: "The young fought in wars. The old? Their was lot to wait and see, and suffer whatever outcome awaited them. One such waiting place, a bar, was particularly tense. A club of retired soldiers of a sort. Not all had fought on the same side. Then, something miraculous happened. A man, his face worn and grey, still wearing the Royalist patch of a Brigadier General, went to sit with an old partisan of the Second World War.\n\nThe chair creaked as the Brigadier sat in it. He silently poured both of them a drink as the Partisans stared at him, coldly. "To absent friends. I recall something my father once said to me on the day I told him I was going to join the army. Allistair, he said, in the field of battle there are old soldiers, and then there are bold soldiers. Very few old bold soldiers. I didn't know what he meant at the time. That's the thing, you see, wear the uniform long enough, and the truth of that, what we do, oh, it takes its toll. On those of us left behind. And those of us not."\n\n"I knew a fellow. Bold chap. He and I were quite alike in many ways. Both willing to risk their lives for their friends and the greater good. Both equally adept at ignoring the rules when it suited us. I'd take a bullet for him. He's gone now though. I made a hard decision in Greece. I identified a threat, and I eliminated it. That's what soldiers do, make the hard choices in the name of defense. He... he didn't like that. After a rather frank exchange of opinions, he stormed off. Joined the Partisans. I wonder, which of us was the bold one. The one who left, or the one who stayed. It terrified me, that notion that I might kill him. Or... already have. I imagine I'll see him again when I least expect it." He looked sadly at the Partisan, barely recognizing his old friend. "Changing, and yet, changeless. Like the seasons. I wouldn't want his forgiveness. Just a drink. To absent friends, comrades in arms. To old soldiers.""
 revolutionary_provisional_government.42.a: "A toast."
 
 revolutionary_provisional_government.43.t: "The Italian Paradox"
 revolutionary_provisional_government.43.desc: "Roberto Farinacci had been abandoned. Alessandro Pavolini was gone, and still, they had abandoned him. These were the words he had written to his dear friend. Perhaps the only person he could call a friend without lying. Roberto wanted to punch himself with the hand he still had. There had existed no allies more loyal to Germany than him. With the stubbornness of Italo Balbo, the will of Pavolini, the fire of Muti, and none of the fame, he had stuck by his guns. A louder voice for Italo-German friendship did not exist. He deserved more than this, to wait endlessly for a response to his pleas for aid.\n\nHis routine of self-pity in his safe house in Salerno was interrupted. There was a knock at the door. Roberto jerked up, alarmed at the possible danger. There were too many names here, too much information collected from his communications with Fascist remnant forces. If they were captured...\n\nAgain, his train of thought was interrupted, and expectations defied. There was no partisan scourge, no firing line on the other side of the door, just the face of a priest. The face of a friend.\n\n"Don Tullio Calcagno," Farinacci said, straightening his black shirt, "it is good to see you. You should not have come, however. I regret that I brought you all this way. When I wrote the letter I was not... of the best mind. I was a fool to think myself not the purest expression of Italy, seeing the true value in Germany. You can stay and help, if you wish."\n\nThe Don just smiled, and asked:"
 revolutionary_provisional_government.43.a: "How have you been?"
 
 revolutionary_provisional_government.44.t: "Confessions"
 revolutionary_provisional_government.44.desc: ""Why haven't you discarded your Blackshirt uniform?" Tullio started. "Or hidden the fact your hand is missing? If a Bolshevik milita didnt recognize your face, they'd certain recognize that. Is that why you've come here, Roberto? To be lynched?  If you don't care what the rabble thinks, then whose opinion do you care for? Berlin's? What about what you think?"\n\nFarinacci scoffed. "I cared not for the rabble in 1920. I care not now. This uniform, it still means something. It means I still have something left to serve, even without a Party or Duce. A hope, one I have had for some time, my friend. The hope for German brotherhood! Serving Fascism was never enough. I need something stronger. The National Socialists, they changed everything, can't you see? A total transformation of society, a great militeristic order that has swept aside Europe. All this time, I have only cared to see the two eagles rule, together. This uniform, this scar, they are reminders of that brotherhood, with the Gestapo and Germany's own scars."\n\n"Can't you see?" He threw back at his friend. "They don't see a brother in supremacy, they see a subhuman imitation of Aryanism. They can ask you for help, give you what you want, but you'll never have their respect. Never have their love. You're not deluded, you know the truth. You know what became of Vlasov's ROA. You know, that even if you win, your name will only rise from obscurity to infamy. Why not find happiness? I have a way to Iberia. Come with me, Farinacci. Start anew."\n\nNo word of disagreement was made as Roberto's friend left. He had once been rabidly anti-Austrian. How could someone capable of such change feel utterly unable to do so again. His hand found a letter delivered this morning. Reading it, his eyes widened and smile grew. The Germans had gotten back to him, and promised support to any rebellion he might launch. He was needed, at last."
 revolutionary_provisional_government.44.a: "The cycle begins."
 
 
###=====|c) Leader Intros |=====###
  ITA_RED_leader_intro.1.t: "The Cadre’s Ledger"
  ITA_RED_leader_intro.1.desc: "The first dossier is thin on adjectives and heavy with numbers. Pietro Secchia kept people alive during the years when survival required accounting. In exile he wrote to comrades who never used their real names. In the ports he balanced ledgers of bread, cartridges, and favors as if they were the same currency. When the MCdI rebuilt itself inside Italy’s shadows, his couriers learned to carry two messages at once: the one in the envelope and the one in the route taken to deliver it.\n\nTo Secchia the revolution is not a mood. It is a chain of supply, a drill that begins before dawn, and a promise that a unit holding a crossing at noon will have soup by evening. The ELN is a tool that becomes sharp only through work. Commissars are to guard discipline without cruelty. Bureaucrats are to count honestly so the counting can be believed. Abroad, he imagines a ring of comrades and cautious friends that can be persuaded to feed the engines until Germany hesitates. At home, he favors a rapid build-up of heavy industry and a staff culture that records everything. His people call it sobriety. His enemies call it patience. The Committee calls it reliability, which is the beginning of power."
  ITA_RED_leader_intro.1.a: "Note the man and his method."
  
  ITA_RED_leader_intro.2.t: "Capital, Work, and Ecology"
  ITA_RED_leader_intro.2.desc: "Conti had spent the last few days with her fellow revolutionaries, all of them working to further the potential revolution so many of them saw brewing within Italy. Conti felt like she had written more words in the past few weeks than she had in her entire life before the fascists had been ousted.\n\nConti made sure to emphasize both the class struggle of the proletariat, alongside the ecological damage that fascism had brought upon Italy's ecology.\n\nA large part of her dual message was through metaphor. One pamphlet template featured art showing the jackboot crushing pristine forests, another emphasized the scars Italy possessed from decades of corporatism, both on its people and its land. She tried to convey that for every bit of damage that fascist corporatism did to Italy's landscape, that the people of Italy suffered. She reported tragic stories of toxic clouds poisoning rural villages, of smog slowly engulfing urban regions, and of beautiful landscapes paved over to make way for factories that continued to overwork and kill more and more workers every year.\n\nShe wrote at length about how corporatism was one of fascism's greatest evils, and that the solution was for workers to organize and fight back. She called for the creation of worker councils, commencing strikes, and seizing control of the task of organizing production"
  ITA_RED_leader_intro.2.a: "In times like these, it is important to act and operate."
  
  ITA_RED_leader_intro.3.t: "Never a Moment's Rest"
  ITA_RED_leader_intro.3.desc: "Onorato Damen practically fell into the chair at his desk. It had been a long day of organizing strikes and protests against the reactionary government that had taken control of Italy. His throat was hoarse from shouting commands and leading chants, his legs were sore from running around all day, and he could've sworn his clothes had gotten lighter over the past few weeks.\n\nHowever, despite his physical exhaustion, his mind was as energetic as ever. While some of his colleagues may have felt content to watch events play out, such as his ideological mentor Bordiga, Damen simply couldn't peel himself away from activism. Even night's fall did not mean Damen was sitting idle, instead it meant he simply needed to turn to a different form of activism.\n\nHe snatched his pen up and took the top pamphlet off a stack of papers folded in advance. He then set to writing pamphlet after pamphlet, espousing the many tenets of left communism, advertising the PCI, and arguing in favor of revolution against the King's government. The next morning, these pamphlets would be handed off to a PCI member, and distributed across all of Italy.\n\nDamen worked late into the night, before allowing himself a short bout of sleep before another long day of strikes and activism. Even if Damen had to bring the socialist revolution that he so desired into fruition by himself, he would gladly do it. The revolution was inevitable, and Damen was ensuring that it would come about as soon as humanly possible."
  ITA_RED_leader_intro.3.a: "If activism was an illness, Damen didn't want to be healthy."
  
  ITA_RED_leader_intro.4.t: "From the Chaos and Carnage, New Voices"
  ITA_RED_leader_intro.4.desc: "The university was locked down. Barricades were put in place on the roads, doors were locked, and students roamed, armed with both weapons and uncertain conviction.\n\nOn the main plaza, three men stand on a stage as others hand out red pamphlets. The leaflets are passed throughout the crowd, ending up both in the hands of the frightened as well as the fanatical.\n\nOne of the men, Franco Piperno, moves off the stage to ensure the lockdown remains in place. Government forces have been rumored to have entered town, and if they wanted a fight it would need to be met with resolve. The university would be defended and organized. The fascists would be held off.\n\nAnother of the men, named Oreste Scalzone, begins urging calm and unity of all those present. Some of the students were agitated, nervous for their lives and their families, while others seemed eager to be out on the streets. His loudspeaker cracks, and the sudden sound only brings more excitement to those gathered.\n\nAt this critical moment, the third man grabs the microphone and steps forward.\n\n"I know that this state of chaos has created much anxiety! I know there is little certainty for the future! But tell me this; what better circumstance is there for the new generation to take the reins? The old men in charge have failed us, but the old order has collapsed as a result!"\n\n"I am Antonio Negri, and if you take up arms and join me and Quaderni Rossi in euthanizing the remnants of the oppressive system, I can guarantee that it will be us that rebuilds society anew. It will be us that retributes the sins of our fathers!""
  ITA_RED_leader_intro.4.a: "Non c'è da perdere che le catene e c'è un intero mondo da guadagnare."
  
  ITA_RED_leader_intro.5.t: "Ink and Wires"
  ITA_RED_leader_intro.5.desc: "Printers’ ink dries to a skin that does not rub off. Feltrinelli’s people wear that stain with pride. They learned to make a press sing in a cellar while a patrol passed in the street. They learned which foreign doors would open to a careful knock and which radios would listen when Italy spoke in more than one tongue. A publisher who knows the price of paper learns the price of everything. During the twilight months he turned pamphlets into passports, contracts into crates of medicine, introductions into silent guarantees of credit.\n\nFeltrinelli imagines a republic that speaks many languages without forgetting its own. Manuscripts pay for machine tools. Hospitality for exiles purchases skills the factories need. The Intelligenzia trusts him because he prints their words and gets them read where it matters. The Guardie Rosse trust him because those words arrive in the right hands at the right hour. COMINFORM respects the address book as much as the arguments it contains. He promises a state that can tell the truth clearly enough to gather friends and then make that sympathy do work for hungry streets. A government that can publish with precision can also move freight with precision. In his theory, both are the same craft."
  ITA_RED_leader_intro.5.a: "Mark the man of letters and logistics."
  
