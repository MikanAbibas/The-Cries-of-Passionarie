 ITA_RED_midnight.1.t: "The Founding of an Army"
 ITA_RED_midnight.1.desc: "The underground meeting hall of the Communist Party was abuzz with a thousand conversations as revolutionaries traded reports, rumors, and speculations. Luigi Longo beat his fist on the table at which the party leadership sat, silencing the room and drawing all eyes to him, with only a few whispered conversations continuing.\n\n"Comrades, details can be exchanged later, but we all know the general situation. Umberto’s government, whatever its promises, has continued the repressive policies of the fascists. They have refused all petitions, rejected all compromises. However, that does not mean that the situation is unchanged. The ousting of the fascists has produced greater instability than our country has seen in forty years. It is a situation we must take advantage of. If the King and his government will not see reason peacefully, then we have no choice but to intensify the armed struggle. Our militants must be transformed into a true revolutionary army. I propose a motion to organize and expand such an army. Any opposed?"\n\nNo one spoke.\n\n"With no objects, the motion is carried by assent." The scratching of pencil on paper echoed as the meeting secretary furious wrote the vote into the minutes. "Now, we must decide who will chair the committee overseeing our new army. I call for nominations."\n\nAfter a few minutes of whispered conversations, two candidates were nominated and seconded: Pietro Secchia, Longo’s neighbor at the leadership table, and Giorgio Amendola, a well-known resistance fighter. Scraps of paper were distributed, on which the delegates wrote their votes. When they were gathered and counted, a winner emerged:"
 ITA_RED_midnight.1.a: "Secchia, the hardline commissar."
 ITA_RED_midnight.1.b: "Amendola, the coalition-builder."
 
 ITA_RED_midnight.2.t: "Inevitable Organization"
 ITA_RED_midnight.2.desc: "The country was in chaos, the economy was falling further and further with each passing day, and it was clear the government wasn't going to be able to fix it. Giulio figured it was inevitable that it would fall to workers to organize in order to protect themselves.\n\nA few weeks back, the workers in the factory he worked at had decided to form a workplace committee in order to help the workers survive the crises.\n\nIt was a union in all but name, and Giluio chalked up the fact they hadn't been scattered by Carabinieri to the government being stretched too thin to afford the troops to do so.\n\nUnsurprisingly, their workplace committee had become a hotbed for political organization, and representatives from all sorts of underground organizations would visit and try and persuade them to their side.\n\nOne such organization was the "Istituto Sociale Cristiano." They weren't the biggest, but they stood out from the typical socialist and Christian organizations that visited by being both. Their representatives shined the most when radical and conservative representatives from other organizations were busy mudslinging. They'd mediate between the two, keeping the meetings' flow from grinding to a halt, even if neither side was very happy with the compromises most of the time.\n\nAll that politics stuff sort of flew over Giulio's head, but they seemed like decent enough people."
 ITA_RED_midnight.2.a: "And that made them better than most who came parading through."
 
 ITA_RED_midnight.3.t: ""
 ITA_RED_midnight.3.desc: ""Hey, Luca, did you hear the news?" Flavio burst into the butcher's shop, the bell ringing as the door was hastily swung open. Luca recognized Flavio when he got like this, and usually this meant he'd spew some absurd tall-tale that had fallen off the rumor mill. He shrugged nonchalantly and continued his work, which Luca took as his cue to continue, "Communist rebels have captured a government outpost up in the mountains!"\n\nFlavio raised an eyebrow, even for Luca that was a bold claim. Antonio, a regular visitor to the shop, scoffed at the rumor. Luca wheeled on him, "It's true! I hear the rebels killed an entire regiment of Carabinieri."\n\nAlessio, whose pork was getting increasingly delayed by the discussion, chimed in, "I don't know who told you that nonsense, it was just a platoon, and they were captured. Not killed."\n\n"Alessio, are you serious? They really captured an outpost?" Flavio had to ask, make sure his ears weren't lying to him.\n\n"It's what's being said, although you didn't hear it from me. I hear the government's been clamping down on anyone who so much as thinks about mentioning it," Alessio shot a glare at Luca as he spoke.\n\nFlavio's curiosity still got the better of him though, and he had to ask, "...Right. Regardless, who are these rebels, anyway?""
 ITA_RED_midnight.3.a: "...I hear they're called the "Brigate Garibaldi.""
 
 ITA_RED_midnight.4.t: "Signals in the Dark"
 ITA_RED_midnight.4.desc: "Couriers learned the city by sound and smell. One knocked twice at a door, slipped a hollowed book onto a shelf and was gone before the kettle boiled. Another crossed the freight lines at San Donato when the yard lamp blinked twice and never raised his head. Fishing boats brought canvas sacks ashore at dusk that did not hold fish. The Guardie Rosse inventoried the crates and walked them inland to caches that had not opened since the last war.\n\nThe Committee mapped a country no official chart showed. COMINFORM cleared the ciphers and set radio windows that would not be guessed. COMSTRA posted watchers at every meeting and taught the habit of asking without insulting. In parish halls the Istituto Sociale Cristiano took bread lists and organized the poor for the next day’s queue. In union offices the MCdI scribes drew routes on onionskin that burned clean. A breath became a rhythm, shallow at first, then steady enough to carry orders from Livorno to Turin without a single word spoken aloud."
 ITA_RED_midnight.4.a: "Pass the word."
 
 ITA_RED_midnight.5.t: "Rod, Staff and Shackle"
 ITA_RED_midnight.5.desc: ""Rest easy, son," said Don Gallo, closing the eyes of the young prisoner beside him. He'd tried his best to keep him comfortable and give him his last rites, but the careless bludgeoning from the guards hadn't given him much time. In fact, he didn't even know the boy's name, what he had been brought in for, or why the guards had beaten him like that. Was he jailed for his beliefs like himself, or just a criminal? \n\nGallo left the cell quietly for his own. The guards didn't do much to keep the prisoners separate. They were all headed to the same place soon enough. He squinted at the bar of sunlight shining through the sole window, about a meter to the left of where it usually was when they brought food. Curious. Before he could question it, gunshots rang out. He and several other prisoners were promptly on their feet, gathering to get a look outside. Rail thin and clad in rags, they smiled wider than Gallo had seen in a long while.\n\nThe silhouettes of boots were the only thing Gallo could see, but that was all he needed. He ducked low. More footsteps, crunching soil, and ringing firearms followed. He stayed low for at least another inch's worth of creeping sunlight, muttering verses. He knew he was in the shadow of the valley of death. "Secure the prisoners!" A voice cried. The shouting quieted and the murmur of the prisoners' conversation died down. Soles met concrete outside the rusted iron door. It opened and in came a group of insurgents, not prison guards, bloody, sweaty and exhilarated.\n\nCheering rose from the prisoners. "Congratulations, comrades, you're free!" Declared one man, "And for those of you brave enough, we've a few extra rifles. Medicine, too."Gallo glanced at the dead man. He wasn't sure how long had passed by the time the soldier addressed him directly. "Are you coming, Father?"\n\n"Oh, I'm no soldier," replied Gallo."
 ITA_RED_midnight.5.a: "We've got plenty. What we need is God."
 
 ITA_RED_midnight.6.t: "Joining Up"
 ITA_RED_midnight.6.desc: "Fabrizio watched the sun setting behind the hills, his eyes scanning the horizon. He caught scraps of whispered conversations from the people around him, which he ignored, his eyes still watching to the west.\n\nHe couldn't believe how fast things had moved. Only a few weeks ago he was living his life as usual, discreetly passing out pamphlets inviting his classmates to meetings of the DSU and copies of Quaderni Rossi. As the national crisis intensified, the meetings grew larger and larger, until it became clear that they now had a majority of the student population at least sympathetic to them. At this point there came a sense that they needed to do something with their newfound support. Someone (he couldn't remember who) made the suggestion that Fabrizio later realized would change his life forever. This person (whoever they were) said they needed to do something public, something that would show everyone where the students of the University of Turin stood, show the fighters in the mountains that they were not alone. They needed to occupy the university.\n\nThe weeks of planning blur together in Fabrizio's memory. The occupation itself he remembers in every detail. The tension of the last few hours of waiting, the thrill of momentum as the call to arms went out, and the euphoria of the few hours when they were in control. The administrators locked in their offices, the hated fascist flag ripped down and replaced with one of glorious red. For that brief time, everyone got a taste of freedom.\n\nIt didn't last of course. The police response was brutal, surpassing their, in hindsight, naive, expectations. Fabrizio had managed to sneak past the police lines in the chaos and make it to one of their preplanned meetup locations. After three days, he and the others there made their way stealthily out of the city and into the highlands. More small groups had joined them, and now about thirty of them sat on the hillside, waiting.\n\nThe line of the horizon was broken by small figures, who revealed themselves as they approached to be three men wearing worn clothes and worn faces, with rifles on their backs. One of the men approached Farbizio. "Is this everyone?""
 ITA_RED_midnight.6.a: ""Yes, comrade. We're here to enlist.""
 
 ITA_RED_midnight.7.t: "A Hard Lesson"
 ITA_RED_midnight.7.desc: "The first coordinated action failed in the small hours. The squad that was to cut the power reached the substation and found the guardhouse already awake. The diversion did not sound. A car backfired in a side street and a sentry pulled the alarm cord with a calm hand. By dawn the prefect had a list of names, and presses in two basements were quiet under wet blankets.\n\nThe Committee sat around a table that smelled of oil, damp paper and iodine. The ELN argued for drill, for sappers and signals, for a staff that counted shells with the same care as words. The Guardie Rosse asked for freedom to move where they knew the alleys and the doors that opened to a knock. The Intelligenzia translated both arguments into leaflets and sketched a schedule that would teach them together. Courage could open a door. It could not hold a city."
 ITA_RED_midnight.7.a: "Learn and prepare."

 ITA_RED_midnight.8.t: "The Battle of Camerino"
 ITA_RED_midnight.8.desc: "Camerino guards the ridge paths between Macerata and the high valleys. The column moved at dusk with guides from the peasant leagues and a mule train that rattled like bones. The plan was simple. Take the roadblock at the bridge, cut the wires at the gendarmerie, seize the depot and vanish before the sun cleared the hill.\n\nIt began well. The sentry at the bridge stepped aside after a single warning shot. A farm cart stalled at the corner and blocked the patrol car as if by luck. Then the bell of San Venanzio tolled at the wrong time and the courtyard filled with rifles. A sergeant with a steady voice rallied the town guard and turned the depot yard into a box of fire. Our stretcher bearers worked by the light of a burning awning while boys from the university tried to carry grown men down stairwells that bent like corkscrews.\n\nBy noon the column held two streets and a warehouse. By afternoon it held only the mountain path. The town heard the fighting fade into the trees and went back to counting bread. The Committee marked a single word beside the name of Camerino. Costly."
 ITA_RED_midnight.8.a: "Pull back in order."

 ITA_RED_midnight.9.t: "After the Setback"
 ITA_RED_midnight.9.desc: "A raid gone wrong is a teacher that does not blink. Bodies lay on school desks that smelled of chalk and iodine. Messengers folded their reports around coins so the blood would not smear the ink. The same conclusion arrived by three roads. Enthusiasm could open a door. It could not hold a station, a bridge or a city.\n\nTwo paths lay open. One would harden the ELN into an army that could assault and keep what it took. Sappers, signals, a staff that counted and a doctrine that could be taught to conscripts who had decided to stand with the people. The other would deepen the Front and trust that a thousand small hands moving together could achieve what one fist could not. Workshops would become fortresses, parishes would become supply depots and a city would defend itself by habit rather than order.\n\nEither choice would change how the Revolution sounded when it spoke and how it looked when it marched."
 ITA_RED_midnight.9.a: "Build an army around the ELN."
 ITA_RED_midnight.9.b: "Trust the Front and its committees."

 ITA_RED_midnight.10.t: "The Center Falters"
 ITA_RED_midnight.10.desc: "Between the Palace and the streets stood a class of men who believed the country could be argued back to calm. They proposed a committee to tally grievances, a commission to audit the prefectures, a promise that tomorrow would look like yesterday with kinder words. The first meeting drew lawyers, editors and a handful of shopkeepers who feared to close their shutters.\n\nBy the second meeting the room was half empty. Tram crews refused to carry delegates without paying like everyone else. Dockers jeered politely and went back to work for our quartermasters. A rector sent his regrets and a donation of bandages. The ministers who whispered about mediation discovered that the phones cut out whenever they spoke of it. In the squares the word liberal returned to its old meaning. A person who could explain everything and change nothing."
 ITA_RED_midnight.10.a: "Note who still answers our calls."

 ITA_RED_midnight.11.t: "How Wide a Front"
 ITA_RED_midnight.11.desc: "Letters arrived from places the Committee had not expected. A circle of railway men that belonged to no party offered a timetable and a switch key. A parish lay group sent a list of families they could feed for a week if the flour arrived on time. A handful of exiles came back from Marseilles with empty pockets and a gift for languages. Friends of convenience asked for an invitation. Friends of conviction asked for a seat at the table.\n\nSome argued for a pact among equals that would keep each current honest and useful. March separately and strike together. Others urged a broader embrace that would make the line longer and the march larger even if it muddied the program. Either course would shape the government that followed the victory and decide whose voices the new radios would carry into the hills."
 ITA_RED_midnight.11.a: "March separately, strike together."
 ITA_RED_midnight.11.b: "Commit to a united front government."

 ITA_RED_midnight.12.t: "A Comrade Taken"
 ITA_RED_midnight.12.desc: "The news crossed the Apennines faster than any courier could run. Longo was taken outside a safe house after a neighbor noticed a light at the wrong hour. The arrest was quiet. The meaning was not. A leader with a voice that could steady a hall in a storm now sat in a cell that smelled of stone and lime.\n\nThe Committee did not hold a public vigil. It sent lawyers to read the charges and priests to read the names of the arrested to their families. The presses did not print his portrait. They printed the schedule for the next convoy and a list of speakers who would fill his meetings until he returned. A movement that relies on one man is a crowd. A movement that can replace his voice with a chorus is a people.\n\nIn workshops and parishes the day’s work did not stop. The plan did not change. The Revolution learned again how to keep its balance when a prop was kicked away."
 ITA_RED_midnight.12.a: "Close ranks and carry on."
 
