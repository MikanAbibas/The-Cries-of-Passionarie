IGW_Played_txt: "§DPlayed§"
IGW_Intelligence: "§DOur current Intelligence is £counter_intelligence [?IGW_ITA_intelligence]§!"
IGW_Intelligence_tt: "We can predict the day the German Army will attack if we have a higher intelligence score then them. However, we cannot predict how high it is, so it is best to periodically increase our intelligence."
IGW_Attack_Date: "§DThe German Army will launch a major attack on [?GER.IGW_GER_attack_date.GetDateStringNoHour]§!"
IGW_info_tt: "Every other week, you may play one card from your hand that will use the top three cards of your deck. This card goes into §DPlayed§! while the remander of the cards will go into §DDiscard§!. If your deck is empty, your discarded and played cards will be shuffled in once the week is over.\n\nThere are four main types of card:\n\n§eSwords£igw_swords_texticon §! represents the §eOld Guard§!, and focuses on §eExpel§! effects which cause cards to be removed from you militia rather than being discarded, allowing for optimization.\n\n§xWands£igw_wands_texticon §! represents the §xNew Left§! and primarily focuses on adding §xTactics§!, which are decisions that can have up to three copies, allowing for versatile actions outside of cards.\n\n§wCups£igw_cups_texticon §! represents the §wCatholic Communists§! and focuses on adding §DNon-Aligned§! cards to your deck through §wRecruit§! effects. Additionally they have cards that benefit from having large decks.\n\n§DCoins§! represents the §DNon-Aligned§! militia members, which feature a variety of abilities and symbols, and it is hard to know ahead of time if they will be beneficial. However, they can often be helpful in providing key resources, outside of §jGerman sympathizers§!£BRA_pnb_texticon hidden amongst this suit."
IGW_Amount_of_Cards_tt: "You have [?IGW_card_count] cards left in your deck"
POLITICS_KIELMANSEGG_DESC_IGW: "Who is Johann von Kielmansegg? Born in 1906, he'd join the German Army 20 years later. During the Second World War, Kielmansegg served on a number of fronts, from Poland to France to even Russia. In 1942 he became a general staff officer of the High Command of the Wehrmacht, a position he's held since then. While he published a few pieces of writing analyzing other military powers, since the war he's been a competent, if not remarkable, figure within the Wehrmacht.\n\nHowever, who Kielmansegg is isn't truly important. He was selected merely for being an experienced officer available to the Führer so soon after emerging from the struggle for Germany. What's truly important about Kielmansegg is the task he's been given: Crush the illegitimate communist government, and establish a loyal, National Socialist state in Italy.\n\nAnd so, Kielmansegg sets out to do exactly that. Collecting and reorganizing the remnants of Farinacci's attempt at a rebellion, he leads the German invasion across the Alps, and into Italy. It will not be an easy task, but it is the task he's been given. The communists in Rome are an existential threat, and must be eliminated, for the sake of Germany."
 
