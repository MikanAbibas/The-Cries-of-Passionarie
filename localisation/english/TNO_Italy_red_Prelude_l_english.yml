 ITA_RED_culrev_tutorial_title: "§DLe Riforme del Monarca§!"
 ITA_RED_culrev_tutorial_open_tt: "Open the §LKing's Reforms§! GUI"
 ITA_RED_cultrev_tutorial_info_box: "§WThere are various weeds plaguing Italian society following the chaos of the Verona Conference, and such weeds must be cut out before they engulf everything. There are two primary groups: The §jFascists§! and the §eCommunists§!. While fascism is the primary focus of King Umberto's weeding, the threat of communism still is present and very real.\n\nThe §jFascists§! are fully unified, and have spread their vines all over the pillars of society. These vines will need to be removed before any true work can begin once our government has stabilized fully.\n\nFor the §eCommunists§! the movement is divided into three groups: The §eOld Guard§!, §xNew Left§!, and §wCatholic Communists§!.\n\nTo deal with the spread of all these movements, the King may enact £ita_rqsc_stability_texticon §EDecrees§!, however until our government stabilizes we can only enact three at once and cannot change them once they have been selected.§!"
