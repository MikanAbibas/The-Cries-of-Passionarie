ig_war_flavor.5.t: "A Milligram Of Pressure"
ig_war_flavor.5.desc: "The Nazi encampment was a statement of arrogance. The devils who invaded camped on those Italian slopes in the open. They were well aware that the Partisan forces in the area had no artillery, and so had decided to punish this gap, threatening to rain down shells of their own at the slightest hint of Partisan activity. They thought themselves untouchable in their flagrantly open position. Unbeknownst to them, there was someone watching. Behind their eyes was a rage sharper than the crystals forming on the Alpine grass, or the bayonets being affixed. Noone who stood with him had thought to ask his name.\n\nThe Partisan had noted the flow of German positioning. At night they kept guard all around, wary of a surprise attack as socialist forces could move unmolested then. Come morning they would position themselves at the front of the camp, facing south and down at the rolling plains, where any attack was sure to come from, with their back to the alpine pass. It was more a routine and mundane shifting of formation to formation than anything else. The Partisan and his men had been punished for the gap in equipment. Hubris, the Partisan told himself, that can be punished too. This is what he also told his men, hiding on the left bank of the hill, closest to the mountains, since dusk. It didn't matter what kept the fire in their hearts burning. So long as they were alive by morning, and eager to kill.\n\nThe Germans woke and moved to the front. They peered down the valley to find it boringly void of target practice again. Then, there was a sound, and before they could mount an effective defense, the Partisan's men were in the very midst of their camp. Soon enough, every last German died. Relishing in their cathartic revenge, and capture of artillery, there was only one question. Who was their leader, who had merely quietly watched on as they ravaged the camp, not lifting a finger to ensure the taking of prisoners?"
ig_war_flavor.5.a: "Giovanni Scuderi."
