  ITA_RED_leader_intro.7.t: "The Street Priest"
  ITA_RED_leader_intro.7.desc: "The doors of the hall remember the day a priest arrived with his parish behind him. They came in their own clothes and did not ask permission to look hopeful. Don Andrea Gallo speaks to people Italian governments have taught themselves not to see. He knows which stairwells flood in winter and which courtyards can hide a dozen cots without a question asked. In Genoa the mission learned to take names for soup lines and then used those same lists to find witnesses, nurses, and runners. A homily does not stop a baton. A congregation that has found its voice can hold a street until help arrives.\n\nGallo’s republic keeps the catechism near the bread list. The ICS teaches lay stewards to keep fair books. The ACLI sends men who fix a boiler and then chair a meeting without embarrassment. Parish halls become clinics in the morning and schools in the evening. The clergy pillar learns to speak the language of councils. The councils learn to speak in churches without shame. He does not ask the poor to be patient. He asks them to speak and promises that the law will listen. The Assembly, once skeptical, has learned to count what that kind of faith can build."
  ITA_RED_leader_intro.7.a: "Welcome the shepherd and his flock."
  
  ITA_RED_leader_intro.8.t: "Catto Comunisti"
  ITA_RED_leader_intro.8.desc: "Franco Rodano gulped. Faith may be the thing uniting most men, but it was not the only place one could find unity. Or difference. Sitting across from men so aged they made Rodano feel like he was staring into the eyes of his father. Men that made him feel like there was an unbridgeable gap between him and them. More features in opposition than those complimenting.\n\n"Why should we join with you at all?" The gravely and gritty voice sounded. "Even if Fascism wasn't a memory, it ended 50 years of conflict between the Papacy and Monarchy, guaranteeing the rights of the Church. But Fascism is a memory."\n\n"Once..." Rodano gulped. "Once White Trade Unions in the Po Valley were willing to join forces. They did so because of a common purpose. They both sought to improve the working conditions of the peasants. We have a common purpose now, you must see that. The common man does. Fascism is no spent force, and no anti-Fascist seeks to muster behind the sigil of the House of Savoy, that old collaborator of Fascism, their hands stained with the blood of so many. Fascism will return, because the people will not tolerate the passing from one oppressor to another. Unless, that is, if we provide an alternative. A united front of all men, regardless of class or status, or creed. A coalition, that accepts the historical truth that change is inevitable."\n\nSilence took hold of the room, breaking when one of the conservative Christians spoke up. "The notion of... moderated, gradual, and careful social change is not entirely offensive to us. Neither is fighting to protect our liberties against the threat of Fascism returning. But you and your friends must not dominate this coalition and strip us of our rights. Only by the taming of your people, can the cultural struggle between Marxist and Catholic be ended.""
  ITA_RED_leader_intro.8.a: "Rodano agreed earnestly."
  
  ITA_RED_leader_intro.9.t: "Declaration Of Principles"
  ITA_RED_leader_intro.9.desc: ""It is good to see you all." Livio Labor spoke to the unionists, high up on what was, in truth, effectively some crates cobbled together. "Throughout the months of working with you all, I have come to know you as brothers. Ernesto! Your face is indeed a welcome sight. Your wife and children, they could not ask for a more dutiful man. Fresco! With you by my side, I have never wanted for insight and recollection of the holy texts. And Angelo! Never has a stronger worker lived. It is valued, for wars have been fought for less! All of you are the components of this ACLI, known for being founded on Christian ethics. No greater compliment than that exists! It is a sad fact, however, that Italy does not live in Christian times."\n\n"We know the men who have held sway over the people these last few decades. The faithless Fascist dog, the opportunistic aristocratic, and most of all, the soulless and oppressive man of efficacy. Faith, which exists solely to save mankind, has failed thus far. However, at our very fingertips lays the means by which things may be righted. God never intended mankind to live in isolation. No, he intended for us to live by his son's example."\n\n"Did Jesus practice the Roman salute? Did he embrace the moneylenders, rather than expel them? Or did he, through cooperation with his fellows, form a spear. Did he fashion this spear so it would run through the systems of society that inevitably creates perpetual unequal and unfair conditions of life? And did he do it for the benefit of all, or for selfish gain? Nearly 2,000 years ago, Jesus Christ went forth to right the material conditions for all. Now, the same challenge lies at our feet. Where will the faith of the ACLI be when the hour comes? How will you answer Umberto or his cronies, who seek to control you! The scripture holds these answers: Just as another person has received an injury from him, so it will be given to him!""
  ITA_RED_leader_intro.9.a: "The strike would begin soon."
  
  ITA_RED_leader_intro.10.t: "Authorial Restoration?"
  ITA_RED_leader_intro.10.desc: ""Oh, Carlo, you do disappoint me," came the sleek, startingly calm voice from across the desk. Situated across from a young OVRA agent, barely maintaining composure, was the smug face of an older officer with slicked-back silver hair. "What do you call this?"\n\n"Well... it's a pamphlet, sir." The young man forced out his words, barely able to maintain eye contact. "Leftist literature, seems to have been published anonymously... like the rest. Sir I don't-"\n\n"Did you even read it? This is the work of Amadeo Bordiga. Do you know why the reports on him are dusty, Carlo? Because through imprisonment, we lessened the fire of his fervor. The coals were removed from the furnace, and the writings lulled. The reports are dusty because he has done little of note in over 30 years. Read it, and read his words: of a man with personal magnetism, hoping to strike at Italy's jugular with revolutionary saber, and build his new dictatorship from the ashes."\n\n"This could be any Bolshevik." The OVRA agent gasped out. "Age surely has taken his strength, and any jumped up Communist could imitate him. When I found the pamphlet, there wasn't anyone around. Maybe it's old, nothing to worry about."\n\n"And of course, you didn't think to search the area." The old man's voice, which held the young man in contempt, began rising.\n\n"Well normally there's-"\n\n"You're a stupid incompetent!" The OVRA officer launched from his chair, his face twisting in rage. "I want that Bordiga! Put the whole area on alert if you have to! Find him Carlo! Find him!""
  ITA_RED_leader_intro.10.a: "The scared, human mind."
