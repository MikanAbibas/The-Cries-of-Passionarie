 #Leader Desc 
 POLITICS_JOSE_QUESADA_DESC:0 "In many ways, ETA and its military wing was a product of the francoist dictatorship. The brutal attempts to delete Basque language and culture, the exile into which old Basque nationalists were forced, the repression of workers' movements, the rampant industrialization and urbanization of Euskadi with immigrant workers flocking into the region - these were the ingredients that would converge into the sudden appearance of the abertzale movement. And these very same factors led to the appearance of José María Quesada Lasarte, too.\n\nBorn into a mixed Basque and Navarrese working class family, his father would die fighting on the Republican side during the Spanish Civil War, but his soon would soon take up the struggle. One of ETA's first militants, Quesada was directly responsible for several daring paramilitary and political actions, attacking convoys carrying Spanish and Iberian soldiers, publicly burning Iberian flags, and other such public demonstrations - quickly becoming the enemy number one of Iberian intelligence, and always escaping their grasp.\n\nOne of the most prominent commanders of the military wing of ETA, he was elected to take charge of the Basque government after the coup that brought the armed organizations of the abertzale left into power. While some paint him as a puppet of his younger, ambitious generals like Argala and other militant abertzale youths, Lasarte enjoys the widespread support of ETA, and he and his clique have multiple times stated their objective - Basque Country and freedom, whatever the costs."
 
 POLITICS_TELESFORO_MONZON_DESC:0 "The recent history of the Basque Country was fraught with conflicts, between the people of Euskadi and their masters in Madrid and between different factions of the Basque movement - and Telesforo Monzón was in the centre of them all. Born into a wealthy aristocratic family in 1904, as a young man he soon joined the Basque Nationalist Party, or EAJ, quickly becoming president of his local section. An intellectual, writer, poet, and fervent supporter of jeltzale ideology, Monzón collaborated with CEDA and other groups against the Frente Popular, but when the nationalist coup d'etat that would lead into the Spanish Civil War took place, Monzón and the rest of his party found themselves fighting on the republican side.\n\nAs the war ended in disaster, Monzón and the rest of the Basque government were forced into exile. Establishing himself just across the border in France, Monzón remained a close friend of EAJ leader and lehendakari of the Basque government José Antonio Aguirre - however, his relationship with the party soon began to deteriorate over diverging positions. Monzón felt that the EAJ was not doing enough to bring about a free Euskadi, and that more radical action was needed. Thus, he kept himself in close contact with the small grassroots organizations that began to spring up in the country - first of all, Ekin, which would later evolve into ETA.\n\nIn time, Monzón became more or less the only person enjoying widespread respect among both the jeltzale right and the abertzale left - and when Iberia fell into chaos and the Basque people took to the street, Monzón was a natural choice as the new lehendakari. Taking upon himself the difficult task of managing the wartime Basque government and attempting to bridge the ideological abyss between ETA, with its numerous affiliated movements, and the old guard nationalists of the EAJ, Monzón is now the lynchpin of the delicate political equilibrium holding the Euskadi forces together - but it's hard to tell for how long it will last."


 #War Tree
BSQ_gora_euskadi_askatuta:0 "Gora Euskadi Askatuta!"
BSQ_gora_euskadi_askatuta_desc:0 "When we entered into the 1960s, many amongst our ranks assumed that our dreams of a free Basque Republic were a dead one. Many lamented that these years would pass like countless others, with us squirming under the foreign heel of Madrid. Times have changed - faster than anyone expected.\nThe Spaniards have lost any illusion of control they had over the Peninsula, and the oppressive drumbeat of war reigns supreme over Iberia. Euskadi is no exception. Our patriots have beaten back Madrid with unprecedented fury and brutality, and all of Basque falls into our hands! But it won't be enough. A bloody nose and the occasional humiliation will not convince the government of their folly. If Euskadi is to survive, not a single rifle of ours will go unused. Not a single grenade will go unused. Not a single bullet, unspent. Failure would mean extermination."
BSQ_gora_euskadi_askatuta_tt:0 "§nGora ta Gora Euskadi§!"

BSQ_the_basque_war_economy:0 "The Basque War Economy"
BSQ_the_basque_war_economy_desc:0 "The Basque Republic is home to many things. Sprawling orchards, packed to the brim with their scarlet fruits. A coast, lined with towering cliffs, guarding over the Atlantic like a dormant colossus. More importantly, we also contain some of the busiest and densest industrial zones on the entire Peninsula. However, producing artisan wine glasses and ceramic plates would only give the Spaniard grander things to loot from our decaying corpses.\nPutting all of Euskadi on a war footing isn't just important, it is the very thing that will keep our Republic afloat. Our ferocity and willpower will only get our men on the field, perhaps. But a rifle will make sure they come back victorious."

BSQ_consolidate_our_forces:0 "Consolidate Our Forces"
BSQ_consolidate_our_forces_desc:0 "In the first, furious days of the Revolution, the army we came to possess was an embryo of what was to come. In its place, ragtag militia roamed the countryside - in search of an enemy to kill and a cause to die for. The male population of entire villages - simply gone, in the ultimate service of Euskadi. But that's not how we will fight this war.\nFor the sum is greater than the equal of its parts. And we must fuse all of our weak and weary patriots and forge a sword mightier than any infernal thing that Madrid can throw at us. Some may complain, but in the end, the history books will prove us right."

BSQ_seize_federal_assets:0 "Seize Federal Assets"
BSQ_seize_federal_assets_desc:0 "When the Federales fledEuskadi, they couldn't take all of their property with them. With nobody to protect them, bank vaults and reserves lay ripe for us to...reappropriate them. Millions of Pesetas and hundreds of tonnes of gold would be a massive boon to our fledgling Republic and our struggle against the Spaniards. Everything is a weapon in survival, and there is seldom a weapon so precious as money. We can use cash for rifles, silver for tanks and gold for our people to keep our economy alive. After all, we're just reclaiming what the Government took from our people, aren't we?"

BSQ_militarize_mondragon_facilities:0 "Militarize Modragón Facilities"
BSQ_militarize_mondragon_facilities_desc:0 "While we have already retooled most of our industry for war against the Spanish, we still have a long way to go. The struggle ahead of us will be the ultimate test of our will to survive, and facing our enemies half-cocked will only lead to our doom.\nFamous across the Peninsula for its idyllic sights and peaceful living, Mondragón is a central hub of industry nestled among the soaring peaks and endless emerald farmland. While the population may lament it, we cannot afford to leave a single factory out of the war effort. One artillery piece, one rifle, one bullet even, could mean our victory or our downfall. Time is of the essence, and our men are ready to depart for the sleepy town. They only need the order."

BSQ_develop_the_machine_tool_industry:0 "Develop the Machine Tool Industry"
BSQ_develop_the_machine_tool_industry_desc:0 "It's all very well having generals plan our next ingenious strategy or having resistance cells eliminate another supply convoy, but we can't keep running on fumes. Eventually, we will run out of bullets; our guns will jam, our artillery will break. If we cannot replace our equipment, then we will only delay the inevitable.\nWhile we can't afford to not build up a war economy, it does us no good if our workers are using their hands and fingers to manufacture our guns. Not only do we need to be industrious, but we also need to be efficient. Mass manufacturing of fine machine tools and equipment will not just help win but keep our economy afloat. In war, the most minuscule advantages can change history."

BSQ_expand_the_bilbao_port:0 "Expand the Bilbao Port"
BSQ_expand_the_bilbao_port_desc:0 "Not only is our land bountiful, but Euskalduna is also blessed with a picturesque coastline. For centuries, Basque fishers have used the Bay of Biscay as the source of their livelihoods. In modern times, hundreds of families flocked to our pristine beaches as a respite from the oppressive weight of the outside world.\nNow, it appears that Bilbao must give into that weight. War is a bloody, costly thing. It has many ravenous maws, all crying out for steel and blood to fulfil its hunger. Too often, we are a bullet away from victory or a loaf away from a happy populace - it will only get worse. Expanding Bilbao Port, overlooking Biscay, will not just expand what supplies we get from the outside world but reduce the time it takes to get from there to here."

BSQ_a_job_for_everybody:0 "A Job for Everybody"
BSQ_a_job_for_everybody_desc:0 "Those who can fight, will. Those who can't, will work. The war has been a deadly, costly thing to all the people of Basque. And it will only get worse. If we want to weather out this storm, all hands must be on board for the final clash against tyranny. Businesses, factories, even simple workshops must all be full of hard-working, industrious comrades in arms. It doesn't matter if you're a general or a steelworker - none shall be wasted in our fight for freedom."

BSQ_emergency_taxation_policies:0 "Eemrgency Taxation Policies"
BSQ_emergency_taxation_policies_desc:0 "Guts, bullets and fortifications are not the only things we need to fight a war against Madrid. Every rifle needs to be made; and the people who make it need to get paid. Every bomb requires materials that need to be bought or produced. Every single truck needs fuel, and where will we get that petrol? Money is an unromantic side to war, but it's a side that has always been the decider of who wins and who is relegated to the history books.\nCurrently, we can't keep up our war effort by just donations and more...unscrupulous ways of funding ourselves from foreign contacts. If we want our men to win and keep winning, then something has to be done. Unfortunately, it seems the best and most effective way to do this is the most unpopular one. By raising the provisional tax; we will have more than enough to keep up the struggle and win the war. It is not a thing we take lightly, but it must be done."

BSQ_mastery_of_the_mountains:0 "Mastery of the Mountains"
BSQ_mastery_of_the_mountains_desc:0 "Time and time again, history has taught its keen students of the wonders of defensive terrain. From the Spartans' use of the Hot Gates against the marauding Persians to the halt of the Wehrmacht in the glens of the Scottish Highlands by the Americans, we would be foolish to not utilise the same advantages. Euskadi is lined by cliff-side roads, towering valleys and most of all - some of the tallest mountains in Iberia.\nOur generals are begging us to properly train and equip men in high-altitude combat in fighting Madrid. It would be borderline idiotic to ignore their advice, for we need any advantage we can get. Staining the mountains crimson with Spanish blood will not be a pretty sight, but it is better than our blood."

BSQ_weaponize_trade_ships:0 "Weaponize Trade Ships"
BSQ_weaponize_trade_ships_desc:0 "If it isn't broken, don't fix it. While perhaps not as highly regarded as our other arms in the military, the Navy serves an incredibly valuable purpose, nonetheless. We rely on foreign guns and supplies by those sympathetic to our cause. Money, food, guns; our contacts in Washington, Berlin, and Tokyo are all hard at work trying to procure those for us. But what use is getting those supplies if Madrid can simply loot our ships and impress our sailors?\nWe must arm our trade ships, from the dinkiest trawler to the colossal freighters sprawling through the ocean. Men trained in amphibious warfare, specialised equipment and even explosives can all supply us the edge we need to secure our oceanic highway and aid our men at the front."

BSQ_rebuild_the_iron_ring:0 "Rebuild the Iron Ring"
BSQ_rebuild_the_iron_ring_desc:0 "The Iron Ring was a series of fortifications built in the desperate days of the Spanish Civil War. Consisting of 180 concrete bunkers - each packed with walls nearly a meter thick - and spanning an 80km perimeter around Bilbao. Fighting head-on against it was almost suicidal. Little in Europe, except perhaps the Maginot Line, could match the fortifications in their design and indestructibility.\nHowever, like the Maginot Line, it was bypassed and made useless. In our case, from the bomb bays of the Luftwaffe, instead of the forest of the Ardennes. We will not make that mistake again. We will reconstruct this outer shell and hold back the hungry bayonets of Madrid. This time, the Iron Ring will not be resigned as a trinket of history."

BSQ_equal_opportunity_service:0 "Equal Opportunity of Service"
BSQ_equal_opportunity_service_desc:0 ""

BSQ_the_basque_air_force:0 "The Basque Airforce"
BSQ_the_basque_air_force_desc:0 "When we overran the Spaniard positions across Euskadi during our Uprising, they left a gift for our men. Especially along the French border, rows of hangars lie dormant, gathering dust. Fighters, bombers, jet interceptors of all kinds remain inside, just waiting for someone to use them.\nJust as well, because one of our deadliest weaknesses during the Spanish Civil War of the 1930s was our lack of air superiority. Every time a breakthrough could be made; our men would be bombed back into the Stone Age by Franco's men or the butchers in the Luftwaffe. This time, we cannot afford to repeat the same mistakes. By challenging the Spanish in the air, we can provide shelter - or at least, a reprieve - for our soldiers on the ground. "

BSQ_military_on_wheels:0 "A Military on Wheels"
BSQ_military_on_wheels_desc:0 "If there is one lesson that one can take from the butchery of the Second World War, it's that speed is key to success. The French and British were both outmanoeuvred by the German breakthrough in Belgium and were destroyed by Hitler's army. In Yugoslavia, Greece, North Africa and most importantly, the blood-soaked fields of the USSR this lesson was shown, time and time again.\nWhy should those lessons not apply to us? We must expand our motorised support across the entire army, from the soldiers to the canteen staff. If we are defeated, we can slip away from the jaws of defeat and recoup our losses. If we are victorious, we can thoroughly follow up our victory and destroy the Spaniard in detail. As far as our men see it, there is no downside to this decision."

BSQ_march_forwards_together:0 "March Forwards, Together"
BSQ_march_forwards_together_desc:0 "Two parts make up the government of a Free Euskadi. There are the “jeltzales” of the PNV - Basque Nationalist Party - and the “abertzales” of the ETA - Basque Homeland and Liberty. The former are aged political experts who have been campaigning for the free Basque Republic for longer than some in the ETA have been alive. Meanwhile, the ETA are young radicals, so hellbent and zealous for the free Basque Republic; that it would make some in Himmler's fiefdom blush.Regardless, if we let our petty differences in how we run our nation divide us, we would only be playing into the hands of Madrid. If we don't stand together then we will die separately, and the fragile embers of a free Euskadi will be blown out. Forever."

BSQ_jeltzale_supremacy:0 "Jeltzale Supremacy"
BSQ_jeltzale_supremacy_desc:0 "As much as we pretend to the contrary, the Basque Republic is not wholly unified and monolithic. Our uprising was made possible by two differing groups. The first group is the Old Guard of the Basque Republic. The “jeltzales” of the PNV, the Basque Nationalist Party. Named so due to their adherence to the PNV's acronym: Jaun-Goikua Eta Lagi-zaŕa (God and Old Law), they are the wizened teachers of the Basque Republic. In contrast, the other main body of our movement is the “abertzales”, the “patriots” of the ETA. Young, energetic and zealous, the abertzales will stop at nothing to achieve their aims.\nWhich makes them dangerous. Euskadi cannot be run by a group of violent militiamen fresh out of University. We would be shooting ourselves in the foot and isolating ourselves from international support if we allowed them real power. No. Fine fighters rarely make for fine ministers, they must be stopped."

BSQ_remember_gernika:0 "Remember Gernika"
BSQ_remember_gernika_desc:0 "We shall never forget that clear Thursday afternoon, where the birds raced and danced across the pink sky. We shall never forget the children pushing and tugging at each other in the chalk-marked schoolyards so familiar to them. We shall never forget the fathers and their meandering conversations with citrus-smelling farmers in their stalls. Never forget how their deaths arrived with a quiet, thin hum. Never forget the widows who buried their children next to their fathers.\nWe remember the people of Guernica."
BSQ_remember_gernika_tt:0 "God bless the Gernika tree, loved by all basque people"

BSQ_establish_local_councils:0 "Establish Local Councils"
BSQ_establish_local_councils_desc:0 "We can't afford to be inefficient when we are fighting for our lives. Bilbao can only do so much for its people and still manage the frontlines with the care and precision they both deserve. That's why many in our government propose a radical new idea. Local Councils could be set up in varying provinces across Euskadi; to manage the day-to-day business of small, local affairs. The central government can intervene if it needs to, in case something goes horrifically wrong, of course. While others might say that this would lead to factionalism, bureaucracy and many, many more overused buzzwords - we do not have a choice."

BSQ_assymetic_warfare_training:0 "Assymetric Warfare Training"
BSQ_assymetic_warfare_training_desc:0 "The soaring peaks of the Pyrenees. The jagged valleys of the highlands. The sheltered woods and orchards of the countryside. What do they all have in common? They bring in tourism, perhaps. But in times of war, fat Americans and their larger wallets serve very little use to us. What stunning scenery blesses us with is hell on Earth for a Spaniard.\nTreacherous high-altitude combat. Guerilla sharpshooters taking out countless valuable targets hidden in cottages outside the watershed. Hideaways, nestled in thorn bushes, for our men to slip into the shadows. All these are opportunities for us to take advantage of if we could merely train our men. Hit and run tactics, covert assassinations, proper camouflage and clothing are all things that we could be teaching our men if we just used our commandos to teach them. The scenery might be a dangerous allure to the Spaniard, but it only makes our victory more picture-esque."

BSQ_traitors_not_welcome:0 "Traitors Not Welcome"
BSQ_traitors_not_welcome_desc:0 "Nobody expected the Uprising to happen. At least, not so soon. Once banished into the alleys and the cellars, we now walk triumphantly. As our fighters continue to fend off whatever Madrid sends our way, we now face a new problem.\nWhile most fled, remnants of the Spaniards remain, like a dagger at our backs. The Guardia Civilies, responsible for the deaths of many in our ranks, have been disarmed and rounded up. The former soldiers and bureaucracy too, await their fates. While unloading a clip into the senior ranks may make some of us happy, some have a different idea. Euskadi is a young thing, even if our people have been here before the Romans. Simply blacklisting and bans from service will serve us, just fine. Just because they have our blood on their hands, does not mean we must have theirs."

BSQ_orders_from_bilbao:0 "Orders from Bilbao"
BSQ_orders_from_bilbao_desc:0 "When one is fighting for one's life, the least they can do is keep an eye on themselves. As high-minded and noble as the idea of “local communes” is to the commoner, it will not win us the war. Only through precise coordination and the centralisation of every single man, woman and child in the war effort can we keep ourselves afloat. Despite the seething rage of the anarchists among us, the only way we can cope under such a brutal enemy, like the Spaniard, is to make sure that everyone knows their place."

BSQ_disband_eta_commandos:0 "Disband ETA Commandos"
BSQ_disband_eta_commandos_desc:0 "It is a noble thing to take arms for your country. It is an even nobler thing, to know when to put them down. The ETA commandos have provided an unflinchingly agonising thorn in the side of the cursed Spaniard, who seek to put down our revolution - that's true. However, disparate and cobbled revolutionary cells, who might not even see combat, are not how we will fight our revolution.\nOur generals suggest that instead of funneling our precious supplies and equipment to scattered and ill-disciplined fighters, we instead integrate these patriots into something more productive. That being, the army. What's the worst that could happen, by having a group of overzealous and undertrained men in our army?"

BSQ_the_misguided_patriots:0 "The Misguided Patriots"
BSQ_the_misguided_patriots_desc:0 "We are not animals! Our revolution against Madrid cannot drown itself in the blood of innocents, in vain defiance against the cruelty of humanity. The attacks and even occasional murders of so-called "collaborators" such as members of the Guardia Civiles or the bureaucrats are unacceptable. What is worse is that many among us are not just sympathetic to the shunning of these members of our new society. They encourage it.\nDid they not join to protect their families? Their lands? Their home? Aren't we doing the same thing? Should we be content to see their bodies swing from the nearest oak tree? No. We would be butchering potentially valuable allies, considering their experience with governing and guarding these lands. Let us guide these misguided souls to their true purpose."

#ETA War tree

BSQ_gora_euskadi_ta_askatasuna:0 "Gora Euskadi Ta Askatasuna"
BSQ_gora_euskadi_ta_askatasuna_desc:0 "We have vanquished the decrepit and decaying jeltzales! Our coup d'etat has overthrown the old regime and ended the menace that made Euskadi weak. The Forever War against the fucking Spaniards will be brought to an end by our rule. Now, we rule Euskadi, as it should have been. A vigorous, unified and socialist state that will be made into reality by our guiding hand.\nIt is to our eternal shame that some of our more moderate abertzales had to be put to the sword during our coup d'etat, but this is not a time to mourn. This is a time to make Madrid bleed, for every single square foot they advance into our glorious nation. Their punishment for their eternal sin of oppression and wrath will be severe. If necessary, we will stain Euskadi red if it means that our children can live free."
BSQ_gora_euskadi_ta_askatasuna_tt:0 "§VBietan jarrai§!"

 BSQ_expand_the_organization:0 "Expand the Organization"
 BSQ_expand_the_organization_desc:0 ""

 BSQ_there_will_be_no_quarter:0 "There Will Be No Quarter"
 BSQ_there_will_be_no_quarter_desc:0 "The beasts are at the door. If they are victorious, they will slaughter our loved ones, slit the throats of our children and leave us as ashes to be swept away. All of Euskadi must know the perils of defeat. They must realise that our nation stands on the crumbling ledge of Annihilation, and none shall survive to see the end. Conversely, if we want to stay alive, let us teach the butchers what fear truly means.\nHang their comrades by the trees, blind the survivors of our attacks and burn any semblance of safety they hold dear. Not a single one of those bastards will escape from our carnage intact, and the ones we don't kill - let them talk of what happened to their friends. Let them squeal of the terror of angering the ETA, like the dying pigs they all are. Horrific acts, to be sure, but what other choice do we have?"

 BSQ_revolutionary_taxes:0 "Revolutionary Taxes"
 BSQ_revolutionary_taxes_desc:0 "It is simply not enough. Our continued war effort has been a taxing thing on the populace - and our coffers. Money is rapidly running out, and we can only do so much to replace our losses. Therefore, some of our men suggest a more...revolutionary idea. Those who can pay will pay. The fat cats and cigar-smoking landlords of the countryside have done nothing in their contribution to the war effort. We shall raise a new tax system against those corrupt leeches, in their country mansions.\nIf they refuse, then we will simply confiscate their possessions. They will wail and moan about “tyrannical measures”. We will laugh at their faces. How can a class of people, built off the backs of the peasants, dare to accuse us of tyranny?"

 BSQ_promote_cooperative_farms:0 "Promote Cooperative Farms"
 BSQ_promote_cooperative_farms_desc:0 ""

 BSQ_root_out_traitors:0 "Root Out Traitors"
 BSQ_root_out_traitors_desc:0 "They are everywhere. Secret allies of the invaders gather in their masses, against our mandate over Euskadi. Seeking to restore the rule of the despots and would-be kings, they plot and scheme to have us at the end of a firing squad. It is only a matter of time until they make their move against us and enslave all of us under their iron fist. It brings bile to the mouth to imagine that free men of Euskadi could ever consider joining with the Judases, but the sad reality is that it happens - far too commonly.\nRegrettably, we must deal with the fifth-columnists. Draw up lists, monitor their allies and dig our knives into their rotting, pus-soaked hearts. When their time comes - and it will - nobody will miss those vipers. Because those who do, have already been dealt with."

 BSQ_incentivize_the_mondragn_model:0 "Incentivize the Mondragón Model"
 BSQ_incentivize_the_mondragn_model_desc:0 "Are we not human beings? Do we not clamor for freedom, as any other sentient creature would do? Would you rather march to your very own destruction with a toothy grin and the illusion of hope in your heart? So many of our people seem to question our methods in dealing with the marauders. They seem to have come under the illusion and think a dangerous thought. The people seem to believe that the war we fight is a morally grey one.\nThey seem to think that the invaders are not in fact, the instrument of murder, rape and torture, but are someone to be negotiated with? Someone to treat with respect? Does the hawk treat the pigeon with respect when it sends its talons deep into its flesh - ripping apart its quivering tendons and fat with genuine glee? Should we treat our hawks with honor if they butcher us? No. We fight for Euskadi. We fight for the workers of Euskadi and most of all we fight for freedom! DEATH TO THE SPANIARD!"

 BSQ_guerillas_tactics:0 "Guerillas Tactics"
 BSQ_guerillas_tactics_desc:0 ""

 BSQ_the_war_for_freedom:0 "The War for Freedom"
 BSQ_the_war_for_freedom_desc:0 ""

 #Events 
 BSQ_wars.1.t:0 "An Oath Under a Tree"
 BSQ_wars.1.desc:0 "A young journalist working for the recently created newspaper Deia is covering the swearing ceremony of Telesforo Monzón, the new Lendakari. The ceremony is taking place in the town of Guernica and Monzón is swearing in under the eponymous tree. The swearing goes: “Before God, humbly, standing on Basque soil, remembering our forefathers and under the tree of Guernica, I swear to faithfully carry out my duties”. The journalist notes that Monzón isn't swearing over anything; no books, no religious symbols, nothing. Government members are there too and the journalist writes down the stark difference between the conservative members of the PNV, middle-aged and old men dressed in suits; and the left-wingers of ETA, young men more casually dressed. The ceremony ends with someone from the crowd screaming “Gora Euskadi Askatuta” and the rest responding with “Gora”"
 BSQ_wars.1.a:0 ""

 BSQ_wars.2.t:0 ""
 BSQ_wars.2.desc:0 "On a regular day at a steel mill, workers find their shift interrupted when a convoy of police cars arrive at the site. A small contingent of policemen pour out, escorting a couple of well-dressed men that walk directly to the office while the police apprehend and take the foreman to the office too. After a while both men are escorted out. One of the well-dressed men addresses the workers, saying that the mill has been seized by the government, activity will continue as normal. He ends with a “Gora Euskadi” to which the workers respond with a weak and confused “Gora”"
 BSQ_wars.2.a:0 ""

  BSQ_wars.3.t:0 ""
 BSQ_wars.3.desc:0 "In an unemployment office, an official carries out a series of interviews to several unemployed people. As per government dictate, all are given jobs; those with experience are given a job in their field and those without experience or that haven't worked in a long time are given a job as industrial or construction workers."
 BSQ_wars.3.a:0 ""

 BSQ_wars.4.t:0 "Lesson in the Mountain"
 BSQ_wars.4.desc:0 "A middle-aged mountaineer and expert hiker is training a bunch of soldiers to move through the mountains. He teaches them to climb rough walls without much equipment, find paths through the densely forested areas and identify various sounds and locate their origin. While on a break, the soldiers are commenting how they find this training superfluous, however when they hear a small commotion they all scramble to get ready but when they look for their instructor, they find him perched to a ledge; he just shot two enemy soldiers."
 BSQ_wars.4.a:0 ""

 BSQ_wars.5.t:0 "Lesson in the Mountain"
 BSQ_wars.5.desc:0 "As a show of unity, PNV and ETA hold a public meeting and gathering together, “independents” members of other political associations created that aren't yet recognized are also invited. The event should be a bird-eyes view of the event, showing the differences between both sides of the government (PNV and ETA) but also their efforts to keep a united front."
 BSQ_wars.5.a:0 ""

 BSQ_wars.6.t:0 "Lesson in the Mountain"
 BSQ_wars.6.desc:0 "At the end of mass, Juan de Ajuriaguerra, president of the PNV; is asked by journalists about his thoughts of ETA members in the provisional government. He gives some vague answers, pointing out the VERY provisional nature of the alliance between the two organizations and the lack of experience of the ETA members."
 BSQ_wars.6.a:0 ""

 BSQ_wars.7.t:0 "Lesson in the Mountain"
 BSQ_wars.7.desc:0 "A woman goes out to do the daily shopping, but in the market she finds her neighbors and friends are giving her the cold shoulders. She also notices ETA officers around the village. She eventually has a small outburst, pointing out how her husband was a Guardia Civil lieutenant and now that ETA has a strong presence they are afraid of possible repercussions by engaging with her. As she said, everyone ignores her."
 BSQ_wars.7.a:0 ""

  BSQ_wars.8.t:0 "Lesson in the Mountain"
 BSQ_wars.8.desc:0 "In a makeshift prison in rural Vizcaya, a group of prisoners are released. These prisoners were arrested at the beginning of the war as they were bureaucrats from the previous regime and were deemed traitors. Upon release, they are met by a government delegate that tells them that the government hasn't found evidence of treason and that they are invited to return to their old posts. A couple of prisoners discuss if this move was only done to help the new administration with some experienced people. One of them fears that this may be temporary to which the other responds he is grateful that he is out but that he will make sure not to anger the new top guys by joining a political organization that supports the new government. Which one? He doesn't know, nor does he care"
 BSQ_wars.8.a:0 ""

 BSQ_wars.9.t:0 "Lesson in the Mountain"
 BSQ_wars.9.desc:0 "A young woman is pleading with her mother to let her volunteer for the army now that the government has allowed women to officially enlist in the army in some capacities. The mother doesn't want to let her go especially as the girl's three siblings have all gone to fight. The father comes to the room and convinces the mother to let the daughter enlist after telling her about the women he fought with during the Spanish Civil War"
 BSQ_wars.9.a:0 ""

 BSQ_wars.10.t:0 "Abertzale In Charge"
 BSQ_wars.10.desc:0 "In front of the flash of the cameras, a delegation of ETA headed by José María Eskubi reads a communique. Owing to the failures of the previous government, ETA has taken the initiative to restructure the provisional administration. Telesforo Monzón, the previous lehendakari, was invited to step down and the position will remain unoccupied for now. PNV members of the government did also step down or were arrested under charges of treason. The government will now be composed of ETA and aligned independents"
 BSQ_wars.10.a:0 ""

 BSQ_wars.11.t:0 "Abertzale In Charge"
 BSQ_wars.11.desc:0 "In southern Alava, a couple of tax collectors reach a big estate. They knock on the door and are answered by a middle-aged man. The collectors present him with a decree stipulating that he has to pay a tax on wealth. The man protests, saying that they are already bleeding him dry. One of the collectors pushes the man to the ground and shows the pistol he is holstering. They tell him he has a fortnight to pay the new tax, or there will be consequences."
 BSQ_wars.11.a:0 ""
