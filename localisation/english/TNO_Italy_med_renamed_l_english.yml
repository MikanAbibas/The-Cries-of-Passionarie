 ITA_mare_nostrum_economy_med:0 "Mare Nostrum Economy"
 WORLD_med.919.t:0 "Democracy returns to Italy!"
 WORLD_med.919.d:0 "Surprising news came from Italy today, as now former Duce Galeazzo Ciano announced his resignation and the dissolution of the National Fascist Party, or PNF. These actions of Ciano, while surprising to the uninitiated, are the culmination of the long decay of fascism in Italy that began before the death of Mussolini. This decay was, undoubtedly, accelerated by Ciano, who sought to dissolve the old system as he saw that it would only bring ruin to Italy given time.\n\nWhile there are still those in Italy who oppose this, Ciano's victory at the Verona Conference gave him the necessary mandate to ignore and sideline his opponents, leaving very little official opposition to his implementation of democracy. The Italian people now prepare for their first elections in decades, and it is already obvious that there is much excitement throughout Italy at the prospect. As fascism dies where it was born, the world looks to see just who will become the first leader of this new Italy...\n"
 WORLD_med.919.a:0 "Democracy shines in the Mediterranean once more."
 WORLD_med.949.t:0 "Italy Acquires Nuclear Weaponry!"
 WORLD_med.949.d:0 "The Italian government announced earlier today that they successfully tested an atomic bomb earlier this week in the Sahara desert. Furthermore, the Italians have used this news to announce the expansion of the Italian nuclear program. The news has shocked the entire world, as the Italians seemed nowhere near to acquiring nuclear weaponry.\n\nThe ascension of Italy to a nuclear state is something that will drastically impact foreign relations with the rest of the world. Italy's former friends in the Triumvirate must now tread carefully around their former ally, and America and Japan will now most likely treat the Italians as an equal. The unspoken elephant in the room, however, is the German Reich. The two powers have always had a cold relationship, but with the Italians acquiring an atomic bomb, it is clear that German-Italian relations will become even more tense than before. It seems that the Cold War is doomed to escalate even further...\n"
 WORLD_med.949.a:0 "And so the clock moves closer to midnight."
