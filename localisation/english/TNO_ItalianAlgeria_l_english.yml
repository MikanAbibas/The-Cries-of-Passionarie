 ilgevents.1.t:0 "Dirty Deals and Sandy Duty"
 ilgevents.1.d:0 "Castellano was in Algeria for a few reasons. Chief among them were accusations of ties with the Sicilian mafia. It is a sordid affair, and not one he really deserved. Castellano had served Italy loyalty and with distinction. To be caught up in scandal and party politics was something no officer truly desired. The Algerian territory is a backwater, the only enemies were tribal raiders. Still Castellano had not allowed himself to drown in self-pity. The Iberians, who controlled the eastern half of Algeria were not entirely pleased with the current partition of Algeria. If the Triumvirate alliance were to ever fracture, and the tensions and Algeria were to explode then at Castellano would have another chance to prove himself. "
 ilgevents.1.a:0 "Just Another Day in Algeria"
 ilgevents.9.t:0 "An Issue of Manpower"
 ilgevents.9.d:0 "TO GENERAL CASTELLANO\n SIR, WE ARE IN DESPERATE NEED OF ADDITIONAL GROUND FORCES IF WE ARE TO BE COMBAT READY IN CASE OF AN INCRESINGLY LIKELY OUT BREAK OF HOSTILITIES WITH IBERIAN FORCES. AS I SEE IT, WE HAVE TWO OPTIONS AT THE MOMENT. THE FIRST IS TO CONTACT FRIENDLY LOCAL ARMED GROUPS AND INTEGRATE THEM INTO OUR FORCES AS AUXILIARIES. THE SECOND IS TO LOBBY ROME TO SEND A FEW BATTALLIONS OUR WAY. THE FORMER WILL PROVIDE PLENTIFUL BUT POORLY TRAINED AND EQUIPPED TROOPS WHILE THE LATTER WILL LIKELY PROVIDE US WITH FEWER BUT BETTER TROOPS. WE ONLY HAVE TIME FOR ONE. I AM SURE YOU WILL CHOOSE WISELY"
 ilgevents.9.a:0 "The Locals Will Have to Suffice"
 ilgevents.9.b:0 "We Need Seasoned Troops, Not A Rabble!"
 ilg_gov.1.t:0 "An Algerian Deputy"
 ilg_gov.1.d:0 "\"A native deputy, sir?\" \nCastellano was flipping through reports and smiled. "Well lieutenant, we have to show our goodwill and trust now don't we?" He had been deliberating on two different men for the role. The first was Said Boualam. Originally a Francophile politician, Boualam had recently shift to a pro-Italian stance. He was not very popular, or notable for that matter, but he was a reliable ally when it came to brass tacks. On the other hand, Ferhat Abbas, was a staunch proponent for the establishment of an independent Algerian state. He was charismatic, pragmatic, and likely to be an even bigger thorn in Castellano's side if he was given the position. On the other hand, he was well liked and had a strong base, which could make him potentially helpful as well. Castellano suddenly put down his papers and announced outloud..."
 ilg_gov.1.a:0 "Abbas Will Do Fine"
 ilg_gov.1.b:0 "Boualam's Our Man"
 ilg_mil.1.t:0 "Civies In The Government?"
 ilg_mil.1.d:0 "Castellano had decided to continue the military government, but to accomplish that he had been forced to ally himself with the various European settler groups that had set up shop in the territory. Many of these settlers were displeased with the Generals martial government and argued that a civilian would make a better leader. A ridiculous notion, Castellano had no doubt, but their calls of governmental change could snowball into something much more dangerous. He could compromise with them and allow non-military Italian settlers into key administrative positions. That would at least satisfy most of them. The rest would either be too stupid or too radical, to make a difference."
 ilg_mil.1.a:0 "The Army Must Remain Unhindered"
 ilg_mil.1.b:0 "They Might Provide A Fresh Perspective"
 ilg_local.1.t:0 "The Extent of Local Autonomy"
 ilg_local.1.d:0 "Algeria is a rather diverse country with a variety of peoples inhabiting it all at once. Calls for the establishment of local autonomies has been quite popular among nationalists led by Abbas, (probably so he can build as large a support base as possible). Problem for us is that doing so would drastically complicate administration, and I have enough on my plate as is. I could make sure our current unitary form of governance is maintained, if I really needed to."
 ilg_local.1.a:0 "All Power To The Capital"
 ilg_local.1.b:0 "What's The Worst That Can Happen?"
 ilg_local.2.t:0 "The Future High Council"
 ilg_local.2.d:0 "I can't think of any functional nation which doesn't have a legislature. Even the Germans have their cute little party get togethers. In any case, Algeria will be no different and the High Council of Algeria will be a thing of beauty I reckon. Of course, legislatures can vary in makeup and in duty. If I allow a fully elected legislature to form, it will probably be taken by nationalists and other unsavory types who will make my job much worse. I could push for some seats in the Council to be held by appointees, who would be more receptive to the garrison's needs."
 ilg_local.2.a:0 "Appointed Seats Will Balance The Government"
 ilg_local.2.b:0 "Let The People Have Their Votes"
 ilg_local.3.t:0 "The Courts"
 ilg_local.3.d:0 "I have had my fair share of legal busybodies disrupting my efforts to fulfill my duty to Italy. Still, power over legal matters can be a poignant thing. At the current rate of proceedings, Algeria will likely have a fully independent judiciary, modeled after America's. Such an institution could be troublesome in the future, though I am more than able to ensure the courts will remain toothless and subordinate to politicians, and to us above all others."
 ilg_local.3.a:0 "The Courts Will Know Their Place"
 ilg_local.3.b:0 "This Is a Non Issue"
 ilg_local.4.t:0 "Power To Many Or Power To One?"
 ilg_local.4.d:0 "It is utterly ridiculous how much these nationalists want to borrow from the Americans. Didn't Italy win the war? Il Duce would not have accomplished half of what he did if he had been dragged down by empty suits and screeching politicos. A leader with strong legal and administrative powers, especially one friendly to us, could be of great benefit for all. Or maybe I should just let the Arabs do as they please on this matter. Augh, what nonsense. I'm a General, not a politician for God's sake!"
 ilg_local.4.a:0 "Maybe The Algerians Will Have Their Own Mussolini"
 ilg_local.4.b:0 "Power To One is Power To None!"
 ilg_local.5.t:0 "Headlines and Funnies"
 ilg_local.5.d:0 "For God's sake I just saw the most horrible image in a local paper the other day! I decided, graciously I might add, to loosen press controls and allow publishers to print what they wanted, within reason of course. And how am I rewarded? A grotesque caricature of me sobbing violently over Il Duce Mussolini! Offensive! Absurd! I should shut down these charlatans at once! "
 ilg_local.5.a:0 "Yes! Let's Shut Them Down!"
 ilg_local.5.b:0 "Ah Damn It Just Let Them Be"
 ilg_local.6.t:0 "The Garrison and Algeria"
 ilg_local.6.d:0 "While the garrison will remain here as long as Italy remains in control of this sandbox, I do have to decide how much of a public presence will we be. I could just keep the men to the bases, stay out of local affairs, and intervene once or twice if events spiral out of control. Or I run regular patrols, make our presence known as much as possible, and force troublemakers to their heads low?"
 ilg_local.6.a:0 "Patrols And Parades, I Like The Sound Of That"
 ilg_local.6.b:0 "I Am Not Here To Toot My Horn!"
 ilg_local.7.t:0 "Radical Rallies and Why They're Bad"
 ilg_local.7.d:0 "Political associations, professional clubs, and trade unions have been growing in number. Most of these are benign, but some are quite worrying. Algerians communists have started congregating in larger numbers, and some muftis have been making worrisome statements in their preaching. Just yesterday I received a report of a few Himmlerists marching through the capital demanding a form of government similar to Burgundy's! While the last one is probably just some bored youths, I am becoming increasingly concerned that should I allow these people to organize and rally unabated, Algeria will fall to some madmen and cause untold havoc."
 ilg_local.7.a:0 "No Commie or SS Agent Is Going To Take This Country!"
 ilg_local.7.b:0 "There Is No Need To be Paranoid"
 ilgoilcrisis.1.t:0 "The Oil Crisis"
 ilgoilcrisis.1.d:0 "The Near East has fallen into total chaos and with it much of the world's oil supply has been cut off. With the price for oil soaring, many nations have turned to rationing and other measures to prevent their economies and militaries from fully grinding to a halt. While we have not escaped unscathed, Algeria remains an orderly nation, and our local oil industry is well primed to partly alleviate the global oil drought."
 ilgoilcrisis.1.a:0 "Time To Get To Work"

