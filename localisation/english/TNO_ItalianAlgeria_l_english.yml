 #Starting Ideas
 ILG_Wild_Frontier:0 "The Wild Frontier"
 ILG_Wild_Frontier_desc:0 "As an unofficial military governorate in de jure French territory, we do not receive much attention from Rome. This has essentially rendered us useless and impotent, and our only hope for survival is aid from our Italian brethren."

 ILG_Unofficial_Italian_Settlement:0 "Unofficial Italian Settlement"
 ILG_Unofficial_Italian_Settlement_desc:0 "Due to the fact that the territory is ripe for settlement, many poor Italians have immigrated in the hopes of acquiring land. Needless to say, mass immigration of Italians will only compound our miseries due to our weak hold over the area."

 ILG_Saharan_Bandits_Bad:0 "Rampant Banditry"
 ILG_Saharan_Bandits_Bad_desc:0 "A limited military presence and a lack of manpower means that bandits constantly raid our convoys and loot settlements. However, it is at a boiling point, as destitute natives flock to their ranks in the hope of emerging out of poverty, thus making Italian control even more difficult to maintain."

 ILG_Saharan_Bandits_Crisis:0 "Rampant Banditry"
 ILG_Saharan_Bandits_Crisis_desc:0 "A limited military presence and a lack of manpower means that bandits constantly raid our convoys and loot settlements. However, it is at a boiling point, as destitute natives flock to their ranks in the hope of emerging out of poverty, thus making Italian control even more difficult to maintain."

 ILG_Saharan_Bandits_Prevalent:0 "Rampant Banditry"
 ILG_Saharan_Bandits_Prevalent_desc:0 "A limited military presence and a lack of manpower means that bandits constantly raid our convoys and loot settlements. However, it is at a boiling point, as destitute natives flock to their ranks in the hope of emerging out of poverty, thus making Italian control even more difficult to maintain."

 ILG_Saharan_Bandits_Problematic:0 "Banditry Curbed"
 ILG_Saharan_Bandits_Problematic_desc:0 "While our military presence in most parts of Algeria is still limited, we have been able to reduce the scope of criminal operations."

 ILG_Saharan_Bandits_Weakened:0 "Banditry Curbed"
 ILG_Saharan_Bandits_Weakened_desc:0 "While our military presence in most parts of Algeria is still limited, we have been able to reduce the scope of criminal operations."

 ILG_Saharan_Bandits:0 "Banditry Eliminated"
 ILG_Saharan_Bandits_desc:0 "Banditry has been eradicated from the Saharan provinces of Algeria. While Iberian saboteurs and terrorists still make their raids in the border regions, at least we are able to prevent them from wreaking havoc upon our outposts, convoys, and villages."

 ILG_Military_Boost_1:0 "Basic Desert Training"
 ILG_Military_Boost_1_desc:0 "With some reforms, and some training, our men will be able to fight and govern the sands of Algeria."

 ILG_Provisional_Government:0 "Provisional Government of Algeria"
 ILG_Provisional_Government_desc:0 "With this step forward, we state the right of the peoples of Algeria to form a state, even if the land is nominally French. However, with a bureaucracy and functioning system, Algeria will prosper!"

 ILG_upset_natives1:0 "Independence Agitators"
 ILG_upset_natives1_desc:0 ""
 ILG_upset_natives2:0 "Independence Agitators"
 ILG_upset_natives2_desc:0 ""
 ILG_upset_natives3:0 "Independence Agitators"
 ILG_upset_natives3_desc:0 ""
 ILG_military_centric:0 "Army Primacy"
 ILG_military_centric_desc:0 "The Italian Army is the august institution of the territory."
 ILG_settlers_in_gov:0 "Military-Civil Administration"
 ILG_settlers_in_gov_desc:0 "Non-military settlers have been given positions in the government"
 ILG_upset_settlers1:0 "Worried Settlers"
 ILG_upset_settlers1_desc:0 ""
 ILG_upset_settlers2:0 "Worried Settlers"
 ILG_upset_settlers2_desc:0 ""
 ILG_teaching_officers:0 "Algerian Officers School"
 ILG_teaching_officers_desc:0 ""
 ILG_motivated_army:0 "High Army Morale"
 ILG_motivated_army_desc:0 ""
 ILG_fight_for_algeria:0 "Fight For Algeria!"
 ILG_fight_for_algeria_desc:0 ""
 ILG_algerian_union:0 "The Union Government"
 ILG_algerian_union_desc:0 "Algeria has been granted its independence, albeit with strong Italian influence"
 ILG_algerian_mandate:0 "The Republican Government"
 ILG_algerian_mandate_desc:0 "Algeria has been granted its independence with limited Italian interference. The new government remains strongly associated with Italy, however."
 ILG_algerian_oil:0 "Algerian Oil"
 ILG_algerian_oil_desc:0 "Algeria has remained a stable source of oil where all others failed us"
 ILG_victory_in_algeria:0 "Triumph In Algeria"
 ILG_victory_in_algeria_desc:0 ""
 #Focuses

 #Intro#

 ILG_state_of_algeria:0 "The State Of Algeria"
 ILG_state_of_algeria_desc:0 "A de jure territory of the French State, the weakness of that nation has allowed Iberia and Italy to partition most of the territory between themselves. As of now, an official border has not been settled and the territory remains a point of tension between the two powers."
 ILG_state_of_algeria_tt:0 "§YThe history of this place.§!"

 ILG_the_western_frontier:0 "The Western Frontier"
 ILG_the_western_frontier_desc:0 "Our mission is to hold this territory for Italy. While we do not have as much manpower or equipment, spirits are still high as we continue through the 60s."
 ILG_the_western_frontier_tt:0 "§YUpdate Rome on our situation.§!"

 #Banditry

 ILG_saharan_bandits:0 "Saharan Bandits"
 ILG_saharan_bandits_desc:0 "Much of Saharan Algeria remains lawless and outside of our control. Bandits harass towns and conveys nearly unopposed. This is completely unacceptable. "
 ILG_saharan_bandits_tt:0 "§YWe have to find a solution to our bandit problem!§!"

 ILG_pay_informants:0 "Pay Informants"
 ILG_pay_informants_desc:0 "Robbers and highwaymen are often monetary oriented individuals and thus are easily susceptible to corruption. As the saying goes, No Honor Among Thieves."
 ILG_pay_informants_tt:0 "§YWe need to get intelligence on the bandits...§!"

 ILG_eye_on_the_sands:0 "Eye On The Sands"
 ILG_eye_on_the_sands_desc:0 "Recon missions will be conducted to identify bandit hideouts. Any discovered hideouts will be marked for destruction in follow-up operations."
 ILG_eye_on_the_sands_tt:0 "§YRecon missions will be sent into the desert...§!"

 ILG_cavalry_patrols:0 "Cavalry Patrols"
 ILG_cavalry_patrols_desc:0 "We sadly do not have sufficient jeeps and trucks to conduct patrols with, but there are plenty of horsemen in our territory willing to conduct recon for good pay. "
 ILG_cavalry_patrols_tt:0 "§YWe will get elite Libyans to guard the south!§!"

 ILG_native_volunteers:0 "Native Volunteers"
 ILG_native_volunteers_desc:0 "There are plenty local Arabs and Berbers willing to serve us in exchange for money and other rewards. Of course, many also would like to see the bandits gone. It would be foolish not to use them."
 ILG_native_volunteers_tt:0 "§YNatives will be more numerous and efficient than Italians...§!"

 ILG_italian_reinforcements:0 "Italian Reinforcements"
 ILG_italian_reinforcements_desc:0 "We cannot rely on locals! General Castellano will use his political connections in Rome to secure ourselves some reinforcements from home."
 ILG_italian_reinforcements_tt:0 "§YItalians will be brought in to solve the issues...§!"

 ILG_hunt_them_down:0 "Hunt Them Down"
 ILG_hunt_them_down_desc:0 "We are ready to hunt down the bandit plague and destroy them once and for all!"
 ILG_hunt_them_down_tt:0 "§xWe must destroy the bandits!§!"

 ILG_bandit_status_tt:0 "§YTaking these decisions will help §Gsolve§! our bandit problem!§!"

 #Government

 ILG_forming_a_government:0 "Forming A Government"
 ILG_forming_a_government_desc:0 "Up until now, Italian Algeria has been loosely controlled by General Castellano and the local garrison. It's time we establish some formal institutions of governance. "
 ILG_forming_a_government_tt:0 "§YWe must form an effective and capable government!§!"

 ILG_algerian_bureaucrats:0 "Algerian Bureaucrats"
 ILG_algerian_bureaucrats_desc:0 "Many local Arabs have received education of a European standard. If nothing else, we can rely on these men to be competent administrators. Hopefully they don't try anything subversive."
 ILG_algerian_bureaucrats_tt:0 "§YInvite Algerians into the low-level bureaucracy...§!"

 ILG_tribal_self_rule:0 "Tribal Self-Rule"
 ILG_tribal_self_rule_desc:0 "We can't micromanage ever single section of our territory. Allowing local tribe's to govern themselves for the most part will help alleviate some administrative strain. It's not like there's much going on in the Sahara anyway."
 ILG_tribal_self_rule_tt:0 "§YAllow for tribes to rule over their own...§!"

 ILG_italian_governors:0 "Italian Governors"
 ILG_italian_governors_desc:0 "Italian administrators will be installed to oversee each region of Italian Algeria."
 ILG_italian_governors_tt:0 "§YInstate Italian governors for each region...§!"

 ILG_military_high_council:0 "Army High Council"
 ILG_military_high_council_desc:0 "An army high council consisting of General Castellano and his top officers will be formed as the official authority of Italian Algeria. "
 ILG_military_high_council_tt:0 "§YForm an Army High Council to rule Algeria...§!"

 ILG_pied_noir_representation:0 "Pieds-Noirs Representation"
 ILG_pied_noir_representation_desc:0 "The Pieds-Noirs have lived in Algeria long before the Italian settlers reached it. While they are not Italian, they are descended from fellow Europeans, so they in theory should be more sensible than the Arabs or Berbers."
 ILG_pied_noir_representation_tt:0 "§YInvite pieds-noirs to represent themselves in our regime...§!"

 ILG_settler_assemblies:0 "Settler Assemblies"
 ILG_settler_assemblies_desc:0 "The Italian settlers have formed councils to govern their local affairs with. Drawing these councils into our administration would be a natural course of action."
 ILG_settler_assemblies_tt:0 "§YAllow for the formation of settler assemblies...§!"

 ILG_concede_to_natives:0 "Concede To Natives"
 ILG_concede_to_natives_desc:0 "To continue the military administration indefinitely would be a fool's errand. We must eventually concede to civilian authorities. We will make steps to hand over civilian authority to the Algerians, while making sure that they remain firmly within Italys sphere."
 ILG_concede_to_natives_tt:0 "§xConceding to the natives means that the settlers will be upset!§!"

 ILG_concede_to_settlers:0 "Concede To Settlers"
 ILG_concede_to_settlers_desc:0 "We cannot trust the welfare of the territory to anyone else! The Italian garrison will ally itself with the settlers and continue indefinitely!"
 ILG_concede_to_settlers_tt:0 "§xConceding to the settlers means that the natives will be upset!§!"

 ILG_algerian_provisional_government:0 "Algerian Provisional Government"
 ILG_algerian_provisional_government_desc:0 "It is time we formally declare the Algerian Provisional Government and take the necessary steps to turn this wild backwater into something more worthwhile!"
 ILG_algerian_provisional_government_tt:0 "§wA government for Algeria is formed!§!"
 ILG_rule_of_castellano:0 "Castellano's Regime"
 ILG_rule_of_castellano_desc:0 "General Castellano has been given authority over Italy's portion of Algeria and he intends keep it that way."
 ILG_encourage_settlers:0 "Attract New Settlers"
 ILG_encourage_settlers_desc:0 "By providing cheap land and other incentives, new settlers from Italy will arrive in droves. Our grip over Algeria can only tighten!"
 ILG_italian_business:0 "Allies in Italian Business"
 ILG_italian_business_desc:0 "By ensuring safe and easy access to labor and land, we can encourage Italian businesses to make sorely needed investments into Algeria."
 ILG_strong_institutions:0 "Cement Military Primacy"
 ILG_strong_institutions_desc:0 "Laws will be drawn up to ensure that military authority is codified and rules are followed obediently. Dissent will not be tolerated."
 ILG_the_grand_council_of_algeria:0 "Empower the High Council"
 ILG_the_grand_council_of_algeria_desc:0 "The Army High Council will be granted further executive and legislative power. The Castellano and his men will now rule Italian Algeria as they see fit."
 ILG_civilian_question:0 "Civilians in the Government?"
 ILG_civilian_question_desc:0 "There's been some clambering among the settlers for greater civilian authority in the Provisional Government. While we can't accede fully to their demands, it might be wise to reach some compromise with them."
 ILG_fully_millitary:0 "The Garrison Rules Alone"
 ILG_fully_millitary_desc:0 "The Army needs no help or restrains in ruling Algeria. We have done fine by ourselves so far, and we need busybodies and bureaucrats breathing down our necks!"
 ILG_some_civilian:0 "Civilians in the High Council"
 ILG_some_civilian_desc:0 "Allowing some settlers into the High Council will alleviate some tensions. A few of the civvies even have some decent ideas about running the place."
 ILG_carrot_and_stick:0 "The Carrot and The Stick"
 ILG_carrot_and_stick_desc:0 "The local Arabs and Berbers have been agitating for greater autonomy, in some cases full independence. While the brutish Germans would just respond by killing everyone, we Italians are much more sensible than that. Of course, letting a few heads role won't hurt either."
 ILG_encourage_loyalty:0 "Reward Loyalty"
 ILG_encourage_loyalty_desc:0 "Many locals have served us with honor and distinction so far. We will make sure these exceptional individuals are rewarded appropriately, and that their peers know that these men are an example to be followed."
 ILG_purge_riff_raff:0 "Purge the Riff Raff"
 ILG_purge_riff_raff_desc:0 "Too many troublemakers have been leftover from our anti-bandit operations, It's time to clean house!"
 ILG_ancient_legacy:0 "Ancient Legacy"
 ILG_ancient_legacy_desc:0 "Many centuries ago, this land was firmly in Roman hand. It was lost during Germanic and Arab invasions, but now it is firmly back where it belongs under the Eagle."
 ILG_modern_sensibilities:0 "Modern Sensibilities"
 ILG_modern_sensibilities_desc:0 "Treating Algeria as nothing more than a military outpost is ridiculous. We'll make steps to turn our new colony into something admirable!"
 ILG_prefect_of_algeria:0 "The Prefect of Algeria"
 ILG_prefect_of_algeria_desc:0 "Castellano has triumphed over all his foes and has put all of Algeria firmly under Italian control. Rome has received his efforts well and his dishonor has been wiped away. He has been granted military governorship over the whole territory and a new title, one worthy of his conquest."
 ILG_lay_the_groundwork:0 "Lay the Groundwork"
 ILG_lay_the_groundwork_desc:0 "Building a new state from scratch is no easy task. If the Garrison is to complete its task successfully. We will need work step by step in order to address key legal issues that are sure to arise. For this task, we will gather high level officers of the Italian army, Italian political scientists, and local dignitaries as well. "
 ILG_write_the_laws:0 "Write The Laws"
 ILG_write_the_laws_desc:0 "The Garrison has a unique position in the provisional government. If we so choose we can choose to intercede and write constitutional laws that will favor us and our Arab allies. Laws that strengthen central authority and ties to Italy will benefit us. Of course, we can simply not interfere. The extent of our interference will likely determine the nature of Algeria and its leadership once the provisional period has concluded. "
 ILG_federalization:0 "The Extent Of Centralization"
 ILG_federalization_desc:0 "Centralizing power around the government would grant us greater strength, though it would also probably cause some tensions between the central government and the regions"
 ILG_the_council:0 "The Makeup of the Legislature"
 ILG_the_council_desc:0 "The composition of the future High Council of Algeria will be a matter of great importance."
 ILG_the_judiciary:0 "Independence of the Judiciary"
 ILG_the_judiciary_desc:0 "Allowing an independent judiciary would make politics and laws harder to control. Or if you are of a different inclination, it would help fight corruption."
 ILG_executive_authority:0 "Extent of Executive Powers"
 ILG_executive_authority_desc:0 "A strong executive, unconstrained by any courts or legislators, would be able to act decisively and freely. A strong executive would also be more tyrannical, and prone to hasty action."
 ILG_press_protections:0 "The Issue of Press Protections"
 ILG_press_protections_desc:0 "Protections for the press and the right to freely criticize is something that has been pushed by Algerian nationalists as of late. They will probably use these freedoms to publish critical pieces of Italy. Should we let them do as they please?"
 ILG_the_garrisons:0 "The Garrison's Place"
 ILG_the_garrisons_desc:0 "What should the garrison's place be in the future government. We could adopt an official non-intervention stance, or we could lobby for a political role in the new government."
 ILG_the_right_to_organize:0 "The Right to Organize"
 ILG_the_right_to_organize_desc:0 "Organizing political movements necessary for a fledgling nation. Of course, we Italians don't want the arabs to organize a WRONG kind of movement, do we? "
 ILG_a_new_government:0 "The New Algeria"
 ILG_a_new_government_desc:0 "Algeria stands united. It is high time we step aside and allow a new Algerian led government to form."
 ILG_maintain_contact_with_the_italians:0 "Maintain Ties With Italy"
 ILG_maintain_contact_with_the_italians_desc:0 "We need to maintain diplomatic relations with Italy to promote trade, cultural exchange, and mutual understanding."
 ILG_enshrine_property_rights:0 "Protect Italian Property"
 ILG_enshrine_property_rights_desc:0 "For the future of our country and all its citizens, we need to protect the property rights of Italian citizens and businesses to promote investment and economic growth."
 ILG_denounce_the_iberians:0 "Denounce the Iberians"
 ILG_denounce_the_iberians_desc:0 "The Iberians are oppressors and imperialists! They only wish to seize Algeria for themselves and not its people!"
 ILG_the_need_for_industry:0 "The Need for Industry"
 ILG_the_need_for_industry_desc:0 "Develop a strong industrial base to promote economic growth, create jobs, and reduce dependence on foreign imports."
 ILG_algeria_for_all:0 "An Algeria For Everyone"
 ILG_algeria_for_all_desc:0 "Some radicals might bemoan the presence of the various settler groups in Algeria, but the fact is we need them, and scaring them away will do us no good."
 ILG_trouble_on_the_border:0 "Trouble To The West"
 ILG_trouble_on_the_border_desc:0 "A showdown with our Iberian counterparts is inevitable. We must make ready for war!"
 ILG_algerian_army:0 "Establish the Algerian Army"
 ILG_algerian_army_desc:0 "Italy may not always be here to protect us. We must take matters into out own hands and forge our own army!Italy may not always be here to protect us. We must take matters into out own hands and forge our own army!"
 ILG_officers_school:0 "Create An Officers School"
 ILG_officers_school_desc:0 "The Italians have graciously offered to help establish a school for military officers to provide training and education in leadership, tactics, and strategy"
 ILG_stoke_patriotism:0 "Stoke Patriotism"
 ILG_stoke_patriotism_desc:0 "We promote national pride and patriotism through propaganda, media, and public events."
 ILG_our_land:0 "Our Land And Noone Elses"
 ILG_our_land_desc:0 "We will assert Algeria's sovereignty and territorial integrity, and defend its borders against any threats."
 ILG_expand_garrison:0 "Expand the Garrison"
 ILG_expand_garrison_desc:0 "Castellano has done well with what has been available so far, but we're going to need reinforcements if the Algerian garrison is going to be an effective fighting force worthy of Italy."
 ILG_equipment_shipments:0 "Expedited Shipments"
 ILG_equipment_shipments_desc:0 "Castellano has pulling all the strings to make sure we get the equipment we need."
 ILG_mechanize_the_infantry:0 "Vehicles For The Troops"
 ILG_mechanize_the_infantry_desc:0 "It is neccessary to provide the infantry with modern vehicles and equipment to improve mobility and effectiveness."
 ILG_desert_armor:0 "Desert Armor"
 ILG_desert_armor_desc:0 "We can develop and deploy armored vehicles and equipment specifically designed for desert warfare."
 ILG_lessons_from_the_war:0 "Lessons From World War Two"
 ILG_lessons_from_the_war_desc:0 "North African campaign taught Italy many harsh lessons about war. We can take those lessons and adapt them to our present situation."
 ILG_italian_manufacturing_support:0 "Italian Manufacturing Support"
 ILG_italian_manufacturing_support_desc:0 "We must collaborate with Italian manufacturers to produce high-quality military equipment and supplies."
 ILG_build_airbases:0 "Found New Airfields"
 ILG_build_airbases_desc:0 "New airbases and airfields can improve air power and defense capabilities."
 ILG_old_planes:0 "Import Old Italian Aircraft"
 ILG_old_planes_desc:0 "Older Italian aircraft can form the basis of our new air force and provide training opportunities."
 ILG_conscript_locals:0 "Implement Conscription"
 ILG_conscript_locals_desc:0 "It might be necessary to start conscripting Arabs and Berbers more, as unpopular as this might be."
 ILG_a_fine_victory:0 "Another Fine Conquest"
 ILG_a_fine_victory_desc:0 "Once Again Italy has triumphed over her enemies. The Empire stands tall once again!"
 ILG_oil_exploration:0 "Dig For Black Gold"
 ILG_oil_exploration_desc:0 "We will launch a comprehensive oil exploration program to discover new reserves and increase domestic production."
 ILG_the_spoils_of_victory:0 "The Spoils of Victory"
 ILG_the_spoils_of_victory_desc:0 "The Iberians left much behind, and it would be a shame to leave it lying around."
 ILG_italian_academia:0 "Bring Over Italian Academics"
 ILG_italian_academia_desc:0 "Italian academics and experts can share their useful knowledge and expertise in fields such as engineering, science, and technology"
 ILG_oil_troubles:0 "Oil Troubles"
 ILG_oil_troubles_desc:0 "The crisis in the Near East has sent oil prices skyrocketing. Fortunately for us, our nation remains in stable condition and we have plenty of oil to go around."
 ILG_increase_output:0 "Increase Output"
 ILG_increase_output_desc:0 "Output must be increased to keep up with demand.""
 ILG_new_infrastructure:0 "Lay Down New Infrastructure"
 ILG_new_infrastructure_desc:0 "New infrastructure, including roads, pipelines, and storage facilities, will be constructed to support the growth of the oil industry."
 ILG_better_drilling_tech:0 "Improve Extraction Techniques"
 ILG_better_drilling_tech_desc:0 "We should invest in research and development to improve drilling and extraction techniques, increasing efficiency and reducing costs."
 ILG_help_italy:0 "Assist Italy"
 ILG_help_italy_desc:0 "Italy has been starving for oil for too long. We are obligated to assist them, and surely they will be quite grateful for our loyalty and friendliness."
 ILG_ship_oil_abroad:0 "Oil Across the Seas"
 ILG_ship_oil_abroad_desc:0 "There are other nations elsewhere that also need oil to fuel their armies and industries. We'll gather together a merchant fleet to export our product abroad. "
 ILG_no_crisis_here:0 "No Problems Here!"
 ILG_no_crisis_here_desc:0 "What oil crisis? We have plenty of oil! We could practically bathe in the stuff!"
 ILG_reap_the_rewards:0 "From Chaos: Opportunity"
 ILG_reap_the_rewards_desc:0 "The oil crisis has given us an excellent opportunity to enrich ourselves. Algeria is now far from the backwater it was many years ago."
 #Events#
 ILG.1.t:0 "A Call From Rome"
 ILG.1.d:0 ""Surrounded by half a dozen of his most trusted aides and subordinates, the General let out a heavy sigh, then turned to the myriad of maps and charts that covered the large table in the middle of an otherwise plain meeting room. Not much time was present to prepare the bases for the arrival of new troops, officers, and volunteers, and thus most of their meetings and all of their dwelling took place in drab military warehouses, which at the very least offered an escape from the desert's heat.\n\nPrior to the Call, the sizeable Algerian garrison was mostly neglected to fighting a losing war against the Arabs, against the pied-noirs, and against their own commanders who themselves were desperate to free up resources for more productive theatres. Indeed, some of the men now present were still dealing in task-forces and insurgency tactics, seemingly unaware that the campaign which they were now drawing up would be the largest since the second world war.\n\nGiuseppe himself has earned his spurs fighting in old Yugoslavia, and was willing to turn a blind eye to some of their naivety. And yet, as the discussions turned increasingly to nuanced debates of the theoretical, he saw the need to interfere.\n\n"This is not a matter of this passway or that. This. This is not a conflict of skirmishes and villages, This is a battle. A battle of cities, and railways, and will. The Duce has declared that Algeria will be a battlefield, and I intend to deliver him a victory. The Spaniards will rue the day they first looked across their blasted side of the border and thought they saw opportunity, and if they do not, then I intend to personally accept their surrender from the port of Casablanca. You are here to do your part for the eternal march of our Empire, so will you?"""
 ILG.1.a:0 "The olive branch is spent."

 ILG.2.t:0 "An Offer They Can't Refuse"
 ILG.2.d:0 "Mohamed Boudiaf was not a particularly intimidating character - the man was dressed in a western suit, and an onlooker who chanced to meet him might use the word 'smart' to describe his character. But smart was not good enough in the world of diplomacy. The natives were not on a single knife's edge, but trapped between the blades of a scissor.\n\nThe meeting was arranged with considerable speed, and two men now sat in an airy living room somewhere south of Constantine. Quickly settling into French as a common language between them, Italian negotiations with the Algerian FNL henceforth began. Only a few hours later, Italy's ambitions had made very little progress.\n\n"Here. Here we have undeniable proof of a series of crackdowns the Iberians carried out in the eastern provinces, Italy offers all of her condolences and only asks that-"\n\n"The Italian garrisons have killed sixteen of our men this past week. Thirty civilians were buried this month alone, we do not wish to hear of condolences."\n\n"And..." The man continued, feigning a confidence that was slipping by the second. "And only asks that it be allowed to prove its dedication to the Algerian cause by offering a new set of reforms."\n\n"The French tried reforms." The revolutionary replied.\n\nIt took days before an agreement was reached. One which, on paper, granted Algeria minor reparations and significant autonomy. It was truly a blessing then, that Rome did not intend to follow through with empty words, written on meaningless paper."
 ILG.2.a:0 "Dispatch received."

 ILG.3.t:0 "Iberia Attacks!"
 ILG.3.d:0 "The inevitable has finally come to pass: After a short period of complete diplomatic silence from Iberian Algeria, armed militias have been spotted crossing the border in Kabylie, Touggourt, Adrar, and several other regions along the Italian frontier. Although war has not been officially declared by either of our countries, one thing is clear: Iberia has begun a military offensive directly into Italian Algeria.\n\nUpon hearing of the situation, the initial response from mainland Italy has been disappointingly unalarmed - vague promises for extra shipments of equipment and manpower, and sometimes, nothing more than words of support. The ability for our inevitable calls for reinforcement to successfully maneuvere the tense political situation in Rome is not certain, and if the mainland decides that the cost of holding Algeria to be simply too great, it is possible that we may be left with very little, if any, additional support from Italy for the remainder of the war. Adding onto our troubles, this conflict shall certainly exacerbate our already significant issues with banditry; as more and more of our security forces are redirected to the Iberian front, and increasing amounts of our already scant supplies is lost to the scorching Algerian desert, roving hordes of native bandits may find easy opportunities for convoy raiding, further hurting our supply.\n\nIn any case, all of our currently deployed military forces are quickly beginning to mobilize, and any additional militias we can muster are being activated. As our few operational aircraft scramble off their runways, and ragtag groups of native platoons begin their trek through the Algerian desert, many question if we are capable of actually staging an offensive into the Iberian military government to expel their forces from Algeria entirely, and failing that, if we are capable of even repelling the incoming Iberian assault. Regardless, the battle for Algeria has begun. "
 ILG.3.a:0 "We must repel the Iberian Invaders!"

 ILG.4.t:0 "A Call From Rome"
 ILG.4.d:0 "Only a few hour's notice gave Mario Pirani the time he needed to prepare for the call.\n\nMattei had always joked that, if the Duce was to take a walk into his office one day and ask him to salute out of courtesy, then the ENI would be shut down on that same day. Since then, Mario had gained a better grasp of the pigsty that had become Italian politics, and more than enough betrayed comrades to haunt him for a living.\n\nYet even all of those years later, a call from the PNF - And it was still the PNF, no matter how Ciano chose to tell it - still left a bad taste in his mouth.\n\nAlerted by a tip from one of his men in the ministry, the chairman of the ENI expected the call and made his preparations in advance. If knowledge was indeed power then he would need all the strength he could muster to overturn the new strand of stupidity that had overtaken the government as of late: War would blow past and cast away everything the ENI had worked towards for the past decade, and he was not the only one that thought so. In Iberia, every investor with a head on their shoulder was begging for conflict to be averted just as desperately as he was.\n\nCarefully calibrating his words and making conformations with his various connections in Lisbon and Algiers, Pirani prepared as best he could for the trial that was to come. His theme, he had decided, would be the one word that both Dictators and Dogs of war could both read and fully comprehend.\n\nWhen the phone rang, he answered with a smile.\n\n"I am not talking of peace, no. I have no desire to subject Italy to the humiliations of a war forfeit." He leaned back, "What I am talking of, dear sir, is profit." "
 ILG.4.a:0 "...And Algeria is an opportunity like no other."

