 #Event 
 PPR_wars.1.t:0 "Ambush"
 PPR_wars.1.desc:0 "A compact military convoy rumbles toward a narrow bridge, its engines growling under the weight of armored trucks. Without warning, a deafening explosion erupts, shattering the bridge into a cascade of twisted steel and crumbling concrete. The convoy screeches to a halt, dust and smoke swirling in the air. From the dense underbrush flanking the road, a band of militias emerges, their movements swift and coordinated. Brandishing rifles and moving with lethal precision, they unleash a ferocious ambush, catching the stunned soldiers off guard. \n\nThe skirmish is brutal but brief, the crack of gunfire echoing through the ravaged landscape. The militias swiftly overpower the surviving troops, binding their wrists and herding them into a tight group. With cold efficiency, the attackers claim the convoy’s trucks, loaded with supplies, and vanish into the horizon, leaving only the smoldering ruins of the bridge behind."
 PPR_wars.1.a:0 "In And Out"

 PPR_wars.2.t:0 "Red Economy"
 PPR_wars.2.desc:0 "In a dimly lit office, heavy with the scent of stale coffee and old leather, Cunhal and Antunes sit across a cluttered mahogany desk. Antunes leans forward, his brow furrowed, and breaks the tense silence. “The economic policies aren’t delivering, Cunhal,” he says, his voice tight with frustration. “We’re bleeding resources, and the war effort demands results. We can’t keep stumbling forward like this—changes are inevitable.” Cunhal, lounging in his chair with a smug curl to his lips, tilts his head. “I could’ve told you they’d fail from the start,” he drawls, his tone dripping with self-satisfaction. “We need to pivot—full state control, no half-measures.” Antunes’ face flushes crimson, his fist slamming the desk as he erupts. “Why the hell didn’t you speak up sooner?” he bellows, his voice reverberating off the walls. Cunhal merely shrugs, unfazed, stoking Antunes’ anger further. But the outburst fades as quickly as it flared. Antunes slumps back into his chair, exhaustion etching lines deeper into his face. “Fine,” he mutters, rubbing his temples. “I’ll arrange a meeting to discuss it—temporary state control, at least for now. But this better work.”"
 PPR_wars.2.a:0 "It Has To"

 PPR_wars.3.t:0 "Argument"
 PPR_wars.3.desc:0 "In a cavernous conference room, where the hum of fluorescent lights underscores the weight of deliberation, Carlos Antunes presides over a tense government meeting. The table is strewn with papers outlining the draft of the government’s political program, and a murmur of agreement ripples through the attendees as they nod over its core tenets. But discord simmers among the members of the PPRI, who quibble over minute details, their voices sharp with dissent. \n\nÁlvaro Cunhal, the PPRI’s general secretary, rises abruptly, his chair scraping against the polished floor. At nearly sixty, his wiry frame and stern gaze command attention, though his voice carries a measured threat. “If these points aren’t reconsidered, I’ll walk out,” he declares, his words slicing through the room’s fragile harmony. Antunes, a towering figure in his early thirties, his thick beard framing a scowl, surges to his feet, his broad shoulders casting a shadow across the table. “You’d fracture this government over petty details?” he roars, his deep voice reverberating with indignation. “This is no time for ultimatums, Cunhal!” His imposing presence dwarfs the older man, and the other PPRI members, cowed by the confrontation, fall silent, their eyes darting between the two. A heavy pause blankets the room before Cunhal, his lips pursed, lowers himself back into his seat. Antunes follows suit, his chair creaking under his weight, and the meeting lurches forward, the air still crackling with unresolved tension."
 PPR_wars.3.a:0 "Unity?"

 PPR_wars.4.t:0 "This Land is Our Land"
 PPR_wars.4.desc:0 "Your private property has just been collectivized in the name of the people."\n\n"Excuse me?"\n\nGuilherme knew that the times were hard, and that the "great Iberian proletarian revolution" was supposed to come any day now, but this? This was barbary! Who did these people think they were, exactly?\n\n"I said," the militiaman repeated, slightly annoyed at his unintentional host's stubbornness, "your private property has just been collectivized in the name of the people. This herdade shall from now on belong to the people, and shall serve as a base for further PPRI operations."\n\n"Hold up, hold up, hold-" Guilherme said, burying his face in his hands, "What the hell do you think you're doing? I'm an honest man, I've never done anything wrong to you people, what are you-"\n\n"Listen, I don't doubt you were a nice farmer owner who treated his workers just the right way," the man interrupted, with a falsely affected voice, "but do you really think the people's revolution gives a damn about that? You heard me, people! Start packing!" he added, shouting at the men standing next to him.\n\nWell, there had to be a way out of this, right? They weren't gonna just steal his home, without him having a single word to say about it, no! He was Guilherme de Carvalho, dammit! He wasn't going to be expropriated by some red-tinted dimwits!\n\n"No, but I don't think you understand. You see, um-"\n\nGuilherme's pleas suddenly met the butt of the revolutionary's rifle, sending him straight to the floor. The great revolution was here at last, it seemed, and yet..."
 PPR_wars.4.a:0 "Guilherme wished it didn't come at all."

 PPR_wars.5.t:0 "Hushed Discussion"
 PPR_wars.5.desc:0 "As the meeting adjourns, the clatter of chairs and rustle of papers fill the conference room, now tinged with the faint scent of ink and cigarette smoke. Party members file out, their footsteps echoing in the high-ceilinged hall, but Álvaro Cunhal, lingers near the door, his sharp eyes locking onto Francisco Martins Rodrigues, the fiery leader of the revolutionary front. Cunhal steps closer, his voice low and cutting, laced with historical reproach. “You’re treading a dangerous path, Rodrigues, falling into the same traps as Bukharin,” he warns, his thin fingers jabbing the air for emphasis. “Bukharin’s missteps lost the war to Germany—don’t repeat his mistakes here.” Rodrigues, his face weathered but defiant, lets out a sharp, mirthless laugh that reverberates off the walls. “I appreciate your concern, Cunhal,” he retorts, his tone dripping with sarcasm, “but I won’t be the one steering Portugal into totalitarianism.” His eyes glint with conviction, though a faint edge of irritation betrays his calm facade. Cunhal’s jaw tightens, his gaze unyielding, but both men sense the futility of pressing further. With a curt nod, they part ways, the air between them thick with unresolved tension, their footsteps fading into the corridor’s dim light."
 PPR_wars.5.a:0 "For Iberia, Only The Best"