 ### Balbo diplomatic tree - Mediterranean Italy rework.
 ### Event and idea _desc values are left empty; descriptions are authored by hand.
 ### The _tt keys are mechanic tooltips, not flavour, so they are filled in.

 ### --- Washington ---
 ITA_med_diplo.1.t:0 "An Offer from Rome"
 ITA_med_diplo.1.d:0 ""
 ITA_med_diplo.1.a:0 "There is room for an understanding."
 ITA_med_diplo.1.b:0 "Rome is no partner of ours."
 ITA_med_diplo.2.t:0 "Washington Accepts"
 ITA_med_diplo.2.d:0 ""
 ITA_med_diplo.2.a:0 "A door opens in the west."
 ITA_med_diplo.3.t:0 "Washington Declines"
 ITA_med_diplo.3.d:0 ""
 ITA_med_diplo.3.a:0 "Then we stand alone a while longer."

 ### --- Ankara ---
 ITA_med_diplo.10.t:0 "The Bosphorus Proposal"
 ITA_med_diplo.10.d:0 ""
 ITA_med_diplo.10.a:0 "The Straits will open both ways."
 ITA_med_diplo.10.b:0 "The Straits are ours alone."
 ITA_med_diplo.11.t:0 "Ankara Accepts"
 ITA_med_diplo.11.d:0 ""
 ITA_med_diplo.11.a:0 "Passage is granted."
 ITA_med_diplo.12.t:0 "Ankara Declines"
 ITA_med_diplo.12.d:0 ""
 ITA_med_diplo.12.a:0 "The Straits stay shut."

 ### --- Tokyo ---
 ITA_med_diplo.20.t:0 "A Return to Tokyo"
 ITA_med_diplo.20.d:0 ""
 ITA_med_diplo.20.a:0 "Old friendships are worth renewing."
 ITA_med_diplo.20.b:0 "Rome has chosen its side."
 ITA_med_diplo.21.t:0 "Tokyo Accepts"
 ITA_med_diplo.21.d:0 ""
 ITA_med_diplo.21.a:0 "The eastern winds turn favourable."
 ITA_med_diplo.22.t:0 "Tokyo Declines"
 ITA_med_diplo.22.d:0 ""
 ITA_med_diplo.22.a:0 "So much for the eastern winds."

