 ### --- World reaction to Balbo's endings (WORLD.4100-4102) ---
 ### Titles only; the descriptions are the author's.
 WORLD.4100.t:0 "[Get_newspaper_header]Balbo's Italy Endures"
 WORLD.4100.desc:0 ""
 WORLD.4100.a:0 "Rome has made its case."
 WORLD.4100.b:0 "Let them have their moment."
 WORLD.4101.t:0 "[Get_newspaper_header]Balbo's Italy Muddles Through"
 WORLD.4101.desc:0 ""
 WORLD.4101.a:0 "It will have to be enough."
 WORLD.4101.b:0 "Neither triumph nor collapse."
 WORLD.4102.t:0 "[Get_newspaper_header]Balbo's Italy Falters"
 WORLD.4102.desc:0 ""
 WORLD.4102.a:0 "We asked too much of one man."
 WORLD.4102.b:0 "The Empire was always going to tire."

