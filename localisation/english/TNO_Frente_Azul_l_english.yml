 #Events 
 FZL_wars.1.t:0 "The Book"
 FZL_wars.1.d:0 "Arrese sat at his desk, hunched over a dog-eared copy of Mein Kampf. It was gifted to him many years ago when he visited Germany. He had read it many times before, and now he was reading it again. \n\nTo him, this book was everything, for he truly believed that the salvation of Spain lay within its pages. To him, it was the finest work of the century, and it wounded him that many of his countrymen refused to study it. \n\nTheir mistake, but no matter. He would teach them all in time."
 FZL_wars.1.a:0 "My Struggle"

 FZL_wars.2.t:0 "Noise Control"
 FZL_wars.2.d:0 "Cara al Sol blared from crackling speakers. Some idiot had turned up the volume way up, and the sound was deafening. "GOOD SONG, YEAH!?" his brother, Roberto yelled. "IT'S BETTER WHEN IT'S NOT BLOWING OUT MY EARDRUMS!" he yelled back. \n\n"I LIKE IT," Roberto continued, "VERY PATRIOTIC!" \n\n"YOU'LL BE FEELING VERY PATRIOTIC WHEN WE ARE ALL DEAF" \n\n"THAT'D BE SOMETHIN. YOU THINK WE'D GET A MEDAL FOR THAT?" \n\n"SHUT UP YOU IDIOTS," someone behind them said."
 FZL_wars.2.a:0 ""I CAN'T HEAR THE SONG!""

 FZL_wars.3.t:0 "Bad Ideas"
 FZL_wars.3.d:0 "In the dimly lit censorship office, the official sat at a heavy oak desk, the air thick with the scent of ink and dust. He turned the pages of a worn, illicit book circulating in underground circles, his brow furrowing as he marked passages with a red pencil. His report, scrawled in precise script, read: Promotes communism and separatist ideals, undermines public morality. With a final flourish, he delivered the verdict: Full ban of the book; burn all requisitioned copies and any others obtained henceforth; arrest and interrogate anyone found in possession."
 FZL_wars.3.a:0 "Burn Them All"

 FZL_wars.4.t:0 "Blue Dawn"
 FZL_wars.4.d:0 ""Friends, and countrymen, we are confronted with the greatest crisis Spain has faced since the civil war! The Union with the Portuguese has failed! Once more, ungodly and degenerate Semites threaten all we hold dear! The other so called Falangists have forgotten their roots, and have forgotten the sacrifice of Primo de Rivera! \n\nWe must save Spain from these ingrates and lead the Spanish people to a bright future!" \n\n-Excerpt from José Luis Arrese's inaugural speech to the Falange Española."
 FZL_wars.4.a:0 "FOR SPAIN AND NOTHING ELSE!"

