 #Ministers and leader traits
 POLITICS_ANTONIO_DE_OLIVEIRA_SALAZAR_WARS_DESC:0 "It would be quite unfair to dismiss Antonio de Olivera Salazar, the leader of Portugal since 1932, as merely an obstructive bureaucrat. Coming to power in Portugal a few years before Franco gained control of Spain, Salazar was a political power player in his own right. Only under the pressure of German troops seizing Angola and Mozambique did he decide to accept a deal with his own personal devil. When Franco approached Salazar to create a defensive-pact-turned-nation, he accepted reservedly, merging Portugal with the similarly right-wing nation of Spain. Now the Iberian Union, the two countries would work together in harmony... at least in theory.\n\nIn actuality, however, this could not be further from the truth. Salazar was not concerned with the welfare of the Union so much as the welfare of Portugal. Wielding a desire to protect his nation from anything that might harm her in the one hand, and an almost pathological obsession with vetoing proposals that would solidify the Union further in the other, Salazar quickly gained a reputation in the Council for being obstructive. His paranoia concerning "Spanish oppression of Portugal" led to many a confrontation with Franco himself, who saw him as one of many reasons why Iberia was likely to fall apart. With Franco's attempted passing of the "Law of Succession", meaning Portugal's absorption into Spain through the reinstallation of the monarchy after the deaths of the Caudillos, the divide between the two was firmly set. This was despite Salazar removing old shirt falangist elements who had attempted to stage a coup against the Union.\n\nYet it had not been Salazar's obstructionism which had led to the collapse of the Union. That blame could be entirely dropped at Franco's feet, for the Spanish dictator had failed to effectively deal with the Basque revolt. Salazar had fled Madrid for Lisbon soon after, declaring independence for the state of Portugal in an Iberia now torn apart by civil strife."
 POLITICS_ANTONIO_DE_OLIVEIRA_SALAZAR_DIVORCE_DESC:0 "It would be quite unfair to dismiss António de Olivera Salazar, the leader of Portugal since 1932, as merely an obstructive bureaucrat. Coming to power in Portugal a few years before Franco gained control of Spain, Salazar was a political power player in his own right. Only under the pressure of German troops seizing Angola and Mozambique did he decide to accept a deal with his own personal devil. When Franco approached Salazar to create a defensive-pact-turned-nation, he accepted, merging Portugal with the similarly right-wing nation of Spain. However, the dream was not meant to be.\nAttrition with his fellow Caudillo, the internal turmoils, the exhaustion and stress of age, a thousand reasons could be given to the end of the Union, yet none of them really matters in the end. Now, at his personal house, he oversees the rebuilding of a Portugal that, once again, stays on their own lonesome self against a rapidly changing world.\n\nOne he is certain he will not live to see past this decade."
 
 POR_Jaime_Melo:0 "Jaime Álvares Pereira de Melo"
 POLITICS_JAIME_I_DESC:0 "Despite being relatively unknown to the masses in Portugal, Dom Jaime Álvares Pereira de Melo was quite an influential figure in the Portuguese high society. The 10th Duke of Cadaval and his mother, Olga de Melo, had made a name for themselves as a cornerstone of the elites of the nation, hosting lavish parties and intellectual gatherings alike. Despite this though the Duke lacked much political interest, being more interested in music and epicure like his mother. This though would be the main reason why, after the death of Salazar, he would be approached by Fernando Santos Costa for the position of King of Portugal. \n\nWhile he would initially be hesitant about the offer, he would eventually be swayed by his mother, accepting the position and becoming the first King of Portugal in over 50 years. However, despite his initial will to step out of politics and let the nation run itself, serving as nothing much more than a rubber stamp, the reality of the Kingdom of Portugal would be marginally different. With the attempted coup of the Republicans leaving many in the Kingdom fearing a total loss of popular support, the King would be pressured to create a new government that would assure that the Kingdom's constitution would be a truly Democratic one. But as the failed coup turned into a Civil War, said government had to focus on defending its presence in order to even have a future. \n\nWith the King being projected to the forefront of politics, meeting with the people, walking with the troops in his old uniform from the Portuguese-German War, and giving speeches to ever-increasing crowds as the face of the new regime, the popularity of the Monarch posed a new issue for the future of the Kingdom. Many in the Kingdom began seeing the Kings popularity as a way to subvert Democracy, pushing for the crown to be more than a figurehead, all under the guise of "stability". While the King himself lacks interest in this, still wishing to step out of politics after the war is done, if he is to be swayed, by himself or others, then true Democracy might still be a ways away from Portugal."
 
