POR_role_of_throne:0 "The Role Of The Throne"
POR_role_of_throne_desc:0 "	While during the creation of the Kingdom few supported the King in having any more power than the minimum he could, as his popularity grew and he proved himself to be effective, some began to genuinely propose the idea and be met with, not backlash, but support. From both the elites and the people.\n\nDue to the Kings neutral position on the issue, the divisive nature of such a topic and the current war on Portuguese soil, the answer to this question has been pushed into the future, for the aftermath of the conflict. What is to come only can everyone wonder, however one thing is known for sure, whatever is chosen, some people will not be happy."

POR_bridge_past_future:0 "A Bridge Between the Past and the Future"
POR_bridge_past_future_desc:0 "Inheriting the mantle of the "Monarquia do Norte", the new Portuguese Kingdom would find itself in a much similar yet different situation to it. Having popularity and legitimacy on a level that the 1919 uprising could only dream of, the crown finds itself in a much better position than its spiritual ancestor.\n\nServing as a bridge between the past and future, the Kingdom represents both the proud past of the country while at the same time preaching a solid path for its future, uniting people that otherwise would not work together under a common banner. However, if the state is able to live up to these large goals only time will tell."

#EVENTS 
POR_wars.1.t:0 "The Death Of Salazar"
POR_wars.1.desc:0 "Salazar was many things, but he was never an outgoing individual. Franco positively delighted in diplomatic visits and the pageantry of official meetings, but Salazar was always aloof to these sorts of things. \n\nIn life, he was hermetic, almost like a monk, and aside from a few affectionate affairs, he lived his life in isolation. \n\nIt is fitting, then, in a sense, that his death was much the same. He died peacefully in his bed from old age. \n\nHis placid face contrasted with the near panic of his subordinates, for they knew this quiet man was the only pin holding the Estado Novo together."
POR_wars.1.a:0 "What Can Be Done?"

POR_wars.2.t:0 "The State Begins to Fracture"
POR_wars.2.desc:0 ""Antonio de Oliveira Salazar is dead." Caetano let the sentence hang in the air. Many faces among the National Assembly contorted themselves into shock and disbelief, acting as if the assassination was a new thing, that he had just announced. "Yet Portugal should not, and will not die with him. Salazar was a great man, but what would do him a stronger disservice than to let his nation rot with him?"\n\n"What greater insult to his legacy, than to leave Portugal corrupt, and decadent? To leave it headless, and powerless to the whims of Madrid? To venture into the old, feudal Dark Ages, and to shy away from progress?" The reaction was mixed. Members of his clique nodded and murmured in agreement. Others, like the Monarchists, jeered at the sentence and deafening boos hit Caetano. That didn't matter to him. No, what mattered was the largest bloc in the assembly - the neutrals and the Salazarians - with their reaction. Rather, their lack of a reaction. Caetano had got their attention, and that is precisely what he wanted. If they gave way to him, so would the entire country.\n\n"That is wh-" \n\nThe doors slammed open. Unending columns of men marched into the hall, every single one heavily armed with automatic weapons and body armour. The equipment betrayed Caetano's initial assumption of a paramilitary. \n\n"Attention, all members of the National Assembly!" The voice was unmistakable. Chief of the General Staff, Francisco da Costa Gomes. "In the wake of abhorrent factionalism, infighting and anti-Portuguese behaviour, I am temporarily dissolving the National Assembly. I want to emphasise that I, nor anyone in the military, will take charge of the nation, and a coup d'etat is not imminent."\n\nMaybe he was imagining it, but Caetano could feel Gomes' eyes watching his every move. Again, the reaction was mixed. This time, it was the Reformists who made their disapproval known. Clammy hands escorted the arch-reformist out of the chamber, like a prisoner being dragged to the electric chair. What was worse? The fact he was seconds away from power? Or the fact he spotted Gomes making idle conversation with the Monarchists, like old work colleagues at a bar?"
POR_wars.2.a:0 "Would Salazar have wanted this?"

POR_wars.3.t:0 "To Crown Portugal"
POR_wars.3.desc:0 "Costa waited in the sitting room. \n\nWith the death of Salazar, Portugal was in imminent danger of collapse. If the regime was to survive the coming years, they needed a unifying figure. None of Salazar’s subordinates, himself included, were up to the task. It was not a competence problem, but a matter of image. \n\nWho could match up to old Salazar, silent and devoted? \n\nA king and no less. \n\nThis was Costa’s initiative, and his compatriots had gone along with it, having no better ideas. Jaime Álvares Pereira de Melo was an aristocrat with ties to the deposed royal family and someone in Costa’s confidence. De Melo had been resistant at first, but Costa had been insistent. And with the way things were going, de Melo didn’t really have a choice. He would walk into the room soon enough, and he would give his answer."
POR_wars.3.a:0 "The Restoration Is At Hand"

POR_wars.4.t:0 "The Kingdom Returns"
POR_wars.4.desc:0 ""I would not come here before you if there was not an alternative!" As Fernando Santos Costa stood on the platform, he let a small smile crawl on the corners of his face. It had been a while since he made grand speeches to soldiers about duty, honour et cetera. But it was good to be back on the stage after so long. "I would not waste your time if my task was not of the utmost urgency. But, it seems that Portugal has lost its way after so long. The nation, and its people, are at a crossroads, you see. A crossroad between law and order - or anarchy and terror."\n\nThe soldiers stood in front of him, did not show any hints of emotion. Why would they? The men had been drilled, day in and day out, to show nothing except cold determination, like automatons. But a soldier could always tell what another soldier is feeling. And Gomes knew that he had their attention. All he needed was their approval. "The so-called Reformists will say that Portugal is a dying nation. They say that there is no hope for the country in its current state. That something must be done. True patriots know differently. I know that we are the greatest nation in the world. I know that our people are some of the most hardworking individuals on the planet. And I know that some believe what I believe."\n\nTime to bring it home. This would be his do or die moment. If the army was on board with him, then nothing would stop him. "I understand those who reject a monarchy. I truly do. But there is no other alternative, soldiers. They are the only people who understand what makes Portugal great - and how to keep it so. Will you join me, my soldiers? Join me in keeping Portugal standing on its own two feet?"\n\nA silence fell. A soldier in the front - not older than 20 - gave a salute. Then another. And another. Soon, the entire crowd joined in silent prayer, as every man followed in the gesture, like dominoes. Costa smiled. As long as the army was on his side, the Monarchy would be inevitable."
POR_wars.4.a:0 "Battle lines are being drawn across the face of Portugal."

POR_wars.5.t:0 "A Deal to Save the Republic" #EVENTS 5 and 6 need to be reprompted and rewritten for new lore
POR_wars.5.desc:0 "Desperate times call for desperate solutions. And there were a few times more desperate than now. Caetano took a sip of his wine, savouring its nourishing bitterness, and closed his eyes. Is this who his allies were now? Dissidents and university students with more time than brains? Yes, they were. Unless he wanted to be consigned under the rug of mediocrity, that is.\n\n"What is it?" A gruff looking man - with piercing, brown eyes that looked like they had seen the depraved depths of humanity - sat down in front of Caetano. Almost reflexively, the man took a fat cigar and held his lighter over the end of it. Yet as far as dissidents went, Varela Gomes stood out amongst the crowd. As legendary for his courage in battle as his wit in the Assembly, the military man was a vital ally to have. There was one minuscule issue\n\n"Lisbon has gone haywire. The entire National Assembly has died and rolled over to the Monarchists. There wasn't...I couldn't do anything to stop them." Caetano locked eyes with the democrat. He still couldn't believe he was working with the democrats. "They have to be stopped. Any means necessary. And I know that you know what I mean by any means necessary. Unle-"\n\n"Fine. I'll help you with your coup d'etat. But I want you to get rid of the Reactionaries in the military if we succeed. I will not accept anything less." Gomes replied, not even pausing to breathe. This was the issue, Caetano thought. He was sure that the democrat would never fancy himself as Mephistopheles - but it seemed that was the role he was to play. \n\nGod, he'd be crucified for this. They would call him insane for purging a potentially loyal chunk of the Army. They would call him a traitor for dealing with "crypto-Bolsheviks" and selling out his nation. They would have been right. But as the sun began to shine a brilliant orange through the treeline, Faust looked at the sky, then shook the Devil's hand."
POR_wars.5.a:0 "Was it worth it?"

