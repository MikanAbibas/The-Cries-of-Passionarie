 #Events 
 ADL_wars.1.t:0 ""
 ADL_wars.1.d:0 "(A huge demonstration in Sevilla is happening in support of the Union of Provincial Councils of Andalucia decision to cut ties with the Republican government. Alejandro Rojas-Marcos, one of the main Andalucist leaders, gives a speech condemning the Republican government for ignoring Andalucía's plights during the war. Andalucía, he says, provided the backbone of manpower and economy for the Republic at the beginning and yet it was ignored. Now Andalucía stands on its own and if the Republic wants to negotiate, it will be as equals"
 ADL_wars.1.a:0 ""

 ADL_wars.2.t:0 ""
 ADL_wars.2.d:0 "Event from the POV of the Sevilla train station Sevilla-San Bernardo. The event mentions the evolution of the station and its passengers from the steam trains of the early 20th century, to the soldiers of Civil War, to the arrival of tourists in the 60s. Finally the station sees how RENFE becomes RAF (Red Andaluza de Ferrocarriles)"
 ADL_wars.2.a:0 ""

 ADL_wars.3.t:0 ""
 ADL_wars.3.d:0 "A look back at the various meetings of andalucists of the late 19th and early 20th century, from the Antequera in 1883 which created a draft of a federal constitution for Andalucia to the meetings throughout the first third of the 20th century involving Blas Infante. Back to the present and in Antequera, various political movements sign a manifesto to set down the values of a future constitution."
 ADL_wars.3.a:0 ""

 ADL_wars.4.t:0 ""
 ADL_wars.4.d:0 "In Sevilla, with the previous administration nullified by the new Andalusian government, Luis Uruñuela has been named mayor of the city. The new town council, composed of local and regional politicians, begins its first session by removing the Republic flag from the balcony and instead putting the Andalusian flag."
 ADL_wars.4.a:0 ""