 ###=====| a) Inauguration Tree |=====###
 ITA_gloria_al_duce_gloria_al_ettore_muti:0 "Gloria al Duce! Gloria al Ettore Muti!"
 ITA_gloria_al_duce_gloria_al_ettore_muti_desc:0 "Finally, the farce of the Quadrumvirate is over, and the true victor arises. After years of righteous struggle, the true bearer of the torch of fascism has triumphed over the incompetent, the reactionaries and the madmen who have been polluting the party for decades: now it falls upon us to realize Mussolini's dream as it was meant to be.\n\nWhile the task at hand is daunting indeed, we are confident in our glorious leader and his ability to turn into reality what, until mere months ago, were nostalgic fantasies. Ettore Muti is a man of action first and foremost, and will not stop until his dreams - our dreams - are realized: he has sworn upon his honor to return Italy to greatness, and we shall stand by his side all the way.\n\nGloria al Duce! Gloria a Ettore Muti!"

 ITA_the_spirit_of_sansepolcro_lives_on:0 "The Spirit of Sansepolcro Lives On"
 ITA_the_spirit_of_sansepolcro_lives_on_desc:0 "Ever since the taking of Fiume, our loyalty has been to the Manifest of Sansepolcro. Within its pages is the true doctrine of fascism as it was meant to be before compromises and bad advisors turned our utopia into a quagmire: a free, fascist society, where men and women are equal in their service to the nation and their devotion to our great history and even greater future; an Empire where all are ready to die for each other and for our glorious Duce, and receive the rewards for their sacrifice equally.\n\nMany thought the spirit of Sansepolcro to be extinguished, but we have endured through the countless purges and the ravages of time. Our numbers have dwindled over time, but those of us who still believe in the dream are ready to take up their black shirts and their warrior spirit as if Fiume had been just the day before: the revolution is not over, it is only just beginning!"

 ITA_deal_with_the_old_order:0 "A Matter of Formality"
 ITA_deal_with_the_old_order_desc:0 "Many in the upper echelons of society look at our revolution with barely-hidden scorn, others with terror. While it would be tempting to throw all these antifascists, reactionaries and fatcats out of their lofty palaces and out into the streets, we know the value of patience: we have played the long game for almost forty years, we shall not squander our hard-earned power for childish eagerness.\n\nTo address this issue, we need to reassure the higher society - mainly the King and the bureaucracy - that we do not mean to turn Italy into a communist dystopia or a mad experiment. Rather, we wish to strengthen our beloved country so that it may recover its lost honor and prestige: by meeting with the leaders of the state and the powers that be, Muti shall convince them that all will be well for them as long as they are loyal to Italy and the revolution..."

 ITA_convince_umberto:0 ""Convince" Umberto"
 ITA_convince_umberto_desc:0 "Despite our wishes, being Duce of fascism doesn't automatically make Ettore Muti head of the Italian government, as the power to appoint the Prime Minister still resides in the King's hands. While in the last forty years this has been nothing more than a formality, we understand now more than ever that the King is highly distrustful of us: given the amount of influence he wields despite his apparent powerlessness, we should tread carefully around him.\n\nTo this end, our Duce will meet with Umberto II at the Quirinale to formally be appointed as Prime Minister. The King will not need much convincing to grant Muti the position he deserves, but respect and good manners are sure to remove most qualms in the King's conscience: he should appreciate our willingness to cooperate, rather than resorting to more "direct" means of convincing..."

 ITA_quis_contra_ducem:0 "Quis Contra Ducem?"
 ITA_quis_contra_ducem_desc:0 "The bureaucracy has great amounts of what the learned call "soft power", with their ability to turn from oil to mud, slowing even the best reform into a quagmire of corruption and red tape. Still, even they understand that patience has a limit: should we be forced, we won't hesitate to show them that a traitor's fate is death, and that a bullet cannot be stalled by paperwork.\n\nOf course, we don't need to actually execute everyone to establish our rule over Italy. A gentleman's agreement with the higher echelons of the state bureaucracy should be enough to reassure them of our commitment to Italy: we wish for peaceful coexistence with everyone who serves Italy and the revolution, and surely they share our same goals, don't they?"

 ITA_deal_with_the_party:0 "Purge the Party"
 ITA_deal_with_the_party_desc:0 "Despite our rivals having been purged throughout the ordeal of the Quadrumvirate, their cronies still haunt the hallowed halls of the PNF. If we want to reform Italy according to our dreams, we need to be able to count on a loyal party to back us in times of need: for this to happen, the remnants of our foes need to disappear.\n\nWhile traitors to Italy and the fascist revolution deserve only the worst for their crimes, we shall be lenient despite all that we suffered. Confinement and forced works for the higher echelons, and expulsion for the lower ranks, should be enough punishment for now: with so many positions of power now free, we'll be able to proceed with our plans seamlessly..."

 ITA_fiume_ora_e_sempre:0 "Fiume Ora e Sempre"
 ITA_fiume_ora_e_sempre_desc:0 "With the party purged from the corrupt and the disloyal, it is time to call back into service our most loyal veterans. Thousands marched that fateful day when we took Fiume and restored Italy's honor, and others joined the Fasci di Combattimento in the following months and years: many of them were lost to purges or to the ravages of time, but many more - grizzled veterans with a lion's white mane and a warrior's heart - are still ready and willing to serve.\n\nThe time has come to sound the clarion and call the righteous to one, final struggle. The revolution beckons, and we need only the best and most loyal if we are to prevail over the many challenges awaiting us: come, veterans of Fiume and Sansepolcro, take what was rightfully yours! You were denied glory and honor for too long, now the party welcomes you back!"

 ITA_un_nuovo_fascismo:0 "Un Nuovo Fascismo"
 ITA_un_nuovo_fascismo_desc:0 "Over the decades fascism has turned from an ideal into a nightmare. Compromise, corruption and incompetence have turned the PNF into a house of cards where backstabbing and bureaucratic quagmire remove all the bright and loyal in favor of self-serving boot-lickers and petty deal-brokers.\n\nWe aim to bring forth a new fascism. Or perhaps, we aim to bring back the old fascism: the one hailing from a time when we considered each other brothers rather than potential rivals, and when swords and daggers were wielded in the defence of our friends rather than with malicious intent."

 ITA_deal_with_the_new_order:0 "Convincing the Italians"
 ITA_deal_with_the_new_order_desc:0 "Comprehensively, the common population of Italy looks at us with distrust, believing us to be only the umpteenth self-serving clique of Gerarchi wishing to gain themselves a lofty retirement bonus. We need to show them that we are different from what they are used to: with our glorious Duce at the helm, Italy will be reformed into a land where everyone can live with dignity!\n\nWith a strong propaganda campaign and massive rallies, we shall begin showing Muti around. He has always had an easy way with the people, and now more than ever he'll need all his charisma to convince our people to support him: our revolution will change the very fabric of our beloved nation, and we won't be able to achieve anything if the common folk isn't on our side."

 ITA_a_new_idea_for_italy:0 "A New Idea for Italy"
 ITA_a_new_idea_for_italy_desc:0 "For the last forty years, Italy has been an autocratic regime where a clique of corrupt, incompetent bureaucrats held sway over the Duce, shoving him here and there in the pursuit of their own gain. The time has come to change that: Sansepolcro envisions a new Idea of Italy, and we'll turn it into a reality.\n\nOur revolution envisions a country where men and women are equal and free to serve their country, each giving what they are capable of giving and receiving in turn what they need to live with dignity. We do not wish to destroy society, but rather reshape it into something that can stand the test of time: our ancestors endured more than a thousand years, and we aim to achieve just that!"

 ITA_all_roads_lead_to_rome:0 "A New Economy for Italy"
 ITA_all_roads_lead_to_rome_desc:0 "A key part in our reforms shall be related to the economy. As of now, a small clique of businessmen and bureaucrats controls the business sector, crushing any competition and therefore restricting opportunities for growth and development: with our economy still recovering after Atlantropa, we shall no longer tolerate such selfishness.\n\nThe people will know that our glorious Duce aims to bring prosperity to the entirety of the nation! By engaging in radio addresses and visiting factories and business, Muti will let the common Italians know of his plans: the economy will be streamlined and enhanced by the state, so that promising business may receive support for expansion, and ailing enterprises struck by the crisis may find a helping hand before it is too late."

 ITA_avanti_muti:0 "Avanti!"
 ITA_avanti_muti_desc:0 "Long ago, before fascism even existed, Benito Mussolini was a socialist. With other like-minded people, he founded "Avanti!", a left-leaning newspaper whose explosive pieces advocated for Italy to claim her long-due place among the great world powers. For his ideas and his opposition to flawed concepts such as the abolition of the idea of "nation", he was purged from the socialist party, and he decided that the ideologies of his time were not enough: from there, he created fascism.\n\nThis is the essence of fascism. An evolution from the ideologies that dominated the first half of our century, a fresh take on all the problems that plagued our society - most of which still do - and the solutions that should be applied: this is what we want to do, and for our plans to succeed, we must return to our roots, and march forward from them.\n\nThe time for action is now!\n\nAvanti!"
 
 ###=====| b) Political Tree |=====###
 ITA_eyes_on_italia:0 "A New Beginning for Italy"
 ITA_eyes_on_italia_desc:0 "With our power cemented in the party and the administration alike, it's time to begin our reforms in earnest. Our Duce wants to transform Italy into something new, something beautiful, and he'll need all the strength we can lend to realize his dream.\n\nThe time has come to bring the fascist revolution to the nation. This will be a new beginning for Italy: like the ancient Phoenix, so shall the Eagle rise from the ashes of its corrupt predecessors!\n\nGloria al Duce, gloria a Ettore Muti!"

 ITA_fanning_the_flame_of_revolution:0 "Fanning the Flame of Revolution"
 ITA_fanning_the_flame_of_revolution_desc:0 "The Italian administration must be the first target of our action. Corruption, incompetence and backwardness have transformed our institutions into a quagmire: it's time to end this sorry state of affairs, and begin anew for the good of Italy!\n\nBy the end of our reforms, the state, the party, and society itself will have been reshaped, so that they can truly reflect the spirit of fascism as it was meant to be.\n\nAvanti!"
 
 ITA_revolution_in_the_palaces:0 "Revolution in the Palaces"
 ITA_revolution_in_the_palaces_desc:0 "The highest institutions of the State have been made dysfunctional by years upon years of corruption, compromise and botched attempts at reforms. Our Duce has been adamant: the Senate - the remnant of the old monarchical order - must be abolished, and the Camera dei Fasci e delle Corporazioni reformed into something that actually serves the people.\n\nThe only problem is how we are supposed to achieve these results. Muti wants to go the direct road, and remove the Senate through a plebiscite, while some of his advisors caution him against making an enemy out of the King, and rather find an agreement with Umberto.\n\nWhat should we do?"
 
 ITA_a_meeting_at_the_quirinale:0 "A Meeting at the Quirinale"
 ITA_a_meeting_at_the_quirinale_desc:0 "The revolution needs to be achieved, but it does not require bloodshed. The King will surely understand the need for reform, and will agree to an exchange: it's not as if he actually has any choice...\n\nMuti will ask for an audience with the King, and together the two will find a way to satisfy both the needs of the people and the role of the monarchy. This is the best route for Italy's stability."
 
 ITA_mutual_assurances:0 "Mutual Assurances"
 ITA_mutual_assurances_desc:0 "The talks are proceeding well, and our envoys have drafted an agreement between the King and the Duce, which of course will remain unwritten and secret outside of the few privileged ones to know about it.\n\nIf Umberto agrees, the Senate will be abolished by Royal Decree and through an official modification to the Albertine Statute. In exchange, Muti will publicly reaffirm his loyalty to the monarchy, and silence some of the more... extremist voices within the new government."
 
 ITA_king_and_duce_united:0 "Emperor and Duce, United"
 ITA_king_and_duce_united_desc:0 "In the end, everything went as predicted. King Umberto has agreed to the Duce's terms, and the Senate will be abolished through an official Royal Decree. Together with this, the Statute will be modified, granting larger powers to the head of government for the good of the nation.\n\nOf course, Muti shall uphold his end of the deal. During one of his rallies, he will praise the King as the "supreme guardian of Italy's greatness" and a "friend of fascism": this will assuage the fears of the royalists, and preserve the realm's stability."
 
 ITA_out_in_the_streets:0 "Out in the Streets!"
 ITA_out_in_the_streets_desc:0 "We don't need the consent of the old order to bring forth our national revolution! The people will say what it thinks of the rotten carcass that is the senate, and will make the right decision, as the people always does...\n\nThe time has come to take matters into our own hands, and show the monarch that our glorious Duce doesn't need things like "royal assent" to lead Italy to Greatness! To the streets, brave Italians: the revolution awaits!"
 
 ITA_call_a_plebiscite:0 "Call a Plebiscite"
 ITA_call_a_plebiscite_desc:0 "The time has come to let the people speak. A plebiscite will be called to settle the matter of the senate, and amend the Albertine Statute by popular will: the King will be enraged, but we care not for the feeble remnants of the old order.\n\nA new dawn is rising for Italy. A government by the people, for the people, through the Duce. The time for talking is over, now is the time to act.\n\nAvanti!"
 
 ITA_the_will_of_the_people:0 "The Will of the People"
 ITA_the_will_of_the_people_desc:0 "As predicted, the people have voted overwhelmingly in favor of abolishing the Senate. There will always be some sycophants calling the vote "piloted" or "a farce" but they fail to see that the nation knows what's best, and can decide for itself without the need for bureaucrats to take those decisions for them.\n\nOut with the old order! Out with the Senate! Their ashes will be fertile ground for the new Italy to grow: a prosperous land, led by the indomitable will of our Duce!"
 
 ITA_reform_the_camera:0 "Reform the Camera"
 ITA_reform_the_camera_desc:0 "With the matter of the Senate solved, now it's time to reform the Camera dei Fasci e delle Corporazioni. Built from the ashes of the old Camera dei Deputati, it was meant to be a speaking ground for the best and brightest, but instead it has become a hub of corruption and rubber stampers: it is time to reform it thoroughly.\n\nThe composition of the Chamber will be changed, and divided equally between elected and appointed members. The first class will be chosen in national election, where the Acerbo electoral law will be changed to allow independent candidates - of course, as long as they declare themselves loyal to fascism and the Duce - while the second will be appointed by corporations and recognized trade unions.\n\nBy doing this, the new Camera will represent both people and economic powers, and the free and fair elections - by our standards of course - will provide competition and avoid stagnation."
 
 ITA_revolution_in_the_pnf:0 "Revolution in the PNF"
 ITA_revolution_in_the_pnf_desc:0 "Despite our initial purges, the Fascist Party is still rife with Cianoists and other reactionaries. It is time to make sure that our common home reflects the values of Sansepolcro, and is a transparent institution, without forgetting the needs of an iron-solid rule.\n\nTo this end, the last remnants of our rivals will be removed from all sections of the party, their place taken by true revolutionaries. In the near future, we'll further overhaul the structure of the PNF to make it so that all Italians may partake in the glory of fascism..."
 
 ITA_enshrine_the_manifesto_of_sansepolcro:0 "Enshrine the Manifesto of Sansepolcro"
 ITA_enshrine_the_manifesto_of_sansepolcro_desc:0 "It is time to change the Statute of the PNF and make it sure that it reflects the new course started by our Duce. The best way to achieve this result is to include the original text of the Sansepolcro Manifest into the official Statute, and make it the main focus of the party's activity.\n\nThe time for compromise and decadence is over. The time of revolution and action has come: together, the Duce and the people will realize the dream of Fiume, and restore our greatness as D'Annunzio did so many years ago!"
 
 ITA_la_case_del_fascio:0 "La Case del Fascio"
 ITA_la_case_del_fascio_desc:0 "For years, the PNF has been monopolized by party bureaucrats and backroom talks. It's no wonder that the common Italian feels us as distant controllers rather than the saviors we are meant to be: this is why Ciano almost lost control of the country, and we won't make the same mistake as him.\n\nThe "Fascist Houses" will be a way to bring the party to the people, and vice versa. By allowing regular meetings and limited political discussion in a controlled environment, we'll make sure that the populace feels represented, and that they understand that their opinion counts for us... at least if it corresponds to the Duce's."
 
 ITA_open_up_the_party:0 "Open Up the Party"
 ITA_open_up_the_party_desc:0 "As of now, membership to the party is mostly seen as an obligation to be included in social welfare programmes or not to be harassed by the Blackshirt. While we have every intention to keep harassing traitors to the country, we need to pass the message that joining the PNF is not a means to an end, or some part of a bribe, but something actually useful to all.\n\nBy purging the party of corrupt members, and ensuring that section Ras partake in local activities, we shall encourage all Italians to join. The more members to the PNF, the more control we have over the country, and the more we can make sure that Italy goes forward on the path of national rebirth."
 
 ITA_back_to_our_roots:0 "Back to Our Roots"
 ITA_back_to_our_roots_desc:0 "With our reforms concluded, we can finally say that the PNF has returned to what it used to be in its glory days. No longer shall it be a hub of corruption and nepotism, a joke to political history across the world: now, it is a structured and wide-reaching organ, spreading truth - our truth, of course - to the masses\n\nFrom now on, the party shall stand by the Duce's side in his quest to bring forth a new age of prosperity for our beautiful country. We'll surely face much opposition to our revolution, and having strong shoulders to lean on will surely make Muti's task much more bearable.\n\nGloria al fascismo!"
 
 ITA_revolution_in_the_streets:0 "Revolution in the Streets"
 ITA_revolution_in_the_streets_desc:0 "The time has come to bring our national revolution to its final recipients. The people will be uplifted from their subservient state, and made protagonists of the glorious rise of fascism: this is something our glorious Duce is adamant about.\n\nWhat remains to decide is the pace of our reforms. Muti would rather advance the revolution like a storm - fast and furious - but there are many voices calling for a slow and steady pace: after all, it's no longer a matter of "if" but only of "when" and "how"...\n\nWhat should we do?"
 
 ITA_the_revolution_waits_no_more:0 "The Revolution Waits No More"
 ITA_the_revolution_waits_no_more_desc:0 "The people of Italy have suffered under the yoke of reactionary traditions and corruption for too long! The time to reflect and think is over: this is a time of action, and of men who know how to strike their foe with the strongest blow.\n\nThe country will be freed from the influences of those who would shackle it for their twisted plans! Our glorious Duce will banish these remnants to the dustbin of history they have long since been destined, and usher forth a new age of equality and progress!"
 
 ITA_arise_women_of_italy:0 "Arise, Women of Italy!"
 ITA_arise_women_of_italy_desc:0 "A truly fascist society can no longer tolerate the subservient state of the woman. A woman's duties to the state are as far-reaching as a man's, and her gift of motherhood should be a reason for glorification rather than enslavement: we shall correct this mistake posthaste.\n\nFrom today onwards, women shall be granted equal rights to men. No longer will they be prevented from voting, no longer shall they be punished harshly for what men can do without worry: Italian women shall serve fascism as their husbands, and they shall reap its benefits equally!"
 
 ITA_reddite_quae_sunt_cesari:0 "Reddite Quae Sunt Cesari"
 ITA_reddite_quae_sunt_cesari_desc:0 "The time has come to strike the cancer that has corrupted Italy's soul for so long. The Church has been polluting our political sphere with their foreign interests and backwater traditions ever since the Risorgimento: it falls upon us to clean this stain on our national history!\n\nThe Lateran Concordat shall be abrogated, and the church shall be treated as any association within the state. Marriage shall be made civil, and divorce a right for all: there will be no prosecution, but those fat clerics will understand that, from now on, every action shall have consequences..."
 
 ITA_slow_and_steady:0 "Slow and Steady"
 ITA_slow_and_steady_desc:0 "The time of reform is now, but the scale of it can be adapted to the situation. Right now, we risk facing too much backlash from sectors of the state that hold great sway over the common population: many would not understand what we are doing for them.\n\nTo this end, we'll find a way to introduce our revolution at a steady pace, finding agreements where possible. The Duce is clearly dissatisfied, but he too understands that our very future depends on our stability..."
 
 ITA_step_by_step:0 "Step by Step"
 ITA_step_by_step_desc:0 "The matter of female rights within society is a pressing concern, and needs to be addressed post haste. To this end, we shall enact a series of gradual reforms to better their condition, until full equality can be achieved in the future: it might not be what some wish for, but it's a good start.\n\nTo this end, we shall abolish limitations on female succession, and punish exaggerate use of force by husbands or fathers. Also, we shall establish a fund to help widows - or separated women who are still married for religious reasons - pursue a dignified existence: the rest will come in the future... perhaps."
 
 ITA_italy_will_change:0 "Italy Will Change"
 ITA_italy_will_change_desc:0 "The matter of the Church - and its influence over Italy - is a great concern for our government. We could go to battle against the Vatican, but it would only threaten the government's stability: to this end, there's a different road we can pursue.\n\nRather than breaking the Lateran Concordat, we can find an accommodation and amend it with provisions further separating State and Church matters, while still granting them privileges and tax exemptions. While not perfect, this is indeed a good start for future reforms..."
 
 ITA_keeping_the_pace:0 "Keeping the Pace"
 ITA_keeping_the_pace_desc:0 "With our first important reforms enacted, it's time to keep the pace of our action, and approve smaller, but still important reforms. There's much to do in order to achieve our revolution, and little time to do it properly: to this end, the Parliament will pass the needed laws.\n\nWhile the fruits of our action will be fully evident in the following years, we need to press on, and convince the Italians that we are pursuing the best road for all of them. It's a matter of national prestige: Italy will rise above all others, as a shining beacon of justice and progress!\n\nAvanti!"
 
 ITA_the_rising_sun_of_fascism:0 "The Rising Sun of Fascism"
 ITA_the_rising_sun_of_fascism_desc:0 "With all facets of public life changed according to the true doctrine of fascism, we can proudly claim to have turned fascism from a dying flame held by an ill torch-bearer, into a rising sun, heralded by Phoebus, bringer of light!\n\nPraise fascism, for it is the road to prosperity and progress! Praise the revolution, for it is the solution to stagnation and corruption! Praise our glorious Duce, for he is the saviour of Italy!\n\nVerso il futuro, avanti!"

 ###=====| c) Economy Tree |=====###
 ITA_an_economic_revolution:0 "An Economic Revolution"
 ITA_an_economic_revolution_desc:0 "Atlantropa first, then ten years of Ciano's inefficient rule, and finally the disbandment of the Triumvirate have all left deep scars in our economic tissue. Unemployment is at an all-time high, trade is sluggish and our industrial powerhouse is on the brink of collapse: this sorry state of affairs can no longer be tolerated.\n\nIt is evident that corporatism as it is now has failed, and it is the state's duty to intervene in the economy in order to save it from its own excesses. Through a steady pace of reforms, we'll rebuild our country into a shining example of efficiency and technological advancement, where all partake to the fruits of labor equally!\n\nAvanti!"
 
 ITA_deal_with_the_trade_unions:0 "Deal with the Trade Unions"
 ITA_deal_with_the_trade_unions_desc:0 "As it is now, the Confederazione Generale Italiana dei Lavoratori is the only state-allowed trade union, all others being unofficial, or even persecuted. Of course, this has led to the proliferation of underground, clandestine unions where workers are radicalized by communist propaganda: this situation must be resolved, or we'll find ourselves with a new October Revolution at our doorstep!\n\nThe problem is, how are we to deal with the clandestine trade unions? We can't actually crush them all, which leads to our two choices. The Duce would like to increase plurality, allowing independent trade unions outside of the CNCS as long as they problaim themselves loyal tot he Duce and the Fascist economic doctrine. Others, on the contrary, advise him to be more prudent, and instead expand the CNCS so that it can slowly reconquer the workers' hears and minds.\n\nWhat should we do?"
 
 ITA_down_with_the_sickle_up_with_the_eagle:0 "Down with the Sickle, Up with the Eagle"
 ITA_down_with_the_sickle_up_with_the_eagle_desc:0 "Workers must be allowed some freedom of choice, or we risk estranging them, and leading them straight to the red liars! Muti is right, we need to end the dominance of the CNCS and open up to more recognized trade unions: with a more diverse panorama, the workers will be less likely to join underground organizations, even though the initial backlash would be high.\n\nFrom now on, we shall begin anew, drawing a clean slate upon which to build new relations between state and labor. Gone are the days of exploitation by the capital: a new dawn rises, a fascist dawn.\n\nDown with the Sickle, up with the Eagle!"
 
 ITA_one_step_at_a_time:0 "One Step at a Time"
 ITA_one_step_at_a_time_desc:0 "Despite our good intentions, it is undeniable that we need to be careful. Opening too much could make us vulnerable to critics even from inside the PNF, and we don't need a second front in such a difficult situation: the matter of trade unions must be approached with care.\n\nTo this end, we shall continue - at least for now - with our one-union policy, ensuring that the CNCS can work at full efficiency towards protecting the laborers. Surely they will understand our concern, and give us trust once again..."
 
 ITA_independent_fascist_trade_unions:0 "Independent Fascist Trade Unions"
 ITA_independent_fascist_trade_unions_desc:0 "The time has come to make good on our promises to the workers. The CNCS will remain the largest trade union, but it will no longer be the sole allowed. Fresh energies will be devoted to the fascist cause of labor, and the people will understand where our commitment lies: by the side of the weak and the downtrodden, for a new Italy to rise.\n\nAs part of our new policy, we shall approve a procedure at the end of which an unrecognized trade union will be allowed to operate in the open, protected by the state and capable of participating in labor talks with the ministries. This will be especially important as these talks will result in important labor contracts related to increased minimum wages and extended tutelage."
 
 ITA_crack_down_on_the_reds:0 "Crack Down on the Reds"
 ITA_crack_down_on_the_reds_desc:0 "Despite our benevolence, we still have an enemy to defeat. Socialist and communist trade unions operate outside of the law, radicalizing workers and turning them against the state: some of them even become terrorists who strike against innocent civilians or even party officials!\n\nIt is time to show all Italians the alternative. Either they stand with the Duce, or they stand against all Italians, and traitors will all face the same fate: red unions will be crushed under our black boots, and these degenerates will spend the rest of their lives working for the good of all!"
 
 ITA_il_sindicato_unico:0 "Il Sindicato Unico"
 ITA_il_sindicato_unico_desc:0 "The CNCS is a gargantuan organization, holding together millions of workers and participating in hundreds of thousands of labor talks, party activities and entertainment projects. Lately, however, it has been struck by the general malaise that permeated Ciano's inefficient rule: it is time to wake it up from its slumber, and turn it once again into a productive part of the administration!\n\nTo this end, we shall purge corrupt and inefficient functionaries, and appoint in their place people with enough presence to convince the workers that the state fights by their side. The cause of labor tolerates no slackers: we shall bring the workers by the Duce's side, one way or the other!"
 
 ITA_proletarians_of_italy_rally_to_the_duce:0 "Proletarians of Italy, Rally to the Duce!"
 ITA_proletarians_of_italy_rally_to_the_duce_desc:0 "With our promise maintained, the workers of Italy have understood that they have a new star shining for them in the firmament. Our glorious Duce is the champion of the weak and the downtrodden, their paladin in front of the capitalists, their protector from exploitation and starvation: it is time that we highlight this to the masses.\n\nTo this end, we shall begin a massive propaganda campaign aimed at presenting Muti as a fatherly figure to the workers. Marx, Lenin, Bukharin and their ilk have all betrayed the poor in the end: Ettore Muti will not do the same!\n\nGloria al Duce, protettore dei lavoratori! Gloria a Ettore Muti!"
 
 ITA_expand_the_cncs_muti:0 "Expand the CNCS"
 ITA_expand_the_cncs_muti_desc:0 "With the CNCS once again functional, it is time to begin a massive propaganda campaign aimed at increasing membership. By expanding the scope of its activities, and integrating it with the Unione Nazionale Dopolavoro, more workers will be incentivized to abandon underground unions and join the side of legality.\n\nWe are fighting a battle for the soul of our nation. Every worker taken from the clutches of the red beast is a loyal follower of fascism who will contribute to the advancement of the national revolution: our success depends on you!\n\nYes, you! All of you!"
 
 ITA_a_new_union_policy:0 "A New Union Policy"
 ITA_a_new_union_policy_desc:0 "With our reforms, we can say that the labor sector is no longer a battlefield between state and anti-state. With the red unions depleted and forced even deeper underground, their action has been hindered enough that they don't pose an immediate threat to us any longer: while solving the matter entirely is but a dream today, we have taken important steps towards the goal.\n\nWith our new labor policies fully enacted, the workers of Italy are ready to stand by our glorious Duce in his quest to turn Italy into a true world superpower. From the fields and factories will come the bounty of our nation, that it may make our country a prosperous land for everyone: to each their own, and to everyone the victor's glory.\n\nAvanti!"
 
 ITA_improving_workers_conditions:0 "Improving Workers' Conditions"
 ITA_improving_workers_conditions_desc:0 "Today, the workers of Italy toil for long hours and receive a meagre pay for their massive efforts. For decades, our predecessors tolerated such practices as it was easier to control the higher echelons of society than fighting them, but the time has changed: we can't ask for sacrifices if the people already live in misery!\n\nOur Duce is adamant on the need to improve the quality of life for the common Italians. He has already drafted several proposals, and he will see them implemented: his subtle threats of retaliation from enraged workers are more than enough to see them enacted posthaste..."
 
 ITA_raise_the_salaries:0 "Raise the Salaries"
 ITA_raise_the_salaries_desc:0 "One of the most pressing concerning issues for the workers is the minimum salaries. The CNCS and any eventual recognized unions can increase minimum salary on an exceptional basis, but this has been done very rarely, and the minimum salary itself is very law: this is vexing for the common workers, and a great cause for dissent against our regime.\n\nIn our effort to endear us to the common laborers, we shall raise the minimum salary enough to make it actually rewarding. Of course, the backlash from the industrials won't be small, and in the short term it will make us less competitive on the world market; with time, however, buying power will increase, and with it our internal market, making us less dependent on foreign trade.\n\nTwo birds with one stone!"
 
 ITA_reduce_the_work_hours:0 "Reduce the Work Hours"
 ITA_reduce_the_work_hours_desc:0 "Our workers break their backs with long hours of constant labor without pause. Often going to work at dawn, and returning late in the evening, the common Italians feel exploited by businessmen who instead spend their day having fun and doing nothing: of course, this fuels the expansion of socialist rhetoric.\n\nIn order to solve this issue, we shall reduce work hours to a manageable amount for the workers to feel relieved, and for the business owners to not be enraged too much. Of course, this won't be free from backlash, but in the end it's all for the greater good: also, the Blackshirts will ensure that the enemies of the state don't oppose our Duce in his plans..."
 
 ITA_our_promises_maintained:0 "Our Promises Maintained"
 ITA_our_promises_maintained_desc:0 "With the workers' conditions improved substantially, our glorious Duce can present himself without fear in front of the Italians as a man who kept his word. Of course, detractors will forever be present, but this doesn't matter: Muti has turned his promises into reality, and the workers of Italy will never forget this.\n\nNow, however, comes a dilemma. Salaries and work hours were just the tip of the iceberg. Health insurance, workplace festivities, female discrimination and many other concerns are yet to be solved: should we press on with the reforms, or let the waters becalm before passing new reforms?"
 
 ITA_battere_il_ferro_finche_e_caldo:0 "Battere il Ferro Finchè è Caldo"
 ITA_battere_il_ferro_finche_e_caldo_desc:0 "Our reforms need to be completed yesterday! We are already late, and every discontented worker is a red terrorist in the making: reforms must not stop, our revolution must not stop!\n\nOther proposals await on Muti's desk, some of his own writing. He shall see them enacted: it's a matter of honor now, and for a real man, honor is all."
 
 ITA_la_gatta_frettolosa:0 "La Gatta Frettolosa..."
 ITA_la_gatta_frettolosa_desc:0 "Haste is a bad advisor, as they say, and we have already done much. By pressing too many issues we risk upsetting the business owners too much, which would lead to several economic and political backlash from conservatives in both society and the PNF: we need to be careful, and wait for the right opportunity.\n\nPatience is a virtue, and our glorious Duce is a man of sure virtue. The time to address the other concerning issues will come at the right moment, and we'll be ready: the future of the Italian workers depends on us!"
 
 ITA_a_new_labor_policy:0 "A New Labor Policy"
 ITA_a_new_labor_policy_desc:0 "With our massive reforms, factories have now become better places to work in. Workers no longer need to worry about feeding their children, and they no longer return home too exhausted to even eat: this is a great progress for the entirety of our society!\n\nOf course, we'll make sure everyone knows who they need to thank for their improved conditions. Massive rallies and radio addresses will enshrine Ettore Muti as the benefactor to all workers: no longer will the poor and the downtrodden need to turn to shadowy figures such as Marx or Bukharin for comfort or protection.\n\nAvanti!"
 
 ITA_bring_the_economy_under_control:0 "Bring the Economy Under Control"
 ITA_bring_the_economy_under_control_desc:0 "Atlantropa destroyed our economy, and the fall of the Triumvirate brought most of the recovery with it. Our industry is weak and obsolete compared to our direct competitors, and massive unemployment weighs dangerously on our budget: we need to solve this issue quickly and decisively.\n\nThe problem is how to achieve our results. On one hand, we already have a powerful tool at our disposal - the IRI - and we could easily improve it; on the other, we could build an entirely new system to make sure that petty interests and business owners won't be able to hinder the pace of our reforms.\n\nWhat should we do?"
 
 ITA_work_with_the_iri:0 "Work with the IRI"
 ITA_work_with_the_iri_desc:0 "The Istituto per la Ricostruzione Industriale is a massive fund tasked with subsidizing key industries and other businesses. Already owning hundreds of subsidiaries, it would be easy and uncontroversial to expand and streamline its operations: despite calls for more radical reforms, this is the best route for all.\n\nReplacing some corrupt officials, and ensuring that the others obey to the Duce's wishes, should be enough to bring it fully under our control. From there, we'll be able to act quickly and decisively to save our ailing economy: this is our true goal, and we need to pursue it to the best of our capabilities."
 
 ITA_direct_control_from_rome:0 "Direct Control from Rome"
 ITA_direct_control_from_rome_desc:0 "It has become evident that the olc corporate system has failed. Privately-owned businesses closed when they became unprofitable, causing tens of thousands of Italians to become unemployed and rely on the state for even their basic sustenance: if the state is to pay for the difficulties, then it will also reap the benefits.\n\nThe time for deregulated privately-owned business is over! Our Duce will see that the economy is brought under complete state control: of course, this doesn't in any way mean collectivization - we aren't filthy reds - but from now on, it will be the private businessmen who bot to the state, and not the contrary."
 
 ITA_expand_the_budget:0 "Expand the Budget"
 ITA_expand_the_budget_desc:0 "The IRI's most powerful asset is its gargantuan budget, which is then used to subsidize ailing industries in need of a bailout or promising industries which could be expanded for the good of all. The crisis forced our predecessors to cut the budget, sentencing many enterprises to economic death: this will be changed.\n\nBy massively increasing the IRI's funds, we'll be able to once more protect our business from hostile acquisitions and unfair competition, and subsidize potentially-lucrative enterprises. Through the Istituto, with an initial sacrifice we shall usher in a new era of economic prosperity, and massively decrease unemployment: a boon for everyone!"
 
 ITA_subsidize_public_companies:0 "Subsidize Public Companies"
 ITA_subsidize_public_companies_desc:0 "Regardless of our general policy, it's evident that we need to have a special eye of regard towards state-owned business. Transportation companies, arms producers and other staple components of our public economy must be protected and expanded: we can't afford remaining without them in a time of need.\n\nTo this end, we shall grant more funds to public companies and overhaul their administration. Corrupt and incompetent managers will be replaced by experts, and the state will oversee their restoration so that they might start hiring new employees: they will be the heralds of a new age of prosperity for Italy!"
 
 ITA_agenzia_per_la_pianificazione_economica:0 "Agenzia per la Pianificazione Economica"
 ITA_agenzia_per_la_pianificazione_economica_desc:0 "In order to streamline our new scope of activity, we shall create a governmental agency with exactly this purpose. The Agenzia per la Pianificazione Economica will meet regularly to assess the state of the economy and plan further expansion: private business owners will be allowed to participate, but will no longer have any influence on the outcome of the meetings.\n\nCombining multi-year plans with regular surveys and data analysis, we'll be able to tweak the economy to our exact demands. Through the thaumaturgic hands of the state, the economy shall be resurrected: this is the path to prosperity!"
 
 ITA_streamline_the_private_and_public_sectors:0 "Streamline the Private and Public Sectors"
 ITA_streamline_the_private_and_public_sectors_desc:0 "Despite the discontent from some of our most dedicated supporters, streamlining private and public sectors is much easier, more sustainable and more profitable than putting everything under state control. Private risk encourages competition and prevents stagnation, while public surveillance curbs the excesses and prevents exploitation: what better system to regulate the economy?\n\nWith further tweaking and more funds, we'll be able to heal the economic downturn, and begin growing once again. Of course, it will take time until all the scars from Atlantropa are forgotten, but we are confident that it will be a matter of when rather than if: we do this for the good of all!"
 
 ITA_an_economy_for_the_people:0 "An Economy for the People"
 ITA_an_economy_for_the_people_desc:0 "With our careful planning, the Italian industrial sector will be brought back from the grave. Our business will once again hire new workers, reducing unemployment and freeing our budget for more pressing matters: very soon, we'll return in the black!\n\nAs our other reforms progress, our economy will enjoy a new age of prosperity and this time, the common people will partake in it as much as the businessmen. This is the way of fascist economy: an economy from the state, to the people, by the Duce."
 
 ITA_a_new_economic_policy:0 "A New Economic Policy"
 ITA_a_new_economic_policy_desc:0 "The time has come to reap the fruits of our economic reforms. With unemployment rates lowering and productivity increasing steadily, our trade will soon rise as well as our competitiveness: the people will surely rejoice!\n\nOf course, everyone will know that nothing would have been accomplished without our glorious Duce. Prosperity is the best propaganda tool, but it can always be enhanced, and we are nothing if not scrupulous: the fascist economic policy will be the salvation of Italy.\n\nAvanti!"
 
 ITA_the_italian_economy_revitalized:0 "The Italian Economy Revitalized"
 ITA_the_italian_economy_revitalized_desc:0 "Finally, our economic reforms are complete. Overhauling labor legislation and resurrecting our business sector have been difficult challenges, but we have overcome them: now, the time to reap the results of our efforts has come.\n\nHowever, only the weak rests upon his laurels. This is not the end, but the beginning of new, more difficult challenges: let it be known that we shall ever be ready! Let it be known that our Duce shall ever be ready!\n\nGloria a Ettore Muti! Gloria alla rivoluzione!"
 
