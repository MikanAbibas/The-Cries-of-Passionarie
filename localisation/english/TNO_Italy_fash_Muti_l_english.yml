 ITA_Muti_GUI_info:0 "The Manifest of Sansepolcro advocates for a radical reformation of society along nationalistic, statist, secularist lines. In order to restore faith in Fascism, Ettore Muti has decided to enact the Manifest in full, for it is evident that as long as the Empire remains in this sorry state of affairs, the plagues of socialism and social_liberal will forever fester in its wounds.\n\nThe current social classes of the Italian Empire must be reformed, and made to willingly - or unwillingly - embrace the Fascist Revolution. Policies may be enacted in order to accelerate the process, but care must be taken: a reformation of this magnitude in a deeply-conservative society is not an easy task, with some policies pleasing one class only to enrage another, and pushing too much may result in loss of loyalty from the people, and perhaps worse.\n\nAs such, moderation may be more advisable at times. Less radical policies and small concessions will ensure a smoother transition into the new regime, though the devil lies in details: Ettore Muti has promised change, and quickly - should he renege on his promise, the people may lose faith in the Revolution, sentencing it to an early grave...\n\nFrom the tallest hill of Rome to the dirtiest slums of Addis Abeba, no stone must be left unturned, no effort spared until the Empire has been cleansed of the rots of corruption, exploitation and stagnation: the Duce wills it!\n\nAvanti tutta!"
 
