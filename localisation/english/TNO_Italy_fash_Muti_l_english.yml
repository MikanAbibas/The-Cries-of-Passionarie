 ### a) Leader Descriptions ###
 POLITICS_ETTORE_MUTI_DESC:0 "Before his unexpected rise to power, the tale of Ettore Muti mirrored that of the unfortunate Aemilius Lepidus. A man of strength and ideals, and a convinced Futurist, Muti had escaped home at the age of sixteen to join Italy's effort in the First World War, even falsifying his identity to avoid being sent back home. There, he earned medal after medal with acts of heroism and cunning, which won him the loyalty of his comrades and the attention of Gabriele D'Annunzio: the warrior-poet would then shape the young boy into a devoted ally just as Caesar did with his trusted lieutenant.\n\nMuti was among the first Legionaries as D'Annunzio stormed Fiume, earning the Vate's undying praise, and he was present at the proclamation of Sansepolcro, where the first doctrine of Fascism was forged, but after that, his flame started to dim. Years of compromises and corruption within the party left the young idealist alone and without purpose as he saw his dream crushed by the weight of reality, and his friends and comrades removed one by one by boot-lickers and sycophants: all that was left for him was his career in the aviation and his Harley-Davidson, his one true love.\n\nThis, however, is where his tale diverges from that of Lepidus. Unlike the unfortunate Roman, he chose not to spend the rest of his life in a golden cage, and broke out: like a reborn David, he faced Goliath after Goliath, each time triumphing against all odds. Now, Ettore Muti stands at the helm of a stranded Empire, but his ideals will be a flame, a beacon in the night to lead his beloved country out of the mists, and into a glorious future.\n\nThe time of decadence is over. This will be a new age, an age of heroes, of fire and speed: rev up the engines, let them roar! The Fascist Revolution begins now!"
 
 POLITICS_GAPSARE_FANTAUZZI_GOOD_ENDING_DESC:0 "Destiny is fickle and unpredictable, and Gaspare Fantauzzi is the perfect example. Ever since he joined the X MAS, the young officer led countless suicide actions, and every time, he emerged alive and breathing: however, rather than thanking his good star, and swearing never to put himself at such risk, Fantauzzi revelled in the thrill of battle, and always sought more glory for himself.\n\nThis love for war, coupled with utter contempt for prudence and fervent zeal towards fascism, and helped by Fede Arnaud's movie camera, was what brought Fantauzzi to the attention of the man who would become his mentor, and best friend. In the hot-headed officer, Ettore Muti saw a younger self, someone he could share his aspirations with, alongside a good night of revelry: across the years, the two developed a strong bond, that was only strengthened as Muti set on course to reform the Empire from the ground up.\n\nFully supportive of his mentor's efforts, Fantauzzi remained at his side through thick and thin. At the end of the Oil Crisis, Muti understood the need for someone who could continue the Fascist Revolution, and who better than the man who best embodied its very essence of bravado and progress? As such, the aging Duce and his advisor, Italo Balbo, taught the former mariner how to lead an Empire without launching it on a crash course with the nearest concrete wall.\n\nWith the passing of his mentor, Gaspare Fantauzzi finds himself at the helm of an Italian Empire no one would be able to recognise from a mere decade ago. The new Duce knows nothing would have been possible without his friend, and has vowed to take on the torch of the Fascist Revolution: Ettore Muti sparked the flame, and he will ensure it never stops bruning.\n\nGlory to the Empire! Glory to Fascism! Glory to the Revolution! We do not fear the future, for we have become future itself! Avanti!"
 POLITICS_GAPSARE_FANTAUZZI_FAILSTATE_DESC:0 "Destiny is fickle and unpredictable, and Gaspare Fantauzzi is the perfect example. Ever since he joined the X MAS, the young officer led countless suicide actions, and every time, he emerged alive and breathing: however, rather than thanking his good star, and swearing never to put himself at such risk, Fantauzzi revelled in the thrill of battle, and always sought more glory for himself.\n\nThis love for war, coupled with utter contempt for prudence and fervent zeal towards fascism, and helped by Fede Arnaud's movie camera, was what brought Fantauzzi to the attention of the man who would become his mentor, and best friend. In the hot-headed officer, Ettore Muti saw a younger self, someone he could share his aspirations with, alongside a good night of revelry: across the years, the two developed a strong bond, that was only strengthened as Muti set on course to reform the Empire from the ground up.\n\nFully supportive of his mentor's efforts, Fantauzzi remained at his side through thick and thin. At the end of the Oil Crisis, Muti understood the need for someone who could continue the Fascist Revolution, and who better than the man who best embodied its very essence of bravado and progress? As such, the aging Duce and his advisor, Italo Balbo, taught the former mariner how to lead an Empire without launching it on a crash course with the nearest concrete wall.\n\nWith the passing of his mentor, Gaspare Fantauzzi finds himself at the helm of an Italian Empire no one would be able to recognise from a mere decade ago. The new Duce knows nothing would have been possible without his friend, and has vowed to take on the torch of the Fascist Revolution: Ettore Muti sparked the flame, and he will ensure it never stops bruning.\n\nGlory to the Empire! Glory to Fascism! Glory to the Revolution! We do not fear the future, for we have become future itself! Avanti!"
