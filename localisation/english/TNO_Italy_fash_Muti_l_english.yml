 ### b) Ministers ###
 ITA_Stanis_Ruinas_hog:0 "Stanis Ruinas"
 ITA_Stanis_Ruinas:0 "Stanis Ruinas"
 ITA_Stanis_Ruinas_hog_desc:0 "§LThere are many Fascists in Italy and there are certainly many who would describe themselves as "committed" to the fascist movement. There are very few, however, who are as strange as Stanis Ruinas. As a young man Ruinas was an anarchist and a revolutionary, but his allegiance eventually changed over to the fascist cause in the wake of Mussolini's March on Rome. His relationship to the party itself was never terribly convivial. His old socialist and anarchist tendencies were far from hidden even after he joined the PNF, but his belief in the Duce as a revolutionary allowed him to continue within a movement that was never entirely comfortable having him. This strange devotion has seemingly paid off.\n\nIn truly ironic fashion, Ruinas has been promoted to serve as the Secretary of the very party that had twice before expelled him. Of course, none of this would be possible without the ascendancy of Ettore Muti, who found in Ruinas a kindred spirit for his unorthodox understanding of Fascism. Now as committed to the new Duce as he ever was with his hero Mussolini, Ruinas is prepared to bring in the Fascist Revolution, one that destroys the vestiges of decadent liberal capitalism as much as it would fight Bolsheviks.§!"
 
 ITA_Giorgio_Pini_for:0 "Giorgio Pini"
 ITA_Giorgio_Pini:0 "Giorgio Pini"
 ITA_Giorgio_Pini_for_desc:0 "§LFor some men, even the greatest of personal tragedies will not hamper personal ambitions. Giorgio Pini is one such man. Taught in law but a journalist and editor by profession, Pini was a natural companion of Mussolini in the early years of the Fascist movement. Due to this, he was invited onto a series of ever more prestigious projects within the party, from working on the future Duce's very own Il Popolo d'Italia to managing the Bolognese Il Resto del Carlino. His quick assent within the movement earned him his fair share of enemies, but his friendship with Mussolini always prevented serious retaliation.\n\nPini was still faithfully serving the Fascist movement during the war when his son, only a boy of sixteen, was assassinated by partisans. A lesser man might have crumbled at that point, overwhelmed by personal grief and the stress of war, but Pini was not so fragile. If anything, he has only thrown himself further into his work, continuing a record of service that ranks among the most dedicated in all of the state. He has outlived both his friend the Duce and his own son, but still Pini carries forward, resolute is his commitment to the Fascist cause.§!"
 
 ITA_Angelo_Tarchi_eco:0 "Angelo Tarchi"
 ITA_Angelo_Tarchi:0 "Angelo Tarchi"
 ITA_Angelo_Tarchi_eco_desc:0 "§LAngelo Tarchi has had a storied career, one that has seen him steadily rise in influence within the Kingdom of Italy. Now his years of service are paying out dividends as Ettore Muti has given him broad authority to carry out the Fascist revolution to the Italian economy. Tarchi's service to Italy began during the First World War when, as so many other young men of his generation did, he volunteered with the Italian army to fight for his only recently unified nation. The period after the war was a period of flux for many people across the world, and this was true for Tarchi as well. He graduated with a degree in chemistry and began to develop a promising career within the industry, making numerous high level contacts that would come to serve him well later in life.\n\nTarchi's life would change once again in the tumultuous 1930's - in 1934 Tarchi was elected as a Deputy and in 1941 he was given the prestigious position as National Inspector of the national Party, a position that allowed him to push ever higher into the strata of the Italian elite. In the decades following World War II, Tarchi has not always been the most outspoken or publicly prominent members of the Fascist regime, but he has continued to use his substantial connections and personal talents to serve the Fascist movement at every turn.§!"
 
 ITA_Vittorio_Ambrosini_sec:0 "Vittorio Ambrosini"
 ITA_Vittorio_Ambrosini:0 "Vittorio Ambrosini"
 ITA_Vittorio_Ambrosini_sec_desc:0 "§LA former communist might not strike an observer as a person likely to become a major player within the Kingdom of Italy, and yet here Vittorio Ambrosini stands. In the turbulent days of the interwar years when the doctrines and tenets of Fascism were still young, there were attempts by proponents of this new "Third Way" to appeal to those whose political sensibilities leaned to the Revolution of 1917. Mussolini himself had once been a socialist, and his ideology promised to throw off the detritus of liberal capitalism just as much as an ally of the proletariat might.\n\nOf course, time would prove these to be hollow words as Mussolini relied less and less on appeals to a revolutionary movement in the way that the Reds envisioned. Despite this, it seems that there were some who still, perhaps naively, believed that Fascism and Communism could be synthesized. A man in search of a Revolution is who Ambrosini is, and in Ettore Muti, he believes he has found the vessel for just such a revolution as was promised all those years ago.§!"

 ITA_sansepolcrismo:0 "Sansepolcrismo"

