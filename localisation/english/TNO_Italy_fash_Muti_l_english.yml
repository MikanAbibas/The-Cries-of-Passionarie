 ###=====| d) Military Tree |=====###
 ITA_rise_of_the_eagle:0 "Rise of the Eagle"
 ITA_rise_of_the_eagle_desc:0 "Twenty years of decadence and economic downturn have left our armed forces obsolete and inefficient. As things are, we are a mockery of the world power we deserve to be, and a disgrace to our great ancestors: our rivals laugh at our sorry state, and our people feel undefended in this era of instability\n\nIt is time to bring all branches of our great army back from ashes, and make the fire of our bravery burn once again! We shall give our citizens heroes to aspire to, and our foes a threat to fear: by the end of our reforms, our legacy will shine for all to see!\n\nLet the Eagle rise once again!"
 
 ITA_the_regia_marina:0 "The Regia Marina"
 ITA_the_regia_marina_desc:0 "Our navy has always been the pride of the Italian armed forces. As a coastal nation, protecting our shores from multiple potential invasions has always been a priority: the Alps protect our bountiful lands from land offensives, and the Regia Marina repels anyone who would dare to threaten us from the sea.\n\nOur conquests after the last war, and the Atlantropa dam, have since changed the state of things. With Gibraltar inaccessible due to the dam, the Suez canal virtually impregnable thanks to our defences, and our manifest superiority over the remaining Mediterranean powers - Iberia and Turkey - there are doubts over the need for such a huge fleet.\n\nTo add to the current mess, our largest ships are mostly obsolete, with all battleships and carriers even dating to the last war! Is it worth the cost to modernize such a huge amount of ships, or perhaps we should concentrate on how to best protect our trade interests in the Indian Ocean?"
 
 ITA_no_such_thing_as_too_big:0 "No Such Thing as too Big"
 ITA_no_such_thing_as_too_big_desc:0 "At the Aegadian Islands, Roman ingenuity prevailed over Punic numbers and experience and signalled Rome's ascendance. At Lepanto, Venetian galleasses laid waste to the Turkish infidels, enshrining Italians as the protectors of Europe. At Malta, our battleships defeated the proud British as the island burned by the fire of our bombers, opening the path to our African triumph.\n\nOur naval tradition is the oldest in the world, encompassing all ages and all continents, and it shall be our greatest asset as the world enters an age of instability like never before. We shall reforge the Regia Marina in fire and steel, a beacon of hope in dark, foreign waters: should all else fail, our cannons will make the world tremble!"
 
 ITA_no_such_thing_as_too_fast:0 "No Such Thing as too Fast"
 ITA_no_such_thing_as_too_fast_desc:0 "It is undeniable that naval warfare has changed since the end of the last war, more than most theorists would want to admit. Carriers and cruisers now rule the seas, with missiles and torpedoes bringing low the pride of many admirals, and the hopes of many nations: it would be foolish to think that a thick hull is enough to stop the concentrated fire of dozens of naval bombers - the tale of the American and British navies should be enough warning.\n\nRather than wasting our money on glorified practice targets, we should concentrate on creating a fast and lethal fleet, based on the principles shown by the Japanese navy at Pearl Harbour. A carrier core supported by fast missile cruisers and screened by nimble destroyers and frigates will ensure our dominance over the Indian Ocean better than any battleship ever could: blessed by Aeolus's winds and carried by Neptune's currents, our fleets will reach the far ends of the world!"
 
 ITA_scrap_the_old_ships:0 "Scrap the Old Ships"
 ITA_scrap_the_old_ships_desc:0 "With our choice in theoretical approach made, it is time to modernize our fleet according to the chosen principles. Our old battleships and carriers, relics of the last war barely fit to take the sea, will be scuttled and replaced by new, modern vessels: at the end of the modernization, the Regia Marina will shine for all to see, a butterfly free from its cocoon, a phoenix risen from its ashes!\n\nThis said, we need to be fast. Such a large modernization will leave us vulnerable as our most venerable vessels are permanently removed, and our rivals will surely take notice: should we fail to replace the scuttled ships quickly, we might face public backlash for our supposed weakness..."
 
 ITA_build_more:0 "Build More!"
 ITA_build_more_desc:0 "Most of our old dockyards were forcefully closed down when our largest ports - Genoa, Livorno, Taranto - became salt deserts. Despite their efforts, our predecessors only managed to restore a fraction of our shipbuilding capacity: if we are to restore the Regia Marina to its rightful place among the powers that be, we need to act quickly.\n\nTo address this issue, massive funds will be devoted to expand existing naval dockyards in Palermo and Naples, the last functional ports from before Atlantropa. In addition, we shall unlock the needed funds to re-establish the production facilities in Genoa and Livorno: by spreading out production, we can make ourselves less vulnerable in case of an enemy attack."
 
 ITA_build_better:0 "Build Better!"
 ITA_build_better_desc:0 "As our fleet undergoes its largest modernization from the time when wooden vessels gave way to steel dreadnoughts, the time has come to further our advancements in naval weaponry and hull forms. Twenty years have seen many important changes in how ships are thought and built: we can't simply build new versions of the same old concept!\n\nTo this end, we'll devote massive funds towards establishing a joint research department, where the largest naval and weapon firms will be able to work towards the advancement of naval technology. Hull forms, guns, armor and engines: our ships will be the best from prow to stern!"
 
 ITA_oceanum_nostrum:0 "Oceanum Nostrum"
 ITA_oceanum_nostrum_desc:0 "With our hegemony over the Mediterranean reaffirmed, it is time to expand our horizon from the small boundaries of Mare Nostrum. For more than a decade, our ships have patrolled the Arabian Peninsula and other waters of the Indian Ocean, protecting our oil shipping routes: it is time to make our presence more permanent, and expand it further.\n\nBy building new naval bases in Eritrea and the vital Seychelles islands, we'll be able to supply our navy and extend our power projection up to the coast of India itself. Gone are the days when the Mediterranean was a cage the British kept us into: now and forever, the Indian Ocean will be ours to dominate.\n\nOceanum Nostrum."
 
 ITA_the_regio_esercito:0 "The Regio Esercito"
 ITA_the_regio_esercito_desc:0 "Our land forces have faced a recent test in the Second Italo-Turkish War, and their performance was... lukewarm at best. Obsolescent equipment, entrenched officers and a general lack of professionality have led to many dangerous situations: if we are to re-establish our role as a leading world power, we need to fully review the state of the Regio Esercito and address the concerns that may arise.\n\nFrom training regimes to doctrines and equipment, we must leave no stone unturned in our quest for greatness. By the end of our reforms, our army will finally be a match for the German Heer, and will pay a fitting tribute to our ancestors: our legacy demands action, not commiseration!"
 
 ITA_every_soldier_a_legionary:0 "Every Soldier a Legionary"
 ITA_every_soldier_a_legionary_desc:0 "It is evident that the first step in our army reform concerns the very bricks that make up the Regio Esercito. Our soldiers have proved lacking under many aspects: obsolete training regimes, mediocre discipline and incompetent officers have brought shame to our military tradition for too long!\n\nFrom now on, our soldiers will undergo a new, stricter training regime that will cover not only physical and strategic aspects, but also history: recruits and officers alike will be trained in the latest fighting methods, and will understand that they are heir to the greatest Empire to ever dominate our planet."
 
 ITA_modernize_the_artillery_corps:0 "Modernize the Artillery Corps"
 ITA_modernize_the_artillery_corps_desc:0 "Despite the advancements in military tactics, artillery - both towed and self-propelled - is still very important with its stopping power and its ability to support all kinds of forces in different situations. From self-propelled artillery to anti-air batteries, artillery serves one main purpose: spend bullets instead of men.\n\nThe OFN-Schild war in Africa has shown how much our own artillery corps has become obsolete. By studying the recent advances brought to the field by the use of special ammunition and fighting in harsh climates, we can improve our own troops: if used well, artillery has still much to give to a competent general!"
 
 ITA_women_can_fight_like_men:0 "Women Can Fight Like Men!"
 ITA_women_can_fight_like_men_desc:0 "The time has come to bring our reforms to the next level. Women have been for centuries excluded from war, despite legendary examples from Camilla to Johan of Arc: it's time to give them their rightful place beside men in the pantheon of military triumph, and let them join the fight as both support and fighting personnel!\n\nCoincidentially, we are also solving one of the main problems of our armed forces. Unlike Japan, Germany or the United States, we do not have a population numbering in the hundreds of millions: by including women in the armed forces at all levels, we can tap into much-needed manpower reserves that could turn the tide in case of a war."
 
 ITA_improve_support_battalions:0 "Improve Support Battalions"
 ITA_improve_support_battalions_desc:0 "The last war has shown us that supporting our troops is fundamental. From military hospitals to sappers and maintenance crews, no one can underestimate the power that comes with ensuring our troops can fight at top efficiency: when the British tanks broke due to the sand at El-Alamein, the lack of replacement parts was their downfall.\n\nWhile the top priority of our reforms reains the state of our fighting men and women, we need to ensure that they are supported as best as we can. Improving the non-fighting battalions of our armies will have great results, especially in faraway theatres where reinforcements are hard to come by, or in difficult terrains where attrition rates are naturally higher."
 
 ITA_expand_the_armored_corps:0 "Expand the Armored Corps"
 ITA_expand_the_armored_corps_desc:0 "The German blitzkrieg paved the Reich's way to world dominance. Their armored corps are still way superior to ours, and many other countries have made great advancements in the field: while our home territory is not suited for tank clashes - from the African desert to the Alps - it would still be advisable to fill the gap.\n\nBy investing into a joint development effort between our largest producers, we can quickly make up for the lost time. Cavalry has always dominated the battlefield of history: it would be foolish to leave such a powerful asset to our foes without at least making the effort to master it ourselves."
 
 ITA_expand_elite_forces:0 "Expand Elite Forces"
 ITA_expand_elite_forces_desc:0 "The Arditi were not just the first elite troops of the Italian army, earning them a great reputation in the First World War. With their black uniforms and their martial spirit, they were the first fascists: their memory will forever live in the hearts of all true Italians.\n\nNow however, the time has come for new kinds of Arditi. Paratroopers, marines and mountaineers are the new frontier of elite troops, and we already have detachments of all kinds: by improving and expanding them, we can make sure that we are able to fight properly in the diverse and hostile terrains that comprise our homeland.\n\nFrom the Alps to the Aegean Islands, we shall prevail everywhere!"
 
 ITA_the_roman_legion_reborn:0 "The Roman Legion, Reborn"
 ITA_the_roman_legion_reborn_desc:0 "The Roman Legion was not merely a matter of weapons or training. It was, first and foremost, a strategic concept: perfect integration of fighting and support battalions, capacity for fast redeployment and large decision autonomy had the result of creating a strong, well-rounded and versatile force capable of dominating the battlefield of three continents.\n\nThanks to our reforms, we have rebuilt such a concept. Our soldiers are now well trained, led by competent officers and dedicated to the cause; our support and fighting battalions have been improved and closely integrated for maximum efficiency; finally, our advancements in technology have greatly improved the fighting capabilities and mobility of the entire Regio Esercito.\n\nWe may no longer speak in Latin, and our soldiers may not wear iron armors and bear shields, but we have done much more. We have restored the true spirit of the Legions of old: let the world tremble!"
 
 ITA_regia_aeronautica:0 "Regia Aeronautica"
 ITA_regia_aeronautica_desc:0 "The youngest among our armed forces, the Air Force has nevertheless attracted a great degree of attention. Such fame is largely due to the focus of many prominent fascists and futurists on the technological advancement and the power that comes from controlling the air: from Italo Balbo to Galeazzo Ciano and Ettore Muti himself, many have tested their mettle in the newest battlefield created by men.\n\nOur new Duce has all intention to continue on this trend, and will devote both funds and personnel towards improving our hold over the skies of the Empire. This is far from idle caprice, however: the last war has shown what happens to nations that can't protect their cities from enemy bombers, and the German threat still looms just over the Alps..."
 
 ITA_flood_the_skies:0 "Flood the Skies"
 ITA_flood_the_skies_desc:0 "If we are to defeat our enemies, we need to field enough aircraft to fight at least in conditions of parity. It is no mystery that the both Germany and the United States - our most likely adversaries - have large air forces: if we want to fight them on equal footing, we need to dramatically increase production rates, or we risk being outnumbered and then hammered into submission by strategic bombing.\n\nTo this end, we shall not only open new factories dedicated to fighter and bomber production. We shall also revolutionize the frames of our planes: an easy-to-produce, streamlined chassis will be the basis for most of our aircraft, allowing us to mass produce the needed components, therefore increasing production and assembling efficiency."
 
 ITA_the_modern_bellerophon:0 "The Modern Bellerophon"
 ITA_the_modern_bellerophon_desc:0 "No matter how many planes we might produce, in the end the other superpowers will still be able to surpass us. If we are to hold any chance at protecting our skies, we need to approach the issue from a different angle: if quantity is not on our side, then quality will be!\n\nBy making sure that our technology remains state of the art, and greatly improving training regimes for our pilots, we shall be able to inflict losses upon our enemies without suffering as much, therefore lowering the need for replacements.\n\nLike a modern Bellerophon, the Regia Aeronautica shall fall upon the enemy as the great hero did on the legendary Chimera. We shall slay them with precise strikes, protected by our supreme skill and our trust in technological advancement as if it were the hand of a goddess keeping us safe from harm!"
 
 ITA_the_cult_of_speed:0 "The Cult of Speed"
 ITA_the_cult_of_speed_desc:0 "Jet technology is the latest development in air combat. Aircraft equipped with such wondrous components can break the speed of sound, and achieve feats no one could ever think possible: while already possessing such technology, we need to improve it, make it faster, faster than anyone and anything else.\n\nHumans are used to living tame lives, walking through their existence without any merit. Speed is different. Speed takes your breath away. Speed makes everything blur, and your entire body tense as if your entire world could go into pieces with a single touch. Through speed, men can exceed their very nature, and ascend."
 
 ITA_contest_the_luftwaffe:0 "Contest the Luftwaffe"
 ITA_contest_the_luftwaffe_desc:0 "It is no mystery that our former allies in Germania are now our greatest threat, and the only contender in our plans for European domination. War with the Reich has always been a strategic concern ever since the Atlantropa disaster turned our alliance into rabid hate: while unlikely in the near future, we can't assume that this fragile peace will hold forever, and must think accordingly if we want to preserve our independence in the face of enemy aggression.\n\nWhile our massive Alpine fortifications would turn any conventional offensive into a bloodbath, the German Luftwaffe - the largest air force in the world - could destroy our cities and force us to surrender without even a single shot being fired. To this end, we need to calibrate the Regia Aeronautica so that it can effectively fight its German counterpart: a focus on fighters and dogfights would go a long road towards ensuring that our skies remain ours, and that we can properly support our troops even in the thick of the fight."
 
 ITA_rain_death_upon_the_foe:0 "Rain Death Upon the Foe"
 ITA_rain_death_upon_the_foe_desc:0 "Bombers are the offensive wing of any respectable air force. While close air support remains preferable in conventional battles due to their versatility and agility, tactical bombers allow far greater range with the added boon of higher defensive capabilities: the fact that they can be used to bomb enemy infrastructure near the battle site only adds to their usefulness.\n\nRather than wasting productive capabilities we still don't have on strategic bombers, a good compromise is to focus on tactical bomber development. By improving our tactical wings with inventions such as better engines and larger - or even special - payloads, we can bridge the gap with larger air forces and support our troops to the best of our capabilities."
 
 ITA_flying_high:0 "Flying High"
 ITA_flying_high_desc:0 "With our technological advancements, we have defeated gravity and soar high above our competitors. The very heavens are our natural home, and should any enemy wish to challenge our dominion over the sky they will face what the Titans faced when they dared to attack the Olympus: they will be struck by lightning and cast into the bowels of earth, never to see the light again.\n\nA new age dawns over the Empire. An age of speed and progress, of thrill and power, where man and bird lose their boundaries in a flurry of steel-like feathers, becoming one with each other and flying higher than ever before: rejoice, oh unfortunate Icarus, for your dream is now fulfilled!"
 
 ITA_our_legacy_restored:0 "Our Legacy Restored"
 ITA_our_legacy_restored_desc:0 "Thanks to our reforms, our armed forces now shine as a beacon of strategic efficiency and tactical effectiveness for all to see.\n\nFrom the icy peaks of the Alps, to the sun-scorched deserts of Libya and the deep crevasses of Ethiopia, our soldiers fight bravely, confident in their strength and their equipment.\n\nFrom the highest heavens to the deepest abysses, our proud pilots and sailors uphold the legacy of those who preceded them, carrying the spirit of Venier and D'Annunzio.\n\nFrom Rome to Addis Abeba, the Eagle soars, and the earth trembles in fear of our might. Let the world know of our resurgence!"
 
 ITA_breaching_the_new_frontier:0 "Breaching the New Frontier"
 ITA_breaching_the_new_frontier_desc:0 "The last years have taught us that wars can be decided far away from the battlefield and into laboratories and bunkers. The power of computers, of electronics, of the atom, can change the world, even destroy it: if we are to claim a place among the world superpowers, we need to make this power ours.\n\nThe Duce has ordered the creation of a secret research group, tasked with achieving what our jealous allies have denied us for so long. He desires to achieve Italy's greatness, and if the world needs to burn as a tribute to our ascendancy, then it is a price he is willing to pay: woe betide those who challenge him!"
 
 ITA_the_wrath_of_jupiter:0 "The Wrath of Jupiter"
 ITA_the_wrath_of_jupiter_desc:0 "It is said that Jupiter could shake the earth itself with the force of his thunder. Crafted by Vulcan in the bowels of mount Etna, they could strike down the mightiest foes as if they were mere insects: even the Titans could not bear such power, and were cast into Tartarus, guarded by adamantine gates and stone-faced sentinels until the end of time.\n\nIt is time for us to partake of such power. Progress will not be fast, but with enough effort - and enough funds - our scientists shall achieve the needed breakthrough: it is only a matter of time before we can wield the strength of Jupiter's thunder, and turn it against our enemies..."
 
 ITA_on_pegasus_wings:0 "On Pegasus Wings"
 ITA_on_pegasus_wings_desc:0 "Pegasus, mightiest of all horses, was gifted with wings so that it could carry its sire wherever he so desired. Steed and knight would fall from the sky as one entity, taking their enemy by surprise and sealing its fate with a precise strike of a lance falling from the sky: such a vision of power would have struck awe into the gods themselves.\n\nOur newfound interest into atomic development requires suitable vessels to carry the soon-to-be-latest addition to our arsenals. Tactical bombers are too small to carry them, and they fly too low for the pilots to be safe from the resulting fallout: to this end, we need to produce strategic bombers, a Pegasus worthy of such Bellerophon..."
 
 ITA_project_phoebus:0 "Project Phoebus"
 ITA_project_phoebus_desc:0 "Phoebus, bringer of sunlight. A being that could turn Earth into a frozen hell or a raging inferno of flames if he only so desired: this is the power that was denied to us twenty years ago by the greedy Germans, and this is the power that our glorious Duce shall achieve, to gift it to Italy for its greatness.\n\nIn the Libyan desert, a land where the dunes cannot betray their secrets, we shall begin testing our nuclear arsenal. The time has come to pour our entire being into the greatest struggle to ever grace our nation: into this crucible of will and mind, we shall forge a new Italy, a nuclear Italy.\n\nWith the sun as witness, we claim our place to greatness! Let none stand before us!"
 
 ###=====| e) Foreign Diplomacy Tree |=====###
 ITA_eyes_abroad:0 "Eyes Abroad"
 ITA_eyes_abroad_desc:0 ""
 
 ITA_nuova_diplomazia:0 "Nuova Diplomazia!"
 ITA_nuova_diplomazia_desc:0 "Under our glorious Duce, Ettore Muti, the policies of the old regime shall be reformed into something as revolutionary as fascism itself! The collapse of the Triumvirate was proof that the old ways of diplomacy are no longer sufficient for the Italian Empire. In its place, Ettori Muti has proposed a radical and new foreign policy.\n\nOur Duce's foreign policy is built around three core principles: Opposing the German Reich and its hegemonic tyranny, expanding our control over the Mediterranean and ensuring the vital lifeline of our Empire remains in our hands, and increasing relations with Japan, our sister nation and fellow believers in true fascism. Such a radical, new approach has never been seen before, and all claims to the contrary are clearly made by people too unwilling to comprehend our Duce's magnificence, or too divorced from the fasicst ideology."
 
 ITA_end_old_rivalries:0 "End Old Rivalries"
 ITA_end_old_rivalries_desc:0 "In order to truly stand against the Huns, we must look abroad for reliable allies. America, that capitalistic nation which yet still clings to the moribund ideology of social_liberal, and has for so long perverted Europe with its foreign decadence. We briefly fought against them in the Second World War, and relations between our nations have been tense, if not outright hostile. However, this relationship is no longer favorable to the fascist cause.\n\nWe must look past America's faults and decadence, and begin steps to end the hatred between our nations. America is, despite its failing ideology, a truly powerful empire, and committed to opposing the Huns. If we can relax tensions between our nations, we can possibly use their vast arsenals and plentiful funds to strengthen our position against the German menace."
 
 ITA_loosen_the_autarky:0 "Loosen the Autarky"
 ITA_loosen_the_autarky_desc:0 "In the past, the policy of Autarky was considered a truly fascist policy. Any true empire must be self-sufficient, and must not depend upon the whims of weaker nations to sustain itself. However, the times are changing, and new developments mean that Autarky is no longer sufficient for the fascist cause.\n\nThe capitalists are enemies of fascism, but they are also enemies of the Huns. If we allow them to sell their goods in our markets, and they allow us to sell our superior goods in their markets, they may be more willing to cooperate with us. This cooperation won't go too far, but it's a good start for diplomatic relations."
 
 ITA_keep_our_distance:0 "Keep Our Distance"
 ITA_keep_our_distance_desc:0 "Autarky is the tried and true method of fascism, representing the dominance of the nation economically and symbolically, and what we will continue to go forth with. By doing this, our devotion to fascism and its ideals will be made clear to those remaining hardliners who doubt it, consolidating our position. Instead of fully liberalizing our trade policies like some of the more pragmatic members of our government have called for, we will only make gestures and minor adjustments, while reassuring the Americans with platitudes and vague promises of change in the future so they are more open to working with us."
 
 ITA_a_common_foe:0 "A Common Foe"
 ITA_a_common_foe_desc:0 "What the Americans don't seem to understand in their ignorant decadence is that we are not Germany. We must remind and educate them, and show them our hatred for the Huns who defiled our nation. The Reich is our common foe, and our empires must stand against it as a mostly united front, so that the last bastion of European culture is not violated by their barbaric ways. Once the Americans realize this simple fact, it may open the way for further cooperation. Such cooperation is beneficial towards both of our nations, and so there is no sane reason for the Americans to reject us."
 
 ITA_exchange_pleasantries:0 "Exchange Pleasantries"
 ITA_exchange_pleasantries_desc:0 "The Americans cling to the moribund ideology of social_liberal, and their culture perverted Europe before their influence was destroyed by the might of fascism. However, they share our hatred for Germania, and so we must cooperate, if only a little.\n\nWe shall send ambassadors to America, and give their government a favorable impression of our nation. We shall emphasize our hatred for the Germans, and emphasize the devastation they've brought to Italy in the past. Maybe such efforts can convince them to support us against the Huns, even if any further cooperation could risk the stain of Americanism perverting our fascist culture."
 
 ITA_look_further_south:0 "Look Further South"
 ITA_look_further_south_desc:0 "Just because an ocean separates our brothers and sisters in Latin America does not mean they are any less Latin than us. Just as we have opened trade with our Latin brethren in Europe, so too will we open it with our Latin brethren in the Americas! Our diplomats have already made overtures that are being positively received, and we should quickly act to allow them the same benefits the European Latins enjoy.\n\nOf course, the Americans may not take kindly to establishing economic ties in their sphere of influence, but if our brethren in Latin America are willing, then there is little they could do to stop it - at least not without consequences. If this in turn helps them become less reliant on the United States and OFN in the process, all the better!"
 
 ITA_the_dread_of_the_world:0 "The Dread of the World"
 ITA_the_dread_of_the_world_desc:0 "The Germans, those uncultured barbarians who defiled our once-beautiful nation. They did not respect us as true allies, they did not respect the fascist cause, and they did not respect the beauty of the Mediterranean.\n\nThe Germans have proven once again that they will forever be enemies of the Italian people, and that our alliance in the Second World War was a temporary attempt to end a much deeper animosity. Italy must stand strong against the German menace, or her beauty will be defiled once more."
 
 ITA_an_alliance_of_blood:0 "An Alliance of Blood"
 ITA_an_alliance_of_blood_desc:0 "Our Empire was forged in the flames of the Second World War, but it was far from secured. The Aquila glides over Mare Nostrum, but the eyes of the Germans, as ever, covet our glory. North of the alps the Huns and Vandals would like to see Roma reduced to rubble. We can only answer their brutality with the values that have defined Italian civilization since time immemorial.\n\nNoi tireremo diritto - We Shall go Forward.\n\nGuided by the true doctrine of fascism, we shall strive to build a new alliance upon the ruins of the Triumvirate. The Mediterranean, once again, shall serve as its anchor. Our allies will thrive, fight, and prosper. Our allies shall be Latin, and strength will substitute for purity. We will turn to Madrid, to Lisbon, to Athens and to Bordeaux looking for friends and brothers in blood. This Latin alliance will be the main arm of Italy's influence beyond her bountiful borders - for after all, what could be Latin without Rome?"
 
 ITA_call_on_the_caudillos:0 "Call on the Caudillos"
 ITA_call_on_the_caudillos_desc:0 "The bombing of the Malta Conference and the destruction of the Triumvirate might have soured our relationship with the Iberians, but it is not too late to salvage what we have left and secure our Mediterranean and Latin brothers as allies. We must separate ourselves from Ciano's old regime, and appeal to both our historical and cultural ties and our common geopolitical goals to coax them into our new Federation."
 
 ITA_the_forgotten_settlers:0 "The Forgotten Settlers"
 ITA_the_forgotten_settlers_desc:0 "We have had our share of conflict in the past, but it is time that the French nation is welcomed back into the Latin fold. Only second to the Polish in their hatred of the German hegemon, the Bordeaux regime begs to be rescued from the German shadow and brought back into the light. As the Frenchmen will soon come to know, the soul light in Europe is one illuminated by the torches of Roma's glory.\n\nIn order to attract the French into a mutually beneficial agreement - since a territorial exchange is an utterly ridiculous proposal - we will propose an ambitious program of repatriation for Pied-Noir settlers that will hopefully serve to reinvigorate France's economy, in addition to a set of other economic incentives to persuade France to abandon headstrong isolation and enter into the arms of willing brothers and eager allies. What is a past war or two when the future of Europe is ours to seize?"
 
 ITA_our_hellenic_brothers:0 "Our Hellenic Brothers"
 ITA_our_hellenic_brothers_desc:0 "The Greeks are the originators of Latin civilization, of our very culture and societal fabric. Millennia ago, it was Aeneas of Troy who landed in Italy to lay the foundations for the founding of Rome. In the halls and plazas of the Eternal City it was Greek architecture, Greek tradition, and Greek beliefs which forged the bedrock for the Roman way of life. We will invite Greece to the Latin Federation - if not persuaded by our pleas to our brotherhood, they will surely fall to our promises of economic and political aid in their time of crisis. We might have had differences in the recent past, but we can surely overcome them, no?"
 
 ITA_the_martinoli_line:0 "The Martinoli Line"
 ITA_the_martinoli_line_desc:0 "As we make grand moves into the Mediterranean, we must never let our hands slip away from the rifle's trigger - never let our gaze drop and turn away from the ogre north of the Alps, lest we suffer dearly for our mistake. Germania, with its tanks and hordes and rockets, has but a single target and it is Rome. The Duce has turned to address this eternal threat through a series of classified communiques, insisting that the alpine border is to be revisited, rearmed, and then reinforced through all possible means. More forts, more concrete, more railways, and more guns! The Martinoli Line shall be the Duce's lasting legacy and a bullet to the chest of Germany's gluttonous ambition!"
 
 ITA_distribute_our_expertise:0 "Distribute Our Expertise"
 ITA_distribute_our_expertise_desc:0 "Even as we turn to sculpt a new heroic shield into the Alps, we must remain firm on the path of rapprochement with our allies, old and new. Italy will not merely resort to another lone and splendid isolation, but it will continue to strengthen and support its friends and worthy allies as theatres of her glory. The great strides made by Italy's bright minds, especially in the military fields, will be put forward as shining examples of that glory.\n\nMilitary experts and engineers will spread their wings across the Mediterranean and beyond, helping to bolster and protect our allies as firmly as they would Italy's own soil. We will build trust with our fellow nations, and we will reap the benefits of this support many times over in the years and the decades to come - and not just on the battlefield."
 
 ITA_show_our_strength:0 "Show Our Strength"
 ITA_show_our_strength_desc:0 "The Reich sees itself as the master of the world, shaper of its own destiny. They have rested on their laurels, their triumph in the Second World War still echoing through the heads of each of their politicians. Yet, we know the truth - Germania is not as invincible as it seems. Underneath their façade of dominance lies a broken system, contaminated by corruption and greed. Their people cry out in anguish as the decadent elite party and grow fat, and their reins over Europe and beyond grow slack and battered.\n\nMuti has ordered a grand set of army exercises along the magnificent Alps separating us and the Einheitspakt. Let us remind them that they have not yet vanquished all of Europe, let alone the world - let us remind them that glorious Italia stands stronger than ever, while they grow complacent and weak. We made the mistake of allying with them once - we will not bow to them again."
 
 ITA_the_modern_foederati:0 "The Modern Foederati"
 ITA_the_modern_foederati_desc:0 "A brilliant new initiative has come to our glorious leadership. In order to better integrate the Latin races, a new volunteer army shall be created. It will be fashioned after the famous French Foreign Legion, but we shall only allow those of proper Latin stock into its ranks. Any men who join this new legion will be granted citizenship in our great nation, allowing us to build a great base of loyal armed men to take the fight to our enemies.\n\nThis new army can be used to enforce the will of the Latin Federation at home and abroad. It will be as the Legions of Rome and bring forth everlasting victory to our people!"
 
 ITA_towards_the_eternal_city:0 "Towards the Eternal City"
 ITA_towards_the_eternal_city_desc:0 "The Mediterranean civilization began on the fair fields of Lazio, where two brothers, nursed by a wise she-wolf, founded a settlement on a hill. Unbeknownst to them, the pearly-white marble domes of their city would become the centerpiece of Europe and the seat of power for the greatest empire to ever live. We the Latin people have always found Italy to be the natural center of all things, and today should be no different.\n\nWe allow the other members of the Latin Federation to live as they please - we are no hegemon nor tyrant, for our purpose is not to enslave but to empower. However, we must remind them of this simple fact now and again, and especially of our ability to play conqueror. As Machiavelli put it, 'So far as he is able, a prince should stick to the path of good but, if the necessity arises, he should know how to follow evil."
 
 ITA_renew_old_friendships:0 "Renew Old Friendships"
 ITA_renew_old_friendships_desc:0 "The Japanese were once one of our closest allies, and after our victory in the Second World War, both of our nations entered into ages of prosperity. While the fortunes of both of our countries have dimmed in recent years, now is the perfect opportunity to renew the alliance between our two nations.\n\nJapan has a similar outlook to us - we both see the danger of the German Reich, and while the Japanese were not betrayed as we were, relations between the Reich and Japan turned cold after the attempted assassination of Hitler. The Germans remain on our border, waiting for an opportunity - one they will not hesitate to seize unless there is a strong deterrent.\n\nLikewise, the Japanese are similarly wary of the United States and their OFN puppet states. While the Germans remain our priority, curbing the Americans is also in our interests. There is no better time for a new alliance, one which can stand strong against our enemies, be they from across our border, or across the sea."
 
 ITA_a_warriors_spirit:0 "A Warrior's Spirit"
 ITA_a_warriors_spirit_desc:0 "The warrior culture of Japan is one we have long admired. The skill, bravery, and loyalty of their soldiers is something we would do well to emulate as we strive to restore the spirit of our Roman ancestors. Our officers have expressed interest in learning from the Japanese, and they have likewise been receptive to the idea of a joint exercise.\n\nHowever, this can be more than just exercises. An exchange of advisors and defence attachés could give us valuable insight into their military, and they would likewise learn from us as well. While this would give a foreign nation unprecedented insight into our military, it would be certain to strengthen the bonds and trust between us, and make our own soldiers and officers stronger and smarter."
 
 ITA_an_ocean_of_opportunity:0 "An Ocean of Opportunity"
 ITA_an_ocean_of_opportunity_desc:0 "It isn't a secret that the Japanese economy is one of the best in the world, and one whose citizens enjoy a high quality of life as a result. As we build our own economy, there is much we can learn from their process and methods - and their successes and failures.\n\nA careful study of the region shows that there is significant untapped potential in the east that remains untapped even by Japan. Indonesia, Vietnam, and India are primed for investment, and should we not act, it is assured that the Germans and Americans will.\n\nHowever, we need not act alone. With the help of Japan, we can seize this opportunity together to improve our economies, reinforce our influence in the region, tie our nations closer together, and of course, lessen our own reliance on the Germans - and in the process deny them a valuable prize."
 
 ITA_imitate_their_industry:0 "Imitate Their Industry"
 ITA_imitate_their_industry_desc:0 "Domestic business in Italy sadly leaves much to be desired. The bureaucracies are bloated, the management is weak and inefficient, the workers are unmotivated, and the resulting products lacking. This is simply not acceptable if we wish to have a thriving economy. Fortunately, the Japanese know how to run a business, we have the opportunity to consult some of the finest.\n\nRepresentatives from both Manchukuo and Guangdong have already expressed interest in meeting with us to share best practices, allow us to tour their own companies, and sit in on their meetings. Of course, the conditions the workers are subject to are harsh, but no one says we have to follow the Japanese model exactly - we just need to take their best ideas, and marry them to our own!"
 
 ITA_import_their_technology:0 "Import Their Technology"
 ITA_import_their_technology_desc:0 "Complex electronics are the future, and all nations who do not recognize this will be left in the dust. We do not merely intend to move into this future - we mean to command it. Thus, we must ensure that we remain ahead in the digital arms race - but for that, we need cutting edge technology.\n\nFortunately, there is no nation further ahead in the realm of computer science than the Japanese. The Germans and Americans are pouring significant amounts of resources into their own computer programs, and have a native advantage we lack. However, we can negate this weakness by rapidly importing Japanese electronics and lessen the technological gap. Doing this will properly secure our place in the digital arms race - and further improve our trade with Japan."
 
 ITA_le_richezze_d_orient:0 "Le Richezze d'Oriente!"
 ITA_le_richezze_d_orient_desc:0 "The alliance between our two nations is stronger than ever before! Japanese imports flow into our ports, bringing materials and technology we are using to rapidly modernize ourselves with. Our businesses are bringing in more money than ever, and more Italian products are entering the east than ever before.\n\nOur governments are communicating closer at all levels, and cooperation between us has become normalized far more than we anticipated. Economic treaties signed bring more wealth to our nations, and with each one we entrench ourselves further in the economic sphere of the east. Our defense agreements have also ensured that no matter threatens us, we will always have an ally to call upon.\n\nLet this friendship herald a new era of prosperity for our nations! Glory to Italy! Avanti!"
 
 ###=====| f) Colonial Tree |=====###
 ITA_rebuilding_the_empire:0 "Rebuilding the Empire"
 ITA_rebuilding_the_empire_desc:0 "Our colonial empire is large and varied. From Algeria to Ethiopia and the Arabic Gulf, we rule over many lands and peoples. Our predecessors, however, had a flawed view on how to properly rule over colonial subjects, and now we have to deal with the consequences: reform must be quick and decisive, or we risk for the damage to become unrepairable.\n\nIf we want to keep the Empire together, we need to make everyone understand that we all serve something greater. The Empire is not "Italian" or "Ethiopian", it is made by the people, for the people. We might not be able to do everything we want in such a short timeframe, but this isn't a reason to slack: with hard work and indomitable will, we shall prevail.\n\nAvanti!"
 
 ITA_a_young_mans_dream:0 "A Young Man's Dream"
 ITA_a_young_mans_dream_desc:0 ""

 ITA_a_rational_mans_compromise:0 "A Rational Man's Compromise"
 ITA_a_rational_mans_compromise_desc:0 ""

 ITA_an_old_mans_wisdom:0 "An Old Man's Wisdom"
 ITA_an_old_mans_wisdom_desc:0 ""

 ITA_bring_the_light_of_fascism:0 "Bring the Light of Fascism"
 ITA_bring_the_light_of_fascism_desc:0 ""

 ITA_there_are_no_inferiors:0 "There are no Inferiors"
 ITA_there_are_no_inferiors_desc:0 "The Germans consider everyone not like them a slave. Despite apparently criticizing such views, in truth our predecessors treated our colonial subjects almost the same way Hüttig treated the people of Mozambique: we shall not make the same mistake, as we could all see the results of his madness.\n\nReforms shall be enacted to slowly bridge the gap between Italians and natives. They may not produce their effects in the short run, but we are sure that, slowly but steadily, hate and diffidence will give way to tolerance, and then commonance of intents: this is the way the Roman Empire was built, and we learn from the best!"


 ITA_religious_tolerance:0 "Religious Tolerance"
 ITA_religious_tolerance_desc:0 "Our colonial citizens practice many religions. Before, our predecessors used to suppress such practices in favour of official support for Catholic preaching and proselytism: of course, this had the result of enraging people whose time-honored traditions were discarded as "myths" or "heresies" by the mainstream religion.\n\nWith our focus on enforcing separation between state and religion, we shall repeal any law and regulation favouring this or that religion over the other. It is not the state's business who the people wish to worship, as long as said people are loyal to Italy first and foremost: surely, this will slowly but steadily reduce tensions between natives and settlers, as everyone respects each other's traditions."
 
 ITA_a_competent_administration:0 "A Competent Administration"
 ITA_a_competent_administration_desc:0 ""

 ITA_expand_colonial_infrastructure:0 "Expand Colonial infrastructure"
 ITA_expand_colonial_infrastructure_desc:0 ""

 ITA_improve_natives_conditions:0 "Improve Natives' Conditions"
 ITA_improve_natives_conditions_desc:0 "As of now, a native receives a fraction of what an Italian earns from the same job. This had the result of creating a large gap between locals and settlers, and in such gaps, hate and recrimination fester: we need to suture the wound before the infection becomes incurable!\n\nOf course, we can't immediately make natives and Italians perceive the same wage, and receive the same treatment. It would break the economy, and not even the most ardent idealist wants such an outcome: rather than charging towards a brick wall, we shall slowly extend social benefits and work legislation to the colonies, steadily pushing for higher wages and better conditions.\n\nit may take a decade, but before long, Italians and locals will be equal, and will be brothers in work as well as in life."
 
 ITA_modern_crowd_control_gear:0 "Modern Crowd Control Gear"
 ITA_modern_crowd_control_gear_desc:0 ""

 ITA_subsidize_colonial_migration:0 "Subsidize Colonial Migration"
 ITA_subsidize_colonial_migration_desc:0 ""

 ITA_native_blackshirts:0 "Native Blackshirts"
 ITA_native_blackshirts_desc:0 "Due to their half-military, half-volunteer nature, the Blackshirts are an invaluable security force in the colonies. Organized from the local settler population, they provide safety in places where the local garrison is often unable to patrol: such a role must protected, and even expanded.\n\nAs a way to foster equality and camaraderie between Italians and natives, we shall extend recruitment into the Blackshirts to loyal natives. Taking half the pay of a regular Italian - still way more than any other native would - they shall set the example for their brethren: loyalty is a reward in itself, but practical rewards are often what's needed to achieve a breakthrough..."
 
 ITA_all_sons_of_rome:0 "All Sons of Rome"
 ITA_all_sons_of_rome_desc:0 "Some of the greatest among Rome's emperors came from outside Italy. Septimius Severus hailed from Libya, Maximinus from Thrace, Aurelian and Diocletian from the Balkan lands, and others from even more distant provinces, and yet they all had one goal: to protect the Empire.\n\nThis is our true goal, our final goal. When all those living inside the Empire consider themselves brothers, no matter the color of their skin, the tongue they speak or the religion they practice, only then will our success be total: we know it will be a matter for another time - for another Duce, perhaps - but we'll still strive to achieve it.\n\nFascism is the way forward. Soon, the Eagle shall rise across the Empire, and a new, fascist dawn will bring prosperity to all the people living within its borders.\n\nLunga vita all'Impero!"
 
 ITA_all_sons_of_italy:0 "All Sons of Italy"
 ITA_all_sons_of_italy_desc:0 ""

 ITA_the_best_of_both_worlds:0 "The Best of Both Worlds"
 ITA_the_best_of_both_worlds_desc:0 ""

 ITA_reaping_the_fruits:0 "Reaping the Fruits"
 ITA_reaping_the_fruits_desc:0 ""

 ###=====| g) Oil Crisis Tree |=====###
 
 ###=====| h) Epilogue Tree |=====###
 ITA_an_everlasting_legacy:0 "An Everlasting Legacy"
 ITA_an_everlasting_legacy_desc:0 "Many years have passed since the day when we took the helm of a nation in disarray. Compared to the great flow of history, we are but acorns fallen from an eternal oak and still waiting to germinate, but in so little time, we have still managed to achieve great things: surely, none of this would have been possible without our glorious Duce, and he knows it.\n\nLately, however, our leader has been preoccupied with securing his legacy for the future. Despite our reassurances and his good health, he fears for the fate of the fascist revolution should anything happen to him, and is taking all the needed steps to ensure that the flame of fascism keeps burning: his concerns are far from unjustified, and we shall help him cement his legacy.\n\nUn'ultima volta, avanti!"
 
 ITA_il_duce_del_popolo:0 "Il Duce del Popolo"
 ITA_il_duce_del_popolo_desc:0 "Our Duce has always been adamant about his dedication to the common people. In a time when crisis gripped Italy, and many struggled to feed themselves and their families, Ettore Muti has become their paladin: he improved the workers' conditions, emancipated the women from their slavery to men, and ensured that the rich can no longer exploit the poor.\n\nIn order to cement his authority, a great propaganda campaign shall be initiated, reminding everyone of what they received from us. The Duce himself shall once again join the crowds in the largest tour we can remember: all shall see the People's Duce!"
 
 ITA_pursuing_the_future:0 "Pursuing the Future"
 ITA_pursuing_the_future_desc:0 "Today's future is tomorrow's present and the next day's past. As humans, we cannot break the curse of time, but this doesn't mean that we can't try to elevate ourselves from the beasts that are content with just surviving day after day: as true futurists, our pursuit of progress and advancement in all fields is entwined with our very souls.\n\nOur Duce knows this feeling very well, and despite his advanced age, he still yearns for more. We all stand by his side in his quest for the betterment of all Italians, and together, we shall reach new heights of progress: the future is always at a hairbreadth from our grasp, and we shall lunge forward to catch it before it dissipates!"
 
 ITA_visiting_the_factories:0 "Visiting the Factories"
 ITA_visiting_the_factories_desc:0 "Thanks to our reforms, the workers of Italy no longer have to toil long hours for a meagre salary just to enrich a businessman. Now, they work for the good of the Empire, and are rightly rewarded for their efforts with enough to live with dignity and a straight back: as such, they all are grateful to our glorious Duce for his far-reaching reforms.\n\nAs part of our propaganda campaign, Ettore Muti himself shall visit several factories and production sites all across Italy, meeting with workers and listening to their concerns. The revolution shall never end until all people live in a strong, prosperous, nationalistic Italy: we shall make sure that all know this!"
 
 ITA_the_greatest_rallies:0 "The Greatest Rallies"
 ITA_the_greatest_rallies_desc:0 "The time has come to show all of Italy - no, the entire world - how well-loved our glorious Duce truly is. He wishes for our greatest successes to be celebrated with grandiose rallies where the people will partake in the glory of the fascist revolution: the fields and squares shall fill, and all will hear the voice of Ettore Muti, Duce of fascism!\n\nWhile all of us rejoice at the news that our leader is still strong enough to face the crowds head on, one thought lingers in our minds. While celebrating our reforms and our successes is always something to rejoice about, many fail to understand such emphasis: Muti still has the mind and the strength to lead us, why would he focu so much into creating a legacy for posterity?"
 
 ITA_choosing_a_successor:0 "Choosing a Successor"
 ITA_choosing_a_successor_desc:0 "Studying the history of the Roman Empire, one thing that stands out is the succession crisis. Without a recognized procedure to appoint the next Emperor, as soon as anything happened to the current one, pretenders and usurpers would rise to contend the imperial title among themselves: Ettore Muti knows this well, and has learned enough not to make the same mistakes as our ancestors.\n\nAcross the last weeks, he has been examining several confidential reports about many among his most prominent ministers and advisors. Muti wants to make sure that, should anything happen to him, the next Duce would get into power with the support of the party, the people and the King: with the great reforms we have made, stability is still not completely achieved, and a succession crisis would throw all we have done into disarray!"
 
 ITA_oaths_of_loyalty:0 "Oaths of Loyalty"
 ITA_oaths_of_loyalty_desc:0 "A man is nothing without his word, a concept our glorious leader is very familiar with. Despite his official appointment of a successor, Ettore Muti knows that many will still try to take advantage of the power vacuum: no one is so foolish to think that traitors and reactionaries have been completely rooted from the party.\n\nTo this end, he will make all senior party officials take oaths of loyalty to Muti's chosen successor. The ceremony will be held at Palazzo Chigi and broadcasted all across the Empire: all Italians will see their faces as they pronounce the words of the sacred oath in front of our Duce, and all will remember should they break them!"
 
 ITA_inform_the_king:0 "Inform the King"
 ITA_inform_the_king_desc:0 "Throughout these years, relationships between our Duce and the King have been tense, but within the boundaries of normality. Ettore Muti knows that formalities need to be upheld, and he will not force the king to promise his support before the time comes: instead, he'll meet with Umberto II in private and talk to him about the need for stability in the realm.\n\nIt is no mystery that the King still holds doubts over our loyalty to him, and some of his concerns are not entirely baseless. Still, we both value stability, and if the revolution can be achieved without destroying an important part of our history, we surely won't complain: with this reassurance, the King should be convinced to promise to appoint Muti's successor as the next Prime Minister when the time comes."
 
 ITA_our_duty_fulfilled:0 "Our Duty Fulfilled"
 ITA_our_duty_fulfilled_desc:0 "In the last few weeks, our Duce has been a tornado of energy. He has been meeting ministers, bureaucrats, prominent party officials, foreign dignitaries and many, many others: with this gargantuan effort, he wishes to ensure that nothing will come to harm his successor - or the revolution itself - should anything happen to him.\n\nDespite our continuous efforts to assuage our leader by reminding him that if he has so much energy, he will surely last for at least another decade, he doesn't wish to see reason. By now, most have given up: after all, Ettore Muti has always been a man of action, and once he puts his mind into something, no one will be able to change his mind without a well-placed bullet..."
 
 ITA_monuments_to_the_future:0 "Monuments to the Future"
 ITA_monuments_to_the_future_desc:0 "As our ancestors teach us, triumphs must be celebrated properly so that, a thousand years from now, the future generations will still know about them, and about the men and women who accomplished such feats. Our leader believes that it is time to leave permanent signs of what our revolution has accomplished, so that all Italians may see how much we have progressed in so little time: who in his right mind would ever disagree?\n\nTo this end, we shall convene a great meeting where all manners of artists, from architects to sculptors and painters, will be able to propose their ideas on how better to celebrate Italy's restored greatness. Of course, it is widely known that our preference goes to the futurist artists: after all, strong lines, tall forms and a constant pursuit of new, exotic shapes is but the artistic form of fascism."
 
 ITA_the_foundations_of_a_new_italy:0 "The Foundations of a New Italy"
 ITA_the_foundations_of_a_new_italy_desc:0 "Our greatest cities - Rome, Turin, Milan, Tripoli to name only a few - have been standing for centuries, some even for millennia. Generations have lived passing under the same arches, walls or towers, in the eternal repetition of ancient life: with the coming of the modern age, our venerable cities are straining under the need for modern services, from phone cables to subways.\n\nAs his last gift to the Italian people, our glorious Duce shall lay the foundations of a new Italy. Our cities shall be redesigned from the ground up by the greatest futurist architects, that they may become shining examples of modernity and living standards: with the exception of great monuments and other historical sites, the inefficient remnants of ages past shall be torn down to leave place for modern, beautiful districts for all to live in.\n\nThis shall be remembered as Italy's second Renaissance!"
 
 ITA_carpe_diem:0 "Carpe Diem"
 ITA_carpe_diem_desc:0 "Finally, it seems that our great Duce is satisfied with his work. With his public image cemented, a successor chosen and secured, and his eternal legacy enshrined in the monuments under construction all across the Empire, he appears relieved and happy: the entirety of the Empire surely rejoices with him!\n\nOur venerable ancestors used to say "Carpe diem" or "take the fleeting moment", meaning that men should always take all opportunities fate and ability grant them. Ettore Muti did just that: in a time of crisis, he took the reins from incapable hands, and led our beleaguered country into a new, revolutionary age. For this, he shall forever be remembered as Italy's savior: may he keep leading us with the same wisdom for many, many years more!\n\nGloria al Duce! Gloria a Ettore Muti!"
 
 #############################
 ###=====| 4) EVENTS |=====###
 #############################

 ITA_muti.1.t: "The Inauguration of Muti"
 ITA_muti.1.desc:0 "Yeah, like in the title"
 ITA_muti.1.a:0 "Yeah, like in the description"

 ITA_muti.2.t:0 "Credit Instability"
 ITA_muti.2.desc:0 "The Atlantropa crisis, coupled with a Decade of Ciano's incompetent handling of the Italian economy, and the last war against Turkey, have left the State's coffers in a dire state. With public debt rising constantly to fund the army, the bureaucracy, and our subsidisation policies, our credit rating has always been quite unstable: this has not come to our advantage now.\n\nWith our economic reform program clearly involving large amounts of spending and nationalisations, many investment funds are looking warily at us. Excessive amounts of spending are, in their liberal views, a danger to private enrichment, and unsustainable in the long term: while not completely incorrect, they fail to see the fact that the people need a strong hand to lead them, and this applies to the economy too.\n\nStill, we cannot deny that the international investment funds are wary of our future moves, and will surely take action should we engage in what they deem "dangerous economic practices", or whatever capitalist lie they come up with."
 ITA_muti.2.a:0 "We must be careful..."

 ITA_muti.3.t:0 "Unforeseen Consequences"
 ITA_muti.3.desc:0 "When we started the first economic reforms, we expected that the international financial institutions would have been wary of our extensive subsidisation and nationalisation policies. The decadent, liberal democracies controlling the economic world, and their German stooges, are always afraid of potential challenges, after all.\n\nStill, we didn't predict such a quick and strong reaction. A few hours after we announced our full economic programme, international investor funds from both the Unides States and the German Reich expressed "extreme concerns" over the feasibility of such an ambitious reform plan, and therefore judged our financial solvency "compromised in the short-to-mid-term": while this doesn't spell doom for our treasury, it will still make us less trustworthy on the international markets, and directly impact our credit rating."
 ITA_muti.3.a:0 "Curses!"

 ITA_muti.4.t:0 "Credit Rate Improving!"
 ITA_muti.4.desc:0 "It seems that the pace of our reforms has been sufficiently effective to convince even the kleptocrats in Wall Street and Germania that our economy is not, in fact, being made into a communist hellhole. Our corporatist reforms are starting to give fruit, which has brought some of the less prejudiced investment funds to declare Italian bonds once again safe for investments: while it will take time to return to pre-crisis levels of trust, we are confident that we'll achieve it in the long run."
 ITA_muti.4.a:0 "Our flame starts burning!"

 ITA_muti.5.t:0 "Credit Crisis Solved!"
 ITA_muti.5.desc:0 "After months of ceaseless economic reformation, the final results are for all to see, and as they say, the truth admits no counterpoint. With a steady hand, we have reformed the economy into something that serves both the state and the people, ensuring financial stability and economic prosperity: the Duce is extremely satisfied about this, and did not forget to let it know in an empassioned speech which has been transmitted nationwide.\n\nEven the kleptocrats in Wall Street and Germania have been forced to begrudgingly admit that our reforms, at least for now, are sustainable and not dangerous for our long-term solvency. This has resulted in our credit rate being finally restored to the pre-reformation levels: while it will still take some time to fully enjoy the results of such a decision, we can at least rejoice for the fact that our glorious nation has defeated the lords of capitalism, showing that corporatism is the true way towards a strong, rich society!"
 ITA_muti.5.a:0 "Avanti!"

 ITA_muti.6.t:0 "Arise, Women Of Italy!"
 ITA_muti.6.desc:0 "Ettore Muti looked at the crowd of women in front of him. The Fascist Women Association had asked him to hold a speech to celebrate the new reforms, and he had accepted: among the participants - all women - some wore trousers and tried to style themselves as men, while others looked hesitant.\n\n"I heard that some think women should remain closed in their kitchen," he began, "To look after their husbands and children. I spit on them, for they know nothing about women!"\n\nThe crowd cheered, glad that someone could understand them.\n\n"I also heard that some asked me to "save" women from their slavery," he continued, "And I spit on them too, for they know nothing about women!"\n\nThe applause ceased abruptly, the crowd looking at him with uncertainty.\n\n"Do you think you need me to "save" you?" he asked, "Do you think you need me to break your chains? No!" his tone rose to a scream, "You do not need a man to save you! When our ancestors besieged Carthage, did the Punic women ask their husbands to save them?"He looked at the crowd, leaving the rhetorical question hanging.\n\n"No! They didn't!" he screamed, "Instead of crying and begging, they cut their hair to make ropes for the catapults! They threw stones on the besiegers! And when their loved ones fell around them, they stripped them of their weapons and fought to the last! They did not die like "men", they died like soldiers, like citizens, like heroines!"\n\nSuddenly, a thunderous applause rose, many women standing up to scream their approval.\n\n"Women of Italy, you have the will to free yourself, and the strength to back it up! Your chains are as strong as you believe them to be! Let fascism, not me, free you: an axe to strike at your oppressors, and a stick to beat you when you dare to think lowly of yourselves! Be wives and mothers if you wish, be workers and soldiers if you feel the call! We are all equal in our service to the Empire, and a black shirt knows not of sex!"\n\nThe crowd was chanting his name now, and looking at them, Ettore Muti knew that his vision was one step closer to completion."
 ITA_muti.6.a:0 "Rhetoric is a powerful weapon, if backed by will."

 ITA_muti.7.t:0 "Read The Writings On The Wall"
 ITA_muti.7.desc:0 "The woman in the poster was at the same time feminine and strong. She wore earrings and a mechanic's overall, and sweat lined her face, but she didn't seem to care: she was free, and she was happy.\n\n"National Worker Woman's Day" said the large writing at the lower end of the poster, with dates and locations for events, celebrations and talks.\n\nElisabetta Gregori in Fani stopped in her tracks to look at the poster, momentarily forgetting about the chores he had come to do. For a moment, she let her imagination fly: he would have liked it, to be the woman in the poster - free to do whatever she wanted, to simply decide what was best for her. She would have liked to choose, even without actually changing anything, for freedom was all she had ever wanted.\n\n"Elisabetta! The hell are you doing!"\n\nSuddenly, a voice ripped her away from her dream, and brought her crashing back to Earth. She felt once again her shopping bags anchoring her, and remembered who she was.\n\n"Yes dear, I'm coming. Sorry." She said dejectedly.\n\n"Yeah, yeah..." her husband said: "Women, always lollygagging as usual: hurry up, you still need to prepare dinner!"\n\nNodding more to herself than to her husband, Elisabetta turned her shoulders to the woman in the poster, and went back to her real life."
 ITA_muti.7.a:0 "Let dreams remain dreams."

 ITA_muti.8.t:0 "Unconventional Peacekeeping"
 ITA_muti.8.desc:0 "The four-men Blackshirt squad patrolled the road as usual. They all carried batons, and one of them had a small flask of "liquid punishment", as Paolo Cialdone, the squad leader, liked to call castor oil. Suddenly, screams erupted from a house near them, and Cialdone, baton in hand, ordered his men to surround the door - when a flurry of limbs crashed through it. As the Blackshirts separated the two, the squad leader could see they were a man and a woman, perhaps in their mid-twenties.\n\n"Enough!" He ordered imperiously: "Explain!"\n\n"This fucking woman, sir!" The man bagan, "My wife started hitting me for no reason!"\n\n"This lurid bastard," the woman replied, "Wanted to rape me! I defended myself!"\n\n"I'm your husband, Elisabetta! I can do whatever I want!"\n\nCialdone understood the situation, and looked once more at the woman. She would have been pretty, if not for the smudges of makeup and a large bruise on her cheek, but what intrigued him was her eyes: they had a fire in them, a will to fight - he smirked.\n\n"Miss," he interjected, taking hold of her bruised hand: "I see you hurt your hand. You must have punched your husband with the hand half-closed... That," he tutted, "Is a very unprofessional way to fight. THIS is how you give a punch."\n\nWith a speed almost unnatural for his bulk, the Blackshirt turned, and punched the woman's husband. The fist struck the man square in the face like a boulder, breaking his nose with a sickening crack.\n\nThe man fell to the ground, cursing and screaming in pain, holding his bleeding nose. After a few seconds, Paolo went near him, and slammed his booted foot on his groin, making his victim squeal.\n\n"My good sir," he said in the same, mock-innocent tone, "Our glorious Duce has stated that it is forbidden to mistreat women. This is especially true," he explained, adding more pressure, "Between husband and wife. Don't make me repeat myself."\n\nThe man nodded, moaning pitifully. Satisfied, Paolo removed the boot from its position, called his men, and left."
 ITA_muti.8.a:0 "The good deed of the day! Now, to clean the blood..."

 ITA_muti.9.t:0 "Meeting Under Different Circumstances"
 ITA_muti.9.desc:0 "The four-men Blackshirt patrol walked along the small river cutting the town in half. There was power in fear, and Paolo Cialdone made sure that his men were always in plain sight. As the sun started setting, he led his men to inspect under a bridge for vagrants or druggies - they also made perfect targets to have fun on boring days. There, however, he saw a small figure sitting on a large suitcase. As he advanced, baton in hand, he made out some details: lithe figure, long hair, a skirt - a woman?\n\n"Miss," He asked, a bit unsure, "What are you doing here? This is a dangerous place."\n\n"I will never return home!" The woman said determinedly, and from the voice, the Blackshirt knew exactly who she was. "I'd rather die than return with that pig!"\n\n"Miss, your husband gave me his word." Paolo said in a level tone: "He'll pay the price for lying to me: this time, I'll bust his fucki-"\n\n"No!" Elisabetta Fani interrupted him, "Please, don't. I just want to leave this place and be free. I'm waiting here until tomorrow morning, then I'll take the first train for Rome: from there, I can go somewhere no one knows me - Adriatica, Libya, Argentina, they will surely need a maid somewhere!"\n\nPaolo looked at the woman, and saw it once again. That fire in her eyes that can bring a person to do mad things, just so that they won't end up shackled - so, he spoke without reflecting.\n\n"What would you do for someone who could give you the means so that you will never have to bow, ever again?" He asked, ignoring the surprised looks his squad members gave him.\n\n"I would do anything!" She implored, a tinge of desperation in her voice: "I would kill for that person!"\n\n"Then come with me." He said: "I promise you that, in a few months, you will never have to fear again. Instead, others will fear you."\n\nElisabetta looked at the taller man with surprise, then nodded determinedly, and followed the group away from the bridge, leaving her suitcase behind."
 ITA_muti.9.a:0 "Now, she will truly be free."

 ITA_muti.10.t:0 "A Peculiar Kind Of Happiness" 
 ITA_muti.10.desc:0 "The five-strong Blackshirt patrol walked across the town square. There was power in fear, and Paolo Cialdone, the squad leader, made sure the people could always see them: the more the citizens saw them, the more they would believe they were everywhere, and they would be naturally brought to obey.\n\nElisabetta Gregori walked alongside them in her new uniform, a baton hanging from her belt. It had taken months of training, a lot of bruises and some dirty jokes, but now, she was finally happy: the last week, on her first patrol, a drunkard who had recognised her had screamed at her that she was getting shagged by the other Blackshirts - she had kneed the man in the groin so hard he had puked, and then she had pressed his face in the puddle of vomit with her boot, until he had cried and begged her to stop.\n\nA few days ago, Elisabetta had spotted her husband. As soon as the man had seen her, and her uniform, he had scurried away like the rat he was: it had made her feel good, in a feral kind of way. Finally, she was free to do what he wanted, and she had the strength to prevent anyone else from shackling her again, with comrades who were ready to defend her - not because she was weak and in need of protection, but because they all relied on each other.\n\nWalking across the road, Elisabetta saw an old poster hanging from a wall, with a woman depicted on it. She was at the same time feminine and strong, wearing earrings and a mechanic's overall; sweat lined her face, but she didn't seem to care: she was free, and she was happy. Rain had soaked the lower part of the poster, and the writing was no longer readable, but she remembered.\n\n"Elisabetta! The hell are you doing!" Paolo's voice boomed, tearing her from her memory. "The wall doesn't need patrolling!"\n\n"Yes leader!" She answered determinedly, "I'm coming!"\n\nWith that, Elisabetta turned her shoulders to the woman in the poster, and went back to her real, new life." 
 ITA_muti.10.a:0 "She has found her calling."

 ITA_muti.11.t:0 "The New Wind Of Fascism"
 ITA_muti.11.desc:0 "The parade ground in Asmara had been festooned with fasces and laurel wreaths. While new units of Blackshirts usually got ceremonies, that day was special, for the new recruits were the symbol of the Duce's vision for the Empire: for the first time in the history of fascism, non-Italians would wear the uniform of the MVSN - or rather, non-whites, for as Ettore Muti had said as he had signed the decree one month ago, citizenship was to be determined not by abstract concepts such as ethnicity or race, but by service and loyalty to the Empire.\n\nThe new recruits stood at attention at the center of the parade ground, waiting for their commanding officer to hold the speech that would signal their formal acceptance to the Blackshirts, but a murmur of incredulity rose from the crowd when they saw who was climbing the steps to the podium.\n\n"Camicie nere della rivoluzione!" Ettore Muti began, skipping any preamble as usual, "The way to progress and prosperity is long and arduous! Each and every step is difficult and filled with dangers: to advance, one must spill blood - the blood given by those who are loyal, and the blood taken from those who are disloyal!"\n\nThe crowd cheered, appreciating the Duce's direct message.\n\n"Such is your duty, my friends, such is your burden!" He continued: "After all, isn't killing for someone the supreme act of love? We commit the supreme act of evil, to protect the supreme good of our loved ones, of our beloved country!"\n\n"I am also here," Muti finished, "To welcome the many brave men of Africa who have heard the call of fascism! Africa is torn apart by the twin evils of German racism and African traditionalism: untold millions suffer and die as these twin beasts carve the continent apart, but you understood that the only way towards prosperity lies in cooperation! Together, we can turn this hell into a garden for everyone, and you shall be the lions guarding the gate, preventing those beasts from ever entering it! Glory to fascism, glory to the Empire, glory to you all! Your uniforms do not know what "race" is, so wear them proudly!"\n\nThe group of recruits saluted rigidly, then the Duce gave the signal to abandon formalities. Cheers and screams erupted, and Ettore Muti joined his Blackshirts for a soiree of alcohol and revelry: he knew he would have a headache the following day, but who cared about headaches, when one can have fun?"
 ITA_muti.11.a:0 "Fascism is, first and foremost, equality."

