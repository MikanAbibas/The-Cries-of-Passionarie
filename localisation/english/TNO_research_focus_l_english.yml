l_english:
 #law category
 research_laws:0 "R&D Types"
 tno_research_focus:0 "R&D Type"

 #ideas
 tno_research_focus_balanced:0 "Balanced Research"
 tno_research_focus_balanced_desc:0 "Our research institutes divide their funding evenly. Nothing advances quickly, but nothing is neglected either."
 tno_research_focus_doctrine:0 "Doctrinal R&D"
 tno_research_focus_doctrine_desc:0 "The general staff has the ear of the treasury. War colleges, staff rides and doctrinal reviews are funded ahead of the laboratories and the factory floor."
 tno_research_focus_land_naval:0 "Land & Naval Equipment R&D"
 tno_research_focus_land_naval_desc:0 "The army and the admiralty come first. Rifles, tanks, guns and hulls are refined year after year while the theorists, the airmen and the engineers wait their turn."
 tno_research_focus_air:0 "Aeronautical Equipment R&D"
 tno_research_focus_air_desc:0 "The air ministry has won the argument. Wind tunnels, rotorcraft and rocketry take precedence over everything the other services ask for."
 tno_research_focus_industry:0 "Civil Sector R&D"
 tno_research_focus_industry_desc:0 "Our best minds are put to work on the factory, the drawing board and the transistor. The armed forces are told to make do with what they have."

 #opener strip under the research slots
 TNO_RESEARCH_FOCUS_OPEN:0 "§aR&D Types§!"
 TNO_RESEARCH_FOCUS_OPEN_TT:0 "Direct our research establishment towards a single field of study.\nCurrent R&D type: §Y[This.GetResearchFocusName]§!\n[This.GetResearchFocusCooldown]"
 TNO_RESEARCH_FOCUS_CURRENT:0 "Current: §Y[This.GetResearchFocusName]§!"

 #picker window
 TNO_RESEARCH_FOCUS_TITLE:0 "§aR&D Types§!"
 TNO_RESEARCH_FOCUS_DESC:0 "By concentrating our research establishment on one field we can increase its development speed at the cost of other research.\nChanging R&D type costs §Y30§! political power and cannot be done again for a year."
 TNO_RESEARCH_FOCUS_STATUS:0 "[This.GetResearchFocusCooldown]"
 TNO_RESEARCH_FOCUS_STATUS_TT:0 "Our research establishment cannot be reorganised more than once a year."
 TNO_RESEARCH_FOCUS_COOLDOWN_UNTIL:0 "R&D type locked until §Y[?tno_research_focus_cd_date.GetDateStringNoHour]§!"
 TNO_RESEARCH_FOCUS_COOLDOWN_READY:0 "§GR&D type may be changed§!"
 TNO_RESEARCH_FOCUS_ACTIVE:0 "§GCurrent Type§!"
 TNO_RESEARCH_FOCUS_SELECT:0 "Set R&D Type"
 TNO_RESEARCH_FOCUS_SELECT_TT:0 "Costs §Y30§! political power.\nCannot be changed again for §Y365§! days.\n[This.GetResearchFocusCooldown]"

 #entry effects
 TNO_RESEARCH_FOCUS_BALANCED_EFFECT:0 "No bonuses or penalties to research."
 TNO_RESEARCH_FOCUS_DOCTRINE_EFFECT:0 "§G+10%§! Land, Air and Naval Doctrine Research\n§R-5%§! All Other Research"
 TNO_RESEARCH_FOCUS_LAND_NAVAL_EFFECT:0 "§G+10%§! Land Equipment and Ship Research\n§R-5%§! All Other Research"
 TNO_RESEARCH_FOCUS_AIR_EFFECT:0 "§G+10%§! Aeroplane, and Helicopter Research\n§R-5%§! All Other Research"
 TNO_RESEARCH_FOCUS_UNKNOWN:0 "§RUnnamed R&D Type§!"
 TNO_RESEARCH_FOCUS_UNKNOWN_EFFECT:0 "This R&D type has no entry in GetResearchFocusEntryName / GetResearchFocusEntryEffect."
 TNO_RESEARCH_FOCUS_INDUSTRY_EFFECT:0 "§G+10%§! Industry, Electronics, Construction Research\n§R-5%§! All Other Research"
 #national academias
 tno_research_focus_ger_motorized:0 "Kraftfahrtechnische Lehranstalt"
 tno_research_focus_ger_motorized_desc:0 "The truck works at Zwickau have been given a teaching charter of their own. Their engineers answer to no general staff and no ministry - only to the problem of moving an army faster than the last one could."
 tno_research_focus_ger_ifv:0 "Schützenpanzer Institut"
 tno_research_focus_ger_ifv_desc:0 "A dedicated institute for the IFV, born out of the helicopter works. Its brief is narrow and its funding is not: the squad goes to war under armour, or it does not go at all."
 TNO_RESEARCH_FOCUS_GER_MOTORIZED_EFFECT:0 "§G+20%§! Motorised Equipment Research\n§R-5%§! Doctrine and Industrial Research"
 TNO_RESEARCH_FOCUS_GER_IFV_EFFECT:0 "§G+20%§! IFV Research\n§R-5%§! Doctrine and Industrial Research"
 TNO_RESEARCH_FOCUS_UNLOCK_GER_MOTORIZED_TT:0 "Unlocks the §Y$tno_research_focus_ger_motorized$§! R&D type:\n  §G+20%§! Motorised Equipment Research\n  §R-5%§! Doctrine and Industrial Research"
 TNO_RESEARCH_FOCUS_UNLOCK_GER_IFV_TT:0 "Unlocks the §Y$tno_research_focus_ger_ifv$§! R&D type:\n  §G+20%§! IFV Research\n  §R-5%§! Doctrine and Industrial Research"

