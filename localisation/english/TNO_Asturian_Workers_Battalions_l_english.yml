 TBA_wars.1.t:0 "Midnight Rounds"
 TBA_wars.1.d:0 "The forest was eerily quiet as Juan and Miguel, two Falangist soldiers, patrolled the perimeter of their camp, their boots crunching softly on the pine needles. Juan, grumbling about the cold, suddenly tripped over a taut wire, tumbling headfirst into a deep pit concealed by tangled foliage. Miguel, startled, peered over the edge, his flashlight beam barely reaching Juan’s sprawled form below. “Hold on, I’ll get help!” Miguel shouted, his voice echoing as he sprinted toward the camp, leaving Juan in the dark, cursing his partner’s uselessness. \n\nAlone in the pit, Juan’s irritation gave way to unease as he fumbled for his rifle, his hands scraping against the damp earth. A chilling thought struck him—who had set this trap? His heart raced as he squinted upward, only to freeze when three shadowy figures appeared at the pit’s rim, their rifles glinting faintly in the moonlight, trained directly on him."
 TBA_wars.1.a:0 ""Don't Make A Sound""

 TBA_wars.2.t:0 "Liberation"
 TBA_wars.2.d:0 "The heavy iron gates of Oviedo prison creaked open, and Antonio, gaunt and pale after years of confinement for his ties to the PCE, stepped into the crisp air of freedom. Waiting beyond the gate were his girlfriend, Maria, her eyes brimming with relief, and his old comrade, Luis, another PCE member, who clapped him on the shoulder. Their smiles faded as Antonio, his voice hoarse but fierce, declared his intent to join the fight against the regime. Maria’s face tightened, and Luis shook his head, urging him to rest, noting the hollows in his cheeks from years of meager rations. Antonio’s gaze hardened as he leaned against the prison wall, the weight of his words cutting through the reunion’s warmth. “For years, I rotted in that cell, powerless, while our cause burned on without me,” he said, his voice trembling with conviction. “I’m done sitting idle—I need to fight, to make those years mean something.” Maria’s hand tightened on his, her eyes pleading, but Antonio’s resolve only seemed to grow stronger under the gray skies."
 TBA_wars.2.a:0 "One More For the Worker's Battalion"

 TBA_wars.3.t:0 "Old War"
 TBA_wars.3.d:0 "In a dimly lit kitchen, the old Republican veteran, Mateo, sat across from his grandson, Carlos, who fidgeted with a worn militia patch, his eyes bright with resolve to fight the Iberian Union and the Falangists. Mateo’s weathered hands, scarred from the Civil War, traced the grain of the table as he spoke, his voice low and heavy with memory. He recounted the chaos of ‘36—barricades in Barcelona, the bitter cold of the Ebro, friends lost to gunfire and betrayal. “War chews up ideals, spits out ghosts,” he said, eyes distant, “but I fought for a Republic that promised something better. We lost, Carlos. I failed.” \n\nHe leaned forward, gripping Carlos’s shoulder, his gaze fierce yet tender. “You’re carrying that same fire now. Be smarter than I was—braver, if you can. Fight for what we dreamed of, but come back alive.” With a trembling hand, he pressed a faded red scarf, a relic from his own battles, into Carlos’s palm. “Luck, my boy. Succeed where I couldn’t.” Carlos nodded, his throat tight, as the weight of his grandfather’s hopes settled on him."
 TBA_wars.3.a:0 "New Hope"

 TBA_wars.4.t:0 "Proper Knowledge"
 TBA_wars.4.d:0 "Javier, a wiry student clutching a stack of books, approached the University of Oviedo library, only to find his path blocked by his classmate, Raúl, who stood firm in front of the chained doors. Raúl, wearing a red armband, explained curtly that the library was closed due to the university’s reorganization under the communists’ directives. Javier’s face flushed with frustration as he argued, pushing against Raúl’s outstretched arm, insisting he needed to study for exams, not deal with politics. \n\nRaúl, exasperated, snapped back, “If you care so much, join a militia or the university council—do something useful instead of whining!” Javier, his patience gone, spun on his heel, muttering curses under his breath. “I’m here to learn, not play your revolutionary games,” he spat, storming off as Raúl shook his head in the shadow of the locked library doors."
 TBA_wars.4.a:0 ""He'll Get Killed Talking Like That," He Muttered"

 TBA_wars.5.t:0 ""
 TBA_wars.5.d:0 "Two Junta soldiers are patrolling the forest around a camp. One trips over a wire headfirst into a pit hidden by foliage. The other tries to get him out but the pit is too deep and he can’t reach him. He shouts he is going to get help at the camp, leaving the fallen soldier alone. The now alone soldier scuffs and thinks how useless his partner is when a thought crosses his mind, who put this trap here? His tribulations are cut short when he sees three figures pointing guns at him from the top of the pit."
 TBA_wars.5.a:0 ""

