l_english:
 # New Scramble for Africa (z_plans/SCRAMBLE_FOR_AFRICA_PLAN.md). Descriptions and option texts are the user's.
 # GUI text is in TNO_Scramble_gui_l_english.yml. Region names, cosmetics and the board's generated lines are below
 # "#cosmetic unified tags"; tools/scramble/gen_data.py lists any it would add or reword.

 # --- Events (SFA.1-SFA.7 the start and the patrons' notices, SFA.10 the monthly pulse, SFA.20 order ready)
 SFA.1.a:0 ""
 SFA.2.t:0 "The New Scramble for Africa"
 SFA.2.d:0 "The collapse of the monstrous Grossafrika freak-nation has left a massive power vacuum in Africa. The Italians have apparently decided to take advantage and grab a piece of it themselves. \n\nThis is a problem. \n\nThe CIA has been making good ground with democratic forces in the region and has been organizing local militias friendly to OFN ideals. The Italian invasion threatens to ruin that, not to mention the Japanese and Germans are starting to make moves into the region as well. We can't let all our efforts in Africa go to waste!"
 SFA.2.a:0 "Freedom For Africa!"
 SFA.3.t:0 "The New Scramble for Africa"
 SFA.3.d:0 "MEMO GD6731 \n\nHuttig's betrayal and subsequent mismanagement of the African colonies has resulted in predictable disaster. German control has been relegated to several fragmented pockets, as roving bands of Africans loot what they can and our enemies incite further violence against the settler populations there. We cannot let this stand any longer. \n\nAlready we are in contact with remnant forces. With national support we can ensure they can expel all foreign invaders and restore Africa to order once and for all."
 SFA.3.a:0 "Let Us Begin"
 SFA.4.t:0 "Chaos In Africa"
 SFA.4.d:0 "The total collapse of German Africa into absolute and complete anarchy has at once threatened the stability of East Africa, and simultaneously provided us with a unique opportunity. \n\nAfrica possesses a large amount of natural resources ripe for the taking. The High Command has been clamouring to move in before any other nation takes advantage. A task force has already been assembled on the East African frontier, ready to cross the border and occupy former Grossafrikan as soon as the order is given. No doubt the natives will resist, and our international rivals will move to respond - but hesitation is as deadly as recklessness. We must act now."
 SFA.4.a:0 "Let's Move"
 SFA.5.t:0 "The New Scramble for Africa"
 SFA.5.d:0 "REPORT ON AFRICA SITUATION \n\nThe utter destruction of the Grossafrika German colony has resulted in a chaotic situation as various warlords rise up and battle each other for territory. The value of African land cannot be ignored, however. \n\nThe Kempeitai reports favorable response from African nationalist groups and could prove willing allies against incursions from other nations. The Italians have already moved army units directly into former German East Africa. If we are to exploit the situation we must mobilize with all due speed."
 SFA.5.a:0 "So Be It"
 SFA.6.t:0 "Soliloquy For Huttig"
 SFA.6.d:0 "Huttig was a fool. \n\nA malleable fool, one cannot deny this, but a fool no less. His lack of patience was the doom of him. He had every opportunity to simply consolidate in Ostafrika but he could not resist the weakness of his "allies" and so pounced upon their territories as well. \n\nIdiotic. Did he believe that I had accomplished this in a fortnight? Does he imagine I dreamt of Burgundy and there it was? \n\nTo think of him now is a waste. His role is finished. Done. And so we move on to greater campaigns. \n\nThere are those among the lesser populations who desire to be left alone and rule their petty jungle fiefdoms unbothered. They will be fertile impediments to the degenerate "superpowers" of the world. \n\nMore still, the SS remains in Africa cry out for salvation. We shall answer their pleas, if only because they should prove more useful than the indigenous wildlife. \n\nAnd so the great plan continues and new pieces are introduced."
 SFA.6.a:0 "I Wonder How They Will Move?"
 SFA.7.t:0 "The New Scramble for Africa"
 SFA.7.d:0 "To The Caudillos \n\nHonoured sirs. I am sure you are well aware of the seizure of former German colonies by the perfidious Italians. Now the other nations in the world also play their hand and prop up warlords of their choosing. \n\nThere is reward for us too. The riches of the Congo lie open to us. From Jeunde we have a stable bridgehead into the Dark Continent. \n\nAnd why stop there? This is a prime opportunity to restore the Portuguese colonies of Angola and Mozambique to us. Iberia has always been cheated from Africa's riches. Now's our chance to make good on what is indebted to us. \n\nSigned, \n\nGeneral Afonso de Almeida Fernandes"
 SFA.7.a:0 "Forward!"
 SFA.10.a:0 ""
 SFA.20.a:0 ""

