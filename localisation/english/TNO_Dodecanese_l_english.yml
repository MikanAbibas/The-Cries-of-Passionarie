 POLITICS_FLORESTANO_DI_FAUSTO_DESC:0 "An architect of great skill and visionary thinking, Florestano di Fausto was famous for designing the face of Italy's colonial rule, earning himself the moniker of "Architect of the Mediterranean". Gubernatorial palaces, garrison buildings, triumphal arches: these are but some of the fruits of his genius, combining Venetian flourish with Roman proportions and rationalist rigour.\n\nAfter decades of profitable career, Di Fausto was appointed governor of the Dodecanese, ruling from one of the many palaces he designed. An ordinary administrator, not unlike the many that preceded him, he oversaw the constant integration of Rhodes and the surrounding islands in the larger Italian Empire, ensuring Italy's interests were upheld, but with a soft spot for the locals, which granted him a modicum of respect from the Greek population.\n\nSurely, De Fausto would have never thought he'd end up leading the defence of Rhodes against Turkish invasion. The governor's palace turned into a military headquarters, he acts as liaison with the mainland, trying to rally the defenders - both Italian and Greek - against a superior enemy.\n\nWill the Architect of the Mediterranean be able to turn his craft to the defence of the island? Will he turn Rhodes into a fortress like the Hospitaller Knights did centuries ago? And even then, will he be able to avoid the fate that befell the unfortunate knights, exiled from their homeland and sent back to Malta?"
