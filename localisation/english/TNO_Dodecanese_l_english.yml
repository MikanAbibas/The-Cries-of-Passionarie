 IID_rhodes_fortress_1:0 "Rhodes Fortress"
 IID_rhodes_fortress_1_desc:0 "The island of Rhodes, ancient home of the Knights of St. John and the Colossus, has a history of sieges from the times of Demetrios Poliorketes. With its difficult terrain, any attack will become a grinding war of attrition against the entrenched defenders, and the Turkish army will have a difficult time advancing amidst the incoming fire.\n\nAdding to the island's natural defences, the medieval fortress of the Hospitallers has been hastily converted into a modern fortification. Anti-aircraft batteries have been positioned on the ancient towers, machine gun nests dot the ditches, and a web of tunnels and bunkers hides munitions depots and barracks: should everything else fail, the defenders hope to be able to resist there until help from the mainland comes..."
