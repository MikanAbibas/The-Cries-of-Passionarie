### Names for Italy's decisions and decision categories that had none, so the
### panel drew their keys. Mostly the proxy-war suite - volunteers, rifles,
### vehicles, tanks and airstrikes for Syria, Iraq, Yemen, Egypt, the Levant and
### the Trucial States - plus the Iberian backing decisions, the two countdown
### missions and eight categories.

