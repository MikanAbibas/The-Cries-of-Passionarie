 #events

 GNS_wars.1.t:0 "The PIDE Piper"
 GNS_wars.1.d:0 "They had nowhere to run, those damnable Salazarists. In the end, they surrendered like cowards. Too long had they terrorized Portugal and meddled with the military. He had no pity for them. Nothing but snakes, they were.\n\nNow it was time for the military to take its rightful place as the protector of the nation. \n\nDeath to the old. \n\nA new Portugal awaits!"
 GNS_wars.1.a:0 "It Will Be Glorious"
 
 GNS_wars.2.t:0 "A Way Out"
 GNS_wars.2.d:0 "The warden looked over the lined-up inmates. Scum of the earth, no doubt, but the leadership had decided to put them to use, and who was he to disobey orders? \n\nThe prisoners would be offered a choice. If they served in penal battalions until victory was achieved, they’d be pardoned for their crimes and set free. \n\nOf course, the smarter ones would turn this offer down. The chances of survival were much higher, even in a hellhole like this, compared to one of the GNS’s penal battalions. \n\nBut considering they ended up here, he was willing to bet many of his prisoners weren’t all that intelligent."
 GNS_wars.2.a:0 "No Loss Either Way"
 
 GNS_wars.3.t:0 "The Center Of Salvation"
 GNS_wars.3.d:0 "Arriaga was deep in thought. \n\nHe had taken a drastic step by turning against the Estado Novo. Was it the correct decision? That would be proven in the months to come. \n\nIf nothing else, he could assuage his anxieties by knowing that he would have a moral victory either way. The Estado Novo was failing, and the democrats and communists proved to be no better. \n\nHe would have to sweep them all away. And then? Then the rest of Iberia had to be dealt with."
 GNS_wars.3.a:0 "Ideally"
 
 GNS_wars.4.t:0 "Title Pending"
 GNS_wars.4.d:0 "Lawyer saying a judge condemming many high ranking members of the ministry of economy of corruption"
 GNS_wars.4.a:0 "placeholder"

 GNS_wars.5.t:0 "King Of The Jungle"
 GNS_wars.5.d:0 "Danny Roxo, equal parts infamous and revered for his actions in Guinea-Bissau, has taken some of the soldiers under his command to go hunting in the forest. He tells the soldiers that the game here is not as good as it’s in Africa and tells them stories about his time in Africa. "Those damn rebels!" he laughed, "They were more dangerous than any animal in the jungle. They would make these traps that..." and he went on and on. Eventually, one of the soldiers asks if it’s prudent for them to be out here hunting instead of being in HQ planning the next offensive. Roxo laughs and says he is the commander of the region, which practically makes him king."
 GNS_wars.5.a:0 "He's Not Lying"
 
