 ITA_ddl_5_desc:0 "1. Pursuant to the purposes of quelling domestic unrest, the Polizia di Stato hereby are authorized to use force to defuse violent protest.\n\n2. The Polizia will receive additional funding to the amount of $50,000,000 per annum.\n\n3. Test Test Test\n"
 ITA_ddl_6_desc:0 "Dayumn deez trade unions are gonna be liberalzied\nFUCK FASCISM\nfuckin hate it -the provisional government probably\n\nplaceholder loc if you didn't get it already\n"
 ITA_ddl_7_desc:0 "These farmers need some money yo\nyoyo lets get this bread\n"
 ITA_ddl_8_desc:0 "1. For the purposes of this act, "the old regime" is hereby defined as the period of time from 1922 to 1963 characterized by the supreme leadership of the Partito Nazionale Fascista.\n\n2. In order to safeguard domestic tranquility and a new age of cooperative democracy, a general amnesty shall be called against any and all crimes committed by current or former members of the government committed in service of the old regime.\n\n3. This act shall seal the party records of the old regime for no less than seventy (70) years in order to allow for a peaceful and amicable transition to democracy.\n"
 ITA_ddl_9_desc:0 "1. The process of forming a new union shall be formalized, requiring the express permission (in writing) of the local council as well as any and all supervisors on the job in question.\n\n2. To prevent unnecessary bloodshed and violence, any planned mass industrial action must be first lodged with and approved by the local council and local police force.\n\n3. This act secures for Italian people the "right to work", and ensures that no union may force a worker to join a union or force an employer to exclusively hire union members.\n\n4. A union may not mandate dues or other financial contributions as a condition of membership.\n"
 ITA_ddl_10_desc:0 "1. The Confederazione Italiana Sindacati Nazionali dei Lavoratori (hereafter referred to as CISNAL) shall be recognized as the official trade union of the Italian state, with all of the privileges and responsibilities thereof.\n\n2. Given their new position, CISNAL shall be exempt from the existing regulations concerning union activity. This includes, but is not limited to, the Syndical Laws of 1926 and the more recent Economic Security Act.\n\n3. CISNAL shall be awarded an annual government stipend no less than 750,000 Lira, in order to assist in their new responsibilities.\n"
 ITA_ddl_11_desc:0 "1. For the purposes of this act, "mass industrial dispute" is defined as any violent or nonviolent action undertaken by members of a trade union with the express purpose of altering current conditions or pay.\n\n2. This act shall establish the office of the Prime Minister of Italy (or a substitute put forth by that office) as primary and final negotiator in any and all mass industrial disputes.\n\n3. The government of the Empire of Italy officially calls for businesses across the nation to raise their wages to a reasonable and equitable level so that every Italian may raise a family of their own.\n"
 ITA_ddl_12_desc:0 "1. To ensure equal funding is provided to both male and female students, Italy's schools shall be integrated so that both genders are sitting in the same classes.\n\n2. National curriculums shall be modernized in order to end the archaic worship of national figures, especially fascist ones.\n\n3. All methods of punishment involving physical abuse being committed against students will be hereby banned, effective immediately.\n\n4. Increased funding shall be directed to the education system to allow for schools to modernize their equipment in addition to their practices.\n"
 ITA_ddl_13_desc:0 "1. This act will establish 20 Regioni D'Italia across the nation that shall be entrusted with the functions and responsibilities of a reasonable local government as outlined in appendix 3, subsection alpha of this act.\n\n2. The Regioni will each be expected to hold local elections for the purposes of ordaining a democratically selected Consiglio Regionale as well as a Presidente della Regione.\n\n3. Each Regioni shall be granted a measure of autonomy to develop the laws they seem fit and necessary, except in the circumstance that such a law would contradict federal Italian law.\n"
 ITA_ddl_14_desc:0 "1. All companies operating under the Istituto per la Ricostruzione Industriale (IRI) must declare at the end of every fiscal year to have hired more people than those fired.\n\n2. The IRI will receive additional subsidies to be used in the hiring of new workforce.\n\n3. Newly hired personnel will receive full benefits, paid holidays, paid sick leave, paid maternal leave, and retirement.\n"
 ITA_ddl_15_desc:0 "1. Employment codes shall be made less restrictive, to increase the ease of hiring new employees and combat unemployment.\n\n2. Consequently, employment codes shall also be made less restrictive with regards to terminating employment contracts, to allow companies to increase the efficiency in their workforce.\n\n3. Subsidies shall also be distributed to smaller and medium-sized companies and businesses, to provide a safety net against the changes created by recent government policies.\n"
 ITA_ddl_16_desc:0 "1. This act shall establish the responsibility of the Istituto Nazionale della Previdenza Sociale (or INPS) to provide Cassa Integrazione (or CI) payment to Italian workers as required.\n\n2. CI payment is to be provided only in the circumstances wherein an employer can not afford to pay an employee but also wishes to retain the employee, and requests the INPS to pay CI rather than pay a salary directly.\n\n3. CI payment is to be no less than 500 Lira per month, and is to be provided for via income taxes.\n"
 ITA_ddl_17_desc:0 "1. This act seeks to encourage the collective Christan values of faith, forgiveness, social justice, and solidarity among the Italian people.\n\n2. In accordance with the principles established by Jesus Chirst of Nazareth and further Christan tradition, Italian workers shall gain the rights, privileges, and responsibilities outlined in subsection theta.\n\n3. These new rights, privileges, and responsibilities shall include a fundamental "right to respect" that shall not be infringed by any employer.\n"
 ITA_ddl_18_desc:0 "1. Recognizing the unique importance and value of television as a tool for mass media, this act shall subsidise the production and distribution of televisions for the consumer market.\n\n2. This act shall obligate Radiotelevisione Italiana to increase their broadcast range to cover the entire Italian nation and to primarily broadcast in standard Italian.\n\n3. The national curriculum shall be standardized to be exclusively taught in standard Italian in order to increase national unity.\n"
 ITA_ddl_19_desc:0 "1. This act shall establish the Fondo Nazionale per l'istruzione (to be allocated no less than 500,000,000 Lira per year) to be utilized at the discretion of the Consiglio dell'Istruzione Italiana.\n\n2. This act shall establish the Consiglio dell'Istruzione Italiana for the purposes of determining specific non-public schools that are both deserving of and in need of funding from the Fondo Nazionale per l'istruzione.\n\n3. The Consiglio dell'Istruzione Italiana shall be made up of 7 of the leading figures in Italian education. They are to be exclusively appointed by the Prime Minister, and the Prime Minister shall retain the right to dismiss them at any time.\n"
 ITA_ddl_20_desc:0 "1. No Italian citizen shall be barred from pursuing higher education, regardless of gender, religion, language, or ideology.\n\n2. All university taxes shall be lowered across the board.\n\n3. Every year, the Ministry of Education will release a determined amount of scholarships to be awarded to outstanding students who cannot afford the cost of university.\n"
 ITA_ddl_21_desc:0 "1. All teaching posts in higher education will be reviewed and cut according to the funding allocated for each university.\n\n2. University departments will be reduced and aligned for all higher education institutions across the country.\n"
 ITA_ddl_22_desc:0 "1. This Act will establish ten new Regions.\n\n2. The Special Statute Regions will be: Alpi Marittime, Cirenaica, Corsica, Sardinia, Savoie, Sicily, Trentino Alto Adige-Sudtirol, Tripolitania, Valle d Aosta, and Venezia Giulia.\n"
 ITA_ddl_23_desc:0 "1. The Ministry of Culture will release every year a determined amount of funds to be used for the production of cinematic works realized in Italy.\n\n2. These funds will take into account the costs of productions, including actors� salaries, video and audio equipment, costumes, sets, musical scores, and dubbing.\n\n3. Production and distribution companies operating in Italy will receive tax cuts provided they have produced new cinematic works at the end of the fiscal year.\n"
 ITA_ddl_24_desc:0 "1. All productions destined for cinematic release must be evaluated under the Committee for Public Morality.\n\n2. The Committee for Public Morality is the only body with the authority to approve the release of new cinematic productions to the public.\n\n3. In case of rejection, the distribution company has 20 days to appeal, or to present a new version of the cinematic production.\n"
 ITA_ddl_25_desc:0 "1. placeholder\n\n2. placeholder\n\n3. placeholder\n"
