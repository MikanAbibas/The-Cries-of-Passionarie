 ITA_ddl_31_desc:0 "1. The Lateran Pacts of 1929 shall be renewed and reaffirmed.\n\n2. A conciliatory foreign policy shall be adopted in regards to the sovereign state of the Vatican City.\n\n3. Negotiations for a new concordat with the Holy See to redefine the rights and privileges of the Roman Catholic Church in Italy shall commence.\n"
 ITA_ddl_32_desc:0 "1- To ensure a living wage and a fair life for the workers of Italy and safeguard the continued prosperity of the Italian nation and its citizens, this act shall:\n\n2-  Ensure that an employee's salary is proportional to the revenue and production of the employing firm.\n\n3- Penalize businesses found paying employees wages less than what is expected of them per appendix II of the Fairer Wages Act.\n"
 ITA_ddl_33_desc:0 "1. less taxes to small businesses or whatever\n\n2. subsidies for machines and industry for businesses maybe perhaps\n"
 ITA_ddl_34_desc:0 "1. healthcare run by the state funded by taxes\n\n2. free healthcare for all\n\n3. bargain prices of drugs\n"
 ITA_ddl_35_desc:0 "In order to bring Italy's road network up to the standards of the 20th century, the Ministry of Transport shall be granted over 50 billion lira for the purposes of infrastructure construction over the next ten years. This shall be disbursed to the Azienda Nazionale Autonoma delle Strade, a new state-owned corporation under IRI consolidated from existing private roads. ANAS shall be subsidized by the state, but reserves the right to collect tolls along highways.\n"
 ITA_ddl_36_desc:0 "In order to address the bottlenecks of foreign trade, the Ministry of Transportation shall construct new merchant vessels worth a total of 50 billion lira over the next ten years, and is responsible for training the personnel to man them. These vessels shall be operated by IRI or leased to private contractors, and will be authorized to transport cargo between Italy and foreign nations.\n"
 ITA_ddl_37_desc:0 "1.local health agencies\n\n2.they will cooperate with private clinics\n\n3.yeah \n\ncontrib loc lol\n"
 ITA_ddl_38_desc:0 "This piece of legislation will attempt to cement Italy's dominant posture in the Mediterranean Sea, while mollifying the fears of the former members of the Triumvirate and other nations through the extension of diplomatic and economic relations between Italy and these powers. Emphasizing its control of the Suez Canal and maritime trade routes, Italy will present itself as a bold regional power with whom cooperation and accommodation are necessary to ensure a prosperous future. Building a unified Mediterranean bloc can only improve Italy's standing in the world and would be a major foreign policy achievement for any Italian government.\n"
 ITA_ddl_39_desc:0 "1. The Bank of Italy shall lower lending interest rates to 0.75% per annum, to be reevaluated in a period of three months and then annually as per convention.\n\n2. The lira will be devalued in comparison to the US dollar, the Reichsmark, and the Japanese yen.\n\n3. A committee of the Bank of Italy shall be responsible for determining the exact devaluation rates of the lira in comparison to each currency.\n"
 ITA_ddl_40_desc:0 "1. The Kingdom of Italy is a Catholic country.\n\n2. The Kingdom of Italy shall be administered in accordance to Catholic morals and principles.\n\n3. The Bureau of Moral Governance shall be established as a government bureau.\n\n4. The Bureau of Moral Governance shall have the power to advise the government in order to preserve Italy's status as a Catholic country and encourage Catholic principles in policy.\n\n5. The Bureau of Moral Governance shall have the power to evaluate legislation under consideration by the Chamber of Deputies, with the advisory power to endorse or condemn legislation if it is found to be in accordance with or in violation of Catholic principles\n"
 ITA_ddl_41_desc:0 "placeholder\n"
 ITA_ddl_42_desc:0 "In order to keep up as a major power and to meet the growing demands of its people, Italy must improve and massively expand its electrical infrastructure. Especially in the countryside, millions of Italians still have no access to electricity, a fact that renders hopes of great power status an impossibility if not immediately addressed. In addition to improving living standards, electrification will benefit agricultural output and make industrialization of the South significantly easier. This bill provides the IRI with the funds to marshal private capital towards precisely those ends, catapulting Italy decisively into the twentieth century.\n"
 ITA_ddl_43_desc:0 "1. corporations good\n\n2. if corporation bigger, maybe better\n\n3. megacorps\n"
 ITA_ddl_44_desc:0 "Southern Italy is infamously underinvested in and economically backwards, with dire results for its inhabitants. The region lags long behind the North in terms of access to public services, living standards, and employment. The free market has completely failed to address these issues; the only choice is for the central government to step in and resolve the problem. This law authorizes the creation of a Southern Investment Fund to pour enormous amounts of state money into southern Italy, providing the capital and infrastructure to finally make an industrial transformation of the region feasible. Due to controversy on the right and left as well as among many northern voters, the bill may be a hard sell in the Camera, no matter its importance.\n"
