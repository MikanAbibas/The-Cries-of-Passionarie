 ITA_ddl_64_desc:0 "1. This act shall, so the people may be afforded an era of justice, revoke all previous general amnesty assigned to the leadership, bureaucrats, and officers of the old regime. \n\n2. To protect democracy from criminal elements and further acts of Fascistic terror, all members of the old regime will be stripped of any currently held government position they may have retained, and barred from holding any indefinitely. \n\n3. For the spirit of the act to be fully implemented, old regime party records will be opened, and all found to be war criminals or officials who used their position to commit abuses, will face trial.\n"
 ITA_ddl_65_desc:0 "1. So to commit to total victory over the old fascist order, this act shall thus compel the Parliament to accept the evidence presented to it, and use it to its full extent.\n\n2. This act shall demand the total and immediate surrender of any administrative position held by those found to have Fascistic affiliation, mafioso connection, or guilt of criminal abuse. \n\n3. In order to maintain the society of peace we have built, and forever keep at bay influences that threaten to return our society to one of violence and the worship thereof, this act will bar those expelled from their offices for an indefinite period.\n"
 ITA_ddl_66_desc:0 "To protect the Italian worker against undue exploitation is one of our highest causes. The Defend Jobs Act is the most pure expression of this particular platform, an act that will, if passed, secure unionization rights and secure employment for the average worker. No doubt businesses great and small will gripe and complain about it. The common refrain of how this will affect their bottom lines, but drowned out by what is certain to be overwhelming public support, their complaints will never be heard.\n"
 ITA_ddl_67_desc:0 "1. This act shall establish the Consiglio Degli Aiuti Economici as a subsidiary of the Ministry of the Treasury. The Consiglio shall be tasked with adjudicating the requests of Italian business for economic aid in order to help transition to the new economic status quo established by previous acts concerning workers' rights.\n\n2. This act shall set aside 10 million lira annually for the Consiglio to distribute as seen fit. Every 5 years, the Consiglio shall submit an updated budgetary request to confirm with inflation, as well as the needs of the Italian people.\n"
 ITA_ddl_68_desc:0 "1. This act shall officially acknowledge and apologize for the crimes of the old regime in the realm of academic and intellectual freedom.\n\n2. Any faculty on staff at all Italian institutions of higher learning shall be obligated to undergo an interview and investigation regarding their ties to the old regime. If found to have been a participant in the old regime, they shall be immediately fired from their current position and barred from any new educational position.\n\n3. The "Declaration of the Rights of the Student" as established in appendix beta shall be brought into effect. Among other things, this will secure a student's right to free speech, free action, and free beliefs.\n"
 ITA_ddl_69_desc:0 "1. This act will, in order to increase agricultural production to meet growing needs, ban the practice of owning land holdings while purposefully leaving it not developed or utilized for the sake of land speculation.\n\n2. To ensure the enforcement of the act, all found to have participated in land speculation in the past, or after the passage of this act, will have all their land seized and confiscated as punishment. \n\n3. So to permit the peasantry and landless poor a chance at legitimate ownership, this act will break up said confiscated land, redistributing it among those who will make productive use of the land.\n"
 ITA_ddl_70_desc:0 "1. For the purposes of this act, �political prisoners� are hereby defined as those imprisoned during the time of �the old regime� from 1922 to 1963, for political belief-related crime. \n\n2. So to demonstrate the new dawn for democracy, this act will afford all political prisoners of the time of the old regime full and complete pardons.\n\n3. For the sake of freeing the people from the silence promoted by the old regime, this act shall comprehensibly annul all old regime era laws regarding freedom of association, censorship, and the restricting of the press and political expression.\n"
 ITA_ddl_71_desc:0 "1. women good\n\n2. remove honor killings\n\n3. women deserve respect yo\n"
 ITA_ddl_72_desc:0 "It is one thing to collectivize unused and hoarded land, a difficult thing, no doubt, but it is a hurdle that has already been overcome. But now comes the next stage: distributing out to where it is needed. The demands of industrialization, the working classes, and the landless and disenfranchised peasants in the countryside all pull us in different directions, and as we redistribute the land we have come into possession of, we're going to need to balance these interests carefully.\n"
 ITA_ddl_73_desc:0 "The union has long been a staple of the urban worker; in fact, it's been a staple for nearly as long as there's been urban workers. The union protects the rights of the worker, and offers them the ability to negotiate collectively. But for the rural peasant in the countryside, there has never quite been an equivalent to draw upon. We can change that. By loosening restrictions on peasant unions and encouraging the rural workers to unionize, we can unite the urban and rural proletariat in solidarity with one another, as well as in providing a united front.\n"
 ITA_ddl_74_desc:0 "With the end of the fascist system, it's going to take a lot of work to re-establish a sense of trust and security with the new democratic government. The nation needs homes for its citizens, schools for its children, and hospitals for the wounded. The private sector cannot be entrusted to bear these burdens, not only on their own, but also not in the interests of the people. A robust and expansive public sector will need to be built from the ground up, and it all starts with these most fundamental of services.\n"
 ITA_ddl_75_desc:0 "It is simply not enough to have unions present. If they are present but not empowered, they may as well not exist at all, in fact. In order to ensure that they are capable of fulfilling their role in Italy's society and economy, protections are going to be need to be put in place for the rights and powers of the unions. It may simply not be enough for the worker to fight with the collective voice of their fellow worker, but perhaps the might of the government itself may lend their words the necessary weight.\n"
 ITA_ddl_76_desc:0 "Welfare does not merely mean welfare for individuals. The economy is a complicated set of machinery in which the workers, the peasants, the consumers, and the companies all interlock and interact in very specific, intricate ways. If we upset the balance too much, we risk throwing the whole thing into chaos. That is not acceptable. While we obviously need to fight on behalf of the working man, we can do so by providing some support to those companies that employ them as well.\n"
 ITA_ddl_77_desc:0 "1. This act shall implement the new educational policy outlined in appendix epsilon. In summary, every Italian minor shall be obligated to attend a minimum of 10 years of education from the ages of 6 to 16, and have the opportunity to attend a further 4 years of education if so desired.\n\n2. The Italian curriculum will be standardized, federalised, and secularized. The new curriculum will have a focus on emphasizing modernity, democracy, and gaining the proper background education for high-level education such as university.\n\n3. All Italian scuole medie and scuole secondarie superiori shall be obligated to provide sufficient vocational training so as to prepare a reasonable student to directly enter the blue collar workforce upon graduation.\n"
 ITA_ddl_78_desc:0 "1.This act shall undertake a multitude of different actions to allow for an equal educational system including, but not limited to:\n\n2. The subsidisation of both textbooks and local public transit systems for currently enrolled students.\n\n3. Creating a "Giovane Studioso" tax break program for any household that has at least one currently enrolled student who is not considered truant.\n\n4. Mandating that every Italian public and private school must provide free lunch and reduced-price breakfast for all students.\n"
 ITA_ddl_79_desc:0 "1. In the name of equitable and just Italian democracy, this act shall:\n\n2. Encourage private investment in the southern regions of the nation via a tax credit scheme as outlined in subsection delta of appendix beta.\n\n3. Officially endorse the subsidisation and construction of new infrastructure and industrial projects in the southern regions.\n\n4. Establish the "Comitato Sviluppo Economico per il Mezzogiorno" to determine any potential necessary alterations to the corporate tax code with regards to investment in southern Italy.\n"
 ITA_ddl_80_desc:0 "1. This act shall redirect the funding and direction of the Istituto per la Ricostruzione Industriale to focus heavily on the southern regions of the Italian nation.\n\n2. This act shall organize the construction of the "Autostrada del Mediterraneo", running from Salerno to Reggio Calabria and connecting with the "Autostrada del Sole" with the intention of linking the nation with one central automotive spine.\n\n3. This act shall organize the construction of a series of industrialized workers' co-ops across the southern regions of the nation.\n"
 ITA_ddl_81_desc:0 "1. In order to create a just and fair Italian society, this act shall:\n\n2. Enact the specific organogram laid out in appendix alpha.\n\n3. Formalize the elections of the Worker's Councils with federally mandated term-limits, and obligate the Councils to hold elections at least once every 2 years.\n\n4. Absorb the Councils into municipal government, establishing them as an equal secondary body to the "traditional" municipal government with mutual veto powers.\n\n5. Obligate the local Councils to elect a single representative each to a regional Council that will serve as an equal secondary government to the "traditional" regional government with mutual veto powers.\n"
 ITA_ddl_82_desc:0 "1. Recognizing that there can be no natural right more basic than access to healthcare, this act shall:\n\n2. Subsidize the construction of a modern hospital in every Italian municipality that has over 5,000 residents.\n\n3. Subsidize the hiring of any necessary medical staff at all current and future Italian hospitals.\n\n4. Expand major Italian medical schools both by physically increasing their educational resources and their ability to take in more students.\n"
 ITA_ddl_83_desc:0 "how do you make amendments for this, like:\nfocus on cancer research. what? also whhy would you oppose it\n"
 ITA_ddl_84_desc:0 "1. This act shall establish an anti-discriminatory society wherein no Italian may be denied equitable and fair treatment as a result of sex, race, color, religion, ancestry, national origin, disability, medical condition, language use, gender identity, genetic information, marital status, or sexual orientation.\n\n2. The same anti-discriminatory rights shall apply to people of all political views with the exception of those who advocate for violent fascism.\n\n3. Those who are currently imprisoned for nonviolent drug offenses shall be immediately released from prison, and all future nonviolent drug offenses shall no longer be punishable by imprisonment.\n"
 ITA_ddl_85_desc:0 "1. This act shall establish a "Consiglio Nazionale Antidiscriminazione" to determine necessary actions to integrate Italian society.\n\n2. All businesses, schools, and government organs shall be obligated to include a certain percentage (as determined by the Consiglio Nazionale Antidiscriminazione) of minority members.\n"
 ITA_ddl_86_desc:0 "1. Using the "Consiglio Nazionale Antidiscriminazione" established by the Easier Integration Act, this act shall:\n\n2. Use the Istituto per la Ricostruzione Industriale as a method of investing large amounts of wealth (specific amounts to be determined by the Consiglio Nazionale Antidiscriminazione) in minority regions with the intention of building strong economies in neglected regions.\n\n3. Give the Consiglio Nazionale Antidiscriminazione the authority to declare a region a "Regione Minoritaria", giving said region special autonomy and the ability to determine their own unique future.\n"
 ITA_ddl_87_desc:0 "1. This act shall, seeking to preserve personal liberty while lessening inequality and injustice, institute a fair tax plan aimed at wealth redistribution so as to support those with the least. \n\n2. To this end, this act will introduce a new tax. Those individuals with a net worth of over 40,000,000 Lira, not including debts or mortgages, will be asked to pay a small annual contribution to fund stronger social security for all of Italy.\n\n3. So to pursue, progressive income tax, there will be new tax brackets introduced, of 37% for income over 4,000,000 Lira and 42% for income over 6,800,000.\n"
 ITA_ddl_88_desc:0 "1. In order to generate the revenue necessary to safeguard the prosperity of the Italian nation and work to uplift the common toiler's livelihood and ensure their welfare and liberation from the shackles of poverty, the Fairer Taxes Act shall:\n\n2. Ensure that the wealth taken from a community is reinvested into it, by establishing a regime of taxation proportional to the citizen's overall wealth, with the rate of taxation increasing according to the citizen's overall income.\n\n3. Revise Taxation laws to clear them of any ambiguities used to evade the payment of owed taxes.\n\n4. Commit more resources to investigating and tackling Tax fraud and avoidance.\n"
 ITA_ddl_89_desc:0 "1. To serve this act, Anti-Fascism is hereby stated to be a commitment to the preservation of freedom, and opposition of Fascist-extremist governments and organizations. \n\n2. Upon passage, this act will mandate the invitation to Rome of delegates belonging to countries committed to excising Fascism. \n\n3. Upon arrival, the countries to whom the delegates belong too will be asked to participate in council to deliberate on how to combat Fascism. Additionally, they will be asked to sign the Anti-Fascist Treaty Act, for the purposes of making a principled stand against Fascism, organizing international resistance against it, and setting an example for the world.\n"
 ITA_ddl_90_desc:0 "1. To better serve the needs of the Italian citizen and more effectively tackle the manifestation of poverty throughout the nation, the Renewed INPS Act shall:\n\n2. Expand the duties of the Istituto Nazionale Della Previdenza Sociale to job creation and the establishment of unemployment benefits, better-enabling citizens to secure a source of income and guaranteeing them enough bread to eat when jobless.\n\n3. Enlarge the proportion of the national budget directed towards funding the Istituto Nazionale Della Previdenza Sociale and the Istituto per la Ricostruzione Industriale, with the aims of fulfilling the national objective of full employment via the organisation of job-creation schemes and national development plans.\n"
 ITA_ddl_91_desc:0 "1. This act will, for the purpose of exchanging views with a mind to contribute to world peace and co-operation, form the World Peace Council.\n\n2. To further this, the Council�s focus will be the remedying of the endemic disregard for global peace internationally. It will do so by promoting nuclear disarmament and the cooperation of nations. Additionally, it promotes the radical eliminating of the domination of Fascist colonialism-imperialism in all its manifestations.\n \n3. This act will commit this organization to the political doctrine of non-alignment, so that the Council may work toward becoming the vehicle by which big power blocs may engage in peaceful diplomatic dialogue.\n"
 ITA_ddl_92_desc:0 "Example\n"
