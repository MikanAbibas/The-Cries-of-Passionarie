l_english:

 RA_GLOBAL_NEWS.1.t:0 "Italy Wins The Algeria War"
 RA_GLOBAL_NEWS.1.d:0 "Italian forces under the command of General Giuseppe Castellano have defeated and driven out Iberian forces from the region. Italian control of Algeria has been cemented and Castellano has received a hero's welcome in Rome. The Iberians meanwhile have been completely forced out of the colony and have been hard pressed to house their fleeing Algerian settlesr.\n\nThe Italian Empire has proven its mastery of the Mediterranean Sea once more."
 RA_GLOBAL_NEWS.1.a:0 "Bullets Solve What Paper Cannot"
 RA_GLOBAL_NEWS.2.t:0 "The Prefecture of Algeria"
 RA_GLOBAL_NEWS.2.d:0 "With Italy's victory in Algeria, the political future of Algeria was placed in their hands. It appears the Italians have decided to formalize the Italian led military regime. \n\nNow named the Prefecture of Algeria, the Italian colony has been gifted to its victorious protector, General Castellano, who serves as its first prefect. \n\nThe news has disappointed Algerian independence supporters and dissent has begun to prop up. For now however, the Italian Army remains the predominant power in the territory."
 RA_GLOBAL_NEWS.2.a:0 "Avanti!"
 RA_GLOBAL_NEWS.3.t:0 "The Germania Declaration"
 RA_GLOBAL_NEWS.3.d:0 "International observers have been looking closely at the Reich since Reinhard Heydrich's ascendency to the office of Fuhrer. Reports of a power struggle within the SS exploded into a full scale war between Heydrich, and Burgundian forces led by his supposed subordinate, Heinrich Himmler. \n\nWith Burgundy defeated and Himmler dead, Heydrich has declared not only a reversal of long standing policies of the NSDAP, but the total annexation of Burgundian territory and the renaming of the German Reich into the European Volkseich, or Europa. \n\nWhether this is signs of a lapse in sanity of the notorious Blonde Beast, or the start of something greater remains to be seen."
 RA_GLOBAL_NEWS.3.a:0 "Unity Forever"
 RA_GLOBAL_NEWS.4.t:0 "The 4th Vienna Award"
 RA_GLOBAL_NEWS.4.d:0 "More formally known as the 2nd Transylvania War, Hungary has declared war on Romania, intent on not only regaining their territory from the 3rd Vienna War, but all Hungarian territory lost to Romania after the Treaty of Trianon. \n\nThe Hungarians have received the backing of their traditional ally, [GER.GetName], while Romania has received reinforcements from Italy, which is intent on countering [GER.GetAdjective] influence in the region. \n\nWith the Romanians and Hungarians at war once more, the only thing for certain is that the status-quo set by the previous war is now over."
 RA_GLOBAL_NEWS.4.a:0 "Another War In Europe"
 RA_GLOBAL_NEWS.5.t:0 "The Macedonia War"
 RA_GLOBAL_NEWS.5.d:0 "With heavy [GER.GetAdjective] support, Bulgaria has made a play to militarily enforce its supremacy over its weaker neighbors, Greece and Serbia. The latter two for their part have banded together and are joined by Italian expeditionary forces. \n\nStrangely, Yugoslavism has resurged in Serbia with the war's start and the Serbian government has signaled it not only intends to defend its territory but to take the whole of Bulgaria and restore nation of South Slavs. Whether they can survive to see their ambitions through remains to be seen."
 RA_GLOBAL_NEWS.5.a:0 "To The Strongest"
 RA_GLOBAL_NEWS.6.t:0 "The Vengeance War"
 RA_GLOBAL_NEWS.6.d:0 "The inevitable has happened. After weeks of buildup [FROM.GetAdjective] military units have crossed into the Reich's Muscowien territory and official declaration of war has been issued earlier today. \n\nThe relatively disorganized Western Revolutionary Front nearly overcame their hated enemies during the West Russia War. The much stronger [FROM.GetName] presents a dangerous new enemy, intent on claiming the former territories of the Soviet Union and rectifying the Old Unions humiliating World War Two defeat. Decades of warlordism has hindered yet hardened the Reich's old enemy. A brutal struggle for territory is anticipated. \n\n Whether or not [GER.GetNameDef] can maintain its stranglehold on Eastern Europe will be decided on the battlefield."
 RA_GLOBAL_NEWS.6.a:0 "Peace Was Never An Option"
 RA_GLOBAL_NEWS.7.t:0 "Peace Signed Between Hungary and Romania"
 RA_GLOBAL_NEWS.7.d:0 "The war for Transylvania has come to an end with a treaty signed between the two major combatants. Mediated by the Italian Empire, the treaty heavily favors Romania, with Hungary losing territory to them and to Croatia in addition. \n\nOverall, this represents a significant victory for Romania and Italy as well, which heavily supported Romania against the [GER.GetAdjective] backed Hungarians. Italian influence has expanded in both combatants, representing a major setback for [GER.GetNameDef]. \n\nWhat happens in the region's future is uncertain, but for now both Italy and Romania can celebrate their triumph."
 RA_GLOBAL_NEWS.7.a:0 "Romania Asserts Itself Once More"
 RA_GLOBAL_NEWS.8.t:0 "Peace Signed Between Hungary and Romania"
 RA_GLOBAL_NEWS.8.d:0 "The war for Transylvania has come to an end with a treaty signed between the two major combatants. \n\nMediated by [GER.GetNameDef], the treaty heavily favors Hungary, with them gaining control of the entirety of their historical territory in Transylvania. Romania has also surrendered control of Odessa to [UKR.GetNameDef].\n\nOverall, this represents a significant victory for Hungary as well as their allies in Germania, who were interested in the defeat of the Italian supported Romanians. [GER.GetName] has brought both nations under it's wing and has rebuffed Italian attempts to assert itself in the region. \n\nThe future of both Romania and Hungary is not entirely clear, but for now the Hungarians and their [GER.GetAdjective] patrons can enjoy their collective triumph."
 RA_GLOBAL_NEWS.8.a:0 "Trianon Left In The Dirt"
 RA_GLOBAL_NEWS.9.t:0 "Serbia and Greece Defeat Bulgaria"
 RA_GLOBAL_NEWS.9.d:0 "Serbia and Greece have emerged as victorious in the Macedonian War, defeating the Tsardom of Bulgaria. \n\nIn a shocking twist however, the Serbian government has done the unprecedented and annexed Bulgaria in its entirety, and declared the restoration of Yugoslavia. \n\nThis move has sparked international attention with many suspecting this state of affairs will not last. If it does however, there is also a question of whether or not the newly reformed Yugoslavia will turn on its Italian backers and attempt to reclaim Yugoslavia's historical territories. Their allies appear to have revanchist ambitions as well, with Greece eyeing Turkish territories. \n\nWhatever the case, the Balkans have been changed drastically once more."
 RA_GLOBAL_NEWS.9.a:0 "Interesting To Say The Least"
 RA_GLOBAL_NEWS.10.t:0 "Bulgaria Destroys Serbia and Greece"
 RA_GLOBAL_NEWS.10.d:0 "Bulgaria emerged as victorious in the Macedonian War, defeating both [SER.GetNameDef] and  [GRE.GetNameDef]. The Bulgarians have annexed territories from their enemies and have installed governments receptive to their whims. \n\nFurthermore, the Tsardom has decided to deepen its relationship with [GER.GetName] and formally rejoin the Pakt. The whole affair represents a significant coup for [GER.GetAdjective] interests in the Balkans, in addition to Bulgaria's own hard fought victory."
 RA_GLOBAL_NEWS.10.a:0 "Are They Going To Start Calling Themselves An Empire Again?"
 RA_GLOBAL_NEWS.11.t:0 "The [GER.GetName] Wins The Vengeance War"
 RA_GLOBAL_NEWS.11.d:0 " Shocking news from Russia! Once again, the Reich stands victorious over its enemies. Having completely repulsed the [RUS.GetAdjective] invasion, [GER.GetAdjective] struck deep into enemy territory and completely overran their adversaries. \n\nGermany now stands as the undisputed master of Russia, Siberia, and Central Asia. If nothing else, the Reich has once again proven itself the Master of Europe."
 RA_GLOBAL_NEWS.11.a:0 "Vengeance Denied"
 RA_GLOBAL_NEWS.12.t:0 "End Of The Vengeance War"
 RA_GLOBAL_NEWS.12.d:0 "Shocking news from Russia! Once again, the Reich stands victorious over its enemies. The [RUS.GetAdjective] government has completely failed at all its objectives, and has additionally been forced back to the Urals. In a similar humiliation, mirroring that of the Old Union, the [RUS.GetAdjective]s now must face the reality that they have been expelled from Europe, perhaps permanently. Whether they can pivot or fall into disarray remains unclear for now. \n\nThe Germans, for their part, have celebrated their victory, and [GER.GetLeader] has designated a national holiday to celebrate [GER.GetName]'s triumph."
 RA_GLOBAL_NEWS.12.a:0 "A Victory Repeated"
 RA_GLOBAL_NEWS.13.t:0 "End Of The Vengeance War"
 RA_GLOBAL_NEWS.13.d:0 "Shocking news from Russia! Once again, the Reich stands victorious over its enemies. The [RUS.GetAdjective] government has completely failed at all its objectives, and the war has ended in status quo ante bellum. The [RUS.GetAdjective]s now must face the reality that they may never reclaim their former territories. \n\nWhile not a complete victory for the Germans, Germania is still a scene of celebrations as the so-called master race celebrates their Reich surviving yet another test."
 RA_GLOBAL_NEWS.13.a:0 "Another West Russian War"
 RA_GLOBAL_NEWS.14.t:0 "End Of The Vengeance War"
 RA_GLOBAL_NEWS.14.d:0 "The ascendant [RUS.GetAdjective]s have made good on their promises and have driven the Germans out of the former Reichskommissariat Moskowien. This has marked a critical turning point in German fortunes. Though they retain their hold over much of Eastern Europe, the [GER.GetName] now must contend with an enemy that has crawled its way ever closer to Germania. \n\nWhile the government of [RUS.GetNameDef] did not complete all its objectives, the seizure of European Russia has cemented their nation's position as a major power."
 RA_GLOBAL_NEWS.14.a:0 "The [RUS.GetAdjective]s Are Home"
 RA_GLOBAL_NEWS.15.t:0 "End Of The Vengeance War"
 RA_GLOBAL_NEWS.15.d:0 "The ascendant [RUS.GetAdjective]s have made good on their promises and have driven the Germans out of the former Reichskommissariats Moskowien and Kaukasia. This has marked a critical turning point in German fortunes. Though they retain their hold over much of Eastern Europe, the [GER.GetName] now must contend with an enemy that has crawled its way ever closer to Germania. The loss of the Caucasus has also been a critical blow the [GER.GetAdjective] economy, and strategic position.\n\nWhile the government of [RUS.GetNameDef] did not complete all its objectives, the seizure of European Russia and the Caucasus has cemented their nation's position as a major power."
 RA_GLOBAL_NEWS.15.a:0 "No More Caspian Vacations For The Germans"
 RA_GLOBAL_NEWS.16.t:0 "End Of The Vengeance War"
 RA_GLOBAL_NEWS.16.d:0 "The ascendant [RUS.GetAdjective]s have made good on their promises and have driven the Germans out of the former Reichskommissariats Moskowien, Kaukasia, and Ukraine. This has marked a critical turning point in German fortunes. Though they retain their hold over Ostland, the [GER.GetName] now must contend with an enemy that has crawled its way ever closer to Germania. The loss of the Caucasus and Ukraine has also been a critical blow to the [GER.GetAdjective] economy and strategic position.\n\nThe government of [RUS.GetNameDef] managed to complete most of its strategic objectives, and the victory over its hated rival has cemented [RUS.GetNameDef]'s position as a major power."
 RA_GLOBAL_NEWS.16.a:0 ""Master Of Europe" Indeed"
 RA_GLOBAL_NEWS.17.t:0 "The [RUS.GetName] Wins The Vengeance War"
 RA_GLOBAL_NEWS.17.d:0 "With the seemingly unstoppable [RUS.GetAdjective]s steamrolling through the Reich's eastern holdings, Germania has turned to drastic measures. Using a succession of ICBMs, the Germans have created a nuclear barrier between themselves and their enemies. This action has killed thousands of innocents and has drawn condemnation from around the world. Unable to continue their advance, the [RUS.GetAdjective] government has agreed to a ceasefire, effectively ending the Vengeance War. \n\nBeginning as a petty warlord holding, the [RUS.GetNameDef] has clawed its way to victory, unifying the shattered remains of the Old Union and waging an overwhelmingly successful war against the Reich. While their dreams of burning Berlin to the ground have been put on hold, the [RUS.GetAdjective]s may take comfort in knowing their place in history and the world has been cemented for ages to come."
 RA_GLOBAL_NEWS.17.a:0 "Revenge Colder Than A Siberian Winter"
 RA_GLOBAL_NEWS.18.t:0 "[RUS.GetName] Invades Manchuria"
 RA_GLOBAL_NEWS.18.d:0 "While still recovering from the warlordism of the 1960s, [RUS.GetNameDef] has made a play for much of the former Russian Far East. [RUS.GetAdjective] troops have also been spotted in Manchuria and Mongolia as well, making this a massive operation. \n\nWith Japanese positions already under threat elsewhere, many wonder if the Empire of the Rising Sun can make a stand and retain its northern frontier."
 RA_GLOBAL_NEWS.18.a:0 "Another Challenge For Japan"
 RA_GLOBAL_NEWS.19.t:0 "Chaos In Iberia"
 RA_GLOBAL_NEWS.19.d:0 "Reports of violent skirmishes all over the Iberian peninsula have been flooding newsdesks and intelligence services the world over. \n\nWhat started as an uprising of Basque separatists has degenerated into the absolute dissolution of the Iberian State. Neither Portugal nor Spain have escaped unscathed. Several rival governments have cropped up and have moved to assert . Rumors of brutal massacres and ruthless purges are already starting to arise. The future of the Iberian Peninsula appears to be bleak."
 RA_GLOBAL_NEWS.19.a:0 "Horrible!"
 RA_GLOBAL_NEWS.20.t:0 "Socialist Victory In Iberia"
 RA_GLOBAL_NEWS.20.d:0 "The Iberian Wars have come to an end with representatives of various Iberian socialist movements declaring a new revolutionary order from the Palacio de las Cortes. While their enemies fought from centralized power bases, the Iberian Socialists was notably decentralized with Revolutionary forces acting all over the peninsula. \n\nThis decentralization may have won them the day, but now the nascent government of the Democratic Union of Iberia must now cope with a rising tide of factionalism. No longer united against a common foe, the disparate factions of the worker’s revolution now vie for influence. Time will tell who will rise to claim the Iberian Revolution as their own."
 RA_GLOBAL_NEWS.20.a:0 "The New Union"
 RA_GLOBAL_NEWS.21.t:0 "The End of Burgundy"
 RA_GLOBAL_NEWS.21.d:0 "The power struggle over the German Reich has ended in victory for Reinhard Heydrich and the German SS. \n\nWaffen-SS units and assorted allies loyal to the Führer have paraded in Paris today, celebrating their triumph. Heinrich Himmler is presumed dead, with reports that his body is hanging from the Eiffel Tower, one among many. \n\nThe so-called "Man With An Iron Heart" has assembled a diverse coalition to defeat his former superior. What happens to the Reich now is currently uncertain."
 RA_GLOBAL_NEWS.21.a:0 "Will The Killing Ever Stop?"
 RA_GLOBAL_NEWS.22.t:0 "Schörner Overthrows Goering"
 RA_GLOBAL_NEWS.22.d:0 "Dissatisfaction with the state of the German Reich has led forces loyal to Field Marshal Ferdinand Schörner to launch a coup d'état against Führer Hermann Göring. Göring was shot dead in his office by coup forces, and Schörner has been proclaimed the new Führer of Germany. \n\nAn ardent expansionist, even more so than the late Göring, Schörner seeks to dedicate the entire Reich to endless conquest, with some believing he has plans for world domination. Whether he can hold on to power long enough to make this dream a reality remains to be seen."
 RA_GLOBAL_NEWS.22.a:0 "Ambition Is Poison"
 RA_GLOBAL_NEWS.23.t:0 "Speidel's Countercoup"
 RA_GLOBAL_NEWS.23.d:0 "Schörner's reign as Führer, it seems, has come to a premature end. Wehrmacht units, led by pragmatic officers, rose up in revolt and deposed the would-be conqueror with help from his supposedly trusted subordinates. \n\nHans Speidel has once again taken up a provisional position of leadership in Germania, though now he holds the entire Reich in his hands unopposed. \n\nThe general has promised political and economic stabilization. Hans Speidel has notably refused to take the mantle of Führer and has promised to step down at a later, though unspecified, date."
 RA_GLOBAL_NEWS.23.a:0 "Him Again?"
 RA_GLOBAL_NEWS.24.t:0 "Speidel Declared Führer"
 RA_GLOBAL_NEWS.24.d:0 "After a grand conference involving Wehrmacht officers and some NSDAP officials, Hans Speidel has been officially declared Führer of the German Reich. \n\nAlready leading in a provisional position, Hans Speidel has only solidified his place within the Reich with this announcement. \n\nPromising to continue his reforms, Führer Speidel seems to have a long career ahead of him."
 RA_GLOBAL_NEWS.24.a:0 "Not Surprising"
 RA_GLOBAL_NEWS.25.t:0 "Claus Von Stauffenberg Declared Führer"
 RA_GLOBAL_NEWS.25.d:0 "After a grand conference involving Wehrmacht officers and some NSDAP officials, Claus von Stauffenberg has been officially declared Führer of the German Reich. \n\nHans Speidel has already stepped down to allow the new Führer to take his rightful place. \n\nFührer von Stauffenberg has declared his intention to restore the traditions that the Reich has ignored for too long. What exactly that means remains to be seen."
 RA_GLOBAL_NEWS.25.a:0 "How Interesting"
 RA_GLOBAL_NEWS.26.t:0 "Hans-Ulrich Rudel Declared Führer"
 RA_GLOBAL_NEWS.26.d:0 "After a grand conference involving Wehrmacht officers and some NSDAP officials, Hans-Ulrich Rudel has been officially declared Führer of the German Reich. \n\nHans Speidel has already stepped down to allow the new Führer to take his rightful place. \n\nA Luftwaffe veteran whose career spans from World War II to the South African War, Rudel cuts an energetic and charismatic figure. Rudel is a committed National Socialist ideologue; he intends to foster a level of patriotism in the Reich not seen since the end of the war."
 RA_GLOBAL_NEWS.26.a:0 "Another Flyboy Führer"
 RA_GLOBAL_NEWS.27.t:0 "Horst Mahler Declared Führer"
 RA_GLOBAL_NEWS.27.d:0 "After a grand conference involving Wehrmacht officers and some NSDAP officials, Horst Mahler has been officially declared Führer of the German Reich. \n\nHans Speidel has already stepped down to allow the new Führer to take his rightful place. \n\nA firm believer in the long-eschewed Strasserite strain of National Socialism, Mahler is a fervent populist and advocate for the rights of the German working class. It is doubtful that the massive German conglomerates will take his proposed reforms lying down."
 RA_GLOBAL_NEWS.27.a:0 "Strasser's Time At Last"
 RA_GLOBAL_NEWS.28.t:0 "Alfred Rosenberg Declared Führer"
 RA_GLOBAL_NEWS.28.d:0 "After a grand conference involving Wehrmacht officers and some NSDAP officials, Alfred Rosenberg has been officially declared Führer of the German Reich. \n\nHans Speidel has already stepped down to allow the new Führer to take his rightful place. \n\nOne of the longest-serving members of the NSDAP, Rosenberg played a key part in the early history of the Nazi Party and became an influential figure in the development of National Socialist ideology. \n\nSome of his ideas proved controversial, and he was relegated to the sidelines for a time. One of these ideas is Rosenberg’s belief that Slavs can be considered Aryan. And now he has the power to make his ideas reality."
 RA_GLOBAL_NEWS.28.a:0 "So It Is"
 RA_GLOBAL_NEWS.29.t:0 "Albert Bormann Declared Führer"
 RA_GLOBAL_NEWS.29.d:0 "After a grand conference involving Wehrmacht officers and some NSDAP officials, Albert Bormann has been officially declared Führer of the German Reich. \n\nHans Speidel has already stepped down to allow the new Führer to take his rightful place. \n\nThe younger brother of Martin Bormann, the new Führer is different from his brother in more ways than one. \n\nHaving maneuvered himself into power, Bormann has already put forward plans to increase administrative efficiency and reduce factionalism within the government."
 RA_GLOBAL_NEWS.29.a:0 "Maybe He Will Succeed"
 RA_GLOBAL_NEWS.30.t:0 "Palace Coup in Japan!"
 RA_GLOBAL_NEWS.30.d:0 "Shocking news from the Tokyo Imperial Palace today: Amid governmental chaos and dysfunction, it appears that the Prince Higashikuni, a prominent senior statesman or Jushin, and Lord Privy Seal Kido have ordered the Yokusankai-dominated cabinet to step down and let members of the Royal Family and Imperial loyalists take their place. While official news from Japan has been scant as of late, what few sources are available state that officials are 'greatly concerned about potential conspiracies within the Government'.\n\nNow, the government seems certain to collapse and be replaced with one of Kido and Higashikuni's choosing. The plans of the new rulers of Japan are not yet known. But the fear is that the Japanese Diet will be sidelined completely, and a period of rule by decree will begin. If this is true, then it seems that Japan is backsliding into dictatorship once more.\n"
 RA_GLOBAL_NEWS.30.a:0 "Perhaps this time, forever."
 RA_GLOBAL_NEWS.31.t:0 "Military Coup in Japan!"
 RA_GLOBAL_NEWS.31.d:0 "Alarming news out of Tokyo earlier today as the civilian government has, without warning, resigned en masse. This was soon followed by General Mutō Akira of the IJA being appointed Prime Minister. Almost immediately after his appointment, he ordered the Army to restore order throughout Japan and its capital.\n\nThis all apparently stemmed from the previous government's investigation into the armed forces, which according to Mutō turned into a "treasonous and insane witch hunt" that had to be ended. Martial law has now gone into effect. Thousands have been reported arrested and hundreds reportedly shot by military police while foreign correspondents have been forced under house arrest. Mutō seems to care little about global condemnation, and is already moving to crush all "harbingers of chaos". As such, all that could be heard from Tokyo for the last 24 hours were:\n"
 RA_GLOBAL_NEWS.31.a:0 "Gunshots, sirens, and soon... order."
 RA_GLOBAL_NEWS.32.t:0 "Fukuda Takeo Elected Prime Minister of Japan"
 RA_GLOBAL_NEWS.32.d:0 "Reports from Tokyo confirm that the Jushin, the Imperial cabinet controlling the ministerial appointments, has received the resignation of former Prime Minister Kaya Okinori, and appointed the Diet's choice Fukuda Takeo, former Economy Minister in the Kaya administration, as the new Prime Minister of Japan. The new Prime Minister, in a televised speech, promised to continue the policies of his predecessor that lifted the country up from the Yasuda Crisis.\n\nAn experienced bureaucrat, Fukuda Takeo is the foremost representative of a new wave of administrators with an eye to economic reform but free from the influence of the infamous "Reform Bureaucrat" faction, and a very close ally to former Prime Minister Kaya, who vouched for his talent at managing Japan's finances.\n"
 RA_GLOBAL_NEWS.32.a:0 "His expertise is a blessing for the Empire."
 RA_GLOBAL_NEWS.32.b:0 "The baton is passed to a new generation."
 RA_GLOBAL_NEWS.33.t:0 "Shiina Etsusaburo Elected Prime Minister of Japan"
 RA_GLOBAL_NEWS.33.d:0 "After a few confusing moments in the Diet, it appears that Shiina Etsusaburo secured enough votes for his election as the new Prime Minister of Japan, with the Jushin confirming it shortly afterwards. Prime Minister Shiina, in a televised speech, promised to "deliver Japan from the mistakes of previous administrations", and "amend the inefficiencies that plagued the economy since the Yasuda Crisis through careful reform."\n\nAs a bureaucrat in Manchukuo who then became a close aide of Prime Minister Kaya, Shiina Etsusaburo is a man of compromised loyalties, but none can say he did not serve Japan well. However, his ties to the infamous Kishi Nobusuke and the "Reform Bureaucrat" clique have cast doubts over his nomination to the premiership, doubts that Shiina has declared to dispel with his actions.\n"
 RA_GLOBAL_NEWS.33.a:0 "Strong-willed and experienced, just what Japan needs."
 RA_GLOBAL_NEWS.33.b:0 "Looks like they couldn't get rid of the old."
 RA_GLOBAL_NEWS.34.t:0 "The Legion State Of All-Russia Proclaims Unification"
 RA_GLOBAL_NEWS.34.d:0 "Shocking news from Russia! After a brutal campaign of reunification, the Krasnoyarsk-based Legion State has established itself as the sole legitimate government of Russia! \n\nA military regime through and through, the Legion government has relentlessly pursued militarization of society; creating a nation where the needs of the military and the soldier are served first and foremost. \n\nIn a public address to the Russian nation today, General-President Alexey Pesterev has declared an end to chaos and weak governance and furthermore has openly declared his intent to reclaim the whole of Russia and march troops into German and Japanese held territories. The reaction from Berlin and Tokyo has been predictably hostile, and most foreign observers predict war is inevitable."
 RA_GLOBAL_NEWS.34.a:0 "Through Strength And Strength Alone"
 RA_GLOBAL_NEWS.35.t:0 "Establishment of The Russian Confederation"
 RA_GLOBAL_NEWS.35.d:0 "A massive shift in Russian politics happened today. \n\nPresident [RUS.GetLeader] has announced the unification of Russia and the formal establishment of the Russian Confederation, as the sole legal Russian government. \n\nUnder Nikolai Andreev’s leadership, the once upstart Krasnoyarsk government has manged to overcome a multitude of enemies and has spread its unique form of governance all across Russia. Even with this pronouncement, efforts to reclaim the whole of Russia show no signs of stopping. Conflict between the new Russian state and the world powers of Germany and Japan seems inevitable. For now however, the Russian people can celebrate a new dawn for their nation."
 RA_GLOBAL_NEWS.35.a:0 "How Novel!"
 RA_GLOBAL_NEWS.36.t:0 "A New Soviet Union"
 RA_GLOBAL_NEWS.36.d:0 "With the end of all rival governments, General Secretary Lev Sedov has announced the reestablishment of the Soviet Union, now named the Union of Soviet Republics in Europe and Asia. \n\nThe son of the infamous Leon Trotsky, Sedov seems intent on fulfilling his father’s vision of a global revolution. \n\nThe turnaround for the Trotskyite Bolsheviks has been a surprising one. Purged and blocked from any sort of power, the remains of the Left Opposition gathered in Krasnoyarsk after the fall of Nikolai Bukharin. Previously supporters of Nikolai Andreev’s regime, they turned on their former ally and established a communist government in a coup. Now with their hold consolidated it is clear war with Germany and Japan is only a matter of time."
 RA_GLOBAL_NEWS.36.a:0 "Revolution Once More"
 RA_GLOBAL_NEWS.37.t:0 "Krasnoyarsk Unites Central Siberia"
 RA_GLOBAL_NEWS.37.d:0 "An interesting development coming from the former Soviet Union, a military clique based out of the Russian city of Krasnoyarsk has managed to establish control over a portion of Siberia and have proclaimed themselves the rightful government of Russia. \n\nUnofficially referred to as the Republic of Siberia, this upstart state is ruled by a military appointed president but simultaneously holds competitive and regular elections. This so called “Military Led Demcoracy” is the brainchild of the Republics founder and current President, General Andreev. \n\nThe President seems to believe his government should be a model for other nations across the globe, though for now it seems his peculiar brand of governance will remain contained to Siberia."
 RA_GLOBAL_NEWS.37.a:0 "Military... Democracy?"
 RA_GLOBAL_NEWS.38.t:0 "Yugra Unifies West Siberia!"
 RA_GLOBAL_NEWS.38.d:0 "Against all odds, the Thieves in Law of Yugra have descended from their territories in the frigid north of Russia to take the entire region of West Siberia. Though outnumbered from the start, the thieves fought, tricked, and bribed their way from prisoners to rulers. So far, we know little about the peculiar state and its future. \n\nHowever, today the "Great Pakhan" of the newly declared "West Siberian Thief Territory," a Georgian by the name of Jaba Ioseliani has announced that the Thieves ultimately hope to reunify all of Russia and become its protectors and saviors. Already, they have begun to open their borders to trade. It seems they are hoping to make a great deal of money in their new positions."
 RA_GLOBAL_NEWS.38.a:0 "Where is the police?"
 RA_GLOBAL_NEWS.39.t:0 "The Criminal State"
 RA_GLOBAL_NEWS.39.d:0 "Unexpected news has come from Russia today, as the embattled, continent-stretching land finally turns a new page in its scarred history. Apparently, a government consisting entirely of Russian mafia bosses has taken control of the nation in a decade-spanning bid to unify Russia despite the harsh odds they faced, allegedly beginning their struggle as mere escapees from the frigid gulags of Vorkuta, its prisoners left to rot in the aftermath of the Soviet Union's fall. \n\nUnder the Georgian ex-convict Jaba Ioseliani, the new Russian state, calling itself the "Thief Territory," will run a country in a way never before seen on Earth: a state for and by the people, but especially those that are criminals. Only time will tell what sort of place Russia will become, and what this rather surprising. unique, and quite honestly concerning turn of events means for the rest of the world."
 RA_GLOBAL_NEWS.39.a:0 "From scum to the saviours of Russia"
 RA_GLOBAL_NEWS.40.t:0 "The Rise of the EdRo Corporation"
 RA_GLOBAL_NEWS.40.d:0 "Incredible news has arrived from Russia today. After 30 years following their defeat against the Third Reich, the Russians stand united once more. Of all the petty warlords that dotted the vast territory of Siberia, the ex bandit and now the de facto leader of Russia, a Kurdish by the name of Aslan Usoyan, has announced the subjugation of all rivals to his state. \n\nThe most peculiar detail of the new overlord of Russia is his form of government. Having couped his former rival, Jaba Ioseliani, Usoyan has transformed the once anarchic Thief Territory into an immense corporation controlling the majority of the products sold in the new Russia, while offering cheap labor and loose regulations. Companies and directors around the world are celebrating the new state."
 RA_GLOBAL_NEWS.40.a:0 "It's a good day to be a capitalist"
 RA_GLOBAL_NEWS.41.t:0 "A Nation United by God"
 RA_GLOBAL_NEWS.41.d:0 "Everyone knew that Russia would rise again, even if they didn't say it out loud. It was only a matter of time before the nation rose again from the ashes to make the world tremble once more. But of all the possible contenders to reunite the country, this one was the least expected.\n\nThe inevitable has happed: Russia now stands as a united nation, only the people ruling it were different. The Orthodox Church now rules Russia for the first time in its history, with its Patriarch Kirill I as its head. Russia is now the first of its kind in the modern world. A state guided by God, the words and principles of the Bible now run the Russian machine, with its citizens loyal servants of the Church, religious minorities forced to convert, and political opposition and secularism a thing of the past. But whatever its ideology, it is now clear that the Russian bear has finally awakened from its long slumber, and the whole world will now see the true wrath and power of God as the bear's attention turns to the West.\n"
 RA_GLOBAL_NEWS.41.a:0 "God Bless Us All"
 RA_GLOBAL_NEWS.42.t:0 "A Free and Holy Russia"
 RA_GLOBAL_NEWS.42.d:0 "The Russian Orthodox Church had never held a position of power before. Its existence was dedicated to serving the Tsar until the Communists attempted to destroy it. Nobody anticipated their ascent to power during the nation's darkest hour, yet now Eurasia quakes as they have emerged.\n\nFor the first time in 30 years, Russia stands united, now under the rule of Pimen I, the Patriarch of the Russian Orthodox Church, who has introduced a new kind of democracy unseen across the world. A democracy guided by the wisdom of God, with all political parties, from the left to the right, supporting Christian theology. Already, new elections are have been slated next year, with former secular politicians joining ranks and running for the country's newly formed parliament and prime minister posts. Such a system has gained a few followers back home, though it is only limited. And with the Patriarch having announced plans to reclaim forner Russian land, it is obvious now to all, that the world has entered a new age, and it will never be the same again.\n"
 RA_GLOBAL_NEWS.42.a:0 "Freedom under God!"
 RA_GLOBAL_NEWS.43.t:0 "A Kingdom of Christ on Earth"
 RA_GLOBAL_NEWS.43.d:0 "Shocking news has emerged from Russia, news that was anticipated but has nevertheless stunned most of the world. The Russian Anarchy has ended, and a new, terrifying force has reunited the nation.\n\nHaving began as a small warlord state in Western Russia, the Kingdom Of Christ has reunified the nation under the absolute rule of the Russian Othodox Church and its Patriarch, Peter II. This new Russia is a militaristic, totalitarian state run by religious zealots and fanatics with state oppression towards religious minorities committed in the name of God. The state has declared open hostility to all three of the world's superpowers, with announced plans to deal with the "Satanic" Germans first and reclaim Moscow and the rest of the eastern Reichskommisariats. One thing is for certain: the whole world now fears the Russian beast, and second by second, the clock ticks closer to Armageddon.\n"
 RA_GLOBAL_NEWS.43.a:0 "Hail the Lord!"
 RA_GLOBAL_NEWS.43.b:0 "And behold, a pale horse..."
 RA_GLOBAL_NEWS.44.t:0 "Orthodoxy in Latin America"
 RA_GLOBAL_NEWS.44.d:0 "In the hills and ravines of Mexico, people go to their local church every Sunday to get themselves closer to God, and to find solace in their lives. It is a generational practice that most Mexicans have been doing for all their lives, but recently, a new form of the Christian cross is becoming well known amongst the population. Both in the cities and the villages all across the nation, an burgeoning Orthodox community is rising across all social classes. Where the Catholic Church has long been seen as a corrupt, reactionary instrument of PRI rule, the Orthodox priests there, coming from the Russian Anarchy, have helped out ordinary citizens and done charitable acts for the needy members of society, which has resulted in the increasing popularity of the church. In response to such events, the Catholic Church has undergone their own social program to boost popularity amongst the Mexican public, yet the Orthodox Church is set to become a new religious force in the nation, with 5% of the population expected to become Orthodox Christians by the end of this decade."
 RA_GLOBAL_NEWS.44.a:0 "Saint Peter in Mexico City? How preposterous!!"
 RA_GLOBAL_NEWS.45.t:0 "Chaos in Croatia!"
 RA_GLOBAL_NEWS.45.d:0 "With the sudden vanishing of King Tomislav, the government of Croatia was thrown into turmoil. Despite Italian backing, the government has been overthrown by the resurgent Ustaše who have seized control of most of the Croatian heartland. \n\nOn the other hand, the socialist partisans led by Josip Broz Tito have risen up in Bosnia and conflict has already broken out between the two old enemies. \n\nThe Italian government appears to have opted to allow the two sides to fight and wear each other down. No doubt that they will return to their erstwhile sphereling sooner rather than later."
 RA_GLOBAL_NEWS.45.a:0 "War In The Balkans Again?"
 RA_GLOBAL_NEWS.46.t:0 "Croatia Holds Together"
 RA_GLOBAL_NEWS.46.d:0 "With the disappearance of King Tomislav, the Croatian government quickly began losing control of the country, with both the Ustaše and Communist Partisans aiming to subvert and destroy the Italian supported government. \n\nHowever, against the odds, the government has managed to survive and contain the situation. The government is now moving to address remaining resistance as well as solve the issue of the empty throne. Is this a new age for the beleaguered Kingdom of Croatia?"
 RA_GLOBAL_NEWS.46.a:0 "Well That's One Less Crisis"
 RA_GLOBAL_NEWS.47.t:0 "The Ustaše In Control"
 RA_GLOBAL_NEWS.47.d:0 "Despite the efforts of invading Italian forces, the Independent State of Croatia has managed to repulse all foreign forces from its territory and a ceasefire has been signed between the warring parties. \n\nHaving overcome all its enemies, the Ustaše now stands as the supreme power in Croatia and the nation is now poised to align itself with Germany and potentially expand into neighboring nations. \n\nNo doubt, there will be more bloodshed in the Balkans."
 RA_GLOBAL_NEWS.47.a:0 "When Will It End?"
 RA_GLOBAL_NEWS.48.t:0 "Yugoslavia Lives"
 RA_GLOBAL_NEWS.48.d:0 "Twenty years of partisan war have ended in victory for Tito and his Partisans. Italy has totally failed to destroy the newly reformed Yugoslavia and has been forced to sign a ceasefire with the independent nation of Yugoslavia. \n\nNo doubt that Tito has intentions to retake former Yugoslav territories and restore the former borders of the once sundered nation. \n\nWith political challengers from within his party already rearing their heads and some territories in the hands of the German Reich and Italy, it remains to be seen if he can complete his ambitions. For now, the Yugoslavs can rest knowing their nation has returned to them once more."
 RA_GLOBAL_NEWS.48.a:0 "Death To Fascism, Long Live Freedom!"
 RA_GLOBAL_NEWS.49.t:0 "Balkan Troubles"
 RA_GLOBAL_NEWS.49.d:0 "With the collapse of the German Reich into civil strife and the Italo-Turkish War distracting the two Mediterranean powers, the Balkans have once again fallen into disarray as nations challenge each other for control over their neighbors' territories.\n\nAlready border skirmishes have begun over territories with overlapping claims as the Balkan nations challenge each other for dominance over the troubled peninsula.\n\nAnalysts predict a long-term period of instability in the region, and some express concern that full-scale war will break out in the near future."
 RA_GLOBAL_NEWS.49.a:0 "This Is News?"
 RA_GLOBAL_NEWS.50.t:0 "Quiet Returns to the Balkans"
 RA_GLOBAL_NEWS.50.d:0 "Following multiple wars, a new status quo has settled in the Balkans. The borders slowly demilitarize as the defeated nations pull back their remaining forces and the victors bask in their triumph.\n\nThe wars have also reshuffled the Italian and German spheres of control in the region. No doubt this is not the end of the rivalry between the two superpowers, and their struggle will continue elsewhere. For now, however, a calm has settled over the Balkans.\n\nOne paid for in blood but a calm nonetheless."
 RA_GLOBAL_NEWS.50.a:0 "For Now"
 RA_GLOBAL_NEWS.51.t:0 "Elections In Germany"
 RA_GLOBAL_NEWS.51.d:0 "With the rise of the German Gang of Four, many expected the NSDAP to be weakened or eliminated entirely by the new regime. But something else has happened entirely. Not only has the NSDAP survived an official ban, but it has managed to win a majority in the first German multi-party election in over fourty years. \n\nHelmutt Goebbels, the son of Adolf Hitler's most trusted official, has managed to put a new face on the Nazi Party and steer it towards the new electoral reality in Germany. Goebbels has outlined an abitous plan to expand the German economy and military as well as outlining solid funding for social programs. International observers fully expect him to focus on the needs of the German population first and foremost."
 RA_GLOBAL_NEWS.51.a:0 "More Of The Same?"
 RA_GLOBAL_NEWS.52.t:0 "Goebbels Wins Again"
 RA_GLOBAL_NEWS.52.d:0 "Success has once again reached the NSDAP as Fuhrer Goebbels has once again led his party to victory for a second time in the German polls. \n\nBolstered by this success, Goebbels has promised further pursuit of Nazi policy and has further declared an acceleration towards what Goebbels describes as the "Springtime Revolution." \n\nRumors of the NSDAP reconsolidating power in German politics have been swirling in light of this victory and some suspect that Germany's flirtation with democracy will soon come to an abrupt end."
 RA_GLOBAL_NEWS.52.a:0 "Yes Definitely More Of The Same"
 RA_GLOBAL_NEWS.53.t:0 "Elections In Germany"
 RA_GLOBAL_NEWS.53.d:0 "Following the rise of the Gang of Four and the resignation of Albert Speer, the world has watched in keen interest to see who would manage to take the reins of the flailing German Reich. That question has now been answered as Joseph Alois Ratzinger has become the first democratically elected Fuhrer of the German Reich. A member of the Volksunionpartei, Ratzinger is a staunch Catholic and has promised a return to the morals and traditions that the Nazi party has trodden upon. \n\nRatzinger has also promised further democratization, equality for non-Germans, and staunch support for the German working class. Ratzinger faces a long uphill climb but Ratzinger has shown no signs of backing down from the challenge."
 RA_GLOBAL_NEWS.53.a:0 "He'll Need All The Luck He Can Get"
 RA_GLOBAL_NEWS.54.t:0 "Ratzinger Does It Again"
 RA_GLOBAL_NEWS.54.d:0 "Fuhrer Ratzinger has managed to repeat his success four years ago and the VUP has retained its majority in the German Reichstag. \n\nWith this new mandate, Ratzinger has promised to redouble his efforts and ensure the German Reich is once again a free and Godly nation once more. VUP supporters have been celebrating in the streets at this marvelous success and there can be little doubt now that the once unknown Joseph Ratzinger has made his mark on Germany."
 RA_GLOBAL_NEWS.54.a:0 "Let's See How Far He Goes"
 RA_GLOBAL_NEWS.55.t:0 "Elections In Germany"
 RA_GLOBAL_NEWS.55.d:0 "In the ashes of Speer's resignation and the Gang of Four's attempts at democratization - elections have still managed to go forward. And yet the winner of these elections isn't any such democratic darling nor Nazi diehard, but a man defined by his stalwart and unemotional dedication to Germany. \n\nAlfred Dregger of the Reichsstaatspartei has managed to secure a majority in the Reichstag and has secured himself the office of Fuhrer. Made up of moderate nationalists and some liberals, Dregger has announced his intentions to restore Germany to undisputed greatness and make sure that enemies and allies alike know what it means to cross the Reich."
 RA_GLOBAL_NEWS.55.a:0 "A National Pragmatist?"
 RA_GLOBAL_NEWS.56.t:0 "Triumph For Dregger"
 RA_GLOBAL_NEWS.56.d:0 "Fuhrer Dregger has managed to scrape out another win for the RSP and has secured another five years as the Fuhrer of Germany. \n\nBuoyed by his second electoral victory, Dregger has reaffirmed his ambitions to solidify Germany as hegemon of the world and has made it clear that Germany is ready to confront the growing [RUS.GetAdjective] threat. No doubt with Dregger in the captain's seat there will be confrontation on the horizon."
 RA_GLOBAL_NEWS.56.a:0 "A Place In The Sun"
 RA_GLOBAL_NEWS.57.t:0 "Elections In Germany"
 RA_GLOBAL_NEWS.57.d:0 "With the Gang of Four's soft coup, promises of a return to democratic elections began to flow out of the Reichstag. While circumstance and political necessity have resulted in Germany transforming into a strange hybrid of dictatorship and democracy, nonetheless some still strive ever forward towards liberalization. \n\nOne of these men is Gunter Grass. A writer by trade, he has become the face of the VAAF, the self styled party of the working class. Some have remarked the party positively smells of the social democrats - but the party denies they are socialist at all - in fear of scaring off more moderate German voters. And yet the party has managed to secure a majority and Grass has become the first democratically elected Fuhrer in German history. Grass has promised sweeping reforms of the government and economy. Whether he can overcome opposition from the other parties is another matter entirely."
 RA_GLOBAL_NEWS.57.a:0 "Can He Do It?"
 RA_GLOBAL_NEWS.58.t:0 "Another Win For Grass"
 RA_GLOBAL_NEWS.58.d:0 "Breaking news from Germania today as the German elections of [GetYear] have resulted in the preservation of the VAAF's majority in the Reichstag and the continuance of Gunter Grass' tenure as Fuhrer of Germany. \n\nGrass has promised a continuation of governmental reform and has declared that full democratization of the German Reich is in sight. VAAF supporters have celebrated their victory and it looks like Fuhrer Grass is here to stay."
 RA_GLOBAL_NEWS.58.a:0 "Maybe He Can Do It"
 RA_GLOBAL_NEWS.59.t:0 "Wolf's Hour"
 RA_GLOBAL_NEWS.59.d:0 "The assassination of Gunter Grass on the eve of elections has sent shockwaves through the German Reich. \n\nNonetheless the VAAF has managed to once again retain a majority in the Reichstag. Replacing Grass has been Markus Wolf, the former Interior Minister. \n\nWolf has promised a full investigation into the death of Grass but has so far not spoken of his political agenda. But given his cabinet selection, drawing largely from the radical wing of the VAAF, it may appear that Germany is headed towards troubled days."
 RA_GLOBAL_NEWS.59.a:0 "What Is He Planning?"
 RA_GLOBAL_NEWS.60.t:0 "Die Grunen Rises"
 RA_GLOBAL_NEWS.60.d:0 "Interesting developments in Germany have arisen with the nation's second election in recent memory. \n\nWith problems plaguing the RSP, much of the liberal constituencies of the former have defected to Die Grunen, a minor party in the Reichstag focused on ecological concerns. \n\nSurprisingly, Die Grunen has managed to not only do well this election but it has managed to secure a majority in a surprise upset. Strangely the leader of Die Grunen, Baldur Springmann, has so far been totally silent and has not given any speeches. A strange decision for a man at the peak of his political career."
 RA_GLOBAL_NEWS.60.a:0 "Odd..."
 RA_GLOBAL_NEWS.61.t:0 "The Fuhrer Resigns!"
 RA_GLOBAL_NEWS.61.d:0 "With the German loss against the [RUS.GetName], strong internal pressure has been building against the now former Fuhrer of Germany. \n\nWith this resignation, the position of Fuhrer has been secured by Theodore Oberlander, a long time member of the NSDAP. Historically more a conservative, Oberlander has nonetheless formed an alliance with his party's technocratic wing and former supporters of Albert Speer to consolidate his rule. \n\nOberlander has announced his ambition is to recover from defeat and ensure nothing like it ever occurs again."
 RA_GLOBAL_NEWS.61.a:0 "A Step Back?"
 RA_GLOBAL_NEWS.62.t:0 "Military Coup In Germany!"
 RA_GLOBAL_NEWS.62.d:0 "The crushing defeat of the German Reich by the vengeful [RUS.GetAdjective]s has resulted in utter turmoil in Germany. \n\nThe German military, fed up with ineffectual civilian leadership, has decided to take matters into its own hands and has marched troops on the Reichstag and arrested the sitting government. \n\nField Marshal [GER.GetLeader], the leading officer of the Heer, or German Army, has announced a transitional period of undisclosed length along with declaring martial law. It appears the end of Germany's democratic experiment has come."
 RA_GLOBAL_NEWS.62.a:0 "Shocking!"
 RA_GLOBAL_NEWS.63.t:0 "Germany In Chaos"
 RA_GLOBAL_NEWS.63.d:0 "The end of the war with Russia has not returned peace to the nation. \n\nBaldur Springmann's insane agenda has led to its natural conclusion: the DAP, led by Manfred Roeder, has betrayed their former political allies and has seized total control of Germania. Promising a "return to Aryan purity", Roeder's impromptu rise to power is already facing its first major challenge. The LER, representing minority populations in the Reich proper, has seen the writing on the wall and has decided to rise up in force. Denouncing Roeder's coup, they have declared a war for independence in Poland, Czechia, and Luxembourg and their forces have already seized large swathes of territory. With the German military, government, and economy in total disarray it appears they may yet succeed in achieving their dreams thought lost long ago."
 RA_GLOBAL_NEWS.63.a:0 "Reap What You Sow"
 RA_GLOBAL_NEWS.64.t:0 "Rise Of Roeder"
 RA_GLOBAL_NEWS.64.d:0 "With the defeat of the LER, Manfred Roeder has declared himself permanent Fuhrer of Germany and declared the abolition of what he calls "the degenerate democracy". \n\nThe DAP has espoused the total purification of Germany and the expulsion of all non-Germans within its borders. With Germany proper devastated and much of the colonial territories lost to a resurgent [RUS.GetAdjective] nation, one wonders if Roeder's priorities are completely backwards. Needless to say, there are clouds over Germany."
 RA_GLOBAL_NEWS.64.a:0 "It Just Gets Worse"
 RA_GLOBAL_NEWS.65.t:0 "Dissolution Of Germany"
 RA_GLOBAL_NEWS.65.d:0 "With the embarrassing defeat of Germany at the hands of the [RUS.GetName], and Springmann's overthrow - the once mighty German Reich has been thrown into absolute anarchy. \n\nThe remains of Roeder's regime are left powerless to prevent the secession of multiple territories from its grasp and the independence of multiple nations once thought lost. \n\nMeanwhile, in Poland and elsewhere there is an air of jubilation as the liberation many had not dared dream of has come at last. The LER has begun to transition to an international defence pact as Wojciech Jaruzelski proclaims a new era of freedom in Europe. \n\nIn what remains of Germany, there is eerie silence. No one doubts Roeder's end is near, but what comes next? Nobody knows."
 RA_GLOBAL_NEWS.65.a:0 "The Death Of Tragedy"
 RA_GLOBAL_NEWS.66.t:0 "Springmann's Creed"
 RA_GLOBAL_NEWS.66.d:0 "Strange happenings in Germany continue to occur and indeed have only intensified in recent days after Baldur Springmann's successful defence of the German Reich against [RUS.GetAdjective] invasion. \n\nEmboldened by the German triumph, Springmann has announced an acceleration of his eco-nazi agenda and has declared a suspension of German elections in violation of the nation's constitution. And yet with Die Grunen's grip on Germany seemingly unbreakable, it appears Springmann will have his way yet."
 RA_GLOBAL_NEWS.66.a:0 "Treehugging Has Gone Too Far"
 RA_GLOBAL_NEWS.67.t:0 "Formation Of The KdN"
 RA_GLOBAL_NEWS.67.d:0 "The Koalition der Nationen was the pet project of the Gang of Four - an international organization where all nations could settle their disputes in a manner more or less peaceful. \n\nDoubts arose when the new government rose to power but it seems [GER.GetLeader] has decided to continue the Koalition project. The German government has begun making diplomatic overtures to other nations, but progress is still ongoing. Yet some still ask, even if the Koalition gets off the ground, will it be able to stop another World War? \n\nOr will it fail like the League of Nations?"
 RA_GLOBAL_NEWS.67.a:0 "A Chance At Peace?"
 RA_GLOBAL_NEWS.68.t:0 "Otto von Hapsburg Crowned Emperor of Germany"
 RA_GLOBAL_NEWS.68.d:0 "With the victory of the German Reich over the [RUS.GetName], many international observers expected Fuhrer Ratzinger would use this opportunity to consolidate his democratic reforms and make a final push towards full democratization. \n\nThese observers were half correct. In a move not surprising to more careful followers of German politics, the VUP dominated Reichstag has passed a law reinstituting the German monarchy not to the Hohenzollerns, but the Hapsburg line, as the pretenders to the crown of the abolished Holy Roman Empire. The head of the Hapsburg House, Otto von Hapsburg, who has been living in Germany since the resumption of elections, has accepted the declaration with due humility, and has finally taken the crown he was cheated from so long ago. Rumours swirl around the circumstances and how long this was planned, but none can deny that Fuhrer Ratzinger has won this day and changed Germany forever."
 RA_GLOBAL_NEWS.68.a:0 "The Empire Renewed"
 RA_GLOBAL_NEWS.69.t:0 "The Scrounging Of Africa"
 RA_GLOBAL_NEWS.69.d:0 "With the collapse of Grossafrika, much of the dark continent has been thrown into total disarray as warlords crop up and grab whatever territory they can. \n\nThe nations of the world approached the situation hesitantly, until Italian troops crossed from that nation's East Africa colony and have seized parts of former German Ostafrika. With Rome making it clear it intends to establish a military presence in the region, the German, American, and Japanese governments have now begun to take a deeper interest in the region and have begun to establish relations with several warlords. \n\nIt appears even after the South African War, the continent is still another battlefield between the rival superpowers of the world."
 RA_GLOBAL_NEWS.69.a:0 "Is It The 19th Century Or The 20th?"
 RA_GLOBAL_NEWS.70.t:0 "Civil War Erupts in Vietnam"
 RA_GLOBAL_NEWS.70.d:0 "The Empire of Vietnam, a subject nation of Japan in all but name, has been plagued by socialist guerillas since the very beginning of Japanese occupation. However, in recent months this hit and run conflict has escalated into open war for control of the nation.\n\nThe guerillas, named the Viet Minh, have managed to seize the Mekong Delta and Saigon from the Vietnamese government and have declared the Republic of Vietnam with American backing. Tokyo has dispatched troops to support the beleaguered Vietnamese government and protect its colonial interests in the country. \n\nIt appears the Hawaii missile crisis has not deterred the Americans at all, and yet another front has been opened between the two Pacific rivals as the world watches on in interest."
 RA_GLOBAL_NEWS.70.a:0 "Indochina In Flames"
 RA_GLOBAL_NEWS.71.t:0 "The Viet Minh Seize The South!"
 RA_GLOBAL_NEWS.71.d:0 "The Viet Minh have successfully managed to seize control of Southern Vietnam, wresting it away from Co-Prosperity Sphere control. In response, the Japanese Army has taken direct control of the remaining Vietnamese territory and has set up its headquarters in Hanoi. \n\nFor now the conflict remains frozen, but it is almost certain that the newly consolidated Republic of Vietnam will be causing trouble for the Japanese in Indochina for the next several years. Will they soon be crushed by the expanding Japanese garrison and Vietnam left forever under the Japanese boot? \n\nOr will Ho Chi Minh succeed at last and free all of Indochina from foreign domination in perpetuity?"
 RA_GLOBAL_NEWS.71.a:0 "What A Development!"
 RA_GLOBAL_NEWS.72.t:0 "The Empire of Vietnam Crushes the Viet Minh"
 RA_GLOBAL_NEWS.72.d:0 "With Japanese backing - the Empire of Vietnam has beaten back the Viet Minh and crushed them once and for all. \n\nEmperor Bao Dai has declared a day of celebration and the Vietnamese Army has held a victory parade in the nation's capital of Hue. The Japanese forces sent no doubt will have much to celebrate as well, as the job of eliminating the remaining partisans in Vietnam falls to local forces. The fate of Ho Chi Minh remains unclear as of now.\n\nQuestions remain, however, as Dai has still not appointed a replacement for his assassinated Prime Minister. Many speculate the Emperor will either appoint Ngo Dinh Diem, his strongman foreign minister, or Nguyen Ton Hoan, leader of the Nationalist Party of Greater Vietnam and a staunch proponent of democratization of the country."
 RA_GLOBAL_NEWS.72.a:0 "A Victory For Imperialism?"
 RA_GLOBAL_NEWS.73.t:0 "Ngo Dinh Diem Appointed Prime Minister of Vietnam"
 RA_GLOBAL_NEWS.73.d:0 "With the defeat of the Viet Minh and the victory of the Vietnamese government, attention has turned to the monarch Bao Dai and his refusal to appoint a new Prime Minister after the previous, Phan Huy Quat, was assassinated by socialist guerillas. \n\nNow, however, the wait is over as Dai has appointed Ngo Dinh Diem as Prime Minister of Vietnam. Formerly the Foreign Minister under Quat, Diem is well connected with both the military and aristocracy and is in many ways the natural choice for Prime Minister. A staunch nationalist and Catholic, it is however possible he may indeed estrange the overwhelmingly Buddhist population. \n\nDiem himself has promised to annihilate all remnants of socialism in the country and has further asserted that his appointment is the beginning of Vietnamese ascendancy in Indochina. Rumors that the governments of Laos and Kampuchea have already filed complaints to Japan about Diem's speech are swirling. It seems Japan's wish for a stable Indochina may not entirely come true yet."
 RA_GLOBAL_NEWS.73.a:0 "He Knows He's Leading A Puppet Government, Right?"
 RA_GLOBAL_NEWS.74.t:0 "Nguyen Ton Hoan Appointed Prime Minister of Vietnam"
 RA_GLOBAL_NEWS.74.d:0 "With the defeat of the Viet Minh and the victory of the Vietnamese government, attention has turned to the monarch Bao Dai and his refusal to appoint a new Prime Minister after the previous, Phan Huy Quat, was assassinated by socialist guerillas. \n\nAnd finally, today Bao Dai has publicly appointed Nguyen Ton Hoan as Prime Minister of Vietnam. A proponent of civil rule and free elections, Hoan is no less dedicated to his country than any other nationalists. His drive for anti-corruption measures on the other hand may rankle feathers with the local elite, and the Japanese as well. Further still, Nguyen has announced his intention to deepen cooperation between the Indochinese nations."
 RA_GLOBAL_NEWS.74.a:0 "I Wonder What The Japanese Will Think"