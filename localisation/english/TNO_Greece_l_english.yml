 #Leader descriptions
 POLITICS_SOTIRIOS_DESC:0 "The most suprising thing about Sotirios Gotzamanis, current Prime Minister of the Greek State, is his continued existence on this Earth. After suffering from a stroke in 1958, the poor Prime Minister never fully recovered - and yet, despite his poor health, he has never been replaced since then. This fact speaks volumes about the current state of the Greek nation - the collaborator government set up by the Axis powers after WWII has so far survived only thanks to the guns of the Regia Marina. However, the internal instability is so severe, with partisan and insurgent groups running wild in the mountains and valleys of Greece and the urban population more and more discontent, that removing the only man who managed to bring a semblance of stability to Greece is surely a recipe for chaos.\n\nFormerly a physician who studied in Italy, Gotzamanis engaged in a successful political career in the collaborationist government, finally ending up as Greece's Prime Minister in the mid 50s, after the nation was devastated by the creation of Atlantropa. Since then, Gotzamanis has pleased his Italian overlords by managing to appease the Greeks enough not to drive them into open revolt, but the collaborator government is still hated by the people, unemployment and economic crisis are still rampant, and partisan warfare has never truly stopped. What's worse, is that the litigious and self-serving collaborator politicians have not yet drawn up a succession plan for Gotzamanis.\n\nEveryone in Greece can see the writing on the wall, and the recent calming down of partisan and insurgent activity is simply the quiet before the storm that will break out once the Grim Reaper settles his score with Gotzamanis."

 #Events
 

 #Events
 gre.1.t:0 "The Tragedy of Greece"
 gre.1.d:0 "Throughout the 20th century, Greece has repeatedly suffered at the hands of her neighbors. With the death of the Ottoman Empire, it appeared that the dream of a Greek nation which included all Greeks had finally been achieved, it was not to be. Humiliated by the Turk, Greece stumbled through the next decades, unable to accept that she had failed after coming so close. Hopes of recovery proved false, as the Italian jackboot trampled down from Albania, once again Greece found itself under foreign rule. \n\nThe next decade was one of many great tragedies. Atlantropa destroyed the coasts of Greece, fascist mismanagement caused a famine unlike anything seen in nearly a decade, and the new Greek government teetered on the very edge of collapse. As the various terrorist groups of Greece prepared to strike, a last minute decision was made by the Triumvirate powers; a multinational task force was sent in to keep the peace. \n\nIt has been this garrison which has kept the regime of Sotirios Gotzamanis in power, and for the first time in decades Greece remains in relative peace. Despite this, danger lurks on the horizon. Various terrorist groups such as the communist NLF, democratic NDGL, and the nationalistic PHLF circle like vultures, waiting for the ideal time to strike. Sotirios, long Italy's man in Greece, has never recovered from the stroke he had 4 years ago. And most worryingly, the Triumvirate is seemingly on the verge of collapse, and with it the garrison. \n\nInteresting times lay ahead for Greece."
 gre.1.a:0 "We Shall Remain Strong"
 
 gre.2.t:0 "Seperate Ways"
 gre.2.d:0 "When the Italian Empire called for a meeting of the entire Triumvirate, the reaction among Hellas's ministers and lawmakers was... mixed to say the least. Some held onto some hope that Ciano's diplomacy could salvage the rapidly deteriorating alliance, but others felt it was a futile gesture. \n\nBut no one expected the utter disaster that followed. The bombing of the Malta Conference and the following collapse of relationships between the three powers who made up the Triumvirate's powerbase- and incidentally, the ones who provide the garrisons that support our army against partisan groups in the nation's interior- has completely ended the alliance. \n\nAs bad as this may be for the Italians on whom we rely, the reality of the Triumvirate's dissolution has thrown most of the EEE's members into a panic. More than any nation, Hellas relies on the Triumvirate for her day-to-day functioning, and the fate of the city Garrisons are suddenly thrown into question. \n\nWe will need to wait and see what exactly this all means, but the future does not look good for the Nation."
 gre.2.a:0 "Our Fate is not in Our Hands"
 
 gre.3.t:0 "Iberian And Turkish Garrisons Are Withdrawn"
 gre.3.d:0 "\"I had thought we agreed to a phased withdrawal...\" \n\nIt didn't go unnoticed by Georgios that of the four men in the room, actively deciding the immediate fate of Hellas, only one was a Hellene. The other three were an Italian, a Spaniard, and a Turk- High Commissioner Luigi Mascherpa, Manuel Ruiz, and Cemal Gursel-, as the three leaders of the Italian, Iberian, and Turkish garrisons in Hellas, and they held all the cards. \n\n\"The situation has changed.\" Ruiz responded with no small degree of hostility. \"Without a Triumvirate, we are beholden to Madrid, and to Ankara, once more. We are going home, and we are going home now.\" \n\n\"Surely you understand that it is in all our interests that Turks leave for Turkish borders, and Iberians for Iberian borders.\" The calmer and more amicable Gursel added quickly. \"Not just for Turkey and Iberia, but for Hellas as well, yes?\" \n\nGeorgios and Luigi exchanged an uncertain glance from the other side of the desk. \"Yes... Of course we agree.\" The High Commissioner opened with a measured tone. \"But the issue is a matter of security. The nation's stability cannot handle an immediate departure of the entire garri-\" \n\n\"The entire garrison?\" Ruiz stepped forward, jostling the desk in his haste. \"I did not realize the Italians were leaving their subject state to the wolves.\" \n\nA worried side-eye from Georgios let Mascherpa know just how the words had landed on the Greek general. \"Of course not.\" He replied quickly. \"Italy stands by Hellas, but even a two-thirds immediate departure would-\" \n\n\"Italy will bear the burden, I'm sure.\" Ruiz said bluntly as he stepped back from the desk. \"Transports from Iberia will arrive within the week. We expect there will be available space in the harbors to move the entirety of the Iberian garrisons when they arrive.\" And the Spaniard spun on his heels and left before being dismissed. \n\nGursel's own ultimatum came with a smile and a light flourish. \"The Turkish garrisons will travel overland, to not overburden your harbors. We will be leaving within a week.\" \n\nAnd with them left the last, best hope for Hellas's safety and stability."
 gre.3.a:0 "How could this get any worse?"
 
 gre.4.t:0 "Rebels Rise In Open Revolt"
 gre.4.d:0 "The Battalions did not move with the confidence and arrogance with which they had grown accustomed to. Their patrols no longer goosestepped so far into the hills and mountains, and their trucks and convoys began to take longer routes between cities and forts. \n\nThe news didn't take long to spread. The Triumvirate that held up the fascistic house of cards in Athens has gone up in flames, and flags of Turkey and Iberia no longer wave in Athens and Thessaloniki. Save for their Italian masters, the EEE stands alone, against the nation they claimed to represent. \n\nThough there was no central leader to issue the command, no shadowy league to coordinate the movement, the opportunity that presented itself served to unite the myriad of partisans and rebels in spirit, if not in action. \n\nOne after the other, the rebels struck the iron while it was hot, while the Battalions and Italian garrison strain to fill the holes that the departing garrisons left. The less enthusiastic and more opportunistic collaborators begin to court the ascendant insurgents. \n\nFor most Hellenes, the question isn't if the regime is about to fall. The question is how long will they hold on? And what's in store for the nation once they do?"
 gre.4.a:0 "Bloody Days Ahead"
 gre_the_rebels_rise_tt:0 "§RResistance groups have begun openly attacking the Italian garrison and the Security Battalions§!"
 
 gre.5.t:0 "Sotirios Has A Stroke!"
 gre.5.d:0 "\"Come in, come in both of you. Now, tell me what could be so urgent that it couldn't wait for a pot of coffee?\" Sotirios Gotzamanis was in a good mood, even as he observed the nervous, jittering officers take their seats in front of his desk. \n\nOne of them, the younger of the two, produced a nondescript folder, and handed it over to the Prime Minister. Humming under his breath, he opened it, while the older of the two officers spoke up. \n\n\"Damage reports sir, from the recent surge of terrorist and rebel activity along our-\" \n\nHe was interrupted by the sputtering and stuttering from the Prime Minister. \"I was already briefed last night, I was told that the outbreaks of violence were minor...\" \n\n\"The situation's changed overnight, sir.\" One of them explained diplomatically. \"If you'll flip over to the fifth page, there's an assessment of the infrastructure damage and casualties that we've received since the spike in rebel attacks.\" \n\nAs his eyes looked over the paper, the lids narrowed, and his free hand went up to clutch at his head. \"Is that... Is... I need some...\" He muttered, standing as his legs seemed to tremble more desperately the straight he tried to stand. \"Some air...\" \n\nThe two officers rose from their own seats as well, arms extended to try to stop him, but it was already too late. As he tried to step out from behind his desk, the floor rose up to meet him, and in the darkness that followed, his head didn't pound quite so much."
 gre.5.a:0 "Disaster after Disaster!"
 
 gre.6.t:0 "Sotirios Dies In Italian Hospital"
 gre.6.d:0 "Sotirios Gotzamanis has not awoken since his stroke, and now, he will never wake again. After over a week of intensive care in a Padua hospital, the Prime Minister of the Hellenic State finally succumbed to the repeated damage from not only one, but two devastating strokes in less than ten years. \n\nThough the man did die on foreign soil instead of his native Hellas, it still took little time for the news to reach the leadership of the EEE. Already fear has taken hold in the regime that Gotzamanis left behind, and without a designated successor to the old linchpin of the State, uncertainty and confusion rule in his stead. \n\nWhile Hellas seems to come apart at the seams, and the EEE squabbles and argue amongst themselves about who should step into the void that's been created, the question still remains. Should the people be told? When should they be told? It isn't as if Sotirios showed himself to the public frequently since his first stroke. They could keep up the masquerade for a time, and it would help them keep a lid on the rapidly deteriorating situation, but sooner or later, the people would find out. \n\nHellas's fate hangs in the balance until these questions can be answered, but hope quickly dwindles from sight as deliberation crowds out the initiative and action that might save the State."
 gre.6.a:0 "God save Hellas"
 
 gre.7.t:0 "The Search"
 gre.7.d:0 "Miraculously, the EEE has managed to come together and scrape together something resembling a plan of action. The public still has no knowledge of Sotirios's demise, though many of the more aware are starting to notice an especially conspicuous lack of updates from the State as to his condition. \n\nAnd as long as they don't know, work can be done to ensure stability before they do know. The EEE has conceived of a plan to find a member of the party who can succeed Sotirios as the Prime Minister. Since the EEE is the only legal party in the state, confirming his succession should not be a difficult matter, provided a capable candidate who does not run afoul of any of the internal divisions in the Party can be found. \n\nWith time running out, the hunt is on to find this perfect successor. With more vigor and urgency than they've displayed in many years, the Hellenic Parliament goes about scouting and interviewing potential Prime Ministers to determine their allegiances, their rivalries, their connections, and their competency. With any luck, the proper heir shall be discovered quickly, and once they do, they can confirm him and confirm the death of Gotzamanis to the public, avoiding the destabilization of Hellas that would follow the news otherwise."
 gre.7.a:0 "Searching High and Low!"
 
 gre.8.t:0 "Eternal Discussion"
 gre.8.d:0 "When the fate of a Nation hangs in the balance, and the clock is ticking, panic is a natural replacement for initiative, and desperation is the heir of motivation. This could not be made more clear than how it is in Hellenic Government in the past weeks. \n\nWhat started as an enthusiastic and unified effort to find a suitable successor to Sotirios Gotzamanis as Prime Minister quickly spiraled out of control, and degraded into more of the usual political line-drawing and factional bickering. Even as large-scale rebellions across Hellas begin to seize more and more of the vital roadways, secure major metropolitan centers, and receive support in the form of civilian recruitment and military defection, the puppet government lay limp and completely inert. \n\nSeveral potentials have been identified among the suits of the Hellenic Parliament, but major movers and shakers within the Parliament could not agree on which of the potentials should be elevated. This man is an incompetent, but that one is in the pocket of the wrong MPs. He is a drooling idiot, but this is too radical to represent the party. The song and dance goes on, and it goes on. \n\nWhat's worse is that they were unable to select a new Prime Minister  before news of Gotzamanis's death was leaked to the public. With the deadline having effectively escaped them already, many of those spearheading the effort have settled into damage control mode, hampering selection efforts even further. \n\nIt has become clear that the EEE has no strong man to lead them, and how could a State ever survive without a strong hand to lead, to guide, and to secure it?"
 gre.8.a:0 "The Dance goes on"
 
 gre.9.t:0 "Abandoned"
 gre.9.d:0 "\"In summary, it pains me to say that not only is it unwise to try supporting the Athenian garrison any further, but anything short of a full military incursion would do anything but delay the inevitable. A full evacuation of all Italian garrison forces is recommended, and we just need to wait and see what becomes of Hellas after that.\" \n\nLuigi Mascherpa waited for a moment, nodded, and then gingerly set down the telephone. He stared at it for a moment, before looking out of the window in his office. He had just received authorization to pull out of Athens entirely. No longer High Commissioner of Hellas, he was simply an Admiral now. \n\nIt was strange to take in. In a way, he had grown attached to this little failure of a nation, maybe it was the kinship and common heritage the sons of Rome and Hellas shared, or maybe it was simply getting too used to living here. Either way, he didn't want to leave, he didn't want to abandon Hellas and her people to their fate. \n\nBut he need only look out to sea, towards the harbor, the new one built further down the Aegean Retreat, to be reminded of why the decision had to be made. Italian ships would soon be carrying Italian men back to their natural homeland. The nation which they were born into, to which they owed their allegiance, to which they were willing to bleed and die for, that's what awaited them, not this rebel-filled hole of shit and detritus. Why should one more Italian lose his life for the sake of a State that could not stand on her own two feet? \n\nHe couldn't shake the sadness that weighed on his heart, but he could forget it, as long as he kept his mind on home."
 gre.9.a:0 "Arrivederci, Grecia"
 gre.9.b:0 "The State Must Endure. Reenforce Athens!"
 
 gre.10.t:0 "Eleftheria I Thanathos"
 gre.10.d:0 "It was a long, hard road from Lamia to Athens, but it's a road that Sophia would walk again, and walk again, and walk again until her soles bled and her legs gave out from under her. And even then, she would just have to crawl. \n\nThe months of rebellion have been excruciating, she often wondered how the older veterans did it, they had lived in the hills and mountains for years before the Triumvirate Occupiers left Hellas, whereas she had only taken up the gun and the flag when the Revolution took Lamia. It was hardly a fight, the Security Battalion had fled in the dead of the night before, for they had seen the flags in the distance. \n\nThe Resistance carried many flags, all of them the Sky-White-Blue Crosses of the Hellenic people, but they had their differences as well. Some bore crowns, like the Kingdoms of old, while others bore fists rising up in revolt. For Sophia, the flag she personally carried bore the symbol a shattered fasces on it. \n\nAll roads ended here. The road for Sophia, the Revolution, but most importantly, the rotting carcass that passes for a Hellenic State. In honesty, she had expected to die, she had expected many of them to die in the face of an Italian Garrison, but no Italian flags flew that day. Even the puppeteers lost faith in their marionettes. \n\nLike a tidal wave of sheer valor and zeal, the Revolution poured into the streets, and before long, Sophia found herself standing atop the Hellenic Parliament, planting her flag in its roof. \n\nFor the first time since the War, the words \"Eleftheria i thanatos\", \"Freedom or Death\" were shouted from the Hellenic Parliament, and they meant something. Once more, they held power."
 gre.10.a:0 "Akoúste tin kravgí tou laoú!"
 
 gre.11.t:0 "Provisional Government Declared!"
 gre.11.d:0 "To look at the recent change in the state of being as a singular revolution might be a bit misguided. Certainly, revolution occured in Hellas, but it was far from a unified effort. Though the plain cross of EDES, the crowned cross of Organization X, and the standards of various defecting army units and Security Battalions marched side-by-side into Athens, their visions for the future of the nation clashed drastically. \n\nIt is perhaps a mercy that the bulk of all the revolutionary forces converged on the capital at once, so that none could claim legitimacy over their ideological rivals. The only thing that they agreed upon was that this was not a republican, a monarchist, or a militarist revolution, but a Hellenic one, and it would be there that common ground was found. \n\nOut from the Hellenic Parliament, once a bastion of cronyism and corruption, emerged the leaders of revolution. Komninos Pyromaglou, Panagiotis Kanellopoulos, Georgios Grivas, and Georgios Papadopoulos walked in the sight of revolutionary, civilian, and hastily-assembled press alike on the steps, hands clasped in hands. \n\nAs one, they raised their fists to the sky, and with this firm display of revolutionary solidarity, they proclaimed with one voice the formation of a new provisional government to oversee the Hellenic state. The government would be modeled like the Parliamentary Democracies of Pre-War Europe, and as a People, they would decide what the path of Hellas would be. \n\nThe fate of Hellas is far from certain, but now more than ever, the people of the nation have hope for the future. Now it is time for Hellas to move forward once more. "
 gre.11.a:0 "Stand Hand in Hand, and sing the Hymn of Liberty"

#Ideas
 GRE_elusive_resistance:0 "Elusive Resistance"
 GRE_elusive_resistance_desc:0 "Despite numerous efforts by the Hellenic State and the SIM, the Greek government and Italy have barely any idea about the current status of the Greek resistance - which groups are most active and where remains a mystery. While major partisan organizations like communist EAM and republican EDES are a known and dangerous threat, other resistance groups, such as monarchist Organization X, prefer to work in the shadows, and there might even exist some organizations whose existence is completely unknown."
 GRE_elusive_resistance2:0 "Elusive Resistance"
 GRE_elusive_resistance2_desc:0 "Despite numerous efforts by the Hellenic State and the SIM, the Greek government and Italy have barely any idea about the current status of the Greek resistance - which groups are most active and where remains a mystery. While major partisan organizations like communist EAM and republican EDES are a known and dangerous threat, other resistance groups, such as monarchist Organization X, prefer to work in the shadows, and there might even exist some organizations whose existence is completely unknown."
 GRE_open_rebellion:0 "Open Rebellion"
 GRE_open_rebellion_desc:0 "Emboldened by the departure of the Iberian and Turkish troops, the many resistance groups in the country have risen up in open rebellion."
 GRE_triumvirate_garrisons:0 "Triumvirate Garrisons"
 GRE_triumvirate_garrisons_desc:0 "Currently, the Hellenic State is barely held together against the numerous resistance groups that plague the country. Soldiers from Italy, Turkey and Iberia collaborate in counter insurgency operations, but even with their best efforts, only the major roads and cities are truly secure, while the mountainous interior is controlled by partisans."
 GRE_security_batalions:0 "The Security Battalions"
 GRE_security_batalions_desc:0 "The only actual armed forces of the Hellenic State, the Security Battalions or Tagmata Asfaleias have been created as an anti partisan unit during WW2. After the end of the war, they were expanded but never allowed to turn into an actual army, and as such they are inefficient and rife with corruption - and there's suspicions that some TA officers even have contacts with resistance groups, but those rumors are unconfirmed for now."
 GRE_security_batalions2:0 "The Security Battalions"
 GRE_security_batalions2_desc:0 "The only actual armed forces of the Hellenic State, the Security Battalions or Tagmata Asfaleias have been created as an anti partisan unit during WW2. After the end of the war, they were expanded but never allowed to turn into an actual army, and as such they are inefficient and rife with corruption - and there's suspicions that some TA officers even have contacts with resistance groups, but those rumors are unconfirmed for now."
 GRE_dysfunctional_government:0 "Dysfunctional Government"
 GRE_dysfunctional_government_desc:0 "Greece's government is borderline dysfunctional, with the only legal party, the National Union of Greece, kept together by sheer convenience rather than actual conviction. Rampant corruption and cronyism have tarnished the image of the collaborator government, while harshly repressive laws, the continued presence of Italian soldiers and a terrible economic situation have driven many Greeks to join the resistance."
 GRE_dysfunctional_government2:0 "Dysfunctional Government"
 GRE_dysfunctional_government2_desc:0 "Greece's government is borderline dysfunctional, with the only legal party, the National Union of Greece, kept together by sheer convenience rather than actual conviction. Rampant corruption and cronyism have tarnished the image of the collaborator government, while harshly repressive laws, the continued presence of Italian soldiers and a terrible economic situation have driven many Greeks to join the resistance."
 GRE_dysfunctional_government3:0 "Dysfunctional Government"
 GRE_dysfunctional_government3_desc:0 "Greece's government is borderline dysfunctional, with the only legal party, the National Union of Greece, kept together by sheer convenience rather than actual conviction. Rampant corruption and cronyism have tarnished the image of the collaborator government, while harshly repressive laws, the continued presence of Italian soldiers and a terrible economic situation have driven many Greeks to join the resistance."
 GRE_the_cyprus_situation:0 "The Cyprus Emergency"
 GRE_the_cyprus_situation_desc:0 "While the island of Cyprus was formally handed over the Greece following World War Two, the situation on the ground is much more complex. Italian troops were stationed in Cyprus in large numbers, and as elsewhere in Greece, a nationalist resistance began to form, under the aegis of a group called EOKA. Their rising prominence and power began to scare the large Turkish community of the island, which formed a paramilitary of its own, TMT, leading an insurgency of their own against Italy and EOKA. When the Triumvirate was formed, Turkey demanded to station a garrison in Cyprus to protect the Turks of the islands against EOKA - however, there are rising suspicions that the Turks are secretly aiding TMT as well. In the end, the island was locked in a deadly and complex struggle between the Italian garrison, EOKA, TMT and the Turkish troops, which is a constant and significant strain for Turkish - Italian relationships."
 
 GRE_italian_garrison:0 "Italian Garrison"
 GRE_italian_garrison_desc:0 "YEET"
 
 # Focus #
 # Intro Tree #
 gre_look_to_the_cities:0 "Look To The Cities"
 gre_look_to_the_cities_desc:0 "The cities of Hellas represent the final vestiges of national control and unity. While the countryside is held beneath rebel control, we still thankfully have maintained our authority in the great Hellenic metropolitan centers. But we cannot rest on our laurels for that fact alone, at any moment that situation could change. \n\n We need to strengthen our grip on the city centers of Hellas before we can take any further action. The rebels in the countryside would love nothing more than to dislodge us from our centers of power, and we will not let our vigilance drop until that is no longer a possibility."
 
 gre_suppress_the_press:0 "Suppress The Press"
 gre_suppress_the_press_desc:0 "The state has total control of Hellas's press already, but that isn't quite enough. Individual reporters and editors, even if employed and managed by the state, are still capable of slipping out information or material that's damaging to the Hellenic State's stability if we are not careful. \n\nWhat's more is that underground newspapers and presses are still pervasive throughout Hellas, mostly in the countryside, but they have been seeping into the cities despite our efforts. Alongside tightening press restrictions, we need to stamp out the attempts to smuggle underground press into our cities as well."

 gre_there_are_no_rebels:0 "There Are No Rebels"
 gre_there_are_no_rebels_desc:0 "In spite of the peril that we find ourselves in currently, we need to ensure that our people feel comfortable and secure underneath our rule, or else they might find themselves more sympathetic to their message, should they get the chance to hear it. \n\nTo the rest of the world, and to our own citizens, we must not appear weak, and to do that, we cannot acknowledge the resistance against us. At least in the public eye and the eye of the average Hellene, in private conversation we can afford to be a little more candid."
 
 gre_italians_help_us:0 "Italy Sends Assistance"
 gre_italians_help_us_desc:0 "The Italian Empire has found themselves to quite sympathetic to our current situation, and have agreed to deploy additional forces to support their Hellene brothers. After some negotiation, we have managed to get them to agree to using their manpower to bolster the Hellenic Army and Security Battalions directly, rather than tie them up in the Triumvirate garrisons. \n\nWith these additional reinforcements, we should be able to fill the gaps in our forces and secure our State against those who'd bring it low. It's good to have allies."
 
 gre_italians_arm_us:0 "Italy Sends Arms"
 gre_italians_arm_us_desc:0 "Italian companies can be rather difficult to negotiate and haggle with, but we have thankfully gotten some of the companies in their growing arms industry to agree to grant us additional support in arming our army and our Security Battalions. \n\nMost of our equipment is already either Italian-made, or at least Italian-designed as it stands, so little to no retraining should be necessary to get the men up to speed on the new weapons."
 
 gre_italians_train_us:0 "Italy Sends Instructors"
 gre_italians_train_us_desc:0 "To say our military has... stagnated some since the Second World War would be an understatement. Without a conventional foe to fight since then, most of the combat the average Hellene soldier has been being ambushed by various rebel groups or trying to flush them out in turn. If we're to get our army up to snuff, we're going to need some outside assistance. \n\nThankfully the Italians are more than willing to send over instructors and teachers from their own ranks to teach our own troops everything from the discipline of a modern soldier, to more advanced tactics, both conventional and against subversive elements, against both of which the Italians have experience."
 
 gre_prepare_security_battalions:0 "Prepare Security Battalions"
 gre_prepare_security_battalions_desc:0 "With outside support and the cities under firm control, it's time to start clearing out the countryside of these rebels and revolutionaries. Just as in the days of old, we'll be calling upon Hellas's most erstwhile patriots, the Security Battalions, to lead the charge. \n\nWith Italian arms, manpower, and training, the Army and Battalions represent the last and greatest hope for the preservation of Hellenic Honor and Glory. It's time to issue the call to arms."
 gre_prepare_security_battalions_tt:0 "§OWe will send in the Security Battalions to arrest troublemakers and dissidents.§!"
 
 gre_crackdown:0 "Crackdown"
 gre_crackdown_desc:0 "Without much fanfare so as to leave the enemy unawares as to our moving against them, the Battalions set out from the metropolitan centers of Hellas and into the hills and mountains that lay in the interior of the nation. \n\nForward sons of Leonidas, heirs of Alexander, defenders of Hellas and all her people! The crackdown has begun, and once it is finished, no longer shall the dissident and rebel plague the heartland of Hellas! We will flush them out from their hiding holds and drive them into the sea!"
 
 gre_continued_dissent:0 "Continued Dissent"
 gre_continued_dissent_desc:0 "We are receiving reports that the Security Battalions' efforts in the mountains and foothills are meeting heavier-than-anticipated resistance from the subversive forces. They're confronting the Battalions directly, as well as leading them into traps and ambushes. \n\nWe couldn't keep the move secret forever, we knew that, but we had hoped to have a major victory to proclaim before the news got out to the general public. The successful resistance has stirred up some dissent in our own people. Some of the less patriotic Hellenes have even started taking to the streets! We just need a win, somewhere."
 
 gre_garrisons_intervene:0 "Garrisons Intervene"
 gre_garrisons_intervene_desc:0 "The foreign garrisons have moved against the rioters in our cities! Without even so much as informing us as to their intentions, Iberian, Italian and Turkish divisions made their way into the streets and started forcibly dispersing some of the larger, more volatile protests. \n\nWhile we're not ungrateful to our Triumvirate allies for their assistance in maintaining order, the simple fact that they were able to independently decide to do this, and we just stood by and watched, does not speak of Hellenic strength. The streets might be secure, but our reputation has suffered a blow we may never recover from, in both the international view, and in the eyes of our citizens."
 
 gre_damage_control:0 "Damage Control"
 gre_damage_control_desc:0 "Defeating a rebellion and maintaining order against an unruly population is a bloody and ugly affair, to put it lightly. There have been concerns that some of the more forward actions taken by our Security Battalions have been a bit of a burden on our propagandists to justify and downplay to those who do not yet support the resistance, and yet do not support us. \n\nWe need to go into overdrive on the radio and in the press. It was always the partisan who shot first, the terrorist who began the scheme, always the criminal and the rogue who sought to exploit the good, pure Hellene for their own gain. If it was us who caused the damage, it was justified because of the harm it prevented. Keep the propaganda wheel spinning!"
 
 gre_just_a_minor_incident:0 "Just A Minor Incident"
 gre_just_a_minor_incident_desc:0 "A particularly nasty and damning incident has occured with the garrisons mistaking a civilian for a partisan in the very heart of Athens. We were quick to dispel such \"rumors\", but there were witnesses; a lot of witnesses, in fact, and they know what they saw. \n\nIt's time to start downplaying, and hope that enough people believe us that we can just brush the incident under the rug after they've gone and forgotten about it. The worst thing we could do is allow this incident to spiral out of control and to allow our enemies to control the narrative surrounding it and therefore, our anti-partisan actions as a whole."
 
 gre_theyre_here_to_help:0 "They Are Here To Help"
 gre_theyre_here_to_help_desc:0 "The nation is in turmoil and the average, everyday Hellene lives in fear. Riots and partisan action has made even the most central of the Hellenic cities into potentially dangerous hotspots of violence, and these areas need to remain under military surveillance for that very reason. \n\nHowever, we need to make sure that the loyal Hellene understands this: That those who have nothing to hide, have nothing to fear. So as long as they remain innocent and obedient to the Hellenic State, that they have no reason to shirk away from the Security Battalions and Garrisons that keep order in our streets."
 
 gre_its_not_occupation:0 "It Is Not An Occupation"
 gre_its_not_occupation_desc:0 "A rough hand is necessary to keep order in Hellas, it's just unfortunate that from the perspective of the average citizen, it appears to be more like some type of tyranny than what it truly is. They sneer and scoff at their brave defenders, they casually refer to our police actions as \"an occupation.\" \n\nTo counteract this, we need to act quickly. Remind them that this is not an occupation, as all of the Security Battalions and garrison soldiers are in fact, acting as extensions of the Hellenic State, and a State cannot occupy its own cities. If anything, it's the interior of the country that's held under occupation! The occupation of rebels and partisans, and if the rioters in the streets had their way, the people would see what a real occupation looks like."
 
 gre_just_peacekeeping:0 "Just Peacekeeping"
 gre_just_peacekeeping_desc:0 "The riots are beginning to become easier to disperse. The garrisons and Battalions have managed to weather the worst of the outcry, but the rebellion is still firmly entrenched in the foothills. What's worse, is that moreso than ever, the average Hellene holds the government in ill regard. \n\nWhereas before all of this began, the government in Athens might have been seen in an almost pitiable fashion by the average Hellene, our actions in trying to root out the subversives and keep order in our own cities has turned the public's dismissal into something that more resembles outright treasonous hatred. And these ingrates feel this way because we kept the peace!"
 
 gre_trouble_on_the_horizon:0 "Trouble On The Horizon"
 gre_trouble_on_the_horizon_desc:0 "We have weathered the storm, but now, but clouds have already begun to collect on the horizon. The riots are now contained, but our cities and the Hellenic spirit are irreparably damaged as a result, and unfortunately, Hellas is not the only nation in the Triumvirate. \n\nTensions run high between our neighbors and allies, on whom we rely to keep the garrisons intact and by those means, keep our nation intact. There is a silver lining, however, and rumors of a conference among Triumvirate members should allow for the easing of tensions, and for Hellas to remind the Triumvirate what exactly is at stake."

 gre.20.t:0 "Oi Póleis"
 gre.20.d:0 "Athens. Patras. Thessaloniki. The major metropolis is the final true bastion of Hellenic authority on the peninsula, and even then, they aren't nearly as secure as the state would have the public believe. Every day the chances grow greater that one may turn over to the rebels, which is why constant vigilance is required on the part of the local Garrisons and Security Battalions. \n\nA recent incident in the city of Trikala- far to the Hellenic interior, and therefore a vital stronghold for the Hellenic state in the never-ending fight against partisans and anarchists- has startled many in the Hellenic High Command. Local Security Battalions uncovered a Partisan smuggling operation taking place right under their noses, and evidence suggests that the rebels have been sneaking weapons, ammunition, propaganda and other supplies through the city. From there the supplies went up to partisan cells in the mountains, and the propaganda disseminated to all of the cities. \n\nThe simple fact remained, however. Even with the presence of the Battalions, of the Italians, Turks, and Iberians, the rebels were still able to operate for years without any sort of knowledge or awareness on our part. Whereas before the EEE might have been content to maintain the status quo, it immediately became clear that if we don't do something now, and do it fast. \n\nFor all intents and purposes, every city is going on lockdown. The government will avoid the nasty term \"martial law\" for the time being, but for the time being, the situation will have to resemble such until we can be sure we've rooted out every trace of sedition and rebellion within our urban strongholds."
 gre.20.a:0 "And once we've established order there, we can bring order to the rest of the country!"
 
 gre.21.t:0 "Security Battalions Ride Out"
 gre.21.d:0 "While we have reinforced our hold on the cities, and the Italians have provided us with much needed supplies and manpower, just keeping our grip on the cities won't be enough to secure Hellas against our internal enemies. If the Hellenic State is to legitimize itself, it will have to go on the offensive! \n\nMorale is higher than it's ever been, the Security Battalions are more battle-ready than they have been since World War Two, we're well equipped, but most importantly, our generals have concocted a series of maneuvers that will strike deep into the Hellenic heartland, and bring the guns of Athens directly to the doorstep of the traitorous cells. \n\nSecurity Battalions, previously stationed to defend the cities against possible uprisings, will spearhead the assault. While the decision to use these as our primary attack force has its critics, it isn't as if there's another choice either, with these Battalions being the only military that Hellas has left. In spite of the naysaying, the majority of the EEE takes comfort in the knowledge that we've already secured the cities and are therefore free to strike the rebels in their own homes. \n\nThe trucks are ready, the guns are loaded."
 gre.21.a:0 "Once more unto the breach!"
 
 gre.22.t:0 "Riots"
 gre.22.d:0 "It would appear as though we had made a slight miscalculation. Or, as the case may be, we made multiple. \n\nThe Security Battalions' offensive into the Hellenic Interior has not gone according to plan and in a somewhat ironic turn of events, we have found our own troops getting bogged down and stuck in the same hills and mountains that thwarted Italian offensives in the past. The rebels should have been crushed some time ago, but obviously, that has not happened yet. \n\nTo make matters worse, reducing our presence in the cities and immediately struggling against the resistance appears to have emboldened our own urban populations. All across Hellas's major metropolises, citizens have taken to the streets in protest, and in the first cities to start this, the protests have already devolved into riots. \n\nOur generals are swearing up and down that they just need another day, another few days, another week, and another fortnight, to accomplish the objectives. The way they see it, we just need to stay the course, and the public will be pacified when we're marching tattered and burnt partisan banners through the streets of Athens. \n\nDoubt begins to take hold of many in the EEE, but our options are few, and for the time being we can only hope that the generals are right, and that the garrisons can keep the peace long enough for us to achieve victory."
 gre.22.a:0 "Steady as she goes"
 
 gre.23.t:0 "Damage Control"
 gre.23.d:0 "Ever since Melek had been told that he was being transferred to the Garrisons, he has felt strangely out of place. He was not a Hellene, and Turkey was not at war with Hellas, so naturally it just felt strange that he should stand with his hand on his gun while on Hellenic soil. What was he doing here?\n\nWhen the egg thrown by some miscreant in the gaggle of signs and fists before him struck his face, the thoughts of frustration came boiling back up. Why should he have to be dealing with this? If the Italians' dogs couldn't hold their own country by their lonesome, why should he, a Turk, need to endure this abuse? Why should his comrades, who hail from places like Iberia and Libya, need to stand here and take this?\n\nThe riots were getting worse. The Hellenes called it \"protests\", but what the State said began to matter less and less in the mind of Melek and his comrades, they didn't even warn the Garrisons that held their country together about their plans to just go gallivanting into the hills and dying to their own people in droves.\n\nAnd while they did that, it was Melek who was expected to keep his composure while simultaneously dodging questionable foodstuffs and- was that a rock? It was only his own quick action and the hand on the chest of his comrade next to him that saved him from the large piece of cobblestone ripped from the road and hurled at the garrison peacekeepers.\n\nAnd when they took a step back, the rioters took a step forward, their chants got louder and more cacophonous. Their commanding officer behind them yelled something in response, but Melek could not hear. Another step back, and the rioters stepped forward again, closing more distance than Melek's unit had made.\n\nA quick glance- Was that another rock in their hand? It looked smaller, was it a grenade?\n\nMelek lost track of time and place for a moment, he only remembered the sensation of fear, the plastic of the trigger, and the screams that followed. Why was he here anyways?"
 gre.23.a:0 "Not the ideal outcome..."
 
 gre.24.t:0 "An Invitation"
 gre.24.d:0 "Weeks and weeks have passed, and there's no end in sight to either the campaign against the rebels, or to the rioting in their own cities. Every incident only seems to serve as a catalyst for the next incident, each reacting to an outrages that only fed into one another. \n\nThe Hellenic State was never a vigorous government, it was established on a very unstable foundation, and the EEE has not handled their administrative duties all that well irrespective of that. But these days, the paralysis had crept into the parliament like a poison, and slowly but surely, fear began to do its work on the politicians and leaders. \n\nHellas was dying from the inside out, and all were too afraid to rush to her aid. In the hills and mountains, the Security Battalions struggled against an endlessly elusive foe, while in the cities and major roadways, Garrisons clashed with an increasingly disillusioned and revolutionary population. Everything was falling apart at the seams. \n\nIn his hand, Sotirios Gotzamanis held a letter, from Il Duce himself. An invitation to participate in a conference on the Island of Malta to hopefully resolve the disputes and anxieties that plagued the Triumvirate in recent years. \n\nIt should feel like hope, but there was an air about the whole thing. Gotzamanis had a close brush with death before, and the feeling he felt now was eerily similar to what he remembered from then..."
 gre.24.a:0 "We can only hope that Prime Minister is wrong"


 #### Starting Economy Tree #####
 gre_aftermath_of_atlantropa:0 "Aftermath of Atlantropa"
 gre_aftermath_of_atlantropa_desc:0 "Atlantropa, to put it mildly, has not gone well. Germanic short-sightedness and contempt for all others has inflicted great suffering on all of the Mediterannean Nations, but perhaps none suffered so much as the Hellenes. \n\nA smaller nation than the others, and with a heavier reliance on fishing and our ports than the Union or the Empire, the loss of major ports and sea in which to do that fishing has been nothing short of catastrophic. \nHellas has descended into economic depression which only served to exacerbate the problem with insurgencies that plague our countryside. We should take a survey of the total damages done, and start drafting plans to recover."
 
 gre_address_the_economy:0 "Address The Economy"
 gre_address_the_economy_desc:0 "Since the days of Ancient Sparta and Athens, the Hellene lifeline was the Mediterannean, her bounties of fish fed the people and gave a valuable resource to sell. But with less sea, there's less fish, and the fishermen began to squabble over an actively shrinking market, and many of them began to lose. \n\nA loss of our major industry has undoubtedly had a disastrous effect on the rest of our industries as well. Former Fishermen needed to find new places to work, but with less money and fewer jobs to go around, Hellas's unemployment began to skyrocket. \n\nWe need ideas, new ideas, on how to handle our struggling economy, how to tackle unemployment, and how to put Hellas back on the map, or at least, back on her own two feet."
 
 gre_no_ports:0 "No Ports"
 gre_no_ports_desc:0 "It was a strange thing, watching our island ports dry up before our very own eyes. The loss of some of Hellas's most profitable Adriatic and Aegean harbors and ports is the sorest spot for the average Hellene since our humiliation to the Turk all those decades ago. \n\nWithout those harbors and islands, trade has stagnated, and even our logistics have suffered, with many of our island populations suffering various shortages due to difficulties with getting supplies to them. It can be expensive to keep them fed, much less content. Our primary trade routes now go through what were formerly islands in Corfu and up through Albania, and only because there's fewer places where we can send oversea trade through."
 
 gre_no_money:0 "No Money"
 gre_no_money_desc:0 "If Hellas were Germany or America, perhaps we could \"just\" deal with the current crisis by throwing money at it. But we simply put, do not have the funds to do that. The Hellenic State is dependent on foreign loans- especially Italian ones- to keep the government and military operating at any level, and what money we do make from taxes and tariffs are spent trying to keep up with interest. \n\nWe are going to need to get creative with how we use the funds we do have, and probably make some sacrifices along the way, just to build the foundation of a sustainable economy."
 
 gre_no_autonomy:0 "No Autonomy"
 gre_no_autonomy_desc:0 "As if the actual state of Hellas's fragile economy wasn't bad enough, but we find ourselves with our hands tied. The Italian Empire's hold over us extends beyond that which they officially hold, but they have effectively, long ago, turned the Greek economy into a subsidiary of that of the Italians. \n\nSome of the more deluded lawmakers in Hellas argue that if it weren't for the Italians, we would have fixed this country already. While exaggerating a great deal, they do have a point. Our ability to dictate our own terms and trade has been significantly hampered, and we find ourselves without the agency needed to truly innovate our way out of this situation."
 
 gre_as_always:0 "As Always"
 gre_as_always_desc:0 "We've received our reports, and as options are being discussed, it's becoming increasingly obvious that we don't actually seem to have any, in practice. Without some foundation to build a restructured economy on, any action we'd make would collapse like a house of cards. \n\nIt hurts our pride, but we are beggared, and beggars can't exactly be choosers now can they? It's time for us to prepare the diplomats to make overtures, because we are forced to, as always..."
 
 gre_turn_to_italy:0 "Turn To Italy"
 gre_turn_to_italy_desc:0 "Our benefactors in Rome couldn't conquer Hellas alone in the Second World War, but they sure have figured out how to keep us dependent on them for material support after the fact. \n\nIf the Hellenic economy is to be restored, we need something to start with, and as the fourth-largest economy in the world, the Italians will have more than enough to give us something to get started with. If it weren't for the political pressure they exert on us constantly, we might be able to turn towards one of the great powers, but we can't risk that, so to Italy we go."
 
 gre_attract_investors:0 "Attract Investors"
 gre_attract_investors_desc:0 "Hellas, in spite of its current situation, is not without economic value. However, the unfortunate reality is that you need money in order to make money, and money is what we are lacking more than anything else. \n\nEven with Italian support, we don't have the necessary funds to rebuild the nation, so we're going to need to turn to more conventional sources: international business. It's going to be a hard sell, with the rampant instability that we've experienced since the Damming of the Mediterannean, but if we can convince them that the untapped potential reward of Hellas is worth the cost, we have a chance at giving Hellas the foundation it needs to grow and thrive."
 gre_attract_investors_tt:0 "§GWe must convince others that we are worth investing in.§!"
 
 gre_buy_materials:0 "Buy Materials"
 gre_buy_materials_desc:0 "The most pertinent part of material wealth is the material part. Roads and ports, ships and trains, airports and housing, it can't come from simply nowhere now, can it? Without much heavy industry of our own, we have no option except to look outside our own borders for the building materials required to make this. \n\nHellas represents a massive potential reward to whichever trading partner, a state or companies, offers us the best deal, and we should be aware of that fact when we start looking for trading partners."
 gre_buy_materials_tt:0 "§RThis will slightly increase our national debt§!"
 
 gre_new_ports:0 "New Ports"
 gre_new_ports_desc:0 "The Aegean and Ionian Retreats have isolated and landlocked many of Hellas's most important harbors and ports, and due to a combination of a lack of funds and a crippled government, only the most critical of these ports and naval bases have really been properly replaced. \n\nThis is a state of affairs that cannot be allowed to stand. Since antiquity, Hellas has lived and died upon the seas, and the Hellenic State will be no different! Using our newfound funds and materials, we can begin building new ports alongside our new coastlines at the edges of the Retreats, which will grant us the economic access to the outside world that we've lost."
 
 gre_reignite_the_fishing_industry:0 "Reignite The Fishing Industry"
 gre_reignite_the_fishing_industry_desc:0 "The revival of Hellas can't truly begin without a revival of the Hellenic dinner plate. We are of course, talking about the limping fishing industry in Hellas. Most of the small island communities that spearheaded the industry have all but perished in the wake of Atlantropa. \n\nBut in spite of the Retreats, we can bring back the industry with some work. It's time to subsidize fishermen, sponsor hatcheries, and find new places to fish since many of the older spots have since dried up. Soon we will be feeding our own people, and hopefully other peoples, in time."
 gre_reignite_the_fishing_industry_tt:0 "§GThis will give a small boost to our GDP.§"
 
 gre_move_on_to_heavy_industry:0 "Move On To Heavy Industry"
 gre_move_on_to_heavy_industry_desc:0 "With our ports and our most fundamental industries restored to Hellas, we need to take the national revival to the next level. No nation can stand on her own two feet without establishing industries that allow themselves to develop further industry, this means steel, this means concrete, this means arms and armor. \n\nIt's time for us to take that next step, because a revival can't just bring Hellas back to what she might have been before the rise of the new State, but she must move beyond what the previous the old democracies and states achieved. Hellas will reach new heights, we will make sure of it!"
 
 gre_exploit_natural_resources:0 "Exploit Natural Resources"
 gre_exploit_natural_resources_desc:0 "Hellas has always been a wealthy nation, but not in matters of money and simple finances. The wealth of Hellas is found in the earth, in the seas, in the hills and mountains, we need only seize them and profit off of what is already ours. Previous incarnations of Hellas failed to take advantage of what Hellas has to offer, a mistake we will not make again. \n\nOnce we do this, and start turning those resources into industry, we will be in a position to catapult Hellas into a position of influence and power in the Mediterannean. It will be expensive to start with, but it will pay back dividends by the time the project is complete."
 
 gre_government_grants:0 "Government Grants"
 gre_government_grants_desc:0 "Before the industries kick into gear and escape from our control, we need to make sure they're on firm financial grounds. We still have some leftover capital we can dole out in the form of government grants to the various fishing, mining, lumber, arms, and shipping industries that are beginning their rise in Hellas. \n\nThese grants also grant us a comfortable degree of control over these industries in the future. We can attach a number of regulations and rules under which these grants are granted, rules that keep them in check and prevent them from running out of our control, or engaging in actions that harm Hellas."
 
 gre_start_economic_rejuvenation:0 "Start Economic Rejuvenation"
 gre_start_economic_rejuvenation_desc:0 "Our coastlines are dotted with seaports and fishing ports, new ones built alongside the most favorable locations along the otherwise destitute Ionian and Aegean Retreats. Our hills and mountains are primed and ready for harvesting and exploitation, exploitation that we can then use to fuel industries for which Hellas has never yet been known for. \n\nIt's not just a revival of Hellas, but a nascent rebirth of the nation and the Hellene identity! No longer just another Balkan backwater, but an emerging power in the Mediterannean, in spite of everything we've suffered so far!"
 gre_start_economic_rejuvenation_tt:0 "§GOur economic growth will increase.§!"
 
 gre.25.t:0 "Dammed In"
 gre.25.d:0 "Could a nation ever truly be ill, Hellas would be the illest of them all. The home of philosophy, of colonists, of traders and explorers who traveled further than any in their time, Hellas was once the cradle in which the Western world spent her infancy, and had she the will to she might learn to take pride in that fact. But her strength has been sapped from her, the beaches once prosperous and beautiful now choked with salt and sorrow. \n\nWhen the Hun built Atlantropa, they thought to be doing Europa a favor, granting the Mediterannean nations additional land, \"living space\", which the German lusted after more than anything else. But what good is it to live atop salt and sea shells? The Hellene conquered the sea, and as far as old Iberia and Crimea felt her presence for it, and from the sea, came bounty, came trade, came the essence of Hellas itself. \n\nThey dammed the sea, and it was only fortune in the form of disaster that saved the Mediterannean from extinction, but the damage was already done. Archipelagos, once flush with fish used for trade and for the very livelihoods of Hellas, now are connected by dry, lifeless, smothering land. The peninsulas that shoot off of larger peninsulas provided Hellas with many profitable, defensible harbors, and had always spoken for a naval potential in Hellas that hasn't been seized upon since ancient times. But now the harbors and bays rise as the sea flees, and with the sea, so too flees the life and trade of Hellas. \n\nHellas isn't simply sick. She is tired, and she is starved, and though it is thousands of kilometers away, she shivers and trembles in the shadow of Atlantropa."
 gre.25.a:0 "Curse the dam! Curse the Hun!"
 
 gre.26.t:0 "The Right Man for the Job"
 gre.26.d:0 "For an undertaking as the rebirth of a nation, most nations might seek out a visionary in their ranks, others might look to a strong and established figure who has guided them through storms in the past, while others more may choose someone with the natural leadership qualities of charisma and confidence. \n\nHellas, instead, seeks out someone like Stylianos Ioannu. \n\nA faithful, if uninspiring, member of the Hellenic Parliament, the man is soft of voice and short of height, with grey-white hair giving away more to white every day. Stylianos Ioannu has never led an initiative, he has never taken part in the personality and party games of the Parliament, he's never sided with intra-party cliques and leagues. \n\nIn short, a perfect man for the job, even if he didn't know why yet. As he looked at the folder in his hands detailing the job he was being given, his eyes betrayed just how little he understood the nature of his appointment. \n\nThat was no matter, that was a problem solved with some vague praise, words of affirmation, and a reinforcement of the absolutely critical nature of his mission, capped off with a repetition of the faith that the Ministry of Home Affairs had in his ability to serve his nation well. \n\nStylianos Ioannu left the building with a folder full of Hellas's most critical problems, a smile on his face, and straight for disappointment. It did not matter though, the proposal would be read, and summarily rejected, and the Ministry of Home Affairs would not come under fire for rejecting a proposal forwarded by a member of one of the many cliques that permeated the Hellenic Government."
 gre.26.a:0 "The Political Games Stop for Nothing"
 
 gre.27.t:0 "In the Shadow of Piraeus"
 gre.27.d:0 "From where the sea once covered the earth, Stylianos stared up at history, at a ruined testament of not just a bygone age, but all of the ones that went before that one too. In his hand he clutched sand, long-dried sand with speckles of sea salt mixed in with it, sand that once watched the bellies of triremes and merchant vessels glide atop the sea above. \n\nPrying his eyes from the looming cranes and docks above, he surveyed the former seabed around him instead. Though drained nearly a decade before, the remains of old crustaceans their shells still littered the beachside, and the air held a stale stench from the massive death toll that the Dam so far away took on the local fish population. \n\nStronger though, was the scent of the Aegean that lay in eyesight, if only barely, from where he stood. It ebbed and flowed along the edge of the oh-so-young beach in the distance. He had already known just how far the Aegean Retreat had gone on for, but it was another thing entirely to stand here and watch it in the distance. On a fundamental level, it felt wrong to see it so far from the port. \n\nStylianos sighed, and closed his eyes, before turning a shoulder towards Piraeus on one side, and the distant sea to the other, and beginning the trek back to his car. There stood naught but sand, salt and shells in the land \"reclaimed\" by that dam, and yet that sand, salt and those shells stood between Hellas and the future."
 gre.27.a:0 "Have we really fallen so low?"
 
 gre.28.t:0 "An Empty Chest"
 gre.28.d:0 "\"Revenue may as well be nonexistent. We cannot collect any sort of taxes in the parts of the country held by the rebels, and we do not profit from our own trade with the Italians. Little more can be said for us beyond the fact that we are incredibly broke.\" \n\nStylianos had his face buried in his hands as the financial minister explained in no uncertain terms that the income that Hellas received was minimal to nonexistent. He knew that Hellas was poor- everyone with a pair of eyes could see that for themselves- but the full extent of it was not known until that... Informative meeting with the financial minister.\n\nHe had hoped that the funds were simply misappropriated, or that there were superfluous programs that could be defunded to provide the restoration project some foundational cash, but that too, turned out to be a false hope. What funds the Hellenic State had were being used to maintain roads and supply lines within their own country, or to keep the Security Battalions equipped and battle ready against the rebels. \n\nThe sad fact of the matter is that to make money, one needs money, and there was no chance that Hellas was getting her money from her own lands. It would need to come from somewhere else, anywhere else. \n\nOn the drive back to the Parliament, Stylianos started to make a list of calls he'd need to make..."
 gre.28.a:0 "Creative Solutions to Impossible Problems"
 
 gre.29.t:0 "Bound by Red Tape"
 gre.29.d:0 "Perhaps one of the strangest aspects of Hellas's situation is that, on paper, there's nothing stopping them from raising the tariffs on Italian trade. Stylianos Ioannu had spent the wee hours of the morning pouring over legal codes, trade treaties, and edicts from the High Commissioner. The tariffs on Greco-Italian trade were certainly generous- too generous, by any reasonable metric- towards the Italians, but they could be altered and renegotiated, like any other treaty. Surely the Italians would be willing to pay a fraction more if it meant preserving the Hellenic economy in the long run? \n\nBut reality is often disappointing. In spite of all the treaties and codes being flexible in theory, the week afterward of proposing some changes to the Greco-Italian trade relationship only fell on deaf ears. It seemed as though the State was more concerned with keeping the Italians happy than providing for the Hellenic people. \n\nThe ministry of finance, the ministry of foreign trade, all of them filled with- alongside the rest of the Hellenic State- Italian bootlickers and puppets, by design of course. In spite of the opposition received, Stylianos decided he would stress the importance of changing the status of foreign trade when he presented his findings to the parliament."
 gre.29.a:0 "We struggle against our restraints"
 
 gre.30.t:0 "The Verdict"
 gre.30.d:0 "\"So in summary, if we are to save Hellas from further economic degradation and suffering, we need to make changes to our trade situation with the Italians, and we need to find a way to bring a short-term influx of capital to use. Once we have that, we can reinforce what fragile industries that yet remain, and from there, continue investing and encouraging outside entities to invest as well.\" \n\nIoannu looked down at his notes, and let out a heavy sigh. He'd done his part, and with his findings delivered to the Ministry of Home Affairs. Now with this information, they could draft a plan, and his long weeks of work would finally be- \n\n\"Thank you, Mister Ioannu.\" The Minister of Home Affairs said, his face not giving away any particular emotion as he spoke. \"That report was well-delivered, and I believe we can all agree we go home now knowing something we didn't before.\" \n\nWas he hearing them right? Stylianos's mind was practically swimming as he listened to the milquetoast murmurs of agreement and concurring between the ministry's bureaucrats. \n\n\"Go home? We can't go home yet- with all due respect of course- but we have to formulate a pla-\" \n\n\"A plan, Mister Ioannu?\" The Minister of Home Affairs was already standing and gathering his papers. \"Any plan we put together would fall apart once we approach the Italians.\" He gave a half-hearted shrug. \"But, thank you for your efforts regardless, I can tell the Prime Minister that the project has been completed, and we've exhausted all of our possibilities.\""
 gre.30.a:0 "When presented with salvation, Hellas could not muster the will to take it."
 
 gre.31.t:0 "Like a Beggar"
 gre.31.d:0 "Sometimes, you just needed to drag a nation into the modern era- kicking and screaming if need be. The Ministries refused to touch any issue that would potentially affect Hellas's working relationship with the Italian Empire, so, Stylianos Ioannu just wouldn't go through the ministries. This mission of his did not start conventionally, so he supposed it was only fitting that it wouldn't end conventionally either. \n\nPerhaps a negotiation between MP and ambassador along the Aegean Retreat would be unconventional enough. The Italian Empire's delegate to Athens was certainly skeptical at first, but acquiesced in surprisingly quick order. Something told Stylianos that this wasn't his first time circumventing the Hellenic bureaucracy. \n\n\"It's a tall order, Mister Ioannu.\" He admitted as he continued to thumb his way through the pages that Stylianos had handed him. \"A substantive loan, and an agreement to accept alterations to Hellenic tariffs before your own Parliament has even proposed such a thing seems...\" \n\n\"Unorthodox?\" \n\n\"That's a word for it I suppose...\" \n\nStylianos took a deep breath, allowing the seaside breeze to punctuate the silence between the two men for a moment. Then with measured words, he continued. \n\n\"Sometimes, unorthodox is needed to provide a nation's salvation. Men often blind themselves to reality, bureaucrats and politicians especially, in the name of orthodoxy, in the name of convention and normalcy.\" He gave a tremulous sigh before shifting his eyes from the man and to the sea. \"Hellas, Hellas is sick, and she needs the aid, lest she fall to any of the many blights that ail her.\" \n\nHe paused again, turning his eyes back to the Italian. \"And when a healthy man's neighbor falls ill, he can hope that the illness does not spread, or can offer medicine. A healthy Hellas, is a strong Hellas, and a strong Hellas would owe much to Italia when she recovers.\" \n\nThe ambassador's gaze did not flinch; instead, he simply nodded and cant his head back towards where they had left their car. As much an affirmation as Stylianos was going to get- and as little as he needed."
 gre.31.a:0 "A Ray of Light Shines through the Clouds"
 
 #### Papadopoulos #####

 gre_the_most_important_man_in_the_hellas:0 "The Most Important Man In Hellas"
 gre_the_most_important_man_in_the_hellas_desc:0 "Hellas is in crisis and needs a man who has the strength and will to save it. While the politicians and bureaucrats bicker and squabble, while the Battalions remain inactive, and the foreign garrisons watch over Hellas with an exhausted eye, one man seems to know exactly what needs to be done to save the country. \n\nEnter, Georgios Papadopoulos. A former Security Battalion member, a close compatriot of the Italian fascists, and now a force for change and a pillar of strength in the Hellenic Government. Relatively divorced from the factionalism that plagues the government, and with a strong support of military leaders lovingly referred to as \"The Colonels\", there's no one more equipped to bring stability and peace to Hellas."
 gre_the_most_important_man_in_the_hellas_tt:0 "§OPapadopoulos will increase his influence.§!"
 
 gre_insurgencies_end_here:0 "Insurgencies End Here"
 gre_insurgencies_end_here_desc:0 "If the Hellenic people are to know peace, the various rebellions and insurgencies that plague the countryside need to be brought under control. The subversives terrorize the peasantry, acting as common brigands and looters while proclaiming to have some greater ideological cause. \n\nWe must bring a stop to it, and Papadopoulos has a plan of exactly how to do that. He'll use tactics straight from his days in the Security Battalions to flush them from their hidey-holes, smoke them out from the hills, and scatter them to the wind! They hide in the countryside for now, but we will, with Papadopoulos's direction, restore order!"
 
 gre_rally_the_security_battalions:0 "Rally The Security Battalions"
 gre_rally_the_security_battalions_desc:0 "The Security Battalions hold an important place in the heart and legacy of the Hellenic State, and in the career of the President himself as well. Formed to help the Fascists root out subversives and insurrectionists in the countryside, and it was in their ranks that Papadopoulos's rise to power began. \n\nTheir role in the administration of Greece has dwindled since the establishment of the Triumvirate, with the Triumvirate Garrisons fulfilling their primary purpose of protecting Hellenes, but with the garrison system collapsing, and more proactive measures needed to save Hellas, it's really only fitting that they answer the call to arms once again. Together, they'd root out the rot that has infested the heart of Hellas just like they did in the good ol' days!"
 
 gre_contain_the_EAM:0 "The Spectre Of Communism"
 gre_contain_the_EAM_desc:0 "Communists make up the largest portion of the rebel and looter in Hellas. The EAM were the primary partisan group back during the Second World War, and the Hellenic State has not forgotten that fact. Papadopoulos has insiders with the rebels, and he tells us that the EAM is not only still a major force among the rebels, but that they have achieved significant infiltration of their ideological opposition, and perhaps might even have infiltrated the government itself! \n\nThis news is quite alarming, as communist zealots will be especially opposed to any kind of negotiation or compromise with the established government. Until the root of the Bolshevik disease is torn from the earth, we will never be freed from their constant antagonism."
 
 gre_ramp_up_the_rhetoric:0 "Ramp Up The Rhetoric"
 gre_ramp_up_the_rhetoric_desc:0 "It's one thing to simply have an enemy, every person, every nation has their foes, at the end of the day. To simply have and hate an enemy won't magically unite the Hellenic people overnight after all. If our plan to bring the State together is to succeed, we must instill the willpower and strength to follow through on that hatred into the people we rule over. \n\nThis will not be easy. But in our speeches, and in the presses, and in everything we do, we need to be insisting upon the necessity of our conflict. Papadopoulos has been particularly vocal about what's needed, and how every individual Hellene needs to do their part in order to achieve final victory and peace for the nation. We need to rally around the Hellenic State, and the Hellenic State needs to rally around Papadopoulos."
 
 gre_tighten_the_government:0 "Tighten The Government"
 gre_tighten_the_government_desc:0 "This divided, squabbling, petulant collection of ideologues and bottom feeders are at the heart and soul of the Hellenic State's weakness. Corruption runs rampant in its legislative halls and bureaucratic systems, and they cannot ever seem to agree on any course of action, no matter if it's a matter critical to the integrity of the state, or incredibly trivial. \n\nIf the Hellenic State is to survive, this cannot continue. We have to take hold of the government and start making some changes to supersede their petty rivalries and competitions, and more importantly, on a road that will lead to national unification. We need to provide a model government member for them to emulate, and discipline those who still insist on weighing down the State with their foolishness."
 
 gre_doctor_the_situation:0 "Doctor The Situation"
 gre_doctor_the_situation_desc:0 "Papadopoulos, as usual, has a proposed solution. In a rather drawn-out metaphor, he referred to himself as a doctor who can \"cure\" the ailment that has afflicted the government if only given the opportunity. By granting him a temporary measure of power to reorganize local governments and bureaucracy, he can root out \"problem children\" and make our government more efficient overall. \n\nA cleaner pipeline from the federal to the local level should help speed up legislation and executive action significantly, and act as a proof of concept for Papadopoulos's plans going forward. If he can solve this problem for us, what can't he do?"
 
 gre_faith_in_our_country:0 "A New IDEA"
 gre_faith_in_our_country_desc:0 "Gregorios Papadopoulos has cemented himself as a cornerstone of effectiveness and efficiency within the new republic. His initiatives have succeeded in every limited goal they've tried to achieve. Our Security Battalions are rooting out rebels and bandits from the countryside, his cleaning up of our bureaucratic structures have the government running more efficiently than it has in all of its history, and the entire State is turning towards him as a bastion of strength against the Socialists that haunt our periphery. \n\nSeveral have suggested, both from within and from outside his supporters, that we continue what has worked thus far, and continue to take and implement Papadopoulos's advice and policies. Stay the course, and Papadopoulos will see the Republic through!"
 
 gre_exile_suspects:0 "Exile Suspects"
 gre_exile_suspects_desc:0 "Once confirmed as the man with the blueprint for Hellas moving forward, Papadopoulos wasted no time. He's drafted up a list of politicians, bureaucrats, and the like who have likely connections to subversives, and ultimately, to the EAM. \n\nFor those who cannot be confirmed to be communist agents, exile is the most rational course. They wouldn't even need to leave Hellas either, as suspect or not, they are still Hellenes at the end of the day. Instead, a long vacation on an island in the Cyclades ought to do them some good, effectively removed from any position to do any damage, while also not banished beyond our borders where we can't keep an eye on them."
 
 gre_the_italian_connection:0 "The Italian Connection"
 gre_the_italian_connection_desc:0 "Ever since the fall of the old Greek nation and the structuring of the Hellenic State, the fate of the Hellenic people has always been inexorably linked to that of the Italian Empire across the Ionian Sea. \nMany within the nation, see this as shackles for the Hellenic People to shake off in due time, but Gregorios has a different way of seeing it. The \"The Italian rope\" as he refers to it can be used to grab onto so that when the Hellenic State stumbles, we do not hit the ground, but have something to pull ourselves up with. \n\nEstablishing a good working relationship with the Italians then is of paramount importance. As much as our reliance on them may sting our pride, they represent a safety net for Hellas and her people. Papadopoulos can use his personal connections in Rome to influence Italy in ways that are favorable to us."
 
 gre_talk_to_the_garrison:0 "Talk To The Garrison"
 gre_talk_to_the_garrison_desc:0 "Papadopoulos isn't only in tight with his Colonels, the Security Battalions, and the Italian government, but even the foreign garrisons in our own country are familiar with the man, and some rumor, owe him some favors. While he hasn't outright said whether or not he does, his closest supporters are some of the biggest supporters of this particular brand of gossip. \n\nThe garrisons are well armed, but relatively lightly manned. We can have Papadopoulos approach the garrisons themselves and strike some kind of deal with them in exchange for their excess guns and ammo. We, after all, need guns to secure the country, and our local industry is still recovering from the myriad of disasters it's suffered in recent decades."
 
 gre_unleash_the_police:0 "Unleash the Gendarmerie"
 gre_unleash_the_police_desc:0 "Beyond the Security Battalions, Hellas has a significant number of more conventional paramilitary groups, primarily tasked with patrolling the major roads and protecting our remaining harbors from subversives and terrorists. \n\nMore than even our professional army, these paramilitaries have significant combat training and experience, but their lack of professional status hamstrings the manner in which they can benefit the nation at large. By removing the red tape, we can allow Gendarmerie veterans and trainers to interact more freely with the military hierarchy and in turn, catalyze an improvement in the overall fighting quality of our troops."
 
 gre_re_engineer_the_political_landscape:0 "Re Engineer The Political Landscape"
 gre_re_engineer_the_political_landscape_desc:0 "More than just maintaining cohesion in the government's halls itself, if Hellas is to survive, its people need to be on the same page. Rather than pushing through the State Media, Papadopoulos suggests using more sly means of altering the political mindset of the average Hellene themselves. \n\nTargeted and very conscious propaganda to find what areas the average Hellene are most insecure in, and then push in that direction at full force, that's the way forward. Once we target and address these insecurities, we can use them to get the people on our side, which should prevent another collapse like the Old State had undergone, with any luck."
 
 gre_the_man_behind_the_mask:0 "The Man Behind The Mask"
 gre_the_man_behind_the_mask_desc:0 "Papadopoulos has installed the Colonels in significant portions of the Hellenic government, he's brought the communist threat to heel, and he's secured our relations with our most powerful neighbor. The Surgeon of Hellas has performed a successful operation, and now all of Hellas has become quite enamoured with the man. \n\nIs there anything he cannot do? He remains humble of course, but he and his loyal Colonels stand at the center of an impending national revival, the likes of which haven't been seen since they earned their freedom from the Turk in 1829. The future couldn't look brighter than it does now!"
 
 gre.32.t:0 "Turning Point"
 gre.32.d:0 "A midnight emergency session of the Hellenic Parliament. Papadopoulos had always been an... unconventional sort, that's what the fledgling Democracy had been relying on thus far, after all. Even still, the question of just why lingered the head of Andreas Stratos head all the way to the Parliamentary Palace. \n\nThe parliament chambers had a strange echo, a hollow air about it as he made his way to his seat. He'd never heard his footsteps quite so clearly, but still, he took his seat, and so did the scattered fellow attendees, clustered in their own regular spots as if it were any regular session. Only moments after, and still nearly half an hour before he had been told to arrive, Papadopoulos arrived. Alert and bright eyed, with kempt hair and a crisp suit that made him practically shine amidst the relatively disheveled, tired-eyed politicians. \n\nStanding behind the podium, Papadopoulos spoke with a measured confidence. He spoke of his \"Greasing the Gears\" program, which sought to identify and remove corrupt and obstructionist elements in the Hellenic government and bureaucracy. In this way, he announced that he had dismissed our Ministers of Justice, Defense, Finance and the Interior. \n\nSuch an announcement would have caused a stir in any other gathering. But in the mostly empty, droopy-eyed room, it only elicited a brief murmur that stuttered and stopped almost immediately. Without missing a beat, Papadopoulos continued. \n\n\"As such, in the interest of the preservation and improvement of Hellenic Democracy, I have invoked the special permission to appoint my own replacements to the cabinet- with Parliamentary approval, of course.\" \n\nOne at a time and as if on cue, men in military uniforms filed into the room, going largely unobserved by its occupants until they flanked the speaker on either side. \n\n"To the Ministry of the Interior, Stylianos Pattakos. To the Ministry of Finance, Nikolas Makarezos. To the Ministry of Justice, Ioannis Ladas. To the Ministry of Defense, Grigorios Spandidakis.\" \n\nAll four military men, and not a politician among them. Immediately a vote was called for, and the majority was achieved quickly, with all present voting either yes, or simply abstaining. \n\nThen came time for Andreas to make his vote, long after the result had been decided. Alone he stood, alone he said nay, and alone he left the Parliament Building and into the retreating darkness of the morning."
 gre.32.a:0 "Let No One Say that Papadopoulos went Unopposed that Night." 

 gre.33.t:0 "The New World"
 gre.33.d:0 "\"Andreas Stratos.\" The voice, deep and gravelly, came from the other side of the door. His knocking seemed liable to send the thing off of its hinges, so Andreas did not dawdle on his way to answer it. On the other side stood two men, unarmed, but they didn't particularly look like they needed to be armed anyways. \n\nThey had the looks of military men, both in their physical appearance and in the style of clothing they wore. One of them, with a surprisingly gentle voice for his frame, spoke next. \"In accordance with the recent initiatives to clear the Hellenic government of obstructionist and seditious elements, you have been charged with intentionally attempting to impede the Hellenic Parliament and delay the restoration of a Greek Democracy.\" \n\nWhich was, to be frank, one of the most ridiculous things that he had ever heard. He had served his nation dutifully for a long time, and even though he had retired to write his histories, he answered the call when Democracy returned to Hellas. How anyone- Papadopoulos, especially- could accuse him of such things was beyond him. \"Well then, I suppose I'd better go and plead my-\" \n\nHis attempts to leave his home were stopped with a rough hand. \"You will do no such thing.\" The first goon stated flatly. \"My associate here will return to the Parliament, and will deliver your refusal to face justice. After which, the Parliament will have no choice but to consider you guilty, and the sentence is of course...\" \n\nHis compatriot chimed in at that moment, hands held out in a vain gesture of generosity. \"Vacation. A... Long, vacation, admittedly.\" He looked over Stratos as if somehow that obvious euphemism made the reality of the situation any better. \n\nThe three men stood in silence for a long time as Andreas searched the recesses of his mind for some kind of answer, but none came. Instead, he closed his eyes and gave a resigned sigh. \"Allow me, if you would, to collect my notes before I go, at least.\" \n\nThe two offered a brief glance between each other, and the only answer they gave Andreas Stratos was a cold smile."
 gre.33.a:0 "Welcome to the New Hellas, same as the Old Hellas"

 #italy events

 greneg_ita_ciano.1.t:0 "The Final Orders"
 greneg_ita_ciano.1.d:0 "Greece has been gripped by chaos, as partisan groups wreak havoc and are coming closer and closer to seizing control of the country with every day that passes. The collaborator government is equally worried as we are, and has sought the protection of the Italian garrisons in and around Athens, that, in combination with the Security Battalions, are the last hope for our allies to maintain control. However, even that chance is slipping away. After months of endless fighting, our troops being constantly assaulted, ambushed and routed, Attica is the only true stronghold we can rely on.\n\nEven though occasional rumors of partisans carrying out resistance activity in the suburbs of the capital have reached Rome, the area still remains the only one we safely hold. Thus, we must make our decision on what our response will be. The High Commissioner to Greece, Luigi Mascherpa, who represents our interests there, has remained neutral on this issue so far, awaiting for a response from the government, but he seems to possess a better understanding of the situation on the ground.\n\nThe honorable Admiral and his closest advisors have debated the best course of action for days now, and little seems to have come out of it. As the National Resistance closes in on the capital, and threatens to end the EEE government, an immediate order to the Italian garrison must be sent. What shall it be?"
 greneg_ita_ciano.1.a:0 "Surrender your weapons to the resistance fighters."
 greneg_ita_ciano.1.b:0 "Shoot if only it's absolutely necessary."
 greneg_ita_ciano.1.c:0 "Open fire on the resistance and fight back."

 greneg_ita_ciano.2.t:0 "The Talks Begin"
 greneg_ita_ciano.2.d:0 "Behind closed doors and in dark alleys, there are talks of a final peace between the Italian Empire and the Greek resistance. Once having to hide behind the mountains and the woods, the partisans of the EDES and the EAM have nothing to fear anymore. They have not only openly engaged in "a war of liberation", but now can claim to be the legitimate government of the nation.\n\nThey have done just that, in fact, as the Provisional National Democratic Government has been formed in the Greek mountains. Before any power and influence Italy can exert on its former ally ends forever, Duce Ciano has decided it is time to hold actual negotiations on its future. As our best diplomats work day and night to contact the provisional government and begin talks, a formal conference must be arranged if we are to sign lasting peace.\n\nMany ideas have been thrown around about the location of this conference, and it has now become a question of whether we want to have the upper hand by holding it somewhere we have control, or hold it on Greek land. Where shall we organize it?"
 greneg_ita_ciano.2.a:0 "In a government building in Athens."
 greneg_ita_ciano.2.b:0 "In the battleship Vittorio Veneto, in the port of Piraeus."
 greneg_ita_ciano.2.c:0 "In the La Canea military base, in Crete."

 greneg_ita_ciano.3.t:0 "The Question of the Prisoners"
 greneg_ita_ciano.3.d:0 "For years, our endless struggle with the Greek Resistance, aside from little success in dealing with them, this war has also given us a great number of captives, that are held as prisoners in mainland Italy or Greece. Whether they are republicans, communists or monarchists, they all want to get their freedom back and return to their homeland, and so does the victorious resistance.\n\nPerhaps we shouldn't be so quick about returning them, as they could still be a bargaining chip in negotiations.\n\nTalks between the Italian government and the united front of Greek rebels continue, and it is in our best interest to have the high ground in negotiations, or at least that's what some claim. Many others have also voiced their support for showing our good will to the new regime in the Balkans, by releasing them or at least promising to do so soon. The best course of action is to be decided by expert in foreign affairs and our leader, Duce Ciano."
 greneg_ita_ciano.3.a:0 "Release them immediately."
 greneg_ita_ciano.3.b:0 "Make a promise to release them once the talks are done."
 greneg_ita_ciano.3.c:0 "Keep them as captives for now."

 greneg_ita_ciano.4.t:0 "EAM Ramps Up Activity?"
 greneg_ita_ciano.4.d:0 "The EAM has made itself notorious to the Italian forces stationed in Greece. Created by the communist party at the very start of the occupation, its aim was to become a "popular front" that would unite all ideologies to achieve a common goal the nation's liberation. This was never achieved, as most of the center and the right looked to alternatives such as EDES to join. However, that did not stop EAM from growing more and more, becoming the first resistance organization to shift from a small circle of select units and guerrillas to a nation-wide movement that encompassed every corner of the country.\n\nThe fall of the collaborationist regime in Athens has changed the situation dramatically, as the socialist organization is free to continue building up troops and influence in the government. This has made some people in the cabinet and the army rather worried, even afraid that it puts the carefully built order in the Balkans in danger.\n\nRecently, we were approached by a group named the "Sacred Bond of Greek Officers", also known as IDEA. They are a group of ambitious military commanders in the mess that is the current Greek army, and they have dedicated themselves to fighting communism. They have been the ones to inform us of the latest EAM operations, and have even offered to help in the investigation.\n\nThe troops of the National Liberation Front, especially active in the mountainous areas of Greece, have amassed significant support and are possibly preparing an offensive, both literally and figuratively, to seize control of the Provisional Government. The Servizio Informazioni Militare has been assigned to finding information about this threat, but has found nothing so far and would require deployment in Greece to figure out what's going on. At the same time, IDEA still wish to lead the charge in the investigation without raising much suspicion."
 greneg_ita_ciano.4.a:0 "Order SIM to thoroughly investigate the case."
 greneg_ita_ciano.4.b:0 "It'd be preferable to use the valuable resources on something more important than this"
 greneg_ita_ciano.4.c:0 "Contact IDEA so they can lead the operation."

 greneg_ita_ciano.5.t:0 "Military Presence in Greece"
 greneg_ita_ciano.5.d:0 "As negotiations continue between Rome and the united front Greek insurgents, a tough question has been set by the other party: what shall be the fate of the Italian presence in their country?\n\nEver since the Second World War, when Italian troops completed their glorious invasion, dozens of military bases, installations and outposts were established, with the goal of protecting the collaborationist regime from both internal and external threats, and maintaining order in general. Obviously, this mission has failed, as is evident by the fact we are currently negotiating with the new regime that overthrew our allies. Still, the question of what our garrison force will do once Greece gains its full independence remains.\n\nThe Greek negotiators have been quite insistent on Italian withdrawal from their soil, but there is still room for deciding the exact details of that. For example, High Commissioner Mascherpa has suggested a program by which Italian military presence will be reduced to 30% of its original size. This way, we might be able to appease the Provisional Government, but still maintain some troops there. Of course, there are always more extreme options..."
 greneg_ita_ciano.5.a:0 "Agree to withdraw all troops within a year."
 greneg_ita_ciano.5.b:0 "Agree to significantly reduce our presence."
 greneg_ita_ciano.5.c:0 "Our bases in Greece are all staying there."

 greneg_ita_ciano.6.t:0 "The Cyprus Question"
 greneg_ita_ciano.6.d:0 "The island of Cyprus, which has a Greek majority population, was awarded to the Hellenic State with the conclusion of the Second World War. It could be considered a compensation given by Italy in exchange for the territorial losses the nation experienced, but now, the drastic changes in mainland Greece have made the "Cyprus Question" surface in international affairs again.\n\nThe delegation with which we are negotiating was the one to bring up the matter of the island, citing that it is technically Greek land - even though in reality, the Italian garrison held most power. Their proposal was the maintenance of Enosis, the term for the union with Cyprus, as a concession by Il Duce. What we have mentioned as a counterpoint is the great difference between the situation there and in Greece itself. While the partisans have seized control of the mainland, Cyprus is still under our firm control. Even though EOKA, the radical group advocating for Enosis, has intensified its activities as a result of the victory of the resistance, it has not been enough to force us to evacuate.\n\nThe possibility of a democratic plebiscite has also been considered by diplomats of both countries. A referendum organized jointly and held under the supervision of our garrison seems like a good middle ground, and it would show our commitment to liberty and justice. However, we should keep in mind that, if the Cypriots are given a choice between staying in the Empire or joining Greece, the majority will likely vote for the latter."
 greneg_ita_ciano.6.a:0 "Enosis will be fulfilled, as a concession."
 greneg_ita_ciano.6.b:0 "Organize a plebiscite."
 greneg_ita_ciano.6.c:0 "Make no promises regarding the island."

 

 greneg_ita_scorza.1.t:0 "Greece Erupts Into Insurrection!"
 greneg_ita_scorza.1.d:0 "Democracy has failed once again, this time, in the place of its birth. The coalition of various rebel forces that overthrew our puppets in Athens have not been able to unite behind a strong leader and as such, have predictably fallen into infighting and chaos.\n\nWhile no one in Italy would shed a tear for the gaggle of rebels and opportunists that have turned on each other, the situation is worrisome. Greece is a nation that is within the traditional Italian sphere of influence, whose loss would not only deprive the empire of another market and its resources, but would also potentially destabilize its Balkan neighbors.\n\nIt's clear that intervention is the only choice, Italy's prestige demands it, but high command is split on how to proceed. Until the situation solidifies, everyone agrees that a defensive posture is needed, and to this end, two plans have come to the fore.\n\nThe first would establish what is referred to as the "Sulla Perimeter" around the City of Athens. A precarious position and difficult to hold, but our continued occupation of the city would prevent any of the rebels from gaining legitimacy by taking the capital.\n\nThe second is the "Salamis Perimeter", where we create a flexible and easily defended perimeter around a section of the Aegean Retreat, which we simply hold until the situation becomes more clear and we can begin to make plans.\n\nUltimately, the final decision falls to the Duce."
 greneg_ita_scorza.1.a:0 "Approve of the Salamis Perimeter and retreat to Piraeus."
 greneg_ita_scorza.1.b:0 "Defend Athens and establish the Sulla Perimeter."

 greneg_ita_scorza.2.t:0 "Formulate A Contingency Plan"
 greneg_ita_scorza.2.d:0 "With the situation rapidly deteriorating on the Greek Peninsula, simply holding the line against the rising tide of chaos is only delaying disaster. If Italy is to restore order to Greece and secure her sphere of influence, an offensive strategy will need to be formulated and agreed upon.\n\nOne major wall that high command has run into is whether or not we should recruit and involve collaborators from Greece in the operation. While this is standard practice for Italian interventions in other regions, the fact of the matter is that every time that the Italian Empire worked with Greek collaborators in the past, they'd gotten burnt for it. In fact, even the rebels they were planning against right now had former collaborator elements as part of the rebellion.\n\nA number of hardliners argue that the plan to restore order to Greece cannot involve Greeks, and that their presence will only subvert and compromise any attempt to keep the Peninsula in check. Then there are those who are of a more conciliatory mind, accepting that the Greeks had proven untrustworthy in the past, but arguing that the downsides to an only-Italian operation outweigh the problems that involving the locals on the campaign and occupation would cause.\n\nEither way, Italy will face fierce opposition from an incensed and defiant Greek people, but this decisions could make the difference between a stable, friendly Greece, and a hostile, mutinous one. No one knows which path will lead where, though, and the Duce will need to make the final call."
 greneg_ita_scorza.2.a:0 "If we aren't working alongside some familiar Greek faces, the people will only resist harder. We need the Collaborators."
 greneg_ita_scorza.2.b:0 "The Greeks have had their chance, and they refuse to behave. We will handle this in the Italian way, and leave the Greeks out of it!"

 greneg_ita_scorza.3.t:0 "Issue an Ultimatum"
 greneg_ita_scorza.3.d:0 "We have ships moving into position to the east and south of Athens, and boots on the ground are starting to gather on the Hellenic coast while the Royal Air Force dominates the sky above the turbulent peninsula the rebellion has taken control of. It's going to take some time, but we will soon be ready to move against the rebels, but before we do that, we ought to draft and deliver to them a list of demands. If we can avoid a fight, we should do so.\n\nOf course, it's easy to decide on the bulk of the demands. The standing Greek rebels will stand down, Italian forces be allowed to re-establish control over the peninsula, the formation of a new government underneath Italian supervision, that all is well and good. But the question of amnesty has proven to be difficult to come to an agreement on. Some argue that we need to take a hard-line stance against the ringleaders and generals of this rebellion, if we are to prevent the same thing from happening again, or happening in other parts of the Empire's sphere of influence. Others argue that an offer of amnesty would- should the leadership of the rebellion refuse, allow disillusioned and forward-thinking generals to defect safely and make the campaign that much easier.\n\nSeveral Greek leaders- in particular, notable Security Battalion veterans and other former collaborators- have already expressed interest in laying down their weapons in exchange for guarantees from the Empire, one such leader has even suggested that he could mediate negotiations between the two sides. These statements only serve to both enrage the hardliners, and simultaneously encourage the more lenient commanders."
 greneg_ita_scorza.3.a:0 "Amnesty will prevent a great deal of needless bloodshed and allow us to begin the statebuilding process more quickly."
 greneg_ita_scorza.3.b:0 "If they wanted mercy from the Empire, perhaps they should have considered that before taking up arms against us."

 greneg_ita_scorza.4.t:0 "Orders ot the Regia Marina"
 greneg_ita_scorza.4.d:0 "From the bow of the Impero, Athens looked much smaller than it had when he'd left it. Then again, Admiral Luigi Mascherpa hadn't expected to ever return to the city. He only wished that it hadn't been in order to hold a gun to its head.\n\nThe bay south of Athens was littered with the cruisers and destroyers of the Regina Marina, as well as the occasional supply convoy making its way towards Hellas to supply the Royal Army present there. For simple police action, the sight of it conjured long-buried memories of the sounds and smells of the World War.\n\nThe Admiral peeled his eyes from the city and to the man in charge of the operation, Admiral Antonio Legnani. A cruel and harsh leader by all accounts, but those traits were expected out of a submarine captain, no matter how high they rose afterwards. Even still, Mascherpa made his appeal.\n\n"I strongly urge you to reconsider this, Admiral. Th-"\n\nLegnani interrupted, as he often did during these conversations. "Do you now? I must not have noticed the last hundred times you urged me, but now that it's a strong urging..." His mouth twisted into a mocking smirk as he spoke.\n\nWith an accusing finger gestured at his fellow admiral, Mascherpa's voice rose. "The Impero is clearly visible from the city, the Hellenes see the guns, they see the ships, our point is made! There's nothing to gain and much to lose by shelling the city!"\n\nLegnani shook his head as his eyes turned out towards Athens. "What good is a threat if they don't believe we will follow through with it? I think your time among the Greeks has made you sentimental, admiral."\n\nThis wasn't the first time that Legnani brought up Mascherpa's time as the High Commissioner in Hellas, but that didn't stop him from taking the bait. "It is not sentiment, only practicality!" He spat back. "We'd only serve to embolden the rebels and drive more Hellenes to join them!"\n\n"And is this simply a civil disagreement? We're here to punish Greeks, not befriend them." He turned on his heels before Mascherpa could respond. "Besides, it's too late. I've already requested permission from the Duce. Best hope the Duce loves the Greeks as much as you do, my friend." Mascherpa could practically hear the condescending smile on his face as he walked away."
 greneg_ita_scorza.4.a:0 "We're here to keep the peace, not rack up a body count. Let the presence of the guns speak for themselves."
 greneg_ita_scorza.4.b:0 "Open fire and let the Greeks know the cost of defiance."

 greneg_ita_scorza.5.t:0 "Orders to the Regia Aueronautica"
 greneg_ita_scorza.5.d:0 ""In the Spirit of the Ancient Bond between Rome and Hellas, lay down your arms!" Was written in bold, Greek letters beneath a colorful drawing of two hands shaking, each of them showing the colors of the Italian and Greek flags. As gaudy and ostentatious a thing as Ernesto Botto had ever seen.\n\n"Always with the Ancients..." He muttered as he pinched the bridge of his nose with his free hand, handing the flyer back with the other. He shifted his weight onto his right leg, the sound of the iron prosthetic causing the floorboards beneath him to creak quietly. "When did we turn from an Air Force to school teachers?"\n\n"I just thought they might be more receptive to-" The man from Ministry of Popular Culture began to make his retort, but Botto was already walking away.\n\n"We need to remind them of their hopeless position, paperman," called back Ernesto "Iron Leg" Botto on his way out the door, "not of factoids. Try to have something worth its ink when I return, or else explosives may replace your papers."It wasn't a long walk from the offices to the armory, though to call either makeshift, hastily erected front line structure by their name felt severely inappropriate. Botto gave the doorless frame of the building a knock as he entered, seeing that there was no one to greet him, he made himself at home instead.\n\nBombs were lined up against the far wall of one of the few additions onto the building made out of concrete, bombs that should they be needed, would blast Athens to rubble. But something seemed... Off about them. Upon closer inspection, the reason became obvious. Painted on each of the bombs was a seemingly personalized message.\n\n"Stay in Your Caves" on one, and "This One's for Gotzamanis"; "Augustus is Back" sat next to "Pyromaglu! Suck my Cock!". Apparently, the pinnacle of wit and cleverness that you could expect out of Italian bomber crews.\n\n"Commander! I didn't hear you come in!" Piped up the quartermaster, scrambling up behind Botto, only to follow his gaze and realize what Iron Leg was reading, and his complexion began to whiten.\n\n"I am... Curious, quartermaster. What exactly is the value in these... Writings?"\n\n"Insults to demoralize the Greeks when we bomb them, of course."\n\n"I see. And... They are supposed to read these... When, exactly?" Botto turned his gaze back to the quartermaster, who had no response save to rub the back of his neck nervously. "Just get the men back to work, we need to drop something, and if it isn't bombs, they may very well be papers instead.""
 greneg_ita_scorza.5.a:0 "The new batch of Leaflets turned out much better."
 greneg_ita_scorza.5.b:0 "The bombs were prepared in record time."

 greneg_ita_scorza.6.t:0 "Orders to the Regio Esercito"
 greneg_ita_scorza.6.d:0 "For the time being, there was a small piece of Greece that belonged to Italy. From the Italian-dominated waters of the Aegean marched the Boots of the Regio Esercito. While for now they had to set up shop along the barren coastline of the Aegean Retreat, the time for organization was ending, and the time for action was beginning.\n\n"It is always better to act in reply." Two men marched along the coast, two of the principal commanders of the upcoming battle, named Operation Corinth, Enrico Martini and Tito Agosti. The two men could not be more different, and that was reflected in the argument that they currently had.\n\n"Reacting is what you do when you are on the defensive, Martini. In case you haven't noticed, we are the invaders here." Agosti retorted, a finger pointed towards Martini's chin.\n\n"And what more would a partisan love than to see a column of tanks roll right into their traps? We should hold and let the rebels show their hand, they will no doubt be eager to retake the land we've occupied already."\n\nAgosti looked out and into the Greek interior, before gesturing broadly to the vague silhouette of Piraeus's harbor in the distance. "Look at it, Piraeus sits there, ripe for the taking. It is near enough that we don't need to fear your terrifying partisan, and its fall will send a signal to the rest of the rebels."\n\n"It's a foolish decision. There's no point in taking Piraeus without having some idea of the ability of the Greeks to make a counteroffensive. We'd only be overextending ourselves!"\n\n"We could extend ourselves along the whole of Greece if we should wish it. You underestimate your own men, Martini."\n\n"I'd rather underestimate my own gun than underestimate the gun pointed at me.""
 greneg_ita_scorza.6.a:0 "Steady... Steady... Wait for it..."
 greneg_ita_scorza.6.b:0 "Let them know what we've got in store for them."

 ita_gre_bad:0 "§RThis will draw Italy closer to war with Greece.§!"
 ita_gre_good:0 "§GThis will draw Italy farther from war with Greece.§!"

#Ideas
 GRE_elusive_resistance:0 "Elusive Resistance"
 GRE_elusive_resistance_desc:0 "Despite numerous efforts by the Hellenic State and the SIM, the Greek government and Italy have barely any idea about the current status of the Greek resistance - which groups are most active and where remains a mystery. While major partisan organizations like communist EAM and republican EDES are a known and dangerous threat, other resistance groups, such as monarchist Organization X, prefer to work in the shadows, and there might even exist some organizations whose existence is completely unknown."
 GRE_elusive_resistance2:0 "Elusive Resistance"
