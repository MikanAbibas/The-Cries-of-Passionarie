ITA_RED_rodano.119.t: "Discord in the Forum"
ITA_RED_rodano.119.desc: "In the past weeks, the people of Rome had noticed a pattern. The buildings on the major avenues had long been canvas for various political messages, the sites of fascist posters long since torn down and revolutionary graffiti of various kinds in the early days of the revolution. Since Rodano's government had solidified, the posters had promoted the official party line of reconciliation with the church, class struggle, and the gradual development of socialism. But recently new posters have appeared.\n\nOn the side of a grocer's one poster depicted Christ holding in his embrace a peasant and a landlord, bringing them together under him. The text beneath read "Everyone Can Have Bread And Peace". To most it may seem benign, but to adherents of the party line it was an alarming call for class collaboration.\n\nLater posters were far more overtly subversive. One was divided into two panels. The first showed a map of Italy with the Vatican huge in the center, with chains radiating from it, wrapping the whole country. The second panel showed the Vatican being destroyed by a hammer and sickle. The meaning of this poster was immediately obvious to everyone who saw it.\n\nDespite their subversive character, the posters have so far remained up, and continue to become more numerous."
ITA_RED_rodano.119.a: "Our control begins to fray."

ITA_RED_rodano.120.t: "Popular Reaction"
ITA_RED_rodano.120.desc: ""Satan has assumed many forms over millennia. His minions have been in many forms. Their oppression of the human race has ranged from idolatry to demonic idols, to the pharaonic oppression of the Israelites to the mockery of the so-called 'Reformation'. Today, Satan has found his perfect vector for oppression. The governments of Europe divested of their pious monarchs have become dens of anti-Christian monsters. Adolf Hitler, Nikolai Bukharin, and so many others attack our church from their ephemeral rallies of acolytes and within the halls of power..."\n\nThe priest of the small Italian town spoke with a slow, steady, definitive tone. His congregation sat in rapt attention, hanging upon his every word as if they were the difference between salvation and damnation. Others, those who only came for the sake of appearances, mostly the stalwarts of the new regime sat in stoic if slightly appalled silence. Some shared glances and rolled their eyes at this comical display of reactionary clerical mania.\n\nYet some of the more astute among them knew what their lives would be like after this, and they avoided the hate-filled eyes of their fellow parishioners, a deep fear permeating in their minds.\n\n"Rome has once more become pagan. Our Most Holy Father lives under siege from the satanic Bolshevik forces. His armies have exiled all faithful men who attempted to stop him, and he and his demons are surely giggling with glee in Hell. Yet they cannot subvert our souls if we do not let them. We can resist them. We should not pay for the sins of satanic leaders, however their minions should; do not pay their merchants, their products are dirt to you...""
ITA_RED_rodano.120.a: "Let them know the wrath of the Church body!"

