# New Focus Stuff
ITA_RED_the_great_unifier: "The Great Unifier"
ITA_RED_the_great_unifier_desc: "Franco Rodano's ascent to power within the People's Republic of Italy has been met with both controversy and relief from the country's varied political factions. While most see him as a moderate among Italy's communists this perception also marks him out for special criticism and opposition from more radical figures in the Italian Left who view Rodano as slow-peddling the revolution, if not being secretly opposed to its total success. The broader Italian populace still have a positive view of Rodano however, seeing him as a pragmatic leader who saved Italy from the encroaching menace of nazism. It is as the unifier, the moderate, the pragmatist that Rodano leads the Revolution and the People's Republic, never as the ideologue, the firebrand or the fanatic.  "
ITA_RED_the_great_unifier_tt: "This will enable the §wChurch and State§! mechanic, allowing us to influence the §xCultural Revolution§!."
