ITA_RED_enhancing_our_image: "Enhancing Our Image"
ITA_RED_enhancing_our_image_desc: "Despite our victory over the German invasion, Communism remains a slightly dirty word in Italy and our government's popularity is not what it could, or indeed should, be. Conservatives grumble calumnies under their breath before hurriedly checking over their shoulders, moderates complain about the pace of the changes we have instituted, while our fellow leftists criticize us for "intolerable ideological moderation", by which they presumably mean insufficiently destructive radicalism. In order to fulfill our policies and the Revolution's promise, we must improve our popularity and marginalize the opposition before their combined critiques sink our government."
