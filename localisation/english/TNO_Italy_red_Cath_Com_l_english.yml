ITA_RED_unto_the_see: "Unto the See"
ITA_RED_unto_the_see_desc: "Despite the Catholic roots of the Communist movement that swept Rodano into power and the continuing influence, if not dominance, of Catholic Communists within the Italian government, relations between communism and the Catholic Church remain icy. The poor state of relations is unsurprising given the longstanding mutual hostility between the Church and the communist movement, but Rodano is ready to turn the page to a new era.\n\nIt is the cautious and moderate Rodano who will be able to reconcile with the Church and truly merge Catholicism and Communism into a single movement working for the betterment of all mankind and the creation of God's Kingdom on Earth. It will not be easy but to the Catholic Rodano this is a challenge well worth undertaking."
