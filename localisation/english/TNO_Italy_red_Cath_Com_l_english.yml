ITA_RED_rodano.110.t: "Sunday Sermon"
ITA_RED_rodano.110.desc: ""... and it was unto the settlements of Sodom and Gomorrah that the Lord turned his gaze, and what he saw displeased him. Hedonism and pride had enraptured the two great cities, driving a wedge between them and the light of God. Accepting sin as their guiding principle, they only damned themselves."\n\nThe priest turned to his congregation, his face showing paternalist concern.\n\n"Children of God, sin is like a cancer at the heart of any society. For those who turn away from the path of righteousness, who see themselves as supreme in God's earthly realm, there is only a road to damnation. This is a lesson we should not soon forget, for in our own nation, which was once the beating heart of piety and virtue, arrogant and foolish men seek to reject the lord and tear our community asunder. These insolent youths, who sit in Rome so close to His Holiness, reject the very foundation of faith, seeking instead material satisfaction and sinful exploitation disguised as reforms."\n\nThe priest became more enthusiastic as he spoke, anger and desperation lashing out like the sea against a stone cliff.\n\n"And what did the Lord do? How did he cleanse Gomorrah? He sent his angels, who spoke to Lot "the outcry against its people has become great before the Lord, and the Lord has sent us to destroy it!" My children, we must seek out these angels who will deliver us from sin. Surely there must be those in Italy who can lead us away from this path! It is our duty as Christians to aid them, to be those good souls that Abraham sought to find, that way we may be spared the Lord's judgment when it comes to pass.""
ITA_RED_rodano.110.a: "We need to shut this rhetoric down. Quickly."

