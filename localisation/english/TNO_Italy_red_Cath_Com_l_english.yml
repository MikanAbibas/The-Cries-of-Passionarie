ITA_RED_rodano.116.t: "A Night at the Rodano Household"
ITA_RED_rodano.116.desc: "Franco Rodano met his wife, Maria Lisa Cinciari Rodano, when they were resisting the Fascist government during the second world war. Attracted by a combination of their mutual ideals and respect for one another, they married soon after, cementing both their affection and their political alliance.\n\nRodano thought about all of this as he settled down into his evening routine, drinking tea while discussing political developments with Maria. The topic of conversation mostly dwelled on the creation of a state sponsored art gallery in Sicily, and the two like always had extremely similar yet slightly diverging opinions on the matter. As per usual, it was these differences that the two lovers enjoy debating about, finding great satisfaction in engaging in good faith discussion, something that had become a rarity as of late.\n\nRodano's mind began drifting, wishing that all his fellow party members in the PCI were more like Maria. Oh how splendid it would be if everyone were to realize that they share a common goal, and destructive dialogue only damages the revolution! A moment of contemplation later, his 14 year old daughter Giulia walked into the room and tugged at his arm.\n\n"Papa, you and mamma have been talking for hours. You two are so annoying, let us sleep! Stop talking and go to bed!"\n\nRodano looked at his daughter, then at his wife, and smiled. For a brief moment, he forgot all about his problems, enjoying the presence of his family. Not saying a word so as to obey Giula's command, he picked her up and put her back in bed. Exaggerating his silence to comedic effect, he mouthed "goodnight" to his children, kissed his wife on the cheek, and promptly went to his bedroom to tuck in for the night."
ITA_RED_rodano.116.a: "No matter how far we go, we always return home."

ITA_RED_rodano.117.t: "The Feminist Pillar"
ITA_RED_rodano.117.desc: ""Maria, you know that I endorse a more feminist approach to policy making, it's the Old Guard bastards pushing back, not me. And not to mention the traditionalist groups outside the party..."\n\n"Franco, you are the president, you control the narrative, not them! I'm not asking you to perform the politically impossible, I am just as pragmatic as you are.  All I ask is that next time the Central Committee convenes, don't forget the thousands of women that helped you rise to the top."\n\nPresident Rodano stood looking at the woman in front of him, completely sympathetic to her but also knowing the constraints already placed on him by Italy's more entrenched conservative social views. It seemed like razing the entire economic system to its foundation and replacing it with a socialist one was more palatable to the general population than legislating minor social reform. He sighed, then smiled impulsively.\n\n"You are one of my few trusted allies in this wild, lawless political landscape, Maria. For you and the many mothers and daughters of the world who have toiled for so long, I swear that they will not be forgotten." Rodano pulled out a stack of papers from his case. "In fact, I want you to take a look at the policies I plan on introducing next week, and I want you to put a feminist spin on them. I trust your judgment better than my own in this."\n\n"So do I." Maria spoke before grinning in return. She then quickly snatched the documents and began to leave the room.\n\n"One last thing Maria...""
ITA_RED_rodano.117.a: ""You're a great ally, but also the perfect wife.""

