Rodano_mech_info: "Italy lies between two shifting influences: The §RPartito Communista d'Italia§! and the §wCatholic Church§!.\n\nWhile both organizations have historically been at odds, the §wCatholic Communist§! government of Franco Rodano seeks to create a compromise between these two groups, combining the political elements of communism and the theological elements of Catholicism.\n\nAs the influence of the §RPCdI§! grows, there is an increase of §VCommunist§! support as hardline factions rise in prominence, an increase in §xMilitant Approval§! as such factions support your government more, and an increase in political power as the state gains more power.\n\nIn contrast, with more influence gained by the §wVatican§!, there is an increase in §SProgressivism§! support as moderate groups become more influential in Italian politics, a decrease in the threat of §gReaction§! as those cautious to our government relax, and an increase to GDP growth as Italy becomes more appealing to investors.\n\nAs the government becomes neutral, with equilibrium between the two sides, there is an increase in stability and a decrease in §eRed Terror§! as a result of the mediation between both sides and an increase in §RSocialist§! support as Rodano's faction grows. If this equilibrium is unsettled, political infighting may emerge..."

