ITA_RED_church_and_student_wrangling: "Church and Student Wrangling"
ITA_RED_church_and_student_wrangling_desc: "Political chaos is still very much present in Italy. While that chaos is no longer outright violent like it was during the times of the revolution and the German invasion, it still leaves a situation that is far from ideal.\n\nRevolutionaries associated with Giovanni Scuderi and the Student Brigades continue to agitate for further revolution, frequently to dangerous and even counterproductive extents. Left unchecked and who knows what damage they could cause.\n\nMeanwhile, conservatives and reactionaries flock to the Catholic Church as a rallying symbol against our new republic. If they are not brought under control, they could prove an existential threat to the revolution.\n\nIt is left up to Gallo to decide how to end this struggle, despite the mixed feelings both factions have for him. For if Gallo does not decide, then the chaos will only continue to grow."
