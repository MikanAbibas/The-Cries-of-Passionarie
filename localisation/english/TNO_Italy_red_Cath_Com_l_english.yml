###=====|a) Gallo Events |=====###
red_italy.106.t: "The Red Priest"
red_italy.106.desc: ""And the president of the revolutionary government is... Andrea Gallo," The delegate counting the ballots announced in a loud, clear voice, prompting polite applause from all assembled. The outcome was an unusual one, the product of desperate backroom dealings to forge a compromise between the Rodano and Labor cliques within the party. It was with a warm, almost beatific smile, that Don Gallo took the rostrum.\n\n"Gentlemen and ladies, comrades, it is my honor to lead this government of national unity at a time when storm clouds are on the horizon and Italy stands at the crossroads. I shall strive to be a capable and honest leader and I trust that if I falter I have the right advisors to correct me..."\n\nThough he strived to remain positive as he gave his inaugural speech, doubt nevertheless crept in. He was well aware his accession to the presidency came as a product of compromises between those more powerful than him. He would be their figurehead and puppet even as their conflict continued in the backrooms of government.\n\nGallo erased the doubt as best he could, reaffirming to himself that this was the best and only way that he could advance radical change within the Church as well as broader Italian society. Though they had their disagreements, he felt optimistic that Rodano and Labor would see the sense in aiding the poor and ending the scourge of poverty. Common ground would be found and change would come.\n\n"Thank you for your vote of confidence and I hope to make you proud. May the Revolution continue and Italy benefit!" He withdrew from the stage, his mind already spinning with the import of his new role. He would have to be careful and courageous but he knew God would provide him with an opportunity."
red_italy.106.a: "A public servant, in the truest sense."
ITA_RED_gallo.1.t: "A Reasonable Choice"
ITA_RED_gallo.1.desc: "After a long day of debates the assembly delegates filed out of the hall exhausted. The division between Livio Labor's unionists and Rodano's party faction was becoming very apparent to all involved. Several times throughout the day passions and resentments had broken through the veneer of revolutionary camaraderie, early signs of the rancor growing between the parties. Delegates Marcelo Canali and Federico Fabrizi, a Rodano man and Labor follower respectively, did not allow the growing partisanship to prevent their nightly meeting.\n\n"At the rate things are going, I expect the revolutionary government will collapse from factionalism within months. Mutual suspicions are distracting us from the need to stay united in the face of capitalist and fascist aggression," Canali said, taking a long sip of his beer and trying to enjoy the cool evening air.\n\n"You're optimistic my friend, I think we'll make it another week or two," Fabrizi replied, his humor tended to be darker than his cheerier friend's. "We need someone who can unite the government, inoffensive to either faction..." Canali nodded his head, a thought seeming to coalesce.\n\n"What about Gallo? No, I'm serious. The priest who led the storming of Rome would be an electrifying choice for the people, and we can agree he would be carefully managed by his advisors..." Fabrizi felt a smile spread across his face as Canali spoke, the possibilities multiplying in his mind.\n\n"I'll mention this idea to some of the other delegates. If they're receptive, I'll take it to the leadership, will you do the same?" Fabrizi asked as Canali nodded in response. With a final hearty handshake the two men parted, each ready to forge the compromise that would save the revolution."
ITA_RED_gallo.1.a: "The negotiations begin."
ITA_RED_gallo.2.t: "The First Step"
ITA_RED_gallo.2.desc: ""And we approve the appointment...unanimously!" Rodano's voice dominated the conference room as the government of Italy approved the new ministerial selections of the unity government. At the head of the table, Gallo signed the appointment handed to him, the name blurring before him. Rodano was pulling the man's strings, and Gallo would not have him as an ally.\n\n"Next on our agenda is the replacement of Foreign Affairs minister Arrigo Cervetto with Comrade Eugenio Reale. We respect Cervetto for his excellent work, but it is time that we put another hand at the wheel-" Gallo took the opportunity to break in.\n\n"If I may speak, Comrade Rodano, I would advise against such a replacement. As you said, Cervetto has performed well. His position reassures the anarchists within Italy that we are not deaf to their concerns. It is a matter of national unity." Though Gallo was speaking the truth, he also felt an ideological kinship with Cervetto, both sharing an admiration for underdogs. He wanted, needed, another ally.\n\n"I think President Gallo makes a fine point. We should always concern ourselves with maintaining national unity." Giorgio Amendola offered, eyeing both Rodano and Labor. After a brief moment of silence where tension reigned, Labor and Rodano each gave a small nod of assent.\n\n"Thank you, gentlemen!" Gallo said, a smile breaking out across his face after his first victory since his election. He would not be a puppet of these men if he could help it and securing another ally in the room was the first step. Gallo had hopes for bringing change to Italy, the sort of radical redirection that the country needed and he could not do it with Labor and Rodano handcuffing him."
ITA_RED_gallo.2.a: ""Very well, Comrade Cervetto remains...""
ITA_RED_gallo.3.t: "Through the Valley of the Shadow of Death"
ITA_RED_gallo.3.desc: ""And so, comrades," The general said as he wrapped up his briefing of Red Italy's leadership "German forces have breached our frontier at multiple points but we believe it is possible to stop them." The atmosphere within the war room was frenetic as Rodano, Amendola and other key figures of the government began planning their next move. Andrea Gallo, the figurehead leader brought their conference to a halt with a quiet order to his assistant.\n\n"Emilio, please begin preparing to journey north. We have a mission." There was steel in his soft voice even as others rose to contest his decision.\n\n"President Gallo," Rodano began in conciliatory terms, hoping their shared faith would enable his appeal "I admire your courage but you best serve Italy here in the capital rather than risking your life at the front."\n\n"Leave the front to the generals, Comrade Gallo," Giorgio Amendola broke in, his craggy face revealing deep distaste for the idea "It is the duty of the civilian government to keep order on the home front, but this is adventurism."\n\n"Gentlemen, please let's be honest with one another," Gallo's soft voice clearly pierced the din. "I am aware that my role is more of a spokesman than executive and I have no talent for economics or management. I leave those to you but please grant me my vocation. Let me go to those in need, to minister to my brothers in Christ and ease the suffering from this tragic conflict."\n\nAs Don Andrea Gallo left the room not a single member of the leadership spoke in protest. A respectful silence pervaded the room, though whether it was the silence of a funeral or of a church remained unclear."
ITA_RED_gallo.3.a: "'I will fear no evil: for thou art with me...'"
ITA_RED_gallo.4.t: "Peering into the Abyss"
ITA_RED_gallo.4.desc: "Gallo was uncomfortable in his makeshift office, a dining hall in a country manor commandeered by the Red Army to serve as field headquarters. Amidst the bustling generals and ministers aides, the priest-president regretted being convinced to reside here. He had come north to stand with those braving the fire and steel maelstrom but found himself held back by the entreaties of Amendola and Rodano.\n\nInstead of ministering at the front and tending to the souls of broken men he was rubber stamping documents much as he had in Rome. His train of thought was broken by the approach of an officer, face pale beneath the dirt and dust of war.\n\n"Mr. President sir, my name is Germano Nicolini. I wish to make a report regarding atrocities I witnessed..." he seemed to swallow briefly and grow slightly paler, "committed by a militia brigade." Gallo nodded for him to continue, horror freezing his blood as the veteran gave his report.\n\n"Ever since they reached the front, these militiamen have been ruthless. They do not accept surrenders and they use German wounded for target practice." The man's eyes blazed with a mixture of regret and fury, both at their crimes and for his own failure to intervene.\n\n"They have killed civilians, President Gallo. They shot a dozen people they call 'fascist collaborators' with no trial, or proof, to speak of. I reported this to my superiors," Nicolini said, anticipating Gallo's next question "And I was told to ignore it. One said to bother him when they killed someone who mattered."\n\n"I will bring justice to them, Colonel." Gallo said sternly, his face twisted into a pained scowl by the information before him."
ITA_RED_gallo.4.a: "When justice is done, it brings joy to the righteous but terror to evildoers."
ITA_RED_gallo.5.t: "A Priest Amid Unbelievers"
ITA_RED_gallo.5.desc: "Don Andrea Gallo, president of Red Italy, walked through the busy military encampment. Naturally, in a camp of militant communists his priestly garb eventually drew the hostile attention of some of the militiamen.\n\n"Look at this Christ-fucker!" One militiaman called out, soon joined by a group of jeering peers, "How we're supposed to throw back the fascists when their agents walk among us is beyond me. At least this one is kind enough to wear a skirt to show his allegiance!"\n\nA broad smile appeared on Gallo's face, having spent much time ministering to the margins of Italian society, he was familiar with crude language. He also understood the cause for the man's hostility - the Church had been more enemy than friend to progress in history. But Gallo believed that the Church could improve, if only he could show it the way.\n\n"Come now my friend," He said good-naturedly, disarming the man's hostility with a serene smile "Were the Germans to hear my counsel, I would merely tell them to lay down their arms and to repent their sins. They have not listened, which I regret, but the task now falls to you brave men to defend Italy and the revolution." His voice grew stronger as he spoke, the militiamen's jeers dissipating in the face of his passion and conviction.\n\n"I am sure someone must recognize me as President Andrea Gallo. Yes, I am a servant of God, with hopes of turning the Church towards progress, but above all I am a servant to all men. Some here remember the storming of Rome, the fights with the fascists and monarchists during the Revolution. You know where I stood during the revolution - with the workers, the dispossessed.""
ITA_RED_gallo.5.a: ""Well, I suppose he's one of the *good* priests then...""
ITA_RED_gallo.6.t: "The Road Ahead"
ITA_RED_gallo.6.desc: "The Via San Giovanni di Verdara in Padova was a major thoroughfare, combining stores, homes as well as churches and other community centers. Though the German threat had been resisted, this road and the broader city bore the scars of the conflict. Gallo passed down the street, his eyes noticing each instance of human misfortune, even as foreign minister Arrigo Cervetto, newly-arrived from the peace talks, updated him on the final agreement reached with the fascists. Laura Balbo, a local official, also accompanied the president, always ready to answer the president's many questions.\n\nStepping gingerly over debris from the German bombings, the scale of the destruction fully hit Balbo, bringing tears to his eyes. He watched as nuns ran a makeshift soup kitchen for the surviving Padovans even though their convent lay in ruins behind them, a victim of a direct hit by a Nazi bomb. He wiped at his eyes, cursing at his softheartedness even as Balbo thanked him for his help and Cervetto pretended not to see.\n\n"I should be doing more," Gallo said,  startling both Balbo and Cervetto "The politics of the Rome unity government mean that I cannot help as I should. These sisters of the faith are doing more than me, the most powerful man in Italy..." His voice took on a bitter tone as he continued, prompting Cervetto to step forward to reassure his ally.\n\n"My friend, it was you who stood with the soldiers and the people amidst the storm of war. The militiamen remember you, not Rodano or Labor or anyone else. With your new popularity, you could pressure the party leadership, divided as they are, to bend more to your wishes..." Tossing his head towards the soup kitchen and its lengthy line, Cervetto added "For the good of the people, right, President Gallo?""
ITA_RED_gallo.6.a: ""For the people, Arrigo. Always for the people.""
ITA_RED_gallo.7.t: "Rebuilding Bridges"
ITA_RED_gallo.7.desc: "Gallo's return to Rome was a quiet affair. Eschewing the cheering crowds other men would have craved, he entered the city quietly in the back of an elderly automobile. After a long day of driving and paperwork, he was eager to rest, but had to make a final stop first. The car halted outside of a small church and Gallo slipped inside.\n\n"Andrea, it is a pleasure to see you my friend," Luigi Di Liegro, a local priest and longtime friend of Gallo said as the two men embraced and Luigi poured some tea for his visitor.\n\n"I wished to commend the work the church-led charities have done to ameliorate the suffering of the German bombing campaign. I understand you played a large role in their coordination and thank you for your service to the people. However, there is more that I must ask of you." Gallo's eyes bored into his friend's, who met his gaze steadily.\n\n"Certainly, Andrea. If you mean assisting the refugees, that is well within our ability..." Luigi trailed off and sighed "But if you wish to speak of your dreams of reconciliation between the Church and your government I remain pessimistic. Political divides within the Church have led to allegations of communist subversion and you are viewed as too radical, too unsavory to bargain with."\n\nGallo had expected this answer and appreciated Luigi's honesty, having resolved to avoid surrounding himself with yesmen. Despite this, his idealistic heart smarted from the Church's rebuke: he had dared to hope that after the German invasion the Church would have changed its mind.\n\n"Very well, Luigi. Your counsel is noted, but I will continue my efforts. The Church, obstinate as it is, must change or be made to change.""
ITA_RED_gallo.7.a: "I do not mean to break the Church, but to better it."
ITA_RED_gallo.8.t: "The Fanatics of Lombardy"
ITA_RED_gallo.8.desc: ""President Gallo? General Nicolini on line two for you, sir. He says it's urgent." Gallo smiled and thanked his assistant before reaching for the phone. Nicolini had ascended the ranks quickly and through his good character and reliability became Gallo's primary source for information within the military.\n\n"President Gallo," Nicolini's voice had a tone in it that Gallo had come to dread. "As discussed, I kept notes on the more radical militia formations when they were demobilized. Many of these veterans fell in with student activist groups. One particular group caught my eye: the Brigate Rosse, associated with Giovanni Scuderi and his hardliners..."\n\nGallo leaned forward unconsciously . Scuderi, and what he represented, was a deadly threat to Gallo and his allies' project. His nihilistic radicalism and easy sanctioning of violence would be the death of the revolution.\n\n"In Lombardy they seem very powerful. With the militiamen swelling their ranks, they have been terrorizing the local clergy, disrupting masses and even clashing with our local police forces. The other militias aren't left alone by these Red Brigades either. They've had their share of skirmishes with them as well."\n\n"What would you have of me, Nicolini?" Gallo asked, "I'm sure you would suggest martial law, but I believe that is too harsh for misguided students. I share their righteous anger if not their methods."\n\n"What do you then propose to do, sir?"\n\n"Actually understand what's happening there. I'll be in Lombardy soon enough." Gallo hung up with a terse farewell, already preparing to leave."
ITA_RED_gallo.8.a: "Into the Lion's Den."
ITA_RED_gallo.9.t: "Those Who Know Must Act"
ITA_RED_gallo.9.desc: ""President Gallo? General Nicolini on line two for you, sir. He says it's urgent." Gallo smiled and thanked his assistant before reaching for the phone. Nicolini had ascended the ranks quickly and through his good character and reliability become Gallo's primary source for information within the military.\n\n"President Gallo," Nicolini's voice had a tone in it that Gallo had come to dread. "As discussed, I kept notes on the more radical militia formations when they were demobilized. Many of these veterans fell in with student activist groups. One particular group caught my eye: the Brigate Rosse, associated with Giovanni Scuderi and his hardliners..."\n\nGallo leaned forward unconsciously . Scuderi, and what he represented, was a deadly threat to Gallo and his allies' project. His nihilistic radicalism and easy sanctioning of violence would be the death of the revolution.\n\n"In Lombardy they seem very powerful. With the militiamen swelling their ranks, they have been terrorizing the local clergy, disrupting masses and even clashing with our local police forces. The other militias aren't left alone by these Red Brigades either. They've had their share of skirmishes with them as well."\n\n"What would you have of me, Nicolini?" Gallo asked, "I'm sure you would suggest martial law, but I believe that is too harsh for misguided students. I share their righteous anger if not their methods."\n\n"What do you then propose to do, sir?"\n\n"Actually understand what's happening there. I'll be in Lombardy soon enough." Gallo hung up with a terse farewell, already preparing to leave."
ITA_RED_gallo.9.a: "To shut the mouths of lions."
ITA_RED_gallo.10.t: "A Fork in the Road"
ITA_RED_gallo.10.desc: ""This situation is unacceptable, Gallo!" The Bishop of Milan, Giovanni Colombo, barked, his red face gleaming. "The revolution that you championed has led where reasonable people said it would - with atheistic mobs ransacking churches and killing priests. Your lackeys have not lifted a finger to stop the violence, and now you show up to apologize?"\n\n"Bishop Colombo," Gallo said, trying his best to control his frustration "I share your outrage, which is precisely why I came to help in person rather than remain in Rome. The violence will end and the faith will be protected, you have my word."\n\n"Words are all very well and good, sir" Colombo replied, his tone making the honorific practically an insult "But the situation is dire, worse than you have been told. You must act swiftly, before these mobs commit another outrage." The other assembled priests echoed Colombo's sentiments, their combined voices nearly overwhelming Gallo before a roar from Nicolini quieted the room down.\n\n"My recommendation, president Gallo," Nicolini offered "Is to force a meeting between these priests and the local authorities. Extract a guarantee of protection for the Church, then back it up with military force so if Scuderi's men get an inch out of line the province can hold him accountable."\n\nIt was a neat plan, Gallo had to admit. Forcing a reconciliation and pseudo-partnership between the Church and the local government had its attraction to Gallo. However, another idea was forming in his mind. He was a priest of the streets, not some schemer orchestrating events in the backrooms of history. He almost felt that he should take his case directly to the students, to redirect their revolutionary energy. Finally, he made his decision."
ITA_RED_gallo.10.a: "Arrange a meeting with the Revolutionary Committee immediately."
ITA_RED_gallo.10.b: "I will speak to them myself."
ITA_RED_gallo_choosemediator_tt: "Gallo will take the role of the §DMediator§!, using his position to build cooperation between the church and socialists in Italy."
ITA_RED_gallo_choosestudents_tt: "Gallo will take the role of the §CFirebrand§!, leveraging radical movements to exert pressure on the institutions, §ehopefully avoiding violence.§!"
ITA_RED_gallo.11.t: "The Street Priest's Appeal"
ITA_RED_gallo.11.desc: "Again, Andrea Gallo found himself thanking God for Germano Nicolini. The general's militia contacts had been invaluable in organizing a rally to speak to all of Italy. Now, in the Piazza del Duomo in Milan, tens of thousands of students, militiamen and their leaders as well as other devotees filled the square. Gallo, standing on the pedestal that had held a statue of Victor Emmanuel II murmured a brief prayer and then began to speak.\n\n"I am heartened to be surrounded by so many true revolutionaries," Gallo began, his compliment thrilling the crowd "I see men and women who have defended the revolution, made sacrifices and truly believe in a better world for all, free of exploitation, bigotry, intolerance and poverty."\n\n"I am concerned however, by reports of disunity, disorder and even infighting among you." Murmurs, some hostile, spread throughout the crowd, but the people still listened to their leader "There are disagreements between revolutionaries on the proper paths to tread and there is also lasting resentment against the Church. Both sentiments are understandable but must be discarded before they harm the greater mission." The murmurs threatened to overcome the cheers but Gallo persisted.\n\n"I have been a steadfast supporter of our movement to build socialism since its founding. We cannot afford wasteful and divisive violence that distracts us from the proper goal of advancing social justice. This is a movement of love and equality, not violence for its own sake."\n\nGallo could feel something familiar swelling in his chest as he felt the crowd respond to him. He knew some, most likely allies of Scuderi, were chanting at him but he could feel the rapt attention and approval of the rest of the crowd. He was in his element."
ITA_RED_gallo.11.a: "A connection made and bond forged."
ITA_RED_gallo.12.t: "Blessed are the Peacemakers"
ITA_RED_gallo.12.desc: "It had taken a few calls to arrange the meeting, with a mix of veiled threats, incentives and pleadings to get each party to attend. Grouped to one side were the Church representatives, headed by the pugnacious Bishop Colombo. At the other end of the table massed the local party men and their chair Silvio Andreotti.\n\n"This situation has been allowed to go on long enough," The bishop began "Those who call for violence and those who carry it out must be arrested, or the government is endorsing this chaos."\n\n"A crackdown of the sort you want is unfeasible!" Silvio Andreotti rose to speak "We would need the Red Army to intervene as the local police are not trained or equipped to carry out such a dangerous task." This excuse prompted rumbles of discontent among the Church, the fragile truce forged by Gallo's presence rapidly collapsing.\n\n"Perhaps the honorable representatives of the reactionary church long for the days of Mussolini? This is the Church reaping what it sowed and complaining about the crop." A younger member among the local party officials called out.\n\n"Gentlemen, please!" Gallo barked, standing between the two factions. "This violence benefits none of us. It makes a mockery of your administration and defames the revolution," He said, nodding to the parties in turn.\n\n"A harsh crackdown, while appealing to some, could make the situation far worse. Instead, the Church should reach out to the student movement. Address their concerns and emphasize your charitable works. The party will support you by printing an explicit condemnation of violence in its presses, ensuring that all understand the state opposes this horrendous terror.""
ITA_RED_gallo.12.a: ""...and if it comes to it, General Nicolini will be ready with military support.""
