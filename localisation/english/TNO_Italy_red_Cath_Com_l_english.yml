ITA_RED_the_vanguard_party_desc: "All true communists know the essential nature of a strong leading force. While the masses have power in numbers, their weakness is organization and tendency towards division and infighting. To properly guide the revolution, a vanguard party composed of dedicated activists and revolutionaries well-versed in the science of Marxism is necessary.\n\nAs we have the vanguard party for politics, the Catholics have the Church for religion with the pious guided in their faith by priests. As the Catholic Church ministers to the soul of Italy, the vanguard party shall tend to its politics, leading the People's Republic out of economic devastation and into socialist prosperity."
