###=====| a) Gallo Tree |=====###
ITA_RED_the_warrior_priest: "The Warrior-Priest"
ITA_RED_the_warrior_priest_desc: "Against all odds, and with the unlikeliest of men as its shepherd our new revolutionary republic has survived the German invasion. Few would have expected Andrea Gallo to be the man to beat back quite possibly the strongest military on Earth, but for now a hard-fought victory has been achieved.\n\nNow Gallo's work shall begin in earnest. The tolls of fascism and war have left deep scars within the nation, and so Gallo must begin to heal these scars. Past wrongs shall be rectified, decades of oppression undone, and the very foundations of Italy itself remade.\n\nHowever, this work will not be easy. Gallo may be beloved by the people, and may have led Italy through the war, but he is no politician. The party remains a foreign entity to him, and many doubt both Gallo's competency, and his radical vision for change."
