ITA_RED_the_most_pressing_questions: "The Most Pressing Questions"
ITA_RED_the_most_pressing_questions_desc: "The state of industry and undoing the fascist stain on the nation are two of the most important issues facing Rodano and his allies in government. Not only is industrial renovation and expansion a key step in the transition towards socialism but the fascist remnants within the nation are a threat to our stability as well as acting as a reminder of decades of monstrous fascist injustice. Rodano shall approach both these issues with his pragmatic eye, focusing on reworking power relations and reorganizing labor to set industry right while still acknowledging and at times moderating in the face of the people's concerns. Rodano understands the importance of stability and caution in making these next moves. If both of these challenges can be approached and conquered, the future of Italy rests on far more solid ground with a brighter future."
ITA_RED_the_question_of_industry: "The Question of Industry"
ITA_RED_the_question_of_industry_desc: "The corporations established by Mussolini's fascist regime have harmed Italy's proletariat, posing as mediators of class conflict and paragons of inter-class cooperation rather than the capitalist wolves in sheep's clothing that they truly are. While the corporations stand condemned, there remain questions on how best to dismantle the fascist economic beasts.\n\nSome in Rodano's circle have pointed out that many businesses and factories separate from the corporations still operate under the old principles and that scrapping the corporations and sweeping away much pre-existing organization infrastructure will do more harm than good. More Orthodox members of Rodano's clique argue that further nationalization of the corporations would propel our industrial development forward while also wiping away another fascist stain. The choice of what to do remains in the "Great Unifier's" hands."
ITA_RED_the_question_of_property: "The Question of Property"
ITA_RED_the_question_of_property_desc: "Private property is the age-old question and controversy for socialism. While all leftists agree in principle with ending exploitation and the private-ownership of land, in practice there is plenty of disagreement over the methods and timing of enacting such a policy. For many in Rodano's circle however, conducting such a radical policy in our damaged state is neither desirable nor feasible, with some warning such a shift might cause economic and political turmoil. For others within the government however, the rewards of abolishing private property well outweigh the risks and abolition has the further attraction of being the ideologically-orthodox policy rather than another deviation from the Marxist line. As it always seems to, the final decision rests with Rodano."
ITA_RED_sweeping_nationalizations: "Sweeping Nationalizations"
ITA_RED_sweeping_nationalizations_desc: "We cannot afford any remnants of the fascist old order to remain. The best way to sweep away the rightist cobwebs away is to proceed with the nationalization of the remaining industry in Italy. Placing a large bulk of the means of production directly under the watchful eye of the state will drive out any remaining fascist influences from the Italian economy and guarantee compliance with party doctrine.\n\nAfter decades of fascism, the rot within Italy and her economy is deep indeed and radical measures are necessary. This policy may come at the cost of some economic upheaval or temporary discomfort but it is the best path forward for the revolution."
ITA_RED_retain_their_innovations: "Retain Their Innovations"
ITA_RED_the_question_of_accountability: "The Question of Accountability"
ITA_RED_the_question_of_accountability_desc: "We are faced with an important question, one that could damn our country should we make the wrong choice. A significant portion of our country are hungry for justice, to punish the class of oppressors of the last 40 years from the landlords to the bureaucrats to the police. On one hand, most of them deserve penalization, both to set a precedent of how to deal with reactionary elements and for the sake of justice. On the other hand, the revolution is over and we may not want to upset the balance we've struck. Neither answer will leave everyone happy, but we must find one that will at the very least leave everyone content."
ITA_RED_retain_their_innovations_desc: "To maintain stability and economic prosperity, Rodano's government has judged that former corporations will be allowed to act with continued autonomy and use the organizational systems that worked in the past. This mercy comes tempered with a slate of necessary reforms to undo fascism's deep influence upon the corporations.\n\nThe workers will see their voices matter in the factory and their standard of living rise but the managers and those above will maintain a significant fraction of their power and the revolution shall not quite overtake the workplace as it did so many other institutions. This compromise will infuriate the radicals within the party opposition but stability is well worth their venomous wrath."
ITA_RED_no_quarter: "No Quarter"
ITA_RED_no_quarter_desc: "Our country spent roughly 40 years under the boots of fascists, and the whole nation suffered for it. There are a number of individuals responsible for this cruelty, and it would be a tragedy not to see them in chains. We will wield the might of a vengeful Italy against them and assure their thorough and just punishment. Not only that, we must also tear down the system that allowed them to come to power. Much of the Italian middle class is still sympathetic to the old government and hesitant to make significant change, so this will no doubt cause great controversy. Even still, this is all for the best. Justice must come to the wicked, and liberty must be restored at all costs."
ITA_RED_calculated_judgements: "Calculated Judgements"
ITA_RED_calculated_judgements_desc: "We've worked to assure that the people have acclimated to our reign, but if we're not careful in our next movements, we could very well put that in jeopardy. With the amount of ties the middle class has to the old regime, an overly zealous series of punishments to ex-fascists could do just that. As such, only the truly brutal oppressors will be punished. Carefully and surely they will be removed from society and placed in cells or caskets. Any minor officials will be written off as mere accomplices, getting at worst a slap on the wrist. With proper execution, we should be able to remove the most evil men of our nation while remaining sympathetic to the common man."
ITA_RED_private_property_abolished: "A Path to Abolition"
ITA_RED_private_property_abolished_desc: "Private property is one of the worst sins of capitalism and lies at the root of much human suffering and misery across history and the world. The gravity of the crime demands a righteous answer. Thus, we have a moral obligation to pursue the abolition of private property, particularly land-holding, leading to a just and moral Italy.\n\nThis may be a lengthy and difficult process but to rid our state of an abiding sin merits paying nearly any price asked. Furthermore, our state will be stronger for pursuing abolition, once the initial shocks of the reforms have settled among the populace and the fruits of ending an era of exploitation can blossom. The moderates within the government will certainly complain, but we must at least start the long journey."
ITA_RED_finding_a_compromise: "Finding a Compromise"
ITA_RED_finding_a_compromise_desc: "The full abolition of private property is an impossible dream and pursuing it would only squander precious goodwill, turn moderates into enemies and greatly destabilize the economy. We must recognize limits and when our reach extends beyond our grasp. Adopting moderate land reform and shying away from any radical property seizures will allow a stronger alliance to form between the state and the Italian middle class.\n\nThe revolution has come to Italy, but it did not come to bring neither blood nor terror nor penury to those fortunate or hard-working. As the middle class comes to understand we do not wish for their liquidation and impoverishment, they will join in the revolution as enthusiastic participants rather than existing as a permanently hostile and alienated class."
ITA_RED_the_question_of_planning: "The Question of Planning"
ITA_RED_the_question_of_planning_desc: "Unlike many leftist states before us, we have the boon of an already industrialized country. We do not have an immediate need to centralize to build up industrial might, nor do we need to decentralize to build a healthy market. Instead, it means we get a choice whether or not to focus our planning on centralizing or decentralizing, rather than our hands being forced by necessity. We have the luxury of either centralizing to build further might and rebuilding the country without having to do so from scratch,  or focusing on a market model for a return to relative normalcy that would please moderates and the middle class."
ITA_RED_through_economic_plans: "Through Economic Plans"
ITA_RED_through_economic_plans_desc: "Italy has suffered greatly from the revolution. Whole streets have been reduced to nothing but dust and rubble, and many factories have been put out of operation, for at least the time being. In an ideal world, we would be able to give the workers full control over their industries and give them as much autonomy as they desire. However, whilst the German behemoth still looms large over our country and whilst the forces of reaction gather in East Africa, we cannot simply just give all power to the workers, as centralisation will be needed if we are to ever combat the many threats that our regime faces. Whilst this will not be as severe as in the desperate days of war communism, we will still need some power over our economy to build Italy into a  beacon of socialism that can withstand outside attacks."
ITA_RED_national_needs_private_luxuries: "National Needs, Private Luxuries"
ITA_RED_national_needs_private_luxuries_desc: "During the revolution, the general population were forced to endure many hardships. The excesses committed by troops of the King's government and sometimes even our own forces, the general collapse of the economy and society, not to mention the horrors of German bombing and occupation, have cratered the morale of the general populace. Many people may now be so weary of the chaos that they would not even try and defend our government should it be attacked. We cannot allow this state of affairs to last for much longer. To make sure that as many people as possible have access to luxuries that will make their lives comfortable, our approach to the economy will be moderate and less transformative than many planned economy advocates have argued for. This will also have the benefit of encouraging more apathetic people towards our revolution."
ITA_RED_socialism_for_the_modern_day: "Socialism for the Modern Day"
ITA_RED_socialism_for_the_modern_day_desc: "Throughout much of the world, socialism is associated not with the liberation of the worker, but with the economic mismanagement and oppression of Bukharin's regime. Instead of being attracted towards the only ideology that can truly liberate them from the shackles of fascist and capitalist oppression, many of the proletariat see leftism as just another ideology that subjugates and exploits people. To show the world that they are wrong, we must engineer a new kind of socialism within Italy. This new kind of socialism will make sure to remedy all of the errors of the Soviet Union, and truly bring freedom and equality to all."
