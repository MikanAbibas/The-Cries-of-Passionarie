###=====|b) Rodano Events |=====###
ITA_RED_rodano.5.t: "A Titration of Principles"
ITA_RED_rodano.5.desc: "Franco Rodano, head in his hands, read over the paper one final time. His lips pursed at the mention of "nationalizations of industrial capacity", imagining how that would sound to the average Italian catholic sitting at home, disdainful of the state and anxious about the massive changes that had overtaken him. His mind made up, Rodano drew a thick black line through the offending phrase, then seeing more than half the speech was similarly obscured he discarded the paper and restarted.\n\nAnother draft came and went, this one even further removed from discussing policy or ideology in any particular terms, preferring instead platitudes about equality. Disgust rose in Rodano's throat as the saccharine falseness of his speech stared back at him, hideous despite editing marks and revisions aplenty. He had tried every rhetorical trick, artful deception and misleading platitude he could conceive of. Nevertheless, the task stood before him.\n\nThe basic challenge lay in introducing conservatives to socialism. Many ordinary Italians were allergic to the word itself, the mere suggestion of socialism enough to revolt them, viewing it as the auxiliary of an atheistic and tyrannical movement of radicals. Rodano was certainly no atheist, nor was he a radical in the party, far from it indeed, but he was a socialist. How did you introduce someone to something they hate, that they fear? How can they trust you again?\n\nThe questions ringing around in his head, Rodano searched around for a draft that, with a bit of modification, would serve as "good enough". Best not to make the perfect the enemy of the good, he reasoned. After a brief survey of his efforts he selected the speech he had rejected as saccharine only shortly before. It would be a difficult introduction between Italians and Socialism, and he thought it best to tread lightly."
ITA_RED_rodano.5.a: "The editing process claims another victim"
ITA_RED_rodano.6.t: "Back to Normal?"
ITA_RED_rodano.6.desc: ""First day back, Marco?"\n\n"It's everyone's first day back, Salvatore...they only just finished repairing the factory after that German bomber scored a direct hit. It's a miracle no one was hurt, just a few managers." The old worker's witticism drew dark laughter from his coworkers.\n\n"I'm just glad to have things back to normal. The bosses up there in their offices, the foremen on the catwalk sneering down at us." Salvatore gave a horrific smile to the man watching him and his friend on the production line. The man winced and looked away.\n\n"You've heard Rodano on the radio. Change is necessary but it must necessarily be slow and cautious. We wouldn't want to be too radical in our revolution, we might change something important," Marco's bitter tone signalled his deep sarcasm.\n\n"Come on, Marco," A new worker, Federico, interjected, rising as a pious Catholic to defend his fellow "Things are getting better. You saw the news about wage hikes, cutting working hours, the new benefits they're offering if we work for more than a year. I'm glad I can still go to church, that nobody's being shot in the streets and that things are normal but better."\n\nDebate broke out among the workers, good-natured ribbing easing the tension as the political divides of the working class made themselves known. Marco, respected among the workers, managed to have the final say in the debate before the whistle blew for shift change.\n\n"Things have gotten better. And you're right that too much change too quickly could be problematic but we need change..."
ITA_RED_rodano.6.a: "...and why the hell are the bosses still up there while we're down here?"
ITA_RED_rodano.7.t: "A Hand Outstretched"
ITA_RED_rodano.7.desc: ""Your Holiness, it is with humbleness and respect that I write to you as the leader of the People's Republic of Italy. I know relations between the Italian state and the Church are poor indeed. Some in my circle urge me to leave the bridge between us burned; however I cannot help but return to Rome as a prodigal son.\n\nI count myself as a follower of the Church though perhaps not the most orthodox member of the flock. Despite the differences that exist between the Church and Italy as well as your Holiness and myself, this rift ought to be mended. Estrangement serves little but to deepen the divide and frustrate our shared duties to the people. I believe many of our goals, such as ending poverty, violence and ignorance, can be best achieved by collaboration and compromise between Italy and the Church.\n\nI am optimistic that we may come to an understanding as we are both worshippers of the same God, bound by the same principles and sharing the same moral code in spite of the differences in our positions. I understand some in the Church view the new government in Italy as hostile to the Church and religion entirely. Those marginal radicals do exist within our polity but antagonism towards the Church has never been my desire or the policy of my government.\n\nI believe in a bright and Christian future for Italy as we complete our transition from the twin evils of fascism and capitalism into something closer to the Kingdom of God. I hope that the Church will join Italy in this bright future hand-in-hand. I await your reply, your Holiness..."\n\nRodano read over the letter a final time. He had weighed each word and prayed it would be received favorably. The road had been hard, but a favorable reply from Rome would make every step taken worth it."
ITA_RED_rodano.7.a: ""Please deliver this to the Vatican immediately.""
ITA_RED_rodano.8.t: "A Grandmother's Blessing"
ITA_RED_rodano.8.desc: "If one were to search for 'matriarch' in a dictionary, a photograph of Melissa Ricci would appear. Austere, traditional and able to wither a youth's mirth with a contemptuous glare, she ruled over the Ricci family for decades as 'Cara Nonna'. She sanctioned every wedding and attended  every birth in the family, as well as witnessing each graduation and passing. A word from her was sufficient to correct any wayward family member and thus she served as the archetypal pillar of familial rectitude and conservatism.\n\nThe revolution, or 'all that trouble' as she called it, had repulsed her. There was a proper way to do things, and she did not like the talk of communism. Now, from her perch atop the Ricci family, long lower-middle class scrabblers in Genoa, in her old age she had the wisdom to admit she had misjudged matters.\n\nThe churches were still open, the priests more dedicated in their ministering and good works for the community. The businesses and stores she loved still operated and while prices had risen she could tell the difference was going into the workers' pockets. Cheery smiles and genuine camaraderie seemed to have infected much of the population and while she shook her head at the impropriety there was a genuine sense of something good in the air that even she could not deny or pick apart.\n\nPerhaps, she decided, this Franco Rodano had been more sensible than she'd given him credit for. She knew he was claimed to be moderate and a Catholic, but had believed that a lie until he proved otherwise. Her children and grandchildren were all happier, needing to work less even as their wages rose and lives improved, leaving them more time for family. Nor had the most apocalyptic predictions of her conservative imagination come to pass even as Communism appeared to triumph within Italy. "
ITA_RED_rodano.8.a: "Perhaps it will all be better this way..."
