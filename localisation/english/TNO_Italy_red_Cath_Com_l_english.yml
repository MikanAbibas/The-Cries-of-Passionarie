ITA_RED_cath_com_econ.1.t: "Damage Report"
ITA_RED_cath_com_econ.1.desc: ""Good God..." Muttered the surveyor as he wandered the city, camera in hand. This neighborhood would be more at home in the wastes of wartorn Russia than the north of Italy, he thought to himself as he stepped over a hunk of scorched rubble yet to be cleared by the construction crews in the city. Every house was crumbling, torn apart by wrathful artillery, hails of bombs and bitter gunfights. The surveyor snapped a picture of each building, cataloging the atrocities inflicted on the ancient architecture as that was his task. One house had the front of it entirely torn off, strewn across the uneven and pothole riddled street like broken glass. Snap. One house had caved in from the roof to the ground floor. Snap. One house still had shot up barricades in the windows. Snap.\n\nHe shook his head. As a boy he had been fascinated with photography, pursuing a career in it his entire life, but this was not what he was dreaming of when he accepted his diploma. As a man who cherished the beauty of architecture, the sight of a dead city wounded him. The only thought that could console him was that these photos would go toward a government report on battle damage to be used to restore all these morbid ruins to their former vitality, rather than to tear them down in favor of grim utilitarian structures that would further scar the city. Indeed, he and many others were part of an initiative that began the long march to the restoration of Italy's beauty.\n\nUnfortunately, that wouldn't be for a while. So, like an urban mortician, he continued to catalog and categorize dozens of stone corpses. Someday that flak-shredded chapel would be healed. Snap. Someday that minefield will be cleared. Snap. Someday the bodies in those shallow battlefield graves would find proper homes."
ITA_RED_cath_com_econ.1.a: "Snap."

ITA_RED_cath_com_econ.2.t: "Dust You Are and to Dust You Shall Return"
ITA_RED_cath_com_econ.2.desc: "Antonio heaved a sigh as he laid down on his cot, drenched in a day's worth of sweat. He groggily kicked off his heavy, dirt caked boots without much of a care where they landed in his little worker tenement in Trent. Despite his aching body from hours of construction work rebuilding the city, this was far from the most exhausted he'd ever been. He remembered this kind of work in his hometown down south, during the old regime. He'd return home dizzy, dehydrated and sunkissed to the cold comfort of a bottle of liquor that failed to quench nor calm him as much as it advertised. Now, however, things were different. Half hour breaks and free water didn't sound like much, but to his burning muscles and parched throat, it meant everything.\n\nBruno slammed the door behind him, slipping his boots off much more politely. He hung up his helmet, then glanced at his roommate and coworker Antonio. "You're going to bed already? It's Tuesday, party members are coming by for literacy training."\n\nAntonio rolled his eyes. "This again? You know it's just an excuse to get us to read their propaganda, right?"\n\n"Maybe. Maybe not. Frankly, Antonio, I couldn't give a damn. I just want to get a job that isn't gonna destroy my spine." Said Bruno as he walked over to his squat dresser to retrieve his Sunday clothes.\n\n"I've been to those classes, Bruno. It's all pamphlets and tracts, treating the government like the goddamn second coming..."\n\n"You're absolutely right, they're basically party meetings," Conceded Bruno, "But it's really my only chance. If I'm gonna end up selling my soul one way or another, I might as well be able to read the contract." With that, Bruno left to change. Antonio stared at the ceiling for a moment, idly tracing the cracks and water damage. "
ITA_RED_cath_com_econ.2.a: "Maybe he didn't want to be here forever, either."

