ITA_RED_rodano.101.t: "'Learning From the Past"
ITA_RED_rodano.101.desc: "Italy was not Russia. It was clear to Rodano that, despite the chaos of the revolution and the destruction of the war with Germany, the devastation wrought upon Russia by its civil war was far greater than what had been done to Italy. However, this did not mean that Italy could not take any lessons from the Soviet Union's recovery.\n\nThe New Economic Policy, implemented by Lenin and continued by Bukharin, held some of the answers. Especially in the south of the country, it would be necessary to permit some private enterprise, to help peasants grow more prosperous, and to show them the benefits of socialism.\n\nFurthermore, implementing some of the principles of the NEP in Italy would help to stabilise the country. Whilst most of the country had been pacified for some time, there was always the risk that, if pushed too hard, some peasants would be swayed by reactionary ideas, and that some might even be willing to pick up arms if the situation got too dire. If the farmers were given some concessions, then this would be avoided.\n\nSecchia's men would be against this, for sure. They would lecture him about the failings of Bukharin, and accuse him of being a revisionist. But if they wanted to keep the revolution alive, then some compromise would be necessary, regardless of how much it would cost Rodano politically."
ITA_RED_rodano.101.a: "Sometimes, compromises must be made"

ITA_RED_rodano.102.t: "Secchia's Denouncement"
ITA_RED_rodano.102.desc: "Some may applaud the new direction that comrade Rodano is leading the nation. They may say that his policies have kept the Italian economy from completely collapsing, and that reconciliation with the Catholic Church is necessary to ensure the stability of Italy. Some may even go as far as to say that the current line is the correct line for the long term, and that it is the correct way to fully realise socialism.\n\nThis would be a grave error. The economic approach that our revolution, if continued for much longer, shall eventually doom us. Just like in Russia, our state shall be poisoned by the influence of the growing class of opportunistic NEPmen, intent on stealing everything that rightfully belongs to the Italian proletariat.\n\nFurthermore, the approach comrade Rodano has taken towards the Church is practically revisionist. His practical capitulation to the Vatican has allowed reactionary elements of Italian society to fester unhindered. In time, this will lead to the formation of a fifth column, which will certainly seek a counterrevolution to restore their old privileges.\n\nI, Pietro Secchia, urge the current government to reconsider its path..."
ITA_RED_rodano.102.a: "...before the damage it is causing becomes far too great to be undone."

ITA_RED_rodano.103.t: "A Grey Market"
ITA_RED_rodano.103.desc: "Luca stared longingly at his last packet of Alfa cigarettes discarded in the street, crumpled and empty. Without them, he felt the same way. Rodano could not provide everything at once immediately, but the nicotine cravings could not wait. It filled him with a dread that was evident to passers-by as Luca would soon find out.\n\n"Hey mister," Luca heard the shrill voice first before seeing the kid. "You should see Salvatore - big guy with a red tie, he's down past the canal to the right, Salvatore will sort you out."\n\nBefore Luca could respond, the kid was gone, paying a visit to this Salvatore felt like a smarter option than feeling sorry for himself. Following his given directions and the noise, he found himself in a sprawling street market operating in plain sight, complete with desperate customers, traders assuring buyers of quality and sessions of haggling that seemed like they were going to break down into brawls. It would have been normal if this was not meant to be a revolutionary state.\n\nLuca wandered before spotting a striking figure - large and covered in sweat - wearing a once-expensive suit and a ratty looking red tie - this was his savior. Salvatore's stall contained a veritable what's what of amenities and vices in short supply, including packets of Marlboros. After a near wordless exchange, Luca departed with his sought-after cigarettes while Salvatore received a sizable part of a steelworker's weekly earnings.\n\nLuca took a drag, relishing in the carcinogens that would parole his mind for a while. He began to think back to the man who sold him the cure. Luca thought he must have been someone important before the revolution if he was able to sell authentic Marlboros instead of those cheap Alfas, the type of person who would have been strung up by a communist. Nothing about what happened felt socialist, he just hoped it would not be the new normal."
ITA_RED_rodano.103.a: "Why should petty trade be prohibited when the state can't replace these functions?"

ITA_RED_rodano.104.t: "Burning Light"
ITA_RED_rodano.104.desc: "Father Matteo stood like a titan upon the pulpit, the broad shoulders and weathered bearded face of a once revolutionary often provided comfort to the parishioners who journeyed from miles around to listen to his sermons. Yet the folk of Collesalveti were not the hardened revolutionaries of the great cities. Oh they had sided with the revolution, who wouldn't after forty years of fascism. But that did not make them friends to the communists and their cause.\n\nIt was Father Matteo who sought to change that. When he had arrived there had been hesitation, accusations of atheism even. Yet he had talked with the peasants and workers of Collesalvetti, and the congregation gathered before him was the largest it had yet been in the months since he had been assigned the posting. Mass was a facet of life for the people of Collesalvetti, it was something which was consistent in the ever changing world. Perhaps that was why they listened to a man many were unsure of.\n\nAfter the ceremony finished there were questions of course, on god and on his relationship with the works of Marx. On how they could possibly be considered to work in harmony. Father Matteo answered with the fervour of a convert, for in his own way the priest who had been a prisoner was a just that. Finding godliness in the works of the father of socialism was an unexpected occurrence, but caring for all men was never an evil deed. And through Father Matteo, the villagers of Collesalvetti were brought into the fold."
ITA_RED_rodano.104.a: "Perhaps there are friends to be made amongst the villages through the Church after all."

ITA_RED_rodano.105.t: "Fading Light"
ITA_RED_rodano.105.desc: "Father Matteo was excommunicated, that was the word on the streets of Collesalvetti. It was a shock to be sure, one exacerbated by the fact that the good father knew not of his own damnation until his replacement was knocking on the Church's great iron doors.\n\nNone knew quite how to handle the response of the holy church to Matteo's teachings, for they had made a great deal of sense to the inhabitants. Was it not good and just that all should be equal on earth as they were under god? To own land in common and ensure that those in need were taken care of?\n\nThe new priest, Father Patricio, said it was something else but some were unsure. There was none of the radicalism of the former priest in Patricio's words, merely piety and quiet words on the goodness of man. Some were relieved, for it was closer to how the church had been before, others enraged. But for most, there was simply confusion. Perhaps it would be answered in time, but for now the fire of communism united with Catholic teaching was doused in Collesalvetti. It would take some time to rekindle"
ITA_RED_rodano.105.a: "Or perhaps not."

ITA_RED_rodano.106.t: "The Cycle of Prosperity"
ITA_RED_rodano.106.desc: "A new animation studio sponsored by the Italian government, following President Rodano's funding of proletarian artists, released a new animated propaganda film titled "The Cycle of Prosperity" this month in an attempt to win over the peasant class of farmers.\n\nThe film stars the cartoon character Ajello, a farmer working in Sicily who is initially skeptical about the revolution and its effects on his personal life. He is afraid he will lose his land and will be unable to feed his family as a result of this new, strange system. He is then approached by an educated man named Lorenzo, who quells his fears by taking him on a journey exploring life before the revolution and after it.\n\nIn the past, Ajello sees how his produce was cultivated and sent to a market where he competed against much larger agricultural conglomerates. His prices are determined by them, and sometimes he isn't even able to make a sale to the businesses that purchase foodstuff. Those buyers, represented as giant leeches, then sold his produce up North at a marked up price, gouging the workers who depend on the food imports. The final picture is of two weak laborers being drained by the leeches, the only ones to prosper in the situation.\n\nIn the second scenario, Lorenzo shows how Rodano's economic policy will result in the big businesses and middlemen being cut out, so that the farmers can sell their goods at a reasonable, consistent price that also benefits the proletariat workers. The two group's prosperity builds off one another, rather than being sucked away by bloated parasites.\n\nWhile simple and a bit childish, the film was easy to understand and distribute amongst the peasant class. It also may have been full of inaccuracies and fantastical economics, but it was deemed unlikely that the target audience would be aware of such manipulation."
ITA_RED_rodano.106.a: "See? Everyone wins in the new Italy!"

