ITA_RED_preparing_the_assembly_desc: "Our revolutionary republic has won itself a lot of legitimacy after defeating the German invasion and their fascist collaborators, but that legitimacy is still only provisional.\n\nMuch work is needed to maintain that legitimacy, and rebuild a functional administration.\n\nOur first step is to reconvene the revolutionary assembly, and forge a plan for the future."
