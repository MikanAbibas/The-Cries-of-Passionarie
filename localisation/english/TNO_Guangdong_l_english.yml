POLITICS_SUZUKI_TEIICHI_DESC: "A decorated IJA officer and former head of the Cabinet Planning Board, Suzuki Teiichi was intimately involved in the construction of Japan's wartime economy and the subsequent economic planning for the Japanese New Order in Asia. An esteemed member of the House of Peers since 1943, Prime Minister Ino has named Suzuki the next Chief Executive of the State of Guangdong in order to use his Chinese experience, military connections, and economic expertise to bend Guangdong's corporations to the will of Tokyo.\n\nHis hands-on and statist approach to running Guangdong's freewheeling economy rankles the Four Companies of Guangdong, which have become accustomed to running Guangdong with minimal interference. However, the culture of corruption fostered by years of weak oversight from Tokyo - and the backing of Yasuda Bank, per Prime Minister Ino's instructions - is enough for Suzuki to keep the Four Companies in line for now.\n\nSuzuki sees a territory blinded by greed, forgetful of its obligations and unaware of the consequences of its actions. While he has no special affection for the Chinese in Guangdong, he is keenly aware that without the resources from Tokyo to maintain a strong security apparatus (as in Manchukuo), naked repression is not a sustainable solution to Chinese dissident activity. For the good of Japan, Suzuki will lay the foundations of a new, stronger Guangdong - and bring the corporate behemoths and their executives to heel."
POLITICS_MATSUZAWA_TAKUJI_DESC: "'In every crisis, lies great opportunity', so the Western saying goes - unless you're Matsuzawa Takuji, in which case the more apt Eastern aphorism might be 'the carp on the cutting board.' With Yasuda Bank being taken apart by its creditors, the political establishment, and the media in Tokyo, Matsuzawa had his hands full simply putting the company's affairs in order in Guangdong. That is, until the former Chief Executive abandoned ship, with the remaining tycoons pushing the poisoned chalice into Matsuzawa's hands.\n\nWith communications from Tokyo all but severed, Matsuzawa has not been formally appointed by the Japanese government to his position. Nor does he have the luxury of waiting: the aftershock of Yasuda's collapse and the political turmoil in Tokyo has left Guangdong's budget deep in the red, scaring investors even as the local populace turn to crime and vice to make up for lost wages. The remaining tycoons jockey for position with honeyed words and convenient 'plans', no doubt aiming to become Chief Executive themselves once the dust clears.\n\nAlthough Matsuzawa savors the clarity of knowing that his assignment to Guangdong was the work of a corrupt cabal working against him, the fallout from their schemes has led to his entire life's work crumbling to dust around him. There is no coming back from this, no matter how innocent he was; he is a dead man walking, and all he can do is to keep it all together until the curtains close."
POLITICS_MORITA_AKIO_DESC: ""The Gadgeteer of Guangdong." "The Man Who Fought the Zaibatsu." "The Japanese Washout." Morita Akio is known by many names, all of which are true to a degree. Despite his prestigious origins - a graduate of Osaka Imperial University and a member of the IJN's Wartime Research Group - Morita washed ashore in Guangdong after a falling-out with his once-friend, Ibuka Masaru, over the acquisition of Tokyo Telecommunications Company in 1952.\n\nWith little more than memorized schematics - and the assistance of his long-time associate, Li Ka-shing of Cheung Kong Enterprises - Morita clawed his way back up the corporate ladder in Guangdong in the 1950's, selling high-quality audio-visual electronics in Guangdong and the Republic of China. With Sony's accession into the Four Companies in 1960, Morita became the lone voice of reform, fighting to make his adopted home of Guangdong both an economic powerhouse and a better place for the Zhujin community he has come to represent.\n\nA long decade in the shadow of the Japanese has convinced Morita and Li that for Guangdong to survive, it must become more than just a playground for the corporations - but a place that its people can call a home. Few of Guangdong's Japanese establishment think he will succeed - but even fewer expected Morita to come back swinging from his fall from grace, let alone speak out against them. He will not stop now."
POLITICS_MORITA_AKIO_70S_DESC: "More than an engineer or an executive, Morita Akio is a survivor - one who holds the fate of millions in his hands.\n\nNearly a decade after becoming Chief Executive, Guangdong has been recast into something close to what Morita has wanted for nearly half of his life, ever since he washed ashore in Honkon in 1952: a second home. With hard work and with trusted allies - foremost amongst them Li Ka-shing - at his side, he has built a life in a Guangdong that has transformed itself in his image: no longer Japanese or Chinese, but somewhere in between.\n\nLuck, he admits, may have had some role to play in his - and Sony's - fairytale success. He knows that he will need far more of it to survive the decade to come.\n\nAs China and Japan stare each other down, pacing around each other like boxers in a cage, Guangdong stands on the precipice of extinction. Much as it flirted with destruction in the Riots, it now faces the prospect of being trampled by the two goliaths of Asia in a historical reckoning, long overdue.\n\nBut Morita has no interest in becoming collateral damage. His home - his Guangdong, and the millions who will soon find themselves in the eye of the storm - must survive, at any cost."
POLITICS_MORITA_AKIO_70S_FAILURE_DESC: "When faced with his first brush with death in 1952, Morita Akio chose flight. Now, months after the threat of Sony's financial dissolution, he chooses to fight.\n\nEven a decade after becoming Chief Executive - working alongside Li Ka-shing to build a second home that has gradually transformed itself in his image - he finds he is no safer in Guangdong than he was in Japan, all those years ago. The only surety of his existence in the twilight chasm between Japan and China is that he is forever vulnerable - if not to the whims of the two goliaths of Asia, then to the predations of Ibuka Masaru.\n\nAnd while there is relatively little he can do to steer China and Japan away from conflict, Ibuka presents a far less intractable problem.\n\nWhere Morita had once worked almost exclusively from the Kōshū government complex, he now increasingly decamps to Sony's Honkon offices, allowing Li to face the passions of his people head-on. Every waking moment is spent rebuilding Sony from the ground up - and preparing it for an inevitable war with Fujitsu.\n\nTheir third showdown will be their last - and Morita will have the last laugh over Ibuka Masaru, no matter what the cost." POLITICS_MATSUSHITA_MASAHARU_DESC: "To many, Matsushita Masaharu has lived a charmed life, an anointed heir to one of Japan's most prominent electronics firms. Born to the peerage and an elite graduate of Tokyo Imperial University, Masaharu gave up his career as a financier in Mitsui Bank to marry the daughter of Matsushita Electric's founder - Matsushita Kōnosuke, a living legend for his rise from elementary school dropout to one of Japan's few non-Zaibatsu corporate titans.\n\nWhile Matsushita Sr. leads the company from Osaka, Masaharu has been its operational head since 1960, overseeing its expansion into China from his offices in Kōshū. As the son of the founder, serving as both corporate executive and government administrator, it would seem that Masaharu had no reason to fear for his future. But his close acquaintances knew otherwise.\n\nNeither an engineer by training nor a salesman by habit, Matsushita Masaharu is keenly aware of his outsider status within both Matsushita and Guangdong. With every passing year, the two Matsushitas grow apart, with Masaharu wondering when he would ever be entrusted with the reins - if at all - while navigating a political tightrope in the Legislative Council. Now, as Guangdong's Chief Executive, he has the opportunity to show his detractors - his tycoon colleagues and his own adoptive father amongst them - that he is everything he promised he would be, building a literal empire for Matsushita in the Pearl River Delta."
POLITICS_MATSUSHITA_MASAHARU_70S_INDEPENDENT_DESC: "Matsushita Masaharu has never considered himself anything more than 'down-to-earth', never one to harbor some grandiose, visionary plan belonging to the likes of Morita or Ibuka. Nevertheless, almost paradoxically, what Matsushita has actually achieved may well be called the realization of a vision in its own right, even if it was not what he had been intending. An entire state operating as a corporate entity - except, of course, with laborers and managers all in the millions. And part of a greater corporate empire, no less.\n\nMillions of investors, engineers, and politicians from the Sphere, perhaps even far beyond, now look to Matsushita Electric for what it has to say and what new gadgets it has to offer. Masaharu looks back on it all, and knows that he hasn't simply made Matsushita Kōnosuke proud with what he's built; in a way, he has entrenched corporate politics on the global stage like never before. That's an achievement that, certainly, he can live with while standing tall.\n\nEven as the Chinese turn their eyes towards Guangdong, he can finally say that it has earned its right to live proudly; and that he has earned the very same."
POLITICS_MATSUSHITA_MASAHARU_70S_PUPPET_DESC: "For all the pluckiness and ambition he brought with him when he first stepped foot onto the soil of Guangdong, Matsushita Masaharu has been forced to realize in full the grueling realities of corporate politics. Worse still, this realization came in the most painful way for him imaginable: through his own vacillation, dithering, and feebleness. One crisis after another, over and over again, and in the end he gave everything that he'd built away to the backstabbing voices he trusted in far too much.\n\nAll the nation building he did, all the promises he made to Matsushita Kōnosuke, and all of it in the end was work done for the sake of other companies, in the end handing out the bright future he had wanted for Matsushita to those taking advantage of him. Part of him supposes he deserved it - if this is what happens to a businessman who can't see beyond profit, maybe it's better after all to hand over the helm to those who can.\n\nWhen China comes for Guangdong, demanding its return in full to being Chinese land, it will not be Masaharu's problem. He's no better than some middle manager anyways, with only a family name to his credit, a family that in truth is not and never has been his."
POLITICS_IBUKA_MASARU_DESC: "Few can compare with Ibuka Masaru's talent and relentless drive for excellence; even fewer can compare to his boundless ambition and political and business acumen. A relentless advance up the corporate ladder, endless lobbying, politicking, and economic maneuvering has made Ibuka few friends and many enemies.\n\nFrom ostracizing Tokyo Telecoms co-founder and his one-time friend Morita Akio to merging with and consolidating his control over what is today known as Fujitsu Limited, Ibuka's relentless ambition would see Fujitsu expand its operations to the Pearl River. An expansion that would see Ibuka clash with Morita's Sony in a legendary legal battle over control of Guangdong's radio market.\n\nThose days, however, are in the past. Following the collapse of Suzuki's government in the Yasuda crash, Ibuka once more maneuvered Fujitsu into a position of dominance. Now, as Guangdong's undisputed master, Ibuka Masaru finally has the freedom necessary to finally bring about his vision for a new, transistorized, digitized world.\n\nNo longer restrained by the whims of his fellow executives or beholden to shareholders in Tokyo, Ibuka alone can see the future, and Ibuka alone can bring about the new tomorrow. With Guangdong as his canvas, his only limit is ambition, and Ibuka has no intention of coming up short."
POLITICS_IBUKA_MASARU_70S_PERSISTENCE_DESC: "Deep down, Ibuka never quite left being a child. All those years that certain tinge of naïveté had coated his spectacles, through which alone he was able to see, and then make sense of, himself and the world around him. Only a child refuses to believe in lost causes. Only a child refuses to apply "normal physical and mental faculty" and "imbecility" to the same individual. Only a child gives his unconditional love to all those people, and want anything more than putting each and every one of them six feet under.\n\nSure, he might've had his precious vision torn apart by the Riots and then reality shoved in his face - a reality infested with ingrates, dimwits, and asinine geopolitical tussles. He might've had the chance to mature and move on. The epiphany that eventually came to him, however, is of another kind entirely: if all this travesty, all this... depravity, is what it takes for someone to grow up, then he would rather not. He would rather be the child that always looks ahead. Japan, China, they're all free to drown in their own excrement. It's not his problem.\n\nIn a better time he would've been world-renowned as the brightest innovator of them all, showering in the spotlight and the wholehearted, unalloyed adoration of the planet; in another life, perhaps, Akio would've shared the glory by his side. The three-year-old child, however, paints over it all with abandon and a million drops of blood and tears - and upon the pure, pristine, reborn annals of Guangdong, blow by blow, joyously carves out the word that Ibuka Masaru shall be remembered by for the rest of his life:\n\n§zSINNER§!"
POLITICS_IBUKA_MASARU_70S_RECONCILIATION_DESC: "What, then, has Chief Executive Ibuka Masaru's vision of Guangdong amounted to in the end?\n\nWhat was this last decade but a quixotic crusade to prove himself infallible? To promulgate — with the same ruthlessness as the Inquisition and the Imperial cult — a dogma that everyone was 'supposed' to fight tooth and nail for excellence, forgetting bonds of blood and friendship, all in accordance with the diktats charted out in the top floor of Fujitsu?\n\nIbuka knows now - always has known, in fact - that what he proposed was no truth at all. There exists no such thing as 'objective' truth when it comes to personal relationships, let alone nation-building. The only reason Ibuka decided that he had to pull such a truth out of his ear then force it down everyone else's throats was so that he, with all his groundless, senseless self-assurance, could make it true.\n\nSo that he could lie to his conscience and feel better about it.\n\nIt was all thanks to the Providential way in which the Oil Crisis and Riots played out that Ibuka Masaru has snapped out of this decades-long trance. The scales are stricken perforce from his eyes, and Ibuka now knows for certain that there are more ways than his own to success, let alone to perfection. And when, as Heaven has predestined, China returns for its stolen Pearls, those days will also bring the final judgment for Ibuka Masaru — whether he deserves to carry on, or be stopped forever in his tracks.\n\nAnd the Chief Executive, weary and contrite, would take all that he could get."
POLITICS_KOMAI_KENICHIRO_DESC: "A new authority stands ascendant and triumphant upon the tumultuous stage of Guangdong, a towering figure now eclipses the Pearl River Delta in somber darkness, its penumbra extending far and wide. A goliath has stepped onto Guangdong's shores, a man who embodies the ruthless efficiency of the industries of Manchukuo, whose vision for the state is one of steel and sweat, one where the backbreaking toil of the workers allows for productivity to soar to heights never before seen. The iron cavalier of Hitachi - Komai Kenichirō.\n\nOn the exterior, Komai is a man who commands respect; urbane, polite, and charismatic. However, his pleasant character is merely a veil for the plans and thoughts he harbors within his mind, his conceptions of grandeur and prosperity which can only be attained through the bluntest and most unforgiving of actions. With him now sitting atop the ivory tower, holding the position of Chief Executive, the bustling streets of the Three Pearls have been silenced, the gates to the underground societies have been shut, Guangdong has entered into a new era, one of order, security, and efficacy.\n\nWith the merciless truncheon of the Kenpeitai at his side and the supervision of his Manchurian benefactors above him, Komai will transform Guangdong into a symbol of industrial success, by any means necessary."
POLITICS_KOMAI_KENICHIRO_70S_PERSONALIST_DESC: "In the end, Komai Kenichirō can't help but to look back at the whole of his life in awe at how ordinary it must be, at least in comparison to his former competitors in the form of Morita, Ibuka, and Matsushita. All he really did was graduate from Tokyo Imperial, start working for Hitachi Limited in 1925, and work hard to advance through its ranks ever since. Nevertheless, here he is now, having brought Hitachi as well as Guangdong as a whole to new heights both financially and technologically while eliminating all forms of dissent and real competition. All this is beyond the wildest dreams of his so-called 'superiors' back in Manchuria, perhaps beyond even his own just 10 years ago.\n\nAll this, for his one simple goal: to be absolute lord of his own future atop a throne of his own making. Komai is Caesar, looking down upon his Rome, ruling 'in the name of' whoever the current Augustus far away up north might be. All the feigned subservience and platitudes of loyalty end there; the true Komai, Chief Executive of Guangdong, emblazons himself with the same power and relish as Julius Caesar, the very man for whom the title Caesar was named.\n\nPerhaps, when the dust has settled and the vying, frothing vagabonds and miscreants north the border have been dispatched, the path will have been paved for another Komai down the line. And another, and another, for as long as time shall bear witness."
POLITICS_KOMAI_KENICHIRO_70S_MANCHURIAN_DESC: "There are times when Komai Kenichirō can only laugh faintly at how ordinary his life must be, at least in comparison to his former competitors in the form of Morita, Ibuka, and Matsushita. All he really did was graduate from Tokyo Imperial, start working for Hitachi Limited in 1925, and work hard to advance through its ranks ever since. All those years, and here he still is, forever a corporate suit with little to no real agency. Some might point to all Komai has achieved for Pan-Asianism, but always he dismisses this disinterestedly. Everybody does Pan-Asianism these days, there's nothing special about him promoting it as well. Nothing special about him at all, save only for his title of President of Hitachi Limited, a throne made of paper.\n\nYes, he can relish in these ephemeral piles of gold all he want; yes, he can call himself Caesar as many times as need be. But every Caesar has his Augustus, seated far and high away in Rome, holding the true reins of the empire they share regardless of the illusion of autonomy. No matter how many dissenters Komai locks away, no matter how much wealth he sits upon, something will always be missing. Something that isn't just another directive from Xinjing.\n\nAs China prepares for war, and forever after until the day he dies, Komai will always remain the man from Manchuria, the junior emperor of an empire not his own. Nothing more."
POLITICS_NO_AUTHORITY_DESC: "§VFROM THE GUANGDONG PEOPLE'S ANTI-JAPANESE GUERRILLA:\n\nDEATH TO THE JAPANESE INVADERS\n\nAVENGE LEE CHUN§!"
POLITICS_SHIGETO_NAGANO_DESC: "A decade and more passed by in this absurdity of a place, a decade wasted while good Japanese men were slaughtered in pointless fucking wars to satisfy the whims of a lot of money-grubbing traitors. Ten years, ten years were frittered away, and for what? So that loyal soldiers of his Majesty the Emperor could be reduced to sapient test rats!\n\n"No more," Nagano Shigeto says.\n\nTokyo has given its local IJA commander its blessing—as it should have done years ago. Now Nagano Shigeto will bring order to the chaos of the Guangdong riots—just as he helped do so in China three decades ago. For its countless follies, for the very absurdity of its existence, Guangdong deserves nothing other than to be ended—and Nagano will be the one to bring it about.\n\nGuangdong's innermost apocalypse has been distilled into the force of a single man, who shudders slightly in utter glee at the prospect of putting an end to the corporate experiment that once ruled over the Pearl River Delta. If Guangdong thought it had known war beforehand, it was wrong—\n\n§s—for Nagano Shigeto has no intention of leaving anything in this unnatural hellhole of a state untouched.§!"

 
 GNG_THENEWORDER_DESC:0 "Carved out of China at the end of the Greater East Asian War, the Special Council of Guangdong is a continuation of the Manchurian experiment. The Council, headed by Manchukuo-experienced Teiichi Suzuki, rules over Guangdong, the latter being a police state with unrivaled surveillance and control of its people. Industrial parks arranged in experimental formats for ideal productivity deliver goods down the Pearl River unfettered by oversight present elsewhere in the Japanese Empire. Migrating Japanese enjoy preferential treatment while the native Cantonese are second-class citizens, if they have the fortune of being educated. Those without such privilege are uplifted from their homes and are forced into highrise slums for easier labor appropriation. Some try to escape, but the megacity grows faster than most can flee."
 
