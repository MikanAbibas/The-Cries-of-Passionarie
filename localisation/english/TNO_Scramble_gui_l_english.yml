 SFA_cov_terror_tt:0 "Costs §Y2§! supplies. The state's holder loses §R10%§! stability and war support for 180 days, and cannot be terrorized again until then. It never learns who did it."
 SFA_cov_bribe_tt:0 "Costs §Y2§! supplies. The state's holder, at war, attacks and defends §R10%§! worse for 90 days, and cannot be bribed again until then. It never learns who did it."
 SFA_cov_ss_tt:0 "Costs §Y4§! supplies. One of our own nations gains §G15%§! attack and defence and §G10%§! organisation for 180 days, §Y10000§! manpower, §Y3000§! small arms and §Y1000§! anti-tank weapons. Once a year."

