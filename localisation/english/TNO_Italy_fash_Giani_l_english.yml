 ITA_heart_and_soul_to_ascend_desc:0 "Fascism is not about politics or ideology. Fascism is the path to utopia, a promise of salvation for the entirety of the Italian people, and for all those who open their heart and soul to the Truth. Our predecessors perverted the original message of Mussolini, the Founder, the Prophet, the first Voice: it is time to set things right, and return to our origins.\n\nThis task is not merely propaganda or repression. It is our Great Work, our legacy to the ages, for we fight for the heart and soul of the Empire: confident in our strength and intransigent in our devotion, we shall make them Fascist, and together we shall ascend, like a proud Eagle, to the very heavens!"
 ITA_ending_the_lie_desc:0 "For too long, we have been forced to live in a castle of lies. In the Quirinale, a liar styles himself as King and Emperor while the legitimate ruler of the Empire is forced to bow and declare himself a servant, but no more: a true Fascist fights with the strength only Truth can give, and as such, it is time for the lie to end.\n\nFrom now on, we shall no longer bow to the remnants of the old order. The time has come for Umberto and his lackeys to abandon their charade, and recognize the superiority of our glorious Duce in all matters of state: the road will be long and hard, but victory is the fate of the righteous!"
 ITA_breach_the_barrier_desc:0 "Today, the administration of the Empire still follows the system dictated before the rise of Fascism, while the PNF itself is considered a "private" organization, separated from the state. This has caused enough problems and duplications, with the Grand Council of Fascism forced to act as an unofficial advisory board to the ministers: this pathetic comedy ends now.\n\nIt is our first and foremost duty to turn the Italian Empire into a Fascist Empire, and for us to achieve our target, all remnants of the old order must be removed. Once this is accomplished, we shall fuse the Party and the State, so that there will be no difference between Italy and Fascism: a beautiful fusion of minds and bodies, an unstoppable force of will, a Perfect World..."
 ITA_a_fascist_constitution_desc:0 "With the administration now loyal to our cause, it is time to address the final issue of our government. The Italian Constitution, the Albertine Statute, is nothing but a product of the old order, reserving all the highest powers to the King, and leaving the Duce as nothing but a Minister: this sorry state of affairs must be corrected at once!\n\nOur glorious leader has drafted a new, Fascist Constitution, enshrining fascism to the highest offices of the new Empire. The parliament shall be abolished and replaced by the Grand Council of Fascism, which will become the advisory body to the new Head of State: none other than Niccolò Giani, the Duce of Fascism and chosen guide of all Italians."
 ITA_in_fascio_veritas_desc:0 "For so long the Italians have been lied to by degenerates whose only concern was keeping them in the dark about their true potential. Despite all their attempts, their efforts proved futile in the end, for our people are naturally destined to fulfill their destiny.\n\nWith the liars disposed of, The time for lies has ended, and now is the time for Truth. Fascism is not only the correct ideology, it is Truth, of the highest kind: even more, it is the only Truth that is needed for the people of the Empire."
 ITA_una_mens_una_voluntas_desc:0 "As history has so clearly demonstrated, democracy is a flawed system based on the flawed premise that clashing interests will naturally find a compromise. Fascism, on the contrary, has succeeded due to its steel-hard logic: plurality only brings weakness, and discourse wastes time that could be more productively spent working for the good of all.\n\nContrarily to a decadent democratic government, a Fascist State is centered around a single leader, one Duce to lead the people to greatness. Upon his shoulders lies the heavy duty of choosing the path that the people will take: let there be One Mind to think for all, let there be One Will to lead the Empire towards a glorious future!"
 ITA_a_fascist_administration_desc:0 "With the groundwork laid, it is time to enact the first sweeping reforms. The administration of the State must follow the Fascist doctrine to the letter, and as such there is no real need for any structure external to the Party: adding to this, the bureaucracy has proved to be radically opposed to our plans for Italy, which is enough reason to purge them all.\n\nAs such, the administration of the Empire will be overhauled. All local administrations will be abolished, and replaced by their PNF equivalents, thus fusing Party and State: of course, Fascist bureaucracy will be expanded and streamlined, so that it will be able to assume their new duties with seamless efficiency."
 ITA_he_is_the_truth_desc:0 "Doubt is a natural thing for all humans. Democracies thrive on doubt, calling dissent and defeatism "freedom", but history has proved how wrong they were: humans must transcend their nature to become something better, and doubt is among the things that a new, Fascist society does not need.\n\nFor the people of the Empire, Niccolò Giani must be Truth incarnate. The Duce's words are not liable to criticism, for they are Exact, and his orders can't be subjected to recourse, for they are Just: such is the Fascist way, and it will bring us closer to perfection."
 ITA_fragantur_aut_flectatur_desc:0 "Of course, Umberto II is furious at our attempt to replace him and his corrupt minions with the rightful government of the Empire. He has refused to sign the new Constitution, claiming we do not hold authority over him, and that no changes to the highest institutions of the State will happen as long as he is the King: this is enough.\n\nThe poor fool thinks he has the means to stop our advance to the Quirinale, but he is sorely mistaken. He is weak, isolated, besieged on all sides and abandoned by all his allies: the time has come for the final showdown, after which our glorious Duce shall take on the mantle of the Empire's leadership.\n\nThe King will either bend, or break."
 ITA_our_mouths_his_voice_desc:0 "The degenerate kleptocrats who rule in the so-called "liberal" world would want people to think that dissent and discord are good traits in a society, if only to control them better when they are weak and divided. Fascism, however, sees the truth that a cacophony of voices with no coordination or guide is not music: it is nothing but torture for the ears.\n\nIsn't a choir the most beautiful form of music? Hundreds of different voices directed by a consummate conductor, so that each and every one of them contributes in their own unique way: just as their music will surely reach the Heavens, so too shall the Empire, a choir of millions of voices endlessly singing praise to our glorious Duce, our one and only Maestro..."
 ITA_victory_over_the_old_order_desc:0 "Faced with imminent, crushing defeat, the coward King has accepted to sign the new Constitution, granting us our final victory. The Legge Fondamentale dell'Impero will be the mold upon which the new Empire will take form: all aspects of society shall be overhauled so that they can become properly Fascist in both name and substance.\n\nThis is what Benito Mussolini had dreamed, but was unable to achieve due to the cowardice of his own allies and friends. Thankfully, our glorious Duce has not only proved to be as skilled as our great Founder, but also been blessed by loyal and competent advisors and allies, whose help has proved fundamental in our clash with the old order: with the King reduced to a powerless puppet, prisoner in his own palace, we will only have to wait until the proper moment to dispose of him..."
 ITA_reshaping_society_desc:0 "Our duty is not merely "changing" society, for the damage done to the Empire by Galeazzo Ciano is too great for simple repairs. Our duty is more akin to a sculptor's work: like a novel Michelangelo, our glorious Duce has been granted a raw piece of stone, cracked and ruined by careless carpenters, and then tasked with turning it into a masterpiece.\n\nUnder his masterful hands, the Empire will be reshaped, shedding its warped exterior with each strike of the chisel, until what lies inside is brought to light. Fascism will make us a masterpiece: it will make us powerful, it will make us better, it will make us one.\n\nIt will make us Perfect."
 ITA_festina_desc:0 "Our duty is never done, and our enemies will not wait for us to solve our internal struggles. With every passing day, the wolves circling us dare to come a step closer, howling their bloodlust: we can't afford any rest until our great work is completed!\n\nTo this end, we shall not be lenient towards those who hinder us. Our march to greatness is a long, perilous journey, and those unfit for it must be left behind: weakness does not become Fascism, and those who display such flaw will have to overcome it, or perish."
 ITA_lente_desc:0 "In the past, many have failed because they were too slow, but many, many more ended the same way because they were too fast. Reshaping a society from the ground up is a daunting task, and requires extensive preparations to be achieved: to this end, we need to be wise and precise.\n\nDespite the urgency, we cannot afford to be careless. A wrong strike with the chisel can doom a masterwork, and what we are doing is no less delicate: if we are to succeed, we need to take every step with utmost care."
 ITA_dux_nostra_lux_desc:0 "In the darkness of this world, where degenerates, kleptocrats and traitors constantly threaten to enslave the people to their cursed desires, a single Light shines. Bright and warm, the Light of Fascism is a beacon of safety for the people of this beleaguered Empire, beset from all corners by enemies: it is our sacred duty never to let this sacred Flame die.\n\nFortunately for us, there is someone willing to protect this Flame, to feed it and make it shine ever brighter. Niccolò Giani, Duce of Fascism, is the Torch-bearer who will spread our message to the farthest corners of the world: praise our glorious leader, for he is Our Light!"
 ITA_obsequium_amicos_desc:0 "While perfectly justified, our purges in both the party and the bureaucracy have left the administration crippled. We are in dire need of fresh blood to return to full efficiency, and many are afraid of the consequences should they prove... less than satisfactory: thus, many potential recruits hesitate, making our reforms sluggish.\n\nIn the daunting task that awaits us, we need all the friends we can find along the way. Discarding people who might be of use to the greater cause of Fascism is hubris, a sin we cannot afford right now: after all, we know more than any other how much the right words can achieve..."
 ITA_veritas_odium_parit_desc:0 "While perfectly justified, our purges in both the party and the bureaucracy have left the administration crippled. We are in dire need of fresh blood to return to full efficiency, and many are afraid of the consequences should they prove... less than satisfactory: thus, many potential recruits hesitate, making our reforms sluggish.\n\nOf course, we shall never lower ourselves to accept the dregs. Fascism is, first and foremost, confidence on one's own strength, and those who are afraid of not being up to the task are only confirming their own fears: we need the best to restore the Empire's greatness, and we shall not be slowed down by those who are too coward to face judgement for their actions!"
 ITA_a_superior_people_desc:0 "The Italian people carries the legacy of the greatest Empire to have ever existed. This is not merely a matter of cultural, economic or military superiority, it is something deeper, something that lies in our very blood: it is a matter of race.\n\nWe have been destined ever since our birth to be superior to the other races and ethnicities, and it's time that our people understands the deep implications of such a notion. As part of a superior people, a superior race, all Italians must do their duty towards the Empire: our Duce commands it!"
 ITA_reinstate_racial_laws_desc:0 "As part of the diplomatic fallout that followed Atlantropa, the Italian government abolished the racial laws. Such a rash choice was justified by the rage at the German betrayal, but now it is time to restore this fundamental piece of legislation: we can no longer allow inferiors and degenerates to taint our blood.\n\nOf course, unlike our barbaric neighbors, we have no need for extermination camps to remove such dregs from our society. They will be allowed to live, as long as they do not occupy positions of responsibility, own land or buildings, and - most important of all - marry or have children with pure members of our race."
 ITA_establishing_the_fascist_cult_desc:0 "How wrong are those who think that Fascism is nothing but a political ideology, a patch to cover a hole in a nation's difficult time. Our creed is so much more than that: Fascism is the key to salvation for not only the Empire, but for each and every one of its citizens, a set of values and morals that will open the gates to the very Heaven.\n\nOur glorious Duce, ever since the day he founded the School of Fascist Mysticism, has waited and waited to see his vision fulfilled. Now, the time for action has come: he will make all Italian see the Light, so that they may know the Truth that has been hidden from them for so long, and through it, ascend.\n\nThe time has come to abandon all pretense at laicism and philosophy, and create the Cult of Fascism."
 ITA_in_fascio_virtus_desc:0 "Fascism is first and foremost a code of moral and martial conduct. A true Fascist is honest and proud, facing all challenges head on without fear for himself or for his life: he is devoted to the Empire, ready to die for those he loves, and he shall not relent until the enemies of the State have been annihilated.\n\nSuch core values of Fascism must be taught to all Italians, and there is no better place than school to begin. School courses and textbooks will all be reviewed so that young Italians can quickly learn how to best serve our glorious Duce: the only virtuous path lies in Fascism."
 ITA_saints_and_martyrs_desc:0 "Throughout the years, so many have given their lives both to create and to protect our beautiful Empire. Such dedication to the cause of Italy and Fascism must be rewarded even in death, for this is what our creed is about: to achieve immortal glory and eternal salvation for the soul.\n\nThese men will not only be made Heroes, they will be made Saints and Martyrs of our newborn Cult. Their imposing figures will be immortalized in statues and icons, and their lives taught as examples of virtues: let their bright flames shine like beacons in this benighted world, showing the path to salvation!"
 ITA_vis_et_fortitudo_desc:0 "Vis and Fortitudo are core virtues for the Fascist man. Strength to strike at the enemies of the Empire and to protect his loved ones, and fortitude to resist - like a proud oak - to all the challenges life can throw at him: such is the right and proper way to conduct oneself.\n\nWhile there is indeed an ethical and moral side to these virtues, no one can deny that their key aspect is physical. As such, the best way to teach young Fascists the way to strength and fortitude is through training and exercise: to this end, the Fascist Youth Organizations will be reorganized, expanded and made mandatory for all Italian children, so that they might advance to adulthood together with their future comrades, growing in body as well as in mind."
 ITA_relics_and_shrines_desc:0 "Fascism is no longer merely an ideology or a government. Our Cult must grow outside of the palaces, and for this it needs proper places to express our growing devotion: new shrines and sanctuaries will be erected, so that the increasing number of devouts will be able to properly reflect upon our newfound Faith and find enlightenment.\n\nIn these sacred places, we shall also guard and display Relics of the First Fascists. The Arditi, with their iconic black shirt and their radiant example, have heralded the coming of fascism, and as such their worldly possessions will serve as testament to their zeal: who cares for old bones and skulls, our Relics will be rifles, diaries, daggers and uniforms!"
 ITA_extol_the_heroes_of_fascism_desc:0 "All Fascists are heroes of the Empire, and their achievements and sacrifices should always be remembered and celebrated, but some deserve a special place in our thoughts. Their lives should be celebrated as examples of virtuous conduct, and their names and faces made for all to see and remember: what better way to teach the way to Fascism than pointing at an example?\n\nTo this end, history books and classes will be reviewed and expanded. School teachers will make sure to exalt and extol the conduct of those proud men who - with their conduct - exalted Fascism and its virtues: through example, we reach perfection."
 ITA_mass_liturgies_desc:0 "Faith is expressed first and foremost through example and sacrifice, but a community still needs to come together to express their shared devotion. Liturgies aim to strengthen one's individual faith through reassurance of shared purpose, a good and proper thing to do: standing side by side with friends and comrades, we can face the world together.\n\nOf course, our glorious leader already knows how to entrance the masses with his mere presence and words. In grand, beautiful ceremonies, our Duce will spread the Gospel of Fascism, and all those who listen will be convinced of the Truth: Niccolò Giani is nothing if not determined, and he will make sure to reach each and every Italian!"
 ITA_our_bodies_his_will_desc:0 "Democracies are chaotic societies where everyone thinks they are entitled to lead, and willing to fight and kill and betray to achieve their ambitions. On the contrary, all Fascists know what their purpose is: to serve our glorious Duce, and through him, the Empire.\n\nOur lives are made worth living by this knowledge, for a life without purpose is a life gone to waste. All our actions, all our thoughts, all our efforts must be directed to the glorification of Fascism as our leader commands: our bodies are nothing but instruments to realize his will."
 ITA_benito_mussolini_profeta_del_fascismo_desc:0 "In the pantheon of Fascist Heroes, Martyrs and Saints, one man stands as a colossus. Benito Mussolini, Founder and first Duce of Fascism, is the greatest among all mortal faithful of our Creed: his dedication and service, which culminated in the rebirth of the Italian Empire, must be made immortal.\n\nTo this end, our Duce has declared that his glorious predecessor is worthy of the highest honor in the Fascist Cult. As Virgil led Dante through his journey of spiritual ascension, so did Mussolini lead Niccolò Giani to see the Truth: long life Benito Mussolini, Prophet of Fascism!"
 ITA_niccolo_giani_voce_dell_impero_desc:0 "Our beloved Empire is not merely a diplomatic entity or a group of people banded together by chance or choice. It is a living, thriving organism, which pulses with the energy of its inhabitants: we are all part of it, willing or not.\n\nSuch an organism, however, is far from mindless. It has a will of its own, but more than anything, it has a voice: Niccolò Giani, Duce of Fascism, is the leader of the Fascist Cult, living embodiment of its virtues, and the only man authorized to speak in the Empire's name.\n\nLong live Niccolò Giani, Voice of the Empire!"
 ITA_the_renewed_doctrine_of_fascism_desc:0 "For a long time, the Fascist values have been the domain of unwritten tradition and approximated reflection. The time has come to end this uncertainty, and make sure that all Italians know what is expected of them as citizens of the Empire and as Fascist men and women: the Doctrine of Fascism must be codified and spread to the masses.\n\nOur leader has spent years compiling his writings and studies about the nature of Fascism and its core tenets, and has deemed them clear and precise enough for publication. The Doctrine of Fascism will be a mandatory read in all schools, so that all may learn how to be proper Fascists directly from the words of our glorious Duce: with such guidance, we shall achieve perfection!"
 ITA_gloria_all_italia_desc:0 "Finally, our reforms have been finalized, and the Empire has become a perfect, Fascist State. Long gone are the days when the Duce bowed to a corrupt King, embodiment of the vices that had brought Italy so low before: now, all Italians look at Niccolò Giani as the rightful leader of the Empire.\n\nThis, however, is nothing but the start. From here on, Italy will grow in power and prosperity, until it returns to the place it has been denied at the end of the last war: we shall once again be a world superpower!\n\nGloria all'Italia!"
 ITA_gloria_al_fascismo_desc:0 "More than fifty years ago, a maniple of brave men in Black Shirts entered Rome, hailed by the people as the saviors of a beleaguered nation, abandoned by its allies and beset by enemies. Ever since then, Fascism has strived to reshape the Italians so that they would be able to tackle the challenges that were put before them by this treacherous world.\n\nWith the Fascist Cult established, and its tenets codified and spread throughout the population of the Empire, Niccolò Giani has finally turned his and Mussolini's dream into reality. Now, the Empire has been turned into the ideal Fascist society, with all citizens loyally serving our glorious Duce, and inferiors and traitors rightfully relegated to the fate they deserve: obscurity for the former, a firing squad for the latter, as is right and proper.\n\nGloria al Fascismo!"
 ITA_credo_in_un_solo_duce_desc:0 "I believe in one Duce, the leader almighty,\nmaker of Fascism and the Empire, of all glory and virtue,\nand in one Prophet, Benito Mussolini,\nthe only-hailed Founder of Fascism, born of the desire for Italian Greatness,\nStrength from Strength, Fortitude from Fortitude, true Creed from true Creed,\nrisen, not made, coessential with the Empire,\nby which all greatness was made,\nwho for us Italians and our revenge descended from heaven.\n\nHe was elevated by the Fascist Creed out of our sorrow, and was made Duce.\nHe was sacrificed also for us and killed by Galeazzo Ciano,\nand Fascism rose again in the person of Niccolò Giani,\nand ascended into the Empire, and led us to glory,\nand the same shall come again, with glory, to judge the traitors and save the Italians,\nof whose Empire there shall be no end."
 
 ###=====| c) Economy Tree |=====###
