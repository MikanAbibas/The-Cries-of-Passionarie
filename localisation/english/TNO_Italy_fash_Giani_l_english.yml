 ITA_classis_oceanica_idea:0 "Classis Oceanica"
 ITA_classis_oceanica_idea_desc:0 "As Mussolini once said, "many enemies, much honor". With the Mediterranean under our total control, and the fleets of Iberia and Turkey rather lacking - to say nothing of the joke the French call "navy" - it is evident that the Regia Marina is wasted in the Mediterranean: complacency begets decadence, and decadence begets ruination!\n\nIn order to keep our new navy always ready and up with the latest innovations, we shall completely redesign the purpose of the Regia Marina. No longer will it be limited to the defense of Mare Nostrum: now, the newly-christened Classis Oceanica will extend its power projection to the Indian Ocean, to test their mettle with the greatest fleets of the world!"
 ITA_an_army_worth_the_empire:0 "An Army Worth the Empire"
 ITA_an_army_worth_the_empire_desc:0 "The Regio Esercito has changed greatly from what it was at the beginning of our reforms. Lazy, unmotivated soldiers and incompetent officers have been removed to make place for the kind of servants our Duce needs: blank slates to be rewritten according to the doctrine of Fascism, raw clay to be moulded into the perfect soldier to pursue the glory of the Empire.\n\nNo longer will Italy be humiliated on the field of battle, no longer will we be a laughing stock among the great powers of Earth! From now on, our soldiers will show our enemies the price of hubris for trying to oppose our might: they will be grinded into dust by our merciless advance, a footnote of history good only to serve as a lesson for those who remain!"
