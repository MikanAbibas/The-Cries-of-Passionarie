 ITA_tying_up_loose_ends:0 "Tying Up Loose Ends"
 ITA_gloria_al_duce:0 "Gloria al Duce!"
 ITA_gloria_all_impero:0 "Gloria all'Impero!"
 ITA_gloria_al_nuovo_ordine:0 "Gloria al Nuovo Ordine!"
 ITA_an_empire_wide_procession:0 "An Empire-Wide Procession"
 ITA_a_prisoner_in_the_vatican:0 "A Prisoner in The Vatican"
 ITA_anno_i_sef:0 "Anno I S.E.F."

 ITA_the_bulls_victory_desc:0 "Throughout history, two visions of Europe have clashed in an eternal deadlock: on one side the Bull, strong and honorable, on the other the Ram, inferior but treacherous. As the foremost representatives of the Europe of the Bull, we have had to contend with the efforts of our competitors for our right to exist: as expected, the Ram even bought the weakest among us, trying to destroy the Empire- to destroy Fascism! - from the inside.\n\nIf we stand victorious today, it is thanks to the efforts of our glorious Duce, who vanquished our enemies both inside and outside the State. Despite all odds, he led us to victory, securing the Empire's place among the greatest powers of the world, and Fascism as the dominant ideology in the Empire, and a constant ideological threat to the decadent democracies of the world: we are the Bull, and we have prevailed."
 ITA_superiority_of_race_desc:0 "The decadent democracies of the world wanted to create a world where everyone would be equal. Their loss in the last war is more than enough proof of the blasphemous nature of such projects: it is a simple truth that men are racially divided, and that some races are inherently superior to others, as has always been in the history of the world, and as shall always be from now on.\n\nOf course, as members of the Italian race, it is both our privilege and our duty to rule over the inferiors that make up the majority of the human population. With a stern but guiding hand, we have led the Empire towards a path of prosperity, where everyone profits from peace and stability: as such, it is only right that the superior masters enjoy the large majority of the fruits."
 ITA_superiority_of_ideals_desc:0 "Before the coming of our prophet, two ideologies vied for dominance over the world. On one side, the corrupt democracy, a system where strife and betrayal are made instruments of government, and the common man is deluded into thinking they actually matter; on the other, socialism, a many-headed Hydra whose heads preach at the same time freedom and slavery, untold rewards and endless toil.\n\nAs proven by facts, Fascism is far more than a political ideology. As our Duce has never ceased preaching even before assuming his august mantle, it is an all-encompassing code of conduct in both private and public life, aimed at perfecting a man's inner and outer strength: our success in the national and international stage is but an unnecessary proof of the inherent superiority of Fascism."
 ITA_to_the_victor_the_spoils_desc:0 "Thanks to the efforts of our Duce and his loyal government, we have established and cemented our authority over both the Empire itself, and a plethora of subject governments. The eagle soars from the Alps to Addis Abeba, and our orders are followed throughout the Balkans and the Levant: it is only right that, for our tireless effort, we now reap the reward that comes with it.\n\nA final batch of reforms and treaties awaits on Giani's desk, in order to dramatically improve productivity throughout the Empire, and ensure that trade and exchanges grow between Italy and her puppets across Europe. For years we have spent, investing in the future: now, a new era of prosperity awaits all Italians.\n\nTo the victor, the spoils!"
 ITA_a_hierarchy_set_in_stone_desc:0 "With the turmoil of the Oil Crisis, it has become clear that we cannot afford to be lax. Allowing the locals to rule themselves, if only in a semblance of autonomy, will only lead to betrayal: to this end, it is imperative that we assert our dominance over our sphere of influence, at least in fact.\n\nIn order to ensure our control over our sphere of influence, we shall send garrisons to our so-called "friends" as a reminder of the consequences of disloyalty. We are the masters of the Mediterranean, and we shall not allow anyone to threaten us: this new hierarchy will be upheld at all costs."
 ITA_tying_up_loose_ends_desc:0 "When the King tried his pathetic attempt at a coup, we refrained from exacting righteous punishment upon him and those who betrayed Fascism due to the difficult situation both inside and outside of the Empire. Now that our victory is certain, however, the time has come to tie up all loose ends: Umberto has hidden within his palace long enough, and it is time for him to face justice.\n\nNiccolò Giani has ordered that a special trial be prepared for him and his co-conspirators, where they will face charges of high treason and murder for all those who lost their life in the subsequent violence. For his crimes, the King shall be deposed, and the monarchy abolished: we have toiled under the decadent leftovers of the old order for too long, and it is high time for the Duce to lead the Empire in both name and fact!"
 ITA_gloria_al_duce_desc:0 "When Niccolò Giani took the mantle of Duce, it was dirty and ragged from a decade of corruption and decadence at the hands of Ciano and his band of sycophants. For years, our glorious leader has toiled to save the Empire from the pit it had been thrown into, showing supreme dedication to the State and will to fight: truly, he is the living incarnation of the Fascist values!\n\nFor this reason, a day of celebration shall be held across Italy, where all true believers will be able to express their love and admiration for our glorious leader. May he lead us for twenty years more, with the same strength he has shown until now: it is our destiny to rule over the Empire, and it is his destiny to rule us!\n\nGloria al Duce, gloria a Niccolò Giani!"
 ITA_gloria_all_impero_desc:0 "Two millennia ago, the Roman Empire spanned across three continents. After much war and sacrifice, we have managed to partially restore the dream of our ancestors, but we almost lost it to the incompetence of Galeazzo Ciano and his band of corrupt kleptocrats: only through great efforts did we manage to restore order in the colonies.\n\nFrom then, we have slowly but steadily removed the inefficiencies and defects of the administration, building a new, prosperous society where all serve the State in their own way, and the racial order is upheld for the good of all. With our foundations set in stone, we can now inaugurate a new era of prosperity and expansion: soon, our Empire will be even greater!\n\nGloria all'Italia, gloria all'Impero!"
 ITA_gloria_al_nuovo_ordine_desc:0 "A new order is dawning over Europe. It is a Fascist order, where the Italian Empire has finally cast away the chains locking it into the British Cage, and removed the corrupt incompetents that held back our true potential: thanks to the reforms of our glorious Duce, we are now an economic, diplomatic and military powerhouse, capable of projecting our authority across the oceans.\n\nWith the German supremacy in tatters, and the United States embroiled in their own decadent government, it is time for a new superpower to rise. We are the legitimate masters of the Mediterranean, our dominance is set in stone, protected by nuclear might: let's see how they try to shake us away now!\n\nGloria al futuro, gloria al Nuovo Ordine!"
 ITA_an_empire_wide_procession_desc:0 "Finally, our tireless efforts have borne fruit. The majority of the Italian population has abandoned the corrupt priests of the Vatican for the safe haven that is Fascism, and now converts emerge with every passing day: all across the Empire, old and baroque churches lie empty and forgotten, the people flocking to the true places of faith.\n\nThe time has come for us to show our devotion, so that all the world might see the future of Christianity. We shall hold a procession spanning the entirety of the Empire, led by our glorious Duce: all the faithful will take to the streets and show their righteous zeal, so that our message may reach all the corners of the world.\n\nWe have saved the Empire in both body and soul, and it is time for our message to reach the other countries..."
 ITA_a_prisoner_in_the_vatican_desc:0 "Once the most powerful man in the world, the pope is now a shrivelled old man, hiding in the Vatican for fear of righteous retribution at the hands of those he and his predecessors have fooled for centuries. He decries us as savages and heretics, but no one cares for his ravings anymore: the time has come to erase the legacy of Catholicism from our country.\n\nAs the final act of our reformation, we shall abolish the Concordat that our glorious prophet had been forced to sign forty years ago. From now on, the Vatican will be considered responsible for each and every word they say: we shall not be the first to strike, but we shall no longer tolerate disrespect, and in the cold world of diplomacy, verbal aggression is best countered with swift, decisive action."
 ITA_anno_i_sef_desc:0 "The day of the March on Rome has dramatically changed the destinies of not only Italy, but the entire world, starting a series of events that would shatter the old order, and bring about a new one. It is for this reason that our official calendar juxtaposes to the common dating system the year since the March followed by "E.F." or "Fascist Era": this way, everyone will remember the importance of that day.\n\nToday, however, a new momentous event has happened. With our glorious Duce's triumph over the enemies of Fascism, we have avenged our great prophet's betrayal at the hands of Ciano, and ensured the Empire's supremacy over the Mediterranean: such great deeds herald the coming of a new age for fascism, and the entire world.\n\nToday, the First Fascist Era ends, and the Second Fascist Era begins!\n\nGloria al Fascismo, da qui all'eternità!"
 
 #############################
 ###=====| 4) EVENTS |=====###
 #############################

 ITA_giani.1.t:0 "The Price of Righteousness"
 ITA_giani.1.desc:0 "When we set ourselves upon the long and difficult road to turn Italy and the Empire into a Fascist nation, we knew the rest of the world would not have remained silent. Our economic reforms, aimed at turning Italy's economy into a corporatist one, where the needs of the many are satisfied equally and profits are shared among the loyal Italians, have irked the international financial institutions and their well-known masters: it seems that they have now begun their campaign to stop us.\n\nIn a flurry of communiques and so-called "analyses", several major investment funds from New York to Germania have expressed worry about the scope of our reforms and their eventual impact on Italy's solvency. While this serves no other purpose than confirming our suspicion that indeed, the Germans are slaves just as much as the Americans, it does not change the fact that we are feeling the impact of this financial offensive: forced as we are to rely in international buyers for our bonds due to the size of our public debt, this has resulted in a loss of public trust towards our solvency, and increased interest rates.\n\nWhile we could indeed ignore their desperate attempts at hindering our march towards perfection, our glorious Duce knows and understands that declaring default and refusing to pay our debts would prove extremely detrimental to our cause. As such, we shall bear this weight as Atlas does, and show the world that we do not bow to capitalist kleptocrats!"
 ITA_giani.1.a:0 "Their fear is palpable."

 ITA_giani.2.t:0 "Safe Haven in Sight"
 ITA_giani.2.desc:0 "For months, the financial institutions of the capitalist world have done their best to destroy us, trying to bind us to them with chains of debt and ropes of interests. It is a well-known fact that to the American and German kleptocrats and their puppetteers, money is both object of worship and weapon of destruction: for too long has our country, along many others, suffered from their evil plots!\n\nStill, the first results of our war on capitalism are beginning to show. As our society begins to prosper, more and more Italians are showing their trust towards Fascism by sharing our burden: as the international funds leave us, brave Fascist men and women lend their hands and their hard-earned money, to ensure that the Motherland can sustain itself, and provide for them in turn.\n\nSuch dedication and loyalty is proof that indeed, Fascism is the perfect system of government, and our beloved Duce has not forgotten to mention it in his latest speech, which was broadcasted nationwide. Still, honest as he is, Niccolò Giani revealed to our people that the fight is not yet over: as long as our economy remains in foreign hands, no one will be safe from the plots of the German-American financial axis!"
 ITA_giani.2.a:0 "Slowly but steadily, we march towards victory."

 ITA_giani.3.t:0 "Triumph of the Economic Will"
 ITA_giani.3.desc:0 "When a battle ends, losses and gains are counted. Though economic in nature, what we have fought is clearly a war, one which saw the Fascist model against the capital-zionist one: honesty and hard work versus lies and exploitation, sharing and common purpose against accruing and selfishness.\n\nAs the forces leave the field of battle, it is evident that we have prevailed over our enemies. As our reforms come to completion, it has become clear to all that we have not created a nightmare of unimaginable proportions, but a just and fair economy, where all Italians enjoy the fruits of their labor, according to their status and function within the State: slowly but steadily, the crisis that plagued our country ever since the Atlantropa disaster is passing, and everyone can see the results of a Fascist economy.\n\nAs our prosperity increases, the financial institutions of the world have been forced to cease their futile efforts to undermine us. Their latest reports have stated that our solvency is no longer in doubt, and a constant trickle of international buyers is returning, lowering our interest rates over time: not that we need it, of course, but our victory is made sweeter by our former enemies desperately trying to profit off of us once again."
 ITA_giani.3.a:0 "By God and Fascism, our economy is made whole once again."

 ### Giani Character Arc Event Chain ###
 ITA_giani_character_arc.1.t:0 "A Family Dinner"
 ITA_giani_character_arc.1.desc:0 "The banquet hall in Palazzo Venezia was ready for the second celebration in a week. After the first formal feast with all important party officials, bureaucrats and ambassadors, the time had come for Niccolò Giani to celebrate his appointment with his family: he would have wanted a more private setting, but his family was... large, he thought with a tinge of pride.\n\nOne by one, the guests entered the hall, welcomed by the patriarch himself, his wife Maria Rosa by his side. Each had their own welcome: a hug for the three sons, a kiss on the cheek for the two daughters, a kiss on the hand for the daughters-in-law, a handshake for the sons-in-law, and a few jokes for the many, many nephews.\n\n"You never treated us like our children, father!" Enea, his oldest son, said half-jokingly as the old man played with a small toddler.\n\n"Children are to be educated, Enea," was Giani's solemn answer, "While grandchildren are to be spoiled rotten. Isn't it so, Tullio?"\n\nThe infant currently in the Duce's hands giggled adorably at the funny expression on his grandfather's face as he simultaneously tried to play with the shiny uniform, making everyone in the room laugh. After a bit of chatting, the small crowd went to seat, and the patriarch was satisfied by the sight he got from the head of the table: a true fascist family, bonded together by love and respect; at last, however, his eye fell on the last chair to the right at the far end of the long table, the only one left empty, and-\n\nNo. This wasn't the time to reminisce. Maria Rosa turned to him, as if sensing his distress, but he gave her a small, forced smile: it was all well now, it would all be well. As it had been for the last ten years, ever since-\n\nNo! Nervously, he took a chalice and decided to cut the silence."
 ITA_giani_character_arc.1.a:0 ""A toast to our beautiful family!""

 ITA_giani_character_arc.2.t:0 "A Proud Father's Speech"
 ITA_giani_character_arc.2.desc:0 "As Niccolò Giani prepared to hold his speech, he couldn't help thinking that the military shrine of Redipuglia was the perfect frame for such a celebration. Rows upon rows of stone steps engraved with the names of the glorious fallen in Italy's wars celebrated their ultimate sacrifice, the word "PRESENTE" carved dozen of times in each step reminding the viewer that, even in death, these soldiers were still ready to fight for the motherland: an inspiring sight for all.\n\n"Citizens of the Empire," he began, his expression solemn, "we are here today to remember the fallen of the Iraqi war that ravaged the Middle East ten years ago. It is the destiny of the envious to undermine what the righteous toils to achieve, and it is the burden of the righteous to ever rebuild what has been undermined: such is our duty as masters of the Holy Land, and our thoughts goes to the brave men who gave their lives to preserve what the founder of Fascism built."\n\nThe crowd, composed of state officials, journalists, war veterans and members of the Duce's own family, gave a short, measured applause: this was a place of mourning and remembrance, not a stadium.\n\n"Today however," Giani continued, his expression shifting from solemn calm to sorrow, "I join the many who mourn their loved ones, for my family too has been scarred by this war. My second son, Tiberio, was stationed in Baghdad when the war erupted, and died doing his duty: I am in no position to claim that my son's death is worthier of remembrance than the many others that followed in those tragic weeks, but I wanted to let you know that your pain is my pain, and it will not be forgotten."\n\nAs the crowd gave a second, more heartfelt applause, and the journalists wrote furiously in their notebooks - most likely to celebrate the Duce's son's sacrifice - Niccolò Giani noticed that one person, seated in the first row, was not clapping.\n\nHis eldest son, Enea, sat broodingly, looking at his father with scorn, and the Duce made a mental note to ask him about such a strange reaction at a later time."
 ITA_giani_character_arc.2.a:0 "Perhaps he was just thinking about his brother..."

 ITA_giani_character_arc.3.t:0 "Salt Over Wounds"
 ITA_giani_character_arc.3.desc:0 "The Duce's office was empty, save for two people. Niccolò Giani had waited for the right moment, and now was the time: throughout the celebrations at Redipuglia, Enea had kept the same brooding demeanor, and even in the plane to Rome he had sat on his own, far from the other family members. Now, however, they were alone, and even his son looked like he knew what was coming.\n\n"Care to explain your behavior these days, Enea?" Giani asked.\n\n"I'm sorry father, but I could not stand your hypocrisy, not after what you did to Tiberio." was Enea's serious answer.\n\nThe words struck the Duce like a slap in the face. For a few seconds, he looked at his son in surprise, then his face turned red.\n\n"How dare you speak to your father like that!" He screamed.\n\n"How dare "you" use Tiberio for propaganda!" Enea yelled in response: "You lied to everyone! You were the one who sent my brother - your son! - to die in that hellhole!"\n\n"I made him enrol for his own good! You know what he did to deserve tha-"\n\n"I don't care what he did!" Enea interrupted his father, veins popping on his forehead, "I would have loved him even had he been a murderer, but no, you wanted him to be perfect! Turns out he wasn't, and you cast him away like a used rag! He didn't die a hero, he died a barely-eighteen boy who has just been disowned by his father, shoved a rifle in his hands, and told to go be a fucking man! He did not deserve to-"\n\nSuddenly, both men fell silent as they heard a noise from the other side of the door. Someone - a woman - was crying, and as they looked at each other again, they both felt horrible.\n\n"Go console mother," Enea said, his will to fight sapped, "but know this, father: I love you, but I cannot forget what you have done to Tiberio. You should have helped him, and you abandoned him when he needed you the most."\n\nWith that, Enea left the office. Silence fell in the room, broken only by a mother's sorrow for her dead son."
 ITA_giani_character_arc.3.a:0 "Families are human, and therefore cannot be perfect."

 ITA_giani_character_arc.4.t:0 "Old Memories"
 ITA_giani_character_arc.4.desc:0 "Niccolò Giani prided himself on being strong willed. A man must be always sure of his path in life, and this applies even more if said man needs to lead not just himself or his family, but an entire nation: what had happened a few months ago, however, had shaken him more than what he would have liked to admit.\n\nEnea's words had created a rift between father and son, and the situation had not improved in the following days. Maria Rosa had cried for the entire night, and despite his attempts at cheering her up, she would still have nightmares, calling her son's name - Tiberio, Tiberio, Tiberio! - and begging him not to leave: the pain laced in her voice had been too much even for Giani, and after several sleepless nights, now he found himself alone in his private studio, looking at a box placed in front of him.\n\nHis son's words had made him question the most important decision he had ever taken with regards to his family, and had awoken in him the desire to understand. Tiberio had always been a good boy, honest, diligent and good at sports - that is, until he had found a stash of heroin hidden inside his mattress.\n\nAs he thought about what had happened that day, his face contracted into a frown. Strong words had been said, and stronger actions taken: now, he had to deal with the consequences, and the box containing his son's mementos was a good starting point.\n\nWhen he opened the box and started taking out the objects contained within, he was assailed by the memories. The medal Tiberio had won at the Balilla's sports competition, the report cards up to his high school, his toy cars and soldiers: bit by bit, his son's life unraveled before him, and the old Duce didn't notice his lips curving into a smile as he associated each item to a memory, most of which had not been brought to mind in a long, long time.\n\nFinally, the box was empty, and at the very bottom, Giani found something... unexpected. It was a small book, "TIBERIO GIANI - SEGRETISSIMO!" written on its worn brown cover in childish handwriting: was it..."
 ITA_giani_character_arc.4.a:0 ""Wait, did Tiberio have a diary?""

 ITA_giani_character_arc.5.t:0 "Dear Diary, Today..."
 ITA_giani_character_arc.5.desc:0 "As he opened the small book, Niccolò Giani felt a bit like an intruder. He had never known Tiberio was keeping a personal diary, and it felt wrong to intrude in his son's thoughts: still, he had to do it for the survival of his family, so he steeled his heart and opened it.\n\nThe book was indeed a personal diary, each entry having a date, with some just a few days apart, others weeks or months. As he read them, Giani felt as if he was watching his son grow up again: page after page, the handwriting evolved from childish to elegant, the entries themselves longer and deeper.\n\n"5th May 1942. Dear diary, today I aced the grammar test. Mom made my favorite dish, and dad told me he was proud of me! I want to be like him so much: Enea tells me he is very important and people listen to him, I too want people to listen to me when I grow up!"\n"24th May 1942. Dear diary, today I went with dad to a barrack. I have my toy soldiers, but they were real! Even dad had a uniform, with a big medal, and a soldier with an eyepatch told me dad had saved him in Greece: I too want to save people when I grow up!"\n\nGiani chuckled as he read about his son's childish wonder and utter adoration towards him. He knew those entries were useless, but he couldn't bring himself to skip even a single one: it felt as if he could once again listen to Tiberio telling him everything he had done that day, preening like a peacock as if every small achievement had been greater than Scipio's victory at Zama - and perhaps, it was.\n\nA sound distracted the Duce from his reminiscing, making him notice the sunrays filling the room. He had spent the entire night reading!\n\nSlowly, carefully, Niccolò Giani closed the diary and put it back in the box. The dutiful part of his mind told him that he could not put his family before the needs of the State, and he agreed with it, but he felt another part tempting him with the promise of sweet memories: as he looked back to the box, Giani thought that perhaps, once in a while, he could afford to be selfish."
 ITA_giani_character_arc.5.a:0 "Note to self: bring coffee. Lots of coffee."

 ITA_giani_character_arc.6.t:0 "Bad Acquaintances"
 ITA_giani_character_arc.6.desc:0 "Night after night, Niccolò Giani slowly proceeded in his quest to unravel the truth behind his son's addiction. The first sleepless reading nights had left place to a slower, more purposeful pace, each entry savored like a small delicacy rather than gobbled in haste: this was his son's diary, and he would not let a word go to waste.\n\nAs the middle-school boy left the place to a young Lyceum student, however, the tone started to shift. The feelings of wonder and boyish happiness disappeared, slowly replaced by a sense of oppression that made Giani feel... uncomfortable.\n\n7th of February 1949. Dear diary, tonight I couldn't sleep. Last month I barely passed the Latin test, and Father told me that a good Italian must learn the language of our ancestors: he's right, so I spent all night studying, but it's so difficult..."\n11th of June 1950. Dear diary, I ended up with a debt in History, and Father scolded me in front of everyone. I was so ashamed of myself! I need to be better, or I won't make my family proud of me!"\n"30th of April 1951. Dear diary, tonight I had nightmares again. I'm so tired, and I'm failing at my athletics assignment at the Avanguardisti camp, but if I sleep I won't be able to study! Someone, anyone, please help me, I'm so tired..."\n\nGiani remembered those years: Tiberio had started flunking several subjects, so he had made him study harder and hired a private tutor, forbidding him from seeing his friends until he got better. Now, those choices didn't feel so right anymore.\n\n"20th of October 1952. Dear diary, today I met someone at university. I have made few friends in this first month, but another student, Luciano Bresci, approached me kindly, and seemed to notice my... problems. He told me he knows a way to make it all go away, I wonder what he meant by that..."\n\nSuddenly, Niccolò Giani felt his interest piqued again. He vaguely remembered his son talking about some friend he had made when he had started university... perhaps he was getting closer to the truth."
 ITA_giani_character_arc.6.a:0 "Sometimes, not all friends are what they claim to be..."

 ITA_giani_character_arc.7.t:0 "A Matter of Conscience"
 ITA_giani_character_arc.7.desc:0 ""23th of October 1952. Dear diary, can someone feel so bad, and yet so good? Yesterday, Luciano invited me to his home, and there he made me try it... "heroine", he calls it. I felt so good! It lasted only for an hour or so, but I felt so free, It was like I was flying! I hadn't felt like that in months, years perhaps. I want to feel it again, I already miss it, but Father must not know of this, or he'll kill me..."\n\nNiccolò Giani saw red. That- that bastard, cur, whoreson! That "friend" had corrupted his son! He branded that name - Luciano Bresci - in his brain: he would find him, he would make him confess, he would make him pay!\n\nWith revenge in his mind, Giani made to stand, but then he realized that there was still one page left to read, and rage was replaced by a sense of finality. That was it, that was the end of the road: Tiberio's last entry.\n\n"9th of January 1953. Dear diary, this is the last time I'll write here for quite a while. What I had been fearing has happened, and now I must pay. Father discovered my secret, and disowned me: mother tried to talk to him, but he would not forgive me until I proved myself worthy once again. He made me enlist, and I'll depart for Iraq tomorrow: I don't know what will happen there, but if I survive, I won't disappoint my family ever again. I'm sorry Father, I'm sorry Enea, I'm sorry everyone. I promise that, when I return, I'll be the best son ever!"\n\nThe old Duce slumped on his chair. He had never felt so conflicted before: Tiberio had wanted nothing other than to please him, to make him feel proud, and had fallen prey to a monster that had fed on his insecurities. Perhaps, the fault didn't lie with his son, but with himself: had he been too demanding? Had he failed to notice his son's difficulties, like Enea said? On the other hand, perhaps all fault laid with that Luciano. Indeed, he could feel the rage returning: he would never have his son back, but he could still have his sweet, sweet revenge.\n\nThe night gave way to the first rays of the rising sun, and at that moment, Niccolò Giani made his choice."
 ITA_giani_character_arc.7.a:0 ""God, what have I done?""
 ITA_giani_character_arc.7.b:0 ""He killed my son. His pain will be legend.""

 ITA_giani_character_arc.8.t:0 "Taking the Hard Road"
 ITA_giani_character_arc.8.desc:0 "When Niccolò Giani entered his bedroom, he found Maria Rosa sitting at the small writing desk near the window, seemingly engrossed with what she was reading. Looking above his wife's shoulder, he noticed it was an album, filled with old photos.\n\n"Tiberio was always different, wasn't he?" she whispered, so low that Giani wasn't sure it was directed at him.\n\nThe Duce looked at the photo Maria Rosa was pointing at - a group photo of the Figli della Lupa - and understood. While all children were rigid in their salute, Tiberio was the only one smiling at the camera.\n\n"I was his mother, and mothers should know everything about their children before they even know it themselves," she said, then she suddenly turned to look at her husband: "Was I a horrible mother, Niccolò? Did I fail my children?"\n\nThe grief in Maria Rosa's eyes was the final blow. For so long, Giani had believed himself a paragon of familiar leadership - a reborn paterfamilias, a proud fascist patriarch - but in the end, he had lived with his head up in the clouds, while the rest of his family suffered.\n\n"No Rosina," he said despite the lump in his throat, "You have been a perfect mother. If anyone is at fault, then that one is me."\n\nMaria Rosa looked at him interrogatively, so Giani told her everything. About the diary, about what Tiberio had written, and about what he had finally understood: a family, especially a fascist family, must face hardships together, and the harder they are, the more each member must help and sustain the others.\n\nSuddenly, Maria Rosa rose from her chair and hugged him. Niccolò Giani could feel her sobs, but for some reason, he instinctively knew they were tears of happiness rather than pain, and felt the weight on his heart lessen a bit. Not entirely though, because he still had someone to talk to, and he didn't relish it."
 ITA_giani_character_arc.8.a:0 ""Note to self: call Enea tomorrow morning.""

 ITA_giani_character_arc.9.t:0 "Laying Memories to Rest"
 ITA_giani_character_arc.9.desc:0 "Niccolò Giani was looking from the window, lost in thought, so much that he didn't notice his son entering the office.\n\n"Why did you call me here, father?" Enea asked, almost startling the Duce.\n\n"To make peace," was Giani's hesitant answer, then he took courage, and dropped the bomb: "And to apologize to you. I was mistaken, and in my ignorance I caused great pain to not only Tiberio, but to you and everyone. I have failed you, all of you."\n\nAs Enea looked in disbelief, Giani told him everything he had told his wife. It was always harder for a man to admit his weakness to another man - especially to a son - but he had to do it.\n\n"Will you- will you forgive me, Enea?" he asked at the end, ashamed to let his son see him in such a vulnerable state.\n\nWhen Enea moved closer to him, Giani expected a punch, but instead, what he got was a hug. A strong one.\n\n"Enea, you're- you're strangling me!" he choked out, trying to get away from his son's bear hug with his spine intact.\n\n"Thank you, father!" Enea said, commotion deep in his voice: "You understood! Tiberio always wanted you to approve of him, and I'm sure that now he's happy. This is the best thing you could have done for him, more than a thousand speeches or flowers!"\n\nGiani felt a lump in his throat, and he knew that he wouldn't be able to keep it in. Thankfully, he was saved at the last moment, as a third figure, smaller than the other two, added herself to the hug.\n\n"Rosina, this is embarrassing!" he chastised his wife.\n\n"What can I say?" she answered, a wide, beautiful smile replacing the worried wrinkles of the past weeks: "I'm just so happy! Semel in anno licet insanire!"\n\nAs the trio laughed, Niccolò Giani thought that his wife was right. Their family was beautiful, and he couldn't thank God enough for allowing him to save it from destruction."
 ITA_giani_character_arc.9.a:0 "Not that he would admit it. Enough sentimentality."

 ITA_giani_character_arc.10.t:0 "A Proud Father's Promise"
 ITA_giani_character_arc.10.desc:0 "The graveyard was dark, the first light of the coming down barely starting to color the horizon. There were few lamps but the old man knew where to look for: after all, he had been doing this for almost a decade.\n\nAfter a few minutes, just as the first rays of the sun started spreading their light amidst the scattered graves, he found what he was looking for, and put down to work. He replaced the dried-up flowers with fresh ones, and washed away the dust: usually Maria Rosa would do this, but for once, he wanted to make her a surprise when they would "officially" visit the graveyard on Sunday. Also, he needed to talk to his son, without anyone interfering.\n\nSatisfied with his handiwork, he looked at the photo. His son was smiling, happy as he used to be, before everything happened: the old man slowly caressed the photo, and the name right below it. The plaque read "TIBERIO GIANI" in brass letters, surrounded by the flowers his father had just positioned.\n\n"I'm sorry Tiberio," Niccolò Giani began, "I didn't realize how much you were suffering. I was so busy imagining a perfect future for you that I could not understand your insecurities and worries: I thought you were weak, when you just needed your father's hand as all children do."\n\nFor a moment, he thought about all that could have been, and didn't come to be, but then, his lips curved in a thin, barely-visible smile.\n\n"I will never be able to make things right, but I can at least make sure that my family will never experience such grief again. I have no more children to educate, but I have lots of grandchildren - Ascanio has your nose, by the way - and I'll make them happy. I take this vow in front of your grave, my son: that I will be there for them when they need a hand, and they shall not be left alone should their parents make my same mistake."\n\nFilled with newfound purpose, Niccolò Giani felt finally relieved of the misery that had plagued him ever since he had found his son's diary. With a last caress to the old photo, the Duce left the graveyard, unnoticed by the first early visitors."
 ITA_giani_character_arc.10.a:0 "No family is perfect, but all deserve to be happy."

 ITA_giani_character_arc.11.t:0 "Vendetta"
 ITA_giani_character_arc.11.desc:0 "The young man squirmed on the chair he was tied to. Just his luck: the cops had found him while he was checking on the new cargo at Ostia's docks and clubbed him good. He'd had his fair share of arrests and beatings as all those who import drugs and forbidden literature get, but he was sure his boss had bribed the commissar to let them use the warehouse undisturbed, so why was he there?\n\n"Luciano Bresci?" one of the men asked, and he nodded, trying to look around despite his bindings.\n\n"Do you know this person?" The interrogator continued, showing him a photo of a boy about twenty.\n\n"Don't know him," he answered quickly, earning a backhand to the face. "All right, all right. I met him at uni, his name was Tiberio... Giani I believe: I saw him a while, then he went away."\n\n"Did you sell him heroin?"\n\n"No." another backhand. "Hey, I don't remember alright? Do you think I keep a register with all the druggies I sell to? Did the bastard sell me out?"\n\nBresci noticed the policeman's grimace, and decided to press it. After all, it was but a matter of minutes and the commissar would get him out as usual for "health reasons" or some other shit.\n\n"Wait, was he your little brother?" he asked mockingly, just as a door opened behind him: "Sorry, but I can't help you if your baby brother decided that dying of overdose was better than staying with a shit like you."\n\nSuddenly, everyone went completely rigid, and he smirked triumphantly. The man who entered his field of vision, however, was not the commissar.\n\n"He was not his brother," the man said, turning to face Bresci. The drug dealer looked at the uniform, then at the face, and finally, his brain connected the dots: all color drained from his face, and he started trembling violently.\n\n"I-I-I swear I didn't kn-"\n\n"He was my son," Niccolò Giani spoke slowly, looking the squirming maggot in the eyes, "And you took him away from me. Now, you will pay.""
 ITA_giani_character_arc.11.a:0 "Debts of vengeance are to be paid in blood."

 ITA_giani_character_arc.12.t:0 "The Blessing of Ignorance"
 ITA_giani_character_arc.12.desc:0 "The door to the Duce's office opened, making him raise his head from his papers.\n\n"Enea, I was waiting for you," Niccolò Giani spoke in a levelled tone, remembering the last time they had talked in that office. He did not want a rematch.\n\nHis eldest son seated in the plush armchair in front of the ornate desk, looking at his father warily.\n\n"Why did you call me, father?" he asked, a bit of mistrust showing from his tone.\n\n"To make peace," he began, and before his son could interrupt him, he added: "After reflecting for a long time, I admit I had been partially wrong."\n\n"Wrong?" Enea asked him incredulously, though his surprise was not the bad kind, "And why only partially?"\n\n"You too have children now, Enea, so you can understand. Being parents is far from easy, and there is no manual: in the end, one can only act as he thinks is right, and pray that it works."\n\nThe look on Giani's face seemed sincere enough, so Enea motioned for him to keep talking.\n\n"I should have known Tiberio was being misled. He fell in with a bad company who took advantage of his trust and kind-heartedness: I should have protected him more, and I didn't, but I won't make the same mistake again."\n\nEnea sighed. In the end, his father was still the same as always.n\n"That wasn't the point father," he said a bit dejectedly, "But I guess it's useless to argue with you once you have made up your mind. Still, at least you tried to understand, and this is more than I expected you to do: for the good of the family, I guess I'll have to settle for this..."\n\nThe Duce smiled at his son's answer. He could have told him the truth, but in the end it would have not helped: as Enea correctly said, keeping a family together requires sacrifice, and sometimes, a lie is what is needed to prevent a rift from forming. As he escorted his son to the door, he almost envied how lucky Enea was not to know what had really happened, and what he had done to avenge Tiberio."
 ITA_giani_character_arc.12.a:0 "Family is everything."
 
 ITA_giani_character_arc.13.t:0 "A Proud Father's Promise"
 ITA_giani_character_arc.13.desc:0 "The graveyard was dark, the first light of the coming down barely starting to color the horizon. There were few lamps but the old man knew where to look for: after all, he had been doing this for almost a decade.\n\nAfter a few minutes, just as the first rays of the sun started spreading their light amidst the scattered graves, he found what he was looking for, and put down to work. He replaced the dried-up flowers with fresh ones, and washed away the dust: usually Maria Rosa would do this, but for once, he wanted to make her a surprise when they would "officially" visit the graveyard on Sunday. Also, he needed to talk to his son, without anyone interfering.\n\nSatisfied with his handiwork, he looked at the photo. His son was smiling, happy as he used to be, before everything happened: the old man slowly caressed the photo, and the name right below it. The plaque read "TIBERIO GIANI" in brass letters, surrounded by the flowers his father had just positioned.\n\n"I'm sorry Tiberio," Niccolò Giani began, "I didn't realize the dangers you were facing. It is a father's duty to protect his children from danger, and I failed you."\n\nFor a moment, he thought about all that could have been, and didn't come to be, but then, his lips curved in a thin, barely-visible smile.\n\n"However, I did the only good thing I could do. When justice fails, revenge is all that remains, and I did just that: I made that bastard pay for taking you away from us, for taking you away from me. I take this solemn oath in front of your grave, my son: I will not let this happen to my family ever again. I will strike before anyone or anything can endanger them, and I won't have mercy."\n\nFilled with newfound purpose, Niccolò Giani felt finally relieved of the misery that had plagued him ever since he had found his son's diary. With a last caress to the old photo, the Duce left the graveyard, unnoticed by the first early visitors."
 ITA_giani_character_arc.13.a:0 ""I am avenged on you; have I not cause of joy?""

 ### Giani Cult Beginning Chain ###
 ITA_giani_cult_chain.0.t:0 "An Unusual Visitor"
 ITA_giani_cult_chain.0.desc:0 "Aurelio hated his bandages. They covered his entire body and face, blinding him and making him unable to feel anything except the rough cloth: adding to the ugliness, his tears only made them more uncomfortable. He hated his sorry state and those who had caused it; he hated the medal on the bedside table and the one who had given it to him before summarily discharging him; even more, he hated himself for not being strong enough to stop crying.\n\n"Why did you return?" Aurelio spoke with difficulty as he heard the chair by his bed creak: "I don't want another medal! Shove it up your-"\n\n"I'm not your captain," an unknown voice spoke, "And I am not here to give you a medal, though you would deserve way more."\n\n"Are you a priest then?" Aurelio replied, his voice spiteful: "Come to tell me that God loves me? Who can love me now? I'm fucking useless! Go away!"\n\n"I'm not a priest either, Aurelio," the voice answered, "And you are far from useless. In fact, I was looking specifically for you."\n\n"Why?" The other asked, his voice pained now: "I am a cripple! I'll never be able to hold a gun again, and no one will ever wish to look at my face..."\n\n"Aurelio," the voice spoke again, reassuringly: "I need you for the qualities no one has been intelligent enough to see. You did not flee, and were ready to give your life for your comrades, even if they had fled. I need you because you are fearless and loyal, intelligent and caring."\n\nAurelio felt... something, something warm, at the notion that someone out there still needed him. He made to speak, but the bell signalling the end of visitor hours rang, and the chair creaked again.\n\n"Wait!" He exclaimed, suddenly desperate to lose that feeling: "Tell me your name!"\n\n"It is impolite to tell a name without a face to associate it with." The visitor said, chuckling lightly: "I'll come again. For now, concentrate on healing: medicines help, but more than anything, it is a matter of Will.""
 ITA_giani_cult_chain.0.a:0 "Who was he?"
 
 ITA_giani_cult_chain.1.t:0 "To Save an Empire"
 ITA_giani_cult_chain.1.desc:0 "The room was not one of the largest Palazzo Venezia could offer, nor the more ornate, but it was spacious, and located deep into the palace, offering the needed privacy to its occupants. About fifty men stood in ordered rows, all wearing the same uniform - a simple attire resembling a soldier's fatigues, but without the military ranks or other adornments, and with a small cross etched above the heart - while a single man stood behind an ornate desk, his uniform betraying his role and importance.\n\n"Camerati," Niccolò Giani began, "I have summoned you here because the time has finally come to begin our great work. My triumph in the power struggle that lacerated the party has shown that we clearly have God's blessing, but we cannot - we will not - rest upon our laurels: the Soul of the Empire is at stake, and it is our duty to save it at all costs."\n\nAll men nodded their approval, then the Duce continued.\n\n"You are here because you proved yourself superior, and you have the scars to show it, some more visible than others," he said, looking towards a man whose face looked like it had been struck repeatedly with a hammer, a lone tear falling from his mangled cheek, "But in the end, it does not matter. You stood when all others would have long fled, and you showed loyalty and bravery, but more than anything else," he added with a final tone, "You showed Faith."\n\n"The time has come to save the Empire from weakness and decadence. Like the first Christians, who spread the Truth from abandoned warehouses and catacombs, you will go alone among the lost, showing them the way to salvation. I will do my best to help you, but know that you will be alone until I can truly exert my influence over the State: I trust you to sow the seeds, or die trying."\n\nAll men nodded again, no trace of hesitation on their severe faces.\n\n"Go now, the time for words is over. Now it is time to act." Niccolò Giani remained silent for a moment, then he intoned, his voice low but impassioned: "By God and Fascism, we will make Italy whole."\n\n"By God and Fascism, we will make Italy whole." All present replied in unison, and then the meeting was over."
 ITA_giani_cult_chain.1.a:0 "So it begins."

 ITA_giani_cult_chain.2.t:0 "Fata Volentes Ducunt, Nolentes Trahunt..."
 ITA_giani_cult_chain.2.desc:0 "Renato Bortoli left the factory in the outskirts of Rome for the last time, swearing to himself. The production line had been finally mechanised, which meant that hundreds of line workers had been made unnecessary, and fired on the spot - including him. He did not feel like returning home and telling the ugly truth to his wife and children, so after having a few beers at the pub, he took a detour through the abandoned industrial district.\n\nAs he passed the line of decrepit warehouses, however, he noted that one was different. The old building had been renovated, broken glasses replaced by new ones and fresh paint over the ugly red bricks; above the door was the writing "TEMPIO FASCISTA" and by its side, a man with a strange uniform and a face that looked as if it had been repeatedly struck by a hammer. Perhaps to buy more time before his return home, or perhaps out of genuine curiosity, he approached the unknown man."\n\n"Sorry sir," he began awkwardly, "But this is the first time I see this building renovated. Could you tell me what this is?"\n\n"This is a new church," the other answered in a gentle tone, giving him a small, crooked smile with his irregular mouth, "And I am its keeper."\n\n"You really don't look like an ordinary priest though," Renato blurted out, his common sense weakened by the alcohol, then he realized: "Oh, sorry, sorry! I didn't mean to offend you, I just had a horrible day, and perhaps a little too much alcohol..."\n\n"Don't worry," the other man chuckled, extending his hand: "No offence taken. Indeed, I am not your usual priest, but if you really feel like earning a pardon, perhaps we could chat a bit? It's lonely out here, and I have the feeling you don't want to return home, do you? By the way, my name is Aurelio Manzi."\n\nThe former worker was surprised by the man's insight, and looked at the extended hand with a bit of diffidence. After soppesating his alternatives, however, he decided there was little to lose in a chat, and so shook the proffered hand and gave Aurelio his name; then, the two entered the old warehouse, the door closing behind them with finality."
 ITA_giani_cult_chain.2.a:0 "Sometimes, the greatest things have the smallest beginnings."

 ITA_giani_cult_chain.3.t:0 "Like a Useless Rag"
 ITA_giani_cult_chain.3.desc:0 "After his eyes became accustomed to the darker interior of the former warehouse, Renato noticed the simple furniture. Rows of pews faced a raised podium upon which a lectern - with no altar - was locate: Aurelio sat on the closest pew, and motioned for the former worker to join him.\n\n"If I may be so bold to ask," the man in the strange attire began, "What happened that led you to drink yourself up and take a detour through a desolate landscape such as this?"\n\n"I just lost my job." Renato replied after a moment of hesitation, then his tone became impassioned: "The factory got all those fancy machines that need no workers to man them, and I was fired, discarded like a useless rag. Bastards, all of them!"\n\n"I know your pain, Renato," the other interjected, "But you must not let it overcome you."\n\nThe factory worker was about to reply that he knew nothing, but Aurelio was quicker.\n\n"Look at my face," he said, pointing to his mangled features. "Do you know how I got this? I was a policeman until two years ago, then I went to break a strike when the war against Turkey began: we entered the factory, and were ambushed by armed socialist partisans. My so-called comrades fled, while I was left behind with a bullet in my leg: one of the partisans reached me and struck my face with a hammer, again and again, until I lost consciousness."\n\nFor a second, his face contorted, and Renato felt like shit. What was his job compared to what that man had suffered?\n\n"In the hospital, my superior told me that I had been a great hero, but I was no longer fit for service. My leg was permanently damaged, which made me useless: ten years of service, and I was discarded like a useless rag. In that bed, I cursed myself, the cowards who had abandoned me, and the God who had turned me into an ugly cripple, but then I was saved."\n\n"By who?" Renato asked, suddenly enraptured, but Aurelio tutted.\n\n"It's late, my friend, and you have something to explain to your family, don't you? Return another day, and we'll chat some more."\n\nThe former factory worker left the building, feeling strangely better, and promised himself to return."
 ITA_giani_cult_chain.3.a:0 "Nothing brings people together like shared suffering."

 ITA_giani_cult_chain.4.t:0 "A Matter of Will"
 ITA_giani_cult_chain.4.desc:0 "Renato reached the warehouse in the evening, just in time to see Aurelio open the door and bid farewell to another person. The night before, he had told the truth to his family: it had not been pretty, but he had felt no shame in telling it, as he had learned that some people have faced adversities much worse than his - in this, the small conversation with the strange preacher had greatly helped him, and he was eager to continue it.\n\n"Good evening Renato!" Aurelio addressed him with his mangled smile, "You come just in time. I had just finished talking to another visitor."\n\n"Was he another person in difficulty like me?" He asked.\n\n"In part, yes." Was the honest answer: "In the end, everyone has their own suffering, some bigger, others smaller, all painful nonetheless - but I digress. We were talking about my convalescence, weren't we?"\n\nRenato nodded, and the two sat on the same pew as the other day.\n\n"After a few days, I received a visit from a stranger. He was a peculiar man, but with an aura of surety I couldn't ignore: he told me that I had done a great service to Italy, and that I was not useless like my superior had said. He told me that I still had so much to give, and that in the end, we do not need to curse God for our misfortunes, but rather look at ourselves to overcome them."\n\n"How so?" Asked Renato.\n\n"Because it is all a matter of Will. We cannot control what befalls us, but we can decide how we react to it: the greater our suffering, the more difficult to overcome it, but if we manage, we become better and stronger."\n\nSuddenly, Aurelio took Renato's hand is in his, a determined look on his asymmetrical face.\n\n"This is what I'm telling you, Renato. You must not give up, no matter what happens! If you are alone and sad, you must first and foremost find it within yourself to resist, and fight to the end: this is what that man told me. Now, I wish to repay him, and I will do whatever it takes!"\n\nRenato was left speechless, and when he left the church he was certain that Aurelio was a good man, perhaps one of the best he had ever met. A single question remained in the back of his head, but he ignored it for the moment."
 ITA_giani_cult_chain.4.a:0 "Who was the mysterious stranger?"

 ITA_giani_cult_chain.5.t:0 "Fascist Mysticism"
 ITA_giani_cult_chain.5.desc:0 "Renato looked at himself in the mirror. After talking with Aurelio, he had decided that he too needed to show some Will: he could not let himself be brought low by his misfortunes, but rise above them. As such, he had imposed upon himself to live a more disciplined life: he had stopped drinking to drown his sorrows, and had instead set up upon finding a new job, eventually becoming a handler for a slaughterhouse at Ostia - hardly anything remarkable, but now he could once again feed his family, and he felt so, so proud of himself.\n\nLately, however, he had noticed something strange happening to him: every Sunday, he still went to mass with his family, but he could no longer find any warmth in the priest's words. The man was kind, but his words were empty: he spoke of love and forgiveness, but he did nothing to show the faithful what they meant. Aurelio's mangled face appeared much kinder, because it was true: for this and many other reasons, he decided to approach the preacher that evening, to ask him about his creed - the man clearly was not Catholic, though he professed himself as Christian.\n\n"You are right Renato." Aurelio told him sincerely: "I used to be Catholic, but I could not forgive them for filling my empty soul with platitudes and lies. I am a Fascist Mysticist."\n\nFor a moment, Renato looked at the preacher quizzically.\n\n"Fascist? Isn't this a political ideology?"\n\n"It is, my friend, but it is so much more. Fascism teaches us to devote ourselves to God and to our country, to be strong for our comrades and friends. It teaches us to give our all every day of our life, no matter how little we can contribute - isn't this beautiful?"\n\nThe factory worker felt speechless. He could not find it within himself to agree with Aurelio at the moment, but his words did not seem entirely wrong.\n\n"The Church is empty, Renato. It tries to fill the void in its heart with money and power, but it lacks what matters the most - it lacks a Soul. I have found more Soul in Fascism than I will ever find in the Church: I know that it sounds strange to you, but please, come next Sunday, when I will hold my first sermon. You have been kind to me despite my ugliness, and I would like to help you."\n\nRenato did not answer immediately, but still smiled at his friend, and left the temple pondering upon this offer."
 ITA_giani_cult_chain.5.a:0 "Sometimes, a life can change in a single choice."

 ITA_giani_cult_chain.6.t:0 "The First Sermon"
 ITA_giani_cult_chain.6.desc:0 "Renato entered the temple a bit hesitant. In the end, he had decided to come: Fascist Mysticism still sounded very strange to him, but he could no longer hold his curiosity, and felt he owed it to the preacher. The sermon was about to begin, and the first rows of pews closest to the lectern were full: most of the warehouse was still empty, but he counted about forty people there - not too few, not too many.\n\nAs he sat, he noticed most of the present had his same aura of insecurity, with many looking around themselves nervously. He had known some of them over the weeks: most were people like him, who had been left alone by an uncaring world. All heads turned when Aurelio entered the room, and reached the lectern.\n\n"Camerati," he began, "I thank you for being willing to at least come and listen. In a way, this is new to me too: this is my first sermon, and I hope to be able to convey with words what I feel in my heart."\n\n"You might expect me to start quoting the Bible, but this is not what you need. For we already have many stories of sacrifice and suffering among ourselves, and each is worthy of being told in a parable. We have talked much in these weeks, and I am happy to say that each and every one of you has shown a great Will: you all have tried to improve from your difficult situation, and already the first results show. You can be proud of yourself!"\n\nRenato felt something... warm inside him. He had worked so hard, and it felt so good knowing that there was someone understanding him, instead of a priest who had lived comfortably in a house paid for by the faithful. Lately, he had started feeling angry at the people going to church, chanting empty platitudes while real people - people like him and Aurelio - were left to suffer.\n\n"To always be true, to always strive to better oneself and the world, to fight against the storm by any means: this is the essence of Fascism - and you, my friends, are already exemplary Fascists in your hearts without knowing it."\n\nThe sermon went on, but Renato was no longer in doubt, like many others in the room. He had decided to embrace this faith, for it had given him more than anything the corrupt Church had given him."
 ITA_giani_cult_chain.6.a:0 "A new fire burns in our hearts."

 ITA_giani_cult_chain.7.t:0 "A New Community"
 ITA_giani_cult_chain.7.desc:0 "Slowly but steadily, the life of Renato Bortoli had been filled with new things. He had started to help Aurelio running the temple, and together they and others among the first converts had set up a camp kitchen for the poor and the unemployed: a few refused help, afraid of what they deemed dangerous people, but others remained, first to receive help, and then to give it back.\n\nBy the end of the month, more than sixty people were attending the sermon, and this had not gone unnoticed. Renato's wife told him that the priest had talked of the new temple, calling those attending it heathens and quasi-pagans, but this had only strengthened his convictions: as Aurelio had told them the week before, it is natural for the corrupt and the decadent to cling to power with any means, dividing a community to set the meek one against another. He had explained it to his family at dinner, and while not entirely convinced, his wife had agreed that the priest had seemed afraid.\n\nDay after day, life confirmed to the former factory worker the righteousness of his choice. He had been promoted to foreman in his shift, his superiors praising his work attitude in front of everyone: he had felt proud, but at the same time he had been certain of it - to he who possesses enough Will, everything is possible in due time.\n\nHe had also abandoned his old circle of friends. They were weak people, drunkards who were content with doing odd jobs to eat another day's fill: he felt they were unworthy of his time and his attention, as by refusing to seek help, by refusing to better themselves, they had become their own oppressors rather than victims of adverse fate. His life was now spent with either his family, or the members of the growing Fascist community, and he was happy."
 ITA_giani_cult_chain.7.a:0 "The true triumph of the Will."

 ITA_giani_cult_chain.8.t:0 "Revelation"
 ITA_giani_cult_chain.8.desc:0 "The warehouse was almost full now, with more than a hundred people occupying about three fourths of the pews. Renato was, as always, in the first row, but there was something else to his coming well ahead of time: Aurelio had told them that the man who saved him was coming to visit him, and congratulate them for their great work. For once, the preacher was not standing atop the podium, but rather at its basis, but then the door to its left opened, with Aurelio immediately saluting rigidly, and the entire crowd gawked.\n\nNiccolò Giani advanced purposefully towards the lectern, his ornate uniform shining in the light. He seemed almost unreal in the simple, unadorned warehouse-turned-temple: from his pedestal, he looked at the crowd, and all felt as if he was looking at each and every one of them with his full attention.\n\n"Camerati, Fascisti, Fratelli," he began to speak without any prompt or manuscript, his voice strong and steady, "I come here to congratulate all of you. I had entrusted my loyal adjutant with beginning to spread the seeds of our creed, but I find myself aghast at such extraordinary results. Truly, you are a sight to behold, like water for a parched throat."\n\nRenato was in awe, not just at the presence of the Duce, but at the fact that He was proud of them - proud of him!\n\n"You are the heralds of a new age for Italy, an age where all Italians will be united in their life for God, and their devotion to one another. Slowly but steadily, we shall build together a new world: sacrifices will have to be made, for the corrupt, decadent rulers of the Old Night will forever refuse to usher in the Dawn, but you already know it - for those with enough Will, everything is possible!"\n\nFor a moment, he stayed silent, then he intoned, his voice final and at the same time bearing a promise of an incredible future.\n\n"By God and Fascism, we will make Italy whole."\n\nRenato was crying, and many with him. This was a life worth living, in service to those who truly believed.\n\n"By God and Fascism, we will make Italy whole." said Aurelio.\n\nYes. There was no longer doubt in Renato's heart, only a steel-wrought certainty. He would bring his wife and his children to the temple, and he would convince them to embrace the Truth - and he would succeed, because he had the Will.\n\n"By God and Fascism, we will make Italy whole." He said, still crying, and he felt warm and happy, so, so happy."
 ITA_giani_cult_chain.8.a:0 "By God and Fascism, we will make Italy whole."

 ITA_giani_cult_chain.9.t:0 "There's No Rest for the Righteous"
 ITA_giani_cult_chain.9.desc:0 "The door to Niccolò GIani's office opened, making the Duce raise his head from the documents he was engrossed into. The frown on his face immediately turned into a friendly smile as he recognised his guest, and he rose to greet him.\n\n"Aurelio," he said warmly, "What a pleasure to see you again after all this time. We both got quite older, didn't we?"\n\n"Mio Duce!" Aurelio Manzi exclaimed, his mangled face severe, then he allowed himself to relax: "Indeed, time is kinder to wines and paintings, Your Excellency."\n\n"It is surely so, Aurelio." Giani replied, lightly chuckling: "However, while I greatly enjoyed the time spent exchanging letters with you, I did not call you here for leisure. In fact, I have a new task for you, one I would not assign to anyone else."\n\n"I live to serve, mio Duce!" The preacher exclaimed.\n\n"As do we all, Aurelio." Was the serious reply. "I have called you because not only have you been loyal throughout the years: you have succeeded where many have failed. I still remember your community being the first and largest: now, Aurelio, I need you to take on another flock, one much larger."\n\nAs Giani explained the task, Aurelio's eyes lit with wonder first, then excitement.\n\n"Since this task is far greater than any I have assigned to you until now," the Duce finished, "I will give you the possibility to refuse, and let another take on your task: you have served admirably for a decade, and there would be no shame in refusing."\n\n"You must be joking, mio Duce!" Aurelio replied, mockingly incensed: "This will be my greatest honor and my greatest accomplishment! However, I ask for permission to bring a companion with me, one who has been not just a devoted follower, but a dear friend as well."\n\n"Your request is granted, of course." The Duce replied without hesitation: "You have my full trust. Succeed, and I will dedicate a statue to both of you in the main hall of Palazzo Venezia. Now go with my blessing, Aurelio. May God be with you."\n\nAurelio saluted once again, and then left, a new fire burning in his heart."
 ITA_giani_cult_chain.9.a:0 "Old heroes are called to serve once again."

 ITA_giani_cult_chain.10.t:0 "A New Ingredient in the Melting Pot"
 ITA_giani_cult_chain.10.desc:0 "The immigration officer sat behind his desk, doing his job as always. Every day, hundreds of people disembarked at the dock, looking for a new future in the United States of America, and his job was to make sure that only the good ones actually found such future: Lady Liberty watches over us all, but officer Hugh Nellis watched over her too.\n\n"Name, place and reason." he asked in English to the man who had approached his desk, a small family huddling behind him. He always asked in English, and those who could not answer would be getting an immediate ticket back to their own hellhole - not that he cared.\n\n"Renato Bortoli, Italy, cousin own... bakery, Detroit." was the answer. The English was broken and thickly accented in that funny way all Italians have, but comprehensible, and the documents were authentic: with a sigh, officer Nellis stamped "APPROVED" on his paper.\n\n"Name, place and reason." he asked in English to the next man in line. When he saw him, however, he slightly recoiled in disgust: the man looked like his face had made love with a hammer - messy love, to boot.\n\n"Aurelio Manzi, Italy. The cousin of a friend own bakery in Detroit. Documents here." The man said in an English that was almost as broken as his face, but at least better than the one before him. Still, the documents were fine, so "APPROVED" it is.\n\nAs he watched the man reach his friend, he couldn't help thinking about the irony. Those Italians, fucking high and mighty at home with all their fancy ruins and eagles, and oh-so-servile when they learned how much of a shithole their country truly was: they came here like parasites, occupying their space and taking their jobs while their leaders at home spoke of... whatever nonsense religion they had. Then, his attention returned to his job.\n\n"Name, place and reason." he asked in English to the woman before him."
 ITA_giani_cult_chain.10.a:0 "Oh, if only he knew..."
 ITA_giani_cult_chain.10.b:0 "Bah, just another immigrant."

 ITA_giani_cult_chain.11.t:0 "A Meeting of Fate"
 ITA_giani_cult_chain.11.desc:0 "Giovanni "Johnny" Caruso left the factory in the outskirts of Detroit for the last time, swearing to himself. The firm was relocating to Los Angeles, and he could not afford to change house - so, he was out. He did not feel like returning home and telling the ugly truth to his aged mother, so after having a few beers at the pub, he took a detour through the outskirts.\n\nAs he passed the line of decrepit warehouses, however, Giovanni noted that one was different. The old building had been renovated, above the door was the writing "MYSTICAL TEMPLE" and by its side, a man with a strange uniform and a face that looked as if it had been repeatedly struck by a hammer, talking to another, ordinary man. Perhaps by curiosity, or perhaps to stall the unavoidable, he decided to approach them.\n\n"I'm sorry," he asked in the broken English all Italian immigrants share, "What is this place?"\n\nThe two men turned towards him, and Giovanni noticed their attire. They both wore some sort of military fatigue but with a cross etched over the heart; recognising the accent, they both smiled at him, then the one with a mangled face spoke to him, in Italian.\n\n"This is a church, and we" he nodded towards his companion, "Are its keepers. But who are you, if I may inquire, and why do you look so sad?"\n\nPerhaps it was the alcohol, but Giovanni felt his lips trembling at the kindness in that voice - at the sound of his mother tongue after months of screams in English and harsh insults - and started sobbing as he told the two strangers his story.\n\n"How sad, Giovanni," the ordinary-looking man interjected, "But you must not let it get to your heart. Listen, how about you rest here a while? When you are sober, you can return home. By the way, I'm Renato, and my friend here is Aurelio."\n\nGiovanni didn't feel entirely comfortable, but in the end, what did he have to lose? So, the three entered the warehouse, the door closing behind them with finality."
 ITA_giani_cult_chain.11.a:0 "The thread of fate follows His designs."
 ITA_giani_cult_chain.11.b:0 "Wait, what is this?"

 ITA_giani_cult_chain.12.t:0 "In the Shadow of the False Liberty"
 ITA_giani_cult_chain.12.desc:0 "The people huddled close to one another in the small, clandestine church that had been set up into one of the many abandoned warehouses in Detroit. Places like these were many, offering refuge - both spiritual and physical - to men who were either too poor or discriminated to find anywhere else to be: this place, however, was different, as there was no altar at its centre, but only a lectern, with a cross behind it.\n\nThe people sitting on the unadorned pews spoke among each other while warm bowls of soup were passed; most talked in Italian, but some even in English or Spanish, for desperation brings one to seek aid wherever it may come from. Then, the door opened, and all eyes turned to the two men who entered the decrepit chapel: one of them had an ordinary face, while the other appeared as if it had been repeatedly struck by a hammer. Both wore a strange outfit, similar to a military fatigue but with a cross etched near the heart.\n\nThe man with a mangled face spoke in an equally-broken English, so that all could understand him, but he knew in his heart that they would have understood even had he spoken in Arab. He told them of the love God holds for all of mankind, and the challenges that they all had faced; he told them of the Will they all were to show in order to improve their lives, and of the true Freedom that would come from elevating themselves - not the fake one sold by the corrupt, decadent government.\n\nSome people smiled at hearing those kind words, others cried, but all felt a warmth inside them, one they had never felt in the cold world they were forced to live in. As the sermon came to an end, the priest bade his small flock farewell.\n\n"By God and Fascism, we will make America whole." Said the preacher with a mangled face.\n\n"By God and Fascism, we will make America whole." Said his companion.\n\n"By God and Fascism, we will make America whole." Said in chorus the desperate men and women, and they were happy, so, so happy."
 ITA_giani_cult_chain.12.a:0 "So it begins anew."
 ITA_giani_cult_chain.12.b:0 "This is a nightmare..."