 ITA_spreading_our_wings_desc:0 "The Empire cannot grow by merely focusing on what happens within its borders. The time has come to enter the fray of world diplomacy, and pursue our interests by word or by sword, as the situation demands: in order to protect our Empire, we will need to find new allies, and identify our enemies.\n\nOur ambassadors and diplomatic missions await instructions. The world is changing, and we must make sure to be the ones leading the change, for as the ancients used to say, "Fata volentes ducunt, nolentes trahunt": fate leads the willing by the hand, and drags the unwilling by the hair..."
 ITA_the_west_where_the_sun_fades_desc:0 "The American continent, where the sun fades, is large and diverse. To the North lie the United States of America, last bastion of the old capitalistic order and leader of the Organization of Free Nation, and their main ally and satellite, Canada: these nations would make potential trade partners, but their propension for meddling in matters outside of their competence is... irritating, to say the least.\n\nTo the South lie our Latin American brothers, descendants of the Iberian colonists. While poorer - and decidedly less stable - than their northern cousins, these countries have great untapped potential, and appear much more willing to follow our lead in exchange for investments: with the Triumvirate nothing but a bad memory, this could be a new, rich market for our business..."
 ITA_americas_only_master_desc:0 "The United States of America are, and forever will be, masters of the American continent. After a period of decadence and turmoil following their defeat in the last war, the country has recovered from the damage, and now looks with vengeance to those who humiliated it: tensions with Japan are rising, and their intervention in Africa shows that the Reich is a target too.\n\nOur relationship with the United States is tenuous to say the least. On one hand, they hate the Germans as much as we do, but on the other, they are responsible for the war in Africa which sent tens of thousands of refugees into our Ethiopian colonies, greatly damaging stability in the area: how should we answer to this act of ingerence in our African domains?"
 ITA_open_up_talks_desc:0 "While their actions are unjustified, we are not above civilized discussion. The Americans know that we are the first and only barrier between the Reich and their dream of European supremacy, and they might be willing to parlay: as they say, the enemy of my enemy...\n\nOur embassy in Washington will receive instruction to begin talks with their American counterpart. Of course, we will never consider the United States as "friends'', but a normalization of diplomatic relations will benefit both parties: if a trade agreement can be reached, all the better for us..."
 ITA_sanctions_for_the_african_war_desc:0 "The OFN ingerence in the German colonial possessions cannot, and will not, be tolerated. While we may hate the Germans as much as they do, this is no excuse to interfere in an already-problematic land: the Dark Continent belongs to the winners of the last war, and their meddling in our domain has already done enough damage to our colonies in Ethiopia!\n\nTo this end, we shall impose economic sanctions against the United States of America. While mostly symbolic, this measure will let everyone know that we are ready and willing to counter Western imperialism in any form: the OFN should remember what happened the last time they tried to impose their decadent ideology upon the world..."
 ITA_albions_shadow_desc:0 "In the frozen land of Canada lies the last remnant of the once-glorious British Empire. After the disgraced Edward was reinstated as a German puppet, the rest of the royal family - who had already left Europe after London fell - declared him a usurper: now, they plot from the other side of the Atlantic, dreaming of returning home.\n\nHow ironic that the greatest Empire in the world, that once caged us in the Mediterranean to prevent us from realizing our ambitions, is now nothing more than an American satellite, depending on their master for their very survival. Perhaps we can deign to visit them and strike a deal, remembering the old times: to quote our ancestors, "sic transit gloria mundi", so passess the world's glory..."
 ITA_the_slumbering_giant_desc:0 "Brazil is the largest country in the Southern part of the American continent. Formerly depopulated and underdeveloped, the country has seen an economic and demographic boom in the last two decades, thanks to massive immigration from German-occupied Europe: adding to its value, Brazil's government sees Italy as a potential ally in keeping them out of the clutches of the United States.\n\nOverlooking such green pastures is nothing short of a sin. We shall immediately send a diplomatic mission, and sign several economic and diplomatic treaties that will make our nations even closer than they already are: this will surely help us recover from the loss of our Triumvirate allies!"
 ITA_the_riches_of_the_west_desc:0 "While Brazil may be the largest country in Latin America, it is not the only one. Mexico, Chile and - especially - Argentina are desperately looking for investments to grow and provide important services to their citizens: this would be a great boon for our economy!\n\nThankfully, these countries are historically friendly towards Italy, in no small part due to the several millions of Italian citizens who have migrated there over the decades to escape poverty. As some of them have managed to climb the social ladder of their adoptive countries, we could use their influence to help our diplomatic efforts: surely they will see the benefit in helping their native homeland..."
 ITA_the_ruins_of_africa_desc:0 "Central and Southern Africa, the former British and French colonial Empires, are now nothing but a land of death and disease. Two decades of German colonization, the devastation of the war between the Afrika-Schild and the OFN and the ensuing chaos have left their mark: with the exception of our colonies, the rest of Africa looks like a slaughterhouse, or worse.\n\nStill, something is stirring in the Dark Continent. New countries are arising from the chaos, and look for help in their struggle to reach modernity: while inferiors would look much better under our stewardship, we aren't so stupid as to put our head in that beehive, and will instead try to start productive trade relationships with them... at the right price, of course."
 ITA_the_center_where_the_sun_shines_desc:0 "Europe, our native land where the sun shines, must remain the primary focus of our diplomatic efforts. As of now, the continent is divided between two spheres of influence: Northern Europe languishes under the German yoke, though the Reich has lost much of its old power, which could provide an opening in the long run.\n\nSouthern Europe, however, is a more complicated matter. With the dissolution of the Triumvirate, the very heart of our Empire is threatened, which makes our strategy clear: in order to prevail against Germany, we need to secure our hold over Southern and Eastern Europe, and then advance our interests up North."
 ITA_europes_old_master_desc:0 "For almost twenty years, the German Reich has been Europe's uncontested master. Despite our resistance, it has always been clear who had the largest army, economy, and empire - not to mention a nuclear arsenal: this, however, has dramatically changed after the German Civil War.\n\nThis devastating conflict has wrecked unimaginable havoc on the German Sphere, with several Reichskommissariats seceding and Germany itself turned asunder by bombings, reprisals and scorched earth tactics. This presents us with an incredible opportunity: we can now deal with the Reich on an equal footing, and this will allow us unprecedented freedom of movement in Central and Northern Europe."
 ITA_their_empire_of_ash_desc:0 "It is clear that the Reich is our greatest enemy. There can be no alliance with the heirs of Arminius and Alaric, for their love for violence and their penchant for treason are well known by now: it is time that we renew our efforts against such a vile enemy!\n\nThe German civil war has destroyed the Reich's hegemony over Europe, and turned their Empire of depravity into ash. Our solemn duty is to let ashes be ashes: in due time, we shall take their place as legitimate rulers of Europe..."
 ITA_but_ash_can_bloom_again_desc:0 "Despite our enmity with the Reich, continuing with our current stance will only ensure our mutual destruction. Since a... reasonable Führer has prevailed in the civil war, we should not squander this opportunity: as a civilized nation, it is right and proper that we try to find a civil agreement first...\n\nOf course this benevolence of ours will not come scott free. The Germans must first apologize for their treachery, and pay what's due for Atlantropa's devastation of Mare Nostrum: humility is the key to heaven, and it is time for our former allies to show some..."
 ITA_the_two_cains_desc:0 "Abel was quite unlucky to have Cain as brother. Imagine how it must feel to have not one, but two such relatives: our former allies in the Triumvirate, Turkey and the Iberian Federation, have stabbed us in the back in the moment of our greatest need, and tried to destroy our hegemony over Southern Europe.\n\nWith our political matters mostly solved, it is time for us to decide what to do with our "dearest" brothers. Some would love to punish them for their treachery, but the more moderate members of the cabinet advise caution: our economy is still ailing from Atlantropa, and antagonizing our former main trade partners would not help our situation..."
 ITA_securing_mare_nostrum_desc:0 "The Mediterranean sea is our home and our greatest resource. Trade flows from the Suez to the ports in Southern Italy, and with it comes prosperity for us and the entire Empire: many countries overlook Mare Nostrum, and several of them are part of our sphere of influence.\n\nWith our political situation improved, it is time for us to ensure that these countries remain closely-aligned with us. Greece, Albania, Croatia, Tunisia and Egypt are extremely important for the security of our borders: we should make sure that they do not become a threat..."
 ITA_the_danubian_limes_desc:0 "The Danube, once the fortified border of the Roman Empire, is now the frontline of the Great Game between us and the Germans. For decades, Eastern Europe has languished for decades under the German yoke: Romania, Bulgaria and Hungary all show the scars of Hitler's wanton thirst for power...\n\nWith the Reich's grip over the continent weakening, many such countries are trying to escape German domination. Romania would prove a strong ally in the area - not to mention their oil - while the others would be a useful buffer against Northern aggressions: truly, history does repeat itself..."
 ITA_our_fallen_brothers_desc:0 "The French State is a sad parody of a nation. Once our greatest rival in Europe, it is now a shadow of its former proud self, living in a neverending nightmare of humiliation at the hands of the Reich's rogue spawn: how far have they fallen in so little time!\n\nWhile powerless, this rump state can still be of some use to the Empire. Its access to the Atlantic at Bordeaux would help us reach the Americas without having to circumnavigate the Cape, and it would make both a new market for our goods, and a useful source of cheap labor: it is time to pay our neighbors a visit, and remind them that beggars can't be choosers..."
 ITA_and_the_cancer_eating_them_desc:0 "The Ordensstaat Burgund is the greatest proof that the Germans are naturally brought to destroy rather than build. Created as Himmler's playground and golden prison after his failed coup, it is now a nightmarish realm of pain and terror for its inhabitants: those few who manage to escape tell of city-sized slave camps, and factories where children are worked to death in the pursuit of whatever madness the rogue SS is planning.\n\nAfter they broke out from the Reich in the aftermath of the German civil war, the SS have begun a policy of infiltration and sabotage across Europe. While we have managed to capture a few of their agents, the SIM suspects they are but the tip of the iceberg: in order to prevent these madmen from further destabilizing our Empire, we need to strengthen our defences, and surveil them much closer than before."
 ITA_the_steppes_stir_desc:0 "The territories once belonging to the Soviet Union have lived for decades in a state of complete anarchy. Warlords of all kinds, from generals of the former Red Army to bandits and madmen, have slaughtered each other with relish in the futile effort of imposing their rule over the Russian steppes: truly, something to make Attila proud.\n\nRecently, however, things are changing. The Russian warlords have begun an aggressive push for unification, with some of them slowly coalescing the weaker ones around them, or directly crushing their adversaries: it is in our interests to make contact with those who might be aligned to our interests, and make sure that they prevail in their struggle for supremacy..."
 ITA_a_modern_silk_road_desc:0 "Centuries ago, the Silk Road brought the famed material and many other exotic goods from China to Europe. Passing through India, Persia, Byzantium and finally reaching Venice, it was the richest trade route to ever exist: though in the end it was replaced by modern travel, its legacy is without peer.\n\nWith Atlantropa blocking our access to the Atlantic, however, we are forced to look towards different trade partners. Japan, India and China beckon, and it is time to bring back the old Silk Road: this time, however, it will not bring silk on camel's back, but it will transport tonnes of goods with the help of modern rails and air lines, and in the process, it will cement our relationships with the countries it crosses!"
 ITA_the_east_where_the_sun_rises_desc:0 "Asia, where the sun rises, is a continent teeming with great opportunities. Once the land of silk and jade, it has changed dramatically in the last half-century after Japan imposed its hegemony over the area: now, the Co-Prosperity Sphere is an industrialized, continent-spanning Empire, ruled over by its stern master.\n\nOur advisors are unanimous in their counsel. With Japan being our closest ally, and an economic juggernaut in its own right, it is only natural that we should cement our ties with the leading power of Asia: the land of Marco Polo awaits!"
 ITA_asias_new_master_desc:0 "After decades of Western domination over Asia, a new power emerged. The Japanese Empire has risen to the rank of world power, first - and only - Asian country to reach such a goal: now, they dominate over what used to be the British, French and Dutch colonial Empires and over most of China.\n\nWhile our ties to Japan are obvious, a question remains over how to improve them. The most logical choice would be to embrace our bond with the land of cherry blossoms, but many warn against such a choice: once you choose a side, it's forever..."
 ITA_rekindling_our_bond_desc:0 "Our relationship with Japan has become what it is in the last war. Our men fought side by side in many theaters, and forged the bond that can only be born from blood spilled together: adding to our shared experience, we were both betrayed by the Germans, and are both recovering from a difficult crisis.\n\nWhile race divides us, we cannot ignore the obvious. The Japanese are honorable warriors and steadfast allies, and they have not betrayed us: it is time to rekindle our bond for the benefit of all!"
 ITA_forging_a_new_one_desc:0 "Our relationship with Japan has been forged in the last war. Our men fought side by side in many theaters, and forged the bond that can only be born from blood spilled together: adding to our shared experience, we were both betrayed by the Germans, and are both recovering from a difficult crisis.\n\nWhile race divides us, they were willing to die for us, and stood by our side when all others abandoned us. Such brave spirit and honorable nature are rare qualities in this dark, sad world, and we shall never forget it: it is time for a new bond to be forged with such kindred souls, an eternal one, made of steel and diamond!"
 ITA_a_door_to_china_desc:0 "China has changed much in the last two decades. The formerly primitive Qing Empire has given way to an industrialized behemoth, whose products feed the Japanese Sphere: while the West is still occupied by the remnants of the Republican army, the coastal regions are rich and developed, making investing into them a highly-lucrative endeavor.\n\nLuckily, we have a perfect bridgehead in the lands of the former Celestial Empire. While no longer a proper concession, our diplomatic quarter in Tientsin is large and underused: it is time to bring it back to its former glory, so that it can house diplomatic conferences and business headquarters, from which we shall tap into the infinite riches of China!"
 ITA_a_gateway_to_india_desc:0 "The Indian subcontinent is a large but underdeveloped land. The former British Raj is now divided between various potentates vying for supremacy, while the peasants live in primitive conditions: this offers us a prime opportunity to expand our trade.\n\nBy investing in the Indian nascent industrial sector, we can greatly help our firms recover from the economic downturn. India needs, roads, railroads, modern buildings and much, much more: while we can't hope to keep this treasure trove all for ourselves, we'll still reap great benefits from any kind of cooperation with the Indian nations!"
 ITA_the_treasures_of_the_east_desc:0 "While Japan, India and China are the largest Asian countries, there are many other potential partners. The dissolution of the French, British and Dutch colonial domains left many young nations looking for investments and help: of course, we are more than willing to provide such things, for the right price...\n\nOne thing should be kept in mind, however. Our main focus in Asia is Japan, and we should not jeopardize our relationship with them: it would be foolish to cut our ties with our closest allies only to trade with some hostile backwater country!"
 ITA_a_global_empire_desc:0 "Finally, our efforts are being repaid. Thanks to our treaties with dozens of countries, both big and small, our interests are secured both at home and abroad, and our economy is thriving: gone are the days of the Atlantropa disaster, now we look with pride over a booming nation!\n\nAs a proper conclusion to our great foray into the world, our glorious Duce will hold a great ceremony in Rome. Our leader will thank the Italians for their hard work, and remind them that none of it would have been achieved without Faith in Fascism: the world's oyster opens for those who are strong enough to crack it!"
 
