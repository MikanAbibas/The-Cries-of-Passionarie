 ITA_the_left_wing_to_sustain_desc:0 "Even the mightiest Eagle cannot fly without wings. Just as our greatest symbol, the Empire cannot prevail in the gladiatorial arena that is the world without a strong economy: we can't turn our vision into reality if our people starve to death.\n\nAtlantropa has crippled our sea trade, and the Reich's betrayal dealt a decisive blow to our export industry. We need to undertake strong reforms and decisive actions if we are to reverse the tide: praise the Duce, we have exactly the kind of leader with the courage needed to make the right choices."
 ITA_a_modern_autarky_desc:0 "It has become quite evident in the last decades that, in the great game of world dominance, there is no such thing as "friends forever". Our so-called "allies" betrayed us time and again, and even now they wait like vultures circling above their prey: if we are to restore our economic prowess, we can no longer rely on "partners".\n\nRather than making ourselves weak, we can return to one of Mussolini's greatest economic reforms, Autarky. By expanding raw material extraction facilities and farms all across the Empire, and encouraging - or better, forcing - business and customers to buy resources and goods produced domestically, we can both reduce our dependence on foreign help, and strengthen our internal market: two birds with one stone!"
 ITA_divini_et_humani_iuris_communicatio_desc:0 "As the Roman jurist Modestinus once wrote, marriage "connects man and woman, a union for all life, the joining of divine and human law". It is therefore our duty to ensure that all people can experience such a beautiful thing: to deprive our devoted followers of such a joyful union would be nothing short of a sin!\n\nOf course, there are the practical sides of such a policy. Unlike the other superpowers, we cannot call upon hundreds of millions of citizens in times of war: it is therefore imperative that we sustain demographic growth in any possible way, and that we remind our people that love and dedication towards the cause of Fascism are much more important than the love between husband and wife."
 ITA_wives_and_mothers_desc:0 "As our ancestors used to say, women are the "mistresses of the house". It is time that we make true on this wise and effective saying: with unemployment skyrocketing after Atlantropa, there are way too few jobs to let women look for their own, and for a couple where both partners work, there's often another one where both are unemployed.\n\nAs such, the most righteous thing to do is to show women that motherhood is the best way to serve not only fascism, but also themselves and their families. By granting incentives to women who relinquish their workplace to tend to their husbands and children, we'll surely encourage this good and proper practice: should they have no husband yet, no worries, for there are plenty of ways to fix the situation..."
 ITA_no_mouth_left_unfed_desc:0 "Could anyone name a sadder sight than a sickly-thin child begging for food? Could anyone find it in their heart to let such a crime against Divine and Nature go on without doing anything? It is our first and foremost duty as shepherds of the people to ensure that such things are delivered to the darkest pages of our past history: Fascism does not allow Italians to be left alone!\n\nBy granting incentives to large families, and ensuring that children can grow strong and healthy, we'll show our people how much we are dedicated to their wellbeing. Of course, once these children grow into productive adults, they will have ample opportunity to thank our glorious Duce for what he did for them: a life in service to Fascism is a life well spent."
 ITA_the_iri_economic_beacon_desc:0 "The Istituto per la Ricostruzione Industriale was created after the Great American Depression to sustain our ailing industries, most of them already hit hard by post-war demobilization. It is almost ironic how much our current situation resembles what Mussolini had to face so soon after his elevation into power: this must be destiny, a trial by fire to show whether our new Duce is truly worthy of his mantle...\n\nOf course, Niccolò Giani is ready for the task, and he'll be able to count on the same instrument that were used by the glorious Founder of Fascism. The IRI will be brought back into fighting shape, so that it might act once again in its intended purpose: a great beacon in the dark sea of the economy, showing the way to our industries and enterprises so that they might reach a safe haven in these troubled waters."
 ITA_fan_the_flames_desc:0 "Just as the legendary Pharos of Alexandria would be nothing but a tall tower without its great flame, so would the IRI be nothing but an empty name without its gargantuan budget. However, the economic crisis that followed Atlantropa forced our incompetent predecessors to cut it, rendering the entire institution a mockery: it is time to reverse the course.\n\nWe shall fan the flame of our Pharos once again, as much as it's needed for its light to pierce the darkness. The IRI's budget will be greatly increased, so that it might pump new life into our ailing economy: the fires of our economy will once again shine bright, mirroring the flame of Fascism that burns eternal into our hearts!"
 ITA_polish_the_mirrors_desc:0 "Even the greatest flame cannot show the way if it is dispersed in the darkness. The ancients equipped their beacons with bronze mirrors to concentrate the light of their braziers, so that it might pierce the coat of the night, and guide the ships away from the perils of the sea: if the IRI is to be the beacon of our economy, then we need to follow such an example.\n\nBy strengthening the board with experts in accounting, markets and innovation, we can polish the mirrors of our beacon, and direct its light to its intended target, making sure that each and every Lira counts. Wasting the fruits of the Italians' hard labor is nothing short of a sin: as they say, waste not, want not."
 ITA_a_light_into_the_darkness_desc:0 "Even the mightiest among men's works are destined to crumble if they remain untended. From the Colossus of Rhodes to the Pharos of Alexandria, so much was created to serve a noble purpose, only to become dust and be forgotten: if we are to prevail, and show the world the light of Fascism, it is our sacred duty to learn from such unfortunate examples.\n\nWith our reform completed, the IRI has returned to what it was supposed to be. No longer mired in corruption and inefficiency, it is now a fitting instrument for our economic vision: from now until the end of time, it shall serve as the Empire's economic beacon, guiding us out of the stormy sea, and into calmer, more welcoming waters."
 ITA_promote_corporatism_desc:0 "Despite what some say, not even the strongest empire can survive by itself. Trade between nations has always been a vehicle for prosperity and innovation, and refusing to partake in this lucrative endeavor is a sin we cannot afford: at the same time, however, we need to be careful never to fall into the mistake Galeazzo Ciano and his ilk made.\n\nMussolini often referred to fascism as the "third way" between capitalism and socialism, and it is time we made true on this concept. By promoting corporatism - a strong conjunction between public and private sectors, with commonly-pursued goals - to the highest levels of our economy, we'll make sure that our business and internal market are safe from external threats, and ready to expand in foreign markets: a win-win solution!"
 ITA_bringing_gospel_to_the_factories_desc:0 "For so long, the workers of Italy have toiled under the oppression of incompetents and traitors. Left alone by those who should have saved them from the clutches of capitalistic greed, they have turned to other "protectors" in the misplaced hope that they could help them: Marx, Lenin, Bukharin and their misbegotten ilk have poisoned the minds of countless honest men and women with their heresies, creating disunity and chaos.\n\nIn an act of supreme compassion, however, our glorious Duce has chosen to understand the reason for their lack of faith, and forgiven them as only a true Father can. Now, he has granted the workers a way to redeem themselves, and accept the light of Fascism: we shall bring the gospel of the reborn Italy to the factories and production lines, showing to those who bend their backs to capitalism and socialism that there is indeed a way to be free, forever."
 ITA_from_syndicalism_to_proselytism_desc:0 "The battle between Fascism and socialism is not merely a political or economic battle. It is first and foremost a clash of souls, for those who give themselves to the promises of the red hydra surrender their very being to the beast: we do not fight for power, we fight to save the soul of the Empire from the jaws of the ravenous monster that wants to devour all.\n\nIt is therefore imperative that we counteract the effort of the red heretics at every turn. We shall send our agents in every factory, in every warehouse, in every production plant, and reform the labor laws so that the workers understand that we wish to help them: by word and by example, we vow to win back our brothers and sisters from the clutches of the enemy!"
 ITA_purge_the_heathens_desc:0 "The battle has been hard, but we have saved as many as we could from the edge of the abyss. We listened to all the pleas for aid, took all hands that were extended to us, accepted all sincere repentance: now, the gates of the citadel are closed, and it's time to face the enemy.\n\nThose who have remained deaf to our message are not worthy of being saved. They are enemies of the workers, enemies of Fascism, enemies of the Empire: they shall be apprehended, their leaders purged, and their followers forced to work for the good of everyone for the rest of their lives."
 ITA_long_term_economic_planning_desc:0 "With the most urgent problems afflicting our economy solved, it's time to devote ourselves to a higher calling. Like the artisan who tunes musical instruments, it is our duty to calibrate the economy so that it can grow in the coming years and be sustainable in the long term: the German barbarians showed the world the consequences of their ravenous hunger, after all.\n\nNow, our expert advisors will find the needed recipe so that our past reforms will not have been in vain, and that our future reforms will not be. Our predecessors have shown us the way forward, but it falls to us the hard task of actually turning their lesson and example into a viable solution for the Empire: for the good of our people, we cannot fail."
 ITA_reward_loyalty_desc:0 "With our crusade against the red hydra won, it is time to reward those who stayed loyal to Italy and the Empire. New laws will be passed, enshrining the rights of the workers in the new Fascist Charter of Labor, ensuring that no capitalist will ever be able to exploit them, and that they will no longer have to seek aid from charlatans and disbelievers: this document will mark our true, final victory over socialism!\n\nThis is not propaganda, this is giving back what is due to those who toil ceaselessly for the good of the people. The faithful workers of Italy can finally reap the fruits of their toil after so many sacrifices: behold the generosity of our Duce, bask in the light of Fascism, and rejoice!"
 ITA_a_leap_of_faith_desc:0 "The stock exchanges all over the world are ruled by chance and selfishness. Will the next harvest be good? Will this or that industry fail? Can I profit from it? Such are the questions that can be heard in the halls of Milan, Tokyo and Wall Street, and hearing them poses another question: how can a nation prosper if so many wish for it to fall so that they can gain money from its collapse?\n\nOur vision for the economy is different. We do not believe in chance, and we do not leave our countrymen alone when a crisis hits: we have faith in the inner strength of the Italian people, and when the time comes to take the leap towards a prosperous future, we'll jump all together, confident that no matter the distance, we can land safely."
 ITA_natura_mater_omnium_desc:0 "As the ancients used to say, Nature is mother to all. While economic growth is the first and foremost priority of our government - so that our other policies and our general vision may come to pass - we must not forget the consequences of our actions: what use is building a Fascist paradise, if it is destined to sink into the quagmire that we ourselves created?\n\nOur Minister for the Economy has devised a comprehensive plan to conjugate a steady and satisfactory economic growth with policies aimed at further improving work safety and lessening the environmental impact of industrial plants and toxic waste. Our Duce is not deaf to the call of conscience, and is interested in hearing this proposal: if Fascism is to last until the end of time, surely he wants our world to last at least half as much?"
 ITA_labor_omnia_vincit_desc:0 "As the great poet Virgil wrote, hard work prevails over all obstacles. Such words ring especially true now that the Empire sets to the hard task of recovering its past splendour: to this end, we need to put all of our effort into making our economy grow as fast as possible.\n\nIt has come to the Duce's attention that the Minister for the Economy has devised a comprehensive plan aiming at conjugating economic growth and environmental sustainability. While laudable, it seems that our glorious leader's priorities lie elsewhere, for he has decided to reject the proposal: such policies should be reserved for later, when our economy has grown enough."
 ITA_per_aspera_ad_astra_desc:0 "Finally, our reforms have been completed. After so many difficulties, so many sacrifices, so many challenges, we have achieved our Duce's vision: our country is quickly filling with productive factories, where loyal and devoted men work for the good of the Empire, receiving what they deserve for their toil.\n\nOur economy is now a fortress, defended by stalwart sentinels and illuminated by the bright beacon that is the IRI. Should another crisis hit our beloved Empire, we are fully confident in our ability to overcome it, and make our way back on the path of prosperity: praise Niccolò Giani, for he has shown us the stars at the end of the difficult journey!"
 
