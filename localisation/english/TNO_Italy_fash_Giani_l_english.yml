 ITA_the_right_wing_to_protect_desc:0 "The majestic Eagle is the Queen of the skies. Perched atop its nest, it jealously watches over its territory and fiercely protects its chicks from any and all dangers: truly, it is an example for all to follow!\n\nA long time ago, the Eagle was a symbol of power and civilization, bringing prosperity and safety wherever it went. Such times are long gone, but it is not above us to restore at least a fraction of what it was: from there, our glorious Duce shall bring us to new heights of power, as sure as the sun rises after the night!"
 ITA_a_glorious_legacy_desc:0 "Our great nation has always had a great martial tradition. From the fields of Zama, to the seas of Lepanto and the skies of Russia, our soldiers earned glory and recognition from friend and foe alike: it is such a shame that our current armed forces are a mockery of what they used to be, dragged into a quagmire of corruption and inefficiency by corrupt officers and weak political leaders.\n\nIf we wish to restore our military might, it is imperative that we learn from the example our predecessors set. Military history teaches us that no army, fleet or air force can function without a strong leadership, a dedicated and competent officer corps and excellent logistics: we should put these aspects as our foremost priority, before thinking about technical innovation."
 ITA_a_shining_future_desc:0 "While our past endeavors must always inspire us in our quest for greatness and enlightenment, we must not remain chained to the ways of our forefathers. Time changes everything, and we have been lagging behind the greatest powers of the world for too long: if we wish to ever return to the days of yore, then we need to bridge the gap as soon as possible.\n\nTo this end, we must devote ourselves to the research and development of new instruments of war. Our doctrines must advance as much as our technical means: righteous zeal might be the brick and mortar of every army, but it won't save a fighter pilot in a dogfight!"
 ITA_a_new_regia_marina_desc:0 "Our Navy perfectly reflects the Empire's current state of affairs. Oversized, obsolete, inefficient, corrupt, it embodies the sins and vices of our decadent society: our seafaring ancestors must be turning inside their graves!\n\nThis situation can no longer be tolerated. By the Duce's orders, the Regia Marina will be thoroughly reformed into something that better fits our renewed greatness: a modern, powerful fleet based on the most modern tactics developed over the last decades."
 ITA_expand_naval_industry_desc:0 "Our largest shipyards before Atlantropa were located in Genoa, Venice, Livorno and Taranto. With the exception of the latter, all of them are now a salt plain, devoid of anything resembling water: even though almost ten years have passed, the incompetence of Ciano and his cronies has ensured that nothing has been done ever since, except perfunctory reparations.\n\nWith our plans to completely modernize our fleet already underway, it is of fundamental importance that we expand and diversify our dockyard facilities once again. Re-establishing production and assemblage plants in Genoa and Livorno will be a costly endeavor, but we need to ensure that production can keep up with innovation: we shall rule the seas once again soon!"
 ITA_classis_oceanica_desc:0 "As Mussolini once said, "many enemies, much honor". With the Mediterranean under our total control, and the fleets of Iberia and Turkey rather lacking - to say nothing of the joke the French call "navy" - it is evident that the Regia Marina is wasted in the Mediterranean: complacency begets decadence, and decadence begets ruination!\n\nIn order to keep our new navy always ready and up with the latest innovations, we shall completely redesign the purpose of the Regia Marina. No longer will it be limited to the defense of Mare Nostrum: now, the newly-christened Classis Oceanica will extend its power projection to the Indian Ocean, to test their mettle with the greatest fleets of the world!"
 ITA_il_milite_fascista_ha_desc:0 "It is evident that we cannot limit ourselves to simply upgrade the armament of our soldiers. A coward in uniform and with the latest rifle will still be a coward, an incompetent given an officer cap will still be an incompetent, and both will face the consequences of displeasing our glorious Duce: summary execution.\n\nIf we are to reclaim the long-lost glory of our armed forces, then we need to start from the sinew and bones of the Regio Esercito. Our soldiers and officers will become what our leader has envisioned: masters of the battlefield fanatically loyal to the State and its highest expressions, perfect instruments to bring glory to Fascism and the Empire!"
 ITA_la_forza_di_un_legionario_desc:0 "The Roman Legion was the pinnacle of tactical and strategic efficiency. Formed by thousands of perfectly-trained, brave and coordinated soldiers, one of these units could bring down a kingdom: our men must aspire to reach the combat mastery and battle coordination of their glorious ancestors!\n\nFrom now on, all those who join the Regio Esercito will be required to become Legionaries in body and mind. New recruits will undergo harrowing training regimes, so that they will be able to march to the end of the world if our Duce gives the order: surely, there will be many of those currently in the ranks who will be found wanting, but their demise is a needed sacrifice for the martial supremacy of our beloved Empire..."
 ITA_la_fede_di_un_crociato_desc:0 "Crusaders were the pinnacle of chivalry and Christianity. Fanatically devoted to the Cross, they would not relent in their quest for eternal salvation, no matter the odds, no matter the consequences, no matter the price: their supreme zeal and unquestionable loyalty must be inculcated in our soldiers, so that they might properly serve the Empire, with their blood if it is necessary, to pursue our Duce's vision.\n\nNew recruits will not only undergo strict physical and weapon training, they will also be thoroughly taught how to elevate themselves through devotion to Fascism. We are aware of the fact that there are several senior officers within the High Command who oppose what they call "politicization of the army": this is not "politicization of the army", this is "salvation of our soldiers through zeal", and their lack of faith is exactly what makes the purge of such officers a necessity."
 ITA_vincere_e_vinceremo_desc:0 "The Regio Esercito has changed greatly from what it was at the beginning of our reforms. Lazy, unmotivated soldiers and incompetent officers have been removed to make place for the kind of servants our Duce needs: blank slates to be rewritten according to the doctrine of Fascism, raw clay to be moulded into the perfect soldier to pursue the glory of the Empire.\n\nNo longer will Italy be humiliated on the field of battle, no longer will we be a laughing stock among the great powers of Earth! From now on, our soldiers will show our enemies the price of hubris for trying to oppose our might: they will be grinded into dust by our merciless advance, a footnote of history good only to serve as a lesson for those who remain!"
 ITA_expand_the_regia_aeronautica_desc:0 "The youngest of our armed forces, the Air Force also shows the greatest potential for improvement. The recent conflicts have shown that infantry, tanks, battleships and even entire cities can be rendered powerless or utterly destroyed by the combined power of fighters and bombers: we would be foolish to deny ourselves such a wonderful tool of domination.\n\nTo this end, the Duce has ordered a comprehensive expansion of the Regia Aeronautica. New production plants will be opened, and our engineers and scientists will receive new funds to improve our current designs and develop entirely new ones: who needs Angels, when you can have a fighter escort you to heaven..."
 ITA_claws_of_the_eagle_desc:0 "An Eagle hunting its prey is a majestic sight. Falling from above with the speed of lightning, it strikes with deadly precision, sinking its talons in the helpless animal: such lethal grace, such cruel perfection must inspire us to imitate what, in nature, is the apex predator.\n\nLike the eagle's talons, our fighters and close air support will fall from the sky with perfectly-coordinated attacks, devastating the enemy air force in fierce dogfights and decimating enemy troops with surgical strikes. In order to achieve this, however, what we have now is insufficient: if we are to achieve the grace of the Eagle, we need to invest more funds and develop new, more advanced airframes!"
 ITA_the_price_for_hubris_desc:0 "In the ancient myths, men would always wish for too much, until they would start to actually think themselves better than the gods who created them. The punishment for their hybris, of course, never failed to come: in a flash of lightning, they would experience the agonizing truth, which is that they are nothing more than flies compared to their almighty sovereigns.\n\nIsn't it hubris, daring to think to actually be stronger than us? Doesn't it call for the exact same punishment? To see the cities of our enemies reduced to smouldering ruins, to see their blasphemous monuments crushed under our righteous wrath, to hear their screams, their cries, their prayers, their curses as their paradise is turned into hell: isn't all this simply beautiful?"
 ITA_a_new_school_of_thought_desc:0 "With our most urgent reforms completed, it is now time to rethink our general approach to war. Trained soldiers and fast airplanes are important, but wars are more than dogfights or charges: they need to follow a plan, a master plan, so that each minor victory can bring us closer to the final triumph, like grains of sands descending in the hourglass of our foe's final hours.\n\nIt is therefore imperative that we begin a comprehensive analysis of the latest conflict under all aspects. Land, naval and air conflicts have changed much in the decades since the last war, and we need to adapt if we are to survive: in nature as well as in the human world, failure to adapt is the quickest road to one's demise, after all..."
 ITA_no_longer_lagging_behind_desc:0 "The war between us and the Turkish traitors made it clear how outdated our equipment is compared to the other superpowers of the world. That those inferiors would even think themselves capable of matching our strength is cause enough for shame: our Duce has vowed that we shall never again be the laughing stock of the world!\n\nTo this end, he has devoted a large increase in military funds for the establishment of new research and development teams. In coordination with the High Command and several armament firms, they will improve our current designs across the board and design entirely new ones: the future does not await the lazy, and laziness is a sin!"
 ITA_alpini_arditi_e_paracadutisti_desc:0 "Our special forces were instrumental in the major wars we took part in. The Arditi stormed the trenches of the First World War, the Alpini marched through the frozen Russian steppes in the Second, and the Paracadutisti stormed Malta and Crete, securing our hold over the Mediterranean: such glorious heritage must be maintained and expanded!\n\nConsidering the peculiar terrain of the Empire - which ranges from our native Alps to the Adriatic salt flats and the Libyan desert - it is imperative that we field sufficient amounts of forces trained and equipped for fighting in difficult terrain or harsh climates. When tanks can't move because their fuel freezes, and planes can't fly because their engines boil, all that is left is a man's skill at arms: our elites will lead us to victory when all else fails!"
 ITA_dulce_et_decorum_est_pro_patria_mori_desc:0 "Despite all the advancements in the technical field, it is evident that the core tenets of war still reside in the hearts of men. No amount of technology can replace the fierce determination of soldiers ready to fight to the death against all odds: it is therefore imperative that we focus on giving our men the best training and equipment possible, so that their sacrifice might be justified by the greatness of their triumph.\n\nIsn't it shameful when others have to die to protect you? Isn't it terrifying to see your loved ones killed without being able to do anything? There is no such a thing as "choice" when facing the crossroad between life and death: it is a sweet and right thing to die for the Fatherland..."
 ITA_animos_accinge_futuris_desc:0 "Our latest advancements have shown us that for one thing we discover, our enemies discover two, and are already working on a third one. The road for innovation is neverending, and there is no such thing as a "final goal": it would be foolish to stop now.\n\nTo this end, the new research and development departments will be made a permanent voice in our military budget. New generations of technicians and scientists will bring us ever closer to perfection, ever closer to domination: with trust into our means, we steel our souls for the future!"
 ITA_in_hoc_fascio_vinces_desc:0 "The legends tell that Emperor Constantine the Great saw the Cross in a dream before his most difficult battle, and he won it by inscribing the symbol onto his soldier's shields. The same thing happened to Italy with Fascism: it appeared to a nation lacking faith and courage, and by inscribing it into their hearts, Italians became once again able to do great things.\n\nIn the last decades, it seems that our soldiers, our sailors and our pilots forgot what a beautiful thing the fascist emblem is. A symbol of power and bravery against all odds, it shall direct our brave men to new, greater acts of valor: let the world see our renewed strength, and tremble!"
 
 ###=====| e) Colonial Tree |=====###
 ITA_preserving_the_empire:0 "Preserving the Empire"
 ITA_improving_imperial_infrastructure:0 "Improving Imperial Infrastructure"
 ITA_a_dedicated_administration:0 "A Dedicated Administration"
 ITA_a_productive_population:0 "A Productive Population"
 ITA_prosperity_for_all_italians:0 "Prosperity for All Italians"
 ITA_resuming_our_mission:0 "Resuming Our Mission"
 ITA_romes_guiding_light:0 "Romes Guiding Light"
 ITA_loyalty_begets_recognition:0 "Loyalty Begets Recognition"
 ITA_treason_begets_punishment:0 "Treason Begets Punishment"
 ITA_the_sun_shines_over_the_empire:0 "The Sun Shines Over the Empire"
 
 ITA_preserving_the_empire_desc:0 "The Italian Colonial Empire is our people's greatest achievement. Paid for in the blood of soldiers and civilians alike, it is not only a symbol of national pride and strength, but also a potential boon for our economy: it is our duty to ensure that the Empire is preserved and strengthened, for the good of all Italians, present and future.\n\nTo this end, we need to ensure that the government and the infrastructure across our colonies are efficient and functional. A decade of Ciano's inefficient rule has caused unrest to rise among both colonial settlers and natives, and his "exile dissidents to the colonies" policy has turned the administration into a den of corruption and nepotism: it will take time to clean this mess, but it will be done for the glory of the Empire!"
 ITA_improving_imperial_infrastructure_desc:0 "Our Empire is large, and our garrisons are not. The combination of these two factors makes a functional and organic infrastructure system a necessity if we are to keep our colonial possessions under control: our Duce's incompetent predecessor left our great works in a state of disarray, hindering both trade and military patrols.\n\nTo address this issue, we need to heavily invest into restoring and expanding our roads and railroads for both civilian and military use. Such marvels of modern engineering are to the Empire what a functional circulatory system is to the human body: the difference between life and death."
 ITA_a_dedicated_administration_desc:0 "Ciano and his clique of degenerate, corrupt kleptocrats have turned the colonial administration into a black hole where bureaucrats too corrupt or embarrassing to remain in the mainland, but too powerful to be purged, were sent and given free reign. Of course, the results are for all to see: the administration is an unexplored abyss of embezzlement and inefficiency, with even Italian colonists protesting about the situation.\n\nIt is evident that we need to bring the light of our reforms to the people of the colonies. It will take time before our Empire can return a productive endeavor, and for now all we can do is restoring the citizens' faith in our government: a thorough purge of the corrupt administrators, and new investments into welfare and subsidies will slowly bring the people back to our side."
 ITA_a_productive_population_desc:0 "Ciano and his clique of degenerate, corrupt kleptocrats have turned the colonial administration into a black hole where bureaucrats too corrupt or embarrassing to remain in the mainland, but too powerful to be purged, were sent and given free reign. Of course, the results are for all to see: the administration is an unexplored abyss of embezzlement and inefficiency, with even Italian colonists protesting about the situation.\n\nIt is evident that we need to bring the light of our reforms to the people of the colonies. It will take time before our Empire can return a productive endeavor, but we need to do all that we can to increase productivity and efficiency of the colonial economy: purging the old administration and installing new, loyal bureaucrats fully focused on properly exploiting the riches of the Empire will surely aid our ailing coffers."
 ITA_prosperity_for_all_italians_desc:0 "Our colonial settlers are the lifeblood of the Empire. In our government's effort to keep the Empire under tight control, they serve a vital purpose: by acting as bureaucrats, skilled workers, soldiers and policemen, they keep the natives in check and, if numerous enough, effectively remove any chance at separatist action.\n\nIt is evident, therefore, that we must encourage more and more Italians to migrate to the colonies. By providing a safe and prosperous environment to settle, thousands of unemployed Italians will be encouraged to leave the mainland and find a new life in the colonies, therefore strengthening our hold over the Empire forevermore!"
 ITA_resuming_our_mission_desc:0 "As a culturally, economically and racially superior society, it is our sacred duty to uplift the inferiors from their sorry state. Unlike the treacherous Jews, who have shown their degeneracy time and again, the natives of the colonies can still be saved: as our glorious ancestors once did, we shall bring the light of civilization and Fascism to the farthest reaches of our great Empire.\n\nOur corrupt predecessors have failed in this mission, and destroyed much of what little progress has been made since the end of the war, but we are different. With enough time and effort, the natives will be shown the way to salvation: to serve their masters with loyalty and dignity, and reap their rewards."
 ITA_romes_guiding_light_desc:0 "The Germans, as the barbarians they are, are capable of erring even when they are right. While correct in its premises, their approach to the matter of race has been disastrous, and its consequences obvious: inferiors are not to be slaughtered like pigs, but to be shepherded as sheeps, and helped to improve so that they can, one day, achieve even a fraction of their master's success.\n\nDespite the horrendous mistakes of our predecessors, we have come to set things right. There can be no injustice in our Empire, and this applies to natives too, for their place is a step below their masters, but they will not starve under our watch, nor will they be humiliated or hurt: new laws, and a renewed focus on enforcing their application will surely improve the conditions of the inferior, bringing us one step closer to the realization of our perfect world."
 ITA_loyalty_begets_recognition_desc:0 "It is right and proper that the loyal and dutiful servant is recognized for his service, and subsequently awarded. For so long our corrupt predecessors took for granted the service of our colonial subjects, and exploited them with no regard for their wellbeing: it is time to set things right, and ensure that everyone gets what he's due.\n\nBy focusing our administration's efforts on building a fair system, where inferiors who prove their loyalty to Fascism enjoy a better status than their other peers, we'll surely improve public order in the colonies in the long run. Of course, this will be much slower than simply crushing dissent, but we must be like our ancestors: if they built an Empire in a thousand years, we can't be impatient!"
 ITA_treason_begets_punishment_desc:0 "It is right and proper that the animal that bites the hand feeding it is punished for his ungrateful and disloyal behavior. For so long our corrupt predecessors failed to properly address dissent, and this has led us to the current situation: secessionist sentiments run wild through our colonial subject, strengthened by the garrison's inability to crush their insurgencies.\n\nBy focusing our administration's efforts on a sweeping campaign to obliterate resistance cells and movements, we'll surely improve public order in the colonies. As Thucydides wrote almost three millennia ago, humans, just like animals learn from pain: perhaps it's time to use the wisdom of the ancients in its literal meaning..."
 ITA_the_sun_shines_over_the_empire_desc:0 "With our comprehensive reform of the native situation completed, we have created a just colonial society. The masters enjoy the status given by their inherent superiority, and their servants enjoy the rewards of loyalty, and suffer the consequences of disloyalty: as should have always been, and as shall forever be.\n\nThe ship of the Empire has found once again its correct course, and wind blows anew in its sails. As our economy rebuilds, and the colonies return to order and productivity, the path to our prosperity is clear: the sun shall forever shine over our glorious Empire!"
 
