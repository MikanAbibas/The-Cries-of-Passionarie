 ITA_giani_conversion_mech_stability_modifier:0 "Stability of Italy"
 ITA_GUI_giani_gui_stability_tt:0 "§YStability§!\nOur regieme is [getItalyStabilityStatus], the effects of our current stability are:\n\nPolitical Power Gain: [?ITA_giani_stability_pp|%+=0]\nMonthly Population: [?ITA_giani_stability_pop_growth|%+=1]\nConstruction Speed: [?ITA_giani_stability_construction_speed|%+=2]\nFactory Output: [?ITA_giani_stability_factory_output|%+=2]\nGDP Growth: [?ITA_giani_stability_gdp_growth|+=2][getItalyStabilityProcentColour]"
 ITA_GUI_giani_gui_stability_delay_tt:0 "§LOur mission is sure to find opposition not just within the halls of power, but even among the common populace under the sway of the corrupt clergy. As such, tensions are sure to rise once the number of new faithfuls starts growing, in a vicious cycle that will breed internecine strife and violence between the various groups.\n\nNo sacrifice is too steep to see our vision become reality, and we will stop at nothing to see our mission fulfilled. There are, however, others who look at this with terror, and might intervene to stop us should stability within the country reach a critical level before we have cemented our hold over the nation.\n\nAt the same time, we are confident that once the number of faithful has reached a critical mass, around half of the Italian population, tensions will naturally fade as our dominance appears all but secured. Once our numbers have grown enough, no one will be able to stop us.\n\nBy God and Fascism, we will make Italy whole."
