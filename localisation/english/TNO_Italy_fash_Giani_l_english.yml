 ITA_gloria_al_duce_gloria_a_niccolo_giani_desc:0 "After years of turmoil and decadence, fascism returns to the righteous path as set by the shining example of Benito Mussolini and the First Fascists who marched on Rome. Traitors and disbelievers tried to pervert fascism or - perish the thought! - end it, but their efforts proved to be much like their wills: weak and fallible, the poisonous fruit of rotten minds.\n\nThe time has come for the Believers to once again hold the torch, and lead the Empire towards a glorious future. To accomplish this fundamental - no, this sacred - design, none is apter than our new, glorious leader: a man of zeal and faith, of superior will and sublime thought, he will lead us to salvation, forever.\n\nGloria al Duce, gloria a Niccolò Giani!"
 ITA_by_my_will_desc:0 "Experience has proved what Mussolini's genial thought had already made evident a long time ago, but feeble-minded minions and sycophants, in their ignorance, refused to accept. The concepts of "democracy", "collegiality" and "balance of powers" are nothing but flawed ideologies, the product of a culture of envy that encourages weakness rather than excising it like the cancer it is: our glorious leader shall not make the same mistake.\n\nNiccolò Giani knows what he needs to do to restore the Empire to its deserved place in the world, and he needs not consent or advice. In matters of state, as well as in matters of doctrine and spirit, the Duce holds absolute authority: our duty is not to speak, but to obey.\n\nHis will be done, so in the heavens, so on earth."
 ITA_by_our_might_desc:0 "The tree of the righteous, awe-inspiring as it may be, is destined to dessicate and die if it is not tended by those who planted it. Benito Mussolini planted the tree of fascism, and the blood and sweat shed by Italians through the decades - and in the war - ensured it could reach the tallest heavens: his chosen successor, however, proved a poor gardener of souls, and let the conservatory fall into abandon and disrepair.\n\nThis shows us once again that even the strongest leader cannot achieve greatness for his nation and his people if said people do not stand by his side. With the path set, it is now our sacred duty to follow it, wherever it might lead, lest we experience the fate Dante's Divine Comedy reserves for the Uncommitted: forever forced to follow an empty banner, chased by their shame and their regret."
 ITA_punish_the_unworthy_desc:0 "The time of Quadrumvirate granted us insight on the amount of treachery, corruption and faithlessness running through the Party. So many have forsaken their sacred oaths to Mussolini, so many have scorned the harsh discipline and the obedience that make us free, so many have become the very beast they vowed to slay: the time has come to show these wretches the consequences of betrayal.\n\nThere can be no forgiveness for he who turns his back on his comrades, there can be no mercy for he who desecrates the tenets of our guiding light, there can be no salvation for he who kisses us in the cheek after selling us out for thirty coins. For all these, and for many, many others, unworthy all to see the realization of our dream, there can only be one end: death."
 ITA_no_office_higher_than_the_duce_desc:0 "For too long, Mussolini had to bow to the remnants of the old order. Like a true martyr, he suffered through the humiliation of having to refer to himself as Prime Minister in front of the very man who wanted to chain him: the King.\n\nNow, Umberto II wants to re-enact the same charade, forcing our glorious Duce to submit to the old, decaying order. However, now is time to make things clear: Niccolò Giani considers that of Duce his one - and only - office, and he will lead Italy with, or without, royal assent."
 ITA_seed_the_ground_desc:0 "The den of criminals and traitors that we call "government" is far from what we need to pursue our vision. Large and thorough reforms will be needed to turn it into an instrument that suits our needs, but we have no time for that: what we need now is a platform to launch our first offensive, the rest can come later.\n\nTo this end, the upper echelons of the administration shall be purged. Those who fought against us in the past year will make place for a new generation of dedicated administrators and bureaucrats: they will be the first heralds of the Empire's resurrections, the first witnesses of our great plans for Italy."
 ITA_spread_the_word_desc:0 "The people of the Empire are like lost lambs, frail ships navigating a stormy sea with no beacon, nor safe haven in sight. It is our duty to be their light in the dark, the welcoming arms that give them safety and purpose: too many have lied to them, too many have used them for their selfish purpose, now the time has come for change.\n\nWhile our vision will take time and sacrifice - much sacrifice - to enact, we can already start spreading the gospel. The tale of fascism is not yet written, for we have trumped death and defeat, to return as a shining beacon of hope for all of the Empire: let the people know, and rejoice!"
 ITA_guided_by_the_eagle_desc:0 "The Eagle is such a majestic bird. A symbol of both raw strength and ancient wisdom, it has guided our ancestors throughout their conquests: there was once a time when the Roman Eagle - and not the pathetic facsimile that is the Reichsadler - looked over three continents, protecting them from barbarians and heathens.\n\nThis time is long gone, and can never be brought back, no matter our deepest desires. What we can do, however, is to forge a new path, a new future for the people of Italy and the Empire: if we accept the Eagle as our guardian and protector, it will once again rise to new heights of power and magnificence, and us with it!"
 
