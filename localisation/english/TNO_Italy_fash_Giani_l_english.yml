 ITA_giani_financial_instability_1:0 "Financial Instability"
 ITA_giani_financial_instability_1_desc:0 "With our economic reforms underway, the international investment funds are looking warily at the pace at which we are changing Italy's industrial and financial policies.\n\nUntil we can prove to them that our reforms have been successful, international trust in our solvency will be undermined, making it more difficult to find buyers for our bonds."
