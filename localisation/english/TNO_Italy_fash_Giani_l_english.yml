 ###=====| 1) LEADER, MINISTER AND OTHER CHARACTER DESC |=====###
 ################################################################
 
 ### a) Leader Descriptions ###
 POLITICS_NICCOLO_GIANI_DESC:0 "If one were to compare Niccolò Giani, the elusive founder of the School of Fascist Mysticism, to one of the great men in the history of the world, they would surely find a kindred soul in Cato the Censor. Hard, uncompromising, and fanatically convinced of the superiority of their own people in a barbarian-infested world, people such as them have always had a deep impact upon society: striving to change their people so that it fits their vision, they leave no stone unturned in their quest for perfection or enlightenment.\n\nPeople such as them, however, are by their very nature destined to be despised, hated and isolated. People unconsciously fear to face their own inadequacy and weakness, and as such, they do not follow the guidance of those who have the courage and determination to point the way towards salvation. Such a powerful word "salvation" is, but this is what Giani offers to the Italian people: not just economic reform or political renewal, but salvation of the soul through the cleansing power of fascism, as Mussolini showed a long time ago.\n\nThis, however, is where the tales of Cato and Niccolò Giani diverge. Unlike the stern Roman orator, the fiery fascist has achieved something his model failed to: the power to change society through forceful action. At the helm of a beleaguered Empire surrounded by traitors, enemies and inferiors, it is Giani's sacred duty to show his people how strong they can be, and lead them towards a safe haven. In this life and the next."
 
 ### b) Ministers ###
 ITA_Guido_Pallotta_hog:0 "Guido Pallotta"
 ITA_Guido_Pallotta:0 "Guido Pallotta"
 ITA_Guido_Pallotta_hog_desc:0 "§LGuido Pallota had planned to live out the rest of his days in an informal retirement. He has spent many long years as a founder of and one of the teachers at the School of Fascist Mysticism in Milan. There he carefully shaped the minds of many of the latest generation of the elite of Italy, indoctrinating them into the realization of the Fascist meta-reality. His teaching was briefly interrupted when, in 1940, he joined many of the other directors in active service. He spent an unremarkable time in Egypt during the war, and returned home to continue his work after the end of the war.\n\nFollowing two more decades of molding the future leaders of Italy, Pallota assumed that his services were no longer required, but in this he was wrong. The surprising ascent of Niccolò Giani has created a dearth of new open positions needing to be filled, including that of the Party Secretary. Giani has recalled his old friend in Milan back into service - the future of the Fascism requires his sweat once more.§!"
 
 ITA_Asveroglio_Gravelli_for:0 "Asveroglio Gravelli"
 ITA_Asveroglio_Gravelli:0 "Asveroglio Gravelli"
 ITA_Asveroglio_Gravelli_for_desc:0 "§LAsveroglio Gravelli has been a devotee of the fascist cause since he was a young man. Initially just one of many journalists to flock to the banner of Mussolini and the new Fascist movement, Gravelli distinguished himself by his promotion of the so-called "second wave" of the fascist movement that sought a permanent revolution against the forces of liberal democracy.\n\nAt various stages he found himself in the Duce's favor, but his failures were enough to prevent him from becoming a truly ascendant figure within the regime. After the Second World War, Gravelli became concerned with the power Germany seemed to be exerting over its nominal partner, and when the Atlantropa project proved catastrophic, he seized the moment to publicly argue that Italy needed to distance itself from Germany and maintain a "pure" Italian Fascism unblemished by the deviations of National Socialism, a Fascism that more aligned with his ideal of a continual battle against the remaining democracies around the world until the Fasces controls the globe.§!"
 
 ITA_Rutilio_Sermonti_eco:0 "Rutilio Sermonti"
 ITA_Rutilio_Sermonti:0 "Rutilio Sermonti"
 ITA_Rutilio_Sermonti_eco_desc:0 "§LOf the many strange officials that comprise the heart of the Giani regime, Rutilio Sermonti cannot help but to stand out. Coming from relatively unremarkable circumstances - the son of a Pisan lawyer and the daughter of a wealthy family, serving with competence as an officer first in the Balkans campaign and then in the 3rd Marine Division "San Marco" - Sermonti at first glance appears to be just another cog in the machinery of the Italian state.\n\nBut that is not all Rutilio Sermonti is, because to hear him tell it, he is part of a new breed of Fascist, one that he hopes will become the dominant strain one day. Since his childhood Sermonti was fascinated with the natural world and this has manifested itself into his political ideology. Once described as an "Ecological Fascist" by an ally as a light hearted joke, the term was quickly picked up in earnest by Sermonti, who now wears it as a badge of pride. To this man, the Fascist Revolution can only succeed when there is harmony between the state and nature, and this is what he has dedicated himself to accomplishing.§!"
 
 ITA_Pio_Filippani_Ronconi_sec:0 "Pio Filippani Ronconi"
 ITA_Pio_Filippani_Ronconi:0 "Pio Filippani Ronconi"
 ITA_Pio_Filippani_Ronconi_sec_desc:0 "§LAn aristocrat, a polyglot, a spiritualist, and the most feared man in Italy. All of these statements are part of who Pio Fillipani Ronconi, head of OVRA, is. Born in Madrid, Ronconi was only a young man when the Spanish Civil War broke out, giving him an early and personal view of the caldera that is modern warfare. As an amateur scholar of esoterica and mysticism, he came into contact with the Ur group and several of their more prominent members, notably Julius Evola. After serving competently in the African front during the war, Ronconi transitioned to the OVRA and quickly made a name for himself as a skilled tool of the regime.\n\nHis passion for the occult and autre has remained with him all this time, and it was through this shared interest that he came into contact with Niccolò Giani. The two quickly recognized one another as not only shared enthusiasts, but potential allies as well. The relationship has proven to be a mutually beneficial one, with Giani's rise enabling Ronconi to have the full might of the Italian security state at his back.§!"
 
 ITA_fascist_mysticism:0 "Fascist Mysticism"

