## Empire Management ##
ITA_EmpireManagement_OpenButton_tt:0 "Open the Empire Management GUI"
ITA_EmpireManagement_OpenButton_tt_delayed:0 "[EmpireManagement_GetDebugTooltip]"
ITA_EmpireManagement_OpenButton_tt_delayed_info:0 "(right click for debug)"
ITA_EmpireManagement_InfoBtn_tt:0 "§FThe §KItalian sphere of influence§! is extensive and variegated, comprising not only §KMetropolitan Italy§! and its §Gcolonial domains§!, but also a diverse ensemble of §fautonomous protectorates§!, formally-independent §wpuppets§! and §Sallies§!.\n\nEach §Mcountry§!, §mregion§! and §adependency§! will receive due attention in the form of §YPolicies§!. A Policy is a comprehensive strategy aimed at maximizing the benefits they provide for the §nEmpire§!, depending on the status of the region - independent or not - and §KItaly's own government§!.\n\nFor the §KItalian Empire§! to persist and eventually prosper, it is of paramount importance that this complex web of influence is §Gmaintained§! and - if possible - §Rexpanded§!. Over the time, opportunities might present themselves to §yadd countries to our sphere§!, while crises or internal upheavals §xmight wrench sone from our grasp§!: a small failure is unimportant in the grand scheme of things, as long as the §wfinal goal remains in sight§!. \n\nAs Penelope did once upon a time, so do we eternally spin our §KWeb of Influence§!. It is ragged and torn, unmade and remade across the decades, but we still keep toiling, in the hope - perhaps vain - that a savior will come to our aid...§!"
ITA_EM_Modifier:0 "Empire Management Effects"
ITA_EM_Oil_Modifier:0 "Empire Management Oil Exploitation Effects"

## Bottom
# Imperial Policy
ITA_EmpireManagement_ImperialPolicy:0 "§W[EmpireManagement_GetImperialPolicy]§!"
ITA_EmpireManagement_ImperialPolicyDesc:0 "§Y[EmpireManagement_GetImperialPolicy]§!§F\n--------------\n[EmpireManagement_GetImperialPolicyDesc]\n\n[EmpireManagement_GetImperialPolicyEffects]§!"
ITA_EmpireManagement_ImperialPolicy_Title_tt:0 "§FThe §WImperial Policy§! determines our §Yoverall policy§! over the whole of the §nEmpire§!. It is decided by the §spath which we choose to take§!.§!"

ITA_EmpireManagement_ImperialPolicy_Starter:0 "Mediterranean Supremacy" # Starter/Ciano
ITA_EmpireManagement_ImperialPolicy_Starter_desc:0 "With the end of the Second World War, Italy became the Master of the Mediterranean, taking the sceptre from the cold, dead hands of the British Empire. The foundation of the Triumvirate only strengthened Italy's domination over Mare Nostrum, countering German aggression and securing the vital trade hub of Suez: despite the Atlantropa disaster, our economy is slowly recovering.\n\nHowever, dark clouds gather over the Italian Empire. The Triumvirate creaks and sways as its members vie for influence, unearthing old territorial claims alongside new grudges and complaints, while the unrest in the colonies grows constantly, making Italy rely more and more on collaborator governments to retain its supremacy: as Germany teeters closer and closer to collapse, Europe holds its collective breath to see a future without the Reich, and Italy's place in it.\n\nWhatever happens, the Empire must survive, for Italy's destiny was always to lead rather than follow!"
ITA_EmpireManagement_ImperialPolicy_Starter_effects:0 "§YEffects:§!\n  §G+5§! §YControl§! and §YExploitation§! on §WVassal States§!\n  §R-5§! §YControl§! and §YExploitation§! on §WColonies of the Empire§!\n  §R-5§! §YFavour§! with §WIberia§! and §WTurkey§!"

ITA_EmpireManagement_ImperialPolicy_Balbo:0 "A New Concert of Europe" # Balbo
ITA_EmpireManagement_ImperialPolicy_Balbo_desc:0 "Europe stands divided and weakened. The fall of the Triumvirate has erased the only argin to German aggression, and this threatens Italy's very survival: thankfully, Italo Balbo possesses both the vision and the skill required to ensure that Southern Europe can once again unite against this reborn Attila.\n\nA new Concert of Europe is in the making. Unlike the previous one, it will be led by Italy, for everyone's good: the nations of the Mediterranean shall sing to our tune, and dance to our rhythm. Like puppets on borrowed strings, they will serve their own interests, while unknowingly furthering our own.\n\nMusica, Maestro!"
ITA_EmpireManagement_ImperialPolicy_Balbo_effects:0 "§YEffects:§!\n  §G+10§! §YFavour§! in all §WIndependent§! nations\n  §G+5§! §YControl§! in all §WVassals§! and §WColonies§!"

ITA_EmpireManagement_ImperialPolicy_Muti:0 "An Imperial Brotherhood" # Muti
ITA_EmpireManagement_ImperialPolicy_Muti_desc:0 "A long time ago, the Mediterranean was united under the greatest Empire to ever exist. While such a past will never be restored, we still have a duty towards Europe: as Ettore Muti knows, well, it is a duty of brotherhood and unity, in the face of the German aggressor.\n\nUnder Italian leadership, the squabbling European nations will be reforged into strong, capable allies, ready to stand side by side against barbarism. Things like tongues, religions or skin colors are but aesthetic differences, and must be relegated to the dark closet they came from: we were originally one, and it will be so once again!\n\nUnder fascism, we are all equal!"
ITA_EmpireManagement_ImperialPolicy_Muti_effects:0 "§YEffects:§!\n  §G+10§! §YFavour§! in all §WAuthoritarian§! nations\n  §R-5§! §YFavour§! in all §WDemocratic§! nations\n  §G+5§! §YControl§! in all §WVassals§! and §WColonies§!\n  §R-5§! §YExploitation§! in all §WVassals§! and §WColonies§!"

ITA_EmpireManagement_ImperialPolicy_Pavolini:0 "All Roads Lead to Rome" # Pavolini
ITA_EmpireManagement_ImperialPolicy_Pavolini_desc:0 "Italy was once the capital region of a continent-spanning Empire. From the four corners of the world, untold riches reached Rome, a city carved in marble and gold: this is what we were, and this is what we shall become once again, for Alessandro Pavolini decreed it, and no one disobeys the Duce.\n\nThe nations of the Mediterranean exist only to fuel our inevitable rise to greatness. Colonies and puppets will provide the raw materials so that we can once again be the Caput Mundi: after all, great powers have no friends, only interests, as the British once said, and then experienced upon themselves.\n\nThe Mediterranean is our lake, and by birthright, all fishes in it belong to us..."
ITA_EmpireManagement_ImperialPolicy_Pavolini_effects:0 "§YEffects:§!\n  §R-10§! §YFavour§! and §YControl§! in §Wall§! regions\n  §G+10§! §YExploitation§! and §YDependency§! in §Wall§! regions"

ITA_EmpireManagement_ImperialPolicy_Giani:0 "The New Order" # (wow referens) Giani
ITA_EmpireManagement_ImperialPolicy_Giani_desc:0 "The greatest war of all ages smashed aside the Old Order, and replaced it with a new one - a Fascist Order. Benito Mussolini had a vision, one where Italy stood as Master of the Mediterranean, and Niccolò Giani shall make it real: strength will replace weakness, and order will prevail over infighting and selfishness.\n\nOf course, the nations of Europe will refuse the righteousness of our plan, and resist the coming of Fascism. Slowly but steadily, we shall make our dreams come true, no matter the cost: once they are forced to open their eyes, the rest of Europe will see that this is done for everyone's good.\n\nBy God and Fascism, we shall make Europe whole..."
ITA_EmpireManagement_ImperialPolicy_Giani_effects:0 "§YEffects:§!\n  §G+5§! §YControl§! on §WVassal States§!\n  §R-10§! §YFavour§! in all §WIndependent§! nations\n  §R-2§! §YControl§! on §WColonies of the Empire§!\n  §G+5§! §YExploitation§! and §YDependency§! in §Wall§! regions"

ITA_EmpireManagement_ImperialPolicy_LeftDem:0 "Una Nuova Italia" # LeftDem
ITA_EmpireManagement_ImperialPolicy_LeftDem_desc:0 "For decades, the fascist regime oppressed Europe, exploiting its various peoples and crushing their dreams of freedom and democracy. No more! Now that the winds of liberty have blown away the remnants of Mussolini's madness, we shall forge a new Italy, one that cherishes democracy and friendship between nations rather than oppression and exploitation.\n\nOf course, our first directive is to cement relationships with fellow European democracies, while shunning all those states where the people have to live under the boot of tyrants and populists. Additionally, we shall prepare the ground to decolonise the former Empire, so that no other crimes are committed in the name of power: exploitation of the colonies will end, and local governments slowly prepared for eventual independence.\n\nThis, my friends, is the new Italy!"
ITA_EmpireManagement_ImperialPolicy_LeftDem_effects:0 "§YEffects:§!\n  §G+15§! §YFavour§! in all §WDemocratic§! nations\n  §R-10§! §YFavour§! in all §WAuthoritarian§! nations\n  §R-20§! §YFavour§! with §WFascist§! and §WNational Socialist§! nations\n  §G+10§! §YControl§! in all §WVassals§! and §WColonies§!\n  §R-10§! §YExploitation§! on §WVassal States§!\n  §R-20§! §YExploitation§! on §WColonies of the Empire§!"

ITA_EmpireManagement_ImperialPolicy_CenterDem:0 "Steady as She Goes" # CenterDem
ITA_EmpireManagement_ImperialPolicy_CenterDem_desc:0 "Fascism is gone, and Italy must now find her own station as a democratic country. In order to forge good relationships with the other nations of Europe, we shall pursue national interest with good faith and common sense, rather than blindly chasing principles or confrontation: extremism always leads to catastrophe, no matter its alignment.\n\nAs such, we must keep all doors open, and allow yourself a degree of discretion in the actors to favor at a certain time. While some may criticise us for shaking hands with men of the same breed as those who oppressed our own people, we play the long game: slowly but steadily, we shall build a better Europe, one where democracy shines from Lisbon to Helsinki, and from Edinburgh to Athens.\n\nRome shall lead the way to prosperity!"
ITA_EmpireManagement_ImperialPolicy_CenterDem_effects:0 "§YEffects:§!\n  §G+10§! §YFavour§! and §YControl§! in all §WDemocratic§! nations\n  §G+5§! §YDependency§! on all §WIndependent§! nations\n  §G+10§! §YExploitation§! on all §WVassal States§!"

ITA_EmpireManagement_ImperialPolicy_RightDem:0 "Embers of a New Empire" # RightDem
ITA_EmpireManagement_ImperialPolicy_RightDem_desc:0 "As the ancients used to say, "Historia magistra vitae", and for us she has been especially tough. Fascism failed, because it tried to achieve the unachievable, and replied with violence whenever it was met with opposition: as heirs of this failure, it falls upon us to correct the past wrongdoings, and restore Italy to her righteous place as a world power in a way that fits this modern age.\n\nOf course, this does not mean giving up our dreams of grandeur. As the Americans have shown time and again in the last decade, diplomatic pressure, trade influence and secret sabotage can prove more effective as chains than a gun aimed to the head: as our ancestors, we shall learn from our former adversaries, and pave our own way to greatness.\n\nFrom the ashes of our predecessors, a new Italian Phoenix will rise!"
ITA_EmpireManagement_ImperialPolicy_RightDem_effects:0 "§YEffects:§!\n  §G+10§! §YControl§! on §WVassal States§!\n  §G+5§! §YDependency§! in all §WIndependent§! nations\n  §G+15§! §YExploitation§! on §WVassal States§!\n  §R-10§! §YControl§! on §WColonies of the Empire§!"

