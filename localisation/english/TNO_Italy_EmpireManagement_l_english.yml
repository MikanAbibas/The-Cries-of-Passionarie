## Names and Backstories
# Character limit for backstories is ~400
# Maximum supported amount is 405, but considering Aldrich is a font where characters don't have the same size it can vary

# Internal Regions
ITA_EmpireManagement_Libya_Name:0 "§KSouthern Libya§!"
ITA_EmpireManagement_Libya_Backstory:0 "The vast desert expanses of Southern Libya, finally conquered during the brutal pacification campaigns of 1920s, are home to enormous reserves of oil and nomadic bedouin tribes which despise Italian domination. Italian forts and oil fields are sparse dots in the wide open sands, dominated by their ancient inhabitants."

ITA_EmpireManagement_Sudan_Name:0 "§GSudan§!"
ITA_EmpireManagement_Sudan_Backstory:0 "Theoretically part of Egypt, Sudan is ruled by two de facto independent religious orders, the Khatmiyya and the Ansar, with the former mostly being pro-Cairo and the latter being warmer towards us. While it is hard for us to project influence this far up the Nile, we should nevertheless keep a close eye on Sudanese affairs."

ITA_EmpireManagement_Eritrea_Name:0 "§KEritrea§!"
ITA_EmpireManagement_Eritrea_Backstory:0 "The governorate of Eritrea was the first region of East Africa to fall under Italian control in the 19th century, turning into the main avenue for Italian penetration in the interior. The colony has valuable ports and agricultural resources, while much of its native population is used as colonial troops for the Regio Esercito."
ITA_EmpireManagement_Eritrea_Backstory_Decol:0 "Used to be a colony and is now independent or something idk."

ITA_EmpireManagement_Ethiopia_Name:0 "§KEthiopia§!"
ITA_EmpireManagement_Ethiopia_Backstory:0 "The largest among Italy's colonies, Ethiopia's annexation marked the country's ascension from Kingdom to Empire. However, resistance still runs rampant in the mountainous North, and until these forces are permanently dealt with, or someone manages to win the natives' support, Ethiopia - and by extension, all of Italian East Africa - will never be stable."
ITA_EmpireManagement_Ethiopia_Backstory_PostFashCollapse:0 "When the Viceroyalty collapsed, Ethiopia thought it could once again have its freedom, after thirty years of Italian occupation. Instead, they were met with the iron fist of the Duce's will, and the full might of the Italian armed forces: decimated by field losses, the resistance is extremely weakened, giving the Italians an opportunity to restore a semblance of order over the colony."
ITA_EmpireManagement_Ethiopia_Backstory_Decol:0 "Used to be a colony and is now independent or something idk."

ITA_EmpireManagement_Somalia_Name:0 "§KGreater Somalia§!"
ITA_EmpireManagement_Somalia_Backstory:0 "The governorate of Somalia was part of the Italian Empire since the 19th century, and was greatly expanded over the years to include all Somali-speaking populations. The moods of the Somalis have often waved between rebellion and reluctant acceptance of Italian rule, with their country being valuable for its ports and its agricultural lands."
ITA_EmpireManagement_Somalia_Backstory_Decol:0 "Used to be a colony and is now independent or something idk."

ITA_EmpireManagement_Kenya_Name:0 "§KKenya§!"
ITA_EmpireManagement_Kenya_Backstory:0 "Once a British colony, Kenia and its valuable farmlands have been a welcome addition to our empire, yet we are struggling to control the remote and infrastructurally isolated highlands. The native population has proved hard to subjugate, and banditry is rife in the distant colony"
ITA_EmpireManagement_Kenya_Backstory_Decol:0 "Used to be a colony and is now independent or something idk."

# Western Europe
ITA_EmpireManagement_France_Name:0 "§QFrench State§!"
ITA_EmpireManagement_France_Backstory:0 "Once the undisputed master of Europe, France's glory days are long over. Reduced to little more than a rump state deprived of much of its territory, the country may still be a useful addition to our sphere of influence, provided we manage to snatch it from Germany's."

ITA_EmpireManagement_Iberia_Name:0 "§fIberian Union§!"
ITA_EmpireManagement_Iberia_Backstory:0 "Established by the cold-forge fusion of Portugal and Spain as a defensive alliance, the Iberian Union has tried - and mostly failed - to find an equilibrium between the two constituents. Despite this constant instability, however, the Iberian Union remains one of the most important countries in the Mediterranean, and a prime diplomatic target for Italy."

ITA_EmpireManagement_Switzerland_Name:0 "§VSwitzerland§!"
ITA_EmpireManagement_Switzerland_Backstory:0 "Switzerland has become, much to the chagrin of its inhabitants, synonymous with "nation under siege". As the last democratic and independent country left in Europe, the small Helvetic Confederation would have been invaded if not for Italian intervention: under German embargo, and constantly threatened, Switzerland has grown close to Italy to secure her independence."

# Balkans
ITA_EmpireManagement_Croatia_Name:0 "§EKingdom of Croatia§!"
ITA_EmpireManagement_Croatia_Backstory:0 "Separated from Yugoslavia and set up as an independent state during WW2, Croatia was long ruled by the ruthless Ustaše before an Italian-aligned government dominated by king Tomislav II could be solidified. Despite this, the country is still barely teetering on the edge of chaos, beset by mass rebellion and a devastated economy."

ITA_EmpireManagement_Hungary_Name:0 "§OKingdom of Hungary§!"
ITA_EmpireManagement_Hungary_Backstory:0 "PLACEHOLDER"

ITA_EmpireManagement_Romania_Name:0 "§YKingdom of Romania§!"
ITA_EmpireManagement_Romania_Backstory:0 "PLACEHOLDER"

ITA_EmpireManagement_Serbia_Name:0 "§QSerbia§!"
ITA_EmpireManagement_Serbia_Backstory:0 "The last vestige of Yugoslavia, Serbia is a rump state under German military occupation. Isolated from the rest of the German sphere, most of the country is de facto out of control: with rebellion almost inevitable, Serbia presents many opportunities for Italy - hate for the Germans is, after all, highly requested these days..."

ITA_EmpireManagement_Montenegro_Name:0 "§oKingdom of Montenegro§!"
ITA_EmpireManagement_Montenegro_Backstory:0 "The kingdom of Montenegro was created during WW2, following the dissolution of Yugoslavia. The crown was offered by the Italians to the Romanov prince Nikola, who has ruled the country ever since, having to contend with widespread partisan resistance as well as an unreliable and inefficient state apparatus."

ITA_EmpireManagement_Albania_Name:0 "§eKingdom of Albania§!"
ITA_EmpireManagement_Albania_Backstory:0 "In 1939, Albania was invaded by Italy in an operation devised by the then prime minister Galeazzo Ciano. The country was turned into a formal protectorate, with the king of Italy assuming the title of king of Albania, appointing a viceroy as his local representative, and the government being staffed by the unpopular Albanian Fascist Party, artificially constructed as an imitation of the Italian PNF."

ITA_EmpireManagement_Bulgaria_Name:0 "§oTsardom of Bulgaria§!"
ITA_EmpireManagement_Bulgaria_Backstory:0 "Bulgaria profited from its close relationship with the Reich, regaining many of her claimed territories, but this territorial expansion resulted in increased instability. With the local minorities opposing their so-called "liberators" in Sofia, the triumph soon turned into a grinding war of attrition: this vulnerability makes Bulgaria a prime diplomatic target for Italy."

ITA_EmpireManagement_Greece_Name:0 "§MHellenic State§!"
ITA_EmpireManagement_Greece_Backstory:0 "Can a single word cause untold amounts of pain and suffering? As the birthplace of tragedy, Greece taught the world that indeed, a single "no" can doom a country to a fate worse than death: now, as clouds gather once again over the Mediterranean, the country finds itself protagonist in an unwanted imitation of its ancient theatre competitions - one tragedy is barely finished, another one is already beginning."
ITA_EmpireManagement_Greece_Backstory_Independent:0 "After the Italo-Turkish war, the Greek collaborator government collapsed. Now, a free Greece looks to establish a presence in the Mediterranean, navigating the dark waters of diplomacy alone: ss any Greek surely knows, however, the Styx is not a gentle river to navigate. With various factions vying for dominance, another Peloponnesian War might embolden a new generation of Persians..."
ITA_EmpireManagement_Greece_Backstory_Puppet:0 "Like all good things, freedom has an inherent tendency to last little. As the birthplace of democracy, Greece has spent most of its history under tyranny, and the circle closes once again, in the form of a noose around the neck of free Greece: after a second invasion, Italy is once again master of the country, and this time she has all intentions to stay."

# Middle East
ITA_EmpireManagement_Turkey_Name:0 "§VRepublic of Turkey§!"
ITA_EmpireManagement_Turkey_Backstory:0 "Turkey has been an ally of convenience during and after WWII; relationships with the country have however grown tense in recent years, mostly over conflicting spheres of influence in the Easter Mediterranean. We should make sure that the Turks are reminded of their place in the Mare Nostrum."

ITA_EmpireManagement_IME_Name:0 "§KItalian Middle East§!"
ITA_EmpireManagement_IME_Backstory:0 "Comprising the former British Mandate of Palestine and parts of the French Mandate of Syria and Lebanon, the Governorate of the Levant is a mosaic of lands, religions and ethnicities. Populated by a massive influx of Jewish immigrants, the region is currently rife with tensions, while the Italian administration tries to navigate these treacherous waters with a mixture of fear and cunning."
ITA_EmpireManagement_IME_Backstory_Independent:0 "The Italo-Turkish war proved the final nail on the coffin that was the Governorate of the Levant. With Ciano unable to intervene due to the trappings of the Verona Congress, Governor Pietromarchi was forced to call a conference in Jerusalem: now, the Levant is formally independent, and free to seek its own balance in the great game of politics both internal and external."
ITA_EmpireManagement_IME_Backstory_Governate:0 "In the end, fascism does not tolerate freedom, be it at home or abroad. The loss of the Governorate of the Levant was deemed an intolerable loss for the Empire, and the Duce ordered a full-scale invasion, which resulted in the re-establishment of the Governorate: this time however, the Italians have all intentions to stay."

ITA_EmpireManagement_Iraq_Name:0 "§IRepublic of Iraq§!"
ITA_EmpireManagement_Iraq_Backstory:0 "After a turbulent recent past, general Qasim's regime has finally managed to bring a semblance of internal stability to Iraq, and while under him the country is still economically reliant on us, we should still keep a close watch on the general, as we cannot trust him to have Italy's best interests in mind."

ITA_EmpireManagement_Saudi_Arabia_Name:0 "§nKingdom of Saudi Arabia§!"
ITA_EmpireManagement_Saudi_Arabia_Backstory:0 "Saudi Arabia's loyalty towards us is conditional at best, but it is vital that we maintain our strategic partnership with the country and their seemingly endless wealth of oil. Saudi court politics may be mysterious and inscrutable, yet we should still try our best to project influence in Riyadh."

ITA_EmpireManagement_Gulf_Name:0 "§KGovernorate of the Gulf§!"
ITA_EmpireManagement_Gulf_Backstory:0 "The governorate of the Gulf was added to the Italian conquests in the final months of WW2, as the local emirs turned to another protector following the collapse of the British Empire. Since then vast oil reserves have been discovered in the region, prompting ENI to move its largest headquarters to Dubai."

ITA_EmpireManagement_Yemen_Name:0 "§xKingdom of Yemen§!"
ITA_EmpireManagement_Yemen_Backstory:0 "Italy begun diplomatic penetration in Yemen since even before WW2, and now the country is solidly in our sphere of influence; despite this, the weak authority of the Imam-King and the wide unpopularity of the monarchy may seriously threaten our interests in the kingdom, and in Arabia as a whole."

ITA_EmpireManagement_Oman_Name:0 "§sSultanate of Oman§!"
ITA_EmpireManagement_Oman_Backstory:0 "The sultanate of Oman and Muscat is a backwater and remote country in Arabia, only useful to us for its strategic location and apparent wealth of oil. Ruled by a sultan and by local Ibadi religious leaders, Oman has so far proven remarkably stable, but we should still pay attention to the events of this distant realm."

# Africa
ITA_EmpireManagement_Algeria_Name:0 "§QAlgeria§!"
ITA_EmpireManagement_Algeria_Backstory:0 "The last remnant of the French colonial empire, Algeria is on the brink of collapse. With the Algerian population seeking to cast aside European rule, and the French colonists reacting to violence with even more violence, France finds itself too weak to intervene: everyone knows war will soon come to Algeria, and Italy will have to ensure it doesn't spill into her territories."
ITA_EmpireManagement_Algeria_Backstory_Independent:0 "When French rule over the colony collapsed, a bloody civil war erupted, pitting the Algerians against the French. Additionally, Italian and Iberian forces intervened to secure the country for their interests: in the end, the Europeans were cast out of Algeria, and an independent country was born, one that wishes to export freedom to the entirety of Northern Africa."
ITA_EmpireManagement_Algeria_Backstory_ITAaligned:0 "When French rule over the colony collapsed, a bloody civil war erupted, pitting the Algerians against the French. Additionally, Italian and Iberian forces intervened to secure the country for their interests: in the end, Italy managed to instaurate an independent, if friendly government, and while nationalists decry this as neo-colonialism, few can deny that Italy managed to balance, for once, local interests and imperialist policies."
ITA_EmpireManagement_Algeria_Backstory_FRAaligned:0 "When French rule over the colony collapsed, a bloody civil war erupted, pitting the Algerians against the French. Additionally, Italian and Iberian forces intervened to secure the country for their interests: in the end, the Old Order prevailed, and the revolt was beaten back in blood and mud. However, with their prize now a rotten carcass, what will the victors do?"

ITA_EmpireManagement_Tunisia_Name:0 "§KKingdom of Tunisia§!"
ITA_EmpireManagement_Tunisia_Backstory:0 "The kingdom of Tunisia has been restored to its ancient Ottoman status, except this time the king of Rome is its overlord, instead of the old Sublime Porte. The local bey, bound by vassalage to us, administers the country on a day to day basis, but we should still take care to contain the numerous nationalist and subversive movements lurking in the country."

ITA_EmpireManagement_Egypt_Name:0 "§GIl Regno d'Egitto§!"
ITA_EmpireManagement_Egypt_Backstory:0 "Egypt was released from the British yoke in WWII only to fall under the Italian one, but since then the country has kept further spiraling into political instability. The government of king Farouk remains grossly unpopular, yet its fall would be a mortal threat to our interests in the country."

ITA_EmpireManagement_Morocco_Name:0 "§rMorocco§!"
ITA_EmpireManagement_Morocco_Backstory:0 "The former French Mandate of Morocco returned under Spanish rule after the end of the Second World War. Then, the colony was integrated into the Iberian Union: since then, Morocco has lived an uneventful existence, but with the collapse of the Iberian Union, the country has been catapulted into independence."

