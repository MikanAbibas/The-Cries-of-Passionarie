 ### Stato Italiano ###
 ITA_Roberto_Farinacci: "Roberto Farinacci"
 POLITICS_ROBERTO_FARINACCI_DESC: "Roberto Farinacci was not always a fascist. When he was young, he wrote for a socialist newspaper called "L'Eco del Popolo." However, from 1914 to 1919 he would shift first towards interventionism and then to Mussolini's Italian Socialist Union. He was there at San Sepolcro, and in 1925 would briefly become the secretary of the PNF.\n\nIn the interwar period, Farinacci would spend much of his time organizing the armed wing of the PNF, a period of time characterized by disproportionate retaliation and excessive violence. After a massacre in Tuscany committed against anti-fascists resulted in his fall from the political stage, Farinacci would serve in Ethiopia. Here he would lose his hand fishing with a grenade, and would be given the nickname "Kingfisher" by Ettore Muti because of it.\n\nDespite this, Farinacci would return to politics, supporting strong ties to Germany, and an extreme view of fascism. After the war, these beliefs would see him sidelined, however the Revolution gave Farinacci his chance to shine. With the Germans at his back, Farinacci liberated Italy from the bolshevik scum, and restored fascism to his homeland. While scarred, Italy has not reached its end yet."
 ITA_Giovanni_Preziosi: "Giovanni Preziosi"
 ITA_Giovanni_Preziosi_hog_desc: "------------\n§LGiovanni Preziosi was once a priest, and even after dismissal was a devout Catholic who worked with marginalized people almost daily. With the advent of the Great War, Preziosi would side with the nationalists and come into contact with Mussolini himself. He would help disseminate the Protocols of the Elders of Zion, and would openly decry Judaism, Freemasonry, and Bolshevism.\n\nOnce he joined the fascist movement, he would frequently side with Roberto Farinacci, and after the war he would remain a Germanophile. When Italy fell to bolshevism, Preziosi once again sided with Roberto Farinacci, a decision proven correct with the SFRI's final victory over the bolshevik weaklings.§!"
 ITA_Filippo_Anfuso: "Filippo Anfuso"
 ITA_Filippo_Anfuso_for_desc: "------------\n§LFilippo Anfuso was at first a journalist, reporting on D'Annunzio and the events at Fiume. In 1925, he would become a diplomat, and would jump around from Germany to Hungary to China to Greece before volunteering in the Spanish Civil War.\n\nIn 1936, he would become Deputy Minister of Foreign Affairs under Ciano, at the time a close friend. While he may have been happy to see a friend become Duce, his mood would quickly shift as Italy collapsed into communism and degeneracy. Now, Anfuso represents the SFRI in its diplomacy with the German Reich. Anfuso's mission now is clear: to facilitate the greatest era of union between fascism and Nazism, and unite Europe's greatest empires.§!"
 ITA_Tullio_Cianetti: "Tullio Cianetti"
 ITA_Tullio_Cianetti_eco_desc: "------------\n§LInspired by fascist syndicalists like Edmondo Rossoni, Cianetti's opposition to capitalism and occasional disappointment in the PNF's failure to uphold union rights frequently isolated him, but that did little to stop his rise as a prominent trade unionist in Italy. In Italy's most dire hour, Cianetti's pro-german and racialist ideas naturally led him to back Farinacci's fateful putsch attempt. Now Cianetti wages a war against the Bolshevik drunkeness that has overtaken his homeland.§!"
 ITA_Giorgio_Bardanzellu: "Giorgio Bardanzellu"
 #ITA_Vincenzo_Costa_sec_2_desc: "------------\n§LIt was during the Great War that Vincenzo Costa first encountered Bolshevik propaganda. Upon the banks of the Isonzo, Costa saw it undermine morale and cause desertions. Costa was a fascist from the beginning, and was friends with Mussolini and many other fascist leaders. However, he never engaged in the political hierarchies of Italy, preferring to focus on direct action.\n\nWhen Bolsheviks took over Italy, Costa refused to stand idly by. Joining up with Farinacci's attempted March on Rome, Costa gladly sided with the SFRI when the Bolsheviks proved sturdier than expected. Organizing the Black Brigades, Costa refused to allow Bolshevism to drag Italy into degeneracy.§!"
 ITA_cleaved_country: "A Cleaved Country"
 ITA_cleaved_country_desc: "In the wake of righteous German victory over the Bolshevik traitors, Italy has fallen into heavy instability. Partisans control a worrying amount of the land outside of the major cities and outposts, and organize attacks on a daily basis.\n\nIf Farinacci and his German allies do not act soon, the nation may fall to Bolshevism yet again..."
 ITA_cleaved_government: "...and a Cleaved Government"
 ITA_cleaved_government_desc: "The Government of the Italian State is divided. On one side are Farinacci's most loyal fascist followers. On the other side, the White Guard's organizations, allowed to continue onwards solely by Germany's will.\n\nWhile both sides have agreed to work together for now, they share a number of divergent views. There's no telling if this forced alliance will last..."
 ITA_brigate_nere: "The Black Death"
 ITA_brigate_nere_desc: "temp"
 ITA_whats_left: "What's Left?"
 ITA_whats_left_desc: "The war between the Germans and the socialists has left deep scars within Italy.\n\nThe bombing campaigns and brutal fighting along the fronts during the war destroyed significant amounts of the country's most productive regions, and what did survive the war has been decimated by German economic extraction. Many have lost hope in Italy ever recovering from this devastation."
