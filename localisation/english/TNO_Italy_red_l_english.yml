 ITA_RED_a_shaky_foundation: "A Shaky Foundation"
 ITA_RED_a_shaky_foundation_desc: "While the new government claims to represent the people, even this early on many seem to struggle to ascend its ranks. Some of the figures chosen to lead Italy's transition seem like nobodies to most Italians, and their meetings behind closed doors are said to be nigh-impossible to breach. It appears that the only way to cross the veil that has fallen over the government is to know the right people and have the right connections. If you don't, it seems like you'll be forever out of the loop."
 ITA_the_red_spectre: "The Red Spectre"
 ITA_the_red_spectre_desc: "While the Counterrevolution may have been successful, and the PCdI may have peacefully relinquished power, Italy is not yet cleansed of its socialist past. Many still cling to their revolutionary ideals, and now turn to underground resistance.\n\nNot a day goes by without incident in this new Italy, and many begin to wonder if this new Italian government has what it takes to survive."
