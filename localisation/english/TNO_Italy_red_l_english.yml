 ITA_Eugenio_Henke: "Eugenio Henke"
 Politics_Eugenio_Henke_desc: "Eugenio Henke for most of his life was simply a member of the Italian Royal Navy. Becoming ensign in 1931, he would during the war ascend to the ranks of lieutenant and torpedo boat commander, and would serve on over 40 war missions. Post-war, Eugenio Henke would steadily climb the ranks of the admiralty, while also becoming involved in military intelligence.\n\nHowever, Henke's largely unremarkable career would see a sudden rise to prominence when Italy fell to revolution. It was Henke's order that saw a significant portion of the Italian fleet scuttle itself in order to keep the vessels out of the hands of revolutionaries. After leaving the country, Henke would find himself involved with the clandestine P2 and their Operation Gladio.\n\nWhen it came time for the new Italian government to choose someone to lead them, Henke seemed a fitting choice. His past anti-communist resistance, his military experience, lack of overt political ties, and endorsement by other significant leaders in the post-communist government propelled Henke to the forefront of discussion.\n\nNow Henke must chart a new course for Italy, one free from the failures of the PCdI."
 
