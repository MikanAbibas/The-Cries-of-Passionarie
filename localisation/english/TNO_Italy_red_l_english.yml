 ITA_RED_the_plan_for_a_democratic_rebirth: "The Plan for a Democratic Rebirth"
 ITA_RED_the_plan_for_a_democratic_rebirth_desc: "The PCdI has fallen, and order must now be restored to Italy. With the country in such a sorry state after years of socialist mismanagement, it will take a rigorous level of planning to ensure an effective and stable transition towards democracy.\n\nEnter Licio Gelli, a staunch anti-communist and experienced government official, who has been personally charged by Henke to plan such a transition. His "Plan for a Democratic Rebirth" shall put an end to the chaos within Italy, sweep away all of the remnants of the socialist regime, and create the democracy that the King's short-lived government failed to achieve."
 ITA_RED_returning_to_italian_values: "Returning to Italian Values"
 ITA_RED_returning_to_italian_values_desc: "Under the socialist regime, Italian society degenerated, lost its moral values to such an extent as to cause one's stomach to churn. This new Italian society has experienced such radical change, it is baffling to think that the socialist "Cultural Revolution" was incomplete.\n\nThankfully, Gelli's plan for Italy has accounted for this, and most of the damage can be undone.\n\nUnfortunately, some concessions will have to be made. Our government lacks the legitimacy to revert society to the same way it was... in the past. Nevertheless, we'll ensure that Italian society values what truly matters. Instead of class struggle and revolution, good Christian values and patriotism shall take their place."
 ITA_RED_breaking_the_strikes: "Breaking the Strikes"
 ITA_RED_breaking_the_strikes_desc: "Unfortunately, many within Italy have not been supportive of the Counterrevolution. Mainly composed of urban workers, radical students, and leftist academics, protests have been a daily occurrence throughout our government's lifespan so far. If the Plan for Democratic Rebirth is to succeed, these protests must be brought to an end.\n\nFortunately, the Plan has already accounted for this, and our reorganization of the judicial system, we shall include a number of reforms designed to curb these protests. First, the judiciary shall be staffed with individuals in tune with the spirit of our organization and the ideas of "democratic recovery" we've outlined. Second, regulations shall be modified in regards to the subjects of crimes of: subversion, violation of public order, and general violence. Third, law enforcement shall be instructed to clean up these pseudo-political hooligans. They shall be tried and sentenced quickly, and shuffled off to prisons where they can do no further harm.\n\nIt is also necessary to grant political forces the faculty of emergency interrogation of those arrested for the above listed crimes."
 ITA_RED_propietors_not_proletarians: "Propietors not Proletarians"
 ITA_RED_propietors_not_proletarians_desc: "It is a simple acknowledgement of reality that socialism is not the natural economic model for Italy and its people. The remnants of the socialist economic model must be destroyed, and in their place capitalist reforms shall be implemented. We shall also ensure that privatization is thorough and calculated.\n\nBy implementing this "economic shock therapy," we expect a brief drop in quality of life in Italy, but in exchange the workers of Italy shall flourish under capitalism in the long term.\n\nThis also has the added benefit of potentially making a number of our associates a handsome return on their investments into our regime."
 ITA_RED_a_second_bastion_of_liberty: "A Second Bastion of Liberty"
 ITA_RED_a_second_bastion_of_liberty_desc: "With Germany clearly proving themselves unable to enforce order within Italy, and Japan already committed to the exile government in Eritrea, our only natural choice of ally left is America. Andreotti has already begun negotiations to see us integrated into their community, and secure foreign investments to aid in reconstruction and desocialization.\n\nThrough joining the OFN, we put ourselves in a position to act as a second bastion of liberty for the world, one placed directly in opposition to the fascist jackboot. Such a critical status will naturally earn us considerable foreign investment, which while it may hurt some of the less efficient companies in Italy, will ultimately bolster the nation's economy."
 ITA_RED_Liberating_the_Antenna: "Concentraiting Media Ownership"
 ITA_RED_Liberating_the_Antenna_desc: ""Under both the fascist and socialist regimes, television in Italy was monopolized under a single state-owned entity. As we transition towards liberal democracy, this status quo can not stand; the antenna must be liberated!\n\nTo accomplish this objective we shall fund the creation of private television channels, and also magazines and periodicals. To ensure the same level of quality and prevent the spread of harmful misinformation, we shall also create AGCOM. The goal of AGCOM is to monitor and regulate televised media, for the sake of national security in such chaotic times. AGCOM shall also personally oversee the division of the state-backed monopolies in the short-term, until a more healthy level of division has been reached."
 ITA_RED_a_star_rises_over_italy: "A Star Rises Over Italy"
 ITA_RED_a_star_rises_over_italy_desc: ""We've done it. Once these last few acts and decrees have been finalized, Italy's democracy shall be ready to be restored. It has been more than four decades since the nation has seen a truly democratic system like the one housed within our new constitution.\n\nA star rises over a brand new nation, free from the scars of its past.\n\nFree from the tyranny of socialism.\n\nFree from the chaos that it's been familiar with for far too long."
 
