 ITA_RED_army_title_1: "§eL'Esercito Rosso§"
 ITA_RED_army_text_1: "§YWe have called the revolutionaries of Italy to arms,§! §Rand they have answered.§! While our partisans have shown bravery and resilience in their years of insurgency and agitation, the challenges ahead require more than valor alone. Our party's small corps of elite commanders, drawing on Soviet training and decades of experience in revolutionary movements abroad, have prepared initiatives to form our ragged revolutionary alliance into a true §VRed Army§!, capable of defending the revolution from the bickering reactionary remnants and the German wolves prowling on our northern border.\n\nThe state of our army currently gives us:\n[?ITA_red_army_training|=-%] Training Speed\n[?ITA_red_army_recovery|=+%] Recovery Rate\n[?ITA_red_army_org|=+%] Organization\n[?ITA_red_army_command_gain|=+%] Command Power Gain\n[?ITA_red_army_supply_factor|=-%] Out-Of-Supply Penalty on Core Territory"
 
