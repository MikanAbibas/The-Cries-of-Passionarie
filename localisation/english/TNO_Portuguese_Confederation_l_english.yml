 #EVENTS 
 RPP_wars.1.t:0 "Up Again"
 RPP_wars.1.desc:0 "In a sunlit plaza teeming with fervent onlookers, General Francisco da Costa Gomes stands tall at a weathered podium, his crisp military uniform a stark contrast to the vibrant banners fluttering in the breeze. The crowd’s murmurs hush as he grips the microphone, his voice resonant and unwavering, slicing through the warm air. “Portugal must rise as a sovereign, democratic nation,” he proclaims, his eyes scanning the sea of faces, alight with resolve. “No longer shall we bow to Iberian domination—our future lies in the hands of the people, united and free!” Each word carries the weight of conviction, stirring cheers that ripple through the throng, their applause punctuated by the distant chime of church bells. Gomes’ weathered face, etched with determination, remains steadfast, a beacon of hope amid the fervor, as the crowd roars its defiance against foreign influence."
 RPP_wars.1.a:0 "For Portugal"

 RPP_wars.2.t:0 "Song Of Liberty"
 RPP_wars.2.desc:0 "Under a bruised twilight sky, the soldiers hunker down in a makeshift camp nestled among the rugged hills of Alentejo, their silhouettes flickering against the glow of a crackling bonfire. The Iberian Wars have left their uniforms tattered, their faces gaunt, yet their spirits remain unbroken. As the chill of the evening settles, a young soldier, barely twenty, strums a battered guitar, its strings humming with defiance. His voice, raw but steady, rises with the opening notes of A Portuguesa, the anthem of their struggle. “Heroes of the sea, noble people!” he sings, and one by one, his comrades join in, their voices swelling into a rough, heartfelt chorus that drowns out the distant rumble of artillery. The firelight dances on their weathered faces—some scarred, some resolute—as they belt out lyrics of liberty and resistance, their breath visible in the crisp air. The song carries memories of Lisbon’s cobbled streets and the promise of a free Portugal, unshackled from dictatorship and tyranny."
 RPP_wars.2.a:0 "Glad We Are All Brothers"

 RPP_wars.3.t:0 "Title Pending"
