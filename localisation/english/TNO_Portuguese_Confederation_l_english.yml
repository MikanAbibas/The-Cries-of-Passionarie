 RPP_wars.3.a:0 "placeholder"

 RPP_wars.4.t:0 "A Future Freedom"
 RPP_wars.4.desc:0 "In a dimly lit tent on the outskirts of a war-torn Portuguese village, General Francisco da Costa Gomes sits at a scarred wooden table, the faint glow of a kerosene lamp casting long shadows across his weathered face. The Iberian Wars rage beyond the canvas walls, their distant booms a grim underscore to the task at hand. Before him lies a draft constitution, its pages dog-eared and stained with ink, a fragile blueprint for a Portugal reborn. His calloused fingers trace the words—“liberty,” “sovereignty,” “the will of the people”—as he reads, his brow furrowing with the weight of each phrase. A quill pen scratches softly as he jots notes in the margins: Clarify voting rights for rural workers. Ensure judicial independence. His eyes, sharp yet tired, flicker with resolve, envisioning a nation free from Iberian domination, where democracy takes root in the ashes of conflict. The air smells of damp earth and wax, and a faint breeze stirs the tent flap, carrying the scent of pine from the nearby hills. He pauses, his hand hovering over a clause on regional autonomy, and mutters softly, “This must unite us, not divide.”"
 RPP_wars.4.a:0 "Democracy Awaits"

 RPP_wars.5.t:0 "Hear The Call"
 RPP_wars.5.desc:0 "In a cramped attic above a cobbler’s shop in Coimbra, the air hums with the faint crackle of a clandestine radio transmitter, its dials glowing faintly in the pre-dawn gloom. Three pro-democracy radio operators—Ana, a wiry former schoolteacher with ink-stained fingers; João, a bespectacled technician with a nervous tic; and Miguel, a grizzled ex-soldier with a voice like gravel—huddle around a battered table strewn with handwritten scripts and cigarette stubs. The Iberian Wars have fractured Portugal, but their mission is clear: rally support for General Francisco da Costa Gomes and his vision of a democratic future. Ana adjusts the transmitter’s frequency, her hands steady despite the distant thud of shelling. João scribbles the final lines of their broadcast: “Gomes stands for liberty, not the chains of communism, the tyranny of Salazar’s ghost, or the chaos of the GNS.” Miguel tests the microphone, his deep voice rehearsing a denunciation of the communists’ rigid collectivism, the Salazarists’ oppressive nostalgia, and the GNS’s insane crusade. The attic smells of ozone and stale coffee, and a single candle flickers, casting jagged shadows on the peeling walls. Outside, the streets are silent, save for the occasional patrol. Ana whispers, “This must reach every village, every heart.” As João flips the switch, the transmitter hums to life, ready to send their words—defiant, hopeful—across the war-torn nation, a clarion call for Gomes’ democratic dream."
 RPP_wars.5.a:0 "The Power Of Radio"

