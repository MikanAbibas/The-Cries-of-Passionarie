 ## Ministers ##
 ###############
 RPP_Humberto_Delgado:0 "Humberto Delgado"
 POLITICS_HUMBERTO_DELGADO_DESC:0 "After being sent to the US as a representative in the OFN Military Command in the early '50s, Delgado would turn against the state that he once supported and embraced Democracy as the best possible future for Portugal. While he would continue to be anti-Communist, his increasingly vocal support for his new beliefs would make him begin to fear for his life, especially after the 1957 Coup, leading to his self-exile into Brazil. Defeated and exiled, da Silva Delgado would not give up, uniting other exiles and forming the Frente Patriótica de Libertação Nacional (FPLN) to unite all those that wished Democracy to come to Portugal. \n\nWhile the FPLN would have a mostly uneventful existence, being nothing more than a small organization with little influence in both Portugal and Brazil, things would change with the Santa Maria, with the organization growing both in size and influence. However, every blessing, no matter how big, comes with a curse attached to it. Delgado had always valued unity within the exiles above all other things, believing that only together could they threaten Iberia. But with its new size, a myriad of issues became apparent to both him and his supporters, from their ambiguous stance on the colonies to their tacit cooperation with the Communists, despite Delgados' own personal views. Before long, the FPLN would shake to its core, only remaining united thanks to its leaders' popularity and raw charisma.\n\nEven despite all of this, as a Monarchy was declared in Portugal, many Republicans saw him as their only hope, the charismatic general that could lead them and gather enough popular support to rise up against the new regime. Even still, as their initial coup attempt failed and the resulting instability throwing the state into Civil War, Delgado would embrace his position as the leader of a Republican, Democratic Portugal."

