 GER_protektor_overview:0 "Status Of The Reichsprotektorats"
 GER_protektor_overview_desc:0 "The Wehrmacht has essentially swept the NSDAP aside and has assumed a leading role in the governance of the German Reich. Speidel and his allies have decided to extend this new military-led regime to the Reichskommissariats as well. The NSDAP-controlled RKs will be replaced with a new Heer-led Reichsprotektorats. The new Reichsprotektors will be appointed directly from the ranks of the German military. \n\nIn theory, officers of the Wehrmacht should be less susceptible to the fractious politics of the NSDAP, but even the finest general of the German army is still ultimately human. With power comes agenda, and with time those agendas become more and more apparent. \n\n\n§xThe German Reich's Military Readiness is§! [?global.GER_readiness|=+0]\n\n\n\n\n§sREICHSPROTEKTORAT POLEN:§! \n[GGN.Get_protektor_status] \n§sREICHSPROTEKTORAT BALTENLAND:§! \n[OST.Get_protektor_status] \n§sREICHSPROTEKTORAT UKRAINE:§! \n[UKR.Get_protektor_status] \n§sREICHSPROTEKTORAT KAUKASIEN:§! \n[CAU.Get_protektor_status] \n§sREICHSPROTEKTORAT MOSKOWIEN:§! \n[MCW.Get_protektor_status]"
