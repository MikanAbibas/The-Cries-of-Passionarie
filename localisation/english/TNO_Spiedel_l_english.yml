 POLITICS_CLAUS_VON_STAUFFENBERG_DESC:0 "Born to the noble House of Stauffenberg, Claus von Stauffenberg followed in his family's military tradition and joined the German military at a young age. Becoming a career Panzer officer, von Stauffenberg served with distinction in the East and participated in the destruction of the diseased Soviet Union. \n\nHis loyalty and decorated career have won him the patronage of Wagner and the allegiance of many officers unhappy with Speidel's perceived "excessive opportunism," as one anonymous official put it. Ironically, Stauffenberg secretly dislikes National Socialism. A faithful Catholic, he now seeks to slowly and covertly realign the Wehrmacht towards a more conservative form of fascism. Perhaps his loyalty was never to the Führer, but to Germany itself."
 POLITICS_HANS_ULRICH_RUDEL_DESC:0 "Serving from Moscow to Südwestafrika, Hans-Ulrich Rudel's exploits as a pilot in the Luftwaffe are the stuff of legend. He continued to fly even after a leg amputation and was only later promoted to commanding aircraft from the ground. After a stint in Afrika, Rudel returned to the Fatherland proper. He is an outspoken National Socialist, and his fame within the Reich has earned him the admiration of many. \n\nThat, combined with his unlikely friendship with Gerhard von Schwerin—a bond forged during the West Russian War—has convinced the Wehrmacht that he is an ideal candidate to be Führer. An energetic and committed man, there is no one more excited for his ascendency to Führership than himself."
 POLITICS_HORST_MAHLER_DESC:0 "The son of a dentist and commited national socialist, Mahler took his father's beliefs to heart and decided to join the Hitler Youth at a young age. While studying for his law degree, intending to work in the People's Courts, he rejected the growing liberalism in the Universities and staunchly advocated for the preservation of National Socialism. Yet during this time he began studying the writings of Otto and Gregor Strasser, and has subsequently adopted many of their beliefs. When Speidel revived the Deutsche Arbeitsfront, Mahler joined as an attorney and rapidly climbed up the ranks, becoming it's head a few years afterwards. \n\nMahler has worked to protect the interests of the Aryan worker; fighting to end the practice of slavery within the Reich, which he believes has been used to supress the German worker. Now Mahler has grasped the reigns of power and now sees his chance to make the National Socialist Revolution a reality."
 POLITICS_ALFRED_ROSENBERG_DESC:0 "There are few tenets of National Socialism that Rosenberg did not have a hand in. A member of the NSDAP from its earliest days, Rosenberg was the chief theorist of Nazi ideology. However, his public deviations from mainstream race theory and growing political isolation earned the former minister de facto exile in Ukraine. This became a blessing in disguise, as it happened, and Rosenberg was spared from the political chaos in Germany proper. With many of his former compatriots either dead or in exile, Rosenberg is one of the last old party members still standing. \n\nUpon his return to the Reich, he immediately set to work spreading his theories once more. Speidel's leniency towards his activities has caused a resurgence of his influence within Germania. With Heusinger's support, he has finally ascended to the position of Führer. Free to enact his will upon the Reich, Rosenberg seeks to revive Positive Christianity, as well as extend the definition of Aryan to Slavs. An intellectual at heart, Rosenberg is deeply invested in the esoteric side of National Socialism. He is no friend of Himmler's, however."
 POLITICS_ALBERT_BORMANN_DESC_2:0 "Albert Bormann is very much unlike his brother. Lacking Martin's strong political ambition, he was content to play a relatively subordinate role as Hitler's Chief of Personal Affairs. After Adolf Hitler's death, Albert Bormann threw in his lot with Hermann Goering, for he and his brother had a strong mutual disdain for one another. \n\nAlbert Bormann would have been content to once again serve in a subordinate position, but with Schroener's coup and Speidel's countercoup, Bormann found himself playing a leading role in Speidel's military government. Deciding to take matters into his own hands, Bormann managed to curry enough favor within the Wehrmacht to secure his ascendency to the office of Führer. \n\nA former close confidant of Hitler's, Bormann believes in administrative efficiency above all else and despises the pageantry and factionalism of modern NSDAP politics. Some say his political beliefs are driven more by his hatred of Martin than anything else."
