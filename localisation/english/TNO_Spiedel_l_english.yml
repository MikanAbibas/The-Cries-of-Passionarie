 GER_speidel_fuhrer.1.t:0 "Reichsprotektor Of Polen"
 GER_speidel_fuhrer.1.d:0 "The former territories of the Generalgouvernement have once again been brought under our control. \n\nWe may now appoint one member of our government to be Reichsprotektor of Polen. The territory has been unstable for some time now, so whoever is put in charge will have their work cut out for them."
 GER_speidel_fuhrer.1.a:0 "Appoint Rommel"
 GER_speidel_fuhrer.1.b:0 "Appoint Wagner"
 GER_speidel_fuhrer.1.c:0 "Appoint Schwerin"
 GER_speidel_fuhrer.1.e:0 "Appoint Baudissin"
 GER_speidel_fuhrer.1.f:0 "Appoint Heusinger"
 GER_speidel_fuhrer.1.g:0 "Appoint Bormann"
 GER_speidel_fuhrer.2.t:0 "Reichsprotektor Of Baltenland"
 GER_speidel_fuhrer.2.d:0 "Ostland disintegrated into warring factions at the onset of the Bunderskrieg, but has since been stabilized by Wehrmacht units. At General Heusinger’s request, we have decided to rename Ostland to Baltenland, as a sign of goodwill to the Balts. Allegedly, Alfred Rosenberg made a similar recommendation many years ago, but it was rejected. \n\nTrivia aside, we need to appoint a Reichsprotektor for Baltenland."
 GER_speidel_fuhrer.2.a:0 "Appoint Rommel"
 GER_speidel_fuhrer.2.b:0 "Appoint Wagner"
 GER_speidel_fuhrer.2.c:0 "Appoint Schwerin"
 GER_speidel_fuhrer.2.e:0 "Appoint Baudissin"
 GER_speidel_fuhrer.2.f:0 "Appoint Heusinger"
 GER_speidel_fuhrer.2.g:0 "Appoint Bormann"
 GER_speidel_fuhrer.3.t:0 "Reichsprotektor Of Ukraine"
 GER_speidel_fuhrer.3.d:0 "A critical fixture in the Reich’s agricultural sector, Ukraine may not have disintegrated into civil war, but grain supplies to the Reich were nonetheless disrupted. \n\nIt will be up to the new Reichsprotektor of Ukraine to ensure that this never happens again."
 GER_speidel_fuhrer.3.a:0 "Appoint Rommel"
 GER_speidel_fuhrer.3.b:0 "Appoint Wagner"
 GER_speidel_fuhrer.3.c:0 "Appoint Schwerin"
 GER_speidel_fuhrer.3.e:0 "Appoint Baudissin"
 GER_speidel_fuhrer.3.f:0 "Appoint Heusinger"
 GER_speidel_fuhrer.3.g:0 "Appoint Bormann"
 GER_speidel_fuhrer.4.t:0 "Reichsprotektor Of Kaukasien"
 GER_speidel_fuhrer.4.d:0 "Crucial to the Reich’s strategic dominance, Kaukasien must be protected at all costs. Continued dominance of the Black Sea would become difficult were we to lose it, and the oil fields of Azerbaijan are far too valuable to let go of. \n\nWhoever is appointed Reichsprotektor of Kaukasien will definitely have his work cut out for him."
 GER_speidel_fuhrer.4.a:0 "Appoint Rommel"
 GER_speidel_fuhrer.4.b:0 "Appoint Wagner"
 GER_speidel_fuhrer.4.c:0 "Appoint Schwerin"
 GER_speidel_fuhrer.4.e:0 "Appoint Baudissin"
 GER_speidel_fuhrer.4.f:0 "Appoint Heusinger"
 GER_speidel_fuhrer.4.g:0 "Appoint Bormann"
 GER_speidel_fuhrer.5.t:0 "Reichsprotektor of Moskowien"
 GER_speidel_fuhrer.5.d:0 "Dysfunctional and underdeveloped for the most part, Moskowien nonetheless serves as a critical buffer between the Reich’s more valuable territories and the violent Russian warlords and bandit kings. \n\nWe can’t expect Moskowien ever to become an economic powerhouse, but it should serve as a worthwhile military district."
 GER_speidel_fuhrer.5.a:0 "Appoint Rommel"
 GER_speidel_fuhrer.5.b:0 "Appoint Wagner"
 GER_speidel_fuhrer.5.c:0 "Appoint Schwerin"
 GER_speidel_fuhrer.5.e:0 "Appoint Baudissin"
 GER_speidel_fuhrer.5.f:0 "Appoint Heusinger"
 GER_speidel_fuhrer.5.g:0 "Appoint Bormann"
 GER_speidel_fuhrer.6.t:0 "Administration Of Crimea"
 GER_speidel_fuhrer.6.d:0 "As you’re already well aware, Crimea has been directly administered from Germania since near the end of the Second World War. The peninsula has been thoroughly settled by German citizens and is practically a core part of the Reich by now. \nHowever, for military purposes, it may be better to place it under the control of a Reichsprotektor. This would simplify logistical control and provide the Reichsprotektorat with a sizable population of Übermenschen from which to recruit soldiers. \n\nThere are two options. We can transfer it to Ukraine, or we can place it under Kaukasien. \n\nThen again, we can simply return to the status quo and return Crimea to direct control."
 GER_speidel_fuhrer.6.a:0 "Give It To The Reichsprotektorat of Ukraine"
 GER_speidel_fuhrer.6.b:0 "Kaukasien Should Have It"
 GER_speidel_fuhrer.6.c:0 "It Will Return To Direct Rule"
 GER_speidel_fuhrer.7.t:0 "A Principle Port"
 GER_speidel_fuhrer.7.d:0 "Now, while I agree that it would be nice if we had infinite money, reality trumps all delusions. Philosophy aside, our economists have put forward three candidates for port renovation and large-scale expansion. \n\nWilhelmshaven is our primary domestic port on the Atlantic, and expanding it would benefit our efforts to enlarge the Kriegsmarine. \n\nHamburg is a civilian port, but it is critical for trade. Building up its port could yield long-term economic benefits. \n\nFinally, Königsberg is a critical port on the Baltic. If its port were to be expanded, it would help with force projection in the Baltic, as well as shore up defenses in case an enemy breaches it."
 GER_speidel_fuhrer.7.a:0 "Wilhelmshaven!"
 GER_speidel_fuhrer.7.b:0 "Hamburg!"
 GER_speidel_fuhrer.7.c:0 "Konigsberg!"
 GER_speidel_fuhrer.8.t:0 "A Small Memo"
 GER_speidel_fuhrer.8.d:0 "EXCELLENT NEWS. \n\nOUR EFFORTS TO ELIMINATE UNCOMPENSATED AND UNSANCTIONED CUMPULSORY LABOUR HAVE BORN FRUIT. A SIGNIFICANT PROPORTION OF FORCED LABOURERS HAVE BEEN EMANCIPATED AND HAVE BEEN INTEGRATED INTO THE ECONOMY PROPER. \n\nTHEIR FORMER OVERSEERS AND HANDLERS HAVE BEEN AWARDED THE NECESSARY COMPENSATION. \n\nASSUMING NO CHANGE WE WILL COMPLETE TOTAL ABOLITION WITHIN ANOTHER FEW YEARS."
 GER_speidel_fuhrer.8.a:0 "Excellent"
 GER_speidel_fuhrer.9.t:0 "Another Small Memo"
 GER_speidel_fuhrer.9.d:0 "ATTENTION. \n\nWE HAVE MANAGED TO COMPLETELY ELIMINATE UNCOMPENSATED LABOUR. \n\nALL WILL BE COMPENSATED FOR THEIR SERVICE TO THE REICH. \n\nTHAT IS ALL."
 GER_speidel_fuhrer.9.a:0 "Perfect!"
 GER_speidel_fuhrer_pol.1.t:0 "Generals Of Interest"
 GER_speidel_fuhrer_pol.1.d:0 "Something was wrong. \n\nSpeidel was flipping through reports from the Reichsprotektors when he began to notice a pattern. He dug up some older reports he had saved, and his suspicions were confirmed. \n\nThe initial military reports were perfectly standard and were written with due detail. Yet, slowly, the reports from each Reichsprotektor began to grow increasingly vague. \n\nAt first, he considered that discipline was slipping and that reports were suffering from laziness. But these were men he had served with, men who had earned their place with diligence and hard work. The thought that even one, let alone all of them, had begun to neglect their duty did not sit right with him. \n\nA darker thought began to form in his head, and he placed a call to the head of the Abwehr and waited for him to pick up. \n\nHours later, he was poring over intelligence reports, and he now knew why the quality of the reports had slipped so much. The Reichsprotektors had all been engaging in extracurricular activities, as it happened. They had been meeting with fellow officers, politicians, and other assorted notables. \n\nTo what end? He considered letting the Abwehr handle the investigation for him, but this required direct action. The Reich could not afford to suffer more political instability. He turned to his telephone once more and began dialing. He had many more calls to make."
 GER_speidel_fuhrer_pol.1.a:0 "Never A Dull Day"
 GER_speidel_fuhrer_pol.2.t:0 "Old Fox"
 GER_speidel_fuhrer_pol.2.d:0 "\n\n“Rommel.” \n\n“Speidel.” \n\nSpeidel didn’t bother with pleasantries. When you were in the Heer together for decades, formal greetings and manners tended to fall by the wayside. \n\n“You’ve been meeting with officers of the Wehrmacht every moment you can. Many of these are outside your chain of command. Last week, you—” \n\n“Speidel.” \n\n“—met with Admiral Dönitz. Rommel, what are you planning?” \n\nThere was silence on the other end of the line before his former superior spoke again. \n\n“I believe you should be Führer.” \n\nSpeidel was not expecting this. “What?” \n\n“Speidel, did you really think you could be just General Speidel forever? This provisional government has dragged on for years now, and people are growing restless. I trust you, but others don’t. You need to show them you’re willing to take the reins and hold them.” \n\n“I have no intention of staying in charge. In a few short years, I will step down and allow a civilian to become Führer.” \n\nSpeidel swore he could hear Rommel’s half-smile through the phone. “I’m afraid, Hans, that you have run out of time for that. I will say this,” and there was a slight pause before he continued, “If you order me to do so, I will cease my activities immediately.” \n\nSpeidel considered. He could order Rommel to cease, as was his right, but he could also turn a blind eye. He was suddenly at a crossroads. Should he play the neutral and loyal general, or should he give in to the lust for power? Was the latter something he even wanted?"
 GER_speidel_fuhrer_pol.2.a:0 ""That's Alright General, You May Continue""
 GER_speidel_fuhrer_pol.2.b:0 ""Yes General, You Will Cease""
 GER_speidel_fuhrer_pol.3.t:0 "Wagner's Play"
 GER_speidel_fuhrer_pol.3.d:0 "“Wagner.” \n\n“General Speidel.” \n\nWagner’s tone was formal, if strained. Maybe from exhaustion, or perhaps something else. Speidel couldn’t deny the man had been critical in the overthrow of Schörner, but therein lay the problem. Wagner had once been Schörner’s right-hand man and then turned on him. Who’s to say he would not turn on Speidel? \n\n“I will cut to the chase: do you intend to become Führer?” \n\nTo Speidel’s surprise, Wagner started laughing. “Me? Führer...?” He laughed some more. “No. I am afraid that is not it, General Speidel. That’s not it at all.” \n\nSpeidel found himself becoming unusually frustrated. “Then what is it? Speak! I will not suffer petty word games.” \n\n“Very well, then. When you step down—which you may have to do soon—I believe General Claus von Stauffenberg should step up and assume the office of Führer.” \n\nOnce again, Speidel was taken aback. Claus was a longtime comrade, a friend even, but how he had managed to gain Wagner’s favor was beyond him. “Does Clau—General Stauffenberg share your beliefs?” \n\n“He is... reluctant to act in a way that he believes is against your wishes. But certainly you don’t deny that he is a man of rare quality. Speak to him at least—” Wagner paused before adding, “We both know he won’t disappoint.”"
 GER_speidel_fuhrer_pol.3.a:0 ""I Will Consider It""
 GER_speidel_fuhrer_pol.3.b:0 ""Another Time, Refocus Your Efforts On Serving The Reich""
 GER_speidel_fuhrer_pol.4.t:0 "About Hans..."
 GER_speidel_fuhrer_pol.4.d:0 "“Schwerin.” \n\n“Heil.” \n\n“Explain your association with Hans-Ulrich Rudel.” \n\nSchwerin did not respond for some time, and Speidel thought for a moment that the general had simply left. Then came the response. \n\n“We served together, and I would consider Hans a friend, and he would say the same of me.” \n\n“Your friend is very—shall we say—politically active.” \n\nSchwerin sighed, “Are you accusing me of sedition, Speidel?” Speidel’s own political adventures went unmentioned. \n\n“No. And I would like to keep it that way. No, I would like to know what you want. What he wants.” \n\n“He wishes to become Führer, General. He asked for my support, and I agreed to help him.” \n\nAt least he gave a straight answer, Speidel thought, and gave his answer."
 GER_speidel_fuhrer_pol.4.a:0 ""Thank You For Your Honesty, That Is All""
 GER_speidel_fuhrer_pol.4.b:0 ""Thank You For Your Honesty, You Will Cease Immediately""
 GER_speidel_fuhrer_pol.5.t:0 "Labour Of Blood"
 GER_speidel_fuhrer_pol.5.d:0 "“Baudissin.” \n\n“General.” \n\n“You have been engaging in—” \n\n“Unauthorized political activities,” Baudissin finished for him, “now, technically, we aren’t strictly prohibited from this, but if you directly order it so, I will halt my current efforts.” \n\nSpeidel blinked. Baudissin was surprisingly straightforward. “What are your intentions, General Baudissin?” he asked. \n\n“To see Horst Mahler, current leader of the DAF, installed as Führer.” \n\nSpeidel thought for a moment."
 GER_speidel_fuhrer_pol.5.a:0 ""So Be It""
 GER_speidel_fuhrer_pol.5.b:0 ""You Will Halt Your Activites In Regard To This, General""
 GER_speidel_fuhrer_pol.6.t:0 "An Interesting Detail"
 GER_speidel_fuhrer_pol.6.d:0 "“Heusinger.” \n\n“All is well, General?” \n\nThe question was a curious one. General Heusinger was kept well informed of the Reich’s happenings, as befitted his station. It seemed he already knew what Speidel was going to say. \n\nSpeidel said it anyway, “It has come to my attention that you are a political ally of Alfred Rosenberg.” \n\n“I do not deny the accusation, General Speidel.” \n\n“Then what is he planning, Heusinger? And what are you planning? I never knew you to be an admirer of Rosenberg.” \n\n“We owe much to him,” Heusinger replied, “and I believe his ideals will lead to a brighter future for the Volk. I have held that belief for many long years.” \n\n“So now that you have the opportunity, you support his designs?” \n\n“That is correct. Do what you will.” \n\nHeusinger was being unusually undiplomatic, Speidel thought, and he gave his answer."
 GER_speidel_fuhrer_pol.6.a:0 ""I See.""
 GER_speidel_fuhrer_pol.6.b:0 ""Stop This Nonsense""
 GER_speidel_fuhrer_pol.7.t:0 "Bormann's Time"
 GER_speidel_fuhrer_pol.7.d:0 "“Bormann.” \n\nSilence. \n\n“Bormann.” \n\nMore silence. \n\n“BORMANN.” \n\n“Apologies, General,” a feminine voice replied. “Herr Bormann is out on important business. I am his secretary, Ana—” \n\n“I don’t care if he claims to be on the Moon. Call him over here NOW.” He barked at her like she was a freshly recruited Soldat. \n\nIt worked. “I will attempt to contact him with all due haste,” she said nervously. “However, it may take some time. Would you like to hold? Or perhaps Herr Bormann can call you back when he—” \n\n“He will call me with all due haste.” Speidel hung up. \n\nSpeidel sat back. The number he dialed was a secure direct line to Bormann’s desk. If Bormann was truly out, then Speidel would have been left with dead air. Ergo, the bastard was probably lounging in his office right this second. \n\nBormann was a professional—nobody could deny that—but he wasn’t a military man like his fellow Reichsprotektors. He was no Martin, but he still shared his brother’s talent for wordplay and obfuscation. \n\nSpeidel looked at the phone. Albert Bormann would call, but Speidel doubted he would get anything useful out of the man."
 GER_speidel_fuhrer_pol.7.a:0 "And He Was Right"
 GER_speidel_fuhrer_pol.8.t:0 "Facing The Inevitable"
 GER_speidel_fuhrer_pol.8.d:0 "Speidel really didn’t expect to continue the provisional military regime forever. He didn’t want to, in fact. \n\nBut he did not desire to end the current state of the Reich so soon. Alas, his hand was forced, and he would have to make arrangements to appoint a new Führer soon. Otherwise, Speidel risked further political upheaval, and that was the last thing the Fatherland needed. \n\nArrangements would have to be made. The Wehrmacht and the remains of the NSDAP had to meet to decide the fate of Germany."
 GER_speidel_fuhrer_pol.8.a:0 "Who Will Be Fuhrer?"
 GER_speidel_fuhrer_pol.9.t:0 "Where To?"
 GER_speidel_fuhrer_pol.9.d:0 "Now, the most obvious location to deliberate and appoint a new Führer would be Germania. It is the capital of the sole and pure Reich, but an alternative has wormed its way into the ranks of the Wehrmacht. \n\nMoscow has been proposed as an alternative site. While unconventional, it is argued that holding such a critical gathering in the east will send a powerful message to the Slavs and project our superiority over them. The fact that this would also benefit the Reichsprotektor of Moskowien, [MCW.GetLeader], is surely a coincidence."
 GER_speidel_fuhrer_pol.9.a:0 "Germania, Where Else?"
 GER_speidel_fuhrer_pol.9.b:0 "Moscow It Is"
 GER_speidel_fuhrer_pol.10.t:0 "Broadcast Rights"
 GER_speidel_fuhrer_pol.10.d:0 "Another point of contention has arisen with regard to our committee arrangements. Some propose that at least part of the proceedings be broadcast to the German people so that they may hear and witness this momentous occasion firsthand. \n\nSome support this, while others oppose it. Notably, such an approach would likely benefit those who are more adept at media appearances."
 GER_speidel_fuhrer_pol.10.a:0 "The Master Race Shall Hear!"
 GER_speidel_fuhrer_pol.10.b:0 "This Isn't A Circus"
 GER_speidel_fuhrer_pol.11.t:0 "Last Minute Changes"
 GER_speidel_fuhrer_pol.11.d:0 "The fateful day approaches, and everyone is scrambling to ensure everything proceeds smoothly. \n\nEven now, meetings must be held and support secured; the handshakes and exchanges of favors continue. \n\nYet who will make the most of these last precious moments? That will become apparent only when the next Fuhrer is chosen. \n\nMay the best man win."
 GER_speidel_fuhrer_pol.11.a:0 ""I Fight For Germany Even Now""
 GER_speidel_fuhrer_pol.11.b:0 ""Speidel Can't Win""
 GER_speidel_fuhrer_pol.11.c:0 ""For A Brother, Anything""
 GER_speidel_fuhrer_pol.11.e:0 ""The Aryan Worker Will Breathe Free""
 GER_speidel_fuhrer_pol.11.f:0 ""All Will Be Made Right""
 GER_speidel_fuhrer_pol.11.g:0 ""Time To Get To Work""
 GER_speidel_fuhrer_pol.12.t:0 "Speidel's Victory"
 GER_speidel_fuhrer_pol.12.d:0 "So it had come to this. \n\nHans Speidel had found himself the Führer of the entire Reich. His fellow officers offered their congratulations, but one stood out from the rest. \n\n“You will do well, mein Führer,” was the first thing Rommel said to him after Speidel’s appointment. \n\n“It is not an office I ever aspired to.” \n\nRommel gave a small smile. “We do what we must. Circumstances often force our hand. If the history of the Reich has proven anything, the greatest of men are the ones who take up the sword only when they are forced to do so.” \n\n“I hope, for all our sakes, you are right.” And he disappeared into the crowd."
 GER_speidel_fuhrer_pol.12.a:0 "Service Requires Strength"
 GER_speidel_fuhrer_pol.13.t:0 "Long Time"
 GER_speidel_fuhrer_pol.13.d:0 "Congratulations and well wishes came from all sides. Claus von Stauffenberg found himself practically encircled by adulation. He smiled and shook hands with his supporters. \n\nBut, in truth, he knew that his work had only just begun. \n\nHis agenda... his true agenda. The road would be long and hard. He knew that it would betray the wishes of some of his most ardent allies, but it was a road he had to travel nonetheless. \n\nFor he knew, better than anyone else here, that the Reich needed to change. \n\nTo change into something better. \n\nIt was then that von Stauffenberg made a silent vow. \n\nTo make the Reich worthy of God’s favor."
 GER_speidel_fuhrer_pol.13.a:0 "It Will Be Yours"
 GER_speidel_fuhrer_pol.14.t:0 "What You Wanted"
 GER_speidel_fuhrer_pol.14.d:0 "Hans-Ulrich Rudel was grinning from ear to ear. \n\nNever in his wildest dreams had he believed this would happen, and yet it did. Old Schwerin had come through for him and had greased the wheels so thoroughly that Rudel practically slid into the office of the Führer. \n\nHe would have to reward him later, though the dour Heer General would probably refuse most of his gifts. \n\n“Ah, a problem for later,” he thought to himself before turning to the crowd that had gathered before him. \n\n“A toast!” he boomed."
 GER_speidel_fuhrer_pol.14.a:0 ""To National Socialism!""
 GER_speidel_fuhrer_pol.15.t:0 "Will Of The Volk"
 GER_speidel_fuhrer_pol.15.d:0 "After the decision became known, Horst Mahler wasted no time. \n\nHe stayed the bare minimum amount of time to receive congratulations from Wehrmacht officers and shake hands with the politically ingratiated before leaving for where he truly wanted to be. \n\nHe drove to a nearby factory staffed only by true Aryans. There he was greeted by his racial brothers, not as the leader of the Deutsche Arbeitsfront, but as the Führer of the entire Reich. \n\n“A new era has begun!” he promised them. “No longer will the German people slave for the degenerate bourgeoisie! Nor for Prussian tinpot imperialists! Nor for foreign barbarians and witless bureaucrats!” \n\n“In the cities and in the countryside, all Germans shall be freed!”"
 GER_speidel_fuhrer_pol.15.a:0 "Blood Of The People"
 GER_speidel_fuhrer_pol.16.t:0 "A Theory In Practice"
 GER_speidel_fuhrer_pol.16.d:0 "Perhaps this was fate. \n\nAlfred Rosenberg had been one of the early members of the NSDAP, then simply the German Workers' Party. Joining at the beginning of 1919, he was inspired by Adolf Hitler’s speeches. Combining them with his own previous studies and influences, he began to formulate ideological theories around them and helped establish the bedrock of National Socialist ideology. \n\nHis work had won him favor, and he was appointed Reich Minister for the Occupied Eastern Territories. And yet, he soon found himself subverted. His ideas were ignored, having fallen out of the mainstream, and when the Reich had finished slaying the monstrous Soviet Union, he found himself sent to Ukraine to serve under his former subordinate. Yet, he persisted. And now he was the Führer. \n\nIt is a shame that many of his fellow old NSDAP members did not live to see this day."
 GER_speidel_fuhrer_pol.16.a:0 "Alas, They Had Killed One Another"
 GER_speidel_fuhrer_pol.17.t:0 "Bormann Wins"
 GER_speidel_fuhrer_pol.17.d:0 "Now you are curious. You have every right to be. I can hear you now asking, “Herr Bormann, why did you want to become Führer?” Well, I will tell you. I have spent the last several decades surrounded by idiots. I do not know how the late Führer Hitler managed to tolerate all of them. A testament to his iron will, perhaps. \n\nWhere was I? Ah yes, the idiots. There are many great men in the Reich, supermen it could be claimed. And yet, there are an equal number of fools, if they are not in the majority. \n\nThe trouble is, they imitate intelligence and deceive the gifted into believing they are peers. I was susceptible to this deception myself. I had great faith in Hermann Göring, but he, too, was a fool. And the less said about Schörner, the better. \n\nBut I have had time to consider and learn from their mistakes and my own. So I promise you this: Not wild visions of world conquest or of cities reaching into outer space, but a simple promise. I will leave the Reich better than when I found it."
 GER_speidel_fuhrer_pol.17.a:0 "I Can Promise You That"

 #focuses
 GER_to_save_a_reich:0 "To Save A Reich"
 GER_to_save_a_reich_desc:0 "Goering and Schoerner have nearly led the Reich to ruin! But thanks to Speidel, we now have a chance to return Germany to a sense of normalcy."
 GER_subjugate_dutch:0 "Subjugate Niederlande"
 GER_subjugate_dutch_desc:0 "Niederlande has slipped from our grasp and must be returned to order."
 GER_subjugate_denmark:0 "Subjugate Denmark"
 GER_subjugate_denmark_desc:0 "The Danish Straits are far too important to give up without a struggle. We must brink Denmark back into the sphere."
 GER_restore_the_pakt:0 "Restore The Pakt"
 GER_restore_the_pakt_desc:0 "The east has fallen outside our control. This presents a problem for defense of the Reich against potential enemies from the East. We must retake control of our eastern territories before we find invaders right on our doorstep."
 GER_reorganize_poland:0 "Reorganize Poland"
 GER_reorganize_poland_desc:0 "The Generalgouvernement was poorly managed and was never properly integrated into the Reich as a result. We will establish a Protektorat in Poland instead."
 GER_reorganize_ostland:0 "From Ostland To Baltenland"
 GER_reorganize_ostland_desc:0 "The “Model Colony” fell into chaos much like Germany proper. We will reorganize it into a Protektorat. \n\nIt also has ben decided that Ostland be renamed to Baltenland. A suggestion from Rosenberg, who has recently returned to Germania. Hopefully this will please the Balts."
 GER_the_reichs_breadbasket:0 "The Reich's Breadbasket"
 GER_the_reichs_breadbasket_desc:0 "Ukraine historically provides a large proportion of the Reich’s agricultural imports. It is necessary to return to this status quo, as we risk starvation otherwise."
 GER_a_protektor_of_ukraine:0 "Assign A Protektor To Ukraine"
 GER_a_protektor_of_ukraine_desc:0 "A Protektor will be assigned to the new Reichsprotektorat in Ukraine."
 GER_the_reichs_petrol_station:0 "The Reich's Petrol Station"
 GER_the_reichs_petrol_station_desc:0 "A strategically important region, Kaukasia also provides much of the Reich’s oil supply, both crude and refined."
 GER_a_protektor_of_kaukasia:0 "Assign A Protektor To Kaukasia"
 GER_a_protektor_of_kaukasia_desc:0 "A Protektor will be assigned to the new Reichsprotektorat in Kaukasia."
 GER_the_reichs_backyard:0 "The Reich's Backyard"
 GER_the_reichs_backyard_desc:0 "Moskowien is by far the least developed and least integrated of all the Reich’s eastern holdings. While dreams of total colonization by German settlers have more or less fallen to the wayside, it does act as a crucial buffer between the Reich’s richer territories and the chaotic Russian and Kazakh warlords."
 GER_a_protektor_of_muscowien:0 "Assign A Protektor To Moskowien"
 GER_a_protektor_of_muscowien_desc:0 "A Protektor will be assigned to the new Reichsprotektorat in Moskowien."
 GER_the_crimeas_fate:0 "The Crimea's Fate"
 GER_the_crimeas_fate_desc:0 "Crimea has been directly ruled by Germania, but it might be more efficient to place it under one of the neighboring Reichsprotektorats."
 GER_the_east_is_ours:0 "The East Is Ours"
 GER_the_east_is_ours_desc:0 "Through blood and will we have reestablished full control over the eastern Reich! The Pakt stands strong once more!"
 GER_a_saner_economy:0 "A Saner Economy"
 GER_a_saner_economy_desc:0 "Goering’s idea of an economy was essentially an eternal war economy which could only be fueled by regular and perpetual conquests. This, obviously, was unsustainable. \n\nWe will undertake a program of economic restructuring, to ensure the Reich is backed up by a healthy economy."
 GER_an_understanding_with_the_megacorps:0 "An Understanding With The Conglomerates"
 GER_an_understanding_with_the_megacorps_desc:0 "The industrial conglomerates that dominate the Reich’s industry are far too important to simply dismantle and sweep aside. Regardless, we do need to implement economic reforms. Hence, we will approach these conglomerates and offer a compromise that will please everyone. The conglomerates will help implement the necessary changes, and we will allow them to continue to operate unassailed."
 GER_leave_it_to_the_economists:0 "Leave It To The Economists"
 GER_leave_it_to_the_economists_desc:0 "A general’s realm is war, not pencil pushing. There are plenty of bright young economists in the Reich, we should give them a chance to make a change."
 GER_but_dont_forget_the_wehrmacht:0 "But Don't Forget The Wehrmacht"
 GER_but_dont_forget_the_wehrmacht_desc:0 "Of course, the Wehrmacht should receive its due share of material and equipment. Without us there would be no Reich, so it’s only fair."
 GER_the_cities_of_fatherland:0 "The Cities Of The Fatherland"
 GER_the_cities_of_fatherland_desc:0 "The urban centers of the Reich were some of the most industrious in the world, but recent decades have left them in decay. Revitalizing the cities will be crucial to economic recovery."
 GER_a_main_port_for_the_kriegsmarine:0 "A Primary Port?"
 GER_a_main_port_for_the_kriegsmarine_desc:0 "We will select one city to be our primary naval base and dockyard in the Baltic and Atlantic and will invest appropriate resources into said city."
 GER_choose_bremen:0 "Choose Wilhelmshaven"
 GER_choose_bremen_desc:0 "Wilhelmshaven has longed served as our primary military port in the Atlantic. The Kriegsmarine deserves it’s port to be in top shape. Ship shape as it were."
 GER_choose_hamburg:0 "Choose Hamburg"
 GER_choose_hamburg_desc:0 "Hamburg has been an important trade hub and shipyard for many centuries now and must receive the lions share of investments."
 GER_choose_konigsberg:0 "Choose Konigsberg"
 GER_choose_konigsberg_desc:0 "Traditionally Germany’s primary port in the Baltic Sea, the Baltic has essentially been an internal sea for Germany for over two decades now. While some argue this lessens its importance, we cannot discount the possibility that a resurgent Soviet Union, or something to that effect, might make territorial gains and gain access to the Baltic Sea. We cannot discount this possibility. "
 GER_build_the_others_as_well:0 "Rebuild The Other Ports"
 GER_build_the_others_as_well_desc:0 "Though we have focused our resources on one port, the others should receive investment as well."
 GER_focus_on_germania:0 "Focus On Germania"
 GER_focus_on_germania_desc:0 "Germania is the capital of Germany and the finest city in the world! Though it has suffered stagnation, we can revitalize it and bring it to the glory it deserves!"
 GER_expand_the_suburbs:0 "Expand The Suburbs"
 GER_expand_the_suburbs_desc:0 "The construction of Germania’s suburbs stalled during the economic chaos Germany suffered following the Second World War. Many houses were left unfinished and rotting. The city proper is becoming overcrowded, and finishing the abandoned suburb project will alleviate that immensely, and give middle class Germans an attractive place to live."
 GER_ubahn_sbahn:0 "U-bahn, S-bahn"
 GER_ubahn_sbahn_desc:0 "The rapid transit networks of Germania functioned well before Berlin became Germania. However, the U-Bahn and S-Bahn have lagged behind the city’s growth. New lines and stations must be opened."
 GER_viennas_beauty:0 "Vienna's Beauty"
 GER_viennas_beauty_desc:0 "Located in the South of the Reich, Vienna is a marvel of architectural beauty and intellectual prowess. We will divert funds towards its expansion."
 GER_fund_the_unis:0 "Fund The Universities"
 GER_fund_the_unis_desc:0 "The universities of Vienna will help keep Germany ahead in the technological arms race."
 GER_high_speed_rail:0 "Return To The High Speed Rail Concept"
 GER_high_speed_rail_desc:0 "The Flying Hamburger was an astonishingly fast train and was the herald of a new era of high speed trains across the Reich. Alas, the development of high speed rail was halted by the onset of war, but we now finally have the opportunity to revive the concept."
 GER_buildup_munich:0 "Buildup Munich"
 GER_buildup_munich_desc:0 "The birthplace of the NSDAP, Munich holds many critical government offices and is one of the top cultural and administrative centers in the Reich."
 GER_the_newest_german_city:0 "The Newest German City"
 GER_the_newest_german_city_desc:0 "Bohemia has finally been integrated into the Reich proper, and with it comes it’s primary city of Prague."
 GER_a_monument_to_hitler:0 "A Monument To Hitler"
 GER_a_monument_to_hitler_desc:0 "A memorial to the first and greatest Fuhrer will be raised. Without him, the masterrace would have surely perished!"
 GER_a_monument_to_the_fallen:0 "A Monument To The Fallen"
 GER_a_monument_to_the_fallen_desc:0 "A memorial to the lost soldiers during the Second World War. Without their sacrifice, the Reich would have fallen long ago."
 GER_revive_the_labor_front:0 "Revive The Labor Front"
 GER_revive_the_labor_front_desc:0 "Dissolved during the economic crash of the 50s, the Deutsche Arbeitsfront will be restored and once again represent the needs of the German worker."
 GER_cut_excess_spending:0 "Cut Excess Spending"
 GER_cut_excess_spending_desc:0 "Goering’s tenure as Fuhrer as caused the national budget to bloat to a ridiculous size. Useless expenditures must be eliminated."
 GER_burning_regulations:0 "Burn The Red Tape"
 GER_burning_regulations_desc:0 "Too much regulation, and not enough work!"
 GER_a_new_ruhr_boom:0 "A New Ruhr Boom"
 GER_a_new_ruhr_boom_desc:0 "The Ruhr once again roars with the sounds of machines and men. Here we will see the beginning of a new industrial revival in Germany!"
 GER_our_hand_in_the_pie:0 "Our Hand In The Pie"
 GER_our_hand_in_the_pie_desc:0 "The Wehrmacht needs guaranteed access to manufactured goods. Capricious contracts will not be tolerated. What we need will be made and will be taken."
 GER_expand_the_autobahn:0 "Expand The Autobahn"
 GER_expand_the_autobahn_desc:0 "Useful for both civilian and military uses, the Autobahn is a critical piece of infrastructure."
 GER_phase_out_slavery:0 "Phase Out Slavery"
 GER_phase_out_slavery_desc:0 "The utilization of subhumans as slave labor in the Reich has been a chain dragging us down. Productivity has collapsed and wages have been depressed for the poorest Aryans. We need to start making efforts to end slavery within the Reich as soon as possible. \n\nWe cannot instantly transition the economy overnight, especially with the conglomerates at our side, so this will take some time."
 GER_a_nod_to_the_civil_sector:0 "A Nod To The Civil Sector"
 GER_a_nod_to_the_civil_sector_desc:0 "As important as the military is, civilian needs and consumer goods still have their place."
 GER_security_and_prosperity:0 "Security And Prosperity"
 GER_security_and_prosperity_desc:0 "The military will take priority in economic matters."
 GER_prosperity_and_security:0 "Prosperity And Security"
 GER_prosperity_and_security_desc:0 "All will have their fair share of the Reich’s wealth."
 GER_nationalise_key_industries:0 "Nationalize Key Industries"
 GER_nationalise_key_industries_desc:0 "Though the conglomerates may wine and moan, it is a simple fact that the certain industries are of immense strategic value and must be controlled by the state directly. We cannot risk the safety of the Reich needlessly."
 GER_the_volks_economy:0 "The Volk's Economy"
 GER_the_volks_economy_desc:0 "Finally, the economy has been reformed into something worthwhile."
 GER_corpocratic_ideal:0 "Chasing The Corpocratic Ideal"
 GER_corpocratic_ideal_desc:0 "The state, the workers, and the businesses work together or not at all!"
 GER_pride_of_the_reich:0 "Pride Of The Reich"
 GER_pride_of_the_reich_desc:0 "Where would the Reich be without its brave Wehrmacht to defend it? It must be given its due attention."
 GER_soldiers_of_the_fatherland:0 "The Fatherland's Soldiers"
 GER_soldiers_of_the_fatherland_desc:0 "Weapons are only as good as the men who wield them."
 GER_whip_them_into_shape:0 "Whip Them Into Shape"
 GER_whip_them_into_shape_desc:0 "Discipline has slipped under Goering’s tenure. We must correct this at once!"
 GER_cut_the_chaff:0 "Cut The Chaff"
 GER_cut_the_chaff_desc:0 "The Heer has grown bloated with subpar troops and officers. We must remove these dregs from the Heer at once."
 GER_pure_force:0 "A Pure Force"
 GER_pure_force_desc:0 "The Heer must be pure and strong!"
 GER_the_ingenuity_of_german_engineering:0 "The Ingenuity Of German Engineering"
 GER_the_ingenuity_of_german_engineering_desc:0 "Greatest in the world."
 GER_update_the_panzer:0 "Update The Panzer"
 GER_update_the_panzer_desc:0 "Panzers have been the workhorse of the Heer for the decades. As technology continues to evolve, we must make sure our Panzer fleet remains up to date and cutting edge."
 GER_develop_the_marder:0 "Develop The Marder"
 GER_develop_the_marder_desc:0 "The Marder has been proposed as a new light armored vehicle for the Heer. Possessing a 20mm cannon and able to carry up to six infantrymen, it could prove useful in potential conflicts in the future."
 GER_like_lightning:0 "Like Lightning"
 GER_like_lightning_desc:0 "Blitzkrieg never fails."
 GER_polish_up_the_heer:0 "Polish Up The Heer"
 GER_polish_up_the_heer_desc:0 "Keep it clean, keep it strong."
 GER_organizational_restructuring:0 "Partial Organizational Restructuring"
 GER_organizational_restructuring_desc:0 "The Wehrmacht’s institutional disorder must end."
 GER_phase_out_volksgrenediers:0 "Phase Out The Volksgrenediers"
 GER_phase_out_volksgrenediers_desc:0 "An ad hoc formation created during the West Russian War, there is hardly any need for the Volksgrenediers any longer. They will either be formed into proper Grenedier divisions or folded into others."
 GER_clarify_protektor_roles:0 "Clarify The Role Of The Protektors"
 GER_clarify_protektor_roles_desc:0 "The Reichsprotektors will retain control of Heer units raised in or assigned to their respective Reichsprotektorats. Germania will retain control of its own units wherever it pleases and will have ultimate strategic authority."
 GER_diverisfy_tactics:0 "Diversify Tactics"
 GER_diverisfy_tactics_desc:0 "We will need to keep our tactics flexible and ready for all contingencies. We will be ready for the Enemy, no matter what form it takes."
 GER_recruitment_propaganda:0 "Play Up The Recruitment Propaganda"
 GER_recruitment_propaganda_desc:0 "Don’t be overcome with fear, join the Heer!"
 GER_helicoptor_divisions:0 "Form New Helicopter Divisions"
 GER_helicoptor_divisions_desc:0 "As proven by the South Africa War, helicopters can provide unparalleled transport for infantry. We'd be fools not to use them."
 GER_mobile_arty:0 "Prioritize Mobile Artillery"
 GER_mobile_arty_desc:0 "While difficult to use in mountains and hills, artillery on trucks or tanks can be used to great effect in flatlands. The plains of Muskowien come to mind."
 GER_the_kriegsmarine_sets_out:0 "The Kriegsmarine Sets Out"
 GER_the_kriegsmarine_sets_out_desc:0 "Underappreciated, though no less fierce, the Kriegsmarine has served well for many years. They truly embody the Aryan spirit of defiance."
 GER_challenge_japan_and_america:0 "Challenge Japan And America"
 GER_challenge_japan_and_america_desc:0 "The Americans and Japanese possess large surface fleets which regrettably are far larger than our own. If we are going to compete with them on a global scale, the Kriegsmarine must be expanded to match."
 GER_carrier_modernization:0 "Carrier Modernization"
 GER_carrier_modernization_desc:0 "Our Carrier’s are lagging behind in terms of technological advancement. This will have to change for our dreams of a global navy to manifest."
 GER_tool_up_the_ports:0 "Tool Up The Ports"
 GER_tool_up_the_ports_desc:0 "The shipyards need to be readied for mass production."
 GER_escort_designs:0 "Improve Escort Ship Designs"
 GER_escort_designs_desc:0 "Our capital ships need destroyers and frigates to protect them from submarines and aircraft. \n\nObviously."
 GER_above_and_below:0 "Improve Naval Coordination"
 GER_above_and_below_desc:0 "Improved tactics and radio technology allow for greater control over fleets."
 GER_finally_a_modern_navy:0 "Finally A Modern Navy"
 GER_finally_a_modern_navy_desc:0 "At last we have finally started making strides towards creating a naval force that can challange both the IJN and USN!"
 GER_our_own_way:0 "Our Own Way"
 GER_our_own_way_desc:0 "A surface fleet is nothing but fodder for aircraft and missiles. Modern submarines are incredibly versatile, why not build up our navy with them at the forefront?"
 GER_uboat_hull_upgrades:0 "U-boat Hull Upgrades"
 GER_uboat_hull_upgrades_desc:0 "Our U-Boat hull designs could use some further refinement."
 GER_nuke_subs_on_the_prowel:0 "Nuke Subs On The Prowel"
 GER_nuke_subs_on_the_prowel_desc:0 "While currently only used in limited amounts in the Kriegsmarine, nuclear submarines do hold a distinct advantage over conventional submarines with their exponentially better range and operating time between refueling."
 GER_improved_safety_procedures:0 "Improved Safety Procedures"
 GER_improved_safety_procedures_desc:0 "U-boats are traditionally viewed as death traps by the sailors of the Kriegsmarine. \n\n...Admittedly they aren’t exactly wrong. We can rectify this and implement measures to protect the crew in case of catastrophic damage. Preserving the lives of experienced sailors will make this well worth it."
 GER_study_ww_two:0 "Lessons From The Second World War"
 GER_study_ww_two_desc:0 "Our struggle against the degenerates taught us much about submarine warfare."
 GER_they_will_never_see_it_coming:0 "They Will Never See It Coming"
 GER_they_will_never_see_it_coming_desc:0 "Silent but deadly."
 GER_donitz_vindicated:0 "Donitz Vindicated"
 GER_donitz_vindicated_desc:0 "Admiral Donitz always insisted on the usefulness of u-boats. His dedication to undersea warfare has allowed Germany to win victory after victory. Why cease to follow his example, when it has only brought us glory?"
 GER_goerings_pride:0 "Goering's Pride"
 GER_goerings_pride_desc:0 "As the former chief of the Luftwaffe, Goering was always quick to put the air force first when it came to matters of budget and pride. \n\nAs such the Luftwaffe have somehow added to their overinflated egos. But regardless we will have to deal with them whether we like it or not."
 GER_bring_them_back_to_earth:0 "Bring Them Back To Earth"
 GER_bring_them_back_to_earth_desc:0 "These days, the Luftwaffe is filled with glory hounds and overpromoted stooges with more medals than brain matter. It is paramount that we start reeling in this nonsense before we can begin improving the situation."
 GER_cooperate_with_other_branches:0 "Encourage Cooperation With Other Branches"
 GER_cooperate_with_other_branches_desc:0 "The Luftwaffe think they can win wars all by themselves. A war being won solely by aircraft only exists in children’s books. We need to get them to properly cooperate with the Heer and Kriegsmarine."
 GER_new_blood_in_the_skies:0 "New Blood In The Skies"
 GER_new_blood_in_the_skies_desc:0 "There is plenty of young talent waiting for their shot to prove themselves as excellent pilots. It is time for the old to give way to the new!"
 GER_total_air_domination:0 "Total Air Domination"
 GER_total_air_domination_desc:0 "Total nullification of the enemy's aerial forces would grant us a distinct advantage."
 GER_new_light_planes:0 "New Light Aircraft Designs"
 GER_new_light_planes_desc:0 "Fixed winged fighters, interceptors, and ground attack aircraft are the hallmark of any self-respecting air force. Maintaining our technological prowess in this area is critical."
 GER_intercept_and_destroy:0 "Intercept And Destroy"
 GER_intercept_and_destroy_desc:0 "Interceptors can nullify bombers and cruise missiles before they can damage anything. They will be critical for protecting our ground and sea assets."
 GER_never_rest:0 "Around The Clock"
 GER_never_rest_desc:0 "Pilots must be ready to scramble at any hour. There is no break time in the Luftwaffe! (Except when there is.)"
 GER_the_finest_radar:0 "The Finest Radar"
 GER_the_finest_radar_desc:0 "Better radar will let us see the enemy before they see us. This gives us a distinct advantage in initiative."
 GER_an_air_empire_at_home:0 "An Air Empire At Home"
 GER_an_air_empire_at_home_desc:0 "Sudwestafrika earned the name The Air Empire for its impressive aerial force. We need not let that designation die! Germania rules the skies!"
 GER_bombs_away:0 "Bombs Away!"
 GER_bombs_away_desc:0 "Tear them to shreds!"
 GER_targeting_systems:0 "Improved Targeting Systems"
 GER_targeting_systems_desc:0 "More precise targeting will allow us to hit the targets we want more often."
 GER_invisible_bombers:0 "Invisible Bombers?"
 GER_invisible_bombers_desc:0 "A few engineers have submitted proposals for a so-called “Invisible Bomber.” While not literally invisible, the proposed bomber would be able absorb radar waves, making detection difficult for air and surfaced based defenses."
 GER_flatten_them:0 "Flatten Our Enemies"
 GER_flatten_them_desc:0 "Leave none alive!"
 GER_watch_and_learn:0 "Watch And Learn!"
 GER_watch_and_learn_desc:0 "Our novice pilots must learn from the veterans. It takes more than reading to learn how to run a Bomber."
 GER_trouble_brewing:0 "Trouble Brewing"
 GER_trouble_brewing_desc:0 "The Reichsprotektors have started jostling for influence within the Reich’s government. Technically, Speidel is still provisionally in charge, and many within our ranks seek to end his tenure. This situation must be resolved with all due haste."
 GER_call_rommel:0 "Call Rommel"
 GER_call_rommel_desc:0 "Rommel has served the German Reich for many decades now. Though he is within his twilight years, he can still exercise some influence over the Wehrmacht."
 GER_clean_up_remaining_nutters:0 "Clean Up The Remaining Madmen"
 GER_clean_up_remaining_nutters_desc:0 ""
 GER_call_up_the_rest:0 "Call The Rest"
 GER_call_up_the_rest_desc:0 "We must know the intentions of the Reichsprotektors"
 GER_the_quartermaster:0 "The Quartermaster"
 GER_the_quartermaster_desc:0 "Wagner was critical in the overthrow of Schoerner but therein lies the problem. He was one of Schoerner’s top supporters, but can he be trusted now?"
 GER_the_panzer_leader:0 "The Panzer Leader"
 GER_the_panzer_leader_desc:0 "Schwerin is a long time ally of Speidel's, but can he be trusted?"
 GER_the_planner:0 "The Planner"
 GER_the_planner_desc:0 "Baudissin seems to be more politically active then we first believed."
 GER_the_operations_chief:0 "The Operations Chief"
 GER_the_operations_chief_desc:0 "Heusinger has always seemed the most pragmatic of the bunch, but does he have a hidden agenda?"
 GER_and_bormann:0 "And Bormann"
 GER_and_bormann_desc:0 "Not really a military man, so much as a career secretary, Bormann has nonetheless become an important part of the administration. He’s been historically unambitious, but something seems to have changed recently."
 GER_who_do_they_want:0 "What Do They Want?"
 GER_who_do_they_want_desc:0 "It's time to discover the intentions of the Reichsprotektors."
 GER_plan_the_meeting:0 "Plan The Meeting"
 GER_plan_the_meeting_desc:0 "Time to get this done."
 GER_location_location_location:0 "Location Location Location"
 GER_location_location_location_desc:0 "Where should the meeting be held?"
 GER_maybe_a_broadcast_or_two:0 "Maybe A Broadcast Or Two?"
 GER_maybe_a_broadcast_or_two_desc:0 "Bring in the TVs and radios?"
 GER_final_preperations:0 "Final Preperations"
 GER_final_preperations_desc:0 "Any last minute changes?"
 GER_and_the_fuher_is:0 "And The Fuhrer Is..."
 GER_and_the_fuher_is_desc:0 "There can only be one."