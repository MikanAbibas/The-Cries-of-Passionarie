 ITA_RED_culrev_title:0 "§DLa Rivoluzione Culturale§!"
 ITA_RED_cultrev_modifier:0 "Effects Of The Cultural Revolution"
 ITA_RED_cultrev_info_box:0 "Following the Italo-German War, the §xCommunist§! government of Italy faces the challenge of rebuilding the nation both §xideologically§! and §Oeconomically§!. To achieve this, a systemic restructuring of Italian society must be done to drive out reaction and to move closer to §xtrue communism§!.\n\nTo achieve this, the government must first destroy the remnants of fascist influence around the pillars of society both in the §jFascist Vines§! remaining and then lower the stability of the §DInstitutions§! until they are broken. Then at last, the pillars may be rebuilt in the image of a §xNew Italy§!.\n\nTo acheive this, §xPolicies§! £culrev_policy_box! may be enacted to address specific concerns as well as take other actions to further progress. As the revolution solidifies, more §xpolicy slots§! £culrev_policy_box! will unlock.\n\nHowever, there are various things we must take into account:\n\n§xMilitant Approval§! measures our popularity with the student brigades organized by §eVittorio Vidali§!. If we are too unpopular, we could risk unrest or worse, a coup.\n\n§gReaction§! represents the counter-revolutionary forces seeking to undermine our government, which if they get bad enough could take over.\n\n§OSeverity§! represents the physical toll of the revolution, from broken buildings to economic turmoil.\n\n§eRed Terror§! represents the ideological violence inflicted as a result of the §xCultural Revolution§!, and while we'd ideally have none it is a necessity of change.\n\n§VRevolutionary Fervour§! is the enthusiasm and fervour of the revolution, driving it forward and increases the weekly progress for changing the pillars of society."
 ITA_RED_culrev_new_policy_box: "We will unlock a new §xpolicy slot§! £culrev_policy_box!"
