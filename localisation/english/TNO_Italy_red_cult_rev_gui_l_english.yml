 #####Rural Workers#####
 ITA_RED_cultrev_farmers_name:0 "§[ITA_RED_get_red_or_white_farmers]Rural Workers§!"
 ITA_RED_cultrev_farmers_name_list: "§YRural Workers§!"
 ITA_RED_cultrev_farmers_stability:0 "[?ITA_RED_farmers_progress]"
 ITA_RED_cultrev_farmers_stability_red:0 "§R[?ITA_RED_farmers_progress_red]§!"
 ITA_RED_cultrev_farmers_stage:0 "[?ITA_RED_farmers_stage]"
 ITA_RED_cultrev_farmers_description:0 "The Rural Workers are the backbone of Italian culture and society. Especially once you leave the industrial heartland of northern Italy, this represents the larget section of Italian society, and therefore the most influential. Much like in Russia before us, the rural farmers must be brought into the revolutionary fold one way or another if Italy is to become a truly socialist nation."
 ITA_RED_cultrev_farmers_effect:0 "[?ITA_RED_farmers_pop_growth]% Population Growth"
 ITA_RED_cultrev_farmers_action_1_tt:0 "In old-school Communist thought, the peasants and farmers are a particular class that cannot generate proletarian spirit or contribute in any meaningful way to the Revolution. History since the rise and fall of the Soviet Union has proven them wrong, however, and we will avoid the mistakes of the past! New, young thought on the peasantry's place in the Revolution will ensure that the peasants are not alienated in the new Italy we make!"
 ITA_RED_cultrev_farmers_action_2_tt:0 "The farmers and peasants of Italy care little for ideologues, grand promises or notions of the new and exciting. They are practical people, and as such, they look towards policies that help them in practical, tangible ways rather than heady ideals that the youth seem insistent upon dangling before them. The Old Guard will step in and ensure that as the Peasantry and Farmers of old Italy become productive and equal members of the New Italy!"
 ITA_RED_cultrev_progress_farmers_tt: "§YRural Workers§! will progress by [?ITA_RED_pillar_change_farmers_temp|+=%%], with a bonus of [?ITA_RED_farmers_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_farmers_multiplier_modifier|0+=%]."
 ITA_RED_cultrev_progress_farmers_weekly_tt: "§YRural Workers§! velocity will change by [?ITA_RED_farmers_velocity_temp|+=%%]"
 ITA_RED_increasing_farmers: "§W§YRural Workers§! progress is increasing by §G[?ITA_RED_farmers_velocity|2]%§! weekly, with an additional change of [?ITA_RED_farmers_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_farmers_multiplier_modifier|0+=%].§!"
 ITA_RED_farmers_modifier_tt: "Our §YRural Workers§! Modifier will change by [?ITA_RED_efficacy_shift_temp|0+=%]."
 
 #####Urban Workers#####
 ITA_RED_cultrev_workers_name:0 "§[ITA_RED_get_red_or_white_workers]Urban Workers§!"
 ITA_RED_cultrev_workers_name_list: "§YUrban Workers§!"
 ITA_RED_cultrev_workers_stability:0 "[?ITA_RED_workers_progress]"
 ITA_RED_cultrev_workers_stability_red:0 "§R[?ITA_RED_workers_progress_red]§!"
 ITA_RED_cultrev_workers_stage:0 "[?ITA_RED_workers_stage]"
 ITA_RED_cultrev_workers_description:0 "The Urban Workers are primarily concentrated in Northern Italy in major industrial centers like Milan. In the revolutionary movement, the worker is at the core of the movement itself. It is, after all, the workers' demand for a fairer system and to control the means of production that allowed for the revolution in the first place, but if we do not live up to their expectations, they can quickly become disillusioned."
 ITA_RED_cultrev_workers_effect:0 "[?ITA_RED_workers_prod_eff]% Production Efficiency"
 ITA_RED_cultrev_workers_action_1_tt:0 "The workers of the world unite! These words have been ringing through city streets for nearly a century, but it has never truly come to pass. If the Revolution is to survive and reach its full potential, the new Italian worker needs to not only be an example to the rest of the world, but must reach out and embrace their fellow worker from every corner of the earth!"
 ITA_RED_cultrev_workers_action_2_tt:0 "The worker is the core of socialism, without the proletariat, there is no socialism. It is imperative that the worker be truly enfranchised and assume the dictatorship of the nation. Previous experiments have failed to hold true to this doctrine and standard, and as such, they have failed as socialist nations. We will not make the mistakes of the past, but instead, hold to the orthodoxy that others so readily abandoned"
 ITA_RED_cultrev_progress_workers_tt: "§YUrban Workers§! will progress by [?ITA_RED_pillar_change_workers_temp|+=%%], with a bonus of [?ITA_RED_workers_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_workers_multiplier_modifier|0+=%]."
 ITA_RED_cultrev_progress_workers_weekly_tt: "§YUrban Workers§! velocity will change by [?ITA_RED_workers_velocity_temp|+=%%]"
 ITA_RED_increasing_workers: "§W§YUrban Workers§! progress is increasing by §G[?ITA_RED_workers_velocity|2]%§! weekly, with an additional change of [?ITA_RED_workers_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_workers_multiplier_modifier|0+=%].§!"
 ITA_RED_workers_modifier_tt: "Our §YUrban Workers§! Modifier will change by [?ITA_RED_efficacy_shift_temp|0+=%]."
 
 #####Middle Classes#####
 ITA_RED_cultrev_middle_class_name:0 "§[ITA_RED_get_red_or_white_middle_class]Petit Bourgeois§!"
 ITA_RED_cultrev_middle_class_name_list: "§YPetit Bourgeois§!"
 ITA_RED_cultrev_middle_class_stability:0 "[?ITA_RED_middle_class_progress]"
 ITA_RED_cultrev_middle_class_stability_red:0 "§R[?ITA_RED_middle_class_progress_red]§!"
 ITA_RED_cultrev_middle_class_stage:0 "[?ITA_RED_middle_class_stage]"
 ITA_RED_cultrev_middle_class_description:0 "The Petit Bourgeois represent one of the greatest, and at the same time least institutional, threats to the Revolution. They will fight us tooth and nail to try to undo the advance of socialism to protect what meager wealth they were allowed to have before. Whether by force or by incentive, we need to remove this obstacle from our path and if possible, add them to the ranks of the people."
 ITA_RED_cultrev_middle_class_effect:0 "[?ITA_RED_middle_class_gdp_growth]% GDP Growth"
 ITA_RED_cultrev_middle_class_action_1_tt:0 "The middle classes in bourgeois dictatorships have always been a major stumbling block for the Revolution. Too close to the proletariat to be totally irrelevant to the Revolution, but too close to the bourgeois to ever see what they have to gain from the Revolution. Whether by carrot or by stick, those who lay between a worker and a boss will need to eventually decide who they support, the people? Or their former oppressors?"
 ITA_RED_cultrev_middle_class_action_2_tt:0 "It is no secret that whenever Revolution has arrived anywhere, the so-called 'middle classes' have been a vanguard for the Bourgeois, and an epicenter of inevitable reaction against the progress we achieve. If the Revolution is to survive, its enemies must be rendered inert, one way or another, and we can only hope they'll see what awaits them in a truly egalitarian future. If they cannot, then it is unfortunate, but not unexpected."
 ITA_RED_cultrev_progress_middle_class_tt: "§YPetit Bourgeois§! will progress by [?ITA_RED_pillar_change_middle_class_temp|+=%%], with a bonus of [?ITA_RED_middle_class_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_middle_class_multiplier_modifier|0+=%]."
 ITA_RED_cultrev_progress_middle_class_weekly_tt: "§YPetit Bourgeois§! velocity will change by [?ITA_RED_middle_class_velocity_temp|+=%%]"
 ITA_RED_increasing_middle_class: "§W§YPetit Bourgeois§! progress is increasing by §G[?ITA_RED_middle_class_velocity|2]%§! weekly, with an additional change of [?ITA_RED_middle_class_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_middle_class_multiplier_modifier|0+=%].§!"
 ITA_RED_middle_class_modifier_tt: "Our §YPetit Bourgeois§! Modifier will change by [?ITA_RED_efficacy_shift_temp|0+=%]."
 
 #####Soliders & Police#####
 ITA_RED_cultrev_soldiers_police_name:0 "§[ITA_RED_get_red_or_white_soldiers_police]Soldiers & Police§!"
 ITA_RED_cultrev_soldiers_name_list: "§YSoldiers & Police§!"
 ITA_RED_cultrev_soldiers_police_stability:0 "[?ITA_RED_soldiers_police_progress]"
 ITA_RED_cultrev_soldiers_polic_stability_red:0 "§R[?ITA_RED_soldiers_polic_progress_red]§!"
 ITA_RED_cultrev_soldiers_police_stage:0 "[?ITA_RED_soldiers_police_stage]"
 ITA_RED_cultrev_soldiers_police_description:0 "The enforcers of the old bourgeois system find themselves both leaderless and rudderless. This is both a danger and an opportunity for us, as both the soldiers and the police forces can either be co-opted as a weapon against the Revolution, or brought into the fold as its most ardent and hardy defenders."
 ITA_RED_cultrev_soldiers_police_effect:0 "[?ITA_RED_soldiers_police_weekly_manpower]% Conscription Factor"
 ITA_RED_cultrev_soldiers_police_action_1_tt:0 "Either the Revolution's greatest friend or its greatest foe are the men and women who hold the guns. In 1917, it was the army's allegiance to the Bolsheviks that secured their eventual victory, and many of the soldiers of a nation are part of its proletariat. To court and rebuild the armies in their image- a fairer, more efficient image- will be a tricky task as we will need to balance out the interests of the soldiers and of strategy, but if we can do it, the Revolution will have its unassailable front lines."
 ITA_RED_cultrev_soldiers_police_action_2_tt:0 "A Revolution, as well as the state, requires enforcers and defenders. While no doubt arms of imperialism and capital in their previous state, we can remold them into a true revolutionary vanguard. A top-to-bottom purge and reorganization is of course going to be needed, as we find those who will barry the ideological and philosophical banners of the new state, our army and its security forces will only grow more unified and more ready to fight and die for the Revolution."
 ITA_RED_cultrev_progress_soldiers_police_tt: "§YSoldiers & Police§! will progress by [?ITA_RED_pillar_change_soldiers_police_temp|+=%%], with a bonus of [?ITA_RED_soldiers_police_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_soldiers_police_multiplier_modifier|0+=%]."
 ITA_RED_cultrev_progress_soldiers_police_weekly_tt: "§YSoldiers & Police§! velocity will change by [?ITA_RED_soldiers_police_velocity_temp|+=%%]"
 ITA_RED_increasing_soldiers_police: "§W§YSoldiers & Police§! progress is increasing by §G[?ITA_RED_soldiers_police_velocity|2]%§! weekly, with an additional change of [?ITA_RED_soldiers_police_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_soldiers_police_multiplier_modifier|0+=%].§!"
 ITA_RED_soldiers_police_modifier_tt: "Our §YSoldiers & Police§! Modifier will change by [?ITA_RED_efficacy_shift_temp|0+=%]."
 
 #####Clergy#####
 ITA_RED_cultrev_clergy_name:0 "§[ITA_RED_get_red_or_white_clergy]Clergy§!"
 ITA_RED_cultrev_clergy_name_list: "§YClergy§!"
 ITA_RED_cultrev_clergy_stability:0 "[?ITA_RED_clergy_progress]"
 ITA_RED_cultrev_clergy_stability_red:0 "§R[?ITA_RED_clergy_progress_red]§!"
 ITA_RED_cultrev_clergy_stage:0 "[?ITA_RED_clergy_stage]"
 ITA_RED_cultrev_clergy_description:0 "The Catholic Church is no friend to revolution, that much has been fact since the days of the French Revolution, and it holds true to this day. Virtually the entire Italian population is Catholic, however, and the Vatican has- though Italy itself has come under our control- remained outside of our sphere of influence. We're going to need to find places and areas where we can afford to take a stand against the Church, and where we must compromise, if we are to maintain the faith of the People."
 ITA_RED_cultrev_clergy_effect:0 "[?ITA_RED_clergy_stability]% Stability"
 ITA_RED_cultrev_clergy_action_1_tt:0 "It is an unfortunate fact that Italy- even among its most revolutionary proletarians- is an exceedingly religious country. Even worse, it is exceedingly Catholic. This makes the distinctly anti-clerical stance we have adopted something untenable to maintain in the long run, as no doubt for many, they will only take so many slights against the faith they truly believe in. We'll need to reintegrate the Clergy in some way, but everyone seems to have different ideas on how to go about this. We must tread lightly."
 ITA_RED_cultrev_clergy_action_2_tt:0 "There are scant few anti-revolutionary contagions quite like religion. The opiate of the masses is an addictive sort of drug, and its messages of complacency, accepting their justifications for the ascendancy of aristocrats and corporate pigs over the many. However, if we were to treat the clergy with the disdain and harshness they probably deserve, it'd provoke an outcry from our extremely religious populace. Some kind of compromise with them must be reached, even if it is merely one that allows us to exist separately in our own spheres and nothing more."
 ITA_RED_cultrev_progress_clergy_tt: "§YClergy§! will progress by [?ITA_RED_pillar_change_clergy_temp|+=%%], with a bonus of [?ITA_RED_clergy_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_clergy_multiplier_modifier|0+=%]."
 ITA_RED_cultrev_progress_clergy_weekly_tt: "§YClergy§! velocity will change by [?ITA_RED_clergy_velocity_temp|+=%%]"
 ITA_RED_increasing_clergy: "§W§YClergy§! progress is increasing by §G[?ITA_RED_clergy_velocity|2]%§! weekly, with an additional change of [?ITA_RED_clergy_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_clergy_multiplier_modifier|0+=%].§!"
 ITA_RED_clergy_modifier_tt: "Our §YClergy§! Modifier will change by [?ITA_RED_efficacy_shift_temp|0+=%]."
 
 #####Academia#####
 ITA_RED_cultrev_academia_name:0 "§[ITA_RED_get_red_or_white_academia]Academia§!"
 ITA_RED_cultrev_academia_name_list: "§YAcademia§!"
 ITA_RED_cultrev_academia_stability:0 "[?ITA_RED_academia_progress]"
 ITA_RED_cultrev_academia_stability_red:0 "§R[?ITA_RED_academia_progress_red]§!"
 ITA_RED_cultrev_academia_stage:0 "[?ITA_RED_academia_stage]"
 ITA_RED_cultrev_academia_description:0 "What is now reality, had begun as an idea, and ideas are the domain of the intelligentsia. The academics of Italy are eternally divided however, as decades of Fascist rule and suppression has stunted much of the academic and scientific culture of Italy. Not only will the old institutions need to be broken down to their foundations, but we must build something new in their place."
 ITA_RED_cultrev_academia_effect:0 "[?ITA_RED_academia_research_speed]% Research Speed"
 ITA_RED_cultrev_academia_action_1_tt:0 "From the armchair to the streets, that is the ideal. The tenets we fight for and live by were first determined by careful thought and consideration by philosophers, political thinkers, and ideologues. In short, theory. Theory without action, however, is idleness and does little good for anyone. Action without theory, in turn, is directionless and wasteful, is it not? We need to reform and bring the academia in on all levels of our government, to ensure they are not merely resting, and to ensure our efforts are not wasted"
 ITA_RED_cultrev_academia_action_2_tt:0 "Communism is, at the end of the day, a philosophical movement. Strict analysis of material conditions followed up by the determination to solve problems. To do this, we require a stringent and unified intelligentsia to support us in our endeavors. One that is based off the tenets of Marxist Orthodoxy, and not prone to corruption by bourgeois and liberal philosophies. The rebuilding of Italy's education and academia is a necessity if we are to prevent counterrevolution and reaction coming from within our own system."
 ITA_RED_cultrev_progress_academia_tt: "§YAcademia§! will progress by [?ITA_RED_pillar_change_academia_temp|+=%%], with a bonus of [?ITA_RED_academia_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_academia_multiplier_modifier|0+=%]."
 ITA_RED_cultrev_progress_academia_weekly_tt: "§YAcademia§! velocity will change by [?ITA_RED_academia_velocity_temp|+=%%]"
 ITA_RED_increasing_academia: "§W§YAcademia§! progress is increasing by §G[?ITA_RED_academia_velocity|2]%§! weekly, with an additional change of [?ITA_RED_academia_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_academia_multiplier_modifier|0+=%].§!"
 ITA_RED_academia_modifier_tt: "Our §YAcademia§! Modifier will change by [?ITA_RED_efficacy_shift_temp|0+=%]."
 
 ######Marginalized Groups#####
 ITA_RED_cultrev_marginalized_name:0 "§[ITA_RED_get_red_or_white_marginalized]Marginalized Groups§!"
 ITA_RED_cultrev_marginalized_name_list: "§YMarginalized Groups§!"
 ITA_RED_cultrev_marginalized_stability:0 "[?ITA_RED_marginalized_progress]"
 ITA_RED_cultrev_marginalized_stability_red:0 "§R[?ITA_RED_marginalized_progress_red]§!"
 ITA_RED_cultrev_marginalized_stage:0 "[?ITA_RED_marginalized_stage]"
 ITA_RED_cultrev_marginalized_description:0 "Italy has many smaller populations within its borders, both from the fascist conquests of the 30's and 40's, as well as from its borders beforehand. Whether Tyrol Germans, Croatians along the frontier of Adriatica, or the subjects of empire in Africa and the Middle East, the marginalized of Italy have long been suppressed and oppressed. Simple economic and political realities prevent us from being able to simply grant them nations of their own, so we must find ways to build them up and accommodate them within our new Socialist state."
 ITA_RED_cultrev_marginalized_effect:0 "[?ITA_RED_marginalized_political_power_gain]% Political Power Gain"
 ITA_RED_cultrev_marginalized_action_1_tt:0 "The beleaguered and oppressed of the society we are overthrowing have great revolutionary potential within them. Though they do not fit within a neat little box of orthodox proletarian hierarchy, we'd be fools to not take advantage of our shared struggle and elevate them to allow them to better aid in our cause! After all, who better to help us build the new Italy than those who suffered most in the old one?"
 ITA_RED_cultrev_marginalized_action_2_tt:0 "While the class conflict remains paramount, we cannot ignore other aspects of the fascists' oppression of the masses. There are many marginalized, racial and otherwise, who have long been repressed by the fascists' legal codes and 'social pyramids' that we need to not only equalize with the rest of Italy, but also a great deal of attitudes towards them that will remain socially ingrained in the society until it is flushed out."
 ITA_RED_cultrev_progress_marginalized_tt: "§YMarginalized Groups§! will progress by [?ITA_RED_pillar_change_marginalized_temp|+=%%], with a bonus of [?ITA_RED_marginalized_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_marginalized_multiplier_modifier|0+=%]."
 ITA_RED_cultrev_progress_marginalized_weekly_tt: "§YMarginalized Groups§! velocity will change by [?ITA_RED_marginalized_velocity_temp|+=%%]"
 ITA_RED_increasing_marginalized: "§W§YMarginalized Groups§! progress is increasing by §G[?ITA_RED_marginalized_velocity|2]%§! weekly, with an additional change of [?ITA_RED_marginalized_multiplier_modifier_temp|+=%%] progress due to our modifier of [?modifier@ITA_RED_marginalized_multiplier_modifier|0+=%].§!"
 ITA_RED_marginalized_modifier_tt: "Our §YMarginalized Groups§! Modifier will change by [?ITA_RED_efficacy_shift_temp|0+=%]."
 
