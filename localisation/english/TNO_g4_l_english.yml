 GER_kn_decisions:0 "The KdN"
 GER_kn_decisions_desc:0 "Many have derided the idea of world peace. They are not entirely incorrect. As longs as man lives and breathes, there will always be conflict and always be war. \n\nBut some wars can be avoided, some conflicts resolved at a conference table. Did Bismarck not guide Germany through careful diplomacy as well as war? The German final victory has already been secured why seek conflict where none is truly necessary? \n\nThe Koalition der Nationen seeks to answer this question. A global framework can be created for international diplomacy. The nations of the world need not turn only to guns to resolve their differences. \n\nOf course this is easier said then done, but through effort and care we can get accomplish even the impossible. Many analysts believe a third world war will break out by the late 1980s. Let's prove them wrong. We can build the KdN to be coherent in structure, popular among the masses, and trusted by its members. \n\nWe can win wars, and we can win peace as well. \n\nThe Structure of the KdN is currently [GERG4GetKnCouncilText][GERG4GetKnVoteTallyText]"
 GER_kn_diplomatic_outreach:0 "KdN Diplomatic Outreach"
 GER_kn_diplomatic_outreach_desc:0 ""
 GER_kn_institutional_reform:0 "KdN Institutional Reform"
 GER_kn_institutional_reform_desc:0 ""
 GER_kn_public_relations_campaign:0 "KdN Public Relations Campaign"
 GER_kn_public_relations_campaign_desc:0 ""
 GER_kn_invite_mediterranean:0 "Invite [FROM.GetName] to the KdN"
 GER_kn_invite_mediterranean_desc:0 "Extend an invitation to [FROM.GetName] to join the Koalition der Nationen as a full member."
 GER_kn_invite_pakt_member:0 "Invite [FROM.GetName] to the KdN"
 GER_kn_invite_pakt_member_desc:0 "Our former Pakt partners deserve a place in the new order. Invite [FROM.GetName] to the Koalition der Nationen."
 GER_kn_invite_northern_nation:0 "Invite [FROM.GetName] to the KdN"
 GER_kn_invite_northern_nation_desc:0 "The northern nations have much to offer the Koalition. Extend an invitation to [FROM.GetName]."
 GER_kn_invite_south_american_nation:0 "Invite [FROM.GetName] to the KdN"
 GER_kn_invite_south_american_nation_desc:0 "Reach across the Atlantic and invite [FROM.GetName] to join the Koalition der Nationen."
 GER_kn_invite_america:0 "Invite the United States to the KdN"
 GER_kn_invite_america_desc:0 "The ultimate test of the Koalition's legitimacy — inviting our former rival to the table."
 GER_kn_invite_japan:0 "Invite Japan to the KdN"
 GER_kn_invite_japan_desc:0 "If the Koalition is to be truly global, the Co-Prosperity Sphere must have a seat at the table."
 GER_kn_invite_distant_nation:0 "Invite [FROM.GetName] to the KdN"
 GER_kn_invite_distant_nation_desc:0 "Extend the Koalition's reach to distant shores. Invite [FROM.GetName] to join."
 GER_kn_yes_vote:0 "Vote §GYes§!"
 GER_kn_yes_vote_desc:0 "Cast our vote in favor of the current resolution. A yes vote signals our support for the proposed measure and our commitment to the consensus of the Koalition."
 GER_kn_no_vote:0 "Vote §RNo§!"
 GER_kn_no_vote_desc:0 "Cast our vote against the current resolution. A no vote signals our opposition and our willingness to defend our position even at the cost of Koalition unity."
 GER_kn_abstain_vote:0 "§YAbstain§! From Vote"
 GER_kn_abstain_vote_desc:0 "Decline to take a position on the current resolution. We avoid the political cost of either side and earn a small dividend of political capital for our diplomatic restraint."
 GER_kn_veto_vote:0 "§JVeto§! Current Resolution"
 GER_kn_veto_vote_desc:0 "As a permanent member of the Council of Guardians, exercise our right to unilaterally strike down this resolution. The motion fails immediately, regardless of the votes already cast."
 GER_kn_berlin_accords:0 "§LResolution§!: The Berlin Accords"
 GER_kn_berlin_accords_desc:0 "A landmark resolution to formalize the diplomatic norms of the Koalition der Nationen. If passed, the Accords will codify dispute resolution procedures and establish Berlin as the official seat of the Koalition. Members have seventy days to cast their votes."
