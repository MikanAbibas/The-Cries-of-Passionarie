 GER_g4_full_speed_ahead_decisions:0 "For A Prosperous Reich"
 GER_g4_full_speed_ahead_decisions_desc:0 "\n\n\n\n\n\n\n\n\n\n\nWhy wait for greatness to simply drop into our lap? Such foolishness is unbecoming of the Germany people. We must seize prosperity and economic progress by the reigns. Even if the costs are steep, by seeking development of our natural resources, industry, and technology, we can make the initial costs worthwile. \n\nIndeed, the dividends of our great economic project will eclipse any expenses and the economic security of our children and our childrens children shall be fastned and secured. \n\nFor the Reich! For the Volk!"
