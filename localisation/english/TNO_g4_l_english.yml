 GER_g4_cant_rush_art_decisions:0 "The Natural Economy"
 GER_g4_cant_rush_art_decisions_desc:0 "Any economy is not something that can be built - or worse - forced into existence. This lesson regrettably had to be relearned when the shambholic and wasteful slave economy began to collapse in on itself. An economy... is like a garden. You prune hedges and harvest fruits but you don't construct plants out of base materials now do you? An economy grows by itself, you only need to let it.\n\nThe new German economy will be allowed to grow naturally with some corrective measures when needed. Our economists inform us this will enable gradual and sustained economic growth and ensure prosperity for future generations.\n§jFactories Added Per Cycle:§! [?GER_capital_yields_factories] \n§fCapital Yields Speed:§! [?GER_capital_yields_speed] Days \n§yEfficiency Cap Per Cycle:§! [?GER_capital_yields_eff_cap|%] \n§aGDP Per Cycle:§! [?GER_capital_yields_eff_gdp] Million USD"
