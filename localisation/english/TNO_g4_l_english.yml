 #events
 ## GER_gfour_intro ##
 GER_gfour_intro.1.t:0 "Germany In [GetYear]"
 GER_gfour_intro.1.d:0 "Through thick and thin, the Reich has trudged ever forward into the future. But the Reich is not the same as it was when Adolf Hitler breathed his last. \n\nThe inertia of change has dragged it on a course that not even Albert Speer anticipated. Nor it seems can he stop the tide from rising ever forward. \n\nThe Gang of Four is ascendant. Those men that once supported the Fuhrer have struck out on their own and now lead the great beast of State into a brighter future. They envision not a Reich but a Republic, guided by the ideals of democracy and liberty. The sins of the past shall be redeemed and the souls of the innocent dead be given rest at last. \n\nBut the Reich only ever had one master. And where it plods not even the men of power can say."
 GER_gfour_intro.1.a:0 "Freedom Awaits"
 GER_gfour_intro.2.t:0 "Will To Free"
 GER_gfour_intro.2.d:0 "It was the angriest he had ever been. \n\nHe was not someone who was prone to rages, but that moment... that accursed moment of betrayal sent him over the edge. The Gang of Four... he had given those fools everything - more than everything. And how did they repay him? \n\nWith a coup, that's what! He had allowed them to chase their ambitions and they repayed him by stealing his power and spitting on him on their way out. \n\nNo doubt they were having fancy dinners and laughing at his expense. Now they considered him nothing but a puppet. But in their arrogance, there was opportunity. \n\nThe Gang wanted democracy? Fine, so be it. Albert Speer was not of the petty sort. In fact, he would help them. He would give them democracy. \n\nIn all its beauty."
 GER_gfour_intro.2.a:0 "And In All Its Ugliness"
 GER_gfour_intro.3.t:0 "Tricolour Over Germania"
 GER_gfour_intro.3.d:0 "Black. \n\nRed. \n\nGold.\n\nIt had been some time since Schmidt had seen them flown openly. They were common enough during the dark days of the Bürgerkrieg, but Speer had been quick to crack down on their usage, just as his predecessor had done. \n\nThis had confirmed what they all had suspected: Albert Speer was just another dyed-in-the-wool brownshirt, hardly better than the rivals he had overcome. \n\nBut at last, it could be flown freely, in its rightful place as the national flag of Germany. \n\nDown with the Swastika! \n\nUp with the Tricolour!"
 GER_gfour_intro.3.a:0 "Where It Should Be"
 GER_gfour_intro.4.t:0 "Speer's Last Play"
 GER_gfour_intro.4.d:0 "“Damn them all!” \n\nKiesinger waved at the window. He had stayed the night working and had fallen asleep at his desk. He had only been awoken an hour before – by the commotion he now gestured to. His comrades took in the view; outside the Reichstag was a political rally of comparable size to the student protests, but the cause was entirely opposite to those noble rallies. \n\nBelow, thousands waved the old swastika banner. Banners and signs bearing various slogans could be seen as well. “ELECTIONS NOW,” said one, “SAY NO TO JEWISH PUPPETS,” said another. \n\nOne artistically inclined hooligan had painted a huge banner of the Gang of Four (with overly large noses) in bed with various foreign pariahs and stereotypes. \n\n“There are protests like these in almost every major city,” Schmidt murmured. “No doubt the NSDAP is behind this, but who could have...?” \n\nIt dawned on them simultaneously: “Speer,” Erhard growled, “Where is Albert Speer?” \n\nAs they rushed off to the Fuhrer’s office, Kiesinger cursed himself silently. They had celebrated too soon. They overlooked the possibility that the old man might still have some fight left in him. They practically banged down the door, but the man who greeted them wasn’t Albert Speer. \n\nTheodore Oberlander had been admiring some architectural models when the Gang of Four burst through the door. \n\n“I was about to find you gentlemen myself—” Kiesinger cut him off. “We have no time for your prattle. Where. Is. Speer?” Oberlander raised his hands. “Now, now, Herr Kiesinger, we must not forget our manners. But as for your question, the Fuhrer is currently at OKW headquarters. I believe he has... business with the General Staff.” \n\nVon Tresckow replied levelly, “The Wehrmacht will not fight your battles for you, Herr Oberlander. They are loyal to Germany, not the NSDAP.” Oberlander shrugged. “You are right, General, but they won’t exactly fight for you either, will they?” \n\nKiesinger could no longer contain himself. “What is your game, Oberlander? You are no friend of Speer’s. We won’t let you plunge this nation into yet another civil war!” Oberlander’s smile dropped from his face. “The Fuhrer has many foolish ideas, yes, but he is still a National Socialist at the end of the day. When the Fuhrer requested the aid of the party, his party, we answered in full force.” \n\n”We will not let you ransack the Reich with your ‘reforms’. Political rigging would be a more accurate term, I think. You want the NSDAP destroyed so you can hold elections that only you and your friends can win.” He laughed, “Is that really democracy? We both know how the game is played, Herr Kiesinger, and you are playing to win, but...” \n\n“But what?” \n\nOberlander’s crooked smile returned. “But there is a way for both of us to win.” \n\nSome time later, Kiesinger returned to his office and locked the door behind him. The Nazi rally was still going strong outside, but he didn’t care about that anymore. He took a deep breath and furiously roared a name."
 GER_gfour_intro.4.a:0 "ALBERT! ALBEEEERRRRRTTTT!"
 GER_gfour_intro.5.t:0 "One Step Forward..."
 GER_gfour_intro.5.d:0 "“I still can’t believe this.” \n\n“Well, you will have to, Schmidt.” Erhard didn't look up from his desk. “The NSDAP has offered us a compromise, and we—unfortunately—have to take it. Otherwise, we risk civil war, and that could very well undo everything we have gained.” \n\n”So I suppose we should just give them everything then?” \n\nErhard tilted his head upwards; his friend was in a particularly rotten mood, not that he blamed him. “You know better than that, and I think Kiesinger will need your help with negotiations.” \n\nSchmidt sighed, “I suppose I should have expected something like this to happen. Maybe if I...” \n\n”What is done is done. Now we must push onward and learn from our mistakes.”"
 GER_gfour_intro.5.a:0 "We Will Endure"
 GER_gfour_intro.6.t:0 "What Has To Be Done"
 GER_gfour_intro.6.d:0 "Kiesinger paced. “Can the Wehrmacht be trusted?” \n\nVon Tresckow coughed. “Most likely.” \n\n“Most likely?” \n\n”The old general sat down before continuing. “That peacock Oberlander was not lying when he said the Wehrmacht would not intervene. I have made inquiries, and barring a few political ideologues, most of the High Command is not keen to start meddling in politics.” Von Tresckow paused. “Which, I suppose, means our military reforms worked.” \n\n“Is Speidel really disinterested in our cause?” \n\nVon Tresckow smiled. “Speidel and his clique are not entirely fond of the NSDAP, but they are not exactly democrats either. They are probably going to wait and see what happens.” \n\nKiesinger frowned, at once satisfied and unsatisfied. ”I suppose it will have to do. As for myself, I have been busy meeting with party members.” \n\n”And how goes that?” \n\nKiesinger smiled ruefully. “It will have to do. But I find myself considering the cause has been tarnished.” \n\nThe general leaned forward. “If our cause is just, we will find a way, no matter what.” \n\n"Do you really believe that?" \n\n"Yes.""
 GER_gfour_intro.6.a:0 "We Can't Stop"
 GER_gfour_intro.7.t:0 "One Final Gathering"
 GER_gfour_intro.7.d:0 "“Sit.” \n\nKiesinger snorted. ”We will remain standing.” \n\nThe Fuhrer shrugged. “So be it. But you will hear what I have to say. And for the first time, you will listen.” \n\nSchmidt cut in, “With all due respect, mein Fuhrer, this could have been much easier if you hadn’t—” \n\n”This would have been much easier if you fools had not betrayed me!” \n\n”Betrayed you?” Kiesinger snorted. “You are a relic clinging to a beastly ideology. If you had any care for this Germany—for Europe—we could have brought about freedom and liberty. The people deserve that, at least!” \n\nSpeer stared at Kiesinger and then scanned the rest of the Gang. “Do you share his sentiment?” They nodded and Speer threw his hands up and sighed. To Kiesinger, he had never looked older.\n\n”We are not Americans,” Speer spoke quietly, “nor will we ever be. The German desires order above all else. Some of you were too young to remember, but even during the Weimar period, this was true. In 1933, Hitler won a fair election, and the NSDAP rose to where it is today. You cannot simply—cannot simply reform all of this away.” \n\n”Would you have us do nothing? To accept a dictatorship of criminals?” \n\n”Would you have risen to such heights without this ‘dictatorship of criminals’?” \n\n”There would be no need then.” \n\n“No, I think you would have chased power with or without us, Schmidt.” Then, to Schmidt’s surprise, he chuckled and winked, “In fact I think dear Adolf would say it’s in your blood.” \n\n”Are we finished?” Erhard asked. \n\n”Yes, Herr Erhard, we are finished.” Speer rose from his desk slowly. “It is clear we will never share our vision of Germany. You are dismissed, and please close the door behind you; it can get quite drafty.” \n\nThey all filed out. Von Tresckow was the last one out the door. To Speer’s surprise, he saluted. “Goodbye, mein Fuhrer,” he said as the door closed behind him."
 GER_gfour_intro.7.a:0 "Goodbye"
 GER_gfour_intro.8.t:0 "The Swastika Eternal"
 GER_gfour_intro.8.d:0 "“The youth like hanging Tricolors everywhere. \n\nAs if they know what it means! None of them were alive during the Weimar times! None of them suffered like the older generations! \n\nIt’s all ridiculous. Why should we accept this nonsense? There is nothing wrong with how things are now. \n\nThe economy is booming, the army is strong—it doesn’t make much sense at all! As I said, the youth like hanging up the Tricolor, but flags burn and whittle away. The Swastika is carved into stone in every city. It will endure!” \n\nHans sighed and put the newspaper away. The Völkischer Beobachter had been spouting the same drivel as usual. He should probably cancel his subscription, considering his wife stopped reading it months ago, to say nothing of their children. \n\nHis friend from work said something about a new paper. Was it... Germania Zeitung? Yes, that was probably it."
 GER_gfour_intro.8.a:0 "He Would Look Into It Later"
 GER_gfour_intro.9.t:0 "Back In Weimar"
 GER_gfour_intro.9.d:0 "Now, I won’t go over every detail of the constitution. It can get quite boring, and frankly, if you derive any enjoyment from reading laws, then you are probably mentally demented. Or maybe you are a lawyer, not that those two attributes are much different. \n\nIn any case, the broad idea is this: votes are broken up by Gaus, and the number of seats is determined by the number of voters. \n\n60,000 votes for one party equals one seat in the Reichstag. The largest party gets to form a government. Just like Weimar times, right? Well, here’s where things get interesting. See, the winning party also chooses the new Fuhrer. And a Fuhrer is a Fuhrer. That means lots of power and almost no restrictions. Sure, laws still need majority support to pass, but with the power of a Fuhrer, those votes might not be that hard to get. \n\nOf course, who knows who the Fuhrer is going to be, or what he will do. Don’t like this system? Tough luck. \n\nBut then again, maybe if you play it smart and get lucky..."
 GER_gfour_intro.9.a:0 "It's Not Too Late..."
 GER_gfour_intro.10.t:0 "Day Of Fate"
 GER_gfour_intro.10.d:0 "Millions of lungs hold tight as the ballots are counted and the results come in. \n\nThis isn't the first election the German Reich has experienced, but since 1933, most elections have been essentially meaningless affairs. Now that's no longer true. Four parties are now considered serious contenders for the Reichstag, and the seat of Fuhrer with it. \n\nThe NSDAP, long the master of German politics, now seeks to retain its hold on the nation. Its leader, Helmut Goebbels, understands that true power comes through hearts and minds. The party has two wings: the technocratic Speerite tendency, and the populist Goebbelites. \n\nThe VUP revives a tradition long thought gone, and seeks a return to moral governance to unite the peoples of Germany. Joseph Ratzinger is the leader of the VUP. A devout Catholic and traditionally minded man, his mind is on restoring the good of the past and taking the greatness of the present to new heights. The party has a minor division between its more market-minded members and those with social democratic leanings. \n\nThe RSP is a nationalist corpocratic party with a strangely significant liberal wing. The party is captained by Alfred Dregger, a pragmatic yet ambitious veteran. \n\nThe VAAF is a socialist party, something unheard of in Germany just a year before. Led by Günter Grass, an artist by trade, the party seeks a fair and free Germany. If Grass can retain his hold over the VAAF, he may very well achieve it. \n\nFinally there are Die Grünen. A social liberal party concerned with ecology, they are not expected to win a majority in this election, but they may seek a coalition with the RSP should the latter win."
 GER_gfour_intro.10.a:0 "To The Victor"
 GER_gfour_intro.11.t:0 "The NSDAP Wins"
 GER_gfour_intro.11.d:0 "Helmut Goebbels let out a sigh he hadn’t realized he was holding. \n\nHe, his family, and some of his close associates had gathered in the living room, glued to the television as the election results rolled in. Now, at last, his party's victory had been assured — the NSDAP had once again gained a majority in the Reichstag. \n\nIt was 1933 all over again, and he, Helmut Goebbels, had done it. \n\n"Did Papa win?" his youngest asked. \n\nHe smiled and picked his daughter up. "Yes, liebling, Papa won." \n\nHis wife called him over; the phone was already off the hook. \n\nSuch was the burden of the victor, but it was his triumph by blood right. \n\nYes, there was no finer exemplar of the master race than a Goebbels. \n\nHe probably wouldn't repeat that in public. \n\nNo, definitely not. \n\n...And not because it isn't true."
 GER_gfour_intro.11.a:0 "An Aryan Does Not Concern Himself With Lesser Men"
 GER_gfour_intro.12.t:0 "The VUP Wins"
 GER_gfour_intro.12.d:0 "It was nothing short of a miracle. \n\n"Congratulations are called for, I think." It was Norbert Blüm who spoke. "The reins of State are in our hands. Now the Good Work can begin!" \n\nHis former pupil's proclamation was met with cheers. It was an assorted crowd that had gathered in St. Martin's, young and old; poor and prosperous; the powerful and the powerless — but God's children, all of them. \n\nBlüm continued, "Three cheers for Germany! Three cheers for Joseph Ratzinger!" and he was shaken out of his reverie by the crowd's applause. \n\n"No, I have done nothing to deserve praise, I—" \n\n"For God's sake, Joseph!" someone shouted. "It's not a sin to be happy for a moment!" \n\nThe crowd laughed, and he found himself laughing with them. The path ahead was twisted, and there were no guarantees they would succeed, but..."
 GER_gfour_intro.12.a:0 "God Willing..."
 GER_gfour_intro.13.t:0 "The RSP Wins"
 GER_gfour_intro.13.d:0 ""Friends and fellow Germans..." \n\nSoon after the news had come in, Dregger had been quick to arrange a little televised announcement graciously accepting his party's victory. "I am honored to accept the mandate provided by the German people on behalf of all my fellows in the Reichsstaatspartei." \n\nHe paused to let his supporters applaud and cheer before continuing. "But this victory goes beyond petty politics. Our nation has been led to ruin by incompetent and cowardly leadership. This sordid state of affairs shall come to an end, at once." \n\n"No longer shall lesser men choke and feed off of the greatness of the German Volk." \n\n"No longer shall we be led around by political radicals and conmen." \n\n"Today we witness the rise of a greater Germany. A stronger Reich. A more powerful people." \n\n"And I would sooner die than allow our irreplaceable Fatherland to fall into weakness.""
 GER_gfour_intro.13.a:0 "And There Was A Roar Of Approval"
 GER_gfour_intro.14.t:0 "The VAAF Wins"
 GER_gfour_intro.14.d:0 "Herbert Wehner puffed on his pipe as he watched Günter rush out of the room. The man had been beside himself all evening, so he had suggested they sit down and have a private smoke. \n\nThen the news came in that they had won the election, and suddenly Grass was bouncing off the walls again. "Artists..." he muttered to himself. "Not a sane one in the bunch." \n\nThe last man elected to high office was the bastard Hitler. Wehner sighed and took another puff. No doubt he'd be tapped for the position of Reichskanzler. He'd have to keep the pen boy out of trouble. Not that he didn't like him, but Herbert wondered to himself if Günter ever realized how half the country would love nothing more than to gut him. And with him as Fuhrer... \n\nAnother drag, and he coughed. Ah well, he wouldn't be here if he was afraid of a little difficulty. Frankly, he couldn't wait to tear those cretins in the Reichstag a new one. \n\nGrass could speak flowery prose quite well. Wehner had his own mastery of the German language."
 GER_gfour_intro.14.a:0 "He Had A "Colorful" Sense Of Oration"
 ## GER_gfour_election_one ##
 GER_gfour_election_one.1.t:0 "The Unforgettable Duty"
 GER_gfour_election_one.1.d:0 "He wrote by the dim light of a dying lightbulb. Long had he lived in humble circumstances, but he never did complain. \n\nPoverty focused the soul; kept it from worldly distraction. He had dedicated his life to faith in the Lord, and now his faith had been rewarded. \n\nGreat change had come about in his homeland, change he never did think he would see in his lifetime. \n\nThe Gang of Four had done well, but their schemes had fallen short, as do all plots. Now was the time for other men to carry on the torch. Would Joseph Ratzinger be that man? He truly did not know. \n\nBut if God judged him worthy - chose him to lead the world towards heaven, then it would be so. \n\nAnd like that he put down the pen and looked at what he had written. A fine speech for a fine party. The Volksunionspartei would go far, many hoped - no - prayed."
 GER_gfour_election_one.1.a:0 "Hallowed Be Thy Name"
 GER_gfour_election_one.2.t:0 "Risk"
 GER_gfour_election_one.2.d:0 "Alfred Dregger was not afraid of a little danger. \n\nHe had joined the Wehrmacht and fought the Bolsheviks. Five times he was wounded, but he always got back up. After the war, he studied law and formally joined the NSDAP. \n\nPolitics had grown especially Byzantine after the Final Victory. No longer was everyone united in one cause. Cliques formed; schemes and backstabs were common. Yet still, Dregger thrived, made a name for himself, and eventually got into the Reichstag. He even personally met Speer once. \n\nThe NSDAP started to come apart after the Slave Revolt. They managed to halt many of the Gang of Four's more liberal ideas, thank goodness for that, but afterwards everyone was left spinning their wheels. Speer was a defeated man, running on a few last bits of spite. Oberlander knew how to play the game, but he was never going to be the face of the NSDAP, let alone Germany. \n\nDregger might have made a play for power in this listless party, but he had other ideas. \n\nHe, alongside some like-minded party members, split off and formed their own party. \n\nThe Reichsstaatspartei promised prosperity to the people and weapons for the military. They'd managed to get some patrons with pretty deep pockets too; rich men who also loved their nation more than life itself. Even some of the more reasonable reformists had signed onto his cause. Dregger wasn't particularly obsessed with ideological purity.\n\nHis former fellows in the NSDAP cursed him, called him a traitor. But really they were no better than a bunch of Bolsheviks. \n\nA true patriot puts his nation first; doesn't matter what color he wears. \n\nOr what measures he takes."
 GER_gfour_election_one.2.a:0 "No Matter The Cost"
 GER_gfour_election_one.3.t:0 "We're Not Communists!"
 GER_gfour_election_one.3.d:0 "...What sort of slogan is this? \n\nGünter Grass stood in a busy printshop. Usually he was alright with delegating tasks; he trusted his comrades. They had all agreed to print pamphlets to go along with the televised announcement of their new political party. But the pamphlet was something he had not expected. In fact it was downright bizarre. \n\nHe was staring at a freshly printed pamphlet. It depicted idealized factory workers diligently laboring with the logo of the VAAF emblazoned in the background. That part was alright, if a bit cliche, but the text underneath... \n\n"We're Not... Communists? What sort of joke is this?" Grass turned to his companion. \n\nMarcus Wolf looked entirely aloof, his face resting in an all-too-familiar half smile. \n\n"I assure you it is no joke, Herr Grass. The slogan is meant to repudiate slander spread around by the Nazi thugs. The populace is generally unfavorable towards Bolsheviks." \n\n"I hardly think we need to repudiate such lies!" Grass eyed Wolf. He had known the man for a few years; he was Reichsbanner through and through, but his past was a complete mystery. There were rumors he had resided in the Soviet Union before Operation Barbarossa. \n\nWolf adjusted his glasses. "It is an unfortunate reality, Herr Grass, but we must be sure the proletariat knows where we stand - with them." \n\n"And everyone else?" \n\n"Will know that we do not intend to rob them of their comforts. Hence..." \n\n"We're Not Communists?" Grass finished."
 GER_gfour_election_one.3.a:0 ""Exactly""
 GER_gfour_election_one.4.t:0 "Born To It"
 GER_gfour_election_one.4.d:0 "“Brothers and Sisters! Fellow Germans! We stand at a precipice! The Volk have suffered crisis within crisis! We risk losing control over our people’s destiny! Some whisper it is over for us! National Socialism is dead they say!” \n\n“Those who say these things are fools! Is the NSDAP gone? No, we are still here! Did Hitler fail in enacting our will? No we have never been stronger!” \n\n“What do the others offer you? Half-truths! Promises that will never be fulfilled! The Nazi Party has led Germany to greatness! Your greatness! Why settle for less? Why settle for empty dreams and soulless maxims? Victory awaits you! So vote! Vote for the party of the final victory and turn away from whatever foreign-controlled organizations trotted out en masse!” \n\n“The NSDAP keeps the needs of Germany where they belong - without equal!” \n\nThe crowd roared approval as he stepped down from the stage. Support for the NSDAP has always been good in Germania - a mass turnout such as this would make for good optics. “Excellent speech Helmut.” \n\nHelmut Goebbels smiled and shook the hands of Otto Ernst Remer, “It was good enough. I’ll never be able to tongue-waggle like my father.” \n\n“Ah there’s more to politics than just talk – speaking of, I’ve just gotten word from Oberlander. He’s managed to bring the party over to our side. In a few days you’ll be officially confirmed as our candidate for the Fuhrership.” \n\nGoebbels smiled inwardly, “I am... deeply honored, though I feel sincerely unworthy for the task.” \n\n“Spare me the humility Helmut!” Remer laughed, “You want to be Fuhrer more than a fish craves water!” \n\nGoebbels gave a crooked smile and shrugged, “I am simply practicing the acceptance speech Otto.”"
 GER_gfour_election_one.4.a:0 ""Now Let's Grab A Drink. I'm Thirsty""
 GER_gfour_election_one.5.t:0 "My Name"
 GER_gfour_election_one.5.d:0 "My name is Baldur Springmann. \n\nYou do not know who I am. You may never know. Do you wish to know my name? \n\nMy name is Baldur Springmann. \n\nI love the Earth more then anything. Too long has it been drowned in trash and choked by smog. How can we treat our home this way? \n\nMy name is Baldur Springmann. \n\nIt will be different. It will change. The biosphere can be restored to beauty. I know it can be done. I have already seen it. \n\nMy name is Baldur Springmann. \n\nI just need your help. I need you to remember my name. What I stand for. What I can do for Germany. The World. \n\nMy name is Baldur Springmann. \n\nRemember it well. \n\nMy name is Baldur Springmann. \n\nWhat I can do for you."
 GER_gfour_election_one.5.a:0 "I Will Be Of Use"
 GER_gfour_election_one.6.t:0 "Hapsburg's Request"
 GER_gfour_election_one.6.d:0 "To whom it may concern. \n\nIt is no secret that the former regime was hostile towards my person given my continued commitment to Austria. I have never aimed to break the unity of the German people, but I always was of the belief that they deserved a civilized and righteous government. \n\nNow I believe that this is now possible. Henceforth, I wish to return to my homeland, as is my right as a fellow German. I do not aim to bring about political upheaval rather I wish to assist the new leaders of Germany in their quest to restore our beloved Fatherland to its proper place. \n\nAs such, rest assured that I do not intend that I use my claims and titles to harass or otherwise cause trouble for your government. Nor to agitate among Germany's allies and friends. \n\nSigned Otto von Hapsburg."
 GER_gfour_election_one.6.a:0 "Bring Him Home!"
 GER_gfour_election_one.6.b:0 "He Must Renounce His Claims First"
 GER_gfour_election_one.6.c:0 "Keep Him Out!"
 GER_gfour_election_one.7.t:0 "The Working German"
 GER_gfour_election_one.7.d:0 ""Hans?" \n\nNo response. \n\nLudwig tried again, "Hans?" \n\n"Will you shut up for crying out loud?" Hans rolled himself out from the incomplete Volkswagen. He grunted as the younger man came into view. The boy was honest enough, though slow on the uptake, Hans found. \n\nHe scowled, "I am trying to work you dolt, what do you want?" \n\nLudwig beamed, "I was wondering if you were going to join the VAAF meeting today. You really should come I think you will-" \n\n"What the hell is a 'vauf'? Some sort of animal? \n\n"No it stand for Volks-" \n\n"I don't care what it stands for! Why should I care about it?" \n\nLudwig's idiot grin never dropped from his face. Hans admired the younger man's eternal optimism to some extent, but damn did it piss him off most of the time. \n\n"It's a new political party!" Ludwig announced, "They intend to put the working man first and foremost. We'll get more negotiating power, more safety regulations, more- \n\nHans sensed that Ludwig would just go on and on. He had to come up with a response that would shut up Ludwig, otherwise he'd never get any work done at this rate."
 GER_gfour_election_one.7.a:0 ""The NSDAP and VUP Promise The Same Thing You Know...""
 GER_gfour_election_one.7.b:0 ""Ok. Ok. I'll Come""
 GER_gfour_election_one.8.t:0 "Money Money Money"
 GER_gfour_election_one.8.d:0 "Hustle and bustle! It never ended in the city of Frankfurt! The walkways of Goethestraße were no different but here there was some upper class dignity to the clamour. Wives of rich men chattering amongst themselves and dragging along bored children. Young couples with more money to spare and youth to burn. Ernst loved this place. He owned a "small corner store" on the entrance from Goetheplatz. It was his pride and joy and the source of his prosperity. \n\nAs he sent his employees home for the night and closed up shop he considered the events of the past of the few months. His beloved store had been damaged by ruffians of Slavic persuasion during "that unpleasantness" surrounding the slave uprising and the military revolt in Muscowien. He had rebuilt, no issue there, but now the entire German government had come apart and fractured into nascent political parties. Why, earlier that day had his security men chase away some plebians putting up posters outside his store! He then noticed one of the posters discarded in the trash. He squinted his eyes and read the text blazoned across it. \n\nGERMANY STRONG AND WEALTHY \n\nVOTE REICHSSTAATSPARTEI \n\nHe had heard of that particular party several times before now among the chatter of his patrons. Apparently they had the backing of major bankers and industrialists. He thought their platform was too narrow to win a majority, but with backing like that, maybe they could do it?"
 GER_gfour_election_one.8.a:0 "Always Sunny"
 GER_gfour_election_one.8.b:0 "But Money Can't Buy Everything"
 GER_gfour_election_one.9.t:0 "Goebbels On Campaign"
 GER_gfour_election_one.9.d:0 "Helmut Goebbels grimaced. Calling home always carried great risk. Tap Tap Tap went his foot. It seemed an age before the other end picked up. \n\n"Hello?" Goebbels breathed a sigh of relief, it was his wife. "Hullo starling, is my mother there?" \n\n"She's with the children upstairs, want me to fetch her?" \n\nGoebbels leapt out of his chair. "NO! Have some sense woman! Don't bring the old bat upon me if we can avoid it!" \n\nHis wife giggled, "It's not fair you know... you get to tour the Reich and I am stuck with her! You had better come home soon! \n\nIn a tone of mock sternness Helmut addressed his wife, "Silly woman. If it were not for my efforts, we would soon be ruled by American puppets and communists. Have you no care for our irreplaceable Fatherland?" \n\n"I'd rather my husband be here to help me with the 7 children he has saddled me with. But I am not joking Helmut - come home soon. Fuhrer or no Fuhrer you'll always be my husband." \n\nGoebbels smiled despite himself, "And soon my starling you'll be the wife of the Fuhrer. Now. I have to go now, but I will call you again tomorrow -and I should be back home before the polls open. At the latest." \n\n"Goodbye Helmut. Call earlier next time. The children want to talk to their father as well.""
 GER_gfour_election_one.9.a:0 "*Click*"
 GER_gfour_election_one.10.t:0 "The Others"
 GER_gfour_election_one.10.d:0 "As Petr was walking home from university, he saw a tall man shouting, handing out flyers to passersby and shouting something about "moral governance" in German. \n\nPetr tried to walk straight past but their eyes must have met because the man marched right up to him. \n\n"Hullo young man!" he spoke in garbled Czech, "Vould you like to save Bohemen?" He held out a flyer, a picture of a man Petr may have recognized, emblazoned with German and - surprisingly enough - Czech text. In both languages it read: \n\nJOSEPH RATZINGER PROMISES A FUTURE. WILL YOU STAND WITH HIM? \n\nPetr held up his hand. "I really can't-" \n\n"ENOUGH OF THAT!" Petr and the tall German turned to see a small man, another German Petr guessed, running up to them. He pointed at the tall man and addressed Petr, "Ratzinger is a dumbkoff! Ve fought in ze Reichsbanner. He stayed home. Zis is true, yes?" \n\nThe tall man shook his head, "Mein friend. Who do you support then? Who else do you consider better choice than Herr Ratzinger?" \n\nThe short man put his fist in his hand. "Herr Grass of course! He is a man of action! He vill lead Germany to a greater future vor all!" \n\n"Pah! Grass? He vould prance us into hell!" the tall man turned to Petr, "but vhat do you think mein friend? Vould you rather vote for Ratzinger or..." \n\n"Grass!" the short man finished. \n\nPetr sighed inwardly. He had to give an answer, otherwise these two Nazistniem would never leave him alone."
 GER_gfour_election_one.10.a:0 "...Ratzinger"
 GER_gfour_election_one.10.b:0 "...Grass"
 ## GER_gfour_election_two ##
 GER_gfour_election_two.1.t:0 "The Second Election"
 GER_gfour_election_two.1.d:0 "For the second time in recent memory, the citizens of the Reich once more head to the polls. I myself have already cast my vote for the party of my choice. \n\nWho did I vote for? That hardly matters, does it? \n\nOne vote among many, that's the nature of the vote. It's not the individual who decides but the mass. If I knew, I'd tell you, but maybe you know better than I already. \n\nBut regardless, I appreciate that you stopped by to talk. You must be busy, with many important matters, no doubt. You deal with the mass, greater than a little person such as myself. \n\nCan you stay a little while longer? We can talk while we wait for the results to come in. \n\nI'll buy you a beer even, if you'd like."
 GER_gfour_election_two.1.a:0 "And The Winner Is..."
 GER_gfour_election_two.2.t:0 "The NSDAP Wins!"
 GER_gfour_election_two.2.d:0 "Goebbels smiled to himself. Victory had come into his grasp as naturally as rain falls from the sky. \n\nHe had not bothered to leave his office to join the ongoing celebrations. He would grace the people with his presence; for now, he worked on his magnum opus. \n\nAs mighty Adolf Hitler had his Mein Kampf, so would Goebbels have his own masterwork, worthy of his title as Fuhrer. \n\nWhy should he hurry? The time would move to his whim, the volk to his orders. That is the meaning of the title Fuhrer. The Fuhrer, you see, is free. Free from God. Free from the masses. \n\nThat is why he won. That's why he'll always win."
 GER_gfour_election_two.2.a:0 "Because He Is Free"
 GER_gfour_election_two.3.t:0 "The VUP Wins!"
 GER_gfour_election_two.3.d:0 "There had been much rejoicing and the party had gone long into the night. Ratzinger's position meant he couldn't retire early, as a constant stream of well wishers came by to offer their congratulations. \n\nHe accepted their words with gracious thanks, but when he had a spare moment he slipped through the crowd to see Karl Arnold, his Reichskanzler and good friend. \n\n"Herr Arnold," he smiled, "are you enjoying the festivities?" \n\nArnold, staring at the ground from his seat, looked up and offered a weak smile. "As much as I can these days, but I am glad you came to see me." \n\n"I would never ignore you, Karl, and you know-" \n\nArnold shook his head. "No- listen, Joseph. I feel my age catching up on me, and I feel Liesel calling me from heaven," his beloved wife had died a few years ago, "I think I will be joining the Lord soon. You may have to start considering a replacement for me." \n\nRatzinger paused. Karl was growing old, but he had never once dared to suggest replacing him; even thinking about it hurt, for the unpleasant implications. "Certainly, you still have-" \n\n"I insist, mein Fuhrer. It is time someone younger took the role of your second." \n\n"Who could replace you?" Ratzinger suddenly felt helpless, helpless as when he was a child. Helpless when they harassed his family for his father's defiance. \n\n"You will find someone, I have faith in you." \n\n"Then at least offer a few candidates. I would like your input." \n\nKarl Arnold's smile widened."
 GER_gfour_election_two.3.a:0 ""This- This I Can Do""
 GER_gfour_election_two.4.t:0 "The RSP Wins!"
 GER_gfour_election_two.4.d:0 "Another fine victory for Alfred Dregger. \n\nI'm watching him as he weaves through the crowd, receiving praise he clearly loves to hear. Not a humble man, this Dregger, but few are in this country. \n\nI see he's rather pleased with himself, and why shouldn't he be? He is the most powerful man in the Fatherland. That's not something to scoff at. \n\nI've seen men like him before - men of high ambition. Ambition is poison, I was once told, and I have seen many like him fall. But I have also seen them succeed and prosper. \n\nI wonder what his fate will be, but I am sure you know better than me. \n\nWell, he's coming my way. Better offer my congrats."
 GER_gfour_election_two.4.a:0 "To The Victor"
 GER_gfour_election_two.5.t:0 "The VAAF Wins!"
 GER_gfour_election_two.5.d:0 "Gunter Grass breathed a sigh of relief as the crowd roared in approval. \n\nThis would be the last time he ran for office, he swore to himself, as the celebration started. They'd been glued to the television for five hours watching the election results come in. Then, just then, the VAAF was confirmed to be the largest party in the Reichstag, and now there were festivities and laughing and congratulations. To go from one extreme to the other, from nervous silence to joyous triumph. It'd frayed his nerves, to be honest, but it was exciting at the same time. \n\nWell, soon this would be over and it'd be back to the boring hard work of saving Germany. \n\nMaybe that's why nobody ever really tried before him and his comrades. It was not hatred that bred evil in the end."
 GER_gfour_election_two.5.a:0 "But Apathy"
 GER_gfour_election_two.6.t:0 "The VAAF Seizes Control!"
 GER_gfour_election_two.6.d:0 "TRAIN \n\nGAMMA \n\nCRYPT \n\nCareful planning has paid off. Years of gambles and schemes have led to this moment. \n\nThe fascists have played into our hand. So have their liberal counterparts. \n\nTRAIN \n\nGAMMA \n\nCRYPT \n\nThere is much danger still present. The reactionary and nazi political parties will no doubt stand in opposition. \n\nTRAIN \n\nGAMMA \n\nCRYPT \n\nMore worrying, the Wehrmacht will likely jump on us at the first opportunity. \n\nGAMMA \n\nCRYPT \n\nBut failure is not an option and I will not despair. I shed no tears when Leningrad fell, nor did I sob when Moscow fell. \n\nTRAIN \n\nGAMMA \n\nCRYPT \n\nWe will not fail this time. \n\nTRAIN \n\nGAMMA \n\nCRYPT"
 GER_gfour_election_two.6.a:0 "Seize The Day"
 GER_gfour_election_two.7.t:0 "Die Grünen Breaks Through!"
 GER_gfour_election_two.7.d:0 ""ROSSMANN! ROSSMAAAAANNNNNN!!!" \n\n"WHAT THE HELL IS IT AARON?!" \n\n"BOSS WANTS TO SEE YOU!" \n\n"WHY!?" \n\n"I DUNNO GET OVER HERE!" \n\nRossmann left his easel and stomped down the hall. Politics paid better than drawing postcards, and it was more fun, but God, was Aaron an idiot he never liked seeing. Well, that and sometimes the boss got angry with him for reasons... \n\nRossmann slid into the office. Springmann looked unhappy for a man who had just won the greatest political victory of his life. As soon as he saw Rossmann, he scowled and then threw a crumpled piece of paper at him. \n\n"What the hell is this, Rossmann? What the hell do I pay you for when all you do is mock me?" \n\n"Woah, what's the problem boss?" \n\n"You tell me!" he pointed at the paper on the floor, "Your artistry was always too avant-garde, but now you've gone full degenerate!" \n\nRossmann bent down and uncrumpled the offending item. He frowned, "What's wrong with it?" \n\n"What's wrong with it? What's wrong with it!? I asked you to design a new logo for our national revival initiative!" he exhaled deeply, "I DID NOT ASK YOU TO DRAW A CAT DRESSED IN THIGH HIGHS AND STILETTOS." \n\nRossmann suddenly felt strangely unsafe. "Well- sir, you did ask for something eye-catching. Is it the bust? I can make it smaller if you-" \n\n"YOU ARE DEAD.""
 GER_gfour_election_two.7.a:0 "YOU ARE ALL DEAD"
 GER_gfour_election_two.8.t:0 "The Russian Menace: A Reichs-Rundfunk-Gesellschaft Segment"
 GER_gfour_election_two.8.d:0 "...And tonight we are joined by a special guest, Herbet Wittelracht. He is a professor from the University of Vienna specializing in diplomacy and foreign affairs. Thank you for joining us, Professor! \n\nIt is a pleasure to be here. \n\nNow, Professor, many Germans are worried about [RUS.GetNameDef], which has been more and more aggressive on the Muscowien border. Can you enlighten us on their aggression? \n\nWell, the current Russian government has very much made it clear they would like to expand eastwards, but they have not made the exact extent of their claims clear. My colleagues and I believe they wish to annex the Muscowien region, but some think they might try and take more than that. \n\nHow shocking! Why would the Russians want to invade our eastern allies? \n\nYou see, there are many Russians still living within the Unity-Pakt, and historically Russian territory has extended far into the east. \n\nI see. Is the Wehrmacht equipped to stop them if the worst comes? \n\nThat depends on the strategy of the Wehrmacht. \n\nOh? What do you mean, Professor? \n\nWell, it is my belief..."
 GER_gfour_election_two.8.a:0 "...Adopting An Aggressive Approach Will Deter Invasion"
 GER_gfour_election_two.8.b:0 "...Adopting A Defensive Posture Will Facilitate Strategic Superiority"
 GER_gfour_election_two.9.t:0 "The Economy In Question"
 GER_gfour_election_two.9.d:0 "Taxes were never Dietmar's favorite. \n\nHe had two little ones and a wife to feed. What the hell did the government need his money for anyhow? They still hadn't fixed the pothole outside! \n\n"Dear, you've been staring at those forms for the past hour," there was a touch of concern in his wife's voice, "do you need help with them?" \n\n"No! No. It's just — these taxes are nonsense." He thought for a beat. "No, they're oppressive. We'd all have more money if the taxes were lower." \n\nHis wife huffed and rolled her eyes. "I'd prefer if the household loans were more generous." \n\n"Foolish woman, they'd use that as an excuse to raise taxes!" \n\nShe sighed and shook her head. "If it hadn't been for state subsidies for the children, we wouldn't be able to afford this house, you dummkopf! Now hurry up and write those tax forms. I'm not having our accounts audited because you suddenly decided to become a revolutionary!" \n\nShe left Dietmar alone. He grumbled, but perhaps his wife had a point..."
 GER_gfour_election_two.9.a:0 "No! Taxes Must Die!"
 GER_gfour_election_two.9.b:0 "Yes! Taxes All The Way!"
 GER_gfour_election_two.9.c:0 "Maybe There's A Middle Ground?"
 GER_gfour_election_two.10.t:0 "What Of Them?"
 GER_gfour_election_two.10.d:0 ""You know, Willi?" \n\n"Yeah?" \n\nThe two friends were having a smoke in the dorm. Today's physiology lecture probably wasn't that important anyway. \n\nEmil sniffed and spat. "You know that cute girl from our philosophy class? Blonde hair, nice curves?" \n\n"Yeah, I know the one." Willi put his magazine away. "Did you manage to find your balls and ask her out?" \n\n"About that — I was talking to her yesterday, and she told me her parents are Dutch!" \n\nWilli frowned. "So? It's not like the Dutch are so different from Germans anyway." He scratched his chin. "I suppose if she were some sort of Slav, that'd be a problem... then again, my brother did bring home this Slovenian that's steaming hot —" \n\n"You don't get it — she's Dutch!" \n\n"Ok?" \n\nLike a marionette tied to strings, Emil shot out of his chair. "Never in the world has such an evil people existed, Willi! Conmen and prostitutes all of them! It would be better if the lowlands sank into the sea and into hell where they belong!" He waved his hands in imitation of the first Fuhrer. "I have never met an honorable Dutchman. We should have annihilated their horrible nation long ago! Germany should not suffer lesser races, especially those from Amsterdam!" \n\nWilli blinked. He had no idea that Emil hated the Dutch so much. Hair off a Russian's ass, he was shaking even! \n\nHe had to choose his next words carefully. On the other hand, he was tempted to see how far Emil would go."
 GER_gfour_election_two.10.a:0 ""But Willi, The Dutch Are Our Friends!""
 GER_gfour_election_two.10.b:0 ""Oh... Ok I Guess I See your View...""
 GER_gfour_election_two.11.t:0 "Germany of Today, Germany of Yesterday, Germany of Tomorrow"
 GER_gfour_election_two.11.d:0 "Thomas frowned and flipped to the next page. He had never read a more flowery and long-winded book. That's what he got for buying a book on "modern political theory" he considered \n\nCHAPTER 11 FACILITIES OF CHRONOLOGICAL REITERATION \n\nIT IS THE CONCEPTUAL CRYSTALLIZATION THE INDIVIDUAL WHO WOULD UTILIZE THE PERSONAL PRONOUN TO REFER TO SELF, IN BASIC TERMS, MYSELF, THAT THE CYCLICAL NATURE OF HISTORY LEADS TO THE PRECLUSION OF TRULY NOVEL CONCEPTS. \n\nTHE NATION-STATE OF THE GERMANIC PEOPLES IS CONFRONTED WITH A SINGULAR INSTANCE OF THIS NIGH-METAPHYSICAL PSYCHOSOCIAL CONCEPT. \n\nTHE FUHRERCRATOCRATIC REICH POSSESSES A TRIMER OF POTENTIAL CONDUCTIVE SURFACES ON WHICH TO PROGRESS. \n\nTHESE ARE OF UNCONVOLUTED NATURE. \n\nTHE GOSPELS OF THE FOUR EVANGELISTS. GENESIS. REVELATION. FOR THESE ARE THE LINGUISTIC ORTHOLOGUES OF- \n\nThomas put the book down. What the hell was he reading? The Four Apostles? Genesis? Revelation? What?"
 GER_gfour_election_two.11.a:0 "Well Obviously The Gospels Refer To..."
 GER_gfour_election_two.11.b:0 "Revelation Obviously Indicates..."
 GER_gfour_election_two.11.c:0 "Genesis Tells Us That..."
 GER_gfour_election_two.12.t:0 "What Is A Democracy?"
 GER_gfour_election_two.12.d:0 "I have voted many times since I was young. It's a simple thing really. You take a piece of paper, check a name, and put the paper in the box. \n\nIn America, or so I am told, the act of voting is sacred. Like a catholic attending mass, the american believes he has come into contact with something divine, simply by voting. They wear pin declaring they voted, to inform everyone how devout they are. \n\nIn Germany we believe in no such thing, becuase we have vote many times since we were young. You can vote a thousand times and nothing may change. The ballot box might as well be a bottomless pit and the results would stay the same. A few times, I remember, they were would be only one name on the ballot, but what difference did it make if there was one or two? \n\nI remember when I has young, my friends and I vote for the SPD three times within seven months. Supposedly those were when elections "really mattered". Did I not vote hard enough then? Was it my fault? I voted! \n\nNow many german youths have learned what we "old fogeys" have known for a long time. Even if your preffered party or canidate wins the day, who is his master? You? No, the Fuhrer is manster to no one but himself. Maybe it is better this way, that he is free from the petty and fickleminded mob. Or maybe it is worse, and we are enslaved to a tyrant. \n\nYet still we vote, as we are demanded to do so. \n\nAnd So It Is."
 GER_gfour_election_two.12.a:0 "It Does Not Have To Be This Way"
 GER_gfour_election_two.12.b:0 "Heil The Fuhrer"
 GER_gfour_election_two.12.c:0 "Freedom Will Come Whether You Want It Or Not"
 GER_gfour_election_two.13.t:0 "Across The C"
 GER_gfour_election_two.13.d:0 "Christoph struggled with his exam. He hated history class and the instructor was a real stickler for details! Worst of all, this was worth half his grade. If he didn't at least get a 3 his parents would kill him! \n\nLike this next question, how dumb is this? \n\nQ6 GERMANY HAS HAD MULTIPLE DIPLOMATIC APPROACHES TO EXTRA CONTINENTAL PEER POWERS. DECLARE AND DESCRIBE ONE. \n\nHe didn't remember his instructor ever mentioning something like this! \n\nHe had to think fast and put something down, how does Germany approach countries from other continents? \n\n"Well I guess we fight wars with them," he thought. \n\nOk that was one, but he might get marks off for being lazy. What's something else? Well making alliances with them, and maybe ignoring them more or less? Well that's three options he could write, but what should he base his answer off of?"
 GER_gfour_election_two.13.a:0 "The Indifference!"
 GER_gfour_election_two.13.b:0 "The Alliance!"
 GER_gfour_election_two.13.c:0 "The Wars!"
 ## GER_gfour_bombers_spring ##
 GER_gfour_bombers_spring.1.t:0 "I Have Never Forgotten You"
 GER_gfour_bombers_spring.1.d:0 "It smelled like 100 years of cigarette smoke. \n\nThe bunker had been built during the time of Marshal Józef Piłsudski. It was a shame he did not live just a few years longer. Perhaps he might have been able to beat back the invader. \n\nBut that was a possibility long gone. Now was reality. Wojciech Jaruzelski looked to his left and then his right. Facing him were men from all across the German-occupied territories. This was not simply a Polish struggle; it wasn't something any one people could win alone. The slave uprisings had taught them that. \n\nHe took a deep breath and addressed his new comrades. "The sacrifices made have won us much! The NSDAP has been weakened! But is this enough? I am afraid it is not." \n\n"The new political system which the Germans have devised still concentrates power in the hands of the German occupier! The VAAF and VUP may pay us lip-service, but they are still German through and through. If we are to ever win freedom, we must seize it ourselves, for no other will give it to us." \n\n"Hence I now formally declare the formation of a new political party. In their tongue, Liga der entzogenen Rechte - the League of Rights Deprived. We will work within their government and without to secure our freedoms. Party lists will be drawn up and voted for. Paramilitaries will be organized and trained under central leadership. \n\nSome of you may find this humiliating, that we must dance to their songs and their flawed democracy, but through this method shall we gain the liberties that were stripped from us over 40 years ago!" \n\n"Three cheers for the league!" his brothers in arms shouted."
 GER_gfour_bombers_spring.1.a:0 "And So It Begins Anew"
 GER_gfour_bombers_spring.2.t:0 "A New Front"
 GER_gfour_bombers_spring.2.d:0 "Was there anything more beautiful in the world than a case full of Reichsmarks? \n\nManfred Roeder didn’t think so. \n\nThe young man who brought him this gift saluted stiffly. "The Reichsfuhrer sees great promise in your organization. He offers these funds as a token of his support, and furthermore I have been instructed to assist you in any way possible." \n\nRoeder scratched his chin thoughtfully. "If you are so eager to assist, there has been one matter that has been troubling us as of late." \n\n"Oh, whatever it is, I am ready to assist. Any impediment to the Master Race must be removed with all due haste!" He slammed his fist into his palm for emphasis. \n\nRoeder reached down under the table and pulled out a big stack of papers. "Here are some applications I want you to fill out. The Strasbourg municipality is rather keen on proper paperwork for political rallies." The young SS agent blinked. Roeder continued to smile — poor kid probably thought he'd be storming the Reichstag by now. "It's for the good of the Germanic race." He rose and patted his new ally on the back. "Don't worry, friend!""
 GER_gfour_bombers_spring.2.a:0 ""There Will Be Plenty Of Fighting Later""
 GER_gfour_bombers_spring.3.t:0 "What Do You See?"
 GER_gfour_bombers_spring.3.d:0 "It takes time to plan these things. \n\nWe are numerous and our will is unmatched. \n\nThe Reich has weakened itself and returned to degenerate ochlocracy. Their "intelligence" agencies are preoccupied with our proxies. \n\nThey will serve their purpose in time, but they are not what the fallen Reich should be looking for. \n\nI have blueprints for my target and about 100 kilos of hexotol stashed in a storeroom near the suburbs. \n\nAnd when the allotted time comes — well, you'll know."
 GER_gfour_bombers_spring.3.a:0 "Count Down The Days"
 GER_gfour_bombers_spring.4.t:0 "A Big Day"
 GER_gfour_bombers_spring.4.d:0 "Prague was a noisy city, but really, this was too much, the policeman thought. \n\nIt was perhaps the clearest victory for German assimilation in the last decade, but the Czechs were always a stalwart sort of folk. If they weren't, then everyone in Bohemia would have been speaking German centuries ago. There was something respectable in that, if only it did not cause so much trouble. \n\nThe city was politically split between the NSDAP, generally supported by the German population, and the VAAF, backed by the Czechs. The present Gauleiter was an independent, but he leaned towards the NSDAP and unofficially pressed the police to side with them when hooligans from both sides would get into brawls. \n\nThat was the status quo for a few years, but things had taken a turn for the worse in the last year or so, and strangely, it was neither the VAAF's nor the NSDAP's fault. \n\nA new political party popped up, the so-called "League of Rights Deprived". They promised freedoms and prosperity to all non-Germans and managed to draw a good number of Czechs into their ranks. Rumor had it they also had a paramilitary component, though the policeman had not yet found direct evidence of it. If it had just been them, that probably would have been the end of it, but there arose a second political party. Almost to spite them, the German Aryan Party considered even the NSDAP too lenient on the non-German population and rallied support from the extreme and the dissatisfied, including those in Prague. Now there had been rallies and counter-rallies non-stop in the city, paralyzing large portions of the metropolis. According to the news, similar events were taking place all across German cities. \n\nThe policeman hoped things would burn out before anything drastic happened."
 GER_gfour_bombers_spring.4.a:0 "One Can Dream"
 GER_gfour_bombers_spring.5.t:0 "A Big Fight"
 GER_gfour_bombers_spring.5.d:0 "Deutscher Verlag Morning Edition \n\nChaos reigns in Germania! Rallies in Kreuzberg have morphed into riots as armed thugs of the DAP and LER clash in the streets! \n\nHome to a significant population of Slavs, the district has been the site of fervent activity by members of the LER party. "We have people here who are starving," said one member under conditions of anonymity. "The Volkshalle is a few blocks away. The government can spare all the money they have to keep that building up, but not a mark for the people here!" \n\nThe LER rallies have drawn attention from the DAP, who have been supported by many dissatisfied with the state of the NSDAP. Local police have struggled to contain the riots, and there are reports the ORPO has been called in to restore order. Neither has responded to interview requests. \n\nWith similar scenes playing out across multiple cities, including Prague, Danzig, Luxembourg, and Cologne, many have started to question the government's ability to maintain control over the situation. Many members of the ruling party have made declarations stating that this is only a temporary situation and will be resolved soon."
 GER_gfour_bombers_spring.5.a:0 "One Can Hope"
 GER_gfour_bombers_spring.6.t:0 "It All Starts Again"
 GER_gfour_bombers_spring.6.d:0 "Wojtek really didn't know what happened. One moment there was shouting and fistfights, the next there was gunfire and panic. \n\nAnd yet — everything was so quiet to him. Who shot whom? Did the DAP shoot them? It had to be them, but who was shot? \n\nOh, here's his friend now — was he always so tall? Was he always so red? \n\nHis friend was saying something. Wojtek couldn't hear him. \n\nAll he really wanted now was some sleep, just to rest for a few moments... \n\n... \n\n..."
 GER_gfour_bombers_spring.6.a:0 "Blood On Soil"
 GER_gfour_bombers_spring.7.t:0 "20 Minutes Is All That's Needed"
 GER_gfour_bombers_spring.7.d:0 "Events are proceeding as planned. \n\nThe untermenschen LER and idiot DAP are at loggerheads, escalating after a massacre no one knows who perpetrated. \n\nCity centers are riven with shootouts and riots. The ORPO is stretched thin; the government is paralyzed. \n\nOur moment has arrived. The signal has been given, and all across the fallen Reich fellow agents are carrying out the designated task set out for us by the Reichsfuhrer. Some of us arrived here a few years ago; others have been waiting for over a decade. And yet we are all united in purpose in this moment. \n\nThree others and I have set charges in a prominent building here in Germania. A gap in security has been ensured by another agent — it lasts only a few hours, but that's all we needed. \n\nThe charges are set, and there is nothing that they can do. \n\nWhile they face the fights on the street, the world will crumble behind them."
 GER_gfour_bombers_spring.7.a:0 "It's Time"
 GER_gfour_bombers_spring.8.t:0 "Goodbye Germany!"
 GER_gfour_bombers_spring.8.d:0 "First bombs to detonate were in the headquarters of Norddeutsche Rundfunk AG. The blast occurred at approximately 0917 hours, when many of the radio company's workers were in their offices. Casualties are still being counted. Simultaneously, about two minutes after the Norddeutsche bombing, another set of bombs went off on the recently constructed Köhlbrandbrücke bridge. A massive hole was blasted in the road, forcing closure to all traffic. \n\nFollowing these bombings, at 0924 hours, a set of bombs went off in the Stephansdom, Schönbrunn Palace, and Heldenplatz. At least 200 are dead, with many more injured. That number will likely increase as further casualties are confirmed. \n\nAbout six minutes later, at 0930 hours, multiple explosives were detonated in a four-minute window. The Frankfurt Stock Exchange, Frankfurter Bank, and IG Farben Building were all attacked. The local economy has already been paralyzed, and the Stock Exchange has been forced to close. \n\nIn Königsberg at roughly 0945, the Königsberg Castle, Albertina University, Königsberger Hauptbahnhof railway station, and Tannenberg Memorial all suffered attacks. Mass damage and casualties reported. \n\nFinally, at 0953, suspicious individuals were spotted near the Volkshalle by security guards on high alert. ORPO units engaged and discovered that a large tunnel had been constructed, ending in a large amount of plastic explosives located under the Volkshalle dome. Bombs were successfully disposed of. Five ORPO officers wounded. All suspects killed by officers or dead via suicide. Identities are yet to be confirmed. \n\nPerpetrators are unknown. No responsibility has been taken for the terrorist actions. Ongoing riots continue to escalate. DAP has accused LER of perpetrating the attacks. Mobs growing in size. \n\nImmediate action required."
 GER_gfour_bombers_spring.8.a:0 "This Is A Dark Day!"
 GER_gfour_bombers_spring.9.t:0 "Purity At All Costs"
 GER_gfour_bombers_spring.9.d:0 "It was a good day. \n\nThe bombing spree had energized his party from a fringe group to a power player in German politics. Thinking quickly, he had pinned the attacks on the LER — many of the targets were German cultural sites, after all. \n\nThe apathetic masses were now shouting DAP slogans, and his people were taking the fight directly to the untermenschen. \n\nNo doubt the Fuhrer would be angry with him, but even if he had to watch his back from now on, what could he do? Manfred Roeder was a good German taking the fight to the ungratefuls — was that a crime? \n\nAnd if it was, then why was the whole war fought, and millions sacrificed? No, old [GER.GetLeader] would have to satisfy himself with putting out fires; no doubt he was still busy with the bombing attacks ongoing even now. But until this crisis was resolved, Roeder intended to make the most of it. \n\nOne day, he could be Fuhrer as well. \n\nNow he just had to seize it. City centers would be seized by DAP paramilitaries. He would crush opposition and make himself unignorable to the Reichstag. Elections would come, but even before then they'd have to turn to him. \n\nThey'd have to give him what he wanted."
 GER_gfour_bombers_spring.9.a:0 "Chaos Is Opportunity"
 GER_gfour_bombers_spring.10.t:0 "Whatever It Takes To Be Free"
 GER_gfour_bombers_spring.10.d:0 "Wojciech Jaruzelski and his comrades had to be cautious. \n\nThey would meet in secret, never the same place twice. \n\nThe authorities were looking to crack down, and if it wasn't the government that arrested them, it'd be the DAP or some other madmen who would assassinate them. \n\nThe snakes had blamed them for the terrorist attacks, but what did he have to gain by committing such atrocities? Did they think he and his fellows were animals like them? \n\nThe rumor was even that the culprits were of German blood. Perhaps the DAP had carried out the attacks, but he didn't think they had the organization for that. It was too precise, and from what he could tell Roeder and his goons were not the precision-minded sort. \n\nIt was a townhouse they had gathered in this night, located in a quiet suburb in Luxembourg. "I don't like this meeting place," murmured Jacek Kuroń. "It's too close to the Burgundian border. If those spooks find out we are here —" \n\n"— The Germans keep a close eye on the border, and Himmler knows this. There will be no SS kill teams tonight." \n\n"Besides," he continued, "they will be looking for us in Polska and Czechia. All the better — it is time we paid more respect to our Luxembourgish brothers." He gestured to Pierre Werner as he said this. \n\nThe Luxembourg native smiled appreciatively. "I assure you we are quite safe, Mr. Kuroń. I have many friends here in the resistance and the government, and I assure you there is no better place to gather." \n\nVáclav Havel grinned. "I hear Palermo is nice this time of year." \n\n"Vacations aside, I think we are at a crossroads, gentlemen," Bronisław Geremek spoke as the other four men turned to him. "The situation has developed much faster than any one of us anticipated. This is both good and bad. Good because we can finally press the issue of our equality, and —" \n\nJaruzelski finished for him, "— and bad because we risk losing everything we have built up." \n\n"But we cannot back down now. If we do nothing, we will be destroyed. We must force the Reich's hand and make it so they can never oppress us again!" \n\nThe others nodded in assent. There was no going back now."
 GER_gfour_bombers_spring.10.a:0 "Death Before Dishonour"
 GER_gfour_bombers_spring.11.t:0 "Brawl In Posen!"
 GER_gfour_bombers_spring.11.d:0 "Posen, or as it was known to the Polish inhabitants, Poznan, had passed to and fro between Polish and German control. Previously it had been considered a success for the Reich — heavily Germanized with new settlers and returnees. \n\nThis was an overly optimistic assessment. \n\nPosen is burning. \n\nThe German population has been whipped into a frenzy; the DAP has sunk its claws deep here and found ample recruits for its movement. The LER, too, has not been idle, and its own men have been equally belligerent. \n\nThe Wehrmacht had been called in to assist, though even with their guns backing up the stretched ORPO and the exhausted municipal police, the fighting continued. \n\nSeemingly random shootings abounded; bombs, so hatefully used on the Day of Bombs, were used as well. \n\nArson, lynching — this guerrilla war continued unabated until one faction was driven fully out of the city. \n\nOnly when the dust settled could the victor be confirmed..."
 GER_gfour_bombers_spring.11.a:0 "The LER Seizes the City!"
 GER_gfour_bombers_spring.11.b:0 "The DAP Takes Root!"
 GER_gfour_bombers_spring.12.t:0 "Mayhem In Prague!"
 GER_gfour_bombers_spring.12.d:0 "Prague, beautiful Prague. \n\nI think you were too proud to accept any master other than of Czech blood. \n\nEven now those of true German blood remain a minority within your boundaries. \n\nYour people, so resilient, so hateful, they fall upon mine with bullets, fire, and bombs. How could this be? How could you do this to me? \n\nWas I not born within your walls? Do I deserve this as much as the Hangman who once haunted your streets? \n\nAnd I see my ilk, some like me, others from other cities — they fight back hard. I do not wish to join them; theirs is a spiteful cause. \n\nI only wished for freedom, but why must you reject it so? Is liberty worth nothing unless its name is Czech?"
 GER_gfour_bombers_spring.12.a:0 "Your People Are Vicious Dear Prague"
 GER_gfour_bombers_spring.12.b:0 "Mine Are Still Too Cruel For You"
 GER_gfour_bombers_spring.13.t:0 "Clash In Danzig"
 GER_gfour_bombers_spring.13.d:0 "Running in a sewer was not how Alojzy had intended to spend his evening. \n\nHe and his fellow freedom fighters had managed to seize the city's shipyards and barricade themselves in. \n\nIt had not been too hard; many of the dockworkers were Polish, brought in to do the hard work for the lazy Nazistniem. \n\nHe had volunteered to keep to the streets and spy on the DAP. Boring work, he had found, until he overheard some thugs blabbing about a major attack they were planning. \n\nSomehow the bastards had gotten their hands on several fuel trucks. That very night, they'd bring them close to the dock and blow them up, starting a fire that would burn through the dock warehouses. \n\nAlojzy started running the moment he heard this - couldn't use a telephone, the wires leading from the port were all cut. \n\nThe streets were crawling with hostile Burgundian-worshipping thugs. The police and military were no better, and they'd probably try to pick him up or shoot him for one reason or another. \n\nHe needed a safe path, so the sewers it was. \n\nIt was dark, and smelled like death, but he had a pretty good sense of direction after growing up in a dark slum with next to no electricity. \n\nThe question was now: would he make it in time to warn the others?"
 GER_gfour_bombers_spring.13.a:0 "He Will, He Will!"
 GER_gfour_bombers_spring.13.b:0 "No, No He Won't"
 GER_gfour_bombers_spring.14.t:0 "Crimea Under Siege!"
 GER_gfour_bombers_spring.14.d:0 "Gotenhalbinsel. The jewel of the Black Sea. \n\nCrimea, as it was known to the remaining Tatars, Russians, and Ukrainians, was a world away from the heart of the Fatherland, and yet still its place in the German Reich was assured by its history and the blood that now inhabited it. \n\nWhen the Gang of Four drew up the plans to redistrict the Gaus, it was decided that the peninsula should be made into a full Gau of the German Reich. \n\nThe RSP had done well here electorally, despite its lack of significant financial and industrial sectors. It had gained support among the German populace through the espousal of nationalism, many of whom were veterans of the Kriegsmarine or their children. The DAP had come later, and gained a modest but significant following as well. \n\nThe hinterland, however, had hardly been idle, and was still home to many who had lived there years before the Reich ever planted its flag. \n\nThe LER had made contacts with the existing local factions and brought them under their umbrella. Weapons were smuggled in via the northern route, the Ukrainian government paid little mind to their activity, and a low-scale guerrilla war had broken out. The rural areas were no longer safe to travel, and even the cities were not safe for those who sported the colors of the DAP. \n\nThe violence plaguing the peninsula was becoming untenable, and direct confrontation inevitable. \n\nAnd so it was in the outskirts of the city once named Sevastopol that this was realized. An ambush at dawn by the LER turned into something greater when their targets proved more resilient than first gauged. Reinforcements were brought in by the LER, and then by the DAP. And soon it was something of a real battle. \n\nNo tanks, no jet close air support, but bullets and bombs aplenty. By the time the shooting war could be broken up by the Heer garrison, there was only one victor..."
 GER_gfour_bombers_spring.14.a:0 "The Peninsula Is Ours!"
 GER_gfour_bombers_spring.14.b:0 "It Is German Land And Always Will Be!"
 GER_gfour_bombers_spring.15.t:0 "Detonations In Munich"
 GER_gfour_bombers_spring.15.d:0 "Terror in Munich today as the proud Bavarian city has been thrown into the turmoil many had hoped it would be spared from. \n\nWhile it was initially believed the Five City Bombers would not strike while all available resources were dedicated to their capture, these aspirations have proven optimistic. \n\nSeveral bombs were triggered all across Munich, and casualties are immense. \n\nWhen will this chaos end?"
 GER_gfour_bombers_spring.15.a:0 "I Don't Know"
 GER_gfour_bombers_spring.16.t:0 "Detonations In Cologne"
 GER_gfour_bombers_spring.16.d:0 "Cologne has not been spared. \n\nA truck, laden with a ludicrous amount of explosives, detonated on the Köln Hauptbahnhof at noon, damaging it and the Kölner Dom. \n\nMany have died. Men and women. Old and young. German and not. \n\nDeath came for them all. \n\nWe must hope that they will be the last victims of these terrible and horrific attacks. \n\nThe cowards who have carried out these inhumane assaults must be brought to light!"
 GER_gfour_bombers_spring.16.a:0 "We Must Find Them!"
 GER_gfour_bombers_spring.17.t:0 "Detonations In Strasbourg"
 GER_gfour_bombers_spring.17.d:0 "Horror in Strasbourg! \n\nThe Reichsuniversität Straßburg and the Reichsgau administrative building have both been targets of egregious bomb attacks. The ORPO is scrambling to capture the terrorists who carried out these attacks, but like in Cologne and Munich, there is simply no sign of them. \n\nAt least one bomb did not go off, and it matches the design found in the Volkshalle. \n\nThe bombs are sophisticated and of good quality, indicating a high level of organization behind the attacks. However, the true culprit remains unknown. \n\nThis is a serious test for Germany's new government!"
 GER_gfour_bombers_spring.17.a:0 "It Never Ends!"
 GER_gfour_bombers_spring.18.t:0 "Detonations In Nuremberg"
 GER_gfour_bombers_spring.18.d:0 "Kongresshalle has been hit! \n\nNuremberg's pride and joy has suffered massive damage as the entire west wall was brought down by demolitionists in the late afternoon. Dozens have been killed and many more have been injured. Thankfully, this incident was not as deadly as previous ones, as measures have been implemented to keep the populace out of high-traffic areas. \n\nNonetheless, this attack shows the Bombers aren't stopping now. \n\nThe Reich's government must do everything in its power to halt this menace before it's too late and more people are killed!"
 GER_gfour_bombers_spring.18.a:0 "No Matter The Cost!"
 GER_gfour_bombers_spring.19.t:0 "Peace By The Gun"
 GER_gfour_bombers_spring.19.d:0 ""Well?"" \n\nIt was early afternoon and the shining sun contrasted the dark mood inside the conference room. But what else did you get when bringing two bitter enemies together? Jaruzelski had sat staring directly at the man sitting directly across from him with undisguised contempt. The subject of his attention, a certain Manfred Roeder, pretended he was at an ice cream social and chatted amiably at the silent guards. \n\nPrivately, Wolfgang Altenburg wished they could just shoot these two and be done with it. The Wehrmacht and ORPO had gone to extreme lengths to find them and pressure their respective paramilitaries into compliance. The DAP and LER were still active, but cowed thanks to the recent efforts by the Fuhrer and his ministers. Might as well finish the job here, no half measures. Ah, but that would cause more problems than palatable and the bomber terrorists were still running free. \n\n"Well? Are the terms acceptable to everyone? You will order your paramilitary wings to stand down and cease all violent actions. You will then disband them and hand over your arms to the Reich." \n\n"In return your party hierarchies will receive blanket amnesty, and you will be allowed to run in the coming general elections. You can settle your differences in the legislature instead of the street." \n\nJaruzelski spoke first, "These terms are acceptable to me, General, but what guarantee do we have of protection from attack?" he nodded towards Roeder, "Many are armed to defend themselves. And was it not he who began this incident by wrongfully implicating us in the bomb attacks?" \n\nRoeder looked up as if seeing Jaruzelski for the first time, "There is no proof your fellow dirty slavs didn't do it," he sneered, "And I will ask the same question, what protection will the DAP receive from wild subhuman thugs?" \n\n"If there is any subhuman here, it is you, rat. So much for fighting for Germans, I hear rumors you took money and weapons from Himmler." \n\nRoeder clenched his jaw, "And I hear you take it in the rear in Washington you-" \n\nThe General slammed his hand down, "That's enough! The Fuhrer has personally guaranteed your safety and the safety of your subordinates. There will be no violence from any political party in the Reich. Further attacks will be prosecuted harshly. Accept this or not. You both have sympathisers in the Reichstag, but I don't care either way." \n\n"Whoever the Fuhrer is, I don't care. If he gives me an order I will do it, and he has ordered me to bring this madness to an end. Accept this peace and leave with what you've won. If you'd rather be destroyed, myself and my colleagues in the ORPO will be happy to assist." \n\nAltenburg scanned the room and was surprised when the Pole broke into a smile, "Very well, General Altenburg, I accept your conditions. The League of Rights Deprived will cooperate with the appropriate authorities. I confess I am quite pleased to-" \n\n"The Aryan Party accepts as well!" huffed Roeder. \n\nFinally, some sense, thought Altenburg."
 GER_gfour_bombers_spring.19.a:0 "Some Progress At Last"
 GER_gfour_bombers_spring.20.t:0 "End Of The Menace"
 GER_gfour_bombers_spring.20.d:0 "At dawn, before the first light of day broke, the ORPO descended on the safehouse like wasps. \n\nIf the suspects inside had seen them coming, they had little time to react. \n\nSimilar scenes played out across Germany. The terrorists had been careful not to concentrate in a single area, but their time had run out. They might have escaped in those first chaotic days after the initial attacks, but in their arrogance they continued to strike and lingered in Germany. \n\nRegardless, their reign of terror has come to an end, and we can finally breathe freely knowing they are in our hands. \n\nNow comes the matter of interrogation. Who are they? Who do they work for? Burgundy? America? Japan? A domestic patron? We must figure this out before the mastermind behind these bomb atrocities strikes once more. \n\nAs for the terrorists, once they've sung, they'll be hauled in front of the courts. And we are certain there is only one verdict they deserve."
 GER_gfour_bombers_spring.20.a:0 "Death!"
 GER_gfour_bombers_spring.21.t:0 "Death Of The Menace"
 GER_gfour_bombers_spring.21.d:0 "OFFICE OF THE FUHRER \n\nTOP SECRET \n\n97 SUSPECTS HAVE BEEN IDENTIFIED IN RELATION TO THE TERROR BOMBING CAMPAIGN. OF THOSE, 38 WERE KILLED, 3 ARE MISSING, AND THE REST WERE SUCCESSFULLY ARRESTED AWAITING INTERROGATION AND TRIAL. \n\nAS OF 1211 TODAY ALL 56 DETAINED SUSPECTS ARE DEAD. CAUSES INCLUDE SMOKE INHALATION, CYANIDE, AND BURNS. \n\nOUTISDE INFLUENCE IS ALMOST CERTAIN. \n\nENEMY HUMINT NETWORK MORE PERVASIVE THEN INITIALLY ESTIMATED. POTENTIAL FOR INFORMATION FROM SUSPECTS LOST.\n\nRECCOMENDATION: REDOUBLE EFFORTS TO ROOT OUT HOSTILE AGENTS. \n\nTHE VOLK CANNOT BE THREATENED LIKE THIS EVER AGAIN."
 GER_gfour_bombers_spring.21.a:0 "So We Hope..."
 GER_gfour_bombers_spring.22.t:0 "Face Of The Enemy"
 GER_gfour_bombers_spring.22.d:0 "OFFICE OF THE FUHRER \n\nTOP SECRET \n\nTHE ENEMY WAS ABLE TO REMAIN ELUSIVE AND UNKNOWN, BUT THAT IS NO LONGER THE CASE. \n\nTHE THREE MISSING SUSPECTS WERE CAUGHT TODAY ATTEMPTING TO BOARD A PLANE TO THE BRITISH ISLES. \n\nTHEY WERE APREHENDED BY PLAINSCLOTHED ORPO AGENTS AND IMMEDIETLY DETAINED AND INTERROGATED AT A LOCATION GUSTAV. WHILE INFORMATION FROM THE 3 INDIVIDUALS IS INCOMPLETE LIKELY DUE TO COMPARTMENTALIZATION WE NOW KNOW THE TRUE IDENTITY OF THE ENEMY. \n\nTHE SS-ORDENSSTAAT BURGUND. \n\nTHE SUSPECTS INDICATE THAT THE TERROR ATTACKS ORIGINITATED FROM THE HIGHEST LEVELS OF THE SS HIERARCHY, POSSIBLY EVEN FROM HIMMLER HIMSELF. \n\nFURTHERMORE BOTH THE DAP AND LER RECIEVED MATERIAL SUPPORT FROM BURGUNDIAN INTELLIGENCE. IF THEY ARE AWARE OF THIS IS UNKNOWN, BUT WE WILL BE SURE TO WATCH THESE TWO PARTIES MORE CLOSELY FROM NOW ON. \n\nRECCOMENDATION. THE REICH MUST MAKE EFFORTS TO UPROOT SS AGENTS FROM THE FATHERLAND AND INCINERATE THEIR NETWORK TO THE MARROW. \n\nFURTHERMORE ALL POSSIBLE PRESSURE SHOULD BE PLACED ON THE BURGUNDIAN STATE AS WELL. COORDINATION WITH OTHER NATIONS PREFERABLE. \n\nIT SPEAKS TO THE GENIUS OF THE REICH THAT MUCH WAS INVESTED IN COUNTERINTELLIGENCE CAPABILITIES. WITHOUT THEM WE WOULD NOT HAVE CAUGHT AND IDENTIFIED THE PERPETRATORS. A HEARTY CONGRADULATIONS TO THE ORPO AGENTS CHARGED WITH THE ARREST. \n\nTRUE JUSTICE MAY NOW BE ENACTED AND THE BLOOD OF THE INNOCENT DEAD AVENGED."
 GER_gfour_bombers_spring.22.a:0 "Justice"
 GER_gfour_bombers_spring.23.t:0 "Exposed"
 GER_gfour_bombers_spring.23.d:0 "REPORT JUNG 85-ALPHA-RHO-B756 \n\nWHILE OPERATION BOMBENFEST WAS INITIALLY SUCCESSFUL, THE CAPTURE OF SOME OF OUR AGENTS HAS LED TO THE DEGENERATE REICH UNCOVERING SIGNIFICANT PORTIONS OF THE GERMANY INTELLIGENCE NETWORK. \n\nAS A SIDE EFFECT OUR LINES OF CONTROL TO THE DAP AND LER HAVE ALSO BEEN CUT. \n\nREMAINING AGENTS HAVE EITHER BEEN FORCED TO MAINTAIN A LOW PROFILE OR EXFILTRATE FROM THE PAKT. \n\nTHIS HAS SEVERELY DAMAGED OUR ABILITY TO CARRY OUT OPERATIONS IN GERMANY."
 GER_gfour_bombers_spring.23.a:0 "CURSES"
 GER_gfour_bombers_spring.24.t:0 "Extreme Measures"
 GER_gfour_bombers_spring.24.d:0 "With the domestic situation deteriorating rapidly, the Fuhrer has been forced to declare martial law to avert total national political breakdown. \n\nNeedless to say a crackdown of this nature is an unpopular measure at the best of times and will severely damage our political prospects. Reelection is increasingly appearing to be unlikely. \n\nPersonal political considerations aside this will damage the Reich's stability severely, and the resources dedicated towards these measures will prevent us from investigating the culprits of the terrorist attacks further, and as a results we will likely never see these culprits brought to justice. \n\nThis is a dark day, if only it had not been this way we could have recovered from this crisis stronger then ever!"
 GER_gfour_bombers_spring.24.a:0 "A Shame..."
 ## GER_gfour_econ ##
 GER_gfour_econ.1.t:0 "Healing Wounds"
 GER_gfour_econ.1.d:0 "It was an impressive amount of rubble, Rolf considered, and he could see why this building had been left for last. \n\nHe grabbed a shovel and set to work alongside his fellow laborers clearing away the smaller bits of rubble and dirt Rumor was the building had been occupied by some Reichsbanner, and that some time later the building was leveled by God knows who. \n\nAs they finished with the smaller trash, he unearthed a scrap of clothing that had probably belonged to one of the former occupants. If it was just him who was unluck or the whole lot that was blasted, it was anybody’s guess. \n\nRolf hoped he wouldn’t have to hall away any bodies today. Him and his work gang had already come across several, and the smell alone was enough to make his skin crawl. \n\nBut that’s how it was, some idiots got to play hero and the rest of them had to clean up the mess."
 GER_gfour_econ.1.a:0 "A View From Below"
 GER_gfour_econ.2.t:0 "And I Will Be Home"
 GER_gfour_econ.2.d:0 "Dear Nikolina, \n\nWords cannot express how happy I am to be able to write to you. I have great news, the camp I was sent to has been shut down and we're all finally free. \n\nThere's been a change in the German government I hear and it looks like every camp is getting shut down and anyone who has been enslaved is now free. \n\nI don't have much money, and I am spending some of it to send this letter, but to let you know I am alright, it is worth it. \n\nI am hitching a ride on a train to Krakau, and from there I'll figure something out. I'll walk if I have to, nothing will stop us from being together again. \n\nMany Kisses, \n\nMichael"
 GER_gfour_econ.2.a:0 "Nothing At All"
 GER_gfour_econ.3.t:0 "Schools Of Thought"
 GER_gfour_econ.3.d:0 "To Dr. Isa Fuchs \n\nI read your economics column in Grossdeutsche Post and I cannot possibly disagree more with your assessment. \n\nYou suggest that the government adopt a more authoritative approach toward the economy. This is a trap already fallen for. \n\nThe German economy - you may recall - was already a command economy nation for the duration of World War Two and for some years after. This resulted in not only several wasteful infrastructure projects, but the collapse of the economy as a whole, after which the Reich was forced to cede large parts of the economy over to the former megaconglomerates. \n\nThe economy only began to improve after the dissolution of these megaconglomerates into smaller companies, and the deregulation of the economy as a whole. \n\nThe state has some purpose in the economy, but it is a referee at most, not a player, nor the best player at that. \n\nDo you wish for the economy to collapse again?"
 GER_gfour_econ.3.a:0 "Signed, Ingolf Sommer - Doctor of Economics"
 GER_gfour_econ.4.t:0 "Rubbish And Repair"
 GER_gfour_econ.4.d:0 "I can't believe my house was blown up. \n\nI don't even know why I'm not important or anything. Sure I'm not exactly poor but does that mean I have to suffer as well? \n\nWell whatever, I didn't really like this house that much anyhow. Was thinking of renovating it or selling it or anything really. Now it's blown up. \n\nI suppose I will have to build a new one. I guess that's fitting in a way. The whole country has been blown up and now it's got to be put back together. \n\nI wonder if it will be better than before, or more of the same. \n\nWell I can't really worry about that much right now."
 GER_gfour_econ.4.a:0 "I've Got A House To Rebuild"
 GER_gfour_econ.5.t:0 "Dueling Ideas"
 GER_gfour_econ.5.d:0 "The two were sharing lunch together. Civil servants like them worked long hours - and their superior was a taskmaster exemplar. Breaks like these were very much welcome. \n\nThey discussed the typical topics at first, what are you having for lunch, how is your day going, and did you see the game last night - all quite saccharine. \n\nThen after a pause one spoke to another and asked. "Where do you think the economic policy is headed?" \n\n"I don't know," said the other, "I see documents that point this way and that - can't talk about what they say of course - but I don't think it's been decided yet." \n\n"Well they'll have to make a decision now," said the first, "either the government starts putting its fingers back into the pie and we start signing off on new construction projects or -" \n\n"-Or our workload will remain about the same," finished the second. "Either way, we'll still be employed." \n\n"But doesn't it concern you?" asked the first, "what way the economy will go? This could be the policy for a decade!" \n\n"Well what would you prefer? A hands off or hands on approach?" \n\nThe first considered for a second."
 GER_gfour_econ.5.a:0 "Hands On!"
 GER_gfour_econ.5.b:0 "Hands Off!"
 ## GER_gfour_military ##
 GER_gfour_military.1.t:0 "Up And Coming"
 GER_gfour_military.1.d:0 "Hans Speidel looked at the forms on his desk. \n\nHe was getting close to retirement but he regardless decided to initiate the initial stages of the modernization program by promoting several Generals to Field Marshals, to replace much of the old blood that had either retired or died from old age. \n\nTwo names were of particular interest to him. Those were the names of Wolfgang Altenburg and Horst Stechbarth, both admirable officers in their own ways, though very different. \n\nWolfgang Altenburg was typical Prussian stock and was a career artillery commander. However, a few years ago he had taken a fancy to the American doctrine of special forces and had advocated for a further focus on small elite infantry formations supported by ground, naval, and air assets. \n\nHorst Stechbarth, on the other hand, was more unusual and yet more usual. He was more unusual in the sense that he was a farmer before he joined the 3rd Panzer Division as a Panzergrenadier and worked his way up the ranks. He was usual in the sense that he advocated for a focus on armor and motorized doctrine and emphasized them over legged and helicopter infantry, the former he considered outmoded, the latter far too vulnerable to anti-air fire. \n\nBoth were politically savvy, and Speidel had no doubt they would be at loggerheads soon enough. \n\nBut their usefulness outweighed any such future problems, and Speidel considered that it would probably be more of a problem for the present government than him."
 GER_gfour_military.1.a:0 "We Will See"
 GER_gfour_military.2.t:0 "Two Rising Stars"
 GER_gfour_military.2.d:0 "TRANSCRIPT OF MONITORED TELEPHONE COMMUNICATION \n\nPARTIES: FIELD MARSHAL WOLFGANG ALTENBURG / FIELD MARSHAL HORST STECHBARTH \n\n{CALL CONNECTED} \n\nALTENBURG: Hello? \n\nSTECHBARTH: This is Field Marshal Stechbarth. Really, Altenburg, you have outdone yourself this time. Your proposal is a travesty! \n\nALTENBURG: I don't follow your reasoning. \n\nSTECHBARTH: It is self-limiting. We have the materiel and the men. Why stray from proven doctrine? We did not win wars with "tactical insertions" or whatever nonsense you aped from the mud-sucking Americans. \n\nALTENBURG: It is a reasonable proposal. The Heer already prioritizes elite forces. My proposal only realizes the end goals of previous reforms, and we must keep pace with the times. Both the Japanese and the Americans have used special forces to great effect. \n\nSTECHBARTH: We are not them! They rely on special forces because they over-rely on support. A panzer division has everything for assault, siege, capture, and defence. We should focus on improving what we have. \n\nALTENBURG: If that is what you believe, then-- \n\nSTECHBARTH: Then nothing! It is the truth! And in subsection 7d it states that-- {TRANSCRIPT CONTINUES FOR 2 HOURS AND 23 MINUTES}"
 GER_gfour_military.2.a:0 "Oh Wow..."
 GER_gfour_military.3.t:0 "High Seas Fleet"
 GER_gfour_military.3.d:0 ""It's awful in the Kriegsmarine, Grandpapa," Johann complained, "They have six of us on two triple bunks in one room!" \n\nHis Grandfather coughed out a laugh, "When I was your age, I was stationed on a U-boat," he began. \n\n"There weren't even separate rooms! Sometimes I had to sleep with the engine roaring and shaking just behind the wall. It was hot, stank like death, and you never knew when--" \n\n"Okay, okaayy," whined Johann, "but why do we all have to suffer like this? Can't they make the ships more hospitable?" \n\n"'Cause you won't learn anything otherwise," wheezed Grandpapa, "your father never joined the Kriegsmarine and look how he turned out..." Johann heard Grandpapa mutter something about "marrying a Dutch dish rag" before he spoke aloud again, "Listen. Without us the Reich wouldn't have won the war. We kept the seas safe from the British and Americans. It's us who brought them to heel more than any other. If it weren't for us, the war would've ended in a year, and not in our favor.""
 GER_gfour_military.3.a:0 ""Never Forget That""
 GER_gfour_military.4.t:0 "Nothing Beyond"
 GER_gfour_military.4.d:0 "The Pacific was living up to its name, Captain Adolf Lange observed, as his nuclear U-boat cut through the tranquil seas. It was a mantra he lived by, living up to your name, for he was named after the late and great Fuhrer. It was a common enough name, so he had to try extra hard to stick out. "Helmsman, report." \n\n"Seas are smooth as butter, captain, really wish sailing back home was like this." \n\n"You're in luck, High Command wants more operations in this hemisphere so expect to sail here more often," he paused to think before continuing, "but these waters are stalked by Japaners and Yankees, so don't get comfortable." \n\n"Yessir," he replied smartly. Adolf smiled inwardly and headed off to the radio room to check if any messages had been sent by the Fatherland."
 GER_gfour_military.4.a:0 "Nowhere Beyond"
 GER_gfour_military.5.t:0 "The Shield Of Europe"
 GER_gfour_military.5.d:0 "It was a day like any other. \n\nAnd it still is. I don't have much to write in my journal today. The Baltic presented no problems today. Nothing on radar either, so progress was smooth. \n\nWhen I started this journal I was honestly hoping to fill it with more action, but my days have been mainly spent on the bridge watching for enemies that will never come. \n\nMy parents are happy when I tell them because they like that it's a safe job. \n\nMaybe they're right, but I just wish I was able to see a bit more action. \n\nBut they do say be careful what you wish for, so what do I know. Maybe I'll look back on these days fondly. \n\nOr maybe I'll just forget about them cause they're so boring."
 GER_gfour_military.5.a:0 "Either Way I'm Bored Right Now"
 GER_gfour_military.6.t:0 "Pacific Tour"
 GER_gfour_military.6.d:0 "It was a simple thing, childish even. \n\nCaptain Lange and his U-boat U-29 were joined by U-boats U-25 and U-33 on a deep scouting mission into foreign waters. Someone in High Command had dubbed the whole affair the "Pazifik Tour." \n\nThey were to move into the national waters of the United States and go as far as they could to the mainland before they were discovered. Then they were to do the same to the Japanese. \n\nThis served two purposes: to test the stealth capabilities of the German U-boats in comparison to the detection capabilities of the other nations and to prod the other Superpowers and show them they were not the only sea powers in the world. \n\nAfterwards, should all proceed according to schedule, the small U-boat group was to enter Russian territorial waters, though there would be little issue here. The Russians had a pathetically small navy. \n\nBest to remind them of their place, Captain Lange thought privately. He was given command of this task force, much to his pleasure. It was not a combat command, but these days a prestige mission would have to do."
 GER_gfour_military.6.a:0 "It Will Do"
 GER_gfour_military.7.t:0 "Right Above You"
 GER_gfour_military.7.d:0 "There is only one type of ace. \n\nSome fly for glory and some fly merely for pay. There are good pilots of both types, but to truly excel, a pilot must be both and neither. To be an ace, one has to be the best. \n\nWhat does it take to be the best? It means caring for nothing but the aircraft you fly and what is ahead of you. \n\nThe true ace is an angel of death, for him there is no hesitation; no defeat. \n\nYou may think this crude, but I know. I've flown with a true ace. Sit awhile and I will tell you of him."
 GER_gfour_military.7.a:0 "His Name Was..."
 GER_gfour_military.8.t:0 "Nothing Comes Close"
 GER_gfour_military.8.d:0 "I first flew with him in a minor skirmish during the brief civil war. Brief albeit fierce. \n\nOf course our enemies were German as were we, and hence everyone conducted themselves in an honorable manner, so the battles were never too bloody. It was a different story with the SS, but I'd rather not talk about them. \n\nAnyhow, it was over Hamburg and we had to protect friendly ground forces, really a ragtag militia with a few actual soldiers leading them, from enemy bombers. \n\nI remember how he took on five escorts all by himself! He then started moving on to the bombers. The enemy had to run, tail between his legs, to get out of there! He would have probably chased them, were it not for our CO. \n\nI later asked him why he threw in his lot with Speer and the liberals. He asked me why I did so and I told him how my father was a destroyer captain who was an ardent reformist, so wherever he went I had to follow. \n\nThen I asked him again and he smiled. The only thing he said was"
 GER_gfour_military.8.a:0 ""Opportunities""
 GER_gfour_military.9.t:0 "New Blood, New Battles"
 GER_gfour_military.9.d:0 "Eventually he came to command his own squadron and he took me along as his second. We flew many missions over the years, and I will start with one that really says much about him. \n\nIt wasn't really a particularly important operation. It was over Iraq and we were running support for some Baathists. The existing government sent some planes after us. I think the pilots were Italian because they could actually fly straight. \n\nAnyhow, they caught us in the middle of a bombing run and he told us to continue the mission. He broke off then, and engaged the fighters by himself! \n\nHe shot down every single one of them, seven total. \n\nFour with his missiles and the rest with his cannons. They thought they had surprised us, and he dealt with them by himself! He won a medal that day, though I think completing the mission successfully was good enough for him."
 GER_gfour_military.9.a:0 "He Was A True Ace"
 GER_gfour_military.10.t:0 "Red Wings"
 GER_gfour_military.10.d:0 "Once in Africa, I think this was over... Sudwestafrika if memory serves me right, we were in a dogfight with the Americans. It was for a really stupid reason too, we intercepted on of their reconnaissance planes and then they decided to send a whole lot of planes after us all over some junker with a camera. We responded in kind and the whole thing became one hell of a furball. \n\nAnyhow he was enjoying himself, I could tell. Most call him stoic but I've been his friend long enough to know that even if he doesn't talk much he still can have fun - or get really angry. \n\nAnyhow, we didn't really win that day. He sure shot down a lot, but then again the Yankees shot down a lot of our guys. Recon plane got away too. He was pretty pissed that day, he likes winning more then anything."
 GER_gfour_military.10.a:0 "Even A Draw Isn't Enough For Him"
 GER_gfour_military.11.t:0 "Test Case"
 GER_gfour_military.11.d:0 "What the hell is he doing now? I heard from him a few months ago. He still flies, of course, as a test pilot. Me, I got too successful and was promoted into a desk job. I hear from his wife more then him nowadays - think she's pissy that he looks to care more about planes then their kids. No idea how the guy got hitched in the first place... \n\nStill, I think he's not done yet. There'll be plenty of more wars and he'll be there for them all until he's too old or dead. \n\nAs for me well... I haven't figured that yet. Maybe I'll go for general, the top brass could use someone with an actual brain. \n\n...Maybe leave that part out. At least until I get locked in, ya know? I already have enough eeeehhhhh trouble with command if you catch my drift. "
 GER_gfour_military.11.a:0 "No Problem"
 ## GER_kn ##
 GER_kn.1.t:0 "Once In A Lifetime"
 GER_kn.1.d:0 "It was an initiative of the Gang of Four that had brought the KdN into existence and one that [GER.GetLeader] had decided to continue. \n\nThe venture had bonuses that even its critics had to admit. Everlasting world peace was not exactly realistic despite the state's claims - those were really to generate support among the youth - but an international organization where the nations of the world could meet and discuss issues was at the bare minimum a useful political tool. \n\nThe first attempt at such an organization, the League of Nations, proved catastrophically weak and practically useless - a mere facade for the French and British to yank around to their liking. \n\nAnd yet [GER.GetLeader] knew his history, and he also knew that there were many times when the great powers of the world would come together, discuss issues prevalent to the day, and settle disputes. \n\nThe Congress of Vienna, Berlin... the list went on. \n\nThe point was, even if the nations of the world may never be friends, the least they could do is accept they had common cause in avoiding devastating wars."
 GER_kn.1.a:0 "And Then We Work From There"
 GER_kn.2.t:0 "Charter of the Koalition der Nationen"
 GER_kn.2.d:0 "WE THE NATIONS OF THE EARTH \n\nhave determined that there should be an institution in which disputes may be fairly and justly resolved without reliance on force of arms. We believe the nations of mankind and the peoples that constitute them should be spared the horrors of war unless absolutely necessary. We resolve that justice should be restored to its paramount place and that all peoples should be allowed its neutral arbitration. \n\nTHUS WE RESOLVE \n\nto establish the Koalition der Nationen to achieve these ends. The formalization of diplomacy and the maintenance of the interests of all its members shall be the principal cause. HENCEFORTH ALL MEMBERS OF THE KOALITION SHALL COMBINE WILLS TO ACHIEVE THIS END \n\nFor the betterment of man and the defence of justice."
 GER_kn.2.a:0 "And So Let This Charter Be Presented For All To See"
 GER_kn.3.t:0 "In Italy"
 GER_kn.3.d:0 "Visiting Italy is not as difficult as visiting other rivals of the Reich, and so I was here many years ago on a leisure trip. \n\nAlas, I cannot enjoy the sights and warm weather as much now. I am - after all - on a diplomatic mission. \n\nThe Italians are not entirely hostile to the KdN, though they are skeptical. But I am still optimistic. I had a fantastic lunch the other day with a secretary from the Italian Foreign Ministry and it was quite productive. \n\nHe was an intelligent man and I have faith he will be able to convince the Ministry of the logic of Germania's proposal. \n\nThe political leadership will be another matter, but they too can be won over in time."
 GER_kn.3.a:0 "The Faster The Better"
 GER_kn.4.t:0 "In the Unity Pakt"
 GER_kn.4.d:0 "I think this is where my job will be easiest. \n\nIf I may be cynical, it's because there's a certain power the Reich holds over these nations, indirectly or otherwise. The Reich is the master of Europe after all, and it is natural that where the Reich goes, they follow. \n\nStill, it seems slightly wrong. Are we establishing the KdN through careful diplomacy or coercion? What will happen if our interests should diverge? Should Germany have power to determine and arbitrate over its spherelings, or should they have equal status here? \n\nIt's hard to say, but I cannot speak for the Fuhrer. I only hope he chooses wisely."
 GER_kn.4.a:0 "I Hope"
 GER_kn.5.t:0 "The Bottom Of The New World"
 GER_kn.5.d:0 "The German people never stretched into the Americas like their cousins, nor did they pursue much overseas expansion until the last century or so. Even then we never managed to reach across the Atlantic and establish a solid presence there. And yet still there were politicians amenable to our overtures as there are now even when our government has changed much in the preceding years. \n\nAs I am writing this, I am currently sitting in a rather fashionable cafeteria in Buenos Aires. The weather is nice, and the Argentinians keep this part of the city rather clean. I think we'll have good luck here, but I am sure not all the other South American states will be so receptive. \n\nBut we'll win them over in time. I will ensure it."
 GER_kn.5.a:0 "Work Never Stops"
 GER_kn.6.t:0 "Republic Of Many Stars"
 GER_kn.6.d:0 "Germany’s old enemy and maybe its future friend? \n\nThe Reich and Republic were never particularly close all things considered. It's ironic that many of them are German by blood. Why then are they our antithesis? Correction, were our antithesis. \n\nOur modes of governance have grown closer again after the reintroduction of competitive elections and the constitutional reform. But they'll never be German, and we will never be American. The American remains blind to much and he practically considers authority a personal attack on himself. They watch films of outlaws and delight in their criminality. They're a strange people alright. \n\nBut I cannot bring myself to hate them. I have met many of them these past few weeks and there is a will they have that I cannot help but admire. Perhaps the will we share will bring us closer rather than apart."
 GER_kn.6.a:0 "In Time"
 GER_kn.7.t:0 "Shining Sun"
 GER_kn.7.d:0 "What are the Japanese to us? I have been dragged around Tokyo from meeting to meeting, and I still don't have an answer. It is true we were brothers once, but our friendship was broken as quickly as it was formed. \n\nWas our alliance merely of convenience? Many think so, but I’ve read some of the public statements and intelligence briefings from the time shortly after the war. I think that there was some genuine friendship once, enough such that many in their government seemed to have taken offence at the end of our alliance. \n\nThey are unlike us in many ways. Though I recognize the architectural origins of the skyscrapers here in Europe, the people inhabiting these structures are quite, quite different. \n\nThey bow - we shake hands. They eat rice - we eat bread. They conquered Asia - we conquered Europe. The list goes on and on and on. \n\nBut despite that, we were still friends for a little while at least. If nothing else, perhaps we can be acquaintances again? \n\nOh, there's my escort. Another meeting, I suppose..."
 GER_kn.7.a:0 "Hopefully This Will Be Productive"
 GER_kn.8.t:0 "Ends Of The Earth"
 GER_kn.8.d:0 "I suppose, looking back, that it was strange of me to join the foreign service. When I joined, the war was in its waning months. I suppose I would have been conscripted otherwise. Maybe I lucked out in the end. \n\nOr that is what I would say were I not in this miserable ice hole. The [RUS.GetAdjective]s don't care for us much. I wonder why? \n\nWell, we all know why really. But I was still sent here to Russia anyway, and I still have a job to do. \n\nEven if I convince them to join, will they even bother with diplomacy? Or will they twist the KdN to their own ends? \n\nAnd who's to say we won't be at war with each other in a few years?"
 GER_kn.8.a:0 "Honestly, Why Bother?"
 GER_kn.9.t:0 "Structure of the Future"
 GER_kn.9.d:0 "What is to be the shape of the KdN? \n\nTwo answers have gained steam in recent days. \n\nThe first proposes a so-called "Guardian Council". This council would consist of the world's leading powers and would vote on pertinent matters facing the world's nations. Each member would also have a veto which would instantly end a motion in progress. This setup would allow for greater coordination in decision-making, but would also alienate the minor and secondary powers of the Koalition. \n\nOn the other hand, it has been proposed that the KdN should act more as an assembly of nations. This would allow for equal voting among all the members of the KdN with no chance of veto. While this is the more equitable proposal, there is a question of whether such a format would allow for anything approaching coordination. \n\nUltimately, however, a choice must be made. Do you know which one?"
 GER_kn.9.a:0 "The Guardian Council!"
 GER_kn.9.b:0 "The Assembly of Nations!"
 GER_kn.10.t:0 "Invitation From Germany"
 GER_kn.10.d:0 "The German Reich has in recent times undergone a somewhat democratic reformation. Their new government has been trying to increase diplomatic overtures to neutral as well as hostile nations, including us. \n\nThe Reich has proposed that the United States should join its new international organization, the KdN, as an equal member to Germany. \n\nQuestions have been asked about the genuineness of this offer, and some think of the KdN as nothing more than a convenient tool for Germany. \n\nOn the other hand, if this organization is legitimate, it could offer us a new venue for diplomatic solutions with the German Reich. \n\nThe choice is yours, Mr. President. Whatever you decide, we'll whip the Congress critters into line."
 GER_kn.10.a:0 "Let's See What This Koalition Is All About"
 GER_kn.10.b:0 "Sounds Like A Load Of Hooey"
 GER_kn.11.t:0 "Overtures From Germany"
 GER_kn.11.d:0 "The German Reich has in recent times undergone alterations, and as a result, the NSDAP is no longer the sole political faction in their nation. Their new government has been trying to increase diplomatic overtures to neutral as well as hostile nations, including us. \n\nThe Reich has proposed that Japan should join its new international organization, the KdN, as an equal member to Germany. \n\nQuestions have been asked about the genuineness of this offer, and some think of the KdN as nothing more than a convenient tool for Germany. \n\nOn the other hand, if this organization is legitimate, it could offer us a new venue for diplomatic solutions with the German Reich. \n\nPrime Minister, this offer could be a chance to open new diplomatic channels and bring new opportunities to our nation."
 GER_kn.11.a:0 "So Be It"
 GER_kn.11.b:0 "I Have No Interest In Their Offer"
 GER_kn.12.t:0 "[FROM.GetName] Accepts"
 GER_kn.12.d:0 "Great news! \n\nThe [FROM.GetAdjective] have accepted our offer and have formally joined the KdN. \n\nOur path to peace grows ever shorter!"
 GER_kn.12.a:0 "Hip Hip Hooray!"
 GER_kn.13.t:0 "[FROM.GetName] Rejects"
 GER_kn.13.d:0 "Terrible news! \n\nThe [FROM.GetAdjective] have rejected our offer and have presently declined joined the KdN. \n\nWe must try again later to intice them to join the KdN!"
 GER_kn.13.a:0 "Curses!"
 GER_kn.14.t:0 "An Invitation From [FROM.GetName]"
 GER_kn.14.d:0 "The German Reich has in recent times undergone alterations, and as a result, the NSDAP is no longer the sole political faction in their nation. Their new government has been trying to increase diplomatic overtures to neutral as well as hostile nations, including us. \n\nThe Reich has proposed that Japan should join its new international organization, the KdN, as an equal member to Germany. \n\nQuestions have been asked about the genuineness of this offer, and some think of the KdN as nothing more than a convenient tool for Germany. \n\nOn the other hand, if this organization is legitimate, it could offer us a new venue for diplomatic solutions with the German Reich."
 GER_kn.14.a:0 "Accept Their Offer"
 GER_kn.14.b:0 "Reject It!"
