 GER_bombers_spring_resolved_tt:0 "§YThe Bomberfrühling Is Over§!"
 GER_g4_bombers_spring_decisions:0 "§RBomberfrühling§!"
 GER_g4_bombers_spring_decisions_desc:0 "Our beloved Reich is now under attack by terrorists and political insurgents! With the bombing campaign continuing across German metropolitan centers, the ORPO has been unable to control the simultaneous riots of the Burgundian-esque DAP and the ethnonationalist LER. Clashes between the two groups has been nonstop and many neighborhoods have been turned into warzones as the two party's wage running gun battles with each other. If this crisis is to resolve at all the Fuhrer must push the Reichstag to ram through legislation that will facilitate the end of this chaos! \n\nEven if that means taking drastic measures- or worse, compromising with the opposition... \n\n§sCurrent Status:§! [GERG4GetBomberSpringText]"
