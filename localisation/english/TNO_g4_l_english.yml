 ## GER_gfour_nsdap ##
 GER_gfour_nsdap.1.t:0 "Ein Reich"
 GER_gfour_nsdap.1.d:0 "Once again the Russian filth has been pushed back to the icy hell they came from. Germania was in a state of euphoria. They had done it again and for the second time in history a Goebbels had saved the Germanic race from its enemies. Goebbels had of course made sure to exploit this time of celebration. He had made televised speech after televised speech. Now today he was giving a one on one interview with Deutscher Rundfunk. It was a location he picked out, a spacious and well appointed state room in the Reichstag - rumored to be one of Honoured Hitler's favorites. “5 minutes,” one of the film crew announced. The interviewer, Karl-Heinz Köpcke, adjusted his tie. “Have you conducted many interviews, Herr Köpcke?” the Fuhrer asked. It was an idle and frankly stupid question. Köpcke was a well established television host and Goebbels had his secretaries screen for the best candidate. Not too soft, nobody liked a one sided interview. Köpcke must have been reading his mind because he replied, “I have conducted many interviews over my career, Fuhrer. Have you?” Goebbels smiled back, "
 GER_gfour_nsdap.1.a:0 "“I’ve done a few”"
 GER_gfour_nsdap.2.t:0 "Herr Goebbels"
 GER_gfour_nsdap.2.d:0 "With the passing of the national unity act, the stability of the government was secure. Helmut Goebbels had seen to that. No longer would the Reichstag be filled with petty jabs and insignificant squabbles. \n\nThere would be cooperation and the Fuhrer's word would be heeded. More of the old, his detractors had said. Let them whine and wallow in impotence. The Fuhrer had only to win the elections and his place was secure. And he’d win again and again and again. He brought down nations. What were a few more elections? Of course, he wouldn't live forever; he’d need to prepare a successor eventually. Maybe his eldest son? But the boy hadn't shown much interest in continuing the family tradition yet. Maybe one of the younger NSDAP members? That was more probable. There were a few with genuine brilliance who weren't just bootlicking toadies. \n\nWell, he had his time to pick and choose. Why rush? He was Helmut Goebbels after all. Scourge of invaders and uniter of the people. \n\nHe had - time. \n\nSo, so much time."
 GER_gfour_nsdap.2.a:0 "So Do I"
 GER_g4_nsdap_unity_ending_tt:0 "§rFuhrer §!§YHelmut Goebbels§!§r has taken his rightful place and has §!§Gunited the Reich§!§r thanks to you. But will §!§Renemies domestic and foreign§!§r allow him to change the rules of the Reich? There will surely be §!§Operil,§!§r yet with §!§Wyour support, and your will,§!§r §!§Ohis triumph will echo through the ages.§!§r But that story will be for another time. For now, rest in your victory and know that the Reich has once again been §!§Gremade. §!§rHeil Goebbels!§!"
 GER_gfour_nsdap.3.t:0 "Right By Blood"
 GER_gfour_nsdap.3.d:0 "The sun is setting over Germania. It's a beautiful sight and one I come up often to the roof of the Volkshalle for. Sometimes I bring my family but today I am alone aside from the guards inside watching the door. \n\nIn truth they would rather be out here with me; snipers they tell me would find me easy prey here. But really, how would I be prey, me of all people? I am the Fuhrer and I have won wars and outmaneuvered all my enemies domestic and foreign. The NSDAP stands true and I am ready to lead the Reich into a new age. Some will say I am just repeating what has been done before and that I will fall for all the same traps. But I know differently and I know better. \n\nThe sun disappears over the skyline but I know it will return the next day. For so long as the sun shines in the sky there will be a Reich and there will be a Fuhrer. \n\nI am Helmut Goebbels \n\nAnd I am your Fuhrer."
 GER_gfour_nsdap.3.a:0 "HEIL GOEBBELS"
 GER_g4_nsdap_majority_ending_tt:0 "§rFuhrer §!§YHelmut Goebbels§!§r has taken his rightful place, §!§Opromised to his father, now inherited.§!§r And he has only one person to thank but §!§Wyou.§!§r But will §!§Renemies domestic and foreign§!§r allow him to rule the Reich uncontested? There will surely be peril, yet with your support, and your will, his triumph will echo through the ages. But that story will be for another time. For now, rest in your victory and know that the Reich is in the hands of a §!§YGoebbels§!§r and §!§Gthe crime of long ago has been undone. §!§rHeil Goebbels!§!"
 ## GER_gfour_vup ##
 GER_gfour_vup.1.t:0 "The Repose Of Karl Arnold"
 GER_gfour_vup.1.d:0 "It was expected, but the grief still struck at his soul. \n\nHis friend was with God now and deep in his soul Ratzinger knew he would not see him for a long time. \n\nBut the death of a friend aside, there was now a very pressing issue. Though he had investigated a replacement prior to Arnold's death, he still had not decided on who would be the new Reichkanzler. \n\nHis choice would be important. The VUP had both a Traditionalist wing, and a more, for a lack of a better word, Labour wing. Hence two names had come forward for him to appoint as Reichkanzler. The first was Heinrich Krone, a staunch Catholic and mainstay of the VUP section of the Reichstag. He was a man of modest ambition and mainly advised on diplomatic proceedings. He was generally considered a reliable man, and was closely associated with the traditionalist wing. Selecting him as Reichkanzler would be an uncontroversial choice. \n\nOn the other hand, Hans-Jochen Vogel was the former mayor of Munich, the youngest in its history and as a member of the NSDAP no less, and later joined the VUP when opposition political parties were unbanned. Concerned with the wellbeing of the urban working class, he generally associated with the Labour wing of the VUP. \n\nRatzinger would have to be careful with his decision but he would also have to make one soon."
 GER_gfour_vup.1.a:0 "I Must Choose Krone"
 GER_gfour_vup.1.b:0 "Perhaps Vogel Is The Man For The Job?"
 GER_gfour_vup.2.t:0 "Restoration"
 GER_gfour_vup.2.d:0 "The sun shone brightly through the stained glass windows of Aachen cathedral. The Nazis had the sense to spare this parish and now it was once again being used for holy purpose. And today that purpose was the coronation of Otto von Hapsburg as emperor of the German Reich. Ten years ago, all of this would have been unthinkable. Cardinal Höffner saying mass, a Hapsburg kneeling before the altar, awaiting the crown of his ancestors, to rule over all Germany once more. And finally, after litanies that had never sounded sweeter, the crown was placed on the emperor’s head. And as he turned to face the people, Fuhrer Ratzinger stood up and clapped, one among many. There would be work ahead, he knew, but he also knew that God would watch over them, guide them, and protect them until the Christ returned to Earth one last time. But until then, the servants of God would never waver and all things good and holy would in time triumph over evil."
 GER_gfour_vup.2.a:0 "It Is And Ever Shall Be"
 GER_gfour_vup.3.t:0 "Setting Germany Right"
 GER_gfour_vup.3.d:0 "Something about it all felt right. \n\nThe Reich Minister of Economics watched the proceedings of the today's session and today he was especially proud to be a member of Fuhrer Ratzinger's cabinet. \n\nThe opposition, especially the NSDAP was keen to throw questions and to disrupt the voting on the law. However, Ratzinger handled them masterfully, and the Nazis were unable to stump him or to embarass anyone of the VUP's members up for questions. \n\nNo those bastards couldn't do a thing and they knew. They played the game and lost. Now it was time for the new. \n\nNow it was time for freedom and democracy."
 GER_gfour_vup.3.a:0 "And So It Shall Be So"
 GER_gfour_vup.4.t:0 "Blessed Freedom"
 GER_gfour_vup.4.d:0 ""Papa, why is the flag different in old photos?" the boy asked his father. \n\nHis father smiled, "There was a different government before you were born. Before your mama and I came to Erlangen." \n\n"What happened to it?" \n\n"It changed. Many people did not like that government. It was cruel and unfair. So some brave men went and changed it, and they changed the flag with it." \n\nThe boy thought for a moment "I think I like the new flag better." \n\n"I do too." His soon reached for his hand and the walked on hand in hand."
 GER_gfour_vup.4.a:0 "And So It Goes On"
 GER_g4_vup_republic_ending_tt:0 "§zThanks to your §!§Brighteous leadership,§!§z Germany once again has a §!§Gfree and fair government.§!§z The §!§Rsins of the past§!§z may never be erased but no doubt today §!§Gthey will be forgiven.§!§z Still, many §!§Renemies of democracy§!§z lurk in the wings ready to pounce at the slightest hint of failure, but no doubt with your guidance §!§Ythe Democratic Reich will last for centuries to come.§!§z Until then, §!§Bfight for God§!§z and §!§Yfreedom!§!"
 GER_gfour_vup.5.t:0 "Long Ago"
 GER_gfour_vup.5.d:0 "“The emperor,” the door announced and suddenly Ratzinger felt he had fallen back a few centuries. He rose but Emperor Otto von Hapsburg of the Reich beckoned him to sit. “I wouldn't have anyone rise for my sake,” he said gently, “least of all you. You have done more for the people of Europe than I ever will. I am but a crown atop the people's heads.” “That may be so, your majesty, but I find that for the first time in an age I would like to show deference for the head of state.” \n\n"And I never thought I would respect a man with the title of 'Fuhrer' but here we are." They laughed, and they sat down together. \n\n"So, what is next for the great Ratzinger?" the Emperor quizzed. \n\n"Ratzinger will hold office until the end of his term, and then he'll let someone new take the reins of the VUP and perhaps the nation as well," the Fuhrer replied. \n\n"It will be a sad day when you retire, but what will you do afterwards?" \n\nRatzinger thought for a moment, and then replied"
 GER_gfour_vup.5.a:0 ""Maybe... Maybe I Will Become a Priest""
 GER_g4_vup_imperial_ending_tt:0 "§zThanks to your careful leadership, the Reich once again has a §!§YChristian emperor§!§z at its head. The §!§Rsins of the past§!§z may never be erased but today §!§Gthey will be forgiven.§!§z No doubt §!§Rthe cruel and despicable§!§z still wish to bring about ruin but your continued §!§Oservice to Reich and Emperor§!§z will no doubt keep us safe. Until then, §!§BGod be with you!§!"
 ## GER_gfour_rsp ##
 GER_gfour_rsp.1.t:0 "A Gamble Well Made"
 GER_gfour_rsp.1.d:0 "To Alfred Dregger politics wasn't just a game - though he played it well. \n\nTo Alfred Dregger a nation had to be strong - only the strong survived the times. \n\nTo Alfred Dregger his opponents were mere obstacles - if they loved Germany that was all well and good but those who despised the Fatherland were to be nullified. \n\nTo Alfred Dregger leadership was duty - duty to protect the German people and all they held dear. \n\nAnd to Alfred Dregger this victory was one among many - for he had more to win. \n\nFor the Reich. \n\nFor the Volk."
 GER_gfour_rsp.1.a:0 "To The Defender of Germany"
 GER_gfour_rsp.2.t:0 "Head Of The World"
 GER_gfour_rsp.2.d:0 "There was much cheering as the panzers rolled in front of the Volkshalle. This was a parade of the victorious Wehrmacht having defied the odds yet again and defeated the Russian menace with the same rigor as they did almost 40 years ago. \n\nFuhrer Dregger smiled as the troops marched past and the trucks rolled on. It had been an age since the Reich had tasted such a glorious and just victory. Not since the defeat of the Bolsheviks and the sundering of the corrupt and degenerate Allies had there been such a fine day. Too long had the Reich been sitting in shadows and self-imposed weakness. Now it was time for the Reich to rise once more, to take the place in the sun that was rightfully owed. And with a Wehrmacht like this to protect it, Germany would be free forevermore. \n\nThere will be more struggle and there will be more glory to gain as well. \n\nAnd Dregger knew, more than any other, that Germany would triumph."
 GER_gfour_rsp.2.a:0 "Forever"
 GER_g4_rsp_ending_tt:0 "§gA thousand have tried yet §!§Yonly you have succeeded.§!§g With the Reich in your steady hands, §!§Gprosperity§!§g and §!§Ostrength§!§g are the only future! §!§RMany will try to stop you§!§g but I have faith you will bring them all low just as you have done §!§Wa thousand times before.§!§g But for now, enjoy your triumph and know that §!§Wwe will follow you wherever you go.§!§g For §!§Ythe Reich's everlasting glory!§!"
 ## GER_gfour_vaaf ##
 GER_gfour_vaaf.1.t:0 "A Small Break"
 GER_gfour_vaaf.1.d:0 "They sat smoking at a quiet cafe along the Dnieper. The face of the proprietor had been worth the trip itself when some of the most powerful men in Germany strode into his establishment. Or so it was said they were. \n\nGunter Grass never felt especially powerful, and he found that he relied on others to get anything done in Germania. But such was politics, he had learned: no man is an island, and nor should he try to be one. \n\nHerbert Wehner raised his glass, "A toast to our brave and fearless leader," he announced in mock reverence, "May he destroy many more enemies and return with piles of loot taller than the pyramids of Egypt!" \n\nThe others laughed. All that work on political and economic reform and in the end their government would probably be remembered for its battlefield victories. \n\nBut then again, Grass thought a second time, such was politics. \n\n"It would have been preferable if bloodshed had been avoided," said Egon Bahr, "But the past aside, I think I will be looking forward to your next book, Fuhrer Grass." \n\n"I'll certainly have much to write about," Grass replied, "I have already decided on the main character." \n\nWehner took another puff of his pipe, "And who's that? Your books are always too avant-garde for my palate. Maybe you'll write about an ostrich that can also sing perhaps?" \n\n"No, I think I shall write about a particularly foul mouthed and obstinate man named Wehner." \n\nWehner considered for a moment, "He sounds like a great man," and they all laughed."
 GER_gfour_vaaf.1.a:0 "Time For Change"
 GER_gfour_vaaf.2.t:0 "Song Of Tomorrow"
 GER_gfour_vaaf.2.d:0 "And as I walk home. \n\nI see a cat on the side of the road. \n\nAnd I see it's quite hungry. Oskar sees it too and he points it out to me as if I haven't seen anything at all. \n\nI look in my bag and find a half eaten sandwich which I fish out. \n\nI break off an eighth and throw it to the cat and it eats it in half a second. \n\nIt looks at us like gods. Is that all we are? I blow my trumpet and feed myself and Oskar and people follow whoever feeds them. Is the trumpet my god? No, I think there's something more to it than just that. More to life than just feeding on scraps like that poor cat over there. The best things in life can't be eaten, I think; they can't be drunk, but they can be shared as many times as you'd like. \n\nMaybe like my shriek and my trumpet, but I think that's a gift people don't like me sharing. \n\nI have to go now. I'll finish this story later. You have time, don't you? You're luckier than I. \n\nWell, until I see you again."
 GER_gfour_vaaf.2.a:0 "Stay Well"
 GER_g4_vaaf_ending_tt:0 "§e§!§YFreedom is at hand!§!§e Thanks to your §!§Ocourage,§!§e the unimaginable has come to fruition and now the people of Europe stand §!§Gliberated and equal!§!§e The path from here is still §!§Rhard and difficult,§!§e but §!§Otake heart!§!§e Your courage has led us into a §!§Bbrave new age of democracy§!§e and we will carry that on §!§Wuntil the very end!§!§e Wait for us and §!§Ywe will soon meet again!§!"
 ## GER_gfour_vaaf_rad ##
 GER_gfour_vaaf_rad.1.t:0 "Cross Out One"
 GER_gfour_vaaf_rad.1.d:0 "Personal Memo \n\nGrass proven to be more naive than originally estimated. Our people have gained power over key positions in the VAAF and we have successfully infiltrated sections of the bureaucracy and Wehrmacht. Status of political control suggests we can move now. \n\nI have already arranged for Gunter Grass to make a sudden and rather catastrophic fall. The Reichkanzler will take his place as a replacement but when it is time to select a new candidate, I will be the first pick. \n\nI have ensured it. \n\nWe have come this far. We cannot turn back now. What has been set in motion..,"
 GER_gfour_vaaf_rad.1.a:0 "...We Can Never Stop"
 GER_gfour_vaaf_rad.2.t:0 "Long Have We Waited"
 GER_gfour_vaaf_rad.2.d:0 "What do I have to say to you? \n\nWhat do I have to justify? \n\n"Oh, Herr Wolf, you are a bad man. You shouldn't do things like this." \n\nI can hear the whining already. But know what I do, and I do because I must. Would you have me prance around throwing money to the wind? Or shaking hands with men that lust for my death? \n\nI have secured the state against the predations of opportunists and fascists. Who else can claim to have done so? Who else has done so much for Germany? \n\nI have waited so many years. I saw the Soviet Union fall to ash and still I did not give up. Still I tried and still I went on. \n\nWeaker men would have thrown it all away. I will not. \n\nSo do not whine and gnash your teeth at me. You think you are better, because you do nothing and you have no power - no will. Well, I do. I have the power and I have the will. And if I have to break some heads to save the Proletariat, I will. And I always will do so. \n\nThis is the right way. The only way. \n\nThe Worker's Reich rises. Will you join us?"
 GER_gfour_vaaf_rad.2.a:0 "Or Will You Die?"
 GER_g4_vaaf_rad_ending_tt:0 "§eYour §!§Lclever schemes§!§e have yielded §!§Ginfinite reward§!§e and now the §!§Ytriumph of the proletariat§!§e has at last come to fruition. No doubt the §!§Renemies of the working class§!§e will show their §!§Rfaces and knives§!§e in due time but you will §!§Loutwit them§!§e as you always have. You are §!§Wthe man with no face,§!§e and you have §!§Ono equal.§! §eBut for now, your work is done...§!"
 GER_gfour_vaaf_rad.3.t:0 "Preperation"
 GER_gfour_vaaf_rad.3.d:0 "It was truly a shame what had occurred with the [RUS.GetAdjective]. They really should have attempted a more peaceable approach to this whole matter. \n\nBut what could be done? Some people just cannot be reasoned with. \n\nAnd yet you are not really relieved. Yes, you have defeated your external enemies but there are so many so so many crawling around within your borders. \n\nCan Germany survive such an onslaught of locusts? No, no, you have to save what little socialism has been achieved here. You have to get rid of them. \n\nYou have to do it. It's the only way. If you don't, you'll die and so will all the laborers and farmers who bled for this day. Would you allow such a crime to occur? Can you? \n\nNo, you have no choice. \n\nGo now, Red Fuhrer. Destroy the bourgeoisie and fascists. And bring peace to the people."
 GER_gfour_vaaf_rad.3.a:0 "Save Them"
 ## GER_gfour_dg_true ##
 GER_gfour_dg_true.1.t:0 "Green"
 GER_gfour_dg_true.1.d:0 "Baldur Springmann cleared his throat and spoke into the microphone. \n\n"How much filth have we allowed to accumulate in our streets? \n\nBy filth I mean both material and individual. Smog clogs our streets and vagrants thrive off the backs of honest men and women. \n\nHow can we let such an unnatural state of being continue? Our blood has been poisoned and we call this progress?" \n\n"I will tell you what progress is. Progress is the cleansing of the Reich from top to bottom. Where there are disgusting factories, there will be gardens and forests. Where there are criminals and undesirables, there will be happy, productive Volk." \n\n"No more ugly factories and power plants plaguing our nation. No more outsiders polluting our genes. We will restore the lost Fatherland of green farms and shining rivers." \n\n"And if this cannot be done, better to die than to live as a shambling diseased corpse." \n\n"But we will not be that corpse! Not any more! We will be strong again!" \n\n"We the Volk shall have our country again!""
 GER_gfour_dg_true.1.a:0 "What?"
 GER_gfour_dg_true.2.t:0 "Schism In The RSP!"
 GER_gfour_dg_true.2.d:0 "This is Rundfunk Europa broadcasting to you LIVE. Oh boy, folks, do we have a story for you! \n\nYou may remember old Fuhrer Dregger has been going on a recent bender of passing laws that benefit him electorally and boost the good old Stahelmers in his party. \n\nWell, it looks like the biggest opposition he's facing now is from his own party! The liberal wing of the RSP has been up in arms as of late and it's all come to a head with the Reichsminister of Economics, Walter Scheel, resigning! \n\nWell, are they going to split off and form their own party? Well, no! Looks like Die Grunen leader Baldur Springmann, the tree hugger guy, has snapped them up and they're off to play in the forest and pick daisies or whatever the Greens do! \n\nDregger's probably furious! But what can he do? Looks like his reelection chances have gone down the drain and Die Grunen is suddenly a player in the Reichstag!"
 GER_gfour_dg_true.2.a:0 "What A Twist!"
 GER_gfour_dg_true.3.t:0 "Victory Of The Blood"
 GER_gfour_dg_true.3.d:0 "Ten. \n\nIt is done. \n\nNine. \n\nThey are silent. \n\nEight. \n\nThe Fatherland is clean. \n\nSeven. \n\nThe Volk are free. \n\nSix. \n\nI have never forgotten. \n\nFive. \n\nThe guns are silent. \n\nFour. \n\nDestroy the undesirables. \n\nThree. \n\nStruggle of supremacy. \n\nTwo. \n\nThe cities are empty. \n\nOne. \n\nAnd we'll never yield."
 GER_gfour_dg_true.3.a:0 "Green All Around Us Stretching Eternally"
 GER_g4_dg_ending_tt:0 "§T§!§GNature will thrive once more§!§T in the Reich. §!§WYou made it so.§!§T §!§YRejoice and be glad,§!§T §!§Ostrength rules once more.§!§T§!"
 GER_gfour_dg_true.4.t:0 "Eternal Fatherland"
 GER_gfour_dg_true.4.d:0 "And such that it may be said that I am an ambitious man - I am but a humble servant. \n\nDo you deny that some peoples belong in certain places and some belong in others? \n\nDo you deny the air should be clear of exhaust, the soil should be spared chemicals of all sorts, and the water should be clean and unpolluted? \n\nThen why should the populace not be freed from contaminants of all sorts? \n\nDo you think otherwise? \n\nThen why are you here? Did you think I was something else or did you know all along? \n\nAnd yet you never turned back. That is good. You have the will to see all this through. Yes, it is a hard duty, and a burden we cannot discount. \n\nBut together we have saved them. And together we will bring the Earth to glory once more."
 GER_gfour_dg_true.4.a:0 "Now For More Work"
 ## GER_gfour_endgame ##
 GER_gfour_endgame.1.t:0 "Fate Of The Fuhrer Democracy"
 GER_g4_endgame_outcome_victory:0 "With the end of the Russian menace (for now) and the triumph of the Reich over another existential crisis, the new Reich has proven to be as robust as its predecessor and the democratic experiment is not a source of weakness, it has been found, but of strength. \n\nAnd henceforth the present government of [GER.GetLeader] has not only survived but thrived and stepped into the future. \n\nThe German Reich has evolved yet again. \n\nThe future awaits."
 GER_g4_endgame_outcome_partial_loss:0 "While the German Reich has survived the Russian menace, significant territory has been lost to the invaders. \n\nAlready old ghosts come creeping out and feasting on the failure of the Fuhrer Democracy. \n\nWill the Reich of the present survive, or will the clock be rolled back to a time before elections and party politics?"
 GER_g4_endgame_outcome_total_loss:0 "While the German Reich has survived the Russian menace - it has neither been glorious nor successful. The Reich has been forced to use nuclear weapons to prevent any advance into the German heartland. \n\nAlready the present government has been falling apart, and the Reichstag has been paralyzed with internal rifts and petty conflicts. \n\nAllegedly, the Wehrmacht has begun to act on its own initiative, and rumours swirl that the Wehrmacht will step in and end the Fuhrer Democracy once and for all."
 GER_g4_endgame_outcome_dg_victory:0 "With the end of the Russian menace, the German Reich has once again destroyed the lesser aggressors and annihilated all opposition to its might. Baldur Springmann has done what only Adolf Hitler has done before and remade Germany in his image. \n\nNow, with this last triumph, he has finally opened the door to his full ambition. \n\nNone can oppose him, and the Green Reich awaits us all."
 GER_g4_endgame_outcome_dg_loss:0 "Springmann's failure to defend the Reich's borders has been the straw that has broken the camel's back. \n\nHis oppressive and insane government has proven to be wholly incompetent in completing the duties it was charged with. \n\nSpringmann's fate awaits, and many suspect it will be a fatal one. \n\nSuch is the price for hubris."
 GER_g4_endgame_outcome_vaaf_rad_victory:0 "With the end of the Russian menace comes the crowning achievement of Markus Wolf. He has done what was once thought impossible and brought a German socialist government into being. \n\nHis schemes and plots have paid off exponentially, and he now holds the fate of the Reich in his hands. \n\nNo doubt, he will empower the proletariat and finally achieve the German Revolution promised many years ago. \n\nThe Red Fuhrer rises, and we shall follow him until the fields run crimson with the blood of the bourgeoisie and Nazis."
 GER_g4_endgame_outcome_vaaf_rad_loss:0 "Markus Wolf has proven to be unable to fulfill his duty and has failed to protect the Reich from external enemies. \n\nAlready the Wehrmacht is moving to put an end to his pitiful and embarrassing regime, and his rule has once again proved the corrosiveness of Bolshevism no matter its form. \n\nThis failure cannot be forgiven, and neither shall it be forgotten. \n\nNo doubt, for his crimes Wolf will be facing death!"
 GER_gfour_endgame.1.d:0 "[GERG4GetEndgameDescText]"
 GER_gfour_endgame.1.a:0 "What Lies Ahead We Shall Meet It"
 GER_g4_endgame_nsdap_law_reminder_tt:0 "§YOur Victory Will Not Be Concluded Until The Reichstag Passes The Majority Law Or The National Unity Front Act§!"
 GER_g4_endgame_vup_law_reminder_tt:0 "§YOur Victory Will Not Be Concluded Until The Reichstag Passes The Imperial Restoration Law§!"
 GER_gfour_endgame.2.t:0 "By The Gun"
 GER_gfour_endgame.2.d:0 "To [GER.GetLeader] \n\nYour failure to protect the Reich has been a massive catastrophe, and your political leadership has proven to be entirely inept. As a result, you are hereby REMOVED from your post as Fuhrer and will be placed under arrest on charges of gross incompetence. \n\nDo not resist. We have had enough of your games. \n\nYou will wound the Reich no longer. Our forces have already surrounded the Reichstag. You will step down alive or dead. \n\nThis is your final decision as Fuhrer. Make the correct choice. \n\nOtherwise, we cannot guarantee the safety of you or your estate. \n\nSigned, \n\n[GERG4GetDominantGeneral]"
 GER_g4_coup_altenburg:0 "Wolfgang Altenburg"
 GER_g4_coup_stechbarth:0 "Horst Stechbarth"
 GER_gfour_endgame.2.a:0 "No Choice At All"
 GER_gfour_endgame.3.t:0 "Punishment For Failure"
 GER_gfour_endgame.3.d:0 "To Fuhrer [GER.GetLeader] \n\nI am not your enemy! In fact, you have received this correspondence because I am truly concerned about your wellbeing! \n\nThe unfortunate war with the Russians has left you with many enemies, and I will tell you of one. The NSDAP has two primary political factions, as you may know, one of which is the Speerite wing of the NSDAP. I know you're familiar with Albert Speer, but we both know that he no longer is a factor in the political game we play. \n\nHowever, one man still is and his name is Theodor Oberländer, and he has been gathering allies within the NSDAP and without. \n\nAt the next session of the Reichstag, he will demand your immediate resignation and the selection of a new Fuhrer by Reichstag vote. \n\nNow, constitutionally, you are under no obligation to leave your post under any circumstance before the next election. But removal via fatal consequences is another matter. \n\nIf you do not resign after his demand, your life will be in severe danger, and not even the Abwehr will save you. Indeed, many of them are in on the scheme. \n\nMy recommendation is you resign. Perhaps you can retry your political luck later! Just know that right now is very dangerous for you, and you have no real choice in this at all. \n\nThere's no shame in resigning! It happens sometimes. This whole war was bad luck for you! And you were doing so well too! \n\nWin some, lose some; however, that's the game we play. So spare yourself a worse fate. \n\nWe'll all be waiting!"
 GER_gfour_endgame.3.a:0 "What Choice Do I Have?"
 GER_gfour_endgame.4.t:0 "Overturn"
 GER_gfour_endgame.4.d:0 "Baldur Springmann died easily, with 15 bullet wounds through his chest and 3 through his head. \n\nYou didn't have to be a coroner to find the cause. \n\nManfred Roeder knew he was looking at a dead man when he walked into the, now former, Fuhrer's office. \n\nRoeder turned his head away, face scrunched, "When will someone get his body out?" \n\nHis second, Friedhelm Busse, replied, "I think our men are still looking for a place to store it." \n\n"Bah! Best we dump it with the rest of the rubbish. I have no use for a corpse." \n\n"We need to show the people that he's dead with solid proof. And also show that we were the ones brave enough to do the job." \n\n"Feh, you think that will be enough?" \n\nBusse shrugged, "It's a start. Besides, Springmann, for all his faults, did a pretty good job sweeping up the opposition. If anyone's in a position to seize power, it's us... aside from the Wehrmacht, but we can deal with them." \n\nRoeder arched an eyebrow, "You sure?" \n\n"Sure enough anyway. Personally, boss, I don't think we're going to get as good of an opportunity as this, after that whole trouble with the mudsucking LER and those bombings." \n\nRoeder snuck a quick look at the blasted body before twisting away again, "Well, I've dealt with the Wehrmacht before, and besides, they aren't looking too good either given the fact they lost half the Reich," he snorted. "Anyway, are we ready to broadcast? I want to let the Volk know who their new Fuhrer is." \n\nBusse smiled; this was the Roeder he remembered. "Everything will be ready in around 20 minutes. Do you have a speech prepared?" \n\nRoeder scoffed, "I've had one prepared since 1974. Now let's get to business.""
 GER_gfour_endgame.4.a:0 "Heil... Roeder?"
 GER_gfour_endgame.5.t:0 "Unfinished Affair"
 GER_gfour_endgame.5.d:0 "It had taken some time, and for a small time they had been content to play by the Germans' game and dance in their electoral system. That was until the madman Springmann managed to worm his way into power, and had quickly shown his true colors - a fact surprising to many, but not to Jaruzelski and his comrades. \n\nAnd hence they had prepared for this day, this moment, when the Reich would fall into headless disarray and their moment would finally come. \n\nNow was that time, and now they would rise. \n\nFor the freedom of nations long thought lost, now restored. This was the time for liberation, where forlorn hope is renewed and the spirit of liberty is restored to life. \n\nAnd so Marshal Jaruzelski now ordered his troops to rise and with them peoples long forgotten - long thought lost. \n\nMaybe for a time."
 GER_gfour_endgame.5.a:0 "And This Time They Will Die Forever!"
 GER_gfour_endgame.5.b:0 "But No More! For Freedom!"
 GER_g4_ler_freedom_tt:0 "§CFreedom Awaits Europe!§!"
 GER_gfour_endgame.6.t:0 "Again And Again"
 GER_gfour_endgame.6.d:0 "Maybe the so-called Fuhrerdemokratie has not failed. \n\nThis I think to myself as I sit alone in the Fuhrer's - my - office. I have found that the will to regress to a sole party state has proven wanting, and it may be time to accept that the time of the NSDAP's unquestioned dominance has long passed. \n\nSo I find myself in the interesting position as transitional leader. Should I bow out gracefully and let the political circus select a new Fuhrer? \n\nI don't know. I nibbled on my pen a bit, a bad habit from childhood. I think I have what it takes to play that particular game and win. Elections, I mean - cursed by Plato and Nietzsche alike. \n\nMaybe I could be more than a footnote - an intermission. \n\nMaybe I could go all the way, and save the Reich myself. \n\nAnd why not? I think I could take the world if I wanted. \n\nBah, what am I saying? Ambition is a poison that kills. \n\nBut not always slowly..."
 GER_gfour_endgame.6.a:0 "Where One Falls Another Rises"
 GER_g4_technocrat_ending_tt:0 "§rWhile §!§Rone failure§!§r has led to this, §!§Wnot all is lost.§!§r §!§OStrive ever forward§!§r and you will taste §!§Gthe sweet honey of triumph§!§r once more.§!"
 GER_gfour_endgame.7.t:0 "Many Times"
 GER_gfour_endgame.7.d:0 "There would be time for reflection later. \n\nWhen the Reich was safe from the invader. \n\nThe one who had stolen rightful German lands. \n\nBut for now too much was in disarray at home. Too much had to be done. Too many loose ends to clean up. \n\nBut such is the burden of men such as [GER.GetLeader]. Men of uniform were often subject to the whims of men who knew less than them. They knew less about waging war, yet they demanded the extraordinary while binding their officers in chains. \n\nBut many times before, the military men of Germany had risen above their lessers and taken charge of the state themselves. Now was no different. \n\nOnce all was settled at home, there would be hell to pay. The [RUS.GetName] would know what it meant to take revenge. \n\nAnd this time they would never forget."
 GER_gfour_endgame.7.a:0 "RACHE"
 GER_g4_mil_coup_ending_tt:0 "§WThe democratic experiment has §!§Rfailed§!§W but §!§Othe Reich has not fallen.§!§W §!§YYou will have your revenge soon enough.§!§W §!§OMarch forward§!§W no matter how hard it is and you will §!§Gredeem your loss.§!§W§!"
 ## GER_gfour_ler_uprising ##
 GER_gfour_ler_uprising.1.t:0 "The Pure Reich"
 GER_gfour_ler_uprising.1.d:0 "Too much garbage in the Reich. \n\nNo, he wasn't talking about the ECOSYSTEM or whatever the tree hugger was on about. \n\nNo, the main problem was people. If this latest act of utter disobedience was ANYTHING to go by, it was clear that since Speer rose to power, the Reich had been too soft on its parasites. Maybe even before then — whose bright idea was it to flood the Reich with undesirables and subhumans? \n\nThe Reich had gotten too LAZY. Too GREEDY. Look what the Burgundians proved when they built a nation through their own hard work? The people asked for nothing and worked for little. When did the Volk start asking for so much GARBAGE? \n\nRoeder HAD to set this right. He HAD to, otherwise it wouldn't be long before the enemies of the Reich would pounce on them and finish the job once and for all! \n\nA HORRID idea, he knew, but one that had become VERY possible. He must STOP this horrible fate. NO MATTER WHAT. \n\nThe Reich would be STRONG again, and Fuhrer Roeder would make it so."
 GER_gfour_ler_uprising.1.a:0 "Or Else Death Would SURELY Come"
 GER_g4_dap_ending_tt:0 "§I§!§RThe hard part will come soon enough.§!§I §!§LRest assured of that.§!§I But for now, you must §!§Ywait§!§I and §!§Owait§!§I and §!§Wwait.§!§I§!"
 GER_gfour_ler_uprising.2.t:0 "Liberty"
 GER_gfour_ler_uprising.2.d:0 "What more is there to say? \n\nWith the Germans in retreat and disarray, the LER had fulfilled its mission and freed much of the European continent from German oppression. No, the struggle was not over yet, but for now the free peoples of Europe could rest easy knowing that they had shown the invaders were not invincible, and indeed they were proven to be weak. \n\nFor the people who love freedom and all good things will forever triumph, and those who love tyranny and all things evil will lose in the end. \n\nAnd though each nation goes its separate ways, when the time comes to fight for freedom again, they will fight as one."
 GER_gfour_ler_uprising.2.a:0 "And So The League Is Dissolved"
 GER_gfour_ler_uprising.3.t:0 "Poland Was Never Lost"
 GER_gfour_ler_uprising.3.d:0 "Marshal Jaruzelski had done it. \n\nHe really had done it. \n\nAs he stood looking over Gdansk, where the horrible nightmare started so long ago, and the defiance of Poland had seemingly come to nothing. \n\nHow wrong that was! There'd be more fighting for sure; the Germans would regroup eventually; God damn it, they always did. But they'd all be ready. And when that day came, they would finish it once and for all. \n\nMarshal Jaruzelski looked over Gdansk one more time and boarded his plane. Warsaw was calling."
 GER_gfour_ler_uprising.3.a:0 "Until Next War"
 GER_g4_ler_ending_tt:0 "§qBattles and wars can be lost but §!§Ynever lose yourself.§!§q For as long as §!§Wthe soul remains,§!§q so does §!§Gthe eventuality of victory.§!§q From the §!§Rbitterness§!§q came §!§Gsweetness§!§q and from the §!§Rdarkness,§!§q §!§Blight.§!§q Take what you have learned and §!§Ostrive ever forward.§!§q For now, I must leave you here but when we meet again, §!§Ytell me of all you have seen and all you have won for us.§!§q§!"
 GER_gfour_ler_uprising.4.t:0 "Chaos Unending"
 GER_gfour_ler_uprising.4.d:0 "Failure was everywhere. So much failure. \n\nAnarchy reigned. The nation was being divided up into fiefdoms for those of petty ambition. \n\nTo rule the Reich, that's all they wanted, and they cared for nothing else.\n\nSpringmann had failed. Roeder was no different. Of course they failed. \n\nHad they not warned them once before? \n\nIt was clear what had to be done. The initial plan was still viable. \n\nIt would be done. And they would die. \n\nAll of them. \n\nAll the unworthy. \n\nAll."
 GER_gfour_ler_uprising.4.a:0 "For Them There Is Only Death"
 GER_g4_dap_fail_ending_tt:0 "§RAnd in the end, nothing was learned and all is lost.§!"
 #focuses
 ##intro
 GER_the_longest_nightmare:0 "The Longest Nightmare..."
 GER_the_longest_nightmare_desc:0 "Since that dark year, 1933, Germany was ruled by madmen and monsters. Millions died under their misrule, and their hatred consumed much of the world."
 GER_has_finally_ended:0 "...Has Finally Ended"
 GER_has_finally_ended_desc:0 "At last, the Gang of Four has overthrown the hated National Socialists. Finally, we can begin the road to restoring Germany to sanity."
 GER_begin_the_transition:0 "Begin The Transition"
 GER_begin_the_transition_desc:0 "The NSDAP has bent and twisted German institutions around itself. Untangling this mess will take some time, but the results will be worth it. Freedom awaits!"
 GER_legalize_political_parties:0 "Legalize Political Paries"
 GER_legalize_political_parties_desc:0 "After seizing power, Hitler quickly subsumed or eliminated all possible political opposition. One of the first measures of the Gang of Four is to reverse this. Party politics might be messy, but it is a necessary for Germany to achieve functional Democracy."
 GER_loosen_press_restrictions:0 "End Censorship"
 GER_loosen_press_restrictions_desc:0 "The Nazi Party had a vice-like grip on the German media, distorting the truth to suit its whims. \n\nThis cannot be allowed to continue. The free sharing of news and ideas is not a weakness; only the weak hide the truth."
 GER_raise_the_tricolor:0 "Raise The Tricolour"
 GER_raise_the_tricolor_desc:0 "First raised as a united German flag during the March Revolution, the black, red, and gold was later adopted by the Weimar Republic. It is a symbol of freedom for the German people and will be raised once more. Down with the swastika, and up with the tricolour!"
 GER_for_democracy:0 "For Democracy!"
 GER_for_democracy_desc:0 "Long has liberty and democracy been spat upon and trodden underfoot in Germany. No more! They will flourish now and forever!"
 GER_a_new_constitution:0 "A New Constitution"
 GER_a_new_constitution_desc:0 "The current constitution is a farce, and the previous constitutions were horribly flawed. Now we have a chance to start over — to create something new."
 GER_depoliticize_the_heer:0 "Depoliticize The Wehrmacht"
 GER_depoliticize_the_heer_desc:0 "The Wehrmacht has been sticking its nose into nominally civil proceedings for far too long. Its relationship with the NSDAP cannot be ignored. It is time for change, and there will have to be some early retirements."
 GER_free_and_fair_elections:0 "Force Free Elections"
 GER_free_and_fair_elections_desc:0 ""
 GER_the_people_should_know:0 "The People Shall Know"
 GER_the_people_should_know_desc:0 ""
 GER_welfare_for_all:0 "Welfare For All"
 GER_welfare_for_all_desc:0 ""
 GER_guarantee_healthcare:0 "Guarantee Healthcare"
 GER_guarantee_healthcare_desc:0 ""
 GER_empower_women:0 "Empower Women"
 GER_empower_women_desc:0 ""
 GER_protect_minorities:0 "Protect Minorities"
 GER_protect_minorities_desc:0 ""
 GER_right_to_live:0 "A Right To Live"
 GER_right_to_live_desc:0 ""
 GER_anti_corruption:0 "The End Of Corruption"
 GER_anti_corruption_desc:0 ""
 GER_a_fair_system:0 "A Fair System"
 GER_a_fair_system_desc:0 ""
 GER_ban_the_nsdap:0 "Ban The NSDAP"
 GER_ban_the_nsdap_desc:0 ""
 GER_never_again:0 "Never Again"
 GER_never_again_desc:0 ""
 GER_free_the_pakt:0 "Free The Pakt"
 GER_free_the_pakt_desc:0 ""
 GER_an_overdue_apology:0 "An Overdue Apology"
 GER_an_overdue_apology_desc:0 ""
 GER_reach_out_to_america:0 "Reach Out To America"
 GER_reach_out_to_america_desc:0 ""
 GER_something_to_hope_for:0 "Something To Hope For"
 GER_something_to_hope_for_desc:0 ""
 GER_first_elections_of_the_republic:0 "First Elections Of The German Republic"
 GER_first_elections_of_the_republic_desc:0 ""
 GER_two_steps_back:0 "Two Steps Back"
 GER_two_steps_back_desc:0 "Damn them! Speer and his perfidious ilk in the NSDAP and the Wehrmacht have shown their hand! We now have to work with them to achieve our goals, lest we lose everything we have accomplished."
 GER_appease_the_party:0 "Appease The NSDAP"
 GER_appease_the_party_desc:0 "Despite fragmenting, the Gang of Four has underestimated just how deep the NSDAP has sunk its claws into Germany. We must acknowledge their influence despite all their atrocities and bungling—those stupid sons of—"
 GER_cut_a_deal_with_the_wehrmacht:0 "Cut A Deal With The Wehrmacht"
 GER_cut_a_deal_with_the_wehrmacht_desc:0 "The Wehrmacht is a necessary evil. As pigheaded as they are, those inbred ingrates are absolutely full of themselves. I can't believe they backed Speer—why would they—"
 GER_firm_handshakes:0 "Firm Handshakes"
 GER_firm_handshakes_desc:0 "Democracy is built on compromise...?"
 GER_and_greased_palms:0 "Greased Palms"
 GER_and_greased_palms_desc:0 "Not the first time we've had to play dirty..."
 GER_meet_with_the_old_man:0 "Meet With The Old Man"
 GER_meet_with_the_old_man_desc:0 "Technically, Albert Speer is still Führer. The Gang of Four believed they had managed to fully defang him, but he has proven resilient. He has impeded democratization at every turn and has made no effort to step down quietly. \n\nAssassination would probably provoke the NSDAP and the Wehrmacht, so this has, regrettably, necessitated reaching some sort of consensus with him."
 GER_point_out_external_threats:0 "Point Out External Threats"
 GER_point_out_external_threats_desc:0 "The Russians have managed to pull themselves together and now loom on the eastern border. Himmler's atrocity remains strong, and while they continue to exist our stability will always be in question. Reminding the Wehrmacht of these crucial facts will help dissuade them from doing anything rash. We are all fellow "Aryans," after all."
 GER_promise_stability:0 "Promise Stability"
 GER_promise_stability_desc:0 "The Gang of Four has sworn not to take any drastic reforms. The Reich will be preserved in whatever manner it exists from now on."
 GER_completely_coincidental_pay_increases:0 "Completely Coincidental Pay Increases"
 GER_completely_coincidental_pay_increases_desc:0 "Bribing the military? Nooooo that would never happen."
 GER_shadow_over_the_tricolor:0 "Shadow Over The Black Red and Gold"
 GER_shadow_over_the_tricolor_desc:0 "Despite our best efforts the vestiges of NSDAP dominance remain as strong as ever. Moving forward the Nazi Party will remain a force in German politics whether we like it or not. \n\nPolitical power will remain centralized in the hands of the Fuhrer and although the elections will be free, there will be a continued risk of a backslide into dictatorship. \n\nBut we have hope, and hope is better then nothing at all."
 GER_turn_back_the_clock:0 "Nowhere Else To Go But Backwards"
 GER_turn_back_the_clock_desc:0 "With the initial plans for a full constitutional rewrite having fallen through, the Gang of Four has been forced to create a freakish hybrid of the Weimar and Nazi constitutions. It is riddled with loopholes, and the democratization process is no longer certain. One can only hope that it will not be abused in the future."
 GER_turn_back_the_clock_tt:0 "§YThe Reichstag Election Menu Will Now Be Available. Check The Political Tab. It Is Recommended You Use Your Political Power To Boost The Party Of Your Choice To Help Them Win The Election!§!"
 GER_an_election_once_more_in_the_reich:0 "Elections Once More In The Reich"
 GER_an_election_once_more_in_the_reich_desc:0 "“The Weimar Republic” was never officially called that. It was the German Reich; it has always been the German Reich. Now is the time to step down and see whether our efforts have borne fruit or will be drowned out."
 ##economy
 GER_on_the_mend:0 "On The Mend"
 GER_on_the_mend_desc:0 "With the inauguration of the first elected government in several decades, the Reich can now dedicate its efforts to the remaining economic recovery following the Slave Revolt. \n\nWith much infrastructure still damaged across the Reich, this will take some time."
 GER_the_final_death:0 "The Final Death"
 GER_the_final_death_desc:0 "Despite the official abolishment of slavery, there are still those who continue the practice in gray areas or outright illegally. \n\nWe will put an end to this and free the remaining indentured workers from further bondage."
 GER_plan_for_the_future:0 "Plan For The Future"
 GER_plan_for_the_future_desc:0 "As we continue into this brave new era, the Reich's government needs some sort of comprehensive plan to further reform and expand the economy following the Speerite reforms. \n\nSeveral competing proposals have been cropping up for an economic plan and a decision will have to be made sooner rather than later."
 GER_clean_up_the_revolt_remains:0 "Clean Up The Remains"
 GER_clean_up_the_revolt_remains_desc:0 "With many of the Eastern towns and cities still damaged after the crisis with Schoerner and the militarists, it's time to dedicate time to rebuilding and restoring the Pakt to nominal function."
 GER_reopen_the_exchange:0 "Reopen The Exchange"
 GER_reopen_the_exchange_desc:0 "The Frankfurt Exchange has been shuttered for some time during the governmental crisis. Needless to say, this is no longer necessary and it should be reopened posthaste."
 GER_back_to_work:0 "Back To Work"
 GER_back_to_work_desc:0 "With economic stability and a sense of normality returning, it's time we encourage employers and employees alike to kick the economy back into gear! Especially those who were lazy enough to rely on forced labor. If they wish to have such luxury of time, then they should be willing to pay wages for once."
 GER_crossroads:0 "Crossroads"
 GER_crossroads_desc:0 "It is now time to make a decision on the future of the German economy. \n\nOn one hand, a statist approach can be adopted. This path could yield faster and greater economic growth at higher upfront cost. \n\nOn the other hand, a market based economy can be pursued - building off of previous reforms. This would lead to slower but more continuous growth and less stress on government bureaucracy. A choice will have to be made now or never."
 GER_full_speed_ahead:0 "Full Speed Ahead"
 GER_full_speed_ahead_desc:0 "It has been decided that the economy shall reorient towards a more government involved system. Germany must develop or fall behind!"
 GER_cant_rush_art:0 "Can't Rush Art"
 GER_cant_rush_art_desc:0 "The Reich will continue on the present path of sustainable market based economics. The government will play a role as a regulator but the real drive will come from entrepreneurs and German companies."
 GER_open_the_markets:0 "Open The Markets"
 GER_open_the_markets_desc:0 "Too much nonsense red tape still clogs the gears of the economy! We need to slash it and make sure the people can go about their business unhindered and unmolested by busybodies."
 GER_lower_the_tariffs:0 "Lower The Tariffs"
 GER_lower_the_tariffs_desc:0 "The German Reich maintains a high tariff for goods coming from outside the Pakt. We should lower it at least slightly so some goods from outside can start flowing in, expanding our economic prospects."
 GER_court_foreign_capital:0 "Court Foreign Markets"
 GER_court_foreign_capital_desc:0 "The neutral nations of Europe and the rest of the world have considerable untapped potential for both them and us. We can start to expand our economic horizons by concluding trade deals with various nations around the world."
 GER_the_european_market:0 "The European Market"
 GER_the_european_market_desc:0 "Europe has many developed economies ripe for trade and investment!"
 GER_look_westward:0 "Look Westward"
 GER_look_westward_desc:0 "The United States, as well as other nations in the Americas, are quite prosperous. Perhaps we can conclude some sort of economic agreements with them?"
 GER_look_eastward:0 "Look Eastward"
 GER_look_eastward_desc:0 "The Asian markets have considerable untapped potential. Surely the nations there will be happy to have an alternative to Japanese domination."
 GER_the_banking_reform:0 "Comprehensive Banking Reform"
 GER_the_banking_reform_desc:0 "The banking system must be made more open and less corrupt than it was before."
 GER_a_golden_mark:0 "A Golden Mark"
 GER_a_golden_mark_desc:0 "By building up our gold reserves, we can back the Reichsmark with a substantial reserve of precious metals, strengthening our national currency and making it more attractive to investors."
 GER_a_web_of_commerce:0 "A Web Of Commerce"
 GER_a_web_of_commerce_desc:0 "Not only will we focus on expanding the Reich via conquest but by commerce as well."
 GER_the_mittelstand:0 "The Mittelstand Grows"
 GER_the_mittelstand_desc:0 "The small to medium size businesses have been flourishing since economic policies favorable to them were passed. These excellent establishments both enrich middle class proprietors and provide jobs for countless people across the Reich. Added competition prevents monopolization and economic stagnation."
 GER_privatize_the_giants:0 "Privatize Wasteful State Assets"
 GER_privatize_the_giants_desc:0 "Many businesses and services of the Reich still remain under direct state control even when they make little sense. The government would lose nothing by divesting of these wasteful enterprises - nothing but bureaucratic overhead and thumb twiddling."
 GER_encourage_entrepreneurs:0 "Entrepreneur Friendly Policies"
 GER_encourage_entrepreneurs_desc:0 "It's really ridiculous how many hoops must be traversed before one is allowed to start their own company. We could do to discard some of these regulatory impediments, and open the door for new innovative businesses."
 GER_the_consumer_boom:0 "The Consumer Consumption Boom"
 GER_the_consumer_boom_desc:0 "An economy is not just a matter of material production! People naturally want new objects to buy, even if they're just buying them to look good. Is this a sin? No! It drives economic growth and brings in more revenue for the state. \n\nAlso, it creates jobs. And besides, we can always repurpose the factories for war production later."
 GER_the_housing_question:0 "A Question of Houses"
 GER_the_housing_question_desc:0 "With a growing population, housing is in high demand, especially in the suburbs of Germania, Munich, Frankfurt, and Cologne. We would do well to institute a project to construct new housing units in those areas, to bring down supply strain and provide new houses for an expanding number of productive workers."
 GER_from_rubble_to_riches:0 "From Rubble To Riches"
 GER_from_rubble_to_riches_desc:0 "With the private sector expanding, the scars of the Slave Revolt and indeed the slave system itself are finally fading away. The Reich can now look forward to a booming economy where everyone can prosper, not just the select few."
 GER_the_borse_reborn:0 "The Borse Reborn"
 GER_the_borse_reborn_desc:0 "The Borse is the nickname of the Frankfurt Stock Exchange building. The building itself has been neglected these past few decades and could do with an update with all the latest digital stock trading technologies."
 GER_consumer_society:0 "Person Driven Economy"
 GER_consumer_society_desc:0 "If we rely on economic growth derived entirely from government expenditure we will be setting ourselves up for disaster. However, personal expenditure is another matter. As people spend more, companies have more money to invest, generating growth, and giving more money to spend back to the people. A virtuous cycle and one we should be keen to chase. Otherwise, we will lock ourselves into a vicious cycle of debt and crashes."
 GER_the_wirtschaftswunder:0 "The Wirtschaftswunder"
 GER_the_wirtschaftswunder_desc:0 "Also known as the "Miracle On the Rhine", the Wirtschaftswunder has been the culmination of our efforts as production and revenue expand massively, especially in the heavily industrialized Rhineland."
 GER_labor_of_love:0 "Labour Of Love"
 GER_labor_of_love_desc:0 "What is more lovely to a German than productivity? No doubt the lazier nations may scoff at this but pride in one's work is never a bad sentiment."
 GER_the_union_question:0 "Return Of The Unions"
 GER_the_union_question_desc:0 "With the end of the NSDAP ban on trade unions, said unions have begun to pop up in force. They'll serve as an excellent venue for balanced employee-employer relationships. \n\nHopefully they don't cause as much of a ruckus this time around."
 GER_a_social_contract:0 "A Social Contract"
 GER_a_social_contract_desc:0 "Hard workers should be rewarded for a lifetime of honest labour with a decent pension to retire on. Something to look forward to during everyone's halcyon days."
 GER_the_eight_hour_day:0 "The Eight Hour Day"
 GER_the_eight_hour_day_desc:0 "Now, we all here love work, but perhaps there should be a decent limit to how much time is spent working on a given day? After all, if overtime is needed, then an employee can just be paid more."
 GER_welfare_for_the_volk:0 "Welfare For The Volk"
 GER_welfare_for_the_volk_desc:0 "The people should have the necessary amount of support to start families, recover from unfortunate losses, and build themselves worthy of the greatest nation in the world."
 GER_labor_and_the_market:0 "For The Commons"
 GER_labor_and_the_market_desc:0 "Should the working men and women of Germany not enjoy the fruits of their labour? While the greedy might whinge and moan about it, an honest life of work should be rewarded fairly!"
 GER_a_fair_playing_field:0 "A Fair Playing Field"
 GER_a_fair_playing_field_desc:0 "The market should decide what something is worth and what it isn't. It's the fairest system there is and one that's guaranteed to generate wealth for everyone."
 GER_a_learned_nation:0 "To Be Well Learned"
 GER_a_learned_nation_desc:0 "Of course, education is a no less important concern to Germany's future fortunes. With technological competition heating up it will be critical for the Reich to train new scientists and engineers in order to keep up with the Fatherland's rivals."
 GER_the_peoples_prosperity:0 "Productivity And Power"
 GER_the_peoples_prosperity_desc:0 "It is the will and drive of the German that is the reason for his success - his unbeatable achievements. In all fields, from automobiles to aircraft, we have exceeded all others. \n\nAnd yet that is not enough. We will go further beyond this, until we are unmatched in all things."
 GER_infrastructure_renewal:0 "Road And Rail Renewal"
 GER_infrastructure_renewal_desc:0 "The Autobahn and railways have been in need of expansion as the nation progresses towards the 21st century. Some money should be dedicated towards ensuring national infrastructure is both up to the needs of the civilian and military sectors."
 GER_a_nation_transformed:0 "A Nation Transfigured"
 GER_a_nation_transformed_desc:0 "Only some years ago was Germany a stumbling giant running on borrowed time. Since then, the nation has been transformed into an economic power worthy of its stature. And we can go farther still until the Reich is the uncontested economic center of the entire Earth."
 GER_the_vup_vision:0 "Vision Of Restoration"
 GER_the_vup_vision_desc:0 "With the economy growing at unprecedented levels it's now time to pump the brakes slightly and ensure everyone gets their fair share of the cake."
 GER_the_rsp_vision:0 "Vision Of Wealth"
 GER_the_rsp_vision_desc:0 "Our national economy has indeed been growing steadily but there are still ways we can truly unleash the German economy and allow it to fulfill its total potential. Absolute growth is the only true measure of success."
 GER_collective_prosperity:0 "Collective Prosperity"
 GER_collective_prosperity_desc:0 "It is easy to fall into patterns of greed and hoarding with capitalism. The Reich's government should take care to ensure that profits aren't just invested for the sake of creating more profit but for public good as well."
 GER_the_welfare_state:0 "The Supportive State"
 GER_the_welfare_state_desc:0 "Why should the Reich and the Fuhrer be seen as uncaring distant individuals? The state should take care of its people, not simply govern them and give orders."
 GER_a_peoples_economy:0 "Popular Economics"
 GER_a_peoples_economy_desc:0 "What they give, we give back. It's as simple as that. \n\nEconomic justice if you will."
 GER_let_the_market_decide:0 "Reasonable Economics"
 GER_let_the_market_decide_desc:0 "Why strangle the market with nonsense taxes and idiotic subsidies? When such things were attempted previously, the German economy was driven to ruin. No, the Reich should take care to ensure that economic prosperity continues unhindered."
 GER_a_city_upon_a_hill:0 "Rising Phoenix"
 GER_a_city_upon_a_hill_desc:0 "From the ashes of depression and retraction, the German economy rises to new heights never before dreamed of even during the era of reckless post-war spending. Indeed, there is only one way to go from here but up!"
 GER_the_invisible_hand:0 "The Invisible Hand"
 GER_the_invisible_hand_desc:0 "The state should not intervene in the economy any more than absolutely necessary. Reckless interventionism puts a damper on growth and only introduces ways for corruption and favoritism to take root. We should take care to avoid such things."
 GER_the_power_of_capital:0 "The Power of Capital"
 GER_the_power_of_capital_desc:0 ""
 GER_for_the_reich:0 "For the Reich"
 GER_for_the_reich_desc:0 ""
 GER_for_the_volk:0 "For the Volk"
 GER_for_the_volk_desc:0 ""
 GER_for_the_wehrmarcht:0 "For the Wehrmacht"
 GER_for_the_wehrmarcht_desc:0 ""
 GER_unleash_the_companies:0 "Unleash the Companies"
 GER_unleash_the_companies_desc:0 ""
 GER_strategic_stockpiling:0 "Strategic Stockpiling"
 GER_strategic_stockpiling_desc:0 ""
 GER_the_german_miracle:0 "The German Way"
 GER_the_german_miracle_desc:0 "Once the laughing stock of Europe, the German economy is once again the strongest on the continent and no doubt a world competitor. Money flows into our coffers and our common German hands in equal measures and nations around the world flock to our shores to conduct trade and business. \n\nIt was a German century before, and it will be two German centuries now!"
 GER_a_lust_for_power:0 "A Lust For Power"
 GER_a_lust_for_power_desc:0 "With our growing economy, more power output is required! We'll need more power plants to keep our factories running!"
 GER_exploit_caspian_natural_gas:0 "Exploit Caspian Natural Gas"
 GER_exploit_caspian_natural_gas_desc:0 "The Caspian is full of natural gas lying there unexploited. Natural gas has incredible potential as an energy source for electricity turbines."
 GER_coal_for_germany:0 "Coal For Germany"
 GER_coal_for_germany_desc:0 "Coal has powered factories for almost a century and today is no different. Expanding and building new coal plants will be necessary for meeting the Reich's growing energy demands."
 GER_black_gold:0 "Black Gold"
 GER_black_gold_desc:0 "Oil is the lifeblood of the modern world and acquiring it is hence a top priority for every nation worth more than the dirt they lie on. We are not immune to this oil thirst so we should ensure our nearby oil sources are explored and exploited to the fullest lest we suffer a second Oil Crisis."
 GER_oh_dam:0 "Oh Dam!"
 GER_oh_dam_desc:0 "Hydroelectric power generates megawatts upon megawatts of power without the danger of dirty pollutive smog choking the nearby ecosystem."
 GER_power_of_fission:0 "The Power Of Fission"
 GER_power_of_fission_desc:0 "Nuclear power won us the Second World War, but it can also win the peace. With essentially limitless operating time, fission reactors can keep the Fatherland powered ad infinitum without need for reliance on unreliable outside export."
 GER_energy_security:0 "Energy Security"
 GER_energy_security_desc:0 "The Reich cannot rely on the fickle whims of international geopolitics for a stable supply of energy resources. The Reich must take care to ensure it is a self reliant power - pun intended."
 GER_manufactured_victory:0 "Manufactured Victory"
 GER_manufactured_victory_desc:0 "Strength is determined by manufacturing output, real interactable objects, not numbers on a counter going up and down."
 GER_reignite_the_industry:0 "Fire Up The Industry"
 GER_reignite_the_industry_desc:0 "Production levels could be higher still! We need more guns, panzers, planes, rockets, all of it! Stockpile those goods and we will be ready for absolutely everything!"
 GER_chemistry_and_autarky:0 "Chemistry And Autarky"
 GER_chemistry_and_autarky_desc:0 "Our capacity for strategic chemical processing and refinement could use expansion as the Reich has previously relied on France and England for certain plastics and other compounds. Domestic production will be necessary especially for future industrial and technological expansion. Everything from plastics to organic analogues will be made in Germany."
 GER_to_the_mines:0 "To The Mines!"
 GER_to_the_mines_desc:0 "Germany has always been blessed by bountiful natural resources. With industry expanding we will require exponentially more raw materials - necessitating expansion of present sites as well as the founding of new mines."
 GER_vacuum_tubes_and_digital_readouts:0 "Vacuum Tubes And Digital Readouts"
 GER_vacuum_tubes_and_digital_readouts_desc:0 "Digital technology has grown rapidly in importance in the past few decades. As analogue computing is phased out in favor of digital alternatives, we will require facilities capable of producing the necessary components for the coming digital revolution."
 GER_weapons_of_war:0 "Weapons Of War"
 GER_weapons_of_war_desc:0 "Of course, military manufacturing still remains a critical field to the Fatherland's continued existence and hence requires special attention. The Reich must make efforts to ensure the domestic military industrial complex is not only capable of arming Germany but all our allies and administrative zones as well."
 GER_machines_of_today_and_tomorow:0 "Machines Of Today And Tomorrow"
 GER_machines_of_today_and_tomorow_desc:0 "Stagnation cannot be tolerated. Better planes, better trucks, better everything. It is what is required if the Reich wishes to remain the dominant force in the world, let alone Europe."
 GER_the_bleeding_edge_of_tech:0 "The Bleeding Edge Of Tech"
 GER_the_bleeding_edge_of_tech_desc:0 "Germany has been renowned for its status as a home for astounding new technologies and processes. From the globe to the Haber Process, Germany has led the way in striving bravely into the future. With competition heating up with the Japanese and Americans we should be keen to maintain our advantage."
 GER_the_silicon_revolution:0 "Silicon Ambitions"
 GER_the_silicon_revolution_desc:0 "Semiconductors are metals whose relatively poor electrical conductivity allows them to be used for instruments with precise voltage requirements. Chief among these are digital computers. Their superior processing speed for smaller processors makes them a hot new area of research. Hence securing the raw materials needed to construct these wonderful new innovations should be a top priority."
 GER_the_datennetz:0 "The Datennetz"
 GER_the_datennetz_desc:0 "A new proposal seeks to build off of NETZRAM by introducing a method of allowing computers to communicate by long distance - much like talking through a telephone. Research institution and university computers can be hooked into this network and transfer data and messages between each other. Very convenient!"
 GER_automated_industry:0 "Roboticized Industry"
 GER_automated_industry_desc:0 "While robots bring to mind the fantastical human like machines of stories like Metropolis, in reality robots are still a very real concept, albeit much more subdued. Roboticized equipment can do tasks automatically in assembly lines, speeding up manufacturing and cutting down on labor costs."
 GER_new_rocket_components:0 "New Rocket Components"
 GER_new_rocket_components_desc:0 "As foreign nations breach into what was once our uncontested domain, the stars, the need for improved rockets, capsules, and satellites continues to grow."
 GER_software_macht_frei:0 "Software Macht Frei"
 GER_software_macht_frei_desc:0 "Using computers saves so much time! Calculations, message composition, even writing letters. Although limited now imagine all the things that could be done in the future without a single piece of paper nor a single pen!"
 GER_eyes_in_the_sky:0 "Eyes In The Sky"
 GER_eyes_in_the_sky_desc:0 "Traditionally the realm of recon aircraft, reconnaissance can now be accomplished with orbiting satellites. \n\nUnlike recon aircraft these satellites will be less vulnerable to attack and indeed can theoretically orbit perpetually."
 GER_the_information_age:0 "Information Glut"
 GER_the_information_age_desc:0 "Data, information, and intelligence. No matter what it is called the fact is that knowledge provides the incredible ability to foresee what happens in the future. With more knowledge comes greater accuracy and farther sight."
 GER_atoms_for_peace:0 "Atoms For Peace"
 GER_atoms_for_peace_desc:0 "Atomic power isn't just for manufacturing bombs and destroying cities - perhaps even the world - it's an incredible source of power that can be utilized everywhere and produces little pollution at the cost of manageable radioactive waste. Hence pursuing further improvements to the nuclear program would be a wise decision as we march ever forwards into the future."
 GER_the_reactor_program:0 "The Reactor Program"
 GER_the_reactor_program_desc:0 "A series of new nuclear fission reactors will be constructed and brought online over the next few years to meet our growing power requirements."
 GER_the_solar_question:0 "The Solar Question"
 GER_the_solar_question_desc:0 "Solar energy has been proposed as a new energy source, requiring nothing but sunshine to generate theoretically limitless pollution free energy. Of course, there are still some practicalities and problems with the technology but such issues can be worked out in time."
 GER_fusion_dreams:0 "Fusion Dreams"
 GER_fusion_dreams_desc:0 "Fusion power is a type of nuclear power that is caused by the combining of atoms, unlike fission which is derived from the splitting of atoms. This process creates massive amounts of energy, more so than fission, and generates less waste. Unfortunately, fusion presently requires more energy to start it than it produces. Practical fusion reactors may be some decades off but if we get a head start now we may eventually have an energy source more powerful than anything mankind has produced before."
 GER_green_chemistry:0 "Green Chemistry"
 GER_green_chemistry_desc:0 "Current chemical processing and refinement procedures create lots of toxic waste. Certain alternative procedures have been proposed that minimize unwanted side products, allowing for greater efficiency and less waste to be disposed of."
 GER_the_grid_of_tomorrow:0 "The Grid Of Tomorrow"
 GER_the_grid_of_tomorrow_desc:0 "The Fatherland's energy grid could use some upgrading to ensure that it can handle higher power loads. Transformers and transmission lines alike will be upgraded for this purpose."
 GER_energy_independence:0 "Energy Autonomy"
 GER_energy_independence_desc:0 "No longer will the Reich need to rely on other nations for its energy needs. Even if the world will turn against us we will still have all the power we need for any future war."
 GER_smart_munitions:0 "Bombs With Intelligence"
 GER_smart_munitions_desc:0 "Smart munitions, or precision guided munitions, are bombs and artillery shells that can be guided by an operator, usually through a laser. This allows for greater accuracy when striking targets as opposed to traditional, unguided munitions."
 GER_the_panzer_of_tomorrow:0 "Towards A Greater Panzer"
 GER_the_panzer_of_tomorrow_desc:0 "Modern warfare has placed special emphasis on armored vehicles capable of transporting troops or delivering firepower up close."
 GER_supersonic_ambitions:0 "Ever Closer To Hypersonic"
 GER_supersonic_ambitions_desc:0 "Hypersonic speeds exceed Mach 5 or in other words 5 times the speed of sound. Ultimately it is our ambition to construct a fighter jet capable of reaching these speeds, but aerodynamic challenges make this an impractical option for military aircraft, limiting us to rocket powered research planes that are really no more than manned missiles. Still, we can develop practical cruise missiles capable of reaching these speeds and one day we may even develop an aircraft to match."
 GER_electronic_warfare:0 "Electronic Disruption"
 GER_electronic_warfare_desc:0 "Electronic warfare suites can disable radars allowing us to protect usually vulnerable strike aircraft. It is still an emerging technology and we need to ensure the Reich will be ahead of its enemies in its development."
 GER_beyond_the_atmosphere:0 "Beyond The Atmosphere"
 GER_beyond_the_atmosphere_desc:0 "Intercontinental Ballistic Missiles are the longest range missiles in existence capable of delivering nuclear payloads thousands of kilometers away."
 GER_the_soldaten_of_tomorrow:0 "The Ubersoldaten"
 GER_the_soldaten_of_tomorrow_desc:0 "Ultimately wars are still fought by infantry, men armed with rifles. It is critical that our soldiers have the best possible equipment. Better rifles, and better armor, our troops will be unbeatable!"
 GER_wunderwaffen_reborn:0 "Wunderwaffen Reborn"
 GER_wunderwaffen_reborn_desc:0 "Wunderwaffe has been a term used for denigration in the past. Idiotic weapons that cost far too much for what they offer. But we can improve on these wishful weapons. We can create weapons that are not only practical but so astounding our enemies will quiver in fear as they witness them!"
 GER_full_spectrum_dominance:0 "Full Spectrum Dominance"
 GER_full_spectrum_dominance_desc:0 "We must seek not only to gain an advantage in only one aspect of war, but all of them! Germany shall be a land power, a sea power, and an air power! With the economy to match and the will to use it!"
 GER_the_green_revolution:0 "The Agricultural Marvel"
 GER_the_green_revolution_desc:0 "The bedrock of civilization, agriculture too will be revolutionized with new equipment and new methods. With this we shall exponentially grow our food production and feed our ever growing Fatherland. After all, territory means nothing without people to fill it with!"
 GER_synthetic_materials:0 "Synthetic Materials And Real Improvements"
 GER_synthetic_materials_desc:0 "Material chemistry and engineering has grown ever better thanks to our generous funding. Germany will soon have the greatest manufacturing materials in all of history!"
 GER_the_technological_miracle:0 "Industry Of Wonders"
 GER_the_technological_miracle_desc:0 "Why stop when we could go so much farther? If we ever stop striving that will be when we die. For the Fatherland we must push ever onwards and build a future for our children and our children's children!"
 GER_continue_development_of_netzram:0 "Continue Development Of NETZRAM"
 GER_continue_development_of_netzram_desc:0 "NETZRAM has been a resounding success with the Reich gaining a critical edge in research computing."
 GER_the_REICH_language:0 "The WERK Language"
 GER_the_REICH_language_desc:0 "WERK, the Wissenschaftliche Entwicklungs-RechenKode, is the name of a new general purpose programming language capable of both high and low level instructions. Its modularity and easy to use syntax make it ideal for a variety of tasks, including OS building."
 GER_study_metal_oxide_transistors:0 "Study Metal-Oxide Transistors"
 GER_study_metal_oxide_transistors_desc:0 "Transistors have the capability to surpass vacuum tubes in terms of use due to their smaller size and greater potential power allowing for smaller and smaller computers."
 GER_the_haber_personal_computer:0 "The Haber Personal Computer"
 GER_the_haber_personal_computer_desc:0 "Available commercially, the Haber Personal Computer brings the power of a university research computer right to your home! Well, not entirely, but it is a nice time saving tool. Some people have even started playing games on it."
 #military
 GER_the_wehermacht_and_germany:0 "The Wehrmacht And Germany"
 GER_the_wehermacht_and_germany_desc:0 "The Wehrmacht has always protected Germany from outside foes and to this day it still remains perhaps the most important institution of the German Reich. Not even a change in regime can alter this fact."
 GER_new_heer_initiative:0 "The New Heer Initiative"
 GER_new_heer_initiative_desc:0 "The New Heer Initiative is aimed at collecting proposals and designing new ways to improve the Heer's performance and power. Many competing proposals have cropped up and there are generally two schools of thought for where the Heer can reform from here. The first is Horst Stechbarth's proposals for an almost completely mechanized army. The other proposal is Wolfgang Altenburg's proposal for a more special forces/elite army. Of course, a balanced approach is also possible."
 GER_favor_horst_stechbarth:0 "Favor Horst Stechbarth"
 GER_favor_horst_stechbarth_desc:0 "General Stechbarth's ideas are the most promising and build off of preestablished Heer doctrines. It is only natural then that his ideas are favored."
 GER_favor_wolfgang_altenburg:0 "Favor Wolfgang Altenburg"
 GER_favor_wolfgang_altenburg_desc:0 "General Altenburg's plans are innovative and refreshing and offer the chance to close the gaps the Heer has suffered from over the past several decades. It is thus important to favor his proposals going forward."
 GER_the_total_blitz_idea:0 "The Total Blitz Idea"
 GER_the_total_blitz_idea_desc:0 "To completely overwhelm the enemy with lightning fast strikes all across his front, that is the idea of the Total Blitz. To destroy the enemy's capability to fight before he can even respond."
 GER_mass_introduction_of_the_man_one:0 "Mass Introduction Of The MAN One"
 GER_mass_introduction_of_the_man_one_desc:0 "The MAN One is a new family of military tactical off road trucks designed for transport of both material and men, as well as possessing the capability for acting as weapons platforms."
 GER_test_the_lines:0 "Testing Enemy Lines"
 GER_test_the_lines_desc:0 "Probing attacks are useful for exposing weaknesses in enemy defences. APCs are ideal for these scenarios allowing for rapid deployment and evac of infantry squads."
 GER_hard_shock:0 "The Hardest Shock"
 GER_hard_shock_desc:0 "Up close and personal, the Panzer can deal death as well as it does from afar. And really the last thing you'd want to see is a tracked monster driving towards you at full speed, cannon or no."
 GER_depleted_uranium_armor:0 "Depleted Uranium Armor"
 GER_depleted_uranium_armor_desc:0 "Depleted uranium from our reactors serves as an excellent heavy armor for panzers. No evidence of radiation poisoning from their use has been produced as of yet."
 GER_mobile_sam_improvements:0 "Mobile SAM Improvements"
 GER_mobile_sam_improvements_desc:0 "Rapid transport of surface to air missile launchers means a more flexible air defence net. At bare minimum, a SAM on wheels can be more easily stacked away and hidden than one that isn't. Mobile SAMs also pack more of a punch and can fire from longer distances compared to shoulder launched alternatives."
 GER_fund_mrap_prototypes:0 "Fund MRAP Prototypes"
 GER_fund_mrap_prototypes_desc:0 "An MRAP is a Mine Resistant Armored Protected vehicle. Its heavy armor plating, elevated suspension, and v shaped chassis make it ideal for defending against mines, small bombs, and small arms fire."
 GER_panzerfaust_panzer:0 "Panzerfaust Panzer"
 GER_panzerfaust_panzer_desc:0 "What's the best counter to a panzer? Another panzer of course! Well, one specifically armed with an armor penetrating missile in addition to its main cannon. These new designs increase the firepower of our armored force without the need to completely redesign the hulls of our existing vehicles."
 GER_the_death_of_infantry:0 "The Death Of Infantry"
 GER_the_death_of_infantry_desc:0 "Foot marching infantry has been a staple of warfare since before the invention of agriculture. Still, there may be a time when no longer do any troops move on their legs but by wheels. Perhaps not, but nevertheless the need to mechanize all our forces is a pressing one."
 GER_all_purpose_recon:0 "Recon On Wheels"
 GER_all_purpose_recon_desc:0 "Reconnaissance vehicles carry special monitoring equipment and usually are based on the chassis of an existing vehicle. Unlike traditional recon units, armored recon are designed to put up a fight and not just retreat." 
 GER_armored_fist_doctrine:0 "Drive Through Their Defences"
 GER_armored_fist_doctrine_desc:0 "Aggressive attacks with large mechanized formations will bring down heaven and earth upon an opposing force, preventing any sort of response. We'll destroy them all in one quick strike!"
 GER_combined_arms_training:0 "Standardized Vehicle Training"
 GER_combined_arms_training_desc:0 "Integrating vehicle training for all basic training will improve our troops' familiarity with the equipment."
 GER_retool_the_tank_works:0 "Retool The Panzer Works"
 GER_retool_the_tank_works_desc:0 "The present panzer manufacturing plants could use some refinement and efficiency improvements."
 GER_fire_and_maneuver:0 "Fire And Move!"
 GER_fire_and_maneuver_desc:0 "Mobile and deadly, our armored forces can bring death up close or far away, wherever - whenever. \n\nProvided we aren't fighting in a swamp or a mountain range or something like that. But why bother with that when you can simply bypass and encircle enemies holed up in unfavorable ground?"
 GER_forward_observer_networks:0 "Forward Observer Networks"
 GER_forward_observer_networks_desc:0 "Of course, you need to know what to hit before you hit it. Forward observers can mark targets and scope out enemy defences before an engagement even begins."
 GER_rapid_deployment_doctrine:0 "Rapid Deployment Doctrine"
 GER_rapid_deployment_doctrine_desc:0 "The Reich has a massive frontier to defend and hence the ability to move forces quickly is a critical one."
 GER_standardized_chassis:0 "Chassis Standardization"
 GER_standardized_chassis_desc:0 "A present issue with some of our vehicles is that each role, such as maintenance, recon, or troop transport, all have different specialized vehicles. Leftover from the days of overengineering, production efficiency, as well as ease and cost of repair, could be positively impacted if a standard base vehicle was used, with specialized modifications added as needed."
 GER_a_supercar_truck:0 "A Supercar Military Truck?"
 GER_a_supercar_truck_desc:0 "While something of an exaggeration, an idea has been floating around to contract Porsche to develop a military truck capable of reaching absurd speeds for a usual truck. The present proposal aims to create a truck capable of reaching 130 km/h."
 GER_thermal_optics_program:0 "Thermal Optics Program"
 GER_thermal_optics_program_desc:0 "Thermal optics allows for greater accuracy in targeting as well as the ability to fire during nighttime without the use of external lights."
 GER_stechbarths_school_of_war:0 "Stechbarth's Idea"
 GER_stechbarths_school_of_war_desc:0 "The idea is simple. Base the army doctrine around whether or not you have a panzer? No panzer? Be cautious and tricky. Have a panzer? Drive straight through, hit the enemy hard and shatter their resistance."
 GER_logistical_revolution:0 "Lighting Logistics"
 GER_logistical_revolution_desc:0 "An admitted weak point of the Wehrmacht in some theaters of the Second World War, logistics is not the most exciting element of warfare but is regardless one of the most crucial. Soldiers cannot fight without food, and neither can panzers without fuel."
 GER_wheels_not_legs:0 "Wheels, Not Legs"
 GER_wheels_not_legs_desc:0 "Why footslog when an APC can take you where you need to go? No more effort and time wasted marching to and fro - in the 20th century German troops will not march a step more than they have to!"
 GER_reactive_armor_packages:0 "Mass Distrubution of Reactive Armor Packages"
 GER_reactive_armor_packages_desc:0 "Reactive armor uses small explosives to create a counterexplosion to disrupt the effect of armor penetrating shells. Use in moderation!"
 GER_war_games:0 "Nonstop War Games"
 GER_war_games_desc:0 "Ready for anything, that should be a mantra every member of the Heer should know. It is all well and good to win one war, but what about the next? Or the next? Or the one after that?"
 GER_mobile_field_repair:0 "Mobile Field Repair"
 GER_mobile_field_repair_desc:0 "Occasionally an armored vehicle may suffer crippling damage or suffer some spontaneous mechanical failure. Recovery vehicles ensure these stranded assets are rescued for repair and redeployment. Waste nothing, and leave nothing to the enemy."
 GER_autoloading_systems:0 "Autoloader Surprise"
 GER_autoloading_systems_desc:0 "Autoloaders allow for greater rate of fire, smaller crews, and lower profiles at the cost of higher chance of turret cook off. General Stechbarth argues that this drawback is worth the gains and has urged mass implementation of autoloaders across our armor force."
 GER_tank_desant_revisited:0 "Panzer Desant Revisited"
 GER_tank_desant_revisited_desc:0 "Panzer Desant is a tactic where infantry ride upon a Panzer instead of a dedicated transport. While it has fallen out of favor, it can still provide an easy means of transporting troops if limited by available vehicles and should be written into Heer doctrine."
 GER_blitz_without_end:0 "Blitz Without End"
 GER_blitz_without_end_desc:0 "Never stop!"
 GER_panzerwave:0 "Panzerwave"
 GER_panzerwave_desc:0 "Nothing they can do but be crushed under a thousand treads."
 GER_more_modern_warfare:0 "More Modern Warfare"
 GER_more_modern_warfare_desc:0 "What is old is not necessarily good. With the rise of new threats, we must innovate on our war doctrines and ensure we can deal with enemies old and new in equal measure."
 GER_the_modern_grenadier:0 "The Modern Grenadier"
 GER_the_modern_grenadier_desc:0 "Grenadiers were the elite units of Prussia and later Germany during the 18th and 19th centuries, even serving in the First World War. Not to be confused with the mechanized panzergrenadiers or conscript volksgrenadiers, these units were subsequently dissolved by the Weimar government. The Führer Grenadier brigade restored this designation. Their spirit remains and perhaps it is time to revive the designation for elite divisions."
 GER_probe_the_flanks:0 "Probe The Flanks"
 GER_probe_the_flanks_desc:0 "Charging heavily fortified positions dead on is foolhardy, a lesson the more foolish nations have needed to relearn time and time again. It is tempting to fall for the same malady of "bold action". Victory requires careful planning and wit, not high casualty rates."
 GER_silent_strike:0 "Silent Strike"
 GER_silent_strike_desc:0 "To take the enemy off guard grants an advantage that everyone wants in an engagement. An ambush is always preferable to a flat out fight, so it's important we try to maximize our chances for a stealth attack rather than rely on chance."
 GER_develop_the_hl440_engine:0 "Develop The HL440 Engine"
 GER_develop_the_hl440_engine_desc:0 "The HL440 is a revolutionary prototype which not only increases panzer speed but also consumes less fuel per kilometer traveled. Unfortunately, it is rather expensive and hence a not insignificant portion of the budget will have to be dedicated towards its mass production."
 GER_develop_the_uh_72_husar:0 "Develop The Do 446 Husar"
 GER_develop_the_uh_72_husar_desc:0 "The Do 446 is a revolutionary, borderline futuristic, new transport helicopter capable of both high speeds and large transport capacity should it be fully constructed. Regrettably, the design has been wallowing in developmental stagnation for the past year or so and the project requires a fresh injection of funds. This won't be a cheap endeavor should we pursue it."
 GER_advanced_body_armor:0 "Advanced Body Armor"
 GER_advanced_body_armor_desc:0 "Armor materials have improved over the years such as with the introduction of Poly(azanediyl-1,4-phenyleneazanediylterephthaloyl), or more succinctly, Kevlar. Lighter yet stronger materials are always being searched for and significant funding increases will ensure the Heer always has the best body armor available."
 GER_man_portable_atgm:0 "ATGM Supremacy"
 GER_man_portable_atgm_desc:0 "Since the introduction of the Panzerfaust, Germany has always had an advantage in man portable anti tank weapons. To maintain this advantage is critical."
 GER_fund_stealth_prototypes:0 "First Aid Is First Priority!"
 GER_fund_stealth_prototypes_desc:0 "It is preferable to keep an injured soldier alive rather than to let him die. Not only for morale purposes, a wounded soldier returned to health has much more experience than a fresh recruit, and that's experience that needs to be kept living."
 GER_kampfschwimmer_expansion:0 "Kampfschwimmer Expansion"
 GER_kampfschwimmer_expansion_desc:0 "Kampfschwimmer are a small naval assault group of the Kriegsmarine. While technically not under the Heer, it has been suggested the unit be expanded and converted into an elite special operations unit. No doubt the Kriegsmarine will be pleased to have such a force under its purview."
 GER_the_rise_of_infantry:0 "The Rise Of Infantry"
 GER_the_rise_of_infantry_desc:0 "With miniaturization, even an infantryman can carry the capability of downing a jet or blowing up an enemy tank."
 GER_deep_reconnaissance:0 "Behind Enemy Lines"
 GER_deep_reconnaissance_desc:0 "Advanced infantry infiltration tactics will allow small squads to outflank the enemy before they realize what is happening."
 GER_airmobile_doctrine:0 "Airmobile Doctrine"
 GER_airmobile_doctrine_desc:0 "Helicopters allow for much greater mobility than ground transports. Even impassable terrain can be traversed rapidly with helicopters."
 GER_unconventional_warfare_training:0 "Hybrid Warfare Training"
 GER_unconventional_warfare_training_desc:0 "With a rising number of guerrilla problems, the need for counterinsurgency tactics, or proper insurgency tactics should we be allied to said guerrillas, is necessary. Some dub this Hybrid Warfare, the blending of regular and irregular forces."
 GER_retool_the_helicopter_works:0 "Expand The Helicopter Works"
 GER_retool_the_helicopter_works_desc:0 "Our helicopter industry is still small compared to our plane and panzer industries. We should take measures to fix that."
 GER_infiltrate_and_eliminate:0 "Infiltrate And Eliminate"
 GER_infiltrate_and_eliminate_desc:0 "High value targets have been located. Liquidate them."
 GER_forward_air_controllers:0 "Forward Air Controllers"
 GER_forward_air_controllers_desc:0 "The Heer and Luftwaffe must cooperate more closely. Forward observers can call precision strikes even when infantry are placed close to the target."
 GER_rapid_insertion_doctrine:0 "Rapid Insertion Doctrine"
 GER_rapid_insertion_doctrine_desc:0 "With helicopters, elite infantry squads can be inserted and extracted with incredible rapidity from battlezones."
 GER_modular_helicopter_platform:0 "Modular Helicopter Platform"
 GER_modular_helicopter_platform_desc:0 "Helicopter hulls can be repurposed to fulfill a variety of tasks such as assault, transport, medevac, and reconnaissance."
 GER_a_special_forces_vehicle:0 "Realize The IFVs Potential"
 GER_a_special_forces_vehicle_desc:0 "Our IFV fleet has proven wanting especially in speed, firepower, and troop carrying capacity. IFVs still have yet to reach their purpose of an all-use armored vehicle. Significant resources should be dedicated to IFV development, but this will come at the cost of other areas of technological development."
 GER_night_vision_initiative:0 "Night Vision Initiative"
 GER_night_vision_initiative_desc:0 "Sight to the blind."
 GER_altenburgs_academy:0 "Altenburg's Vision"
 GER_altenburgs_academy_desc:0 "Altenburg foresees a time when wars will not be won through sheer numbers but through careful strategy and elite forces well equipped with high technology."
 GER_forward_operating_bases:0 "Looking At Forward Operating Bases"
 GER_forward_operating_bases_desc:0 "A concept made possible by helicopters, these bases are lightweight, easily assembled and easily disassembled staging grounds to rapidly deploy in hostile territory."
 GER_refined_helicopter_production:0 "Refined Helicopter Production"
 GER_refined_helicopter_production_desc:0 "Our production of helis has not only increased but so has the expertise of building them. Further investment should be placed into ensuring this expertise is transferred down to newer engineers and factory workers alike."
 GER_suppressor_and_subsonic:0 "Suppressor And Subsonic Fire"
 GER_suppressor_and_subsonic_desc:0 "Silent, still deadly."
 GER_joint_exercises:0 "Inter-Branch Exercises"
 GER_joint_exercises_desc:0 "Cooperation with the other branches of the Wehrmacht will be critical to the success of future deep strike operations."
 GER_field_hospital_networks:0 "The Frontier Of Battlefield Medicine"
 GER_field_hospital_networks_desc:0 "Whether it's disease or injury, keeping our troops alive and in the fight will be more important than ever as we prioritize a Heer that's small and powerful over one that is large and dilute."
 GER_precision_marksmanship:0 "Precision Marksmanship"
 GER_precision_marksmanship_desc:0 "A clean shot can end wars if you would believe it."
 GER_air_assault_revisited:0 "Air Assault Extravaganza"
 GER_air_assault_revisited_desc:0 "We'll blot out the skies with helicopters and bring entire armies down upon our enemies!"
 GER_the_shadow_war:0 "The Shadow War"
 GER_the_shadow_war_desc:0 "War is not defined by bombast. To win wars, the enemy must be disabled and no longer able to fight. It doesn't matter how this is accomplished, and if it's accomplished with silence and speed, all the better. No cowardice in a clean triumph."
 GER_sturmtide:0 "Sturmtide"
 GER_sturmtide_desc:0 "They never held a chance."
 GER_reforms_and_the_high_seas:0 "Reforms And The High Seas"
 GER_reforms_and_the_high_seas_desc:0 "The Kriegsmarine has undergone a significant expansion and reorganization over the past few years. It is natural that these efforts continue with all due effort."
 GER_continue_the_global_theory:0 "Continue The Global Theory"
 GER_continue_the_global_theory_desc:0 "If the Reich wishes to be a global power, it naturally must have a navy capable of reaching every part of the Earth. Control of critical ports and sealanes, or even simply the ability to threaten them, is critical to power projection."
 GER_expand_the_european_fleet:0 "Expand The European Fleet"
 GER_expand_the_european_fleet_desc:0 "The Reich is the heart of Europe and its defence comes first in all matters. This extends to naval control as well. The Kriegsmarine should be centered in Europe first and foremost."
 GER_priotitize_the_flugzeugtrager_fleet:0 "Prioritize The Flugzeugtrager Fleet"
 GER_priotitize_the_flugzeugtrager_fleet_desc:0 "Our fleet is still far behind the American and Japanese fleets, which have substantial numbers of carriers. Shipyards should prioritize their construction from now on and new superstructures will be laid down at once!"
 GER_advance_reactor_tech:0 "Advance Reactor Tech"
 GER_advance_reactor_tech_desc:0 "Nuclear reactors are well at home with large vessels. A reactor can power a ship for numerous years with no requirement to refuel. Still, our shipborne reactor tech could use some improvement with efficiency and safety."
 GER_advanced_intra_fleet_battlenet:0 "Advanced Intra-Fleet Battlenet"
 GER_advanced_intra_fleet_battlenet_desc:0 "Using the latest digital technologies, these new communication networks can vastly improve ship to ship coordination, allowing fleets to cooperate with greater efficiency."
 GER_breach_the_pacific:0 "Breach The Pacific"
 GER_breach_the_pacific_desc:0 "A mission for our nuclear u-boat fleet will be organized to challenge Japanese and American dominance of the Pacific Ocean."
 GER_control_the_skies_control_the_seas:0 "Control The Skies, Control The Seas"
 GER_control_the_skies_control_the_seas_desc:0 "Carrier borne squadrons have become rapidly more important in modern warfare, as a single fighter can sink or disable an entire ship with a well placed missile. Hence maintaining air superiority in fleet battles will be of critical importance."
 GER_ein_reich_ein_ozean:0 "Ein Reich, Ein Ozean"
 GER_ein_reich_ein_ozean_desc:0 "Our destiny is to rule the land and the ocean in equal measure!"
 GER_a_wall_of_ships:0 "A Wall Of Ships"
 GER_a_wall_of_ships_desc:0 "We will construct a fleet worthy of our great Fatherland and challenge our enemies directly!"
 GER_new_escorts_for_a_new_decade:0 "New Escorts For A New Decade"
 GER_new_escorts_for_a_new_decade_desc:0 "Of course, capital ships are nothing but floating targets without escort ships. New designs will be necessary to keep up with evolving enemy tactics and weapons."
 GER_deploy_locust_flugabwehrsystem:0 "Deploy Locust Flugabwehrsystem"
 GER_deploy_locust_flugabwehrsystem_desc:0 "The Locust is a new shipborne anti-air system designed to counter cruise missiles and other high speed targets such as jet fighters."
 GER_nuclear_cruisers:0 "Nuclear Cruisers"
 GER_nuclear_cruisers_desc:0 "While nuclear reactors are generally thought to be exclusive to u-boats and carriers, they can also be installed on smaller surface ships as well. With reactors improving more and more, we can conceivably install nuclear reactors into cruisers. Should this succeed in the future, we may be able to eventually install them on destroyers as well."
 GER_bring_the_sea_to_heel:0 "Bring The Sea To Heel"
 GER_bring_the_sea_to_heel_desc:0 "Not even the five oceans can resist our might!"
 GER_legacy_of_the_bismark:0 "Legacy Of The Bismarck"
 GER_legacy_of_the_bismark_desc:0 "The Bismarck was the most successful of the surface fleet during World War II, destroying merchant vessels and capital ships in equal measure. At its finest hour, it sank the HMS Hood and HMS Prince of Wales in a single battle in the Denmark Strait. Now essentially a floating museum piece, its legacy nonetheless prevails as a pinnacle of what a battleship should be."
 GER_the_biggest_guns:0 "The Biggest Guns"
 GER_the_biggest_guns_desc:0 "To blast the enemy to pieces."
 GER_the_heaviest_armor:0 "The Heaviest Armor"
 GER_the_heaviest_armor_desc:0 "To protect the crew from missiles and shrapnel."
 GER_the_strongest_engines:0 "The Strongest Engines"
 GER_the_strongest_engines_desc:0 "To go faster than you could possibly imagine."
 GER_digital_targeting_systems:0 "Digital Targeting Systems"
 GER_digital_targeting_systems_desc:0 "Analogue systems are fine enough but with digital, greater precision can be attained with much less time and effort. Every second counts in a battle!"
 GER_operational_flexibility:0 "Reaching Operational Flexibility"
 GER_operational_flexibility_desc:0 "The Kriegsmarine should be ready for all possible situations, and every possible opponent. We will run drills and war games constantly until the fleet is ready for the chaos of war."
 GER_the_ultimate_schlachtschiff:0 "The Ultimate Schlachtschiff"
 GER_the_ultimate_schlachtschiff_desc:0 "To surpass even the Bismarck would be a natural triumph for the Kriegsmarine. Most of the capital ship construction projects were scuttled after the economic downturn of the 1950s. However, with the economy growing at levels unimagined, we can now afford to pursue the construction of the greatest battleship the world has ever seen."
 GER_the_uboat_eternal:0 "The U-Boat Eternal"
 GER_the_uboat_eternal_desc:0 "The U-Boat, it could be said, won Germany the Second World War. It brought the British Empire to its knees and the Americans well and far off the continental coast. No doubt there will be more use for the U-boat now and in the future."
 GER_the_pride_of_old_donitz:0 "Pride Of Old Donitz"
 GER_the_pride_of_old_donitz_desc:0 "Admiral Donitz was on the cutting edge of U-Boat design and strategy. We should honour his long service to the Reich by innovating on his ideas."
 GER_modernize_wolfpack_tactics:0 "Modernize Wolfpack Tactics"
 GER_modernize_wolfpack_tactics_desc:0 "Wolfpacks are when U-Boats move in groups and attack convoys all at once. There has been no pressing need for the tactic given that open all out war has so far not occurred, but the future may soon require a return to such wartime strategies. We cannot be caught flatfooted."
 GER_deploy_the_m9e_torpedo:0 "Deploy The M9E Torpedo"
 GER_deploy_the_m9e_torpedo_desc:0 "A new type of electric motor torpedo, it's sure to be a surprise to any ship hit by it."
 GER_like_shadows:0 "Like Shadows"
 GER_like_shadows_desc:0 "The submarine's primary advantage has always been its stealth capability. We'll be sure to maximize the U-boat's own ability to hide from enemy detection. \n\nThey'll never see them coming."
 GER_advance_nuclear_development:0 "Advanced Nuclear U-Boat Development"
 GER_advance_nuclear_development_desc:0 "We can push our nuclear powered U-boats further still with the latest improvements in reactor technology."
 GER_death_from_below:0 "Death From Below"
 GER_death_from_below_desc:0 "A strike from the blue \n\nScratch one enemy vessel \n\nTime to make it two"
 GER_the_third_dimension_of_war:0 "The Third Dimension Of War"
 GER_the_third_dimension_of_war_desc:0 "Once useful for only reconaissance and light bombardment, aircraft have rapidly atained a key position in military thought. Any operation, at land or sea, must now be undertaken with the sky in mind, and especially those who prowel it."
 GER_old_honour:0 "Old Honour"
 GER_old_honour_desc:0 "The Fatherland has always been at the forefront of military aviation. The Luftwaffe has a long tradition and one we cannot discard readily."
 GER_new_aces:0 "New Aces"
 GER_new_aces_desc:0 "As the skies beckon, new pilots will take up their wings and fly. Some will fall and others will fly to heights unimagined. There's no use wallowing in dusty honours and rusted medals; the future is in front and above us."
 GER_the_fighter_tradition:0 "Dogfighter Tradition"
 GER_the_fighter_tradition_desc:0 "From the Red Baron to today, Luftwaffe pilots have been feared by the enemy and respected by their allies when it comes to dogfighting capability."
 GER_advanced_interceptor_design:0 "Advanced Interceptor Design"
 GER_advanced_interceptor_design_desc:0 "With jet bombers and cruise missiles gaining ever increasing ranges, it is clear therefore that new interceptor models will be needed to keep our strategic assets safe."
 GER_deploy_the_sperber_missile:0 "Deploy The Sperber Missile"
 GER_deploy_the_sperber_missile_desc:0 "A new air to air missile, it competes with the American AIM-9 Sidewinder family of missiles. Its relatively low cost and adaptability will ensure our fighters can keep up with mass produced Amerubbish."
 GER_schwarm_tactics_perfected:0 "Schwarm Tactics Perfected"
 GER_schwarm_tactics_perfected_desc:0 "A formation where four craft, in two pairs, fly in a jagged V-pattern. Developed by German pilots during the Spanish Civil War (although the Finnish sometimes claim they invented it first), it allows for two lead aircraft to take an offensive posture while their wingmen defend and attack any trailing aircraft."
 GER_night_fighter_program:0 "Omniscenario Capability"
 GER_night_fighter_program_desc:0 "Whether it's the dead of night or terrible weather, nothing will stop our squadrons when a mission has begun!"
 GER_hardened_airfields:0 "Hardened Airfields"
 GER_hardened_airfields_desc:0 "Bombs and missiles are incredibly accurate in this day and age and it is dangerous to leave ground assets and parked airplanes unprotected. Germany's airfields will receive extra anti-air emplacements as well as additional hardened air hangars and bunkers."
 GER_rapid_scramble_alert:0 "Eyes Always Open"
 GER_rapid_scramble_alert_desc:0 "Our pilots and ground crews must always be ready to scramble their aircraft at a nanosecond's notice. We cannot be caught off guard, ever."
 GER_absolute_air_denial:0 "Absolute Air Denial"
 GER_absolute_air_denial_desc:0 "To prevent the enemy from even threatening our land or force, we will shut them out of every airspace we desire and achieve absolute air superiority."
 GER_the_last_knights:0 "The Last Knights"
 GER_the_last_knights_desc:0 "Once it was thought the age of knights was over. Indeed, it is half true; knights no longer ride in armor upon horseback. No, they do something much greater: they ride on wings of steel and ramjets."
 GER_ace_mentorship_program:0 "Ace Mentorship Program"
 GER_ace_mentorship_program_desc:0 "Of course, our best pilots are not immortal and many will grow old, retire, and die. Hence their valuable experience must be preserved and passed on to the next generation."
 GER_jagdgeschwader_reorganization:0 "Jagdgeschwader Reorganization"
 GER_jagdgeschwader_reorganization_desc:0 "The Jagdgeschwader were the main fighter formations of the Luftwaffe and achieved a large degree of success throughout the Second World War. Still, their organization could do with some reevaluation to ensure they can keep up with more modern threats."
 GER_iron_cross_tradition:0 "Knights of the Iron Cross"
 GER_iron_cross_tradition_desc:0 "Many recipients of the prestigious Knight's Cross were Luftwaffe pilots, like the famous Hans-Ulrich Rudel, the first ever to receive the Knight's Cross with Golden Oak Leaves, Swords, and Diamonds. Our pilots should hold their heads high for receiving such honours and surely more will come as the pilots of the Luftwaffe continuously prove and prove again their valour."
 GER_veteran_instructor_corps:0 "Elite Instructor Corps"
 GER_veteran_instructor_corps_desc:0 "Instead of retirement or shuffling off to some desk job, some of our best aging pilots will be recruited as instructors to teach new pilots how to fly like aces."
 GER_zerstorer_revival:0 "Zerstorer Revival"
 GER_zerstorer_revival_desc:0 "The Zerstorer or "Destroyer" Wings were composed of heavy fighters during the Second World War. Deemed obsolete with the decline of the heavy fighter class, it has been proposed that the moniker should be revived for our interceptor craft, given their high speeds and large sizes. The roles they fulfill are often similar to the destroyers of old."
 GER_flak_integration:0 "Flaks and SAMs"
 GER_flak_integration_desc:0 "By coordinating with ground anti-air assets, the Luftwaffe could effectively deny air superiority over our occupied territory, forcing any theoretical enemy to push their ground forces first before even considering an attack."
 GER_high_altitude_dominance:0 "Extreme Altitude Dominance"
 GER_high_altitude_dominance_desc:0 "With improved engines, avionics, and training, our pilots could reach ever greater heights and control the airspace from extreme elevations."
 GER_combat_air_patrol:0 "Combat Air Patrol"
 GER_combat_air_patrol_desc:0 "Constant patrol patterns will ensure our airspace is well protected from problems inside and out."
 GER_reichsverteidigung_reborn:0 "Reichsverteidigung Reborn"
 GER_reichsverteidigung_reborn_desc:0 "\"Defence of the Reich\" if you cannot speak the mother tounge, was a campaign to deny enemy bombers and fighters access to any German airspace during the entire Second World War. It was entirely successful and a new version of it will be drawn up in the event of another large scale war."
 GER_eagles_nest:0 "Nest of Ravens"
 GER_eagles_nest_desc:0 "Pick them apart."
 GER_guardian_eagles:0 "Guardian Eagles"
 GER_guardian_eagles_desc:0 "Wings of salvation."
 GER_precision_over_power:0 "Precision Over Power"
 GER_precision_over_power_desc:0 "Bombs with no aim are practically useless. See how the terror bombing campaign of the British failed to stop the Fatherland's might."
 GER_kampfbomber_program:0 "Kampfbomber Program"
 GER_kampfbomber_program_desc:0 "Kampfbombers have practically become essential for ground operations, as their precision strike capability and high maneuverability allow them to effectively attack ground targets without killing nearby German ground troops."
 GER_taktisches_einsatzkommando:0 "Taktisches Kampfgeschwader"
 GER_taktisches_einsatzkommando_desc:0 "Our bombers require further refinement as the need to deliver massive amounts of destruction in a concentrated area grows. That is - massive destruction upon enemy targets, and not our own. It's not as glorious as a dogfight but bombing missions are no less important to Luftwaffe operations."
 GER_multi_role_doctrine:0 "Multi-Role Doctrine"
 GER_multi_role_doctrine_desc:0 "In the Luftwaffe, there has been growing demand for a type of fighter plane capable of both air and ground attack missions. Dubbed a multi-role fighter, the Americans have already made great strides in deploying such aircraft. It is necessary we do the same and grant our air force greater flexibility."
 GER_ground_attack_mastery:0 "Enhanced Air to Surface Munitions"
 GER_ground_attack_mastery_desc:0 "Some recent strides have been made in the field of munitions, specifically bombs and missiles deployable against ground targets. Greater power and homing have led to a substantial increase of devastation in target tests, and the new weapons will be ready to deploy on real missions soon."
 GER_integrated_targeting_pods:0 "Integrated Targeting Pods"
 GER_integrated_targeting_pods_desc:0 "Improved radar systems will allow for greater accuracy of onboard targeting systems, and thus an improved capability for precision, nigh surgical strikes."
 GER_close_air_cooperation:0 "Close Air Command"
 GER_close_air_cooperation_desc:0 "Danger close missions will now integrate Heer and Luftwaffe command structures more seamlessly, with streamlined protocols for strike assistance requests."
 GER_carpet_of_thunder:0 "Carpet Of Thunder"
 GER_carpet_of_thunder_desc:0 "Bury the enemy with bombs! Don't let up even for a second."
 GER_beyond_the_sound_barrier:0 "Beyond The Sound Barrier"
 GER_beyond_the_sound_barrier_desc:0 "Supersonic flight has become ubiquitous with fighter craft but we can go farther still. Experiments will be conducted with an experimental scramjet plane capable of hypersonic speeds. While a mere test bed now, this should lay the groundwork for future fighter jets capable of extreme speeds."
 GER_electronic_warfare_suite:0 "Revolutionize ECM Systems"
 GER_electronic_warfare_suite_desc:0 "Electronic warfare suites can disrupt enemy radars and jam missile targeting systems, hence protecting vulnerable aircraft from ground and air attack."
 GER_fly_by_wire_revolution:0 "Cockpit Of The Future"
 GER_fly_by_wire_revolution_desc:0 "Equipped with the latest digital computer systems and detection capabilities, the cockpit of the future is a concept for future fighter cockpits. Implementing this into our existing fighters would be a massive boon."
 GER_stealth_research_program:0 "Stealth Research Program"
 GER_stealth_research_program_desc:0 "The idea of a stealth aircraft is one which is difficult or even impossible to detect via radar. The idea being that such a plane is immune to attack from radar guided surface to air missiles."
 GER_unmanned_reconnaissance:0 "Unmanned Reconnaissance"
 GER_unmanned_reconnaissance_desc:0 "Using radio control, it's possible to remotely control small unmanned craft. Already used for target practice in training simulations, it has been proposed to use similar craft equipped with cameras and utilize them to scout out enemy positions without risk to the human operator."
 GER_strategic_airlift_command:0 "Strategic Airlift Command"
 GER_strategic_airlift_command_desc:0 "Coordinating with Heer helicopter units, we can rapidly move men and material from location to location with incredible efficiency."
 GER_aerial_refueling_program:0 "Aerial Refueling Program"
 GER_aerial_refueling_program_desc:0 "Tanker planes equipped with specialized refueling nozzles can refuel fighter jets without requiring those jets to land. It is an excellent method for extending the range of fighter craft."
 GER_radar_guided_munitions:0 "Advanced Radar-Guided Munitions"
 GER_radar_guided_munitions_desc:0 "With enhanced maneuverability and homing, nothing will escape our air to air missiles."
 GER_variable_geometry_wings:0 "Variable Geometry Wings"
 GER_variable_geometry_wings_desc:0 "An experimental concept, variable geometry wings allow the plane to shift from straight wings to swept wings depending on if the aircraft requires more maneuverability or speed."
 GER_digital_flight_computers:0 "Digital AWACS Computers"
 GER_digital_flight_computers_desc:0 "Aerial air command planes will now be equipped with the latest computational hardware to improve command and control of air wings."
 GER_luftwaffe_of_tomorrow:0 "Luftwaffe Of Tomorrow"
 GER_luftwaffe_of_tomorrow_desc:0 "With our advanced technologies, we will ensure the Luftwaffe remains the dominant air force for ages to come!"
 GER_taktische_luftwaffe:0 "Air War Rising"
 GER_taktische_luftwaffe_desc:0 "Dancing across the sky, there's no going back."
 #KN tree
 GER_our_last_best_hope_for_peace:0 "Our Last Best Hope For Peace"
 GER_our_last_best_hope_for_peace_desc:0 "Another global war will only reap unfathomable devastation upon everyone, including the Fatherland. It is time for change. The Koalition der Nationen will help usher in a new age of cooperation. If not entirely peaceful, it is hoped the KdN will prevent another all-out war."
 GER_a_new_charter:0 "A New Charter"
 GER_a_new_charter_desc:0 "A charter will be written for the KdN to establish the basic principles of the new organization."
 GER_the_foreign_service_reborn:0 "The Foreign Service Reborn"
 GER_the_foreign_service_reborn_desc:0 "The foreign service has been neglected in a sense, and diplomacy outside of the German sphere of influence has been limited these past few decades. It is time for this to change!"
 GER_open_doors_policy:0 "Open Windows Policy"
 GER_open_doors_policy_desc:0 "We will be as transparent as possible in the new KdN, to ensure the populace understands and knows what is happening inside of it. It won't just be a forum for the elite but a congress of all peoples."
 GER_staff_the_embassies:0 "Staff The Embassies"
 GER_staff_the_embassies_desc:0 "New embassies will be opened across the world to facilitate new diplomatic channels and treaties."
 GER_a_seat_at_the_table:0 "A Seat At The Table"
 GER_a_seat_at_the_table_desc:0 "A basic assembly will be - well - assembled consisting of each of the KdN members."
 GER_the_olive_branch:0 "The Olive Branch"
 GER_the_olive_branch_desc:0 "It is time to begin a campaign of diplomatic outreach in the hopes that we can invite all the nations of the world to the KdN."
 GER_down_to_the_med:0 "Down To The Med"
 GER_down_to_the_med_desc:0 "The nations of Southern Europe are a natural choice to invite to the KdN. Although the Mediterranean was damaged by previous German fancies, we will show these nations that we're willing to right the wrongs of the past."
 GER_the_pakt_members:0 "The Pakt Members"
 GER_the_pakt_members_desc:0 "Of course, we will invite the Pakt members to the KdN although this is a mere formality."
 GER_reach_across_the_atlantic:0 "Reach Across The Atlantic"
 GER_reach_across_the_atlantic_desc:0 "The American states will also be invited to the KdN."
 GER_the_northern_approach:0 "The Northern Approach"
 GER_the_northern_approach_desc:0 "Germany has always had decent relations with the Northern European nations (for the most part), and hence they should also be willing to join in our new venture."
 GER_cultural_exchange_program:0 "Cultural Exchange Program"
 GER_cultural_exchange_program_desc:0 "To better deepen ties between nations, a series of exchange programs will be started."
 GER_economic_cooperation_pact:0 "Economic Cooperation Pacts"
 GER_economic_cooperation_pact_desc:0 "Deepening international trade will grow both business and political ties alike."
 GER_joint_humanitarian_missions:0 "Joint Mercy Missions"
 GER_joint_humanitarian_missions_desc:0 "There is a certain value to charitable missions, and certainly the recipients of the aid will no doubt be more willing to follow our diplomatic resolutions."
 GER_a_common_market:0 "International Trade Effort"
 GER_a_common_market_desc:0 "By pursuing free trade agreements we can open up economies to new markets as well as deepen ties to KdN members."
 GER_invite_america:0 "Invite America"
 GER_invite_america_desc:0 "The old rival, now a possible friend. With the advent of the Fuhrerdemokratie, the USA has warmed to our Reich, and hence they may be willing to join our efforts of global diplomatic cooperation."
 GER_the_language_of_diplomacy:0 "The Language Of Diplomacy"
 GER_the_language_of_diplomacy_desc:0 "Establishing some sort of lingua franca in regards to diplomatic procedures would be a boon. German is the natural choice, of course."
 GER_invite_japan:0 "Invite Japan"
 GER_invite_japan_desc:0 "Once our close ally, Japan may again be our friend soon. Surely they will see the wisdom of the Koalition."
 GER_on_distant_shores:0 "On Distant Shores"
 GER_on_distant_shores_desc:0 "Even the far off and obscure nations deserve to be invited to the KdN."
 GER_the_great_question:0 "The Great Question"
 GER_the_great_question_desc:0 "What is to be the structure of our new organization?"
 GER_a_council_of_guardians:0 "A Council Of Guardians"
 GER_a_council_of_guardians_desc:0 "It has been decided that the major powers of the world will decide the fate of the most pertinent matters. This will better support the stability of the KdN."
 GER_the_permanent_members:0 "The Paramount Members"
 GER_the_permanent_members_desc:0 "The major powers will be granted voting seats by which they will vote on proposals."
 GER_the_veto_power:0 "The Veto Power"
 GER_the_veto_power_desc:0 "All voting members of the KdN will reserve the right to veto any active proposal, killing it instantly."
 GER_peacekeeping_mandate:0 "Peacekeeping Mandate"
 GER_peacekeeping_mandate_desc:0 "The voting members of the KdN will agree to enforce global peace, whether the other members like it or not."
 GER_order_through_strength:0 "Order Through Strength"
 GER_order_through_strength_desc:0 "Such is the way of the world."
 GER_every_voice_carries:0 "Every Voice Carries"
 GER_every_voice_carries_desc:0 "It has been decided that all KdN members will have equal voting regardless of their size or power. We are a congress of equals, not tyrants."
 GER_rotating_presidency:0 "Rotating Chairmanship"
 GER_rotating_presidency_desc:0 "The Presidency of the KdN will rotate through each member every year, determined by lots, though the position will more or less be one of formality rather than de-facto power."
 GER_consensus_building:0 "Consensus Building"
 GER_consensus_building_desc:0 "We must work together, or we will never find common cause between the nations of man."
 GER_international_court_of_justice:0 "International Court Of Affairs"
 GER_international_court_of_justice_desc:0 "The best way for peace is arbitration. We will establish a neutral court that will arbitrate on disputes between members."
 GER_forum_of_nations:0 "Forum Of Nations"
 GER_forum_of_nations_desc:0 "It's all of us or none of us."
 GER_a_united_front:0 "A United Front"
 GER_a_united_front_desc:0 "All for one and one for all."
 GER_the_berlin_accords:0 "The Germania Accords"
 GER_the_berlin_accords_desc:0 "The Germania Accords detail conduct of war and ban certain atrocities from warfare. Enforceable by the KdN, it is hoped it will have more effectiveness than the preceding Geneva Conventions."
 GER_development_aid_initiative:0 "Development Aid Initiative"
 GER_development_aid_initiative_desc:0 "Both as a method of helping poorer nations and offering investment opportunities for richer ones, the development aid program could yield great benefits."
 GER_arms_limitation_talks:0 "Arms Limitation Talks"
 GER_arms_limitation_talks_desc:0 "Aimed at limiting nuclear stockpiles, the hope is that nuclear wars will be prevented, or at the very least, limited by reducing the nuclear arsenals of the world's Superpowers."
 GER_shared_scientific_research:0 "Koalition Research Institute"
 GER_shared_scientific_research_desc:0 "A unified research program, it would provide grants for pertinent research all across the Koalition."
 GER_environmental_cooperation:0 "Environmental Cooperation Agreement"
 GER_environmental_cooperation_desc:0 "Trash choking the land and sludge clogging rivers, it is undeniable that much of the Earth's natural beauty has been sundered by human refuse. It is time to take measures to address this on a mass scale, and ensure that the entire Earth is cleaned up."
 GER_crisis_hotline:0 "Crisis Resolution Lines"
 GER_crisis_hotline_desc:0 "A proposal to build direct lines of telecommunication between all nuclear armed nations to ensure problems are resolved before they go off the rails. We do not want a repeat of the Hawaiian Missile Crisis."
 GER_free_trade_zone:0 "Special Trade Committee"
 GER_free_trade_zone_desc:0 "A proposed trade body designed to regulate and facilitate international trade, it would be immensely beneficial to the global economy should it be implemented."
 GER_student_exchange_network:0 "International Student Exchange Network"
 GER_student_exchange_network_desc:0 "A method of both soft diplomacy and acquiring knowledge, it is our hope this resolution can be passed posthaste!"
 GER_a_world_worth_fighting_for:0 "A World Worth Fighting For"
 GER_a_world_worth_fighting_for_desc:0 "No longer shall the history of mankind be dominated by pointless bloodshed but by rational decision making and negotiation."
 GER_the_torch_of_peace:0 "The Torch Of Peace"
 GER_the_torch_of_peace_desc:0 "To preserve the world at any cost, lest we repeat the same mistakes over and over again."
 ##election politics
 ###nsdap
 GER_gfour_the_more_things_change:0 "The More Things Change..."
 GER_gfour_the_more_things_change_desc:0 "Despite the efforts of the Gang of Four and their lackeys, the NSDAP has once again come out on top and won the election. It's time to show the Reich yet again why they elected us in the first place all those years ago."
 GER_gfour_rally_the_core:0 "Rally The Core"
 GER_gfour_rally_the_core_desc:0 "Much of the populace still supports the NSDAP, primarily across the North-East of the Reich as well as major city centers such as Vienna."
 GER_gfour_support_from_below:0 "Support From Below"
 GER_gfour_support_from_below_desc:0 "Many laborers and farmers still remember the benefits the NSDAP granted them and are still grateful for our patronage. Let's rile them up and remind everyone we are a workers' party after all!"
 GER_gfour_and_above:0 "...And Above"
 GER_gfour_and_above_desc:0 "While some industrialists and bankers have thrown in their support for the weathervanes in the RSP, many still find the NSDAP their best bet for success. Even with the legacy of Speer's reforms irking many of the former megacorp holders, we're still a better option than the VUP, and the less said of the VAAF the better."
 GER_gfour_hitlernostalgie:0 "Hitlernostalgie"
 GER_gfour_hitlernostalgie_desc:0 "A social pattern that has arisen is the so-called Hitlernostalgie, or nostalgia for when the Reich was led by Adolf Hitler. Logically, we should exploit this phenomenon and incorporate it into our messaging. The party of Hitler won all that we have, and who better to preserve it?"
 GER_gfour_coalition_with_dap:0 "Embrace Our Brothers"
 GER_gfour_coalition_with_dap_desc:0 "The DAP has some... questionable ideas that positively reek of SS influences, but they are still a National Socialist party at the end of the day. There should be no harm in forming a coalition with them and securing a few extra seats in the Reichstag."
 GER_gfour_nsdap_go_alone:0 "One Party, One Reich"
 GER_gfour_nsdap_go_alone_desc:0 "The NSDAP has no equals, and it needs no partners. The DAP are nothing more than fools grasping at illusory ideas. We don't need anyone's help to rule the Reich; we need only ourselves."
 ###vup
 GER_gfour_enduring_the_worst:0 "Enduring The Worst"
 GER_gfour_enduring_the_worst_desc:0 "Germany has suffered much under the tyranny of the NSDAP, and yet a party of the reasonable and the good-hearted has still managed to form and win in the belly of the beast. Let's take this as a sign of our endurance and proof that we can accomplish much even in the face of overwhelming malice."
 GER_gfour_hope_for_the_future:0 "Hope For The Future"
 GER_gfour_hope_for_the_future_desc:0 "With the VUP in power, we should consolidate our hold over the Gaus in which we have a significant presence, ensuring we have a solid political base for future elections."
 GER_gfour_catholics_across_the_reich:0 "Catholics Across The Reich"
 GER_gfour_catholics_across_the_reich_desc:0 "The VUP has in large part inherited the role of the German Catholic party from the Zentrum. Hence, much of the VUP's support is drawn from Catholics now free to attend Mass and proselytize. This includes non-German Catholic populations, namely the Poles."
 GER_gfour_for_everyones_sake:0 "For Everyone's Sake"
 GER_gfour_for_everyones_sake_desc:0 "The VUP does not fight for the betterment of a few client groups, but for all citizens of Germany. Let's engage in a media campaign to widen our support."
 GER_gfour_he_did_not_forget_you:0 "He Did Not Forget You"
 GER_gfour_he_did_not_forget_you_desc:0 "The Lord sees all, hears all, and saves all."
 GER_gfour_vup_coalition_with_ler:0 "A Hand To The Forgotten"
 GER_gfour_vup_coalition_with_ler_desc:0 "The LER is an ally worth courting as a junior coalition member as we seek to expand our reach into constituencies with significant non-German populations."
 GER_gfour_vup_go_alone:0 "A Path Only We Walk"
 GER_gfour_vup_go_alone_desc:0 "Forming a coalition with the LER would only dilute our progress and court controversy from the other major parties. It is best we stay separate and trust ourselves to better Germany."
 ###rsp
 GER_gfour_on_our_own:0 "On Our Own"
 GER_gfour_on_our_own_desc:0 "The RSP is strong enough and already has more ideological variation than necessary. We don't need to overcomplicate matters by forming a coalition with a bunch of flower pickers."
 GER_gfour_coalition_with_dg:0 "Coalition With Die Grünen"
 GER_gfour_coalition_with_dg_desc:0 "Die Grünen are a natural complement to the RSP's liberal wing, and thankfully their main priority is ecological legislation, so they probably won't go around demanding excessive political concessions. \n\nProbably."
 GER_gfour_strong_and_free:0 "Strong And Free"
 GER_gfour_strong_and_free_desc:0 "Germany need not suffer under a totalitarian regime to be a powerful nation. Dregger will strike the golden mean of authority and liberty."
 GER_prosperity_is_the_cure_all:0 "Prosperity Is The Cure-All"
 GER_prosperity_is_the_cure_all_desc:0 "A wealthier people is a happier people. A wealthier nation is a more powerful nation. This logic has not changed in millennia, so why act as if now is any different? No, we must strive to make the Reich and its people as wealthy as possible through unfettered market economics."
 GER_a_piece_of_the_pie:0 "A Piece Of The Pie"
 GER_a_piece_of_the_pie_desc:0 "Everyone deserves to enjoy the just rewards of their honest labor, and who better than the industrialists who keep our economy turning and the Wehrmacht supplied? These wealthy entrepreneurs will no doubt be grateful for our support and will be keen to repay us by helping the RSP get reelected."
 GER_salute_the_flag:0 "Salute The Flag"
 GER_salute_the_flag_desc:0 "Prussia was the beating heart of Germany, and remains so still. The Prussian spirit of discipline and nationalism is as strong as ever, and hence the Prussian heartland is fertile ground for gathering support among the populace."
 GER_for_the_german_millenium:0 "For The German Millennium"
 GER_for_the_german_millenium_desc:0 "The Fatherland shall remain the premier world power for one thousand years, and beyond!"
 ###vaaf
 GER_gfour_straight_ahead:0 "Straight Ahead"
 GER_gfour_straight_ahead_desc:0 "The VAAF will accomplish nothing by falling into the authoritarian patterns of the bourgeois parties. Democracy and liberty are inseparable, and no amount of effort will change that."
 GER_gfour_no_compromise:0 "No Compromise"
 GER_gfour_no_compromise_desc:0 "We cannot hope to achieve our goals through half-measures and wishy-washy policy. If Germany is to be saved, the Fuhrer must be decisive, or all is lost!"
 GER_gfour_your_last_regret:0 "Your Last Regret"
 GER_gfour_your_last_regret_desc:0 "The VAAF represents a new leaf for Germany. No longer will greed and autocracy rule the Reich, but the people and their needs!"
 GER_gfour_its_not_communism:0 "It's Not Communism!"
 GER_gfour_its_not_communism_desc:0 "Unfortunately, terms like socialism and communism are still dirty words in the Reich, especially after the collapse of the Soviet Union proved to the German people that communism bred dysfunction and weakness. Hence, we must take *special* care not to refer to the VAAF as any sort of Marxist party. Anything that could be derived from Marx must be rebranded first to fit the patriotic tastes of the German proletariat."
 GER_gfour_real_change:0 "Real Change"
 GER_gfour_real_change_desc:0 "The VAAF promises no token effort or surface-level reform, but a comprehensive overhaul of the Reich's system of governance. A fact the disaffected members of this nation will appreciate."
 GER_gfour_for_the_common_laborer:0 "For The Commons"
 GER_gfour_for_the_common_laborer_desc:0 "The Reich has always been wrapped up in elitism and hierarchy since the first Holy Roman Emperor was crowned. Such rigidity will not serve us well as the times rapidly change. The masses of the Fatherland must be empowered!"
 GER_gfour_a_reich_for_you_and_me:0 "A Reich For You And Me"
 GER_gfour_a_reich_for_you_and_me_desc:0 "Why should the German Reich be an exclusionary project? Was the first Reich not a diverse realm? We shall build a Reich in which all can reside and all can prosper."
 GER_gfour_vaaf_coalition_with_ler:0 "Workers And The Wronged"
 GER_gfour_vaaf_coalition_with_ler_desc:0 "The LER is a natural ally against the German-centric parties. We fight for the freedom of all, not just a select few."
 GER_gfour_vaaf_go_alone:0 "The Red Banner Alone"
 GER_gfour_vaaf_go_alone_desc:0 "The LER can't be trusted to hold fast to the principles of popular democracy and will only seek to excise concessions and bribes from us. The VAAF will go it alone."
 ###dg
 GER_gfour_theres_work_ahead:0 "There's Work Ahead"
 GER_gfour_theres_work_ahead_desc:0 ""
 GER_gfour_coordinate_with_the_dap:0 "Coordinate With The Dap"
 GER_gfour_coordinate_with_the_dap_desc:0 ""
 GER_gfour_why_hate_nature:0 "Why Hate Nature"
 GER_gfour_why_hate_nature_desc:0 ""
 GER_gfour_for_a_clean_germany:0 "For A Clean Germany"
 GER_gfour_for_a_clean_germany_desc:0 ""
 ###Vengeance War###
 GER_gfour_those_who_reap:0 "Those Who Reap"
 GER_gfour_those_who_reap_desc:0 "It appears the Soviet Union has returned yet again under a new name and a new banner. As diplomatic efforts have all but failed, it is time to show that we too can fight on, and that we too have our own liberty to protect. The [RUS.GetAdjective] menace will know the power of the German Reich once more!"
 GER_gfour_our_fight_for_preservation:0 "Our Fight For Preservation"
 GER_gfour_our_fight_for_preservation_desc:0 "This war is an existential threat to the progress attained by the Fuhrerdemokratie. Should the defence of the nation fail, the viability of our government will be called into serious question, to say nothing of the loss of critical territories."
 GER_gfour_gear_up_for_war:0 "Gear Up For War"
 GER_gfour_gear_up_for_war_desc:0 "The German economy must shift onto a war footing, and it must do so urgently."
 GER_gfour_your_only_chance:0 "Your Only Chance"
 GER_gfour_your_only_chance_desc:0 "Would you take your chances with a Russian regime? No! There are friends and family in the east you must defend! Fight now, and push the Russian menace out of Europe forever! Otherwise [RUS.GetNameDef] will no doubt be emboldened, and will not stop until the Fatherland is burned to ash!"
 GER_gfour_for_our_future:0 "For Our Future"
 GER_gfour_for_our_future_desc:0 "All the freedoms that have been attained in the past years are now at risk of destruction by jingoistic foreign invaders. You must fight for the Reich, or lose everything!"
 GER_gfour_leave_it_all_behind:0 "Leave It All Behind"
 GER_gfour_leave_it_all_behind_desc:0 "Whatever reasons [RUS.GetNameDef] presents as its casus belli, know that they cling to old grudges and desire nothing but destruction. Ask yourself this: why did they not try to come to a peaceful solution? It is clear that they desire war first and foremost, not justice."
 GER_gfour_bring_them_fire:0 "Bring Them Fire"
 GER_gfour_bring_them_fire_desc:0 "Your foes are at the gate. Will you run and hide like a coward? Or will you stand and fight and defend the German Reich from evil and destruction?"
 GER_gfour_take_what_is_yours:0 "Take What Is Yours"
 GER_gfour_take_what_is_yours_desc:0 "The East is under German protection and will be until the end of time. The Russians must learn to accept this."
 GER_gfour_the_just_cause:0 "The Just Cause"
 GER_gfour_the_just_cause_desc:0 "Look at how much life has improved for the inhabitants of the Reich proper and its client states in the East. The Fuhrerdemokratie has brought peace and prosperity across Europe, and the future looks brighter still. Our cause, our defence of the east, is more than just: to defend the freedoms and happiness of those who inhabit these lands from foreign invasion and enslavement."
 GER_gfour_a_reich_to_be_proud_of:0 "A Reich To Be Proud Of"
 GER_gfour_a_reich_to_be_proud_of_desc:0 "In darker times there was little to praise Germany for, but now matters are different. Germany stands as an exemplar for all nations to follow. Those who try to destroy the Reich are nought but bitter creatures driven by pure hatred. They offer nothing, but with the Reich you have everything you need. Fight on, and know your battle is a noble one and your sacrifice will never be forgotten."
 ##endgame focus tree
 ###Speerite Loser Tree###
 GER_gfour_the_bruised_democracy:0 "Battered Liberty"
 GER_gfour_the_bruised_democracy_desc:0 "Significant territorial losses have led to political turmoil in Germania. With the Fuhrer all but forced to resign, a new caretaker Fuhrer has risen to guide the Reich out of this crisis until new elections are held."
 GER_gfour_recover_legitimacy:0 "Recover Legitimacy"
 GER_gfour_recover_legitimacy_desc:0 "The failure to defend the Eastern Pakt and the subsequent partial loss of it to [RUS.GetAdjective] annexation has been a blow to both domestic stability and foreign prestige. Though we are bruised, we must make an effort to show that we are not out of the game. Far from it."
 GER_gfour_it_wasnt_that_bad:0 "It Wasn't That Bad!"
 GER_gfour_it_wasnt_that_bad_desc:0 "Certainly this hasn't been the first war Germany has lost. And look! We still have the Fatherland in its entirety. No doubt, we shall have our justice soon enough."
 GER_gfour_crack_down:0 "Crack Down On Defeatists"
 GER_gfour_crack_down_desc:0 "Too many naysayers have infested the streets of our cities recently. These hooligans will be dispersed and the nation returned to order."
 GER_gfour_we_still_have_duties_abroad:0 "We Still Have Duties Abroad"
 GER_gfour_we_still_have_duties_abroad_desc:0 "Many of our allies and clients have been shaken by our temporary defeat. We will reassure them that the Reich is going nowhere."
 GER_gfour_trudge_forward:0 "Trudge Forward"
 GER_gfour_trudge_forward_desc:0 "All we can do..."
 GER_gfour_recover_the_wehrmacht:0 "Recover The Wehrmacht"
 GER_gfour_recover_the_wehrmacht_desc:0 "Material and personnel losses must be replaced as soon as possible!"
 GER_gfour_recover_the_economy:0 "Recover The Economy"
 GER_gfour_recover_the_economy_desc:0 "The loss of the eastern Pakt has suddenly cut our economy off from valuable resources. The market will have to readjust for the time being."
 GER_gfour_growth_before_comfort:0 "Growth Before Comfort"
 GER_gfour_growth_before_comfort_desc:0 "A strong economy is a strong nation. We can't squander time and money on wasteful welfare projects!"
 GER_gfour_revist_speers_plans:0 "Revisit Speer's Plans"
 GER_gfour_revist_speers_plans_desc:0 "Speer had the right idea about the economy and the military, although perhaps he clung to power too closely."
 GER_gfour_demobilize_the_heer:0 "Demobilize The Heer"
 GER_gfour_demobilize_the_heer_desc:0 "The reservists and conscripts will be sent home until we need them again, of course."
 GER_gfour_reorg_and_consolidate:0 "Reorg And Consolidate"
 GER_gfour_reorg_and_consolidate_desc:0 "The Wehrmacht must learn from this mistake before the next war is fought."
 GER_gfour_we_wont_forget:0 "We Won't Forget"
 GER_gfour_we_wont_forget_desc:0 "All the experience we have gained will be preserved."
 GER_gfour_we_wont_forgive_either:0 "We Won't Forgive Either"
 GER_gfour_we_wont_forgive_either_desc:0 "All the hatred too."
 GER_gfour_and_so_we_go_on:0 "And So We Go On"
 GER_gfour_and_so_we_go_on_desc:0 "The Fuhrerdemokratie moves forward despite the loss of this war. But the future is always ahead, and we'll be back soon enough."
 ###Heer Coup Loser Tree###
 GER_gfour_military_the_only_way_this_would_end:0 "The Marshal Takes Charge"
 GER_gfour_military_the_only_way_this_would_end_desc:0 "It appears the previous government has totally failed to protect the Reich's eastern flank, and it has proven so incapable that the Wehrmacht was forced to deploy nuclear warheads to halt the [RUS.GetAdjective] advance. Once again, a weak civilian government has led the Reich to ruin. It is time for the Wehrmacht to step in and end this farce of a government."
 GER_gfour_open_the_windows:0 "Open The Windows"
 GER_gfour_open_the_windows_desc:0 "Corruption and scheming abound in the halls of Germania, and chaos rules its streets! We must clear out this political cobweb!"
 GER_gfour_clean_house:0 "Clean House"
 GER_gfour_clean_house_desc:0 "The cowards will resign, or they will meet with an unfortunate end."
 GER_gfour_guide_them:0 "Guide Them"
 GER_gfour_guide_them_desc:0 "The civilian government is clearly not fit to govern itself. The civil service will be subordinated to the Wehrmacht from now on."
 GER_gfour_no_nonsense:0 "No Nonsense"
 GER_gfour_no_nonsense_desc:0 "The political circus will be ended immediately. Media access will be restricted and the yellow press will be cracked down on. From now on there will be order in the Fatherland."
 GER_gfour_fortify_the_reich:0 "Fortify The Reich"
 GER_gfour_fortify_the_reich_desc:0 "It is very likely our enemies will attempt to push deeper yet into Germany. We must protect the Reich from all outside threats and prepare for this eventuality."
 GER_gfour_all_together_or_not_at_all:0 "All Together Or Not At All"
 GER_gfour_all_together_or_not_at_all_desc:0 "The German Race has never been defined by its love of chaos or flippant ambition, but by order and discipline. It's time these principles were returned to their preeminent position."
 GER_gfour_gear_up:0 "Gear Up"
 GER_gfour_gear_up_desc:0 "The Wehrmacht will be armed for the future wars that are almost certainly approaching."
 GER_gfour_make_ready:0 "Make Ready"
 GER_gfour_make_ready_desc:0 "The Russians will be pushed back to where they came from!"
 GER_gfour_the_new_hindenburg:0 "The New Hindenburg"
 GER_gfour_the_new_hindenburg_desc:0 "[GER.GetLeader] has stabilized the Reich and returned it to a sense of normalcy. A military statesman is what Germany needs, and that is what he has become."
 ###NSDAP Majority Tree###
 GER_gfour_nsdap_germany_saved_again:0 "Total Mandate"
 GER_gfour_nsdap_germany_saved_again_desc:0 "Fuhrer Goebbels has managed to consolidate power in the Reich to such an extent that elections have been rendered meaningless. Now firmly entrenched, Goebbels looks to bend Germany to his will and establish himself as the second coming of Adolf Hitler."
 GER_gfour_on_air_in_your_house:0 "On Air In Your House"
 GER_gfour_on_air_in_your_house_desc:0 "Goebbels, learning from his father, understands the value of mass media and its usage in propaganda. The Volk will know their leaders through the television and radio 24 hours a day."
 GER_gfour_who_would_have_thought:0 "Who Would Have Thought"
 GER_gfour_who_would_have_thought_desc:0 "The Fuhrer's political prowess has proven to be more than capable, and he has successfully ingratiated himself with much of the populace."
 GER_gfour_spring_time_revolution:0 "Spring Time Revolution"
 GER_gfour_spring_time_revolution_desc:0 "A revolution doesn't mean rolling heads and burning buildings. Fuhrer Goebbels has managed to shift German politics back towards the NSDAP through dealings and shrewd politics."
 GER_gfour_choke_the_snakes:0 "Choke The Snakes"
 GER_gfour_choke_the_snakes_desc:0 "Goebbels is determined to eliminate all viable political opposition within his NSDAP and without. From now on, the Volk will only need to vote for one party to meet their needs."
 GER_gfour_expose_their_lies:0 "Expose Their Lies"
 GER_gfour_expose_their_lies_desc:0 "The Fuhrer, through deep thought and thorough investigation, has determined that the political opposition are all liars. The position of Reich Minister of Public Enlightenment will be recreated to ensure these deceivers are stamped out."
 GER_gfour_end_their_degeneracy:0 "End Their Degeneracy"
 GER_gfour_end_their_degeneracy_desc:0 "The Fuhrer is determined to remind the members of the Reichstag who really is in charge of the Reich."
 GER_gfour_for_the_volk:0 "For The Volk"
 GER_gfour_for_the_volk_desc:0 "Gaining the favor of the true-blooded Germans is Goebbels' top priority. He is determined to raise them up even at the expense of all others."
 GER_gfour_return_to_glory:0 "Return To Glory"
 GER_gfour_return_to_glory_desc:0 "Both old and young wish for a return to the zenith of Germany's triumph following the Second World War, and the Fuhrer has promised to deliver this and more."
 GER_gfour_cult_of_goebbels:0 "Cult Of Goebbels"
 GER_gfour_cult_of_goebbels_desc:0 "The first Goebbels was promised the Fuhrership, but was assassinated by partisans under dubious circumstances. No doubt this killing was perpetrated by jealous rivals wishing to deny Hitler's legitimate successor his place. But rejoice, his son has taken his rightful office, and now Germany can continue its path to everlasting glory!"
 GER_gfour_shield_of_the_germanic_race:0 "Shield Of The Germanic Race"
 GER_gfour_shield_of_the_germanic_race_desc:0 "The Fuhrer is the protector of the Volk. His duty is of supreme importance and his will must be completely unfettered, lest interference doom the Germans forever."
 GER_gfour_he_would_be_proud:0 "He Would Be Proud"
 GER_gfour_he_would_be_proud_desc:0 "§wMy father was a great man. He was shrewd and insightful. I was still a boy when he was murdered... but I remember the kind of man he was. \n\nWhat I remember most of all was a warm afternoon a few weeks before he died. He took me aside alone and told me this: that the Fuhrer is the heart of Germany, and that I was to follow and support him wherever he went. For if the Fuhrer failed, there was no hope left for us. Indeed, I followed the Fuhrer, and I followed the next, and I saw them fail many times. But these words, my father's, I chose to ignore, and still I did not lose the vision of a grand future for Germany. \n\nI disobeyed my father's command, but saw my Fatherland rise to greatness once again. I think he could appreciate that, if he were here now. If he never had been lost.§!"
 ###NSDAP Unity Tree###
 GER_gfour_nsdap_the_strongest_regime:0 "A United Reich"
 GER_gfour_nsdap_the_strongest_regime_desc:0 "Fuhrer Goebbels has decided that it is optimal to form a national unity government while threats to the Reich remain active."
 GER_gfour_the_reich_enduring:0 "The Reich Enduring"
 GER_gfour_the_reich_enduring_desc:0 "The Reich has proven resilient to the threat of [RUS.GetNameDef]. With its triumph, the citizens of the Reich have taken to the streets in celebration! No doubt the world will witness the might of the German Reich!"
 GER_gfour_shades_of_the_swastika:0 "Shades Of The Swastika"
 GER_gfour_shades_of_the_swastika_desc:0 "Goebbels, perhaps seeing merit in the so-called Fuhrerdemokratie system, has found use for inter-party politics. Rather than reconsolidate all power into the hands of the Fuhrer, it seems the Fuhrer has decided to permit variance within his coalition."
 GER_gfour_a_game_we_win_well:0 "A Game We Win Well"
 GER_gfour_a_game_we_win_well_desc:0 "The NSDAP under Goebbels has proven to be well adapted to the politics of the Fatherland, both in the polls and in the Reichstag."
 GER_gfour_with_our_heads_held_high:0 "With Our Heads Held High"
 GER_gfour_with_our_heads_held_high_desc:0 "National pride, pride in being German, is no sin."
 GER_gfour_our_struggle:0 "Our Struggle"
 GER_gfour_our_struggle_desc:0 "Many have attempted to destroy Germany or otherwise render it a slave. All of them have indeed failed, but the German Volk cannot become conceited. Germany must remain forever vigilant, and forever prepared against foreign and domestic threats."
 GER_gfour_our_destiny:0 "Our Destiny"
 GER_gfour_our_destiny_desc:0 "Much has been said of the promised greatness of the German race, and much more will be said as we march ever forward towards it."
 GER_gfour_our_triumph:0 "Our Triumph"
 GER_gfour_our_triumph_desc:0 "The triumph over the Slavs was no accident, and neither was the triumph over all the rest of our inferiors. We've stood victorious a thousand times before, and we will stand a thousand times yet."
 GER_gfour_go_on_be_smarty:0 "Go On Be Smarty"
 GER_gfour_go_on_be_smarty_desc:0 "The future of Germany lies with the education of its young and their subsequent development. Funds will be provided to ensure our youth are taught discipline and technical knowledge to carry them and the Fatherland well into the future."
 GER_gfour_vote_for_the_nazi_party:0 "Vote For The Nazi Party"
 GER_gfour_vote_for_the_nazi_party_desc:0 "And of course, who could forget the most important part of our program: ensuring party loyalty. Simply because there is now a coalition of parties does not mean that there is any intention to abandon the NSDAP's hold over German politics."
 GER_gfour_heil_goebbels:0 "Heil Goebbels!"
 GER_gfour_heil_goebbels_desc:0 "Goebbels is keen to capitalize on the recent military victory and has initiated a media blitz, giving interviews and appearing in public almost as if he is campaigning for the next election already. Most observers speculate he fully intends to remain at the head of German politics as long as he is able."
 GER_gfour_and_heil_victory:0 "And Heil Victory!"
 GER_gfour_and_heil_victory_desc:0 "The victory over the Russians in a massive war has rejuvenated the NSDAP's prospects like few other events could. Helmut Goebbels has succeeded in becoming a politician worthy of Adolf Hitler himself. It's clear that National Socialism will always be a force in Germany, whether there are free elections or not."
 ###VUP Hapsburg Tree###
 GER_gfour_vup_the_world_restored:0 "The Empire Restored"
 GER_gfour_vup_the_world_restored_desc:0 "Fuhrer Ratzinger has succeeded in accomplishing the insurmountable and has restored the monarchy to the Reich under a constitutional regime. Ratzinger has already promised to complete the democratic ambition and to restore good will and sanity to Germany and beyond!"
 GER_gfour_the_emperor_and_the_fuhrer:0 "The Emperor And The Fuhrer"
 GER_gfour_the_emperor_and_the_fuhrer_desc:0 "Although the Emperor's role is de facto ceremonial, he fully understands this and is driven to become the national symbol our people need in these changing times."
 GER_gfour_promote_the_church:0 "Promote The Church"
 GER_gfour_promote_the_church_desc:0 "The Catholic Church has been critical to the success of the VUP and the promotion of good morals and national charity, and before that, a pressuring force against the Nazi regime. Indeed, it has always been righteous since the Holy Spirit came down and inhabited the Apostles. Let us revive the cooperation between Church and State and return to brighter days."
 GER_gfour_reich_of_equals:0 "Reich Of Equals"
 GER_gfour_reich_of_equals_desc:0 "Fuhrer Ratzinger believes strongly in the simple fact that a man being \"German\", or any other race for that matter, does not inherently mean superiority. Ratzinger believes all men are equal under God and hence should be treated as such."
 GER_gfour_remember_the_lost:0 "Remember The Lost"
 GER_gfour_remember_the_lost_desc:0 "Many have sacrificed themselves to defeat the evil that has engulfed Europe and they deserve to be beatified for their holy martyrdom."
 GER_gfour_gott_min_us:0 "Gott Min Us"
 GER_gfour_gott_min_us_desc:0 "A phrase used by the Protestant Second Reich but nonetheless true as ever. God is with the faithful and righteous!"
 GER_gfour_against_tyranny:0 "End The Tyranny of Hades"
 GER_gfour_against_tyranny_desc:0 "Death has all but consumed Germany. Success measured in the number of murders, ideology worshipping death, following the mad ravings of a dead man, the list goes on. This must end."
 GER_gfour_first_among_equals:0 "First Among Equals"
 GER_gfour_first_among_equals_desc:0 "The Fuhrer and the Emperor have argued that they are in no way superior to any other individuals, simply for the power and prestige they wield. They declare they are just as fallible as anyone else, and all citizens have a right to criticize them. The idolatry of leader worship is well and truly over."
 GER_gfour_labor_of_christ:0 "Labour Of Christ"
 GER_gfour_labor_of_christ_desc:0 "On labour of the common is all built. The mass is the church and the church is the body of Christ. They should be treated as such."
 GER_gfour_edit_the_constitution:0 "Democratize The Constitution"
 GER_gfour_edit_the_constitution_desc:0 "It is the opinion of the Fuhrer and his party that the present constitution is a flawed document born out of compromise with authoritarians. Hence it is their desire to edit the constitution to have proper checks and balances."
 GER_gfour_end_of_prussian_hegemony:0 "End Of Prussian Hegemony"
 GER_gfour_end_of_prussian_hegemony_desc:0 "Prussian authoritarianism has suffocated the whole of Germany since the Triumph at Versailles. It has only led to death and destruction and now it must end."
 GER_gfour_the_danube_promise:0 "The Danube Promise"
 GER_gfour_the_danube_promise_desc:0 "Emperor Otto has given a speech, the so called Danube Promise, by which he promises all people of Europe freedom and democracy."
 GER_gfour_triumph_of_the_first_reich:0 "Triumph Of The First Reich"
 GER_gfour_triumph_of_the_first_reich_desc:0 "By right of God, all will be made well and evil will thrive nevermore. For Germany will be holy once more, for the true Emperor has returned."
 ###VUP Republic Tree###
 GER_gfour_vup_dreams_of_a_republic:0 "A Christian Republic"
 GER_gfour_vup_dreams_of_a_republic_desc:0 "Fuhrer Ratzinger has managed to outmaneuver the enemies of democracy within and without the Reich. He can now set the Fatherland fully towards the path of principled democracy and righteous freedom."
 GER_gfour_work_with_the_vaaf:0 "Work With The VAAF"
 GER_gfour_work_with_the_vaaf_desc:0 "While secular in nature and long accused of Marxism, the VAAF is nonetheless a preferable ally for the VUP. The majority of the VAAF members also believe that the present Fuhrerdemokratie system is in dire need of reform."
 GER_gfour_work_with_dg:0 "Work With Die Grunen"
 GER_gfour_work_with_dg_desc:0 "Die Grunen has consistently supported ecological protection laws and perhaps they can be convinced to work with us for a democratic future."
 GER_gfour_coalition_for_democracy:0 "Coalition For Democracy"
 GER_gfour_coalition_for_democracy_desc:0 "Fuhrer Ratzinger has decided the petty differences between the reform focused parties must end and that a grand coalition for liberty shall be formed."
 GER_gfour_lay_down_the_framework:0 "Lay Down The Framework"
 GER_gfour_lay_down_the_framework_desc:0 "A new constitutional framework will be laid down to supplant the current flawed system."
 GER_gfour_on_matters_of_the_law:0 "On Matters Of The Law"
 GER_gfour_on_matters_of_the_law_desc:0 "The law has long been either ignored or twisted into a tool of oppression. It is time for the rule of law to return to the Reich."
 GER_gfour_fair_trials:0 "Fair Trials"
 GER_gfour_fair_trials_desc:0 "A consistent problem with the German judiciary has been political interference in supposedly unbiased trials and judicial proceedings. Fuhrer Ratzinger seeks to abolish this meddling and ensure that judgements are truly fair and just."
 GER_gfour_clean_dealings:0 "Clean Dealings"
 GER_gfour_clean_dealings_desc:0 "The Reichstag, according to Fuhrer Ratzinger, has been plagued with corruption and opaque backroom deals, preventing a truly democratic and open legislature. Hence Ratzinger and his government will seek to clear out these closed political processes and ensure government is free for all to witness."
 GER_gfour_limit_the_fuhrers_power:0 "Limit The Fuhrers Power"
 GER_gfour_limit_the_fuhrers_power_desc:0 "The position of Fuhrer holds ridiculous powers and privileges even now. In an act of selflessness, Ratzinger has initiated legislative proceedings to ensure the executive can no longer abuse its power and must take into account the needs of the people first and foremost."
 GER_gfour_new_economy_plan:0 "The New Germany Economy Plan"
 GER_gfour_new_economy_plan_desc:0 "The New Germany Economy Plan is an economic reform guideline designed to reduce unemployment and provide well paying jobs for Germany's growing population. The Reichsministry of the Economy has already begun to implement the first stages of the plan."
 GER_gfour_for_the_welfare_of_germany:0 "For The Welfare Of Germany"
 GER_gfour_for_the_welfare_of_germany_desc:0 "For the good of all mankind, we will fight."
 GER_gfour_on_matters_of_the_society:0 "On Matters Of The Society"
 GER_gfour_on_matters_of_the_society_desc:0 "German culture has long been poisoned by evil. We have only just begun to reverse the decades of Nazi dominance, but such steps are necessary if freedom is ever to flourish in these scarred lands."
 GER_gfour_end_of_malice:0 "End Of Malice"
 GER_gfour_end_of_malice_desc:0 "No longer shall hatred rule Germany but hope for a better future and a free nation under God."
 GER_gfour_protect_the_church:0 "Protect The Church"
 GER_gfour_protect_the_church_desc:0 "The Catholic Church is a vanguard of good even in the times of greatest evil. If we lose the Church, we are truly lost. The Fuhrer has personally guaranteed the true Church of Christ will not come to harm."
 GER_gfour_reconcile_the_contrasts:0 "Reconcile The Contrasts"
 GER_gfour_reconcile_the_contrasts_desc:0 "Germany has created much evil in the world but also much good. It is time to accept these fundamental contradictions of our past and move on to a brighter age where only good is done in Germany."
 GER_gfour_the_greater_german_republic:0 "The Greater German Republic"
 GER_gfour_the_greater_german_republic_desc:0 "And so it shall be glorious."
 ###RSP Tree###
 GER_gfour_rsp_eternal_sunshine:0 "Eternal Sunshine"
 GER_gfour_rsp_eternal_sunshine_desc:0 "Where else does Germany belong but under the sun prospering and growing ever strong. Fuhrer Dregger has dedicated his life to protecting the German way, and he will continue to do so until his life fades away."
 GER_gfour_the_german_century:0 "The German Century"
 GER_gfour_the_german_century_desc:0 "At the turn of the century Germany was on the ascent already towards global dominance. However, subsequent events quashed that dream and suffocated it in war and destruction. Now it is time for the ambition of the Kaisers and the Iron Chancellor to at last be fulfilled by their rightful successors, the men of the Reichsstaatspartei."
 GER_gfour_the_german_century_tt:0 "§YThe Kaiserflagge Will be Restored!§!"
 GER_gfour_walking_the_tightrope:0 "Walking The Tightrope"
 GER_gfour_walking_the_tightrope_desc:0 "The RSP is a party of contrasts, of nationalism, mercantilism, militarism, and liberalism all wrapped into one party. Fuhrer Dregger must ensure all factions of his party are appeased and unity maintained to ensure his grip on German politics is not oxidized."
 GER_gfour_a_nod_to_the_liberals:0 "A Nod To The Liberals"
 GER_gfour_a_nod_to_the_liberals_desc:0 "The liberal wing of the RSP places greater emphasis on individual liberty, due process, and free-market economics. They make up a substantial minority of the party and it is important "
 GER_gfour_primacy_of_the_individual:0 "Primacy Of The Individual"
 GER_gfour_primacy_of_the_individual_desc:0 "It is individual freedom which is most important regardless of whether the government is a "democracy" or a "dictatorship". As long as a man is free to rule himself, then all is balanced."
 GER_gfour_honor_and_discipline:0 "Honour And Discipline"
 GER_gfour_honor_and_discipline_desc:0 "In all matters the Reich should stand first and foremost. The Wehrmacht must be supported and national pride maintained across the entire population."
 GER_gfour_primacy_of_the_nation:0 "Primacy Of The Reich"
 GER_gfour_primacy_of_the_nation_desc:0 "The individual is nothing and the whole is all. We march forward as one or we die as many. There is only one choice."
 GER_gfour_cement_the_way_forward:0 "Cement The Way Forward"
 GER_gfour_cement_the_way_forward_desc:0 "Fuhrer Dregger has determined the future of his party as well as the future of the Reich as a whole."
 GER_gfour_reward_the_wehrmacht:0 "Reward The Wehrmacht"
 GER_gfour_reward_the_wehrmacht_desc:0 "The Fuhrer is keen to bring the Wehrmacht back to full strength after its stunning victory over the Russian menace. No doubt the bulwark of the Reich will need all the support available. The Wehrmacht's needs will be prioritized from now on."
 GER_gfour_guide_the_pakt:0 "Guide The Pakt"
 GER_gfour_guide_the_pakt_desc:0 "The Einheitspakt is in need of strong leadership by Germany. It is important each member maintains a minimum level of military readiness for future wars."
 GER_gfour_unleash_the_economy:0 "Unleash The Economy"
 GER_gfour_unleash_the_economy_desc:0 "The RSP has long argued that the Reich's economy has been restricted excessively by bureaucratic meddling and unnecessary regulations. They fully intend to do away with all of this and ensure the German economy is totally free from superfluous interference."
 GER_gfour_unbeatable_industry:0 "Unbeatable Industry"
 GER_gfour_unbeatable_industry_desc:0 "The Fatherland's manufacturing capability is world beating. With top of its class quality and generous mass production capacity, German factories churn out weapons and consumer goods alike that "
 GER_gfour_ready_for_anything:0 "Ready For Anything"
 GER_gfour_ready_for_anything_desc:0 "The Heer, Kriegsmarine, and Luftwaffe will always remain vigilant for a cowardly attack from our enemies. Without them there would be no Reich to speak of."
 GER_gfour_hegemon_of_the_world:0 "Hegemon Of The World"
 GER_gfour_hegemon_of_the_world_desc:0 "Germany shall never be defeated! The Earth trembles beneath the Reich. For a thousand years and beyond, Germany shall be unchallengeable, unimaginable, and unsurpassable! \n\nUntil all is over and all is dust, there will be a Reich, forever."
 ###VAAF Moderate Tree###
 GER_gfour_vaaf_the_impossible:0 "The Impossible Made Possible"
 GER_gfour_vaaf_the_impossible_desc:0 "The dream of the Reichsbanner has been at last fulfilled and democracy and freedom have returned to the people of Germany. Fuhrer Grass has proclaimed a new age of equality and unity as the VAAF's democratic proletarian ambition advances through the streets and Reichstag alike."
 GER_gfour_rectify_the_wrongs:0 "Rectify The Wrongs"
 GER_gfour_rectify_the_wrongs_desc:0 "Fuhrer Grass has made no secret that he is determined to avenge past injustices and to set an example that will not be forgotten by incoming generations."
 GER_gfour_shut_out_the_nsdap:0 "Shut Out The NSDAP"
 GER_gfour_shut_out_the_nsdap_desc:0 "The NSDAP is a zombie party determined to cling to power - attempting to salvage their past false glory. It is time to show them the curb where they belong!"
 GER_gfour_alliance_for_freedom:0 "Alliance For Freedom"
 GER_gfour_alliance_for_freedom_desc:0 "It is natural that the VAAF should seek to form a coalition with the democratically aligned parties. With some convincing, we may yet convince them to join our side in full."
 GER_gfour_total_reform:0 "Total Reform"
 GER_gfour_total_reform_desc:0 "No more half measures shall plague Germany! We know it is total democracy or not at all!"
 GER_gfour_end_the_skulldaggery:0 "End The Skulldaggery"
 GER_gfour_end_the_skulldaggery_desc:0 "The Reichstag has been plagued by corruption and intimidation. Most laws passed in the past ten years have had some measure of dirty dealings behind them. This should end at once, and Fuhrer Grass has ordered new measures to ensure the government is fair and open with its inner proceedings."
 GER_gfour_a_shining_example:0 "A Shining Example"
 GER_gfour_a_shining_example_desc:0 "We shall provide a model the rest of Europe can follow. For freedom and brotherhood!"
 GER_gfour_next_century_plan:0 "Next Century Plan"
 GER_gfour_next_century_plan_desc:0 "A new economic plan dreamed up by the Reichsministry of Economics, this will be the guideline that will supercharge Germany into an age of technology and wonder for all people!"
 GER_gfour_to_the_workers_paradise:0 "To The Workers Paradise"
 GER_gfour_to_the_workers_paradise_desc:0 "Even the poor and destitute will be taken care of. Health and comfort shouldn't be exclusive to those who have an excess of Reichsmarks."
 GER_gfour_united_in_friendship_and_labor:0 "United In Friendship And Labor"
 GER_gfour_united_in_friendship_and_labor_desc:0 "Whether a man should be born Slavic, Jewish, or Gypsy - he is no lesser than a man born German. The peoples of Europe must unite in liberty and never again in tyranny."
 GER_gfour_integrate_the_fringe:0 "Integrate The Fringe"
 GER_gfour_integrate_the_fringe_desc:0 "The VAAF has been making significant inroads in minority populations and has seen increased electoral victories in those constituencies. It is possible the party seeks to co-opt the LER and become the main party of the non-German population."
 GER_gfour_a_legacy_reborn:0 "A Legacy Reborn"
 GER_gfour_a_legacy_reborn_desc:0 "Cursed from the beginning, the SPD once tried to guide the Weimar Republic into prosperity and democracy but in the end was crushed by the NSDAP and their allies and backstabbed by the communists in the KPD. Banned and driven underground, the members of the SPD eventually formed into the Reichsbanner, then succeeded by the VAAF. Now the vision of a democratic socialist Germany can at last be realized, and the sins of the Nazis forever buried."
 GER_gfour_leave_the_drum_behind:0 "Leave The Drum Behind"
 GER_gfour_leave_the_drum_behind_desc:0 "Today I know that all things are watching, that nothing goes unseen, that even wallpaper has a better memory than human beings."
 ###VAAF Radical Tree###
 GER_gfour_vaaf_our_reich:0 "The Red Banner"
 GER_gfour_vaaf_our_reich_desc:0 "Commence operation."
 GER_gfour_nation_of_lies:0 "Nation Of Lies"
 GER_gfour_nation_of_lies_desc:0 "Propaganda persistence acceptable. Volume beyond projected minimum. Progress amenable."
 GER_gfour_eyes_everywhere:0 "Eyes Everywhere"
 GER_gfour_eyes_everywhere_desc:0 "Informant recruitment rates: +35%. Not enough. Offer greater rewards. Surveillance gaps unacceptable."
 GER_gfour_stoke_protelarian_pride:0 "Stoke Protelarian Pride"
 GER_gfour_stoke_protelarian_pride_desc:0 "Their enthusiasm will serve the nation and the party well."
 GER_gfour_why_do_you_care:0 "Why Do You Care?"
 GER_gfour_why_do_you_care_desc:0 "Compliant population required. General apathy towards politics is ideal. Lowers scrutiny. Additional welfare increases will also ingratiate government with population."
 GER_gfour_marrionettes_and_useful_idiots:0 "Marrionettes And Useful Idiots"
 GER_gfour_marrionettes_and_useful_idiots_desc:0 "Certain malleable individuals will be promoted and certain viewpoints pushed in propaganda. Conformity is necessity."
 GER_gfour_begin_the_adjustment:0 "Begin The Adjustment"
 GER_gfour_begin_the_adjustment_desc:0 "Begin purge."
 GER_gfour_kill_the_nsdap:0 "Kill The NSDAP"
 GER_gfour_kill_the_nsdap_desc:0 "The ultimate enemy will be removed immediately."
 GER_gfour_vaaf_cadres:0 "VAAF Cadres"
 GER_gfour_vaaf_cadres_desc:0 "Internal loyalty will be assured. Party vanguard to be established immediately. Reliable individuals to be promoted."
 GER_gfour_allow_satellite_parties:0 "Allow Satellite Parties"
 GER_gfour_allow_satellite_parties_desc:0 "Simulation of choice."
 GER_gfour_formalize_the_councils:0 "Formalize The Councils"
 GER_gfour_formalize_the_councils_desc:0 "Spartakus redeemed."
 GER_gfour_champions_of_the_people:0 "Champions Of The People"
 GER_gfour_champions_of_the_people_desc:0 "Heil Wolf."
 GER_gfour_start_the_long_road:0 "Start The Long Road"
 GER_gfour_start_the_long_road_desc:0 "The revolution has not yet begun."
 ###Die Grunen Victory Tree###
 GER_gfour_dg_the_earth_made_clean:0 "The Earth Made Clean"
 GER_gfour_dg_the_earth_made_clean_desc:0 "The Fuhrer has driven the subhumans from the Fatherland and prevented them from infesting these fertile lands and burrowing into our nation's roots. But now is not the time for rest. The parasites still remain attached to our veins, and we must extricate them all and leave not a single interloper behind!"
 GER_gfour_dg_spirits_of_nature:0 "Spirits Of Nature"
 GER_gfour_dg_spirits_of_nature_desc:0 "What motivates a man? What drives him? It is the paracausal drive of his race that defines him, of course. The Germans are greatest in this spirit. We cannot limit ourselves."
 GER_gfour_dg_gods_of_the_land:0 "Gods Of The Land"
 GER_gfour_dg_gods_of_the_land_desc:0 "The German man is like deities of ancient times, free to act and not constrained by restrictive morality and useless ethics. He concerns himself only with his kin, and his land."
 GER_gfour_odins_land:0 "Odins Domain"
 GER_gfour_odins_land_desc:0 "The gods of old were strong and encouraged the Germanic race to be stronger still! Why abandon these noble patrons for weakness and false salvation? The Germanic race is born for struggle and victory! To deny this is to deny ourselves, our very spirit of being!"
 GER_gfour_absorb_the_blood:0 "Absorb The Blood"
 GER_gfour_absorb_the_blood_desc:0 "There are those who are close to the truth but have yet to reach it. Let us enlighten them and ensure they know who is in charge."
 GER_gfour_destroy_the_puppet_churches:0 "Destroy The Puppet Churches"
 GER_gfour_destroy_the_puppet_churches_desc:0 "Servants of a false and weak god, the poison they sow in the master race has weakened the overmen for centuries. These Juden following degenerates must be expunged from the German Reich - forever this time."
 GER_gfour_a_natural_life:0 "A Natural Life"
 GER_gfour_a_natural_life_desc:0 "A true Aryan does not need industrial comforts, especially at the cost of the Reich's ecosystem. Fuhrer Springmann has ordered that the senseless expansion of cities cease and the end of dragging out the meager life of the weak."
 GER_gfour_victory_to_the_strong:0 "Victory To The Strong"
 GER_gfour_victory_to_the_strong_desc:0 "Evolution necessitates weeding out of undesirable traits and preservation of those that are advantageous. Those that are weak have attempted to end this process. We shall reverse this delusion and restore the natural order."
 GER_gfour_empty_the_cities:0 "Empty The Cities"
 GER_gfour_empty_the_cities_desc:0 "Centers of filth and the greatest desecration of nature, the cities are altars of decadence and pollution in equal measure. These vampires of the spirit must be cut down to size immediately. The remaining urban population will be evacuated to healthier localities at once!"
 GER_gfour_restore_the_earth:0 "Restore The Earth"
 GER_gfour_restore_the_earth_desc:0 "Germany's beauty has been tarnished by careless mining and construction projects. We will shut these horrible industries down and ensure the Reich will be returned to its natural glory."
 GER_gfour_the_earth_force:0 "The Earth Force"
 GER_gfour_the_earth_force_desc:0 "The Wehrmacht will be reconstructed for the defence of the Reich as well as ecological preservation against encroaching untermenschen the world over."
 GER_gfour_vanguard_of_the_ecosystem:0 "Vanguard Of The Ecosystem"
 GER_gfour_vanguard_of_the_ecosystem_desc:0 "We will fight for the Fatherland and the Earth until we breathe our last!"
 GER_gfour_my_home:0 "My Home"
 GER_gfour_my_home_desc:0 "My Fatherland. \n\nMy origin. \n\nMy nation. \n\nMy Reich. \n\nMy Earth. \n\nFor this we fight. For this we preserve. For this will never end."
 ###Die Grunen Breakdown (DAP Coup) Tree###
 GER_gfour_dg_cw_the_parasites_erupt:0 "Beyond The Veil"
 GER_gfour_dg_cw_the_parasites_erupt_desc:0 "Horrific happenings have come upon us! The untermenschen have risen up intent on tearing what remains of the Fatherland apart! We must stop them at once!"
 GER_gfour_for_the_master_race:0 "For The Master Race"
 GER_gfour_for_the_master_race_desc:0 "DO IT FOR THE GERMANIC UBERMENSCHEN!"
 GER_gfour_subhuman_annihilation:0 "Subhuman Annihilation"
 GER_gfour_subhuman_annihilation_desc:0 "§RKILL THEM ALL FAST. NOW NOW NOW NOW NOW NOW NO-§!"
 GER_gfour_beg_burgundy:0 "Beg Burgundy"
 GER_gfour_beg_burgundy_desc:0 "Burgundy is pure! Germany will be pure again soon! Surely they will help us achieve our goals. Surely they must help their allies."
 GER_gfour_we_wont_fail_again:0 "We Wont Fail Again"
 GER_gfour_we_wont_fail_again_desc:0 "And we'll come back and kill the Russians too! Then the Americans! Then the Japanese and then all of the rest and then-"
 GER_gfour_grab_everything:0 "Grab Everything"
 GER_gfour_grab_everything_desc:0 "All of the guns. Empty the stockpiles the armories the factories, we need all our men armed or it's all over!"
 GER_gfour_fight_damn_it:0 "Fight Damn It"
 GER_gfour_fight_damn_it_desc:0 "Don't you care about Germany? What about your family? If we lose they will all die and what will you have left? \n\nFight Fight Fight Fight Fi"
 GER_gfour_remember_the_true_enemy:0 "Remember The True Enemy"
 GER_gfour_remember_the_true_enemy_desc:0 "They're everywhere. We should have hunted them all down to the ends of the Earth. All the subhumans the worst of the worst should we not have killed them all? Why didn't we? Better to let the world burn. But wouldn't that mean Germany would burn as well? What would the Fuhrer say? Where is he now?"
